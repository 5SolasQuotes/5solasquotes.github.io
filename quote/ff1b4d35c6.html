</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ac96e89b9" data-kw="">
<blockquote><p>‘A sin which is not unto death’… For he denies that sins are to death, not only those by which the saints daily offend, but even when it happens that God’s wrath is grievously provoked by them. For as long as room for pardon is left, death does not wholly retain its dominion… What, then, is the meaning of the apostle?… There is a sin unto death; I have already said that the sin to which there is no hope of pardon left, is thus called. But it may be asked, what this is; for it must be very atrocious, when God thus so severely punishes it. It may be gathered from the context, that it is not, as they say, a partial fall, or a transgression of a single commandment, but apostasy, by which men wholly alienate themselves from God. For the apostle afterwards adds that the children of God do not sin, that is, that they do not forsake God, and wholly surrender themselves to Satan, to be his slaves. Such a defection, it is no wonder that it is mortal; for God never thus deprives his own people of the grace of the Spirit; but they ever retain some spark of true religion. They must then be reprobate and given up to destruction, who thus fall away so as to have no fear of God. Were any one to ask, whether the door of salvation is closed against their repentance; the answer is obvious, that as they are given up to a reprobate mind, and are destitute of the Holy Spirit, they cannot do anything else, than with obstinate minds become worse and worse and add sins to sins. Moreover, as the sin and blasphemy against the Spirit ever brings with it a defection of this kind, there is no doubt but that it is here pointed out. But it may be asked again, by what evidences can we know that a man’s fall is fatal; for except the knowledge of this was certain, in vain would the apostle have made this exception, that they were not to pray for a sin of this kind. It is then right to determine sometimes, whether the fallen is without hope, or whether there is still a place for a remedy. This, indeed, is what I allow, and what is evident beyond dispute from this passage; but as this very seldom happens, and as God sets before us the infinite riches of his grace, and bids us to be merciful according to his own example, we ought not rashly to conclude that any one has brought on himself the judgment of eternal death; on the contrary, love should dispose us to hope well. But if the impiety of some appear to us not otherwise than hopeless, as though the Lord pointed it out by the finger, we ought not to contend with the just judgment of God, or seek to be more merciful than He is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 John, ch. 5, vv. 16-18</cite></span></figcaption>

</figure><figure class="quote" id="q-ca7db8ecf7" data-kw="">
<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: 1. Yea, partly because we know not the secret purposes of God’s grace. Christ in the light of his divinity, knew the elect and the reprobate, but we know not, therefore we are to pray for them that persecute, Mt. 5:44. Paul once breathed out threatenings against the Church; Christ received gifts for the rebellious; partly because many wicked men are considerable in their station, therefore, at least, we pray for temporal blessings for them, though we have little hopes that ever they shall be gained to the knowledge of the truth. Thus we are to pray for wicked rulers, for the conservation of human society, they may serve as a thorn hedge about a garden of roses. Thus it is said, Ezra 6:10, that in the Temple they should pray for the life of the king and of his sons, meaning the King of Babylon, Darius, at least for temporal favors. 2. We have not such encouragement to pray for them as for the saints: For the saints we pray out of the unity of the Spirit, for wicked men, out of common charity: for the saints we pray out of a delight in their graces; for wicked men, out of a loose possible hope. Heb. 13:18, ‘Pray for us, for we trust that we have a good conscience in all things, willing to live honestly.’ These should have the greatest share of our prayers; we have the more encouragements and hopes of them, which should be an engagement to us to pray for them. 3. Conditionally we may pray against the obstinate and them that sin of malicious wickedness. There are many imprecations in Ps. 109 which are not to serve our private revenge, but by us to be conceived conditionally: Those curses are uttered against Judas in a prophetical spirit, and therefore not to be drawn into example, to justify any heats of revenge and private passion. 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin. 4. We feel sometimes a restraint upon our prayers. God by oracle forbade the prophet to pray for the people; Jer. 7:16: ‘Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to Me, for I will not hear thee.’ When He was resolved to put his wrath in execution, He would not have his people’s prayers lost; and still the same Spirit that stirs up to prayer searches out the deep counsels of God. So that there is a kind of prophetical light in prayers; God [at times] suspends the servency and actual assistance, by which we are carried on at other times. I would not justify every private passionate conceit, but yet we must look upon the Spirit of God as the interpreter of God’s counsel, and that He will not stir up prayers to no purpose. Yea, sometimes we feel that after much striving, we have no heart to pray for them, which is a very great mark of God’s displeasure upon any person, when God’s people, yea, even after much struggling with themselves, have no heart to pray for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons Preached… (d. 1677; London: Astwood, 1684), Sermons on John 17, Sermon 12, on Jn. 17:9</cite>, p. 106-7</span></figcaption>

e+our+private+revenge%2C+but+by+us+to+be+conceived+conditionally%3A+Those+curses+are+uttered+against+Judas+in+a+prophetical+spirit%2C+and+therefore+not+to+be+drawn+into+example%2C+to+justify+any+heats+of+revenge+and+private+passion.+1+Jn.+5%3A16%3A+%E2%80%98If+any+man+see+his+brother+sin+a+sin+which+is+not+unto+death%2C+he+shall+ask%2C+and+he+shall+give+him+life+for+them+that+sin+not+unto+death.+There+is+a+sin+unto+death%3B+I+do+not+say+that+he+shall+pray+for+it.%E2%80%99+It+is+a+tempting+of+God+to+intercede+for+that+sin%2C+seeing+He+has+declared+his+will%3B+the+irremissible+sin%2C+is+that+sin%2C+though+it+be+hard+to+be+found+out.+Therefore+it+is+good+to+keep+to+the+conditional+form+when+a+man%2C+after+the+profession+of+religion%2C+falls+to+an+utter+revolt+and+deadly+hatred+of+it%3A+it+is+a+shrewd+presumption+they+have+committed+that+sin.+4.+We+feel+sometimes+a+restraint+upon+our+prayers.+God+by+oracle+forbade+the+prophet+to+pray+for+the+people%3B+Jer.+7%3A16%3A+%E2%80%98Therefore+pray+not+thou+for+this+people%2C+neither+lift+up+cry+nor+prayer+for+them%2C+neither+make+intercession+to+Me%2C+for+I+will+not+hear+thee.%E2%80%99+When+He+was+resolved+to+put+his+wrath+in+execution%2C+He+would+not+have+his+people%E2%80%99s+prayers+lost%3B+and+still+the+same+Spirit+that+stirs+up+to+prayer+searches+out+the+deep+counsels+of+God.+So+that+there+is+a+kind+of+prophetical+light+in+prayers%3B+God+%5Bat+times%5D+suspends+the+servency+and+actual+assistance%2C+by+which+we+are+carried+on+at+other+times.+I+would+not+justify+every+private+passionate+conceit%2C+but+yet+we+must+look+upon+the+Spirit+of+God+as+the+interpreter+of+God%E2%80%99s+counsel%2C+and+that+He+will+not+stir+up+prayers+to+no+purpose.+Yea%2C+sometimes+we+feel+that+after+much+striving%2C+we+have+no+heart+to+pray+for+them%2C+which+is+a+very+great+mark+of+God%E2%80%99s+displeasure+upon+any+person%2C+when+God%E2%80%99s+people%2C+yea%2C+even+after+much+struggling+with+themselves%2C+have+no+heart+to+pray+for+him.%E2%80%9D%0A%0A%

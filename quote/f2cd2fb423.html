<main class="wrap"><figure class="quote" id="q-f2cd2fb423" data-kw="">
<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Naphtali Press) vol. 3, p. 198</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-941ab42d00" data-kw="">
<blockquote><p>Mr. Wotton in his papers which he dispersed in this city, and which he acknowledged to be his own when I [Walker] brought them to his face before Mr. Gataker and eight other grave ministers, does deny the imputation of the whole obedience of Christ, to the Law of God; both active and passive, both jointly and severally. He affirms that there is no end or use whatsoever of the imputation of Christ his righteousness for justification. He renounces the law in whole and part, performed by ourselves, or any other in our stead for our justification… he sets up faith, even the act of believing for righteousness, affirms that it is said to be imputed in a proper sense without a trope, and serves for all purposes in our justification under the Gospel, as perfect righteousness of works performed to the whole law did for man’s justification in the first covenant. He denies the punishment of our sins in Christ, and the satisfaction which in Him our head &amp; surety was made to God’s justice for purchase of our pardon… These and such like speeches I condemned for Socinian heresy and blasphemy, as Beza, Paraeus and Lubertus had done before me, and for this Mr. Gataker did deride me, when I gave in my charge against Mr. Wotton 27 years ago, and now [Gataker] blames it in me as falsehood and dishonesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton</cite>, A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton (1642) 36 pp., pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

Mr.+Thomas+Gataker+in+his+Defense+of+Mr.+Wotton+%281642%29+36+pp.%2C+pp.+1-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F941ab42d00.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/941ab42d00.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/westminster-divines-on-justification/#:~:text=Mr.%20Wotton%20in%20his%20papers%20which,in%20me%20as%20falsehood%20and%20dishonesty&amp;text=Mr.%20Wotton%20in%20his%20papers%20which%20he%20dispersed&amp;text=blames%20it%20in%20me%20as%20falsehood%20and%20dishonesty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-68f750ca2d" data-kw="">
<blockquote><p>If they object that place of James, ‘We are not justified by faith, but by works’: I answer that there is a double justification, there is a justification of the person: so was Abraham justified by faith, as Paul expresses it, Rom. 4. But then there is a second justification, a justification of the faith that Abraham had: he justified his faith by his works; he showed that he had not a dead faith, a liveless faith, a faith without works, but that he had a lively effectual faith: for he added works to his faith, his works wrought together with his faith. So that, if the question be, Whether Abraham was an hypocrite? his works justified him that he was none. If the question be, Whether Abraham was a sinner? his faith justifies him, and shows that he was made righteous through faith. So, there is a justification of the person, and a justification of the faith of the person: as when a man is said to justify such an action or such a cause, the meaning is not that he will make that just which was unjust before, but he will make it appear to be just; so Abraham was declared to have a justifying faith by that power and efficacy it wrought in him, in offering up his son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Breastplate of Faith &amp; Love</cite>, … (London: for Bourne, 1630), 2nd Sermon, ‘Of Effectual Faith’, p. 68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-63e5ff40c5" data-kw="">
<blockquote><p>Hence we see, that the apostle leaves nothing to men in procuring salvation. In these three phrases, -- not of yourselves, -- it is the gift of God, -- not of works, -- he embraces the substance of his long argument in the Epistles to the Romans and to the Galatians, that righteousness comes to us from the mercy of God alone, -- is offered to us in Christ by the gospel, -- and is received by faith alone, without the merit of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, Ephesians 2:9</span></figcaption>

</figure><figure class="quote" id="q-f9e1d8e3fb" data-kw="">
<blockquote><p>First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, Ephesians 2:8</span></figcaption>

<blockquote><p>§XII. For in the State of Grace, restituted or of inchoate reparation, the man who is called is excited and vivified from the lethargy and death of sin by prevenient and preparing grace, so that he may be able to read, hear, understand and meditate on the Word of God; by which means the intellect is illuminated and the will is impelled, and is gradually prepared and disposed, so that he can obey God calling through the Word, believe, and convert himself [Acts 2:40]. Eph. 2:5: “God, even when we were dead in sins, hath quickened us together in Christ… And hath raised us up together, and made us sit together in the heavenly places, in Christ Jesus.” ch. 5:8: “For you were heretofore darkness; but now, light in the Lord. Walk then as children of the light.” v. 14: “Wherefore he saith: Arise, thou that sleepest, and arise from the dead: and Christ shall enlighten thee.” Tit. 2:11-12: “For the grace of God our Saviour hath appeared to all men; Instructing us, that, denying ungodliness and worldly desires, we should live soberly, and justly, and godly in this world.” Rev. 3:20: “Behold, I stand at the gate, and knock. If any man shall hear my voice, and open to me the door, I will come in to him, and will sup with him, and he with me.</p></blockquote>

<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) Latin Whether sufficient grace for conversion and avoiding sins is given to all men? 291-97 … Necessity of grace for fallen nature for salvific good and true piety: Roman doctrine 847 . pt. 2, Protestants’ doctrine compared with Roman 859 Whether man, in a state of sin, can prepare and dispose himself for grace by his natural powers alone 867 . pt. 2, Roman school 879 . pt. 3, Protestant and Roman opinions are compared 891-906 Le Blanc (1614-1675) was a reformed professor of theology at Sedan. . 1700’s de Moor, Bernard – Continuous Commentary on John Marck’s Didactic-Elenctic Compendium of Christian Theology Buy (1761-1772), ch. 2, Scripture Theological Disputation on Eph. 5:14, “Wherefore he saith, Awake thou that sleepest, and arise from the dead, and Christ shall give thee light.</p></blockquote>

<blockquote><p>And lastly the Scripture speaks in a twofold manner of our conversion: [1] Sometimes the Lord attributes to us, and requires of us the whole work thereof, as if it depended altogether on our will; ‘If ye be willing and obedient, ye shall eat the good things of the land.’ (Isa. 1:19) ‘Turn ye unto Me, and I will turn unto you:’ (Zech. 1:3) ‘Make you a new heart, and a new spirit: for why will ye die, O house of Israel:’ (Eze. 18:31) ‘Repent ye and believe the Gospel’ (Mk. 1:15; Why God requires and attributes conversion to man: On Grace &amp; Free Will, ch. 6; Of Corruption &amp; Grace, ch. 3) not, as if it were [Greek] or in our power to do these things. For how can they spiritually move who are dead in sins? But the Scripture thus speaks: 1. To teach us that we neither will, nor can do anything of ourselves: but are bound to ask it of God. And 2. Because God by such exhortations, threatenings, promises and conditions does please effectually to raise up our desire and by his Spirit enables us to perform his will. Augustine says well: ‘God commands us those things which we cannot do, that we may know what we ought to ask of Him.’ And in another place: ‘O man observe from the commandment what thou shouldst have: by reproofs, what thou art deprived of by thy own default, and in prayer acknowledge whence to receive what thou desirest to have.’ [2] And again other [passages] where the Lord ascribes the whole work of our conversion unto Himself alone and commands us so to acknowledge it. As: ‘I will make you to walk in my ways, and I will take the stony heart out of your flesh, and I will give you an heart of flesh.’ (Eze. 36:26) ‘Turn thou me, and I shall be turned.’ (Jer. 31:18) ‘No man can come unto me, except the Father draw him.’ (Jn. 6:44) ‘Without Me ye can do nothing.’ (Jn. 15:6) See the like: Eph. 2:1; 1 Cor. 2:13-14; Rom. 8:7; 2 Cor. 3:5; Lk. 24:45; Acts 16:14; 11:18. All which testimonies do plainly evince that the grace of conversion is not indifferent or universal: but as our sufficient [help], so also our effectual help does wholly depend upon the general and particular pleasure and motion of God. Which difference of the Scriptures, and the cause thereof, because the Pelagians and their adherents have not observed: But ••ther abused the former places, as if they were absolutely spoken: and corrupted the latter by their equivocations about grace, calling it (as they also do to this day) a suasory, indifferent and resistible grace, limited by the will of man either to that which is good or evil: they have most falsely wrested the same, for to establish their idol of free-will. Now herewithal they must of necessity embrace all other Pelagian heresies and impieties also, as namely: 1. That faith and good works foreseen, do go before God’s predestination: and so are not from God’s predestinating of them: whereupon it will follow that predestination, being an effect of causes and conditions foreseen, is not to be called a predestination, but rather a post-destination. 2. That faith going before predestination must also be before vocation: seeing we are elected before we are called: And by this ground not God, but man should be the author of faith: contrary to that of Rom. 9:16, ‘It is not of him that willeth, or of him that runneth, but of God that sheweth mercy.’ 3. That the will either co-working, or not co-working with foregoing grace does make men to differ, which is contrary to 1 Cor. 4:7, ‘Who maketh thee to differ from another? And what hast thou that thou didst not receive?’ And so the increase of faith and grace should be given according to the merit of congruity. 4. That man’s will is not corrupted or made worse by the Fall of Adam: and so either there should be no original sin at all, or else but in name only: whereas, ‘The heart of man is deceitful above all things.’ 5. That the Law is not above man’s strength, but that he may absolutely fulfill the same: and be altogether free from sin in this life, if he would: wheras the Scriptures on the contrary teach that there is not any one just man in the earth which does good and sins not. All which errors establish merits of condignity, overthrow the grace and merits of Christ, and so consequently the truth of Christian religion, being nothing indeed, but in name only: and in a word confirms pagan divinity and philosophy. For in all these positions, the names only excepted, there is nothing but what philosophy itself teaches, both concerning the beginnings and reward of virtue: which to philosophers is faith, righteousness and works.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And lastly the Scripture speaks in a twofold manner of our conversion: [1] Sometimes the Lord attributes to us, and requires of us the whole work thereof, as if it depended altogether on our will; ‘If ye be willing and obedient, ye shall eat the good things of the land.’ (Isa. 1:19) ‘Turn ye unto Me, and I will turn unto you:’ (Zech. 1:3) ‘Make you a new heart, and a new spirit: for why will ye die, O house of Israel:’ (Eze. 18:31) ‘Repent ye and believe the Gospel’ (Mk. 1:15; Why God requires and attributes conversion to man: On Grace &amp; Free Will, ch. 6; Of Corruption &amp; Grace, ch. 3) not, as if it were [Greek] or in our power to do these things. For how can they spiritually move who are dead in sins? But the Scripture thus speaks: 1. To teach us that we neither will, nor can do anything of ourselves: but are bound to ask it of God. And 2. Because God by such exhortations, threatenings, promises and conditions does please effectually to raise up our desire and by his Spirit enables us to perform his will. Augustine says well: ‘God commands us those things which we cannot do, that we may know what we ought to ask of Him.’ And in another place: ‘O man observe from the commandment what thou shouldst have: by reproofs, what thou art deprived of by thy own default, and in prayer acknowledge whence to receive what thou desirest to have.’ [2] And again other [passages] where the Lord ascribes the whole work of our conversion unto Himself alone and commands us so to acknowledge it. As: ‘I will make you to walk in my ways, and I will take the stony heart out of your flesh, and I will give you an heart of flesh.’ (Eze. 36:26) ‘Turn thou me, and I shall be turned.’ (Jer. 31:18) ‘No man can come unto me, except the Father draw him.’ (Jn. 6:44) ‘Without Me ye can do nothing.’ (Jn. 15:6) See the like: Eph. 2:1; 1 Cor. 2:13-14; Rom. 8:7; 2 Cor. 3:5; Lk. 24:45; Acts 16:14; 11:18. All which testimonies do plainly evince that the grace of conversion is not indifferent or universal: but as our sufficient [help], so also our effectual help does wholly depend upon the general and particular pleasure and motion of God. Which difference of the Scriptures, and the cause thereof, because the Pelagians and their adherents have not observed: But ••ther abused the former places, as if they were absolutely spoken: and corrupted the latter by their equivocations about grace, calling it (as they also do to this day) a suasory, indifferent and resistible grace, limited by the will of man either to that which is good or evil: they have most falsely wrested the same, for to establish their idol of free-will. Now herewithal they must of necessity embrace all other Pelagian heresies and impieties also, as namely: 1. That faith and good works foreseen, do go before God’s predestination: and so are not from God’s predestinating of them: whereupon it will follow that predestination, being an effect of causes and conditions foreseen, is not to be called a predestination, but rather a post-destination. 2. That faith going before predestination must also be before vocation: seeing we are elected before we are called: And by this ground not God, but man should be the author of faith: contrary to that of Rom. 9:16, ‘It is not of him that willeth, or of him that runneth, but of God that sheweth mercy.’ 3. That the will either co-working, or not co-working with foregoing grace does make men to differ, which is contrary to 1 Cor. 4:7, ‘Who maketh thee to differ from another? And what hast thou that thou didst not receive?’ And so the increase of faith and grace should be given according to the merit of congruity. 4. That man’s will is not corrupted or made worse by the Fall of Adam: and so either there should be no original sin at all, or else but in name only: whereas, ‘The heart of man is deceitful above all things.’ 5. That the Law is not above man’s strength, but that he may absolutely fulfill the same: and be altogether free from sin in this life, if he would: wheras the Scriptures on the contrary teach that there is not any one just man in the earth which does good and sins not. All which errors establish merits of condignity, overthrow the grace and merits of Christ, and so consequently the truth of Christian religion, being nothing indeed, but in name only: and in a word confirms pagan divinity and philosophy. For in all these positions, the names only excepted, there is nothing but what philosophy itself teaches, both concerning the beginnings and reward of virtue: which to philosophers is faith, righteousness and works.”

— David Pareus, A Commentary upon the Divine Revelation of the Apostle and Evangelist John (d. 1622; Amsterdam, 1644), ch. 3, pp. 82-83 on Rev. 3:20, “If any man… open the door…”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+lastly+the+Scripture+speaks+in+a+twofold+manner+of+our+conversion%3A+%5B1%5D+Sometimes+the+Lord+attributes+to+us%2C+and+requires+of+us+the+whole+work+thereof%2C+as+if+it+depended+altogether+on+our+will%3B+%E2%80%98If+ye+be+willing+and+obedient%2C+ye+shall+eat+the+good+things+of+the+land.%E2%80%99+%28Isa.+1%3A19%29+%E2%80%98Turn+ye+unto+Me%2C+and+I+will+turn+unto+you%3A%E2%80%99+%28Zech.+1%3A3%29+%E2%80%98Make+you+a+new+heart%2C+and+a+new+spirit%3A+for+why+will+ye+die%2C+O+house+of+Israel%3A%E2%80%99+%28Eze.+18%3A31%29+%E2%80%98Repent+ye+and+believe+the+Gospel%E2%80%99+%28Mk.+1%3A15%3B+Why+God+requires+and+attributes+conversion+to+man%3A+On+Grace+%26+Free+Will%2C+ch.+6%3B+Of+Corruption+%26+Grace%2C+ch.+3%29+not%2C+as+if+it+were+%5BGreek%5D+or+in+our+power+to+do+these+things.+For+how+can+they+spiritually+move+who+are+dead+in+sins%3F+But+the+Scripture+thus+speaks%3A+1.+To+teach+us+that+we+neither+will%2C+nor+can+do+anything+of+ourselves%3A+but+are+bound+to+ask+it+of+God.+And+2.+Because+God+by+such+exhortations%2C+threatenings%2C+promises+and+conditions+does+please+effectually+to+raise+up+our+desire+and+by+his+Spirit+enables+us+to+perform+his+will.+Augustine+says+well%3A+%E2%80%98God+commands+us+those+things+which+we+cannot+do%2C+that+we+may+know+what+we+ought+to+ask+of+Him.%E2%80%99+And+in+another+place%3A+%E2%80%98O+man+observe+from+the+commandment+what+thou+shouldst+have%3A+by+reproofs%2C+what+thou+art+deprived+of+by+thy+own+default%2C+and+in+prayer+acknowledge+whence+to+receive+what+thou+desirest+to+have.%E2%80%99+%5B2%5D+And+again+other+%5Bpassages%5D+where+the+Lord+ascribes+the+whole+work+of+our+conversion+unto+Himself+alone+and+commands+us+so+to+acknowledge+it.+As%3A+%E2%80%98I+will+make+you+to+walk+in+my+ways%2C+and+I+will+take+the+stony+heart+out+of+your+flesh%2C+and+I+will+give+you+an+heart+of+flesh.%E2%80%99+%28Eze.+36%3A26%29+%E2%80%98Turn+thou+me%2C+and+I+shall+be+turned.%E2%80%99+%28Jer.+31%3A18%29+%E2%80%98No+man+can+come+unto+me%2C+except+the+Father+draw+him.%E2%80%99+%28Jn.+6%3A44%29+%E2%80%98Without+Me+ye+can+do+nothing.%E2%80%99+%28Jn.+15%3A6%29+See+the+like%3A+Eph.+2%3A1%3B+1+Cor.+2%3A13-14%3B+Rom.+8%3A7%3B+2+Cor.+3%3A5%3B+Lk.+24%3A45%3B+Acts+16%3A14%3B+11%3A18.+All+which+testimonies+do+plainly+evince+that+the+grace+of+conversion+is+not+indifferent+or+universal%3A+but+as+our+sufficient+%5Bhelp%5D%2C+so+also+our+effectual+help+does+wholly+depend+upon+the+general+and+particular+pleasure+and+motion+of+God.+Which+difference+of+the+Scriptures%2C+and+the+cause+thereof%2C+because+the+Pelagians+and+their+adherents+have+not+observed%3A+But+%E2%80%A2%E2%80%A2ther+abused+the+former+places%2C+as+if+they+were+absolutely+spoken%3A+and+corrupted+the+latter+by+their+equivocations+about+grace%2C+calling+it+%28as+they+also+do+to+this+day%29+a+suasory%2C+indifferent+and+resistible+grace%2C+limited+by+the+will+of+man+either+to+that+which+is+good+or+evil%3A+they+have+most+falsely+wrested+the+same%2C+for+to+establish+their+idol+of+free-will.+Now+herewithal+they+must+of+necessity+embrace+all+other+Pelagian+heresies+and+impieties+also%2C+as+namely%3A+1.+That+faith+and+good+works+foreseen%2C+do+go+before+God%E2%80%99s+predestination%3A+and+so+are+not+from+God%E2%80%99s+predestinating+of+them%3A+whereupon+it+will+follow+that+predestination%2C+being+an+effect+of+causes+and+conditions+foreseen%2C+is+not+to+be+called+a+predestination%2C+but+rather+a+post-destination.+2.+That+faith+going+before+predestination+must+also+be+before+vocation%3A+seeing+we+are+elected+before+we+are+called%3A+And+by+this+ground+not+God%2C+but+man+should+be+the+author+of+faith%3A+contrary+to+that+of+Rom.+9%3A16%2C+%E2%80%98It+is+not+of+him+that+willeth%2C+or+of+him+that+runneth%2C+but+of+God+that+sheweth+mercy.%E2%80%99+3.+That+the+will+either+co-working%2C+or+not+co-working+with+foregoing+grace+does+make+men+to+differ%2C+which+is+contrary+to+1+Cor.+4%3A7%2C+%E2%80%98Who+maketh+thee+to+differ+from+another%3F+And+what+hast+thou+that+thou+didst+not+receive%3F%E2%80%99+And+so+the+increase+of+faith+and+grace+should+be+given+according+to+the+merit+of+congruity.+4.+That+man%E2%80%99s+will+is+not+corrupted+or+made+worse+by+the+Fall+of+Adam%3A+and+so+either+there+should+be+no+original+sin+at+all%2C+or+else+but+in+name+only%3A+whereas%2C+%E2%80%98The+heart+of+man+is+deceitful+above+all+things.%E2%80%99+5.+That+the+Law+is+not+above+man%E2%80%99s+strength%2C+but+that+he+may+absolutely+fulfill+the+same%3A+and+be+altogether+free+from+sin+in+this+life%2C+if+he+would%3A+wheras+the+Scriptures+on+the+contrary+teach+that+there+is+not+any+one+just+man+in+the+earth+which+does+good+and+sins+not.+All+which+errors+establish+merits+of+condignity%2C+overthrow+the+grace+and+merits+of+Christ%2C+and+so+consequently+the+truth+of+Christian+religion%2C+being+nothing+indeed%2C+but+in+name+only%3A+and+in+a+word+confirms+pagan+divinity+and+philosophy.+For+in+all+these+positions%2C+the+names+only+excepted%2C+there+is+nothing+but+what+philosophy+itself+teaches%2C+both+concerning+the+beginnings+and+reward+of+virtue%3A+which+to+philosophers+is+faith%2C+righteousness+and+works.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+A+Commentary+upon+the+Divine+Revelation+of+the+Apostle+and+Evangelist+John+%28d.+1622%3B+Amsterdam%2C+1644%29%2C+ch.+3%2C+pp.+82-83+on+Rev.+3%3A20%2C+%E2%80%9CIf+any+man%E2%80%A6+open+the+door%E2%80%A6%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5fa9a9717c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5fa9a9717c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conversion/#:~:text=And%20lastly%20the%20Scripture%20speaks%20in,philosophers%20is%20faith%2C%20righteousness%20and%20works&amp;text=And%20las <blockquote><p>…the acknowledging of sins does not of itself obtain grace or forgiveness of sins, even as the bare acknowledging of a disease is not the remedy for the same: for even damned men also do acknowledge their sins, and yet are not therefore healed. The acknowledging of sin is a certain preparative unto faith, as the acknowledging of a disease does minister occasion to think upon a remedy. To this at this present we add that not the very fear of God, how sincere soever it be, not the very sorrow conceived for our sins, how great soever it be, nor the very humiliation, how submiss soever it be, do of themselves make us acceptable to God: but rather that they prepare an entrance and make a way for us unto the knowledge of Christ, and so consequently do lead us to Christ Himself being incarnate and crucified for us and our redemption, and lay us upon Christ alone, by Him to be quickened and purely cleansed.</p></blockquote>

<blockquote><p>For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.</p></blockquote>

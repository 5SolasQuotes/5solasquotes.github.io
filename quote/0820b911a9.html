<main class="wrap"><figure class="quote" id="q-0820b911a9" data-kw="">
<blockquote><p>In the fourth petition, (which is, ‘Give us this day our daily bread’)… we pray for ourselves and others, that both they and we, waiting upon the providence of God from day to day in the use of lawful means, may, of his free gift, and as to his fatherly wisdom shall seem best, enjoy a competent portion of them;[q] and have the same continued and blessed unto us in our holy and comfortable use of them,[r] and contentment in them;[s] and be kept from all things that are contrary to our temporal support and comfort.[t] [q] Gen. 43:12-14. Gen. 28:20. Eph. 4:28. 2 Thess. 3:11,12. Phil. 4:6. [r] 1 Tim. 4:3-5. [s] 1 Tim. 6:6-8. [t] Prov. 30:8,9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite>, #193</span></figcaption>

<blockquote><p>Some Imperious Presbyterians are known for high-handed and arbitrary uses of church discipline. What is the status of a congregation that doles out ecclesiastical discipline in a tyrannical manner? Such an assembly is unhealthy or corrupt, regardless of whether it has an outward form of Presbyterian polity.</p></blockquote>

</figure><figure class="quote" id="q-c84d53d055" data-kw="">
<blockquote><p>In conforming to the righteousness and holiness enjoined in God’s Word men cannot be too strict and precise; But when men out of an opiniative confidence in their own judgment shall be violently bent upon the doing of anything which by the Word of God they are no way bound to do, or shall scruple that which the Word of God does nowhere forbid, though they may do it conscientiously and upon opinion of duty, then they are overwise and righteous overmuch. That which therefore Solomon here enjoins God’s people is a prudent and pious moderation of their behavior in all things that they should be wise unto sobriety, not resting too much upon their own understanding and judgement, but advising with others, Rom. 12:3, and that they should temper their zeal with godly wisdom and prudence, according to that, Phil. 4:5, ‘Let your moderation be known unto all men;’ And the reason whereby this is pressed is, lest by doing otherwise men should involve themselves in desperate dangers, as by such courses men often do: ‘Why shouldest thou destroy thyself?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon Job, the Psalms, the Proverbs, Ecclesiastes &amp; the Song of Solomon</cite>, (1658), ch. 7, p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

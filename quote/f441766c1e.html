<blockquote><p>The ultimate disposition precedes materially, the form, but follows it, formally, as characteristic of that form. In the human embryo, the ultimate disposition both precedes and follows the infusion of the soul.</p></blockquote>

</figure><figure class="quote" id="q-371541bb79" data-kw="">
<blockquote><p>God’s curse to the woman was in part, ‘I will greatly multiply your sorrow and your conception’ (Gen. 3:16). Just as every other aspect of creation entered into a curse, so too did conception. To ignore the impact of the fall upon procreation is to miss critical changes that have come about that can make conception a sorrow rather than a blessing (things like cancer, high blood pressure, being worn out from running after five children under the age of six, changes to the function of lactation, etc.)… Physiology shows that perfect bodies were designed by God to suppress ovulation as long as there was breastfeeding (up to three years). The Fall has impacted many bodies to override this normal God-given function.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>…we will summarize the argument: Premise 1: … The purposes of marriage are threefold (WCF 24.2): 1) The mutual help of husband and wife (Gen. 2:18); 2) The increase of mankind/procreation (Gen. 1:28), and of the Church with an holy seed (Mal. 2:15); 3) Preventing of uncleanness (1 Cor. 7:2 &amp; 9). Premise 2: Any act against any of the purposes of marriage is necessarily sinful. Conclusion: Contraception acts against purpose 2 and is therefore sinful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-barth.html">Paul Barth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Contraception,’ pt. 1</cite>, (Abortifacients, Health Risks, Societal Factors), 2 (Dominion, Purposes of Marriage), 3 (Barrenness, Elderly, Natural Family Planning), 4 (Onanism) (2015) at Purely Presbyerian | To only respond to a few things due to the importance of the issue, in twelve points, Barth states in pt. 4:</span></figcaption>

<blockquote><p>…for in the ordinary course, nature proceeds in this manner: first, there is the mass of blood or seed received in the womb, but there is no parts of a body framed at the first: after a certain number of weeks, nature forms that substance into the parts of the body distinctly, but yet it is without life: then is the soul infused, when the body is organical, and so it is quickened and a true man; it is not before a man, but embryo as they call it… Now in the course of nature: first, that which is material is formed, as it were the house of the soul, and then the soul is infused, not only as the guest of it, but as the form and life of it:</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8abda43efa" data-kw="">
<blockquote><p>…princes, and all who hold the office of magistracy, are here reminded of their duty. It is not enough, if, by giving to every one what is due, they restrain all acts of violence, and maintain peace; but they must likewise endeavor to promote religion, and to regulate morals by wholesome discipline. The exhortation of David (Psalm 2:12) to “kiss the Son,” and the prophecy of Isaiah, that they shall be nursing — fathers of the Church, (Isaiah 49:23) are not without meaning; and, therefore, they have no right to flatter themselves, if they neglect to lend their assistance to maintain the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon on the Duty of Civil Rulers to Enforce and Defend the True Religion and True Godliness in their Realms by drawing out the sword against all Heretics and others who trouble the Church</cite>, …’ on 1 Tim. 2:1-2 (d. 1564; 1579)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“…princes, and all who hold the office of magistracy, are here reminded of their duty. It is not enough, if, by giving to every one what is due, they restrain all acts of violence, and maintain peace; but they must likewise endeavor to promote religion, and to regulate morals by wholesome discipline. The exhortation of David (Psalm 2:12) to “kiss the Son,” and the prophecy of Isaiah, that they shall be nursing — fathers of the Church, (Isaiah 49:23) are not without meaning; and, therefore, they have no right to flatter themselves, if they neglect to lend their assistance to maintain the worship of God.”

— John Calvin, ‘A Sermon on the Duty of Civil Rulers to Enforce and Defend the True Religion and True Godliness in their Realms by drawing out the sword against all Heretics and others who trouble the Church…’ on 1 Tim. 2:1-2 (d. 1564; 1579)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6princes%2C+and+all+who+hold+the+office+of+magistracy%2C+are+here+reminded+of+their+duty.+It+is+not+enough%2C+if%2C+by+giving+to+every+one+what+is+due%2C+they+restrain+all+acts+of+violence%2C+and+maintain+peace%3B+but+they+must+likewise+endeavor+to+promote+religion%2C+and+to+regulate+morals+by+wholesome+discipline.+The+exhortation+of+David+%28Psalm+2%3A12%29+to+%E2%80%9Ckiss+the+Son%2C%E2%80%9D+and+the+prophecy+of+Isaiah%2C+that+they+shall+be+nursing+%E2%80%94+fathers+of+the+Church%2C+%28Isaiah+49%3A23%29+are+not+without+meaning%3B+and%2C+therefore%2C+they+have+no+right+to+flatter+themselves%2C+if+they+neglect+to+lend+their+assistance+to+maintain+the+worship+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%98A+Sermon+on+the+Duty+of+Civil+Rulers+to+Enforce+and+Defend+the+True+Religion+and+True+Godliness+in+their+Realms+by+drawing+out+the+sword+against+all+Heretics+and+others+who+trouble+the+Church%E2%80%A6%E2%80%99+on+1+Tim.+2%3A1-2+%28d.+1564%3B+1579%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8abda43efa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8abda43efa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=princes%2C%20and%20all%20who%20hold%20the,to%20maintain%20the%20worship%20of%20God&amp;text=princes%2C%20and%20all%20who%20hold%20the%20office%20of&amp;text=their%20assistance%20to%20maintain%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

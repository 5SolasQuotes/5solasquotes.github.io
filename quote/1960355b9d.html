<main class="wrap"><figure class="quote" id="q-1960355b9d" data-kw="">
<blockquote><p>As Adam was the first man that God created, so he was the first father and progenitor of all other men, who are every one born in his image as they come into the world of nature, and breathe the vital air. Just so, from Jesus Christ, the everlasting Father, all who come into the world of grace derive their spiritual being; his image they bear, — 1 Cor. xv. 49. and from him “the whole family in heaven and in earth is named.” — Eph. iii. 15. Though here also there is a considerable disparity betwixt the earthly man and the heavenly Adam. The first man is not the immediate, but the remote father our flesh; — for “one generation goes, and another comes:” but Jesus Christ is the immediate Father of all his saints, who in every age receive from him the light of life, as the silver moon, and all the sparkling stars, draw light immediately from the sun, the fountain of the day.

“The first Adam,” as Moses relates, ” was made a living soul,” — 1 Cor. xv. 45. that he might convey a natural life to them who had not received it; but “the second Adam,” as the apostle declares, “was made a quickening spirit,” to impart a spiritual life to them who had lost it, and were dead in trespasses and sins: and at the resurrection of the just to quicken also their mortal bodies. For “as in Adam all die, so in Christ shall all be made alive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcewen.html">William McEwen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Truth, or, The Glory and Fulness of the Redeemer Displayed: In An Attempt to Explain, Illustrate, and Enforce, the Most Remarkable Types, Figures, and Allegories of the Old Testament. To which is added Thoughts of Various Subjects</cite>, (1763; Philadelphia PA: W. W. Woodward, 1821), p. 15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2575e114d8" data-kw="">
<blockquote><p>IV. Problem: Whether the will, both in the first and in the second moment of conversion, is determined by grace immediately, or indeed mediately through the ultimate judgment of the practical intellect? Response: See concerning this question the Appendix to the Disputations on Creation.

V. Problem: Whether the affirmative opinion [that the will is determined in conversion only mediately] does not favor Pelagianism, and deny the necessity and efficacy of grace in the will? Response: Negative, because they can nevertheless defend special grace, and that efficaciously prevailing and conquering, which is never rejected or can be rejected by any hard heart, in the composite sense; moreover they attribute nothing of faculty or cooperation for spiritual life to man in the first moment of conversion—as can be seen in [John] Cameron’s disputation with Tilenus, and his apology against the epistle of the anonymous Remonstrant (entitled “The Epistle of a Learned Man,” etc.) afterwards published.

VI. Problem: Whether the truth can be more easily, evidently, and solidly explained and defended against the Pelagians by this reasoning? Response: So indeed Cameron, just praised, seems to think, and with him Dr. Maccovius in his Academic Disputations recently published. Yet the ancient and received opinion is not obscurely preferred by Molinaeus in his Disputation on Free Will; Walaeus in his Disputation on the Conversion of the Will, in the year 1622, on the 17th day of March; Ames in his Medulla, and passim in his Anti-Remonstrant writings; and Spanheim, who appeared after the first edition of the present disputation, in his latest writing against Universal Grace. The Dominicans and other genuine Thomists, who today plead the cause of God in this matter against the Jesuits and other more recent Pelagians, do not think alike here—concerning which elsewhere. We touch on this question in the Disputations and Problems on Creation.</p></blockquote>

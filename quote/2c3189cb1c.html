<main class="wrap"><figure class="quote" id="q-2c3189cb1c" data-kw="person subsistence Sabellians">
<blockquote><p>By person, we mean a subsistence in the divine essence, which, in relation to other persons, is distinguished from them by an incommunicable property. It is not for the Sabellians to odiously attack or disdainfully reject the term “person,” as if it were humanly invented.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c7ca4ef8d4" data-kw="">
<blockquote><p>The apostles did not always exercise it, but only made use of it [the power of miracles] to prove the Word of God, to confirm it by the miracles; as it is written here in the text: ‘And they went forth, and preached everywhere, the Lord working with them, and confirming the Word by the signs that followed. [Mk. 16:20]’ But since the Gospel has now been spread abroad, and made known to all the world, there is no need of working miracles as in the apostles’ times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 206-8 on Mk. 16:16-17 in ‘Day of Christ’s Ascension into Heaven’, 2nd Sermon, on Mk. 16:14-20 in The Precious &amp; Sacred Writings of Martin Luther… ed. John N. Lenker (Minneapolis, MN: Lutherans in All Lands Co., 1907), vol. 12, Church Postil, Gospels: Pentecost or Missionary Sermons, vol. 3</cite>, p. 207</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

— Martin Luther, pp. 206-8 on Mk. 16:16-17 in ‘Day of Christ’s Ascension into Heaven’, 2nd Sermon, on Mk. 16:14-20 in The Precious &amp; Sacred Writings of Martin Luther… ed. John N. Lenker (Minneapolis, MN: Lutherans in All Lands Co., 1907), vol. 12, Church Postil, Gospels: Pentecost or Missionary Sermons, vol. 3, p. 207">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+apostles+did+not+always+exercise+it%2C+but+only+made+use+of+it+%5Bthe+power+of+miracles%5D+to+prove+the+Word+of+God%2C+to+confirm+it+by+the+miracles%3B+as+it+is+written+here+in+the+text%3A+%E2%80%98And+they+went+forth%2C+and+preached+everywhere%2C+the+Lord+working+with+them%2C+and+confirming+the+Word+by+the+signs+that+followed.+%5BMk.+16%3A20%5D%E2%80%99+But+since+the+Gospel+has+now+been+spread+abroad%2C+and+made+known+to+all+the+world%2C+there+is+no+need+of+working+miracles+as+in+the+apostles%E2%80%99+times.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+pp.+206-8+on+Mk.+16%3A16-17+in+%E2%80%98Day+of+Christ%E2%80%99s+Ascension+into+Heaven%E2%80%99%2C+2nd+Sermon%2C+on+Mk.+16%3A14-20+in+The+Precious+%26+Sacred+Writings+of+Martin+Luther%E2%80%A6+ed.+John+N.+Lenker+%28Minneapolis%2C+MN%3A+Lutherans+in+All+Lands+Co.%2C+1907%29%2C+vol.+12%2C+Church+Postil%2C+Gospels%3A+Pentecost+or+Missionary+Sermons%2C+vol.+3%2C+p.+207&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7ca4ef8d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7ca4ef8d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-miracles-the-cessation-of-the-gift-of-miracles/#:~:text=The%20apostles%20did%20not%20always%20exercise,miracles%20as%20in%20the%20apostles%E2%80%99%20times." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2fcae9d028" data-kw="">
<blockquote><p>In the earliest times, “the Holy Ghost fell upon them that believed: and they spake with tongues,” which they had not learned, “as the Spirit gave them utterance.” These were signs adapted to the time. For there behooved to be that betokening of the Holy Spirit in all tongues, to show that the Gospel of God was to run through all tongues over the whole earth. That thing was done for a betokening, and it passed away. In the laying on of hands now, that persons may receive the Holy Ghost, do we look that they should speak with tongues? Or when we laid the hand on these infants, did each one of you look to see whether they would speak with tongues, and, when he saw that they did not speak with tongues, was any of you so wrong-minded as to say, These have not received the Holy Ghost; for, had they received, they would speak with tongues as was the case in those times? If then the witness of the presence of the Holy Ghost be not now given through these miracles, by what is it given, by what does one get to know that he has received the Holy Ghost? Let him question his own heart. If he love his brother, the Spirit of God dwelleth in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the First Epistle of John, Homily 6, on 1 Jn. 3:19-4:3, section 10 in NPNF1</cite>, 7:497-98</span></figcaption>

get="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a78bfa55cf" data-kw="">
<blockquote><p>By the term ‘prophecy’, however, I do not understand the gift of foretelling the future, but as in 1 Cor. 14:3, the science of interpreting Scripture, so that a prophet is an interpreter of the will of God. For Paul, in the passage which I have quoted, assigns to prophets teaching for edification, exhortation, and consolation, and enumerates, as it were, these departments. Let, therefore, ‘prophecy’ in this passage be understood as meaning: interpretation made suitable to present use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Thess. 5, verse 20</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

— John Calvin, Commentary on 1 Thess. 5, verse 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+the+term+%E2%80%98prophecy%E2%80%99%2C+however%2C+I+do+not+understand+the+gift+of+foretelling+the+future%2C+but+as+in+1+Cor.+14%3A3%2C+the+science+of+interpreting+Scripture%2C+so+that+a+prophet+is+an+interpreter+of+the+will+of+God.+For+Paul%2C+in+the+passage+which+I+have+quoted%2C+assigns+to+prophets+teaching+for+edification%2C+exhortation%2C+and+consolation%2C+and+enumerates%2C+as+it+were%2C+these+departments.+Let%2C+therefore%2C+%E2%80%98prophecy%E2%80%99+in+this+passage+be+understood+as+meaning%3A+interpretation+made+suitable+to+present+use.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+1+Thess.+5%2C+verse+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa78bfa55cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a78bfa55cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/cessationism/#:~:text=By%20the%20term%20%E2%80%98prophecy%E2%80%99%2C%20however%2C%20I,interpretation%20made%20suitable%20to%20present%20use." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-008711bfe9" data-kw="">
<blockquote><p>Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 5, ‘Whether these prophets and prophesyings in the primitive church, 1 Cor. 14; 12:28; eph. 4:11; were extraordinary and not so to continue; or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry’ in A Treatise of Miscellany Questions | Garnet Milne</cite>, p. 247:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.”

</figure><figure class="quote" id="q-b56352fe0b" data-kw="">
<blockquote><p>Argument 7. That opinion is not to be held which lays ground that Christ-Mediator is a temporary king, has under Him magistrates, even heathenish, who have nothing to do with a mediator, to bear a temporal sword for a supernatural and spiritual end, as Christ under-heirs, He himself being the first-heir of all such and so makes heathens within the verge of the Mediatorial Kingdom; as if Christ were as Mediator, a King to heathen and all and everyone of mankind, who must have magistrates, and so [it] makes the Kingdom of men as men, and the Kingdom of Grace commensurable, and of alike latitude and extension, and makes nature and grace of equal comprehension: But such is the former opinion; the proposition cannot be denied, except by Arminians, Socinians, Papists, who do maintain an universal redemption, a grace universal, a catholic Kingdom of Grace comprehensive of all and every man, of Pharaoh, Evil Merodach, Belshazzar, all the kings of Romans, Persians, Assyrians, Chaldeans, and of Turk[s], India, and such as worship the sun and moon, the Devil, and the work of men’s hands…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government… (London, 1646)</cite>, p. 614</span></figcaption>

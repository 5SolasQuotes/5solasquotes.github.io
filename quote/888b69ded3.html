<main class="wrap"><figure class="quote" id="q-888b69ded3" data-kw="">
<blockquote><p>We do not say (for our parts) that all praying upon a book or instituted forms is but cold prayer, because God may pardon the ignorance of his people and accept the sincerity of their hearts, help them with some spiritual affections, even in such prayers…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c003f2e045" data-kw="">
<blockquote><p>Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!”

</figure><figure class="quote" id="q-1426800a32" data-kw="">
<blockquote><p>If a man were unavoidably brought into an idolatrous temple, or to mass, he might trust in God for strength and grace to preserve him… when a man shall put himself upon such a temptation, either out of vanity, curiosity, or desire to see novelty (though it were not unlawful to afford presence in an idolatrous worship, which yet it is) yet does a man put himself upon a greater temptation than he can in God’s way with confidence expect preservation from or deliverance out [of].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, … (London: 1646), p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-f8bd697434" data-kw="">
<blockquote><p>For the benefit of Christian love and concord may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They [nonconfomrits] prefer their own manner of worshipping God as better than the [Anglican] Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

</figure><figure class="quote" id="q-316ce28289" data-kw="">
<blockquote><p>Come friends, there is no end, nor much hope in disputing against fixed prejudice and wrong confident conceits, how clear soever the light be against it. Hold your judgment and I shall hold mine till God irresistibly reconcile us; and if you cannot forgive me, I can forgive you, but not own the guilt of your mistakes and the effects; I have too much already of my own. I had rather you accused me than [my own] conscience [accuse me] for wilful contracting¹ anymore. The Lord save us from our enemies, but more especially from our friends and all their temptations, and above all, from ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Reconciliation</span></figcaption>

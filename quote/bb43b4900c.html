<main class="wrap"><figure class="quote" id="q-bb43b4900c" data-kw="">
<blockquote><p>In the second place, meditation upon God is a sanctifying act, because God is holy and perfect in his nature and attributes. The meditation of which the Psalmist speaks in the text is not that of the schoolman, or the poet, but of the devout, saintly, and adoring mind. That meditation upon God which is “sweeter than honey and the honey-comb” is not speculative, but practical. That which is speculative and scholastic springs from curiosity. That which is practical flows from love. This is the key to this distinction, so frequently employed in reference to the operations of the human mind. All merely speculative thinking is inquisitive, acute, and wholly destitute of affection for the object. But all practical thinking is affectionate, sympathetic, and in harmony with the object.

When I meditate upon God because I love him, my reflection is practical. When I think upon God because I desire to explore him, my thinking is speculative. None, therefore, but the devout and affectionate mind truly meditates upon God; and all thought upon that Being which is put forth merely to gratify the curiosity and pride of the human understanding forms no part of the Christian habit and practice which we are recommending. Man in every age has endeavoured “by searching to find out God.” He has striven almost convulsively to fathom the abyss of the Deity, and discover the deep things of the Creator.

But because it was from the love of knowledge rather than from the love of God, his efforts have been both unprofitable and futile. He has not sounded the abyss, neither has his heart grown humble, and gentle, and tender, and pure. His intellect has been baffled, and, what is yet worse, his nature has not been renovated. Nay, more, a weariness and a curse has come into his spirit, because he has put the comprehension of an object in the place of the object itself; because, in his long struggle to understand God, he has not had the first thought of loving and serving him.

There is, indeed, for the created mind, no true knowledge of the Creator but a practical and sanctifying knowledge. God alone knows the speculative secrets of his own being. The moral and holy perfections of the Godhead are enough, and more than enough, for man to meditate upon. “The secret things belong unto the Lord our God,” said Moses to the children of Israel, “but those things which are revealed belong unto us, and to our children forever, that we may do all the words of his law.”

True meditation, thus proceeding from filial love and sympathy, brings the soul into intercourse and communion with its object. Devout and holy reflection upon God introduces man into the divine presence, in a true and solid sense of these words. Such a soul shall know God as the natural man does not, and cannot. “Judas saith unto him, not Iscariot, Lord, how is it that thou wilt manifest thyself unto us, and not unto the world? Jesus answered, and said unto him, If a man love me, he will keep my words: and my Father will love him, and we will come unto him and make our abode with him.” In the hour of spiritual and affectionate musing upon the character and attributes of God—and especially upon their manifestation in the Person and Work of Christ—there is a positive impression upon the heart, directly from God.

In what other mode can we get near to the Invisible One, here upon earth, than by some mental act or process? In what other way than by prayer and meditation can we approach God? We cannot see him with the outward eye. We cannot touch him with the hand. We cannot draw nigh to him with a body of flesh and blood. In no way, here below, can we have intercourse with God, except “in spirit.” He is a pure Spirit, and that part of us which has to do with him is the spirit within us.

And in this mode of existence, the only ordinary medium of communication between the divine and the human spirit is thought and prayer. God, with all the immensity of his being, and all the infinitude of his perfections, is virtually non-existent for that man who does not meditate and who never prays. For so long as there is no medium of intercourse there is no intercourse. The power of thought and of spiritual supplication is all that God has given us in this life whereby we may approach him, and be impressed by his being and attributes. Eye hath not seen him; the ear cannot hear him. Nothing but the invisible can behold the invisible. Here upon earth, man must meet God in the depths of his soul, in the privacy of his closet, or not at all.</p></blockquote>

<blockquote><p>Grace breeds delight in God, and delight breeds Meditation. A duty wherein consists the essentials of Religion, and which nourisheth the very life blood of it; and that the Psalmist may shew how much the godly man is habituated and inured to this blessed work of Meditation, he subjoins, in his Law doth he meditate day and night; not but that there may be sometimes intermission; God allows time for our calling, he grants some relaxation, but when it is said, the godly man meditates day and night, the meaning is, frequently; he is much conversant in the duty.

‘Tis a command of God to pray without ceasing, 1 These. 5.17. The meaning is, not that we should be always praying (as the Euchites held) but that we should every day set some time apart for prayer; so Drusius and others interpret it. We read in the old Law it was called the continual sacrifice; not that the people of Israel did nothing else but sacrifice, but because they had their stated hours every morning and evening they offered, therefore it was called the continual sacrifice; thus the godly man is said to meditate day and night, that is, he is often at this work, he is no stranger to meditation. …

That a good Christian is a meditating Christian, Psalm 119.15. I will meditate in thy precepts, 1 Tim. 4.15. Meditate upon these things. Meditation is the chewing upon the truths we have heard; The beasts in the old Law that did not chew the cud were unclean; the Christian that doth not by meditation chew the cud, is to be accounted unclean. Meditation is like the watering of the seed, it makes the fruits of grace flourish.</p></blockquote>

<blockquote><p>2. Meditate on the omnipotency of God, who made all these creatures of nothing (Heb. xi. 3)—of his wisdom (Psal. cxlv. 15, 16), who feedeth so many infinite creatures through the universal world, maintaining all their lives, which he has given them, which surpasseth the wisdom of all the angels in heaven—and of his clemency and goodness, in feeding also his very enemies (Matt. v. 45, &amp;c.; Acts xiv. 17.)

3. Meditate how many sorts of creatures, as beasts, fish, and fowl, have lost their lives, to become food to nourish thee; and how God’s providence from remote places has brought all these portions together on thy table for thy nourishment; and how by these dead creatures he maintains thee in health and life.

4. Meditate that seeing thou hast so many pledges of God’s fatherly bounty, goodness, and mercy towards thee, as there are dishes of meat on thy table, O suffer not in such a place, so gracious a God to be abused by scurrility, ribaldry, or swearing; or thy fellow-brother, by disgraceful backbiting, taunting, or slandering.</p></blockquote>

<blockquote><p>2. The demonstrative particle, this so seems to refer to the vision of God in the bush. This which you see of my appearance is a sign that I will be with you in your work…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c74c573f6" data-kw="">
<blockquote><p>In the worship service itself, it is by no means unlawful to use things, rites, and actions borrowed from the worshippers of idols and polluted with idolatry if, from the law of nature, they are either necessarily presupposed for worship, or if the causes and conditions of the same, without which worship would be impossible, demand them; which conditions are time and place of worship, a baptistry, cups, dishes, tables, the opening of the mouth, extending of the hand, going to the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla theologiae, 14.37 trans. Charles Johnson</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-c9fff794c6" data-kw="">
<blockquote><p>Images of God were strictly forbidden. But Puritan psychology also kept its strong Scholastic roots… Tension between Reformed iconoclasm and Scholastic psychology was not immediately apparent, but during the Evangelical Awakening of the 1740s it became acute. The problem may be stated concisely: If mental images are natural products of the imagination, how can a mental image of Christ be condemned as idolatrous? Does not this impugn the character of God who gave the mind its capacity for forming images? The following study… concludes with the controversy which erupted in Scotland when Jonathan Edwards defended the psychological neutrality of ‘Imaginary ideas of Christ.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-e5e5b6cb6c" data-kw="">
<blockquote><p>I will analyze how a group of Byzantine seals mark a subgroup of this elite [class] that emerged at the forefront of Byzantine society at the beginning of the iconoclast era… The common feature shared by these seals is that they all contain quotations of the Psalms, and represent nearly the only quotations—scriptural or otherwise—that occur on Byzantine seals. This short-lived sigillographic trend was, moreover, restricted to prominent early iconoclast lay officials.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joe-glynias.html">Joe Glynias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayerful Iconoclasts: Psalm Seals &amp; Elite Formation in the First Iconoclast Era (726–750)’ in Dumbarton Oaks Papers, vol. 71 (2017), pp. 65-93</cite>, pp. 65-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2</span></figcaption>

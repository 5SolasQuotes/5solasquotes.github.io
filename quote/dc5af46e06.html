<main class="wrap"><figure class="quote" id="q-dc5af46e06" data-kw="">
<blockquote><p>What word of Christ has Mr. [William] Prynne for extraordinary conversion of men by miracles without the Word? He must conceive with Arminians and Socinians that many are converted that never heard of that precious name of Jesus, without which there is no salvation, Acts 4:11, or of a faith in Christ, as Moses Amyraldus dreams, without the knowledge of Christ, and may write books De salute Ethnicorum [On the Salvation of Ethnics]… This may make us fancy somewhat of the salvation of Aristotle, Seneca, Cicero, Aristides, Scipio, Regulus, without the Law or Gospel, this way of extraordinarily saving men by miracles without the Gospel is the doctrine of Arminians and Socinians; so say the Arminians at the Synod of Dort, pp. 334-35: ‘Those whom God has deprived of the Gospel, He has not precisely rejected them from a communion of the benefits of the Gospel.’ Adolphus Venator (Adversus Dracenos, p. 84), says, ‘The heathen are saved without the Gospel, if they even but pray, Ens Entium miserere mei [‘Being of beings, have mercy on me’]. [Faustus] Socinus (Lectures on Theology, ch. 3), tells us of an inspired word that saves us, called verbum interius [‘an interior word’]. You may please schoolmen thus, such as Granadus (Contr. 8, de grat., tract 6, disp. 1, numb. 43) did Ruiz (De Predesti. se. 8. numb. 7), Alexander Alens. (8, p. q. 69, member 5, art. 3, De bonis Philosophis sic credo, etc.), Roa. (bk. 1, De Provident., quest. 7, n. 50), Vega (bk. 13 in Trident. ch. 12), Enriquez (tome 2, De ultimo fine, ch. 14, num. 6, quod bk. 8, quest. 5), Vasquez (1, par. disp. 97, and ch. 5), Soto (bk. 1, de nat. et grat., ch. 18, ad. 2), Francis Sonnius (in demonstrat. tract. 12. de consiliis ch. 8), Camerarius (bk. 1, de grat., ch. 8 and bk. 7, ch. 8), who do all of them send all the good philosophers and white morallists to heaven by miracles, inspirations, extraordinary works of providence and that without any rumour of Christ and the Gospel; famous Papists, to their own shame, yield that divine faith cannot be produced by miracles. Andradius says often they may be false. Maldonatus says that no necessary argument of faith can be drawn from miracles. Gregorius de Valen. says miracles give us no infallible certainty of doctrine. Bellarmine says, ‘Miracles cannot convince the mind.’ Durandus gives a sure reason why miracles cannot produce faith, ‘because’ (says he) ‘suppose it were known of itself that this miracle of the raising e.g. of Lazarus were true, yet it is not known by itself that it testifies that this is a true doctrine which he preaches who works the miracle.’ Mr. Prynne then has put the salvation of those who never heard the Gospel upon extraordinary pillars when he bottoms them on miracles without the Word, which are extraordinary rotten pillars.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London: 1646), ch. 23, p. 522</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41fa5bb1e6" data-kw="">
<blockquote><p>How can a man be just with God? The answer given to this question decides the character of our religion and, if practically adopted, our future destiny. To give a wrong answer is to mistake the way to heaven. It is to err where error is fatal, because it cannot be corrected.</p></blockquote>

<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>

</figure><figure class="quote" id="q-59df0fff9d" data-kw="">
<blockquote><p>Precisely because we are justified in Him – that is, in His justification – our justification is also final and irreversible. Indeed we can be so bold as to say that we are as fully justified before God as our Lord Jesus is. We are as finally justified as our Lord Jesus is. We are as irreversibly justified as our Lord Jesus is. The only justification we have – our only righteousness – is that of the Lord Jesus. We are justified with His justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sinclair-ferguson.html">Sinclair Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assured by God</cite>, p. 91</span></figcaption>

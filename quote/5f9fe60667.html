<main class="wrap"><figure class="quote" id="q-5f9fe60667" data-kw="">
<blockquote><p>For it is tyrannous if any one man appoint or make ministers at his pleasure. Therefore, this is the (most) lawful way, that those be chosen by common voices who are to take upon them any public function in the Church. And the apostles prescribe what manner [of] persons ought to be chosen, to wit, men of tried honesty and credit, men endued with wisdom and other gifts of the Spirit.

And this is the mean between tyranny and confused liberty, that nothing be done without the consent and approbation of the people, yet so that the pastors moderate and govern (this action,) that their authority may be as a bridle to keep under the people, lest they pass their bounds too much.

In the mean season, this is worth the noting, that the apostles prescribe an order unto the faithful, lest they appoint any save those which are fit. For we do God no small injury if we take all that come to hand to govern his house. Therefore, we must use great circumspection that we choose none unto the holy function of the Church unless we have some trial of him first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 235.</span></figcaption>

d it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9caac3001" data-kw="">
<blockquote><p>For God, who made man, did himself prepare in his predestination, both the gift of illumination to believe, and the gift of perseverance to profit and persevere, and the gift of glorification to reign, tor such to whom he pleased to give it: who also doth not any otherways perform in deed than was ordained by his unchangeable will.

The truth of which predestination, whereby the apostle witnesseth we were predestinated in Christ before the foundation of the world, if any one refuse to receive with the belief of the heart, or to utter with the confession of the mouth, if, before the last day of this present life, he lay not aside the obstinacy of his impiety, whereby as a rebel he withstandeth the true and living God, it is manifest that he doth not belong to the number of those which God did before the foundation of the world freely choose in Christ, and predestinated unto the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Incarnatione et Gratia Christi</cite>, Quoted in William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 346.</span></figcaption>

</figure><figure class="quote" id="q-5f317cf4ce" data-kw="">
<blockquote><p>Of what sort of men is election? Of such as are uncleane and ungodly in the sight of God. “For He has chosen us that we might be holy and without blame,” Eph. 1:4. But whereas He chose us before the world was made, it is effected that God set before his eyes all men that ever should be, and for as much as they would be ungodly and accursed, He likewise so considered them and so chose some out of the common lump and filth of men, and those freely according to the good pleasure of his will, leaving others in their sin and curse.</p></blockquote>

</figure><figure class="quote" id="q-05b0892c45" data-kw="">
<blockquote><p>Even so in administering the functions of the Church, if we seek for the original cause of the workman, by whose conduct, all inferior causes are induced to observe their due order and course: the same must be adjudged to proceed from the force and efficacy of the unmeasurable election of the heavenly workman only, who by wonderful dispensation, maketh choice where him liketh, and refuseth whom him lusteth, according to the testimony of the Scripture: I will take compassion on whom I will take compassion, and I will shew mercy to whom I will shew mercy. Whereunto accordeth Saint Paul speaking after the same manner: It is neither the willer, nor the runner, but God that taketh compassion.

Where fortune, and chance, may go play them perdie: no endeavours of man can avail, much less can men’s merits or deservings be of any force, neither can ought else bear palm here, but the only election of almighty God. The nature and property of which election, we may learn elsewhere out of the same Paul: The remnant (sayeth he) are saved through the election of grace, which grace cannot be said to be grace at all, if man’s merits have pre-eminence before it for that which is given according to the proportion of deservings, and not according to grace, seemeth in Augustine’s judgment, a reward rather of duty, then a free gift of promise. But a question may be moved here perhaps, whether the Gentiles were not engrafted for their faith’s sake? and whether the Jews were not supplanted from the true Olive for their unbelief? which interchanged dispensation, what else doeth it explain unto us, then a manifest demonstration as well of the meritorious desert, as well of faith, as of unbelief?

The answer hereunto, first as concerning the faith of the Gentiles, and the infidelity of the Jews. I confess indeed that these may seem to carry some show in the eyes, and judgment of some to be deemed the very original causes of the free acceptation of the Gentiles, and likewise of the repulse of the Jews. But for all this we here not yet, what were the causes of the faith of the one, and of the unbelief of the other. And therefore if we will enter into a deep and more especial enquiry after the principal causes of this action, truly we shall never find them elsewhere, then in the hidden and secret closet of God’s election.

For be it so admitted, that the Gentiles were for this cause engrafted into the true Olive tree, because they did believe, yet if question be moved, from whence their faith proceeded first, it may well be answered, not from any their merits truly, neither in respect of any their own worthiness more, then as the imps which do issue out of the natural wild Olive tree, can boast of any their excellency, wherefore they ought to be transplanted into the fatness of the true Olive tree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>

<blockquote><p>The doctrine of this high mystery of predestination is to be handled with special prudence and care, that men, attending the will of God revealed in his Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election. So shall this doctrine afford matter of praise, reverence, and admiration of God; and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.</p></blockquote>

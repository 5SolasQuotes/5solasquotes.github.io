<main class="wrap"><figure class="quote" id="q-37683cae54" data-kw="">
<blockquote><p>When so many changes take place, particularly if the world is turned upside down, and if there is a rapid succession of events, we are perplexed and entertain doubts whether all things happen at random and by chance, or are regulated by the providence of God. The Lord therefore shews that it is he who effects this revolution, and renews the state of the world, that we may learn that nothing here is of long duration, and may have our whole heart and our whole aim directed to the reign of Christ, which alone is everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 101.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence.html">Providence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51fb0d48d6" data-kw="">
<blockquote><p>But every man is tempted, when he is drawn away of his own lust, and enticed. Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death.’ John in 1 Jn. 2:12, 16, “The lust of the flesh, and the lust of the eyes, and the pride of life, is not of the Father, but is of the world.” Add. Gal. 5:17.

2. Actual sins, which flow from this impure font: Mt. 15:19, “For out of the heart proceed evil thoughts, murders, adulteries, fornications, thefts, false witness, blasphemies: These are the things which defile a man.” Jam. 1:15. To these [latter, phsycial evils,] pertain:

3. Punishments of every kind: calamities, diseases, and finally temporal and eternal death (Rom. 5:12, 14; 7:10-14; Eph. 2:3). Thomas in Summa, pt. 1 of 2, q. 85, art. 3, recounts four wounds of nature: ignorance, malice, concupiscence and infirmity, of which he constitutes the first in the intellect, the second in the will, the third in the concupiscible appetite, and the fourth in the irascible, which Bellarmine expounds diffusely and pathetically in On the Loss of Grace &amp; the State of Sin., bk. 6, ch. 9-12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 14-15 Latin | “§40. The effects [of original sin] are either moral or physical evils. To the former is to be referred: | 1. Concupiscence, not that natural and innate faculty by which, for our ordinate conservation, we desire necessary things like food, drink, sleep, etc.—for this was instilled in man by God—but the pravitious concupiscence derived into posterity through the fall, otherwise called the concupiscence of the flesh (Eph. 2:3; 1 Jn. 2:16; Gen. 8:21), which by its inordinate movements irritates man to evils, and is the cause, fuel, and fodder of sin and of all vices and outrages, concerning which Paul says in Rom. 7:7, “I had not known lust, except the law had said, ‘Thou shalt not covet.&#x27;” James 1:14:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-77eaa862ef" data-kw="">
<blockquote><p>[Scotus:] ‘That the effect is not right is caused now not because of the prior cause, which on its own part would cause rightly if the second cause were to cause; but because of the defect of the secondary cause, which in its power has the option of co-causing with the first cause or not cocausing. And if it does not co-cause with the first cause as it is bound to, there is no rectitude in the common effect of both.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Scotus:</span></figcaption>

</figure><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.6.8</span></figcaption>

</figure><figure class="quote" id="q-d2615bf758" data-kw="">
<blockquote><p>Men are his especial care. He provides the food of their bodies, and in a peculiar way watches and rules over their souls and lives. This he does with respect to the wicked as well as the good. His care extends to individuals, to families, to nations, and throughout the world. It appears not in great events only, but in those exceeding small, even to the numbering of the hairs of each one&#x27;s head.</p></blockquote>

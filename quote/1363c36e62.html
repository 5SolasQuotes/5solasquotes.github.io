<main class="wrap"><figure class="quote" id="q-1363c36e62" data-kw="">
<blockquote><p>ch. 2, ‘While some have thought all things were simultaneously made in both matter and form, others that it was through intervals of time’ Indeed, some of the holy fathers who have excellently examined the words and mysteries of God seem to have written seemingly conflicting things on this matter. Some indeed have taught that all things were created simultaneously in both matter and form, which Augustine seems to have thought. Others, however, have more strongly proved and asserted that a raw and formless prime matter, holding a mixture and confusion of the four elements, was created; yet afterward, through the intervals of six days [intervalla sex dierum], from that matter the kinds of corporeal things were formed according to their proper species. This judgment which Gregory, Jerome, Bede and many others commend and prefer, also seems to agree more closely with the Scripture of Genesis, from which the first knowledge of this matter was revealed to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Books of Sentences 2nd</cite>, ed. (c. 1150; Florence: College of St. Bonaventura, 1916), vol. 1, bk. 2, dist. 12, ch. 2, pp. 358-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-61bb8eb5c6" data-kw="">
<blockquote><p>§5. But as in the concept of the divine intellect the ratio of the object was chiefly regarded, the same is now to be observed in the concept of the divine will, whose object is everything willed. It can, however, be divided into primary and secondary: the former is God Himself, or the divine essence; the latter, whatever is conceived to have been, to be, or to be about to be besides God. The former is called primary, because it is present to Him before His consciousness as the first and greatest good, independent of every other thing. The latter is called secondary, because all its goodness depends upon the goodness of God, and is exceedingly limited.</p></blockquote>

</figure><figure class="quote" id="q-3dd1700e32" data-kw="">
<blockquote><p>It is necessary to attribute providence to God. For all the good that is in created things has been created by God, as was shown above (Q. 6, A. 4). In created things good is found not only as regards their substance, but also as regards their order towards an end and especially their last end, which, as was said above, is the divine goodness (Q. 21, A. 4). This good of order existing in things created, is itself created by God. Since, however, God is the cause of things by His intellect, and thus it behooves that the type of every effect should pre-exist in Him, as is clear from what has gone before (Q. 19, A. 4), it is necessary that the type of the order of things towards their end should pre-exist in the divine mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 22, art. 1, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

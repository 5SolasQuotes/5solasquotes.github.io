<main class="wrap"><figure class="quote" id="q-70ba221700" data-kw="">
<blockquote><p>If any say [such as the Erastians], ‘Who can deny but the magistrate as the magistrate may command that which is obedience to Christ, and reward it, and forbid sin and punish it?’ Answer: But the magistrate as such forbids not sin as sin, for then as a magistrate he should forbid sin under the punishment of eternal wrath, which he cannot do as a magistrate, he only can forbid sin under the pain of his temporary punishment, which he can inflict, and as it disturbs societies and incorporations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, p. 600</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbf3704f54" data-kw="">
<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God; the power that ‘is’ [Rom. 13:1], must be from God; the magistrate as magistrate, is good, in nature of office, and the intrinsecal end of his office, Rom. 13:4, for he is the minister of God for thy good; and therefore a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power, and is no more from God (but from sinful nature, and the old serpent) than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-cf842d1c29" data-kw="">
<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), ch. 24, Question 20</cite>, pp. 547-48</span></figcaption>

</figure><figure class="quote" id="q-193f78de04" data-kw="">
<blockquote><p>They spoil kings and parliaments of their legislative power. But their great tenet about the magistracy is this, that no prince nor state on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either church or state; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the Laws of God set down in Scripture; that the judicial Law of Moses binds at this day all the nations of the world as well as ever it did the Jews: They tell us that whatever God in Scripture has left free, it may not be bound by any human law, whether civil or ecclesiastic; and what God has bound by any law in Scripture, they will not have it loosed by the hand of any man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive From the Errours of the Time (1645)</cite>, p. 31</span></figcaption>

</figure><figure class="quote" id="q-c1a9a1236c" data-kw="">
<blockquote><p>Man’s natural liberty is this: privilege of having and doing those things only to which the individual has a moral right. Consequently, the natural liberty of two men in the same commonwealth may be different, because under Providence, their natural endowments and relations may differ. Were it possible to frame a government thoroughly equitable, each person’s civic liberty would be identical with his natural: the privilege of having and doing all those things, and those only, to which each has a moral right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Philosophy (Mexico, MO, 1897)</cite>, p. 383</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

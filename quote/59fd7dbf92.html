<blockquote><p>It is farther observed in this Answer [of the Larger Catechism], that men take the name of God in vain by sinful lots. This subject, however, needs explanation. Let it be considered, then, that when lots were an ordinance, by which God in an extraordinary manner determined things which were before unknown, they being an instituted means of appealing to Him for that end, as in the case of Achan and others, were not to be used in a common way; for to have used them so would have been a profaning of a sacred institution. But as this extraordinary ordinance has now ceased, it does not seem unlawful, so as to be an instance of profaneness to make use of lots in civil matters, provided we do not consider them as an ordinance which God has appointed, in which we think we have ground to expect his immediate interposition and to depend upon it as if it were a divine oracle. In this view it would be unlawful, at present, to use lots in any respect whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (d. 1734; NY: Robert Carter, 1855), vol. 2, p. 340 Ridgley (c. 1667–1734) was an English dissetning minister and here wrote the first commentary on Westminster’s Larger Catechism.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<blockquote><p>The ordinary recreations which we have in winter, and in most solitary times busy our minds with, are cards, tables, and dice, shovelboard, chess-play, the philosophers’ game, small trunks, music, masks, singing, dancing, ulegames, catches, purposes, xmerry tales, news, etc. Many too nicely take exceptions at cards, tables, and dice, and such lusorious lots, whom Gataker well confutes. Which though they be honest recreations in themselves, yet may justly be otherwise excepted at, as they are often abused… So good things may be abused, and that which was first invented to refresh men’s weary spirits, when they come from other labors and studies to exhilarate the mind, to entertain time and company, tedious otherwise in those long solitary winter nights, and keep them from worse matters, an honest exercise is contrarily perverted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-burton.html">Robert Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Melancholy</cite>, … (Oxford: Lichfield, 1621), 2nd Partition, Section 2, Member 4, ‘Exercise Rectified of Body &amp; Mind,’ pp. 346-47 Burton (1577-1640) was an Anglican clergyman and Oxford fellow.</span></figcaption>

<blockquote><p>…there is a certain other kind of gaming which stands partly upon chance and partly upon industry, as is playing at tables, and such like, where in very deed they cast by chance, but the casts are governed by endeavor. Wherfore Plato affirmed the life of man to be like unto the playing at tables. For even as in table-play, so also in the life of man, if anything chance amiss, the same by art must be corrected. Unto which sentence Terence in his Comedy Adelphorum alludes. And indeed these kind of plays seem to be such, that sometime they may be permitted, so that they hurt not, so they recreate the spirits and be joined with honesty, and that the time, which should be spent vpon better things, be not consumed in these… But what shall we answer unto Ambrose?… the reason, which Ambrose first alleged, was because there was nothing found in the holy Scriptures, how these things ought to be used. Thereunto we answer that they are found in the holy Scriptures generally, ‘Whether ye eat, or whether ye drink, or whether you do anything else, do all things to the glory of God.’ (1 Cor. 10:31) Wherefore the body and the mind must otherwhiles be so refreshed with plays, as afterward we may be cheerful and prompt to weightier matters. Furthermore, there is nothing found particularly in the Scriptures touching bakers, cooks, or shipmen, and yet nevertheless their exercises must not be altogether excluded… But now to conclude, me thinks that those kind of [stage] plays, which serve for refreshing of men’s strength, are not utterly to be forbidden.</p></blockquote>

<blockquote><p>§8. Question 3. Is a man obliged by a contract which he made in ignorance or mistake of the matter? Answer: I have answered this before in the case of marriage, pt. 2, ch.

1. I add here, we must distinguish:

1. Between culpable and inculpable error;

2. Between an error about the principal matter and about some smaller accidents or circumstances;

3. Between a case where the law of the Land, or the common good interposes and where it does not.

1. If it be your own fault that you are mistaken, you are not wholly freed from the obligation: But if it was your gross fault, by negligence or vice, you are not at all freed. But if it were but such a frailty as almost all men are liable to, so that none but a person of extraordinary virtue or diligence could have avoided the mistake, then equity will proportionably make you an abatement or free you from the obligation. So far as you were obliged to understand the matter, so far you are obliged by the contract; especially when another is a loser by your error.

2. An inculpable error about the circumstances or smaller parts will not free you from an obligation in the principal matter: But an inculpable error in the essentials will.

3. Except when the law of the land or the common good, does otherwise overrule the case: For then you may be obliged by that accident. In diverse cases the rulers may judge it necessary, that the effect of the contract shall depend upon the bare words or writings, or actions; lest false pretenses of misunderstanding should exempt deceitful persons from their obligations and nothing should be a security to contractors. And then men’s private commodity must give place to the law and to the public good.

4. Natural infirmities must be numbered with faults, though they be not moral vices, as to the contracting of an obligation, if they be in a person capable of contracting. As if you have some special defect of memory, or ignorance of the matter which you are about! Another who is no way faulty by over-reaching you, must not be a loser by your weakness. For he that comes to the market, or contracts with another who knows not his infirmity, is to be supposed to understand what he does, unless the contrary be manifest: You should not meddle with matters which you understand not: Or if you do, you must be content to be a loser by your weakness.

5. Yet in such cases, another that has gained by the bargain, may be obliged by the laws of equity and charity, to remit the gain, and not to take advantage of your weakness: But he may so far hold you to it, as to secure himself from loss: except in cases where you become the object of his charity, and not of commutative justice only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 115</span></figcaption>

+faults%2C+though+they+be+not+moral+vices%2C+as+to+the+contracting+of+an+obligation%2C+if+they+be+in+a+person+capable+of+contracting.+As+if+you+have+some+special+defect+of+memory%2C+or+ignorance+of+the+matter+which+you+are+about%21+Another+who+is+no+way+faulty+by+over-reaching+you%2C+must+not+be+a+loser+by+your+weakness.+For+he+that+comes+to+the+market%2C+or+contracts+with+another+who+knows+not+his+infirmity%2C+is+to+be+supposed+to+understand+what+he+does%2C+unless+the+contrary+be+manifest%3A+You+should+not+meddle+with+matters+which+you+understand+not%3A+Or+if+you+do%2C+you+must+be+content+to+be+a+loser+by+your+weakness.+5.+Yet+in+such+cases%2C+another+that+has+gained+by+the+bargain%2C+may+be+obliged+by+the+laws+of+equity+and+charity%2C+to+remit+the+gain%2C+and+not+to+take+advantage+of+your+weakness%3A+But+he+may+so+far+hold+you+to+it%2C+as+to+secure+himself+from+loss%3A+except+in+cases+where+you+become+the+object+of+his+charity%2C+and+not+of+commutative+justice+only.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%28London%2C+1673%29+%7C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+115&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56f985347c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56f985347c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=8.%20Question%203.%20Is%20a%20man,and%20not%20of%20commutative%20justice%20only&amp;text=8.%20Question%203.%20Is%20a%20man%20obliged%20by&amp;text=his%20charity%2C%20and%20not%20of%20commutative%20justice%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I am neither so blind, wicked or singular as to deny the common doctrine of casuists, protestants and Papists, that though a vow be both sinfully imposed and sinfully taken, yet it binds in materia necessaria et licita [in necessary and lawful matter]. Yea, that if part of the matter be unlawful, yet it binds to that part which is lawful. Else a knave might exempt himself from the performance of all his vows by foisting in some unlawful matter or by making them in an unlawful manner.</p></blockquote>

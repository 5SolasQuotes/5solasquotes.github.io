<main class="wrap"><figure class="quote" id="q-7818130c46" data-kw="">
<blockquote><p>In a wonderful and ineffable manner, that which is done even contrary to His will is not done apart from His will; for it would not happen if He did not permit it. Nor does He permit it unwillingly, but willingly. Nor would He, being good, permit evil to be done unless, being omnipotent, He were also able to bring good out of evil.” Augustine, Handbook on Faith, Hope &amp; Love, ch. 100] 2. Conditional, when He wills, some condition being put in us; so God would have all men saved on this condition, if they can believe. The first of these is by another name called Voluntas beneplaciti, the last Voluntas signi. God’s will is:

1. Secret, Voluntas propositi, that whereby He has absolutely and freely determined with Himself what He will do, permit or hinder. Ps. 115:3; Eph. 1:11; Rom. 9:18, called the will of God concerning us.

2. Revealed, Voluntas praecepti, that whereby God has manifested what He would have believed, done or left undone by his reasonable creatures, Mk. 3:35; 1 Thess. 4:3. That distinction of God’s will into beneplaciti et signi, differs little from this. Signi is the same with revealed. Beneplacitum is the decree properly so called, which may be either hidden or manifest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’ | “The will of God is one and the same, but it is distinguished:¹ | 2. In respect of application to the creature, into: | 1. Absolute, when God wills and concludes anything concerning us without any condition in us.²</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

1. Secret, Voluntas propositi, that whereby He has absolutely and freely determined with Himself what He will do, permit or hinder. Ps. 115:3; Eph. 1:11; Rom. 9:18, called the will of God concerning us.

2. Revealed, Voluntas praecepti, that whereby God has manifested what He would have believed, done or left undone by his reasonable creatures, Mk. 3:35; 1 Thess. 4:3. That distinction of God’s will into beneplaciti et signi, differs little from this. Signi is the same with revealed. Beneplacitum is the decree properly so called, which may be either hidden or manifest.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f0ad7c7ae" data-kw="">
<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), voluntas Dei, pp. 332-33</span></figcaption>

</figure><figure class="quote" id="q-3d615462b0" data-kw="">
<blockquote><p>Men perish by their own will, but against God’s will; I mean his antecedent will, and as revealed in his Word. For else men perish by God’s consequent will, having rejected the means of their own salvation.</p></blockquote>

</figure><figure class="quote" id="q-3f0a411569" data-kw="">
<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel</cite>, … with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman., p. 155</span></figcaption>

</figure><figure class="quote" id="q-574b527461" data-kw="">
<blockquote><p>As God may by metaphor be said to will what by His will, properly speaking, He wills not; so He may by metaphor be said to will what He does will, properly speaking. Hence there is nothing to prevent the same thing being the object of the will of good pleasure and of the will of expression [sign]. But operation is always the same as the will of good pleasure; while precept and counsel are not; both because the former regards the present, and the two latter the future; and because the former is of itself the effect of the will; the latter its effect as fulfilled by means of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, q. 19, art. 12, reply to obj. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

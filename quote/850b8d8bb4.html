<main class="wrap"><figure class="quote" id="q-850b8d8bb4" data-kw="">
<blockquote><p>Against the public disturbers of the peace of Europe, you protect, not so much yourself, as your people, by armies, fleets and confederacies, and, which renders you most of all formidable to your enemies, by your innate prudence and magnanimity.

And did not words, equal to your merit, fail me, as it gives me singular pleasure to speak of it, your piety above all things ought to be celebrated, whereby you readily and with justice, ascribe all the honour and success you are favoured with, to the goodness of the supreme Being, and are ready, gratefully to lay down your sceptre at the feet of him who, encircled with the rain-bow, sits on his heavenly throne: while you govern with no other view, but that Jehovah may reign, and Jesus rule throughout all your dominions: whose empire you promote and enlarge, not as others do, in support of their superstition and cruelty, by imprisonment, exile and stripes, and every engine of torture, the gibbet and fire; not by depopulating countries, not by the terror and dreadful blasphemies of Dragoons, but by meekness, and by the demonstration of the truth to every conscience; and by what is most of all prevalent, your own example; never offering any violence to the consciences of those who differ in religious sentiments from yourself.

But, in fine, what language can set off, as it ought to be, that sacred solicitude you discovered at your very accession to the throne? That your subjects, laying aside their disputes about some points of Christian worship and ecclesiastical government, might unite with the most desirable harmony of minds, in brotherly fellowship, and uniformity of prayers and praises to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dedication.html">Dedication</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William III in Herman Witsius, The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank (1677; 2 vols, London, 1822), i, p. 13.</cite></span></figcaption>

<blockquote><p>What attitude should we adopt in view of the present popularity of pictures of Jesus Christ? The following considerations may be suggested as hearing on this question: (a) The Bible presents no information whatever about the personal appearance of Jesus Christ, but it does teach that we are not to think of him as he may have appeared “in the days of his flesh” but as he is today in heavenly glory, in his estate of exaltation (2 Cor. 5:16). (b) Inasmuch as the Bible presents no data about the personal appearance of our Saviour, all artists’ pictures of him are wholly imaginary and constitute only the artists’ ideas of his character and appearance.

(c) Unquestionably pictures of the Saviour have been very greatly influenced by the theological viewpoint of the artist. The typical modern picture of Jesus is the product of nineteenth century “Liberalism” and presents a “gentle Jesus” who emphasized only the love and Fatherhood of God and said little or nothing about sin, judgment, and eternal punishment. (d) Perhaps more people living today have derived their ideas of Jesus Christ from these typically “liberal” pictures of Jesus than have derived their ideas of Jesus from the Bible itself. Such people inevitably think of Jesus as a human person, rather than thinking of him according to the biblical teaching as a divine person with a human nature. The inevitable effect of the popular acceptance of pictures of Jesus is to overemphasize his humanity and to forget or neglect his deity (which of course no picture can portray).

(e) In dealing with an evil so widespread and almost universally accepted, we should bear a clear testimony against what we believe to be wrong, but we should not expect any sudden change in Christian sentiment on this question. It will require many years of education in scriptural principles before the churches and their members can be brought back to the high position of the Westminster Assembly on this question. Patience will be required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), p. 292.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-25a3563ea4" data-kw="">
<blockquote><p>Truth is the daughter of time, was the saying of old, and our daily experience gives in evidence and proof hereof, to every man’s ordinary observation. Only as in other births, so here, the barrenness and fruitfulness of several ages, depend merely upon God’s good pleasure; who opens and shuts the womb of truth from bearing, as He sees fit, according to the counsel of his own will. Not that there is any change in the truth, but the alteration grows, according to men’s apprehensions, to whom it is more or less discovered, according to God’s most just judgment and their own deservings. Sometimes God makes an eclipse of the truth at midday, that so He might express his wrath from Heaven against the unthankfulness, prophaness and atheism of a malignant world. … Sometimes when men entertain the truth in profession, but not in the love of it and that endeared affection that is due thereunto, the Lord gives men up to the activity of error, as the apostle speaks, because they did not love that the trutb should be truth, they embraced falsehood instead of truth, that so they might be deluded and damned… He that will estrange his affection [to others] because of the difference of apprehension in things difficult, he must be a stranger to himself one time or other. If men would be tender and careful to keep off offensive expressions, they might keep some distance in opinion, in some things, without hazard to truth or love. But when men set up their sheaves (though it be but in a dream, as Joseph’s was) and fall out with every one that will not fall down and adore them, they will bring much trouble into the world, but little advantage to the truth or peace. Again, the Reader must know for his direction in this inquiry, my aim only was, and is, to lay down, and that briefly, the grounds of our practice, according to that measure of light I have received, and to give answer to such reasons which might seem to weaken the evidence thereof: declining purposely, for the present, the examination of such answers which are made to the arguments alledged by some of our reverend Brethren touching the same subject: because I would neither prejudice nor prevent their proper defense, which I do suppose in the fittest season they will so present unto the world as shall be fully satisfactory to such as love and desire the knowledge of the truth. The sum is, we doubt not what we practise, but it’s beyond all doubt that all men are liars and we are in the number of those poor feeble men; either we do, or may err, though we do not know it; what we have learned we do profess and yet profess still to live that we may learn. And therefore the errand upon which this present discourse is sent, is summarily to show these two things unto the world:

1. That there must be more said (than yet it has been my happiness to see) before the principles we profess will be shaken, and consequently it cannot be expected, that we should be unsetled in our practice.

2. That I might occasion men eminently gifted to make further search, and to dig deeper, that if there be any vein of reason which lies yet lower, it might be brought to light, and we profess and promise, not only a ready ear to hear it, but a heart willing to welcome it. It’s the perfection of a man, amidst these many weaknesses we are surrounded withal, by many changes to come to perfection. It’s the honour and conquest of a man truly wise to be conquered by the truth: and he has attained the greatest liberty that suffers himself to be led captive thereby. … In the handling of all these particulars, so full of difficulty and obscurity, I am not such a stranger at home, but that I am easily sensible of the weight of the matter and mine own weakness: and therefore I can professe in a word of truth that against mine own inclination and affection I was haled by importunity to this so hard a task, to kindle my rush candle, to join with the light of others, at least to occasion them to set up their lamps. Now He that is the way, the truth, and the life, pave out all the ways of his people and make their paths plain before them: Lead us all into that truth which will lead us unto eternall life: bring us once unto that impotency and impossibility that we can do nothing against the truth, but for it, that so our congregations may not only be styled as Ezekiel’s temple, but be really what was prophesied the Churches should be in these last days, Jehovah Shammah [the Lord is There]. In the arms of his everlasting mercy I leave thee…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“Truth is the daughter of time, was the saying of old, and our daily experience gives in evidence and proof hereof, to every man’s ordinary observation. Only as in other births, so here, the barrenness and fruitfulness of several ages, depend merely upon God’s good pleasure; who opens and shuts the womb of truth from bearing, as He sees fit, according to the counsel of his own will. Not that there is any change in the truth, but the alteration grows, according to men’s apprehensions, to whom it is more or less discovered, according to God’s most just judgment and their own deservings. Sometimes God makes an eclipse of the truth at midday, that so He might express his wrath from Heaven against the unthankfulness, prophaness and atheism of a malignant world. … Sometimes when men entertain the truth in profession, but not in the love of it and that endeared affection that is due thereunto, the Lord gives men up to the activity of error, as the apostle speaks, because they did not love that the trutb should be truth, they embraced falsehood instead of truth, that so they might be deluded and damned… He that will estrange his affection [to others] because of the difference of apprehension in things difficult, he must be a stranger to himself one time or other. If men would be tender and careful to keep off offensive expressions, they might keep some distance in opinion, in some things, without hazard to truth or love. But when men set up their sheaves (though it be but in a dream, as Joseph’s was) and fall out with every one that will not fall down and adore them, they will bring much trouble into the world, but little advantage to the truth or peace. Again, the Reader must know for his direction in this inquiry, my aim only was, and is, to lay down, and that briefly, the grounds of our practice, according to that measure of light I have received, and to give answer to such reasons which might seem to weaken the evidence thereof: declining purposely, for the present, the examination of such answers which are made to the arguments alledged by some of our reverend Brethren touching the same subject: because I would neither prejudice nor prevent their proper defense, which I do suppose in the fittest season they will so present unto the world as shall be fully satisfactory to such as love and desire the knowledge of the truth. The sum is, we doubt not what we practise, but it’s beyond all doubt that all men are liars and we are in the number of those poor feeble men; either we do, or may err, though we do not know it; what we have learned we do profess and yet profess still to live that we may learn. And therefore the errand upon which this present discourse is sent, is summarily to show these two things unto the world:

1. That there must be more said (than yet it has been my happiness to see) before the principles we profess will be shaken, and consequently it cannot be expected, that we should be unsetled in our practice.

2. That I might occasion men eminently gifted to make further search, and to dig deeper, that if there be any vein of reason which lies yet lower, it might be brought to light, and we profess and promise, not only a ready ear to hear it, but a heart willing to welcome it. It’s the perfection of a man, amidst these many weaknesses we are surrounded withal, by many changes to come to perfection. It’s the honour and conquest of a man truly wise to be conquered by the truth: and he has attained the greatest liberty that suffers himself to be led captive thereby. … In the handling of all these particulars, so full of difficulty and obscurity, I am not such a stranger at home, but that I am easily sensible of the weight of the matter and mine own weakness: and therefore I can professe in a word of truth that against mine own inclination and affection I was haled by importunity to this so hard a task, to kindle my rush candle, to join with the light of others, at least to occasion them to set up their lamps. Now He that is the way, the truth, and the life, pave out all the ways of his people and make their paths plain before them: Lead us all into that truth which will lead us unto eternall life: bring us once unto that impotency and impossibility that we can do nothing against the truth, but for it, that so our congregations may not only be styled as Ezekiel’s temple, but be really what was prophesied the Churches should be in these last days, Jehovah Shammah [the Lord is There]. In the arms of his everlasting mercy I leave thee…”

— Thomas Hooker, Survey of the Sum of Church-Discipline, … (London: Bellamy, 1648), Preface, no page numbers">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTruth+is+the+daughter+of+time%2C+was+the+saying+of+old%2C+and+our+daily+experience+gives+in+evidence+and+proof+hereof%2C+to+every+man%E2%80%99s+ordinary+observation.+Only+as+in+other+births%2C+so+here%2C+the+barrenness+and+fruitfulness+of+several+ages%2C+depend+merely+upon+God%E2%80%99s+good+pleasure%3B+who+opens+and+shuts+the+womb+of+truth+from+bearing%2C+as+He+sees+fit%2C+according+to+the+counsel+of+his+own+will.+Not+that+there+is+any+change+in+the+truth%2C+but+the+alteration+grows%2C+according+to+men%E2%80%99s+apprehensions%2C+to+whom+it+is+more+or+less+discovered%2C+according+to+God%E2%80%99s+most+just+judgment+and+their+own+deservings.+Sometimes+God+makes+an+eclipse+of+the+truth+at+midday%2C+that+so+He+might+express+his+wrath+from+Heaven+against+the+unthankfulness%2C+prophaness+and+atheism+of+a+malignant+world.+%E2%80%A6+Sometimes+when+men+entertain+the+truth+in+profession%2C+but+not+in+the+love+of+it+and+that+endeared+affection+that+is+due+thereunto%2C+the+Lord+gives+men+up+to+the+activity+of+error%2C+as+the+apostle+speaks%2C+because+they+did+not+love+that+the+trutb+should+be+truth%2C+they+embraced+falsehood+instead+of+truth%2C+that+so+they+might+be+deluded+and+damned%E2%80%A6+He+that+will+estrange+his+affection+%5Bto+others%5D+because+of+the+difference+of+apprehension+in+things+difficult%2C+he+must+be+a+stranger+to+himself+one+time+or+other.+If+men+would+be+tender+and+careful+to+keep+off+offensive+expressions%2C+they+might+keep+some+distance+in+opinion%2C+in+some+things%2C+without+hazard+to+truth+or+love.+But+when+men+set+up+their+sheaves+%28though+it+be+but+in+a+dream%2C+as+Joseph%E2%80%99s+was%29+and+fall+out+with+every+one+that+will+not+fall+down+and+adore+them%2C+they+will+bring+much+trouble+into+the+world%2C+but+little+advantage+to+the+truth+or+peace.+Again%2C+the+Reader+must+know+for+his+direction+in+this+inquiry%2C+my+aim+only+was%2C+and+is%2C+to+lay+down%2C+and+that+briefly%2C+the+grounds+of+our+practice%2C+according+to+that+measure+of+light+I+have+received%2C+and+to+give+answer+to+such+reasons+which+might+seem+to+weaken+the+evidence+thereof%3A+declining+purposely%2C+for+the+present%2C+the+examination+of+such+answers+which+are+made+to+the+arguments+alledged+by+some+of+our+reverend+Brethren+touching+the+same+subject%3A+because+I+would+neither+prejudice+nor+prevent+their+proper+defense%2C+which+I+do+suppose+in+the+fittest+season+they+will+so+present+unto+the+world+as+shall+be+fully+satisfactory+to+such+as+love+and+desire+the+knowledge+of+the+truth.+The+sum+is%2C+we+doubt+not+what+we+practise%2C+but+it%E2%80%99s+beyond+all+doubt+that+all+men+are+liars+and+we+are+in+the+number+of+those+poor+feeble+men%3B+either+we+do%2C+or+may+err%2C+though+we+do+not+know+it%3B+what+we+have+learned+we+do+profess+and+yet+profess+still+to+live+that+we+may+learn.+And+therefore+the+errand+upon+which+this+present+discourse+is+sent%2C+is+summarily+to+show+these+two+things+unto+the+world%3A%0A%0A1.+That+there+must+be+more+said+%28than+yet+it+has+been+my+happiness+to+see%29+before+the+principles+we+profess+will+be+shaken%2C+and+consequently+it+cannot+be+expected%2C+that+we+should+be+unsetled+in+our+practice.%0A%0A2.+That+I+might+occasion+men+eminently+gifted+to+make+further+search%2C+and+to+dig+deeper%2C+that+if+there+be+any+vein+of+reason+which+lies+yet+lower%2C+it+might+be+brought+to+light%2C+and+we+profess+and+promise%2C+not+only+a+ready+ear+to+hear+it%2C+but+a+heart+willing+to+welcome+it.+It%E2%80%99s+the+perfection+of+a+man%2C+amidst+these+many+weaknesses+we+are+surrounded+withal%2C+by+many+changes+to+come+to+perfection.+It%E2%80%99s+the+honour+and+conquest+of+a+man+truly+wise+to+be+conquered+by+the+truth%3A+and+he+has+attained+the+greatest+liberty+that+suffers+himself+to+be+led+captive+thereby.+%E2%80%A6+In+the+handling+of+all+these+particulars%2C+so+full+of+difficulty+and+obscurity%2C+I+am+not+such+a+stranger+at+home%2C+but+that+I+am+easily+sensible+of+the+weight+of+the+matter+and+mine+own+weakness%3A+and+therefore+I+can+professe+in+a+word+of+truth+that+against+mine+own+inclination+and+affection+I+was+haled+by+importunity+to+this+so+hard+a+task%2C+to+kindle+my+rush+candle%2C+to+join+with+the+light+of+others%2C+at+least+to+occasion+them+to+set+up+their+lamps.+Now+He+that+is+the+way%2C+the+truth%2C+and+the+life%2C+pave+out+all+the+ways+of+his+people+and+make+their+paths+plain+before+them%3A+Lead+us+all+into+that+truth+which+will+lead+us+unto+eternall+life%3A+bring+us+once+unto+that+impotency+and+impossibility+that+we+can+do+nothing+against+the+truth%2C+but+for+it%2C+that+so+our+congregations+may+not+only+be+styled+as+Ezekiel%E2%80%99s+temple%2C+but+be+really+what+was+prophesied+the+Churches+should+be+in+these+last+days%2C+Jehovah+Shammah+%5Bthe+Lord+is+There%5D.+In+the+arms+of+his+everlasting+mercy+I+leave+thee%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Hooker%2C+Survey+of+the+Sum+of+Church-Discipline%2C+%E2%80%A6+%28London%3A+Bellamy%2C+1648%29%2C+Preface%2C+no+page+numbers&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25a3563ea4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/25a3563ea4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-truth/#:~:text=Truth%20is%20the%20daughter%20of%20time,his%20everlasting%20mercy%20I%20leave%20thee&amp;text=Truth%20is%20the%20daughter%20of%20time%2C%20was%20the&amp;text=arms%20of%20his%20everlasting%20mercy%20I%20leave%20thee" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

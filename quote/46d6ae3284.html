<main class="wrap"><figure class="quote" id="q-46d6ae3284" data-kw="">
<blockquote><p>I am to shew what this state of wrath is. But who can fully describe the wrath of an angry God? None can do it. Yet so much of it must be discovered, as may serve to convince men of the absolute necessity of fleeing to Jesus Christ, out of that state of wrath. Anger in men is a passion, and commotion of the spirit for an injury received, with a desire to resent the same.

When it comes to a height, and is fixed in one’s spirit, it is called wrath. Now there are no passions in God, properly speaking: they are inconsistent with his absolute unchangeableness, and independency; and therefore Paul and Barnabas (to remove the mistake of the Lycaonians, who thought they were gods) tell them, they were men of like passions with themselves, Acts xiv. 15.

Wrath then is attributed to God, not in respect of the affection of wrath, but the effects thereof. Wrath is a fire in the bowels of a man, tormenting the man himself: but there is no perturbation in God. His wrath does not in the least mar that infinite repose and happiness, which he hath in himself. It is a most pure undisturbed act of his will producing dreadful effects against the sinner. It is little we know of an infinite God: but condescending to our weakness, he is pleased to speak of himself to us, after the manner of men. Let us therefore notice man’s wrath, but remove every thing in our consideration of the wrath of God, that argues imperfection: and so we may attain to some view of it, however scanty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 97.</span></figcaption>

<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>The other thing expressed in these invitations, is a sort of dislike, grief, or sorrow; (it’s a speech borrowed from man, for there is no disappointing of the Lord’s will, nor sorrow in him for the not fulfilling of it) or an earnest nilling and hating dislike, that these two should not go along, as approved efficaciously by us, to wit, the creatures obedience of Faith, and life eternal. God loveth, approveth the believing of Jerusalem, and of her children, as a moral duty, as the hen doth love to warm and nourish her chickens; and he hateth, with an exceeding and unfained dislike of improbation and hatred, their rebellious disobedience, and refusing to bee gathered: but there is no purpose, intention, or decree of God holden forth in these invitations called his revealed will, by which he saith, he intendeth and willeth that all he maketh the offer unto, shall obey and be saved.

But it’s to be observed, that the revealed will of God, holden forth to all, called voluntas signi, doth not hold forth formally, that God intendeth, decreeth, or purposeth in his eternal counsel, that any man shall actually obey, either elect or reprobate; it formally is the expression only of the good liking of that moral and duty-conjunction between the obedience of the creature, and the reward, but holdeth forth not any intention or decree of God, that any shall obey, or that all shall obey, or that none at all shall obey; and what Arminians say of Christ’s intention to die for all, and every one; and of the Lord’s intention and Catholic good will, to save all and every one; to wit, that these desires may be in God, though not any be saved at all, but all eternally perish, which maketh the Lord’s desires irrational, unwise, and frustraneous, that we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect, though not any one of men or Angel obey, if there were not going along with this will of God, another will, and eternal decree and purpose in God, of working by free grace in some chosen ones, what the Lord willeth in his approving will; and another decree in the which the Lord purposeth to deny his saving grace, upon his absolute liberty to others, that being left to the hardness of their own hearts, they may freely disobey, and be the sole Author’s of their own damnation. Now because Arminians deny any such two decrees in God, but assert only such as depend wholly in their fulfilling, on the free will of Men and Angels, and all the decrees of God may be frustrated and disappointed by Men and Angels; as if the poor short-sighted creature, not the Sovereign Creator were carver, and Lord of the decrees, and Master of work in fulfilling of these counsels.

We reject their Catholic intentions and decrees, to save and redeem all and every one, which they vainly fancy to be in God, as repugnant to his will, which is irresistible, and cannot miss its end. 2. To his immutability, which cannot be compelled to take a second port, whereas he cannot sail the first. 3. To his Omnipotency, who cannot be resisted, 4. To his happiness, who cannot come short of what his soul desires. 5. To his wisdom, who cannot aim at an end, and desire it with his soul, and go about it, by such means, as he seeth shall be utterly uneffectual, and never produce his end, and not use these means, which he knoweth may, and infallibly doth, produce the same end in others.

Now this desire of approbation is an abundantly sufficient closing of the mouth, of such as stumble at the Gospel, being appointed thereunto, and an expression of Christ’s good liking to save sinners. Expressed in his borrowed wishes, Deut. 5.29. O that there were such a heart in them, that they would fear me, and keep my commandments. Psal. 81.13. O that my people had hearkened unto me, and Israel walked in my ways. Which wish, as relating to disobeying Israel, is a Figure, or Metaphor borrowed from men, but otherwise sheweth how acceptable the duty is to God, how obligatory to the creature. 2. By the Lord’s expostulations, Ezek. 18.31 Why will ye die, O house of Israel. Verse 32. For I have no pleasure in the death of him that dies. 3. In the Lord’s crying to sinners. Prov. 1.20. Wisdom cries, she uttereth her voice in the streets. The Word is to cry with strong shouting, either for joy, Psalm. 81.2. or sorrow, Lament. 2.19. which expresseth Christ’s desire to save sinners.</p></blockquote>

— Samuel Rutherford, Christ dying and drawing sinners to himself, or, A survey of our Saviour in his soul-suffering, his loveliness in his death, and the efficacy thereof, (London: Andrew Crooke, 1647), Part III, pp 443-45.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+other+thing+expressed+in+these+invitations%2C+is+a+sort+of+dislike%2C+grief%2C+or+sorrow%3B+%28it%E2%80%99s+a+speech+borrowed+from+man%2C+for+there+is+no+disappointing+of+the+Lord%E2%80%99s+will%2C+nor+sorrow+in+him+for+the+not+fulfilling+of+it%29+or+an+earnest+nilling+and+hating+dislike%2C+that+these+two+should+not+go+along%2C+as+approved+efficaciously+by+us%2C+to+wit%2C+the+creatures+obedience+of+Faith%2C+and+life+eternal.+God+loveth%2C+approveth+the+believing+of+Jerusalem%2C+and+of+her+children%2C+as+a+moral+duty%2C+as+the+hen+doth+love+to+warm+and+nourish+her+chickens%3B+and+he+hateth%2C+with+an+exceeding+and+unfained+dislike+of+improbation+and+hatred%2C+their+rebellious+disobedience%2C+and+refusing+to+bee+gathered%3A+but+there+is+no+purpose%2C+intention%2C+or+decree+of+God+holden+forth+in+these+invitations+called+his+revealed+will%2C+by+which+he+saith%2C+he+intendeth+and+willeth+that+all+he+maketh+the+offer+unto%2C+shall+obey+and+be+saved.%0A%0ABut+it%E2%80%99s+to+be+observed%2C+that+the+revealed+will+of+God%2C+holden+forth+to+all%2C+called+voluntas+signi%2C+doth+not+hold+forth+formally%2C+that+God+intendeth%2C+decreeth%2C+or+purposeth+in+his+eternal+counsel%2C+that+any+man+shall+actually+obey%2C+either+elect+or+reprobate%3B+it+formally+is+the+expression+only+of+the+good+liking+of+that+moral+and+duty-conjunction+between+the+obedience+of+the+creature%2C+and+the+reward%2C+but+holdeth+forth+not+any+intention+or+decree+of+God%2C+that+any+shall+obey%2C+or+that+all+shall+obey%2C+or+that+none+at+all+shall+obey%3B+and+what+Arminians+say+of+Christ%E2%80%99s+intention+to+die+for+all%2C+and+every+one%3B+and+of+the+Lord%E2%80%99s+intention+and+Catholic+good+will%2C+to+save+all+and+every+one%3B+to+wit%2C+that+these+desires+may+be+in+God%2C+though+not+any+be+saved+at+all%2C+but+all+eternally+perish%2C+which+maketh+the+Lord%E2%80%99s+desires+irrational%2C+unwise%2C+and+frustraneous%2C+that+we+say+with+good+reason+of+God%E2%80%99s+good+will%2C+called+voluntas+signi%2C+it+might+have+its+complete+and+entire+end+and+effect%2C+though+not+any+one+of+men+or+Angel+obey%2C+if+there+were+not+going+along+with+this+will+of+God%2C+another+will%2C+and+eternal+decree+and+purpose+in+God%2C+of+working+by+free+grace+in+some+chosen+ones%2C+what+the+Lord+willeth+in+his+approving+will%3B+and+another+decree+in+the+which+the+Lord+purposeth+to+deny+his+saving+grace%2C+upon+his+absolute+liberty+to+others%2C+that+being+left+to+the+hardness+of+their+own+hearts%2C+they+may+freely+disobey%2C+and+be+the+sole+Author%E2%80%99s+of+their+own+damnation.+Now+because+Arminians+deny+any+such+two+decrees+in+God%2C+but+assert+only+such+as+depend+wholly+in+their+fulfilling%2C+on+the+free+will+of+Men+and+Angels%2C+and+all+the+decrees+of+God+may+be+frustrated+and+disappointed+by+Men+and+Angels%3B+as+if+the+poor+short-sighted+creature%2C+not+the+Sovereign+Creator+were+carver%2C+and+Lord+of+the+decrees%2C+and+Master+of+work+in+fulfilling+of+these+counsels.%0A%0AWe+reject+their+Catholic+intentions+and+decrees%2C+to+save+and+redeem+all+and+every+one%2C+which+they+vainly+fancy+to+be+in+God%2C+as+repugnant+to+his+will%2C+which+is+irresistible%2C+and+cannot+miss+its+end.+2.+To+his+immutability%2C+which+cannot+be+compelled+to+take+a+second+port%2C+whereas+he+cannot+sail+the+first.+3.+To+his+Omnipotency%2C+who+cannot+be+resisted%2C+4.+To+his+happiness%2C+who+cannot+come+short+of+what+his+soul+desires.+5.+To+his+wisdom%2C+who+cannot+aim+at+an+end%2C+and+desire+it+with+his+soul%2C+and+go+about+it%2C+by+such+means%2C+as+he+seeth+shall+be+utterly+uneffectual%2C+and+never+produce+his+end%2C+and+not+use+these+means%2C+which+he+knoweth+may%2C+and+infallibly+doth%2C+produce+the+same+end+in+others.%0A%0ANow+this+desire+of+approbation+is+an+abundantly+sufficient+closing+of+the+mouth%2C+of+such+as+stumble+at+the+Gospel%2C+being+appointed+thereunto%2C+and+an+expression+of+Christ%E2%80%99s+good+liking+to+save+sinners.+Expressed+in+his+borrowed+wishes%2C+Deut.+5.29.+O+that+there+were+such+a+heart+in+them%2C+that+they+would+fear+me%2C+and+keep+my+commandments.+Psal.+81.13.+O+that+my+people+had+hearkened+unto+me%2C+and+Israel+walked+in+my+ways.+Which+wish%2C+as+relating+to+disobeying+Israel%2C+is+a+Figure%2C+or+Metaphor+borrowed+from+men%2C+but+otherwise+sheweth+how+acceptable+the+duty+is+to+God%2C+how+obligatory+to+the+creature.+2.+By+the+Lord%E2%80%99s+expostulations%2C+Ezek.+18.31+Why+will+ye+die%2C+O+house+of+Israel.+Verse+32.+For+I+have+no+pleasure+in+the+death+of+him+that+dies.+3.+In+the+Lord%E2%80%99s+crying+to+sinners.+Prov.+1.20.+Wisdom+cries%2C+she+uttereth+her+voice+in+the+streets.+The+Word+is+to+cry+with+strong+shouting%2C+either+for+joy%2C+Psalm.+81.2.+or+sorrow%2C+Lament.+2.19.+which+expresseth+Christ%E2%80%99s+desire+to+save+sinners.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+dying+and+drawing+sinners+to+himself%2C+or%2C+A+survey+of+our+Saviour+in+his+soul-suffering%2C+his+loveliness+in+his+death%2C+and+the+efficacy+thereof%2C+%28London%3A+Andrew+Crooke%2C+1647%29%2C+Part+III%2C+pp+443-45.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8736c5415.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8736c5415.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/28/samuel-rutherford-on-gospel-invitations-divine-intentions-and-anthropopathisms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The properties of God are either absolute or relative. The absolute properties of God are such as may be considered without the supposition of any thing else whatever, towards which their energy and efficacy should be exerted. His relative are such as, in their egress and exercise, respect some things in the creatures, though they naturally and eternally reside in God. Of the first sort is God’s immensity ; it is an absolute property of his nature and being. For God to be immense, infinite, unbounded, unlimited, is as necessary to him as to be God ; that is, it is of his essential perfection so to be. The ubiquity of God, or his presence to all things and persons, is a relative property of God ; for to say that God is present in and to all things supposes those things to be. Indeed, the ubiquity of God is the habitude of his immensity to the creation. Supposing the creatures, the world that is, God is by reason of his immensity indistant to them all;</p></blockquote>

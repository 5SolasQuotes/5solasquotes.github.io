<main class="wrap"><figure class="quote" id="q-8b4ec1842b" data-kw="">
<blockquote><p>The Anatomie of Abuses probably carried additional weight with a certain class, because in its attitude toward the drama it took in the first edition a liberal position. The preface of that edition was careful to explain that its author did not condemn all plays. ‘Who seeth not,’ it read, ‘that some kind of playes, tragedies and enterluds, in their own nature are not onely of great ancientie, but also very honest and very commendable exercyses,’ containing matter ‘both of doctrine, erudition, good example, and wholsome instruction; And may be vsed, in tyme and place conuenient, as conducible to example of life and reformation of maners.’ In thus commending ‘honest &amp; chast playes’ as a Godly recreation of the min,’ and as a ‘good example of life,’ Stubbes advanced close to Lodge’s position. Yet, strange to say, in all subsequent editions this explanatory preface was left out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-stubbes.html">Philip Stubbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Stubbes’ Outlook | Elbert N.S. Thompson, XX. The Controversy Between the Puritans &amp; the Stage in Yale Studies in English PhD diss. (NY: Henry Holt &amp; Co., 1903)</cite>, pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45f71fc1a4" data-kw="">
<blockquote><p>2. Rulers may not make laws of things having no necessity of goodness, decency and aptness to edify, and [they are] only [deemed] good because they will, when they see, of necessity, these laws shall inevitably ruin many souls; for that is to have more regard to their own will than to the salvation of people’s souls, whereas even Christ pleased not Himself.</p></blockquote>

</figure><figure class="quote" id="q-7b6f423734" data-kw="">
<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts, in public, solemn prayer by the Prescribed Forms of Others… (London: 1679), ch. 4</cite>, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-2fa8532c27" data-kw="">
<blockquote><p>They [congregationalists] count it necessary that all the church officers should live upon the charge of the congregation, the ruling elders and deacons as well as the pastors and doctors; but all they will have them to receive, is a mere alms, a voluntary contribution, laid down as an offering at the deacons’ feet every Lords Day, and by him distributed to all the officers and the poor of the congregation according as they have need. This is their doctrine, but it seems they are weary long ago of its practice.</p></blockquote>

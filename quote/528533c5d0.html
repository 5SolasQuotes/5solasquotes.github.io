<main class="wrap"><figure class="quote" id="q-528533c5d0" data-kw="">
<blockquote><p>But they say immediately, ‘We teach that these images are not to be worshipped.’ As if, in fact, says [Jerome] Zanchius (De Imagin., col. 402), ‘God had not once rather diligently done the same thing through Moses and the prophets, that we are doing. So then why did He even want all images abolished? Because it is not enough to teach by word that an evil thing must not be done; but the slight obstacles, the incentives, the causes, the occasions of evil doing must be abolished.’ It is not enough, with the scribes and Pharisees, to teach out of Moses’ chair what the people should do, but all occasions, yea, appearances of evil, are to be taken out of their sight. ‘Those things affect more powerfully, and affect more, which fall upon the eyes than those which fell upon the ears. And so Hezekiah had been able to warn the people not to worship the serpent, but he preferred to break it in pieces and completely remove it from visibility,’ says one well to this purpose. (Thomas Naogeorgus [Kirchmeyer] in 1 Jn 5:21)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (Naphtali Press, 1993) | Part 3, Ch. 2</cite>, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

er%5D%20in%201%20Jn%205%3A21" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d25546976b" data-kw="">
<blockquote><p>The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works… ed. Edward Hickman (London: Ball, 1840) | Types of the Messiah, p. 653</cite>, vol. 2</span></figcaption>

</figure><figure class="quote" id="q-034cea6e81" data-kw="">
<blockquote><p>…as Papists say, their unwritten traditions are agreeable to the Word, and though beside Scripture, yet not against it: and [are] the very will of God no less than the written Word; and let Formalists assure us that their positive additaments of surplice and cross are the same which God commands in the Scriptures by the prophets and apostles, and though beside, yet not contrary to the Word: But I pray you what better is the distinction of beside the Word, not contrary to the Word of God, out of the mouth of Papists, to maintain unwritten traditions, which to them is the express Word of God, than out of the mouth of Formalists, for their unwritten positives, which are worse than Popish traditions in that they are not the express Word of God, by their own grant?</p></blockquote>

</figure><figure class="quote" id="q-e82de1bc9b" data-kw="">
<blockquote><p>But this sacred and holy image [of the glorified Christ in Rev. 1] instructs in all these points all the faithful of Christ most fully. Howbeit this image of Christ is not to be set forth with colors, since that colors cannot attain to the majesty thereof: but with the ecclesiastical doctrine, which has the promises of the Spirit of Christ: And is therefore more evident, and only meet for the true expressing thereof. Let us also print the same image, not upon any dead table with colors that will perish and fade, but in our hearts through the lively Spirit of God, which may also keep it in our minds, never to be wiped out.</p></blockquote>

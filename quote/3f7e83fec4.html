<blockquote><p>We come now to the principal relics of our Lord, viz., those connected with his sufferings and death. And, first, let us consider the case of the cross on which he was suspended. I know it is regarded as a certain fact, that Helena, the mother of the Emperor Constantine, discovered it. And I am not ignorant of what ancient Doctors have written, to prove that it undoubtedly was the cross on which our Saviour was crucified. Let all those have their due credit, though it was vain curiosity, or ill-judged religious zeal, that caused Helena to make the search for it. But assuming that her exertions to find out the cross are worthy of all praise, and that our Lord himself, after it was found, miraculously declared that it was truly his cross, let us see how the matter is to be viewed with reference to our own times. The cross which Helena found is said to be still at Jerusalem. And no one calls this in question, though it is plainly inconsistent with ecclesiastical history, which relates that Helena sent part of it to the emperor her son, by whom it was placed on a pillar of porphyry at Constantinople; and that she inclosed the remainder in a silver chest, which she gave to the Bishop of Jerusalem for preservation. Therefore, we must either accuse the history of falsehood, or the things told of the true cross in the present day are utterly vain and frivolous. Again, let us consider how many fragments of it are scattered up and down over the whole globe. A mere enumeration of those of which I have a catalogue would certainly fill a goodly volume. There is no town, however small, which has not some morsel of it, and this not only in the principal cathedral church of the district, but also in parish churches. There is no abbey so poor as not to have a specimen. In some places, larger fragments exist, as at Paris, in the Holy Chapel, at Poictiers, and at Rome, where a crucifix of tolerable size is said to have been entirely made out of it. In fine, if all the pieces which could be found were collected into a heap, they would form a good ship-load, though the gospel testifies, that a single individual was able to carry it. What effrontery, then, thus to fill the whole world with fragments, which it would take more than three hundred men to carry? But they have fallen upon an explanation, and it is, that how much soever may be cut from it, it never grows less. But this device is too foolish and absurd for the superstitious themselves not easily to see through it. I leave it to all men to consider what certainty can be had as to the genuineness of all the pieces of wood which are worshipped in all the different places as the true cross. Whence certain fragments were brought, and by what way and means, I omit to say; some affirming that they were brought to them by angels, others that they dropt from heaven. Those of Poictiers say, that the piece which they have was stolen by a maid-servant of Helena, and carried off, and that she having afterwards fled, brought it, in the course of her wanderings, into that district. They also add to the story that she was lame. Such are the illustrious grounds on which they stimulate the wretched populace to idolatry. And not contented with imposing on the rude and ignorant, by displaying a piece of common wood as the wood of the cross, they have declared it every way worthy of adoration. The doctrine is altogether devilish, and Ambrose expressly condemns it as heathen superstition. Next after the cross comes the title which Pilate ordered to be affixed to it, and on which he wrote, “Jesus of Nazareth, King of the Jews.” But we must know the time, place, and manner, of its being found. It will be said that Socrates, the Ecclesiastical Historian, makes mention of it. This I admit. But he says nothing as to what became of it, and hence his testimony is of no great weight. Besides, that inscription having been written hastily, and on the spur of the moment, after our Saviour had been actually crucified, it is most irrational to suppose that it was a picture painted skillfully as for display. Were only one exhibited, it might deservedly be deemed false and fictitious, but when the people of Tholouse say that they have it, and those of Rome contradict them, and show it in the church of Santa Croce, they convict each other of falsehood. Let them, therefore, debate the matter among themselves as long as they please; in the end, if all things are duly examined, both will be proved false. There is a still greater controversy as to the nails. I will mention those of which I have heard, and from them the merest child will judge how grossly the devil had deluded mankind, after having deprived them of all sense and reason, and so made them incapable of exercising any discernment in the matter. If ancient writers, and especially Theodoret, the historian of the ancient Church, say true, Helena ordered one to be fixed in her son’s helmet, and the other two to be fitted to his horse’s bridle. Yet Ambrose does not express an unqualified assent. For he says, that one was fixed in the crown of Constantine, that his horse-bit was made of the second, and that Helena kept the third to herself. We thus see, that twelve hundred years ago there was a controversy as to what became of the nails. What certainty, then, can we now have? The Milanese boast of having the one which was fitted to the horse’s bridle, while the inhabitants of Carpentras interpose, and claim it for themselves. But Ambrose does not say at all that it was fitted to the bit, but that it was made into a bit, an account which cannot by any possibility agree with what is affirmed by the inhabitants of Milan and of Carpentras. There are also two nails at Rome, one in the church of St Helena, and another in that of Santa Croce. Then there is one at Sienna, another at Venice, two in Germany, viz. at Cologne, in the church of the Three Maries, and at Treves. In France, there is one in the Holy Chapel, another in the possession of the Carmelites, another at the church of St Denis, in the Isle of France, another at Bourges, another in the Abbey of Ciseaux, and another at Draguignan. Here we have them to the number of fourteen. Moreover, each place seems confident of the sufficiency of the proof in its favour. One thing certainly I will concede, that all the claims are equally good, and hence nothing is simpler than to pass the same sentence upon all, namely, to account them all, in spite of their boasting, to be spurious. There is no other way of unravelling the matter.</p></blockquote>

<blockquote><p>If truly the consequence is made good only by the will of governors, then this consequence will be valid: All such things are orderly and decent; therefore, let the calf of Aaron be made and openly worshiped, for worship in such a visible way is by [the will of] the governors. A good consequence is one which stands indivisible: then it is a good consequence or not a good consequence. This consequence, however, where the truth has been mixed, depending partly on reason and partly on the will of men, is nothing.</p></blockquote>

— Samuel Rutherford, Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter tr. Charles Johnson &amp; Travis Fentiman (1638-1642; 1668; RBO, 2019), ch. 1, section 17, p. 48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+truly+the+consequence+is+made+good+only+by+the+will+of+governors%2C+then+this+consequence+will+be+valid%3A+All+such+things+are+orderly+and+decent%3B+therefore%2C+let+the+calf+of+Aaron+be+made+and+openly+worshiped%2C+for+worship+in+such+a+visible+way+is+by+%5Bthe+will+of%5D+the+governors.+A+good+consequence+is+one+which+stands+indivisible%3A+then+it+is+a+good+consequence+or+not+a+good+consequence.+This+consequence%2C+however%2C+where+the+truth+has+been+mixed%2C+depending+partly+on+reason+and+partly+on+the+will+of+men%2C+is+nothing.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Rutherford%E2%80%99s+Examination+of+Arminianism%3A+the+Tables+of+Contents+with+Excerpts+from+Every+Chapter+tr.+Charles+Johnson+%26+Travis+Fentiman+%281638-1642%3B+1668%3B+RBO%2C+2019%29%2C+ch.+1%2C+section+17%2C+p.+48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17c8f5d1fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17c8f5d1fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=If%20truly%20the%20consequence%20is%20made,the%20will%20of%20men%2C%20is%20nothing&amp;text=If%20truly%20the%20consequence%20is%20made%20good%20only&amp;text=partly%20on%20the%20will%20of%20men%2C%20is%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…we would not only fall down upon our faces and give him thanks, but with loud voices would we praise Him, and in the midst of the congregation would we extol his name, as David and Asaph do almost in every psalm. For doubtless whoso believeth that God loveth him, and feeleth by his faith, that he hath forgiven him all his sins, and careth for him… shall be compelled by the Spirit of God to break out into praise and thanksgiving therefore… but shall cry and call upon them, as David doth, saying: “Praise the Lord with me, and let us magnify his name together. I sought the Lord, and He heard me, yea, He delivered me out of all my fear.”… Yea, would God that our minstrels had none other thing to play upon, neither our carters and ploughmen other thing to whistle upon, save psalms, hymns, and such godly songs as David is occupied withal! And if women, sitting at their rocks [instruments used in spinning], or spinning at the wheels, had none other songs to pass their time withal, than such as Moses’ sister, Glehana’s [Elkanah’s] wife, Debora, and Mary the mother of Christ, have sung before them, they should be better occupied than with ‘hey nony nony, hey troly loly,’ and such like fantasies. If young men also that have the gift of singing, took their pleasure in such wholesome ballads as the [apocryphal] three children sing in the fire, and as Jesus the Son of Sirac doth in his last chapter, it were a token, both that they felt some spark of God’s love in their hearts, and that they also had some love unto Him; for truly, as we love, so sing we… Seeing then that, as the prophet David saith, it is so good and pleasant a thing to praise the Lord, and so expedient for us to be thankful (Ps. 147); therefore, to give our youth of England some occasion to change their foul and corrupt ballads into sweet songs and spiritual hymns of God s honor, and for their own consolation in him, I have here, good reader, set out certain comfortable songs grounded on God’s Word, and taken some out of the holy scripture, specially out of the Psalms of David, all whom would God that our musicians would learn to make their songs! and if they which are disposed to be merry, would in their mirth follow the counsel of St. Paul and St. James (Col. 3; James 5), and not to pass their time in naughty songs of fleshly love and wantonness, but with singing of psalms, and such songs as edify, and corrupt not men’s conversation. … The children of Israel in the old time, when God had delivered them from their enemies, gave thanks unto Him, and made their song of Him, as thou seest by Moses, Barak, David, and other more. Why should not we then make our songs and mirth of God, as well as they? Hath He not done as much for us as for them? Hath He not delivered us from as great troubles as them? Yes, doubtless. Why should He not then be our pastime, as well as theirs? As for such psalms as the scripture describeth (beside the great consolation that they bring into the heart of the spiritual singer) they do not only cause him to spend his time well by exercising himself in the sweet Word of God; but through such ensamples they provoke other men also unto the praise of God and virtuous living. And this is the very right use wherefore psalms should be sung; namely, to comfort a man’s heart in God, to make him thankful, and to exercise him in his Word, to encourage him in the way of godliness, and to provoke other men unto the same. By this thou mayest perceive, what spiritual edifying cometh of godly psalms and songs of God s Word; and what inconvenience foloweth the corrupt ballads of this vain world. …</p></blockquote>

<blockquote><p>Goodwin’s argument makes as much against Christ and the apostles as against us, for they could never in all their sermons and writings so frequently bottom and found the faith on &lt;Greek&gt; ‘as it is written in the Prophets,’ ‘as David saith,’ ‘as Isaiah saith,’ and Hosea, ‘as Daniel saith,’ as Moses and Samuel, and all the Prophets bear witness, if they had had no other certainty, that the writings of the Prophets, that came to their hands, was the very word of God, but the credit, learning and authority of men, as Mr. [John] Goodwin says, for sure Christ and the apostles and evangelists had not the authentic and first copies of Moses and the prophets, but only copies written by men, who might mistake, printers and translators not being then, more than now, immediately inspired Prophets, but fallibly men, and obnoxious to failings, mistakes and ignorance of ancient Hebraisms and force of words; and if ye remove an unerring providence, who doubts but men might add a &lt;Hebrew&gt; or subtract, and so vitiate the fountain sense? and omit points, change consonants, which in the Hebrew and Greek, both might quite alter the sense: Nor can any say, ‘Christ and the Apostles being infallible, could well cite the prophets without a mistake, though the copies might have been vitiate and corrupt, 2. Because the very citing of these testimonies by Christ and his apostles, made them Scripture, and so of infallible authority; but our citing of them, (since both printers and translators are not immediately inspired, and we also might err) cannot adopt them into canonical and authentic Scripture, such as was first written by the immediately inspired prophets.’ I shall answer that first, this objection presumes that Christ and the apostles might, and did, find errors and mis-printings even in written Scripture, which might reduce the Church in after ages to an invincible ignorance in matters of faith, and yet they gave no notice to the Church thereof; or if there was no error de facto, then for so many hundred years, yet there are now substantial errors, and so foul that it may be we have no Word of God at all, amongst us, and God has no Church, no believer on earth, but we must all take the word of printers and translators, which is merely the word of man: And what is become of all the martyrs that suffered by the bloody woman Babel? They died for mere conjectures and opinions, for they had not the first original copies of Moses and the Prophets, yea Stephen the first martyr, who according to all our copies, Acts 7, adds five to Moses, his 70 souls, that went down to Egypt, in that glorious sermon that he has before his death, when he sealed the truth with his blood and died gloriously, and said, ‘Lord Jesus receive my spirit,’ died but upon the faith of men’s fallible skill in grammar, printing and writing; for he cites the writings of Moses to his enemies that stoned him, according to the copies that they then had, who would quickly have controlled him if he had cited false copies, and Stephen’s own testimony was controverter, and therefore except we say that Stephen and Christ and the apostles cited the testimonies of the prophets as they were then obvious to the eyes and reading of both the people of God and the enemies, and that not simply as their own words which they spake as immediately inspired, but as the testimony of the prophets, according to the then written copies, we must say they spake not ingeniously the truth of God, for it was against truth, candor, ingenuity, to Christ and the apostles to say, ‘as it is written in your Law,’ John 8:17, and so often ‘it is written,’ if they would not have the hearers to receive with certainty of faith and full assurance, free from all doubting and fear of humane fallibility, that what they cited as written, was undoubtedly the same very truth of God, and no other, which Moses and the prophets spoke and wrote; and if they would not have them to read, search and believe these same Scriptures, and to conceive that they drew arguments in the New Testament to prove and confirm their doctrine from that which was written by Moses and the prophets in the Old Testament, and would not have them to believe them, only because New Testament writers immediately inspired had so said. 6. If God will have us to try and examine all spirits, all doctrines, by the Scriptures written, then are we certainly assured that the books we now have of the Old and New Testament, are the very Word of God, though we cannot by any possibility have the first and original authentic copies of Moses and the prophets and apostles. Because 1. God would not bid us try, and then leave us no rule to try withal but our own natural light, which must lead us into darkness. 2. The visible Church should not be guilty of unbelief if the written Word were not among us, or then Christ and his apostles speaking to us, as is clear, John 15:22; Rom. 10:14-15; Mt. 11:21-22. The assumption is clear by the commended practice of the Bereans, who tried Paul’s doctrine by the Scriptures, Acts 17. See Rivetus, Whitaker, Calvin. 3. By the command of God, 1 Thess. 5:2; 1 John 4:1; ‘Try all things,’ ‘try the sprits.’ 7. John would not call those blessed who read and hear, Rev. 1:5, nor would Paul recommend reading to Timothy, and continuance in the doctrine of the Scriptures, and so extol the necessity and utility of the Scripture and the indwelling of the word of God in us as he does, 1 Tim. 4:16; 2 Tim. 3:14-16; Col. 3:16, nor could the things written by John ch. 21, by Moses and the prophets, Luke 16:29-31, be holden forth as sufficient to bring souls to heaven, and to cause them eschew Hell, if it were true that we ‘have no certainty that the Scripture of the old and New Testament are the very word of God, but such as is made of men’s credit and learning.’ 8. Yea and so what God spake immediately to Abraham, Moses and the prophets, could not be infallibly and by certainty of faith to them the Word of God; for if God spake to them in a language intelligible, they had no certainty of faith that the words that came from God did signify thus and thus; for sure, God, by immediate inspiration, taught them not grammar and significations of words, and those that read the Law written by God’s finger on two tables of stone, those who heard Moses and the prophets preach in their mother-tongue, even the Jews who read the original first Hebrew copy of Moses and the prophets, must have had no warrant that that was the Word of God, but the authority of father, mother and nurses, who first taught them their mother-tongue, for sure the prophets were not school-masters to teach them Hebrew; so by this learning there was never since the world was any certainty of faith, but such conjectural human and fallible opinions in all the matters of God as is resolved ultimately (says Mr. Goodwin) into men’s fallible and topic authority and skill of grammar, and all divine faith is perished out of the earth, except God by a supernatural power taught men first grammar, and then to believe, for which we have no warrant, so all our faith must be dreams. And since Mr. Goodwin acknowledges a supernatural power of the Spirit of grace to believe; what else does this Spirit cause us believe, but lies? or at best fancies resolved into human credit? which may be false for any certainty of knowledge that Libertines allow us? … May not reading, interpunction, a parenthesis, a letter, an accent, alter the sense of all fundamentals in the Decalogue? of the principles of the Gospel? and turn the Scripture in all points (which Mr. Doctour restricts to some few darker places, whose senses are off the way to heaven, and less necessary) in a field of problems, and turn all believing into digladiations of wits? all our comforts of the Scriptures into the reelings of a Windmill, and fancies of seven moons at once in the firmament? this is to put our faith and the first-fruits of the Spirit, and Heaven and Hell to the press. But though printers and pens of men may err, it follows not ‘that heresies should be tolerated,’ except we say, 1. that our faith is ultimately resolved upon characters, and the faith of printers. 2. We must say we have not the clear and infallible word of God, because the Scripture comes to our hand by fallible means, which is a great inconsequence, for though scribes, translators, grammarians, printers, may all err, it follows not that an erring providence of Him that has seven eyes, has not delivered to the Church, the Scriptures containing the infallible truth of God. Say that Baruch might err in writing the prophesy of Jeremiah, it follows not that the prophesy of Jeremiah, which we have, is not the infallible Word of God; if all translators and printers did their alone watch over the Church, it were something, and if there were not one with seven eyes to care for the Scripture. But for tradition, councils, popes, fathers, they are all fallible means, and so far forth to be believed as they bring Scripture with them.</p></blockquote>

ice to the Church thereof; or if there was no error de facto, then for so many hundred years, yet there are now substantial errors, and so foul that it may be we have no Word of God at all, amongst us, and God has no Church, no believer on earth, but we must all take the word of printers and translators, which is merely the word of man: And what is become of all the martyrs that suffered by the bloody woman Babel? They died for mere conjectures and opinions, for they had not the first original copies of Moses and the Prophets, yea Stephen the first martyr, who according to all our copies, Acts 7, adds five to Moses, his 70 souls, that went down to Egypt, in that glorious sermon that he has before his death, when he sealed the truth with his blood and died gloriously, and said, ‘Lord Jesus receive my spirit,’ died but upon the faith of men’s fallible skill in grammar, printing and writing; for he cites the writings of Moses to his enemies that stoned him, according to the copies that they then had, who would quickly have controlled him if he had cited false copies, and Stephen’s own testimony was controverter, and therefore except we say that Stephen and Christ and the apostles cited the testimonies of the prophets as they were then obvious to the eyes and reading of both the people of God and the enemies, and that not simply as their own words which they spake as immediately inspired, but as the testimony of the prophets, according to the then written copies, we must say they spake not ingeniously the truth of God, for it was against truth, candor, ingenuity, to Christ and the apostles to say, ‘as it is written in your Law,’ John 8:17, and so often ‘it is written,’ if they would not have the hearers to receive with certainty of faith and full assurance, free from all doubting and fear of humane fallibility, that what they cited as written, was undoubtedly the same very truth of God, and no other, which Moses and the prophets spoke and wrote; and if they would not have them to read, search and believe these same Scriptures, and to conceive that they drew arguments in the New Testament to prove and confirm their doctrine from that which was written by Moses and the prophets in the Old Testament, and would not have them to believe them, only because New Testament writers immediately inspired had so said. 6. If God will have us to try and examine all spirits, all doctrines, by the Scriptures written, then are we certainly assured that the books we now have of the Old and New Testament, are the very Word of God, though we cannot by any possibility have the first and original authentic copies of Moses and the prophets and apostles. Because 1. God would not bid us try, and then leave us no rule to try withal but our own natural light, which must lead us into darkness. 2. The visible Church should not be guilty of unbelief if the written Word were not among us, or then Christ and his apostles speaking to us, as is clear, John 15:22; Rom. 10:14-15; Mt. 11:21-22. The assumption is clear by the commended practice of the Bereans, who tried Paul’s doctrine by the Scriptures, Acts 17. See Rivetus, Whitaker, Calvin. 3. By the command of God, 1 Thess. 5:2; 1 John 4:1; ‘Try all things,’ ‘try the sprits.’ 7. John would not call those blessed who read and hear, Rev. 1:5, nor would Paul recommend reading to Timothy, and continuance in the doctrine of the Scriptures, and so extol the necessity and utility of the Scripture and the indwelling of the word of God in us as he does, 1 Tim. 4:16; 2 Tim. 3:14-16; Col. 3:16, nor could the things written by John ch. 21, by Moses and the prophets, Luke 16:29-31, be holden forth as sufficient to bring souls to heaven, and to cause them eschew Hell, if it were true that we ‘have no certainty that the Scripture of the old and New Testament are the very word of God, but such as is made of men’s credit and learning.’ 8. Yea and so what God spake immediately to Abraham, Moses and the prophets, could not be infallibly and by certainty of faith to them the Word of God; for if God spake to them in a language intelligible, they had no certainty of faith that the words that came from God did signify thus and thus; for sure, God, by immediate inspiration, taught them not grammar and significations of words, and those that read the Law written by God’s finger on two tables of stone, those who heard Moses and the prophets preach in their mother-tongue, even the Jews who read the original first Hebrew copy of Moses and the prophets, must have had no warrant that that was the Word of God, but the authority of father, mother and nurses, who first taught them their mother-tongue, for sure the prophets were not school-masters to teach them Hebrew; so by this learning there was never since the world was any certainty of faith, but such conjectural human and fallible opinions in all the matters of God as is resolved ultimately (says Mr. Goodwin) into men’s fallible and topic authority and skill of grammar, and all divine faith is perished out of the earth, except God by a supernatural power taught men first grammar, and then to believe, for which we have no warrant, so all our faith must be dreams. And since Mr. Goodwin acknowledges a supernatural power of the Spirit of grace to believe; what else does this Spirit cause us believe, but lies? or at best fancies resolved into human credit? which may be false for any certainty of knowledge that Libertines allow us? … May not reading, interpunction, a parenthesis, a letter, an accent, alter the sense of all fundamentals in the Decalogue? of the principles of the Gospel? and turn the Scripture in all points (which Mr. Doctour restricts to some few darker places, whose senses are off the way to heaven, and less necessary) in a field of problems, and turn all believing into digladiations of wits? all our comforts of the Scriptures into the reelings of a Windmill, and fancies of seven moons at once in the firmament? this is to put our faith and the first-fruits of the Spirit, and Heaven and Hell to the press. But though printers and pens of men may err, it follows not ‘that heresies should be tolerated,’ except we say, 1. that our faith is ultimately resolved upon characters, and the faith of printers. 2. We must say we have not the clear and infallible word of God, because the Scripture comes to our hand by fallible means, which is a great inconsequence, for though scribes, translators, grammarians, printers, may all err, it follows not that an erring providence of Him that has seven eyes, has not delivered to the Church, the Scriptures containing the infallible truth of God. Say that Baruch might err in writing the prophesy of Jeremiah, it follows not that the prophesy of Jeremiah, which we have, is not the infallible Word of God; if all translators and printers did their alone watch over the Church, it were something, and if there were not one with seven eyes to care for the Scripture. But for tradition, councils, popes, fathers, they are all fallible means, and so far forth to be believed as they bring Scripture with them.”

nspired+prophets.%E2%80%99+I+shall+answer+that+first%2C+this+objection+presumes+that+Christ+and+the+apostles+might%2C+and+did%2C+find+errors+and+mis-printings+even+in+written+Scripture%2C+which+might+reduce+the+Church+in+after+ages+to+an+invincible+ignorance+in+matters+of+faith%2C+and+yet+they+gave+no+notice+to+the+Church+thereof%3B+or+if+there+was+no+error+de+facto%2C+then+for+so+many+hundred+years%2C+yet+there+are+now+substantial+errors%2C+and+so+foul+that+it+may+be+we+have+no+Word+of+God+at+all%2C+amongst+us%2C+and+God+has+no+Church%2C+no+believer+on+earth%2C+but+we+must+all+take+the+word+of+printers+and+translators%2C+which+is+merely+the+word+of+man%3A+And+what+is+become+of+all+the+martyrs+that+suffered+by+the+bloody+woman+Babel%3F+They+died+for+mere+conjectures+and+opinions%2C+for+they+had+not+the+first+original+copies+of+Moses+and+the+Prophets%2C+yea+Stephen+the+first+martyr%2C+who+according+to+all+our+copies%2C+Acts+7%2C+adds+five+to+Moses%2C+his+70+souls%2C+that+went+down+to+Egypt%2C+in+that+glorious+sermon+that+he+has+before+his+death%2C+when+he+sealed+the+truth+with+his+blood+and+died+gloriously%2C+and+said%2C+%E2%80%98Lord+Jesus+receive+my+spirit%2C%E2%80%99+died+but+upon+the+faith+of+men%E2%80%99s+fallible+skill+in+grammar%2C+printing+and+writing%3B+for+he+cites+the+writings+of+Moses+to+his+enemies+that+stoned+him%2C+according+to+the+copies+that+they+then+had%2C+who+would+quickly+have+controlled+him+if+he+had+cited+false+copies%2C+and+Stephen%E2%80%99s+own+testimony+was+controverter%2C+and+therefore+except+we+say+that+Stephen+and+Christ+and+the+apostles+cited+the+testimonies+of+the+prophets+as+they+were+then+obvious+to+the+eyes+and+reading+of+both+the+people+of+God+and+the+enemies%2C+and+that+not+simply+as+their+own+words+which+they+spake+as+immediately+inspired%2C+but+as+the+testimony+of+the+prophets%2C+according+to+the+then+written+copies%2C+we+must+say+they+spake+not+ingeniously+the+truth+of+God%2C+for+it+was+against+truth%2C+candor%2C+ingenuity%2C+to+Christ+and+the+apostles+to+say%2C+%E2%80%98as+it+is+written+in+your+Law%2C%E2%80%99+John+8%3A17%2C+and+so+often+%E2%80%98it+is+written%2C%E2%80%99+if+they+would+not+have+the+hearers+to+receive+with+certainty+of+faith+and+full+assurance%2C+free+from+all+doubting+and+fear+of+humane+fallibility%2C+that+what+they+cited+as+written%2C+was+undoubtedly+the+same+very+truth+of+God%2C+and+no+other%2C+which+Moses+and+the+prophets+spoke+and+wrote%3B+and+if+they+would+not+have+them+to+read%2C+search+and+believe+these+same+Scriptures%2C+and+to+conceive+that+they+drew+arguments+in+the+New+Testament+to+prove+and+confirm+their+doctrine+from+that+which+was+written+by+Moses+and+the+prophets+in+the+Old+Testament%2C+and+would+not+have+them+to+believe+them%2C+only+because+New+Testament+writers+immediately+inspired+had+so+said.+6.+If+God+will+have+us+to+try+and+examine+all+spirits%2C+all+doctrines%2C+by+the+Scriptures+written%2C+then+are+we+certainly+assured+that+the+books+we+now+have+of+the+Old+and+New+Testament%2C+are+the+very+Word+of+God%2C+though+we+cannot+by+any+possibility+have+the+first+and+original+authentic+copies+of+Moses+and+the+prophets+and+apostles.+Because+1.+God+would+not+bid+us+try%2C+and+then+leave+us+no+rule+to+try+withal+but+our+own+natural+light%2C+which+must+lead+us+into+darkness.+2.+The+visible+Church+should+not+be+guilty+of+unbelief+if+the+written+Word+were+not+among+us%2C+or+then+Christ+and+his+apostles+speaking+to+us%2C+as+is+clear%2C+John+15%3A22%3B+Rom.+10%3A14-15%3B+Mt.+11%3A21-22.+The+assumption+is+clear+by+the+commended+practice+of+the+Bereans%2C+who+tried+Paul%E2%80%99s+doctrine+by+the+Scriptures%2C+Acts+17.+See+Rivetus%2C+Whitaker%2C+Calvin.+3.+By+the+command+of+God%2C+1+Thess.+5%3A2%3B+1+John+4%3A1%3B+%E2%80%98Try+all+things%2C%E2%80%99+%E2%80%98try+the+sprits.%E2%80%99+7.+John+would+not+call+those+blessed+who+read+and+hear%2C+Rev.+1%3A5%2C+nor+would+Paul+recommend+reading+to+Timothy%2C+and+continuance+in+the+doctrine+of+the+Scriptures%2C+and+so+extol+the+necessity+and+utility+of+the+Scripture+and+the+indwelling+of+the+word+of+God+in+us+as+he+does%2C+1+Tim.+4%3A16%3B+2+Tim.+3%3A14-16%3B+Col.+3%3A16%2C+nor+could+the+things+written+by+John+ch.+21%2C+by+Moses+and+the+prophets%2C+Luke+16%3A29-31%2C+be+holden+forth+as+sufficient+to+bring+souls+to+heaven%2C+and+to+cause+them+eschew+Hell%2C+if+it+were+true+that+we+%E2%80%98have+no+certainty+that+the+Scripture+of+the+old+and+New+Testament+are+the+very+word+of+God%2C+but+such+as+is+made+of+men%E2%80%99s+credit+and+learning.%E2%80%99+8.+Yea+and+so+what+God+spake+immediately+to+Abraham%2C+Moses+and+the+prophets%2C+could+not+be+infallibly+and+by+certainty+of+faith+to+them+the+Word+of+God%3B+for+if+God+spake+to+them+in+a+language+intelligible%2C+they+had+no+certainty+of+faith+that+the+words+that+came+from+God+did+signify+thus+and+thus%3B+for+sure%2C+God%2C+by+immediate+inspiration%2C+taught+them+not+grammar+and+significations+of+words%2C+and+those+that+read+the+Law+written+by+God%E2%80%99s+finger+on+two+tables+of+stone%2C+those+who+heard+Moses+and+the+prophets+preach+in+their+mother-tongue%2C+even+the+Jews+who+read+the+original+first+Hebrew+copy+of+Moses+and+the+prophets%2C+must+have+had+no+warrant+that+that+was+the+Word+of+God%2C+but+the+authority+of+father%2C+mother+and+nurses%2C+who+first+taught+them+their+mother-tongue%2C+for+sure+the+prophets+were+not+school-masters+to+teach+them+Hebrew%3B+so+by+this+learning+there+was+never+since+the+world+was+any+certainty+of+faith%2C+but+such+conjectural+human+and+fallible+opinions+in+all+the+matters+of+God+as+is+resolved+ultimately+%28says+Mr.+Goodwin%29+into+men%E2%80%99s+fallible+and+topic+authority+and+skill+of+grammar%2C+and+all+divine+faith+is+perished+out+of+the+earth%2C+except+God+by+a+supernatural+power+taught+men+first+grammar%2C+and+then+to+believe%2C+for+which+we+have+no+warrant%2C+so+all+our+faith+must+be+dreams.+And+since+Mr.+Goodwin+acknowledges+a+supernatural+power+of+the+Spirit+of+grace+to+believe%3B+what+else+does+this+Spirit+cause+us+believe%2C+but+lies%3F+or+at+best+fancies+resolved+into+human+credit%3F+which+may+be+false+for+any+certainty+of+knowledge+that+Libertines+allow+us%3F+%E2%80%A6+May+not+reading%2C+interpunction%2C+a+parenthesis%2C+a+letter%2C+an+accent%2C+alter+the+sense+of+all+fundamentals+in+the+Decalogue%3F+of+the+principles+of+the+Gospel%3F+and+turn+the+Scripture+in+all+points+%28which+Mr.+Doctour+restricts+to+some+few+darker+places%2C+whose+senses+are+off+the+way+to+heaven%2C+and+less+necessary%29+in+a+field+of+problems%2C+and+turn+all+believing+into+digladiations+of+wits%3F+all+our+comforts+of+the+Scriptures+into+the+reelings+of+a+Windmill%2C+and+fancies+of+seven+moons+at+once+in+the+firmament%3F+this+is+to+put+our+faith+and+the+first-fruits+of+the+Spirit%2C+and+Heaven+and+Hell+to+the+press.+But+though+printers+and+pens+of+men+may+err%2C+it+follows+not+%E2%80%98that+heresies+should+be+tolerated%2C%E2%80%99+except+we+say%2C+1.+that+our+faith+is+ultimately+resolved+upon+characters%2C+and+the+faith+of+printers.+2.+We+must+say+we+have+not+the+clear+and+infallible+word+of+God%2C+because+the+Scripture+comes+to+our+hand+by+fallible+means%2C+which+is+a+great+inconsequence%2C+for+though+scribes%2C+translators%2C+grammarians%2C+printers%2C+may+all+err%2C+it+follows+not+that+an+erring+providence+of+Him+that+has+seven+eyes%2C+has+not+delivered+to+the+Church%2C+the+Scriptures+containing+the+infallible+truth+of+God.+Say+that+Baruch+might+err+in+writing+the+prophesy+of+Jeremiah%2C+it+follows+not+that+the+prophesy+of+Jeremiah%2C+which+we+have%2C+is+not+the+infallible+Word+of+God%3B+if+all+translators+and+printers+did+their+alone+watch+over+the+Church%2C+it+were+something%2C+and+if+there+were+not+one+with+seven+eyes+to+care+for+the+Scripture.+But+for+tradition%2C+councils%2C+popes%2C+fathers%2C+they+are+all+fallible+means%2C+and+so+far+forth+to+be+believed+as+they+bring+Scripture+with+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+

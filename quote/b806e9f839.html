<main class="wrap"><figure class="quote" id="q-b806e9f839" data-kw="">
<blockquote><p>Now let us fall down before the Majesty of our good God with acknowledgment of our faults, praying him to make us perceive them more and more, so as we may mislike of them, and not only confess them with our mouth, but also lay open our hearts before him, and submit ourselves wholly to his holy word, and that in such wise we may be comforted by his free goodness, as it is showed us in our Lord Jesus Christ, and he reform us also by his holy spirit, to the end that whereas we of ourselves be full of rebelliousness, we may by his governing become teachable and ready to follow his holy will, and to give ourselves over all wholly unto him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Galatians</cite>, (1574; Audubon NJ, 1995), p. 456.</span></figcaption>

<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Therapeutica Sacra</cite>, Book 1, Chapter 6</span></figcaption>

</figure><figure class="quote" id="q-e952113197" data-kw="">
<blockquote><p>The world’s corruption was deep beyond conception. Earth was an open sepulchre; and each man hated his God. It was in reference to what he saw of this fearful enmity that Jesus said, in melancholy pity, “No man can come to me, except the Father which hath sent me draw him.” John vi. 44. They are so totally depraved, they are so wedded to their lusts, they are so gross, and sensual—so truly dead in sin—they do not wish to be freed from their covetousness, their envy, their lust, their power to draw draughts of pleasure from ungodly revelry, or from intense engrossment with the lawful occupations of life. They hide among the trees of the garden at the first sound of the voice of the Lord, even when he comes with grace on his lips, and goodwill to men in his heart.

O brethren, to be able to love any of such a race, argues strange and mysterious depth of love in God the Father. And he did fix his love on many of these; he did it freely, and he did it determinedly. So deliberate, decided, determined was this eternal love of the Father, that it made success certain in the case of each on whom it was fixed. It was such a love, that its plans and purposes implied the operation of each person of the Godhead. The Spirit must go forth and draw, and the Son go forth and die. This was the Father’s plan! O what amazing love is here! What thoughts are in his heart to usward! He will not let go his purpose of having some of our fallen race standing round his throne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-a-bonar.html">Andrew A. Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of the Father in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Use 4. If Christ be so rich, Oh! then, open to Christ when He knocks. Christ knocks by his word, and He knocks by his rod; He knocks by his Spirit, and He knocks by his messengers, and He knocks by conscience. Oh, open to Him! for He is very rich. Though you shut the door against a poor man, yet you will open it to one that is rich; and why not then to Christ, who would fain have entrance? Rev. 3:20, ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to Him, and will sup with Him, and He with me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ</cite>, vol. 3, p. 194</span></figcaption>

</figure><figure class="quote" id="q-3f15621911" data-kw="">
<blockquote><p>The work of Missions is not simply a measure of expediency devised by the wisdom and piety of the Church in this or any other age of peculiar activity. It is the divinely appointed work which the Church has been organized to do. The doctrine of Missions is of faith, not of opinion. The cause of Missions addresses itself not to the benevolent sympathies merely, but to the conscience and faith of God’s people.

The most efficient means, therefore, of arousing the Church and keeping the Church awake to her duty in this regard, are not ingeniously-devised appliances for rousing the philanthropic sympathies of the people, and for reaching the treasures which their covetousness has hoarded away; but the simple exposition of the great truth of God relating to this work, for the enlightenment of their understandings and consciences: thereby awakening emotions of love for Jesus and his cause in their hearts, that will impel them to a consecration of themselves and their substance to his service.

In this, as in every case, the simple truth of God, apprehended by the understanding and present to the consciousness of the soul, is the means which the Spirit uses for giving energy to, as well as for awakening the spiritual affections in, the heart. And so in regard to the revival of a spirit for this work in the Church at large. The truth of God is the agency which the Spirit will honor.

It is not enough to devise wise expedients and machinery for this work—even though scriptural machinery, and then, folding our hands, sit in silence, waiting for the Spirit to come and stir up the people to work with the machinery. We must expound the truth—not our truth, but the truth of God—relating to the nature, the obligations, and the means of accomplishing the work; and cry earnestly to the Holy Spirit to give our teachings efficiency, in enlightening the understandings and enlarging the hearts of the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855</cite>, (New York: Edward O. Jenkins, 1855), pp 12-13.</span></figcaption>

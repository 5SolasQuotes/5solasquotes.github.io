<main class="wrap"><figure class="quote" id="q-ea26cac1d4" data-kw="">
<blockquote><p>Neither does the renewed confidence of perseverance produce immorality or lack of concern for godliness in those put back on their feet after a fall, but it produces a much greater concern to observe carefully the ways which the Lord prepared in advance. They observe these ways in order that by walking in them they may maintain the assurance of their perseverance, lest, by their abuse of God’s fatherly goodness, the face of the gracious God (for the godly, looking upon that face is sweeter than life, but its withdrawal is bitterer than death) turn away from them again, with the result that they fall into greater anguish of spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b044c059b" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God&#x27;s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light, yet are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/perseverance-and-assurance.html">Perseverance and Assurance</a> › <a href="../topics/perseverance-of-the-saints/perseverance-and-assurance/how-they-relate.html">How they relate</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-f56c205734" data-kw="">
<blockquote><p>Of this preservation of the elect to salvation and of their perseverance in the faith, true believers themselves may and do obtain assurance according to the measure of their faith, whereby they surely believe that they are and ever will continue true and living members of the Church, and that they have the forgiveness of sins and life eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 9</span></figcaption>

</figure><figure class="quote" id="q-094fd40078" data-kw="">
<blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Rejection of Errors, ¶5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/perseverance-and-assurance.html">Perseverance and Assurance</a> › <a href="../topics/perseverance-of-the-saints/perseverance-and-assurance/how-they-relate.html">How they relate</a></span><span class="t"><a href="../topics/arminians-remonstrants/falling-from-grace.html">Arminians (Remonstrants): Falling from Grace</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/roman-denial-of-assurance.html">Roman Denial of Assurance</a> › <a href="../topics/assurance-peace-and-joy/roman-denial-of-assurance/trents-denial-of-certainty.html">Trent’s denial of certainty</a></span></div>
<div class="actions"><button class="copy" data-copy="“Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.”

</figure><figure class="quote" id="q-7c73d67f29" data-kw="">
<blockquote><p>This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 10</span></figcaption>

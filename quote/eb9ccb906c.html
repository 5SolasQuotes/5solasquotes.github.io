<main class="wrap"><figure class="quote" id="q-eb9ccb906c" data-kw="">
<blockquote><p>The sanctification of the Sabbath, since it is moral and perpetual and is turned into the Lord’s Day in the Christian church, is twofold, privative and positive or ascetic. It is privative, consisting in cessation from labours of ordinary vocation, that we may be freer to worship God. It is positive or ascetic, consisting in the solemn public and private worship of God, which is exercised at a stated time in the congregation of the church and at home. It cannot be gathered very pure other than from the moral worship of the Sabbath day, which sort, having been secluded even in the Old Testament, was typical compared with the worship of God in the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), XIV.XV, Kindle Locations 2315-2319.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5c71266e4" data-kw="">
<blockquote><p>But there is another intention not religious: if a child read a chapter of the Bible that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’; And here the object, not being religious, the intrinsic operation cannot raise up any religious intention of the child. Upon this ground it is easy to determine whether or no[t] an intention of worship be essential to worship or not. The former intention, which is intrinsic, and intentio operis [the intention of the operation], may be essential, it resulting from the object; but the latter intention of the worker, is so far extraneous to worship, as whether it be or be not the nature of worship, [that it] is not impaired, nor violated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Intro, section 6, p. 89. Rutherford uses a different example, which applies to the question.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-5a72d6ca6a" data-kw="">

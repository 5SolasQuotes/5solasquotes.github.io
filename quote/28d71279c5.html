<main class="wrap"><figure class="quote" id="q-28d71279c5" data-kw="">
<blockquote><p>§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), ch. 2; p. 417</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>9. Though we must not by profession, word or subscription own the sin of any Church, we must [in some circumstances] join in their communion in the worship of God, with those whose worship is mixed with sin in matter and manner, so it be not sin that is by its evil predominant against the good of the duty, to make the work rejected of God (like poison in our food, which makes the hurt greater than the good), because else we must neither worship God ourselves [because of our own impurities], nor join with any in the world: all the works of sinful men being mixed with sin. To deny this, is virtually to separate from all the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Must not own Sin, Yet must Join with Others with Mixed Worship</span></figcaption>

<blockquote><p>…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.</p></blockquote>

<blockquote><p>Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse. For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it. For there must be also heresies among you, that they which are approved may be made manifest among you. When ye come together therefore into one place, this is not to eat the Lord’s supper. For in eating every one taketh before other his own supper: and one is hungry, and another is drunken. What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not.</p></blockquote>

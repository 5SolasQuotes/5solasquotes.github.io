<blockquote><p>The Worship of Images is a Practise of all most opposite to the Spirit of Christianism, and the most contrary to the dignity of Man. It’s to do great wrong to a Man, to oblige him to humble himself before Wood and Stone, which are so far below him.

Men should not flatter themselves: It’s the great Scandal of the Jew, he hath Images in abhorrence; and when he looks on Christian Religion, on that side, he conceives a mortal aversion from it. So we cannot imagine that to be a small Affair, an Article which retards that great Work of the Conversion of the Jews, without which the Church will never be perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preservative against the change of religion, or, A just and true idea of the Roman Catholick religion, opposed to the flattering portraictures made thereof, and particularly to that of my Lord of Condom</cite>, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), p. 78.</span></figcaption>

<blockquote><p>What if we should yield to the Bishop that kneeling [to the bread and wine in the Supper] and holidays are with us applied to another service, and used with another meaning than they are with the Papists [as is often claimed with vestments]? Does that excuse our conformity with Papists in the external use of these ceremonies? If so, J. [John] Hart did rightly argue out of Pope Innocentius, that the church does not Judaize by the sacrament of unction or anointing, because it figures and works another thing in the New Testament than it did in the Old (Rainolds, Conference with Hart, ch. 8, div. 4, p. 496). Rainolds answers, that though it were so, yet is the ceremony Jewish; and mark his reason (which carries a fit proportion to our present purpose), ‘I trust’, he says, ‘you will not maintain but it were Judaism for your church to sacrifice a lamb in burnt-offering, though you did it to signify, not Christ that was to come, as the Jews did, but that Christ is come, etc. St. Peter did constrain the Gentiles to Judaize, when they were induced by his example and authority to follow the Jewish rite in choice of meat; yet neither he nor they allowed it in that meaning which it was given to the Jews in; for it was given them to betoken that holiness, and train them up into it, which Christ by his grace should bring to the faithful. And Peter knew that Christ had done this in truth, and taken away that figure, yea the whole yoke of the law of Moses; which point he taught the Gentiles also. Wherefore, although your church keeps the Jewish rites with another meaning than God ordained them for the Jews… yet this of Peter shows that the thing is Jewish, and you to Judaize to keep them. (Ibid., p. 496 [567])</p></blockquote>

<blockquote><p>Of joining with the congregation in hearing the Word, even read as well as preached. See what a reverend respect God’s people shewed even to the Word read, Nehem 8, 3. The ears of all the people were attentive unto the book of the Law; and ver. 5. When Ezra opened the book (to read it) all the people stood up.

Make conscience to join with the congregation in those prayers that are read as well as in those that are conceived. For those that are read are holy, &amp; good prayers, and all the congregation should make their prayers and supplications with one accord, as they did, Act. 1. 14. Hold thy self bound to join with the congregation in singing of Psalms also. See how well God shewed himself to be pleased with this duty, 2 Chron. 20. 22. When they began to sing, and to praise; the Lord set ambushments against the children of Ammon, &amp;c.</p></blockquote>

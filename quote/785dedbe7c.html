<main class="wrap"><figure class="quote" id="q-785dedbe7c" data-kw="">
<blockquote><p>God has truly blessed us with all spiritual blessings in Jesus Christ. In that divine Christ, whom he gave us this morning in his sacrament, God presented us with all his most precious blessings – all the merits of his Son – all the consolations of his Spirit – all the sweets of his peace – all the riches of his grace – all the assurances of his glory; and if our hearts were then regulated aright, there is nothing in the treasures of his indulgence – nothing in the benefits of redemption – nothing in the joys of sanctification – nothing in the pleasure of reconciliation with God – nothing in all the sources of heavenly life and felicity, of which we have been partakers. Blessed, then, blessed be the God and Father of our Lord Jesus Christ, who hath blessed us this happy day with all spiritual blessings in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 102-03.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-562e876894" data-kw="">
<blockquote><p>What is added in the last place, concerning the general intention of God, by which He wills that all men individually should be saved through the death of his Son, needs explanation. It must be observed, therefore, that according to the custom of the Scriptures, the Divine will or intention sometimes denotes merely the appointment of means to an end, although there is no determinate will in God of producing that end by those means. And the Schoolmen refer this intention or will of God to the common order of providence. In this sense He willed and intended the obedience and salvation of the angels who apostatized, inasmuch as He furnished them with gifts, fit in themselves and suitable, to perform obedience and obtain salvation. And in this sense God, with a general intention, wills life to all men, inasmuch as he willed the death of Christ to be the fountain and cause of life to all men individually, according to the tenor of the evangelical covenant.¹ ¹ [Davenant calls the gospel offer, that whosoever believes in Christ will be saved (Jn. 3:16), established with all men as men, a “covenant,” and the “evangelical covenant”. While this call and offer does not reach all persons, yet, according to some, it potentially could save all persons if it were not for the sin of persons after Adam and Eve not continuing in their responsibility and for persons not obeying the command to preach the gospel to every creature. This potential power of providential means, designed unto the end of salvation, however varied or inaccessible through human history, yet reflects, for some theologians, God’s gracious will of providence in some way for the life and salvation of every human individual, especially in contrast to the demons which receive no such favors.] But we must observe, that the Scriptures mention another will or intention of God, and that properly so called, which never fails in producing the good intended, and which the Schoolmen refer to the order of special predestination… But if by this general intention they mean nothing more than a general aptitude and sufficiency in the death of Christ to effect the salvation of all men individually in the mode of an universal cause, or a general appointment of God concerning the salvation of all men individually, who, through the grace of God, duly apply to themselves this universal cause, then there is no need to reject this form of speaking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Gallican Controversy, pt. 1</cite>, pp. 564-65 appended to Davenant, An Exposition of Colossians, vol. 2 ed. Josiah Allport (London, 1832)</span></figcaption>

</figure><figure class="quote" id="q-d18b7522d8" data-kw="">
<blockquote><p>Sixthly, by his not only offering acquaintance with us upon these terms, by his ambassadors, his ministers, but by his coming personally by his Spirit to our several hearts, inviting and soliciting us to this acquaintance. According to that of our Lord Jesus Christ, ‘Behold I stand at the door and knock; if any man hear my voice, and open to Me, I will come in to him, and will sup with him, and he with Me.’ The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians</cite>, (London: Parker, 1679), ch. 4, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>Objection. 1. But the wicked receive many of the gifts of the Holy Spirit, who nevertheless do not ask or desire them. Therefore these things are not merely given to such as desire them. Answer. The wicked do indeed receive many gifts; but not such as are principal nor peculiar to the elect, as faith, repentance, conversion, remission of sins and regeneration. And still further, the gifts which they do receive do not contribute to their salvation, but to their destruction. And should any one reply, and say that infants do not desire the Holy Ghost, and yet receive him, so that he must be given to more than those who ask and desire, we answer that the Holy Ghost is not given to any except such as desire him, which is to say, to adults who are capable of asking and seeking him. And yet even infants desire the Holy Ghost after their manner, in that they have in possibility an inclination to seek him just as they according to their manner believe, or have an inclination to faith. “Out of the mouth of babes and sucklings hast thou ordained strength.” (Ps. 8:2.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, (Cincinnati, OH: Elm Street Printing Company, 1888), 619–20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><figure class="quote" id="q-32eefa5107" data-kw="">
<blockquote><p>God it is who draws to His Son those whom He calls; He does not compel them by force against their will, but He makes them willing from unwilling and by all sorts of ways overcomes the resistance of their unbelief. When the desire of submitting to God has been born in their hearts, those who hear Him rise up with the very will which first kept them down; they learn with the same mind which first was ignorant; they trust with the same heart which first felt diffident; they desire good with the same will which first was unwilling.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren</cite>, p. 297</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6797257d1e" data-kw="">
<blockquote><p>Now if we ask the Papists, that if the people must be put in mind [by images], of what it must be?… … 2. Not of Christ, as he is God, for his attributes are 〈◊〉, but as he is man only and in so doing, in representing him by picture as man and not God, seeing that person in the deity cannot be delineated, they imitate Nestorius, who did divide the natures of Christ, and so consequently may seem to run into the anathema of the council of Ephesus: because in some sort they divide in their picture the manhood from the Godhead, which they cannot express therewith. (1st Council of Ephesus, canon 3) 2. Not of Christ, as man, and now glorified, for against this, the saying of Eusebius may serve well, that the glory of Christ in heaven is now far greater, than it was when he was 〈◊〉 in the mount, where the disciples could not look upon him, and therefore cannot be portrayed by any pencil. 3. Nor of Christ, as he was in the flesh, for that were (as the prophet speaks) to teach us lies: and rather to forget than to remember what he suffered for us; for in his picture (as in that upon the cross for example) we can be put in mind and we see no more than the piercing of his hands and feet, a wound in his side by a spear, and the thorns on his head: this we may remember by these things: but the especial pains and torments which inwardly he suffered; his being sorrowful unto death, his anguish of heart for the Jews obstinacy and rejection, the bitternesse of the cup, which his not only most perfect body was most sensible of, and his holy soul apprehended and suffered, these are forgotten these cannot be depicted; so the greatest part of his passion is inexpressible. … These reasons show that there are other means better and more effectual than pictures to instruct men in the knowledge of Christ, viz. The scripture and the preaching of the gospel, but they are not meant to prove it unlawful to paint or make any portraiture of Christ in his human nature, as at his passion, etc., provided no religious worship be given to it: that which is of 〈◊〉 use, is not therefore unlawful or of no use at all. So the author in his answer to Perron, c. 18, p. 17. To have a story painted for memory’s sake we hold not unlawful, but that it might be well enough done, if the church found it not inconvenient for her children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pattern of Catechistical Doctrine at Large, or a learned and pious Exposition of the Ten Commandments… (London: Norton, 1650), Second Commandment, ch. 6, pp. 213-14 Andrewes (1555–1626) was an English bishop and scholar, who held high positions in the Church of England during the reigns of Elizabeth I and James I.</cite></span></figcaption>

</figure><figure class="quote" id="q-4d7f690453" data-kw="">
<blockquote><p>The replier to Dr. Mourton’s Particular Defence, observes (ch. 1, section 3), that this superstition about apparel in divine worship began first among the Frensh bishops, unto whom Caelestinus writes thus. Discernendi, etc. ‘We are to be distinguished from the common people and others by doctrine, not by garment, by conversation, not by habit [one’s dress], by the purity of mind, not by attire: for if we study to innovation, we tread underfoot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not lead the minds of the faithful into such things: for they are rather to be instructed than played withal: neither are we to blind and beguile their eyes, but to infuse instructions into their minds.’ In which words Caelestinus reprehends this apparel, as a novelty which tended to superstition, and made way to the mocking and deceiving of the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 9</cite>, p. 47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.”

— Ezekiel Hopkins, An Exposition of the Ten Commandments, on the First Commandment (heart / creature idolatry)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCertainly%2C+the+professors+of+it+are+not+well+purged+from+this+latter+idolatry%3A+for%2C+even+among+Protestants+themselves%2C+we+shall+find+very+many+that+are+in+this+sense+idolaters.+For%2C+%5B1%5D+Whosoever+chiefly+and+supremely+loves+any+creature%2C+is+an+idolater%3B+because+our+chiefest+love+is+due+only+unto+God.+Hence+the+covetous+person+is+expressly+called+an+idolater%3B+and+covetousness%2C+idolatry%3A+Col.+3%3A5.+Mortify+your+earthly+members%3B+%E2%80%A6+uncleanness+%E2%80%A6+evil+concupiscence%2C+and+covetousness%2C+which+is+idolatry.+And+the+sensual+epicure+is+likewise+an+idolater%3A+Phil.+3%3A19+his+belly%2C+saith+the+Apostle%2C+is+his+God.+The+proud+person+is+an+idolater%3A+for+he+loves+himself+supremely%3B+sets+up+himself+for+his+own+idol%3B+and+falls+prostrate+before+that+image%2C+which+he+hath+pourtrayed+of+his+own+perfections%2C+in+his+own+fancy+and+imagination.+And%2C+generally%2C+all+such%2C+who+love+and+admire+anything+above+God%2C+or+esteem+anything+so%2C+are+idolaters.%E2%80%9D%0A%0A%E2%80%94+Ezekiel+Hopkins%2C+An+Exposition+of+the+Ten+Commandments%2C+on+the+First+Commandment+%28heart+%2F+creature+idolatry%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6410d65b06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6410d65b06.html">Permalink</a><a class="src" href="https://www.digitalpuritan.net/Digital%20Puritan%20Resources/Hopkins,%20Ezekiel/An%20Exposition%20of%20the%20Ten%20Commandments.pdf" rel="noopener" target="_blank">Read it online · Digital Puritan</a></div>

<blockquote><p>Thirdly, it is objected that the humanity of Christ and the picture of Christ crucified may be allowed, not for adoration but in sign of love and commemoration. Answer: First, I answer in the words of the apostle, Gal. 3:1, labour that Jesus Christ may be so pictured by the preaching of the Gospel in the mind that thou maist by the eye of faith behold Him as clearly and more effectually than if he were described in thy sight and crucified before thee: For by faith we behold Him which is invisible, Heb. 11:1, 27. Secondly, I say we be bound to discern between the precious body of the Son of God, and the sinfull carcases of mortal men: for that this is a mystery most admirable that God should be manifested in the flesh, 1 Tim. 3:6, that God and man should be so united together that both natures make but one person: so as albeit death parted the natural soul from the natural body, yet that precious body was still the body of that person which was the Son of God, no way subiect to any change or corruption, Acts 2:27. An image will teach us to disjoin in our minds those holy natures which God has so conjoined as man ought not in the thoughts of his heart to separate them, but ever by spiritual wisdom and faith to distinguish them. Thirdly, I say if no man on the earth can at this day give us the true picture of Christ: then is it intolerable audaciousness for any earthly man to counterfeit falsely his holy parts and members. But no man can give us his just stature, or truly discribe his physiognomy: therefore this ought not to be practiced. And if a man cannot bear to be abused and falsely or untruly resembled and conterfeited by picture: shall we think it none offense to the Son of God? Fourthly, we may reason from the writings of the holy Evangelists, who were appointed and sent from God, purposely to describe the Son of God Jesus Christ: for if they with one consent, deny us any help at all, or any one live concerning the external lineaments, and form of his body: then ought not man to presume to picture Christ after his own invention: but we see clearly how the four Evangelists purposely pass over this matter, the holy Ghost foreseeing the superstition of Antichrist, and how the Popish painted Christs should be worshipped to the great dishonour of our everlasting Lord and Savior Jesus Christ. Fifthly, we may reason against this Popish God on this manner: if that picture of Christ, which was allowed and commanded of God Himself, Num. 21:8; Jn. 3:14, being superstitiously abused, must be burnt to ashes, 2. Kings 18:4, then much more these false pictures of Christ never allowed, but disallowed of God, and most impiously adored of vain men, ought to be rejected with a far greater detestation. If any doubt of the Popish idolatry, to their cross their own book and daily practice in their false Church testify against them. The fourth objection: They say the picture of Christ serves well to confute the old heretics, the Marcionites and Valentinians which denied that Christ had a true, natural, human body. Answer: First, if these and the like heretics believe not the words, nor respect the works of Christ: if they will not believe Moses and the prophets testifying of Christ, with his apostles and evangelists, they will not belieue anyone that shall return from the dead, and much less a dead and painted Christ. The godly emperors Valens and Theodosius made a law that none should make any image of our Sauior Christ: and if any were found, it should be utterly defaced and rejected. Again, Epiphanius rent in pieces the picture of Christ on a cloth, anno 565, because, said he, it was contrary to holy Scripture (Epiphanius, Epistle ad Iohan.; epistle Hierosolymit). Eusebius says that some convents of the gentiles carried about in tables the pictures of Peter and Paul and Christ also, because this was a custom (says he) to remember their patrons and benefactors (Eusebius, lib. confes. ch. 36). Their very words are these: ‘As our care is, in and by all means to maintain the religion of the most high God: so permit we none to portrait, engrave, or picture, in colors, stone or any other matter whatsoever, the image of our Savior: moreover we command that wheresoever such an image can be found, it be taken away, and all those to be chastised with most grievous punishment that attempt anything against our command.’ (Petr. Crinitus, bk. 9, de honest. discipl)</p></blockquote>

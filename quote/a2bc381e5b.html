<main class="wrap"><figure class="quote" id="q-a2bc381e5b" data-kw="">
<blockquote><p>Hence we see that the reformed Protestant religion is the only true religion that is in the world, because it is built upon the infallible truth and veracity of God. We have reason to be thankful to God, that it is not built upon such sandy foundations as human unwritten traditions, or any human testimony whatsoever.

It is built upon the God of truth, and not upon fallible men. We admit the testimony of the church as an help to our faith, but not the ground and foundation of it. The precious truths which we believe, we receive them not upon the testimony of the God of truth that cannot lie.

But the Popish religion hath no sure foundation. The faith of Papists is built upon the testimony of the churches, Popes, or councils, but upon the testimony of the God of truth that cannot lie. But the Popish religion hath no sure foundation. The faith of Papists is built upon the testimony of men; so that their religion hath no more certainty in it, than these men have of infallibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An illustration of the doctrines of the Christian religion, with respect to faith and practice, upon the plan of the Assembly’s Shorter Catechism; comprehending a complete body of divinity,</cite>, ed. Samuel McMillan (2 vols, Aberdeen, 1848), 1: 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-01df301672" data-kw="">
<blockquote><p>None can deny natural arguments to be a part of the Word of God, as is clear, Rom. 1:19; 1 Cor. 15:36–37; 1 Cor. 11:14. Yea, Christ, Mt. 7:12, teaches that this principle of nature, ‘whatsoever ye would men should do to you, do ye so to them,’ is the Law and the prophets, because it is a great part of the Law and the prophets, and therefore they say in effect ‘As it written in the Scripture,’ when they say ‘as it is written in man’s heart by nature.’ 2. Principles of nature are made Scripture by the penmen of the Holy Ghost, and do bind as the Scripture.</p></blockquote>

</figure><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>The cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 3</span></figcaption>

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Answer before the Diet of Worms</cite>, 18 April 1521</span></figcaption>

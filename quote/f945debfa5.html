<main class="wrap"><figure class="quote" id="q-f945debfa5" data-kw="">
<blockquote><p>5. They are a condition, without which a man cannot be saved. So that although a man cannot by the presence of them gather a cause of his salvation; yet by the absence of them he may conclude his damnation: so that it is an inexcusable speech of the Antinomian, Good works do not profit us, nor bad hinder us; thus Islebius. Now the Scripture, how full is it to the contrary? Rom. 8:13, ‘If ye live after the flesh, ye shall die.’ So, ‘Except ye repent, ye shall all likewise perish.’ Such places are so frequent, that it’s a wonder an Antinomian can pass them all over, and always speak of those places which declare God’s grace to us, but not our duty to Him. Without holiness no man can see God: now, by the Antinomians’ argument, as a man may be justified while he is wicked, and does abide so; so also he may be glorified and saved: for this is their principle, that, Christ has purchased justification, glory, and salvation for us, even though sinners and enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures 3 &amp; 4, on 1 Tim. 8-9 of Vindiciae Legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians in 30 Lectures (London, 1647)</cite>, pp. 42-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. They are a condition, without which a man cannot be saved. So that although a man cannot by the presence of them gather a cause of his salvation; yet by the absence of them he may conclude his damnation: so that it is an inexcusable speech of the Antinomian, Good works do not profit us, nor bad hinder us; thus Islebius. Now the Scripture, how full is it to the contrary? Rom. 8:13, ‘If ye live after the flesh, ye shall die.’ So, ‘Except ye repent, ye shall all likewise perish.’ Such places are so frequent, that it’s a wonder an Antinomian can pass them all over, and always speak of those places which declare God’s grace to us, but not our duty to Him. Without holiness no man can see God: now, by the Antinomians’ argument, as a man may be justified while he is wicked, and does abide so; so also he may be glorified and saved: for this is their principle, that, Christ has purchased justification, glory, and salvation for us, even though sinners and enemies.”

— Anthony Burgess, Lectures 3 &amp; 4, on 1 Tim. 8-9 of Vindiciae Legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians in 30 Lectures (London, 1647), pp. 42-43">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+They+are+a+condition%2C+without+which+a+man+cannot+be+saved.+So+that+although+a+man+cannot+by+the+presence+of+them+gather+a+cause+of+his+salvation%3B+yet+by+the+absence+of+them+he+may+conclude+his+damnation%3A+so+that+it+is+an+inexcusable+speech+of+the+Antinomian%2C+Good+works+do+not+profit+us%2C+nor+bad+hinder+us%3B+thus+Islebius.+Now+the+Scripture%2C+how+full+is+it+to+the+contrary%3F+Rom.+8%3A13%2C+%E2%80%98If+ye+live+after+the+flesh%2C+ye+shall+die.%E2%80%99+So%2C+%E2%80%98Except+ye+repent%2C+ye+shall+all+likewise+perish.%E2%80%99+Such+places+are+so+frequent%2C+that+it%E2%80%99s+a+wonder+an+Antinomian+can+pass+them+all+over%2C+and+always+speak+of+those+places+which+declare+God%E2%80%99s+grace+to+us%2C+but+not+our+duty+to+Him.+Without+holiness+no+man+can+see+God%3A+now%2C+by+the+Antinomians%E2%80%99+argument%2C+as+a+man+may+be+justified+while+he+is+wicked%2C+and+does+abide+so%3B+so+also+he+may+be+glorified+and+saved%3A+for+this+is+their+principle%2C+that%2C+Christ+has+purchased+justification%2C+glory%2C+and+salvation+for+us%2C+even+though+sinners+and+enemies.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+Lectures+3+%26+4%2C+on+1+Tim.+8-9+of+Vindiciae+Legis%2C+or%2C+A+vindication+of+the+moral+law+and+the+covenants%2C+from+the+errors+of+Papists%2C+Arminians%2C+Socinians%2C+and+more+especially%2C+Antinomians+in+30+Lectures+%28London%2C+1647%29%2C+pp.+42-43&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff945debfa5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f945debfa5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=5.%20They%20are%20a%20condi </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8bf641e3b4" data-kw="">
<blockquote><p>3. Good works are necessary as a consequent that follows from its antecedent, not as an effect that follows from its cause. The Holy Spirit teaches this everywhere, because He denies that eternal life is attained by means of our good works. At the same time, He also teaches that it is impossible to see God without holiness, Heb. 12,14. 4. Eternal life will be given to those who are performing good works, but it is not given unto them because of their good works. This is evident from Mt 25,35, where it is said: ‘For I was hungry and you gave me food’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. van Asselt, Bell, Brink, Ferwerda – Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn) Ch. 16, ‘On Good Works’</cite>, p. 136</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. Good works are necessary as a consequent that follows from its antecedent, not as an effect that follows from its cause. The Holy Spirit teaches this everywhere, because He denies that eternal life is attained by means of our good works. At the same time, He also teaches that it is impossible to see God without holiness, Heb. 12,14. 4. Eternal life will be given to those who are performing good works, but it is not given unto them because of their good works. This is evident from Mt 25,35, where it is said: ‘For I was hungry and you gave me food’ etc.”

— Johannes Maccovius, ed. van Asselt, Bell, Brink, Ferwerda – Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn) Ch. 16, ‘On Good Works’, p. 136">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Good+works+are+necessary+as+a+consequent+that+follows+from+its+antecedent%2C+not+as+an+effect+that+follows+from+its+cause.+The+Holy+Spirit+teaches+this+everywhere%2C+because+He+denies+that+eternal+life+is+attained+by+means+of+our+good+works.+At+the+same+time%2C+He+also+teaches+that+it+is+impossible+to+see+God+without+holiness%2C+Heb.+12%2C14.+4.+Eternal+life+will+be+given+to+those+who+are+performing+good+works%2C+but+it+is+not+given+unto+them+because+of+their+good+works.+This+is+evident+from+Mt+25%2C35%2C+where+it+is+said%3A+%E2%80%98For+I+was+hungry+and+you+gave+me+food%E2%80%99+etc.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+ed.+van+Asselt%2C+Bell%2C+Brink%2C+Ferwerda+%E2%80%93+Scholastic+Discourse%3A+Johannes+Maccovius+%281588%E2%80%931644%29+on+Theological+and+Philosophical+Distinctions+and+Rules+%28Apeldoorn%29+Ch.+16%2C+%E2%80%98On+Good+Works%E2%80%99%2C+p.+136&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bf641e3b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bf641e3b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=3.%20Good%20works%20are%20necessary%20as,and%20you%20gave%20me%20food%E2%80%99%20etc&amp;text=3.%20Good%20works%20are%20necessary%20as%20a%20consequent&amp;text=was%20hungry%20and%20you%20gave%20me%20food%E2%80%99%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b696011b19" data-kw="">
<blockquote><p>Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification (London, 1633), Book 7, ‘Concerning Good Works’, ch. 1, Answer IX</cite>, p. 438</span></figcaption>

</figure><figure class="quote" id="q-b9dec4a7a0" data-kw="">
<blockquote><p>As for the state to which sanctification brings us, we thought meet 1. To put down the manner and nature of the inclination itself, in the apostle’s words, ‘zealous of good works,’ lest any should think that the external work is all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-bcf1d08e49" data-kw="">
<blockquote><p>…Good works are necessary to salvation, not as a cause to an effect, or as if they merited a reward, but as a part of salvation itself, or as an antecedent to a consequent, or as a means without which we cannot obtain the end. In the same way we may also say, that good works are necessary to righteousness or justification, or in them that are to be justified, viz.: as a consequence of justification, with which regeneration is inseparably connected…. We may more safely and correctly say, That good works are necessary in them that are justified, and that are to be saved…. Augustine has correctly said: Good works do not precede them that are to be justified, but follow them that are justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Why Good Works are to be Done, or why they are Necessary?’, p. 485 in section 5 of Question 91 of the Heidelberg Catechism in The Commentary of Zacharias Ursinus on the Heidelberg Catechism (Cincinnati, 1851)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<main class="wrap"><figure class="quote" id="q-cc49d79512" data-kw="">
<blockquote><p>Furthermore, some do place before the word, “Amen,” immediately after the rehearsal of these words, “But deliver us from evil,” “For thine is the kingdom, and the power, and the glory, for ever. Amen.” But Erasmus Roterod., in his annotations upon the new Testament, witnesseth, that those words are not found in any old Latin copy; but are found added in all Greek copies, howbeit not expounded of any of the interpreters, but of Chrysostom only and his follower Theophylact; and that therefore they seemed unto him to be added unto the Lord’s Prayer, as some have added these unto the Psalms: “Glory be to the Father, to the Son,” &amp;c. The same Erasmus immediately adjouneth: “Wherefore there is no cause why Laurentius Valla should stomach the matter, that a good part of the Lord’s Prayer was curtailed. Their rashness was rather to be reproved, who feared not to so heavenly a prayer to patch their own toys. For I may call them toys, in comparison of that which God hath taught whatsoever hath proceeded from men; especially if that which men have added and put to, be compared with Christ the author of the prayer.”

Neither did Erasmus only doubt of this addition; for the Spanish copy, which they call Codex Complutensis, hath: “That it seemeth more credible, that these words are not a part of the Lord’s prayer, as a member of the whole; but put in through the fault of some certain writers, or printer.” In the same book is by and bye added: “And albeit St Chrysostom in his Commentaries upon Matt., Homil. xx., do expound these words, as if they were of the text; yet it is conjectured to be more true, that even in his time the first originals in his treatise were corrupted: whereupon none of the Latins, no, not of the ancient interpreters or entreaters thereof, is read to have made any mention of these words.” And surely this is truly said. For the most diligent interpreters, which have taken in hand each of them word for word to expound the Lord’s Prayer, as were St Cyprian, Hierome, and Augustine, of this addition have not spoken so much as one word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 219-20.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1fb865d1aa" data-kw="watchfulness">
<blockquote><p>These things are not said in order that we, favoring our own slothfulness, may give over the function of prayer to the Spirit of God, and vegetate in that carelessness to which we are all too prone. … But rather our intention is that, loathing our inertia and dullness, we should seek such aid of the Spirit. And indeed, Paul, when he enjoins us to pray in the Spirit [I Cor. 14:15], does not stop urging us to watchfulness. He means that the prompting of the Spirit empowers us so to compose prayers as by no means to hinder or hold back our own effort, since in this matter God&#x27;s will is to test how effectually faith moves our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.5</span></figcaption>

</figure><figure class="quote" id="q-d15a6d0bf8" data-kw="">
<blockquote><p>It is very odd how difficult it seems for some persons to understand just what Calvinism is. And yet the matter itself presents no difficulty whatever. It is capable of being put into a single sentence; and that, one level to every religious man’s comprehension. For Calvinism is just religion in its purity. We have only, therefore, to conceive of religion in its purity, and that is Calvinism.

In what attitude of mind and heart does religion come most fully to its rights? Is it not in the attitude of prayer? When we kneels before God, not with the body merely, but with the mind and heart, we have assumed the attitude which above all others deserves the name of religious. And this religious attitude by way of eminence is obviously just the attitude of utter dependence and humble trust. He who comes to God in prayer, comes not in a spirit of self-assertion, but in a spirit of trustful dependence. No one ever addressed God in prayer thus: “O God, thou knowest that I am the architect of my own fortunes and the determiner of my own destiny. Thou mayest indeed do something to help me in the securing of my purposes after I have determined upon them. But my heart is my own, and thou canst not bend it. When I wish thy aid, I will call on thee for it. Meanwhile, thou must await my pleasure.” Men may reason somewhat like this; but that is not the way they pray. […]

The Calvinist is the man who is determined to preserve the attitude he takes in prayer in all his thinking, in all his feeling, in all his doing. That is to say, he is the man who is determined that religion in its purity shall come to its full rights in his thinking, and feeling, and living. This is the ground of his special mode of thought, by reason of which he is called a Calvinist; and as well of his special mode of acting in the world, by reason of which he has become the greatest regenerating force in the world. Other men are Calvinists on their knees; the Calvinist is the man who is determined that his intellect and heart, and will shall remain on their knees continually, and only from this attitude think, and feel, and act. Calvinism is, therefore, that type of thought in which there comes to its rights the truly religious attitude of utter dependence on God and humble trust in his mercy alone for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Calvinism? in Selected shorter writings of Benjamin B. Warfield</cite></span></figcaption>

</figure><figure class="quote" id="q-152f44b5d6" data-kw="praying always with all prayer">
<blockquote><p>The duty I am endeavoring to express is that enjoined in Eph 6.18, &#x27;Praying always with all prayer and supplication in the Spirit, and watching to this with all perseverance and supplication for all saints.&#x27; Some have boldly advanced a fantasy (what will enmity to the holy ways of God not put men upon?) that &#x27;praying in the Spirit&#x27; intends only praying by virtue of an extraordinary and miraculous gift. But the use of it is enjoined here for all believers, none excepted, men and women; and I suppose all and every one of them did not have that extraordinary, miraculous gift which some fancy is intended in that expression. And the performance of this duty is enjoined in the manner prescribed: &#x27;always,&#x27; or as we say, &#x27;in every season&#x27; — that is, in those just and due seasons of prayer as duty and our occasions call for. But the apostle expressly confines the exercise of extraordinary gifts to some certain seasons when, under some circumstances, they may be needful or useful for edification, 1Cor 14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit in Prayer</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The duty I am endeavoring to express is that enjoined in Eph 6.18, &#x27;Praying always with all prayer and supplication in the Spirit, and watching to this with all perseverance and supplication for all saints.&#x27; Some have boldly advanced a fantasy (what will enmity to the holy ways of God not put men upon?) that &#x27;praying in the Spirit&#x27; intends only praying by virtue of an extraordinary and miraculous gift. But the use of it is enjoined here for all believers, none excepted, men and women; and I suppose all and every one of them did not have that extraordinary, miraculous gift which some fancy is intended in that expression. And the performance of this duty is enjoined in the manner prescribed: &#x27;always,&#x27; or as we say, &#x27;in every season&#x27; — that is, in those just and due seasons of prayer as duty and our occasions call for. But the apostle expressly confines the exercise of extraordinary gifts to some certain seasons when, under some circumstances, they may be needful or useful for edification, 1Cor 14.”

— John Owen, The Work of the Holy Spirit in Prayer">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+duty+I+am+endeavoring+to+express+is+that+enjoined+in+Eph+6.18%2C+%27Praying+always+with+all+prayer+and+supplication+in+the+Spirit%2C+and+watching+to+this+with+all+perseverance+and+supplication+for+all+saints.%27+Some+have+boldly+advanced+a+fantasy+%28what+will+enmity+to+the+holy+ways+of+God+not+put+men+upon%3F%29+that+%27praying+in+the+Spirit%27+intends+only+praying+by+virtue+of+an+extraordinary+and+miraculous+gift.+But+the+use+of+it+is+enjoined+here+for+all+believers%2C+none+excepted%2C+men+and+women%3B+and+I+suppose+all+and+every+one+of+them+did+not+have+that+extraordinary%2C+miraculous+gift+which+some+fancy+is+intended+in+that+expression.+And+the+performance+of+this+duty+is+enjoined+in+the+manner+prescribed%3A+%27always%2C%27+or+as+we+say%2C+%27in+every+season%27+%E2%80%94+that+is%2C+in+those+just+and+due+seasons+of+prayer+as+duty+and+our+occasions+call+for.+But+the+apostle+expressly+confines+the+exercise+of+extraordinary+gifts+to+some+certain+seasons+when%2C+under+some+circumstances%2C+they+may+be+needful+or+useful+for+edification%2C+1Cor+14.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Work+of+the+Holy+Spirit+in+Prayer&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F152f44b5d6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/152f44b5d6.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-4aa74a5e2c" data-kw="Spirit of grace and of supplications">
<blockquote><p>The Spirit promised here is the Spirit of God, &#x27;the Holy Spirit,&#x27; with respect to the special end for which he is promised. And the manner of his administration, in the accomplishment of the promise, is expressed by, &#x27;I will pour out.&#x27; The same word is used for the same purpose in Eze 39.29, and Joel 2.28, as other words of the same importance are also, which we render &#x27;pouring out,&#x27; such as Pro 1.23; Isa 32.15, 44.3, 52.15. … What is intended in this, is a plentiful dispensation of him to the end for which he is promised, with respect to a singular and eminent degree in his operations. The apostle expresses this word, or the accomplishment of what is promised in it, by Tit 3.6, &#x27;he has richly&#x27; or abundantly &#x27;poured out his Spirit.&#x27; Therefore, what is intended is not a mere grant and communication of the Spirit, but a plentiful effusion of him; which must have some eminent effects as pledges and tokens of this.</p></blockquote>

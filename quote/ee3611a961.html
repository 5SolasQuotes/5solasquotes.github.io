<main class="wrap"><figure class="quote" id="q-ee3611a961" data-kw="">
<blockquote><p>For Dr. [Tobias] Crisp and the Libertines [Antinomians] of New England, whose doctrine subverts the faith, say, there can be no marks of saving grace from whence we can draw either comfort or peace, ‘be it universal obedience, sincerity, love to the Brethren, but it may be in hypocrites, in a Jew following the righteousness of the law, Rom. 10:1, and renouncing Christ.’ Surely if works of saving grace speak no other thing than hypocrites and devils may have, then: First, holy walking is no ground of comfort and a good conscience has no more to yield David, Job, Hezekiah, Paul, the apostles and martyrs when they suffer for Christ and his truth, and are in heavy afflictions and chains than it can yield to the vilest of men.

2. A man, a Christian shall never find any grounds of certainty of his adoption in anything, save in the hidden decrees of election and reprobation, and if some immediate testimony of a Spirit, which may be [a] great doubt to many who walk as many Antinomians do, according to the flesh.

3. All their rejoicing in simplicity and godly sincerity, 2 Cor. 1:12, is empty fancies and delusions, for they rejoice in that in which hypocrites and reprobates may have as deep a share as they. But that there is also some immediate testimony of the Spirit, though never separated from the fruits of the Spirit, I hope to prove elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 1, p. 14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3966afb32c" data-kw="">
<blockquote><p>X. That our own regeneration can and ought to be known with certainty a posteriori from ourselves, or from those things which we feel in ourselves, 2 Cor. 13:5 with Rom. 8:5, 9, 11, 15–16. But that of other adults is known with the interposed judgment of charity, that is, with hypothetical certainty only, not absolute. Therefore the certainty of faith or of experience does not have place here, unless God has peculiarly revealed it to someone.

XI. That its [regeneration’s] primordial or infantile acts or effects in the second moment seem not rarely to be both more numerous and more perfect, at least more sensible and with greater commotion, than those which are elicited in adolescence or in adult age. Problems:

      1. Whether they are more perfect in themselves, or more sensible, with sensible commotion, devotion, sweetness, and taste?

      2. Whence is this? Whether also from the novelty of the thing, or the nearness of the opposite (namely, of the state and acts of corruption), so that contraries placed next to each other may more easily shine forth—as immediately after disease health is more vehemently felt, after darkness light? Whether God wishes to affect and attract the tender infancy of His own with tastes and sweetness of sensible devotion more than adult age?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

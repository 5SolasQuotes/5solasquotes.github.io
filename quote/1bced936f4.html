<main class="wrap"><figure class="quote" id="q-1bced936f4" data-kw="">
<blockquote><p>Hence we derive these instructions:

1. It is the duty of pastors to call and excite the people to the constant reading and meditation of the Scriptures: it is the duty of the people to obey such exhortations.

2. They grievously sin who excite Christian people to the knowledge of human traditions and fables; in the mean time forbidding them, as a thing full of danger, the reading of either Testament, that is, of the Divine word.

3. The word of God ought not only to be publicly preached in the temples, but to be read and heard in private houses.

4. In the word of God is contained the treasure of all wisdom necessary to salvation.

5. All, even the laics, should labour to obtain an understanding and full knowledge of Divine things.

6. That implied knowledge which the Papists would have to be sufficient for the laity, is the offspring of laziness, the mother of impiety, not of devotion.

Therefore, the decree of the Council of Trent, and received opinion of the Papists, by which they deny that the Scriptures ought to be had in the vernacular tongue, or that the study of the Scriptures is to be required from the laity, may be refuted from this passage: nay, they affirm, that it is more safe for them to be restrained from reading the Scriptures, and is sufficient for them to regulate their course of life by the direction of their Pastors alone.

But the contrary opinion (which is ours, and the same as the Apostles) we shall shew can be confirmed, the sources of our argument being indicated,

1. From the command of God, who commands the study of the Scriptures not only to the clergy but to the people, and so to all who live in the Church; Deut. xi. 18, 19.

2. From the intention of God; who would have the doctrine of salvation to be delivered in writing, to the intent that it might be accessible to all, John xx. 31, and Rom. xv. 4.

3. From the commendation of all those who have applied themselves to the reading of the Scriptures. The eunuch is commended Acts viii. 28; the Bereans, Acts xvii. 11: yea, all are pronounced blessed who become assiduous in the study of the Scriptures, Ps. i.

4. From the case of the Apostles; who, as they preached publicly the mysteries of salvation to the people, so also, by their Epistles, they recommended the whole doctrine to be read by the same. For it is most absurd for any one to say that what was heretofore written as much to the people as to the clergy, is not now proper to be read by the people. We may instance the Epistles to the Romans, Corinthians, Galatians, Ephesians.

5. From the utility and necessity of this study. By the reading of the Scriptures men are enlightened and converted, Ps. xix. 8, 9. They are directed as by the most faithful counselors, in all the ways of life, Ps. cxix. 24. They are armed against the fiery darts of Satan, Ephes. vi.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 132-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47ac56c75b" data-kw="perspicuity">
<blockquote><p>The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>

</figure><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 1: Prolegomena, ch. 14</span></figcaption>

</figure><figure class="quote" id="q-5cada0718d" data-kw="">
<blockquote><p>The Church of Rome makes four senses of the Scriptures, the literal, allegorical, tropological and anagogical, as in this her example: Melchizedek offered bread and wine. The literal sense is that the King of Salem with meat which he brought, refreshed the soldiers of Abraham being tired with travel. The allegorical is that the priest does offer up Christian ye Mass. The tropological is therefore something is to be given to the poor. The Anagogical is that Christ in like manner being in heaven, shall be the bread of life to the faithful. But this her device of the fourfold meaning of the Scripture must be exploded and rejected. There is one only sense, and the same is the Literal. An allegory is only a certain manner of uttering the same sense. The Anagoge and Tropology are ways whereby the sense may be applied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Prophesying</cite>, (London, 1607), pp. 30-31</span></figcaption>

</figure><figure class="quote" id="q-55d2775d85" data-kw="Spirit and Word">
<blockquote><p>We may now easily infer how erroneously our opponents act in vaunting of the Holy Spirit, for no other end than to give the credit of his name to strange doctrines, extraneous to the word of God, whereas he himself desires to be inseparably connected with the word of God; and Christ declares the same thing of him, when he promises him to the Church. And so indeed it is. The soberness which our Lord once prescribed to his Church, he wishes to be perpetually observed. He forbade that anything should be added to his word, and that anything should be taken from it. This is the inviolable decree of God and the Holy Spirit, a decree which our opponents endeavour to annul when they pretend that the Church is guided by the Spirit without the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a> › <a href="../topics/rome/the-church/infallibility.html">Infallibility</a></span></div>
<div class="actions"><button class="copy" data-copy="“We may now easily infer how erroneously our opponents act in vaunting of the Holy Spirit, for no other end than to give the credit of his name to strange doctrines, extraneous to the word of God, whereas he himself desires to be inseparably connected with the word of God; and Christ declares the same thing of him, when he promises him to the Church. And so indeed it is. The soberness which our Lord once prescribed to his Church, he wishes to be perpetually observed. He forbade that anything should be added to his word, and that anything should be taken from it. This is the inviolable decree of God and the Holy Spirit, a decree which our opponents endeavour to annul when they pretend that the Church is guided by the Spirit without the word.”

<blockquote><p>First of all I shall set forth the best contributions of the philosophers of the Greeks, because whatever there is of good has been given to men from above by God, since ‘every best gift and every perfect gift is from above, coming down from the Father of lights.’ If, however, there is anything that is contrary to the truth, then it is a dark invention of the deceit of Satan and a fiction of the mind of an evil spirit … In imitation of the method of the bee, I shall make my composition from those things which are conformable with the truth and from our enemies themselves gather the fruit of salvation. But all that is worthless and falsely labelled as knowledge I shall reject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-of-damascus.html">John of Damascus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fount of Knowledge</cite>, (c. 734), preface in The Fathers of the Church: A New Translation, 37: 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05eeb40900" data-kw="">
<blockquote><p>To speak more plainly: the word of God at this day, is twofold in the Church of God, 1. immediate. 2. mediate. I call that the immediate word of God, which doth proceed immediately out of God’s own mouth: and that I call mediate, which the Lord speaks by his preacher or Minister. We hold then and avouch, that the holy Scripture is that immediate and primary word of God, and to be unto us in steed of that first, immediate, and lively voice of God himself: yea, that it serves us in place not only of that lively voice of God, but also of the secret and insearchable mind of God, and of God’s unspeakable mysteries.

Our arguments are these: 1. For that this is the very will of God. They have Moses (saith he) and the prophets, that is, the books of Moses and the Prophets, Luk. 16. 29. 2. If we had nothing to supply the defect of the lively voice of God, then doubtless our state were worse then that of the old Church of the Jews, which had the oracles of God: but it is against all light of reason so to affirm.

3. Our third reason is this: The first ground of our faith must be, either the lively voice of God, or the very mind and counsel of God, or something to supply the want of God’s lively voice, and of the secret mind of God, which must also be unto us no less certain and firm, then if we heard God himself speak, or did behold and read the very mind of God; yea the very divine oracles written in God’s own breast: but now we have not the lively voice of God; now we see not the secret mind of God: therefore it must follow that we have something to supply the want of the lively voice of God, even means to reveal unto us the secret mind of God: and nothing can do this, but the sacred Scripture: therefore God’s holy written word is, and must be unto us as the very voice, and as the very mind or will of God himself manifested unto us.

The fourth reason. The Scripture contains all those things which God hath spoken in elder ages, and what God himself hath decreed in his secret counsel (so far as is meet for us to know) concerning our life and salvation: Ergo, &amp;c. Thus far of the immediate word of God. The mediate voice of God, we call the voice of the holy and true Church of God: for albeit men speak, yet the word spoken, is the word of God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), pp 42-43.</span></figcaption>

</figure><figure class="quote" id="q-0884aece0a" data-kw="">
<blockquote><p>I next refer to the Spirit’s work in connection with Christ’s priestly oblation: “Who, through the eternal Spirit, offered Himself without spot to God” (Heb. 9.14). The expression: “the eternal Spirit,” can only mean the Holy Spirit according to the usual acceptation of the term — not the divine nature of Christ, as too many expositors have understood it. The meaning is, that the Son of God, moved and animated by the Holy Ghost, offered Himself without spot as an atoning sacrifice.

The Spirit rendered Him an unspotted sacrifice. The Spirit discovered to Him the inflexible claims of God as well as inflamed Him with such love to man and zeal for God as prompted Him to go forward in spite of every hindrance, pain, and difficulty, to effect the world’s redemption, and thus fitted Him as man for His work The Holy Spirit, in a word, filled His mind with the unflagging ardour, zeal, and love which led Him to complete the sacrifice.

To explain the text as if it described the divine nature as priest and the human nature as the sacrifice, is inadmissible. The WHOLE PERSON is priest and victim; for all done by either nature belongs to the Person: HE offered HIMSELF, says the apostle.

In this view of the matter, it would be a mere tautology — if the eternal Spirit is interpreted of the divine nature — to say He offered Himself through the divine nature. It would on that principle be but a repetition of the same thing. If we take it, however, as intimating the action of the Holy Spirit, it will vividly represent the holy fire by which the sacrifices were consumed. One does not find, except on this interpretation, anything in the sacrifice of Christ that could be adduced as the antitype of the holy fire employed in the sacrifice.

Nor are the objections to the view which we have propounded of any weight. When it is objected that the Holy Spirit was not the Priest who offered the sacrifice, the obvious answer is that Christ as Priest offered Himself a sacrifice possessed of infinite value and excellence in consideration of His divine Person, and of the additional fact that it was unspotted and offered through the Holy Spirit. Because the Spirit was in Him as a Spirit of faith and zeal and love — the Redeemer took upon Him with the utmost alacrity all that was to be performed and endured for man’s redemption.

The Holy Spirit, which framed the Redeemer’s mind as well as body, perpetually rested upon Him during all His earthly sojourn, imparting to Him the full consciousness of His Sonship in the highest sense, and prompting Him to execute the mediatorial work imposed on Him (Isa. 42.1-4). That our Saviour was also raised from the dead by the Holy Ghost, is clearly taught by Peter, when he affirms that He was put to death in the flesh, but quickened by the Spirit (1 Pet. 3.18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 132-33.</span></figcaption>

<blockquote><p>Man, as a condemned sinner, can obtain nothing from God on his own account. He lies under the curse of a broken law; exposed to everlasting perdition. God can be to him only a consuming fire. There is an impassible barrier between such a man and God. There can be no communication between the holy and the unclean.

The prayers of the wicked are an abomination in the sight of God. He is surrounded with such an atmosphere of holiness, that the breathings of an impure spirit cannot reach him. There is only one channel of communication between the sinner and God, and that is Christ.

When God looks upon us, he can see nothing to approve. In his sight we are altogether as an unclean thing; even our righteousnesses are as filthy rags. Our holiest services are polluted in his sight. But there is a Day’s Man between us who is able to lay his hand upon both. Our prayers cannot come up before God with acceptance, but the angel of the everlasting covenant stands before the throne, with his golden vial, and He, the everlasting intercessor, pours from it the prayers of the saints, he perfumes them with the sacred incense of his own holiness, and they come up as a sweet savour before the Father. Thus it is that our prayers are all offered up for Christ’s sake, and it were well that we fully understood and deeply felt what is implied in the use of these most significant words.

There is reason to fear that many a prayer wafted heavenward remains unanswered, because the grand condition of all acceptable prayer is not fully felt as it ought to be! Men pray as if they had a right to ask, and a title to expect, favours from God, on their own independent footing. There is much trusting to his goodness and forbearance, and mercy, forgetful all the while, that God can only hear through the intercessor before the throne, and can only manifest his goodness through the one mediator, the man Christ Jesus.

When we ask of God, for Christ’s sake, the bestowment of any blessing, it were well that the truth were blazoned before the eye of our inner consciousness, that we cannot be accepted save in the beloved; that if God looks directly at us, we are condemned; that he can only be well pleased when he looks on us in the face of his anointed—when he beholds in the lamb that had been slain justice fully satisfied, and in the lamb now alive and living for ever more, the evidence of his own sealed and irrefragable covenant.

When we ask anything for Christ’s sake, we acknowledge that we are not worthy in ourselves to receive it—when we plead the name of Jesus, we acknowledge our own guilt, and proclaim him the sole ground of our hope —when we point to him, we entreat God not to look upon us—we renounce our own righteousness—we confess our own shame—we plead for a standing in Jesus—we claim an interest in his work—we profess to stand in his righteousness —to hope for mercy through his peace-speaking blood.</p></blockquote>

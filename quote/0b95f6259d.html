<blockquote><p>Through clear distinctions and theses, and by drawing on diverse sources ranging from Greek and Roman law to medieval Christian theology, Junius develops a method of classifying and interpreting the Mosaic laws that honors both their particular Jewish context and their universal and perpetual significance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Through clear distinctions and theses, and by drawing on diverse sources ranging from Greek and Roman law to medieval Christian theology, Junius develops a method of classifying and interpreting the Mosaic laws that honors both their particular Jewish context and their universal and perpetual significance.”

— Francis Junius, The Mosaic Polity">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThrough+clear+distinctions+and+theses%2C+and+by+drawing+on+diverse+sources+ranging+from+Greek+and+Roman+law+to+medieval+Christian+theology%2C+Junius+develops+a+method+of+classifying+and+interpreting+the+Mosaic+laws+that+honors+both+their+particular+Jewish+context+and+their+universal+and+perpetual+significance.%E2%80%9D%0A%0A%E2%80%94+Francis+Junius%2C+The+Mosaic+Polity&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b95f6259d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b95f6259d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=Through%20clear%20distinctions%20and%20theses%2C%20and,and%20their%20universal%20and%20perpetual%20significance." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-037b17dcd5" data-kw="">
<blockquote><p>XVII. Certain judicial laws have the character of common right, as to the substance and form of that eternal reason which is in God, or from God in nature and Scripture; but certain are of particular right, with respect to singular determinations, according to the reason of circumstances, things, and persons which are subject to them. In the former respect these laws retain their immutable part; but in the latter they are changed from time to time. … XX… Finally, the judicial law has been abolished as to form and external constitution, posited in the determination of particular circumstances, things, and facts: but not as to its substance and equity, both natural and divine. XXI. And this abrogation argues neither any defect in the laws, nor imprudence or change in their Author; but rather the most prudent counsel of the supreme and eternal Legislator, varying those things according to the convenience of persons, things, and circumstances, which were enacted for the common and particular good of the same, and abolishing what He had given only for a time (which Paul calls a time of reformation, Heb. 9:10). Indeed, with the distinction of the nation removed and the prefigured truth exhibited, those things had to be changed and cease which both distinguished the Jewish nation from others and shadowed forth the truth to come in the Messiah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’ (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-5a2e4d1aaa" data-kw="">
<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23</cite>, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-930c01a611" data-kw="">
<blockquote><p>XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 18</cite>, pp. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-f7f4fed4b1" data-kw="">
<blockquote><p>The great writers of all ages are cited [by Grotius] with a superfluous lavishness… as to give a historic catholicity to his doctrine by showing that the laws he is endeavoring to formulate have, in fact, been accepted in all times and by all men.” – Intro, p. 10 For a summary of some of Grotius’s distinctive points, some of which disagree with Rutherford, see the Intro, p. 11. Rutherford cites Grotius 42 times in Lex Rex. Selden, John – Of the Dominion, or, Ownership of the Sea, Two Books. In the First is showed that the Sea, by the Law of Nature, or Nations, is not common to all men, but capable of private dominion or propriety, as well as the land. In the Second is proved that the dominion of the British Sea, or that which encompasses the isle of Great Britain, is, and ever has been, a part or appendant of the empire of that island (London: 1652) ToC Selden (1584-1654) was an Erastian, English jurist, a scholar of England’s ancient laws and constitution, and a scholar of Jewish law. He was known as a polymath; John Milton hailed Selden in 1644 as “the chief of learned men reputed in this land.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4c49dd8aef" data-kw="">
<blockquote><p>A fifth argument is that which so much sounds in all books: If good works be the effect and fruit of our justification, then they cannot be conditions, or causa sine qua non [a cause without which: nothing] of our justification. The consequence is clear, because such a supposed condition, or causa sine qua non, must be antecedent, and going before. Now the Orthodox bring Augustine’s known position, which also may be made good out of Scripture, Bona opera non praecedunt justificandum, sed sequuntur justificatum [‘Good works do not precede being justified, but follow having been justified’]; and another to that sense is quoted out of Gregory: Non per opera venitur ad fidem, sed per fidem ad opera [‘not through works is one come to faith, but through faith to works’], faith must go before works. Till we are justified, we are not able to do anything that is good… Seeing therefore that justification is antecedent to a holy life, good works cannot be any condition of it; and by this we may see that more things are required to our salvation than to our justification; to the possession of heaven and [versus] the entitling us thereunto. For justification does entitle and interest us in that eternal inheritance which is performed by faith; but to be made actual partakers of everlasting happiness, good works are the way to that Kingdom, not the cause of it. Therefore none contend more then the Orthodox writers for the necessity of good works, and that in respect of salvation; yet in respect of our justification, then the Scripture calls them a menstruous rag and such as are utterly unworthy. It’s true that justification cannot be continued in a man unless he continue in good works, yet for all that they are not conditions of his justification: they are qualifications and determinations of the subject who is justified, but no conditions of his justification. As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God. Its a thousand times affirmed by our divines, many things are required to the constitution of some subject, which yet are not either causes or conditions of such and such an effect: Light is necessarily required and dryness as qualities in fire, yet it burns as it’s hot, not as light or dry. To the integral being of a man are required his head and shoulders, so that the eye could not see if not seated there; yet a man’s shoulders are not the causa sine qua non of his seeing. Many things are necessarily conjoined together, and yet one is not the condition of the others’ effect. So that this doctrine does not exclude, but [does] command holy works, only it gives faith and works their proper place.</p></blockquote>

<blockquote><p>3. But the word [‘to justify’] is used with that specialized meaning when it concerns the judgment of God as He absolves the sinner who stands before his judgment seat (Ps. 143:2; Rom. 5:16 and 8:33-34). And so this entire act of justification is depicted as a forensic process. Yet we still grant that justification sometimes appears also to include sanctification as its consequence because of the very strong, close connection between the two (Rom. 8:30; Titus 3:7, etc.).</p></blockquote>

</figure><figure class="quote" id="q-212ccc2b72" data-kw="">
<blockquote><p>For justification, see what it is: the Scripture in St. Paul’s epistles speaks of justification by faith; and in St. James, of justification by works. Now it will be useful for us in this point to know whence justification comes. It comes from justice, tsedeck as the original [Hebrew] has it, and ‘to justify’; so that justification and righteousness depend one upon the other. For what is justification but the manifestation of the righteousness that is in a man? and therefore in Gal. 3:21, they are put for one and the same thing: ‘For if there had been a Law given which could have given life, verily righteousness had been by the Law;’ that is, justification had been by the Law. Again, ‘If righteousness be by the Law, then Christ is dead in vain,’ Gal. 2. That is also: If justification had been by the Law, etc. justification is a manifestation of righteousness. And as many ways as righteousness is taken, so many ways is justification, which is a declaration of righteousness; so that if there be a double righteousness, there must be also a double justification. Beloved, I bring you no new doctrine; be not afraid of that; but I show you how to reconcile places of Scripture against the Church of Rome and those things which the Papists bring against us in this point. It stands by reason, seeing justification is a declaration of righteousness, that there must be so many sorts of justification as there be of righteousness. Now there is a double sort of righteousness, Rom. 8:4, ‘That the righteousness of the Law may be fulfilled in us.’ See then there is a double righteousness: there is a righteousness fulfilled in us, and a righteousness fulfilled by us; that is walking in the Spirit. The righteousness fulfilled in us is fulfilled by another and is made ours by imputation; so we have a righteousness without us and a righteousness inherent in us; the righteousness without us is forgiveness of sins and pardon of them, which is a gracious act of God, letting fall all actions against me, and accounting of me as if I had never sinned against Him all my lifetime; then there is a righteousness within me, an inherent righteousness. And if a righteousness, then justification; for that is but a declaration of righteousness. And so that which the Fathers call “justification” is taken generally for sanctification; that which we call “justification”, they call forgiveness of sins; that which we call “sanctification”, they call “justification”; so that the difference is only in the terms. Justification we must know, is not taken only as opposed to condemnation, which is the first kind of righteousness: Rom. 6:7, ‘He that is dead, is freed from sin.’ If you look to the Greek or to the margin, it is, ‘He that is dead is justified from sin;’ this is not taken in the first sense as opposed to condemnation, but in the other sense as it has relation to final grace; The perfection of sanctification is wrought in me; for where there is final grace, there is a supersedeas from all sin; so Rev. 22:11, ‘Let him that is righteous, be righteous still;’ the Greek is, ‘Let him that is righteous, be justified still.’ See then the difference between Saint Paul and Saint James. Saint Paul speaks of that which consists in remission of sins, as in comparing the apostle with David will appear, ‘Blessed is the man whose sins are forgiven.’ [Ps. 32:1] Saint James speaks of justification in the second acception. You need not fly to that distinction of justification before God and justification before men; think not that Saint James speaks only of justification before men. Was not Abraham our father justified by works when he offered up Isaac on the altar? [Gen. 22] What, justified by killing his son? this was a proper work indeed to justify him before man, to be a parricide; to kill his son, though it were not so before God. So Ps. 106, we read how God accounted the act of Phineas as for righteousness. Thus you see how works are accounted righteousness in the second kind of righteousness. In the former righteousness we are justified by faith; for in righteousness inherent there is a goodly chain of virtues: ‘Add to your faith virtue,’ etc. Add one grace to another; add to virtue knowledge. Faith is but one part of the crown. Now this justification in the first sense whereby my sins are forgiven is called the righteousness of God because of Christ which is God, because it is wrought by Christ, Dan. 9; He is called an everlasting righteousness, which continues forever world without end; for do not think the saints in Heaven have only the second kind of righteousness; for they have the same covering by justification by Christ in Heaven that they had before; God covers their sins not here only, but there also; justification follows them forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 15th Sermon, on Rom. 5:1, pp. 396-99</span></figcaption>

e+is+a+righteousness+fulfilled+in+us%2C+and+a+righteousness+fulfilled+by+us%3B+that+is+walking+in+the+Spirit.+The+righteousness+fulfilled+in+us+is+fulfilled+by+another+and+is+made+ours+by+imputation%3B+so+we+have+a+righteousness+without+us+and+a+righteousness+inherent+in+us%3B+the+righteousness+without+us+is+forgiveness+of+sins+and+pardon+of+them%2C+which+is+a+gracious+act+of+God%2C+letting+fall+all+actions+against+me%2C+and+accounting+of+me+as+if+I+had+never+sinned+against+Him+all+my+lifetime%3B+then+there+is+a+righteousness+within+me%2C+an+inherent+righteousness.+And+if+a+righteousness%2C+then+justification%3B+for+that+is+but+a+declaration+of+righteousness.+And+so+that+which+the+Fathers+call+%E2%80%9Cjustification%E2%80%9D+is+taken+generally+for+sanctification%3B+that+which+we+call+%E2%80%9Cjustification%E2%80%9D%2C+they+call+forgiveness+of+sins%3B+that+which+we+call+%E2%80%9Csanctification%E2%80%9D%2C+they+call+%E2%80%9Cjustification%E2%80%9D%3B+so+that+the+difference+is+only+in+the+terms.+Justification+we+must+know%2C+is+not+taken+only+as+opposed+to+condemnation%2C+which+is+the+first+kind+of+righteousness%3A+Rom.+6%3A7%2C+%E2%80%98He+that+is+dead%2C+is+freed+from+sin.%E2%80%99+If+you+look+to+the+Greek+or+to+the+margin%2C+it+is%2C+%E2%80%98He+that+is+dead+is+justified+from+sin%3B%E2%80%99+this+is+not+taken+in+the+first+sense+as+opposed+to+condemnation%2C+but+in+the+other+sense+as+it+has+relation+to+final+grace%3B+The+perfection+of+sanctification+is+wrought+in+me%3B+for+where+there+is+final+grace%2C+there+is+a+supersedeas+from+all+sin%3B+so+Rev.+22%3A11%2C+%E2%80%98Let+him+that+is+righteous%2C+be+righteous+still%3B%E2%80%99+the+Greek+is%2C+%E2%80%98Let+him+that+is+righteous%2C+be+justified+still.%E2%80%99+See+then+the+difference+between+Saint+Paul+and+Saint+James.+Saint+Paul+speaks+of+that+which+consists+in+remission+of+sins%2C+as+in+comparing+the+apostle+with+David+will+appear%2C+%E2%80%98Blessed+is+the+man+whose+sins+are+forgiven.%E2%80%99+%5BPs.+32%3A1%5D+Saint+James+speaks+of+justification+in+the+second+acception.+You+need+not+fly+to+that+distinction+of+justification+before+God+and+justification+before+men%3B+think+not+that+Saint+James+speaks+only+of+justification+before+men.+Was+not+Abraham+our+father+justified+by+works+when+he+offered+up+Isaac+on+the+altar%3F+%5BGen.+22%5D+What%2C+justified+by+killing+his+son%3F+this+was+a+proper+work+indeed+to+justify+him+before+man%2C+to+be+a+parricide%3B+to+kill+his+son%2C+though+it+were+not+so+before+God.+So+Ps.+106%2C+we+read+how+God+accounted+the+act+of+Phineas+as+for+righteousness.+Thus+you+see+how+works+are+accounted+righteousness+in+the+second+kind+of+righteousness.+In+the+former+righteousness+we+are+justified+by+faith%3B+for+in+righteousness+inherent+there+is+a+goodly+chain+of+virtues%3A+%E2%80%98Add+to+your+faith+virtue%2C%E2%80%99+etc.+Add+one+grace+to+another%3B+add+to+virtue+knowledge.+Faith+is+but+one+part+of+the+crown.+Now+this+justification+in+the+first+sense+whereby+my+sins+are+forgiven+is+called+the+righteousness+of+God+because+of+Christ+which+is+God%2C+because+it+is+wrought+by+Christ%2C+Dan.+9%3B+He+is+called+an+everlasting+righteousness%2C+which+continues+forever+world+without+end%3B+for+do+not+think+the+saints+in+Heaven+have+only+the+second+kind+of+righteousness%3B+for+they+have+the+same+covering+by+justification+by+Christ+in+Heaven+that+they+had+before%3B+God+covers+their+sins+not+here+only%2C+but+there+also%3B+justification+follows+them+forever.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+Eighteen+Sermons+preached+in+Oxford%2C+1640%2C+of+conversion%2C+unto+God%2C+of+redemption+%26+justification%2C+by+Christ+%28London%3A+1660%29+%7C+15th+Sermon%2C+on+Rom.+5%3A1%2C+pp.+396-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F212ccc2b72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/212ccc2b72.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=For%20justific

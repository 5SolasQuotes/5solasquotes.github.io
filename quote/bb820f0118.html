<main class="wrap"><figure class="quote" id="q-bb820f0118" data-kw="">
<blockquote><p>The New York statute provides that, “No child or person, not vaccinated, shall be admitted or received into any of the public schools of the State.”

In accordance with the requirements of this monstrous law no healthy child can lawfully be taught in our public schools until he shall have been diseased. “No disease, no education,” is the gruesome mandate of this odious and detestable law. “Be diseased or grow up in ignorance” is the inscription written over the school house door, in violation of right, reason, and common sense.

Think of it, reader! The enjoyment of health is made a penal offense by a law of the Empire State, of this nation, while the distribution of undefined disease is made obligatory! Think of the unparalleled injustice and unspeakable outrage of the compulsory infliction of disease by the State upon its healthy children as a qualification for school attendance in this age of boasted civilization, hygienic enlightenment, and sanitary science! The enactment of a law prescribing mental disease as a necessary preliminary for admission to the public schools of the State would not be more preposterous and unjust than is the statute which prescribes bodily disease as a requirement for school attendance.

This detestable and obnoxious statute which commands parents to endanger the lives and health of their children by subjecting them to a disease-transmitting operation of superstitious and barbaric origin is a species of legislative tyranny which is utterly unjustifiable and intolerable. The enforcement of this infamous law is one of the most fearful outrages, upon human life, liberty and health, that avarice, bigotry cowardice and political intrigue have ever devised. This monstrous statute which prescribes disease in the name of health is an insult to the intelligence of every sensible man and woman in the Empire State.

This prescription is so foreign and repulsive to every natural instinct of humanity that it is only through the combined influence of tradition, custom and State authority that it is rendered at all tolerable in a civilized community of sane people. The enforcement of this law is a crime. To call it by any other name is to temporize. Although at one time an implicit believer in the “dairy maids creed” having vaccinated more than 3,000 victims ignorantly presuming that I was protecting them from small-pox, I now denounce vaccination as the supremest folly of the age, and compulsory vaccination as the “crime of the century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-w-hodge.html">J. W. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practice of Medicine. State-Inflicted Disease in our Public Schools in Medical Century</cite></span></figcaption>

<blockquote><p>A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.</p></blockquote>

</figure><figure class="quote" id="q-da17ea4484" data-kw="">
<blockquote><p>If it be said, The fathers may engage the posterity by an oath to surrender themselves as loyal subjects to the man who justly and deservedly made the fathers vassals by the title of the sword of justice, I answer: The fathers may indeed dispose of the inheritance of their children, because that inheritance belongs to the father as well as to the son; but because the liberty of the son being born with the son (all men being born free from all civil subjection), the father has no more power to resign the liberty of his children than their lives; and the father, as a father, has not power of the life of his child; as a magistrate he may have power, and, as something more than a father, he may have power of life and death. I hear not what Grotius says, ‘Those who are not born have no accidents, and so no rights, Non entis nulla sunt accidentia [There are no accidents of non-being]; then children not born have neither right nor liberty.” And so no injury (may some say) can be done to children not born, though the fathers should give away their liberty to the conquerors — those who are not capable of law are not capable of injury contrary to law. Answer: There is a virtual alienation of rights and lives of children not born unlawful, because the children are not born. To say that children not born are not capable of law and injuries virtual, which become real in time, might say, Adam did not any injury to his posterity by his first sin, which is contrary to God’s word; so those who vowed yearly to give seven innocent children to the Minotaur to be devoured, and to kill their children not born to bloody Molech, did no acts of bloody injury to their children; nor can any say, then, that fathers cannot tie themselves and their posterity to a king by succession. But I say, to be tied to a lawful king is no making away of liberty, but a resigning of a power to be justly governed, protected and awed from active and passive violence.</p></blockquote>

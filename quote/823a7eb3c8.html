<main class="wrap"><figure class="quote" id="q-823a7eb3c8" data-kw="">
<blockquote><p>God in the beginning “created man in his own image,” Gen. i. 27, — that is, “upright,” Eccles. vii. 29, endued with a nature composed to obedience and holiness. That habitual grace and original righteousness wherewith he was invested was in a manner due unto him for the obtaining of that supernatural end whereunto he was created. A universal rectitude of all the faculties of his soul, advanced by supernatural graces, enabling him to the performance of those duties whereunto they were required, is that which we call the innocency of our first parents.

Our nature was then inclined to good only, and adorned with all those qualifications that were necessary to make it acceptable unto God, and able to do what was required of us by the law, under the condition of everlasting happiness. Nature and grace, or original righteousness, before the fall, ought not to be so distinguished as if the one were a thing prone to evil, resisted and quelled by the other; for both complied, in a sweet union and harmony, to carry us along in the way of obedience to eternal blessedness. [There was] no contention between the flesh and the Spirit; but as all other things at theirs, so the whole man jointly aimed at his own chiefest good, having all means of attaining it in his power. That there was then no inclination to sin, no concupiscence of that which is evil, no repugnancy to the law of God, in the pure nature of man, is proved, because, —

First, The Scripture, describing the condition of our nature at the first creation thereof, intimates no such propensity to evil, but rather a holy perfection, quite excluding it. We were created “in the image of God,” Gen. i. 27, — in such a perfect uprightness as is opposite to all evil inventions, Eccles. vii. 29; to which image when we are again in some measure “renewed” by the grace of Christ, Col. iii. 10, we see by the first-fruits that it consisted in “righteousness and true holiness,” — in truth and perfect holiness, Eph. iv. 24.

Secondly, An inclination to evil, and a lusting after that which is forbidden, is that inordinate concupiscence wherewith our nature is now infected; which is everywhere in the Scripture condemned as a sin; St Paul, in the seventh to the Romans, affirming expressly that it is a sin, and forbidden by the law, verse 7, producing all manner of evil, and hindering all that is good, — a “body of death,” verse 24; and St James maketh it even the womb of all iniquity, James i. 14, 15. Surely our nature was not at first yoked with such a troublesome inmate. Where is the uprightness and innocency we have hitherto conceived our first parents to have enjoyed before the fall? A repugnancy to the law must needs be a thing sinful.

An inclination to evil, to a thing forbidden, is an anomy, — a deviation and discrepancy from the pure and holy law of God. We must speak no more, then, of the state of innocency, but only of a short space wherein no outward actual sins were committed. Their proper root, if this be true, was concreated with our nature. Is this that obediential harmony to all the commandments of God which is necessary for a pure and innocent creature, that hath a law prescribed unto him?

By which of the ten precepts is this inclination to evil required? Is it by the last, “Thou shalt not covet?” or by that sum of them all, “Thou shalt love the Lord thy God with all thy heart,” etc.? Is this all the happiness of paradise, — to be turmoiled with a nature swelling with abundance of vain desires, and with a main stream carried headlong to all iniquity, if its violent appetite be not powerfully kept in by the bit and bridle of original righteousness? So it is we see with children now; and so it should have been with them in paradise, if they were subject to this rebellious inclination to sin.

Thirdly, and principally, Whence had our primitive nature this affection to those things that were forbidden it, — this rebellion and repugnancy to the law, which must needs be an anomy, and so a thing sinful? There was as yet no demerit, to deserve it as a punishment. What fault is it to be created? The operation of any thing which hath its original with the being of the thing itself must needs proceed from the same cause as doth the essence or being itself; as the fire’s tending upwards relates to the same original with the fire: and, therefore, this inclination or affection can have no other author but God; by which means he is entitled not only to the first sin, as the efficient cause, but to all the sins in the world arising from thence.

Plainly, and without any strained consequences, he is made the author of sin; for even those positive properties which can have no other fountain but the author of nature, being set on evil, are directly sinful. And here the idol of free-will may triumph in this victory over the God of heaven. Heretofore all the blame of sin lay upon his shoulders … But let them that will, rejoice in these blasphemies: it sufficeth us to know that “God created man upright,” though he “hath sought out many inventions;” …</p></blockquote>

<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>

h we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.”

— William Whitaker, A Treatise on Original Sin, … (d. 1595; Legat, 1600), bk. 1, ch. 7, pp. 25-26 trans. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+you+%5Ba+Romanist%5D+say+that+that+privation+which+Adam+contracted+by+sinning%2C+we%2C+by+being+born%2C+although+it+is+a+sin%2C+is+yet+not+our+sin+nor+proper+to+us%2C+unless+because+what+Adam+did+when+he+sinned%2C+we+also+did%2C+the+apostle+saying%2C+%E2%80%9CIn+him+all+have+sinned.%E2%80%9D+%5BRom.+5%3A12%5D+And+this+also+I+acknowledge.+For+his+will+was+ours%3B+and+therefore+his+transgression+is+ours%2C+because+he+is+not+considered+as+one+man%2C+but+as+the+root+of+the+human+race%2C+in+whom+we+were+all+included+by+virtue+%5Bin+potency+or+in+power%5D%2C+as+Augustine+says%2C+%E2%80%9Cwe+were+all+that+one+man%E2%80%9D+%28De+pecc.+merit.+%26+remiss.%2C+bk.+1%2C+ch.+10%29.+But+now+original+sin+does+not+consist+only+in+the+deformity+which+the+fault+of+Adam+brought+forth%2C+but+it+also+comprehends+the+act+of+that+sin+itself%2C+if+we+did+the+same+as+Adam+did%2C+if+we+truly+sinned+with+Adam%2C+and+what+he+willed%2C+we+willed.+Original+sin+will+therefore+not+be+so+involuntary+as+you+think%2C+so+that+it+is+therefore+the+least+of+all+sins+because+it+has+the+least+of+that+which+is+voluntary.+For+if+Adam%E2%80%99s+will+was+ours%2C+as+much+as+Adam+willed%2C+so+much+are+we+also+to+be+thought+to+have+willed.+But+Adam+sinned+knowingly+and+willingly%3B+we+therefore+in+him%2C+and+by+that+his+will%2C+both+have+sinned+and+willed+to+sin.+But+unless+you+admit+imputation+here+%28a+word+from+which+you+abhor+and+carefully+guard+yourself%29%2C+you+will+fall+into+the+greatest+absurdity%2C+and+you+will+fight+with+yourself%2C+you+who+a+little+before+said+that+the+sin+which+entered+into+the+world%2C+and+by+which+we+are+all+made+sinners%2C+is+not+the+actual+sin+of+Adam%2C+but+a+certain+iniquity+contracted+from+it+and+transmitted+into+us.+Now+you+attribute+to+us+the+same+will+of+sinning+which+was+in+Adam%3B+otherwise%2C+you+affirm%2C+this+privation+left+in+nature+by+sin+could+not+make+us+sinners.+Therefore%2C+we+are+not+only+bound+by+a+habitual+iniquity%2C+but+we+have+sinned+with+an+actual+will+in+Adam%3B+and+this+will+is+primarily+to+be+considered+in+original+sin%2C+without+which+we+could+neither+be+nor+be+held+as+sinners.+What+you+%5BBellarmine%5D+interpose+concerning+a+pact+or+precept+pertains+nothing+to+the+matter%3B+for+whether+Adam+received+this+justice+on+this+law+and+condition%2C+that+he+should+either+preserve+or+lose+it+for+himself+and+his+own%2C+or+whether+no+such+convention+intervened+between+God+and+Adam%2C+since+he+was+the+parent+and+origin+of+the+nature+and+of+the+human+race%2C+it+was+necessary+that+in+him+we+either+stand+or+fall.+Although%2C+that+God+threatened+him+with+death+if+he+should+move+his+hand+to+the+forbidden+tree%2C+from+this+it+sufficiently+appears+that+he+had+been+forewarned+of+the+danger+into+which+he+would+cast+himself+headlong+if+he+should+sin%2C+of+which+nothing+was+to+be+feared+if+he+should+remain+in+his+duty.+And+hither+is+wont+to+be+brought+what+we+read+in+the+prophet%3A+%E2%80%9CBut+they+like+Adam+have+transgressed+the+covenant%E2%80%9D+%28Hos.+6%3A7%29.+Nor+is+it+to+be+thought+that+Adam+was+ignorant+either+of+the+reward%2C+if+he+should+not+sin%2C+or+of+the+punishment%2C+if+he+should+dare+to+sin.+Unless+this+had+been+foretold+to+him%2C+he+would+have+had+some+excuse%2C+although+not+a+sufficient+one%3B+now%2C+having+been+taught+before+of+the+event%2C+since+he+did+not+have+faith+nor+take+care+for+himself%2C+he+is+to+be+thought+to+have+deservedly+fallen+into+this+calamity.+Although%2C+however%2C+there+had+been+no+word+on+this+matter%2C+yet+what+unhappiness+he+willingly+brings+upon+himself%2C+God+has+justly+inflicted+upon+all+his+posterity.+But+in+what+way%3F+Because+His+will+is+the+norm+of+right+and+of+justice.+You+will+never+otherwise+understand+it+to+have+been+just+that+we+are+all+born+miserable+on+account+of+the+temerity%2C+or+infidelity%2C+or+ambition%2C+or+whatever+fault+of+the+first+man.+For+that+you+say+his+will+was+ours%2C+and+we+willed+in+him%2C+I+confess+to+be+true%2C+but+the+reason+for+this+truth+is+none+other+than+the+will+of+the+creator.+For+what+cause+will+you+bring+%5Bon+your+view%5D+why+all+children+do+not+in+the+same+way+atone+for+the+faults+of+their+parents%3F+You+will+say+that+Adam+is+to+be+considered+as+the+seed+and+principle+of+nature%2C+and+his+sin+was+the+sin+of+nature+itself%3B+the+sins+of+others+are+personal%3B+therefore+his+is+transfused+with+nature%2C+not+those+of+others.+I+hear%2C+and+I+do+not+object.+But+why+Adam+by+sinning+destroyed+not+only+his+person+but+nature%2C+when+other+men+harm+their+own+persons+but+do+not+make+nature+worse%2C+assign+a+cause%2C+if+you+can%2C+other+than+the+most+just+will+of+God.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Treatise+on+Original+Sin%2C+%E2%80%A6+%28d.+1595%3B+Legat%2C+1600%29%2C+bk.+1%2C+ch.+7%2C+pp.+25-26+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc3c1fb98.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc3c1fb98.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=For%20you%20%5Ba%20Romanist%5D%20say%20that,the%20most%20just%20will%20of%20God&amp;text=For%20you%20%5Ba%20Romanist%5D%20say%20that%20that%20privation&amp;text=other%20than%20the%20most%20just%20will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘To bind’ is to denounce God’s wrath against impenitent sinners. ‘To loose’ is to pronounce remission of sins to repentant sinners; both which have certain degrees. The degrees of binding are:

1. A severe exhortation and commination, after private admonitions have been rejected; this must be done by the presbytery. (Mt. 18:15-17)

2. A keeping off from the Lord’s Supper. (Mt. 7:6)

3. The greater excommunication, by which the sinner is cast out of the Church, yet not without hope of pardon and return, if he repent. (1 Cor. 5:5)

4. Anathema, or in the Syriac word, Maran-atha, when he is cast out without hope. (1 Cor. 16:22; 1 Jn. 5:16)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ... (d. 1629; London: Mab, 1650), bk. 1, ch. 26, ‘Of the outward administration of the Church,’, p. 177</span></figcaption>

</figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin Author of sin Justice">
<blockquote><p>He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Vol. 2 (on original sin)</span></figcaption>

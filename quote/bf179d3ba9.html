<blockquote><p>Her ministry should be learned and pious. Without the former, they will only betray, through ignorance, their cause into the hands of the enemy; without the latter, they will pollute the sacred sanctuary.

Consider, for a moment, what a ridiculous figure the ambassador sent to negotiate with a foreign nation would make, who could not read his master’s commission. Would such an one be qualified to be an ambassador to an earthly potentate? Is not the negotiation of the King of kings much more important than the adjustment of the differences between states and empires?

When Christ called his ministers in an extraordinary manner, he gave them extraordinary qualifications: and among these we find the gift of tongues. In 1 Tim. 1:7, those are severely reprehended, who presume to enter on an office without due qualifications: “desiring to be teachers of the law, yet understanding neither what they say, nor whereof they affirm.” Such are the clouds of illiterate, methodistic locusts which darken the horizon of these States. Without abilities, natural or acquired, they pour forth like torrents, over the face of the earth, and lead aside the simple and unwary. The infuriated zeal with which they propagate their poisonous doctrines, resembles much the character of the Scribes and Pharisees, mentioned, Matt. 23:15: “Who compass sea and land to make one proselyte, and when he is made, he is rendered twofold more the child of hell than themselves.”

Without a due measure of learning, how can they meet the cavillings of deists and crafty impostors, and so act the part of an evangelist, required, Tit. 1:9, namely, to be able to convince the gainsayers, and put adversaries to silence?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 30-1.</span></figcaption>

<blockquote><p>Ordination is the act of a presbytery.[t] The power of ordering the whole work of ordination is in the whole presbytery, which, when it is over more congregations than one, whether these congregations be fixed or not fixed, in regard of officers or members, it is indifferent as to the point of ordination.[v] [t] 1 Tim. 4:14. [v] 1 Tim. 4:14. It is very requisite, that no single congregation, that can conveniently associate, do assume to itself all and sole power in ordination:

1. Because there is no example in scripture that any single congregation, which might conveniently associate, did assume to itself all and sole power in ordination; neither is there any rule which may warrant such a practice.

2. Because there is in scripture example of an ordination in a presbytery over diverse congregations; as in the church of Jerusalem, where were many congregations: these many congregations were under one presbytery, and this presbytery did ordain. The preaching presbyters orderly associated, either in cities or neighboring villages, are those to whom the imposition of hands doth appertain, for those congregations within their bounds respectively.</p></blockquote>

<blockquote><p>Object. 15. The Arguments for a Classical, or Presbyterial Church do much side with Prelacy; for you make many Lords ruling and not teaching.

Answ. Let all judge whether the independent power of three Elders accountable to none, in a Church-way, but to Jesus Christ only, as you make your little Kingdoms on Earth, be nearer to the Pope’s Monarchy, and especially when there is but one Pastor in the Congregation, then the subordinate Government of fourscore, or an hundred Elders, sure I am, three Neighbours are nearer to one Monarch, then three hundred. 2. One Monarchical Society is as tyrannical Antichristianism as one Monarchical Pastor. 3. If we made many ruling and domineering Lords, you should say something; but we make many servants endued only with Ministerial power, only to teach and rule, and to be accomptable to the Church; your Eldership in this agreeth with the Pope, that though they deliver many Souls to Satan, yet no Man on Earth can, in a Church-way, say, What do you?</p></blockquote>

<blockquote><p>2. No man may take this honour to himself, unless he be called of God, and sent to preach his Word in the Name of God, Rom. 10:14-15. But all who have the gifts of preaching the Word are not called and sent of God. For those who are sent of God are sent either by an immediate and extraordinary call, or by a mediate call by the Church: but whereas now an extraordinary mission or sending is ceased in the Church, those are therefore by the ordinary ecclesiastical call separated to the office of preaching, who may lawfully undertake it. 1 Tim. 4:14 &amp; 5:22; 2 Tim. 2:2-3. … We reject therefore the contrary assertion of those [congregationalists] who affirm this to be an ordinance perpetual and ordinary in the Church, that a private Christian endued with gifts, either ordinarily or upon occasion, being thought fit in the judgment of those to whom it belongs, may (by the Word of God) preach publicly in the church-assembly with all authority, though he bear no Church office. But to us it’s certain that even under the Old Testament in the Jewish Church, every one was not admitted to speak publicly in the synagogues, but that it was the ordinary function of those that are called scribes and lawyers (the Levites being also for this cause distributed into many places), whereupon they are said to sit on Moses’s chair. If any were endued with extraordinary gifts of prophecy, as the prophets in Israel, this was permitted and enjoyned him by the Word of God, publicly to preach in God’s Name. When the prophet Amos was forbidden by the Chief Priest to prophecy at Bethel, he does not challenge this liberty to the Israelites, that they might publicly preach the Word of God in God’s Name in the holy assemblies, but pleads his extraordinary mission, whereby he was sent of God to preach this word, Amos 7:14-15. And so perhaps was it permitted to the sons of the prophets, who were fitted, educated, and set apart for the ecclesiastical ministry, 1 Sam. 19:20. In the synagogues, after the reading of Moses and the prophets was ended, there were exhortations added; which exhortations if at any time occasion required, and it so seemed good to the rulers of the synagogue, in corrupt times especially, it was indeed permitted to some, out of order, to teach and exhort; but they were always such as had testimony of their gifts, and of whom there was a general opinion of their mission extraordinary or ordinary, by reason of the doctrine they preached, and the works they did. Thus at Nazareth Christ was permitted in the synagogue to read and explain the writings of the prophets, Lk. 4:16, as one who by reason of his majesty and miracles did everywhere obtain audience, as reverend Beza here notes; by which right he taught both in the Temple and everywhere: wherefore also the ordinary doctors demanded of him by what authority he did it, Mt. 21:23. So we find that Paul and Barnabas were allowed, Acts 13:15, publicly to speak and exhort in the synagogue at Antioch; as being such whose fame was already known to those of Antioch: for they had, before this time, for a whole year preached the Word of God to many there, and brought many to the faith of Christ; and Agabus who was joined with them, did by an extraordinary gift of prophesy foretell to those of Antioch the famine approaching; where were also many other prophets and doctors, who preached the Word of God both to Jews and Greeks: See Acts 11:19-21, 25-28, and 13:1-2, etc. But in the practice of the New Testament, none but prophets by gift and office, either extraordinary or ordinary, were permitted publicly in the assembly of believers to preach the Word of God in Christ’s Name, as appears, 1 Cor. 14:29-31, etc. The apostle speaks not of any in the congregation promiscuously, but of prophets lawfully called to instruct the Church of God (says Beza on this place) and therefore they are not to be hearkened to [namely the congregationalists], who from hence gather that any of the assembly may speak in the Church, and who reprehend the custom of having only a sermon preached by one.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. No man may take this honour to himself, unless he be called of God, and sent to preach his Word in the Name of God, Rom. 10:14-15. But all who have the gifts of preaching the Word are not called and sent of God. For those who are sent of God are sent either by an immediate and extraordinary call, or by a mediate call by the Church: but whereas now an extraordinary mission or sending is ceased in the Church, those are therefore by the ordinary ecclesiastical call separated to the office of preaching, who may lawfully undertake it. 1 Tim. 4:14 &amp; 5:22; 2 Tim. 2:2-3. … We reject therefore the contrary assertion of those [congregationalists] who affirm this to be an ordinance perpetual and ordinary in the Church, that a private Christian endued with gifts, either ordinarily or upon occasion, being thought fit in the judgment of those to whom it belongs, may (by the Word of God) preach publicly in the church-assembly with all authority, though he bear no Church office. But to us it’s certain that even under the Old Testament in the Jewish Church, every one was not admitted to speak publicly in the synagogues, but that it was the ordinary function of those that are called scribes and lawyers (the Levites being also for this cause distributed into many places), whereupon they are said to sit on Moses’s chair. If any were endued with extraordinary gifts of prophecy, as the prophets in Israel, this was permitted and enjoyned him by the Word of God, publicly to preach in God’s Name. When the prophet Amos was forbidden by the Chief Priest to prophecy at Bethel, he does not challenge this liberty to the Israelites, that they might publicly preach the Word of God in God’s Name in the holy assemblies, but pleads his extraordinary mission, whereby he was sent of God to preach this word, Amos 7:14-15. And so perhaps was it permitted to the sons of the prophets, who were fitted, educated, and set apart for the ecclesiastical ministry, 1 Sam. 19:20. In the synagogues, after the reading of Moses and the prophets was ended, there were exhortations added; which exhortations if at any time occasion required, and it so seemed good to the rulers of the synagogue, in corrupt times especially, it was indeed permitted to some, out of order, to teach and exhort; but they were always such as had testimony of their gifts, and of whom there was a general opinion of their mission extraordinary or ordinary, by reason of the doctrine they preached, and the works they did. Thus at Nazareth Christ was permitted in the synagogue to read and explain the writings of the prophets, Lk. 4:16, as one who by reason of his majesty and miracles did everywhere obtain audience, as reverend Beza here notes; by which right he taught both in the Temple and everywhere: wherefore also the ordinary doctors demanded of him by what authority he did it, Mt. 21:23. So we find that Paul and Barnabas were allowed, Acts 13:15, publicly to speak and exhort in the synagogue at Antioch; as being such whose fame was already known to those of Antioch: for they had, before this time, for a whole year preached the Word of God to many there, and brought many to the faith of Christ; and Agabus who was joined with them, did by an extraordinary gift of prophesy foretell to those of Antioch the famine approaching; where were also many other prophets and doctors, who preached the Word of God both to Jews and Greeks: See Acts 11:19-21, 25-28, and 13:1-2, etc. But in the practice of the New Testament, none but prophets by gift and office, either extraordinary or ordinary, were permitted publicly in the assembly of believers to preach the Word of God in Christ’s Name, as appears, 1 Cor. 14:29-31, etc. The apostle speaks not of any in the congregation promiscuously, but of prophets lawfully called to instruct the Church of God (says Beza on this place) and therefore they are not to be hearkened to [namely the congregationalists], who from hence gather that any of the assembly may speak in the Church, and who reprehend the custom of having only a sermon preached by one.”

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, p. 79, 80-83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+No+man+may+take+this+honour+to+himself%2C+unless+he+be+called+of+God%2C+and+sent+to+preach+his+Word+in+the+Name+of+God%2C+Rom.+10%3A14-15.+But+all+who+have+the+gifts+of+preaching+the+Word+are+not+called+and+sent+of+God.+For+those+who+are+sent+of+God+are+sent+either+by+an+immediate+and+extraordinary+call%2C+or+by+a+mediate+call+by+the+Church%3A+but+whereas+now+an+extraordinary+mission+or+sending+is+ceased+in+the+Church%2C+those+are+therefore+by+the+ordinary+ecclesiastical+call+separated+to+the+office+of+preaching%2C+who+may+lawfully+undertake+it.+1+Tim.+4%3A14+%26+5%3A22%3B+2+Tim.+2%3A2-3.+%E2%80%A6+We+reject+therefore+the+contrary+assertion+of+those+%5Bcongregationalists%5D+who+affirm+this+to+be+an+ordinance+perpetual+and+ordinary+in+the+Church%2C+that+a+private+Christian+endued+with+gifts%2C+either+ordinarily+or+upon+occasion%2C+being+thought+fit+in+the+judgment+of+those+to+whom+it+belongs%2C+may+%28by+the+Word+of+God%29+preach+publicly+in+the+church-assembly+with+all+authority%2C+though+he+bear+no+Church+office.+But+to+us+it%E2%80%99s+certain+that+even+under+the+Old+Testament+in+the+Jewish+Church%2C+every+one+was+not+admitted+to+speak+publicly+in+the+synagogues%2C+but+that+it+was+the+ordinary+function+of+those+that+are+called+scribes+and+lawyers+%28the+Levites+being+also+for+this+cause+distributed+into+many+places%29%2C+whereupon+they+are+said+to+sit+on+Moses%E2%80%99s+chair.+If+any+were+endued+with+extraordinary+gifts+of+prophecy%2C+as+the+prophets+in+Israel%2C+this+was+permitted+and+enjoyned+him+by+the+Word+of+God%2C+publicly+to+preach+in+God%E2%80%99s+Name.+When+the+prophet+Amos+was+forbidden+by+the+Chief+Priest+to+prophecy+at+Bethel%2C+he+does+not+challenge+this+liberty+to+the+Israelites%2C+that+they+might+publicly+preach+the+Word+of+God+in+God%E2%80%99s+Name+in+the+holy+assemblies%2C+but+pleads+his+extraordinary+mission%2C+whereby+he+was+sent+of+God+to+preach+this+word%2C+Amos+7%3A14-15.+And+so+perhaps+was+it+permitted+to+the+sons+of+the+prophets%2C+who+were+fitted%2C+educated%2C+and+set+apart+for+the+ecclesiastical+ministry%2C+1+Sam.+19%3A20.+In+the+synagogues%2C+after+the+reading+of+Moses+and+the+prophets+was+ended%2C+there+were+exhortations+added%3B+which+exhortations+if+at+any+time+occasion+required%2C+and+it+so+seemed+good+to+the+rulers+of+the+synagogue%2C+in+corrupt+times+especially%2C+it+was+indeed+permitted+to+some%2C+out+of+order%2C+to+teach+and+exhort%3B+but+they+were+always+such+as+had+testimony+of+their+gifts%2C+and+of+whom+there+was+a+general+opinion+of+their+mission+extraordinary+or+ordinary%2C+by+reason+of+the+doctrine+they+preached%2C+and+the+works+they+did.+Thus+at+Nazareth+Christ+was+permitted+in+the+synagogue+to+read+and+explain+the+writings+of+the+prophets%2C+Lk.+4%3A16%2C+as+one+who+by+reason+of+his+majesty+and+miracles+did+everywhere+obtain+audience%2C+as+reverend+Beza+here+notes%3B+by+which+right+he+taught+both+in+the+Temple+and+everywhere%3A+wherefore+also+the+ordinary+doctors+demanded+of+him+by+what+authority+he+did+it%2C+Mt.+21%3A23.+So+we+find+that+Paul+and+Barnabas+were+allowed%2C+Acts+13%3A15%2C+publicly+to+speak+and+exhort+in+the+synagogue+at+Antioch%3B+as+being+such+whose+fame+was+already+known+to+those+of+Antioch%3A+for+they+had%2C+before+this+time%2C+for+a+whole+year+preached+the+Word+of+God+to+many+there%2C+and+brought+many+to+the+faith+of+Christ%3B+and+Agabus+who+was+joined+with+them%2C+did+by+an+extraordinary+gift+of+prophesy+foretell+to+those+of+Antioch+the+famine+approaching%3B+where+were+also+many+other+prophets+and+doctors%2C+who+preached+the+Word+of+God+both+to+Jews+and+Greeks%3A+See+Acts+11%3A19-21%2C+25-28%2C+and+13%3A1-2%2C+etc.+But+in+the+practice+of+the+New+Testament%2C+none+but+prophets+by+gift+and+office%2C+either+extraordinary+or+ordinary%2C+were+permitted+publicly+in+the+assembly+of+believers+to+preach+the+Word+of+God+in+Christ%E2%80%99s+Name%2C+as+appears%2C+1+Cor.+14%3A29-31%2C+etc.+The+apostle+speaks+not+of+any+in+the+congregation+promiscuously%2C+but+of+prophets+lawfully+called+to+instruct+the+Church+of+God+%28says+Beza+on+this+place%29+and+therefore+they+are+not+to+be+hearkened+to+%5Bnamely+the+congregationalists%5D%2C+who+from+hence+gather+that+any+of+the+assembly+may+speak+in+the+Church%2C+and+who+reprehend+the+custom+of+having+only+a+sermon+preached+by+one.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+p.+79%2C+80-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2ebf57220.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2ebf57220.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=2.%20No%20man%20may%20take%20this,only%20a%20sermon%20preached%20by%20one&amp;text=2.%20No%20man%20may%20take%20this%20honour%20to&amp;text=of%20having%20only%20a%20sermon%20preached%20by%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

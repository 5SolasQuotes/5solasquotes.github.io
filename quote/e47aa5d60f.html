<main class="wrap"><figure class="quote" id="q-e47aa5d60f" data-kw="">
<blockquote><p>We say that the Godhead is absolutely of itself. And hence also we hold that the Son, regarded as God, and without reference to person, is also of himself; though we also say that, regarded as Son, he is of the Father. Thus his essence is without beginning, while his person has its beginning in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/aseity-of-the-son.html">Aseity of the Son</a></span><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/eternal-generation.html">Eternal generation</a></span></div>

— John Calvin, Institutes of the Christian Religion, 1.13.25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%20say%20that%20the%20Godhead%20is%20absolutely%20of%20itself.%20And%20hence%20also%20we%20hold%20that%20the%20Son%2C%20regarded%20as%20God%2C%20and%20without%20reference%20to%20person%2C%20is%20also%20of%20himself%3B%20though%20we%20also%20say%20that%2C%20regarded%20as%20Son%2C%20he%20is%20of%20the%20Father.%20Thus%20his%20essence%20is%20without%20beginning%2C%20while%20his%20person%20has%20its%20beginning%20in%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%201.13.25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe47aa5d60f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e47aa5d60f.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd4ab28589" data-kw="against Sabellius">
<blockquote><p>The passages that the Apostle to the Hebrews applies to Christ are not obscure praises of the supreme God: &quot;You, Lord, laid the foundation of the earth in the beginning, and the heavens are the work of your hands.&quot; Also, &quot;Let all God&#x27;s angels worship him.&quot; John begins his Gospel with a splendid proclamation of Christ&#x27;s divinity: &quot;In the beginning was the Word, and the Word was with God, and the Word was God.&quot; This phrase, &quot;the Word was God, and was with God,&quot; clearly argues both the divinity of Christ and the distinction of persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XV</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The passages that the Apostle to the Hebrews applies to Christ are not obscure praises of the supreme God: &quot;You, Lord, laid the foundation of the earth in the beginning, and the heavens are the work of your hands.&quot; Also, &quot;Let all God&#x27;s angels worship him.&quot; John begins his Gospel with a splendid proclamation of Christ&#x27;s divinity: &quot;In the beginning was the Word, and the Word was with God, and the Word was God.&quot; This phrase, &quot;the Word was God, and was with God,&quot; clearly argues both the divinity of Christ and the distinction of persons.”

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, XV">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20passages%20that%20the%20Apostle%20to%20the%20Hebrews%20applies%20to%20Christ%20are%20not%20obscure%20praises%20of%20the%20supreme%20God%3A%20%22You%2C%20Lord%2C%20laid%20the%20foundation%20of%20the%20earth%20in%20the%20beginning%2C%20and%20the%20heavens%20are%20the%20work%20of%20your%20hands.%22%20Also%2C%20%22Let%20all%20God%27s%20angels%20worship%20him.%22%20John%20begins%20his%20Gospel%20with%20a%20splendid%20proclamation%20of%20Christ%27s%20divinity%3A%20%22In%20the%20beginning%20was%20the%20Word%2C%20and%20the%20Word%20was%20with%20God%2C%20and%20the%20Word%20was%20God.%22%20This%20phrase%2C%20%22the%20Word%20was%20God%2C%20and%20was%20with%20God%2C%22%20clearly%20argues%20both%20the%20divinity%20of%20Christ%20and%20the%20distinction%20of%20persons.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20XV&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd4ab28589.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd4ab28589.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3feb3b91bf" data-kw="autotheos aseity Son">
<blockquote><p>Although the Son is from the Father, nevertheless he may be called God-of-himself (autotheos), not with respect to his person, but essence; not relatively as Son (for thus he is from the Father), but absolutely as God inasmuch as he has the divine essence existing from itself and not divided or produced from another essence (but not as having that essence from himself). So the Son is God from himself although not the Son from himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.28.40</span></figcaption>

</figure><figure class="quote" id="q-ab7a2fd88e" data-kw="">
<blockquote><p>In the unity of the Godhead there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost: the Father is of none, neither begotten, nor proceeding; the Son is eternally begotten of the Father; the Holy Ghost eternally proceeding from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 2.3</span></figcaption>

</figure><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>

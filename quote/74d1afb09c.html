<blockquote><p>[A]nd so in some publick Covenants and Acts of one City or State, with another, which concern the present and future ages, the infants within that City or State, as being in minority free Denisons, are bound by the same Covenant and Act, though as such, they could neither transact, speak, nor consent to the same, but all was agreed on and done by their Parents or Commissioners of years thereto designed, in their own and children’s name: which may appear in Israel’s Covenant with the Gibeonites, which, though the stipulators were beguiled, yet Israel’s children were bound to, and when Saul out of a perverse zeal, about 380 years after, would needs violate, how binding that Covenant was, God declared in a severe judgment on Saul’s Family, and all Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anabaptism Routed: Or, A Survey of the Controverted Points</cite>, (London: Thomas Johnson, 1655), p. 98.</span></figcaption>

<blockquote><p>Wherein shall this great restauration and reformation of the Church consist?

In the fruition and enjoyment of certain privileges, such as the Church hath not at other times, at least not in the like degree.

The Privileges are of two sorts; Privative and Positive.

The Church shall be freed from the inundation of profaneness, with which it hath been miserably annoyed, leavened and infected before. Such shall be the piety and strictness of the government Ecclesiastical and Civil, that there shall not enter into the Church in any wise, any thing that defileth, Rev. 21.27.

She shall be purged from errors, superstition, idolatry, false and formal worship. It is sufficient to prove it, that we find no such thing mentioned in the Scriptures that speak of the state of the Church in the last times, besides what hath been said already, and shall be by and by. During Antichrist’s reign, men have been, and still are so zealous and tenacious of their old mumpsimuses, they can in no wise endure to hear of parting with them; like Micah of mount Ephraim, Judg. 18.23.24. that followed after the Danites, crying and complaining; they turned about, and asked him what he ailed. Ye have taken away my gods (saith he) which I made, and my priest (which he himself had consecrated for a priest) who should have blessed me, and doe you ask me what I ail? What have I more? I protest I had as live you had taken away all that I have. So it is with the men of our generation: from these things shall the Church then be freed.

She shall have exemption from oppression and persecution both Civil and Ecclesiastical; God shall wipe away all tears from the Saints eyes, and there shall be no more death, neither sorrow, nor crying, &amp;c. Rev. 21.4. That must needs be meant of the Church in this world, as appears by the context, Then shall the Lyon and the Lamb lie down and feed together, and the Tiger become tame the Childe shall play with the Asp and Cockatrice. Isa. 11.6.7. &amp; 65.25. Rev. 7.16.

There be two reasons of these privative privileges.

The earth-quake going before, shall shakedown these evils and all their supporters, as we have heard; the Beast his Hierarchy; his horns, the Kings of the earth that shall defend him to the last. And as the Lord did destroy not only the heathen Empire guilty of so much blood cruelty, and idolatry but would not let so much as that very form of government to stand; so it is probable, if not more, that all these dignities that have so desperately opposed the Sceptre of Christ, shall be taken away, Dan. 2.34, 5.44. Rev. 19. from ver. 17. to the end. God will purge out rebels. Ezek. 20.38. that at last none shall dare so much as to speak for false worship, formal worship, &amp;c. Then (and I doubt) not till then, will all these Sects and Divisions have an end.

Satan shall then be bound and chained up, that he shall not seduce the Nations to idolatry and persecution, as he hath always before done, Rev. 20.2. He hath been cast down before, as Rev. 12.9. but never bound, nor shall be till Antichrist’s fall. And so this prevents that which might be objected: though the wicked be taken away with the Earth-quake, yet sin will revive again. Answ. No: Satan shall be tied up from seducing that he cannot play such reaks in the world as before, man’s corruption wanting those bellows to blow it up which did formerly inflame it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-reyner.html">William Reyner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Babylon’s ruining-earthquake and the restoration of Zion delivered in a sermon before the honourable House of Commons at Margaret’s Westminster, at their public fast, August 28, 1644</cite>, (London: Samuel Enderby, 1644), pp 54-55.</span></figcaption>

</figure><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible</cite>, (London, 1645), pp. 16-17</span></figcaption>

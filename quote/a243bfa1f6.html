<main class="wrap"><figure class="quote" id="q-a243bfa1f6" data-kw="repentance anthropopathism">
<blockquote><p>Repentance is attributed to God after the manner of men (anthrōpopathōs) but must be understood after the manner of God (theoprepōs): not with respect to his counsel, but to the event; not in reference to his will, but to the thing willed; not to affection and internal grief, but to the effect and external work because he does what a penitent man usually does.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.11.11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/immutability.html">Immutability</a> › <a href="../topics/attributes-of-god/immutability/repentance-ascribed-to-god.html">Repentance ascribed to God</a></span><span class="t"><a href="../topics/existence-and-knowledge-of-god/names-of-god.html">Names of God</a> › <a href="../topics/existence-and-knowledge-of-god/names-of-god/anthropomorphisms-and-metaphors.html">Anthropomorphisms and metaphors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef49ade55e" data-kw="eternity perpetual">
<blockquote><p>Eternity is a perpetual duration, which hath neither beginning nor end. Time hath both. Those things we say are in time, that have beginning, grow up by degrees, have succession of parts. Eternity is contrary to time, and is therefore a permanent and immutable state, a perfect possession of life without any variation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Eternity of God</span></figcaption>

</figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom">
<blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</span></figcaption>

</figure><figure class="quote" id="q-7320ae0471" data-kw="">
<blockquote><p>The attaining of God&#x27;s glory was an end, which being ultimate and supreme, must in no case whatsoever give place. This is spoken of as the end of God&#x27;s executing judgments on his enemies in this world. … And this is spoken of as the end, both of the executions of wrath, and in the glorious exercises of mercy, in the misery and happiness of another world. Rom. 9:22–23, &quot;What if God, willing to show his wrath, and make his power known, endured with much long suffering, the vessels of wrath fitted to destruction: and that he might make known the riches of his glory on the vessels of mercy, which he hath afore prepared unto glory …?&quot; … Then his glory shall be obtained, with respect both to saints and sinners. From these things it is manifest … that God&#x27;s glory is the ultimate end of the creation of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation Concerning the End for Which God Created the World</cite>, on Ex. 14:17 and Rom. 9:22–23</span></figcaption>

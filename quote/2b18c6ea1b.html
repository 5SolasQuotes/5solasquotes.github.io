<blockquote><p>Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.</p></blockquote>

<blockquote><p>By which righteousness of Christ we are justified XI. Since, moreover, a twofold righteousness is observed in Christ—an essential righteous, as much of the divine as of the human nature, with which he was born (Luke 1:35); and a righteousness procured or acquired during his life on earth—so that we may more easily understand by which righteousness of Christ we are justified, it must be maintained that: (1) certainly the whole Christ, and all his righteousness, is profitable to us for justification, because the whole Christ was given by God to the world, that whosoever believes in him should not perish, but have eternal life (John 3:16) and because he was not born for himself, and did not come into the world so that he might minister to himself, but to us, that he might give himself as the price of redemption for many (Matt. 20:28; Eph. 5:2, 25–26), although it does not all profit us in one and the same way. In particular, (2) his essential righteousness, as much the divine as the human, is by no means profitable for justification as our [Greek], dikaioma, righteousness, on account of which we are justified, because not only does he require it for himself, but because it would also make superfluous and void a justification through a procured righteousness. For if we were to be absolved on account of the righteousness of the divine person, which is of infinite value, or even on account of the righteousness of the human nature, as our dikaioma, why would the righteousness of his death or of his life be required? Still, this essential righteousness also is profitable as a prerequisite in the person of the Mediator, apart from which he could not provide the dikaioma for us (2 Cor. 5:21; Isa. 53:11). So (3) only the procured righteousness of Christ provides the dikaioma on account of which we are justified by God. But since again a twofold procured righteousness of Christ is observed, one active, whereby he kept the law exactly (Matt. 3:15; 5:17; Gal. 4:4), and the other passive, whereby he suffered for the law that we violated (Rom. 4:25; Phil. 2:8), it must be maintained that (4) the active righteousness alone is insufficient for procuring justification, because a dikaioma was demanded for sinners, who had earned death (Gen. 2:17; Rom. 5:12; 6:23), which from the divine decree, the threat of the law, and God’s natural hatred of sin, was necessary to be suffered (Rom. 1:32; 2 Thess. 1:6). And also (5) he did not expend on our behalf only his passive righteousness, because it is not only his passive righteousness that is referred to our salvation throughout Scripture (Jer. 23:6; 1 Cor. 1:30; Rom. 5:19; Phil. 3:9), but it also regards the fullness of grace that he was expended for us in the whole of what he is (Rom. 8:32). Hence, (6) both kinds of his righteousness join into our one dikaioma, whereby he satisfied for the sins of those to be justified (Rom. 8:3–4), such that accordingly, (7) this twofold righteousness is not separated, indeed not even distinguished in such a way that to the passive righteousness alone is attributed the efficacy of making satisfaction for our guilt, and thus of delivering us from evils, and to the active righteousness alone is attributed the power of meriting for us the right of eternal life. For not only do satisfying and meriting in this matter not differ really, but neither should the passive be stripped of the dignity of meriting, nor the active of the dignity of satisfying, as we have demonstrated elsewhere (1.5.18 §XIV; cf. §XVII, below).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“By which righteousness of Christ we are justified XI. Since, moreover, a twofold righteousness is observed in Christ—an essential righteous, as much of the divine as of the human nature, with which he was born (Luke 1:35); and a righteousness procured or acquired during his life on earth—so that we may more easily understand by which righteousness of Christ we are justified, it must be maintained that: (1) certainly the whole Christ, and all his righteousness, is profitable to us for justification, because the whole Christ was given by God to the world, that whosoever believes in him should not perish, but have eternal life (John 3:16) and because he was not born for himself, and did not come into the world so that he might minister to himself, but to us, that he might give himself as the price of redemption for many (Matt. 20:28; Eph. 5:2, 25–26), although it does not all profit us in one and the same way. In particular, (2) his essential righteousness, as much the divine as the human, is by no means profitable for justification as our [Greek], dikaioma, righteousness, on account of which we are justified, because not only does he require it for himself, but because it would also make superfluous and void a justification through a procured righteousness. For if we were to be absolved on account of the righteousness of the divine person, which is of infinite value, or even on account of the righteousness of the human nature, as our dikaioma, why would the righteousness of his death or of his life be required? Still, this essential righteousness also is profitable as a prerequisite in the person of the Mediator, apart from which he could not provide the dikaioma for us (2 Cor. 5:21; Isa. 53:11). So (3) only the procured righteousness of Christ provides the dikaioma on account of which we are justified by God. But since again a twofold procured righteousness of Christ is observed, one active, whereby he kept the law exactly (Matt. 3:15; 5:17; Gal. 4:4), and the other passive, whereby he suffered for the law that we violated (Rom. 4:25; Phil. 2:8), it must be maintained that (4) the active righteousness alone is insufficient for procuring justification, because a dikaioma was demanded for sinners, who had earned death (Gen. 2:17; Rom. 5:12; 6:23), which from the divine decree, the threat of the law, and God’s natural hatred of sin, was necessary to be suffered (Rom. 1:32; 2 Thess. 1:6). And also (5) he did not expend on our behalf only his passive righteousness, because it is not only his passive righteousness that is referred to our salvation throughout Scripture (Jer. 23:6; 1 Cor. 1:30; Rom. 5:19; Phil. 3:9), but it also regards the fullness of grace that he was expended for us in the whole of what he is (Rom. 8:32). Hence, (6) both kinds of his righteousness join into our one dikaioma, whereby he satisfied for the sins of those to be justified (Rom. 8:3–4), such that accordingly, (7) this twofold righteousness is not separated, indeed not even distinguished in such a way that to the passive righteousness alone is attributed the efficacy of making satisfaction for our guilt, and thus of delivering us from evils, and to the active righteousness alone is attributed the power of meriting for us the right of eternal life. For not only do satisfying and meriting in this matter not differ really, but neither should the passive be stripped of the dignity of meriting, nor the active of the dignity of satisfying, as we have demonstrated elsewhere (1.5.18 §XIV; cf. §XVII, below).”

— Petrus van Mastricht, Theoretical Practical Theology (RHB), vol. 5, ch. 6, the Justification of those to be Redeemed">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+which+righteousness+of+Christ+we+are+justified+XI.+Since%2C+moreover%2C+a+twofold+righteousness+is+observed+in+Christ%E2%80%94an+essential+righteous%2C+as+much+of+the+divine+as+of+the+human+nature%2C+with+which+he+was+born+%28Luke+1%3A35%29%3B+and+a+righteousness+procured+or+acquired+during+his+life+on+earth%E2%80%94so+that+we+may+more+easily+understand+by+which+righteousness+of+Christ+we+are+justified%2C+it+must+be+maintained+that%3A+%281%29+certainly+the+whole+Christ%2C+and+all+his+righteousness%2C+is+profitable+to+us+for+justification%2C+because+the+whole+Christ+was+given+by+God+to+the+world%2C+that+whosoever+believes+in+him+should+not+perish%2C+but+have+eternal+life+%28John+3%3A16%29+and+because+he+was+not+born+for+himself%2C+and+did+not+come+into+the+world+so+that+he+might+minister+to+himself%2C+but+to+us%2C+that+he+might+give+himself+as+the+price+of+redemption+for+many+%28Matt.+20%3A28%3B+Eph.+5%3A2%2C+25%E2%80%9326%29%2C+although+it+does+not+all+profit+us+in+one+and+the+same+way.+In+particular%2C+%282%29+his+essential+righteousness%2C+as+much+the+divine+as+the+human%2C+is+by+no+means+profitable+for+justification+as+our+%5BGreek%5D%2C+dikaioma%2C+righteousness%2C+on+account+of+which+we+are+justified%2C+because+not+only+does+he+require+it+for+himself%2C+but+because+it+would+also+make+superfluous+and+void+a+justification+through+a+procured+righteousness.+For+if+we+were+to+be+absolved+on+account+of+the+righteousness+of+the+divine+person%2C+which+is+of+infinite+value%2C+or+even+on+account+of+the+righteousness+of+the+human+nature%2C+as+our+dikaioma%2C+why+would+the+righteousness+of+his+death+or+of+his+life+be+required%3F+Still%2C+this+essential+righteousness+also+is+profitable+as+a+prerequisite+in+the+person+of+the+Mediator%2C+apart+from+which+he+could+not+provide+the+d <blockquote><p>Q. 23. Is it correct to say that the righteousness of the Mediator is imputed to us in justification and infused in sanctification? …it is not the same righteousness of Christ that occurs in its two parts. When I speak of an imputed righteousness of the Mediator, then I mean that righteousness that He obtained by means of his suffering and dying and obedience in the state of humiliation–not, however, the righteousness of life of the human nature of Christ, that is, that Christ in his human nature now possesses. The latter is not imputed to me. And, conversely, the former cannot be infused into me; it can only be reckoned to me. Really, one cannot even say that the righteousness in which Christ now lives is infused into me. This always rests on a more or less unclear mystical conception. It is not the personal righteousness of Christ that is infused into the believer, for, as an inherent quality, righteousness cannot be detached from the person. Q. 24 Is then no ‘holiness’ of Christ imputed to us? Yes; by that term, if one wishes, one can designate his active obedience, imputed to us in justification. As our [Heidelberg] Catechism states in the answer to question 60, ‘How are you righteous before God?… God grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ,’ etc. In this sense, one may thus then say that Christ is not only our sanctification but also our holiness before God.</p></blockquote>

<blockquote><p>5. Are we justified on account of the essential righteousness of Christ’s divine nature? XXIII. Fifth, it is asked whether the dikaioma [righteousness] on account of which we are justified is the essential righteousness of Christ’s divine nature. Andreas Osiander [a Lutheran], as we have often said, affirms it, because he rejected the procured righteousness of Christ, which nonetheless his son Lucas Osiander, a professor at Tübingen, does not acknowledge; at least it is certain that he has to reject it, from his hypotheses, because: (1) this essential righteousness of the divine nature, through its infinite value, would be so sufficient that it would make the other undoubtedly void. This is not even to mention that (2) the essential union of believers with Christ (which he presupposes) is blasphemous in not just one way, as we taught elsewhere (1.6.5 §XX). And (3) it is false that he is the Messiah only according to the divine nature. Moreover, (4) that the fellowship of that essential righteousness is understood (2 Peter 1:4), we have already shown to be absurd (cf. bk. 5, ch. 2 §XXII; ch. 18, §§XIV, XXXVI; ch. 5 of this book, §XX; likewise §XI of this chapter.) Nor does there remain anything that they may say for themselves, except that the righteousness on account of which we are justified is called the righteousness of God (Rom. 1:17; 3:21–22; 10:3; 2 Cor. 5:21; 2 Peter 1:1). To which we respond that: (1) the [Greek; dikaiosune theou], ‘the righteousness of God’, sometimes designates procured righteousness (James 1:20). (2) Christ’s procured righteousness is the righteousness of God, insofar as the one who procured it is the God man, and thus is God (Acts 20:28). (3) The procured righteousness of Christ is called the righteousness of God because it was constituted by God, and is admitted for us by God (Rom. 3:25; 2 Cor. 5:21). … XXV… Protestants, although they leave essential righteousness to Christ alone, as a prerequisite for his mediatorial function, yet affirm that the righteousness that was procured by his satisfaction and merit (insofar as they teach that on account of it we are delivered from our guilt and obtain the right to life) is altogether imputed to us, or transferred to our account.</p></blockquote>

<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>

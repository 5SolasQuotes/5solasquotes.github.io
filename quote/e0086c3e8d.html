<main class="wrap"><figure class="quote" id="q-e0086c3e8d" data-kw="">
<blockquote><p>Let us come a little nearer, and take a look of Him as He is our Saviour, in his condescendency, love, power, faithfulness, and other properties. O! how condescending He is! Though He is that high and lofty One, the Father’s equal, yet He stooped so low as to take upon Him the nature of man, and all the sinless infirmities that attend it. He became “flesh of our flesh, and bone of our bone,” and that in the lowly condition of a servant. He seeks the creature’s affection as if it were of some worth, and seeks men and women to match with Him.

O how loving is He! It is a strong love that He beareth to the seed of Abraham! Doth not all this shine in all that He hath done? He emptied himself that they might become full; He made himself poor, though Maker and Possessor of heaven and earth, that they might become rich. He fulfilled the law for them, that He might purchase for them life and happiness. He made himself a sacrifice unto the death, that He might satisfy offended justice, and make reconciliation for them.

O such a death! so cursed! so shameful! so painful! and so lingering! But above all, He had the full weight of the wrath of God to bear, which all the strength of angels and men could not have endured; but He, being God, could not fall under it. O what manner of love is this!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

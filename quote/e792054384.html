<main class="wrap"><figure class="quote" id="q-e792054384" data-kw="">
<blockquote><p>How vast the fellowship! With the saints of all ages in the past! With the saints of all ages in the future! With the church eternal in glory! How comforting! We are not alone in our work, in our trials, in our hopes! Millions uncounted have been working for us, praying for us, rejoicing over us! Millions uncounted of hearts are now beating in unison with ours! Millions uncounted are to follow us, for whom we are even now transmitting the riches of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geroge-w-bethune.html">Geroge W. Bethune</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Lectures on the Heidelberg Catechism</cite>, (NY, 1864/1866), vol. 2, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-761439a811" data-kw="">
<blockquote><p>Also this word ‘communion’ is very evident and comfortable. For first, the meaning thereof is, that betwixt God and us there is a communion, that is, a fellowship and participation, and so, consequently, a parting betwixt us of all good and heavenly things. And then also we understand, that we are fellows and partakers with all the saints that are living either in heaven or on earth: for we are members of them under one head, Christ. For the apostle John says: “That which we have seen and heard we declare unto you, that ye also may have fellowship with us, and that your fellowship may be with the Father, and his Son Jesus Christ… …What can be more delightful to our ears than to hear that all the saints, as well in heaven as in earth, are our brethren, and that we again are members, partners, and fellows with them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

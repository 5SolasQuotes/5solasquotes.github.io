<main class="wrap"><figure class="quote" id="q-55419a7a8f" data-kw="">
<blockquote><p>What a stop hath been set to Superstition? How good a progress hath been made in Reformation? And may we not yet hope that God will do better unto us then at our beginnings? God’s promise is the ground of hope: and my Text sheweth that God hath promised as much.

Go on, Right Honourable, and put forth your utmost endeavours, for bringing on those better things that yet remain. Where there is Hope, their endeavours use to be most earnest: For Hope stirreth up men’s spirits to set upon great things.

Though the full accomplishment of the remaining better things should be reserved to a future age, yet it becomes us, to be as earnest in prosecuting them, according to the ability and opportunity that God doth give us, as if we our selves were sure, while we live, to have the fruition of them.

Experience sheweth that to be true, which of old was said of the provident husbandman, that he planteth trees which may be useful in an other age. But I hope that God will let you see and enjoy the fruit of your Counsels, and of our desires. This shall be the continual prayer of

Your Honours’ humble Servant and Orator, William Gouge.</p></blockquote>

<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law [Dt. 16:16]; but at other times he held separate assemblies¹ in the wilderness of Judea at Jordan [Mk. 1:5], and at Aenon [Jn. 3:23], where he taught and baptized… ¹ [For a summary in English Church history after the Reformation of presbyterians and puritans who at times held separate assemblies from the established Anglican Church, yet still held communion with her, see James Owen, Moderation Still a Virtue, 1704, pp. 42-44.] Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One, while we find them in the Temple at public worship and teaching there (Acts 3:1; 4:1); another [time] while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows: 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Occasional Communion</cite>, Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful. | Lawfulness &amp; Need in Some Circumstances for Some Separation, while Maintaining Occasional Communion, or Conformity</span></figcaption>

<blockquote><p>Because it may be thought expedient that these things for a time be borne withal; for it may perhaps produce this effect, that these contentions may be avoided, by the which contentions there is great peril, lest greater and far more important benefits be hindered; and lest the minds of men be at the first beginning turned from the Gospel, as we see it come to pass; Martyr. ibid., fol. 1085 [p. 119]. Because, if the parity of doctrine and of faith do remain entire, the pastors may openly teach and press unto their flocks such doctrine as may serve to take away offenses arising by the use of these ceremonies; Beza, Epist. 12, fol. 99. … Because if some things in their nature indifferent be imposed it is not meet too eagerly to contend about such matters; especially when as we see those magistrates by whom the light of the Gospel is much furthered in England, and by whose authority it may much more be furthered, to oppose themselves against us; Peter Martyr, ibid., fol. 1085 [p. 120], to Hooper.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Because it may be thought expedient that these things for a time be borne withal; for it may perhaps produce this effect, that these contentions may be avoided, by the which contentions there is great peril, lest greater and far more important benefits be hindered; and lest the minds of men be at the first beginning turned from the Gospel, as we see it come to pass; Martyr. ibid., fol. 1085 [p. 119]. Because, if the parity of doctrine and of faith do remain entire, the pastors may openly teach and press unto their flocks such doctrine as may serve to take away offenses arising by the use of these ceremonies; Beza, Epist. 12, fol. 99. … Because if some things in their nature indifferent be imposed it is not meet too eagerly to contend about such matters; especially when as we see those magistrates by whom the light of the Gospel is much furthered in England, and by whose authority it may much more be furthered, to oppose themselves against us; Peter Martyr, ibid., fol. 1085 [p. 120], to Hooper.”

ought%20expedient%20that%20these&amp;text=Martyr%2C%20ibid.%2C%20fol.%201085%20%5Bp.%20120%5D%2C%20to%20Hooper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?</p></blockquote>

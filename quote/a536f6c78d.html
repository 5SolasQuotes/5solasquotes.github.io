<main class="wrap"><figure class="quote" id="q-a536f6c78d" data-kw="">
<blockquote><p>And if any have fallen into a grievous fault known unto the congregation and, being reprehended, hath not truly repented, for which cause he may deserve to be driven forth of the church for a time and to be bound, until he make amends and till he make public signification to the church of his true repentance, let such a brother be excluded out of the church and be bound.

But when he hath repented, let him be loosed, received into favour and admitted into his former communion. This is the first discipline, the end whereof is that every one should live unto God and at last also die in the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXV.XXXVIII, 1: 471.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebe4f45295" data-kw="">
<blockquote><p>MINISTERS should preserve a People from Corruption by good Government. God has given power of ruling to Ministers. Heb. 13.13. Obey them that rule you and submit to them. He has given a power of binding and losing. Mat. 16.19. What thou shalt bind on earth shall be bound in heaven. And he appoints that they rule well, 1 Tim 5.17. Ministers have a corrcive [corrective] power to execute censures on them that are obstinate.

Ministers must have a tender and compassionate spirit, but when Men are sturdy and rebellious, severity is compassion; executing Ecclesiastical censures is a terror to evil doers: this is a proper means that their spirits may be saved in the day of the Lord Jesus, 1 Cor. 5.5. Though private revenge is utterly forbidden, yet they are to revenge disobedience: 2 Cor. 10.6. Having in a readiness to revenge all disobedience. This is the way to purge out the old leaven, to bring Men to repentance, and to put a stop to growing iniquities, that the Land be not defiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of Gospel-ministers to preserve a people from corruption. Set forth, in a sermon preached at Brookfield, October 16. 1717. Being the day wherein the church was gathered, and Mr. Thomas Cheney, was ordained Pastor</cite>, (Boston: Samuel Phillips, 1718), p. 12.</span></figcaption>

</figure><figure class="quote" id="q-cbbcc12bef" data-kw="">
<blockquote><p>Aquinas holdeth with Isidore, that a human Law (among other conditions of it) must both be necessary for removing of some evil, and likewise profitable for guiding us to some good. … Human Laws (in Mr. [Richard] Hooker’s judgment) must teach what is good, and be made for the benefit of men. Demosthenes describeth a Law, to be such a thing cui convenit omnibus parere, which it is convenient for every one to obey. Camero [John Cameron] not only alloweth us to seek a reason of the Church’s Laws (non enim (saith he) verae Ecclesiae libet leges ferre quarum non reddat rationem. It pleaseth not the true Church to make and publish Laws whereof she giveth not a reason:) but he will likewise have us, in such things as concern the glory and honour of God, not to obey the Laws of any Magistrate, blindly and without a reason. …

From Scripture we learn that neither hath the Magistrate any power, but for our good only [Romans 13:4], nor yet hath the Church any power, but for our edification only [Ephesians 4:12]. Law-makers therefore may not enjoin quod-libet, that which liketh them, nay nor always quod licet, that which is in itself lawful, but only quod expedit, that which is expedient and good for edifying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), prefatory epistle.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 289-90.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Drawing on principles of contract law developed by jurists and theologians from the School of Salamanca [Spain], the Jesuit controversialist Martinus Becanus (1563–1624) argues in favor of the duty to honor promises beyond confessional boundaries [contra the normal Roman position]… In particular circumstances the toleration of religious diversity may not only prevent greater evil, but also advance the greater good, especially by stimulating a kind of pious competition between confessional communities. This first English translation… [is] a major work of one of the most prominent advocates of a permission concept of tolerance in the early modern period.</p></blockquote>

<blockquote><p>II. By it a sinner, out of the sight and sense, not only of the danger, but also of the filthiness and odiousness of his sins, as contrary to the holy nature and righteous law of God, and upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins, as to turn from them all unto God,[c] purposing and endeavouring to walk with him in all the ways of his commandments.[d] [c] Ezek. 18:30,31. Ezek. 36:31. Isa. 30:22. Ps. 51:4. Jer. 31:18,19. Joel 2:12,13. Amos 5:15. Ps. 119:128. 2 Cor. 7:11. [d] Ps. 119:6,59,106. Luke 1:6. 2 Kings 23:25. III. Although repentance be not to be rested in, as any satisfaction for sin, or any cause of the pardon thereof,[e] which is the act of God’s free grace in Christ;[f] yet is it of such necessity to all sinners, that none may expect pardon without it.[g] [e] Ezek. 36:31,32. Ezek. 16:61-63. [f] Hos. 14:2,4. Rom. 3:24. Eph. 1:7. [g] Luke 13:3,5. Acts 17:30,31.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession</cite>, ch. 15, ‘Of Repentance unto Life’</span></figcaption>

</figure><figure class="quote" id="q-e3df19304a" data-kw="">
<blockquote><p>It still continues equally true, upon the Protestant as upon the Romish doctrine of justification, that God requires of us faith and repentance, and requires them of us as indispensably necessary to our escaping His wrath and curse due to us for our sins, though not as exerting any causality or efficiency in procuring or obtaining for us pardon and acceptance, except instrumentally in the case of faith;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology (Edinburgh: T&amp;T Clark, 1863), vol. 2, ch. 21, ‘Justification’, section 1, ‘Popish &amp; Protestant Views’</cite>, p. 88</span></figcaption>

</figure><figure class="quote" id="q-abfce73be5" data-kw="">
<blockquote><p>True it is, that without faith and repentance, there is no salvation; and a man dying impenitent, is damned. But, we must know that as faith and repentance are conditions, which God has ordained, and so requires on our part, though Himself give them, and work them in us; so they are a part of those means which God has appointed to attain the end of our salvation. And the meanes are such, so fixed and established of God, as they shall always attend upon his purpose and pleasure in our election to grace and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea to an Appeal traversed Dialogue-wise (London: W. Jones, 1626)</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-36a1f7f04e" data-kw="">
<blockquote><p>So the pardon of sin is given of grace, and not for works, though pardon be granted only to the penitent, and faith on our part, a lively, unfained and working faith be required to receive the promise. … The stipulation required is that we take God to be our God, that is, that we repent of our iniquities, believe the promises of mercy and embrace them with the whole heart, and yield love, fear, reverence, worship, and obedience unto Him, according to the prescript rule of his Word. Repentance is called for in this Covenant, as it sets forth the subject capable of salvation by faith, but is itself only an acknowledgement of sin, no healing of our wound, or cause of our acquittance. The feeling of pain and sickness causes a man to desire and seek remedy, but it is no remedy itself. (Lk. 13:5; Acts 11:18; 2 Cor. 7, 10; Eze. 18:27) Hunger and thirst make a man to desire and seek for food, but a man is not fed by being hungry. By repentance we know ourselves, we feel our sickness, we hunger and thirst after grace, but the hand which we stretch forth to receive it, is faith alone, without which repentance is nothing but darkness and despair. Repentance is the condition of faith and the qualification of a person capable of salvation: but faith alone is the cause of justification and salvation, on our part required. It is a penitent and petitioning faith, whereby we receive the promises of mercy, but we are not justified partly by prayer, partly by repentance, and partly by faith, but by that faith which stirs up godly sorrow for sin, and enforces us to pray for pardon and salvation. … In the Covenant of works, works were required as the cause of life and happiness: but in the Covenant of grace, though repentance be necessary and must accompany faith, yet not repentance, but faith only is the cause of life. The cause not efficient, as works should have been, if man had stood in the former Covenant, but instrumental only: for it is impossible that Christ, the death and blood of Christ, and our faith should be together the efficient or procuring causes of justification or salvation. … If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. … In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, pp. 17-21</span></figcaption>

+Covenant+of+grace%2C+though+repentance+be+necessary+and+must+accompany+faith%2C+yet+not+repentance%2C+but+faith+only+is+the+cause+of+life.+The+cause+not+efficient%2C+as+works+should+have+been%2C+if+man+had+stood+in+the+former+Covenant%2C+but+instrumental+only%3A+for+it+is+impossible+that+Christ%2C+the+death+and+blood+of+Christ%2C+and+our+faith+should+be+together+the+efficient+or+procuring+causes+of+justification+or+salvation.+%E2%80%A6+If+then%2C+when+we+speak+of+the+conditions+of+the+covenant+of+grace%2C+by+%E2%80%9Ccondition%E2%80%9D+we+understand+whatsoever+is+required+on+our+part%2C+as+precedent%2C+concomitant%2C+or+subsequent+to+justification%2C+repentance%2C+faith%2C+and+obedience+are+all+conditions%3B+but+if+by+%E2%80%9Ccondition%E2%80%9D+we+understand+what+is+required+on+our+part+as+the+cause+of+the+good+promised%2C+though+only+instrumental%2C+faith+or+belief+in+the+promises+of+free+mercy+is+the+only+condition.+%E2%80%A6+In+this+covenant+man+promises+to+repent+of+his+sins%2C+and%2C+repenting%2C+to+cleave+to+the+promise+of+mercy+made+in+Jesus+Christ%2C+and+in+faith+to+yield+willing%2C+cheerful%2C+and+continual+obedience.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+17-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36a1f7f04e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36a1f7f04e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=So%20the%20pardon%20of%20sin%20is,yield%20willing%2C%20cheerful%2C%20and%20continual%20obedience&amp;text=So%20the%20pardon%20of%20sin%20is%20given%20of&amp;text=faith%20to%20yield%20willing%2C%20cheerful%2C%20and%20continual%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

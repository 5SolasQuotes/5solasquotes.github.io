<main class="wrap"><figure class="quote" id="q-a34880204e" data-kw="">
<blockquote><p>We, therefore, condemn those who seek other than in Christ, whether they are chosen from all eternity, and what God has decreed of them before all beginning. For men must hear the gospel preached and believe it. If you believe and are in Christ, you may undoubtedly reckon that you are elected. For the Father has revealed unto us in Christ His eternal sentence of predestination, as we even now showed out of the apostle in 2 Timothy 1:9–10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 10</span></figcaption>

<blockquote><p>Our election … consisteth not in ourselves, but in the eternal and immutable good pleasure of God, and that in such absolute authority that it cannot be overthrown, neither by the raging storms of the world, nor by the assaults of Satan; neither yet by the wavering and weakness of our own flesh. Then only is our salvation in assurance, when we find the cause of the same in the bosom and counsel of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Predestination</cite>, p. 33</span></figcaption>

</figure><figure class="quote" id="q-fd92ded097" data-kw="Assurance Election Holy Spirit">

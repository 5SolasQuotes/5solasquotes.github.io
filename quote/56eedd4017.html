<blockquote><p>That is, Natural Theology is not repugnant to Revealed Theology in the Abstract, although Natural Theology is far less complete, and takes a position beneath Revealed Theology. Nevertheless, both are Lights, Natural Theology the lesser, Revealed Theology the greater, which have their origin from the same Father of lights. Neither is natural truth able to be inconsistent with revealed truth, since truth harmonizes with truth, or truth does not contradict truth, as it is in the Axiom; indeed, truth is opposed, not to truth, but to falsehood, although the same truth often becomes known from diverse starting points: thus, that God created the world, is evident by reason and by faith, in Philosophy from the light of nature, in Theology from the light of Scripture.

But Natural Theology nowhere exists in the abstract, as, on the other hand, Revealed Theology, pure and clear of all defects, is able to be read in the Sacred Scriptures. When, therefore, any dispute occurs between them, Natural Theology with all Philosophy ought to yield to Revealed Theology as more certain, seeing that human corruption easily mingles itself with Natural Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 21, p. 164.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56eedd4017.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/05/bernardinus-de-moor-on-the-harmony-between-natural-and-revealed-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-bf2c757075" data-kw="">
<blockquote><p>It is not at all to be doubted, but the end proposed by philosophy, was to renew and to reform mankind, and to reduce the course of their lives to a conformity with the precepts of wisdom and virtue. …

True religion, to be sure, has the same tendency: but it promotes its end with much greater force, and better success; because its principles are much more exalted, its precepts and instructions are of greater purity, and it is, besides, attended with a divine power, whereby it makes its way into the hearts of men, and purifies them with the greatest force and efficacy; and yet, at the same time, with the most wonderful pleasure and delight. And this is the regeneration of which we are speaking, and whereof we have already observed, that philosophy acknowledged it, even under the same name; but that it effected it, we absolutely deny. …

Philosophy, as we have already observed, perceiving that man was born to higher views than this world affords, attempted to raise him from his present dejection, secure his claim to heaven, and restore him to a conformity and likeness to God; but in vain. To redeem the sons of man, and restore them to what they had lost, it was necessary that the eternal Son of God should come down from heaven. Our fall was easily brought about, but our restauration was a work of the greatest difficulty, and only to be performed by the powerful hand of God; there are but few, whom the exalted Father of spirits has loved, and Christ has raised up to heaven.

He is the source whence the spirit of God flows down to us, he is the fountain of that new life and sanctified nature, by which we mount towards God, whereby we overcome the world, and, in consequence thereof, are admitted to heaven, And happy, to be sure, are those truly noble souls, whose fate it is to be thus born again, to be admitted into the choirs of the holy angels, and to be cloathed with those glorious robes that are whiter than snow: they will follow the lamb wherever he goes, and he will lead them to the crystal streams, and even to the fountain of life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. XVI, pp 178-79, 188-89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>…That three things are recorded as created, namely, the heaven, the water, and the earth; and these three received their form from the three days’ work of distinction, so that heaven was formed on the first day; on the second day the waters were separated; and on the third day, the earth was divided into sea and dry land. So also is it in the work of adornment; on the first day of this work, which is the fourth of creation, are produced the lights, to adorn the heaven by their movements; on the second day, which is the fifth, birds and fishes are called into being, to make beautiful the intermediate element, for they move in air and water, which are here taken as one; while on the third day, which is the sixth, animals are brought forth, to move upon the earth and adorn it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, 1a 70.</span></figcaption>

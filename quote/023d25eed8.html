<main class="wrap"><figure class="quote" id="q-023d25eed8" data-kw="">
<blockquote><p>…but he [Paul] says that the church has no such custom as that any man should be contentious, but rather that all should preserve the common peace. But if any one be contentious, he is a stranger to the church of God… he says, that the churches of God have no custom of allowing any man to be contentious. Thus he represses contentious spirits by the authority of the church, and does not confirm the dogma by mere custom. Now that custom of avoiding contention in the church is abundantly sanctioned by testimonies of scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, (1588; Cambridge: Parker Society, 1849), p. 559</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3feea598b2" data-kw="">
<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing…

3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative (London: Maxwell, 1682) Stoddon was an English, congregationalist minister., pp. 40-44</span></figcaption>

<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>

<blockquote><p>The mind of Paul then, is that it is not necessary, other than by the time, for the hair of women to be covered by a veil while they are praying.</p></blockquote>

<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). …

13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. …

14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). …

15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. …

16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>

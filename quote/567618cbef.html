<main class="wrap"><figure class="quote" id="q-567618cbef" data-kw="">
<blockquote><p>1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission.

2. I consider four acts of the soul that may convey external adoration:

1. One of the mind, a consideration of the excellency of what we adore;

2. A will to submit to this excellency;

3. The judgments diting this to be honest to submit;

4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements.

3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change:

1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring.

2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace.

3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping.

4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might:

1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling.

2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.</p></blockquote>

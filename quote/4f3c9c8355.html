<main class="wrap"><figure class="quote" id="q-4f3c9c8355" data-kw="">
<blockquote><p>Good natural children will not only become obedient to the commandment of their parents, but also have a diligent eye to their doings, and gladly follow the same. So, if we will be the children of our heavenly Father, we must be careful to keep the Christian Sabbath day, which is the Sunday; not only for that it is God’s express commandment, but also to declare ourselves to be loving children in following the example of our gracious Lord and Father. Thus it may plainly appear, that God’s will and commandment was to have a solemn time and standing day in the week, wherein the people should come together and have in remembrance his wonderful benefits, and to render him thanks for them, as appertaineth to loving, kind, and obedient people.

This example and commandment of God the godly Christian people began to follow immediately after the ascension of our Lord Christ, and began to choose them a standing day in the week to come together in; yet not the seventh day, which the Jews kept, but the Lord’s day, the day of the Lord’s resurrection, the day after the seventh day, which is the first of the week. Of the which day mention is made by St. Paul on this wise: In the first day of the sabbath let every man lay up what he thinketh good, meaning for the poor. By the first day of the sabbath is meant our Sunday, which is the first day after the Jews’ seventh day.

And in the Apocalypse it is more plain, where as St. John saith, I was in the Spirit upon the Sunday. Sithence [sic] which time God’s people hath always in all ages without gainsaying used to come together upon the Sunday, to celebrate and honour the Lord’s blessed Name, and carefully to keep that day in holy rest and quietness, both men, women, child, servant, and stranger. For the transgression and breach of which day God hath declared himself much to be grieved, as it may appear by him who for gathering of sticks on the Sabbath day was stoned to death.

But, alas, all these notwithstanding, it is lamentable to see the wicked boldness of those that will be counted God’s people, who pass nothing at all of keeping and hallowing the Sunday. And these people are of two sorts. The one sort, if they have any business to do, though there be no extreme need, they must not spare for the Sunday; they must ride and journey on the Sunday; they must drive and carry on the Sunday; they must row and ferry on the Sunday; they must buy and sell on the Sunday; they must keep markets and fairs on the Sunday: finally, they use all days alike; workdays and holy days are all one.

The other sort yet is worse. For, although they will not travail nor labour on the Sunday as they do on the week day, yet they will not rest in holiness, as God commandeth; but they rest in ungodliness and in filthiness, prancing in their pride, pranking and pricking, pointing and painting themselves, to be gorgeous and gay; they rest in excess and superfluity, in gluttony and drunkenness, like rats and swine; they rest in brawling and railing, in quarrelling and fighting; they rest in wantonness, in toyish talking, in filthy fleshliness; so that it doth too evidently appear that God is more dishonoured and the devil better served on the Sunday than upon all the days in the week beside.

And, I assure you, the beasts, which are commanded to rest on the Sunday, honour God better than this kind of people; for they offend not God, they break not their holy day. Wherefore, O ye people of God, lay your hands upon your hearts; repent and amend this grievous and dangerous wickedness; stand in awe of the commandment of God; gladly follow the example of God himself; be not disobedient to the godly order of Christ’s Church, used and kept from the Apostles’ time until this day; fear the displeasure and just plagues of Almighty God, if ye be negligent and forbear not labouring and travailing on the Sabbath day or Sunday, and do not resort together to celebrate and magnify God’s blessed Name in quiet holiness and godly reverence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Homily on the Place and Time of Prayer in Thomas Cranmer and John Jewell, The Two Books of Homilies Appointed to be Read in Churches</cite></span></figcaption>

<blockquote><p>CANON 24. Concerning the branches of the vine. The branches on the vine do not give life to the vine, but receive life from it; thus the vine is related to its branches in such a way that it supplies them with what they need to live, and does not take this from them. Thus it is to the advantage of the disciples, not Christ, both to have Christ abiding in them and to abide in Christ. For if the vine is cut down another can shoot up from the live root; but one who is cut off from the vine cannot live without the root (John 15:5ff).</p></blockquote>

<blockquote><p>…they [Formalists] tell us that it is needless to abolish utterly things and rites which the Papists have abused to idolatry and superstition, and that it is enough to purge them from the abuse and to restore them again to their right use. Hence Saravia will not have pium crucis usum [a pious use of the cross] to be abolished cum abusu [when abused], but holds it enough that the abuse and superstition be taken away… Answer 1: Calvin (Resp. ad Versipel., p. 41.4) answering that which Cassander alleged out of an Italian writer, abusu non tolli bonum usum [by abuse is not taken away a good use], he admits it only to be true in things which are instituted by God Himself: not so in things ordained by men: for the very use of such things or rites as have no necessary use in God’s worship, and which men have devised only at their own pleasure, is taken away by idolatrous abuse. Pars tutior [a part more to be examined] here, is to put them wholly away; and there is by a great deal more danger in retaining than in removing them. 2. The [Scriptural] proofs which I have produced for the proposition about which now we debate [Isa. 30:22; Jude 23; Ex. 34:13; Dt. 7:25-26; Num. 33:52-53; Dt. 7:5; 12:2-3; Isa. 27:9] do not only infer that things and rites which have been notoriously abused to idolatry should be abolished in case they be not restored to a right use, but simply and absolutely that in any wise they are to be abolished. God commanded to say to the coverings and the ornaments of idols, ‘get you hence’ [Isa. 30:22]. It is not enough [that] they be purged from the abuse, but simpliciter [simply], they themselves must pack them and be gone. How did Jacob with the earrings of the idols, Elijah with Baal’s altar [1 Kings 18:30], Jehu with his vestments [2 Kings 10:22-28], Josiah with his houses [2 Kings 23:4-19], Manasseh with his altars [2 Chron. 33:15], Moses with the golden calf, Joshua with the temples of Canaan, Hezekiah with the brazen serpent? Did they retain the things themselves and only purge them from the abuse? Belike if these our Opposites had been their counsellors, they had advised them to be contented with such a moderation: yet we see they were better counselled when they destroyed utterly the things themselves: whereby we know that they were of the same mind with us and thought that things abused to Idolatry, if they have no necessary use, are far better away than aplace. Did Daniel refuse Bel’s meat because it was not restored to the right use? Nay, if that had been all, it might have been quickly helped, and the meat sanctified by the Word of God and prayer. Finally, were the Churches of Pergamos and Thyatira [Rev. 2:12-29] reproved because they did not restore things sacrificed to idols to their right use? or, were they not rather reproved for having anything at all adoe with the things themselves? … Though it be indifferent to choose this place or that place, etc., also to use these vessels or other vessels [for the Lord’s Supper], etc., yet the Dr. (I trust) will not deny that temples, houses of prayer, vessels and bells are of a necessary use (which exeems them from the touch of our present argument); whereas beside, that it is not necessary to kneel in the communion in this place more than in that place, neither to keep the feasts of Christ’s nativity, passion, etc. upon these days more than upon other days, etc.; the things themselves are not necessary in their kind and it is not necessary to keep any festival day, nor to kneel at all in the act of receiving the communion. There is also another respect which hinders temples, vessels, etc. from coming within the compass of this our argument: but neither does it agree to the controverted ceremonies. Temples, houses of prayer, vessels for the ministration of the sacraments and bells are not used by us in divine worship as things sacred or as holier than other houses, vessels and bells; but we use them only for natural necessity, partly for that common decency which has no less place in the actions of civil than of sacred assemblies: yea in some cases they may be applied to civil uses, as has been said. Whereas the controverted ceremonies are respected and used as sacred rites and as holier than any circumstance which is alike common to civil and sacred actions, neither are they used at all out of the case of worship. We see now a double respect wherefore our argument infers not the necessity of abolishing and destroying such temples, vessels and bells as have been abused to idolatry, viz. because it can neither be said that they are not things necessary, nor yet that they are things sacred. Nevertheless (to add this by the way), howbeit for those reasons the retaining and using of temples [church buildings] which have been polluted with idols be not in itself unlawful, yet the retaining of every such temple is not ever necessary, but sometimes it is expedient for further extirpation of superstition to demolish and destroy some such temples as have been horribly abused to idolatry, as Calvin (Commentary on Dt. 12:2) also and Zanchius (in 4th Praec., col. 709) do plainly insinuate. Whereby I mean to defend (though not as in itself necessary, yet as expedient pro tunc [for the occasion], that which the reformators of the Church of Scotland did in casting down some of those churches which had been consecrated to Popish idols, and of a long time polluted with idolatrous worship. As on the one part the reformators (not without great probability) feared, that so long as these churches were not made even with the ground, the memory of that superstition whereunto they had been employed and accustomed should have been in them preserved and with some sort of respect recognized: so on the other part they saw it expedient to demolish them for strengthening the hands of such as adhered to the Reformation, for putting Papists out of all hope of the reentry of Popery and for hedging up the way with thorns that the idolatrously minded might not find their paths. … Secondly, our Opposites answer us that beside the purging of things and rites abused by idolators from their idolatrous pollution and the restoring of them to a right use, preaching and teaching against the superstition and abuse which has followed upon them is another means to avoid that harm which we fear to ensue upon the retaining of them. Answer: 1. …It is not enough with the scribes and Pharisees to teach out of Moses’s Chair what the people should do, but all occasions, yea appearances of evil, are to be taken out of their sight. Efficacius enim &amp; plus movent, quae in oculos quam quae in aures incidunt. Potuerat &amp; Hezekias populum monere, ne Serpentem adorarent, sed maluit confringere &amp; penitus è conspectu auferre, &amp; rectius fecit, says one well to this purpose. 2. Experience has taught to how little purpose such admonitions do serve. Calvin writing to the Lord Protector of England of some Popish ceremonies which did still remain in that Church after the Reformation of the same, desires that they may be abolished because of their former abuse in time of Popery. Quid enim (says he) illae Ceremoniae aliud fuerunt, quam totidem lenocinia quae miseras animas ad malum perducerent, etc. (Epist. &amp; Resp., p. 86) But because he saw that some might answer that which our Formalists answer now to us, and say it were enough to warn and teach men that they abuse not these ceremonies and that the abolishing of the ceremonies themselves were not necessary, therefore immediately he subjoins these words, Iam si decautione agitur, monebuntur homines scilicet, ne ad illas nunc impingant, etc. Quis tamen non videt obdurari ipsos nihilominus, nihil ut infaelici illa cautione obtineri possit. Whereupon he concludes that if such ceremonies were suffered to remain, this should be a mean to nourish a greater hardness and obfirmation in evil, and a vail drawn, so that the sincere doctrine which is propounded should not be admitted as it ought to be. In another epistle to Cranmer, Archbishop of Canterbury (Ibid., col. 136), he complains that external superstitions were so corrected in the Church of England, ut residui maneant innumeri surculi, qui assidue polluent. And what good then was done by their admonitions whereby they did in some sort snede [cut or section] the reviving twigs of old superstition, since forasmuch as they were not wholly eradicated, they did still shoot forth again. If a man should dig a pit by the wayside for some commodity of his own, and then admonish the travelers to take heed to themselves if they go that way in the darkness of the night, who would hold him excusable? How then shall they be excused who dig a most dangerous pit, which is like to ruin many souls, and yet will have us to think that they are blameless for that they warn men to beware of it? … Paybody… says that God did not absolutely condemn things abused to idolatry, and tells us of three conditions on which it was lawful to spare idolatrous appurtenances: …3. If they were without certain danger of ensnaring people into idolatry. Answer: …His third condition rests, and touching it I ask, what if those idolatrous appurtenances be not without apparent danger of ensnaring people into idolatry? Are we not commanded to abstain from all appearance of evil? Will he correct the apostle and teach us that we need not care for apparent, but for certain dangers? What more apparent danger of ensnaring people into idolatry than unnecessary ceremonies, which have been dedicated to and polluted with idols, and which being retained, do both admonish us to remember upon old idolatry, and move us to return to the same, as I have before made evident?</p></blockquote>

receiving+the+communion.+There+is+also+another+respect+which+hinders+temples%2C+vessels%2C+etc.+from+coming+within+the+compass+of+this+our+argument%3A+but+neither+does+it+agree+to+the+controverted+ceremonies.+Temples%2C+houses+of+prayer%2C+vessels+for+the+ministration+of+the+sacraments+and+bells+are+not+used+by+us+in+divine+worship+as+things+sacred+or+as+holier+than+other+houses%2C+vessels+and+bells%3B+but+we+use+them+only+for+natural+necessity%2C+partly+for+that+common+decency+which+has+no+less+place+in+the+actions+of+civil+than+of+sacred+assemblies%3A+yea+in+some+cases+they+may+be+applied+to+civil+uses%2C+as+has+been+said.+Whereas+the+controverted+ceremonies+are+respected+and+used+as+sacred+rites+and+as+holier+than+any+circumstance+which+is+alike+common+to+civil+and+sacred+actions%2C+neither+are+they+used+at+all+out+of+the+case+of+worship.+We+see+now+a+double+respect+wherefore+our+argument+infers+not+the+necessity+of+abolishing+and+destroying+such+temples%2C+vessels+and+bells+as+have+been+abused+to+idolatry%2C+viz.+because+it+can+neither+be+said+that+they+are+not+things+necessary%2C+nor+yet+that+they+are+things+sacred.+Nevertheless+%28to+add+this+by+the+way%29%2C+howbeit+for+those+reasons+the+retaining+and+using+of+temples+%5Bchurch+buildings%5D+which+have+been+polluted+with+idols+be+not+in+itself+unlawful%2C+yet+the+retaining+of+every+such+temple+is+not+ever+necessary%2C+but+sometimes+it+is+expedient+for+further+extirpation+of+superstition+to+demolish+and+destroy+some+such+temples+as+have+been+horribly+abused+to+idolatry%2C+as+Calvin+%28Commentary+on+Dt.+12%3A2%29+also+and+Zanchius+%28in+4th+Praec.%2C+col.+709%29+do+plainly+insinuate.+Whereby+I+mean+to+defend+%28though+not+as+in+itself+necessary%2C+yet+as+expedient+pro+tunc+%5Bfor+the+occasion%5D%2C+that+which+the+reformators+of+the+Church+of+Scotland+did+in+casting+down+some+of+those+churches+which+had+been+consecrated+to+Popish+idols%2C+and+of+a+long+time+polluted+with+idolatrous+worship.+As+on+the+one+part+the+reformators+%28not+without+great+probability%29+feared%2C+that+so+long+as+these+churches+were+not+made+even+with+the+ground%2C+the+memory+of+that+superstition+whereunto+they+had+been+employed+and+accustomed+should+have+been+in+them+preserved+and+with+some+sort+of+respect+recognized%3A+so+on+the+other+part+they+saw+it+expedient+to+demolish+them+for+strengthening+the+hands+of+such+as+adhered+to+the+Reformation%2C+for+putting+Papists+out+of+all+hope+of+the+reentry+of+Popery+and+for+hedging+up+the+way+with+thorns+that+the+idolatrously+minded+might+not+find+their+paths.+%E2%80%A6+Secondly%2C+our+Opposites+answer+us+that+beside+the+purging+of+things+and+rites+abused+by+idolators+from+their+idolatrous+pollution+and+the+restoring+of+them+to+a+right+use%2C+preaching+and+teaching+against+the+superstition+and+abuse+which+has+followed+upon+them+is+another+means+to+avoid+that+harm+which+we+fear+to+ensue+upon+the+retaining+of+them.+Answer%3A+1.+%E2%80%A6It+is+not+enough+with+the+scribes+and+Pharisees+to+teach+out+of+Moses%E2%80%99s+Chair+what+the+people+should+do%2C+but+all+occasions%2C+yea+appearances+of+evil%2C+are+to+be+taken+out+of+their+sight.+Efficacius+enim+%26+plus+movent%2C+quae+in+oculos+quam+quae+in+aures+incidunt.+Potuerat+%26+Hezekias+populum+monere%2C+ne+Serpentem+adorarent%2C+sed+maluit+confringere+%26+penitus+%C3%A8+conspectu+auferre%2C+%26+rectius+fecit%2C+says+one+well+to+this+purpose.+2.+Experience+has+taught+to+how+little+purpose+such+admonitions+do+serve.+Calvin+writing+to+the+Lord+Protector+of+England+of+some+Popish+ceremonies+which+did+still+remain+in+that+Church+after+the+Reformation+of+the+same%2C+desires+that+they+may+be+abolished+because+of+their+former+abuse+in+time+of+Popery.+Quid+enim+%28says+he%29+illae+Ceremoniae+aliud+fuerunt%2C+quam+totidem+lenocinia+quae+miseras+animas+ad+malum+perducerent%2C+etc.+%28Epist.+%26+Resp.%2C+p.+86%29+But+because+he+saw+that+some+might+answer+that+which+our+Formalists+answer+now+to+us%2C+and+say+it+were+enough+to+warn+and+teach+men+that+they+abuse+not+these+ceremonies+and+that+the+abolishing+of+the+ceremonies+themselves+were+not+necessary%2C+therefore+immediately+he+subjoins+these+words%2C+Iam+si+decautione+agitur%2C+monebuntur+homines+scilicet%2C+ne+ad+illas+nunc+impingant%2C+etc.+Quis+tamen+non+videt+obdurari+ipsos+nihilominus%2C+nihil+ut+infaelici+illa+cautione+obtineri+possit.+Whereupon+he+concludes+that+if+such+ceremonies+were+suffered+to+remain%2C+this+should+be+a+mean+to+nourish+a+greater+hardness+and+obfirmation+in+evil%2C+and+a+vail+drawn%2C+so+that+the+sincere+doctrine+which+is+propounded+should+not+be+admitted+as+it+ought+to+be.+In+another+epistle+to+Cranmer%2C+Archbishop+of+Canterbury+%28Ibid.%2C+col.+136%29%2C+he+complains+that+external+superstitions+were+so+corrected+in+the+Church+of+England%2C+ut+residui+maneant+innumeri+surculi%2C+qui+assidue+polluent.+And+what+good+then+was+done+by+their+admonitions+whereby+they+did+in+some+sort+snede+%5Bcut+or+section%5D+the+reviving+twigs+of+old+superstition%2C+since+forasmuch+as+they+were+not+wholly+eradicated%2C+they+did+still+shoot+forth+again.+If+a+man+should+dig+a+pit+by+the+wayside+for+some+commodity+of+his+own%2C+and+then+admonish+the+travelers+to+take+heed+to+themselves+if+they+go+that+way+in+the+darkness+of+the+night%2C+who+would+hold+him+excusable%3F+How+then+shall+they+be+excused+who+dig+a+most+dangerous+pit%2C+which+is+like+to+ruin+many+souls%2C+and+yet+will+have+us+to+think+that+they+are+blameless+for+that+they+warn+men+to+beware+of+it%3F+%E2%80%A6+Paybody%E2%80%A6+says+that+God+did+not+absolutely+condemn+things+abused+to+idolatry%2C+and+tells+us+of+three+conditions+on+which+it+was+lawful+to+spare+idolatrous+appurtenances%3A+%E2%80%A63.+If+they+were+without+certain+danger+of+ensnaring+people+into+idolatry.+Answer%3A+%E2%80%A6His+third+condition+rests%2C+and+touching+it+I+ask%2C+what+if+those+idolatrous+appurtenances+be+not+without+apparent+danger+of+ensnaring+people+into+idolatry%3F+Are+we+not+commanded+to+abstain+from+all+appearance+of+evil%3F+Will+he+correct+the+apostle+and+teach+us+that+we+need+not+care+for+apparent%2C+but+for+certain+dangers%3F+What+more+apparent+danger+of+ensnaring+people+into+idolatry+than+unnecessary+ceremonies%2C+which+have+been+dedicated+to+and+polluted+with+idols%2C+and+which+being+retained%2C+do+both+admonish+us+to+remember+upon+old+idolatry%2C+and+move+us+to+return+to+the+same%2C+as+I+have+before+made+evident%3F%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+pt.+3%2C+ch.+2%2C+pp.+21-23%2C+25-26%2C+30-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb19f9bc9a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fb19f9bc9a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-monuments-badges-of-idolatry/#:~:text=they%20%5BFormalists%5D%20tell%20us%20that%20it,as%20I%20have%20before%20made%20evident&amp;text=they%20%5BFormalists%5D%20tell%20us%20that%20it%20is%20needless&amp;text=the%20same%2C%20as%20I%20have%20before%20made%20evident" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-24f775c1d2" data-kw="">
<blockquote><p>In a day when the covenant of works is being attacked by Federal Visionists and others who, while generally orthodox, have allowed their biblicism to get the better of them, we can find encouragement in the words of John Paul:

The covenant of works is a doctrine which has stood the test of examination during a series of centuries: the friction of opposition has only tended to brighten its evidence: its advocates are daily increasing, and the myriads of those virulent pamphlets published against it, have, like Jonah’s gourd, “sprung up in a night and perished in a night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paul.html">John Paul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>reeds and confessions defended, in a series of letters addressed to the author of “The battle of the two dialogues”</cite>, (Belfast, 1819) in Stewart Bates (ed.), Works of the late Rev. John Paul, D.D., of Carrickfergus. With a memoir and introduction by the editor (Belfast, 1855), p. 352.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b3b954022" data-kw="">
<blockquote><p>4 Thesis

For in the absolute Covenant [of grace], there is nothing in the creature that doth impel God either to promise, or to perform what he hath promised, or to perform what he hath promised; But in that Covenant [of works] to which a restipulation is annexed, God doth fulfil what he hath promised, because the creature hath rendered what is required; And although God hath made such a Covenant, wherein he hath promised so great things, upon condition of man’s performance, yet all this proceeds from the antecedent love of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), p. 355.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-86a6f25ed5" data-kw="covenant reward">
<blockquote><p>By his own right, God could indeed have prescribed obedience to man (created by him) without any promise of reward. But in order to temper that supreme dominion with his goodness, he added a covenant consisting in the promise of a reward and the stipulation of obedience. As he wished to assert more strongly his own right over man, so he demonstrated the highest benignity in this—that he (himself in need of nothing) willed to invite to a nearer communion with him the creature already subject to him by right of creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.2</span></figcaption>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

</figure><figure class="quote" id="q-26adfe6d32" data-kw="">
<blockquote><p>Because God added thereunto a pledge and Sacrament in the Tree of Life, whereby he would have that Covenant of the Law, written in the heart, more clearly confirmed also outwardly; to wit, that he would by the observation of his Law, first perpetuate man’s life in this world unto the solemn justification of him; at his appointed time; and then advance him to a further and heavenly Felicity. And on the other side, he threatens Death unto him, in case he should depart from that Will and Law of God: all which had been done to no purpose, if man had been at first made by God himself, in any measure or manner sinful and perverse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism</cite>, (London: Thomas Davies, 1659), p. 19.</span></figcaption>

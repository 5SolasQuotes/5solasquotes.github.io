<main class="wrap"><figure class="quote" id="q-18e52073a5" data-kw="">
<blockquote><p>But the Saviour had to endure not only the desertion, but the wrath of the Father. The Lord’s anger against sin was vented against him, the substitute of sinners. “He was stricken, smitten of God, and afflicted. The Lord laid on him the iniquity of us all. It pleased the Lord to bruise him; he hath put him to grief.” Hence the cry, “O my Father, if it be possible, let this cup pass from me.” It was the full cup of the Father’s wrath then put into his hand. Jesus was thus learning what the anger of an infinite God means. He had the curse due to all the elect to encounter; and the debt he had engaged to pay was exacted from him to the uttermost farthing by awful and unbending justice, and that the justice of a Father, whose beloved son he was in whom he was ever well pleased.

This gave an inconceivably bitter relish to the cup. God’s Word declares, “that the soul that sins shall die;” that “cursed is every one that continueth not in all things written in the book of the law to do them.” It was this curse Christ undertook to bear. “He who knew no sin was made sin for us. He hath redeemed us from the curse of the law, being made a curse for us.” He placed himself in the room of sinners—of all the sinners for whom he engaged: he undertook to satisfy for all their sins; and thus the curse due to every one of his innumerable progeny, and which, but for his gracious interposition, would have descended unmitigated, and been drawn out in every instance the length of eternity, was in his case compressed into one draught, and drunk up at once.

If the frown of an earthly father will send a sudden chill through the heart of his child, and damp the gayety of his spirits — if the alienation of an earthly friend will cause you the most anxious disturbance, and fill your soul with melancholy reflections — if one drop of God’s wrath in a cup otherwise full to the brim with the elements of happiness, will turn all into gall and wormwood — what inexpressible anguish, what inconceivable terrors, must have been awakened in the filial bosom of the Redeemer in that hour and power of darkness!

O that we would learn from the contemplation of his unknown agonies what an evil thing sin is — what intolerable misery is the fruit of it under the government of a holy God! — the Divine justice, how uncompromising! — the Divine wrath, how terrible! — the love of Christ, how boundless and unconquerable! — and the value of that salvation of which we think so lightly, but which cost the affectionate Saviour an amount and variety of soul-travail of which it will take us eternity to estimate the burden!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-roxburgh.html">John Roxburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saviour s sufferings, and his satisfaction in the fruit of them’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.3</span></figcaption>

</figure><figure class="quote" id="q-776aec0c23" data-kw="">
<blockquote><p>I am not, therefore, my dear Sir, surprised or too much grieved to bear the complaints you make of darkness within and without. I never, since I knew the ways of God, admired an easy religion—a religion attended with no conflicts, strivings, wrestlings, swoonings, and strong outcries of felt darkness, unbelief, depravity, and bondage.

There is, indeed, ease, pleasure, and rest to be found in Christ; but it is in the way of much fighting and struggling against our hellish adversaries, who are sure to be at our right hand to resist us, whenever we make an earnest attempt to come to the blessed Saviour, whose power and grace they dread and hate; and when we have got within the glorious city of refuge, and begin to drink of strong consolation, Satan envies every drop of comfort, and will do his utmost to dash the cup of consolation out of our hands.

But by faith we stand, even that faith which against hope believeth in hope; and the strength of our faith lies in the intercession of our High Priest and Advocate within the vail. Behold him holding up your case, in all its circumstances, before the glorious eyes of the Father sitting upon the throne of glory, and saying, “Jehovah rebuke thee, Satan: is not this a brand plucked out of the fire?” It is your part to come in at the back of this great Intercessor, hiding yourself, as it were, amidst the dazzling brightness of his glory, consenting from the heart to his suit, and waiting for the breaking forth of an answer, in your darkened, feeble, and sorrowful soul.

And you must give him time and full liberty to carry on his work, by emptying you from vessel to vessel, sifting you as wheat, burning and melting you in the refining furnace, until seven times pass over you. At length you shall see. him inclining to you, bowing the heavens and coming down, to draw you out of many waters, and to de liver you from the hand of strange children, whose mouth speaketh vanity, and their right hand is a right hand of falsehood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to a Christian Friend by the Late Rev. Dr Love of Glasgow. Now Published for the First time (15 January 1796) in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-1e7a63f683" data-kw="">
<blockquote><p>Seeing that by one man, sin entered into the world, and death by sin, and all men, without exception, are born guilty of the curse; it is certain, that no man can be freed from the curse, but by the mere grace and favour of God: This grace he hath revealed to us in Christ, without whom there is no salvation:

For he put on our nature, that by this means of his coming between, and as it were by this knot, man might be joined with God; and he suffered death that he might satisfy for our sins, and so reconciliation being made, we might be restored to the title and degree of the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 12.1, p. 70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Seeing that by one man, sin entered into the world, and death by sin, and all men, without exception, are born guilty of the curse; it is certain, that no man can be freed from the curse, but by the mere grace and favour of God: This grace he hath revealed to us in Christ, without whom there is no salvation:

For he put on our nature, that by this means of his coming between, and as it were by this knot, man might be joined with God; and he suffered death that he might satisfy for our sins, and so reconciliation being made, we might be restored to the title and degree of the sons of God.”

— Pierre Du Moulin, The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c, (1619; London: Nathanael Newbery, 1635), 12.1, p. 70.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSeeing+that+by+one+man%2C+sin+entered+into+the+world%2C+and+death+by+sin%2C+and+all+men%2C+without+exception%2C+are+born+guilty+of+the+curse%3B+it+is+certain%2C+that+no+man+can+be+freed+from+the+curse%2C+but+by+the+mere+grace+and+favour+of+God%3A+This+grace+he+hath+revealed+to+us+in+Christ%2C+without+whom+there+is+no+salvation%3A%0A%0AFor+he+put+on+our+nature%2C+that+by+this+means+of+his+coming+between%2C+and+as+it+were+by+this+knot%2C+man+might+be+joined+with+God%3B+and+he+suffered+death+that+he+might+satisfy+for+our+sins%2C+and+so+reconciliation+being+made%2C+we+might+be+restored+to+the+title+and+degree+of+the+sons+of+God.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%3A+Or%2C+The+Opening+of+the+Controversies+of+These+Times+%28Formerly+Handled+in+the+Low-Countries%29+Concerning+the+Doctrine+of+Providence%2C+of+Predestination%2C+of+the+Death+of+Christ%2C+of+Nature+and+Grace%2C+%26c%2C+%281619%3B+London%3A+Nathanael+Newbery%2C+1635%29%2C+12.1%2C+p.+70.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e7a63f683.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e7a63f683.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/01/pierre-du-moulin-christ-became-man-for-our-salvation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Yet surely as ministers derive their power from the Mediator Christ, so magistrates derive theirs from God Almighty, and both by vertue of their office, commission and capacity are unavoidably obliged to join their power and policy together for the suppression and punishment of vice and wickedness and the promoval and encouragement of virtue and piety, for no less will God call civil magistrates to an account for their negligence and maladministrations than Church pastors and ministers; therefore both should amicably correspond and cordially concur for advancing the peace and purity of the Church, for which purpose it is our hearty vote that God would pour forth a spirit of wisdom, zeal and holiness upon magistrates, ministers and all ranks and degrees of persons, Amen.</p></blockquote>

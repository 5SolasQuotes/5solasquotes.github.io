<blockquote><p>And yet the same person may perhaps think the communion of another church preferable, and, for ordinary resort, rather to be chosen; as wherein he finds the same essence, with more regular, grateful, and advantageous modes and ways of administration.</p></blockquote>

</figure><figure class="quote" id="q-960a72c9ed" data-kw="">
<blockquote><p>But if Peter withdraw or separate from the Gentiles for fear of offending the Jewish Christians, and Barnabas be led away with the dissimulation, Paul must oppose it to their faces: And I that have seen what the Spirit of division has done, and read that God never blessed unnecessary separation, will imitate Paul. And if this world be uncurable, the Lord prepare me for that world where love and unity have no enemies.</p></blockquote>

<blockquote><p>A separation, when not upon clear and just ground, is a greater sin before God, and more wounding to the heart of Christ, than either murder or adultery, etc. And whoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood.</p></blockquote>

<blockquote><p>There was impurity or corruption in worship in the Church of Corinth; for women taught in the Church: There was corrupt doctrine; many denied the resurrection. In manners she was most corrupt, there being so many fornications, sects, palpable love of the world, etc. Yet the apostle did not command those that were worthily prepared to abstain from the Supper, but, rectifying abuses, he did command everyone to try himself, and so eat.</p></blockquote>

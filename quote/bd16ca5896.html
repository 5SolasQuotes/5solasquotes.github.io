<main class="wrap"><figure class="quote" id="q-bd16ca5896" data-kw="">
<blockquote><p>I’ll follow Christ to the Synagogue of the Jews, and in so doing I’ll be more strict than those that scruple to follow his example, for fear of being involved in the guilt of the corruptions among them; for the nearer I follow Christ, the stricter I am.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf446c742e" data-kw="">
<blockquote><p>If any person walk unworthy of the Gospel or commit any trespass, he is (unless the scandal be public and notorious) admonished first: secretly by one, next by two or three more. And thirdly, if he contemn both, then according to the order prescribed by our Savior (Matt 18), the matter is brought before the minister and elders where he is accused both of the trespass and of the contempt. If he cannot yet be brought to repentance, then is the matter in some measure made known unto the congregation and he is called before the greater presbytery, where, if he give signs of his repentance, he is remitted to satisfy his own session. But if he persist in his obstinacy, then by the ordinance of the presbytery, the particular eldership is to proceed against him with the censures of the church even to excommunication. The matter being thus heard, known and judged, and the whole process revised by the greater presbytery, the next Sabbath (without delay) the trespass and order of admonitions are declared to the congregation and the person (without specification of his name) is admonished yet to satisfy. Which, if he still refuse to do, the next Sabbath his name, with his offence and contempt, are published. If he yet continue obstinate, then on the next Sabbath (which is the third), he is charged publicly to satisfy for his offence and contempt under the pain of excommunication. If now he offer himself to the particular presbytery, then do they (at the appointment of the presbytery) give order for his public repentance, the removing of the scandal, and his reconcilement to the church. Otherwise the minister proceeds in this order: … As the presbytery excommunicates profane professors, so does it also depose preachers… … The subject and matters treated in the presbytery are all the ecclesiastical matters of weight which concern the particular churches there represented, as: the examination, ordination, suspension and deposition of ministers, scandals of ministers in doctrine, life, or any part of their calling, the decerning [decreeing] of excommunication…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland</cite></span></figcaption>

</figure><figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’ 15</cite>, pp. (1584) in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>

</figure><figure class="quote" id="q-5f064b23ae" data-kw="">
<blockquote><p>There are several cases in which separation from the Church of England is sinful, as:

1. If any separate as the Papists do, because they are against sound doctrine or any good that is in the Church.

2. If any renounce communion with all the parish-churches under the name of the Church of England.

3. If any renounce communion with the Church of England as it is a Christian kingdom, headed by one Christian protestant king.

4. If they renounce communion with the Church of England as it is called one from the association or concord of its pastors or Church governors.

5. If any renounce communion with faulty bishops or worship, or discipline, simply and absolutely, and not only secundum quid [according to what; that is in a qualified manner], and so forsake the good that is in them for the sake of the evil. In a word, 1. all that separate for a wrong cause, 2. or further than they separate from Christ, or than Christ would have them separate, do sin. 2. But they that renounce any corruption as such, and the Church no further than secundum quid [according to that], as it is faulty, do well: For we must so renounce the faults of all Churches and Christians in the world (and our own first), but not the Churches and Christians for any tolerable faults, so that we commit no sin ourselves, which they impose as the condition of their communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 85</span></figcaption>

<blockquote><p>These differences were a sad trial and temptation to the Church, and occasioned many sad animosities and alienations in affection both amongst ministers and people, obstructed greatly the power of godliness and edification amongst all, and did beget much prejudice, envy and emulation, that many looked more at their own image in others than the image of God in them, and accordingly rejected them; which always falls in in differences amongst the godly. But after king Charles in the 1660 returned from his exile, then their eyes were opened to see the evil of division, etc.</p></blockquote>

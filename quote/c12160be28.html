<blockquote><p>XI. Whether any other but a minister. lawfully called and ordained, may administer the sacraments, baptism and the Lord’s Supper? ([Margin Note:] Thus the Augsburg Confession says, ‘De ordine ecclesiastico docent ecclesiae nostrae, quod nemo in ecclesia debeat publice docere, aut sacramenta administrare, nisi rite vocatus, quae confessionis verba opposita sunt calumniis pontificiorum, qui dic•t omnia in ecclesiis nostris confuse et sine ordine geri et cuivis in ecclesia docendi potestatem apud nos concedi.’ [Johann] Gerhard, Common Places, ‘On the Ecclesiastical Minister’, ch. 3, sect. 1, ‘Res inter se perpetuo nexu conjunctae, pascere ecclesiam salutis doctrina, et sacramenta administraro.’ Calvin, Catechism of the Christian Religion. See Master [Richard] Baxter’s, Infant Church-Membership, part 2, errour 2 &amp; 3) It is held by the reformed Churches, and by the soundest protestant writers, that neither of these sacraments may be dispensed by any, but by a minister of the Word, lawfully ordained.

      1. God has appointed the ministers of the Word, lawfully called and ordained, and no other to be stewards and dispensers of the mysteries of Christ, 1 Cor. 4:1; Tit. 1:5,7.

      2. He has appointed them to be pastors or shepherds, to feed the flock of God, Jer. 3:15; Eph. 4:11; Acts 20:28; 1 Pet. 5:2; much of this feeding consists in the dispensation of the sacraments.

      3. Christ gives a commission to the apostles to teach and baptize, and extends the same commission to all teaching ministers to the end of the world, Mt. 28:19,20; Eph. 4:11-13. Neither of the sacraments have efficacy, unless they be administred by him that is lawfully called thereunto, or a person made public and clothed with authority by ordination. This error in the matter of baptism is begot by another error of the absolute necessity of baptism. Mr. [Alexander] Henderson’s second paper to the king. The Scripture joins together the preaching of the Word and dispensations of the seals, both belonging to the officers who have received commission from Jesus Christ, Mt. 28:19; 1 Cor. 1. Mr. [John] Ball. Heb. 5:4, ‘No man takes this honour but he which is called, as was Aaron;’ which sentence does manifestly shut out all private persons from administration of baptism, seeing it is a singular honor in the Church of God. [Thomas] Cartwright, 2nd Reply [to John Whitgift], 11th Tractate. The example of Zipporah either was rash or singular, and also no way like women’s baptizing; circumcision was then commanded [to] the head of the family, baptism belongs only to ministers, Mt. 28; she circumcised her son when he was not in danger of death, as these [do that] baptize.</p></blockquote>

<blockquote><p>No baptism shall be administred but in Church assemblies or where there is a formed public Church. But where there is no public Church and the parents through infirmity are afraid to carry them unto public baptism in the congregation, ministers shall consult how far in prudence they ought to yield unto them. Yet nevertheless there shall be some face of a Church and both exhortation and prayer; but if there be no Church, and a congregation cannot be assembled, the minister shall not make any difficulty to baptize the infants of believing parents tendered to him, with exhortation and prayer.</p></blockquote>

</figure><figure class="quote" id="q-80f4c94ea9" data-kw="">
<blockquote><p>First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)</p></blockquote>

<blockquote><p>Neither Word nor sacraments, nor anything on the part of the Almighty can be intended in vain, though the end of the ordinance be not obtained. I should have expected some such divinity from the pen of Arminians and Socinians who make God to intend the salvation of all and every one in both the promises of the Gospel, precepts and sacraments, and yet He falls from this end: so you may read, in Arminius, Anti-Perkins, p. 60, that God is disappointed in his end, in both Law and Gospel, and God shooting beside his mark misses the salvation of many, say the Remonstrants at the Synod of Dort, p. 216, and in their confession, ch. 7, sect. 3; and because Socinus thought it hard thus to take from God wise intentions, he did no less than blasphemously deprive Him of his omniscience: So Socians, Contra Puccium, ch. 10, and in Theological Lectures, ch. 11, made all things that are contingently to come uncertain to God: But if you speak of intentio operis, non operantis [the end of the work, not of the worker], that the Supper, in its nature, is ordained…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 23, pp. 525-26</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Neither Word nor sacraments, nor anything on the part of the Almighty can be intended in vain, though the end of the ordinance be not obtained. I should have expected some such divinity from the pen of Arminians and Socinians who make God to intend the salvation of all and every one in both the promises of the Gospel, precepts and sacraments, and yet He falls from this end: so you may read, in Arminius, Anti-Perkins, p. 60, that God is disappointed in his end, in both Law and Gospel, and God shooting beside his mark misses the salvation of many, say the Remonstrants at the Synod of Dort, p. 216, and in their confession, ch. 7, sect. 3; and because Socinus thought it hard thus to take from God wise intentions, he did no less than blasphemously deprive Him of his omniscience: So Socians, Contra Puccium, ch. 10, and in Theological Lectures, ch. 11, made all things that are contingently to come uncertain to God: But if you speak of intentio operis, non operantis [the end of the work, not of the worker], that the Supper, in its nature, is ordained…”

— Samuel Rutherford, The Divine Right of Church Government… (London, 1646), ch. 23, pp. 525-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+Word+nor+sacraments%2C+nor+anything+on+the+part+of+the+Almighty+can+be+intended+in+vain%2C+though+the+end+of+the+ordinance+be+not+obtained.+I+should+have+expected+some+such+divinity+from+the+pen+of+Arminians+and+Socinians+who+make+God+to+intend+the+salvation+of+all+and+every+one+in+both+the+promises+of+the+Gospel%2C+precepts+and+sacraments%2C+and+yet+He+falls+from+this+end%3A+so+you+may+read%2C+in+Arminius%2C+Anti-Perkins%2C+p.+60%2C+that+God+is+disappointed+in+his+end%2C+in+both+Law+and+Gospel%2C+and+God+shooting+beside+his+mark+misses+the+salvation+of+many%2C+say+the+Remonstrants+at+the+Synod+of+Dort%2C+p.+216%2C+and+in+their+confession%2C+ch.+7%2C+sect.+3%3B+and+because+Socinus+thought+it+hard+thus+to+take+from+God+wise+intentions%2C+he+did+no+less+than+blasphemously+deprive+Him+of+his+omniscience%3A+So+Socians%2C+Contra+Puccium%2C+ch.+10%2C+and+in+Theological+Lectures%2C+ch.+11%2C+made+all+things+that+are+contingently+to+come+uncertain+to+God%3A+But+if+you+speak+of+intentio+operis%2C+non+operantis+%5Bthe+end+of+the+work%2C+not+of+the+worker%5D%2C+that+the+Supper%2C+in+its+nature%2C+is+ordained%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%28London%2C+1646%29%2C+ch.+23%2C+pp.+525-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe301663091.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e301663091.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=Neither%20Word%20nor%20sacraments%2C%20nor%20anything,Supper%2C%20in%20its%20nature%2C%20is%20ordained&amp;text=Neither%20Word%20nor%20sacraments%2C%20nor%20anything%20on%20the&amp;text=that%20the%20Supper%2C%20in%20its%20nature%2C%20is%20ordained" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But dost thou think that nothing ought to be determined concerning the place [for baptism]? Answer: Yea, seeing all things must be done in the Church comely and in order: and forasmuch as baptism is a part of the ministry of the Gospel, I think that one and the same place is to be used both for the Word and sacraments, so as baptism be ministered in the public congregation of the Church and with common prayer [mid-week], neither will I rashly admit those, I cannot tell what, cases of necessity, that some allege to the contrary.</p></blockquote>

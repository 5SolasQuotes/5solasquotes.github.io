<main class="wrap"><figure class="quote" id="q-0c3fded103" data-kw="">
<blockquote><p>Every presumptuous sin in the text [that] was cited in Moses, was a sin unto death, in the sense that the Jewish nation understood a sin unto death, viz. that brought to an immediate liableness to cutting off by divine vengeance. Now this was a sin of presumption, and despising the Word of God, as Moses explains what that presumptuous sinning is… But why does not this our apostle speak out, and say, ‘I say he should not pray for it,’ but says only, ‘I do not say that he should.’… He [John] takes care of the consciences of the people of God as well as he shows the two conditions of the sinner he speaks of. There were some that might be in a strait what to do in this case. They were commanded by their Lord and Master to pray for their enemies: these enemies of theirs were become so like their father the Devil that it might pose their consciences whether they should pray for them or no. Therefore this divine apostle uses a happy temper: that he will lay no charge on them, that are so pinched, to pray for them: nor indeed forbid those to pray for them that are more enlarged: for undoubtedly the indifferent expression of the apostle as I may call it, seems plainly to carry with it such a consideration…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16 (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45</cite>, pp. 1097-98</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca7db8ecf7" data-kw="">
<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer: 1. Yea, partly because we know not the secret purposes of God’s grace. Christ in the light of his divinity, knew the elect and the reprobate, but we know not, therefore we are to pray for them that persecute, Mt. 5:44. Paul once breathed out threatenings against the Church; Christ received gifts for the rebellious; partly because many wicked men are considerable in their station, therefore, at least, we pray for temporal blessings for them, though we have little hopes that ever they shall be gained to the knowledge of the truth. Thus we are to pray for wicked rulers, for the conservation of human society, they may serve as a thorn hedge about a garden of roses. Thus it is said, Ezra 6:10, that in the Temple they should pray for the life of the king and of his sons, meaning the King of Babylon, Darius, at least for temporal favors. 2. We have not such encouragement to pray for them as for the saints: For the saints we pray out of the unity of the Spirit, for wicked men, out of common charity: for the saints we pray out of a delight in their graces; for wicked men, out of a loose possible hope. Heb. 13:18, ‘Pray for us, for we trust that we have a good conscience in all things, willing to live honestly.’ These should have the greatest share of our prayers; we have the more encouragements and hopes of them, which should be an engagement to us to pray for them. 3. Conditionally we may pray against the obstinate and them that sin of malicious wickedness. There are many imprecations in Ps. 109 which are not to serve our private revenge, but by us to be conceived conditionally: Those curses are uttered against Judas in a prophetical spirit, and therefore not to be drawn into example, to justify any heats of revenge and private passion. 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin. 4. We feel sometimes a restraint upon our prayers. God by oracle forbade the prophet to pray for the people; Jer. 7:16: ‘Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to Me, for I will not hear thee.’ When He was resolved to put his wrath in execution, He would not have his people’s prayers lost; and still the same Spirit that stirs up to prayer searches out the deep counsels of God. So that there is a kind of prophetical light in prayers; God [at times] suspends the servency and actual assistance, by which we are carried on at other times. I would not justify every private passionate conceit, but yet we must look upon the Spirit of God as the interpreter of God’s counsel, and that He will not stir up prayers to no purpose. Yea, sometimes we feel that after much striving, we have no heart to pray for them, which is a very great mark of God’s displeasure upon any person, when God’s people, yea, even after much struggling with themselves, have no heart to pray for him.</p></blockquote>

<blockquote><p>Between these two texts [at the beginning and ending of 1 Jn. 5], occur the words we wish to explain: ‘There is a sin unto death: I do not say that ye shall pray for it.’ Must not ‘the sin unto death,’ be that against which he wished to fortify the saints; I mean apostasy? What! you will say, is a man lost without remedy who has denied the truth; and is every one in the sad situation of those for whom the apostle prohibits prayer? God forbid, my brethren, that we should preach so strange a doctrine; and once more renew the Novatian severity! There are two kinds of apostates, and two kinds of apostasies: there is one kind of apostasy into which we fall by the fear of punishment, or on the blush of the moment, by the promises Satan makes to his proselytes. There is another, into which we fall by the enmity we have against the truth, by the detestable pleasure we take in opposing its force. It were cruel to account the first of these offenses, ‘a sin unto death;’ but the Spirit of God prompts us to attach this idea to the second. There are likewise two kinds of apostates. There is one class, who have made only small attainments in the knowledge of the truth; weak and imperfect Christians, unacquainted as yet with the joys and transports excited in the soul by a religion, which promises remission of sin, and everlasting felicity. There is another, on the contrary, to whom God has given superior knowledge, to whom He has communicated the gifts of miracles, and whom He has caused to experience the sweetness of his promise. It would be hard to reject the first; but the apostle had regard to the second. Those, according to St. John, who have committed the ‘sin unto death,’ are the persons who abjure Christianity, after the reception of all those gifts. In the primitive church, where some were honoured with the endowment of discerning spirits, there probably were brethren who could discern the latter apostates from the former. … Now, if you have been attentive to all the considerations we have just advanced: if you have understood the explanations we have given of the several texts, you may form a correct idea of the unpardonable sin. You may know what this crime was, at least, in the time of the primitive church. It was denying, hating and maliciously opposing the truth at the moment they were persuaded it proceeded from God. Two classes of men might commit this crime in the apostolic age. First, those who had never embraced Christianity; but opposed its progress in defiance of rational conviction, and the dictates of conscience. This was the sin of the Pharisees, who maliciously ascribed to the devil miracles, which they knew could have God alone for their author. Secondly, those who had embraced the gospel, who had been baptized, who had received the gift of miracles, and experienced all the graces enumerated in the text. This was the sin of those, who, after conversion, abjured the truth, and pronounced against Jesus Christ the anathemas which his enemies, and particularly the Jews, required of apostates. These St. Paul had in view, in the words of our text [Heb. 6:4 ff.], and in the tenth chapter of this epistle. Of this St. John also spake, when he said, ‘there is a sin unto death.’ Hence the sin described in these three passages, and the sin against the Holy Ghost, is the same in quality, if I may so speak, though diversified in circumstances: we have, consequently, comprised the whole under the vague appellation of unpardonable sin.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Between these two texts [at the beginning and ending of 1 Jn. 5], occur the words we wish to explain: ‘There is a sin unto death: I do not say that ye shall pray for it.’ Must not ‘the sin unto death,’ be that against which he wished to fortify the saints; I mean apostasy? What! you will say, is a man lost without remedy who has denied the truth; and is every one in the sad situation of those for whom the apostle prohibits prayer? God forbid, my brethren, that we should preach so strange a doctrine; and once more renew the Novatian severity! There are two kinds of apostates, and two kinds of apostasies: there is one kind of apostasy into which we fall by the fear of punishment, or on the blush of the moment, by the promises Satan makes to his proselytes. There is another, into which we fall by the enmity we have against the truth, by the detestable pleasure we take in opposing its force. It were cruel to account the first of these offenses, ‘a sin unto death;’ but the Spirit of God prompts us to attach this idea to the second. There are likewise two kinds of apostates. There is one class, who have made only small attainments in the knowledge of the truth; weak and imperfect Christians, unacquainted as yet with the joys and transports excited in the soul by a religion, which promises remission of sin, and everlasting felicity. There is another, on the contrary, to whom God has given superior knowledge, to whom He has communicated the gifts of miracles, and whom He has caused to experience the sweetness of his promise. It would be hard to reject the first; but the apostle had regard to the second. Those, according to St. John, who have committed the ‘sin unto death,’ are the persons who abjure Christianity, after the reception of all those gifts. In the primitive church, where some were honoured with the endowment of discerning spirits, there probably were brethren who could discern the latter apostates from the former. … Now, if you have been attentive to all the considerations we have just advanced: if you have understood the explanations we have given of the several texts, you may form a correct idea of the unpardonable sin. You may know what this crime was, at least, in the time of the primitive church. It was denying, hating and maliciously opposing the truth at the moment they were persuaded it proceeded from God. Two classes of men might commit this crime in the apostolic age. First, those who had never embraced Christianity; but opposed its progress in defiance of rational conviction, and the dictates of conscience. This was the sin of the Pharisees, who maliciously ascribed to the devil miracles, which they knew could have God alone for their author. Secondly, those who had embraced the gospel, who had been baptized, who had received the gift of miracles, and experienced all the graces enumerated in the text. This was the sin of those, who, after conversion, abjured the truth, and pronounced against Jesus Christ the anathemas which his enemies, and particularly the Jews, required of apostates. These St. Paul had in view, in the words of our text [Heb. 6:4 ff.], and in the tenth chapter of this epistle. Of this St. John also spake, when he said, ‘there is a sin unto death.’ Hence the sin described in these three passages, and the sin against the Holy Ghost, is the same in quality, if I may so speak, though diversified in circumstances: we have, consequently, comprised the whole under the vague appellation of unpardonable sin.”

— Jacques Saurin, Sermons of the Rev. James Saurin... tr. Robinson, Hunter &amp; Sutcliff, rev. Samuel Burder (NY: Harper, 1860), vol. 2, Sermon 89, ‘On the Nature of the Unpardonable Sin,’, pp. 329-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBetween+these+two+texts+%5Bat+the+beginning+and+ending+of+1+Jn.+5%5D%2C+occur+the+words+we+wish+to+explain%3A+%E2%80%98There+is+a+sin+unto+death%3A+I+do+not+say+that+ye+shall+pray+for+it.%E2%80%99+Must+not+%E2%80%98the+sin+unto+death%2C%E2%80%99+be+that+against+which+he+wished+to+fortify+the+saints%3B+I+mean+apostasy%3F+What%21+you+will+say%2C+is+a+man+lost+without+remedy+who+has+denied+the+truth%3B+and+is+every+one+in+the+sad+situation+of+those+for+whom+the+apostle+prohibits+prayer%3F+God+forbid%2C+my+brethren%2C+that+we+should+preach+so+strange+a+doctrine%3B+and+once+more+renew+the+Novatian+severity%21+There+are+two+kinds+of+apostates%2C+and+two+kinds+of+apostasies%3A+there+is+one+kind+of+apostasy+into+which+we+fall+by+the+fear+of+punishment%2C+or+on+the+blush+of+the+moment%2C+by+the+promises+Satan+makes+to+his+proselytes.+There+is+another%2C+into+which+we+fall+by+the+enmity+we+have+against+the+truth%2C+by+the+detestable+pleasure+we+take+in+opposing+its+force.+It+were+cruel+to+account+the+first+of+these+offenses%2C+%E2%80%98a+sin+unto+death%3B%E2%80%99+but+the+Spirit+of+God+prompts+us+to+attach+this+idea+to+the+second.+There+are+likewise+two+kinds+of+apostates.+There+is+one+class%2C+who+have+made+only+small+attainments+in+the+knowledge+of+the+truth%3B+weak+and+imperfect+Christians%2C+unacquainted+as+yet+with+the+joys+and+transports+excited+in+the+soul+by+a+religion%2C+which+promises+remission+of+sin%2C+and+everlasting+felicity.+There+is+another%2C+on+the+contrary%2C+to+whom+God+has+given+superior+knowledge%2C+to+whom+He+has+communicated+the+gifts+of+miracles%2C+and+whom+He+has+caused+to+experience+the+sweetness+of+his+promise.+It+would+be+hard+to+reject+the+first%3B+but+the+apostle+had+regard+to+the+second.+Those%2C+according+to+St.+John%2C+who+have+committed+the+%E2%80%98sin+unto+death%2C%E2%80%99+are+the+persons+who+abjure+Christianity%2C+after+the+reception+of+all+those+gifts.+In+the+primitive+church%2C+where+some+were+honoured+with+the+endowment+of+discerning+spirits%2C+there+probably+were+brethren+who+could+discern+the+latter+apostates+from+the+former.+%E2%80%A6+Now%2C+if+you+have+been+attentive+to+all+the+considerations+we+have+just+advanced%3A+if+you+have+understood+the+explanations+we+have+given+of+the+several+texts%2C+you+may+form+a+correct+idea+of+the+unpardonable+sin.+You+may+know+what+this+crime+was%2C+at+least%2C+in+the+time+of+the+primitive+church.+It+was+denying%2C+hating+and+maliciously+opposing+the+truth+at+the+moment+they+were+persuaded+it+proceeded+from+God.+Two+classes+of+men+might+commit+this+crime+in+the+apostolic+age.+First%2C+those+who+had+never+embraced+Christianity%3B+but+opposed+its+progress+in+defiance+of+rational+conviction%2C+and+the+dictates+of+conscience.+This+was+the+sin+of+the+Pharisees%2C+who+maliciously+ascribed+to+the+devil+miracles%2C+which+they+knew+could+have+God+alone+for+their+author.+Secondly%2C+those+who+had+embraced+the+gospel%2C+who+had+been+baptized%2C+who+had+received+the+gift+of+miracles%2C+and+experienced+all+the+graces+enumerated+in+the+text.+This+was+the+sin+of+those%2C+who%2C+after+conversion%2C+abjured+the+truth%2C+and+pronounced+against+Jesus+Christ+the+anathemas+which+his+enemies%2C+and+particularly+the+Jews%2C+required+of+apostates.+These+St.+Paul+had+in+view%2C+in+the+words+of+our+text+%5BHeb.+6%3A4+ff.%5D%2C+and+in+the+tenth+chapter+of+this+epistle.+Of+this+St.+John+also+spake%2C+when+he+said%2C+%E2%80%98there+is+a+sin+unto+death.%E2%80%99+Hence+the+sin+described+in+these+three+passages%2C+and+the+sin+against+the+Holy+Ghost%2C+is+the+same+in+quality%2C+if+I+may+so+speak%2C+though+diversified+in+circumstances%3A+we+have%2C+consequently%2C+comprised+the+whole+under+the+vague+appellation+of+unpardonable+sin.%E2%80%9D%0A%0A%E2%80%94+Jacques+Saurin%2C+Sermons+of+the+Rev.+James+Saurin...+tr.+Robinson%2C+Hunter+%26+Sutcliff%2C+rev.+Samuel+Burder+%28NY%3A+Harper%2C+1860%29%2C+vol.+2%2C+Sermon+89%2C+%E2%80%98On+the+Nature+of+the+Unpardonable+Sin%2C%E2%80%99%2C+pp.+329-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97c83eb45a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97c83eb45a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=Between%20these%20two%20texts%20%5Bat%20the,the%20vague%20appellation%20of%20unpardonable%20sin." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8a728eb99f" data-kw="">
<blockquote><p>And in this they [Jews] speak but the words of the Law, in Num. 15:27-28: ‘If any soul sin through ignorance, he shall bring a she-goat of the first year for a sin offering. And the priest shall make an atonement for him that sins ignorantly. But the soul that does ought presumptuously… the same has reproached the Lord: That soul shall be cut off from among his people.’ Now what is meant by ‘cutting off’?… ask the Jews to and among whom the thing was spoken, what it means in their common speech and acceptation, and they will tell you, ‘cutting off means’ [Hebrew], ‘Death by the hand of Heaven,’ death or destruction by the hand of God. Interpreting the matter to this purpose, that if a person sinned wilfully and presumptuously, there was no sin offering allowed in that case, but the party so offending fell immediately under liableness to divine vengance, to be destroyed or cut off by the hand of Heaven…</p></blockquote>

<blockquote><p>(7.) In reference to God as the governor of the world and to his justice in the administration of his government, sins are distinguished into those which call for vengeance from God even in the present life, and into those which God in the exercise of his long-suffering bears, and which he does not punish except in the life to come. The former are so heinous in their character that He cannot extend towards them his forbearance in this world. And hence they are called clamant or crying sins because they as it were call alone for the infliction of the divine vengeance. Some of these are recorded in Scripture. The blood of Abel is represented as crying unto God from the ground, Gen. 4:10. So is th sin of Sodom and Gomorrah, Gen. 18:20-21; the oppression by the Egyptians of the children of Israel, Ex. 3:9; the covetousness of the Chaldeans, Hab. 2:11; and the fraud of those who kept back the hire of their laborers, James 5:4. Among these crying sins may be ranked also those which are committed insolently in the face of a well-known law, and which God will not forgive,Num. 15:30. To the same class belongs that sin which an apostle calls ‘a sin unto death,’ (1 Jn. 5:16). This seems to be plain from the context in which he does not desire us to pray for the forgiveness of such a sin in this life, seeing that God is wont to make a signal display of his vengeance against it even here.</p></blockquote>

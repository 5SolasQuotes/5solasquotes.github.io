<main class="wrap"><figure class="quote" id="q-bdb2fe835b" data-kw="">
<blockquote><p>In regard of Admission, God is a consuming fire, and we are but dried stubble, there is no approaching of him but in Christ, in whom we may have access with boldness to the throne of grace; God will not look pleasingly on you, if you come without Christ, here is no throne of grace without him; without Christ it is rather a Bar or Tribunal of justice, then a Throne of Grace.

It is Christ who makes that which was a Bar of justice, a Bench of mercy. In him we have admission. You go upon this Ordinance [of communion] now, but go not in the strength of your preparations, but in the strength of Christ. Say, Lord I come alone in the Merits of Christ, to partake of the Merits of the Lord Jesus. I come in the blood of Christ, to partake of the blood of the Lord Jesus. I have endeavoured to prepare and fit myself through thy grace, but I look not for admission through my preparations, but through the blood and mediation of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 30-32.</span></figcaption>

ovenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-daba0d7595" data-kw="">
<blockquote><p>He knocks, to awaken us to come and let Him in, knocks by his Word and Spirit, knocks by afflictions and by our own consciences; though this is not expressly quoted, yet probably it is referred to (Rev. 3:20), ‘Behold, I stand at the door, and knock.’ He calls sinners into covenant with Him and saints into communion with Him… …

III. The excuse she made to put off her compliance with this call (Song 5:3): ‘I have put off my coat; how shall I put it on again?’ She is half asleep; she knows the voice of her beloved; she knows his knock, but cannot find in her heart to open to Him… Making excuses (Lk. 14:18) is interpreted making light of Christ (Mt. 22:5), and so it is. Those put a great contempt upon Christ that cannot find in their hearts to bear a cold blast for him, or get out of a warm bed.

IV. The powerful influences of divine grace, by which she was made willing to rise and open to her beloved. When He could not prevail with her by persuasion He put in his hand by the hole in the door, to unbolt it, as one weary of waiting, Song 5:4. This intimates a work of the Spirit upon her soul, by which she was unwilling made willing, Ps. 110:3. The conversion of Lydia is represented by the opening of her heart (Acts 16:14) and Christ is said to open his disciples’ understandings, Lk. 24:45. He that formed the spirit of man within him knows all the avenues to it, and which way to enter into it; he can find the hole of the door at which to put in his hand for the conquering of prejudices and the introducing of his own doctrine and law. He has the key of David (Rev. 3:7), with which He opens the door of the heart in such a way as is suited to it, as the key is fitted to the wards of the lock, in such a way as not to put a force upon its nature, but only upon its ill nature.

V. Her compliance with these methods of divine grace at last: ‘My bowels were moved for Him.’ The will was gained by a good work wrought upon the affections: My bowels were moved for Him, as those of the two disciples were when Christ made their hearts to burn within them. She was moved with compassion to her beloved, because his head was wet with dew. Note, Tenderness of spirit, and a heart of flesh, prepare the soul for the reception of Christ into it… Note, When we apply ourselves to our duty, in the lively exercises of faith, under the influence of divine grace, we shall find it will go on much more readily and sweetly than we expected. If we will but rise up, to open to Christ, we shall find the difficulty we apprehended in it strangely overcome, and shall say with Daniel, ‘Now let my Lord speak, for thou hast strengthened me,’ Dan. 10:19… Those that open the doors of their hearts to Christ, those everlasting doors, must meet Him with the lively exercises of faith and other graces, and with these must anoint Him. … 1. She did not open to Him at his first knock, and now she came too late, when afterwards she would have inherited this blessing. Christ will be sought while He may be found; if we slip our time, we may lose our passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, On Song 5, verses 2-8</span></figcaption>

<blockquote><p>The determining influence of the federal theology is also obvious upon the doctrine of Vocation. The elect seed of Christ who were represented by him in the impetration of redemption must in time be called into spiritual and living union with him as their head, or his obedience unto death would prove an utter failure. But they are in themselves spiritually dead, in consequence of the breach of the covenant of works by their first representative. The vocation must, therefore, of necessity, be accomplished by almighty and creative power. Such power is efficacious and irresistible.

Nothing, before it is created, can resist the power which calls it into existence. The dead cannot resist the power that raises them. This power which calls the elect from spiritual death into vital union with their federal head is Grace. The doctrine of efficacious, irresistible grace is thus briefly but conclusively established by the requirements of the federal system.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>

<blockquote><p>What is to be judged of the soul of a child so killed, having as yet not received the sacrament [of circumcision]? I answer that we, as touching his salvation or condemnation, can affirm nothing on either side. For if he pertained to the number of the elect so that he was predestinate to life, there is no cause but that he may be saved: forasmuch as grace is not bound unto sacraments. But if he were a vessel to that end made of God, to show forth in him His wrath, and so to be condemned, what can we complain on the severity of God, especially seeing we are all born the children of wrath and condemnation? Howbeit in my judgment we ought to hope well in him.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“What is to be judged of the soul of a child so killed, having as yet not received the sacrament [of circumcision]? I answer that we, as touching his salvation or condemnation, can affirm nothing on either side. For if he pertained to the number of the elect so that he was predestinate to life, there is no cause but that he may be saved: forasmuch as grace is not bound unto sacraments. But if he were a vessel to that end made of God, to show forth in him His wrath, and so to be condemned, what can we complain on the severity of God, especially seeing we are all born the children of wrath and condemnation? Howbeit in my judgment we ought to hope well in him.”

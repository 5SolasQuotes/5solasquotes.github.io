<main class="wrap"><figure class="quote" id="q-89ac9ad520" data-kw="">
<blockquote><p>4. Works of necessity and mercy are allowed on the Sabbath. By the former are meant works which could not have been done on the preceding day, and cannot be delayed till the day following… Under these heads are included such works as these: travelling to and from the house of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Confession of Faith of the Westminster Assembly of Divines 4th</cite>, … 4th ed. (London: Johnstone &amp; Hunter, 1850), pp. 233-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb8403ab6d" data-kw="">
<blockquote><p>Some works, albeit they be not works of piety, yet are lawful, in so far us they are necessary means of, and have a tendency unto works of piety: So were they allowed a Sabbath day’s journey to go to their solemn meetings and worship, and the pains that men take in needful apparelling and refreshing of their bodies, and going to the public places of worship are no violation of the Sabbath, if they be done with a Sabbath day’s heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London: Smith, 1657), ch. 7, vv. 21-23, p. 135. Hutcheson was a Scottish covenanter.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-ea6137d763" data-kw="">
<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ch. 20, Article 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-acf56f7acf" data-kw="">
<blockquote><p>3. Works needful for the comfortable passing of the Sabbath, as dressing of moderate food, and the like, may be done on the Sabbath-day; for seeing Christ allows us to lead the ox to the water, and requires not to fetch in water for him over night, he allows us to dress meat, and requires not to dress it over night. For the order in the Law of not kindling a fire pertained alone to the business of the Tabernacle, and that order of dressing what they would dress on the sixth day, pertained alone to the matter of manna. And for this we have Christ’s clear example, who being invited went to a feast on the Sabbath-day, which he might not have done if it had been unlawful to dress meat and drink on the Lord’s day, for a feast sure was not kept without some preparation of warm meat. This example of Christ we have Luke 14:1, 8, 12, which verses compared make it apparent that it was a feast whereto He was bidden amongst diverse others. So then all labors and businesses except in these three cases are unlawful, for mercy, necessity, and present needful comfort… but as sauce for work, only the spiritual pastimes of singing holy Psalms and songs as a spiritual recreation is allowed to prevent all weariness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment, p. 818</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-d42f7d329e" data-kw="">
<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures</cite>, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ng+overnight%2C+might+be+no+inconvenience+at+all%3B+howsoever+it+is+out+of+question+that+in+that+unsettled+condition+of+the+Israelites+wandering+in+the+wilderness%2C+when+they+were+enforced+to+pick+up+fuel%2C+where+they+could+get+it%2C+baking+and+boiling+must+needs+be+more+troublesome+and+laborious+than+it+was+afterwards+in+Canaan%2C+where+being+settled+in+their+dwellings%2C+they+had+all+things+whereof+they+were+to+make+use+for+such+works+provided+and+ready+at+hand.%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Way+to+the+Tree+of+Life+Discovered+in+Sundry+Directions+for+the+Profitable+Reading+of+the+Scriptures...+%281647%29%2C+A+Digression+concerning+the+Morality+of+the+Fourth+Commandement%2C+Section+III%2C+%E2%80%98The+Morality+%26+Perpetuity+of+the+Sabbath+Proved+out+of+the+Fourth+Commandement%E2%80%99%2C+pp.+294-95+White+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd42f7d329e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d42f7d329e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/what-does-keeping-the-lords-day-entail/#:~:text=The%20reasons%20by%20which%20it%20appears,works%20provided%20and%20ready%20at%20hand&amp;text=The%20reasons%20by%20which%20it%20appears%20that%20this&amp;text=for%20such%20works%20provided%20and%20ready%20at%20hand" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

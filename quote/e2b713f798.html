<main class="wrap"><figure class="quote" id="q-e2b713f798" data-kw="">
<blockquote><p>If Paul recognizes the right of private judgment, even in reference to the preaching of an apostle, or of an angel from heaven, surely it will not be denied with regard to the acts of any body of fallible and sinful men. The standard of judgment is of course the holy Scriptures. Our Confession tells us the decrees and determinations of councils are to be received only when “consonant to the word of God.” …

The censure, therefore, which has been heaped upon this Review for the expression of its dissent from certain acts of the Assembly, as an act of presumption unbecoming in the members and servants of the church, are, to say the least, undeserved. Those censures, however, are not to be understood as the denial of the right to dissent, or of the right to discuss the correctness of the acts in question. Such denial would be simply absurd. Those censures are merely the expressions of feeling. Those who utter them claim and exercise the right of approving or disapproving all the deliverances of church-courts. … This is a matter too plain to need remark.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Princeton Review on the State of the Country and the Church in Biblical Repertory and Princeton Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4de9621c68" data-kw="">
<blockquote><p>A full, correct, and intelligent acquaintance with the Scriptures is not by any means so easy or so ordinary an attainment as men are sometimes apt to suppose. It requires a larger measure of natural ability, a higher degree of acquired learning, and a greater amount of patient and laborious study than is commonly imagined. It is quite true that the great leading doctrines and duties of Christianity are very plainly set forth in Scripture, and that every thing needful to guide men to the saving knowledge of the truth and the enjoyment of eternal blessedness, may be certainly learned, under the guidance of God’s Spirit, from almost any translation of the Scriptures, by men who have but a very small measure of intellectual culture and of acquired knowledge; and it is also true, that men who, from the teaching of the Spirit and of the word, have got a clear perception and a firm hold of the leading principles of God’s oracles, are not likely to fall into any very dangerous errors in the interpretation of particular portions of Scripture.

But though all this is true, and most important and encouraging truth it is, it has nothing to do with the question as to what kind and degree of knowledge of God’s word may be attained, and ought to be aimed at, and what may be reasonably expected of those who aspire to be the public instructors of others. They ought not to be contented with knowing the word of God through the help of a translation, when they have opportunities of becoming acquainted with the original. They ought not to be satisfied with understanding the few fundamental principles of Scriptural truth, but are bound to acquire as thorough and accurate a knowledge as they can of the whole volume which God’s Spirit inspired.

They should not be contented, as men too often are, with a mere familiarity with the sense of the words, with some vague and indefinite inkling of the meaning of a scriptural statement, but are bound to employ all such means as may be necessary for understanding fully and establishing firmly the exact meaning of God’s declarations, and to bring as much of meditation and reflection to bear upon them as may produce clear and definite conceptions of their import.

It is of indispensable importance that ministers of the gospel have their hearts saturated with the general spirit and substance of God’s word, with the leading views which are there unfolded, but it is necessary also that they have so full and accurate a knowledge of the exact meaning of the particular statements of Scripture, as to be able to open them up and expound them to others, to bring out clearly and intelligently the grounds in the correct interpretation of God’s word on which their own convictions rest, and to defend them if needful against the assaults of adversaries.

Ministers of the gospel ought not, in the execution of their function, which consists mainly in opening up and expounding the mind of the Spirit in the word, to be wholly dependent upon translators and commentators, but should be capable of understanding the original inspired writings; and though not all profound scholars and critics themselves, at least able to appreciate and to apply the erudite and critical labours of others.

There is nothing which affords so abundant a supply of interesting, wholesome, and edifying matter for public instruction, as that knowledge which is the result of a thorough familiarity with God’s word, of much meditation and reflection upon the statements of Scripture; and if men will attempt to expound and apply the word of God for the instruction of others, they are bound by the most solemn obligations to take all possible pains, and to use all practicable means, first for satisfying themselves, and then for convincing others, that what they are setting forth from the Scriptures is what God really teaches in that portion of his inspired word which they are considering. It is not enough that the matter set forth be the truth of God, it is also required, to use the language of our Directory for Public Worship, “that it be a truth contained in or grounded on that text, that the hearers may discern how God teacheth it from thence.”

If it be the great duty of the ministers of the gospel to explain and open up the Word of God in its true meaning and real import for the salvation of men, then it is manifest that their theological education should be principally directed to these two objects — first, that they acquire that information, form these habits, and be impressed with these general views and principles, which may constrain them ever after to devote their principal attention to the study of God’s Word, and may afford them the best assistance in attaining most speedily and most certainly to a correct knowledge of the meaning of its statements; and second, that they become intelligently and accurately acquainted on scriptural grounds with those fundamental doctrines of revelation which ought to pervade all their efforts to instruct their fellow-men, as bearing most directly and immediately upon the salvation of sinners, and which, when distinctly perceived, and firmly held, and faithfully applied, will preserve them from radical or fundamental error in the interpretation of any portion of Scripture.</p></blockquote>

<blockquote><p>All things in Scripture are not alike plain in themselves, nor alike clear unto all; yet those things which are necessary to be known, believed and observed for salvation, are so clearly propounded and opened in some place of Scripture or other, that not only the learned, but the unlearned, in a due use of ordinary means, may attain to a sufficient understanding of them.</p></blockquote>

<blockquote><p>We must not confound inspiration and providence – either by reducing the inspiration by which the Scriptures were given to the level of providential guidance of the writers, or by raising the providence by which they have been preserved to the level of inspiration. The Confession intends the distinction to be taken at its full value: one was an immediate and the other a mediate activity of God. And the product correspond to the difference: one produced the plenarily inspired Bible, every word of which is the Word of God; the other produced the safe transmission of that Word, but not without signs of human fallibility here and there in the several copies.

We thus have brought before us by the Confession, in turn, the original autograph of Scripture, produced by the immediate inspiration of God; the preservation of this autographic text in a multitude of copies whose production is presided over by God’s singular care and providence; and the ordinary Bibles in the hands of the people, each of which conveys divine truth to the reader with competent adequacy for all the needs of the Christian life.

And the Presbyterian doctrine of the Bible, therefore, embraces these three points: (1) the plenary inspiration of the Bible as God gave it, by which it is made the Word of God, trustworthy in every one of its affirmations; (2) the safe preservation of the Bible as God gave it, so as to be accessible to men, in the use of the ordinary means of securing a trustworthy text; and (3) the adequate transmission of the saving truth in every and any honest translation, so that the Word of God is accessible to all at all times for all ordinary purposes. The hearty acceptance of all three of these propositions is necessary, if we would range ourselves alongside of the Westminster Confession.</p></blockquote>

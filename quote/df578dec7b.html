<main class="wrap"><figure class="quote" id="q-df578dec7b" data-kw="">
<blockquote><p>In 1626, Thomas Gataker (who was later a member of the Westminster Assembly) preached a thanksgiving sermon in remembrance of England’s deliverance from the Spanish Armada in 1588. He wrote the following in the preface to the published edition of the sermon:

BE pleased (good Reader) to understand in few words the occasion whereupon this Sermon was preached, and thou wilt judge it to be a kind of necessity to make that public to the common view, which was first intended for the ear only of a private Auditory. There is, we see, too great and general a want (in these our days) of monuments and memorials of that miraculous deliverance which God wrought for this Land in [15]88.

When Tongue and Pen, Pulpit and Presse are silent for that, we may expect the stones to cry out against us, and to celebrate that praise to God whereof we are neglective. But man’s memory being a table book to register acts passed, and not able to comprehend all that is to be recorded therein, when new things of note come to be imprinted in it, the old are wip’t out: so God affording us a daily supply of new preservations, those other which we have formerly received grow quite out of date, are razed out, and buried in oblivion. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An anniversary memorial of England’s delivery from the Spanish invasion delivered in a sermon on Psal. 48. 7,8. By Thomas Gataker B. of D. and pastor of Rotherhith</cite>, (London: Philemon Stephens and Christopher Meredith, 1626), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>[2 Corinthians 1] Vers. 24. Not for that we have dominion over your Faith, but are helpers of your joy: for by Faith ye stand.

Hence arises another Objection: Therefore thou makest thy self Lord of our Faith, as if thou couldest punish when thou wouldst. He answers by denying any Mastery, affirming the power of his Ministry, and that to be employed to the benefit of the Church, that timely Censures, according to the Will of Christ, being used, those that repented might at length rejoice: He gives an account why he denied any dominion over their Faith, because Faith is the bond of conjunction with Christ, by which Faith we stand fast in the Grace of God, in right and title unto Christ, in the possession of things present, and in hopes of future good things: Therefore Faith admits no Lord, besides God; it admits of men only as Ministers, and helpers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 73.</span></figcaption>

<blockquote><p>The gross impiety of which they had been accused was now well refuted; and yet they seem not to have been in every respect free from blame, because the Law forbids the erection of any kind of statues. It is easy, however, to excuse this by saying, that no kind of statues are condemned except those which are intended to represent God. To erect a heap of stones as a trophy, or in testimony of a miracle, or a memorial of some signal favor of God, the Law has nowhere prohibited. (Exodus 20:4; Leviticus 26:1; Deuteronomy 5:8) Otherwise, Joshua and many holy judges and kings after him, would have defiled themselves by profane innovation. But the only thing displeasing to God was to see the minds of men drawn hither and thither, so as to worship him in a gross and earthly manner. The children of Reuben, Gad, and Manasseh do all that is required for their exculpation, when they declare that they would use the altar only as a bond of brotherly union; and add a sufficient reason…</p></blockquote>

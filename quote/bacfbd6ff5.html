<blockquote><p>But believers sin greatly after they are in a justified state, and so stand in need of renewed pardon, from time to time. That believers sin after they are in a justified state, sad experience, as well as God’s Word, does daily show; but the sins of those who are in a justified state come under another consideration, for their “persons are not under the law,” (or legal covenant) Rom. 6:14. They are in Christ, who is “the end of the law for righteousness, to every one that believeth,” Rom. 10:4. So that as believers have nothing to do with the law, so as to seek justification for their persons, by their obedience to the same; neither can the law, with its condemning power, reach them, so as to bring them into legal condemnation again: so that unless the covenant of grace be made void, the believer’s justified state remains, and he is no more under the law forever. … But if the saints are not under the law, or legal covenant, then it should seem from thence that they need no pardon of sin, and so ought not in their daily prayers to pray for the same: so where there is no law there is no transgression. Though believers are not under the law, or legal covenant, yet it does not from thence follow that they stand in no need of daily pardon. Indeed, they stand not in need of such pardon as unbelievers stand in need of, they are under a legal condemnation, obnoxious to the curse, and stand in need of a change of their state, God being to them a God of terror. But if at any time they are, through grace, brought savingly to believe in Christ, then God, as a God of all grace, freely justifies them, by remitting of their sins, and imputing of Christ’s righteousness for their justification, and properly this is Scripture justification, Rom. 4:6, 8. But believers standing in relation to God, as children to a tender-hearted Father, this alters the case quite, and shows a vast difference between the state of the one and of the other, the believer being “justified from all things,” Acts 13:39, and the unbeliever being “condemned already,” John 3:18. Now though God deal as a Judge with those that continue in their unbelief, yet He deals as a tender-hearted Father with all true believers. “Like as a father pitieth his children, so the Lord pitieth them that fear him: yea, he remembereth that we are dust,” Ps. 103:13-14. Now when the saints sin against a loving Father, then does God come forth with his fatherly corrections: “Then will I visit their transgressions with the rod, and their iniquity with stripes,” Ps. 89:32. And sometimes in a very sore manner; “Behold thou art wroth, for we have sinned,” Isa. 64:5. Indeed the sins of the saints shall not make void God’s covenant, therefore the prophet comes in the next words, saying, In those, that is, in thy mercies, is continuance, and we shall be saved; yet they highly provoke a tender-hearted Father by sinning against Him; and as often as the saints sin against their heavenly Father, in this their new covenant relation, so oft they stand in need of fatherly forgiveness. Thus with holy David, who had sinned in the matter of Uriah, yet when brought to confess the same, “Nathan said unto David, The Lord hath put away thy sin, thou shalt not die,” 2 Sam. 12:13; for by God’s law adulterers ought to be put to death, Lev. 20:10. Now God remitting this temporal chastisement to David, is said to pardon, or put away his sin: and the Church cried out, Lam. 3:42, “We have transgressed and rebelled, thou hast not pardoned;” that is, their afflictions were not removed. And in this sense God oft lets sin lie on his otherwise justified children for some time unpardoned, and as often as He is pleased to remit these chastisements, so often He may be said to pardon his children; and as long as the saints sin against their God and Father in their new covenant relation, so long shall we need renewed pardon, which will be whilst we are in this world. And this should keep the saints at the throne of grace, daily begging of pardon, confessing of sin, bewailing of corrupt nature, and entreating a farther discovery of their covenant state. Now in this respect, the saints daily need pardon of sin, and a more full discovery of their new covenant relation with God; so that it is not true in every respect, you see, to say all pardon is at once: but with respect to the justifying of our persons, in a proper sense, justification is but one constant, complete act of grace, admitting of no degrees, nor revocation, but remains firm for ever. But if God correct his justified children for their sins, does it not dishonour the cross of Christ? That God does correct his saints here for their sins, and not only from them, as some would have it, is most plain from the New, as well as from the Old Testament… So that though God does not, as a judge, take vengeance on his justified children for their sins, yet as a loving Father He assuredly corrects them when they go astray. And certainly there can be no good argument drawn from the perfection of Christ’s satisfaction, to exempt believers from fatherly corrections here for their going astray. Nay, holy David looks on God’s corrective dispensations, as his keeping of covenant with him: “I know, O Lord, thy judgments are right (that is, thy corrections) and that them in faithfulness hast afflicted me,” Ps. 119:75.</p></blockquote>

<blockquote><p>Again (in the second place), this fulfilling of the Law, or obedience towards the Law, is indeed righteousness, when it is complete; but in us it is small and impure. (For, although they have received the first-fruits of the Spirit, and the new, yea, the eternal life has begun in them, there still remains a remnant of sin and evil lust, and the Law still finds much of which it must accuse us.) Accordingly, it is not pleasing for its own sake, and is not accepted for its own sake. But although from those things which have been said above it is evident that justification signifies not only the beginning of the renewal, but the reconciliation by which also we afterwards are accepted, nevertheless it can now be seen much more clearly that the inchoate fulfilling of the Law does not justify, because it is accepted only on account of faith.</p></blockquote>

<blockquote><p>18th Objection [by Osiander]: Christ has brought us eternal justice. This applied justice is not eternal: Therefore this is not our justice, but God Himself is our justice. Answer: The Lord is our justice, that is, our Justifier. But that our applied justice is eternal, has been showed before; because the imputation thereof is continued to all eternity. That justice also of the Law which is begun in us in this life, shall be continued, and perfected in the life to come. But that justice which is God Himself is not in us: because so God should be an accident to his creature, and become justice in man. For justice and virtue are things created in us, not the essence of God. Moreover Osiander, who obiects this, does not discern the cause from the effect. As we live not, or are wise by the essence of God (for this is all one, as to say, that we are as wise as God) so also we are not just by the essence of God. Wherefore nothing is more impious than to say that the essential justice of the Creator is the justice of the creatures: for thereof it would follow, that we have the justice of God, yea the very essence of God. The cause must be discerned from the effect, increate iustice from created justice.</p></blockquote>

<blockquote><p>And it is inquired what it is whereon their continuation in this state does on their part depend; or what is required of them that they may be justified unto the end. And this as some say is not faith alone, but also the works of sincere obedience. And none can deny but that they are required of all them that are justified, whilst they continue in a state of justification on this side glory… …that which was the necessity of owning a personal obedience in justified persons, is on all hands absolutely agreed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), p. 198</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law, unless they should fall into such sins as should ipso facto, forfeit their justified estate, and transfer them from the Covenant of Grace, into the Covenant of Works, which we believe that God in his Faithfulness will preserve them from. And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. Still there abides the true nature of sin in every inconformity unto, or transgression of the Law in justified persons, which stands in need of daily actual pardon. For there is no man that lives and sins not, and if we say that we have no sin, we do but deceive our selves. None are more sensible of the guilt of sin, none are more troubled for it, none are more earnest in supplications for the pardon of it, than justified persons. For this is the effect of the sacrifice of Christ applied unto the souls of believers, as the apostle declares, Heb. 10:1-4, 10, 14, that it does take away conscience condemning the sinner for sin with respect unto the curse of the Law; but it does not take away conscience condemning sin in the sinner, which on all considerations of God and themselves, of the Law and the gospel, requires repentance on the part of the sinner, and actual pardon on the part of God. … …Now the first act of God in the imputation of righteousness cannot be repeated. And the actual pardon of sin after justification is an effect and consequent of that imputation of righteousness. If any man sin, there is a propitiation… Wherefore unto this actual pardon there is nothing required but the application of that righteousness which is the cause of it, and this is done by faith only. … What it is that, when a justified person is guilty of sin (as guilty he is more or less every day) and his conscience is pressed with a sense thereof, as that only thing which can endanger or intercept his justified estate, his favor with God, and title unto glory, he betakes himself unto, or ought so to do, for the continuance of his state, and pardon of his sins, what he pleads unto that purpose, and what is available thereunto…. And is it not of faith alone, which is that grace whereby they apply themselves unto the mercy or grace of God through the mediation of Christ? It is true that faith herein, works and acts itself in and by godly sorrow, repentance, humiliation, self-judging, and abhorrency, fervency in prayer and supplications with an humble waiting for an answer of peace from God, with engagements unto renewed obedience. But it is faith alone that makes applications unto grace in the blood of Christ for the continuation of our justified estate… The Scripture expressly does declare this to be the only way of the continuation of our justification, 1 Jn. 2:1-2, ‘These things write I unto you that you sin not. And if any man sin we have an advocate with the Father, Jesus Christ the Righteous; and he is the propitiation for our sins.’ It is required of those that are justified that they sin not; it is their duty not to sin; but yet it is not so required of them as that if in anything they fail of their duty they should immediately lose the privilege of their justification. Wherefore on a supposition of sin, if any man sin, (as there is no man that lives and sins not) what way is prescribed for such persons to take, what are they to apply themselves unto, that their sin may be pardoned, and their acceptance with God continued; that is, for the continuation of their justification? The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that He has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, He is the object of our faith in our absolute justification, and so He is as unto the continuation of it. So our whole progress in our justified estate in all the degrees of it is ascribed unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), ch. 5, pp. 202-3</span></figcaption>

— John Owen, The Doctrine of Justification by Faith… (London: Boulter, 1677), ch. 5, pp. 202-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+in+the+first+justification+of+believing+sinners%2C+all+future+sins+are+remitted+as+unto+any+actual+obligation+unto+the+curse+of+the+Law%2C+unless+they+should+fall+into+such+sins+as+should+ipso+facto%2C+forfeit+their+justified+estate%2C+and+transfer+them+from+the+Covenant+of+Grace%2C+into+the+Covenant+of+Works%2C+which+we+believe+that+God+in+his+Faithfulness+will+preserve+them+from.+And+although+sin+cannot+be+actually+pardoned+before+it+be+actually+committed%2C+yet+may+the+obligation+unto+the+curse+of+the+Law+be+virtually+taken+away+from+such+sins+in+justified+persons+as+are+consistent+with+a+justified+estate%2C+or+the+terms+of+the+Covenant+of+Grace%2C+antecedently+unto+their+actual+commission.+God+at+once+in+this+sense+forgives+all+their+iniquities%2C+and+heals+all+their+diseases%2C+redeems+their+life+from+destruction%2C+and+crowns+them+with+loving+kindness+and+mercies%2C+Ps.+103%3A2-3.+Future+sins+are+not+so+pardoned+as+that+when+they+are+committed+they+should+be+no+sins%2C+which+cannot+be%2C+unless+the+commanding+power+of+the+Law+be+abrogated.+But+their+respect+unto+the+curse+of+the+Law%2C+or+their+power+to+oblige+the+justified+person+thereunto+is+taken+away.+Still+there+abides+the+true+nature+of+sin+in+every+inconformity+unto%2C+or+transgression+of+the+Law+in+justified+persons%2C+which+stands+in+need+of+daily+actual+pardon.+For+there+is+no+man+that+lives+and+sins+not%2C+and+if+we+say+that+we+have+no+sin%2C+we+do+but+deceive+our+selves.+None+are+more+sensible+of+the+guilt+of+sin%2C+none+are+more+troubled+for+it%2C+none+are+more+earnest+in+supplications+for+the+pardon+of+it%2C+than+justified+persons.+For+this+is+the+effect+of+the+sacrifice+of+Christ+applied+unto+the+souls+of+believers%2C+as+the+apostle+declares%2C+Heb.+10%3A1-4%2C+10%2C+14%2C+that+it+does+take+away+conscience+condemning+the+sinner+for+sin+with+respect+unto+the+curse+of+the+Law%3B+but+it+does+not+take+away+conscience+condemning+sin+in+the+sinner%2C+which+on+all+considerations+of+God+and+themselves%2C+of+the+Law+and+the+gospel%2C+requires+repentance+on+the+part+of+the+sinner%2C+and+actual+pardon+on+the+part+of+God.+%E2%80%A6+%E2%80%A6Now+the+first+act+of+God+in+the+imputation+of+righteousness+cannot+be+repeated.+And+the+actual+pardon+of+sin+after+justification+is+an+effect+and+consequent+of+that+imputation+of+righteousness.+If+any+man+sin%2C+there+is+a+propitiation%E2%80%A6+Wherefore+unto+this+actual+pardon+there+is+nothing+required+but+the+application+of+that+righteousness+which+is+the+cause+of+it%2C+and+this+is+done+by+faith+only.+%E2%80%A6+What+it+is+that%2C+when+a+justified+person+is+guilty+of+sin+%28as+guilty+he+is+more+or+less+every+day%29+and+his+conscience+is+pressed+with+a+sense+thereof%2C+as+that+only+thing+which+can+endanger+or+intercept+his+justified+estate%2C+his+favor+with+God%2C+and+title+unto+glory%2C+he+betakes+himself+unto%2C+or+ought+so+to+do%2C+for+the+continuance+of+his+state%2C+and+pardon+of+his+sins%2C+what+he+pleads+unto+that+purpose%2C+and+what+is+available+thereunto%E2%80%A6.+And+is+it+not+of+faith+alone%2C+which+is+that+grace+whereby+they+apply+themselves+unto+the+mercy+or+grace+of+God+through+the+mediation+of+Christ%3F+It+is+true+that+faith+herein%2C+works+and+acts+itself+in+and+by+godly+sorrow%2C+repentance%2C+humiliation%2C+self-judging%2C+and+abhorrency%2C+fervency+in+prayer+and+supplications+with+an+humble+waiting+for+an+answer+of+peace+from+God%2C+with+engagements+unto+renewed+obedience.+But+it+is+faith+alone+that+makes+applications+unto+grace+in+the+blood+of+Christ+for+the+continuation+of+our+justified+estate%E2%80%A6+The+Scripture+expressly+does+declare+this+to+be+the+only+way+of+the+continuation+of+our+justification%2C+1+Jn.+2%3A1-2%2C+%E2%80%98These+things+write+I+unto+you+that+you+sin+not.+And+if+any+man+sin+we+have+an+advocate+with+the+Father%2C+Jesus+Christ+the+Righteous%3B+and+he+is+the+propitiation+for+our+sins.%E2%80%99+It+is+required+of+those+that+are+justified+that+they+sin+not%3B+it+is+their+duty+not+to+sin%3B+but+yet+it+is+not+so+required+of+them+as+that+if+in+anything+they+fail+of+their+duty+they+should+immediately+lose+the+privilege+of+their+justification.+Wherefore+on+a+supposition+of+sin%2C+if+any+man+sin%2C+%28as+there+is+no+man+that+lives+and+sins+not%29+what+way+is+prescribed+for+such+persons+to+take%2C+what+are+they+to+apply+themselves+unto%2C+that+their+sin+may+be+pardoned%2C+and+their+acceptance+with+God+continued%3B+that+is%2C+for+the+continuation+of+their+justification%3F+The+course+in+this+case+directed+unto+by+the+apostle+is+none+other+but+the+application+of+our+souls+by+faith+unto+the+Lord+Christ%2C+as+our+advocate+with+the+Father%2C+on+the+account+of+the+propitiation+that+He+has+made+for+our+sins.+Under+the+consideration+of+this+double+act+of+his+sacerdotal+office%2C+his+oblation+and+intercession%2C+He+is+the+object+of+our+faith+in+our+absolute+justification%2C+and+so+He+is+as+unto+the+continuation+of+it.+So+our+whole+progress+in+our+justified+estate+in+all+the+degrees+of+it+is+ascribed+unto+faith+alone.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Doctrine+of+Justification+by+Faith%E2%80%A6+%28London%3A+Boulter%2C+1677%29%2C+ch.+5%2C+pp.+202-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36bbe3490e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36bbe3490e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=Hence%20in%20the%20first%20justification%20of,it%20is%20ascribed%20unto%20faith%20alone&amp;text=Hence%20in%20the%20first%20justification%20of%20believing%20sinners&amp;text=degrees%20of%20it%20is%20ascribed%20unto%20faith%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

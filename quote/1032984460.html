<main class="wrap"><figure class="quote" id="q-1032984460" data-kw="">
<blockquote><p>…in case a society of Christians should want [lack] the fruits of the vine of all sorts, I cannot think but it might be supplied by some composure as like unto it as could be made: and if any church labored under that invincible necessity, were it not safer for them to [yet] interpret that as a call and warrant to communicate [in the Supper], though wanting [lacking] the fruit of the wine, than to construct it [as] an authorizing them in a perpetual neglect of that sacrament?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, … (Edinburgh: W. Gray, 1770), bk. 2, Title 4, section 3, p. 98 Steuart in this work is summarizing the practice of the 1500’s and 1600’s, reformed Church of Scotland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>I respond: The Papists make ordination a sacrament, and this the material of it, the laying on of hands (see Cornelius a Lapide, Commentary in location). This opinion has been refuted, see their antagonists. The Lutherans however reckon it according to the indifferent rites (see Eckhardt in location cited); however they are seen to discover something in it mystical and necessary however often they knowingly touch upon our indifferent things on this rite. We, however varied in locations and possibly in however many churches this right is used, yet adjudge it to be merely indifferent. See Piscator, Daneus and other commentators in 1 Timothy and Acts 6 &amp; 13; and Alting in the Exegesis of the Augsburg Confession, p. 90. This right was commonly used in synagogues, schools and the polity of the Jews, from where it is seen the apostles took it, which is the opinion of Calvin in his Commentary on Acts 6 &amp; 13, and Institutes, bk. 4, ch. 3, section 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 1, p. 460 “Problems on rites follow, certainly not all, but only some select ones in particular that the Scripture has mentioned. Those remaining are nearly innumerable which occur in the books of the Old and New Testament or ecclesiastical writings, whether ancient, medieval, modern or recent…” | 4th Problem, ‘What is to be decided about the laying on of hands in ordination or the constituting of ministers (on which see 1 Tim. 4 &amp; 5)?’, pp. 461-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, … (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?”

— George Gillespie, English Popish Ceremonies (1637), pt. 2, ch. 9, pp. 46-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+That+the+ordinance+of+superiors+cannot+make+the+ceremonies+%5Bwhich+were+claimed+to+be+indifferent%2C+to+be%5D+necessary%2C+I+have+proven+in+the+first+part+of+this+Dispute.+This+is+given+for+one+of+the+chief+marks+of+the+man+of+sin+%5Bin+1+Tim.+4%3A1-5%5D%2C+%E2%80%98That+which+is+indifferent%2C+he+by+his+laws+and+prohibitions+maketh+to+be+sin%3B%E2%80%99+%28Morney%2C+Mister.+of+Iniq.%2C+in+the+Conclusion%29+and+shall+they+who+profess+to+take+part+with+Christ+against+Antichrist+%5Bsuch+as+the+prelates%5D+do+no+less+than+this%3F+It+will+be+replyed+that+the+ceremonies+are+not+thought+necessary+in+themselves%2C+nor+non-conformity+unlawful+in+itself%2C+but+only+in+respect+of+the+Church%E2%80%99s+ordinance.+Just+so+the+Papists+profess+that+the+omission+of+their+rites+and+observances+is+not+a+sin+in+itself%2C+but+only+in+respect+of+contemning+the+Church%E2%80%99s+customs+and+commandments.+How+comes+it+then+that+they+%5Bthe+prelates%5D+are+not+ashamed+to+pretend+such+a+necessity+for+the+stumbling+blocks+of+those+offending+ceremonies+among+us%2C+as+Papists+pretend+for+the+like+among+them%3F%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+2%2C+ch.+9%2C+pp.+46-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf71ee8906.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf71ee8906.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=3.%20That%20the%20ordinance%20of%20superiors,pretend%20for%20the%20like%20among%20them&amp;text=3.%20That%20the%20ordinance%20of%20superiors%20cannot%20make&amp;text=as%20Papists%20pretend%20for%20the%20like%20among%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6841728b32" data-kw="">
<blockquote><p>…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.</p></blockquote>

ncies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f3c0a9712c" data-kw="">
<blockquote><p>It is not enough that a doctrine be erroneous, or that it be dangerous in its tendency; if it be not subversive of one or more of the constituent elements of the Reformed faith, it is not incompatible with the honest adoption of our Confession. It cannot be denied that ever since the Reformation, more or less diversity in the statement and explanation of the doctrines of Calvinism has prevailed in the Reformed Churches. It is equally notorious that for fifty or sixty years such diversities have existed and been tolerated in our own church; nay, that they still exist, and are avowed by Old-school men. If a man holds that all mankind, since the fall of Adam, and in consequence of his sin, are born in a state of condemnation and sin, whether he accounts for that fact on the ground of immediate or mediate imputation, or on the realistic theory, he was regarded as within the integrity of the system. In like manner, if he admitted the sinner’s inability, it was not considered as a proper ground of discipline that he regarded that inability as moral, instead of natural as well as moral… We do not say that the diversities above referred to are unimportant. We regard many of them as of great importance. All we say is, that they have existed, and been tolerated in the purest Calvinistic churches, our own among the rest.</p></blockquote>

<blockquote><p>§IX. As for what regards the definition of free will; the scholastics, at least the later ones, both the Thomists and the Scotists; also the Greeks, Lutherans, and Remonstrants, and not a few of the Reformed, define free will as the power or faculty by which, with all things requisite for acting being posited, the will can act or not act, this or that, and act otherwise. Some of the Reformed, however, define free will by rational preference, by which man does what he pleases, with a preceding judgment of reason. [e.g. Turretin] But many other of the Reformed—Francis Junius, Gerhard Johann Voss, Davenant, Johann and Louis Crocius, Louis le Blanc, William Ames, Robert Baron, Johann Strangius, Richard Baxter, D. Elias Grebenitz, D. Phil. Buchius, Dn. D. Samuel Strimesius, Pierre Jurieu—out of love for truth, antiquity and ecclesiastical peace, have preferred to retain that old and accustomed definition of free will; because it, in itself, and viewed without the abuse of the Pelagians and Semi-Pelagians, contains nothing evil or inconvenient. Following their moderation, we (with the principle always being saved, from whence free will receives or has its powers, and the mode of operation of divine grace) define free will thus: Free will is the active faculty of the will, by which the will, with all things requisite for acting being posited, can act or not act, this or that, and act otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707) 25 pp. Latin, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>§XIII. The special subject, as to man, is either of denomination or the subject which, and this is the whole man; or of inhesion or the subject by which, and this, the remote and mediate, is the soul of man; the proximate and immediate is formally the will; but the intellect, according to Thomas, is so radically; according to Scotus, better, antecedently: because with Scotus and Henricus Gandavensis as authorities, the name of root signifies a true cause, but the intellect is not the true cause of the liberty of the will; but only the antecedent and the condition without which there would not be liberty in the will. … §XVIII. The object of free will is τὰ πρακτὰ, agibilia (doable things), proposed and shown to the will by the intellect. For the will is not borne toward the unknown: nor is anything willed, unless it is first known. Whence that trite saying: Of the unknown there is no desire. Therefore the intellect is not indeed properly the root of liberty, since root signifies a true cause, but causality cannot be attributed to the intellect with respect to liberty; but it is the antecedent and the condition without which the will would not choose freely; whence the will is called the rational appetite, since on the contrary the appetite in brutes is not free, because it is not rational. Nor yet is it always necessary for desiring an object that the intellect should practically judge that the proposed object is to be chosen, but sometimes a simple apprehension of the object as good suffices; which has its place before all others in the movements of the will which they call the very first, and which happen without deliberation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§XIII. The special subject, as to man, is either of denomination or the subject which, and this is the whole man; or of inhesion or the subject by which, and this, the remote and mediate, is the soul of man; the proximate and immediate is formally the will; but the intellect, according to Thomas, is so radically; according to Scotus, better, antecedently: because with Scotus and Henricus Gandavensis as authorities, the name of root signifies a true cause, but the intellect is not the true cause of the liberty of the will; but only the antecedent and the condition without which there would not be liberty in the will. … §XVIII. The object of free will is τὰ πρακτὰ, agibilia (doable things), proposed and shown to the will by the intellect. For the will is not borne toward the unknown: nor is anything willed, unless it is first known. Whence that trite saying: Of the unknown there is no desire. Therefore the intellect is not indeed properly the root of liberty, since root signifies a true cause, but causality cannot be attributed to the intellect with respect to liberty; but it is the antecedent and the condition without which the will would not choose freely; whence the will is called the rational appetite, since on the contrary the appetite in brutes is not free, because it is not rational. Nor yet is it always necessary for desiring an object that the intellect should practically judge that the proposed object is to be chosen, but sometimes a simple apprehension of the object as good suffices; which has its place before all others in the movements of the will which they call the very first, and which happen without deliberation.”

— Barthold Holtzfus, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 8, 11 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7XIII.+The+special+subject%2C+as+to+man%2C+is+either+of+denomination+or+the+subject+which%2C+and+this+is+the+whole+man%3B+or+of+inhesion+or+the+subject+by+which%2C+and+this%2C+the+remote+and+mediate%2C+is+the+soul+of+man%3B+the+proximate+and+immediate+is+formally+the+will%3B+but+the+intellect%2C+according+to+Thomas%2C+is+so+radically%3B+according+to+Scotus%2C+better%2C+antecedently%3A+because+with+Scotus+and+Henricus+Gandavensis+as+authorities%2C+the+name+of+root+signifies+a+true+cause%2C+but+the+intellect+is+not+the+true+cause+of+the+liberty+of+the+will%3B+but+only+the+antecedent+and+the+condition+without+which+there+would+not+be+liberty+in+the+will.+%E2%80%A6+%C2%A7XVIII.+The+object+of+free+will+is+%CF%84%E1%BD%B0+%CF%80%CF%81%CE%B1%CE%BA%CF%84%E1%BD%B0%2C+agibilia+%28doable+things%29%2C+proposed+and+shown+to+the+will+by+the+intellect.+For+the+will+is+not+borne+toward+the+unknown%3A+nor+is+anything+willed%2C+unless+it+is+first+known.+Whence+that+trite+saying%3A+Of+the+unknown+there+is+no+desire.+Therefore+the+intellect+is+not+indeed+properly+the+root+of+liberty%2C+since+root+signifies+a+true+cause%2C+but+causality+cannot+be+attributed+to+the+intellect+with+respect+to+liberty%3B+but+it+is+the+antecedent+and+the+condition+without+which+the+will+would+not+choose+freely%3B+whence+the+will+is+called+the+rational+appetite%2C+since+on+the+contrary+the+appetite+in+brutes+is+not+free%2C+because+it+is+not+rational.+Nor+yet+is+it+always+necessary+for+desiring+an+object+that+the+intellect+should+practically+judge+that+the+proposed+object+is+to+be+chosen%2C+but+sometimes+a+simple+apprehension+of+the+object+as+good+suffices%3B+which+has+its+place+before+all+others+in+the+movements+of+the+will+which+they+call+the+very+first%2C+and+which+happen+without+deliberati

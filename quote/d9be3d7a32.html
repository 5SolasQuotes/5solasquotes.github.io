<main class="wrap"><figure class="quote" id="q-d9be3d7a32" data-kw="">
<blockquote><p>I. What is Creation, the second special work of God (as you affirmed) that we are to inform ourselves of out of the Scriptures? B. It is a most powerful work of God the Father, the Son, and the Holy Ghost, by which in the beginning, in the space of six days, by his Word only, out of nothing, He made the heavens and the earth, with all things in them visible and invisible; to the praise of his infinite power, wisdom and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-broughton.html">John Broughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God &amp; Man, or a Treatise Catechistical, wherein the saving knowledge of God and man is plainly and briefly declared</cite>, … (London, 1623), pp. 31-32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3fa18d27c5" data-kw="">
<blockquote><p>The first [way] argues that the existence, even for an instant, of composites of act and potency presupposes the simultaneous existence of that which is pure act; the second argues that the existence, even for an instant, of composites of essence and existence presupposes the simultaneous existence of that which is being or existence itself; the third argues that the existence, even for an instant, of composites of form and matter presupposes the simultaneous existence of an absolutely necessary being; the fourth argues that the existence, even for an instant, of things which are many and come in degrees of perfection presupposes the simultaneous existence of something one and absolutely perfect; and the fifth argues that the existence, even for an instant, of finality or directedness toward an end presupposes the simultaneous existence of a supreme ordering intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 5, ‘Existential Inertia &amp; the Five Ways’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-e899841436" data-kw="">
<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

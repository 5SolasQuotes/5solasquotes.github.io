<blockquote><p>IRONIA: ironic, taunting speeches may lawfully be used, as occasion serves. (1) God himself used them in Genesis 3:22. “The man is become as one of us” – as one of the Trinity, whereby God declares his great disdain of their affectation of an impossible preeminence in being like to God, which is to say: “By his sin he is become most unlike to us. See how well Satan hath performed his promise to man, is not he become like one of us? And hath not he gained a goodly measure of knowledge, both of good and evil?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ literarum, The Schools Guarded… (1655), Rhetorica Sacra, or a Synopsis of the most material Tropes and Figures contained in the Sacred Scriptures</cite>, pp. 167-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60c11e0a20" data-kw="">
<blockquote><p>This other thing also is to be ranked among the chief evils of our time, viz., that the Churches are so divided, that human fellowship is scarcely now in any repute amongst us, far less that Christian intercourse which all make a profession of, but few sincerely practice. If men of learning conduct themselves with more reserve than is seemly, the very heaviest blame attaches to the leaders themselves, who, either engrossed in their own sinful pursuits, are indifferent to the safety and entire piety of the Church, or who, individually satisfied with their own private peace, have no regard for others. Thus it is that the members of the Church being severed, the body lies bleeding. So much does this concern me, that, could I be of any service, I would not grudge to cross even ten seas, if need were, on account of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Thomas Cranmer, April 1552</cite></span></figcaption>

</figure><figure class="quote" id="q-6dbb8b038c" data-kw="">
<blockquote><p>Tota ratio Schismatis, the very essence of a schism consists in the separating from the Church, I say, from the true and orthodoxal Church. It is a renting or dissolving of that unity which ought to be amongst Christians; See Mr. [Stephen] Marshall’s Sermon on Rom. 12:4-5. It was a memorable speech of Calvin, who said he would willingly travel all over the seas and countries in the world to put an end to the differences that were in the Reformed Churches. [John] Cameron well distinguishes of a double schism: 1. Negative, which is a bare secession or subduction, and is unlawful. Non separatio sed causa facit Schismaticum [Not the separation but the cause that makes the schismatic]. Cassander. 2. Positive, when there is a certain consociation, which uses ecclesiastical laws, the Word of God and administration of the sacraments separatim [in a separated way], which he calls setting up an altar against an altar; this is called schism Antonomastic [Greek], and [Greek], says he [in] De Ecclesia. Different forms of Churches and Church-government in one state must needs lay a foundation of strife and division therein. It is no wisdom (says Mr. [John] Dury in a letter [about congregationalists]) in a state, to reject an approved way of government, which all the best reformed Churches have received all this while, and acknowledged to be God’s way, and by experience found to be safe, sound; and instead of it to take up another, which it is not yet known what it is, nor was ever tried but in two or at the most three churches, and that for the space of a few years. The slighter the cause of separation, the greater the fault of schism; when men hold the same Faith and orthodox truths, yet separate for lesser matters. The true saints in the 7 Churches of the Revelation were never bid go out of them though they were very corrupt, as they were out of Babylon, Mr. [Richard] Vines. The first separatist in the Scripture (says one) was Cain, Gen. 4:16. Enforcements to love are clear, 1 Cor. 13:1. That question of Separation in Scripture is dark. See Mr. [George] Gillespie, Miscellaneous Questions, ch. 10 and 15, and Mr. [Thomas] Manton on James 3. 17. Schisma est secessio in religionis negotio vel temeraria vel injusta, Cameron, De Ecclesia. Schism is a causeless separation from external communion with any true Church of Christ: Mr. [John] Ball, Against Separation, ch. 8. Schism is a breach of the unity of the Church. Dr. Field, bk. 3, Of the Church, ch. 5. We do not leave communion of true Churches for corruptions and sins, but only abstain from the practice of evil in our own persons, and witness against it in others, still holding communion with the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London: A.M., 1654), bk. 4, ch. 22, ‘Schism’</cite>, pp. 376-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-aec7d9aee3" data-kw="">
<blockquote><p>18. They separate themselves from the true Churches of Christ. The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another? This schism grows into a heresy, as a serpent grows to be a dragon. This tolerated, will ruin families, tearing them all to pieces, while the husband goes to one Church, the wife to another, the son to a third, the daughter to a fourth, and the servant to an ale-house instead of a Church. This opens a gap to abundance of profaneness, when there shall be no cohabitation, but the Church members shall be scattered up and down, some twenty, some thirty, some sixty, some one hundred miles off; who shall have the inspection, teaching and guidance of these? Master [Jeremiah] Burroughs’s argument (Irenicum, ch. 23) for gathering of churches (in my judgment) is very dilute and weak; ’tis this: Because our divines hold it lawful to gather churches out of the Church of Rome: therefore ’tis lawful to gather churches out of the Church of England, q.d. because ’tis lawful to separate from a whore, therefore, we ought to separate from an honest woman also. What more ungodly sacrilege, or manstealing can there be, than to purloin from godly ministers the firstborn of their fervent prayers, and faithful preaching, the leaven of their flocks, the encouragement of their souls, the crown of their labors, and their epistle to Heaven? If men will needs gather churches out of the world (as they phrase it) let them first plow the world, and sow it, and reap it with their own hands, and then the Lord give them a liberal harvest. He is a very hard man that will reap where he has not sown, and gather where he has not strewed, Mt. 24:25. We have no precedent in the whole Book of God to gather up one church out of the cream and quintessence of many churches, as a reverend divine of ours has well observed. (Mr. [Thomas] Blake, On the Covenant, ch. 42 [p. 288]. in ••ne. V. The [Westminster] Assembly’s Answer to the Dissenting Brethren, p. 61 at the end [p. 22 in the link])</p></blockquote>

he has not sown, and gather where he has not strewed, Mt. 24:25. We have no precedent in the whole Book of God to gather up one church out of the cream and quintessence of many churches, as a reverend divine of ours has well observed. (Mr. [Thomas] Blake, On the Covenant, ch. 42 [p. 288]. in ••ne. V. The [Westminster] Assembly’s Answer to the Dissenting Brethren, p. 61 at the end [p. 22 in the link])”

<blockquote><p>XXVIII… Gathering new churches by way of separation from others, or gathering assemblies without the consent of the lawful pastors who had the charge of the people of those assemblies, is a sin and schism in all these cases following: 1. In general, when the laws, practices or persons of the church which they separate from give them no sufficient cause of a departure. 2. In general, when in the judgment of true reason, according to the notable evidence of the case, the said assemblies are likely to do more hurt than good. 3. When such assemblies are gathered in opposition to some truth which the separaters would thereby disown (e.g. infant-baptism, the lawfulness of [some] set-forms of praise or prayer, or any sound doctrine) or [they are gathered] for the profession and propagation of some heresy or error (as Antinomianism, Popery, etc.). 4. When such churches are gathered by men that have no true fitness and calling for the sacred ministry or the work which they undertake. 5. When they are gathered by the pride of the ministers that would thereby unduly set up themselves and draw away disciples after them, or by their covetousness, seeking not the good of the flock, but the fleece, not them, but theirs, not serving the Lord Jesus, but their own bellies: or when gathered, by the pride of the people that unjustly think those that they separate from [are] men unworthy of their communion, and say to them, ‘Come not near to us; we are holier than you,’ Isa. 65:5. 6. When they are gathered by a quarrelsome passion, falling out with the pastors and people whom they separate from. The parting of Paul and Barnabas [Acts 15:36-40] had some evil in it. 7. When they are gathered to encourage and strengthen a sinful faction or party, or when men separate from others for fear of being censured by such a party, as Peter did withdraw from the gentile Christians lest he should displease the erroneous Jews, Gal. 2. 8. When it is done out of a proud overvaluing of men’s own opinions, or some odd singularity whereby men cannot bear those that are not of their mind, or whereby they would fain be more conspicuous as more orthodox and wise than others. 9. When it is done mistakingly to set up some wrong course of Church government or worship (as that the people may have the power of the keys or of examining and judging all admitted members, or that Papal government or the mass may be introduced, [or for] enthusiastical disorderly talking by pretended inspiration, by ignorant uncalled men, or to introduce such traditions and superstitions as the Papists use, etc.). 10. When it is done upon a false conceit that a man’s presence with any Church that has known error or faults in doctrines or worship is guilty [of] approving them; and therefore that they must separate from all such. 11. When they separate out of an unruliness of spirit, because they will not be governed by their lawful pastors in lawful things, as time, place, order, etc. or because a minor part in elections is over-voted by the major part and cannot have their wills. 12. When they separate out of a profaneness of mind, not enduring the power of the preacher’s doctrine or the holiness and discipline of the Church, but would be licentious, while they would be called religious. All these are unlawful separations and assemblings. 13. Yet that which is unlawful as to the principle, end and manner secundum quid [‘according to that’], is not always unlawful simply and in the thing itself, for a proud, covetous, turbulent person may sinfully do a lawful thing. XXIX… When pastors by concord or magistrates by laws have settled lawful circumstances or accidents of Church order or worship, or discipline, though they be in particular but human institutions, it is sinful disobedience to violate them without necessary reason, e.g. parochial order, associations, times, places, ministers, maintenance, Scripture-translations, etc. XXX… When able, faithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.</p></blockquote>

<blockquote><p>14. God has by nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances or accidents of this universal religion which are not themselves meet for an universal and unchangeable obligation, but [for] local, temporary and mutable [circumstances and obligations]: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin. I have often named many particulars, as: The translation of the Scripture, which to choose: the version of the Psalms in rhyme or meter, the common use of new made hymns,¹ the dividing the Scripture into chapter and verse, the words of sermons, their method, the particular text to be chosen, what chapters to read, at what hour to begin, how long to preach, in what words to pray, whether the same oft or changed, whether forestudied or not, whether written or unwritten, whether studied and written by ourselves or by others, where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? ¹ [Elsewhere Baxter speaks of, “the choice of psalms and hymns: the use of David’s are lawful and so are others: but no institution ties us to one, but leaves us to choose.” Schism Detected in Both Extremes (1684), pt. 2, pp. 5-6. This is plainly false: Ex. 15:20-21; 2 Sam. 23:1; 1 Chron. 25:1-7; 2 Chron. 29:25-30; Neh. 12:45-46; Ps. 95:2; etc. See ‘Singing of Psalms’.] Whether we be bareheaded or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit or be prostrate at prayer, etc. What distinctive garments pastors shall use, by what signs of consent and obligation men vow and swear, whether by putting the hand under the thigh [Gen. 24:2, 9; 47:29], lifting it up [Gen. 14:22; Dt. 32:40], subscribing, laying it on the Book,² kissing the Book,³ etc. What catechisms to use, with many more such. ² [See ‘On Laying One’s Hand on the Bible to Swear’.] ³ [See ‘On Trembling at the Word, Weeping before the Bible, Kissing the Stake, etc.’] God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc. 15. These [things] may be called ‘worship’ in a sense subservient to God’s ordinances of worship¹ (as we worship men by putting off the hat, kneeling, bowing [Mt. 18:26; Lk. 14:10; Rev. 3:9], etc.). But if any will not call it ‘worship’, they must [then] not call it ‘false worship’, nor pretend that the controversy is any more than about the bare name. ¹ [For an explanation of this, see pp. 73-84 of Travis Fentiman, 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022).] 16. They that feign such things as these to be sinful additions and an invading of Christ’s office and denying his faithfulness, etc. condemn the Scripture that commands such determinations, and contradict the Law of Nature and the practice of all Churches on earth, and would exterminate all God’s worship, which cannot be performed without some such determinations.</p></blockquote>

</figure><figure class="quote" id="q-bde6155957" data-kw="">
<blockquote><p>And to the angel of the church in Pergamos write… I know thy works, and where thou dwellest, even where Satan’s seat is: and thou holdest fast my name, and hast not denied my faith, even in those days wherein Antipas was my faithful martyr, who was slain among you, where Satan dwelleth. But I have a few things against thee, because thou hast there them that hold the doctrine of Balaam, who taught Balac to cast a stumblingblock before the children of Israel, to eat things sacrificed unto idols, and to commit fornication. So hast thou also them that hold the doctrine of the Nicolaitanes, which thing I hate. Repent; or else I will come unto thee quickly, and will fight against them with the sword of my mouth.</p></blockquote>

</figure><figure class="quote" id="q-c2d3663182" data-kw="">
<blockquote><p>I now come to that which you yourself also acknowledge, that all human inventions are not at once to be condemned. For it was clearly a human invention that we communicate [in the Lord’s Supper] in the morning, rather than after dinner: and it was a human invention that the prices of things that were sold in the primitive Church were laid at the apostles’ feet… I pass over that they who defend these things will be able to put forward some honest and just meaning not alien from the Scripture… But, if by this there is given occasion of error to the weak, let them be advised to regard these things as indifferent; let them be taught by sermons, not to judge the worship of God as placed in these things… Neither do I think that tyranny is instantly brought in if any indifferent thing be appointed to be done in the Church and be constantly performed by many. At this day we so administer the Eucharist in the morning time, that after dinner we will not have the communion in the sacred assembly [In the New Testament the Eucharist was always administered in the evening]. But who will say, that this, which we all do with the like will and consent is tyrannical? To myself truly, as I have now often mentioned, it would be more agreeable that we should only do what Christ did and delivered to his apostles. But, if any indifferent things have been added, I would not now sharply strive on this account; especially when we see that they by whom the light of the Gospel has been greatly promoted in England, and can be yet more promoted, oppose themselves to us. I acknowledge indeed with you that ‘whatsoever is not of faith is sin.’ (Rom. 14:23). But what the apostle wrote to Titus seems, above all things, to promote our having a quiet conscience in our actions: ‘Unto the pure all things are pure;” and to Timothy, “Every creature of God is good.” But it is not necessarily required that we should show express mention in holy Scripture of the particular things which we use: this is enough to know by faith, on the whole— that indifferent things cannot defile those who live with a pure and sincere mind and conscience… but I yet thought that the use of these differences was not in itself or its own nature ungodly or of fatal consequence, provided other things which are prescribed to us by the Word of God remain sound.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gorham, Gleanings of a few scattered ears during the period of the Reformation in England (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550</cite>, pp. 189-90, 92, 94-96</span></figcaption>

<blockquote><p>While the Eastern Orthodox view of theosis is neither apotheosis nor pantheistic, a perichoretic emphasis can amount to the same conclusion. Language of perichoresis should be avoided when speaking of humanity’s present or future glorification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/taylor-wright.html">Taylor Wright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Glorification: Perichoresis or Participation’</cite>, (2019) 19 pp. This is a seminary paper for Reformed Theological Seminary. The bibliography has 43 sources, many of which are reformed., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2dd84b7c30" data-kw="">
<blockquote><p>XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

</figure><figure class="quote" id="q-a37eaaa63b" data-kw="">
<blockquote><p>The persons of the Trinity, as co-eternal, are temporally inseparable; similarly, as metaphysically necessary they are metaphysically inseparable. By contrast, the statue and clay are clearly separable: one can exist without the other. The clay is typically made before a statue… As a result, three persons of the Trinity are more strongly united than the statue and the clay, and hence mutual parthood is not sufficient to account for this unity. This is something of a drawback for the model, as perichoresis is typically intended to function as a means of uniting the persons of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-j-cotnoir.html">A.J. Cotnoir</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Mutual Indwelling’</cite>, (n.d.) 34 pp. | Cotnoir also illustrates a way in which the statue and clay analogy does not do adequate justice to perichoresis (p. 24):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

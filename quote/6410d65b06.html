<main class="wrap"><figure class="quote" id="q-6410d65b06" data-kw="">
<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6b796f8cf5" data-kw="">
<blockquote><p>That which we most love we worship as our God; for love is an act of soul-worship.… This is undoubtedly true, if we intend hereby that love which is superlative and transcendent; for to be loved above all things is an act of honour, worship, which the Lord challenges as his due in peculiar, Deut. 6:5.… Other things may be loved, but he will be loved above all other things.… He looks upon us as not worshipping him at all, not taking him for a God, when we love other things more, or as much as himself, 1 John 2:15.… Those that love their riches, the things of the world, more than, or equally with, God, they make these their gods.… Love, whenever it is inordinate, it is an idolatrous affection.… That which we most trust we make our god; for confidence and dependence is an act of worship which the Lord calls for as due only to himself.… Trust in the creature is always idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (love and trust as soul worship)</span></figcaption>

</figure><figure class="quote" id="q-cb6006cb72" data-kw="">
<blockquote><p>If, therefore, the Christian Churches had had images from the very first times, if they had paid them the same cult and the same veneration that now obtains in the Roman rite, there is no doubt that the most bitter and implacable enemies of our discipline, the Jews, would have seized upon this, and would have accused it as some unspeakable impiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Books on Images</cite>, p. 41</span></figcaption>

</figure><figure class="quote" id="q-8a64591cf5" data-kw="">
<blockquote><p>Third, their idolatry exceeds the idolatry of the heathen, in that they worship a breaden god, or Christ in and under the forms of bread and wine. And if Christ according to His humanity be absent from the earth, as I have proved, the popish host is as abominable an idol as ever was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, pp. 197–198</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a> › <a href="../topics/the-lords-supper/the-mass/adoration-of-the-host.html">Adoration of the host</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/transubstantiation.html">Transubstantiation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Third, their idolatry exceeds the idolatry of the heathen, in that they worship a breaden god, or Christ in and under the forms of bread and wine. And if Christ according to His humanity be absent from the earth, as I have proved, the popish host is as abominable an idol as ever was.”

— William Perkins, A Reformed Catholic, pp. 197–198">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThird%2C+their+idolatry+exceeds+the+idolatry+of+the+heathen%2C+in+that+they+worship+a+breaden+god%2C+or+Christ+in+and+under+the+forms+of+bread+and+wine.+And+if+Christ+according+to+His+humanity+be+absent+from+the+earth%2C+as+I+have+proved%2C+the+popish+host+is+as+abominable+an+idol+as+ever+was.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+pp.+197%E2%80%93198&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a64591cf5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a64591cf5.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" rel="noopener" target="_blank">Read it online · Internet Archive (1597 ed.)</a></div>
</figure><figure class="quote" id="q-20d92c6b49" data-kw="">
<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

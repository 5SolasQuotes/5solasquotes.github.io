<main class="wrap"><figure class="quote" id="q-e4ad6cd69a" data-kw="">
<blockquote><p>Here there is a superiority without tyranny, for no Minister hath a Papal or Monarchical Jurisdiction over his own flock, far less over other Pastors, and over all the Congregations or a large Diocese. Here there is a parity without confusion and disorder, for the Pastors are in order before the Elders, and the Elders before the Deacons; the Church is subordinate to the Presbytery, the Presbytery, to the Synod, and the Synod to the National assembly. One Pastor also hath priority before another, for age, for zeal, for gifts, for his good deservings of the Church, each one honouring him whom God hath honoured, and as he beareth the image of God, which was to be seen amongst the Apostles themselves.

But none hath power or jurisdiction above others: even as in nature one eye hath not power over another, only the head hath power over all, even as Christ over his Church. The same may be seen in the Common-wealth, and in some of the offices of the Roman Church it self. And lastly, here there is a subjection without slavery, for the people are subject to the Pastors and Assemblies, yet there is no Assembly wherein every particular Church hath not interest and power; nor is there any thing done, but they are, if not actually, yet virtually called to consent unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The government and order of the Church of Scotland</cite>, (Edinburgh, 1641), pp 64-65.</span></figcaption>

</figure><figure class="quote" id="q-71c0dc2498" data-kw="">
<blockquote><p>In 1834 one of the Belfast newspapers contained the following announcement of the opening of a new covenanting meeting-house in the town. The newspaper was Anglican and politically conservative in outlook, yet it recognised the liberality of the Covenanters:

The new Meeting-house of the Second Congregation of the Reformed Presbyterians, commonly called Covenanters, lately erected in South College-street, in this town, is to be opened for public worship, on Sunday next, at two o’clock afternoon. The congregation, although small, have very spiritedly contributed nearly one-half the cost of the building of this plain, but very neat place of worship. It is not, we believe generally known that the Covenanters support their own poor, and they also very liberally contribute to works of general benevolence. They receive no aid from Government to assist in paying their Clergymen. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guardian-and-constitutional-advocate.html">Guardian and Constitutional Advocate</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 22 Aug. 1834</span></figcaption>

</figure><figure class="quote" id="q-04aae92d6a" data-kw="">
<blockquote><p>There will be no one found among men that is free from every vice; but it is one thing to be blemished with ordinary vices, which do not hurt the reputation, because they are found in men of the highest excellence, and another thing to have a disgraceful name, or to be stained with any baseness. In order, therefore, that a bishop may not be without authority, he enjoins that there shall be made a selection of one who has a good and honorable reputation, and not chargeable with any remarkable vice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Timothy</cite>, ch. 3, verse 2, “A bishop, therefore, must be blameless.”</span></figcaption>

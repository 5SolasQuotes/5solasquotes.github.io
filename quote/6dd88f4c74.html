<blockquote><p>7th Conclusion. When the representative Church is universally apostatical, then may the prince use the help of the Church-essential of found believers, for a reformation; and if they also be apostatic (which cannot be, except the Lord utterly have removed his candlestick) we see not what he can do but hear witness against them, but if there be any secret seeker of God in whose persons the essence of a true Church is conserved. The king by a royal power, and the law of charity is obliged to reform the land, as the godly kings with a blessed success have hitherto done, Asa, Josiah, Jehoshaphat, in which case the power of reformation and of performing many acts, of due belonging to the Church officers, are warrantably performed by the king, as in a diseased body, in an extraordinary manner power recurs from the members to the politic head and Christian prince, who both, as a King, in an authoritative way is obliged to do more then ordinary, and as a Christian member of the Church, in a charitative and common way, is to care for the whole body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 419</span></figcaption>

</figure><figure class="quote" id="q-e46c98e15d" data-kw="">
<blockquote><p>Can there be any more willing to help us than Christ? whose whole head was sick, and whose heart was heavy for our sakes? yea, in whose body, from the sole of the foot to the crown of the head, was nothing but wounds and swellings, and sores? but alas this was nothing to that He suffered for our sakes. He was compassed about with fears and horrors, till his sweat was drops of blood, and his bones bruised in the flesh: he was whipped, and scourged, and chastised with sorrows, till He cried out in the bitterness of his soul: ‘O Lord, if it be possible let this cup pass from Me.’ The heavy hand of God was so grievous upon Him, that it bruised his very bones and rent his reigns asunder: he could find no health in his flesh, but was wounded, yea, wounded to the death, even the most bitter death upon the cross. His tender fingers were nailed to the cross, his face was wrinkled with weeping and wailing, his sides embrued and gored with his own blood. spurting and gushing fresh from his ribs, the shadow of death was upon his eyes. O what grief could be like to this, or what condemnation could be so heavy, since there was no wickedness in his hands? since He was the brightness of his father’s glory, and the son of righteousness that shined in the world: as to see his days at an end, to see such throbing, sighs, and careful thoughts (without cause of his) so deeply engraven in the tables of his breast. But was this all? No my brethren, since his excellency was such above all creatures, that the world was not worthy to give Him breath, it was a greater grief unto Him, to see Himself made a worm and not a man, a shame of men, and contempt of the people; to see his life shut up in shame and reproaches, how could it but shake his bones out of joint, and make his heart melt in midst of his bowels: who was ever so full of woe? and whoever been brought so low into the dust of death? upon whom did the malice of Satan ever get so great a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sinful Man’s Search’</cite>, (London, 1592) on Job, 8:5-7</span></figcaption>

<blockquote><p>Neither in this case ought the authority of certain worthy and most learned men to move us, who seem too indiscreetly for to deny that this care appertains unto the Magistrate, whose office (say they) it is not to rid men from diseases, but only to maintain the safety and peace of our life and goods. For it may even out of their own words be proved sufficiently, that albeit the magistrate ought not to cure the diseases of every several man, or preserve them from such as do not openly ravage, nor have common causes (for this is the proper duty of the physicians), yet when as they hold it to be belonging to their charge, by their service and authority to perform, that their subjects may live commodiously: who sees not that this commodiousness does also appertain unto the health of the body? Which thing he that believes not, the same has never seen how miserably all the duties of men are cumbered, the order of the churches, the exercises of godliness, the instruction of youth, the traffic of citizens, whereupon must needs ensue a most grievous destruction of particular persons, when the plague troubles a city or country. Wherefore, I appeal unto thyself, whosoever thou art that art of this opinion, that thou thinkest not it to be the duty of the Magistrate to preserve the commonwealth from diseases (and especially common diseases) do not such sicknesses seem unto thee to be numbered amongst other incommodities? And can men live together commodiously when as these diseases do rage? Doubtless this canst thou not affirm if ever thou hast had experience before what the plague is, or what it may work, where it once has prevailed? Why then, say I, doest thou think it a thing not appertaining unto the duty of the magistrate, to deliver men from such diseases, that is with public care to defend? I pray thee, hast thou not seen that which is usual in all well ordered commonwealths, how diligently in cities the Magistrate provides and stores up such things as serve for the use of war? How carefully he prepares weapons? How busily he retains garrisons set in a readiness? Especially when he is in fear of some hurt to ensue? and to what end? but that men should live commodiously. Wherefore are horses kept; ships built; walls repaired, trenches dug, towers set up and banks cast: but that the citizens should live more commodiously in safety against the invasions or assaults of the enemies? Dogs are maintained for the like cause, nets are pitched, hunters are hired and troops of country people draw together if at any time wolves or such like beasts do trouble a country. I remember in the kingdom of France that certain leopards, which the king uses to keep, did break out of ward, and in every place slew the countrymen. The whole country was mustered and neither cost nor labor spared until they had rid the land from that fear. How much more justly then in this calamity and misery also ought there some provident course to be taken whereby this so mighty an enemy and cruel beast may be kept away from our throats, which in a very short time is wont to ravage very far, and as it were a canker, eat up every thing that is next [to] it? To the end that the clean in the Old Testament should not keep company with the unclean lepers, by the authority of the Magistrate, there was made a separation, neither were they received among the other people before that they were by the priests appointed to this office, judged cleansed after they were viewed naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 1, ch. 1, p. 4-5. von Ewich was a reformed German reformer, physician and city health official.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Neither in this case ought the authority of certain worthy and most learned men to move us, who seem too indiscreetly for to deny that this care appertains unto the Magistrate, whose office (say they) it is not to rid men from diseases, but only to maintain the safety and peace of our life and goods. For it may even out of their own words be proved sufficiently, that albeit the magistrate ought not to cure the diseases of every several man, or preserve them from such as do not openly ravage, nor have common causes (for this is the proper duty of the physicians), yet when as they hold it to be belonging to their charge, by their service and authority to perform, that their subjects may live commodiously: who sees not that this commodiousness does also appertain unto the health of the body? Which thing he that believes not, the same has never seen how miserably all the duties of men are cumbered, the order of the churches, the exercises of godliness, the instruction of youth, the traffic of citizens, whereupon must needs ensue a most grievous destruction of particular persons, when the plague troubles a city or country. Wherefore, I appeal unto thyself, whosoever thou art that art of this opinion, that thou thinkest not it to be the duty of the Magistrate to preserve the commonwealth from diseases (and especially common diseases) do not such sicknesses seem unto thee to be numbered amongst other incommodities? And can men live together commodiously when as these diseases do rage? Doubtless this canst thou not affirm if ever thou hast had experience before what the plague is, or what it may work, where it once has prevailed? Why then, say I, doest thou think it a thing not appertaining unto the duty of the magistrate, to deliver men from such diseases, that is with public care to defend? I pray thee, hast thou not seen that which is usual in all well ordered commonwealths, how diligently in cities the Magistrate provides and stores up such things as serve for the use of war? How carefully he prepares weapons? How busily he retains garrisons set in a readiness? Especially when he is in fear of some hurt to ensue? and to what end? but that men should live commodiously. Wherefore are horses kept; ships built; walls repaired, trenches dug, towers set up and banks cast: but that the citizens should live more commodiously in safety against the invasions or assaults of the enemies? Dogs are maintained for the like cause, nets are pitched, hunters are hired and troops of country people draw together if at any time wolves or such like beasts do trouble a country. I remember in the kingdom of France that certain leopards, which the king uses to keep, did break out of ward, and in every place slew the countrymen. The whole country was mustered and neither cost nor labor spared until they had rid the land from that fear. How much more justly then in this calamity and misery also ought there some provident course to be taken whereby this so mighty an enemy and cruel beast may be kept away from our throats, which in a very short time is wont to ravage very far, and as it were a canker, eat up every thing that is next [to] it? To the end that the clean in the Old Testament should not keep company with the unclean lepers, by the authority of the Magistrate, there was made a separation, neither were they received among the other people before that they were by the priests appointed to this office, judged cleansed after they were viewed naked.”

— Johann von Ewich, The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books (London, 1583), bk. 1, ch. 1, p. 4-5. von Ewich was a reformed German reformer, physician and city health official.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+in+this+case+ought+the+authority+of+certain+worthy+and+most+learned+men+to+move+us%2C+who+seem+too+indiscreetly+for+to+deny+that+this+care+appertains+unto+the+Magistrate%2C+whose+office+%28say+they%29+it+is+not+to+rid+men+from+diseases%2C+but+only+to+maintain+the+safety+and+peace+of+our+life+and+goods.+For+it+may+even+out+of+their+own+words+be+proved+sufficiently%2C+that+albeit+the+magistrate+ought+not+to+cure+the+diseases+of+every+several+man%2C+or+preserve+them+from+such+as+do+not+openly+ravage%2C+nor+have+common+causes+%28for+this+is+the+proper+duty+of+the+physicians%29%2C+yet+when+as+they+hold+it+to+be+belonging+to+their+charge%2C+by+their+service+and+authority+to+perform%2C+that+their+subjects+may+live+commodiously%3A+who+sees+not+that+this+commodiousness+does+also+appertain+unto+the+health+of+the+body%3F+Which+thing+he+that+believes+not%2C+the+same+has+never+seen+how+miserably+all+the+duties+of+men+are+cumbered%2C+the+order+of+the+churches%2C+the+exercises+of+godliness%2C+the+instruction+of+youth%2C+the+traffic+of+citizens%2C+whereupon+must+needs+ensue+a+most+grievous+destruction+of+particular+persons%2C+when+the+plague+troubles+a+city+or+country.+Wherefore%2C+I+appeal+unto+thyself%2C+whosoever+thou+art+that+art+of+this+opinion%2C+that+thou+thinkest+not+it+to+be+the+duty+of+the+Magistrate+to+preserve+the+commonwealth+from+diseases+%28and+especially+common+diseases%29+do+not+such+sicknesses+seem+unto+thee+to+be+numbered+amongst+other+incommodities%3F+And+can+men+live+together+commodiously+when+as+these+diseases+do+rage%3F+Doubtless+this+canst+thou+not+affirm+if+ever+thou+hast+had+experience+before+what+the+plague+is%2C+or+what+it+may+work%2C+where+it+once+has+prevailed%3F+Why+then%2C+say+I%2C+doest+thou+think+it+a+thing+not+appertaining+unto+the+duty+of+the+magistrate%2C+to+deliver+men+from+such+diseases%2C+that+is+with+public+care+to+defend%3F+I+pray+thee%2C+hast+thou+not+seen+that+which+is+usual+in+all+well+ordered+commonwealths%2C+how+diligently+in+cities+the+Magistrate+provides+and+stores+up+such+things+as+serve+for+the+use+of+war%3F+How+carefully+he+prepares+weapons%3F+How+busily+he+retains+garrisons+set+in+a+readiness%3F+Especially+when+he+is+in+fear+of+some+hurt+to+ensue%3F+and+to+what+end%3F+but+that+men+should+live+commodiously.+Wherefore+are+horses+kept%3B+ships+built%3B+walls+repaired%2C+trenches+dug%2C+towers+set+up+and+banks+cast%3A+but+that+the+citizens+should+live+more+commodiously+in+safety+against+the+invasions+or+assaults+of+the+enemies%3F+Dogs+are+maintained+for+the+like+cause%2C+nets+are+pitched%2C+hunters+are+hired+and+troops+of+country+people+draw+together+if+at+any+time+wolves+or+such+like+beasts+do+trouble+a+country.+I+remember+in+the+kingdom+of+France+that+certain+leopards%2C+which+the+king+uses+to+keep%2C+did+break+out+of+ward%2C+and+in+every+place+slew+the+countrymen.+The+whole+country+was+mustered+and+neither+cost+nor+labor+spared+until+they+had+rid+the+land+from+that+fear.+How+much+more+justly+then+in+this+calamity+and+misery+also+ought+there+some+provident+course+to+be+taken+whereby+this+so+mighty+an+enemy+and+cruel+beast+may+be+kept+away+from+our+throats%2C+which+in+a+very+short+time+is+wont+to+ravage+very+far%2C+and+as+it+were+a+canker%2C+eat+up+every+thing+that+is+next+%5Bto%5D+it%3F+To+the+end+that+the+clean+in+the+Old+Testament+should+not+keep+company+with+the+unclean+lepers%2C+by+the+authority+of+the+Magistrate%2C+there+was+made+a+separation%2C+neither+were+they+received+among+the+other+people+before+that+they+were+by+the+priests+appointed+to+this+office%2C+judged+cleansed+after+they+were+viewed+naked.%E2%80%9D%0A%0A%E2%80%94+Johann+von+Ewich%2C+The+Duty+of+a+Faithful+and+Wise+Magistrate+in+Preserving+and+Delivering+of+the+Commonwealth+from+Infection+in+the+Time+of+the+Plague+or+Pestilence%2C+Two+Books+%28London%2C+1583%29%2C+bk.+1%2C+ch.+1%2C+p.+4-5.+von+Ewich+was+a+reformed+German+reformer%2C+physician+and+city+health+official.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F305c9484c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/305c9484c3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=Neither%20in%20this%20case%20ought%20the,cleansed%20after%20they%20were%20viewed%20naked&amp;text=Neither%20in%20this%20case%20ought%20the%20authority%20of&amp;text=office%2C%20judged%20cleansed%20after%20they%20were%20viewed%20naked" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If it be said, That it seems sufficient for the Magistrate to maintain civil peace, and to restrain civil disturbances [in exclusion to restraining spiritual seducers]: We may look to these considerations in answer to this: …

3. Is it possible to separate growth in delusions and variety of absurd errors, and civil faction and discord? or, in experience have they ever been separated? We see they made men carnal in Corinth, they made them bite and devour one another in Galatia, as, ch. 5 of that epistle to them; yea, provoked to debates, envying, wraths, strifes, back-bitings, whisperings, swellings, tumults, 2 Cor. 12:20, and can such things be with the entertaining of civil peace? For, does not the interruption of civil peace flow from hatred, bitterness, alienation of mind, envy contradictions, and such like? And do not these necessarily wait on debates, and diversities of opinions? For, it is not to be supposed that such differences, proceeding from want of light, can be in men that are altogether mortified and without corruption: Therefore, may it be expected that that corruption will flame out upon such occasions; and that order is observable which the apostle has, 2 Cor. 12, just now cited, where he begins with debates, and proceeds by diverse steps, till it close with tumults: and these who are acquainted with the histories of older and latter times, will acknowledge this to be a truth.

4. There is almost but very little in the foregoing particulars mentioned, but what is necessary for the preserving and restoring of civil peace, or the preventing or censuring of the disturbance thereof, seeing there can be no solid ground whereupon to maintain peace, except the springs of debates and tumults be stopped, and such distempers from which they spring, be either cured and purged away, or restrained. … Or, in the last place, it may be considered, if ever it has done good to the State, wherein it was permitted, or to the magistrates who did permit the same; or, if thereby secret jealousies, heart-burnings, divisions and factions have not been fostered and brought up to such height as has proven dangerous to the body, and has hazarded the eating out of the belly, where it was bred, or the stinging of the bosom that did give it heat.</p></blockquote>

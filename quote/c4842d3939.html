<blockquote><p>Q. 37. Why is mention here made of all within our gates?

A. To show that this commandment is not only directed to private persons, but to magistrates, and masters of families as such, who, though they cannot compel men to believe, they may restrain them from violating the rest of the sabbath, and compel them to such external worship of God as all men are immediately obliged to; even all within the gates of their cities or houses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 131.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-81d4dc5743" data-kw="">
<blockquote><p>When we say it’s a rule, it must be extended to that end for which it is a rule; for as the Scripture is not a rule to Physicians or Mathematicians in their proper arts, so neither doth it particularly tend to this, or that individual action for all essentials it is a rule, and a general rule for circumstantials.

Nor doth this detract from the perfection of the Scripture, that it doth not command every circumstance because then a thing is imperfect, when it wants some perfection that is due to it: It is not an imperfection in the body, that it’s not every where, because this is not requisite to the body, so neither is it to be expected from the Scripture, that all circumstantials must be by name commanded; It’s true, the Church must take heed that under the name of circumstances she doth not bring in worship, which hath been always the subtilty of Satan. Thus Altar-worship, and Image-worship were made but circumstances in men’s books by distinctions, but in their practise as much as God’s own instituted worship. …

This rule doth extend, first, to matters of faith.

A sound faith is the soul of Religion, its like the Sun in the firmament, like the eye in the body; and commonly ubi male creditur, ibi nec bene vivitur, An ill faith and ill life go together: Hence Hymeneus and Philetus, as they made shipwreck of their faith, so they did also of a good conscience, 1 Tim. 2. 17. There is no building of any confessions of faith, but the materials must be fetched from this mountain. Error and Heresy have no such enemy as the Scripture. …

Secondly, to worship and discipline. An orthodox Church without good discipline and pure worship, is like a field of Come without hedges. What a comely Church should we have, if Scripture Orders were lookt too? In worship, all that is done without God’s Word, is doing we know not what, John 4. 22. You worship you know not what.

And by what ground they receive one voluntary worship, they might receive more. The Pope once resolved that he with his Cardinals should at a set time ride on Asses partly to shew their humility, and partly to imitate Christ’s riding on an Ass to Jerusalem; But the Cardinals refused it as too absurd, yet they might on the same ground have received that as a custom, as all their other rabble of worship.

So for discipline and order, a profane man should be as rare in the Church, as a blazing star, If any one be an Idolater, a reviler, no not to eat with such an one, 1 Cor. v. 11. And again, If any walk disorderly, withdraw from such an one. I know different judgements improve these places to different opinions, but I press that which all agree in; I acknowledge that governours are more to be encouraged in this work, because the ignorance and profaneness of people cannot endure to see a brazen serpent broken down. You worthy Patriots, you have endeavoured to bury Moses his Body, left it should be worshipped and how doth the Devil withstand you?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difficulty of and the encouragements to a reformation a sermon preached before the honourable House of Commons at the public fast, Septem. 27, 1643</cite>, (London: Thomas Underhill, 1643), pp 8-10.</span></figcaption>

</figure><figure class="quote" id="q-d95edf01bb" data-kw="">
<blockquote><p>Three things about the worship of God are to be considered:

1. The kinds of it…

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>

<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4.

3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29.

4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether.

5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>

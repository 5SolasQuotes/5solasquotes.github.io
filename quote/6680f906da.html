<main class="wrap"><figure class="quote" id="q-6680f906da" data-kw="">
<blockquote><p>Again justification or imputation of righteousness is actus continuus [‘a continued act’], which is not to be restrained to the instant of our first conversion and justification, but continued to them that believe. And therefore so long as they have faith, God imputes righteousness unto them.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b1cfb93cb" data-kw="">
<blockquote><p>Secondly, justification does connote a state and established condition of a man, and therefore is not frequently iterated, although it be continued. A man is not justified many times in a day, though sins be pardoned often in a day. It is true, God does continue to justify those that believe in Him, and if He should cease to do so, they would immediately fall into misery and guilt; but yet God does not renew or revive our justification, as if there were an interruption or intermission of it. That justification does denote an estate is plain by comparing it with all the other privileges God vouchsafes his people: regeneration and vocation denote a state the person is put into, so does glorification. As therefore sanctification is one thing, and those auxiliary actings of God’s grace are another thing, so that though we may say such a man has new quickening grace every day, yet we cannot say he has a new regeneration; so it is here: though we may say that every day the believer, begging the pardon of his daily infirmities, has a new pardon, yet he has not a new justification, because this denominates the state of a man. Neither can it be said that pardon of this sin or that sin puts a man into the state of God’s favor absolutely, but quoad hoc [so far as this]; the pardon of this or that sin does not make that universal righteousness of the person whereby he stands acquitted from all. It is true, some learned men call this daily remission of sin justificatio particularis [a particular justification]; but we are now treating of that universal justification whereby the person of a believer stands acquitted and disobliged from the guilt of all his sins he has committed. And great is the comfort of a Christian in that his justification is a state of favor with God; for hence flow many other inestimable benefits and advantages, which the believer is to study out and improve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification… (London: Underhill, 1654), pt. 2, | sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’</cite>, p. 268</span></figcaption>

</figure><figure class="quote" id="q-2160b66eb0" data-kw="">
<blockquote><p>To be justified by faith, which is the first and vital justification, James has interpreted as being called a friend of God, that is, with sins forgiven, to be reconciled with God and to be received by Him into grace and friendship, who before was an enemy of God and a son of wrath. But to be justified by works, he taught is the same as to receive from God, on account of good works, which Abraham and Rahab received from Him, that is, approbation, praise and remuneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans… to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | Let the kind reader, I beseech him, compare this our opinion with that which is extant in the other Colloquy of Ratisbon, where that great light of the Church, Martin Bucer, speaks thus on the passage of James (p. 302):</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-fa0c0168f5" data-kw="">
<blockquote><p>It is asked, moreover, whether or not we seek forgiveness of sins—that is, the first aspect of justification—from God on a daily basis? And if so, how can we say that justification is completed once and for all in this life? I respond that when we pray for the remission of sins, we are not praying for that benefit as if it were not already given to us. Rather, we are praying for the increase of our faith, and for the application of that benefit which is ours through faith and faith’s increase.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is asked, moreover, whether or not we seek forgiveness of sins—that is, the first aspect of justification—from God on a daily basis? And if so, how can we say that justification is completed once and for all in this life? I respond that when we pray for the remission of sins, we are not praying for that benefit as if it were not already given to us. Rather, we are praying for the increase of our faith, and for the application of that benefit which is ours through faith and faith’s increase.”

— Robert Rollock, ‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+asked%2C+moreover%2C+whether+or+not+we+seek+forgiveness+of+sins%E2%80%94that+is%2C+the+first+aspect+of+justification%E2%80%94from+God+on+a+daily+basis%3F+And+if+so%2C+how+can+we+say+that+justification+is+completed+once+and+for+all+in+this+life%3F+I+respond+that+when+we+pray+for+the+remission+of+sins%2C+we+are+not+praying+for+that+benefit+as+if+it+were+not+already+given+to+us.+Rather%2C+we+are+praying+for+the+increase+of+our+faith%2C+and+for+the+application+of+that+benefit+which+is+ours+through+faith+and+faith%E2%80%99s+increase.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+%E2%80%98Treatise+on+Justification%E2%80%99+tr.+Aaron+Denlinger+%26+Noah+Phillips+MAJT+27+%282016%29%2C+1.4.2.+%E2%80%98The+Imputation+of+Righteousness%E2%80%99%2C+pp.+108-9+Rollock+%28c.+1555-1599%29+was+a+Scottish+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa0c0168f5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa0c0168f5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=It%20is%20asked%2C%20moreover%2C%20whether%20or,ours%20through%20faith%20and%20faith%E2%80%99s%20increase&amp;text=It%20is%20asked%2C%20moreover%2C%20whether%20or%20not%20we&amp;text=which%20is%20ours%20through%20faith%20and%20faith%E2%80%99s%20increase" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-5cf2aa299e" data-kw="">
<blockquote><p>I see here two washings, one outward, another inward: the first in these words The laver of regeneration, the next. The renewing of the Holy Spirit. The first, is our Baptism: the next, the inward washing and renewing by the Holy Spirit, represented by this outward Baptism. As the water washeth away the filth from the body so the Holy Spirit purgeth &amp; washeth the heart from sin. I will speak but thus far shortly of Baptism.

The outward washing in Baptism is not to be looked to lightly: the pouring on of the water, is but a base sign to look to: yet it is not a bare sign of the washing of the Holy Spirit: but it is the instrument that God taketh in His hand, &amp; whereby He applieth to us the inward washing of the Holy Spirit, Col. 2. 12. Rom. 6. 4, he ascribeth our regeneration to Baptism. We by Baptism are buried with Christ, risen with Christ, and if this mean be contemned, there shall be no regeneration: if a man lightly [neglect] this Baptism, I affirm, there shall be no renewing inwardly by the Holy Spirit: and if he be not renewed, he shall never be saved: for without regeneration, no salvation.

Ye see (2. Kin. 5. 10) what was enjoined to Naaman the Syrian, when he sought cleansing, the Prophet bade him go to the Jordan, and wash him seven times: But hee thought with himself, What is this? Are not there fair Rivers at home at Damascus? Yea, he would not go till hee took better counsel: but so soon as he went, and washed himself seven times, he was cleansed. Even so it is in Baptism: if a man contemn the outward washing, hee shall never be cleansed by the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 216-17.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17e9449863" data-kw="">
<blockquote><p>XXVI. What is said by some (“Infants are baptized in the faith of their parents”) does not mean that what is in adults is imputed to infants or answers for infants; both because each one lives by his own faith and because if the parents should be hypocrites, their infants would be excluded from salvation. But the faith of parents bears this relation—that they bring their children to be baptized from the faith by which they believe that the gospel promises belong to them and to their children; again, that by it they obtain the grace of God for their children (?Mk. 7:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-99709e246d" data-kw="">
<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are:

1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause.

2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism.

3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Question 2, ‘Whether or no children be received into the visible Church by Baptism’ in The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5, pp. 210-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

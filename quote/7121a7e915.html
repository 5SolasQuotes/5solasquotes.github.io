<main class="wrap"><figure class="quote" id="q-7121a7e915" data-kw="">
<blockquote><p>Kings have no power in spiritual matters, so that they do not receive the key of the heavenly kingdom. Their power is confined to temporal matters, and this too can only come to them from God, as appears from Rom. xiii. I. Nor are they consecrated by the unction of a sacred Order: their anointing is merely a sign that the excellence of their power comes down to them from Christ, and that, under Christ, they reign over the Christian people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Supplement to Summa Theologica</cite>, III, Q. 19, Art. 3, ad. 2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a2942ec6b" data-kw="">
<blockquote><p>1. Regarding young people who have never been married, none, whether sons or daughters, who have a father still living shall have the power to contract a marriage without the permission of their father unless they have attained the legal age, that is twenty years for a son and eighteen for a daughter. And if after reaching the said age they have asked their fathers or had them asked to marry them and their fathers have not attended to it, in that case it shall be lawful for them to marry without their father’s authority. … 7. Where children marry without their father’s or mother’s permission at the age permitted above and it is established by the court that they have done this lawfully because of the negligence or excessive strictness of their fathers, let the fathers be required to grant them a dowry or provide them such a share or position as [they would have given] if they had consented to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marriage-ordinance-of-geneva.html">John Witte Jr. &amp; Robert McCune Kingdon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sex, Marriage &amp; Family in John Calvin’s Geneva</cite>, vol. 1: Courtship, Engagement, &amp; Marriage, pp. 165 &amp; 172 (Marriage Ordinance of Geneva)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-5a2e4d1aaa" data-kw="">
<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-bb89a8e083" data-kw="">
<blockquote><p>Earth’s Rulers must be told that Christ shall cut off the spirit of princes, and that He shall be terrible to the stubborn and rebellious kings of the earth (Ps. lxxvi. 12); they must be taught that Christ shall strike through kings in the day of His wrath (Ps. cx. 5); yea, they must be plainly reminded of that throne of inquity-shaking passage – “For the nation and kingdom that will not serve Thee shall perish; yea, those nations shall be utterly wasted” (Is. lx. 12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the Church, and Terms of Communion: Together with the Terms of Communion of the Reformed Presbyterian Church in Ireland. To which is Appended the Cameronian Dream</cite>, (Belfast, 1879), p. 27.</span></figcaption>

</figure><figure class="quote" id="q-5f89c9779a" data-kw="">
<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 27</span></figcaption>

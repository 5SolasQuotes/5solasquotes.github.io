<main class="wrap"><figure class="quote" id="q-28f4208cc7" data-kw="">
<blockquote><p>§IV. For first, whereas justification before God is but one, wherein the Lord by imputation of Christ’s righteousness to a believing sinner does absolve him from his sins and also accepts of him as righteous in Christ, not only in the first moment of justification, wherein being a sinner in himself he was first constituted righteous in Christ: but also in the continuance of justification, wherein the believer being still a sinner in himself, is continued in the favor of God by the merits and intercession of Christ: and though a sinner in himself, yet believing in Him that justifies a sinner, is made the righteousness of God in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 3, ‘Bellarmine’s answers… refuted’, p. 451</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-11aa9bd530" data-kw="">
<blockquote><p>Indeed the works that follow our justification although they proceed from the Spirit of God who has taken possession of the hearts of those justified, are nevertheless of themselves unclean, because they are performed in a heart that is still impure. For justification has just begun and is not completed. We have received the first fruits of the Spirit (Rom. 8:23) but not yet the ‘titles’.¹ We are still waiting with groaning as Paul says in Rom. 8:23, for the redemption of our body. ¹ In order to understand this and the following assertions, the reader must bear in mind that Melanchthon understands ‘justificatio’ in the Augustinian sense. In a preliminary draft of the Loci called ‘Theologica Institutio’ he describes it not as a new relation to God but as the actual possession of true ‘justitia’ quae et constans esset et ex animo bearet nos.’ Thus ‘justificatio’ and ‘sanctificatio’ fall in fundamentally together. Later this notion gradually receded into the background. cf. Herrlinger: Theologie Melanchthons S. 6 ff….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Loci Communes of Philip Melanchthon</cite>, … 1st ed., ed. and trans. Charles L. Hill (1521; Boston: Meador Publishing, 1944) | Locus 17, On Justification &amp; Faith, pp. 196-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-839cab1031" data-kw="">
<blockquote><p>779. Now besides this justification of the sinner which has its place in the first conversion of the sinner to God and which is renewed so long as he repents (for the faithful life is the continual exercise of faith), he is also given a justification of the just which is by works, which James discusses.

780. By this we understand the declaration of God with respect to the accusation of Satan, since in the regenerated sinner are true, colored, and indubitable signs and proofs of true faith which are pleasing to Him, and which are required among the heirs of the goods of grace.

781. This second justification is necessarily connected with the first (it is necessary to distinguish this from the variation of the Papists) so that it cannot be separated from it for any reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamentals of Sacred Theology Pre</cite>, (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 186 Note Vitringa does not clearly join these two justifications as one, and it is said by the editor in a footnote that he later dropped the language of a “second” justification.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

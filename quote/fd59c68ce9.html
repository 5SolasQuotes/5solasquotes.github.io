<main class="wrap"><figure class="quote" id="q-fd59c68ce9" data-kw="">
<blockquote><p>The question is this, Can men, by the exercise of their natural faculties upon themselves, and upon other objects around them, ascertain and prove the existence of an intelligent First Cause of all things; and if so, what is the amount of the information which in this way may be acquired concerning him?

Now, it has been shewn in innumerable works, and by unanswerable arguments, that men, in the fair exercise of their faculties, looking within upon themselves, and without upon the world around them, are reasonably and necessarily led to believe that there exists an invisible intelligent Being, to whom they themselves, and all other objects of their contemplation, owe their existence; that this great Being must rule and govern everything according to the counsel of his own will; that he is possessed of the highest moral excellence, and ought therefore to be worshipped and obeyed.

This can be proved by processes of argument, which assume nothing except the existence of those objects of which our senses and our consciousness take cognizance, and give us information. The arguments by which all this has been established have been assailed by atheists, pantheists, and sceptics, but their sophisms have been all answered and exposed; and the matter just stands thus, that if truth be discoverable by the human faculties, this is true, and that, even without any abstract deliverance as to the capacity of the human faculties to discover truth, men cannot in point of fact fairly and honestly use their faculties without being led to such conclusions as these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture VIII, p. 105.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6b818d656" data-kw="">
<blockquote><p>Therefore, since I expounded Aristotle’s Ethics, I have added this commentary in which I follow not only Aristotle’s meaning, but also his method. … I, however, who have been engaged in these disputes among the sects for a long time and often at length turning them upside down (anō kai katō strephōn), as Plato enjoins one to do [Gorgias 511a], urgently admonish the young to reject Stoics and Epicureans and embrace the Peripatetic school. For even if Epicureanism and Stoicism are defended zealously and, so to speak, advertised, in order to do so it is necessary to mix in much sophistry, according to the saying by Euripides: ‘The unjust word, sick in itself, needs wise remedies (ho de adikos logos, nosōn en autōi, pharmakōn deitai sophōn)’ [Fragment 354].

Furthermore, false beliefs also harm morals, and the very habit of sophistry is destructive in many ways: it corrupts one’s judgement, lures minds away from the love and study of propriety and simple truth, and accustoms the intellect to loving monstrous beliefs, and to striving to obfuscate rather than to explain things. In Aristotle, however, method governs the disputation and, so to speak, forces it within boundaries, so that it does not stray from demonstrations and the right path. For that reason it elicits true opinions and explains them in order and properly. Therefore Peripatetic philosophy is more useful, because of both the true opinions and the example of method. Aristotle himself said that beliefs that have no usefulness for life or morals should be rejected. Many Stoic ideas are of that kind, namely those on freedom from emotions, on fate and several others. …

Therefore, since in choosing a type of teaching one has to choose what is correct, true, simple, steadfast, well ordered and useful for life, I believe that young minds need to be instructed chiefly with Aristotelian doctrine, which in these qualities surpasses all other sects. Why? Because Aristotle’s Ethics should also be loved, because he alone saw and understood that the virtues are middle states. By that description he instructs us most learnedly that the impulses of the mind must be bent to moderation and held back.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dedicatory Letter to Melanchthon s, Epitome of Moral Philosophy</cite></span></figcaption>

</figure><figure class="quote" id="q-ebb8e21ffd" data-kw="">
<blockquote><p>14. What is the legitimate office of reason in the sphere of religion? 1st. Reason is the primary revelation God has made to man, necessarily presupposed in every subsequent revelation of whatever kind. 2d. Hence Reason, including the moral and emotional nature, and experience, must be the organ by means of which alone all subsequent revelations can be apprehended and received. A revelation addressed to the irrational would be as inconsequent as light to the blind. This is the usus organicus [organic use] of reason. 3d. Hence no subsequent revelation can contradict reason acting legitimately within its own sphere. For then (1) God would contradict Himself, and (2) faith would be impossible. To believe is to assent to a thing as true, but to see that it contradicts reason, is to see that it is not true.</p></blockquote>

<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>

</figure><figure class="quote" id="q-e0313fd875" data-kw="">
<blockquote><p>This discussion about University education leads up to another view of the transition from philosophy to theology. The Scottish Churches have made statutory the transition, formal and express, as a vital part of the training of young men for the ministry. They will have no one licensed to preach who has not previously undergone a theological curriculum of studies in the Halls; and they will allow no one to enter the Hall as a regular student who has not passed through an arts curriculum distinctively philosophical.

There, then, is the transition from philosophy to theology prescribed by law. It is true that in some cases the law may be obeyed only in form. One student may leave the University without anything perceptible of philosophical culture or attainment. Another may leave the Hall with little or nothing of real theological culture or attainment. Thus the transition may not be a reality in this or that case: either because the student has not philosophy to begin with; or because he does not come to have theology to end with; or both. But what we now look to is the ideal in the mind of the churches as represented by their law. And looking to this we see that the transition from philosophy to theology ought in their judgment to have place in the formative process of preparation for the Christian ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Transition from Philosophy to Theology in British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“This discussion about University education leads up to another view of the transition from philosophy to theology. The Scottish Churches have made statutory the transition, formal and express, as a vital part of the training of young men for the ministry. They will have no one licensed to preach who has not previously undergone a theological curriculum of studies in the Halls; and they will allow no one to enter the Hall as a regular student who has not passed through an arts curriculum distinctively philosophical.

There, then, is the transition from philosophy to theology prescribed by law. It is true that in some cases the law may be obeyed only in form. One student may leave the University without anything perceptible of philosophical culture or attainment. Another may leave the Hall with little or nothing of real theological culture or attainment. Thus the transition may not be a reality in this or that case: either because the student has not philosophy to begin with; or because he does not come to have theology to end with; or both. But what we now look to is the ideal in the mind of the churches as represented by their law. And looking to this we see that the transition from philosophy to theology ought in their judgment to have place in the formative process of preparation for the Christian ministry.”

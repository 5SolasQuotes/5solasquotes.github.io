<main class="wrap"><figure class="quote" id="q-536663c18e" data-kw="">
<blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology, ed. Joel Beeke, tr. Todd Rester (Reformation Heritage Books), vol. 5, bk. 7, ch. 1, §35</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e10e4d6844" data-kw="">
<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal… (Edinburgh: Higgins, 1659) | pt. 4</cite>, ch. 21, p. 426</span></figcaption>

</figure><figure class="quote" id="q-f9a52d7cf2" data-kw="">
<blockquote><p>Were we all bound together by a confession or subscription of the true fundamentals, and those other points that are next to fundamentals only, and there took up our Christianity and unity, yielding each other a freedom of differing in smaller or more difficult points, or in expressing ourselves in different terms, and so did live peaceably and lovingly together, notwithstanding such differences, as men that all knew the mysteriousness of Divinity, and the imperfection of their own understandings, and that here we know but in part [1 Cor. 13], and therefore shall most certainly err and differ in part: what a world of mischiefs might this course prevent?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 525-7 of pt. 3, ch. 12, section 10, ‘Lastly, be sure that you study and strive after Unity &amp; Peace…’ in The Saints’ Everlasting Rest… (London, 1650)</cite></span></figcaption>

</figure><figure class="quote" id="q-b878dca577" data-kw="">
<blockquote><p>8. The Church can fail in respect of its faith or its morals. Regarding morals there is no doubt and regarding faith it is certain. The apostles erred in the doctrine of Christ’s resurrection and Christ’s kingdom, which are both articles of faith. 9. It is also possible that the Church errs in its foundation, but it does not err tenaciously or until the end. This is evident in the apostles, who erred in the fundamental doctrine concerning the resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite></span></figcaption>

</figure><figure class="quote" id="q-73841483a0" data-kw="">
<blockquote><p>7. A particular Church of any one denomination may fail in some points of doctrine and manners and yet continue a living member of the true Church, if it fail not in fundamentals, and things simply necessary to salvation… …a Church is not presently to be forsaken by particular members thereof for some foul blemishes, nor many wicked men therein…</p></blockquote>

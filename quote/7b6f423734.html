<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts, in public, solemn prayer by the Prescribed Forms of Others… (London: 1679), ch. 4</cite>, p. 89</span></figcaption>

<blockquote><p>By a ‘ceremony’ I understand an external rite in or about the worship of God. By ‘significant ceremonies’ I understand rites in divine worship signifying some material point of religion. There is no controversy about those outward actions that by nature or general custom signify the reverence of the mind, as kneeling and lifting up our eyes and hands to Heaven in token of devotion to the God of Heaven, and being uncovered in prayer, etc. But the question is of those that signify merely by the force of authoritative institution or private arbitrary intention. Such significant things, though they may have some natural aptitude to signify such and such points of religion, yet they do not actually signify, but [only signify] as arbitrarily designed thereunto. It is generally received that significant ceremonies in taking an oath may lawfully be used, and that not only such as naturally signify, as lifting up the hand towards Heaven, but such also as signify by institution, as laying the hand on a book or kissing the book. Now though the end of an oath may be a civil thing, as the ending of a controversy, yet the formal of it is divine worship. And the aforesaid ceremonies are expressive of the very external part of it, and they actually signify by force of institution. Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words. The Christians heretofore, being among infidels, might lawfully have the figure of the cross somewhere visible about them to show that they were Christians. For the meaning was no more than if they had said, “We are Christians.” But it may be replied this was no act of divine worship, but an indicant or speaking sign towards men. With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution. And if instituted signs of devotion in general be lawful, I see not why signs of some special part of devotion, or mystery in religion, should be unlawful. I am more confident of the warrantableness of rites and ceremonies of worship that are used only instead of so many words pronounced, than of those that are added to words for their more solemn ratification, as seals are to a writing or federal signs to a verbal contract. Nevertheless, the forementioned ceremonies of swearing seem added to the words of the oath for more solemn ratification; and it alters not the case whether the words be read by him that administers or pronounced by him that takes the oath, for either way they are his words that takes the oath. Likewise I have more confidence of the warrantableness of those significant ceremonies that are of private arbitrary intention than of those that are of authoritative institution; also of those that are used occasionally and pro hic et nunc [for here and now], than of those that are used statedly. Furthermore I apprehend that significant ceremonies of divine worship are more apt to degenerate into superstition; and if they be multiplied, that religion is therewith loaded as with unprofitable luggage; and that it is a form of religion rather Mosaic than evangelical, wherein spiritual worship is most regarded. I think also that significant ceremonies are not necessary in genere, as those things are which are left to the determination of human authority, and so not to be instituted and imposed in the ordinary divine service. I apprehend that our Lord Christ has instituted all those stated ordinances of positive worship that are necessary to the Church universal, and therefore that more of the same nature are not to be devised by men. If any significant ceremonies be indeed necessary for some parts of the catholic Church in respect of time and place, there seems to me a fairer plea for their institution in those times and places; but the controverted ceremonies among us seem to be necessary for the whole Church in every age, if at all necessary. Significant ceremonies of the same nature and reason with those perpetual ordinances that Christ has instituted for the universal Church may not be instituted by man, and particularly such as are made symbols of the Covenant of Grace and Christianity. In matters doubted among sober Christians, superiors should take heed of strict imposing, and thereby wresting the consciences of their subjects and overstraining them to a compliance with them, in derogation to God’s authority in their consciences. If superiors command that which is above their sphere to command, namely, things not necessary in genere, yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>

<blockquote><p>Question 6. Whether absolute and unlimited power of royalty be a ray and beam of divine majesty immediately derived from God? Answer. Not at all. Such a creature is not in the world of God’s creation. Royalists and flatterers of kings are parents to this prodigious birth. There is no shadow of power to do ill in God. An absolute power is essentially a power to do without or above law, and a power to do ill, to destroy; and so it cannot come from God as a moral power by institution, though it come from God by a flux of permissive providence; but so things unlawful and sinful come from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644)</cite>, p. 228</span></figcaption>

<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>

<blockquote><p>What politic laws are to be allowed? Those which are agreeable to the law of nature (whereof the Decalogue is an abridgment) and composed for the safety of the people: or those which do not swerve from the eternal rule of the honoring of God and loving our neighbor, and are made by a lawful magistrate. Those that are made after any other manner, they are no better then tyrannical bonds, Isa. 10:1.</p></blockquote>

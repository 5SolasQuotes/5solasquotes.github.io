<main class="wrap"><figure class="quote" id="q-d765e79f38" data-kw="">
<blockquote><p>…but to… sacrifice… at eight of clock in the morning, rather than at ten, in this place physical, rather than this, is no worshipping… but a mere physical circumstance, neither up, nor down to the worship; and time and place-physical are neither worship, nor religious means of worship. 2. Time, and place, name, country, form, figure, habit [dress] or garments, to hold off injuries of sun and heaven as such are never commanded, never forbidden of God, and therefore the change of these circumstances can be no change of a Commandment of God: We never advanced circumstances, as such to the orb and sphere of morals;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 63</span></figcaption>

<blockquote><p>1st Conclusion. To communicate with the Church ordinarily and of set purpose is an act of external Church communion: 1. Because if the preacher in preaching edify the Church convened for that effect to receive edification, and if he convince the infidel by preaching and cause him fall down and worship God, and report that God is in that meeting, then to communicate with the Church in hearing and preaching is an act of external Church communion. Because an act of worship terminated and bounded upon the Church is a Church-act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 269</span></figcaption>

</figure><figure class="quote" id="q-07a400f136" data-kw="">
<blockquote><p>1. Our [Independent] Brethren say [that] it is… another thing to say [as the presbyterians] that it was impossible that they [the Christians in Jerusalem in Acts] could be one congregation and meet in one place… [Rutherford’s] Answer: …now the question then is… whether or no[t] was the Church at Jerusalem of such a competent number, only as that they could meet not only occasionally to hear a sermon, but in an ordinary Church-meeting, to hear the Word and communicate in the breaking of bread and seals of the Covenant; and though the want [lack] of a capacious house be also an extrinsic impediment why they could not meet… but it cannot be said that they wanted a capacious house for the ordinary meeting of a congregation, the ordinary and genuine use whereof is to be edified by the Word and sacraments; and that an ordinary house could contain such a number of thousands and multitudes as can be edified in a congregational way is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 426-27</span></figcaption>

 Books Online</a></div>
</figure><figure class="quote" id="q-14172bfe30" data-kw="">
<blockquote><p>…for you lay down as an undeniable principle, and the basis of your whole doctrine of independent government that there are no visible Churches in the world but a congregation meeting in one place to worship God, which I have demonstrated to be most false… so, though a congregation may only be actually seen when it is convened within the four angles of a material house, yet all the congregations on earth make one visible Church, and have some visible and audible acts of external government common to all, as that all pray, praise, fast, mourn, rejoice, one with another; and are to rebuke, exhort, comfort one another and to censure one another, so far as is possible, and of right and by law meet in one council, and so by Christ’s institution are that way visible, that a single congegation is visible which meets in one house, though many be absent de facto, through sickness, callings, imprisonment and some through sinful neglect;</p></blockquote>

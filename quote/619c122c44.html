<blockquote><p>(2) If they would comply with his admonitions, he was ready to make them good to their souls: Behold, I stand at the door and knock, etc., v. 20. Here observe, [1.] Christ is graciously pleased by his Word and Spirit to come to the door of the heart of sinners; He draws near to them in a way of mercy, ready to make them a kind visit. [2.] He finds this door shut against Him; the heart of man is by nature shut up against Christ by ignorance, unbelief, sinful prejudices. [3.] When He finds the heart shut, He does not immediately withdraw, but He waits to be gracious, even till his head be filled with the dew. [4.] He uses all proper means to awaken sinners, and to cause them to open to Him: He calls by his Word, He knocks by the impulses of his Spirit upon their conscience.</p></blockquote>

upon%20their%20conscience&amp;text=2%29%20If%20they%20would%20comply%20with%20his%20admonitions&amp;text=the%20impulses%20of%20his%20Spirit%20upon%20their%20conscience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-576d817df9" data-kw="">
<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aqua cœlestis, or a Sovereign Cordial extracted from the Sufficiency of Divine Grace &amp; Strength made Perfect in Weakness</cite>, … (London: Sawbridge, 1663), pp. 54-56</span></figcaption>

<blockquote><p>With what different emotions of heart may we suppose Zaccheus received this invitation? Think you not that he was surprised to hear Jesus Christ call him by name, and not only so, but invite Himself to his house? Surely, thinks Zaccheus, I dream: it cannot be; how should He know me? I never saw Him before: besides, I shall undergo much contempt, if I receive Him under my roof. Thus, I say, we may suppose Zaccheus thought within himself. But what says the Scripture? “I will make a willing people in the day of my power.” [Ps. 110:3] With this outward call, there went an efficacious power from God, which sweetly over-ruled his natural will: and therefore, verse 6, “He made haste, and came down, and received him joyfully;” not only into his house, but also into his heart. … And thus it is with all, that, like Zaccheus, receive Jesus Christ by faith into their hearts: the very moment they find rest in Him, they are freely justified from all things from which they could not be justified by the law of Moses; “for by grace are we saved, through faith, and that not of ourselves, it is the gift of God. … You say you have faith; but how do you prove it? Did you ever hear the Lord Jesus call you by name? Were you ever made to obey the call? Did you ever, like Zaccheus, receive Jesus Christ joyfully into your hearts? Are you influenced by the faith you say you have, to stand up and confess the Lord Jesus before men? Were you ever made willing to own, and humble yourselves for, your past offenses? … He came not only to save, but to seek and to save that which was lost. He came to Jericho to seek and save Zaccheus; for otherwise Zaccheus would never have been saved by Him. But from whence came He? Even from Heaven, his dwelling-place, to this lower earth, this vale of tears, to seek and save that which was lost; or all that feel themselves lost, and are willing, like Zaccheus, to receive Him into their hearts to save them; with how great a salvation? … The power of his death and resurrection is as great now as formerly. Make haste therefore, make haste, O ye publicans and sinners, and give the dear Lord Jesus your hearts, your whole hearts. If you refuse to hearken to this call of the Lord, remember your damnation will be just: I am free from the blood of you all… Let all that love the Lord Jesus Christ in sincerity say, Amen.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“With what different emotions of heart may we suppose Zaccheus received this invitation? Think you not that he was surprised to hear Jesus Christ call him by name, and not only so, but invite Himself to his house? Surely, thinks Zaccheus, I dream: it cannot be; how should He know me? I never saw Him before: besides, I shall undergo much contempt, if I receive Him under my roof. Thus, I say, we may suppose Zaccheus thought within himself. But what says the Scripture? “I will make a willing people in the day of my power.” [Ps. 110:3] With this outward call, there went an efficacious power from God, which sweetly over-ruled his natural will: and therefore, verse 6, “He made haste, and came down, and received him joyfully;” not only into his house, but also into his heart. … And thus it is with all, that, like Zaccheus, receive Jesus Christ by faith into their hearts: the very moment they find rest in Him, they are freely justified from all things from which they could not be justified by the law of Moses; “for by grace are we saved, through faith, and that not of ourselves, it is the gift of God. … You say you have faith; but how do you prove it? Did you ever hear the Lord Jesus call you by name? Were you ever made to obey the call? Did you ever, like Zaccheus, receive Jesus Christ joyfully into your hearts? Are you influenced by the faith you say you have, to stand up and confess the Lord Jesus before men? Were you ever made willing to own, and humble yourselves for, your past offenses? … He came not only to save, but to seek and to save that which was lost. He came to Jericho to seek and save Zaccheus; for otherwise Zaccheus would never have been saved by Him. But from whence came He? Even from Heaven, his dwelling-place, to this lower earth, this vale of tears, to seek and save that which was lost; or all that feel themselves lost, and are willing, like Zaccheus, to receive Him into their hearts to save them; with how great a salvation? … The power of his death and resurrection is as great now as formerly. Make haste therefore, make haste, O ye publicans and sinners, and give the dear Lord Jesus your hearts, your whole hearts. If you refuse to hearken to this call of the Lord, remember your damnation will be just: I am free from the blood of you all… Let all that love the Lord Jesus Christ in sincerity say, Amen.”

— George Whitefield, ‘The Conversion of Zacchaeus’ on Lk. 19:9-10 in Sermons on Important Subjects, pp. 401-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWith+what+different+emotions+of+heart+may+we+suppose+Zaccheus+received+this+invitation%3F+Think+you+not+that+he+was+surprised+to+hear+Jesus+Christ+call+him+by+name%2C+and+not+only+so%2C+but+invite+Himself+to+his+house%3F+Surely%2C+thinks+Zaccheus%2C+I+dream%3A+it+cannot+be%3B+how+should+He+know+me%3F+I+never+saw+Him+before%3A+besides%2C+I+shall+undergo+much+contempt%2C+if+I+receive+Him+under+my+roof.+Thus%2C+I+say%2C+we+may+suppose+Zaccheus+thought+within+himself.+But+what+says+the+Scripture%3F+%E2%80%9CI+will+make+a+willing+people+in+the+day+of+my+power.%E2%80%9D+%5BPs.+110%3A3%5D+With+this+outward+call%2C+there+went+an+efficacious+power+from+God%2C+which+sweetly+over-ruled+his+natural+will%3A+and+therefore%2C+verse+6%2C+%E2%80%9CHe+made+haste%2C+and+came+down%2C+and+received+him+joyfully%3B%E2%80%9D+not+only+into+his+house%2C+but+also+into+his+heart.+%E2%80%A6+And+thus+it+is+with+all%2C+that%2C+like+Zaccheus%2C+receive+Jesus+Christ+by+faith+into+their+hearts%3A+the+very+moment+they+find+rest+in+Him%2C+they+are+freely+justified+from+all+things+from+which+they+could+not+be+justified+by+the+law+of+Moses%3B+%E2%80%9Cfor+by+grace+are+we+saved%2C+through+faith%2C+and+that+not+of+ourselves%2C+it+is+the+gift+of+God.+%E2%80%A6+You+say+you+have+faith%3B+but+how+do+you+prove+it%3F+Did+you+ever+hear+the+Lord+Jesus+call+you+by+name%3F+Were+you+ever+made+to+obey+the+call%3F+Did+you+ever%2C+like+Zaccheus%2C+receive+Jesus+Christ+joyfully+into+your+hearts%3F+Are+you+influenced+by+the+faith+you+say+you+have%2C+to+stand+up+and+confess+the+Lord+Jesus+before+men%3F+Were+you+ever+made+willing+to+own%2C+and+humble+yourselves+for%2C+your+past+offenses%3F+%E2%80%A6+He+came+not+only+to+save%2C+but+to+seek+and+to+save+that+which+was+lost.+He+came+to+Jericho+to+seek+and+save+Zaccheus%3B+for+otherwise+Zaccheus+would+never+have+been+saved+by+Him.+But+from+whence+came+He%3F+Even+from+Heaven%2C+his+dwelling-place%2C+to+this+lower+earth%2C+this+vale+of+tears%2C+to+seek+and+save+that+which+was+lost%3B+or+all+that+feel+themselves+lost%2C+and+are+willing%2C+like+Zaccheus%2C+to+receive+Him+into+their+hearts+to+save+them%3B+with+how+great+a+salvation%3F+%E2%80%A6+The+power+of+his+death+and+resurrection+is+as+great+now+as+formerly.+Make+haste+therefore%2C+make+haste%2C+O+ye+publicans+and+sinners%2C+and+give+the+dear+Lord+Jesus+your+hearts%2C+your+whole+hearts.+If+you+refuse+to+hearken+to+this+call+of+the+Lord%2C+remember+your+damnation+will+be+just%3A+I+am+free+from+the+blood+of+you+all%E2%80%A6+Let+all+that+love+the+Lord+Jesus+Christ+in+sincerity+say%2C+Amen.%E2%80%9D%0A%0A%E2%80%94+George+Whitefield%2C+%E2%80%98The+Conversion+of+Zacchaeus%E2%80%99+on+Lk.+19%3A9-10+in+Sermons+on+Important+Subjects%2C+pp.+401-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F859bc63988.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/859bc63988.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=With%20what%20different%20emotions%20of%20heart,Jesus%20Christ%20in%20sincerity%20say%2C%20Amen&amp;text=With%20what%20different%20emotions%20of%20heart%20may%20we&amp;text=the%20Lord%20Jesus%20Christ%20in%20sincerity%20say%2C%20Amen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

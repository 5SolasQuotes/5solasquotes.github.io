<blockquote><p>John Owen’s (1616–1683) four-volume commentary on the epistle to the Hebrews represents the apex of his literary career and exemplifies many of the exegetical methods of the post-Reformation. This thesis is the first detailed analysis of his introductory discourses, or “exercitations,” on Hebrews… this study is a descriptive analysis of the text and context of Owen’s discourses on the Messiah… Chapter 5 considers the nature of faith in the Old Testament, noting especially the importance of the Abrahamic covenant for what Owen calls “the oneness of the church.” In contrast, chapter 6 provides an extended analysis of the role of the law in the Mosaic covenant, considering in particular the highly problematic question of the recapitulation of the covenant of works and the nature of the old and new covenants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-w-tweeddale.html">John W. Tweeddale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sure Foundation: Christology, Covenant Theology &amp; Hermeneutics in John Owen’s Discourses on Hebrews PhD diss., Edinburgh Univ</cite>, 2017</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

iv>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-468e894502" data-kw="">
<blockquote><p>The papists prefer good works as meritorious causes, as do the Socinians, but as good works required by grace. There are those who prefer faith and repentance taken jointly, and there are several who are pleased with repentance, faith, and obedience. Most of the orthodox, with the Scriptures, most accurately admit here faith alone… Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition. More strictly and most properly understood, a condition denotes that by which, when it is given in man, from the divine promise, the covenant of grace is entered into. In this sense faith alone supplies the condition of the covenant of grace, for by this: (1) it is distinguished from the covenant of works (Rom. 3:27; 10:5–14); (2) it is denominated the law of faith (Rom. 3:27); and (3) its righteousness, the righteousness of faith (Rom. 10:6; Phil. 3:9; Heb. 11:7); (4) its covenanted parties are called οἱ ἐκ πίστεως, those who are of faith (Gal. 3:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 4, pt. 1, bk. 5, ch. 1, ‘The Covenant of Grace’ | XIX. The agreement of God 22 XX. The covenant of grace is conditioned 23 XXI. Because it is accomplished by a mutual promise 24 XXII. What the condition of the covenant of grace is 24 XXIII. The covenant of grace is not offered and conferred upon each and every person 25, pp. 24-25</span></figcaption>

</figure><figure class="quote" id="q-5c43cb88d6" data-kw="">
<blockquote><p>The gospel, however, is the offer of salvation upon the conditions of the covenant of grace. In this sense, the covenant of grace is formed with all mankind… If this, therefore, were all that is meant by those who make the parties to the covenant of grace, God and mankind in general and all mankind equally, there would be no objection to the doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenant of Grace’ 25</cite>, pp. from his Systematic Theology | Hodge, while having some good things to say, is not recommended on this subject. He expressly makes the Covenant of Grace to be between God and mankind, in some respect, as a basis for the free offer of the Gospel:, p. 13</span></figcaption>

</figure><figure class="quote" id="q-300543fdb6" data-kw="">
<blockquote><p>From all this it follows: First, that all the faithful are of the same faith with Abraham. The father and the sons-spiritual are of the same belief: as they do partake of the same spiritual privileges. It is one God that justifies the circumcision and the uncircumcision, and it is the same faith whereby the promises of mercy are embraced. Zaccheus is called the son of Abraham, and he believed in Christ as did Abraham. 2. Not only promises of temporal good things, but of spiritual and eternal were made to the patriarchs in the Covenant of Grace, and sought and obtained by them. They looked for a city whose builder and maker the Lord is. (Heb. 11:11-12) Remission of sins and life everlasting was preached in the Covenant, sealed in the sacrament, and typified by the land of Canaan. To conceive the fathers to be an assembly of brute beasts, which looked to be fed with earthly blessings alone, is highly to dishonor them, and lessen the grace and mercy of God towards them. 3. Sacramental phrases, wherein the name of the thing signified is given to the sign, are ancient and familiar; as circumcision is called the Covenant, and the rock Christ. Why then should our adversaries stumble at this, that in the sacrament of the Supper the bread is called the body of Christ? 4. In this expression of the Covenant, the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 91-92</span></figcaption>

he+grace+of+God+to+outward+means%3A+but+ordinarily+we+cannot+affirm+they+pertain+to+the+Covenant+of+Grace%2C+and+obtain+the+highest+blessings+promised+therein%2C+whom+God+does+not+vouchsafe+so+much+as+outwardly+to+receive+into+Covenant.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29+%7C+ch.+6%2C+%E2%80%98Of+the+Covenant+of+Grace+as+it+was+made+and+manifested+to+Abraham%E2%80%99%2C+pp.+91-92&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F300543fdb6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/300543fdb6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace#:~:text=From%20all%20this%20it%20follows%3A%20First,as%20outwardly%20to%20receive%20into%20Covenant&amp;text=From%20all%20this%20it%20follows%3A%20First%2C%20that%20all&amp;text=so%20much%20as%20outwardly%20to%20receive%20into%20Covenant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For manner of administration this covenant [of grace] is diverse, as it pleased God in sundry ways to dispense it; but for substance it is one—the last, unchangeable, and everlasting. One, for Jesus Christ is the same yesterday, and today, and forever. The last, for it succeeded the covenant of works, but none shall succeed it. (Heb. 13:8) In it God has revealed his whole pleasure concerning the salvation of man, and has manifested his principal properties, the riches of his grace, wherein he delights to be magnified. He who is not saved by the covenant of grace must and shall perish everlastingly. Unchangeable and everlasting, for therein God has revealed Himself, with respect to the things He wills concerning man’s salvation, to be one and the same forever. There is no other relation or respect that might give occasion to another covenant. It was the pleasure of God to show mercy to miserable man; but he will not extend compassion to him who obstinately and willfully contemns the riches of his grace. The covenant made with Adam in the state of innocence is altered for our great good and comfort; but this covenant is like the covenant of the day and of the night—it stands fast forever and ever. (Isa. 24:5; Ps. 111:9) Though men are unfaithful, God continues faithful; he waits for the conversion of those who go astray, and if they return, he will receive them into favor. (1 Sam. 7:3; Dt. 4:31; Jer. 3:1-2; Rom. •:6 &amp; 11:1, •9) The Lord will not utterly cast off that people whom he has once chosen and received unto mercy. And with respect to the life to come, the covenant is eternal; for after this life the people effectually in covenant shall live with the Lord forever. (Hos. 13:14; Mt. 22:32)</p></blockquote>

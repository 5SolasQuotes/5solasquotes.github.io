</figure><figure class="quote" id="q-bb3f07544b" data-kw="">
<blockquote><p>Three things in fact are required for the possible real, namely: 1) that existence is not intrinsically repugnant to it; 2) that having necessary existence is repugnant to it; 3) that existence is not extrinsically repugnant to it. The last requirement involves the existence of a cause having the capacity to bring the possible into actual existence. For this reason the possible is said to have virtual existence in its cause, that is, a cause exists that has the virtue or power of producing it. The possible is also said to have ‘existence in a certain respect’ in itself, that is, existence in something intelligent as a known object (intelligible being).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

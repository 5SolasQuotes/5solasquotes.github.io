<main class="wrap"><figure class="quote" id="q-4290caeba9" data-kw="">
<blockquote><p>Meanwhile, a certain Hilary, a Catholic layman of tribunitial rank, incited to anger, for some reason or other, against the ministers of God, as often happens, in abusive, censorious language, wherever it was possible, was violently attacking the custom which, at the time, had been introduced in Carthage, of singing hymns from the Book of Psalms either before the oblation or when what had been offered was being distributed to the people; he insisted that this should not be done. At the urging of my brethren, I answered him; the book is called Against Hilary.</p></blockquote>

</figure><figure class="quote" id="q-9af95198b7" data-kw="">
<blockquote><p>It is an undeniable historical fact that non-canonical songs were excluded from the Geneva services and that this sate of affairs was due to Calvin’s influence and desire… He took great pains to put together a psalter for use in Strasbourg, translating a number of the psalms himself. He included no hymns, and that in spite of the fact that the congregational singing of hymns was an established ordinance in Strasbourg. He borrowed some of the German tunes but none of the lyrics, and the choice must have been deliberate. There is also the fact that, throughout its long history of development, the Geneva Psalter never included a single hymn. The only possible exception to this would be the inclusion of a metrical version of the Apostle’s Creed in the first edition of Calvin’s Geneva Psalter (1542). The Creed, however, was in a different category from either hymns or biblical songs… In any event, the Creed was not present in the final and authoritative version of the psalter (1562). …it must be kept in mind that, ’till the middle of the seventeenth century it was the current belief of Roman Catholic and Protestant Christendom that the Apostle’s Creed was ‘Membratim articulatimque‘ composed by the Apostle’s in Jerusalem on the day of Pentecost…’ (Schaff, Creeds, vol. 1, p. 22) Calvin himself prefers to leave the question of authorship open… In his catechism Calvin says, ‘It is commonly called the Apostle’s Creed, because from the beginning of the church it came from the lips of the Apostles or was faithfully collected from their writings.’ (Theological Treatises, p. 92) The Apostles’ Creed was thus seen by Calvin as having Apostolic sanction, if not authority, and as deriving directly from the Apostolic age, if not from the hands of the Apostles themselves. It was in his view a creed that had the honor and respect attending its use in the Church for some 1,500 years. Should we then be surprised to find that Calvin included a metrical version of such a creed in his psalter? It is unfortunate that he did so, but we can certainly see reasons for his having done so, which ultimately have nothing to do with whether the Apostles’ Creed is inspired. Certainly there is a wide difference between the inclusion of such a creed in the psalter and the inclusion of contemporary hymns, which is something that Calvin never did…. the final and complete version of the Genevan Psalter (1562) did not contain a metrical version of the Apostles’ Creed. Whatever reasons Calvin had for including the creed in the first place, he evidently changed his mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Origin of Reformed Psalmody’ in Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, pp. 179-81.</span></figcaption>

</figure><figure class="quote" id="q-31f82330d9" data-kw="">
<blockquote><p>Only it appeared to me to be requisite to show in passing, that this book makes known to us this privilege, which is desirable above all others — that not only is there opened up to us familiar access to God, but also that we have permission and freedom granted us to lay open before him our infirmities which we would be ashamed to confess before men. Besides there is also here prescribed to us an infallible rule for directing us with respect to the right manner offering to God the sacrifice of praise, which he declares to be most precious in his sight, and of the sweetest odour. There is no other book in which there is to be found more express and magnificent commendations, both of the unparalleled liberality of God towards his Church, and of all his works; there is no other book in which there is recorded so many deliverances nor one in which the evidences and experiences of the fatherly providence and solicitude which God exercises towards us are celebrated with such splendor of diction, and yet with the strictest adherence to truth, in short, there is no other book in which we are more perfectly taught the right manner of praising God, or in which we are more powerfully stirred up to the performance of this religious exercise. Moreover although The Psalms are replete with all the precepts which serve to frame our life to every part of holiness, piety, and righteousness, yet they will principally teach and train us to bear the cross; and the bearing of the cross is a genuine proof our obedience, since by doing this, we renounce the guidance of our own affections and submit ourselves entirely to God, leaving him to govern us, and to dispose of our life according to his will, so that the afflictions which are the bitterest and most severe to our nature, become sweet to us, because they proceed from him. In one word, not only will we here find general commendations of the goodness of God, which may teach men to repose themselves in him alone, and to seek all their happiness solely in him; and which are intended to teach true believers with their whole hearts confidently to look to him for help in all their necessities; but we will also find that the free remission of sins, which alone reconciles God towards us and procures for us settled peace with him, is so set forth and magnified, as that here there is nothing wanting which relates to the knowledge of eternal salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’s Preface to the Commentary on the Psalms (HT: Matt Crutchmer)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Only it appeared to me to be requisite to show in passing, that this book makes known to us this privilege, which is desirable above all others — that not only is there opened up to us familiar access to God, but also that we have permission and freedom granted us to lay open before him our infirmities which we would be ashamed to confess before men. Besides there is also here prescribed to us an infallible rule for directing us with respect to the right manner offering to God the sacrifice of praise, which he declares to be most precious in his sight, and of the sweetest odour. There is no other book in which there is to be found more express and magnificent commendations, both of the unparalleled liberality of God towards his Church, and of all his works; there is no other book in which there is recorded so many deliverances nor one in which the evidences and experiences of the fatherly providence and solicitude which God exercises towards us are celebrated with such splendor of diction, and yet with the strictest adherence to truth, in short, there is no other book in which we are more perfectly taught the right manner of praising God, or in which we are more powerfully stirred up to the performance of this religious exercise. Moreover although The Psalms are replete with all the precepts which serve to frame our life to every part of holiness, piety, and righteousness, yet they will principally teach and train us to bear the cross; and the bearing of the cross is a genuine proof our obedience, since by doing this, we renounce the guidance of our own affections and submit ourselves entirely to God, leaving him to govern us, and to dispose of our life according to his will, so that the afflictions which are the bitterest and most severe to our nature, become sweet to us, because they proceed from him. In one word, not only will we here find general commendations of the goodness of God, which may teach men to repose themselves in him alone, and to seek all their happiness solely in him; and which are intended to teach true believers with their whole hearts confidently to look to him for help in all their necessities; but we will also find that the free remission of sins, which alone reconciles God towards us and procures for us settled peace with him, is so set forth and magnified, as that here there is nothing wanting which relates to the knowledge of eternal salvation.”

— John Calvin, ’s Preface to the Commentary on the Psalms (HT: Matt Crutchmer)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COnly+it+appeared+to+me+to+be+requisite+to+show+in+passing%2C+that+this+book+makes+known+to+us+this+privilege%2C+which+is+desirable+above+all+others+%E2%80%94+that+not+only+is+there+opened+up+to+us+familiar+access+to+God%2C+but+also+that+we+have+permission+and+freedom+granted+us+to+lay+open+before+him+our+infirmities+which+we+would+be+ashamed+to+confess+before+men.+Besides+there+is+also+here+prescribed+to+us+an+infallible+rule+for+directing+us+with+respect+to+the+right+manner+offering+to+God+the+sacrifice+of+praise%2C+which+he+declares+to+be+most+precious+in+his+sight%2C+and+of+the+sweetest+odour.+There+is+no+other+book+in+which+there+is+to+be+found+more+express+and+magnificent+commendations%2C+both+of+the+unparalleled+liberality+of+God+towards+his+Church%2C+and+of+all+his+works%3B+there+is+no+other+book+in+which+there+is+recorded+so+many+deliverances+nor+one+in+which+the+evidences+and+experiences+of+the+fatherly+providence+and+solicitude+which+God+exercises+towards+us+are+celebrated+with+such+splendor+of+diction%2C+and+yet+with+the+strictest+adherence+to+truth%2C+in+short%2C+there+is+no+other+book+in+which+we+are+more+perfectly+taught+the+right+manner+of+praising+God%2C+or+in+which+we+are+more+powerfully+stirred+up+to+the+performance+of+this+religious+exercise.+Moreover+although+The+Psalms+are+replete+with+all+the+precepts+which+serve+to+frame+our+life+to+every+part+of+holiness%2C+piety%2C+and+righteousness%2C+yet+they+will+principally+teach+and+train+us+to+bear+the+cross%3B+and+the+bearing+of+the+cross+is+a+genuine+proof+our+obedience%2C+since+by+doing+this%2C+we+renounce+the+guidance+of+our+own+affections+and+submit+ourselves+entirely+to+God%2C+leaving+him+to+govern+us%2C+and+to+dispose+of+our+life+according+to+his+will%2C+so+that+the+afflictions+which+are+the+bitterest+and+most+severe+to+our+nature%2C+become+s

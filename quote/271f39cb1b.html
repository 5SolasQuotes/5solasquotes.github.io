<main class="wrap"><figure class="quote" id="q-271f39cb1b" data-kw="">
<blockquote><p>The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity</cite>, … (d. 1707; Boston, 1726), Sermon 172, Q. 60, pp. 584-88</span></figcaption>

</figure><figure class="quote" id="q-b869d84c47" data-kw="">
<blockquote><p>We hold all who profess faith in Christ to be members of the visible Church, though they be not members of a visible congregation, and that the seals of the Covenant [of Grace] should not be denied to them. And for [the] more full clearing of the question, let these considerations be observed: First Distinction: All believers, as believers, in foro Dei, ‘before God’ have right to the seals of the Covenant [of Grace], these to whom the Covenant and body of the Charter belongs, to these the seal belongs, but in foro Ecclesiastico [in the sight of the Church], and in an orderly Church-way, the seals are not to be conferred by the Church upon persons because they believe, but because they profess their believing: therefore the apostles never baptized pagans, but upon profession of their faith. Second Distinction: Faith in Christ truly gives right to the seals of the Covenant [of Grace], and in God’s intention and decree, called voluntas beneplaciti [will of good-pleasure], they belong only to the invisible Church; but the orderly way of the Churches’ giving the seals is because such a society is a professing or visible Church, and [the] orderly giving of the seals according to God’s approving will, called, voluntas signi et revelata [the signified and revealed will], belongs to the visible Church. Third Distinction: The Church may orderly and lawfully give the seals of the Covenant to those to whom the Covenant and promises of grace do not belong in God’s decree of election. Fourth Distinction: The Church may lawfully add to the Church visible such as God adds not to the Church invisible, as they may add Simon Magus; and the Church may lawfully cast out of the visible Church, such as Christ has not cast out of the invisible Church, as the Church may excommunicate regenerate persons for scandalous sins. Fifth Distinction: Then the regenerate-excommunicated have right to the seals of the Covenant, as they have to the Covenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.</p></blockquote>

</figure><figure class="quote" id="q-6dc426196a" data-kw="">
<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].”

— John Bairdie, Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London: Cockerill, 1681), p. 173">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBe+not+easily+tempted+to+cast+at+your+ministers+of+whose+heart-honesty+you+have+had+sufficient+demonstration.+If+once+Satan+get+you+to+begin+a+little+to+spurn+at+them%2C+he+will+not+cease+tempting+and+providence+may+justly+let+snares+be+rained+on+you%2C+occasions+of+stumbling+be+afforded+you%2C+till+ye+turn+quite+off+and+become+wild.+Notorious+it+is+that+people%E2%80%99s+idolizing%2C+inamoredness+with+some%2C+and+rooted+prejudice+at+others+upon+partialities+and+by-respects+are+both+a+cause%2C+foment+and+consequent+of+woeful+divisions%2C+1+Cor.+1%3A11-12+and+3%3A3-4.+O+esteem+your+pastors+highly+in+love+for+their+work%E2%80%99s+sake+and+let+not+every+petty+difference+cast+you+and+them+out%3A+Keep+not+distance+with+them%2C+but+go+and+lovingly+confer+with+them+anent+what+ye+and+they+differ+in%3A+And+if+ye+get+not+satisfaction%2C+recommend+the+matter+to+God%2C+but+let+love+and+peace+stand+entire+notwithstanding.+What+is+Satan%E2%80%99s+great+engine%2C+and+consequently+his+design+for+marring+your+good+of+ministers%3B+but+by+stating+prejudices+in+your+minds+at+them%3F+Shut+your+ears+and+hearts+then+to+all+charms+that+would+suggest+ill+thoughts+of+your+honest+ministers.+Receive+not+lightly+ill+reports+of+them%2C+spread+perhaps+industriously+to+make+them+odious+%28Jer.+20%3A10%29+to+alienate+you+from+them%2C+as+Gal.+4%3A15-16.+Be+not+then+too+credulous%2C+try+e%E2%80%99re+ye+trust%2C+and+admit+no+bad+impressions+of+them+before+ye+have+found+that+truly+they+deserve+%5Bthem%5D.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%3A+Cockeri <blockquote><p>The last and worst report of all the rest [of the New England churches] is in Article 12, where he [William Rathband] reports that if any amongst us do not seek and desire church fellowship in our way, [we] account them despisers of it, yea wicked and graceless persons. To which I answer with detestation: God forbid. We speak as knowing God hears all our words; we hope we are far from such a spirit: for we know well that many gracious and precious saints there amongst us may, and sometimes do, for a good time abstain from seeking and desiring church fellowship for other grounds than despite, wickedness and gracelessness: Sometimes because they are not settled in a place: sometimes because they desire more experience of the ministers and people where they should join: some for want of clear light and full conviction of the church-ways we walk in: and some others out of many fears about their own spiritual estate before God, judging themselves (through temptation) out of a state of grace and dare not venture upon the seals, etc. whom we yet esteem precious souls and have labored by all arguments we were able to encourage to come into church fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-weld.html">Thomas Weld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to W.R.’s</cite>, [William Rathband’s] Narration of the Opinions &amp; Practices of the Churches lately Erected in New England: Vindicating those Godly &amp; Orthodoxal Churches [in New England]… (London, 1644), Answer to ch. 3, pp. 19-20 Weld (1590?–1662) was a New England congregationalist. Rathband was a moderate English puritan.</span></figcaption>

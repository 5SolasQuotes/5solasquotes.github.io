<main class="wrap"><figure class="quote" id="q-1dd80e69e5" data-kw="">

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3f554e86e" data-kw="">
<blockquote><p>Fiftly, that man is iustified by faith only, that is, for the onely satisfaction of Christ apprehended by faith: and not partly by faith, that is, for Christs satisfaction imputed; and partly by works, that is, for inherent iustice: may be gathered by the sayings following, which teach that a man is iustified without workes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned and Profitable Treatise of Man&#x27;s Justification</cite>, ch. VIII, p. 29</span></figcaption>

</figure><figure class="quote" id="q-16ec124bdb" data-kw="">
<blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/formal-cause.html">Formal Cause: Imputation</a> › <a href="../topics/justification/formal-cause/imputation-not-infusion.html">Imputation, not infusion</a></span><span class="t"><a href="../topics/justification/roman-justification.html">Roman Justification</a> › <a href="../topics/justification/roman-justification/trent.html">Trent</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/trent.html">Trent</a></span></div>
<div class="actions"><button class="copy" data-copy="“The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.”

</figure><figure class="quote" id="q-a046484a06" data-kw="">
<blockquote><p>Consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.”

</figure><figure class="quote" id="q-8f4d3c1b67" data-kw="">
<blockquote><p>The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins, and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification is an excellent gift of God … yet we deny it to be the thing, which makes us of sinners to become righteous or just before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Doctrine Touching the Justification of a Sinner</cite></span></figcaption>

</figure><figure class="quote" id="q-b65636a96f" data-kw="">
<blockquote><p>But if it is doubted about the animation of the fetus – whether a religious giving or procuring a potion for abortion, or advising or lending assistance, incurs irregularity? I respond that in the contentious forum, where the question is about punishment, interpretation ought to be made in the milder part: Law, ‘By interpretation,’ Digest, ‘On punishments.’ But in the forum of the soul, where the question is about placating God and amendment, one ought to consider himself a murderer, because in such matters the safer way is to be chosen, as in ch. ‘A young man,’ on betrothal, and it belongs to good minds to fear fault there where there is no fault: ch. ‘To his hearing’ at the end, dist. 5, argument from ch. ‘To his hearing,’ on homicide. See Navarrus in the Manual, ch. 27, n. 223.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2, ‘On Creation’, pt. 8, ‘On Man’, pp. 264-67 Latin | So that we may now give some taste to students and others who do not have leisure to inquire laboriously into these things, or who do not have the books at hand, we set down these conclusions: | 5th conclusion: It is homicide to procure the abortion of an animated fetus, when it is doubted whether the fetus is animated. In the papacy most teach that [the state of] irregularity is incurred by such a one, because he is doubtful whether he is a murderer. [Rom. 14:23]</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“But if it is doubted about the animation of the fetus – whether a religious giving or procuring a potion for abortion, or advising or lending assistance, incurs irregularity? I respond that in the contentious forum, where the question is about punishment, interpretation ought to be made in the milder part: Law, ‘By interpretation,’ Digest, ‘On punishments.’ But in the forum of the soul, where the question is about placating God and amendment, one ought to consider himself a murderer, because in such matters the safer way is to be chosen, as in ch. ‘A young man,’ on betrothal, and it belongs to good minds to fear fault there where there is no fault: ch. ‘To his hearing’ at the end, dist. 5, argument from ch. ‘To his hearing,’ on homicide. See Navarrus in the Manual, ch. 27, n. 223.”

— Gisbert Voetius, Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2, ‘On Creation’, pt. 8, ‘On Man’, pp. 264-67 Latin | So that we may now give some taste to students and others who do not have leisure to inquire laboriously into these things, or who do not have the books at hand, we set down these conclusions: | 5th conclusion: It is homicide to procure the abortion of an animated fetus, when it is doubted whether the fetus is animated. In the papacy most teach that [the state of] irregularity is incurred by such a one, because he is doubtful whether he is a murderer. [Rom. 14:23]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+if+it+is+doubted+about+the+animation+of+the+fetus+%E2%80%93+whether+a+religious+giving+or+procuring+a+potion+for+abortion%2C+or+advising+or+lending+assistance%2C+incurs+irregularity%3F+I+respond+that+in+the+contentious+forum%2C+where+the+question+is+about+punishment%2C+interpretation+ought+to+be+made+in+the+milder+part%3A+Law%2C+%E2%80%98By+interpretation%2C%E2%80%99+Digest%2C+%E2%80%98On+punishments.%E2%80%99+But+in+the+forum+of+the+soul%2C+where+the+question+is+about+placating+God+and+amendment%2C+one+ought+to+consider+himself+a+murderer%2C+because+in+such+matters+the+safer+way+is+to+be+chosen%2C+as+in+ch.+%E2%80%98A+young+man%2C%E2%80%99+on+betrothal%2C+and+it+belongs+to+good+minds+to+fear+fault+there+where+there+is+no+fault%3A+ch.+%E2%80%98To+his+hearing%E2%80%99+at+the+end%2C+dist.+5%2C+argument+from+ch.+%E2%80%98To+his+hearing%2C%E2%80%99+on+homicide.+See+Navarrus+in+the+Manual%2C+ch.+27%2C+n.+223.%E2%80%9D%0A%0A%E2%80%94+Gisbert+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+2%2C+%E2%80%98On+Creation%E2%80%99%2C+pt.+8%2C+%E2%80%98On+Man%E2%80%99%2C+pp.+264-67+Latin+%7C+So+that+we+may+now+give+some+taste+to+students+and+others+who+do+not+have+leisure+to+inquire+laboriously+int </figure><figure class="quote" id="q-371541bb79" data-kw="">
<blockquote><p>God’s curse to the woman was in part, ‘I will greatly multiply your sorrow and your conception’ (Gen. 3:16). Just as every other aspect of creation entered into a curse, so too did conception. To ignore the impact of the fall upon procreation is to miss critical changes that have come about that can make conception a sorrow rather than a blessing (things like cancer, high blood pressure, being worn out from running after five children under the age of six, changes to the function of lactation, etc.)… Physiology shows that perfect bodies were designed by God to suppress ovulation as long as there was breastfeeding (up to three years). The Fall has impacted many bodies to override this normal God-given function.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’ (2017)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

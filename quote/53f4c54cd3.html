</figure><figure class="quote" id="q-4f2f1b7f0b" data-kw="">
<blockquote><p>245. Therefore, the confessions of particular Churches and the decrees and canons of particular synods, and the catecheses of particular Churches and the liturgies or ecclesiastical agendas and similar formulas, their doctrines or declarations are not the immutable and universal norm of faith and truth, according to which it ought to be judged or pronounced what is to be believed and conceded, what is to be repudiated and condemned, what is true or false, orthodox or heretical. For it is not always necessary that what agrees with the confession of some particular Church, synodical decrees, catechesis, liturgy or ecclesiastical agenda, formula of doctrine or some other declaration, is true; nor is it always false what disagrees with it. Therefore, it should not be demanded that all Churches subscribe to the declaration and formula of one particular Church: but indeed those formulas do not even bind one Church or any private person to approve them and to contain themselves within them, except with this condition, insofar as they agree with divine Scripture and universal Symbols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, tr. ChatGPT-4, with Latin (Hanau, 1609-1610) at Monergism, bk. 1, Theology &amp; Scripture, p. 1,889</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

confessions%20of%20particular%20Churches%20and&amp;text=they%20agree%20with%20divine%20Scripture%20and%20universal%20Symbols" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4a00019d58" data-kw="">
<blockquote><p>1. It has been already declared (yea, adjudged) that, by that statute [the Act of Parliament in the 13th year of Elizabeth], there is no liberty for any man to subscribe the [39] Articles with any limitation, or explication, if any credit be given to Sir Edward Cook, who says (Institutes, 4.47, p. 324, ed. 1658), that he has heard Wray, chief Justice in the King’s Bench, Pasch. 23 Elizabeth (quoting Dier 23 Elizabeth, 377, bk. 6, fol. 69, Grene’s Case, Smith’s Case) report that where one Smith subscribed to the said 39 Articles of Religion with this addition, ‘so far forth as the same were agreeable to the Word of God,’ that it was resolved by him and all the judges of England that this subscription was not according to the Statute of 13th Elizabeth, because the statute required an absolute subscription, and this subscription made it conditional; and that this act was made for avoiding diversities of opinions, etc. And, by this addition the party might by his own private opinion take some of them to be against the Word of God: and by this means diversities of opinions should not be avoided, which was the scope of the statute; and the very act itself made touching subscription, hereby [be] of none effect. Thus, he. 2. This shows a necessity of repealing that branch of the act, so far as it concerns subscription, because: 1. If we may not subscribe with such an addition, ‘so far forth as the same Articles are agreeable to God’s Word,’ it must needs be granted that the composers of them are admitted to be infallible; and their Articles, of equal authority with canonical Scripture: or else that the statute intended to tyrannize over the consciences of men, which is not to be imagined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons showing the Necessity of Reformation</cite>, … (London: Cotrel, 1660), I. ‘Of Doctrine,’, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

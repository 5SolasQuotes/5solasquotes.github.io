<main class="wrap"><figure class="quote" id="q-f1d631ae1a" data-kw="">
<blockquote><p>To the eternal decree corresponds temporal execution. For since God neither changes His counsel nor can be hindered by anyone, whatever He decreed with Himself from eternity, He executes outside Himself in time. From the variety of this execution arises the distinction of God’s works. … Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-bd85ce9c97" data-kw="">
<blockquote><p>But to the contrary: 1. First it is argued through the text of Genesis, where it is said that through the space of six days [sex dierum spatium] the Lord completed the work that was begun. Therefore it is seen that the underlying matter was not produced in perfect actuality, according to the judgment of sacred Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (Florence: College of St. Bonaventura, 1882), vol. 2, bk. 2, dist. 12, art. 1, q. 2, ‘Whether the matter produced was in perfect actuality?’, p. 295</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“But to the contrary: 1. First it is argued through the text of Genesis, where it is said that through the space of six days [sex dierum spatium] the Lord completed the work that was begun. Therefore it is seen that the underlying matter was not produced in perfect actuality, according to the judgment of sacred Scripture.”

— Bonaventure, Commentary on the Four Books of the Sentences of Master Peter Lombard in All the Works (Florence: College of St. Bonaventura, 1882), vol. 2, bk. 2, dist. 12, art. 1, q. 2, ‘Whether the matter produced was in perfect actuality?’, p. 295">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+to+the+contrary%3A+1.+First+it+is+argued+through+the+text+of+Genesis%2C+where+it+is+said+that+through+the+space+of+six+days+%5Bsex+dierum+spatium%5D+the+Lord+completed+the+work+that+was+begun.+Therefore+it+is+seen+that+the+underlying+matter+was+not+produced+in+perfect+actuality%2C+according+to+the+judgment+of+sacred+Scripture.%E2%80%9D%0A%0A%E2%80%94+Bonaventure%2C+Commentary+on+the+Four+Books+of+the+Sentences+of+Master+Peter+Lombard+in+All+the+Works+%28Florence%3A+College+of+St.+Bonaventura%2C+1882%29%2C+vol.+2%2C+bk.+2%2C+dist.+12%2C+art.+1%2C+q.+2%2C+%E2%80%98Whether+the+matter+produced+was+in+perfect+actuality%3F%E2%80%99%2C+p.+295&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd85ce9c97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd85ce9c97.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=But%20to%20the%20contrary%3A%201.%20First,to%20the%20judgment%20of%20sacred%20Scripture&amp;text=But%20to%20the%20contrary%3A%201.%20First%20it%20is&amp;text=actuality%2C%20according%20to%20the%20judgment%20of%20sacred%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f522974a21" data-kw="">
<blockquote><p>Creatures considered through individual species are usually divided among physicists either according to the species of natural body, which is simple and mixed, etc. or according to the parts of the world, which are containers and contents, celestial and elemental, etc. We, presently omitting those things, will follow the division by the works of the six days’ creation frequented by all theologians and chronologers; and we will explain some things about the system of the world from Mosaic physics in the manner and method of theologians. For to want to call that into doubt, and to reduce it to absurdity belongs to those who, being unwise, refuse to submit their wisdom to the most Holy Spirit, and pave the way for themselves and others to Libertinism or atheism: while the system of the world described by Moses to them does not seem dissimilar to the fables and absurdities of Muhammad about the earth being founded on the horn of an ox (in the book Sunna), about the sun when it sets, immersing itself in a bubbling spring of water (Quran, chapter on the Cave). Objections and exceptions against the sacred Mosaic physics which are usually brought forward are not so subtle that they cannot be resolved. As among others Francis Junius shows against the 22 arguments of Simplicius, and of today’s antinomians, at the end of the explanation of the first three chapters of Genesis: with whom Scipio Claromontius, On the Universe, should be compared, and other philosophers to be cited below, who do not allow anti-Mosaic systems of the moderns to be foisted upon them…. …Heaven and the angels were created on the First Day. The reasons are: … 2. Because nowhere in the Hexaemeron is mention made of the creation of that heaven and the angels: but God completed in six days all things that were created, Gen. 2:1, and that heaven is among things created, Heb. 11:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2 Latin | On Creation, pt. 3, p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

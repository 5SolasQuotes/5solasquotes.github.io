<blockquote><p>4. I have perused the larger Catechism of the Assembly, and judge it a most excellent sum of divinity: and so much the more excellent, in that it is sparing in the difficult and more abstruse part, and most full in the practical part: And I find no word that I dissent from, so I may have leave but to interpret four words, as follows: 1. Where it is said, that the Covenant of Grace was made with Christ, as the second Adam, and in Him, with all the elect. I understand it of the genus of the Covenant, one species being made with Christ, and another with man, and not as if it were one and the same Covenant in specie that was made with Christ and with man: though I acknowledge that the promise made to Christ contained the salvation of his elect as the matter of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith… (London: R.W., 1655), ch. 2, sect. 4</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/covenant-of-redemption/counsel-of-peace.html">Counsel of Peace</a></span></div>

<blockquote><p>…in the good ol’ seventeenth century, Reformed theologians held to the principle of attributing ad extra works [all works directed externally outside of God to the creation] to all the persons of the Trinity. However, divines such as John Owen and Thomas Goodwin, to name just two of many, argued that certain outward works – depending on what they are – are more peculiarly attributed to one of the persons. This is also referred to as the doctrine of appropriations. Goodwin echoes this principle elsewhere: ‘In this will that common Axiome of Divines helps us, that what works all three Persons do towards us Ad extra, though they have all a joint hand in them, yet they are attributed more especially to one Person than to another; as Sanctification you know is attributed more especially to the Holy Ghost, Redemption to the Son, Creation to God the Father, though all Three Persons have a hand in it.’ That is to suggest that the persons all share a common prerogative, but often a certain work will be attributed to the Father, for example, in order to display his uniqueness. Both Goodwin and Owen wrestle with how this relates to the incarnation of the Son of God. So, for example, while some Divines attribute to the Spirit ‘the special Honour of tying that Marriage knot, or Union, between the Son of God, and that Man Jesus’, Goodwin believes that ‘that Action is more peculiarly to be Attributed to the Son Himself; as Second Person; who took up into one Person with Himself that Humane Nature’ (Heb. 2:16). Of course, Goodwin agrees that if they argue on the basis that the external works of the Trinity are undivided, there is no conflict. But, in Goodwin’s mind, it was ‘the Son’s Special Act … to assume [human nature]’. This is precisely what I say in the quote from Knowing Christ (p. 27). Owen argues that it was an outward act (ad extra) of the triune God, ‘As unto original efficiency’. However, ‘As unto authoritative designation, it was the act of the Father…. As unto the formation of the human nature, it was the peculiar act of the Spirit…. As unto the term of the assumption, or the taking of our nature unto himself, it was the peculiar act of the person of the Son.’ Essentially, Goodwin and Owen are claiming that the undivided works ad extra often manifest one of the persons as their terminus operationis [end of operation]. In the above example, the incarnation terminates on the Son though the act is (singularly) willed by the three persons of the Trinity. … If the Son did not decide to assume a human nature, then who did? God did, but, alas, dat old debbel [terminus operationis].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jones.html">Mark Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dat Old Debbel Tritheism?’ (2017) Jones’ context is not specifically about the Covenant of Redemption, but as may be seen, his discussion very much applies to it.</cite></span></figcaption>

<blockquote><p>Q. And what does God promise to bring the elect into in the Covenant of Grace? A. Into an estate of salvation. … Q. How does God promise to do all this? A. By a Redeemer, Isa. 53:10, ‘When Thou shalt make his soul an offering for sin, He shall see his seed, He shall prolong his days, and the pleasure of the Lord shall prosper in his hand,’ v. 11, ‘He shall see of the travail of his soul, and shall be satisfied, etc.’ And this by some learned divines is called the Covenant of Redemption. Q. What do they mean by it? A. That federal transaction that was betwixt God the Father and the Son from everlasting, about the redemption of lost and fallen men. Q. Is not this the same with the Covenant of Grace? A. This covenant is a covenant of grace, but ’tis not strictly that Covenant of Grace, which the Scripture holds out in opposition to the Covenant of works; but rather the means to it, or foundation of it. Q. Wherein do these two covenants differ? A. In the confederates, for in the Covenant of Redemption, the confederates are God and Christ, but in the Covenant of Grace, the confederates are God and believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explicatory Catechism: or an Explanation of the Assembly’s Shorter Catechism… (1675)</cite>, pp. 49-50</span></figcaption>

<blockquote><p>IV. With matters standing thus [with all men condemned by sin], God out of his immense mercy toward his elect looked out himself for a means of their reconciliation with him… And entering into a pact with his Son, he promised that if he would offer himself as an expiatory victim for guilt, he would see long-lived seed, setting apart the elect who were in servitude (Isaiah 53:10). And here we have both the justice and mercy of God made manifest (Rom 5:17): Justice indeed in that he required the restitution of his honor and willed that the right of the law be fulfilled in those to be redeemed (Rom 8:4); but Mercy in that he transferred our obligation to punishment to another, and required the satisfaction, which he could have completely repudiated, from another, whom he himself had chosen and appointed as our sponsor. Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’ tr. Onku with AI (Utrecht, 1650) Latin</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“IV. With matters standing thus [with all men condemned by sin], God out of his immense mercy toward his elect looked out himself for a means of their reconciliation with him… And entering into a pact with his Son, he promised that if he would offer himself as an expiatory victim for guilt, he would see long-lived seed, setting apart the elect who were in servitude (Isaiah 53:10). And here we have both the justice and mercy of God made manifest (Rom 5:17): Justice indeed in that he required the restitution of his honor and willed that the right of the law be fulfilled in those to be redeemed (Rom 8:4); but Mercy in that he transferred our obligation to punishment to another, and required the satisfaction, which he could have completely repudiated, from another, whom he himself had chosen and appointed as our sponsor. Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here.”

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’ tr. Onku with AI (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+With+matters+standing+thus+%5Bwith+all+men+condemned+by+sin%5D%2C+God+out+of+his+immense+mercy+toward+his+elect+looked+out+himself+for+a+means+of+their+reconciliation+with+him%E2%80%A6+And+entering+into+a+pact+with+his+Son%2C+he+promised+that+if+he+would+offer+himself+as+an+expiatory+victim+for+guilt%2C+he+would+see+long-lived+seed%2C+setting+apart+the+elect+who+were+in+servitude+%28Isaiah+53%3A10%29.+And+here+we+have+both+the+justice+and+mercy+of+God+made+manifest+%28Rom+5%3A17%29%3A+Justice+indeed+in+that+he+required+the+restitution+of+his+honor+and+willed+that+the+right+of+the+law+be+fulfilled+in+those+to+be+redeemed+%28Rom+8%3A4%29%3B+but+Mercy+in+that+he+transferred+our+obligation+to+punishment+to+another%2C+and+required+the+satisfaction%2C+which+he+could+have+completely+repudiated%2C+from+another%2C+whom+he+himself+had+chosen+and+appointed+as+our+sponsor.+Indeed%2C+so+far+is+gratuitous+remission+of+sins+from+being+opposed+to+this+satisfaction%2C+that+it+cannot+but+have+a+place+in+that+satisfaction+%28such+as+this+one+is%29+where+another+pays+and+something+else+is+paid+than+he+who+was+and+what+was+in+the+obligation%2C+and+more+so+when+he+to+whom+satisfaction+ought+to+be+made+can+reject+all+satisfaction%2C+and+especially+when+he+himself+appoints+the+sponsor+and+in+him+reconciles+himself+with+his+enemies%2C+all+of+which+obtain+here.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98Theological+Disputation+on+the+Satisfaction+of+Christ%E2%80%99+tr.+Onku+with+AI+%28Utrecht%2C+1650%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2650906f5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2650906f5e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-covenant-of-redemption/#:~:text=IV.%20With%20matters%20standing%20thus%20%5Bwith,enemies%2C%20all%20of%20which%20obtain%20here&amp;text=IV.%20With%20matters%20standing%20thus%20%5Bwith%20all%20men&amp;text=with%20his%20enemies%2C%20all%20of%20which%20obtain%20here" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assertion 3. There be two things in the Law: 1. The authority and power to command, direct, and regulate the creature to an end, in acts of righteousness and holiness. 2. A secondary authority, to punish eternally the breakers of the Law and to reward those that obey. These are two different things: suppose Adam had never sinned: the Law had been the Law; and suppose Adam had never obeyed: the Law also should have been the Law; and in the former case there should have been no punishment, in the latter no reward. … Crisp and his followers are far wide, for Christ died freely out of extreme love and yet He died out of a command laid on Him, to lay down his life for his sheep though no penal power was above Christ’s head to punish Him if He should not die, Jn. 10:18. Nor was there need of any power to force Him subpena [under penalty], or to awe Him if He should not obey; so do angels, with wings of most exact willingness, obey God, yet are they under the authority of a Law and command, but yet under no compelling punishment, Ps. 103:20-21; 104:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself… (London: 1647)</cite>, pp. 273-74</span></figcaption>

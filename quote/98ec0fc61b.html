<blockquote><p>1. In the controversy upon the perseverance or falling away of believers or saints, the question relates to that faith or sanctifying grace which may be received, exercised, retained, or rejected only through the medium, or some exercise of, free will [i.e. in adults].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of</cite>, … Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864) 30 pp.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f55322314" data-kw="">
<blockquote><p>But that all doubt may be better cleared away, this principle should ever be kept in mind, that baptism is not conferred on children in order that they may become sons and heirs of God, but, because they are already considered by God as occupying that place and rank, the grace of adoption is sealed in their flesh by the rite of baptism. Otherwise the Anabaptists are in the right in excluding them from baptism. For unless the thing signified by the external sign can be predicated of them, it will be a mere profanation to call them to a participation of the sign itself. But if any one were inclined to refuse them baptism, we have a ready answer; they are already of the flock of Christ, of the family of God, since the covenant of salvation which God enters into with believers is common also to their children. As the words import ‘I will be thy God and the God of thy seed after thee.’ Unless this promise had preceded, certainly it would have been wrong to confer on them baptism. Now I ask whether the Word of God is sufficient by its intrinsic value for our salvation, or whether some aid must be borrowed elsewhere to supply its defect, or help its infirmity? If this promise is not believed to be efficacious in itself, not only the virtue of God, but also his grace and truth will be attached to the external sign. Thus those men, while they strive to honor baptism, cast serious ignominy on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 438–To John Clauburger in Letters of John Calvin</cite>, ed. Bonnet (Philadelphia: Presbyterian Board of Publication, 1858), vol. 3, pp. 282-283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-dac9265f56" data-kw="">
<blockquote><p>Controversy 3 – Can the sacraments, especially baptism, be administered by anyone, including women? We deny against the Papists, Socinians, Arminians, and Anabaptists. Arguments: 1. Christ gave the power of administering the sacraments only to the apostles and ministers of the Church (Mt. 28:19). 2. And these alone are stewards and dispensers of the mysteries of God (1 Cor. 4:1). 3. The administration of the sacraments is joined with the preaching of the Word; thus, whoever cannot do one, cannot do the other 4. Calling is required (Jn. 1:33, 1 Cor. 1:17). 5. It is forbidden for women to speak in the Church or to do any ecclesiastical duty (1 Cor. 14:34-35). Objections 1. Zippora circumcised her son (Ex. 4:25). Reply: Their relation to circumcision is one thing and their relation to baptism another, and the fact that it was done by a woman is not approved. 2. Philip the deacon baptized (Acts 8:38). Reply: First, he was a deacon. Later, he was an evangelist (Acts 21:8). 3. So did Ananias (Acts 9:18). Reply: He had a special command (v. 10), nor is there proof that he was not a minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 17, ‘The Sacraments’, pp. 224-5 in Wesley White, A Translation with Introduction to A Summary of Elenctic Theology by Leonard Rijssen a Masters thesis (GPTS, 2009)</span></figcaption>

<blockquote><p>[Objection:] Sixthly, if it be the will of God that the death of Christ should be available for the immediate reconciliation of some of the elect, without any condition performed by them, then it was his will that it should be for all of them. But it is the will of God that it should be available for the immediate reconciliation of some of the elect, viz. infants, or else they cannot be reconciled. I answer: Mr. [William] Eyre is hardly put to it, that he must run to the Philistines to sharpen his goad; this argument is taken from [Francis] Suarez [a Romanist], who argues against faith in general upon this ground, because infants are justified without it. Now this argument proves, if it proves anything at all, that we are justified without it, and not before it, and so believers are not the sole subjects of justification, as Mr. Eyre elsewhere affirms; but the case of infants is not to be urged in most questions, especially when we are speaking of what God requires in those that are adulti, ‘of age’ unto salvation; but I deny his minor and affirm that infants are not united to Christ without faith; they are saved by faith as well as we. Thus [Jerome] Zanchi (tome 5, Commentary on Hosea, p. 28): Ut uniamur huic capiti Christo, Spiritus propriae fidei per sese omnibus ipsis etiam parvulis pernecessarius est; justus enim ex sola fide sua vivet, non aliena: assensus autem propriae voluntatis omnibus adultis est necessarius, etc.’ ‘ac proinde etiam parvuli quodammodo sibi ponunt hoc caput, cum Spiritu fidei interno in hoc caput donantur:’ ‘That we may be united to Christ, the spirit of a man’s own faith by itself is necessary to all, yea to infants also; for the just shall live by his own faith, not by another man’s; but the assent of our own proper will is necessary to all that are of age.’ And a little after he says: ‘and therefore also infants do in a manner appoint themselves this head, when they are given unto this head by the internal Spirit of faith.’ So also learned [Andrew] Rivet (ad vers. Babyl Jesui. Tom., [section ?] 297, p. 254.): Agnoscimus Deum in infantibus supplere quod deest propter aetatis imbecillitatem interna Spiritus sui operatione, qui fidei semen in ipsis ingenerat, et vi sua eis applicat meritum Christi, cujus suo tempore in eis sensum est excitaturus: ‘We acknowledge that God supplies in infants what is wanting through the weakness of their age by the internal work of his Spirit, who engenders a seed of faith, and by his power applies the merits of Christ to them, whereof He will raise up a sense in his time;’ Therefore I acknowledge there is at least wrought in them semen fidei, ‘a seed of faith’, by which they become members of Christ, and that relation which is in their faith to Christ’s merits is the instrument by which they obtain remission of sins, and without which they could not be saved. Nor may this seem strange, seeing we grant that in men grown up they are merely passive in the first work of grace, their understandings and wills no ways concurring antecedently to this work; and seeing it is a work wrought in us without us, why may not children be capable of this? Besides, if Adam had stood, even infants before the use of reason had been sanctified, and Christ was so from the womb, and John Baptist, and infants received the seal of the righteousness of faith; and are they capable of the seal of the righteousness of faith, and not of faith? And therefore though they have not the use of knowledge, this hinders not a seed and work of faith; they have not actual reason, yet they have reasonable souls; and when it is said that faith comes by hearing [Rom. 10], it is to be applied to persons that are of age, to whom the ordinary means to beget faith is hearing of the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification</cite>, … (London: Browne, 1654), pp. 247-49</span></figcaption>

is head by the internal Spirit of faith.’ So also learned [Andrew] Rivet (ad vers. Babyl Jesui. Tom., [section ?] 297, p. 254.): Agnoscimus Deum in infantibus supplere quod deest propter aetatis imbecillitatem interna Spiritus sui operatione, qui fidei semen in ipsis ingenerat, et vi sua eis applicat meritum Christi, cujus suo tempore in eis sensum est excitaturus: ‘We acknowledge that God supplies in infants what is wanting through the weakness of their age by the internal work of his Spirit, who engenders a seed of faith, and by his power applies the merits of Christ to them, whereof He will raise up a sense in his time;’ Therefore I acknowledge there is at least wrought in them semen fidei, ‘a seed of faith’, by which they become members of Christ, and that relation which is in their faith to Christ’s merits is the instrument by which they obtain remission of sins, and without which they could not be saved. Nor may this seem strange, seeing we grant that in men grown up they are merely passive in the first work of grace, their understandings and wills no ways concurring antecedently to this work; and seeing it is a work wrought in us without us, why may not children be capable of this? Besides, if Adam had stood, even infants before the use of reason had been sanctified, and Christ was so from the womb, and John Baptist, and infants received the seal of the righteousness of faith; and are they capable of the seal of the righteousness of faith, and not of faith? And therefore though they have not the use of knowledge, this hinders not a seed and work of faith; they have not actual reason, yet they have reasonable souls; and when it is said that faith comes by hearing [Rom. 10], it is to be applied to persons that are of age, to whom the ordinary means to beget faith is hearing of the Word preached.”

— Thomas Warren, Unbelievers No Subjects of Justification… (London: Browne, 1654), pp. 247-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BObjection%3A%5D+Sixthly%2C+if+it+be+the+will+of+God+that+the+death+of+Christ+should+be+available+for+the+immediate+reconciliation+of+some+of+the+elect%2C+without+any+condition+performed+by+them%2C+then+it+was+his+will+that+it+should+be+for+all+of+them.+But+it+is+the+will+of+God+that+it+should+be+available+for+the+immediate+reconciliation+of+some+of+the+elect%2C+viz.+infants%2C+or+else+they+cannot+be+reconciled.+I+answer%3A+Mr.+%5BWilliam%5D+Eyre+is+hardly+put+to+it%2C+that+he+must+run+to+the+Philistines+to+sharpen+his+goad%3B+this+argument+is+taken+from+%5BFrancis%5D+Suarez+%5Ba+Romanist%5D%2C+who+argues+against+faith+in+general+upon+this+ground%2C+because+infants+are+justified+without+it.+Now+this+argument+proves%2C+if+it+proves+anything+at+all%2C+that+we+are+justified+without+it%2C+and+not+before+it%2C+and+so+believers+are+not+the+sole+subjects+of+justification%2C+as+Mr.+Eyre+elsewhere+affirms%3B+but+the+case+of+infants+is+not+to+be+urged+in+most+questions%2C+especially+when+we+are+speaking+of+what+God+requires+in+those+that+are+adulti%2C+%E2%80%98of+age%E2%80%99+unto+salvation%3B+but+I+deny+his+minor+and+affirm+that+infants+are+not+united+to+Christ+without+faith%3B+they+are+saved+by+faith+as+well+as+we.+Thus+%5BJerome%5D+Zanchi+%28tome+5%2C+Commentary+on+Hosea%2C+p.+28%29%3A+Ut+uniamur+huic+capiti+Christo%2C+Spiritus+propriae+fidei+per+sese+omnibus+ipsis+etiam+parvulis+pernecessarius+est%3B+justus+enim+ex+sola+fide+sua+vivet%2C+non+aliena%3A+assensus+autem+propriae+voluntatis+omnibus+adultis+est+necessarius%2C+etc.%E2%80%99+%E2%80%98ac+proinde+etiam+parvuli+quodammodo+sibi+ponunt+hoc+caput%2C+cum+Spiritu+fidei+interno+in+hoc+caput+donantur%3A%E2%80%99+%E2%80%98That+we+may+be+united+to+Christ%2C+the+spirit+of+a+man%E2%80%99s+own+faith+by+itself+is+necessary+to+all%2C+yea+to+infants+also%3B+for+the+just+shall+live+by+his+own+faith%2C+not+by+another+man%E2%80%99s%3B+but+the+assent+of+our+own+proper+will+is+necessary+to+all+that+are+of+age.%E2%80%99+And+a+little+after+he+says%3A+%E2%80%98and+therefore+also+infants+do+in+a+manner+appoint+themselves+this+head%2C+when+they+are+given+unto+this+head+by+the+internal+Spirit+of+faith.%E2%80%99+So+also+learned+%5BAndrew%5D+Rivet+%28ad+vers.+Babyl+Jesui.+Tom.%2C+%5Bsection+%3F%5D+297%2C+p.+254.%29%3A+Agnoscimus+Deum+in+infantibus+supplere+quod+deest+propter+aetatis+imbecillitatem+interna+Spiritus+sui+operatione%2C+qui+fidei+semen+in+ipsis+ingenerat%2C+et+vi+sua+eis+applicat+meritum+Christi%2C+cujus+suo+tempore+in+eis+sensum+est+excitaturus%3A+%E2%80%98We+acknowledge+that+God+supplies+in+infants+what+is+wanting+through+the+weakness+of+their+age+by+the+internal+work+of+his+Spirit%2C+who+engenders+a+seed+of+faith%2C+and+by+his+power+applies+the+merits+of+Christ+to+them%2C+whereof+He+will+raise+up+a+sense+in+his+time%3B%E2%80%99+Therefore+I+acknowledge+there+is+at+least+wrought+in+them+semen+fidei%2C+%E2%80%98a+seed+of+faith%E2%80%99%2C+by+which+they+become+members+of+Christ%2C+and+that+relation+which+is+in+their+faith+to+Christ%E2%80%99s+merits+is+the+instrument+by+which+they+obtain+remission+of+sins%2C+and+without+which+they+could+not+be+saved.+Nor+may+this+seem+strange%2C+seeing+we+grant+that+in+men+grown+up+they+are+merely+passive+in+the+first+work+of+grace%2C+their+understandings+and+wills+no+ways+concurring+antecedently+to+this+work%3B+and+seeing+it+is+a+work+wrought+in+us+without+us%2C+why+may+not+children+be+capable+of+this%3F+Besides%2C+if+Adam+had+stood%2C+even+infants+before+the+use+of+reason+had+been+sanctified%2C+and+Christ+was+so+from+the+womb%2C+and+John+Baptist%2C+and+infants+received+the+seal+of+the+righteousness+of+faith%3B+and+are+they+capable+of+the+seal+of+the+righteousness+of+faith%2C+and+not+of+faith%3F+And+therefore+though+they+have+not+the+use+of+knowledge%2C+this+hinders+not+a+seed+and+work+of+faith%3B+they+have+not+actual+reason%2C+yet+they+have+reasonable+souls%3B+and+when+it+is+said+that+faith+comes+by+hearing+%5BRom.+10%5D%2C+it+is+to+be+applied+to+persons+that+are+of+age%2C+to+whom+the+ordinary+means+to+beget+faith+is+hearing+of+the+Word+preached.%E2%80%9D%0A%0A%E2%80%94+Thomas+Warren%2C+Unbelievers+No+Subjects+of+Justification%E2%80%A6+%28London%3A+Browne%2C+1654%29%2C+pp.+247-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F431b01e004.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/431b01e004.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Objection%3A%5D%20Sixthly%2C%20if%20it%20be%20the,is%20hearing%20of%20the%20Word%20preached&amp;text=Objection%3A%5D%20Sixthly%2C%20if%20it%20be%20the%20will%20of&amp;text=beget%20faith%20is%20hearing%20of%20the%20Word%20preached" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

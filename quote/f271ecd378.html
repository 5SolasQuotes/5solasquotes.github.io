<main class="wrap"><figure class="quote" id="q-f271ecd378" data-kw="">
<blockquote><p>As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-baro.html">Peter Baro</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy</cite>, (Oxford Univ. Press, 2021), p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways: I. As God. II. As Judge of the World. III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 4</span></figcaption>

</figure><figure class="quote" id="q-f34c6a4968" data-kw="">
<blockquote><p>XXIII. While Christ’s passion is minimized by the foregoing errors, those who teach that he died for all human beings (pro omnibus et singulis) broaden the object of his passion more than is allowable. Of course, if we take into consideration the magnitude and worthiness of the merit, we admit that it would suffice for the redemption of ten worlds; but if we take the plan of God and the intention of Christ into consideration, then it is false to say that Christ died for every person. For this reason others say that his death was sufficient for all, but not effective for all; that is, the merit of Christ, because of his worthiness, is sufficient for all, but it is not effective for all in its application, because Christ did not die with the intention that his death be applied to all. Why should He die for those for whom He would not pray?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity in</cite>, ed. John Beardslee, Reformed Dogmatics (Grand Rapids: Baker, 1977), pp. 105-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

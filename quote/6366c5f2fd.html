<blockquote><p>The disaffected among the people, particularly the young, were increasingly drawn to his [Cameron’s] side. ‘Everywhere now’, noted Hamilton with satisfaction, ‘it is the young ones that are carrying on the work.’ To the older ministers, however, these events were a cause for dismay… Warnings were issued about his teaching, and counter-meetings were held in places where he was to preach.</p></blockquote>

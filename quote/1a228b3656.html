<main class="wrap"><figure class="quote" id="q-1a228b3656" data-kw="">
<blockquote><p>Let us then drive away from our ears and minds those who say that we ought to accept the determination of our own free will and not pray God to help us not to sin. By such darkness as this even the Pharisee was not blinded; for although he erred in thinking that he needed no addition to his righteousness, and supposed himself to be saturated with abundance of it, he nevertheless gave thanks to God that he was not “like other men, unjust, extortioners, adulterers, or even as the publican; for he fasted twice in the week, he gave tithes of all that he possessed.”

He wished, indeed, for no addition to his own righteousness; but yet, by giving thanks to God, he confessed that all he had he had received from Him. Notwithstanding, he was not approved, both because he asked for no further food of righteousness, as if he were already filled, and because he arrogantly preferred himself to the publican, who was hungering and thirsting after righteousness.

What, then, is to be said of those who, whilst acknowledging that they have no righteousness, or no fulness thereof, yet imagine that it is to be had from themselves alone, not to be besought from their Creator, in whom is its store and its fountain? And yet this is not a question about prayers alone, as if the energy of our will also should not be strenuously added. God is said to be “our Helper;” but nobody can be helped who does not make some effort of his own accord.

For God does not work our salvation in us as if he were working in insensate stones, or in creatures in whom nature has placed neither reason nor will. Why, however, He helps one man, but not another; or why one man so much, and another so much; or why one man in one way, and another in another,—He reserves to Himself according to the method of His own most secret justice, and to the excellency of His power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.6 in NPNF1, 5: 46.</span></figcaption>

<blockquote><p>The main body of the thesis explores the practice and experience of faith in the North East between 1560 and 1610 using three main themes. The first studies the Sabbath, the weekly fixture that was the heart of public worship and observance in the parish. Sacramental practice is the second theme with an in-depth study of the annual administration of Communion, which reinforced temporal and spiritual bonds among Kirk adherents and starkly exposed non-adherents and recusants. The final theme considers the role and position of ministers and readers in religious practice and investigates the relationship between them and their parishioners. From detailed analysis of these three themes, it is concluded that the North East as a whole was transformed into the general mould of Scottish Reformed Protestantism by 1610, but that there was a spectrum of practices and experiences of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catherine-mcmillan.html">Catherine McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Keeping the Kirk</cite>, 1560-1610 (2016) PhD dissertation, Univ. of Edinburgh This has been published in book form. | Abstract:</span></figcaption>

<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>

</figure><figure class="quote" id="q-6fa6991128" data-kw="">
<blockquote><p>First, the Scripture will inform us that singing of Psalms is a necessary and profitable duty:

1. A necessary duty, because God requires it, Eph. 5:17-19. It is the will of God that (on the one side) Christians should not be drunk with wine; and, on the other side, be filled with the Spirit, speaking to themselves in Psalms, etc. (Col. 3:16; Beza (in location) shows that the three Greek words that are translated Psalms, Hymns, and Songs, are the same that are used by the Septuagint to render the Hebrew words, which are the Titles of diverse Psalms, which we call the Psalms of David) [We have not been able to find this reference in Beza’s NT Commentary] It is the Spirit of God that saith to the afflicted, ‘Pray’; and to the merry, ‘Sing psalms‘, Jam. 5:13.

2. And a profitable duty, because the Spirit of God declares unto us the benefit of it, prescribing that the Word of God should dwell in us richly, and then adding further, ‘teaching and admonishing one another in psalms’, etc. Now it’s true, that teaching and admonishing may be referred either to the Word of God going before, or to psalms and hymns following after; but, it comes all to one, if the psalms, hymns, and songs spoken of there, be such as are recorded in Scripture, for then they are a part of the Word of God: and so the intent of the apostle may be to show that of every part of the Word of God, and in particular of the psalms and songs thereof (the rejoicing part) use is to be made for our edification; thereby something may be added to our light in a teaching way, and to our life and vigor in piety in an admonishing way. Secondly, the Scripture gives excellent rules also for singing, that it may be a profitable duty; As that it be, 1. With understanding, Ps. 47:7; 1 Cor. 14:14-15.

2. With the heart and affection; not without the voice: but the meaning is, that we should not please and content our selves with the outward sound without an inward sense.

3. With grace in the heart, Col. 3:16, that is, (as I conceive), with a godly and gracious frame of heart inwardly, (according as the matter of the Psalm is), showing itself in a graceful and dexterous demeanor in that duty outwardly (as in a comely and reverent gesture, a decent tune and tone)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preservative of Piety in a Quiet Reasoning for those duties of religion, that are the means and helps appointed of God for the preserving and promoting of godliness</cite>, … (London, 1662), Pt. 2, Ch. 4, ‘Of Singing of Psalms, and namely, in Families’, pp. 195-6. Thomas was a rector in the Anglican Church.</span></figcaption>

g+part%29+use+is+to+be+made+for+our+edification%3B+thereby+something+may+be+added+to+our+light+in+a+teaching+way%2C+and+to+our+life+and+vigor+in+piety+in+an+admonishing+way.+Secondly%2C+the+Scripture+gives+excellent+rules+also+for+singing%2C+that+it+may+be+a+profitable+duty%3B+As+that+it+be%2C+1.+With+understanding%2C+Ps.+47%3A7%3B+1+Cor.+14%3A14-15.+2.+With+the+heart+and+affection%3B+not+without+the+voice%3A+but+the+meaning+is%2C+that+we+should+not+please+and+content+our+selves+with+the+outward+sound+without+an+inward+sense.+3.+With+grace+in+the+heart%2C+Col.+3%3A16%2C+that+is%2C+%28as+I+conceive%29%2C+with+a+godly+and+gracious+frame+of+heart+inwardly%2C+%28according+as+the+matter+of+the+Psalm+is%29%2C+showing+itself+in+a+graceful+and+dexterous+demeanor+in+that+duty+outwardly+%28as+in+a+comely+and+reverent+gesture%2C+a+decent+tune+and+tone%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Thomas%2C+A+Preservative+of+Piety+in+a+Quiet+Reasoning+for+those+duties+of+religion%2C+that+are+the+means+and+helps+appointed+of+God+for+the+preserving+and+promoting+of+godliness%2C+%E2%80%A6+%28London%2C+1662%29%2C+Pt.+2%2C+Ch.+4%2C+%E2%80%98Of+Singing+of+Psalms%2C+and+namely%2C+in+Families%E2%80%99%2C+pp.+195-6.+Thomas+was+a+rector+in+the+Anglican+Church.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fa6991128.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fa6991128.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=First%2C%20the%20Scripture%20will%20inform%20us,gesture%2C%20a%20decent%20tune%20and%20tone&amp;text=First%2C%20the%20Scripture%20will%20inform%20us%20that%20singing&amp;text=and%20reverent%20gesture%2C%20a%20decent%20tune%20and%20tone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Arguments of Peter Martyr disputing with Mr. Chadsey upon the first question: The analogy and resemblance between the sacrament and the thing signified must ever be kept in all sacraments. In the sacrament of the Lord’s body, this analogy or resemblance cannot be kept, if bread be transubstantiated: Ergo [therefore], the substance of bread must needs remain in the sacrament of the Lord’s body. The major [premise] of this argument is certain by St. Austen [Augustine] (Book on Catechizing in the Rudiments; Epistle to Dardan), where he says: Sacraments must needs bear a similitude of those things whereof they are sacraments, or else they can be no sacraments.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5d52bebcef" data-kw="">
<blockquote><p>In the work of our regeneration three graces be required: the preventing grace, the working grace and the co-working grace. The preventing grace is when God of his mercy sets and imprints in the mind a new light, in the will a new quality or inclination, in the heart new affections. The working grace is when God gives to the will the act of well-willing, namely the will to believe, the will to repent, the will to obey God in his Word. (Velle credere, velle resipiscere, velle obedire.) The co-working grace is when God gives the deed to the will, that is, the exercise and practice of faith and repentance. The first gives the power of doing good, the second the will, the third the deed: and all three together make the work of regeneration. (Augustine, Of Grace &amp; Free Will, ch. 17) Now the will of man in respect of operation does not concur with God’s preventing grace, but is merely patient as a subject to receive grace. For it is the proper work of God to set or imprint a new faculty or inclination in the will, and that without any action of the said will. Nevertheless the will being once renewed and prevented, concurs by his operation with the working and co-working grace of God. For the will being moved by grace, wills and does indeed that whereunto it is moved. And the will to obey God, or to perform any like duty, proceeds jointly from two causes. From grace: in that it moves and causes the will to will to believe. From the will of man: in that being prevented and moved by God, it wills to believe, or to do any like duty. And therefore the ancient saying has his truth, ‘He that made thee without thee, does not regenerate or save thee without thee’ (Augustine, Sermon 15, Of the Words of the Apostles), because our conversion is not without the motion and consent of will, as our creation was. And that we do not mistake in this point, the order that is between man’s will and God’s grace must here again be remembered. In respect of time they are both together, and concur in the very first moment of our regeneration: in respect of the order of nature, the will does not first begin that which is good, and then after borrow aid from grace: but grace prevents, renews, and moves the will, and then the will moved or changed wills to be converted and to be healed in the first instant of conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), pp. 116-21</span></figcaption>

<blockquote><p>Assertion 1: In the first moment of our conversion, called actus primus conversionis, we are mere patients. 1. Because the infusion of the new heart, Eze. 36:26, the pouring of the Spirit of Grace and supplication on the family of David, Zech. 12:10, and of the Spirit on the thirsty ground, Isa. 44:3, is a work of creation, Eph. 2:10; Ps. 51:10, a quickening of the dead, Eph. 2:1-4; Jn. 5:25; 2 Cor. 4:6, and the wilderness is not here a co-agent for the causing roses to blossom out of the earth. 2. The effect is not wholly denied of the collateral cause and ascribed wholly to another. If Peter and John draw a ship between them, with joint strength, you cannot say the one drew the ship, not the other: But Christ said flesh and blood makes no revelations of Christ, but his Father only, Mt. 16:17; 11:25-27; Jm. 1:18; Jn. 1:18. Then neither blood, nor the will of man contribute any active influence to the first framing of the new birth; nor can clay divide the glory of regeneration with the God of grace who makes all things new. … Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the Person is said to come to the saints and to dwell with them, and to be in them, Jn. 14:16-17; and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father’; not that the Holy Ghost, in proper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwells in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will and affections. I prove the former part: 1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinful omission of the acts of faith, love, praying, rejoicing, could not be more imputed to saints as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willful pilot who of purpose dashed the vessel on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernatural acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop. … 3. The third [erroneous] way is that free-will is said to believe, repent, love God, by a mere extrinsical denomination, because it carries that grace which formally and only does perform all these supernatural actions; so grace does all and free-will is a mere patient that confers no vital subordinate and active influence in these acts; as we say, the apothecaries’ glass heals the wound, because the oil in the glass works the cure, when the glass does actively contribute nothing to the cure; or the ass makes rich, when it carries the gold that enriches only; this sense Antinomians hold forth and make us mere patients and blocks in the way to heaven, and this sense Jesuits, especially Martinez de Ripald, falsely charges upon Luther and Calvin; and the Council of Trent, inspired with the same lying spirit, says the same. 4. The fourth [and correct] sense is that grace and free-will does work so as grace is the principal, first inspiring and fountain cause: 1. It being a new supernatural disposition and habit in the soul, Jn. 14:23; 1 Jn. 2:27; 3:9; Jn. 4:14; Isa. 44:3-4; Eze. 36:26-27; Dt. 30.6; a good treasure or stock of grace, Mt. 12:35; Lk. 6:45. And also actually it determines, sweetly inclines and stirs the will to these acts; yet so as free-will moves actively, freely, and confers a radical, vital and subordinate influence and is not a mere patient in all these, as Antinomians dream, Ps. 119:32. ‘I will run the way of thy commandments, when thou shall enlarge my heart,’ Jn. 14:12, ‘he that believeth in Me, the works that I do, he shall do, and greater than these,’ Mt. 12:50, ‘He that does the will of my heavenly Father, the same is my brother,’ etc. 1 Cor. 9:24, ‘So run that ye may obtain,’ Rev. 2:2, ‘I know thy works and thy labour,’ 1 Thess. 1:3, ‘Remembering without ceasing your work of faith and labor of love, and patience of hope:’ 1. We are not dead in supernatural works, and mere blocks, Rom. 6:11, ‘We are alive unto God in Jesus Christ,’ Eph. 2:1, ‘He hath quickened us,’ Rev. 2:3, ‘For my name’s sake thou hast laboured, and had not fainted,’ 1 Cor. 15:58, ‘Be ye steadfast, unmoveable, always abundant in the work of the Lord.’ There is activity in the Spirit to lust against the flesh, Gal. 5:17; Rom. 7:15. Nor is the blessedness of the saints only passive in receiving: though to be justified and receive Christ’s righteousness be the fountain blessedness, Ps. 32:1; Rom. 4:6-7; Gal. 3:13. But the Scripture speaks of a true and solid blessedness in action, Ps. 119:1, ‘Blessed are the undefiled in the way,’ Isa. 56:2, ‘Blessed is the man that doth this,’ Jm. 1:12, ‘Blessed is the man that endureth temptation,’ Ps. 119:2, ‘Blessed are they that keep his testimonies,’ Ps. 106:3, ‘Blessed are they that keep judgment, Rev. 22:14, ‘Blessed are they that do his commandments, Mt. 5, ‘Blessed are they that mourn, that hunger and thirst;‘ Then there must be a part of blessedness in sanctification, as in justification; though the one be the cause, the other the effect.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“Assertion 1: In the first moment of our conversion, called actus primus conversionis, we are mere patients. 1. Because the infusion of the new heart, Eze. 36:26, the pouring of the Spirit of Grace and supplication on the family of David, Zech. 12:10, and of the Spirit on the thirsty ground, Isa. 44:3, is a work of creation, Eph. 2:10; Ps. 51:10, a quickening of the dead, Eph. 2:1-4; Jn. 5:25; 2 Cor. 4:6, and the wilderness is not here a co-agent for the causing roses to blossom out of the earth. 2. The effect is not wholly denied of the collateral cause and ascribed wholly to another. If Peter and John draw a ship between them, with joint strength, you cannot say the one drew the ship, not the other: But Christ said flesh and blood makes no revelations of Christ, but his Father only, Mt. 16:17; 11:25-27; Jm. 1:18; Jn. 1:18. Then neither blood, nor the will of man contribute any active influence to the first framing of the new birth; nor can clay divide the glory of regeneration with the God of grace who makes all things new. … Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the Person is said to come to the saints and to dwell with them, and to be in them, Jn. 14:16-17; and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father’; not that the Holy Ghost, in proper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwells in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will and affections. I prove the former part: 1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinful omission of the acts of faith, love, praying, rejoicing, could not be more imputed to saints as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willful pilot who of purpose dashed the vessel on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernatural acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop. … 3. The third [erroneous] way is that free-will is said to believe, repent, love God, by a mere extrinsical denomination, because it carries that grace which formally and only does perform all these supernatural actions; so grace does all and free-will is a mere patient that confers no vital subordinate and active influence in these acts; as we say, the apothecaries’ glass heals the wound, because the oil in the glass works the cure, when the glass does actively contribute nothing to the cure; or the ass makes rich, when it carries the gold that enriches only; this sense Antinomians hold forth and make us mere patients and blocks in the way to heaven, and this sense Jesuits, especially Martinez de Ripald, falsely charges upon Luther and Calvin; and the Council of Trent, inspired with the same lying spirit, says the same. 4. The fourth [and correct] sense is that grace and free-will does work so as grace is the principal, first inspiring and fountain cause: 1. It being a new supernatural disposition and habit in the soul, Jn. 14:23; 1 Jn. 2:27; 3:9; Jn. 4:14; Isa. 44:3-4; Eze. 36:26-27; Dt. 30.6; a good treasure or stock of grace, Mt. 12:35; Lk. 6:45. And also actually it determines, sweetly inclines and stirs the will to these acts; yet so as free-will moves actively, freely, and confers a radical, vital and subordinate influence and is not a mere patient in all these, as Antinomians dream, Ps. 119:32. ‘I will run the way of thy commandments, when thou shall enlarge my heart,’ Jn. 14:12, ‘he that believeth in Me, the works that I do, he shall do, and greater than these,’ Mt. 12:50, ‘He that does the will of my heavenly Father, the same is my brother,’ etc. 1 Cor. 9:24, ‘So run that ye may obtain,’ Rev. 2:2, ‘I know thy works and thy labour,’ 1 Thess. 1:3, ‘Remembering without ceasing your work of faith and labor of love, and patience of hope:’ 1. We are not dead in supernatural works, and mere blocks, Rom. 6:11, ‘We are alive unto God in Jesus Christ,’ Eph. 2:1, ‘He hath quickened us,’ Rev. 2:3, ‘For my name’s sake thou hast laboured, and had not fainted,’ 1 Cor. 15:58, ‘Be ye steadfast, unmoveable, always abundant in the work of the Lord.’ There is activity in the Spirit to lust against the flesh, Gal. 5:17; Rom. 7:15. Nor is the blessedness of the saints only passive in receiving: though to be justified and receive Christ’s righteousness be the fountain blessedness, Ps. 32:1; Rom. 4:6-7; Gal. 3:13. But the Scripture speaks of a true and solid blessedness in action, Ps. 119:1, ‘Blessed are the undefiled in the way,’ Isa. 56:2, ‘Blessed is the man that doth this,’ Jm. 1:12, ‘Blessed is the man that endureth temptation,’ Ps. 119:2, ‘Blessed are they that keep his testimonies,’ Ps. 106:3, ‘Blessed are they that keep judgment, Rev. 22:14, ‘Blessed are they that do his commandments, Mt. 5, ‘Blessed are they that mourn, that hunger and thirst;‘ Then there must be a part of blessedness in sanctification, as in justification; though the one be the cause, the other the effect.”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself… (London, 1647), pp. 464-65 &amp; 470-71">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssertion+1%3A+In+the+first+moment+of+our+conversion%2C+called+actus+primus+conversionis%2C+we+are+mere+patients.+1.+Because+the+infusion+of+the+new+heart%2C+Eze.+36%3A26%2C+the+pouring+of+the+Spirit+of+Grace+and+supplication+on+the+family+of+David%2C+Zech.+12%3A10%2C+and+of+the+Spirit+on+the+thirsty+ground%2C+Isa.+44%3A3%2C+is+a+work+of+creation%2C+Eph.+2%3A10%3B+Ps.+51%3A10%2C+a+quickening+of+the+dead%2C+Eph.+2%3A1-4%3B+Jn.+5%3A25%3B+2+Cor.+4%3A6%2C+and+the+wilderness+is+not+here+a+co-agent+for+the+causing+roses+to+blossom+out+of+the+earth.+2.+The+effect+is+not+wholly+denied+of+the+collateral+cause+and+ascribed+wholly+to+another.+If+Peter+and+John+draw+a+ship+between+them%2C+with+joint+strength%2C+you+cannot+say+the+one+drew+the+ship%2C+not+the+other%3A+But+Christ+said+flesh+and+blood+makes+no+revelations+of+Christ%2C+but+his+Father+only%2C+Mt.+16%3A17%3B+11%3A25-27%3B+Jm.+1%3A18%3B+Jn.+1%3A18.+Then+neither+blood%2C+nor+the+will+of+man+contribute+any+active+influence+to+the+first+framing+of+the+new+birth%3B+nor+can+clay+divide+the+glory+of+regeneration+with+the+God+of+grace+who+makes+all+things+new.+%E2%80%A6+Assertion+3.+The+Person+of+the+Holy+Ghost+is+not+united+to+the+soul+of+a+believer%2C+nor+are+there+two+persons+here+united+or+made+one+Spirit+by+union+of+person+with+person%3B+but+the+Person+is+said+to+come+to+the+saints+and+to+dwell+with+them%2C+and+to+be+in+them%2C+Jn.+14%3A16-17%3B+and+God+has+sent+the+Spirit+of+his+Son+in+our+hearts%2C+crying+%E2%80%98Abba+Father%E2%80%99%3B+not+that+the+Holy+Ghost%2C+in+proper+Person%2C+does+in+us+formally+and+immediately+believe%2C+pray%2C+love%2C+repent%2C+etc.+we+being+mere+patients+in+understanding%2C+will%2C+affections%2C+memory%2C+as+Libertines+teach.+But+the+Holy+Ghost+comes+to+the+saints+and+dwells+in+them%2C+in+the+spiritual+gifts+and+saving+graces%2C+and+supernatural+qualities+created+in+us+by+the+Holy+Spirit+and+acted%2C+excited+and+moved+as+supernatural+and+heavenly+habits+to+act+with+the+vital+influence+of+our+understanding%2C+will+and+affections.+I+prove+the+former+part%3A+1.+Because+such+a+union+of+the+Person+of+the+Holy+Ghost+in+us%2C+believing%2C+loving%2C+joying%2C+praying+and+immediately+in+us%2C+were+that+blasphemous+deifying+and+Goding+of+the+saints%2C+so+as+believing%2C+loving%2C+praying+were+not+our+works%2C+but+the+immediate+acts+of+the+Holy+Ghost%2C+and+either+the+faint+manner+of+believing%2C+or+the+cold+slacked+loving%2C+and+praying+of+saints%2C+or+their+not+believing%2C+and+sinful+omission+of+the+acts+of+faith%2C+love%2C+praying%2C+rejoicing%2C+could+not+be+more+imputed+to+saints+as+their+sinful+defects+and+transgressions+%28but+must+be+laid+on+the+Holy+Ghost%E2%80%99s+score%29+than+we+can+impute+the+splitting+of+a+ship+to+the+ship+itself+and+not+to+the+negligent+and+willful+pilot+who+of+purpose+dashed+the+vessel+on+a+rock%3B+but+we+must+not+in+reason+blame+the+ship%2C+but+the+pilot%3B+for+the+loss+of+the+ship+is+the+only+and+proper+fault+of+the+man+that+stirred+the+ship%2C+and+the+ship+is+innocent+and+harmless+timber%3A+Now+what+sin+can+be+in+the+saints+in+these+supernatural+acts%2C+if+the+Holy+Ghost+immediately+in+his+own+Person+stir+the+helm%2C+and+only%2C+without+us%2C+act+these+in+us%3F+We+might+with+as+good+reason+say+the+shop+that+a+man+works+in+does+make+the+portrait%2C+which+is+a+great+untruth%2C+since+the+artificer+in+the+shop+does+it%E2%96%AA+as+say+that+the+saints+do+pray%2C+believe%2C+rejoice%2C+if+the+Holy+Ghost+immediately+do+all+these+in+them%2C+as+in+a+shop.+%E2%80%A6+3.+The+third+%5Berroneous%5D+way+is+that+free-will+is+said+to+believe%2C+repent%2C+love+God%2C+by+a+mere+extrinsical+denomination%2C+because+it+carries+that+grace+which+formally+and+only+does+perform+all+these+supernatural+actions%3B+so+grace+does+all+and+free-will+is+a+mere+patient+that+confers+no+vital+subordinate+and+active+influence+in+these+acts%3B+as+we+say%2C+the+apothecaries%E2%80%99+glass+heals+the+wound%2C+because+the+oil+in+the+glass+works+the+cure%2C+when+the+glass+does+actively+contribute+nothing+to+the+cure%3B+or+the+ass+makes+rich%2C+when+it+carries+the+gold+that+enriches+only%3B+this+sense+Antinomians+hold+forth+and+make+us+mere+patients+and+blocks+in+the+way+to+heaven%2C+and+this+sense+Jesuits%2C+especially+Martinez+de+Ripald%2C+falsely+charges+upon+Luther+and+Calvin%3B+and+the+Council+of+Trent%2C+inspired+with+the+same+lying+spirit%2C+says+the+same.+4.+The+fourth+%5Band+correct%5D+sense+is+that+grace+and+free-will+does+work+so+as+grace+is+the+principal%2C+first+inspiring+and+fountain+cause%3A+1.+It+being+a+new+supernatural+disposition+and+habit+in+the+soul%2C+Jn.+14%3A23%3B+1+Jn.+2%3A27%3B+3%3A9%3B+Jn.+4%3A14%3B+Isa.+44%3A3-4%3B+Eze.+36%3A26-27%3B+Dt.+30.6%3B+a+good+treasure+or+stock+of+grace%2C+Mt.+12%3A35%3B+Lk.+6%3A45.+And+also+actually+it+determines%2C+sweetly+inclines+and+stirs+the+will+to+these+acts%3B+yet+so+as+free-will+moves+actively%2C+freely%2C+and+confers+a+radical%2C+vital+and+subordinate+influence+and+is+not+a+mere+patient+in+all+these%2C+as+Antinomians+dream%2C+Ps.+119%3A32.+%E2%80%98I+will+run+the+way+of+thy+commandments%2C+when+thou+shall+enlarge+my+heart%2C%E2%80%99+Jn.+14%3A12%2C+%E2%80%98he+that+believeth+in+Me%2C+the+works+that+I+do%2C+he+shall+do%2C+and+greater+than+these%2C%E2%80%99+Mt.+12%3A50%2C+%E2%80%98He+that+does+the+will+of+my+heavenly+Father%2C+the+same+is+my+brother%2C%E2%80%99+etc.+1+Cor.+9%3A24%2C+%E2%80%98So+run+that+ye+may+obtain%2C%E2%80%99+Rev.+2%3A2%2C+%E2%80%98I+know+thy+works+and+thy+labour%2C%E2%80%99+1+Thess.+1%3A3%2C+%E2%80%98Remembering+without+ceasing+your+work+of+faith+and+labor+of+love%2C+and+patience+of+hope%3A%E2%80%99+1.+We+are+not+dead+in+supernatural+works%2C+and+mere+blocks%2C+Rom.+6%3A11%2C+%E2%80%98We+are+alive+unto+God+in+Jesus+Christ%2C%E2%80%99+Eph.+2%3A1%2C+%E2%80%98He+hath+quickened+us%2C%E2%80%99+Rev.+2%3A3%2C+%E2%80%98For+my+name%E2%80%99s+sake+thou+hast+laboured%2C+and+had+not+fainted%2C%E2%80%99+1+Cor.+15%3A58%2C+%E2%80%98Be+ye+steadfast%2C+unmoveable%2C+always+abundant+in+the+work+of+the+Lord.%E2%80%99+There+is+activity+in+the+Spirit+to+lust+against+the+flesh%2C+Gal.+5%3A17%3B+Rom.+7%3A15.+Nor+is+the+blessedness+of+the+saints+only+passive+in+receiving%3A+though+to+be+justified+and+receive+Christ%E2%80%99s+righteousness+be+the+fountain+blessedness%2C+Ps.+32%3A1%3B+Rom.+4%3A6-7%3B+Gal.+3%3A13.+But+the+Scripture+speaks+of+a+true+and+solid+blessedness+in+action%2C+Ps.+119%3A1%2C+%E2%80%98Blessed+are+the+undefiled+in+the+way%2C%E2%80%99+Isa.+56%3A2%2C+%E2%80%98Blessed+is+the+man+that+doth+this%2C%E2%80%99+Jm.+1%3A12%2C+%E2%80%98Blessed+is+the+man+that+endureth+temptation%2C%E2%80%99+Ps.+119%3A2%2C+%E2%80%98Blessed+are+they+that+keep+his+testimonies%2C%E2%80%99+Ps.+106%3A3%2C+%E2%80%98Blessed+are+they+that+keep+judgment%2C+Rev.+22%3A14%2C+%E2%80%98Blessed+are+they+that+do+his+commandments%2C+Mt.+5%2C+%E2%80%98Blessed+are+they+that+mourn%2C+that+hunger+and+thirst%3B%E2%80%98+Then+there+must+be+a+part+of+blessedness+in+sanctification%2C+as+in+justification%3B+though+the+one+be+the+cause%2C+the+other+the+effect.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%E2%80%A6+%28London%2C+1647%29%2C+pp.+464-65+%26+470-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec223b0914.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ec223b0914.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Assertion%201%3A%20In%20the%20first%20moment,the%20cause%2C%20the%20other%20the%20effect&amp;text=Assertion%201%3A%20In%20the%20first%20moment%20of%20our&amp;text=one%20be%20the%20cause%2C%20the%20other%20the%20effect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-e8d48aa7e6" data-kw="">
<blockquote><p>He that would read to profit must read and meditate. Meditation is the food of your souls, it is the very stomach and natural heat whereby spiritual truths are digested. A man shall as soon live without his heart, as he shall be able to get good by what he reads, without meditation.

Prayer, saith Bernard, without meditation, is dry and formal, and reading without meditation is useless and unprofitable. He that would be a wise, a prudent, and an able experienced statesman, must not hastily ramble and run over many cities, countries, customs, laws, and manners of people, without serious musing and pondering upon such things as may make him an expert statesman; so he that would get good by reading, that would complete his knowledge, and perfect his experience in spiritual things, must not slightly and hastily ramble and run over this book or that, but ponder upon what he reads, as Mary pondered the saying of the angel in her heart.

Lord! saith Austin [Augustine], the more I meditate on thee, the sweeter thou art to me; so the more you shall meditate on the following matter, the sweeter it will be to you. They usually thrive best who meditate most. Meditation is a soul-fattening duty; it is a grace-strengthening duty, it is a duty-crowning duty. Gerson calls meditation the nurse of prayer; Jerome calls it his paradise; Basil calls it the treasury where all the graces are locked up; Theophylact calls it the very gate and portal by which we enter into glory; and Aristotle, though a heathen, placeth felicity in the contemplation of the mind. You may read much and hear much, yet without meditation you will never be excellent, you will never be eminent Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), 1: 291.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c9abdfe15" data-kw="">
<blockquote><p>Grace breeds delight in God, and delight breeds Meditation. A duty wherein consists the essentials of Religion, and which nourisheth the very life blood of it; and that the Psalmist may shew how much the godly man is habituated and inured to this blessed work of Meditation, he subjoins, in his Law doth he meditate day and night; not but that there may be sometimes intermission; God allows time for our calling, he grants some relaxation, but when it is said, the godly man meditates day and night, the meaning is, frequently; he is much conversant in the duty.

‘Tis a command of God to pray without ceasing, 1 These. 5.17. The meaning is, not that we should be always praying (as the Euchites held) but that we should every day set some time apart for prayer; so Drusius and others interpret it. We read in the old Law it was called the continual sacrifice; not that the people of Israel did nothing else but sacrifice, but because they had their stated hours every morning and evening they offered, therefore it was called the continual sacrifice; thus the godly man is said to meditate day and night, that is, he is often at this work, he is no stranger to meditation. …

That a good Christian is a meditating Christian, Psalm 119.15. I will meditate in thy precepts, 1 Tim. 4.15. Meditate upon these things. Meditation is the chewing upon the truths we have heard; The beasts in the old Law that did not chew the cud were unclean; the Christian that doth not by meditation chew the cud, is to be accounted unclean. Meditation is like the watering of the seed, it makes the fruits of grace flourish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian on the mount: or, A treatise concerning meditation. Wherein the necessity, useful</cite>, ness, excellency of Meditation is at large discussed (London: Ralph Smith, 1657), pp 58-60.</span></figcaption>

<blockquote><p>2. Meditate on the omnipotency of God, who made all these creatures of nothing (Heb. xi. 3)—of his wisdom (Psal. cxlv. 15, 16), who feedeth so many infinite creatures through the universal world, maintaining all their lives, which he has given them, which surpasseth the wisdom of all the angels in heaven—and of his clemency and goodness, in feeding also his very enemies (Matt. v. 45, &amp;c.; Acts xiv. 17.)

3. Meditate how many sorts of creatures, as beasts, fish, and fowl, have lost their lives, to become food to nourish thee; and how God’s providence from remote places has brought all these portions together on thy table for thy nourishment; and how by these dead creatures he maintains thee in health and life.

4. Meditate that seeing thou hast so many pledges of God’s fatherly bounty, goodness, and mercy towards thee, as there are dishes of meat on thy table, O suffer not in such a place, so gracious a God to be abused by scurrility, ribaldry, or swearing; or thy fellow-brother, by disgraceful backbiting, taunting, or slandering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), p. 150.</span></figcaption>

<blockquote><p>First, it will be expedient that all the ministers, for conserving purity and concord of doctrine among themselves, meet together one certain day each week, for discussion of the Scriptures; and none are to be exempt from this without legitimate excuse. If anyone be negligent, let him be admonished. As for those who preach in the villages, throughout the Seigneury [feudal lordship], they are to be exhorted to come as often as they are able. For the rest, if they default an entire month, it is to be held to be very great negligence, unless it is a case of illness or other legitimate hindrance. If there appear difference of doctrine, let the ministers come together to discuss the matter. Afterwards, if need be, let them call the elders to assist in com posing the contention.</p></blockquote>

edbooksonline.com/topics/topics-by-subject/personal-godliness/spiritual-conferencing/the-church-of-scotland-on-the-spiritual-conferencing-of-elders/#:~:text=First%2C%20it%20will%20be%20expedient%20that,assist%20in%20com%20posing%20the%20contention&amp;text=First%2C%20it%20will%20be%20expedient%20that%20all%20the&amp;text=elders%20to%20assist%20in%20com%20posing%20the%20contention" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Of those who have never been brought to feel their unholy and guilty hearts… Such persons, from motives of this world, may be regular in their manners and in a visible attendance on many religious institutions. They are friends to every thing in religion but the experimental and evangelical part of it in the heart.—Having never seen their own unholy, guilty want of a supreme love of God, they depend for eternal safety, on their visible regularity and the general mercy of God through a Saviour.</p></blockquote>

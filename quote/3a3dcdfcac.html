</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1363c36e62" data-kw="">
<blockquote><p>ch. 2, ‘While some have thought all things were simultaneously made in both matter and form, others that it was through intervals of time’ Indeed, some of the holy fathers who have excellently examined the words and mysteries of God seem to have written seemingly conflicting things on this matter. Some indeed have taught that all things were created simultaneously in both matter and form, which Augustine seems to have thought. Others, however, have more strongly proved and asserted that a raw and formless prime matter, holding a mixture and confusion of the four elements, was created; yet afterward, through the intervals of six days [intervalla sex dierum], from that matter the kinds of corporeal things were formed according to their proper species. This judgment which Gregory, Jerome, Bede and many others commend and prefer, also seems to agree more closely with the Scripture of Genesis, from which the first knowledge of this matter was revealed to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Books of Sentences 2nd ed. (c. 1150; Florence: College of St. Bonaventura, 1916), vol. 1, bk. 2, dist. 12, ch. 2</cite>, pp. 358-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-aefa201547" data-kw="">
<blockquote><p>‘United to God’ is an ambiguous word: no creature is united to Him perfectly so as to be thereby what He is, God, in the created nature. Only Christ is united to Him hypostatically in his created nature. All are so far united to Him in natural being as that in Him they live and move and have their being: and the Nature of man is one sort of his image: All things are united to Him as effects to their constant efficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation... (London: 1684), pt. 1, ch. 1</cite>, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-c29931d9c8" data-kw="">
<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>

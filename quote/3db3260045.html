<main class="wrap"><figure class="quote" id="q-3db3260045" data-kw="">
<blockquote><p>In the Middle Ages Thomas not only asserted that as rational beings human beings can—without supernatural grace—know natural truths but also testifies that it is impossible for there to be “some knowledge which is totally false without any admixture of some truth” and in this connection appeals to the words of Beda and Augustine: “There is no false doctrine which does not at some time mix some truth with falsehoods.” The Reformed theologians were even better positioned to recognize this by their doctrine of common grace. By it they were protected, on the one hand, from the Pelagian error, which taught the sufficiency of natural theology and linked salvation to the sufficiency of natural theology, but could, on the other hand, recognize all the truth, beauty, and goodness that is present also in the pagan world. Science, art, moral, domestic, and societal life, etc., were derived from that common grace and acknowledged and commended with gratitude. As a rule this operation of common grace, though perceived in the life of morality and intellect, society and state, was less frequently recognized in the religions of pagans. In the latter context the Reformed only spoke of natural religion, innate and acquired, but the connection between this natural religion and the [pagan] religions was not developed. The religions were traced to deception or demonic influences. However, an operation of God’s Spirit and of his common grace is discernible not only in science and art, morality and law, but also in the religions. Calvin rightly spoke of a “seed of religion,” a “sense of divinity.” Founders of religion, after all, were not impostors or agents of Satan but men who, being religiously inclined, had to fulfill a mission to their time and people and often exerted a beneficial influence on the life of peoples. The various religions, however mixed with error they may have been, to some extent met people’s religious needs and brought consolation amidst the pain and sorrow of life. What comes to us from the pagan world are not just cries of despair but also expressions of confidence, hope, resignation, peace, submission, patience, etc. All the elements and forms that are essential to religion (a concept of God, a sense of guilt, a desire for redemption, sacrifice, priesthood, temple, cult, prayer, etc.), though corrupted, nevertheless do also occur in pagan religions. Here and there even unconscious predictions and striking expectations of a better and purer religion are voiced. Hence Christianity is not only positioned antithetically toward paganism; it is also paganism’s fulfillment. Christianity is the true religion, therefore also the highest and purest; it is the truth of all religions. What in paganism is the caricature, the living original is here. What is appearance there is essence here. What is sought there can be found here. Christianity is the explanation of “ethnicism.” Christ is the Promised One to Israel and the desire of all the Gentiles. Israel and the church are elect for the benefit of humankind. In Abraham’s seed all the nations of the earth will be blessed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: Prolegomena</cite>, trans. John Bolt, and John Vriend (Grand Rapids, MI: Baker Academic, 2003), 1.319–20.</span></figcaption>

3/bavinck-antithesis-common-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64accecdb3" data-kw="">
<blockquote><p>That all the members of the catholic Church are united in this profession [of the Christian faith] is very true; but this is not all, they are bound to more than this, viz. to the exercise of the same specifical ordinances, to subjection to the same discipline, as also to love to one another, and where it is possible, to the celebrating together of the same numerical worship. And in any of these, to make any differences, is a breach of that union, that ought to be among the members of the catholic visible Church. … For when Christ has instituted that every church meeting together, and every member of the catholic Church, should exercise the same specifical ordinances, is not this a Church union, or union of Churches? And let it then be considered, that if every member of the Church catholic may be a member of any or every particular church, where providence may cast him (being rightly qualified thereunto), having right first to the same specifical ordinances as a member of the catholic, and then to the same numerical ordinances, where he comes and finds them (as some of his own way [that is congregationalism] do grant, and cannot well be denied), then the denial of such a person to join in those numerical ordinances [such as congregationalists practice] is a breach of that union and love which ought to be between the members of the catholic Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr</cite>, [John] Owen… (London, 1657), ch. 5; pp. 93-4</span></figcaption>

<blockquote><p>The particle wde, ‘here’, if referred to time, notes during Moses’s economy, while the Levitical law lasted; if it refer to place, it notes Jerusalem in the land of Canaan, where the temple was: in that habitation of the Israelitish church the Levitical priests were not only as to their nature and persons withering and decaying, ceasing to be on earth, though they had the honor to decimate their brethren, but as to their order and office, mortal, they were no better than the tithed and blessed by them, in prospect of death. Aaron himself, the first of the order, died, and so did all his successors, as well as Israel.</p></blockquote>

<blockquote><p>We see then how that the tithes which were contained in the law were especially for the people of Israel. And yet notwithstanding the tithes were very common amongst the Heathen, even for kings, princes and noblemen. We see likewise by profane histories, that they were also exacted, and that in some countries they exacted more than in other some… But be as be may, this word ‘Tithe’, or ‘Tenth’, has been a common and ordinary amongst all nations. And all Princes and great men as I have already said, sithens [since] the Gospel was received, have bestowed part of the tithes towards the maintenance of the Ministers of the word, as is very great reason, according to the saying of Saint Paul, “That they which ministered at the Altar in the old Testament were maintained, that they which at this day sacrifice unto God after a more excellent manner,” (1 Cor. 9:9-13) that is, which win souls unto Him, to make of them sacrifices unto his majesty, that they should also be as well provided for and maintained: and although God has not qualified how nor by what manner of revenue they should be maintained, yet is there a law for it. Now then, sith [since] God has been known through the preaching of the Gospel, a Christian order and law has been made for the giving and bestowing of one part of tithes [as opposed to other uses, such as giving to the poor, etc.]. And herein we may see the deceit of the Pope and of his shavelings [def: contemptuous epithet for a tonsured ecclesiastic, i.e. monk]: for, when they handle the law of tithes in their Canons, they take it as if it were transferred to them after that Jesus Christ had put an end unto the priesthood of Levi. All these are very leasings [lies], falsifying the holy scripture, and wickedly corrupting the same. For we see to the contrary, as has been before showed, that it is long ago sithence [since], that it was not known what the paying of tithes was by virtue of the law of Moses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.</p></blockquote>

<blockquote><p>Therefore the nature of the human race, generated from the flesh of the one transgressor, if it is self-sufficient for fulfilling the law and for perfecting righteousness, ought to be sure of its reward, that is, of everlasting life, even if in any nation or at any former time faith in the blood of Christ was unknown to it. For God is not so unjust as to defraud righteous persons of the reward of righteousness… Man’s nature, indeed, was created at first faultless and without any sin; but that nature of man in which every one is born from Adam, now wants the Physician, because it is not sound. … This grace, however, of Christ, without which neither infants nor adults can be saved, is not rendered for any merits, but is given gratis, on account of which it is also called grace. ‘Being justified,’ says the apostle, ‘freely through His blood.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Nature and Grace, Against Pelagius</cite>, (415), 2, 3, 4 in NPNF1, 5: 122.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d25d2c5fd9" data-kw="">
<blockquote><p>But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.</p></blockquote>

<blockquote><p>From that which has been said two things may be gathered: 1. How the Covenant made with Adam, called by some divines the Covenant of Nature, agrees and differs from the Covenant of Grace. They agree in a general consideration of: [1] The author, which is God only wise, most holy, our supreme and absolute sovereign. 2. The matter of the covenant, which is a commandment and promise of reward. 3. The persons contracting or covenanting, which are God and man. 4. The subject not differenced by special respects, for the Law was given and [the] Gospel [was] revealed to man. 5. The form of administration, because to both covenants is annexed a restipulation. 6. The end, viz. the blessedness of man, and the glory of God manifested in his wisdom, bounty and goodness. 7. As Adam in the state of Innocency was made able to fulfill the Covenant made with him: so is the Covenant of Grace written in the hearts of them that are heirs of the promise in Christ. They differ: 1. In the special consideration of the author, cause and foundation of the Covenants. God gave his Law to Adam as bountiful and gracious to his creature entire and perfect, but in strict justice requiring obedience, promising a reward and denouncing punishment. But the Covenant of Grace he made as a loving Father in Jesus Christ, of his mere grace promising to receive them into favor, that sincerely and unfeignedly turn unto Him. The creation of man and integrity of human nature is the foundation of the former Covenant: but the redemption of man by Christ is the foundation of the Covenant of Grace. 2. In the form of sanction. In the Covenant of Nature there is no mediator: but the Covenant of Grace is made in Christ, in whom God has made us accepted. The Covenant of Nature was not promised before it was promulgated: but the Covenant of Grace was first promised, and long after promulgated and established or ratified in the blood of his Son. 3. In the special matter of the Covenants, and that both in respect of the promise and stipulation. For the Covenant of Nature promised life, but not righteousness: but in the Covenant of Grace God promises to tread Satan under the feet, and to write his Law in the hearts of them that are heirs of salvation. That Covenant promises life to them that perfectly obey, but not remission or forgiveness of any, even the least iniquity. But this promises forgiveness of sins and life eternal to the penitent sinner believing in Christ, and embracing the free promise of mercy. In that, life eternal is promised as the reward of justice: in this, life and glory as the reward of free and rich grace and mercy. To him that works, the wages is of debt; but to him that believes the reward is of grace. In that God as a Creator does exact his right of man pure: but in this as a loving Father He does offer Himself to the sinner smitten with the conscience of his sin. In that, life eternal and most blessed is promised, but only animal, to be enjoyed in Paradise, or continuance in that good estate wherein he was set at first of the rich bounty of God: but in the other, translation out of ignominy and death into eternal happiness and glory in Heaven. In the Covenant of Nature perfect obedience is exacted, so that if there be but the least failing in any jot or tittle, and that but once, a man can never be justified thereby, nor can the breach be made up by any repentance: but in the Covenant of Grace obedience is required, repentance admitted, and sincerity accepted. If a man sin and go astray, if he return unfeignedly, he shall be received into favor. In the Covenant of Nature obedience and works were commanded as the cause of life and justification: in the Covenant of Grace, faith is required as the instrumental cause of remission and salvation, obedience as the qualification of the party justified, and the way leading to everlasting blessedness. The object of obedience in the Covenant of Nature was God: in the Covenant of Grace, God in Christ. 4. They differ in the special consideration of the subject. The first Covenant was given to man pure, perfect, entire and sound, able to do what God required: but the Covenant following was made with man a sinner, miserable and by nature the child of wrath. And so that was a Covenant of friendship, this of firm reconciliation. 5. In the special and peculiar respect of the end. For the former Covenant was made for the praise of God’s wisdom, goodness, bounty and justice. But the Covenant of Grace was made to declare and set forth the riches of God’s grace and mercy. In it the wisdom, goodness, power and justice of God is more illustrious than in the former: and the mercy, long-suffering and rich grace of God is greatly magnified, which did not appear or shine forth at all in the former. 6. And in their effects and properties. For not the Covenant of Nature, but of Grace does exclude boasting. By the Covenant of Nature Adam was not advanced above the condition of an honorable servant. In the Covenant of Grace, man by nature the child of wrath is made the child of God by grace and adoption. The Covenant of Nature was neither the last nor everlasting, but being first made way for a better, and being broken was antiquated or disannulled to our singular comfort: but the Covenant of Grace shall continue firm and immovable forevermore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 24-26</span></figcaption>

he Covenant of Grace, God in Christ. 4. They differ in the special consideration of the subject. The first Covenant was given to man pure, perfect, entire and sound, able to do what God required: but the Covenant following was made with man a sinner, miserable and by nature the child of wrath. And so that was a Covenant of friendship, this of firm reconciliation. 5. In the special and peculiar respect of the end. For the former Covenant was made for the praise of God’s wisdom, goodness, bounty and justice. But the Covenant of Grace was made to declare and set forth the riches of God’s grace and mercy. In it the wisdom, goodness, power and justice of God is more illustrious than in the former: and the mercy, long-suffering and rich grace of God is greatly magnified, which did not appear or shine forth at all in the former. 6. And in their effects and properties. For not the Covenant of Nature, but of Grace does exclude boasting. By the Covenant of Nature Adam was not advanced above the condition of an honorable servant. In the Covenant of Grace, man by nature the child of wrath is made the child of God by grace and adoption. The Covenant of Nature was neither the last nor everlasting, but being first made way for a better, and being broken was antiquated or disannulled to our singular comfort: but the Covenant of Grace shall continue firm and immovable forevermore.”

nt+of+Nature+was+not+promised+before+it+was+promulgated%3A+but+the+Covenant+of+Grace+was+first+promised%2C+and+long+after+promulgated+and+established+or+ratified+in+the+blood+of+his+Son.+3.+In+the+special+matter+of+the+Covenants%2C+and+that+both+in+respect+of+the+promise+and+stipulation.+For+the+Covenant+of+Nature+promised+life%2C+but+not+righteousness%3A+but+in+the+Covenant+of+Grace+God+promises+to+tread+Satan+under+the+feet%2C+and+to+write+his+Law+in+the+hearts+of+them+that+are+heirs+of+salvation.+That+Covenant+promises+life+to+them+that+perfectly+obey%2C+but+not+remission+or+forgiveness+of+any%2C+even+the+least+iniquity.+But+this+promises+forgiveness+of+sins+and+life+eternal+to+the+penitent+sinner+believing+in+Christ%2C+and+embracing+the+free+promise+of+mercy.+In+that%2C+life+eternal+is+promised+as+the+reward+of+justice%3A+in+this%2C+life+and+glory+as+the+reward+of+free+and+rich+grace+and+mercy.+To+him+that+works%2C+the+wages+is+of+debt%3B+but+to+him+that+believes+the+reward+is+of+grace.+In+that+God+as+a+Creator+does+exact+his+right+of+man+pure%3A+but+in+this+as+a+loving+Father+He+does+offer+Himself+to+the+sinner+smitten+with+the+conscience+of+his+sin.+In+that%2C+life+eternal+and+most+blessed+is+promised%2C+but+only+animal%2C+to+be+enjoyed+in+Paradise%2C+or+continuance+in+that+good+estate+wherein+he+was+set+at+first+of+the+rich+bounty+of+God%3A+but+in+the+other%2C+translation+out+of+ignominy+and+death+into+eternal+happiness+and+glory+in+Heaven.+In+the+Covenant+of+Nature+perfect+obedience+is+exacted%2C+so+that+if+there+be+but+the+least+failing+in+any+jot+or+tittle%2C+and+that+but+once%2C+a+man+can+never+be+justified+thereby%2C+nor+can+the+breach+be+made+up+by+any+repentance%3A+but+in+the+Covenant+of+Grace+obedience+is+required%2C+repentance+admitted%2C+and+sincerity+accepted.+If+a+man+sin+and+go+astray%2C+if+he+return+unfeignedly%2C+he+shall+be+received+into+favor.+In+the+Covenant+of+Nature+obedience+and+works+were+commanded+as+the+cause+of+life+and+justification%3A+in+the+Covenant+of+Grace%2C+faith+is+required+as+the+instrumental+cause+of+remission+and+salvation%2C+obedience+as+the+qualification+of+the+party+justified%2C+and+the+way+leading+to+everlasting+blessedness.+The+object+of+obedience+in+the+Covenant+of+Nature+was+God%3A+in+the+Covenant+of+Grace%2C+God+in+Christ.+4.+They+differ+in+the+special+consideration+of+the+subject.+The+first+Covenant+was+given+to+man+pure%2C+perfect%2C+entire+and+sound%2C+able+to+do+what+God+required%3A+but+the+Covenant+following+was+made+with+man+a+sinner%2C+miserable+and+by+nature+the+child+of+wrath.+And+so+that+was+a+Covenant+of+friendship%2C+this+of+firm+reconciliation.+5.+In+the+special+and+peculiar+respect+of+the+end.+For+the+former+Covenant+was+made+for+the+praise+of+God%E2%80%99s+wisdom%2C+goodness%2C+bounty+and+justice.+But+the+Covenant+of+Grace+was+made+to+declare+and+set+forth+the+riches+of+God%E2%80%99s+grace+and+mercy.+In+it+the+wisdom%2C+goodness%2C+power+and+justice+of+God+is+more+illustrious+than+in+the+former%3A+and+the+mercy%2C+long-suffering+and+rich+grace+of+God+is+greatly+magnified%2C+which+did+not+appear+or+shine+forth+at+all+in+the+former.+6.+And+in+their+effects+and+properties.+For+not+the+Covenant+of+Nature%2C+but+of+Grace+does+exclude+boasting.+By+the+Covenant+of+Nature+Adam+was+not+advanced+above+the+condition+of+an+honorable+servant.+In+the+Covenant+of+Grace%2C+man+by+nature+the+child+of+wrath+is+made+the+child+of+God+by+grace+and+adoption.+The+Covenant+of+Nature+was+neither+the+last+nor+everlasting%2C+but+being+first+made+way+for+a+better%2C+and+being+broken+was+antiquated+or+disannulled+to+our+singular+comfort%3A+but+the+Covenant+of+Grace+shall+continue+firm+and+immovable+forevermore.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+24-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46b0f1e685.html&amp;via=5Solas" target="_blank" <blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>

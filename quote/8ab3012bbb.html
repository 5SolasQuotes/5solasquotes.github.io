<main class="wrap"><figure class="quote" id="q-8ab3012bbb" data-kw="">
<blockquote><p>§51. 7. And for the next ceremony, the name and form of an ‘altar’: no doubt it is a thing indifferent whether the table stand this way or that way: and the primitive Churches used commonly the names of ‘sacrifice’, and ‘altar’, and ‘priest’, and I think, lawfully. For my part, I will not be he that shall condemn them. But they used them but metaphorically, as Scripture itself does, Heb. 13:10, 15-16; Rom. 12:1; Eph. 5:2; Phil. 2:17 &amp; 4:18. All believers are called ‘priests’, and their service, ‘sacrifices’, 1 Pet. 2:5, 9; Rev. 1:6 &amp; 5:10 &amp; 20:6. I conceive that the dislike of these things in England (the form and name of an ‘altar’, and the rails about it) was not as if they were simply evil, but: 1. because they were illegal innovations, forced on the churches without law or any just authority; and 2. because the way of those times did cause men to suspect that somewhat worse was intended to be brought in by such preparatives, especially when the ministers were cast out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 417</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>

</figure><figure class="quote" id="q-9298e19dcf" data-kw="">
<blockquote><p>Anointing the sick with oil was held in that [flagship Independent] Church of Arnheim [Netherlands], as a standing ordinance for church members, (for others [of other churches] had no right to that ordinance), as laying on of hands was a standing ordinance for church officers: There was a writing amongst them in many hands, proving it to be so, and there were some cases propounded, with what oil the sick members of the Church were to be anointed, and there was a resolution of the case, namely with olive oil. A copy of this writing some ministers of the [Westminster] Assembly have perused, and one of them has it amongst his papers in the country. [Thomas] Mr. Goodwin did anoint a gentlewoman (whose name I conceal) when she was sick, and she recovered after it (they say).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-55ed48034e" data-kw="">
<blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</span></figcaption>

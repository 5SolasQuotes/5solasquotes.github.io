<main class="wrap"><figure class="quote" id="q-33e23ef31c" data-kw="">
<blockquote><p>If Adam had stood, and performed all things [of the law], he would even have merited, but I. not by condign merit, as if either his person, or his works would have been worthy of so great a reward. There is no creature, though perfect, who can merit this way in the presence of God. 1) Because we owe everything to God. Lk. 17:10. 2) No one is able to bring obligation upon God since he would be El Shaddai, God the sufficient one. Gen. 17. See Job 22: 2. 3) Whatever good things a man has, it is from God. Phil. 2:13; Ac. 17:28; 1 Cor. 4:7. 4) Nothing is given proportionately between the work of creatures, and the enjoyment of God.

II. It would not even have been by congruent merit, certainly because of the extraordinary gifts, which he had received from God. 1) Because God is not a respecter of persons, whom he made able by the particular gifts. 2) Because there was no grace in the case of Adam, the one building favour, when everything he would have was from God. Merit, therefore, was to its extent by the covenant, following the stipulation of the covenant, by the mere good pleasure of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrina Foederum sive Systema Theologiae</cite>, (Amsterdam: Abraham van Someren, 1691), pp 259–60. Quoted in and translated by Harrison Perkins, Catholicity and the Covenant of Works: James Ussher and the Reformed Tradition, Oxford Studies in Historical Theology (New York: Oxford University Press, 2020), pp 105-06.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

asquotes.github.io%2Fquote%2F33e23ef31c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33e23ef31c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/01/johannes-braun-on-covenantal-merit-in-relation-to-adam/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7761df9a8" data-kw="">
<blockquote><p>But 2. let us understand that according to works signifies an analogy or measure of good works and of evil, as it may fitly be understood, and we also have elsewhere interpreted. There is then an ambiguity in the word ‘analogy,’ or ‘proportion,’ and we must distinguish between a proportion causal, meritorious, and a proportion-conditional. A causal, meritorious proportion of works and reward is when greater or lesser works are the cause or merit of a greater or lesser reward. A conditional proportion is when greater or lesser works are not the cause or merit, but only the position of the condition under which a greater or lesser reward is to be had. In evil works or sins, there are both proportions, causal or meritorious, and conditional of the works to the reward. Of good works, this proposition is false: ‘According to whose proportion eternal life is promised, that is meritorious of eternal life.’ For here is understood not a causal, but a conditional proportion, etc. For they have not the conditions of merit properly so called; but they are the position (or performing) of the condition on which God does promise and distribute the rewards of eternal life and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellarmine Castigated, ‘On Justification’</cite>, bk. 5, ch. 3, pp. 1245-46 in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 405</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

sonline.com/on-merit/#:~:text=But%202.%20let%20us%20understand%20that,rewards%20of%20eternal%20life%20and%20glory&amp;text=But%202.%20let%20us%20understand%20that%20according%20to&amp;text=distribute%20the%20rewards%20of%20eternal%20life%20and%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1406c0bbfb" data-kw="">
<blockquote><p>Spiritual life is infused into no one dead in sin except on the ground of the merit of Christ’s death. The life that Christ has merited by his death is everlasting, for it corresponds to that life that Adam should have obtained had he continued in his integrity.

And it flows from the Spirit of life in Christ risen from the dead, for as Christ himself having once died, dies no more, so neither shall the second death reign over anyone who, by the Spirit of life in Christ, is raised from the first. For these reasons, we admit no regeneration through the blood of Christ that, although sufficient for everlasting life, may possibly end in eternal death. Whoever is born of the Spirit immediately enters into the kingdom of heaven—first, as a state of grace; afterwards, as a state of glory. The Holy Spirit knows nothing of any other regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 136.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-54aab31bd5" data-kw="">
<blockquote><p>Nay more than this, we deny not but in some sense this reward may be said to proceed of justice. For howsoever originally and in itself we hold it comes from God’s free bounty and mercy, who might have required the work of us without all promise of reward (for, as I said, we are his creatures and owe our being unto Him), yet in regard He has covenanted with us, and tied Himself by his Word and promise to confer such a reward, the reward now in a sort proves to be an act of justice, namely of justitia promissi [justice of promise] on God’s part, not of merit on ours: even as in forgiving our sins (which in itself all men know to be an act of mercy) He is said to be ‘faithful and just’, 1 Jn. 1:9, namely in the faithful performance of his promise; for promise (we know) once made, among honest men is accounted a due debt. But this argues no more any worthiness of equality in the work toward the obtaining of the reward than if a promise of a kingdom were made to one if he should take up a straw, it would follow thence that the lifting up of a straw were a labor or a work worth a kingdom; howsoever, he that should so promise were bound to give it. Thus was Moses careful to put the children of Israel in mind touching the land of Canaan (Dt. 9:5, which was a type of our eternal habitation in Heaven), that it was a land of promise, and not of merit, which God gave them to possess, not for their righteousness, or for their upright heart, but that He might perform the word which He swore unto their fathers, Abraham, Isaac, and Jacob. Whereupon the Levites, in the Book of Nehemiah, say in their prayer to God: ‘Thou madest a covenant with Abraham, to give to his seed the land of the Canaanites, and hast performed thy words, because Thou art just,’ (Neh. 9:8) that is, true and faithful in keeping thy promise. Now because the Lord has made a like promise of the crown of life to them that love Him, St. Paul sticks not in like manner to attribute this also to God’s justice; ‘Henceforth’ (says he, 2 Tim. 4:8) ‘is laid up for me a crown of righteousness, which the Lord the righteous Judge shall give me at that day; and not to me only, but to all them that love his appearing.’ Upon which St. Bernard most sweetly, as he is wont: Est ergo quam Paulus expectat corona iustitiae; sed iustitiae Dei, non suae: iustum quippe est, ut reddat quod debet; debet autem quod pollicitus est. ‘There is therefore a crown of righteousness which Paul looks for; but it is of God’s righteousness, not his own: it being a righteous thing with God to give what he owes; now he owes what he has engaged himself to by promise.’ Lastly, for the word ‘merit’, it is not the name we so much scruple at, as the thing now-a-days to be understood thereby: otherwise we confess the name might be admitted, if taken in the large and more general sense, for any work having relation to a reward to follow it, or whereby a reward is quocunque modo [in whatever way] obtained; in a word, as the correlate indifferent either to merces gratiae or iustitiae, ‘the reward of grace or of justice’. For thus the Fathers used it; and so might we have done still, if some of us had not grown too proud, and mistaken it. Since we think it better and safer to disuse it, even as physicians are wont to prescribe their patients recovered of some desperate disease, not to use any more [of] that meat or diet which they find to have caused it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-mede.html">Joseph Mede</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … (d. 1638; London: 1672), Discourse 34 on Neh. 13:14, pp. 175-76</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Nay more than this, we deny not but in some sense this reward may be said to proceed of justice. For howsoever originally and in itself we hold it comes from God’s free bounty and mercy, who might have required the work of us without all promise of reward (for, as I said, we are his creatures and owe our being unto Him), yet in regard He has covenanted with us, and tied Himself by his Word and promise to confer such a reward, the reward now in a sort proves to be an act of justice, namely of justitia promissi [justice of promise] on God’s part, not of merit on ours: even as in forgiving our sins (which in itself all men know to be an act of mercy) He is said to be ‘faithful and just’, 1 Jn. 1:9, namely in the faithful performance of his promise; for promise (we know) once made, among honest men is accounted a due debt. But this argues no more any worthiness of equality in the work toward the obtaining of the reward than if a promise of a kingdom were made to one if he should take up a straw, it would follow thence that the lifting up of a straw were a labor or a work worth a kingdom; howsoever, he that should so promise were bound to give it. Thus was Moses careful to put the children of Israel in mind touching the land of Canaan (Dt. 9:5, which was a type of our eternal habitation in Heaven), that it was a land of promise, and not of merit, which God gave them to possess, not for their righteousness, or for their upright heart, but that He might perform the word which He swore unto their fathers, Abraham, Isaac, and Jacob. Whereupon the Levites, in the Book of Nehemiah, say in their prayer to God: ‘Thou madest a covenant with Abraham, to give to his seed the land of the Canaanites, and hast performed thy words, because Thou art just,’ (Neh. 9:8) that is, true and faithful in keeping thy promise. Now because the Lord has made a like promise of the crown of life to them that love Him, St. Paul sticks not in like manner to attribute this also to God’s justice; ‘Henceforth’ (says he, 2 Tim. 4:8) ‘is laid up for me a crown of righteousness, which the Lord the righteous Judge shall give me at that day; and not to me only, but to all them that love his appearing.’ Upon which St. Bernard most sweetly, as he is wont: Est ergo quam Paulus expectat corona iustitiae; sed iustitiae Dei, non suae: iustum quippe est, ut reddat quod debet; debet autem quod pollicitus est. ‘There is therefore a crown of righteousness which Paul looks for; but it is of God’s righteousness, not his own: it being a righteous thing with God to give what he owes; now he owes what he has engaged himself to by promise.’ Lastly, for the word ‘merit’, it is not the name we so much scruple at, as the thing now-a-days to be understood thereby: otherwise we confess the name might be admitted, if taken in the large and more general sense, for any work having relation to a reward to follow it, or whereby a reward is quocunque modo [in whatever way] obtained; in a word, as the correlate indifferent either to merces gratiae or iustitiae, ‘the reward of grace or of justice’. For thus the Fathers used it; and so might we have done still, if some of us had not grown too proud, and mistaken it. Since we think it better and safer to disuse it, even as physicians are wont to prescribe their patients recovered of some desperate disease, not to use any more [of] that meat or diet which they find to have caused it.”

— Joseph Mede, The Works, … (d. 1638; London: 1672), Discourse 34 on Neh. 13:14, pp. 175-76">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNay+more+than+this%2C+we+deny+not+but+in+some+sense+this+reward+may+be+said+to+proceed+of+justice.+For+howsoever+originally+and+in+itself+we+hold+it+comes+from+God%E2%80%99s+free+bounty+and+mercy%2C+who+might+have+required+the+work+of+us+without+all+promise+of+reward+%28for%2C+as+I+said%2C+we+are+his+creatures+and+owe+our+being+unto+Him%29%2C+yet+in+regard+He+has+covenanted+with+us%2C+and+tied+Himself+by+his+Word+and+promise+to+confer+such+a+reward%2C+the+reward+now+in+a+sort+proves+to+be+an+act+of+justice%2C+namely+of+justitia+promissi+%5Bjustice+of+promise%5D+on+God%E2%80%99s+part%2C+not+of+merit+on+ours%3A+even+as+in+forgiving+our+sins+%28which+in+itself+all+men+know+to+be+an+act+of+mercy%29+He+is+said+to+be+%E2%80%98faithful+and+just%E2%80%99%2C+1+Jn.+1%3A9%2C+namely+in+the+faithful+performance+of+his+promise%3B+for+promise+%28we+know%29+once+made%2C+among+honest+men+is+accounted+a+due+debt.+But+this+argues+no+more+any+worthiness+of+equality+in+the+work+toward+the+obtaining+of+the+reward+than+if+a+promise+of+a+kingdom+were+made+to+one+if+he+should+take+up+a+straw%2C+it+would+follow+thence+that+the+lifting+up+of+a+straw+were+a+labor+or+a+work+worth+a+kingdom%3B+howsoever%2C+he+that+should+so+promise+were+bound+to+give+it.+Thus+was+Moses+careful+to+put+the+children+of+Israel+in+mind+touching+the+land+of+Canaan+%28Dt.+9%3A5%2C+which+was+a+type+of+our+eternal+habitation+in+Heaven%29%2C+that+it+was+a+land+of+promise%2C+and+not+of+merit%2C+which+God+gave+them+to+possess%2C+not+for+their+righteousness%2C+or+for+their+upright+heart%2C+but+that+He+might+perform+the+word+which+He+swore+unto+their+fathers%2C+Abraham%2C+Isaac%2C+and+Jacob.+Whereupon+the+Levites%2C+in+the+Book+of+Nehemiah%2C+say+in+their+prayer+to+God%3A+%E2%80%98Thou+madest+a+covenant+with+Abraham%2C+to+give+to+his+seed+the+land+of+the+Canaanites%2C+and+hast+performed+thy+words%2C+because+Thou+art+just%2C%E2%80%99+%28Neh.+9%3A8%29+that+is%2C+true+and+faithful+in+keeping+thy+promise.+Now+because+the+Lord+has+made+a+like+promise+of+the+crown+of+life+to+them+that+love+Him%2C+St.+Paul+sticks+not+in+like+manner+to+attribute+this+also+to+God%E2%80%99s+justice%3B+%E2%80%98Henceforth%E2%80%99+%28says+he%2C+2+Tim.+4%3A8%29+%E2%80%98is+laid+up+for+me+a+crown+of+righteousness%2C+which+the+Lord+the+righteous+Judge+shall+give+me+at+that+day%3B+and+not+to+me+only%2C+but+to+all+them+that+love+his+appearing.%E2%80%99+Upon+which+St.+Bernard+most+sweetly%2C+as+he+is+wont%3A+Est+ergo+quam+Paulus+expectat+corona+iustitiae%3B+sed+iustitiae+Dei%2C+non+suae%3A+iustum+quippe+est%2C+ut+reddat+quod+debet%3B+debet+autem+quod+pollicitus+est.+%E2%80%98There+is+therefore+a+crown+of+righteousness+which+Paul+looks+for%3B+but+it+is+of+God%E2%80%99s+righteousness%2C+not+his+own%3A+it+being+a+righteous+thing+with+God+to+give+what+he+owes%3B+now+he+owes+what+he+has+engaged+himself+to+by+promise.%E2%80%99+Lastly%2C+for+the+word+%E2%80%98merit%E2%80%99%2C+it+is+not+the+name+we+so+much+scruple+at%2C+as+the+thing+now-a-days+to+be+understood+thereby%3A+otherwise+we+confess+the+name+might+be+admitted%2C+if+taken+in+the+large+and+more+general+sense%2C+for+any+work+having+relation+to+a+reward+to+follow+it%2C+or+whereby+a+reward+is+quocunque+modo+%5Bin+whatever+way%5D+obtained%3B+in+a+word%2C+as+the+correlate+indifferent+either+to+merces+gratiae+or+iustitiae%2C+%E2%80%98the+reward+of+grace+or+of+justice%E2%80%99.+For+thus+the+Fathers+used+it%3B+and+so+might+we+have+done+still%2C+if+some+of+us+had+not+grown+too+proud%2C+and+mistaken+it.+Since+we+think+it+better+and+safer+to+disuse+it%2C+even+as+physicians+are+wont+to+prescribe+their+patients+recovered+of+some+desperate+disease%2C+not+to+use+any+more+%5Bof%5D+that+meat+or+diet+which+they+find+to+have+caused+it.%E2%80%9D%0A%0A%E2%80%94+Joseph+Mede%2C+The+Works%2C+%E2%80%A6+%28d.+1638%3B+London%3A+1672%29%2C+Discourse+34+on+Neh.+13%3A14%2C+pp.+175-76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54aab31bd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54aab31bd5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-merit/#:~:text=Nay%20more%20than%20this%2C%20we%20deny,they%20find%20to%20have%20caused%20it&amp;text=Nay%20more%20than%20this%2C%20we%20deny%20not%20but&amp;text=diet%20which%20they%20find%20to%20have%20caused%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.</p></blockquote>

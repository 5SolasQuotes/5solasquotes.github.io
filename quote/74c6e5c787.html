<main class="wrap"><figure class="quote" id="q-74c6e5c787" data-kw="">
<blockquote><p>2. I grant the whole, and yet nothing is concluded against us. For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644) | pt. 1, p. 299</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>16. If the power of the keys be given to believers, as believers [as congregationalists say], because Christ is their King, Priest and Prophet, and all things are theirs, Paul, Apollo, Cephas, the world?

1. It is asked, if none have the power of the keys, but believers, and if all acts pastoral of preaching, binding and loosing, excommunicating performed by unbelieving ministers and professors be not hence made null, as performed à non habentibus potestatem, as if Turks and pagans had performed these? We think they must be null.

2. We think children baptized by unbelieving ministers not baptized.

3. An unbelieving pastor not essentially a pastor.

4. If, because Christ is given to the elect, and all things are theirs, and so all ministerial power of the keys, it is questioned, if amongst these all things given to the believers, we may not include the magistrate’s sword, the king’s power, the master’s power over the servant, the captain’s power over the soldier, so that by that same reason there be no kings, no judges, no masters, no captains, save only believers, we see not how this follows not, as well as that the power of the keys, and all things are given to believers, because Christ is given to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 18, p. 276</span></figcaption>

<blockquote><p>The analogy which I understand is to hold between the Jewish and Christian Church is this: As profane persons were forbidden to enter into the Temple because of the sacramental and typical holiness thereof (for the Temple was a type of Christ), so profane persons are now much more to be kept back from the sacrament of the Lord’s Supper, which has more of sacramental signification, mystery and holiness in it than the temple of Jerusalem had, and whereby more ample evangelical promises are set forth and sealed unto us. And as profane persons might of old come into the court of the gentiles, and there hear the Word preached in Solomon’s porch (where both Christ and his apostles did preach, Jn. 10:23; Acts 3:11; 5:12, which porch was in the utmost court, that is, the court of the gentiles: of which elsewhere out of Josephus), but might not come into the court of Israel, nor have communion in the sacrifices: so profane, obstinate sinners are to be excluded for their impiety from the Church-communion of saints, though they may hear the Word, as heathens also may do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 9. Whether in the Jewish Church there was any suspension or exclusion of profane, scandalous, notorious sinners, from partaking in the public ordinances with the rest of the children of Israel in the temple 41, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

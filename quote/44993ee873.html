<main class="wrap"><figure class="quote" id="q-44993ee873" data-kw="against implicit faith">
<blockquote><p>This is “implicit faith” (which they say suffices for the salvation of the laity if they believe what the church believes, although they may not know what the church believes, or what it ought to believe, or what church is to be believed). This is called “the faith of Carbonarius” because being asked what he believed, he answered, “What the church believes.” Again being asked what the church believed, he said, “What I believe.” The design of the Romanists is to keep the people in ignorance that the yoke of traditions and of all kinds of errors and superstitions may the more easily be placed upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.3–4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-199882bcc3" data-kw="faith response to call">
<blockquote><p>For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise. The Scriptures often introduce this colloquy: “I will say, It is my people; and they shall say, The Lord is my God” (Hos. 2:23; Zech. 13:9; cf. Ps. 27:8; Jer. 3:22; Rom. 8:15, 16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.7.1</span></figcaption>

</figure><figure class="quote" id="q-763c635995" data-kw="">

</figure><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a> › <a href="../topics/faith/faith-as-instrument/faith-receives-christ.html">Faith receives Christ</a></span></div>

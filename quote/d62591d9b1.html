<blockquote><p>Since these principles which were demonstrated above concerning the origin of kings and other rulers have been established, it follows that they are not legitimate rulers who by force or deceit usurp that authority which by no right belongs to them. Of such tyrants there are two kinds: for some, in violation of the laws laid down and received, usurp tyranny over their fellow-citizens, as Julius Caesar under the feigned title of perpetual dictator took possession of the Roman commonwealth; and many other tyrants, particularly in Greece, crushed the liberty of their country.

Others however, not content with that absolute power which they rightfully acquire over their own people, extend their dominions at the cost of their neighbours’ liberty and increase them by means of fortified boundary-lines; for this reason have monarchies ever since the origin of the world achieved such wide dominions; of this the sacred writings offers us an example in Nimrod, as we also see that in this way the Israelites were generally oppressed by the neighbouring peoples.

Hence since those tyrants had no lawful right over the people of God, I maintain that the Israelites were free not merely to disobey the sinful commands of these peoples but even to set a just defense against their unjust violence, and that therefore the leaders of the tribes (of Israel) did a grievous wrong whenever they omitted to oppose the foreign foe with united courage and strength in defense of the liberty of their country, provided that the occasion for opposing him presented itself; for it admits of no doubt that even private individuals are bound by the law of both God and men to succour with all their power their country when oppressed and in distress, especially however when its religion and liberty are simultaneously endangered. For it was a true remark which the captive pirate dared to utter when he was dragged before Alexander; he declared that he differed in no way from (the king) but that the latter plundered the world with a multitude of ships whereas he did so with but a single vessel.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-699f3edb9c" data-kw="">
<blockquote><p>To be taken without consent from my home and friends; to lose my liberty; to undergo all those assaults on my personality which modern psychotherapy knows how to deliver; to be re-made after some pattern of “normality” hatched in a Viennese laboratory to which I never professed allegiance; to know that this process will never end until either my captors have succeeded or I grown wise enough to cheat them with apparent success – who cares whether this is called Punishment or not? That it includes most of the elements for which any punishment is feared – shame, exile, bondage, and years eaten by the locust – is obvious. …

Of all tyrannies a tyranny sincerely exercised for the good of its victims may be the most oppressive. It may be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth.

Their very kindness stings with intolerable insult. To be “cured” against one’s will and cured of states which we may not regard as disease is to be put on a level with those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals. But to be punished, however severely, because we have deserved it, because we “ought to have known better”, is to be treated as a human person made in God’s image.

In reality, however, we must face the possibility of bad rulers armed with a Humanitarian theory of punishment. … And when they are wicked· the Humanitarian theory of punishment will put in their hands a finer instrument of tyranny than wickedness ever had before. For if crime and disease are to be regarded as the same thing, it follows that any state of mind which our masters choose to call “disease” can be treated as crime; and compulsorily cured. It will be vain to plead that states of mind which displease government need not always involve moral turpitude and do not therefore always deserve forfeiture of liberty.

For our masters will not be using the concepts of Desert and Punishment but those of disease and cure. We know that one school of psychology already regards religion as a neurosis. When this particular neurosis becomes inconvenient to government, what is to hinder government from proceeding to “cure” it? Such “cure” will, of course, be compulsory; but under the Humanitarian theory it will not be called by the shocking name of Persecution. No one will blame us for being Christian, no one will hate us, no one will revile us.

The new Nero will approach us with the silky manners of a doctor, and though all will be in fact as compulsory as the tunica molesta or Smithfield or Tyburn, all will go on within the unemotional therapeutic sphere where words like “right” and “wrong” or “freedom” and “slavery” are never heard. And thus when the command is given, every prominent Christian in the land may vanish overnight into Institutions for the Treatment of the Ideologically Unsound, and it will rest with the expert gaolers to say when (if ever) they are to re-emerge. But it will not be persecution. Even if the treatment is painful, even if it is life-long, even if it is fatal, that will be only a regrettable accident; the intention was purely therapeutic.</p></blockquote>

<blockquote><p>2. This [God’s injunction to obey civil magistrates] condemns the clergy of Rome, that exempt themselves from all princes’ authority, whereas God has said, ‘Let every soul be subject to the higher powers’ [Rom. 13:1]: If they have souls they must be subject. But how do they exempt themselves? … 2. By the Donation of Constantine; but its not in the power of princes so to do: They [princes] may exempt them [clergy] from tribute [taxes], if they will, as Pharoah took not the priests’ lands to gage for Corn; but to exempt them from subjection: they cannot. This were to make themselves wiser then God, who has put them under their authority, yea, the too much indulgence and favor of emperors, has been the bane of the Church, and helped up the Pope into his stirrup; Therefore its wisdom in them to hold their authority which God has given them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. This [God’s injunction to obey civil magistrates] condemns the clergy of Rome, that exempt themselves from all princes’ authority, whereas God has said, ‘Let every soul be subject to the higher powers’ [Rom. 13:1]: If they have souls they must be subject. But how do they exempt themselves? … 2. By the Donation of Constantine; but its not in the power of princes so to do: They [princes] may exempt them [clergy] from tribute [taxes], if they will, as Pharoah took not the priests’ lands to gage for Corn; but to exempt them from subjection: they cannot. This were to make themselves wiser then God, who has put them under their authority, yea, the too much indulgence and favor of emperors, has been the bane of the Church, and helped up the Pope into his stirrup; Therefore its wisdom in them to hold their authority which God has given them.”

<blockquote><p>3… Yet I intend not to handle the case of invasion, to show in what cases only an invasion of another nation in a hostile manner is lawful: I am from all my books, that I cannot consult with casuists in that point… Had God given me life, I intended a large Treatise concerning the Usurpation of the Government of England, and the unlawfulness of the invasion of Scotland [by Cromwell]; but my collections being lost and taken away, they must die with me; I hope more able hands will write against the invasion, though they cannot fight against the invaders.</p></blockquote>

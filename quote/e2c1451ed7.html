<blockquote><p>But then it was said—You are a church established by law. If you wish to be free in your procedure from the control of the civil power, separate yourselves from the State. So long as you receive the emoluments of the State, you must obey its Courts. Nay, it was answered. Never, at least, did we so understand the terms of our connection with the State to be. The Church’s labours and work in return for the State’s livings—such we ever understood the terms of the connection to be—not the Church’s liberties, and subjection to her only King, the price of the State’s livings!

Surely, it was argued, these cannot be the terms on which the Scottish Church, after the long struggles and sufferings of her sons for the freedom and independence of her spiritual government, was at length established by law. The Westminster Confession of Faith is the law of Scotland, as well as of her Church, with those words in it—“The Lord Jesus, as King and Head of his Church, hath therein appointed a government in the hands of Church officers, distinct from the civil magistrate.</p></blockquote>

<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>

<blockquote><p>First, the state and the Church are essentially different in regard to their origin. The state, or the ordinance of civil government, owes its origin to God as the universal Sovereign and Ruler among the nations.

The Church, as the visible society of professing Christians in the world, with its outward provision of authority and order and government, owes its origin to Christ as Mediator. This difference is a most important one, as it involves and implies other differences characteristic of the two bodies. The civil government is an ordinance of God, founded not in grace, but in nature, and therefore intended for human society as subsisting in all nations, whether Christian or not, and carrying with it the authority and sanction of a Divine appointment wherever human society is found.

As an appointment of God, in His character of universal Sovereign, the authority of the state, and the duty of subjects in regard to it, are entirely independent of the Christianity of rulers or subjects; and the rights and responsibilities of the two parties are as valid and as binding in heathen as in Christian lands.

On the other hand, the Church, as an ordinance of Christ, is founded in grace, not in nature, and is limited to those nations where Christianity is actually professed. As an appointment of the Mediator, in His character of special Ruler or Head over His own people, it carries with it His authority, and is restricted in its jurisdiction to those who profess their subjection to Him, and join themselves to the Christian society which He has established.

Different in their origin, and in the source from which they derive their authority, the state and the Church are thus based on distinct and separate foundations, and are entirely independent of each other. Nor is this fundamental difference cancelled or overruled by the fact that the state or civil government is now put under the dominion of Christ in the character of Mediator, as well as the Church.

It is true that the civil governments of the world, like everything else, are subordinated to the Redeemer, that He may make use of them for promoting His own mediatorial purposes, and that Christ is not only “Head of the Church,” but “Head over all things to the Church.” But this authority of Christ over the civil governments of the earth is a thing superinduced upon their original character as the ordinance of God, in His capacity of universal Sovereign.

It does not in the least affect or supersede that character. The state, although it is now delegated to Christ to be under His authority for the good of His Church, has not ceased to be what it originally was—an appointment of God as the God of nature—any more than the creation of God has ceased to be the creation of God, because it also is now subordinated to the dominion of Christ for the interests of His people. In their origin, and in the basis on which they rest, the civil society and the Christian society are two ordinances essentially independent and distinct. …

In the first place, there is a foundation laid for a friendly alliance between the Church and state, in the fact of the twofold character which Christ sustains of Head of the Church, and also of Head over all things to the Church.

That civil government is an ordinance of God, as the God of nature and not of grace, is a most important truth, and one that lies at the foundation of the essential difference between the state and the Church, which owes its origin to Christ as Mediator. But it is no less true that God has handed over to Christ, as Mediator, the ordinance of civil government, to be employed by Him in subordination to the great purposes of His mediatorial reign.

Among “the all things” over which Christ is now made Head to the Church, is to be numbered the ordinance of magistracy or civil government in this world,—a truth which seems unquestionably to draw with it the conclusion that, in the hands of Christ, and under His control, the civil government of nations may be made instrumental in advancing the interests and promoting the well-being of the Church. …

It is an ordinance of God, both good in itself and appointed for good. The very end for which it has been placed under subjection to the Messiah is, that it may be instrumental, under Him, for securing the spiritual interests and promoting the welfare of His kingdom of grace; and it approaches very nearly to the assertion that Christ has failed in the object for which He has been set over it as Head, to assert that the state, from its nature or constitution, cannot in any manner be converted into a willing and conscious instrument for promoting the prosperity of the Church, and advancing the cause of Christianity. In the common subordination to Christ which the body politic and body ecclesiastical alike underlie, and in the object which is to be promoted by that subordination, we see the foundation laid for a friendly alliance and co-operation between Church and state.

Distinct and separate in their essential character, they are yet brought into one through their mutual subjection to the same Divine Head, and their mutual subserviency to the same gracious purpose. Fundamentally unlike in their character on earth, they are resolved into a higher unity through means of one Head in heaven. The Church and the state, because equally the servants of Christ, are helps made and meet for each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 97-98, 112-13.</span></figcaption>

which+they+derive+their+authority%2C+the+state+and+the+Church+are+thus+based+on+distinct+and+separate+foundations%2C+and+are+entirely+independent+of+each+other.+Nor+is+this+fundamental+difference+cancelled+or+overruled+by+the+fact+that+the+state+or+civil+government+is+now+put+under+the+dominion+of+Christ+in+the+character+of+Mediator%2C+as+well+as+the+Church.%0A%0AIt+is+true+that+the+civil+governments+of+the+world%2C+like+everything+else%2C+are+subordinated+to+the+Redeemer%2C+that+He+may+make+use+of+them+for+promoting+His+own+mediatorial+purposes%2C+and+that+Christ+is+not+only+%E2%80%9CHead+of+the+Church%2C%E2%80%9D+but+%E2%80%9CHead+over+all+things+to+the+Church.%E2%80%9D+But+this+authority+of+Christ+over+the+civil+governments+of+the+earth+is+a+thing+superinduced+upon+their+original+character+as+the+ordinance+of+God%2C+in+His+capacity+of+universal+Sovereign.%0A%0AIt+does+not+in+the+least+affect+or+supersede+that+character.+The+state%2C+although+it+is+now+delegated+to+Christ+to+be+under+His+authority+for+the+good+of+His+Church%2C+has+not+ceased+to+be+what+it+originally+was%E2%80%94an+appointment+of+God+as+the+God+of+nature%E2%80%94any+more+than+the+creation+of+God+has+ceased+to+be+the+creation+of+God%2C+because+it+also+is+now+subordinated+to+the+dominion+of+Christ+for+the+interests+of+His+people.+In+their+origin%2C+and+in+the+basis+on+which+they+rest%2C+the+civil+society+and+the+Christian+society+are+two+ordinances+essentially+independent+and+distinct.+%E2%80%A6%0A%0AIn+the+first+place%2C+there+is+a+foundation+laid+for+a+friendly+alliance+between+the+Church+and+state%2C+in+the+fact+of+the+twofold+character+which+Christ+sustains+of+Head+of+the+Church%2C+and+also+of+Head+over+all+things+to+the+Church.%0A%0AThat+civil+government+is+an+ordinance+of+God%2C+as+the+God+of+nature+and+not+of+grace%2C+is+a+most+important+truth%2C+and+one+that+lies+at+the+foundation+of+the+essential+difference+between+the+state+and+the+Church%2C+which+owes+its+origin+to+Christ+as+Mediator.+But+it+is+no+less+true+that+God+has+handed+over+to+Christ%2C+as+Mediator%2C+the+ordinance+of+civil+government%2C+to+be+employed+by+Him+in+subordination+to+the+great+purposes+of+His+mediatorial+reign.%0A%0AAmong+%E2%80%9Cthe+all+things%E2%80%9D+over+which+Christ+is+now+made+Head+to+the+Church%2C+is+to+be+numbered+the+ordinance+of+magistracy+or+civil+government+in+this+world%2C%E2%80%94a+truth+which+seems+unquestionably+to+draw+with+it+the+conclusion+that%2C+in+the+hands+of+Christ%2C+and+under+His+control%2C+the+civil+government+of+nations+may+be+made+instrumental+in+advancing+the+interests+and+promoting+the+well-being+of+the+Church.+%E2%80%A6%0A%0AIt+is+an+ordinance+of+God%2C+both+good+in+itself+and+appointed+for+good.+The+very+end+for+which+it+has+been+placed+under+subjection+to+the+Messiah+is%2C+that+it+may+be+instrumental%2C+under+Him%2C+for+securing+the+spiritual+interests+and+promoting+the+welfare+of+His+kingdom+of+grace%3B+and+it+approaches+very+nearly+to+the+assertion+that+Christ+has+failed+in+the+object+for+which+He+has+been+set+over+it+as+Head%2C+to+assert+that+the+state%2C+from+its+nature+or+constitution%2C+cannot+in+any+manner+be+converted+into+a+willing+and+conscious+instrument+for+promoting+the+prosperity+of+the+Church%2C+and+advancing+the+cause+of+Christianity.+In+the+common+subordination+to+Christ+which+the+body+politic+and+body+ecclesiastical+alike+underlie%2C+and+in+the+object+which+is+to+be+promoted+by+that+subordination%2C+we+see+the+foundation+laid+for+a+friendly+alliance+and+co-operation+between+Church+and+state.%0A%0ADistinct+and+separate+in+their+essential+character%2C+they+are+yet+brought+into+one+through+their+mutual+subjection+to+the+same+Divine+Head%2C+and+their+mutual+subserviency+to+the+same+gracious+purpose.+Fundamentally+unlike+in+their+character+on+earth%2C+they+are+resolved+into+a+higher+unity+through+means+of+one+Head+in+heaven.+The+Church+and+the+state%2C+because+equally+the+servants+of+Christ%2C+are+helps+made+and+meet+for+each+other.% <blockquote><p>Reformed Christians have often been divided on whether or not the apostle Paul was referring to Nero in Romans 13. The Revd Samuel Simms of Loughbrickland Reformed Presbyterian Church answered in the negative (arguably, Simms goes too far in some things that he says, though we agree that the passage does not refer to Nero as a persecuting tyrant):

The Seceding view is based, I am fully persuaded, on a misinterpretation of Rom. xiii. 1-7. That passage states that there is “no power but of God.” What does the Seceder say of this? He says, that every power that exists is of God! What does the Covenanter say of it? He says that if a power is not a God-power, it is no power, but a tyranny? …

Let us read the passage in dispute. What sort of a power does Paul describe? Seven things are said about it. (1) It is not a terror to good works. (2) It is a terror to the evil. (3) It praises what is good. (4) It is (or he is) the minister of God for good. (5) It (or he) beareth not the sword in vain. (6) It (or he) is a revenger to execute wrath upon him that doeth evil. (7) Men are to be subject to it (or to him) for conscience sake.

Now, can all this be applied to Nero? Of course, it cannot. Nero was a monstrous butcher, who murdered his own mother and his own wife, and who made flambeaux of the Christians to illuminate his gardens: how could he be the minister of God for good to men? How could Elagabalus, acting the tom-fool the whole day long among his Syrian dancing wenches, be the minister of God for good to men? Ah, no; it may not be, it cannot be, that such a precious gem as Rom. xiii. 1-7, should be allowed to sparkle on the harlot brow of the selfish, cruel, monstrous, Divine Right theory!

But again – how will the notion of Seceders, that the government of Nero was just as much an ordinance of God as was that of David, the man after God’s own heart, agree with other portions of the Divine Word? In Hosea viii. 4, it is stated – “They have set up kings, but not by me: they have made princes, and I knew it not.” In Ezek. xxi. 27, we have the threat – “I will overturn, overturn, overturn it,” &amp;c.; but on the existence theory principle, how can we acquiesce in this decision or turn this prediction into a prayer; for the power to be overturned was, on Seceding principles, as much the ordinance of God as any other power that could be! It is well known that the fox is a cunning and destructive animal; and yet, the Omniscient Redeemer, plainly and bluntly, called Herod “that fox” (Luke xiii. 32). The Apostle Paul calls the Roman magistrates at Corinth, “the unjust;” now, if they were the unjust at Corinth, how could they be the ordinance of God for good to man at Rome?

And once more; are not Christians commanded to wrestle “against the rulers of the darkness of this world, against spiritual wickedness in high places?” Who are “rulers of the darkness of this world?” Evil angels, of course, primarily; but undoubtedly also, wicked rulers who legislate by evil or satanic principles. It is not, therefore, true as Seceders virtually teach, that “whatever is is right,” as regards civil government. No, for we must take unto ourselves the whole armour of God and fight manfully against all devilish principles in high places; and this we are to do, not by swearing to devilish principles, nor by voting for men to swear to support devilish principles; but by taking up a position of manful, peaceable, but determined protest and dissent with regard to all devilish principles.</p></blockquote>

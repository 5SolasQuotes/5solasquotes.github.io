<main class="wrap"><figure class="quote" id="q-15e919d249" data-kw="">
<blockquote><p>1. Christ is a doer and fulfiller of the covenant of works most exactly in all points, both the command, and the curse and penalty of the Covenant, is satisfied by him; this is works, and this was the condition required upon his part, Heb. 10. 7, “Then said I, lo I come, in the volume of the book it is written of me, to do your will, O God.” Gal. 3. 13, “Christ has redeemed us from the curse of the Law, being made a curse for us.”

2. Christ as a doer and obedient fulfiller of the Law, has a reward in justice by the promise of this covenant: For (I humbly conceive) he had his reward of debt, and merit, having paid a condign price to the justice of God; therefore his reward is due to him, by commutative Justice, Phil. 2. 7, 8, “But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of man; And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the Cross; wherefore God also hath highly exalted him,” and is craved by him, Joh. 17. 4, 5, “I have glorified you on earth, I have finished the work which you gaves me to do. And now, O Father, glorify me with your own self.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-gillespie.html">Patrick Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ark of the Covenant Opened: Or, A Treatise of the Covenant of Redemption Between God and Christ, As the Foundation of the Covenant of Grace</cite>, (London, 1677), 61 [spelling and punctuation modernized].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02254d7d48" data-kw="">
<blockquote><p>1. The law of Moses was, in the first place, a re-enactment of the covenant of works. A covenant is simply a promise suspended upon a condition. The covenant of works, therefore, is nothing more than the promise of life suspended on the condition of perfect obedience. The phrase is used as a concise and convenient expression of the eternal principles of justice on which God deals with rational creatures, and which underlie all dispensations, the Adamic, Abrahamic, Mosaic and Christian. Our Lord said to the lawyer who asked what he should do to inherit eternal life, “What is written in the law? How readest thou? And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thy-self. And he said unto him, Thou hast answered right, this do and thou shalt live,” Luke 10:26–28. This is the covenant of works. It is an immutable principle that where there is no sin there is no condemnation, and where there is sin there is death. This is all that those who reject the gospel have to fall back upon. It is this principle which is rendered so prominent in the Mosaic economy as to give it its character of law. Viewed under this aspect it is the ministration of condemnation and death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 57–58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-20e6ca868f" data-kw="">
<blockquote><p>This obedience of the Son was superior to all the justice of the Law. For Adam also, if he willed, could have remained in the righteousness of the Law. And to the degree that the curse was owed for every sin of the elect, to the same degree he had to fulfill all righteousness without any complaint, not even all the Angels were able to do this. Therefore, this obedience of the Son was not only regarding the righteousness of the Law, such as Adam received in creation, and such as the Law required of him, but also it exceeded the righteousness of all the Angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ad Galatas Notae</cite>, (Geneva, 1578), 57.</span></figcaption>

</figure><figure class="quote" id="q-1b06862aa9" data-kw="">
<blockquote><p>The other covenant or testament here supposed, whereunto that whereof the Lord Christ was the mediator is preferred, is none other but that which God made with the people of Israel on mount Sinai. So it is expressly affirmed, verse 9: “The covenant which I made with your fathers in the day when I took them by the hand to lead them out of the land of Egypt.” This was that covenant which had all the institutions of worship annexed unto it, Hebrews 9:1-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 76</span></figcaption>

</figure><figure class="quote" id="q-4b7c17ab77" data-kw="merit">
<blockquote><p>The natural covenant is not so called because it conferred nothing above nature and condition (which man had from creation), but because it depended on the powers of nature and the obedience which according to them he ought to render. Nor, if a proportion is not granted between the prescribed duty and the blessing of heavenly life, does it follow that such a promise cannot have a place. It is gratuitously and falsely supposed that the promises of God are regulated according to the proportion of our merit. On the contrary, they depend upon God’s will and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.6.10</span></figcaption>

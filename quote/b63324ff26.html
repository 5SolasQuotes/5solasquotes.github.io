<main class="wrap"><figure class="quote" id="q-b63324ff26" data-kw="">
<blockquote><p>Had the Psalms been scattered throughout the books of the Old Testament, instead of being collected into one Book, then it might have been fairly inferred that the people of God were left to sing all the songs contained in the sacred writings— the songs of Moses, Deborah, Hannah, &amp;c., as well as those composed by David, Asaph, and others, and now found in the Psalter.

But infinite Wisdom in preparing a Psalm Book for His Church, thought proper to leave out the song of Moses at the Red Sea, of Deborah, of Hannah, and other songs, and who will say that it was a fault, and that God ought to have incorporated these songs with the “Sepher Tehillim,” or Book of Praises?

How can Mr. C. [Thomas Smyth] say, as he often does in substance, that the Church is as much hound to sing those Divine songs which have been left out of the Psalter, as those contained in it? If so, why were they left out? Their omission was surely not an oversight in the Deity. It was His will that they should be omitted, and no man can say with propriety that they should not, and that the Church was, and is still bound to employ them in Divine worship, notwithstanding their exclusion from that standard of praise which God himself has provided.

It may be the songs of Moses, Deborah, and others, not found in the Book of Psalms, were sung in the stated worship of God previous to the compilation of that Book, but after the compilation was made, and they were omitted, it was no longer proper to employ them in the regular instituted service of the Temple-—else where was the propriety of God’s “taking order” in selecting a system of Psalmody, if, after the selection was made, every one had a right to add to it what ever he thought proper, and even those very songs which Infinite Wisdom thought wise to omit?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter IV. Psalmody – Divine Authority in Evangelical Guardian</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0fa7d1695a" data-kw="">
<blockquote><p>…you say we ‘are not bound, or rather have no warrant to use the Psalms in meter or with tunes.’ To this I answer, that we are bound to sing is evident, both from Scripture-precept and example; and that we are thereby warranted to have the Psalms in meter with tunes is as clear, as both are necessary, at least convenient in the propriety of our language, for the use of singing: I deny not, but prose may be sung; but seeing it is certain that our language has no such exact prosody, as either to render it easily measurable, or the measures distinguishable by points and accents; nay that the import of the music or tonici accentus, in the Hebrew, qui olim moderabantur harmoniam musicam, is so far now lost and unknown, that if we were now to sing the Hebrew Psalms, we could not make use of them: Pray, Sir, leave us but the way of meter in place of points and accents until you teach us better grammar: whereas you hint, that we ‘may have all David‘s instruments as well as tunes’, if you could learn us to sing without tunes, as we may well do without organs, I shall not contend, but seeing that David did, no doubt, invent and introduce these his instruments, as well by the special direction of the Spirit, as he did all other things anent the service of the Temple, and that the Primitive Christians, worshipping more in the simplicity of the Spirit than in outward shows, canebant assâ voce non […], I think you may now put up your pipes and spare the cost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered, pp. 277-278. MacWard was the protege of Samuel Rutherford.</span></figcaption>

</figure><figure class="quote" id="q-06d5cd28d0" data-kw="">
<blockquote><p>Why then will they [the Church of Rome] reprehend our singing? ‘Be ye’ (sayeth he) ‘fulfilled with the spirit, speaking amongst yourselves in Psalmes, Hymns and spiritual songs, singing and making melody unto the Lord in your hearts.’ You hear what the apostle of Christ willeth us to do. ‘My songs’ (sayth the prophet David) ‘will I make of thy name, O thou most highest.’ Whosoever therefore rebuketh us for singing of Psalms, the same doth withstand the Scriptures and holy Ghost. But if they themselves do allow their own singings, why then disallow they ours?… Yea, they themselves thus write: ‘Concerning the singing of Hymns, we have the example of our Savior, and of the apostles.’ Be not therefore any longer obstinate, the Psalms of David we sing, never go about to carp our singing. Many other things there be, which in us they do blame.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-evans.html">Lewis Evans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Castle of Christianity detecting the long erring estate, as well of the Roman Church, as of the Bishop of Rome</cite>, … (London, 1568), ‘A Plain Demonstration of the Erring Estate of the Roman Church’, pp. 49-50. Evans (fl. 1574). This book was dedicated to Queen Elizabeth.</span></figcaption>

<blockquote><p>What need is there, then, for adding to God’s book of praise a hymn-book of our own making? And what is gained when the addition is made? Nothing is gained in the way of spirituality, or beauty, or power. Nothing is gained but spiritual loss. Nor is a hymn ever used without loss; for the best hymn that ever was written by man on a Scriptural subject is excelled by a psalm, or perhaps by many psalms on the same subject. For example, the pretty hymn written by the papist Cardinal Newman, beginning

Lead kindly light amid the encircling gloom,

is infinitely inferior to the 5th, and 25th, and 27th, and 36th, and 86th, and 119th, and 143d, and many other psalms on the same subject. Yet this hymn appears in the hymn-books of the Established, the United Presbyterian, and the Free Churches. Every time the papist’s hymn is sung by any of their congregations, it is preferred for the time being and for the purpose in hand to a divine hymn, which is of course as much superior as God’s Word is to man’s. It is nowhere said in Scripture that the entrance of John Henry Newman’s words gives light, yet “cultured” congregations use them in preference to the perfect Word on which the blessing depends, and while they are but pleasing themselves they think they are doing God service and receiving his blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

is infinitely inferior to the 5th, and 25th, and 27th, and 36th, and 86th, and 119th, and 143d, and many other psalms on the same subject. Yet this hymn appears in the hymn-books of the Established, the United Presbyterian, and the Free Churches. Every time the papist’s hymn is sung by any of their congregations, it is preferred for the time being and for the purpose in hand to a divine hymn, which is of course as much superior as God’s Word is to man’s. It is nowhere said in Scripture that the entrance of John Henry Newman’s words gives light, yet “cultured” congregations use them in preference to the perfect Word on which the blessing depends, and while they are but pleasing themselves they think they are doing God service and receiving his blessing.”

— James Dick, Hymns and hymn-books in Original Covenanter">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+need+is+there%2C+then%2C+for+adding+to+God%E2%80%99s+book+of+praise+a+hymn-book+of+our+own+making%3F+And+what+is+gained+when+the+addition+is+made%3F+Nothing+is+gained+in+the+way+of+spirituality%2C+or+beauty%2C+or+power.+Nothing+is+gained+but+spiritual+loss.+Nor+is+a+hymn+ever+used+without+loss%3B+for+the+best+hymn+that+ever+was+written+by+man+on+a+Scriptural+subject+is+excelled+by+a+psalm%2C+or+perhaps+by+many+psalms+on+the+same+subject.+For+example%2C+the+pretty+hymn+written+by+the+papist+Cardinal+Newman%2C+beginning%0A%0ALead+kindly+light+amid+the+encircling+gloom%2C%0A%0Ais+infinitely+inferior+to+the+5th%2C+and+25th%2C+and+27th%2C+and+36th%2C+and+86th%2C+and+119th%2C+and+143d%2C+and+many+other+psalms+on+the+same+subject.+Yet+this+hymn+appears+in+the+hymn-books+of+the+Established%2C+the+United+Presbyterian%2C+and+the+Free+Churches.+Every+time+the+papist%E2%80%99s+hymn+is+sung+by+any+of+their+congregations%2C+it+is+preferred+for+the+time+being+and+for+the+purpose+in+hand+to+a+divine+hymn%2C+which+is+of+course+as+much+superior+as+God%E2%80%99s+Word+is+to+man%E2%80%99s.+It+is+nowhere+said+in+Scripture+that+the+entrance+of+John+Henry+Newman%E2%80%99s+words+gives+light%2C+yet+%E2%80%9Ccultured%E2%80%9D+congregations+use+them+in+preference+to+the+perfect+Word+on+which+the+blessing+depends%2C+and+while+they+are+but+pleasing+themselves+they+think+they+are+doing+God+service+and+receiving+his+blessing.%E2%80%9D%0A%0A%E2%80%94+James+Dick%2C+Hymns+and+hymn-books+in+Original+Covenanter&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F605c180a05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/605c180a05.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/08/21/james-dick-on-the-spiritual-poverty-of-uninspired-hymns/" rel="noopener" target="_blank">Read

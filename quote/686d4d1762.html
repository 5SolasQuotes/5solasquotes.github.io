<main class="wrap"><figure class="quote" id="q-686d4d1762" data-kw="">
<blockquote><p>…in the form of ordination, when the words and many circumstances are undetermined. Imposition of hands is a Iawful sign: and so is doing it by a writing, or by mere words, without that imposition; some receive it kneeling, some standing; some by one form of words, some by another, etc. some from one ordainer some from many, etc. And none of these determined by institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07f8ba90e2" data-kw="">
<blockquote><p>XII. As an instrument, He uses his word (Rom. 10:16), and that of both the Law and the Gospel, in different ways: by the former, indeed, preparing the way for the efficacy of vocation (Gal. 3:24), and by the latter, perfecting the same in the called (Rom. 1:16). XIII. This is also sometimes extraordinary, and God acts beyond the accustomed manner, so that what He is accustomed to effect together with the Word, He produces without its help or assistance, administering the matter by the revelation and efficacy of his Spirit alone (Acts 9:3-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation trans. AI (Leiden: Marcus, 1620)</cite>, p. 3</span></figcaption>

</figure><figure class="quote" id="q-bea6e2c2af" data-kw="">
<blockquote><p>Nor will it follow that it is intrinsically unlawful for a synod of New England [who were congregationalists] to send 24 gracious youths understanding in the language, ordain them pastors by laying on of hands of the elders, and by fasting and praying, instruct them to go and act as pastors among the savages, preaching and baptizing; and their warrant is Acts 13; and here are pastors without certain flocks [contra congregationalism]. If any (Acts 13) say [that] the Spirit gives a special command there, and names Saul and Barnabas, but its not so here: I answer, there is without question something extraordinary in Acts 13, nor are we with Seekers (too much fortified in their way by our [congregationalist] Brethren’s doctrine) to wait for the Lord’s naming from heaven John, Thomas, to be preachers in such a place. But to me: 1. The nearness to the savages, 2. The knowledge of their language (as I suppose), 3. Their weak desire, or the professed not hating of the Gospel [by the savages], were equivalent to a command from heaven, ‘Go preach to the Americans’, and that in the capacity as proper pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum… (1658)</cite>, pp. 421-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

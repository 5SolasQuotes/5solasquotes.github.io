<main class="wrap"><figure class="quote" id="q-11f90e96e5" data-kw="">
<blockquote><p>Of Exhortation, that we manfully set ourselves not only to repress such lusts, but quite also to root them out. Now the old man is mortified, 1. By that firm and constant purpose of changing our life, which is effectually begun in our first repentance, and daily ought to be renewed, and extended to all new emergencies.

2. By the virtue of Christ’s death applied to us by faith, whence our old man is said to be crucified with Christ; and it may be rightly added, with the same nails, that Christ was crucified with. For Christ was fastened unto the Cross, partly because of the guilt of our sins; partly out of the love of the Father to us, that we might be saved: partly out of Christ’s own love to us, whereby he was willing to lay down his life for us. And by the earnest meditation of these things, the power of sin is most diminished in us.

3. By the power of the Holy Spirit, to whom we ought to give up ourselves, in the use of all the means ordained of God, whereby he useth to put forth his powerful working.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XXXIII, pp 205-06.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification.html">Sanctification</a></span></div>

2. By the virtue of Christ’s death applied to us by faith, whence our old man is said to be crucified with Christ; and it may be rightly added, with the same nails, that Christ was crucified with. For Christ was fastened unto the Cross, partly because of the guilt of our sins; partly out of the love of the Father to us, that we might be saved: partly out of Christ’s own love to us, whereby he was willing to lay down his life for us. And by the earnest meditation of these things, the power of sin is most diminished in us.

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Mortification of Sin in Believers, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

</figure><figure class="quote" id="q-15a0b0e7a3" data-kw="mortification vivification sanctification renovation image">
<blockquote><p>Rather, it is used strictly for a real and internal renovation of man by which God delivers the man planted in Christ by faith and justified (by the ministry of the word and the efficacy of the Spirit) more and more from his native depravity and transforms him into his own image. Thus with separation from the world and sin and consecration to God, which is the killing of the old man and the vivifying of the new.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.1.2b</span></figcaption>

</figure><figure class="quote" id="q-f12b10fe99" data-kw="">
<blockquote><p>There is no imagination wherewith man is besotted, more foolish, none so pernicious, as this, — that persons not purified, not sanctified, not made holy in their life, should afterwards be taken into that state of blessedness which consists in the enjoyment of God. Neither can such persons enjoy God, nor would God be a reward to them. — Holiness indeed is perfected in heaven: but the beginning of it is invariably confined to this world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Holy Spirit, p. 575 (Goold edition)</span></figcaption>

</figure><figure class="quote" id="q-45a6a3f53c" data-kw="imperfect sanctification against perfectionism">
<blockquote><p>It is well known that this is enumerated also among the many heads of the Pelagian hydra—that he contended that the believer can in this life live without sin and so can perfectly fulfill the law and be constituted in a state of sinlessness. Augustine thus describes this error: “The Pelagians go so far as to say that the life of the righteous in this world has no sin, and from these in this mortal existence the church of Christ is made up, so as to be wholly without wrinkle and without blemish, as if it was not the church of Christ, which throughout the world cries out to the Lord, Forgive us our debts.” Is sanctification so perfect in this life that believers can fulfill the law absolutely? We deny against the Romanists and Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.2.1–2</span></figcaption>

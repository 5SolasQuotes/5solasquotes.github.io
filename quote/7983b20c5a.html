<main class="wrap"><figure class="quote" id="q-7983b20c5a" data-kw="">
<blockquote><p>Quest. Whether Christ loved all, and gave himself for all, because here the apostle saith, He loved me, and gave himself for me’?

Ans. 1. I answer briefly, first, that Christ’s loving and giving himself was parallel in even lines with God’s love and gift, John vi. 37, 39; for Christ gives himself for none but those which God hath first given him. Christ had his commission, and he came to do his Father’s will, not his own, John vi. 38, and will save all whom his Father hath given unto him; as it is John xvii. 6, ‘Thine they were, thou gavest them me.’ Those that the Father gives in election, Christ redeems, and by redemption saves; for redemption, in regard of efficacy, is no larger than God’s election. Therefore he joins, ‘Christ loved me, and gave himself for me.’ His love is only to those whom God gave him, for he looks upon all he died for as they were in his Father’s love. There are a company in the world whom God hates: ‘Esau have I hated,’ Rom. ix. 13. Here love and gift go both together. He gives himself for no more than he loves, and he loves no more than God loves.

Ans. 2. Again, whomsoever Christ did love and give himself for to death, there be other fruits which accompany this. They who have interest in Christ’s redemption, they have the spirit of application. Where there is obtaining by Christ anything of God, there, I say, is grace to apply it by his Spirit; and many things go with it. For them that he died for, as the apostle shews, Rom. viii. 11, ‘for them he rose again, and for them he sits at the right hand of God.’ These go together: ‘For if he spared not his own Son, but gave him to death for us all, how shall he not with him also freely give us all things?’ Rom. viii. 32. Where God gives Christ, he gives the spirit of application with him, Mat. xvii. 13, 2 Thess. iii. 2.

But we see that the greatest part of the world have not faith; for it is the faith of the elect, which worldlings not having, nor the grace of application, therefore they have not the favour of God obtained by Christ. So it is written, Rom. v. 10, ‘For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life.’ These go together. Now the greatest part are not saved by his life, therefore they are not reconciled by his death.

Other places do clear this truth, as Heb. ix. 14, where is shewed, that where Christ hath offered up himself for any, there is also a purging of the conscience from dead works to serve the living God. But the most are not purged, therefore they have no interest in Christ’s death. A strong reason is further shewed hereof by Christ, John xvii. 9, where he avouches plainly, and makes a main difference between two sorts of people, saying, ‘I pray for them: I pray not for the world, but for them which thou hast given me, for they are thine.’

Obj. But here some may object, Christ’s death is of larger extent than his intercession.

Ans. To cut off this objection, Christ says after in the same chapter, ver. 17, ‘And for their sakes I sanctify myself, that they also may be sanctified through the truth.’ That is, I prepare and sanctify myself to be a sacrifice as a priest; I prepare myself to be a holy sacrifice for such; therefore Christ sanctified himself for them, not for the world. Under the law there was a brasen altar for sacrifice, and the golden altar for incense, which golden altar for incense was effectual for no more than the brazen altar was for sacrifice. And Christ offered himself a sacrifice for all those that he makes intercession for. The point is clear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salvation Applied</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), v, 388-89.</span></figcaption>

<blockquote><p>The righteousness with which we are here justified before God, is not our conformity with the law, nor our good works, nor our faith; but it is the satisfaction which Christ rendered to the law in our stead; or the punishment which he endured in our behalf; and therefore the entire humiliation of Christ, from the moment of his conception to his glorification, including his assumption of humanity, his subjection to the law, his poverty, reproach, weakness, sufferings, death, &amp;c., all of which he did willingly; yea, whatever he did and suffered to which he was not bound, as being righteous, and the Son of God, is all included in the satisfaction which he made for us, and in the righteousness which God graciously imputes to us, and all believers. This satisfaction is equivalent to the fulfilling of the law, or to the endurance of eternal punishment for sin, to one or the other of which the law binds all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Elm Street Printing Company, 1888), 327</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The righteousness with which we are here justified before God, is not our conformity with the law, nor our good works, nor our faith; but it is the satisfaction which Christ rendered to the law in our stead; or the punishment which he endured in our behalf; and therefore the entire humiliation of Christ, from the moment of his conception to his glorification, including his assumption of humanity, his subjection to the law, his poverty, reproach, weakness, sufferings, death, &amp;c., all of which he did willingly; yea, whatever he did and suffered to which he was not bound, as being righteous, and the Son of God, is all included in the satisfaction which he made for us, and in the righteousness which God graciously imputes to us, and all believers. This satisfaction is equivalent to the fulfilling of the law, or to the endurance of eternal punishment for sin, to one or the other of which the law binds all.”

— Zacharias Ursinus, The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, trans. G. W. Williard (Elm Street Printing Company, 1888), 327">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+righteousness+with+which+we+are+here+justified+before+God%2C+is+not+our+conformity+with+the+law%2C+nor+our+good+works%2C+nor+our+faith%3B+but+it+is+the+satisfaction+which+Christ+rendered+to+the+law+in+our+stead%3B+or+the+punishment+which+he+endured+in+our+behalf%3B+and+therefore+the+entire+humiliation+of+Christ%2C+from+the+moment+of+his+conception+to+his+glorification%2C+including+his+assumption+of+humanity%2C+his+subjection+to+the+law%2C+his+poverty%2C+reproach%2C+weakness%2C+sufferings%2C+death%2C+%26c.%2C+all+of+which+he+did+willingly%3B+yea%2C+whatever+he+did+and+suffered+to+which+he+was+not+bound%2C+as+being+righteous%2C+and+the+Son+of+God%2C+is+all+included+in+the+satisfaction+which+he+made+for+us%2C+and+in+the+righteousness+which+God+graciously+imputes+to+us%2C+and+all+believers.+This+satisfaction+is+equivalent+to+the+fulfilling+of+the+law%2C+or+to+the+endurance+of+eternal+punishment+for+sin%2C+to+one+or+the+other+of+which+the+law+binds+all.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Commentary+of+Dr.+Zacharias+Ursinus+on+the+Heidelberg+Catechism%2C+trans.+G.+W.+Williard+%28Elm+Street+Printing+Company%2C+1888%29%2C+327&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3550e41bd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3550e41bd8.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/12/ursinus-its-christs-satisfaction-for-us/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>2. It is to be considered, how many ways Christ may be said to give Himself [Greek], a ransom for us, or in our place. 1. Christ has sufficiently died for all [the elect] in their room to redeem them. For, pro [Greek], ‘for men’, notes ever the decree and intention of Christ dying for men; but the sufficiency and worth and intrinsical dignity of Christ’s death depends not upon the decree and intention of God, for the worth of the death and the blood of Him who is God, Acts 20:28; 1 Cor. 2:8, and the Lord of Glory is infinite, because of the infinitness of the Person, before and without the decree of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e2cad740b" data-kw="">
<blockquote><p>They whose part it is to set up magistrates, may restrain them also from outrageous deeds, or pull them down; but all magistrates are set up either by parliament, or by electors, or by other magistrates; They therefore who exalted them, may lawfully degrade and punish them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, on Rom. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“They whose part it is to set up magistrates, may restrain them also from outrageous deeds, or pull them down; but all magistrates are set up either by parliament, or by electors, or by other magistrates; They therefore who exalted them, may lawfully degrade and punish them.”

— David Paræus, on Rom. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+whose+part+it+is+to+set+up+magistrates%2C+may+restrain+them+also+from+outrageous+deeds%2C+or+pull+them+down%3B+but+all+magistrates+are+set+up+either+by+parliament%2C+or+by+electors%2C+or+by+other+magistrates%3B+They+therefore+who+exalted+them%2C+may+lawfully+degrade+and+punish+them.%E2%80%9D%0A%0A%E2%80%94+David+Par%C3%A6us%2C+on+Rom.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e2cad740b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e2cad740b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/resistance-to-tyrrany/quotes-on-resistance-to-tyranny/#:~:text=They%20whose%20part%20it%20is%20to,may%20lawfully%20degrade%20and%20punish%20them&amp;text=They%20whose%20part%20it%20is%20to%20set%20up&amp;text=exalted%20them%2C%20may%20lawfully%20degrade%20and%20punish%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-38923bb26c" data-kw="">
<blockquote><p>In a disputation by writing, those of the other part [Richard Baxter and others] formed an argument, whose major proposition was to this sense… ‘Whatsoever book [of law] enjoins nothing but what is of itself lawful, and by lawful authority, enjoins nothing that is sinful’. We denied this proposition, and at last gave diverse reasons of our denial; amongst which one was that ‘It may be unlawful by accident, and therefore sinful’… And I must confess I am still guilty of so much weakness as to be confident that ‘Some things, not evil of themselves, may have accidents so evil as may make it a sin to him that shall command them.’ Is this opinion inconsistent with all government? Yea I must confess myself guilty of so much greater weakness as that I thought I should never have found a man on earth that had the ordinary reason of a man, that had made question of it; yea I shall say more than that which has offended, viz, ‘That whensoever the commanding or forbidding of a thing indifferent is like to occasion more hurt than good, and this may be foreseen, the commanding or forbidding it is a sin.’ … I think Paul spake not anything inconsistent with the government of God or man when he bid both the rulers and the people of the Church not to destroy him with their meat for whom Christ died: and when he says, he hath not his power to destruction, but to edification; yea there are evil accidents of a thing, not evil of itself, that are caused by the commander: and it is my opinion that they may prove his command unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bishop of Worcester’s Letter to a Friend for Vindication of Himself from Mr. Baxter’s Calumny</cite>, As quoted in George Morley, (London, 1662) no page numbers.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), pp. 11-13</span></figcaption>

<blockquote><p>Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

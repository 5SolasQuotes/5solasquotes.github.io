<main class="wrap"><figure class="quote" id="q-d660d8eba5" data-kw="">
<blockquote><p>It is a sufficiently odd doctrine which he [Charles G. Finney] here enunciates, a kind of new Lutheranism with the evangelist substituted for the Word. The Holy Ghost is represented, not, as in the Reformed doctrine, as accompanying the word preached extrinsecus accedens—“the Lord opened Lydia’s heart,” “Paul may plant and Apollos water, the Lord gives the increase”; and not as in the Lutheran doctrine as intrinsic in the Word spoken, acting out from the Word on the heart of the hearer; but as intrinsic in the evangelist speaking. By a mere gaze, without a word spoken, Finney says he reduced a whole room-full of factory girls to hysteria.

As the Lutheran says God in the Word works a saving impression, Finney says God in the preacher works a saving impression. Not the Word, but the preacher is the power of God unto salvation. The evangelist has become a Sacrament. The letters were continued after an interval. There was another descriptive one (“The Enduement of the Spirit”) in which the anecdote of the preaching in “Sodom” related in the “Memoirs” is repeated. Then there was one called Power from on High: who may Expect the Enduement? in which he explains that “all Christians by virtue of their relation to Christ, may ask to receive the enduement of power to win souls to Him,” adding that it comes “after their first faith,” and as an “instantaneous” gift.

In another, “Is It a Hard Saying?” he defends his assertion that those without this power are disqualified for office in the Church. And finally, Enduement for Power from on High considers the conditions upon which this enduement of power can be obtained. It is a pathetic sight to observe the aged Finney after a long life of insistence that it is only by the power of truth that men can be brought to Christ, clothing at the end the evangelist himself with supernatural powers and representing him as fitted for his functions only by the possession of these supernatural powers.

It is an odd instance of the invention of a supernaturally endowed priesthood to mediate between God and man, when God is not permitted Himself to act immediately on the heart; and it seems to bear witness to a deep-lying conviction in the human soul that its salvation will not be accomplished without a supernatural intervention somewhere. The pragmatic refutation of the Pelagian construction of salvation is not a mean one. It will not work; and no one really believes that it will work. The supernaturalism thrown out at the window is very apt to creep back through some chink or other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oberlin Perfectionism. III. The Development of the Oberlin Teaching in Princeton Theological Review</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e2deb465d" data-kw="">
<blockquote><p>Therefore, angels and human beings, because of the fact that they have been created as rational, have received from God in the very creation of a spiritual nature, the gift of eternity and happiness. This was done in such a way that, if they adhered uninterruptedly to the love of the Creator, at the same time, they would remain eternally blessed; if, on the other hand, by a decision of their own free will, they would endeavour to do their own will against the command of the Most High Creator, blessedness would immediately depart from the recalcitrant, and there would be left for them as a punishment eternal misery, henceforward subjected to error and grief. Concerning the angels, God has decided this and carried it out, that, if any of them loses the goodness of will, he will never restore it by divine gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To Peter on the Faith</cite>, in Selected Works, trans. Robert B. Enos, The Fathers of the Church: A New Translation, vol. 95 (Washington D.C.: The Catholic University of America Press, 1997), III.32, p. 80.</span></figcaption>

</figure><figure class="quote" id="q-636b608490" data-kw="">
<blockquote><p>The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>

</figure><figure class="quote" id="q-041822af0e" data-kw="angels spirits">
<blockquote><p>Are angels spiritual and incorporeal substances? We affirm. Scripture expressly calls them spirits; now for what purpose would they be called “spirits” if they are corporeal? Spirit is diametrically opposed to body: “A spirit hath not flesh and bones,” says Christ, “as ye see me have” (Lk. 24:39). For the same reason they are classed among things “invisible” (Col. 1:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.2.2</span></figcaption>

</figure><figure class="quote" id="q-089a20e32e" data-kw="">
<blockquote><p>Each creature is limited by place, though spirits do not fill up a place† by commensuration of parts, yet they have a certain compass (as I may call it) beyond which their essence extends not: they are so here that they are not there; so in heaven, that they are not the same time on earth. † The angels are in an ubi [where] though not in a place properly; in English we cannot so well distinguish these words: they are limited and confined to some space; an angel cannot be at the same time in heaven and earth. But God is altogether above place, he is omnipresent, not by any material extension, but after an incomprehensible and unexpressible manner. He is quite above all place, wholly without and within all and every place, and that without all local motion or mutation of place. He is every where totally and equally…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, p. 145</span></figcaption>

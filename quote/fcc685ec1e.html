<blockquote><p>He [Paul] illustrates and concludes this whole comparison, by shewing the abundance of sin in those that are justified, renders the grace of Christ more illustrious; and this he does by answering an objection concerning the end and use of the published Law.

It may be questioned, if death reigned by the Law of Nature, not written before Moses, what need was there of any written Law; and seeing righteousness comes not by the Law, as is said before, to what end was the Law?

He answers, by shewing a three-fold end of giving the Law.

First: The Law entered, that the offence might abound; i. e. The Law forbidding sin, and enjoining righteousness, in that space of time betwixt Adam and Christ, came in, that sin, (which was daily committed, and yet because of ignorance not acknowledged) might be known to be sin, and that the natural wickedness of men might appear, which occasions, that by how much the more the Law requires righteousness, by so much the more concupiscence is stirred up against the Law; and that by this, the sin which lies hid in men might be manifested, and known to abound.

But where] The second end, that from the abundance of sin in those that were to be justified, the exceeding abundant grace of Christ towards those that are justified might appear: seeing that where sin abounds in the conviction of men that are to be justified, there the grace of Christ justifying is found to super-abound.

Even as] The third end, that the power of sin, (as a King) by the Law, might more clearly appear, shewing forth its condemning power, the power of the righteousness of Christ (as a Superior King) held forth in the Gospel, might be more eminent, prevailing, not only to the abolishing of the Kingdom of sin, but also to the conferring of Eternal Life upon those that are justified: Therefore by how much the more the force of sin (reigning over men not justified) crowding them to the prison of Eternal death, might more clearly appear; by so much the more, the virtue, power, and excellency of the grace of Christ, overcoming and subduing sin, leading men powerfully unto Eternal Life, might more manifestly bee declared.</p></blockquote>

<blockquote><p>In every generation, the doctrine of justification by faith alone comes under attack. As the heart of the gospel, the doctrine of justification is most fundamental to the definition of salvation and any adequate understanding of the atoning work of the Lord Jesus Christ. In our current cultural milieu where orthodox belief is despised and innovation is praised, many have ignored, maligned, or sought to redefine the biblical doctrine of justification by faith alone. Unfortunately, there are even those within more conservative theological domains whose definition of justification by faith falls short of the biblical and reformed doctrine of justification, particularly as defined in the Westminster Standards. To combat these harmful perversions, we here seek to define a clear, confessional polemic that might serve the church as a bulwark to “strengthen what remains.” …We deny that a man’s works, in any way, contribute to his justification, whether before or after believing on Christ in faith.[4] We deny that we are justified by “sanctifying fruit” in addition to faith in the perfection of Christ’s work. Furthermore, we deny that doing such works from a “justified position” qualifies those works to become somehow instrumental in obtaining one’s “final salvation”. …We deny that our deliverance requires the believer’s attainment of two statuses: namely initial justification and final salvation. While we still await the future enactment of our salvation, when the wrath of God against the nations is revealed and his children are brought into the kingdom fully, the ground of that future salvation is entirely present to the individual in the work of the Spirit at the moment of justification.[8] Furthermore, as God himself calls those whom he predestines, justifies those whom he calls, and glorifies those whom he justifies, we deny that any who are predestined, called, or justified may fail to partake of glorification in the end. Thus, we deny that our salvation from the final judgment is established or obtained through the works which proceed from that justification.</p></blockquote>

<blockquote><p>The solution is simply this: The race is not born in its normal unfallen state. Originally, in the person of its progenitor and representative, God made man upright, in his own image. Now it is abandoned to sin and misery. This abandonment is not only the consequence, but the penal consequence of Adam’s sin committed while they were on trial in him as their representative. On this view, the race had a probation under the most favourable circumstances for ensuring a happy result. In that probation it failed, it sinned. Its abandonment to sin and misery is the penalty of that sin, reckoned and treated judicially as the sin of the race. This accounts for the present corruption of man, not by attributing it, like Mr. [George E.] Ellis, to the normal nature originally given him by his Maker, irrespective of Adam’s sin; nor, like the New School and New England theologians, to the mere sovereignty of God making this fall and ruin of the race the effect of Adam’s sin, without any imputation of that sin to them; but it makes so fearful an evil a penalty for sin committed while on trial in the person of their federal head.

Mr. Ellis follows Dr. E[dward]. Beecher in asserting that the fifth chapter of Romans teaches nothing of this sort, but only that Adam was a type of his race. All his descendants sin and die, just and only as he sinned and died. But to deny that it asserts that Adam’s sin is somehow the cause of man’s sin, is a blind shift of sheer infatuation, worse by far than the evasions he charges upon his New School brethren. He might as well say that the Westminster Confession, or that this journal, does not assert it. It is so asserted and implicated with the whole passage, that no considerable portion of those disposed to get rid of the doctrine, and ready to impeach the apostle’s inspiration for this purpose, have ventured to attempt it.

It not only asserts that sin and death came upon all men “by one man,” (Adam,) “through the offence of one,” “by one that sinned,” “by one man’s disobedience;” it also asserts that it was by virtue of judgment and condemnation therefore: “The judgment was by one to condemnation,” … and “upon all men to condemnation.” There is no escaping the plain meaning of these terms. They indicate that the condition of our race has come by way of judgment and condemnation for the sin of its head. This implies that he acted not merely for himself, but representatively. So much light, and no more, the Scripture gives us in reference to the cause of the awful fact which none can dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Orthodoxy, New Divinity, and Unitarianism in Biblical Repertory and Princeton Review</cite></span></figcaption>

— Lyman Atwater, Old Orthodoxy, New Divinity, and Unitarianism in Biblical Repertory and Princeton Review">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+solution+is+simply+this%3A+The+race+is+not+born+in+its+normal+unfallen+state.+Originally%2C+in+the+person+of+its+progenitor+and+representative%2C+God+made+man+upright%2C+in+his+own+image.+Now+it+is+abandoned+to+sin+and+misery.+This+abandonment+is+not+only+the+consequence%2C+but+the+penal+consequence+of+Adam%E2%80%99s+sin+committed+while+they+were+on+trial+in+him+as+their+representative.+On+this+view%2C+the+race+had+a+probation+under+the+most+favourable+circumstances+for+ensuring+a+happy+result.+In+that+probation+it+failed%2C+it+sinned.+Its+abandonment+to+sin+and+misery+is+the+penalty+of+that+sin%2C+reckoned+and+treated+judicially+as+the+sin+of+the+race.+This+accounts+for+the+present+corruption+of+man%2C+not+by+attributing+it%2C+like+Mr.+%5BGeorge+E.%5D+Ellis%2C+to+the+normal+nature+originally+given+him+by+his+Maker%2C+irrespective+of+Adam%E2%80%99s+sin%3B+nor%2C+like+the+New+School+and+New+England+theologians%2C+to+the+mere+sovereignty+of+God+making+this+fall+and+ruin+of+the+race+the+effect+of+Adam%E2%80%99s+sin%2C+without+any+imputation+of+that+sin+to+them%3B+but+it+makes+so+fearful+an+evil+a+penalty+for+sin+committed+while+on+trial+in+the+person+of+their+federal+head.%0A%0AMr.+Ellis+follows+Dr.+E%5Bdward%5D.+Beecher+in+asserting+that+the+fifth+chapter+of+Romans+teaches+nothing+of+this+sort%2C+but+only+that+Adam+was+a+type+of+his+race.+All+his+descendants+sin+and+die%2C+just+and+only+as+he+sinned+and+died.+But+to+deny+that+it+asserts+that+Adam%E2%80%99s+sin+is+somehow+the+cause+of+man%E2%80%99s+sin%2C+is+a+blind+shift+of+sheer+infatuation%2C+worse+by+far+than+the+evasions+he+charges+upon+his+New+School+brethren.+He+might+as+well+say+that+the+Westminster+Confession%2C+or+that+this+journal%2C+does+not+assert+it.+It+is+so+asserted+and+implicated+with+the+whole+passage%2C+that+no+considerable+portion+of+those+disposed+to+get+rid+of+the+doctrine%2C+and+ready+to+impeach+the+apostle%E2%80%99s+inspiration+for+this+purpose%2C+have+ventured+to+attempt+it.%0A%0AIt+not+only+asserts+that+sin+and+death+came+upon+all+men+%E2%80%9Cby+one+man%2C%E2%80%9D+%28Adam%2C%29+%E2%80%9Cthrough+the+offence+of+one%2C%E2%80%9D+%E2%80%9Cby+one+that+sinned%2C%E2%80%9D+%E2%80%9Cby+one+man%E2%80%99s+disobedience%3B%E2%80%9D+it+also+asserts+that+it+was+by+virtue+of+judgment+and+condemnation+therefore%3A+%E2%80%9CThe+judgment+was+by+one+to+condemnation%2C%E2%80%9D+%E2%80%A6+and+%E2%80%9Cupon+all+men+to+condemnation.%E2%80%9D+There+is+no+escaping+the+plain+meaning+of+these+terms.+They+indicate+that+the+condition+of+our+race+has+come+by+way+of+judgment+and+condemnation+for+the+sin+of+its+head.+This+implies+that+he+acted+not+merely+for+himself%2C+but+representatively.+So+much+light%2C+and+no+more%2C+the+Scripture+gives+us+in+reference+to+the+cause+of+the+awful+fact+which+none+can+dispute.%E2%80%9D%0A%0A%E2%80%94+Lyman+Atwater%2C+Old+Orthodoxy%2C+New+Divinity%2C+and+Unitarianism+in+Biblical+Repertory+and+Princeton+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F15a93f2e48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/15a93f2e48.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/11/04/lyman-hotchkiss-atwater-on-the-imputation-of-adams-sin/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Whether we be justified by the passive obedience of Christ alone, or also by his active?¹ ¹ Bishop Carlton, Consens. Eccles. Cathol. contr. Trid. de Fide Justif., ch. 3; Daniel Featley in his Sacra nemesis, pp. 24, 29-30, 36-38; L’Emper. in his Theses, Article 1 and many others are for both Christ’s active and passive obedience. Etsi autem in negotio Iustificationis magno periculo erratur, prout ea de re controversia procedit inter nos et Pontificios, utrum scilicet gratiá Dei Iustificatio nobis contingat, an meritis nostris: Attamen prout inter nos &amp; Piscatorem controversia instituitur, passiváne tantum, an etiam activa Christi obedientia justificemur coram Deo, nullo prorsus erratur periculo. Utrobique enim Iustificationis causae gratiae et Christi meritis adscribuntur, non autem operibus nostris. Twisse, i• Corv. Defens. Arm. contra Tilenum Animadversio. Scriptura Christi passioni Iustificationem passim adscribit; idque eu i• locis, in quibus exprofesso argumentum istud pertractat: nulla tamen justitiae, quae in obedientia legi exhibita consistat, facti mentione vel levissima, Rom. 3:24-25 &amp; 4:24-25 &amp; 5:9-10; Gal. 3:11, 13. Gataker. Animadv. in Piscat. &amp; Lucii Scripta Adversaria, p. 2, Sect. 10. Vide plura in cjus Gomar, Disput. Elentic. de Iustif. Elench. In this controversy many learned divines of our own differ among themselves, and it does not seem to be of that importance that some others are about justification. We are justified in part by Christ’s active obedience, for by it we obtain the imputation of that perfect righteousness which gives us title to the Kingdom of Heaven. Seeing it was not possible for us to enter into life, till we had kept the commandments of God, Mt. 19:17, and we were not able to keep them ourselves, it was necessary our Surety should keep them for us, Dan. 9:24; Rom. 10:4; Rom. 3:21. (Mr. Hildersham on Ps. 51:7, Lecture 119) The Scripture seems to ascribe our redemption wholly to Christ’s bodily death, and the blood that He shed for us, Eph. 1:7; Rev. 5:9, but in these places the Holy Ghost uses a synecdoche, it puts one part of Christ’s passion for the whole:

1. Because the shedding of his blood was a sensible sign and evidence that He died for us.

2. This declared Him to be the true propitiatory sacrifice that was figured by all the sacrifices under the Law. (Idem, ibid.) Some urge this argument, By Christs active obedience imputed to them, the faithful be made perfectly righteous, what need is there then of his passive righteousness? need there anymore than to be made righteous? (See Mr. Bradshaw, Of Justification) Christ fulfilled the duty of the Law, and did undergo the penalty, that last was a satisfaction for the trespass which was as it were the forfeiture, and the fulfilling the Law was the principal, Ps. 40:4; Jer. 31:3; Gal. 4:4. Some, to avoid Christ’s active obedience, question whether Christ as man was not bound to fulfill the Law for Himself? All creatures are subject to God’s authority. Yet this detracts not from his active obedience, partly from his own free condescension, and partly because his whole person God and man obeyed.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d742acd319" data-kw="">
<blockquote><p>…it was the opinion of the church of England, at the commencement of the reign of Queen Eli|zabeth, that, after a divorce for adultery, the parties might marry again. It is true that the despotic tribunal, the Star-Chamber, whose very name is odious to the ears of a free-born Englishman, did reverse this opinion… But, what was this less than acting against the spirit, reversing the very principles, of the Reformation; and recurring back again to the usages and practices of popery?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fecf99c6a7" data-kw="">
<blockquote><p>The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-800670808e" data-kw="">
<blockquote><p>On the whole, I think that the calamities of the married state are generally to be imputed to the persons themselves in the following proportion: Three-fourths to the man for want [lack] of care and judgment in the choice, and one-fourth to the woman on the same score. Suppose a man had bought a farm, and after a year or two would, in conversation with his neighbor, make heavy complaints how much he had been disappointed. I imagine his friend might say to him: ‘Did you not see this land before you bought it?’ ‘Oh yes, I saw it often.’ ‘Do you not understand soils?’ ‘I think I do tolerably.’ ‘Did you not examine it with care?’ ‘Not so much as I should have done; standing at a certain place it looked admirably well; the fences too were new, and looked exceedingly neat; the house had been just painted a stone color with paneling; the windows were large and elegant; but I neglected entirely to examine the sufficiency of the materials or the disposition of the apartments. There were in the month of April two beautiful springs, but since I have lived here they had been dry every year before the middle of June.’ ‘Did you not inquire of those who had lived on the place of the permanency of the springs?’ ‘No, indeed, I omitted it.’ ‘Had you the full measure you were promised?’ ‘Yes, every acre.’ ‘Was the right complete and valid?’ ‘Yes, yes, perfectly good; no man in America can take it from me.’ ‘Were you obliged to take it up in part of a bad debt?’ ‘No, nothing like it. I took such a fancy for it all at once that I pestered the man from week to week to let me have it.’ ‘Why really then,’ says his friend, ‘I think you had better keep your complaints to yourself. Cursing and fretfulness will never turn stones into earth or sand into loam [good soil]; but I can assure you that frugality, industry and good culture will make a bad farm very tolerable, and an indifferent one truly good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of the Rev. John Witherspoon</cite>, vol. 7 ed. H. Rondel Rumburg (1801; Harrisonburg, VA: Sprinkle Publications, 2006), ‘Letters on Marriage’, Letter 3, pp. 202-3 Different edition, pp. 244-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-bc6f20350f" data-kw="">
<blockquote><p>And hence is concluded that matrimony requires continual cohabitation and living together, unless the calling of God be otherwise evident;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno</cite>, ch. 38 in The Judgment of Martin Bucer concerning Divorce, written to Edward VI, in his Second Book of the Kingdom of Christ, and now Englished… tr. John Milton (London: Simmons, 1644), ch. 38, p. 16</span></figcaption>

</figure><figure class="quote" id="q-9d56faea0f" data-kw="">
<blockquote><p>Lastly, the question may be asked touching the daughter of a man given in marriage, the husband commandeth one thing, and the father another, whether of these is to be obeyed, the husband, or the father? I answer, the husband. For, as she must obey her husband before the father, so she is to love the husband better also, and God commandeth the man to leave father and mother and to cleave to his wife (Gen. 2:24), which is also a commandment unto the woman to leave parents, and to cleave to her husband, for they twain shall be one flesh, Mt. 19:5; Eph. 5:31; 1 Cor. 6:16: Therefore in this [latter] case the will of the husband is to be preferred before the will of the father. For as it is in the two great lights which God hath set in the firmament, the lesser evermore giveth place to the greater, and when the sun shineth, the light of the moon fadeth and vanisheth away: so when the greater authority of the husband commeth in place, the lesser power and authority of the father ceaseth. Besides, his giving of her in marriage to the husband is a giving away of his own right over her, as well as over that portion of goods which he bestoweth with her: so that now his authority is abridged, nay clean abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), p. 1166</span></figcaption>

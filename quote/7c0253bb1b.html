<blockquote><p>The Church and the state among the Jews were distinct in respect of the nature of the power which they exercised respectively. Here, again, the very same difference is to be observed between the two societies as exists under the present dispensation. It is true, indeed, that exceptional instances may be pointed out of individual men who, in virtue of an extraordinary commission from God, united civil and ecclesiastical functions in their own persons.

Such an instance we have in the case of Moses, whose extraordinary mission, in the peculiar and transitional circumstances of the nation at the time, entitled him to the possession and exercise of power alike in Church and state. But setting aside this, and perhaps one or two similar instances, which are clearly of an exceptional kind, and easily to be explained from the peculiar and extraordinary circumstances of the case, the line of distinction between civil and ecclesiastical power among the Jews is broad and strongly marked.

The power exercised by the Jewish state was purely civil and coercive in its nature. This is evident from the kind of penalties inflicted, such as fines, scourging, death by stoning, or hanging on a tree. The power exercised by the Jewish Church, on the other hand, was not coercive, but spiritual in its nature. It did not affect the properties or the lives of men, but was exerted in the way of warning, rebuke, ecclesiastical censure, and finally excommunication, or “cutting off from the congregation.”

This power of excommunication, or of inflicting the last and highest of ecclesiastical penalties, we find still vested in and wielded by the Jewish Church in our Lord’s time. The “casting out of the synagogue” (ἀποσυνάγωγος γενέσθαι), repeatedly spoken of in the New Testament, is precisely identical with the “cutting off from the congregation of Israel.” (יִשְׂרָאֵ֔ל מֵעֲדַ֣ת וְנִכְרְתָ֞ה) so often mentioned in the Old. That this was a strictly ecclesiastical sentence inflicted for religious offences, and that it did not imply the punishment of death, is plain from various considerations.

1. It was awarded for sins of ignorance and infirmity, and accidental ceremonial defilements, which could not be punished with death. A man might be “cut off from the congregation,” or as it is sometimes expressed, “cut off from the presence of the Lord,”’ for accidentally touching a bone, or coming in contact with a dead body, or eating blood. These and similar offences against the ceremonial laws of Israel involved a temporary suspension from Church fellowship; they were not, and could not be, regarded as involving the death of the offender.

2. The sentence of excommunication, or “cutting off from the congregation,” was inflicted on account of offences for which certain sacrifices and purifications were appointed, in order to bring about the restoration of the excommunicated person to the full privileges of the Church. Such sacrifices and cleansings were never appointed or allowed in the case of criminal offences.

3. The same thing is proved by a comparison of the parallel passages in the New Testament. When the Apostle Paul exhorted the Corinthians, in respect of one of their number who had been guilty of an incestuous marriage, “to deliver such an one unto Satan, for the destruction of the flesh,” to “put away (ἐξάρατε) from among themselves that wicked person;” or when he expressed his desire that the false teachers who had disturbed the peace of the Galatian Churches “should be even cut off” from among them (ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς), he was using language precisely similar both to that of the Evangelist John in recording the casting out of the synagogue of the blind man healed by Christ on the Sabbath-day, and to that of the Old Testament with respect to “cutting off from the congregation.”

In all the cases just referred to, it is the same ecclesiastical sentence of excommunication that is spoken of; and surely the conclusion is obvious, that no more in the latter case than in the former did that sentence involve the infliction of death.</p></blockquote>

<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>

lly+civil%5D%2C+it+is+about+matters+of+religion+in+a+civil+manner%2C+and+in+a+way+suitable+to+the+nature+and+quality+of+their+place+and+power.+The+faithful+custody+and+preservation+of+religion%2C+is+a+part+of+their+office%3A+for+they+are+not+only+keepers+of+the+Second%2C+but+of+the+First+Table+of+the+Law%E2%80%A6+Religion+also+expects+from+them+the+civil+sanction%2C+that+the+worship+of+God%2C+and+the+wholesome+constitutions+of+the+Church+about+religion%2C+be+confirmed+and+settled+by+their+Laws.+Coaction+%5Bcoercion%5D+also+is+theirs%2C+for+they+by+their+power+%5Bin+a+Christian+nation%5D+are+to+constrain+their+subjects+to+the+duties+of+religion%2C+and+to+coerce+and+stop+them+that+they+do+nothing+to+the+contrary.%E2%80%9D%0A%0A%E2%80%94+Alexander+Henderson%2C+%E2%80%98A+Sermon+Preached+To+the+Honorable+House+of+Commons%2C+at+Their+late+Solemn+Fast%2C+Wed.%2C+Dec.+27%2C+1643%E2%80%99+%28London%2C+1644%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0350d090e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0350d090e9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=1.%20The%20Rule%20of%20Reformation.%5D%20The,they%20do%20nothing%20to%20the%20contrary&amp;text=1.%20The%20Rule%20of%20Reformation.%5D%20The%20rule%20of&amp;text=them%20that%20they%20do%20nothing%20to%20the%20contrary" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

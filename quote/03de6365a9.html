<main class="wrap"><figure class="quote" id="q-03de6365a9" data-kw="">
<blockquote><p>In the same way, since it is most true that the Lord dwelleth in his holy temple, and is assuredly to be found therein, many vainly flatter themselves that by coming to the house of God they really come to Christ. And yet is it not contrary to common sense to say, or to suppose, that the house and he that dwells within it are one and the same? Believe me, it is not enough to draw near to the sanctuary; we must draw near to the Lord in the sanctuary. True it is that attendance on the ministrations of the Gospel is a graciously appointed means, which God’s blessing maketh instrumental in bringing sinners to Jesus. But it is nothing more than a means to an end; it is not the end itself.

The cry of the Gospel is—Come to the means of grace, in order that you may be persuaded thereby’ to come to the fountain of grace—come to his house, that his voice of love there heard may stir you up to come to himself—come thus far, that you may learn the necessity, the duty, the privilege of coming much farther. With thousands of them that arc “heavy laden,” frequenting his courts is all the compliance yielded to the Saviour’s call, “Come unto me.”

Are you among that number? Think of these solemn texts—”When ye come to appear before me, who hath required this at your hands, to tread my courts?” “They come unto thee as the people cometh, and they sit before thee as my people, and they hear thy words, but they will not do them.” “This people draw near me with their mouth, and with their lips do honour me, but have removed their heart far from me.” I believe many come to Christ’s ordinances, in order to quiet their consciences for not coming to Christ himself. …

But let me not be misunderstood. I am far from disparaging the means of grace, or undervaluing the diligent employment of them. ‘Tis a blessed thing to search the Scriptures, to wait on ordinances, to pray. And would to God that Gospel despisers were brought to these hallowed exercises. But still I must affirm that it is awful folly to rest satisfied with coming that length and no more. Satan has no objections to bring souls thither, if lie can keep them there. It is one of his old devices to bring demoniacs to the synagogue. The carnal heart is fain to quiet alike the voice of conscience and the call of Christ, with the permission to itself, “Hitherto shalt thou come and no farther.” Yes, but that “no farther” is a lie; for stopping short of Christ cannot stop short of hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller-of-monifieth.html">Samuel Miller of Monifieth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Coming unto Jesus in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.</p></blockquote>

<blockquote><p>Why would Men oblige us to believe things that are incredible, to justify the Church of Rome? They tell us, That the Priesthood of their Priests, is the same as that of Jesus Christ. I know not whether Heaven and Earth are more distant, and if Light and Darkness be more different. Jesus Christ is God, those Priests are Men. Jesus Christ abides for ever; those Priests die. No Man succeeds Jesus Christ; Priests succeed one the other. Jesus Christ offered not for himself; the Priests offer for their own Sins, as for those of the People. Jesus Christ is Holy, separate from Sinners; Priests are often engaged into great Disorders. Jesus Christ hath offered once one sole Sacrifice; these offer every day, and reiterate their Sacrifice.

Jesus Christ finishes his Sacrifice in the Holy Places not made with hands; Priests make their Sacrifices upon Altars of Stone, and in Temples made by Man’s hand. In fine, Melchisedeck was a singular Man, and only; it must needs be therefore, that he who was to sustain that Priesthood, whereof his was the Figure, should be a singular and only Person; but the Priests are in great Numbers. After that, can Men deny, that Priests are Sacrifices much rather like the Order of Aaron, than that of Melchisedeck? And if it be so, we say it once more, The Establishment of their Priesthood destroys that of Christ by good Consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preservative against the change of religion, or, A just and true idea of the Roman Catholick religion, opposed to the flattering portraictures made thereof, and particularly to that of my Lord of Condom</cite>, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), pp 157-58.</span></figcaption>

Jesus Christ finishes his Sacrifice in the Holy Places not made with hands; Priests make their Sacrifices upon Altars of Stone, and in Temples made by Man’s hand. In fine, Melchisedeck was a singular Man, and only; it must needs be therefore, that he who was to sustain that Priesthood, whereof his was the Figure, should be a singular and only Person; but the Priests are in great Numbers. After that, can Men deny, that Priests are Sacrifices much rather like the Order of Aaron, than that of Melchisedeck? And if it be so, we say it once more, The Establishment of their Priesthood destroys that of Christ by good Consequence.”

— Pierre Jurieu, A preservative against the change of religion, or, A just and true idea of the Roman Catholick religion, opposed to the flattering portraictures made thereof, and particularly to that of my Lord of Condom, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), pp 157-58.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhy+would+Men+oblige+us+to+believe+things+that+are+incredible%2C+to+justify+the+Church+of+Rome%3F+They+tell+us%2C+That+the+Priesthood+of+their+Priests%2C+is+the+same+as+that+of+Jesus+Christ.+I+know+not+whether+Heaven+and+Earth+are+more+distant%2C+and+if+Light+and+Darkness+be+more+different.+Jesus+Christ+is+God%2C+those+Priests+are+Men.+Jesus+Christ+abides+for+ever%3B+those+Priests+die.+No+Man+succeeds+Jesus+Christ%3B+Priests+succeed+one+the+other.+Jesus+Christ+offered+not+for+himself%3B+the+Priests+offer+for+their+own+Sins%2C+as+for+those+of+the+People.+Jesus+Christ+is+Holy%2C+separate+from+Sinners%3B+Priests+are+often+engaged+into+great+Disorders.+Jesus+Christ+hath+offered+once+one+sole+Sacrifice%3B+these+offer+every+day%2C+and+reiterate+their+Sacrifice.%0A%0AJesus+Christ+finishes+his+Sacrifice+in+the+Holy+Places+not+made+with+hands%3B+Priests+make+their+Sacrifices+upon+Altars+of+Stone%2C+and+in+Temples+made+by+Man%E2%80%99s+hand.+In+fine%2C+Melchisedeck+was+a+singular+Man%2C+and+only%3B+it+must+needs+be+therefore%2C+that+he+who+was+to+sustain+that+Priesthood%2C+whereof+his+was+the+Figure%2C+should+be+a+singular+and+only+Person%3B+but+the+Priests+are+in+great+Numbers.+After+that%2C+can+Men+deny%2C+that+Priests+are+Sacrifices+much+rather+like+the+Order+of+Aaron%2C+than+that+of+Melchisedeck%3F+And+if+it+be+so%2C+we+say+it+once+more%2C+The+Establishment+of+their+Priesthood+destroys+that+of+Christ+by+good+Consequence.%E2%80%9D%0A%0A%E2%80%94+Pierre+Jurieu%2C+A+preservative+against+the+change+of+religion%2C+or%2C+A+just+and+true+idea+of+the+Roman+Catholick+religion%2C+opposed+to+the+flattering+portraictures+

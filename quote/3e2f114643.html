<blockquote><p>III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent in the Fundamentals of Faith’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward trans. AI (d. 1643; Gallibrand, 1658), pp. 152-53</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6b2b74f2d" data-kw="">
<blockquote><p>Sovereignty is a comprehensive term. It contains several elements. First it denotes supremacy. A sovereign ruler is supreme in his dominions. All other rulers are under him. Secondly, sovereignty denotes independence. Says Woolsey, ‘In the intercourse of nations certain states have a position of entire independence of others. They have the power of self-government, that is, of independence of all other states as far as their own territory and citizens are concerned. This power of independent action in external and internal relations constitutes complete sovereignty.’ (Political Science, i., 204) Thirdly, sovereignty denotes optional power; that is, the power to act or not in a given instance. It is more particularly with reference to this latter characteristic of free alternative decision, that ‘the sovereignty of God in election’ is spoken of. In his election of a sinner to salvation, God as supreme, independent, and sovereign, acts with entire liberty of decision, and not as obliged and shut up to one course of action. This is the common understanding and definition of sovereignty as applied to decisions and acts. Says Blackstone [one of the most influential writers on English law]: ‘By the sovereign power is meant the power of making laws; for wherever that power resides all other powers must conform to, and be directed by it, whatever appearance the outward form and administration of the government may put on. For it is at any time in the option of the legislature to alter that form and administration by a new edict or rule, and put the execution of the law into whatever hands it pleases, by constituting one, or a few, or many executive magistrates.’ (Introduction, 2) Blackstone gives the same definition of sovereignty, when it is vested in a king (Book II., ch. vii.). The king has no superior to oblige or compel him to one course of action. He has independent and optional power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (1893; Banner of Truth, 1993), pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>…on the matter of election (which he [Vermigli] identifies with predestination), God’s will in eternity is seen to be the exclusive cause. The effect of this election assumes Augustine’s anthropology by viewing all humanity as a massa perditionis [a ruined mass], doomed to eternal condemnation unless God intercedes. Divine election is portrayed positively as the rescue of the doomed sinner, who can do nothing to secure his own deliverance. After being elected from the mass of fallen sinners in eternity past… the elect embrace Christ in time and thus inherit eternal life. … Vermigli’s doctrine is an unequivocal double predestination, but he differs from other Reformers, such as Ulrich Zwingli. The latter advocates a strict symmetrical double predestination, but Vermigli constructs an asymmetrical version of this doctrine. According to Vermigli, God does not deal with the elect in precisely the same way he deals with the non-elect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/infralapsarians.html">Frank A. James</a></span><span class="wk"><span class="lbl">Work:</span> <cite>the translator of Vermigli’s Predestination &amp; Justification in The Peter Martyr Library, vol 8, ‘Translator’s Introduction’</cite>, pp. xxviii-xxix. See the larger surrounding discussion which highlights and explains some seeming supra-strains of thought in Vermigli.</span></figcaption>

<blockquote><p>It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…</p></blockquote>

<blockquote><p>IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man.</p></blockquote>

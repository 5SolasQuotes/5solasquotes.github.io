<main class="wrap"><figure class="quote" id="q-c4a236c97d" data-kw="">
<blockquote><p>On the other hand [in contrast to Christianity], those who introduced the errors of the sects proceeded in contrary fashion, as is clear from Mohammed, who enticed peoples with the promise of carnal pleasures, to the desire of which the concupiscence of the flesh instigates. He also delivered commandments in keeping with his promises, by giving the reins to carnal pleasure, in which it is easy for carnal men to obey. Also, the lessons of truth which he inculcated were only such as can be easily known to any man of average wisdom by his natural powers—in fact, he mingled the truths which he taught with many fables and most false doctrines. Nor did he add any signs of supernatural agency, which alone are a fitting witness to divine inspiration, since a visible work that can only be from God proves the teacher of truth to be invisibly inspired, but he asserted that he was sent in the power of arms, which sign is not lacking even to robbers and tyrants. Again, those who believed in him from the outset were not wise men practiced in things divine and human, but bestial men who dwelt in the deserts, utterly ignorant of all divine teaching, and it was by a multitude of such men and the force of arms that he compelled others to submit to his law. Lastly, no divine oracles of prophets in a previous age bore witness to him; rather, he corrupted almost all the teaching of the Old and New Testaments by a narrative replete with fables, as one may see by a perusal of his law. Hence, by a cunning device, he did not commit the reading of the Old and New Testament books to his followers, lest he should thereby be convicted of falsehood. Thus it is evident that those who believe his words believe lightly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1, ch. 6</cite></span></figcaption>

<blockquote><p>Question 9, Whether Jews in a Christian magistracy are to be tolerated, and how are they to be dealt with? There are extreme opinions concerning this question. The first sentence is of those who absolutely deny that Jews ought to be at all tolerated in a Christian commonwealth. The moments of their assertion they advance are these: (1) Jews are extremely blasphemous; for at the name of Jesus, if they alone be present, thy cry out and say: “Let his name be blotted out”; they call the Holy Trinity nonsense and foolishness, they call Christ a spurious one; they call Mary, the blessed mother of the Savior, dung; they curse every Christian magistrate, they reckon Christians among the most lost and damned men; they think it lawful to despoil and kill Christians and treat Christian rites as obscene. (2) They think Christians to be plainly objects of hatred and enemies to God; they bring accusations against secular and principal Christian commonwealths and so separate themselves. The second judgment, plainly contrary to the first, proposes causes of hope and arguments and proofs of foundations: (3) From those things themselves is Christ made according to the flesh, Rom. 9:2, 5. A corrupt religion is extremely blasphemous: to be possessed of the habitation of the Jews within the commonwealth yields very many benefits to Christians: for they show spectacles and thereby furnish a divine mirror against the contemners of the Gospel, and they can serve for the restoration of the integrity of the monuments of the Old Testament, and confirm the truth among the images of divine predictions, Rom. 1:22. They enrich the commonwealth with money, with trade, they make it opulent and wealthy. (4) The ejection of the Jews out of the republic would carry with it many inconveniences: for being utterly expelled from Christian dominions they are more difficult to be converted and more free to blaspheme, and the Turkish kingdom would be augmented by their resources. (5) It is necessary therefore that Jews live somewhere, if any political use proper to them be by them entirely prescribed: wherefore it is preferable that they live under a Christian magistracy, as under which the hope of a more abundant conversion would shine forth than that living under a gentile magistracy they either persevere in their idolatry or pass over to the blasphemy of the gentiles. The third opinion is intermediate, since it concedes indeed that Jews may be tolerated in a Christian republic, but under certain cautions and conditions. In these conditions to be prescribed, the sentiment is not the same of the Pontiffs and the Lutheran doctors. Becanus the Jesuit, in the Manual of Controversies, bk. 3, ch. 18, pp. 728–29, 1–3, etc., embraces by three conclusions the opinion of the Pontiffs. The summary of the dissertation is that the magistrate can permit the vices and exercises of the Jews if there be a sufficient cause; that the magistrate can also permit usages of theirs, if sufficient cause be known; that the Christian magistrate cannot in good conscience permit, nor leave unpunished the external hatred of the Jews toward Christians. The Lutherans, however, concede to Jews dwelling in a Christian republic under other cautions and conditions, namely: 1. That a free exercise of religion be not conceded to them: circumcision is forbidden to them: polygamy is not permitted. 2. Blasphemy is to be punished in them very severely and restrained by most grave punishments. 3. No public office is to be entrusted to them. 4. That that monstrous usury, by which they drive Christians out, be not permitted. 5. That they be compelled to attend Christian sacred assemblies. 6. That care be taken lest they lead Christians away to the Jewish religion. Which and similar conditions and cautions about tolerating Jews in a Christian republic are required by: D. Helvicus in his System of Judaical Controversies, list of Jews 8, or the last; D. Hutterus in L.C., article 32.9.6, p. 1,037. Dn. D. Gerhardus, tome. 6, thesis 223 of Common Places, article on the Political Magistrate, pp. 890–91 ff., and the theologians of the Jena Academy in their counsel on this matter in the year 1611, and the Theological Faculty of the Academy of Frankfurt on the Oder in the year 1613, reported by Dedekennus, vol. 2, pt. 2, p. 139 ff. &amp; 146 ff. Those conditions were conceived and prescribed piously and prudently, yet they are such that they are more easily desired than obtained. For who indeed could obtain this from the Jews, that they refrain from blasphemies against Christ and from unjust and biting usuries? For if they do not blaspheme Christ openly, yet privately they do not cease to be vexatious with shameful dealings. And he takes away a Jew’s life who prohibits usury to him; for he cannot do without it any more than he can do without common air. But how grave a sin it is to draw the yoke with unbelievers, or to grant them hospitality and the right of citizenship, since they hold a doctrine different from the doctrine of Christ, is more evident from the Scriptures than to require proof. Therefore Luther also, in Disput. Fratr., 8, in Epist., fol. 94 ff., judges with more deliberation concerning the Jews.</p></blockquote>

<blockquote><p>3. A magistrate may compel a heathen nation to the negative reverence of Christ in a indirect way, and that with the sword, though he cannot compel to the positive worshipping of Him: if a Christian prince subdue a pagan nation, he cannot force them with the sword to a positive receiving of the doctrine of the Gospel, but if it be a nation expressly blaspheming Christ, as the nation of the Jews now do, he may compel them to an abstinence from a professed blaspheming of Christ, because he is to use the sword against blasphemy. 4. The weapons of the Church as the Church are not carnal, but spiritual and mighty through God.</p></blockquote>

<blockquote><p>There is one of the chief Reformed divines, Dr. Alting, who in his Problematical Theology, part. 2, problem 21, puts this question: Utrum Judaei in societate Christianorum tolerandi sint [Whether Jews are to be tolerated in the society of Christians]? And he does answer it affirmatively; and I am clearly of his opinion, that it is not only lawful, but if matters be rightly ordered towards them, expedient to admit of them; Nay to invite and encourage them to live in Reformed Christian commonwealths. How far it may be a sin to refuse them admittance when they do desire it upon lawful terms and in a reasonable way, is a further question, which cannot be decided, till the former points of the lawfulness and expediency of admitting of them be made out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Case of Conscience: Whether it be Lawful to Admit Jews into a Christian Commonwealth?’ (London: Wodenothe, 1656) 9 pp.</cite>, p. 2</span></figcaption>

<blockquote><p>Thirdly, it is asked whether the Jews are to be compelled to pay field tithes or the other things that Christians living in houses or dwelling in lands which are within the boundaries of some church are accustomed to pay. It seems that: a. For the Church must by no means be defrauded of its right; but it would be defrauded if Jews were to retain lands and not pay tithes; therefore they are to be compelled to payment. b. Furthermore, it was commanded in the Law of Moses that the sons of Israel should pay tithes to the Levites; similarly it is said in Mal. 3:10: Bring every tithe into my storehouse; and in 2 Chron. 31:5, where it is said that they were offering to God tithes of everything. Since, therefore, Jews are bound to the payment of tithes and are exempt from no privilege, since they are of worse condition and ought to be, by reason of sin, than they were in the time of the Law, they will now be bound to the payment of tithes. c. And if perhaps they should say that they would be bound to render them to their own Levites, against this it is that the Levitical priesthood yielded to the priesthood of Christ Himself, as is had in Heb. 7:12: The priesthood having been transferred, it is necessary that a transfer of the Law also be made. Likewise in Daniel: When the Holy of holies has come. Therefore, Christ having come, your anointing ought to cease; the royal and priestly anointing ought to cease; therefore the payment of tithes was to be made to the priests of the New Law. d. Furthermore, tithes are rendered to God from lands in memory of the benefit of the annual multiplication of fruits; but lands are bounded according to the distinction of churches; therefore by reason of fields or lands tithes are to be paid by all who possess them; therefore Jews, if they possess lands, are bound to pay tithes to the churches. On the contrary: 1. Jews have nothing except from usury in most cases; but from usuries the Church ought to receive nothing; therefore, as it seems, neither ought it to receive anything from lands that have been bought with usuries. 2. Again, Sirach 34:21 says: The oblation of one sacrificing from injustice is defiled; and again: He who offers from the substance of the poor is as one who sacrifices a son in the sight of the father. The Most High does not approve the gifts of the unjust. Since, therefore, these men have nothing except the gifts of the unjust, they ought not to be accepted by the Church, which receives in place of the Most High. [Solution]: To this it must be said that some tithes are predial and some are personal. Predial tithes, however, and whatever churches were wont to receive on account of fields, the churches can ask even from Jews by reason of the fields possessed by them, as is had in the Extra, De decimis, De terris, where it is said that Jews are to be compelled to pay tithes from the lands which they cultivate or to renounce the possessions altogether, lest perhaps the churches be able to be defrauded of their right on that account. Likewise it is had in the Extra, De usuris, Quanto, where it is said that Jews are to be compelled to make satisfaction to the churches for tithes and due oblations, which they are accustomed to receive from Christians from houses and other possessions, so that the churches may be preserved unharmed. Not that anything is to be received from usuries or from things acquired unlawfully, or that oblations are to be received in the church from the Jews themselves, but from things lawfully acquired by them by reason of the houses which they inhabit, lest the church be harmed excessively, if nevertheless the decency of the church in this matter is preserved. But if it should be contrary to decency and the church were not harmed excessively, one should refrain, to avoid scandal. [To the objections]: 1. And by this the contrary objection can be solved, because from usuries, insofar as they are such, the Church cannot ask tithes or oblations. And although lands may have been bought from usuries, nevertheless the Church can ask tithes, because the one who sold could sell only what he had by right, while the thing itself passes with its burden. 2. To the second, however, it must be said that, although oblations or gifts are not acceptable to God, insofar as they are offered by the unjust, nevertheless those things which are owed are acceptable, by reason of the fact that they are owed, if they are paid; whence in one respect they are acceptable, in another respect they are not acceptable; yet the action itself, which proceeds from a perverse will, is not acceptable. But when something is offered from theft or usury, it is not acceptable, because it is not offered from what is one’s own; but its restitution, insofar as it is such, would be acceptable.</p></blockquote>

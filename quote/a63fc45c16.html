<main class="wrap"><figure class="quote" id="q-a63fc45c16" data-kw="">
<blockquote><p>…the king [David] said unto Nathan the prophet, ‘See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains.’ And Nathan said to the king, ‘Go, do all that is in thine heart; for the Lord is with thee.’ And it came to pass that night, that the word of the Lord came unto Nathan, saying, ‘Go and tell my servant David, ‘Thus saith the Lord, Shalt thou build Me an house for Me to dwell in?… And when thy days be fulfilled, and thou shalt sleep with thy fathers, I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom. He shall build an house for my name…’… Then went king David in, and sat before the Lord, and he said, ‘…now, O Lord God, thou art that God, and thy words be true, and thou hast promised this goodness unto thy servant: Therefore now let it please thee to bless the house of thy servant, that it may continue for ever before thee: for thou, O Lord God, hast spoken it: and with thy blessing let the house of thy servant be blessed for ever.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">Old Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2 Sam. 7:2-13, 18, 28-29</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-28d71279c5" data-kw="">
<blockquote><p>§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659)</cite>, ch. 2; p. 417</span></figcaption>

</figure><figure class="quote" id="q-424874201a" data-kw="">
<blockquote><p>[In the Early and Medieval Churches, they taught] To pray towards the East, and that for this cause and signification, because we seek to Paradise, our old and ancient country, and [this] is commended and apostolical, [according to] Basil, Of the Holy Spirit, ch. 27. … The temples [church buildings] were erected to stand East and West, the altars of the Church stood Eastward and some toward the West; Socrates, Ecclesiastical History, bk. 5, ch. 22.</p></blockquote>

</figure><figure class="quote" id="q-632ea4b5ed" data-kw="">
<blockquote><p>There may be a partial separation when one ordinance is so corrupted that we cannot join in it and yet can join with the Church in all other acts of communion: and a total separation when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religious. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended… (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian.</cite>, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-12e409b06d" data-kw="">
<blockquote><p>Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers and to be fined and lie in prison on no better a cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684) | section 5</cite>, p. 33</span></figcaption>

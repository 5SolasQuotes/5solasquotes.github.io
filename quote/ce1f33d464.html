<blockquote><p>III. Unto this catholick visible church Christ hath given the ministry, oracles, and ordinances of God, for the gathering and perfecting of the saints in this life, to the end of the world; and doth by his own presence and Spirit, according to his promise, make them effectual thereunto.[g] [g] 1 Cor. 12:28. Eph. 4:11-13. Matt. 28:19,20. Isa. 59:21.

IV. This catholick church hath been sometimes more, sometimes less visible.[h] And particular churches, which are members thereof, are more or less pure, according as the doctrine of the gospel is taught and embraced, ordinances administered, and publick worship performed more or less purely in them.[i] [h] Rom. 11:3,4. Rev. 12:6,14. [i] Rev. 2-3. 1 Cor. 5:6,7.</p></blockquote>

</figure><figure class="quote" id="q-025c2fa808" data-kw="">
<blockquote><p>It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Scarecrows for Extremism</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-7cc0ca3135" data-kw="">
<blockquote><p>What assemblies of Christians we behold visibly worshiping God in Christ, we take for granted to be true visible churches. And when we judge of our own communion with them, it is not upon this question, whether they are true churches or no, as though the determination of our practice did depend solely thereon: For as we are not called to judge of the being of their constitution, as to the substance of it, unless they are openly judged in the Scripture, as in the case of idolatry and persecution persisted in, so a determination of the truth of their constitution, or that they are true churches, will not presently resolve us in our duty as to communion with them, for the reasons before given. But in such a case, two things are by us principally to be considered:

1. That nothing sinful in it self, or unto us, be required of us as the condition of communion.

2. That we may in such churches obtain the immediate end of their institution, and our conjunction with them, which is our edification in faith, love and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, (1672), ch. 3, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

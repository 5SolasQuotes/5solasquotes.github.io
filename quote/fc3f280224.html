<main class="wrap"><figure class="quote" id="q-fc3f280224" data-kw="">
<blockquote><p>First, there is an important distinction between what is necessary to the being of a Church, and what is necessary to its wellbeing. There are articles of belief to be found in the Word of God, or to be deduced, “by good and necessary consequence,” from it, which it is both the duty and the privilege of a Christian Church to receive and embody in its creed; the denial or rejection of which, however, would not necessarily infer that it had forfeited its essential character, and ceased to be a Church at all.

In like manner, there are departures from Scripture authority or example in respect to outward order and administration in a Church of Christ, in respect to its government and discipline and worship, which, although wrong in themselves, and injurious in their operations and tendency, yet do not suffice to unchurch the Christian society, or to deprive it of its claim to be regarded as a branch of the visible Church of Christ.

There is much, in short, that may be necessary to the perfection of a Church, measured and judged of by the Word of God, that is not necessary to the existence of a Church in such a sense that the want of it would exclude it from the title or privileges of a Church at all. We recognise this distinction every day in regard to a Christian man; and it is no less to be recognised in its application to a Christian society.

There is many a doctrine and truth of revelation, in regard to which a man may err without ceasing on that account to be a Christian man; and there is many a duty recognised in Scripture as binding upon all, in which he may be totally deficient without forfeiting his Christianity. In other words, there is much in doctrine and duty, in faith and practice, necessary to the perfection of a believer, which is not necessary to the existence of a believer as such; and so it is with a Christian Church.

What is essential to its existence as a Church, is some thing very different from what is essential to its perfection as a Church; and although a departure from the standard of the Word of God, either as to creed or outward administration, may be in itself sinful, and must, like every departure from Scripture, be injurious, yet it may be an error neither so fundamental nor extensive in its character as to imply, on the part of the Christian society which has been guilty of it, a forfeiture of its Church state, leaving its ministers without authority to preach, and its ordinances without virtue to bless. No doubt there is a difficulty — and that a very great one — in the practical application of such a distinction as this.

It may be difficult to draw the line between what is fundamental and what is not, between what is essential and what is non-essential to the being of a Christian Church. But the practical difficulty in applying the distinction does not do away with the distinction itself, which, in one shape or other, will make itself to be recognised as just and well founded.

The difficulty in drawing the line between what is necessary and not necessary to the existence and character of an individual Christian is exactly similar to, and not less perplexing than, the difficulty in laying down what is essential or not essential to the existence and character of a Christian society. In both cases there is a practical difficulty in applying the distinction; but in neither can it be overlooked or rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 55-57.</span></figcaption>

<blockquote><p>They made great lamentation. Luke doth also commend their profession of godliness and faith in their lamentation. For a doleful and unprosperous end causeth men, for the most part, to forsake those causes wherein they were delighted before. But, on the other side, these men declare by their mourning, that they are no whit terrified with the death of Stephen from standing stoutly in the approbation of their cause; considering therewithal what great loss God’s Church suffered by the death of one man.

And we must reject that foolish philosophy which willeth all men to be altogether blockish that they may be wise. It must needs be that the Stoics were void of common sense who would have a man to be without all affection. Certain mad fellows would gladly bring in the same dotings into the Church at this day, and yet, notwithstanding, although they require an heart of iron of other men, there is nothing softer or more effeminate than they. They cannot abide that other men should shed one tear; if anything fall out otherwise than they would wish, they make no end of mourning. God doth thus punish their arrogancy jestingly, (that I may so term it,) seeing that he setteth them to be laughed at even by boys.

But let us know that those affections which God hath given to man’s nature are, of themselves, no more corrupt than the author himself; but that they are first to be esteemed according to the cause; secondly, if they keep a mean and moderation. Surely that man which denieth that we ought to rejoice over the gifts of God is more like a block than a man; therefore, we may no less lawfully sorrow when they be taken away.

And lest I pass the compass of this present place, Paul doth not altogether forbid men mourning, when any of their friends are taken away by death, but he would have a difference between them and the unbelievers; because hope ought to be to them a comfort and a remedy against impatience. For the beginning of death caused us to sorrow for good causes; but because we know that we have life restored to us in Christ, we have that which is sufficient to appease our sorrow. In like sort, when we are sorry that the Church is deprived of rare and excellent men, there is good cause of sorrow; only we must seek such comfort as may correct excess.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-986a2e3078" data-kw="">
<blockquote><p>§40. And 1. If the surplice be imposed by the magistrate (as it was), who is a lawful governor, and that directly but as a decent habit for a minister in God’s service, I think he needlessly strained his power and sinfully made an engine to divide the Church by making such a needless law, and laying the peace of the Church upon it; But yet he meddled with nothing but was within the reach of his power in the general. Some decent habit is necessary; either the magistrate or the minister himself, or the associated pastors must determine what. I think neither magistrate nor synod should do anymore than hinder undecency: But yet if they do more, and tie all to one habit (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; he does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment, if I could not be dispensed with. Yea, though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, … (London, 1659), 5th Disputation, ch. 2, pp. 409-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

otes.github.io%2Fquote%2F986a2e3078.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/986a2e3078.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-surplice/#:~:text=40.%20And%201.%20If%20the%20surplice,though%20a%20secondary%20use%20were%20lawful&amp;text=40.%20And%201.%20If%20the%20surplice%20be%20imposed&amp;text=not%20use%2C%20though%20a%20secondary%20use%20were%20lawful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3ca928498c" data-kw="">
<blockquote><p>The church and its supreme governor demanded obedience in all things indifferent. Nonconformists (and it was in this context that the word ‘nonconformist’ first entered the English religious vocabulary) complained that to enforce the use of these things on reluctant consciences was to deprive them of their indifference. The doctrine of ‘Christian liberty’ which came to the fore in these circumstances, was arguably the taproot of that species of Christian conviction known ever since as Puritanism. It was not equivalent to individualistic license, but rather to a conviction that the edification of the church, composed of ‘lively stones’, required the emancipation of conscience from all human ordinances and its total subjection to the word of God… … In 1566 Archbishop Matthew Parker, in consultation with his suffragans and prompted by the queen, published some ‘Advertisements,’ a call to strict conformity… The resultant crisis rocked both the universities of Oxford and Cambridge and came to its head in London, toward Easter 1566. Thirty-seven ministers, much of the preaching ministry in London, at first refused to conform and were suspended; of these a few, the hardest of the hard core, were eventually deprived of their livings… …the Vestiarian Controversy introduced a lasting fault line into the Elizabethan church. The more drastic presbyterianism of the 1570’s might never have come about if it had not been for the episcopal ‘persecution’ of those who cast off the surplice in the 1560’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-collinson.html">Patrick Collinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Vestiarian Controversy’ in Oxford Encyclopedia of the Reformation</cite>, (1996), vol. 4, pp. 231-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

<blockquote><p>A. 3: And God’s prohibition, Deut. 12, of adding or diminishing, is not washed away so easily as your words would make men believe. You say, It reaches to the whole duty of man, and government of the Church, etc. Answer: There be some things in the duty of man and church-matters that God has left to man: To do those is no addition to God’s laws: But to do the like work that God by his Law has done, which He never left to man, seems to me the addition there forbidden: e.g. If men had made another Tabernacle, another ark of the Covenant, another holy vestment for Aaron, another sacrament like circumcision or the Passover, He that so reproved their worshiping in the high places would have reproved these.</p></blockquote>

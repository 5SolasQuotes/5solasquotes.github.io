<main class="wrap"><figure class="quote" id="q-e4fbc8bf29" data-kw="">
<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 58, p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653), on 2 Samuel, ch. 7, p. 390</span></figcaption>

</figure><figure class="quote" id="q-28d71279c5" data-kw="">
<blockquote><p>§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), ch. 2; p. 417</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-77cb6c9ed1" data-kw="">
<blockquote><p>…if so be that thou makest conscience of sanctifying God’s name in duties, then He will sanctify his name in a way of mercy; that is, He will manifest how He does accept of the least degree of holiness though there be much mixture: God has a way to take away the mixture by the blood of his Son, and then to accept of any holiness He sees in thee, He will sanctify his name by meeting with thee and revealing his glory to thee when thou art worshiping of Him: There is an excellent scripture for this, Ex. 29:43, ‘There I will meet with the children of Israel and the Tabernacle shall be sanctified by my glory.’ Thou that hast a gracious heart and art worshiping of God in sincerity, thou art as a tabernacle of God, and God has his service and worship from thee; thou art as the temple of God, and ‘There will I meet with thee’ (says God) ‘and I will sanctify my Tabernacle by my glory.’ God will sanctify thy heart by his glory if thou doest sanctify his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 7, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, p. 119</span></figcaption>

line · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a63c0c2f96" data-kw="">
<blockquote><p>Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47. Q. 155. How is the word made effectual to salvation? A. The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of enlightening,[m] convincing, and humbling sinners;[n] of driving them out of themselves, and drawing them unto Christ;[o] of conforming them to his image,[p] and subduing them to his will;[q] of strengthening them against temptations and corruptions;[r] of building them up in grace,[s] and establishing their hearts in holiness and comfort through faith unto salvation.[t] [m] Neh. 8:8. Acts 26:18. Ps. 19:8. [n] 1 Cor. 14:24,25. 2 Chron. 34:18,19,26-28. [o] Acts 2:37,41. Acts 8:27-39. [p] 2 Cor. 3:18. [q] 2 Cor. 10:4-6. Rom. 6:17. [r] Matt. 4:4,7,10. Eph. 6:16,17. Ps. 19:11. 1 Cor. 10:11. [s] Acts 20:32. 2 Tim. 3:15-17. [t] Rom. 16:25. 1 Thess. 3:2,10,11,13. Rom. 15:4. Rom. 10:13-17. Rom. 1:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-c3eaebbd60" data-kw="">
<blockquote><p>The magistrates look to peace and civil order; tis well done; and tis their duty, yet not the principal, and they do commonly fail in this, that they use not the sword for this end, to urge men to the keeping of the commandments of the First Table, to a practice of pure religion and to the keeping of the Sabbath day. This is the main duty of the magistrate, who bears the sword especially for the good of men’s souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Callings in Works, vol. 1</cite>, p. 764</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68a7082485" data-kw="">
<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God. 4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts... (1684), Unnecessary Separating Disowned</cite>, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-26ffe900ba" data-kw="">
<blockquote><p>Following the Revolutionary war, religious diversity in Connecticut continued to increase. In 1784, Connecticut finally passed an “Act for Securing the Rights of Conscience,” that secured religious freedom for those “professing the Christian religion,” of whatever denomination, and decreed they no longer be taxed to support the Congregational church. But non-Christians could be taxed to support the established church, and Congregationalism remained the established state religion until 1818, when Connecticut passed a new state constitution, replacing the laws of the old colonial charter obtained in 1662. This was not the end of the power and influence of the descendants of the Puritans, however…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nancy-finlay.html">Nancy Finlay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Importance of Being Puritan: Church and State in Colonial Connecticut’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-dfcdf3c447" data-kw="">
<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | question 17</cite>, p. 72 lt col top</span></figcaption>

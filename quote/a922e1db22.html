<main class="wrap"><figure class="quote" id="q-a922e1db22" data-kw="">
<blockquote><p>The whole doctrine of justification displays the glory of God; it sets forth his amazing goodness, his inviolable justice, his wonderful wisdom; it humbles the sinner, takes away all ground of boasting, comforts the soul when cast down and harassed with a sense of its sins, the accusation of the devil, and the terrors of the law, and tends to the promotion of real holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 8.5, p. 380.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.8</span></figcaption>

</figure><figure class="quote" id="q-4a638b46e5" data-kw="">
<blockquote><p>Justification takes place once for all. It is not repeated, neither is it a process; it is complete at once and for all time. There is no more or less in justification; man is either fully justified, or he is not justified at all. In distinction from it sanctification is a continuous process, which is never completed in this life.</p></blockquote>

<blockquote><p>All other works and duties of obedience do accompany faith in the continuation of our justified estate, as necessary effects and fruits of it, but not as causes, means, or conditions, whereon that effect is suspended.</p></blockquote>

</figure><figure class="quote" id="q-64484590ae" data-kw="">
<blockquote><p>Man&#x27;s meritorious work may be considered in two ways: first, as it proceeds from free-will; secondly, as it proceeds from the grace of the Holy Ghost. If it is considered as regards the substance of the work, and inasmuch as it springs from the free-will, there can be no condignity because of the very great inequality. But there is congruity, on account of an equality of proportion: for it would seem congruous that, if a man does what he can, God should reward him according to the excellence of his power. If, however, we speak of a meritorious work, inasmuch as it proceeds from the grace of the Holy Ghost moving us to life everlasting, it is meritorious of life everlasting condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, I-II, q. 114, a. 3</span></figcaption>

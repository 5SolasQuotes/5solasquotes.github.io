<main class="wrap"><figure class="quote" id="q-e710bbc718" data-kw="Author of sin" data-pol="">
<blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote>
<figcaption>— <a href="../authors/benjamin-cox.html">Benjamin Cox</a>, <cite>An Appendix to a Confession of Faith (Baptist, 1646)</cite>, art. 3</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../topics/decrees-and-providence/concurrence.html">Concurrence</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2dfa75593b" data-kw="Author of sin|Satan" data-pol="">
<blockquote><p>Of the author of sin, we confess that our Lord God, though He is the creator and sustainer of all creatures, yet He is not the author of sin. It is rather the evil will, both in the Devil and in the godless human, that, when he does not obtain help from the Lord God, turns away from God, as Christ speaks in John 8, “When the Devil speaks a lie, he speaks of his own, for he is a liar and the father of lies” (v. 44).</p></blockquote>
<figcaption>— <a href="../authors/bohemian-brethren.html">Bohemian Brethren</a>, <cite>The Bohemian Confession (1575/1609)</cite>, Art. 6</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a></div>

</figure><figure class="quote" id="q-f36de3147a" data-kw="Author of sin|Satan" data-pol="">
<blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote>
<figcaption>— <a href="../authors/french-reformed-churches.html">French Reformed Churches</a>, <cite>The French Confession (1559)</cite>, Art. 8</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../topics/fall-and-sin/temptation.html">Temptation</a><a class="tag" href="../topics/creation-and-man/satan-and-demons.html">Satan &amp; Demons</a><a class="tag" href="../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div>

</figure><figure class="quote" id="q-19caa75f31" data-kw="Author of sin" data-pol="">
<blockquote><p>Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.</p></blockquote>
<figcaption>— <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</figcaption>

</figure><figure class="quote" id="q-360e80a51b" data-kw="Author of sin|The Fall|Permission" data-pol="">
<blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote>
<figcaption>— <a href="../authors/herman-witsius.html">Herman Witsius</a>, <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</figcaption>

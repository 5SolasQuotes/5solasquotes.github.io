<main class="wrap"><figure class="quote" id="q-5b83cb9e77" data-kw="">
<blockquote><p>The Church of Antichrist, is the Church of Rome, falsely called Apostolical and Catholic, whereas it is indeed an Apostolical Church, that beast, and indeed disguising it self, and which doth represent the lively image of the Monarchy of the Romans, heretofore defaced of their government, power, honour, and seat among all Nations Revel. 11.7.8. and 13.3. and so forward, and every where in the Revelations: and experience also doth witness the same.

Of this Church there be two parts: to wit, the head, and the members. The head of this Church of Antichrist, is Antichrist himself, the Pope of Rome, the son of perdition, and minister of the Dragon. The members of it be either the Clergy, or the Laity. The Clergy are those unclean spirits coming out of the mouth of the Dragon, of that beast and false Prophet. Revel. 16.13. Of them there be three orders: Cardinals, false. Bishops and the filthy heap of Canonists, schoolmen, and Monks.

Cardinals are those unclean spirits, coming forth of the mouth of the Dragon, of that beast and false Prophet, who go to the Kings of the earth, and of the whole world, honoured by that Antichrist of Rome with a Cardinal’s hat, and sent out that even like frogs, by their clamorous and unpleasant cracking they might be importunate, which all men, to the intent they may gather them to the battle against God. Revel. 16.13.14. False Bishops are unclean spirits, coming out of the mouth of the Dragon of that same beast &amp; false Prophet, who for a great price do buy their cope at Rome, and have special jurisdiction, both civil and ecclesiastical.

That heap of Canonists, Schoolmen, and Monks, are unclean spirits coming out of the mouth of the Dragon, of that same beast and false Prophet, every one according to his place under propping the sea of Rome by murders and lies. But amongst the Monks, those new Monks nowadays have the chiefly, who by a false name are called Jesuits, whereas they are indeed Esauites or Jebusites.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 176-78.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6220ca2321" data-kw="">
<blockquote><p>There is no hierarchy in the church of Christ (Luke 22:25–26; 2 Cor. 1:24; 1 Pet. 5:3). There is no such thing as a diocesan, cathedral, patriarchal, or metropolitan church, for in the New Testament all churches are equal and all have their own ἐπισκοποι; and believers are nowhere instructed to inquire into the legitimate succession of their ministers, but rather to examine the Scriptures and to remain in the teaching [handed down to them] (John 5:39; Acts 17:11; 1 Tim. 4:13–16; 2 Tim. 1:13–14; 3:14–17). Neither does legitimate succession guarantee purity of doctrine (John 8:39; Rom. 2:28; 9:6). [Such succession] would sooner make salvation dependent on certain specific persons and on impracticable, fallible, and often even impossible historical research.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §502</span></figcaption>

</figure><figure class="quote" id="q-dd6fbda734" data-kw="">
<blockquote><p>It is not the case that there is one church at Rome and another in all the world beside. Gaul and Britain, Africa and Persia, India and the East worship one Christ and observe one rule of truth. If you ask for authority, the world outweighs its capital. Wherever there is a bishop, whether it be at Rome or at Engubium, whether it be at Constantinople or at Rhegium, whether it be at Alexandria or at Zoan, his dignity is one and his priesthood is one. Neither the command of wealth nor the lowliness of poverty makes him more a bishop or less a bishop. All alike are successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146</cite>, (to Evangelus), §1</span></figcaption>

</figure><figure class="quote" id="q-3fa1da9b8e" data-kw="">
<blockquote><p>Observe that man of Sin or Antichrist, although singularly, and Emphatically, and as it were, personally pointed at, is not notwithstanding to be understood as terminated in any one individual person whatsoever; but as those many Antichrists make up that wicked society of Apostate Heretics, of what kind soever; so is this great Antichrist.

A chief of this great Apostacy, but as one in succession, though diverse in persons, so it is said of the Pope and Papacy That as to the place and office of the Papacy, all Popes from first to last, are but as one Pope, so when they say, the Pope is head of the Church, that is not intended of any one Pope alone, but of any and all in that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jones.html">Henry Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of antichrist preached at Christ-Church, Dublin, Novemb. 12, 1676. By the Right Reverend Father in God, HENRY, Lord Bishop of MEATH.</cite>, (2nd edn, London: Nathaniel Ponder, 1679), p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

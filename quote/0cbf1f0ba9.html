<main class="wrap"><figure class="quote" id="q-0cbf1f0ba9" data-kw="">
<blockquote><p>…Church government. A point in my judgement, that in regard of itself, needs not to be so exactly looked into and precisely stood upon now, as heretofore: but yet in regard of many unhappy differences and inconveniences that haue risen about it, and been occasioned by it in the Church of God; therefore to satisfy the consciences of some that are weak, and to stop the mouths of others that are clamorous, humorous, and perverse; and to maintain peace and unity in the house of God, and to iustify the state of all reformed Churches, professing the saving faith of Jesus Christ, that howsoever they differ from one another in the matter of Church-government, as some have many failings and sore blemishes in their government, yet all are true Churches of God. I say, in these respects I know not any one point of religion, not fundamental, so necessary to be thoroughly sought into, and advisedly and duly to be considered of:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church… (London, 1631) Randall (1570–1622) was an English puritan.</cite>, Lecture 14, pp. 229-30</span></figcaption>

</figure><figure class="quote" id="q-77e12c9963" data-kw="">
<blockquote><p>Excess of passion in opposing evil, though not to be justified, yet shows a better spirit than a calm temper when there is just cause of being moved. It is better that the water should run somewhat muddily than not run at all. Job had more grace in his ill temper than his friends in their seemingly wise demeanour. Actions stained with some defects are more acceptable than empty compliments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed, in Works, vol. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

— Richard Sibbes, The Bruised Reed, in Works, vol. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CExcess+of+passion+in+opposing+evil%2C+though+not+to+be+justified%2C+yet+shows+a+better+spirit+than+a+calm+temper+when+there+is+just+cause+of+being+moved.+It+is+better+that+the+water+should+run+somewhat+muddily+than+not+run+at+all.+Job+had+more+grace+in+his+ill+temper+than+his+friends+in+their+seemingly+wise+demeanour.+Actions+stained+with+some+defects+are+more+acceptable+than+empty+compliments.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+The+Bruised+Reed%2C+in+Works%2C+vol.+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F77e12c9963.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/77e12c9963.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-peace-purity-of-the-church/#:~:text=Excess%20of%20passion%20in%20opposing%20evil%2C,are%20more%20acceptable%20than%20empty%20compliments." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-97f57827ec" data-kw="">
<blockquote><p>Beware also of spending your time and spirits in debates and vain janglings one with another, to be temptations one to another, raising your own and others passions and corruptions instead of holy conference that might minister grace to the hearers. Mind well the apostle’s caveats in 1 Tim. 1:4-7; 5:13; 6:3-5; 2 Tim. 2:16-17; 1 Thess. 4:11. Is it not observable that the greatest sticklers in differences, the greatest disputers and contenders are usually the most distempered and barren hearted? like the mountains of Gilboa, high and hot indeed, but dry and unfruitful; warm, but withered; the unkindly, foolish, heat of division and debate, eating out the life, sap and native heat of real religion, which evanishes then into airy notions and litigious strivings, whereof no edification comes. O let not religion fly up from your hearts to your heads and evaporate into airy foams and forms and turn vapid and insipid. Be sure by questions and disputes as well the power of religion is enervated as the majesty of it infringed. The many disputes about religion commonly overthrows the practice of it, which consists not in discourses, but in doing. It is easy for a formal, moth-eaten Christian to hold up in the one, while he cannot bear up in the other, as Seneca observed anent moral virtue, Omnes disputare malunt, quam vivere, more prone are people to debate about the things of God, than to practice what is uncontroverted. If heaven could be obtained, and God pleased with jangling and debates, a profane sophister should sooner have the one and do the other than a holy Christian who knows that it is not talking of, but walking in the ways of God’s commandments that is most acceptable in his sight. But to say no more, listen to the apostle’s oracle in 1 Cor. 11:16, ‘If any man seem to be contentious, we have no such custom, nor the Churches of God.’ Love perverse disputings who will (which ever corrupts the mind), flee ye them as death, 1 Tim. 6:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, pp. 165-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-3941b2b017" data-kw="">
<blockquote><p>…this accommodation is not impossible: if indeed it were, God does not bind us to the seeking after it… If we look upon the nature of the things wherein they differ, they are not of such moment as to divide between brethren; their differences are not about fundamentals, but superstructures: there is no opinion expressly maintained by either side which is directly contrary to the substance of faith, or destructive to salvation; nay, whatever are such, they are condemned by both. Nor [is] the difference in those matters wherein they differ so wide but they may be composed and brought together, if men will act humility and self-denial. It was said of the differences between Luther and the [reformed] Helvetians, that there was not any impossibility in respect of the things themselves; if their spirits could be reconciled, their causes might easily be reconciled… where the difference is substantial, I do not see but if humility and self-denial might take place, if interests might be waved, if pre-engagements might be slighted, even in those things there might be an agreement; certainly, God does not make the difference so great as we ourselves do make it… It was the speech of one concerning the reconciliation of the German Churches: It is possible for the most hot and rigorous spirits to be reconciled, but it is easy for peaceable and moderate men to be agreed. The differences are not between enemies, but between brethren, and neither of them proud, imperious and contentious, but both of them humble, holy and peaceable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Arraignment of Error (London: Miller, 1646)</cite>, pp. 349–50</span></figcaption>

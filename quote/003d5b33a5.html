<main class="wrap"><figure class="quote" id="q-003d5b33a5" data-kw="">
<blockquote><p>According to God’s promise (Gen. 17:7; Acts 2:39), the children of believing parents are included in the covenant of grace and must be received as members of the church by baptism. This promise is precious, and the privileges it confers on our children are great indeed. But they afford us no ground to presume that our children are regenerate and no reason to treat them as such before they come to saving faith and repentance. We baptize infants based on many points, but not on account of ‘presumptive regeneration.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-beeke.html">Joel Beeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Praying for our Children’s Salvation’ 11 paragraphs</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0bde8ca3a7" data-kw="">
<blockquote><p>Conclusion I: None have a right to baptism before the Lord, but those who have actually a saving interest in the Lord Jesus Christ… Conclusion II: Visible believers, and such as have a profession of religion, probably signifying their having a saving interest in Christ, have a right to baptism before the church, so that they may be admitted thereto, though indeed they have no saving grace, yea or never shall have it… Conclusion III: None but visible believers, or such as appear to have a saving interest in Christ, have right to baptism before the Church… Conclusion IV: All infants descended of parents whereof one only is a visible believer, has right to baptism before the church… Such are in covenant with God visibly; we are to look on them as probably within the covenant, as to the saving benefits thereof, so that none can forbid water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macpherson.html">John MacPherson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 82-90 of ‘The Idea of the Church and Membership in it’, Lecture 2 in The Doctrine of the Church in Scottish Theology 1903 | Thomas Boston, ‘Who Have Right to Baptism, and are to be Baptized’ in Works 6.126-39:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a></span></div>

%20none%20can%20forbid%20water" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Apostle Peter declares that baptism “saves us by the resurrection of Jesus Christ” (1 Pet. 3:21). Not by its own efficacy, therefore, but as the emblem of what has been done by Christ’s redemption, whose “resurrection” is one of the constituent factors in it. And in order to preclude the notion that the mere application of water has any spiritual effect like that of regenerating the soul, the apostle explains that baptism does not “save by the putting away of the filth of the flesh,” but by “the answer of a good conscience toward God.” The “answer of a good conscience” is its pacification through the atonement of Christ for sin, to which baptism has reference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, on 1 Pet. 3:21</span></figcaption>

</figure><figure class="quote" id="q-0ab17e83da" data-kw="">
<blockquote><p>…for no doubt God in his decree and secret intention may intend, by the ministry of his servants, the true and real conversion of many hypocrites, such as are no less unconverted, then [Simon] Magus and Demas; for He hath mercy, on whom He will, Rom. 9:17, but according to this way, ‘these who are converts in the judgment of charity’ (he [Hooker] should say only converts in that judgment) are not according to God’s revealed intention and approving will or command taken in by pastors, that they may be really converted: for God giveth, in no sort, this command to pastors in his revealed intention. [Hooker:] ‘See that ye admit no fools to wisdom’s table or within wisdom’s house, but such only as you believe in charity are real converts, and both called and chosen,’ contrary to Prov. 9:1-4; Mt. 22:8-9,14. Therefore [it would follow on Hooker’s terms], by my revealed intention and command you are not to intend their conversion, but to presuppose that they were already converted: otherwise, if the Lord by his revealed intention and command will have such hypocrites who are but nominal saints, brought in that they may be truly converted, there must follow two contradictory intentions revealed in God: for the Lord’s command to pastors is [would be] ‘I command you to preach to these who are converts in the judgment of charity, that upon my intention, they may be truly converted’; and also: ‘I command you, my pastors, preach to no Church members, that upon my intention, they may be converted, because you are not to preach to any as pastors, but to such as ye know are already converted, according to my revealed intention and will.’ M. Hooker seeing this addeth: ‘But if M. Rutherford mean that the Church doeth of purpose receive them into the Church to be converted, then it is cross to his own tenet, and a person may be received to the seals of the covenant, who doeth not notify that he hath faith, nay the Church may receive them to the seals, whom she knoweth hath no right to the seals, for she knoweth they are not invisible members, which in Mr. Rutherford’s judgment only giveth them right.’ [Rutherford’s] Answer: It is not cross to my tenet, that a person, such as Demas and Magus may be received to the seals, and yet they doe not notify [that] they have saving faith and internal conversion, for my tenet is that the Church can only judge of visible walking and profession in point of admission or not admission to seals, and in that point the Church hath nothing to do to judge whether they have faith-saving or not; none can partake savingly of the seals for their own personal salvation and without sin, but these only who have saving faith, but the Church may admit without sin multitudes, who eat and drink their own damnation, 1 Cor. 11:26-27, and yet pass no sentence of signs notifying faith or no faith, internal conversion or no internal conversion upon them.</p></blockquote>

oubt%20God%20in%20his%20decree%20and&amp;text=internal%20conversion%20or%20no%20internal%20conversion%20upon%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, Book XI, ch. II, Of the Efficacy of the Sacraments</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4f744bb094" data-kw="">
<blockquote><p>Increasingly, during the nineteenth and twentieth centuries, both the legacy of the Enlightenment and the heritage of Christianity desired the thrill of possessing the culture—this world as we see it! Dutch neo-Calvinism has participated in this cultural battle, but it seems to me that the underpinnings of the eschatological vision of the Enlightenment have increasingly encompassed the eschatological vision of neo-Calvinism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-d-dennison.html">William D. Dennison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dutch Neo-Calvinism &amp; the Roots for Transformation: an Introductory Essay’ JETS 42/2 (June 1999) 271–91</cite>, p. 273</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c00aba9715" data-kw="">
<blockquote><p>Both Roman Catholicism and liberal modernism, though fiercely opposed to each other through much of their history, draw from the same poisoned well: the exaltation of man over the Word of God. One exalts church leaders, especially the pope, as its divinely reliable guide. The other exalts human reasoning and/or feelings as the supreme judge of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-r-beeke-paul-m-smalley.html">Joel R. Beeke &amp; Paul M. Smalley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Systematic Theology</cite>, vol. 1, ch. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a></span><span class="t"><a href="../topics/modern-errors/higher-criticism-and-liberalism.html">Modern Errors: Higher Criticism and Liberalism</a></span></div>

</figure><figure class="quote" id="q-1e22842c9d" data-kw="">
<blockquote><p>But, alas! what need is there of miracles, such as healing sick bodies and restoring sight to blind eyes, when we see greater miracles done every day by the power of God’s Word? Do not the spiritually blind now see?… And if we have the thing already which such miracles were only intended to introduce, why should we tempt God in requiring further signs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-whitefield.html">John Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Arnold A. Dallimore, George Whitefield: the Life &amp; Times… (Banner of Truth, 1970), vol. 1</cite>, pp. 348-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

— John Whitefield, Arnold A. Dallimore, George Whitefield: the Life &amp; Times… (Banner of Truth, 1970), vol. 1, pp. 348-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%2C+alas%21+what+need+is+there+of+miracles%2C+such+as+healing+sick+bodies+and+restoring+sight+to+blind+eyes%2C+when+we+see+greater+miracles+done+every+day+by+the+power+of+God%E2%80%99s+Word%3F+Do+not+the+spiritually+blind+now+see%3F%E2%80%A6+And+if+we+have+the+thing+already+which+such+miracles+were+only+intended+to+introduce%2C+why+should+we+tempt+God+in+requiring+further+signs%3F%E2%80%9D%0A%0A%E2%80%94+John+Whitefield%2C+Arnold+A.+Dallimore%2C+George+Whitefield%3A+the+Life+%26+Times%E2%80%A6+%28Banner+of+Truth%2C+1970%29%2C+vol.+1%2C+pp.+348-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e22842c9d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e22842c9d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-miracles-the-cessation-of-the-gift-of-miracles/#:~:text=But%2C%20alas%21%20what%20need%20is%20there,tempt%20God%20in%20requiring%20further%20signs&amp;text=But%2C%20alas%21%20what%20need%20is%20there%20of%20miracles&amp;text=should%20we%20tempt%20God%20in%20requiring%20further%20signs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2919ed038a" data-kw="">
<blockquote><p>VIII. But there is also a certain faith which is numbered among the peculiar gifts of the Spirit in 1 Cor. 12:9, and which does not fall to all who are in the Church: but to certain few, as it seemed good to the Holy Spirit. This is the faith by which miracles are performed, whence it has also taken its name. And it is found in him who, called by God to perform miracles and having a promise about this matter (just as the apostles had from the mouth of Christ, and many others from the internal revelation of the Spirit), does not hesitate or distrust: but is certainly persuaded that God can and will effect those stupendous works through him. Christ speaks of this faith in Mark 11:22 when he says to the disciples, ‘Have faith in God. Truly I say to you, whoever says to this mountain, ‘Be taken up and thrown into the sea,’ and does not doubt in his heart, but believes that what he says will come to pass, it will be done for him.’ Christ also reproaches the disciples for their lack of this faith in Mt. 17:20, when he attributes the reason why they could not cast out the demon to their unbelief. And the apostle refers to this in 1 Cor. 13: ‘If I have all faith, so as to remove mountains, but have not love, I am nothing.’ … X. But here we have a dispute with the doctors of the Roman Church: for they confuse justifying faith with that which we just called historical, and make no distinction between them: but plainly want them to be one and the same. Then they also teach that the faith of miracles is nothing other than a certain excellent degree of justifying faith [and thus working miracles can be normal for believers]. … XIII. Then it is also manifest that the faith of miracles is not an eminent degree of justifying faith, from the fact that some are endowed with that faith who nevertheless do not have justifying faith. For to many who will say to Christ, “Did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?” Christ will respond, “I never knew you,” as Christ himself testifies in Matthew 7:22. Add that the Apostle in 1 Corinthians 12:9 numbers faith of signs among the various charismas of the Spirit, which the Papists call Graces freely given. But an eminent degree of justifying faith pertains to grace making one pleasing [to God]. For it is given for the salvation of him who has it: not truly, as those free gifts of the Spirit, for the salvation of others. Then, if the faith of miracles were an excellent degree of justifying faith, Christ, reproaching the disciples for their lack of that faith, would not say to them, “If you had faith like a grain of mustard seed, you could say to this mountain, ‘Move from here to there,’ and it would move, and nothing would be impossible for you.” For a grain of mustard seed denotes something very small in the Scriptures, and it is as much as if Christ were saying, “If you had even a little bit of faith.” … XV. …And if God promises something special and calls to the working of a miracle, then it [saving faith] also supplies the power of miraculous faith; nor does he who now believes the Word of God as is fitting, if a special promise is directed to him, need a new habit to give assent to it. Whence it is that the Apostle, commending the power and efficacy of salvific faith, attributes to it various miraculous works which holy men once performed or which were done by their grace: saying, “By faith the fathers passed through the Red Sea,” and “By faith the walls of Jericho fell down,” and “By faith some stopped the mouths of lions and quenched the violence of fire.” Hebrews 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on Faith’ in Theological Theses put forth at Various Times at the Academy of Sedan 3rd ed. tr. by AI by Onku (1645; London: Moses Pitt, 1683), p. 2 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</cite></span></figcaption>

</figure><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit. 2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life. 2. This rendering up is not till the end, then shall the end be. 3. It is when all rule and authority shall be put down, v. 27; this is not in this life. 4. It is when the last enemy shall be subdued, v. 26. 5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>

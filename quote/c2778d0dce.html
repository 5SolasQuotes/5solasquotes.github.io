<blockquote><p>Many more effectual reasons are produced by our divines for the denial of this natural affection in God [necessarily resulting in sending Christ for the human race, Jn. 3:16] in the resolution of the Arminian distinction (I call it so, as now by them abused) of God’s antecedent and consequent will, to whom the learned reader may repair for satisfaction: so that the love mentioned in this place is not that natural affection to all in general, which is not:</p></blockquote>

<blockquote><p>1st Use. This shows the reason why the preaching of the Word and all the dispensations of grace are so ineffectual and do so little good upon the hearts of most men: why there are so few converted and brought home to God: the heart is hard, hard by nature, hardened more by custom in sinning… 2nd Use. The ministers of God should from hence learn to use all their might and skill in dispensing the Word of God’s grace to the sons of men.</p></blockquote>

</figure><figure class="quote" id="q-538a3e473a" data-kw="">
<blockquote><p>In another way, they can be distinguished thus: The divine will, as will be clear below, wills something simply, and wills something conditionally or as much as is in itself; and in both ways it happens that it is signified. Therefore, the absolute will can be compared to something either by way of complacency or by way of displeasure. If by way of displeasure, that in no way happens: and thus it does not happen that this is signified or known by any exterior sign. If by way of complacency, either because that which happens pleases, and thus fulfillment; or because something from that pleases, and thus permission; and thus we have two signs. Again, the divine will can be signified as antecedent or conditional, and this in two ways: either by way of complacency, such that the opposite does not please, and thus command; or by way of displeasure, and thus prohibition; or by way of complacency, such that the opposite does not displease, and thus counsel. By way of displeasure, however, such that the opposite does not please, it is impossible to find [this]. And according to this, the number and sufficiency and the solution to the objections are clear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 45, art. 3, quest. 2, On the number and sufficiency of the signs of the divine will</span></figcaption>

</figure><figure class="quote" id="q-221bfde8a3" data-kw="">
<blockquote><p>As for the divine commiseration of sinners, it shows that their death and damnation are not things primarily well-pleasing unto God: but it shows not that God must become an hypocrite and a dissembler if He have eternally decreed to permit them to incur death and damnation by their own default. For God’s mercy being actio sublevantis [an act of taking away] and not passio condolentis [a passion of suffering with], it ties Him not to do all He can for redeeming any man out of his misery; but his action is ordered and limited by his own free-will. It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, … (Cambridge, 1641), ‘Whether absolute reprobation oppugn the truth and sincerity of God’, pp. 357-58</span></figcaption>

<blockquote><p>§12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

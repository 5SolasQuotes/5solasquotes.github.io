<main class="wrap"><figure class="quote" id="q-c5080ce246" data-kw="">
<blockquote><p>We do not adore a creature; by no means. For such errors belong to the heathen and the Arians; but we adore the Lord of the creature, the incarnate Word of God. For although the flesh itself by itself is a part of created things, still it has become the body of God. Nor do we pay adoration to this body as separately distinguished from the Word, nor, when about to adore the Word, do we separate the Word far from the flesh, but since we know, as it is said, ‘The Word was made flesh,’ we acknowledge Him as God even in the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 60, ‘To Adelphius’ against the Arians NPNF2</cite>, 4:575; PG 26.1074-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a1fd841cf" data-kw="">
<blockquote><p>None of us teaches that the man Christ should not be worshiped, but we deny only that the humanity should be worshiped. For the man is one thing and the humanity is another. The man Christ is to be worship[ped] since he is God. But the humanity, that is, the flesh of Christ, is not God. Therefore it is not also an object of worship, even though it has been personally united to the Word [logos]. We worship the whole Christ, but not the Whole of Christ, that is, the humamty with the Deity. We will explain this with an analogy. I worship a king or prince clothed in purple, crowned, holding a scepter in his right hand. In that worship I do not pay heed to the crown which he wears on his head or to the purple with which he is dressed or to the scepter which he holds in his hand. Nevertheless I do not separate the crown, the purple or the scepter from the king. So also in the religious adoration of Christ, we direct our invocation to the Son of God, that is, to his divinity, as to the sole, proper object of religious adoration, and not to his humanity. Nevertheless we do not separate the humanity from the deity of the Son of God. For we distinguish the natures and their properties; we do not separate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 403</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-4b48546fda" data-kw="">
<blockquote><p>5. Christ, God and man, indeed forgives sins, but in a diverse manner: as He is God, and as He is man. Whereon it also follows, that Christ, God and man (which we also confess) together with the Father and the Holy Ghost, forgives sins: but He does it in one sort, as He is God, and in another, as He is man. For as He is God, He does effect the same properly and of his authority: but as He is man, He does it, and did it in the flesh, as being a fellow-worker with the deity: in his human will consenting to the divine, and pronouncing the words ‘Thy sins are forgiven thee’: as also Leo the First, Epistle 10 [28], ch. 4, so expounds it to Flavianus, saying, each form (namely of God and man) works with communion of the other, that which is proper to itself: as, the Word working that which is proper to the Word, and the flesh performing that which belongs to the flesh. To forgive sins was the proper action of the divine nature: and to say, ‘Thy sins are forgiven thee’, of the human. Thus far he.</p></blockquote>

</figure><figure class="quote" id="q-8ff5227a6a" data-kw="">
<blockquote><p>For the whole Christ is adored, but not the whole of Christ. Abstract and concrete terms should not be confused, and a distinction between the natures and properties, against a Eutychian confusion of the natures and properties, ought to be maintained. We read that Cyril did this carefully, who left us his writing on John, book 2, cp. 92, as follows: The humanity [of Christ], says Cyril, considered simply in itself and not in the relation counts itself among those who worship, and Christ also worships, as man, after He became man. But He is always worshipped with the Father and the Spirit since He is true God according to his nature. And again, Should we worship Immanuel as a man (in Himself, namely, considered absolutely in the union)? No. This in fact would be nonsense, both a deception and also a mistake. In doing so we would in fact differ in no way from those who worship the creature alongside the maker and author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 414</span></figcaption>

<blockquote><p>Q. 41.9. How often were the commandments written on tables of stone? A. The first being broken by Moses, on occasion of the idolatry of Israel, Exod 32:19, the Lord condescended to write on two other tables, the very same words that were on the former, Exod 34:1. Q. 41.10. Was there any difference between the first two tables and the second? A. The first two, which were entirely the work of God, (the polishing as well as the engraving,) were broken beneath the mount, Exod 32:16,19; but the second, which were hewed by Moses, the typical mediator, were put into the ark, Deut 10:3,5. Q. 41.11. What spiritual mystery was represented by this? A. That though the covenant of works, made with the first Adam, was broken and violated by him, yet it was fulfilled in every respect by Christ the true Mediator, who “restored that which he took not away,” Ps 69:4.</p></blockquote>

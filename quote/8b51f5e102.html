<main class="wrap"><figure class="quote" id="q-8b51f5e102" data-kw="">
<blockquote><p>As for the curses drawn out of divers Psalms, where David craveth God’s help against his enemies, desiring that they may be overthrown and confounded, we say as we have said touching that which S. Paul writeth of Alexander the copper smith that is: that David having the spirit of prophecy, might have certain revelation of the overthrow of those against whom he prayed and guided by the same spirit, he forsheweth and wisheth (in conforming him self to the just judgement of God) that his enemies shall come to shame and confusion:

Considering also that this Prophet represented the head of the Church, that is to say Jesus Christ, King of Kings and only head of the faithful: And in this respect he boldly proceedeth and saith: that all they that withstand him whom God hath raised up above others, shall be sharply punished for their boldness and rashness for that they with stand God and his Christ. We may not then defend our selves with such like cursings as are found in many places of Scriptures, seeing there are certain things particular to Prophets, which cannot consequently belong to them that are much inferior to such holy personages: which did as it were foresee their overthrow at hand, whom they wished to be saved if they would have repented: …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-marlorat.html">Augustine Marlorat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of the sin against the holy ghost made by M. Augustine Marlorate. Translated out of French to the great consolation of all such as repent them of their sins, and to the astonying [sic] of those that mock and despise the gospel of our Lord Jesus Christ</cite>, (London: Lucas Harison, [1570]), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1a602939db" data-kw="">
<blockquote><p>Teaching and admonishing one another. This is one way wherein we are to be the means of each others’ instruction and one means whereby the Word of God, particularly that part of the Word that consists in psalms &amp; hymns and spiritual songs is to dwell in us richly in all wisdom. Singing of Psalms is a Great help to a spiritual understanding of the Psalms. The mind of the Holy Ghost in the Psalms is often times conveyed while the Psalm is a singing, and as it is a means of a spiritual understanding of that excellent part of the Word of God… What should be sung, viz. Psalms. What seems to be here intended, at least chiefly, is the Psalms and spiritual songs that are contained in the Word of God, for the apostle is speaking of the Word of God. Let the Word of God, says he, dwell in you richly in all wisdom, and then he mentions singing as a means, but then it must be singing some part of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon Notes on Col. 3:16 in Sermons, Series II</cite>, 1736 (WJE Online Vol. 51)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-74fab6d43f" data-kw="">
<blockquote><p>The worship of God is commanded by our assemblies to be in private families, as catechizing by the master of the family (or some other better gifted in every family; Deut. 6:6-8; Gen. 18:19; Eph. 6:1-3; 2 Tim. 3:15), and praying (Zech. 12:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 20, 13th Article, ‘Private Worship’, p. 326</span></figcaption>

<blockquote><p>The latter half of the 19th century was a time of immense change in Presbyterianism worldwide in respect of the role of music in worship. Within this period the long tradition of unaccompanied congregational psalmody gave way to the introduction of hymnody, instrumental music (initially provided by harmoniums and later by pipe organs) and choral music in the form of anthems.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/laurence-moore.html">Laurence Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sing to the Lord a New Song</cite>, 1861-1901 (2004) 196 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-a446311bcc" data-kw="">
<blockquote><p>When therefore you meet with those that fear God, make improvement of the communion of saints, not only by communicating in natural, and temporal good things as you are able, and as there is need; but especially in the communion of things spiritual, edifying yourselves in your most holy faith, by holy speech and conference, and in due time and place) in reading the holy Scriptures &amp; good books, and by prayer, and singing of Psalms together (Col. 3:16, Rules of singing). That your singing may please God, and edify yourself and others, observe these: Sing as in Gods sight, and, in matter of prayer &amp; praise speak of God in singing. The matter of your song must be spiritual, either indited by the Spirit, or composed of matter agreeing thereunto (Col. 3:16). You must sing with understanding. You must sing with judgement, being able in private to make choice of Psalms befitting the present times and occasions; And both in private and public to apply the Psalm sung to your own particular, as when and how to pray and praise in the words of the Psalm, taking heed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, … (London, 1631), ch. 9, ‘Of keeping Company, as in the sight of God’, section 3, p. 236-7. While Scudder in the passage immediately below allows Col. 3:16 to speak of uninspired compositions in the context of private or social conference, yet the only reference in the book to the content of the Church’s public praise is to ‘psalms’ simply, as is documented below.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

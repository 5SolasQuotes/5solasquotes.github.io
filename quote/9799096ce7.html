<blockquote><p>In administering the Supper I have sometimes made use of the words of Paul; but since they could not be repeated for each individual without causing too long a delay (and if, during the reading, several persons went forward, scarcely one in ten could apprehend what I intended, and no one perceived the sentence as a whole), I preferred to desist.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-816ed4b644" data-kw="">
<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (1646)</cite>, pp. 49-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

uote/816ed4b644.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/#:~:text=5.%20We%20know%20the%20Tabernacle%20and,to%20be%20the%20will%20of%20God%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b1da1a9cb3" data-kw="self-exam">
<blockquote><p>Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.22</span></figcaption>

<blockquote><p>VIII. Human Law is that which, from principles known by nature and experience, prescribes, sanctions, and commands to be observed certain particular conclusions and determinations, useful, honest, and necessary for the public and private good both of Church and Commonwealth, according to the reason and convenience of persons, things, times, places, and other circumstances: which laws, if they conflict with divine or natural right, are unworthy of the name of law, and in no way obligate the conscience of those who are subject either to observance or to punishment.</p></blockquote>

</figure><figure class="quote" id="q-6fa60112ce" data-kw="">
<blockquote><p>§29 The Decalogue has been prescribed for all people to the extent that it agrees with and explains the common law of nature for all peoples. It has also been renewed and confirmed by Christ our king. Jerome Zanchius says that this is the common judgement of theologians (De Redemptione, I, 10, 1 [actually thesis 1 of the second section (“De legibus humanis“) of Chapter 10].)… §30 Proper law (lex propia) is the law that is drawn up and established by the magistrate on the basis of common law (lex communis) and according to the nature, utility, condition, and other special circumstances of his country. It indicates the peculiar way, means, and manner by which this natural equity among men can be upheld, observed, and cultivated in any given commonwealth. Therefore, proper law (jus proprium) is nothing other than the practice of this common natural law (jus naturale) as adapted to a particular polity. It indicates how individual citizens of a given commonwealth are able to seek and attain this natural equity. Whence it is called the servant and handmaiden of common law (jus commune), and a teacher leading us to the observance of common law. §31 Proper law is established for two principal reasons, as Zanchius says [De Redemptione, I, 11, 1]. The first reason is that not all men have sufficient natural capacity that they are able to draw from these general principles of common law the particular conclusions and laws suitable to the nature and condition of an activity and its circumstances. The second reason is that natural law is not so completely written on the hearts of men that it is sufficiently efficacious in restraining men from evil and impelling them to good… In this sense, it is said that “law is set forth not for the just, but the unjust.” (1 Tim. 1:9) §32 There are two parts of this [proper] law. The first is its agreement with common law, and the second is its difference, as Francis Junius observes (De Politicae Mosis Observatione) and the jurists teach (In commentaries on the Digest I, 1, 4)… Its agreement (convenientia) with common law is in those matters common to each law, namely, in the starting point from which analogical deductions are made, in the subject under consideration, and in the purpose… The purpose of each [common and proper law] is justice and piety, or sanctity, and the same equity and common good in human society. Its difference (discrepantia) from common law arises from the fact that, in accommodation to particular and special circumstances, it departs somewhat from common law, adding or subtracting something from it. Proper law differs for two reasons, each of which provides a necessity for adding or subtracting something from common law. And so mutability, or the possibility and necessity of just changes, is introduced… Since the nature and condition of these circumstances may be diverse, inconstant, and changeable, it is not possible for proper law to acknowledge one and the same disposition of common law for everything and in everything, as Junius and Zanchius, together with the jurists, say. Therefore, this law is rightly said to be mutable or subject to change with respect to circumstances and its consequent difference from common law. But it is altogether immutable with respect to its agreement with common law. So the jurists assert together with Junius, Zanchius, Martyr, and Bucer. Thus common or moral law concludes from its principles that evildoers ought to be punished, but proposes nothing concerning the punishment. Proper law determines specifically that adulterers, murderers, and the like are to be punished by death, unless the punishment should be mitigated because of further circumstances. Various punishments, for example, exist in the Mosaic Law for these crimes… For this reason, the moral precepts of the Decalogue, having no certain, special, and fixed punishment attached to them, are general. The forensic and political law then makes specific determinations, which it relates to the circumstances of any act. §34 This proper law is one thing among the Jews, another among the Romans, another among the Germans today, and still another among other peoples… §35 Jewish proper law is twofold. It is in part ceremonial, and in part forensic or judicial… §37 The forensic [judicial] law was the means by which the Jews were informed and instructed to observe and obey both Tables, or the common law, for the cultivation of human society among them in their polity, according to the circumstances of things, persons, place, and time… §40 It should be observed that often one and the same law of the Jews could be said in varying respects to be moral (or common), ceremonial, and forensic, and to this extent mixed. What is moral in such a law is perpetual; what is judicial can be changed by the change of circumstances… … Ch. 22, §3 From these things it follows that the magistrate is obligated in the administration of the commonwealth to the proper law of Moses so far as moral equity or common law are expressed therein. This is to say, he is required to conform to everything therein that is in harmony with common law. But he is by no means required to conform in those things in which the proper law of Moses, in order to be accommodated to the polity of the Jews, differs from common law. §4 For if the magistrate should establish as absolutely necessary these proper Jewish laws, which by their nature are either changeable or obsolete, he would destroy christian liberty, which has been given for edification to him and to others, and would entangle himself and others in the yoke of slavery. Thereby he would make a necessity of something free, and impede consciences by a grievous and dangerous snare. He would obtrude mortal laws, which were promulgated in former times only for the Jewish people and are by their nature subject to change for a variety of reasons, as if they were immortal. And unless proper laws are changed with the changing circumstances because of which they broadly exist, they become wicked and attain neither to the equity of the Second Table of the Decalogue nor the piety of the First. Thus they cease to contain the common foundation of right reason. Accordingly, the magistrate who makes the proper law of Moses compulsory in his commonwealth sins grievously. For those particular circumstances and considerations because of which the Jewish proper law was promulgated should bear no weight in his commonwealth…</p></blockquote>

t%2C+but+the+unjust.%E2%80%9D+%281+Tim.+1%3A9%29+%C2%A732+There+are+two+parts+of+this+%5Bproper%5D+law.+The+first+is+its+agreement+with+common+law%2C+and+the+second+is+its+difference%2C+as+Francis+Junius+observes+%28De+Politicae+Mosis+Observatione%29+and+the+jurists+teach+%28In+commentaries+on+the+Digest+I%2C+1%2C+4%29%E2%80%A6+Its+agreement+%28convenientia%29+with+common+law+is+in+those+matters+common+to+each+law%2C+namely%2C+in+the+starting+point+from+which+analogical+deductions+are+made%2C+in+the+subject+under+consideration%2C+and+in+the+purpose%E2%80%A6+The+purpose+of+each+%5Bcommon+and+proper+law%5D+is+justice+and+piety%2C+or+sanctity%2C+and+the+same+equity+and+common+good+in+human+society.+Its+difference+%28discrepantia%29+from+common+law+arises+from+the+fact+that%2C+in+accommodation+to+particular+and+special+circumstances%2C+it+departs+somewhat+from+common+law%2C+adding+or+subtracting+something+from+it.+Proper+law+differs+for+two+reasons%2C+each+of+which+provides+a+necessity+for+adding+or+subtracting+something+from+common+law.+And+so+mutability%2C+or+the+possibility+and+necessity+of+just+changes%2C+is+introduced%E2%80%A6+Since+the+nature+and+condition+of+these+circumstances+may+be+diverse%2C+inconstant%2C+and+changeable%2C+it+is+not+possible+for+proper+law+to+acknowledge+one+and+the+same+disposition+of+common+law+for+everything+and+in+everything%2C+as+Junius+and+Zanchius%2C+together+with+the+jurists%2C+say.+Therefore%2C+this+law+is+rightly+said+to+be+mutable+or+subject+to+change+with+respect+to+circumstances+and+its+consequent+difference+from+common+law.+But+it+is+altogether+immutable+with+respect+to+its+agreement+with+common+law.+So+the+jurists+assert+together+with+Junius%2C+Zanchius%2C+Martyr%2C+and+Bucer.+Thus+common+or+moral+law+concludes+from+its+principles+that+evildoers+ought+to+be+punished%2C+but+proposes+nothing+concerning+the+punishment.+Proper+law+determines+specifically+that+adulterers%2C+murderers%2C+and+the+like+are+to+be+punished+by+death%2C+unless+the+punishment+should+be+mitigated+because+of+further+circumstances.+Various+punishments%2C+for+example%2C+exist+in+the+Mosaic+Law+for+these+crimes%E2%80%A6+For+this+reason%2C+the+moral+precepts+of+the+Decalogue%2C+having+no+certain%2C+special%2C+and+fixed+punishment+attached+to+them%2C+are+general.+The+forensic+and+political+law+then+makes+specific+determinations%2C+which+it+relates+to+the+circumstances+of+any+act.+%C2%A734+This+proper+law+is+one+thing+among+the+Jews%2C+another+among+the+Romans%2C+another+among+the+Germans+today%2C+and+still+another+among+other+peoples%E2%80%A6+%C2%A735+Jewish+proper+law+is+twofold.+It+is+in+part+ceremonial%2C+and+in+part+forensic+or+judicial%E2%80%A6+%C2%A737+The+forensic+%5Bjudicial%5D+law+was+the+means+by+which+the+Jews+were+informed+and+instructed+to+observe+and+obey+both+Tables%2C+or+the+common+law%2C+for+the+cultivation+of+human+society+among+them+in+their+polity%2C+according+to+the+circumstances+of+things%2C+persons%2C+place%2C+and+time%E2%80%A6+%C2%A740+It+should+be+observed+that+often+one+and+the+same+law+of+the+Jews+could+be+said+in+varying+respects+to+be+moral+%28or+common%29%2C+ceremonial%2C+and+forensic%2C+and+to+this+extent+mixed.+What+is+moral+in+such+a+law+is+perpetual%3B+what+is+judicial+can+be+changed+by+the+change+of+circumstances%E2%80%A6+%E2%80%A6+Ch.+22%2C+%C2%A73+From+these+things+it+follows+that+the+magistrate+is+obligated+in+the+administration+of+the+commonwealth+to+the+proper+law+of+Moses+so+far+as+moral+equity+or+common+law+are+expressed+therein.+This+is+to+say%2C+he+is+required+to+conform+to+everything+therein+that+is+in+harmony+with+common+law.+But+he+is+by+no+means+required+to+conform+in+those+things+in+which+the+proper+law+of+Moses%2C+in+order+to+be+accommodated+to+the+polity+of+the+Jews%2C+differs+from+common+law.+%C2%A74+For+if+the+magistrate+should+establish+as+absolutely+necessary+these+proper+Jewish+laws%2C+which+by+their+nature+are+either+changeable+or+obsolete%2C+he+would+destroy+christian+liberty%2C+which+has+been+given+for+edification+to+him+and+to+others%2C+and+would+entangle+himself+and+others+in+the+yoke+of+slavery.+Thereby+he+would+make+a+necessity+of+something+free%2C+and+impede+consciences+by+a+grievous+and+dangerous+snare.+He+would+obtrude+mortal+laws%2C+which+were+promulgated+in+former+times+only+for+the+Jewish+people+and+are+by+their+nature+subject+to+change+for+a+variety+of+reasons%2C+as+if+they+were+immortal.+And+unless+proper+laws+are+changed+with+the+changing+circumstances+because+of+which+they+broadly+exist%2C+they+become+wicked+and+attain+neither+to+the+equity+of+the+Second+Table+of+the+Decalogue+nor+the+piety+of+the+First.+Thus+they+cease+to+contain+the+common+foundation+of+right+reason.+Accordingly%2C+the+magistrate+who+makes+the+proper+law+of+Moses+compulsory+in+his+commonwealth+sins+grievously.+For+those+particular+circumstances+and+considerations+because+of+which+the+Jewish+proper+law+was+promulgated+should+bear+no+weight+in+his+commonwealth%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johannes+Althusius%2C+Politica%2C+pp.+144-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fa60112ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fa60112ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=%C2%A729%20The%20Decalogue%20has%20been%20prescribed,bear%20no%20weight%20in%20his%20commonwealth%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>closed with the Presbyterian in the beginning of the rebellion, took the [Solemn League &amp;] Covenant [1643], sided with the Independents, became a great creature of the long parliament by whose authority he was made tutor to James, Duke of York [would later be King James II], and an active person against his sovereign [King Charles I]”. Ascham was murdered by royalists in Spain. Wiki: “His first published work was A Discourse… This appeared in 1648, probably in July at the height of the political uncertainty engendered by the second Civil War. The previous month the Army had shown that it wielded both political and military power and Ascham’s Discourse was widely seen as a defense of the Army as the conquering power, and as a plea for “the rank of the people” to adopt a position of political quiescence. Parliament’s ultimate victory and the establishment of the Commonwealth posed a problem for those who felt unable to accept the legality of the new government but were now being required to give it their allegiance, and also for those who regarded their oath of allegiance to King Charles I… as a solemn oath to God that could not be broken. One argument, provided by a group of political theorists variously called the Engagers, or de facto theorists, was to argue that an individual could give their obedience to the de facto government in being simply because it was in power. For many such a theory was deeply shocking since it emphasized power at the expense of authority, and subordinated allegiance to self-interest. The debate was initiated by Francis Rous who published a brief pamphlet in April 1649 [The Lawfulness of Obeying the Present Government] in which he argued that allegiance could be given to the Commonwealth even though it were acknowledged to be an illegal power. It was a radical shift in the basis of the argument that was to be followed through by theorists engaged in the debate on de facto government. In the debate that followed Ascham played a major part in developing a theory of political obligation to the de facto power. In 1649 it is possible that he was author of a short anonymous pamphlet, A Combate between Two Seconds. One for Obeying the Present Government. The Other the second part of a Demurrer undeservedly called Religious, which was published in July. This work firstly took issue with those whose arguments continued to be based on Romans 13:1–2 and in particular addressed the arguments in an anonymous work that may have been published in two parts, but that is extant only in its second part entitled The Second Part of the Religious Demurrer; and secondly bypassed the critical emphasis on Romans 13:1–2 to develop arguments based on the need to protect oneself from chaos, as originally deployed by Ascham in his 1648 Discourse. Having thus entered the pamphlet “war”, Ascham then began to expand his arguments. He was certainly the author of a longer pamphlet, The Bounds and Bonds of Publique Obedience, which appeared in August 1649; and by November he had added nine chapters to his 1648 Discourse, which now appeared under the title Of the Confusions and Revolutions of Government. This work attracted the attention of Robert Sanderson who criticized it in a short and pungent pamphlet [Resolutions of Conscience (by a learned Divine) in answer to a letter sent with Mr. Ascham’s Book, Treating, How farre it may be lawful to submit to an Usurped Power.]. Ascham’s Reply to a paper of Dr. Sanderson’s, containing a censure of Mr. A. A. his book of the Confusions and Revolution of Government, which was published on 9 January 1650, was directed as much as against Edward Gee‘s Exercitation concerning usurped powers as against Sanderson’s work. In these works Ascham’s essential argument was that in a situation in which people had to look after their own safety, they were justified in giving their allegiance to any power that was capable of protecting them, whatever the legality of its title to power. By the autumn of 1649 the debate began to center on the specific question of the Oath of Allegiance and the Engagement to the Commonwealth: Two Acts of Parliament were passed requiring people to take an Oath of Allegiance to the Commonwealth, on 11/12 October 1649, and on 2 January 1650. Conventionally oaths were regarded as “the strictest ties and obligations that a man can be under”. For many the Engagement to the Commonwealth was impossible to take because it overrode their prior obligation to the monarchy (King Charles I and his heirs). The Presbyterian Richard Baxter held that he “could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath”. (Reliquiae Baxterianae, London, 1696, p. 54) In contrast, Ascham argued that all oaths involved tacit conditions, of which the ability of the government to protect the people was the main one. A government that could not protect its people lost the right to their allegiance. Ascham’s 1648 Discourse was to be republished, anonymously, following the ousting of King James II [in 1688/9]. Then the question of the legality of the oath of allegiance to King William and Queen Mary [in the Glorious Revolution] had come to the fore. It did not, however, generate any discussion. By then the leading theorist in the field was Thomas Hobbes, whose De Corpore Politico, De Cive (first edition), and Leviathan, had systematized a coherent and secular defense of the contract as between ruler and ruled.</p></blockquote>

a+theory+was+deeply+shocking+since+it+emphasized+power+at+the+expense+of+authority%2C+and+subordinated+allegiance+to+self-interest.+The+debate+was+initiated+by+Francis+Rous+who+published+a+brief+pamphlet+in+April+1649+%5BThe+Lawfulness+of+Obeying+the+Present+Government%5D+in+which+he+argued+that+allegiance+could+be+given+to+the+Commonwealth+even+though+it+were+acknowledged+to+be+an+illegal+power.+It+was+a+radical+shift+in+the+basis+of+the+argument+that+was+to+be+followed+through+by+theorists+engaged+in+the+debate+on+de+facto+government.+In+the+debate+that+followed+Ascham+played+a+major+part+in+developing+a+theory+of+political+obligation+to+the+de+facto+power.+In+1649+it+is+possible+that+he+was+author+of+a+short+anonymous+pamphlet%2C+A+Combate+between+Two+Seconds.+One+for+Obeying+the+Present+Government.+The+Other+the+second+part+of+a+Demurrer+undeservedly+called+Religious%2C+which+was+published+in+July.+This+work+firstly+took+issue+with+those+whose+arguments+continued+to+be+based+on+Romans+13%3A1%E2%80%932+and+in+particular+addressed+the+arguments+in+an+anonymous+work+that+may+have+been+published+in+two+parts%2C+but+that+is+extant+only+in+its+second+part+entitled+The+Second+Part+of+the+Religious+Demurrer%3B+and+secondly+bypassed+the+critical+emphasis+on+Romans+13%3A1%E2%80%932+to+develop+arguments+based+on+the+need+to+protect+oneself+from+chaos%2C+as+originally+deployed+by+Ascham+in+his+1648+Discourse.+Having+thus+entered+the+pamphlet+%E2%80%9Cwar%E2%80%9D%2C+Ascham+then+began+to+expand+his+arguments.+He+was+certainly+the+author+of+a+longer+pamphlet%2C+The+Bounds+and+Bonds+of+Publique+Obedience%2C+which+appeared+in+August+1649%3B+and+by+November+he+had+added+nine+chapters+to+his+1648+Discourse%2C+which+now+appeared+under+the+title+Of+the+Confusions+and+Revolutions+of+Government.+This+work+attracted+the+attention+of+Robert+Sanderson+who+criticized+it+in+a+short+and+pungent+pamphlet+%5BResolutions+of+Conscience+%28by+a+learned+Divine%29+in+answer+to+a+letter+sent+with+Mr.+Ascham%E2%80%99s+Book%2C+Treating%2C+How+farre+it+may+be+lawful+to+submit+to+an+Usurped+Power.%5D.+Ascham%E2%80%99s+Reply+to+a+paper+of+Dr.+Sanderson%E2%80%99s%2C+containing+a+censure+of+Mr.+A.+A.+his+book+of+the+Confusions+and+Revolution+of+Government%2C+which+was+published+on+9+January+1650%2C+was+directed+as+much+as+against+Edward+Gee%E2%80%98s+Exercitation+concerning+usurped+powers+as+against+Sanderson%E2%80%99s+work.+In+these+works+Ascham%E2%80%99s+essential+argument+was+that+in+a+situation+in+which+people+had+to+look+after+their+own+safety%2C+they+were+justified+in+giving+their+allegiance+to+any+power+that+was+capable+of+protecting+them%2C+whatever+the+legality+of+its+title+to+power.+By+the+autumn+of+1649+the+debate+began+to+center+on+the+specific+question+of+the+Oath+of+Allegiance+and+the+Engagement+to+the+Commonwealth%3A+Two+Acts+of+Parliament+were+passed+requiring+people+to+take+an+Oath+of+Allegiance+to+the+Commonwealth%2C+on+11%2F12+October+1649%2C+and+on+2+January+1650.+Conventionally+oaths+were+regarded+as+%E2%80%9Cthe+strictest+ties+and+obligations+that+a+man+can+be+under%E2%80%9D.+For+many+the+Engagement+to+the+Commonwealth+was+impossible+to+take+because+it+overrode+their+prior+obligation+to+the+monarchy+%28King+Charles+I+and+his+heirs%29.+The+Presbyterian+Richard+Baxter+held+that+he+%E2%80%9Ccould+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%E2%80%9D.+%28Reliquiae+Baxterianae%2C+London%2C+1696%2C+p.+54%29+In+contrast%2C+Ascham+argued+that+all+oaths+involved+tacit+conditions%2C+of+which+the+ability+of+the+government+to+protect+the+people+was+the+main+one.+A+government+that+could+not+protect+its+people+lost+the+right+to+their+allegiance.+Ascham%E2%80%99s+1648+Discourse+was+to+be+republished%2C+anonymously%2C+following+the+ousting+of+King+James+II+%5Bin+1688%2F9%5D.+Then+the+question+of+the+legality+of+the+oath+of+allegiance+to+King+William+and+Queen+Mary+%5Bin+the+Glorious+Revolution%5D+had+come+to+the+fore.+It+did+not%2C+however%2C+generate+any+discussion.+By+then+the+leading+theorist+in+the+field+was+Thomas+Hobbes%2C+whose+De+Corpore+Politico%2C+De+Cive+%28first+edition%29%2C+and+Leviathan%2C+had+systematized+a+coherent+and+secular+defense+of+the+contract+as+between+ruler+and+ruled.%E2%80%9D%0A%0A%E2%80%94+Antony+Ascham%2C+A+Discourse%2C+wherein+is+Examined+what+is+Particularly+Lawful+during+the+Confusions+%26+Revolutions+of+Government%3A+or%2C+How+far+a+Man+may+Conform+to+the+Powers+%26+Commands+of+Those+who+Hold+Kingdoms+Divided+by+Wars%E2%80%A6+%28London%2C+1648%29+%7C+Ascham+%28c.+1614%E2%80%931650%29+was+a+was+a+reformed%2C+puritan%2C+British+academic%2C+political+theorist%2C+Parliamentarian+and+diplomat.+According+to+Anthony+Wood%2C+Ascham%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1aa6ad08b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1aa6ad08b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=closed%20with%20the%20Presbyterian%20in%20the,contract%20as%20between%20ruler%20and%20ruled." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

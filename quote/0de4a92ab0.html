</figure><figure class="quote" id="q-b43667675b" data-kw="">
<blockquote><p>5. It is observed, that David’s psalms were sung formerly with musical instruments, as the harp, timbrel, and cymbal, and organs; and why not with these now? If these are to be disused, why not singing itself? I answer, these are not essential to singing, and so may be laid aside, and that continue; it was usual to burn incense at the time of prayer, typical of Christ’s mediation, and of the acceptance of prayer through it; that is now disused; but prayer being a moral duty, still remains: the above instruments were used only when the church was in its infant-state, and what is showy, gaudy, and pompous, are pleasing to children; and as an ancient writer observes, “these were fit for babes, but in the churches (under the gospel-dispensation, which is more manly) the use of these, fit for babes, is taken away, and bare or plain singing is left.” As for organs… were first introduced by a pope of Rome, Vitalianus, and that in the seventh century, and not before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Doctrinal &amp; Practical Divinity</cite>, vol. 3, ‘Of Singing Psalms As A Part of Public Worship’ (London, 1796), p. 384</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

that%20in%20the%20seventh%20century%2C%20and%20not%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d31aac66d3" data-kw="">
<blockquote><p>There are many who consider the use of instruments as merely an aid to singing. If Christians are commanded to sing in worship, what is wrong with using an instrument to assist the voice in carrying the tune? After all, it is argued, without an instrument to assist, many would not be able to sing the tunes properly. In other words, instruments have become a necessary aid to the practice of a Scriptural element of worship, as if congregational singing is impossible or impractical without mechanical help. Looking at it this way, some argue that instruments are a circumstance to worship, not an element regulated by Scripture, much like the building, what pulpit is used, and other things common to any kind of meeting. Even if instrumental music could be considered as an aid to worship, the Lord still strictly controls what aids are allowed in His worship. The Israelites, in their zeal to offer to the Lord true worship, nevertheless committed idolatry when they forged the golden calf at Sinai to magnify the great power of God. They weren’t blind pagans; they intended to worship the God of Israel, not some pagan deity. But in their desire for an aid to worship, they sinned and instead provoked the wrath of God. To them the golden calf was an aid to worship that they thought the Lord would have allowed, but to the Lord it was an unauthorized aid that He abhorred. In matters of worship, both reason and the will of man is a fatal guide. We would do well to remember the words of Solomon in Prov. 16:25, “There is a way that seemeth right unto a man, but the end thereof are the ways of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brad-freeman.html">Brad Freeman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Freeman is a Presbyterian Reformed Church minister. Why Not Instruments In Worship?</cite>, V. A Common Reason Answered</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

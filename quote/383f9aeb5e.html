<main class="wrap"><figure class="quote" id="q-383f9aeb5e" data-kw="">
<blockquote><p>That, seeing they were convened by the warrant of Christ and his Kirk, to see that it suffered no detriment in so needful and dangerous a time, they should obey God rather than man; and, notwithstanding of any charge, remain at his work so long as it should be found expedient for the well of the Kirk so to do.” (Calderwood, History, p. 340) Now, it seems, those eminent pastors, Mr. Robert Rollock, Mr. James Melville, who with others were members of that commission, thought it was a court of Christ, seeing ’tis affirmed by them, they were met by warrant from him: And the learned Principal Forrester, in Answers to Queries put to the Presbyterians in Scotland, says (pp. 177-78): “Commissions have the same warrant with synods and Assemblies.” And Rutherford, in Preface to his Lex Rex, p. 13, says, “The Commissioners of General Assemblies have the same warrant of God’s Word that messengers of the Synod have, Acts 15:22, 27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-97886eee8b" data-kw="">
<blockquote><p>The first prejudice then is, That those who dissent and separate from us are the strictest party. In answer to this… As for strictness of opinions, as to government and church communion, if we measure strictness according to the dictates of men’s own spirits, we will yield to them for strictness; and so would our Lord to the Pharisees, and the apostles to the false teachers. But if we measure strictness according to the Word of God, we deny they are strictest, but they are indeed widest from the rule. I will follow Christ to the synagogue of the Jews (I hope some of you at least may understand what I say [who had corruptions in their worship and government]) and in so doing I will be more strict than those that scruple to follow Christ’s example, for fear they be involved in the guilt of the corruptions among them; for the nearer I follow Christ, the more strict I am, if strictness be measured according to the Word of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Evil, Nature &amp; Danger of Schism: a Sermon’</cite>, (1708)</span></figcaption>

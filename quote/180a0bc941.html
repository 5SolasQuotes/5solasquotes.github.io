<blockquote><p>It would be tedious now to enumerate, what great additions and omissions the Septuagint has made, and all the passages which in church-copies are marked with daggers and asterisks. The Jews generally laugh when they hear our version of this passage of Isaiah, ‘Blessed is he that has seed in Zion and servants in Jerusalem.’ In Amos also after a description of self-indulgence Amos 6:4-6 there come these words: ‘They have thought of these things as halting and not likely to fly,’ a very rhetorical sentence quite worthy of Tully. But how shall we deal with the Hebrew originals in which these passages and others like them are omitted, passages so numerous that to reproduce them all would require books without number? The number of the omissions is shown alike by the asterisks mentioned above and by my own version when compared by a careful reader with the old translation. Yet the Septuagint has rightly kept its place in the churches, either because it is the first of all the versions in time, made before the coming of Christ, or else because it has been used by the apostles (only however in places where it does not disagree with the Hebrew).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 57, ‘To Pammachius on the Best Method of Translating’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8eb2adb7dd" data-kw="vulgate">
<blockquote><p>Although we respect the Vulgate as an ancient version, we deny its authenticity. (1) It was elaborated by human skill and has no God-inspired (theopnueston) author which the authentic edition demands. For whether its author was Jerome (as the papists hold) or some other one before his time (who combined the Italian version and the Vulgate so-called) or Sixtus V and Clement VIII (who in many particulars corrected the old one which was used in the church) no one of them was inspired (theopneustos).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.15.3</span></figcaption>

</figure><figure class="quote" id="q-2ad5ec154a" data-kw="">
<blockquote><p>The Masoretes… mentioned even what they regarded as unusual accents, vowel points, and spelling. They recorded a number of variant readings — on the average of about one to a page of a printed Hebrew Old Testament— and they made reference to eighteen corrections attributed to the scribes before them… Their high regard for the text that had come down to them is evidenced by their placing in the margin readings which they believed to be correct and leaving the text itself unaltered… The view of P. de Lagarde that after A.D. 130 all manuscripts of the Hebrew Bible were closely fashioned after one archetype which had been decided on not long before that date has not been accepted by all; but it is at least the case that a type of text basically that of the Masoretes existed around A.D. 100 and that this text subsequently overcame whatever competitors it had…. Dr. [William H.] Green calls attention to the fact that Origen and Jerome place on translators or transcribers of the Septuagint the responsibility for the variations of the Septuagint from the Hebrew text known to them and do not entertain any belief that the Hebrew text had been altered. Pfeiffer expresses the opinion that Origen was misled by reason of a virtual fixation of the Hebrew text which had occurred [after the Septuagint but] before his time and by reason of the notable agreement among the available Hebrew manuscripts. But it is nevertheless important to observe that neither Origen nor Jerome nor any other early writer evidences any suspicion that a real revision or a fixation of the Hebrew text had occurred after the time of the Septuagint. Dr. Green does not deny the possibility that the Septuagint may have been made from a Hebrew text considerably, if not substantially, different from the text in use in Origen’s day. He thinks it quite possible that there may have been some inferior manuscripts of the Old Testament in use, especially among Jews outside of Palestine; but he holds that, even if this were the case, it would not follow that no authoritative text then existed and that there were no standard copies from which the traditional text has descended. He states a truth quite important in this connection that ‘reverence for the Scriptures and regard for the purity of the sacred text did not first originate after the fall of Jerusalem.’ …the counting of the letters, words, verses, and sections in all the books, the noting of the location of the middle letters and words of every book, and the marking of them at times by a letter of abnormal size. He [William Green] remarks that the Talmud regards all this as old and as performed by the early scribes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-h-skilton.html">John H. Skilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Transmission of the Hebrew Text’ from ‘The Transmission of the Scriptures’ in eds. N.B. Stonehouse &amp; Paul Woolley, The Infallible Word: A Symposium by the Members of the Faculty of Westminster Theological Seminary, rev. ed. (Philadelphia: Presbyterian &amp; Reformed, 1967) at Bible-Researcher</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

regarded%20as%20unusual%20accents&amp;text=old%20and%20as%20performed%20by%20the%20early%20scribes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-66d40d7be9" data-kw="">
<blockquote><p>The Council of Trent having stamped the Vulgate as ‘authentic,’ ordered that a correct edition of this authorized Vulgate should be published. But little was done in fulfilment of this decree for nearly forty years, when the task was undertaken by Pope Sixtus V., a Pontiff who seems really to have believed in his own infallibility. He employed a Board of learned men to act as revisers, but in complete subordination to himself. In his preface he claims the superiority to them which he exercised, as resulting from the singular privilege which he enjoyed as successor to Peter, the Prince of the Apostles, for whom Christ prayed that his faith should not fail, and who was charged to confirm the other Apostles in the faith. … But a glance at the volume was sufficient to convince any moderately learned man of the folly, not to say impiety, of such boastful presumption. Many passages were found covered with slips of paper on which new corrections had been printed; others were scratched out and merely corrected with a pen; and different copies were corrected in different ways. A closer examination showed those competent to judge that the edition had graver faults than could be accounted for by printers’ carelessness. Sixtus had changed the readings of those whom he had employed to report upon the text with the most arbitrary and unskilful hand; and it was scarcely an exaggeration to say with Bellarmine that his precipitate self-reliance had brought the Church into the most serious peril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XIV</span></figcaption>

ul%20hand%3B%20and%20it%20was%20scarcely%20an%20exaggeration%20to%20say%20with%20Bellarmine%20that%20his%20precipitate%20self-reliance%20had%20brought%20the%20Church%20into%20the%20most%20serious%20peril.%E2%80%9D%0A%0A%E2%80%94%20George%20Salmon%2C%20The%20Infallibility%20of%20the%20Church%2C%20Lecture%20XIV&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66d40d7be9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66d40d7be9.html">Permalink</a><a class="src" href="https://archive.org/details/infallibilitych01salmgoog" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>

<blockquote><p>2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are, however, given doubly when the covenant is received. In the first place, by the substance itself of the covenant, or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first meaning learned from Jeremiah in the place already cited and which substance is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1). Thus Moses spoke about substance of the covenant (Deuteronomy 30[:6]). “God will circumcise your heart and that of your children.” He acts truly in the administration of the covenant, (Genesis 17), ‘This is my covenant’ etc. Likewise he says, ‘My covenant will be in your flesh.’ Certainly, the very substance of the covenant was not in their flesh. And not all of their hearts were circumcised, to whom the covenant was administered or offered through circumcision (Acts 7:51,52,53). That is to say, they personally, maliciously, rejected the gracious offer of the covenant, as Stephen teaches in the same place. Therefore, the covenant of grace, if you see its essence, is a sworn oath promised by God, a gift to you by God who is never angry with you (Isaiah 54) and by our adoption in God’s Son we have been made heirs of eternal life with Jesus Christ the eternal and only begotten Son of God, the seed of Abraham who is Christ, and to all men, who by faith in this free gift which was brought by the seed, and in whom by grace they were justified and glorified short of any condition or stipulation, knowledge of the good, so that he might be celebrated in his gracious goodness from himself, in this life and life eternal (Hosea 2; Isaiah 54; Genesis 22; Hebrews chapters 1, 6; Galatians 3:15-18, 22,26,29). The administration of the covenant of grace, however, is through the testimony or call of the Royal word from the darkness (of which darkness he is convicted by the law partly natural and partly written) that is, from sin and the penalty of sin, to the light, which is unto the discerning and receiving of the Son of God offered in the gospel, with the double benefit, truly, free rightousness in the remission of sins, by cleansing in his blood, and renewal to the image of God or the spirit of holiness for sharing in the heavenly inheritance. By the outward voice and visible signs in the testimony of mutual agreement between God and us, and by the addition of the truly efficacious gift of grace of internal faith and repentance out the infinite, incomprehensible mercy to the elect, which mercy is not truly added indeed to the reprobate, but nevertheless justly and to the worship of God’s justice. For the call from the darkness to the light, that is, the gracious offer, is never rejected without evil and contumacy of the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, 1.1.2</span></figcaption>

<blockquote><p>At other times, He parleys and works with them, and makes gracious overtures and offers of the gospel to them. He opens a door of hope and woos and beseeches them to throw down their rebellious arms and come to Christ for life. He reveals how Christ is in a present disposition to embrace their first motion towards mercy.</p></blockquote>

</figure><figure class="quote" id="q-2a2daaae1f" data-kw="">
<blockquote><p>The end which God aimed at in giving the law of Moses, was not, that any should ever attain to holiness or salvation by condition of perfect or sincere obedience to it; though, if there had been any such way of salvation at that time, it must have consisted in the performance of that law, which was then given to the church, to be a rule of life, as well as a covenant. There was another covenant made before that time with Abraham, Isaac, and Jacob, a covenant of grace, promising all blessings freely through Christ, the promised seed, by which only they were to be saved. And the covenant of the law was added, that they might see their sinfulness, and subjection to death and wrath, and the impossibility of attaining to life or holiness by their works, and be forced to trust on the free promise only for all their salvation, and that sin might be restrained by the spirit of bondage, until the coming of that promised seed Jesus Christ, and the more plentiful pouring out of the sanctifying Spirit, by him. This the apostle Paul shows largely (Gal. 3:15-24; Rom. 5:20,21 and 10:3,4). None of the Israelites under the Old Testament were ever saved by the Sinai covenant; neither did any of them ever attain to holiness by the terms of it. Some of them did indeed perform the commandments of it sincerely, though imperfectly: but those were first justified, and made partakers of life and holiness, by virtue of that better covenant made with Abraham, Isaac, and Jacob, which was the same in substance with the new covenant or testament established by the blood of Christ. Had it not been for the better covenant, the Sinai covenant would have proved to them an occasion of no happiness , but only of sin, despair, and destruction. Of itself it was only a killing letter, the ministration of death and condemnation: and therefore it is now abolished, 2 Cor. 3:6,8,9,11. – We have cause to praise God, for delivering His church, by the blood of Christ, from this yoke of bondage; and we have cause to abhor the device of those that would lay upon us a more grievous and terrible yoke, by turning our very new covenant in a covenant of sincere works, and leaving us no such better covenant, as the Israelites had under their yoke, to relieve us in our extremity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, 51</span></figcaption>

<blockquote><p>I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-matheson.html">Duncan Matheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Labors of Duncan Matheson: The Scotttish Evangelist, by John MacPherson</cite>, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d., p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!”

— Duncan Matheson, Life and Labors of Duncan Matheson: The Scotttish Evangelist, by John MacPherson, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d., p. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+was+standing+on+the+10th+of+December%2C+1846%2C+at+the+end+of+my+Father%E2%80%99s+house%2C+and+meditating+on+that+precious+word+that+has+brought+peace+to+countless+weary+ones%3A+%E2%80%98God+so+loved+the+world%2C+that+He+gave+his+only+begotten+Son%2C+that+whosoever+believeth+in+Him%2C+should+not+perish%2C+but+have+eternal+life%E2%80%99+%28John+3%3A16%29.+I+saw+the+proof+of+his+love+in+the+giving+of+his+Son+Jesus.+I+saw+that+%E2%80%98whosoever%E2%80%99+meant+anybody+and+everybody%2C+and+therefore+me%2C+even+me.+I+saw+the+result+of+believing%E2%80%94that+I+would+not+perish%2C+but+have+everlasting+life.+I+was+enabled+to+take+God+at+his+word.+I+saw+no+one%2C+but+Jesus+only%2C+all+in+all+in+redemption.+My+burden+fell+from+my+back%2C+and+I+was+saved.+Yes%2C+saved%21%E2%80%9D%0A%0A%E2%80%94+Duncan+Matheson%2C+Life+and+Labors+of+Duncan+Matheson%3A+The+Scotttish+Evangelist%2C+by+John+MacPherson%2C+%28Kilmarnock%3A+Ritchie%2C+n.d.%29%2C+p.+26%2C+as+quoted+by+Ian+Murray%2C+The+Cross%3A+the+Pulpit+of+God%E2%80%99s+Love%2C+n.d.%2C+p.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0480249b8d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0480249b8d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/historic-reformed-quotes-on-the-sincere-free-offer-of-the-gospel-interpretation-of-john-316/#:~:text=I%20was%20standing%20on%20the%2010th,and%20I%20was%20saved.%20Yes%2C%20saved&amp;text=I%20was%20standing%20on%20the%2010th%20of%20December&amp;text=my%20back%2C%20and%20I%20was%20saved.%20Yes%2C%20saved" rel="noopener" target="_blank">Read it online · Reformed B

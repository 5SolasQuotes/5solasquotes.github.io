<blockquote><p>It much helps us in the contemplation of the Simplicity of God, to look upon it as opposed to Composition, all the ways whereof the Learned have referred to these seven Heads.

Composition is either of

Obj. Where there is a Plurality, there is not Simplicity: But in the divine Nature there is a Plurality: therefore.

Ans. The Objection holds, where there is a plurality of Essences, Beings, or things, but not where there is only a plurality of Subsistences. In the divine Nature, though there be a Trinity, therefore a plurality of Subsistences or Persons, yet there is but one Essence: In the Trinity there is distinction, but not composition.

Obj. 2. The Attribute of Simplicity concludes that all the Attributes are God himself, and consequently that there is no inequality amongst them: yet we read, that his tender mercies are over all his works; so, as it may seem, Mercy exceeds the other Attributes.

Ans. The meaning is, that his mercy is over, that is, upon all his works; not that God’s Mercy exceeds all his other Attributes, as if one Attribute were greater then another: for all the Attributes of God are equal, not one higher or greater then another, because they are all God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), pp 5-7.</span></figcaption>

<blockquote><p>For it is commonly conceded today that a composition in concepts does not argue to a real composition in the thing. For if the formal notion of one perfection (for example knowing, even if the knowing is omniscient) does not include the formal notion of another perfection (for example loving, even if the loving is altogether perfect), then to be sure this fact does not necessarily imply that both perfections have, in respect of the thing (e.g. God), the idea of parts and so the idea of being mutually perfectible. But this condition would be required for having composition on the part of the thing. If we were able to conclude anything from the conceptual separability of one perfection from another, then some non-identity on the part of the thing would be proved (as a virtual or so-called formal non-identity, which we will deal with in the treatment of the formal distinction). But such a non-identity implies neither composition nor imperfection in the being that has those perfections. At most, indeed, a reason is to be sought why one such perfection is found in the same thing along with another perfection not included in the formal concept of the first, but I do not know why the only adequate assignable reason for explaining it must be found in a mutual perfectability (a perfectibility after the manner of parts) that those perfections have on the side of the thing. But if anyone wishes to dispute this question, let him do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 1, article 2, pp. 17-18 Wolter was a Scotus scholar and writes from that perspective.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-818604a118" data-kw="">
<blockquote><p>Conclusion 9: All the divine attributes, although they are really the same and can be predicated of each other in the identical sense, and also the proper effects and determinations of any one attributed to any other attribute, yet in the formal sense they are not predicated of each other without implication of contradiction. For example, the mercy of God formally is His anger or corrective and punitive justice, God hates sin, and condemns and afflicts the sinner with eternal punishments through mercy. But the reason for this implication is because the divine attributes are virtually distinguished, and insofar as they are distinguished they cannot formally be one and the same thing, because their formal effects, for example, to hate and to pity, to save Peter, and to punish Judas, are not formally the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | On the Power of God, pt. 2, p. 372</span></figcaption>

<blockquote><p>All the fulness of the Godhead.] That is, not some portion of the Divinity, which the Gentiles had an erroneous persuasion of concerning their false gods; neither excellent endowments of Divine grace and munificence only, which are common to angels, and prophets, and other holy men: but the Lογος itself—true and perfect God, with all his Divine attributes, namely, infinite wisdom, power, goodness, dwells in this human nature of Christ.

And the Apostle seems to allude to the ark of the covenant: for God promised that he would dwell there, hear them from thence, and be propitious to them: and, furthermore, the Apostle intimates, that the ark and the propitiatory, or mercy-seat, were types of Christ, and that the Deity dwelt in a much more excellent way in his human nature, than he did formerly in the tabernacle, concerning which it is written, Exod. xxix. 44, 45, I will sanctify the tabernacle of the testimony, and I will dwell among the children of Israel, &amp;.c.

As, therefore, the Jews, who had an appointed place whence God uttered his oracles, and made known his will, could not, without sin, enquire elsewhere about things pertaining to God; so we, who have the fulness of the Godhead dwelling in the body of Christ, cannot seek either the will of God or our salvation elsewhere, without the greatest folly and impiety.

Hence we learn,

1. As often as seducers endeavour to lead us away from the Gospel and from Christ, to their traditions and inventions, we must seriously reflect what kind of Saviour and Teacher Christ Jesus was; viz. one in whom dwelt all the fulness of the Godhead; and it is the height of madness to require new teachers after him.

2. Whoever, therefore, wanders out of Christ, or mixes any other thing with his doctrine as necessary to salvation, he accuses Christ of imperfection, and denies the fact that all the fulness of the Godhead dwelt in him.

3. This we observe in the Turks and Jews, who are not content with the Gospel doctrine, because they do not believe that all the fulness of the Godhead dwelt in him who proclaimed the Gospel. As to Papists, who, being fascinated with novel and marvellous error, acknowledge that all the fulness of the Godhead is in Christ, yet deny that all the fulness of salvation is contained in his doctrine, I know not what to say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 412-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

the+height+of+madness+to+require+new+teachers+after+him.%0A%0A2.+Whoever%2C+therefore%2C+wanders+out+of+Christ%2C+or+mixes+any+other+thing+with+his+doctrine+as+necessary+to+salvation%2C+he+accuses+Christ+of+imperfection%2C+and+denies+the+fact+that+all+the+fulness+of+the+Godhead+dwelt+in+him.%0A%0A3.+This+we+observe+in+the+Turks+and+Jews%2C+who+are+not+content+with+the+Gospel+doctrine%2C+because+they+do+not+believe+that+all+the+fulness+of+the+Godhead+dwelt+in+him+who+proclaimed+the+Gospel.+As+to+Papists%2C+who%2C+being+fascinated+with+novel+and+marvellous+error%2C+acknowledge+that+all+the+fulness+of+the+Godhead+is+in+Christ%2C+yet+deny+that+all+the+fulness+of+salvation+is+contained+in+his+doctrine%2C+I+know+not+what+to+say.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1831%29%2C+1%3A+412-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd86c6c4121.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d86c6c4121.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/01/john-davenant-on-the-divine-simplicity-and-the-deity-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

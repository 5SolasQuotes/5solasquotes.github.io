<main class="wrap"><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6a9b0dd0d" data-kw="">
<blockquote><p>37. To hold that any congregations are such whose worship is faulty, but such as God forgives and accepts, but that it is unlawful for us to join with them, lest it make us guilty of their sin, this (though it should be erroneous, and uncharitable and sinful) yet is not to excommunicate that congregation as no Church or no Christians. But to say of any congregation that they want [lack] anything essential to Christianity or to make them capable to be loved as Christians, or that their worship of God is idolatry, or so bad as that God accepts it not, the evil of it being greater than the good (as poison in our food), and on this reason to declare that no good Christian should communicate with them, this is to excommunicate such [a] congregation, as far as one Church may excommunicate another, which is but by such renouncing their communion.²</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684), section 2, pp. 9-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-44afb1d0a7" data-kw="">
<blockquote><p>Yet there was in those rites some manner of difference, not only between the first Passover celebrated in Egypt and the subsequent ones, but also between the primary Passover, which was ordinarily eaten in the month of Nisan on the fourteenth day, and the secondary one, which was celebrated in the second month on the fourteenth day, for the sake of those who were either unclean or absent in the prior month, because in the latter, the communicants were not bound to such an exact purging of all leaven, and also they conducted this feast for not but one day [instead of seven].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (1698; RHB), bk. 7, ch. 5, sect. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-8fcc09bb8f" data-kw="">
<blockquote><p>‘Go and tell my servant David.’ The Lord speaks very honorably and respectfully of him, owns him to be his servant in other things though he did not choose to employ him in this; and though he was not the person, nor this the time, to build the house of the Lord, yet, as he showed a good will towards it, so far it was acceptable to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of Whole Bible, on 2 Samuel</cite>, ch. 7, v. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘Go and tell my servant David.’ The Lord speaks very honorably and respectfully of him, owns him to be his servant in other things though he did not choose to employ him in this; and though he was not the person, nor this the time, to build the house of the Lord, yet, as he showed a good will towards it, so far it was acceptable to God:”

— John Gill, Exposition of Whole Bible, on 2 Samuel, ch. 7, v. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Go+and+tell+my+servant+David.%E2%80%99+The+Lord+speaks+very+honorably+and+respectfully+of+him%2C+owns+him+to+be+his+servant+in+other+things+though+he+did+not+choose+to+employ+him+in+this%3B+and+though+he+was+not+the+person%2C+nor+this+the+time%2C+to+build+the+house+of+the+Lord%2C+yet%2C+as+he+showed+a+good+will+towards+it%2C+so+far+it+was+acceptable+to+God%3A%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+Exposition+of+Whole+Bible%2C+on+2+Samuel%2C+ch.+7%2C+v.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8fcc09bb8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8fcc09bb8f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Go%20and%20tell%20my%20servant%20David,far%20it%20was%20acceptable%20to%20God&amp;text=Go%20and%20tell%20my%20servant%20David.%E2%80%99%20The%20Lord&amp;text=it%2C%20so%20far%20it%20was%20acceptable%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-95eab27e0c" data-kw="">
<blockquote><p>Verse 5… But David was not the man he had appointed for this work, and therefore though the Lord commended David for this holy intention, as is evident, 1 Kings 8:18, ‘And the Lord said unto David my father, ‘Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart,” and made many gracious promises unto him at this time, vv. 10-12, etc. to testify how well He took it that he had such a purpose in his mind: yet withal He made known to him that He meant not that it should be done by him, but by his son… Verse 6… Though David’s intent was generally in itself good, insomuch that the Lord Himself commended him for it, as is manifest in that place before cited, 1 Kings 8:18, yet it was not without some mixture of error: for herein he failed, because he undertook to do it without any particular direction or warrant from God, led hereto only by the judgment of his own reason, that it was not fit God should dwell within curtains, when He dwelt in an house of cedar; and therefore though the Lord told him that his purpose was in the general commendable, yet withall He rejected his purpose and discovered thereby that he should have waited his leasure and direction, and disproved his reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Remaining Historical Part of the Old Testament</cite>, ... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Sam. 7, p. 361</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

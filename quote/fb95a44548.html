<main class="wrap"><figure class="quote" id="q-fb95a44548" data-kw="">
<blockquote><p>Although temporary believers and other unregenerate men, may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God and in a state of salvation, which hope of theirs shall perish; yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavouring to walk in all good conscience before him, may in this life be certainly assured that they are in the state of grace, and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/presumption-and-self-examination.html">Presumption and Self-Examination</a> › <a href="../topics/assurance-peace-and-joy/presumption-and-self-examination/false-assurance.html">False assurance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13755d1246" data-kw="Comfort Justice Assurance">
<blockquote><p>Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, Sermon II (Song 5:1)</span></figcaption>

<blockquote><p>When the Holy Ghost sealeth a man up, the thing he makes known, the thing he sealeth to him is this, that he is in Christ, that he hath been elected in Christ by God the Father from everlasting, that he is one in Christ; he was one with him from everlasting, he was one with him when he hung upon the cross, he is one with him now in heaven.</p></blockquote>

</figure><figure class="quote" id="q-5ceb932df3" data-kw="">

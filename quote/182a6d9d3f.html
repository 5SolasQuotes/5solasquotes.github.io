<main class="wrap"><figure class="quote" id="q-182a6d9d3f" data-kw="">
<blockquote><p>Howbeit, if I should be asked concerning the infants of Christians, which depart without this sacrament: mine answer should be, that we must have a good hope of them and stick fast to the Word of God; namely, to the covenant made with Abraham, wherein God promises Himself, not only that He would be a God unto him, but also unto his seed. Which promise, seeing it is not so general, as it comprehends all; therefore I dare not promise certain salvation particularly unto any that departs hence. For their be some children of the saints, which belong not unto predestination; such we read to be Esau, Ishmael, and others more, whose salvation is not hindered, in respect that they were not baptized. … I always except the children of the elect; for we doubt not to number them among the company of believers, though they as yet believed not by reason of their age: even as they which be born of infidels, are reckoned among the unbelievers, although of themselves they withstand not the faith. So as the children of the godly, departing without baptism, by reason of the covenant that God hath made with their parents, may be saved; if they appertain to the number of such as be predestinate. Also, I do except all others, if any there be, which by the secret council of God belong unto predestination.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-726425ec64" data-kw="">
<blockquote><p>The promise, accepted by the parents in faith, also includes their children to a thousand generations… If it is objected that not all of them who are born of believing parents are elect, seeing that God did not choose all the children of Abraham and Issac, we do not lack an answer. Though we do not deny that this is the case, still we say that this hidden judgment must be left to God and that normally, by virtue of the promise, all who have been born of believing parents, or if one of the parents believe, are sanctified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Faith</cite>, 4.48 as quoted in ‘The Doctrine of the Covenant in Reformed Theology’, p. 263 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980) Kraut, p. 26-27 has another translation of this passage, though gives the reference as De Spirit. Sac., IV, 29, which we are not able to find.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

0are%20sanctified" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d9d9785a36" data-kw="">
<blockquote><p>10th Consideration: The present felicity into which all that die in Christ are presently admitted, should abundantly comfort Christians over the death of such as either carried a lively hope out of the world with them, or have left good grounds of such an hope behind them. Some there are that carried a lively hope to heaven with them, who could evidence to themselves and friends their interest in Christ and in the Covenant. Yea, though they had died in silence, yet their conversations would speak for them, and the tenor of their lives leave no ground of doubting touching their death: others dying in their infancy or youth, though they carried not such an actual hope with them, yet they have left good grounds of hope behind them. Parents now ponder these grounds; you have prayed for them, you have many times wrestled with the Lord on their behalf; you have taken hold of God’s Covenant for them, as well as for your selves, and dedicated them to the Lord, and they have not by any actions of theirs destroyed those grounds of your hope, but that you may with much probability conclude they are with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Token for Mourners</cite>, … (1674), p. 86</span></figcaption>

deration%3A%20The%20present%20felicity%20into%20which%20all&amp;text=with%20much%20probability%20conclude%20they%20are%20with%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-12ad4b5f9c" data-kw="">
<blockquote><p>Neither Zwingli, nor Calvin, nor any one of us, places, without distinction in heaven with the saints, all infants who die without baptism, whether unborn or in birth, or while they are carried to baptism, but they pronounce this, by the law of charity, of the infants alone of the Church, born in the Covenant if they be prevented by death, nevertheless, without interference with the election of God, which as of old in the family of Abraham and Isaac, so in after time often hath made, and doth make a discrimination which we are neither to search into nor to scoff at, but to adore (Rom. 9:11). This is the constant judgment of ourselves, and of our divines concerning this question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism and Infant Salvation</cite>, As quoted in Krauth, … (Philadelphia: Lutheran Books Store, 1874), p. 20. Krauth gives as the reference: Pareus, Castigations in Bellarmine on the Loss of Grace (1613), Book 6, p. 871, though the page number does not exactly correspond to the Google Books edition (1613), though it appears to be close.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

ivines%20concerning%20this%20question&amp;text=Neither%20Zwingli%2C%20nor%20Calvin%2C%20nor%20any%20one%20of&amp;text=ourselves%2C%20and%20of%20our%20divines%20concerning%20this%20question" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c8169f3d76" data-kw="">
<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Exercitations</cite>, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874), p. 16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.”

— Marc Frederic Wendelin, Theological Exercitations, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874), p. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+infants+of+Christians%2C+even+before+baptism+are+holy%2C+with+a+federal+and+external+holiness%2C+on+account+of+which+they+ought+to+be+reputed+a+part+of+the+visible+Church+and+people+of+God%2C+and+as+federates+be+admitted+to+the+seal+of+the+Covenant.+Some+infants+of+Christians%2C+even+before+Baptism%2C+nay+even+in+their+mother%E2%80%99s+womb%2C+not+indeed+by+nature%2C+but+by+grace%2C+are+holy+with+an+internal+sanctity%2C+and+these+infants+are+believers+and+regenerate%E2%80%A6+The+internal+sanctity+is+not+necessarily+conjoined+with+the+federal%2C+but+in+many+infants+and+adults+is+separated+from+it.+This+we+learn+from+the+event%3B+for+those+who+were+once+sanctified+never+wholly+lose+their+sanctity.+%E2%80%A6+There+is+no+need+here+of+inferences+or+citations%2C+to+convince+me.+Of+my+own+accord%2C+and+freely+and+expressly+I+confess%2C+with+%5BZacharias%5D+Ursinus+and+our+other+teachers%2C+that+not+all+who+are+baptized%2C+whether+adults+or+infants%2C+become+participants+of+the+grace+of+Christ%2C+for+the+election+of+God+is+most+free%3A+it+is+therefore+a+prerogative+of+the+elect+alone%2C+which+baptism+seals.%E2%80%9D%0A%0A%E2%80%94+Marc+Frederic+Wendelin%2C+Theological+Exercitations%2C+37.1%2C18-19+as+translated+in+Charles+P.+Krauth%2C+Infant+Baptism+and+Infant+Salvation+in+the+Calvinistic+system.+A+Review+of+Dr.+Hodge%E2%80%99s+Theology+%28Philadelphia%3A+Lutheran+Books+Store%2C+1874%29%2C+p.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8169f3d76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8169f3d76.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-salvatio

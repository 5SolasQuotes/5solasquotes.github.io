</figure><figure class="quote" id="q-5916053771" data-kw="">
<blockquote><p>If it be here replied that the actions which make up mediate worship, must be actions of the Second Table, not of the First… I answer: It is the verdict of the Word and the common consent of all divines that all the actions and duties which concern our brother as the next object and end, and so determine upon him are required, and regulated by the Second Table: since therefore these things of comliness and order are of this nature, by the Rejoinder’s grant, I do not see how it can be avoided with any colour of reason but they must be commanded in the Second Table, and so come under the definition of mediate worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), Manuduction, ch. 12, ‘Concerning Worship’, p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-9f76b0bc95" data-kw="">
<blockquote><p>What is the popish religion, but a bundle of ridiculous ceremonies? Their wax, flowers, pixes, agnus Dei, cream and oil, beads, crucifixes,—what are these but Satan&#x27;s policy to dress up a carnal worship, fitted to carnal minds?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“What is the popish religion, but a bundle of ridiculous ceremonies? Their wax, flowers, pixes, agnus Dei, cream and oil, beads, crucifixes,—what are these but Satan&#x27;s policy to dress up a carnal worship, fitted to carnal minds?”

— Thomas Watson, The Ten Commandments, Second Commandment, p. 46">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+the+popish+religion%2C+but+a+bundle+of+ridiculous+ceremonies%3F+Their+wax%2C+flowers%2C+pixes%2C+agnus+Dei%2C+cream+and+oil%2C+beads%2C+crucifixes%2C%E2%80%94what+are+these+but+Satan%27s+policy+to+dress+up+a+carnal+worship%2C+fitted+to+carnal+minds%3F%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+Second+Commandment%2C+p.+46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9f76b0bc95.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f76b0bc95.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-1160723795" data-kw="">
<blockquote><p>Some worship God with their good meaning, some with their good dealing, some with the babbling of a few words, as namely, of the Apostles Creed, and Ten Commandments for prayers. This service of God is very common, but alas, it is poor service. For the rule of divine honor is not the will of him that honors, but the will of Him which is honored. Secondly, here we learn to detest the service and worship which is performed to God in the Church of Rome. For it contains many parts and points of will-worship, having no warrant from God, either by commandment or promise. . . . For these and many other practices, let them bring forth the Word of God, if they can. They plead for many things, that they have the word of traditions. I answer, that traditions ecclesiastical are no word of God, but the word of man. And traditions which are called apostolical, are either of no moment, or doubtful. For how shall we know certainly, that they were the traditions of the apostles, considering none has said so, but some of the Fathers, whose testimonies are not sufficient, because they are subject to error?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (1626), vol. 1, p. 699.</span></figcaption>

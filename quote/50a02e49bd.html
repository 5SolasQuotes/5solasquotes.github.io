<main class="wrap"><figure class="quote" id="q-50a02e49bd" data-kw="">
<blockquote><p>These persons are so distinct in their peculiar subsistence that distinct actings and operations are ascribed unto them. And these actings are of two sorts:—1. Ad intra, which are those internal acts in one person whereof another person is the object. And these acts ad invicem, or intra, are natural and necessary, inseparable from the being and existence of God. So the Father knows the Son and loveth him, and the Son seeth, knoweth, and loveth the Father.

In these mutual actings, one person is the object of the knowledge and love of the other: John iii. 35, “The Father loveth the Son, and hath given all things into his hand.” Chap. v. 20, “The Father loveth the Son.” Matt. xl 27, “No man knoweth the Son, but the Father; neither knoweth any man the Father, save the Son.” John vi. 46, “None hath seen the Father, save he which is of God, he hath seen the Father.” This mutual knowledge and love of Father and Son is expressed at large, Prov. viii. 22-31; which place I have opened and vindicated elsewhere. And they are absolute, infinite, natural, and necessary unto the being and blessedness of God. So the Spirit is the mutual love of the Father and the Son, knowing them as he is known, and “searching the deep things of God.” And in these mutual, internal, eternal actings of themselves, consists much of the infinite blessedness of the holy God.

Again, 2. There are distinct actings of the several persons ad extra; which are voluntary, or effects of will and choice, and not natural or necessary. And these are of two sorts: — (1.) Such as respect one another; for there are external acts of one person towards another: but then the person that is the object of these actings is not considered absolutely as a divine person, but with respect unto some peculiar dispensation and condescension. So the Father gives, sends, commands the Son, as he had condescended to take our nature upon him, and to be the mediator between God and man. So the Father and the Son do send the Spirit, as he condescends in an especial manner to the office of being the sanctifier and comforter of the church. Now, these are free and voluntary acts, depending upon the sovereign will, counsel, and pleasure of God, and might not have been, without the least diminution of his eternal blessedness.

(2.) There are especial acts, ad extra, towards the creatures.1 This the whole Scripture testifieth unto, so that it is altogether needless to confirm it with particular instances. None who have learned the first principles of the doctrine of Christ, but can tell you what works are ascribed peculiarly to the Father, what to the Son, and what to the Holy Ghost. Besides, this will be manifested afterward in all the distinct actings of the Spirit; which is sufficient for our purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ΠΝΕΥΜΑΤΟΛΟΓΙΑ or, A Discourse Concerning the Holy Spirit</cite>, (London, 1674) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), iii, 66-67.</span></figcaption>

<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 87-88</span></figcaption>

<blockquote><p>XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.”

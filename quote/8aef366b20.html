<main class="wrap"><figure class="quote" id="q-8aef366b20" data-kw="">
<blockquote><p>Assertion 1 — Patient suffering of wicked men and violent resisting are not incompatible, but they may well stand together; so this [following] consequence is the basis of the [opponent’s] argument, and it is just nothing: to wit, servants are to suffer unjustly wounds and buffeting of their wicked masters, and they are to bear it patiently; therefore, servants are in conscience obliged to non-resistance. Now, Scripture makes this clear: 1. The Church of God is to bear with all patience the indignation of the Lord, because she has sinned, and to suffer of wicked enemies which were to be trodden as mire in the streets (Mic. 7:9-12); but withal, they were not obliged to non-resistance and not to fight against these enemies, yea, they were obliged to fight against them also. If these were Babylon, Judah might have resisted and fought if God had not given a special commandment of a positive law, that they should not fight; if these were the Assyrians and other enemies, or rather both, the people were to resist by fighting, and yet to endure patiently the indignation of the Lord. David did bear most patiently the wrong that his own son Absalom, and Ahitophel, and the people inflicted on him, in pursuing him to take his life and the kingdom from him, as is clear by his gracious expressions (2 Sam. 15:25-26; 16:10-12; Ps. 3:1-3); yea, he prays for a blessing on the people that conspired against him (Ps. 3:8); yet did he lawfully resist Absalom and the conspirators, and sent out Joab and a huge army in open battle against them (2 Sam. 18:1-4, etc.) and fought against them. And were not the people of God patient to endure the violence done to them in the wilderness by Og, king of Bashan; Sihon, king of Heshbon; by the Amorites, Moabites, etc.? I think God’s law ties all men, especially his people, to as patient a suffering in wars (Dt. 8:16). God then trying and humbling his people, as the servant is to endure patiently unjustly inflicted buffets (1 Pet. 2:18); and yet God’s people at God’s command did resist these kings and people, and did fight and kill them, and possess their land, as the history is clear. See the like Josh. 11:18-19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. 152-53</span></figcaption>

<blockquote><p>What hinders then, but that we may dispose or punish them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lib: De bello contra Turcas. apud Sleidan</cite>, bk. 14</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What hinders then, but that we may dispose or punish them?”

— Martin Luther, Lib: De bello contra Turcas. apud Sleidan, bk. 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+hinders+then%2C+but+that+we+may+dispose+or+punish+them%3F%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Lib%3A+De+bello+contra+Turcas.+apud+Sleidan%2C+bk.+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6926e13ad2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6926e13ad2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/resistance-to-tyrrany/quotes-on-resistance-to-tyranny/#:~:text=What%20hinders%20then%2C%20but%20that%20we%20may%20dispose%20or%20punish%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c7d4c7a910" data-kw="">
<blockquote><p>§98. If you ask what did the ministers all this while, I answer: they preached and prayed against disloyalty. They drew up a writing to the Lord General declaring their abhorrence of all violence against the person of the king [Charles I], and urging him and his army to take heed of such an unlawful act. They present it to the General when they saw the king in danger: But Pride prevailed against their counsels. §99. The king being thus taken out of the way, Cromwell takes on him to be for a commonwealth (but all in order to the security of the good people) till he had removed the other impediments which were yet to be removed: so that the Rump [Parliament] presently drew up a form of Engagement, to be put upon all men, viz. ‘I do promise to be true and faithful to the commonwealth as it is now established without a king or House of Lords.’ So we must take the Rump for an established commonwealth and promise fidelity to them. This the sectarian party [of Independents and sects] swallowed easily, and so did the king’s old cavaliers, so far as I was acquainted with them or could hear of them (not heartily, no doubt, but there were very few of them sick of the disease called tenderness of conscience or scrupulosity: But the presbyterians and the moderate episcopal men refused it (and I believe so did the prelatical divines of the king’s party for the most part; though the gentlemen had greater necessities [to preserve by the Engagement]). Without this Engagement no man must have the benefit of suing another at law (which kept men a little from contention and would have marred the lawyers’ trade); nor must they have any masterships in the universities, nor travel above so many miles from their houses, and more such penalties, which I remember not (so short lived a commonwealth deserved no long remembrance): Mr. [Richard] Vines and Dr. Rainbow and many more were hereupon put out of their headships in the universities, and Mr. Sidrach Sympson, and Mr. John Sadler and such others put in; yea, such a man as Mr. Dell, the chaplain of the army, who, I think, neither understood himself nor was understood by others any farther than to be one who took reason, sound doctrine, order and concord to be the intolerable maladies of Church and State, because they were the greatest strangers to his mind. But poor Dr. Edward Reynolds had the hardest measure; for when he refused to take the Engagement, his place was forfeited; and afterwards they drew him to take it, in hopes to keep his place (which was no less than the deanery of Christ’s-Church) and then turned him out of all, and offered his place to Mr. Joseph Caryl; but he refusing it, it was conferred on Dr. [John] Owen, to whom it was continued from year to year. And because the presbyterians still urged the [Solemn League and] Covenant against killing the king, and pulling down the parliament, and setting up a commonwealth, and taking the Engagement, some of the Independent brethren maintained that its obligation ceased, because it was a league, and the occasion of it ceased: And some of the Rump said it was like an almanac out of date; and some of the soldiers said they never took it; and others of them railed at it as a Scottish snare: So that when their interest would not suffer them to keep so solemn a vow, their wills would not suffer their judgments to confess it to be obligatory, at least as to the part which they must violate. §100. For my own part, though I kept the town and parish of Kidderminster from taking the Covenant (and seeing how it might become a snare to their consciences) yea, and most of Worcestershire besides, by keeping the ministers from offering it in any of the congregations to the people (except in Worcester City, where I had no great interest and know not what they did); yet I could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath, as if the bonds of national and personal vows were as easily shaked off as Sampson‘s cords. Therefore I spake and preached against the Engagement and dissuaded men from taking it. The first hour that I heard of it, being in company with some gentlemen of Worcestershire, I presently wrote down above twenty queries against it, intending as many more almost against the obligation as those were about the sense and circumstances. And one that was present got the copy of them, and shortly after I met with them verbatim in a book of Mr. Henry Hall‘s as his own (one that was long imprisoned for writing against Cromwell). Some episcopal divines that were not so scrupulous it seems as we, did write for it (private manuscripts which I have seen) and plead the irresistibility of the imposers, and they found starting holes in the terms, viz. that by “the commonwealth” they will mean the present commonwealth in genere, and by “established” they will mean only de facto and not de jure, and by “without a king, etc.” they mean not quatenus [as far as] but etsi [although], and that only de facto pro tempore [in point of fact for the time], quasi dicat [“as if to say”]: ‘I will be true to the government of England, though at the present the king and House of Lords are put out of the exercise of their power.’ These were the expositions of many episcopal men, and others that took it: But I endeavored to evince that this is mere juggling and jesting with matters too great to be jested with: And that as they might easily know that the imposers had another sense, so as easily might they know that the words in their own obvious usual sense among men must be taken as the promise or engagement of a subject as such to a form of government now pretended to be established: And that the subjects’ allegiance or fidelity to his rulers can be acknowledged and given in no plainer words: And that by such interpretations and stretchings of conscience, any treasonable oath or promise may be taken, and no bonds of society can signify much with such interpreters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times</cite>, (London: Parkhurst, 1696), pp. 64-65</span></figcaption>

+such+penalties%2C+which+I+remember+not+%28so+short+lived+a+commonwealth+deserved+no+long+remembrance%29%3A+Mr.+%5BRichard%5D+Vines+and+Dr.+Rainbow+and+many+more+were+hereupon+put+out+of+their+headships+in+the+universities%2C+and+Mr.+Sidrach+Sympson%2C+and+Mr.+John+Sadler+and+such+others+put+in%3B+yea%2C+such+a+man+as+Mr.+Dell%2C+the+chaplain+of+the+army%2C+who%2C+I+think%2C+neither+understood+himself+nor+was+understood+by+others+any+farther+than+to+be+one+who+took+reason%2C+sound+doctrine%2C+order+and+concord+to+be+the+intolerable+maladies+of+Church+and+State%2C+because+they+were+the+greatest+strangers+to+his+mind.+But+poor+Dr.+Edward+Reynolds+had+the+hardest+measure%3B+for+when+he+refused+to+take+the+Engagement%2C+his+place+was+forfeited%3B+and+afterwards+they+drew+him+to+take+it%2C+in+hopes+to+keep+his+place+%28which+was+no+less+than+the+deanery+of+Christ%E2%80%99s-Church%29+and+then+turned+him+out+of+all%2C+and+offered+his+place+to+Mr.+Joseph+Caryl%3B+but+he+refusing+it%2C+it+was+conferred+on+Dr.+%5BJohn%5D+Owen%2C+to+whom+it+was+continued+from+year+to+year.+And+because+the+presbyterians+still+urged+the+%5BSolemn+League+and%5D+Covenant+against+killing+the+king%2C+and+pulling+down+the+parliament%2C+and+setting+up+a+commonwealth%2C+and+taking+the+Engagement%2C+some+of+the+Independent+brethren+maintained+that+its+obligation+ceased%2C+because+it+was+a+league%2C+and+the+occasion+of+it+ceased%3A+And+some+of+the+Rump+said+it+was+like+an+almanac+out+of+date%3B+and+some+of+the+soldiers+said+they+never+took+it%3B+and+others+of+them+railed+at+it+as+a+Scottish+snare%3A+So+that+when+their+interest+would+not+suffer+them+to+keep+so+solemn+a+vow%2C+their+wills+would+not+suffer+their+judgments+to+confess+it+to+be+obligatory%2C+at+least+as+to+the+part+which+they+must+violate.+%C2%A7100.+For+my+own+part%2C+though+I+kept+the+town+and+parish+of+Kidderminster+from+taking+the+Covenant+%28and+seeing+how+it+might+become+a+snare+to+their+consciences%29+yea%2C+and+most+of+Worcestershire+besides%2C+by+keeping+the+ministers+from+offering+it+in+any+of+the+congregations+to+the+people+%28except+in+Worcester+City%2C+where+I+had+no+great+interest+and+know+not+what+they+did%29%3B+yet+I+could+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%2C+as+if+the+bonds+of+national+and+personal+vows+were+as+easily+shaked+off+as+Sampson%E2%80%98s+cords.+Therefore+I+spake+and+preached+against+the+Engagement+and+dissuaded+men+from+taking+it.+The+first+hour+that+I+heard+of+it%2C+being+in+company+with+some+gentlemen+of+Worcestershire%2C+I+presently+wrote+down+above+twenty+queries+against+it%2C+intending+as+many+more+almost+against+the+obligation+as+those+were+about+the+sense+and+circumstances.+And+one+that+was+present+got+the+copy+of+them%2C+and+shortly+after+I+met+with+them+verbatim+in+a+book+of+Mr.+Henry+Hall%E2%80%98s+as+his+own+%28one+that+was+long+imprisoned+for+writing+against+Cromwell%29.+Some+episcopal+divines+that+were+not+so+scrupulous+it+seems+as+we%2C+did+write+for+it+%28private+manuscripts+which+I+have+seen%29+and+plead+the+irresistibility+of+the+imposers%2C+and+they+found+starting+holes+in+the+terms%2C+viz.+that+by+%E2%80%9Cthe+commonwealth%E2%80%9D+they+will+mean+the+present+commonwealth+in+genere%2C+and+by+%E2%80%9Cestablished%E2%80%9D+they+will+mean+only+de+facto+and+not+de+jure%2C+and+by+%E2%80%9Cwithout+a+king%2C+etc.%E2%80%9D+they+mean+not+quatenus+%5Bas+far+as%5D+but+etsi+%5Balthough%5D%2C+and+that+only+de+facto+pro+tempore+%5Bin+point+of+fact+for+the+time%5D%2C+quasi+dicat+%5B%E2%80%9Cas+if+to+say%E2%80%9D%5D%3A+%E2%80%98I+will+be+true+to+the+government+of+England%2C+though+at+the+present+the+king+and+House+of+Lords+are+put+out+of+the+exercise+of+their+power.%E2%80%99+These+were+the+expositions+of+many+episcopal+men%2C+and+others+that+took+it%3A+But+I+endeavored+to+evince+that+this+is+mere+juggling+and+jesting+with+matters+too+great+to+be+jested+with%3A+And+that+as+they+might+easily+know+that+the+imposers+had+another+sense%2C+so+as+easily+might+they+know+that+the+words+in+their+own+obvious+usual+sense+among+men+must+be+taken+as+the+promise+or+engagement+of+a+subject+as+such+to+a+form+of+government+now+pretended+to+be+established%3A+And+that+the+subjects%E2%80%99+allegiance+or+fidelity+to+his+rulers+can+be+acknowledged+and+given+in+no+plainer+words%3A+And+that+by+such+interpretations+and+stretchings+of+conscience%2C+any+treasonable+oath+or+promise+may+be+taken%2C+and+no+bonds+of+society+can+signify+much+with+such+interpreters.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reliqui%C3%A6+Baxterian%C3%A6+%28London%3A+Parkhurst%2C+1696%29%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7d4c7a910.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7d4c7a910.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=98.%20If%20you%20ask%20what%20did,can%20signify%20much%20with%20such%20interpreters&amp;text=98.%20If%20you%20ask%20what%20did%20the%20ministers&amp;text=of%20society%20can%20signify%20much%20with%20such%20interpreters" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-79decefbf0" data-kw="">
<blockquote><p>And the truth is, that, besides many other evils, the iniquity and unhappiness of such oaths and covenants [such as the SL&amp;C, which he was just examining] lie much in this, that being commonly framed by persons that even, amongst themselves, are not fully of one mind, but have their different opinions and interests to serve, (and it was so even in this) they commonly patch up so many several articles and clauses, and those too of so versatile and ambiguous terms, that they prove most wretched snares and thickets of briers and thorns to the consciences of those who are engaged in them, and matter of endless contentions and disputes amongst them, about the true sense and intendment, and the ties and obligations of those doubtful clauses: especially in such alterations and revolutions of affairs as always may, and often do, even within few years, follow after them; for the models and productions of such devices are not usually long-lived. And whatsoever may be said for their excuse in whole or in part, who, in yielding to the power that pressed it, and the general opinion of this Church at that time, did take that [Solemn League and] Covenant [1643] in the most moderate and least schismatical sense that the terms can admit; yet, I know not what can be said to clear them of a very great sin, that not only framed such an engine, but violently imposed it upon all ranks of men; not ministers and other public persons only, but the whole body and community of the people, thereby engaging such droves of poor ignorant persons to they knew not what, and (to speak freely) to such a hodge-podge of things of various concernments, religious and civil, as church discipline and government, the privileges of parliaments, and liberties of subjects, and condign punishment of malignants— things hard enough for the wisest and learnedest to draw the just lines of, and to give plain definitions and decisions of them, and therefore certainly as far off from the reach of poor country people’s understanding as from the true interest of their souls. And yet to tie them by a religious oath, either to know all, or to contend for them blindfold, without knowing of them, where will there be instanced a greater oppression and tyranny over consciences than this? Certainly, they that now govern in this Church cannot be charged with anything near or like unto it; for whatsoever they require of entrants to the ministry, they require neither subscriptions nor oaths of ministers already entered, and far less of the whole body of the people.</p></blockquote>

<blockquote><p>2. This [God’s injunction to obey civil magistrates] condemns the clergy of Rome, that exempt themselves from all princes’ authority, whereas God has said, ‘Let every soul be subject to the higher powers’ [Rom. 13:1]: If they have souls they must be subject. But how do they exempt themselves? … 2. By the Donation of Constantine; but its not in the power of princes so to do: They [princes] may exempt them [clergy] from tribute [taxes], if they will, as Pharoah took not the priests’ lands to gage for Corn; but to exempt them from subjection: they cannot. This were to make themselves wiser then God, who has put them under their authority, yea, the too much indulgence and favor of emperors, has been the bane of the Church, and helped up the Pope into his stirrup; Therefore its wisdom in them to hold their authority which God has given them.</p></blockquote>

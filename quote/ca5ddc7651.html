<main class="wrap"><figure class="quote" id="q-ca5ddc7651" data-kw="">
<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Epistemological Metaphysics’</cite></span></figcaption>

</figure><figure class="quote" id="q-3dcb0432b0" data-kw="">
<blockquote><p>21. By the knowledge of our own acts we know our powers and the nature of our own souls (though imperfectly). And by the knowledge of our souls, we know the nature of other intellectual spirits. And by the knowledge of ourselves and them, and the Scripture expressions of his attributes, we know so much of God as we can here know. And accordingly must speak of him, or be silent. For we have no higher notions than such as are thus analogical, expressing that which is in God in an inconceivable eminency and transcendency, by words which first signify that which is formally in the soul (as is said).</p></blockquote>

</figure><figure class="quote" id="q-e34b41b393" data-kw="">
<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1 | ch. 7, ‘That the truth of reason is not in opposition to the truth of the Christian faith’</cite></span></figcaption>

</figure><figure class="quote" id="q-eee29e7453" data-kw="">
<blockquote><p>I say that although things other than God are in fact contingent in respect of actual being, they are not so in respect of potential being. So things that are contingent with respect to actual existence are necessary with respect to possible existence, as that although it is contingent that man exists yet that his existence is possible is necessary.</p></blockquote>

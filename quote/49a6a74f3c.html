<blockquote><p>I mean not to condemn such public games or prices as are appointed by the magistrate: Secondly, that such games as may benefit (if need require) the commonwealth are tolerable.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<blockquote><p>and that the Engagement whereinto we are entered [to the English republican government, 1648], to be ‘true and faithful to this commonwealth, as it now is (viz.) established without a king and House of Lords,’ has nothing at all inconsistent with the former engagements [such as the SL&amp;C, 1643], or does give us the least cause to carry about with us a conscience (as to these things) trembling and doubtful, because we find ourselves free from all guilt of the least intention of violating any former promises, in things which are possible and lawful to be done by us in our places, which were unalterable conditions of all human promises, at all times presupposed and implied therein.</p></blockquote>

<blockquote><p>Oaths conceived or made rightly of things lawful, true, certain, weighty, and possible, are to be kept. For if once thou hast acknowledged and testified thyself to be justly bound to keep thy promise, and hast called God to record hereof, when as afterwards thou wittingly and willingly breakest thine oath, thou dost violate and break a just bond, and doest either accuse God, the witness and maintainer of this bond, of vanity and lightness, or provoke Him to punish thee. Ps. 15:4-5… But oaths that are made of unlawful things, either by an error, or by ignorance, or through infirmity, or against the conscience, it is sin to keep them. And therefore such oaths are to be retracted and recalled, least we add thereby sins unto sins… They therefore who keep that which they have ill sworn heap sin unto sin; as did Herod putting John Baptist to death by pretence of keeping his oath: and likewise such as keep monastical vows, whereby they have sworn idolatry and impious single living… and according to the example and doctrine of David, 1 Sam. 25, who swears that he will destroy Nabal together with his family, saying: ‘So and more also do God unto the enemies of David; for surely I will not leave of all that he has by the dawning of the day, any that pisses against the wall:’ But after he had heard Abigail speak, he gives thanks to God that the executing and fulfilling of his oath was hindered by her and confirms by a new oath that this is God’s blessing and benefit, saying: ‘Blessed be the Lord God of Israel which sent thee this day to meet me; and blessed be thy counsels, and blessed be thou, which hast kept me this day from coming to shed blood, and that mine hand has not saved me. For indeed, as the Lord God of Israel lives, who has kept me back from hurting thee, etc.’… Objection 2. The oath of peace which was made to the Gibeonites, Josh. 9, was [by deception and] against the commandment of God. It is lawful therefore to keep an oath made of things unlawful. Answer: 1. They were not excluded from peace if any of those nations which God has commanded to be destroyed, did ask peace of the Israelites and did embrace their religion. Now the Gibeonites desire peace and are adjudged to serve the tabernacle for woodcleavers and drawers of water perpetually. Therefore the peace which was promised them, albeit it was obtained by fraud and guile, yet was it not repugnant to God’s commandment. 2. The Israelites do not therefore keep this oath, as that they were bound thereby, because they sware it being deceived, and thinking the Gibeonites to have been of another country: but first for avoiding of offence, whereby the name of God might be disgraced among the heathen, if the Jews had not kept their oath; and then, because it was lawful and just to save them which desired peace and embraced their religion, although no oath had been made at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-ursinus.html">Zachary Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. Whether all oaths are to be kept</cite>, pp. 917-19</span></figcaption>

</figure><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral… (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’</cite>, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<blockquote><p>…a bearing testimony by word that God is true and knows all secrets, and will be avenged on perjury, is inseparable from vocal swearing by the name of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 88</span></figcaption>

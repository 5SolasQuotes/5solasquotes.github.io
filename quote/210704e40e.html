</figure><figure class="quote" id="q-9a6c66249f" data-kw="">
<blockquote><p>This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect: 1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them. 2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments (d. 1626; 1675) 5th Commandment</cite>, ch. 2, p. 321</span></figcaption>

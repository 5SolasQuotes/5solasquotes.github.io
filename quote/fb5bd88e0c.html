<main class="wrap"><figure class="quote" id="q-fb5bd88e0c" data-kw="">
<blockquote><p>As excessive eating or drinking both makes the body sickly and lazy, fit for nothing but sleep, and besots the mind, as it clogs up with filthy crudities the way through which the spirit should pass, bemiring them, and making them move heavily, as a coach in a deep way; thus doth all immoderate use of the world, and its delights, wrong the soul in its spiritual condition, makes it sickly and feeble, full of spiritual distempers and inactivity, benumbs the graces of the Spirit, and fills the soul with sleepy vapours, makes it grow secure and heavy in spiritual exercises, and obstructs the way and motion of the Spirit of God, in the soul.

Therefore, if you would be spiritual, healthful, and vigorous, and enjoy much of the consolations of Heaven, be sparing and sober in those of the earth, and what you abate of the one, shall be certainly made up in the other. Health, with a good constitution of body, is more a constant, permanent pleasure, than that of excess and a momentary pleasing’ of the palate: thus, the comfort of this hope is a more refined and more abiding contentment, than any that is to be found in the passing enjoyments of this world; and it is a foolish bargain to exchange a drachm of the one for many pounds of the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 176-77.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-785dedbe7c" data-kw="">
<blockquote><p>God has truly blessed us with all spiritual blessings in Jesus Christ. In that divine Christ, whom he gave us this morning in his sacrament, God presented us with all his most precious blessings – all the merits of his Son – all the consolations of his Spirit – all the sweets of his peace – all the riches of his grace – all the assurances of his glory; and if our hearts were then regulated aright, there is nothing in the treasures of his indulgence – nothing in the benefits of redemption – nothing in the joys of sanctification – nothing in the pleasure of reconciliation with God – nothing in all the sources of heavenly life and felicity, of which we have been partakers. Blessed, then, blessed be the God and Father of our Lord Jesus Christ, who hath blessed us this happy day with all spiritual blessings in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 102-03.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><figure class="quote" id="q-bd70e996c6" data-kw="">
<blockquote><p>[Margin Note:] What sparkles of grace all have For the first: God engages all men as Christ’s debtors thus far: that it is mercy that they live or have any opportunity of seeking God, whatever be the means, natural or supernatural; whereas for the sin of Adam God might by a like justice have destroyed the world and all mankind, vanity is penally inflicted on all the servants for treason of the master against the King of Heaven and earth; but in Christ there be two mitigations:

1. One is that the servants are not destroyed for the sin of the master.

2. That as the forefated lord is restored, so the sick servants groaning under vanity shall be delivered from that bondage they come under for the sin of man, Rom. 8:20-22. Hence it is, though we be outlaws by nature, that now by a privilige of grace from the Mediator, the tenants receive and lodge the master because Christ has taken off the statute and act of forfeiture.

2. No man living on earth, but he is beholding to Christ (though many know Him not) for common helps of providence, and experiences do teach him some more of God by nature.

3. The sound of Christ, God revealed in the Gospel in the apostles’ ministry, is declared and is gone to the ends of the earth and to the nations, Ps. 19:4; Rom. 10:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), p. 365</span></figcaption>

<blockquote><p>Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, ... (London: E.G., 1641), on 2 Pet. 1:10-11, p. 164</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

<main class="wrap"><figure class="quote" id="q-4761b377cf" data-kw="">
<blockquote><p>The Book of Genesis seems to divide the work of creation into six successive steps or stages. It is certainly not necessary to think that the six days spoken of in the first chapter of the Bible are intended to be six days of twenty-four hours each. We may think of them rather as very long periods of time. But do they not at least mark six distinct acts or stages of creation, rather than merely six periods in which God molded by works of providence an already created world?… The real question at issue here is the question whether at the origin of the race of mankind there was or was not a supernatural act of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian View of Man (1937; Banner of Truth, 1965), p. 115 &amp; 117</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

— Daniel Featley, Clavis mystica: a Key Opening Diverse Difficult &amp; Mysterious Texts of Holy Scripture (London: 1636), Collection of Sermons, Philip his Memento, 22nd Semon, p. 287">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+do+we%3F+what+are+we+about%3F+is+it+a+commendable+work%3F+is+it+agreeable+to+the+Word+of+God%3F+and+suitable+to+our+calling%3F+is+it+of+good+report%3F+and+all+circumstances+considered+expedient%3F+If+so%2C+go+on+in+God%E2%80%99s+name+and+the+Lord+prosper+your+handy-works%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Daniel+Featley%2C+Clavis+mystica%3A+a+Key+Opening+Diverse+Difficult+%26+Mysterious+Texts+of+Holy+Scripture+%28London%3A+1636%29%2C+Collection+of+Sermons%2C+Philip+his+Memento%2C+22nd+Semon%2C+p.+287&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8568d246e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8568d246e9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=What%20do%20we%3F%20what%20are%20we,and%20the%20Lord%20prosper%20your%20handy%2Dworks%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c489c4f375" data-kw="">
<blockquote><p>‘Substantial subscription’ is closer to the kind of ‘system subscription’ known as ‘Good Faith Subscription,’ which has been officially adopted by the PCA and which reflects the ‘Old School Presbyterian’ version of system subscription. This mode of subscription requires that the subscriber affirm the system of doctrine contained in the Confession, which ‘system’ is presumably ‘Reformed theology.’ Moreover, it requires the ordaining entity to query the candidate concerning any scruples and requires the candidate in ‘good faith’ to be open and honest about any and all scruples he may have with respect to the confessional standards. The ordaining authority must then determine whether any of the candidate’s reservations or exceptions are ‘out of accord with any fundamentals of the system of doctrine’ and ensure that his exception is ‘neither hostile to the system nor strikes at the vitals of religion.’ Though similar to system subscription, I prefer the modifier ‘substantial.’ The primary usage of ‘substantial’ is ‘of ample or considerable amount, quantity, size, etc.’ Thus, unlike ‘substance’ or ‘system’ forms of subscription, substantial conveys the message that the subscriber is in agreement with a significant proportion of the Confession… But substantial subscription goes farther than system subscription in that it formally conveys a high level of agreement not merely with the system in the Confession but with the Confession as a whole. Indeed, since substantial subscription takes the whole Confession as its starting point and since by its nature only allows for a limited amount of non-substantive exceptions, it may be viewed as a version of ‘full subscription’ that formally allows for a limited number of non-substantial caveats or exceptions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gonzales-jr-robert.html">Gonzales, Jr., Robert</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Confessional Subscription: Strict vs. Substantial’ (2016)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-34b6a0b1ee" data-kw="">
<blockquote><p>The Classis Buren form [1610] reads: ‘I the undersigned call on God as witness that I, having been called to serve as a minister in Classis Buren at ___ , and having been asked by the Classis, according to the prescribed order, what my opinion was of the Netherlands [Belgic] Confession, the [Heidelberg] Catechism, and the new fanaticism of Jacobus Arminius, have confessed and hereby do confess, not only by mouth but with my whole heart, without any duplicity or dishonesty, that what is taught in the Netherlands Confession and the Catechism is completely and sincerely scriptural (schriftmatich), and that I have never, nor shall I ever, be devoted to the novelties of Jacobus Arminius and his followers, but have cleaved to and shall cleave to the aforesaid Confession and Catechism, as the unanimous confession of the churches, to which I duly submit myself, as I also to this end in my examination and complete acceptance of the aforesaid Catechism and Confession, according to the order of Classis, by hand and mouth promise to sign, so help me God Almighty.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Netherlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Donald Sinnema, “The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal (July 2007)</cite>, p. 268, fn. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<main class="wrap"><figure class="quote" id="q-2ab96518f8" data-kw="">
<blockquote><p>…and their fear toward me is taught by the precept of men: therefore, behold, I will proceed to do a marvellous work among the people, even a marvellous work and a wonder; for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hid” (Isa. 29:13-14). And in another place, “But in vain do they worship Me, teaching for doctrines the commandments of men” (Mt. 15:9)… pious princes are repeatedly praised (2 Kings 22:1, etc.) for acting according to all his precepts, and not declining either to the right hand or the left. I go further: although there be no open manifestation of impiety in fictitious worship, it is strictly condemned by the Spirit, inasmuch as it is a departure from the command of God… And the more clearly the will of God has been manifested to us, the less excusable is our petulance in attempting anything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr. Beveridge (1564; Edinburgh: Calvin Translation Society, 1845), bk. 4, ch. 10, section 23, pp. 216-17 | “Do we think it a small matter that the Lord is deprived of his kingdom which He so strictly claims for Himself? Now, He is deprived of it as often as He is worshipped with laws of human invention, since his will is to be sole legislator of his worship. And lest any one should consider this as of small moment, let us hear how the Lord Himself estimates it.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5623f461a7" data-kw="">
<blockquote><p>It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863), pp. 278-79</span></figcaption>

<blockquote><p>In which case the Church cannot be settled all in one day, or in one year, but must crave time, as the building of Solomon’s Temple, and of the second Temple after the Babylonian Captivity, which was not accomplished in several years. Nor can it be planted over again all at once, no more than it could be in Joshua’s days, or the Judges, or in the time of the reforming kings of Judah, until the Canaanites and other enemies be subdued. Nor can it be purged totally altogether, but gradually, least it be in hazard of a superpurgation.</p></blockquote>

<blockquote><p>…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.</p></blockquote>

</figure><figure class="quote" id="q-9db19e5262" data-kw="">
<blockquote><p>As to [John Brown of Wamphray’s charge of the partially conforming Scottish ministers] being robbed of the key of discipline, Wamphray, exaggerating, means partially so, so far as the presbyteries were restricted in certain ways by the bishops, and that externally, whereas much of the spiritual discipline of Christ could still be fulfilled through the pastors’ ministries (as our [English puritan] authors below will profoundly show) and presbyteries. All Church order and discipline, be reminded, as to being performed in specific circumstances, is a matter of decency, order and edification, and is limited thereto (1 Cor. 14:26, 40).¹ ¹ See ‘How All Church Governing May be Practically Done unto Edification’ and ‘On How Church Discipline is Limited to Edification in its Time &amp; Place, etc.’ at ‘On the Ordinances, Order &amp; Policy of the Church’ (RBO) In a passage the puritans often commented on to our purpose, Dt. 12:8–11, God’s people were to put off their enjoined, stated worship ordinances while they were in the wilderness (in that broken and declining Church-state) till they came “to the rest and to the inheritance,” when God would give “you rest from all your enemies round about, so that ye dwell in safety. Then… shall ye bring all that I command you, your burnt offering, and your sacrifices…” One key factor, the passage says, for legitimately omitting whole swaths of public discipline and worship is ‘that ye dwell in safety.’… … Heb. 3:2 says, in a comparison with Christ, “Moses was faithful in all his house.” Yet Moses and the Israelites in Ex. 8:25–26 (in that broken and declining Church-state) were not sacrificing to God in Egypt so as not to scandalize the Egyptians and for their physical safety, for “will they not stone us?” Thus Moses (the prophetic mouthpiece here before Pharoah) reasoned regarding sacrificing animals before their enemies: “It is not meet so to do.” Yet God heard the Israelites’ prayers and accepted their moral obedience unto Him (Ex. 1:21; 2:24; 3:7; 4:31; 6:5; 9:20; 14:13, 31), which they did not transgress even when in danger of their lives (Ex. 1:17), in contrast to omitting public worship ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 155-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

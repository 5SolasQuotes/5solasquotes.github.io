<main class="wrap"><figure class="quote" id="q-c79f2d75de" data-kw="">
<blockquote><p>Consider, God has as much interest in them [reprobates] as in you: ‘All souls are mine, saith the Lord,’ Eze. 18:4; He was their creator as well as yours, and we are all in our blood, involved in ‘the same condemnation;’ He saw as much of original sin in you as in them; we lay in the same polluted mass. Oh! that free grace should make such a difference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude</cite>, vol. 5 (1677), pp. 133-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“Consider, God has as much interest in them [reprobates] as in you: ‘All souls are mine, saith the Lord,’ Eze. 18:4; He was their creator as well as yours, and we are all in our blood, involved in ‘the same condemnation;’ He saw as much of original sin in you as in them; we lay in the same polluted mass. Oh! that free grace should make such a difference.”

— Thomas Manton, pp. 128-34 on Reprobation on Jude 4 in Commentary on Jude, in Works, vol. 5 (1677), pp. 133-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConsider%2C+God+has+as+much+interest+in+them+%5Breprobates%5D+as+in+you%3A+%E2%80%98All+souls+are+mine%2C+saith+the+Lord%2C%E2%80%99+Eze.+18%3A4%3B+He+was+their+creator+as+well+as+yours%2C+and+we+are+all+in+our+blood%2C+involved+in+%E2%80%98the+same+condemnation%3B%E2%80%99+He+saw+as+much+of+original+sin+in+you+as+in+them%3B+we+lay+in+the+same+polluted+mass.+Oh%21+that+free+grace+should+make+such+a+difference.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+pp.+128-34+on+Reprobation+on+Jude+4+in+Commentary+on+Jude%2C+in+Works%2C+vol.+5+%281677%29%2C+pp.+133-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc79f2d75de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c79f2d75de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=Consider%2C%20God%20has%20as%20much%20interest,grace%20should%20make%20such%20a%20difference&amp;text=Consider%2C%20God%20has%20as%20much%20interest%20in%20them&amp;text=that%20free%20grace%20should%20make%20such%20a%20difference" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ffa6eaa88" data-kw="">
<blockquote><p>…on the matter of election (which he [Vermigli] identifies with predestination), God’s will in eternity is seen to be the exclusive cause. The effect of this election assumes Augustine’s anthropology by viewing all humanity as a massa perditionis [a ruined mass], doomed to eternal condemnation unless God intercedes. Divine election is portrayed positively as the rescue of the doomed sinner, who can do nothing to secure his own deliverance. After being elected from the mass of fallen sinners in eternity past… the elect embrace Christ in time and thus inherit eternal life. … Vermigli’s doctrine is an unequivocal double predestination, but he differs from other Reformers, such as Ulrich Zwingli. The latter advocates a strict symmetrical double predestination, but Vermigli constructs an asymmetrical version of this doctrine. According to Vermigli, God does not deal with the elect in precisely the same way he deals with the non-elect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/infralapsarians.html">Frank A. James</a></span><span class="wk"><span class="lbl">Work:</span> <cite>the translator of Vermigli’s Predestination &amp; Justification in The Peter Martyr Library, vol 8, ‘Translator’s Introduction’</cite>, pp. xxviii-xxix. See the larger surrounding discussion which highlights and explains some seeming supra-strains of thought in Vermigli.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=on%20the%20matter%20of%20election%20%28which,way%20he%20deals%20with%20the%20non%2Delect&amp;text=on%20the%20matter%20of%20election%20%28which%20he%20%5BVermigli&amp;text=the%20same%20way%20he%20deals%20with%20the%20non%2Delect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b4cf4f7a04" data-kw="">
<blockquote><p>4. Eternal life does not come to anyone by chance, for it is a lot that God, according to the good pleasure of His will, assigns only to those whom He has decreed and not to others. If the entire plan of the lot is from Jehovah in the distribution of earthly inheritances [Prov. 16:33], then much more does the heavenly inheritance depend on His good pleasure. Therefore, it should never be admitted that some were saved in the past or are being saved now by the chance mercy of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:12-13) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601), XII, Consequences</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-35764ae721" data-kw="infralapsarian object predestination">

</figure><figure class="quote" id="q-3256c57b2a" data-kw="">
<blockquote><p>Question 20. Did God leave all mankind to perish in the estate of sin and misery; A. God having out of his mere good pleasure, from all eternity, elected some to everlasting life… to deliver them out of an estate of sin and misery; and to bring them into an estate of salvation by a Redeemer. Q. 1. Are same persons chosen to salvation, and others left? A. Yes: God has chosen some to salvation, and passed by others; as the Scriptures speak; See Rom. 8:30… … Q. 7. What learn you from God’s election? What cause we have to admire free-grace in our choice, who were no better than others; Eph. 2:3. And were by nature children of wrath even as others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Salvation of God’s Elect &amp; of the Covenant of Grace’ on Question 20 in An Exposition of the Assembly’s Catechism in Works</cite>, (London: Baynes, 1820), vol. 6, pp. 174-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

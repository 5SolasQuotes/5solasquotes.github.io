<main class="wrap"><figure class="quote" id="q-6f9facaff9" data-kw="">
<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | voluntas Dei, ‘the will of God’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e86649f96e" data-kw="">
<blockquote><p>Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, tr. by AI by Onku (Edinburgh, 1649), ch. 2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion’ Latin, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-cd32f57039" data-kw="">
<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

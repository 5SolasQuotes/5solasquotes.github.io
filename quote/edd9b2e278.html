<main class="wrap"><figure class="quote" id="q-edd9b2e278" data-kw="">
<blockquote><p>In a debate at the Westminster Assembly, Edmund Calamy explained the difference between English hypothetical universalist and Arminian views on the extent of the atonement. I am most definitely not a hypothetical universalist but instead a strict particularist, but in order to avoid attacking straw-men, it is important to understand what this view is so that it is not conflated with the Arminian notion of universal atonement.

It is also important to remember that neither the Synod of Dort nor the Westminster Assembly condemned English hypothetical universalism as outside the bounds of Reformed orthodoxy. The strict particularlists and the hypothetical universalists were seen as different regiments in the army of true religion. We do not have to like these facts, but it is good to keep them in mind in order to deal charitably with differing brethren:

I am far from universal redemption in the Arminian sense; but that that I hold is in the sense of our divines in the Synod of Dort, that Christ did pay a price for all, – absolute intention for the elect, conditional intention for the reprobate in case they do believe, – that all men should be salvabiles, non obstant lapsu Adami … that Jesus Christ did not only die sufficiently for all, but God did intend, in giving of Christ, and Christ in giving Himself, did intend to put all men in state of salvation in case they do believe. … I argue from the iii. of Joh[n] 16, in which words a ground of God’s intention of giving Christ, God’s love to the world, a philanthropy the world of elect and reprobate, and not of elect only …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 522, 22 Oct. 1645, pp 152, 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-745348e364" data-kw="">
<blockquote><p>I. They bring that place of Saint John, Chapter 3. Verse 16. Where God is said to have so loved the world, that he gave his Son: which place we have already taught, doth hurt Arminius; and that the sending of the Son is in the following words, restrained to the believers alone. Whence it is manifest, that Christ was not sent, but to save them who were to believe.

I might say that the world is here taken for the faithful alone; as, John 6. 33 and I Tim. 3.16 and Heb. 2.5. But although we grant, that by the world all mankind are contained in the whole, yet it will not thence follow, that Christ purchased Salvation for all, and particular men, doth abundantly testify, that mankind is loved by God.

II. And it is worth the labour to know what meaning the Arminians apply to Christ, and what according to the Arminians is the sense of these Words of Christ. God so loved the world that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life.

According to the Doctrine of Arminius, this must be the sense of these words; God so loved all mankind, with a love wherewith he hath not willed their Salvation that he decreed to send his Son, before he thought of saving man, to purchase for himself the power of saving man, and afterward he decreed to give every man power of believing, if he himself would, that so he might have eternal life. A monster of Doctrine and a new Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 29.1-2, p. 215.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>IX. They comprehend the whole doctrine of Election in four decrees, which they so knit among themselves with a perpetual linking, that the latter depend on the former.

X. The I. decree of God, is of giving his son for the abolishing of sin, &amp; for the redemption of all mankind, in which redemption, they would have all mankind to be reconciled, and remission of sins to be obtained for all. The 2. decree, that whereby God decreed to save them that believe, and would persevere in faith: This is that general and conditional Election. The third decree, is that whereby God decreed to give to all men sufficient grace for faith and repentance: which power, they say, is given irresistibly, yea 3 and that God is bound to give all men this grace: But the very act of believing, they say is not given but resistably, lest force should be offered to man’s will. They deny therefore that God decreed to give to any one precisely and absolutely faith, and the act of believing. The 4. and last decree, they would have to be that whereby God hath precisely and absolutely decreed to save some certain men, for their faith for-seen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 16.9-10, pp 99-100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-c397cbcf34" data-kw="">
<blockquote><p>Saving grace is not in vain, but effectual, 1 Corinth. 15.10. 1 Tim. 1.14. And we are saved by the Grace of our Lord Jesus Christ, Acts 15.11. and no greater mercy can be wished to any, then the grace of our Lord Jesus, Rom. 16.20. 2 Cor. 13.14. Rev. 22.21. by which we are called, justified and glorified. If it be said that this grace is not that effectual saving grace, bestowed upon the Elect, but a general remote gracious power, by which we may acquire the saving grace proper to the Elect.

But so 1. that grace saving proper to the Elect by this means is in the power of all Pagans, and all must be gifted with a power to purchase that grace proper to the Elect: That must be strange conquishing, we must all be made our own efficacious Redeemers, and Christ is a Saviour by merit, not by efficacy; For if this saving grace be infused, it is either infused, we doing nothing to which they cannot stand: Or then it is acquired, and so we make the general grace saving and proper to the Elect, which everteth the nature of saving grace, and makes it the purchase of works. And they must say that Christ hath merited a general ineffectual power to some, and that he died to merit a special saving grace to others.

Let us have a warrant for this, that Christ both died equally to save all, and yet with two contrary intentions, to purchase a power of believing which should be effectual to some to save them, and ineffectual to others. If it be said that Christ died to merit the same general power to all, but some make it ineffectual, some not; This saith thus. 1. That Christ’s death might have its fruit and effect, though all perish. 2. That Christ dyed to merit a far off, lubrick and possible venture of heaven, such as was the case of the first Adam. 3. Christ dyed not to purchase a new heart more to one then to another, whereas 1 Pet. 1.18, 19. the blood the Lord shed is to Redeem us from our vain conversation, in a natural state as well as to save us from the wrath to come; Then must Christ have died to buy Pagans from Paganism and Idolatry: and that either absolutely, and then why should multitudes so die in their sins?

If conditionally, what can be the condition going before conversion, to wit, that we should be delivered from our vain conversation, so we be willing, before our conversion, to be delivered from our vain conversation. And shall not the Question recur concerning that condition? In a word they will have Christ’s death to buy Heaven, but not to buy faith, without which Heaven is impossible. Yea he no more bought to men a grace sweetly and strongly inclining the will to believe, then he bought such a grace to the damned devils. He purposed to give to all Pagans a power by which they should be made fit to perform all that the Gospel requires, and be fit to be made partakers of the inheritance of the Saints, Col. 1. And yet Paul gives thanks to God for that bestowed on the Colossians, and God must by this call all men to Christ, either mediately or immediately.

And say that God is prepared ever to give more and more as we use the former well, and that all by sufficient grace (saith Corvinus) are disposed to conversion, but that sufficiency is not habitual grace, but actual assistance conveying the Preached Word, which is to bring all to free-wills power, rejecting all infused power, and to make an influence of grace, which is in the power of free will to use or not to use, and to stand in two. 1. In a measure of heavenly Doctrine. 2. In the stirring upon the heart; Whence 1. Grace habitual so is denied; then the will needeth no healing. 2. Grace universal is limited to the Word Preached, then it is not universal; For Pagans hear not the Word Preached. 3. There is no other help given to free-will in every act, but 1. Information by the Word, that was the grace of Pelagius. 2. Some influence of God in every act: But that adds not new strength to the will. Shortly they say, Any man may know, understand and believe the Gospel, if the object be sufficiently proposed and revealed. And so the natural man can no more know and receive the things of the Gospel, then he can understand the Metaphysics, the Acromaticks of Aristotle: for these he cannot receive, but judgeth them folly; And so we are the same way blind, dead, stony-hearted to believe the Gospel, as we are to know and believe the mysteries of Aristotle’s Philosophy.

Lastly, this power of believing and coming to Christ cannot be in all men, since the Scripture saith of all men (even these within the Visible Church not excepted) that until the light of the Gospel savingly enlighten them, they sit in darkness and in the shadow of death, Isa. 9.1. Math. 4.15, 16. And No man can come to Christ without the Father’s drawing, and God teaching the heart, Joh. 6.44, 45. The natural man cannot understand the things of God, but judges them foolishness. 1 Cor. 2.14. His wisdom cannot be subject to the Law of God. Rom. 8.7. He cannot call the Lord, Jesus, except by the Spirit of Jesus, 1 Cor. 12.3. He is a withered branch being out of Christ, and can do nothing, Joh. 15.3.4.

It shall be clear to any, that the Holy Ghost denyeth any such power, as they af∣firm. It reckons not much to tell that Jesuits, as Martmez de Ripul. Suarez, Alphonsus Curiel, Duvallius, Lod. Molma, Did. Ruiz, Vasquez, Bellarmine, Phili. Samachaeus, Sorbonicus, Gulie. Estius, Dominica, Toletus Cardinalis, Pirerius, Salmeron, teach that, without saving grace, men may, and can first know moral truths, shining virtues, as heathens, be free of sin, as touching these virtues in their due circumstances. 2. Keep the Commandments and Law of Nature. 3. Dispose themselves for, and obtain the grace of Conversion by their own industry. 4. Be victorious over this or that weighty temptation singly taken. 5. That there is no intrinsical hurt of free-will, that it is wounded a little, because of the darkness of the mind, and languor of nature, but not dead to actions supernatural. 6. That we may love God as the Author of nature, and Creator sincerely; And Arminians teach that we may without the Spirit of God know all truth, quantum sufficit ad salutem, sufficiently to salvation, and so may will, love, and believe without the infused supernatural habit or grace, so their Apology.

And the Socinian Catechism, c. 6. pag. 212. and Socinus himself, Praelect. Theol. Cap. 4. Fol. 15, 16. Et de officio hominis Christi: Cap. 5. Smalcius on Joh. 1. Hom. 3. Give to us man whole, sound, sinless, as he came from the first Adam. 2. That man can do all that Cod commands him with little help of God. 3. It’s an error (saith Smalcius) that a man hath no strength in spiritual things, there is no need of the inward gift of the Spirit of God to believe (saith the Racovian Catechism) for we read not that such a gift in Scripture is bestowed upon any but upon believers: such as are born of Adam (saith Socinus) are all born in the same condition, and nothing is taken from such a man, which he naturally hath or was to have. Ostorodius Justi. Relig. Christ. cap. 21. Praedicatio sola Euangelij potest hominem abs{que} interná Spiritus illuminatione, &amp; operatione à peccatis convertere. The only Preaching of the Gospel without the inward illumination by the Holy Spirit, and his working is able to convert a man from sin. All which is Printed and taught, and many other abominable errors to us.

To this Objection against universal grace (as I judge unanswerable) Corvinus Answers, that all the places of Scripture brought to prove man’s inability to believe in Christ, and to worship him, conclude well that a man hath not strength of himself without Christ and his grace; but this is but to cloud the truth, and to mock the reader, for if all and every man (even the Infants of Pagans) be in Covenant through Christ, and be made able by a gifted grace common to all, within, and without the Church, by which they are able by degrees to do all that the Gospel requires, what avails it to discourage them, and to tell, they are not masters of a good thought, without grace; for they are no less masters of good thoughts and good words, and of good actions then Adam was; for they are not hearers of the Gospel by nature, but as gifted with universal grace, they are hearers, and before their conversion, and before they receive the Spirit of Regeneration, can please God, and prepare themselves for Regeneration:

Yea there is no animal and natural Pagan de facto existing in the world (by their way) who cannot receive the things of God, and cannot come to Christ, except he be drawn, for all Pagans and others are drawn, and by this it might have been said, Adam as wanting supernatural grace, and as a natural man (for the Image of God was supernatural grace to Adam, as Arminius and Corvinus teach) so, was not able to think a good thought, as 2 Cor. 3.5. nor able to receive the things of God, as the natural man, 1 Cor. 2.14. and Adam so was also dead in trespasses and sins, and must come to Christ the same way, to wit, drawn by the grace super-added to nature, as we fallen sinners do.</p></blockquote>

+venture+of+heaven%2C+such+as+was+the+case+of+the+first+Adam.+3.+Christ+dyed+not+to+purchase+a+new+heart+more+to+one+then+to+another%2C+whereas+1+Pet.+1.18%2C+19.+the+blood+the+Lord+shed+is+to+Redeem+us+from+our+vain+conversation%2C+in+a+natural+state+as+well+as+to+save+us+from+the+wrath+to+come%3B+Then+must+Christ+have+died+to+buy+Pagans+from+Paganism+and+Idolatry%3A+and+that+either+absolutely%2C+and+then+why+should+multitudes+so+die+in+their+sins%3F%0A%0AIf+conditionally%2C+what+can+be+the+condition+going+before+conversion%2C+to+wit%2C+that+we+should+be+delivered+from+our+vain+conversation%2C+so+we+be+willing%2C+before+our+conversion%2C+to+be+delivered+from+our+vain+conversation.+And+shall+not+the+Question+recur+concerning+that+condition%3F+In+a+word+they+will+have+Christ%E2%80%99s+death+to+buy+Heaven%2C+but+not+to+buy+faith%2C+without+which+Heaven+is+impossible.+Yea+he+no+more+bought+to+men+a+grace+sweetly+and+strongly+inclining+the+will+to+believe%2C+then+he+bought+such+a+grace+to+the+damned+devils.+He+purposed+to+give+to+all+Pagans+a+power+by+which+they+should+be+made+fit+to+perform+all+that+the+Gospel+requires%2C+and+be+fit+to+be+made+partakers+of+the+inheritance+of+the+Saints%2C+Col.+1.+And+yet+Paul+gives+thanks+to+God+for+that+bestowed+on+the+Colossians%2C+and+God+must+by+this+call+all+men+to+Christ%2C+either+mediately+or+immediately.%0A%0AAnd+say+that+God+is+prepared+ever+to+give+more+and+more+as+we+use+the+former+well%2C+and+that+all+by+sufficient+grace+%28saith+Corvinus%29+are+disposed+to+conversion%2C+but+that+sufficiency+is+not+habitual+grace%2C+but+actual+assistance+conveying+the+Preached+Word%2C+which+is+to+bring+all+to+free-wills+power%2C+rejecting+all+infused+power%2C+and+to+make+an+influence+of+grace%2C+which+is+in+the+power+of+free+will+to+use+or+not+to+use%2C+and+to+stand+in+two.+1.+In+a+measure+of+heavenly+Doctrine.+2.+In+the+stirring+upon+the+heart%3B+Whence+1.+Grace+habitual+so+is+denied%3B+then+the+will+needeth+no+healing.+2.+Grace+universal+is+limited+to+the+Word+Preached%2C+then+it+is+not+universal%3B+For+Pagans+hear+not+the+Word+Preached.+3.+There+is+no+other+help+given+to+free-will+in+every+act%2C+but+1.+Information+by+the+Word%2C+that+was+the+grace+of+Pelagius.+2.+Some+influence+of+God+in+every+act%3A+But+that+adds+not+new+strength+to+the+will.+Shortly+they+say%2C+Any+man+may+know%2C+understand+and+believe+the+Gospel%2C+if+the+object+be+sufficiently+proposed+and+revealed.+And+so+the+natural+man+can+no+more+know+and+receive+the+things+of+the+Gospel%2C+then+he+can+understand+the+Metaphysics%2C+the+Acromaticks+of+Aristotle%3A+for+these+he+cannot+receive%2C+but+judgeth+them+folly%3B+And+so+we+are+the+same+way+blind%2C+dead%2C+stony-hearted+to+believe+the+Gospel%2C+as+we+are+to+know+and+believe+the+mysteries+of+Aristotle%E2%80%99s+Philosophy.%0A%0ALastly%2C+this+power+of+believing+and+coming+to+Christ+cannot+be+in+all+men%2C+since+the+Scripture+saith+of+all+men+%28even+these+within+the+Visible+Church+not+excepted%29+that+until+the+light+of+the+Gospel+savingly+enlighten+them%2C+they+sit+in+darkness+and+in+the+shadow+of+death%2C+Isa.+9.1.+Math.+4.15%2C+16.+And+No+man+can+come+to+Christ+without+the+Father%E2%80%99s+drawing%2C+and+God+teaching+the+heart%2C+Joh.+6.44%2C+45.+The+natural+man+cannot+understand+the+things+of+God%2C+but+judges+them+foolishness.+1+Cor.+2.14.+His+wisdom+cannot+be+subject+to+the+Law+of+God.+Rom.+8.7.+He+cannot+call+the+Lord%2C+Jesus%2C+except+by+the+Spirit+of+Jesus%2C+1+Cor.+12.3.+He+is+a+withered+branch+being+out+of+Christ%2C+and+can+do+nothing%2C+Joh.+15.3.4.%0A%0AIt+shall+be+clear+to+any%2C+that+the+Holy+Ghost+denyeth+any+such+power%2C+as+they+af%E2%88%A3firm.+It+reckons+not+much+to+tell+that+Jesuits%2C+as+Martmez+de+Ripul.+Suarez%2C+Alphonsus+Curiel%2C+Duvallius%2C+Lod.+Molma%2C+Did.+Ruiz%2C+Vasquez%2C+Bellarmine%2C+Phili.+Samachaeus%2C+Sorbonicus%2C+Gulie.+Estius%2C+Dominica%2C+Toletus+Cardinalis%2C+Pirerius%2C+Salmeron%2C+teach+that%2C+without+saving+grace%2C+men+may%2C+and+can+first+know+moral+truths%2C+shining+virtues%2C+as+heathens%2C+be+free+of+sin%2C+as+touching+these+virtues+in+their+due+circumstances.+2.+Keep+the+Commandments+and+Law+of+Nature.+3.+Dispose+themselves+for%2C+and+obtain+the+grace+of+Conversion+by+their+own+industry.+4.+Be+victorious+over+this+or+that+weighty+temptation+singly+taken.+5.+That+there+is+no+intrinsical+hurt+of+free-will%2C+that+it+is+wounded+a+little%2C+because+of+the+darkness+of+the+mind%2C+and+languor+of+nature%2C+but+not+dead+to+actions+supernatural.+6.+That+we+may+love+God+as+the+Author+of+nature%2C+and+Creator+sincerely%3B+And+Arminians+teach+that+we+may+without+the+Spirit+of+God+know+all+truth%2C+quantum+sufficit+ad+salutem%2C+sufficiently+to+salvation%2C+and+so+may+will%2C+love%2C+and+believe+without+the+infused+supernatural+habit+or+grace%2C+so+their+Apology.%0A%0AAnd+the+Socinian+Catechism%2C+c.+6.+pag.+212.+and+Socinus+himself%2C+Praelect.+Theol.+Cap.+4.+Fol.+15%2C+16.+Et+de+officio+hominis+Christi%3A+Cap.+5.+Smalcius+on+Joh.+1.+Hom.+3.+Give+to+us+man+whole%2C+sound%2C+sinless%2C+as+he+came+from+the+first+Adam.+2.+That+man+can+do+all+that+Cod+commands+him+with+little+help+of+God.+3.+It%E2%80%99s+an+error+%28saith+Smalcius%29+that+a+man+hath+no+strength+in+spiritual+things%2C+there+is+no+need+of+the+inward+gift+of+the+Spirit+of+God+to+believe+%28saith+the+Racovian+Catechism%29+for+we+read+not+that+such+a+gift+in+Scripture+is+bestowed+upon+any+but+upon+believers%3A+such+as+are+born+of+Adam+%28saith+Socinus%29+are+all+born+in+the+same+condition%2C+and+nothing+is+taken+from+such+a+man%2C+which+he+naturally+hath+or+was+to+have.+Ostorodius+Justi.+Relig.+Christ.+cap.+21.+Praedicatio+sola+Euangelij+potest+hominem+abs%7Bque%7D+intern%C3%A1+Spiritus+illuminatione%2C+%26+operatione+%C3%A0+peccatis+convertere.+The+only+Preaching+of+the+Gospel+without+the+inward+illumination+by+the+Holy+Spirit%2C+and+his+working+is+able+to+convert+a+man+from+sin.+All+which+is+Printed+and+taught%2C+and+many+other+abominable+errors+to+us.%0A%0ATo+this+Objection+against+universal+grace+%28as+I+judge+unanswerable%29+Corvinus+Answers%2C+that+all+the+places+of+Scripture+brought+to+prove+man%E2%80%99s+inability+to+believe+in+Christ%2C+and+to+worship+him%2C+conclude+well+that+a+man+hath+not+strength+of+himself+without+Christ+and+his+grace%3B+but+this+is+but+to+cloud+the+truth%2C+and+to+mock+the+reader%2C+for+if+all+and+every+man+%28even+the+Infants+of+Pagans%29+be+in+Covenant+through+Christ%2C+and+be+made+able+by+a+gifted+grace+common+to+all%2C+within%2C+and+without+the+Church%2C+by+which+they+are+able+by+degrees+to+do+all+that+the+Gospel+requires%2C+what+avails+it+to+discourage+them%2C+and+to+tell%2C+they+are+not+masters+of+a+good+thought%2C+without+grace%3B+for+they+are+no+less+masters+of+good+thoughts+and+good+words%2C+and+of+good+actions+then+Adam+was%3B+for+they+are+not+hearers+of+the+Gospel+by+nature%2C+but+as+gifted+with+universal+grace%2C+they+are+hearers%2C+and+before+their+conversion%2C+and+before+they+receive+the+Spirit+of+Regeneration%2C+can+please+God%2C+and+prepare+themselves+for+Regeneration%3A%0A%0AYea+there+is+no+animal+and+natural+Pagan+de+facto+existing+in+the+world+%28by+their+way%29+who+cannot+receive+the+things+of+God%2C+and+cannot+come+to+Christ%2C+except+he+be+drawn%2C+for+all+Pagans+and+others+are+drawn%2C+and+by+this+it+might+have+been+said%2C+Adam+as+wanting+supernatural+grace%2C+and+as+a+natural+man+%28for+the+Image+of+God+was+supernatural+grace+to+Adam%2C+as+Arminius+and+Corvinus+teach%29+so%2C+was+not+able+to+think+a+good+thought%2C+as+2+Cor.+3.5.+nor+able+to+receive+the+things+of+God%2C+as+the+natural+man%2C+1+Cor.+2.14.+and+Adam+so+was+also+dead+in+trespasses+and+sins%2C+and+must+come+to+Christ+the+same+way%2C+to+wit%2C+drawn+by+the+grace+super-added+to+nature%2C+as+we+fallen+sinners+do.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+covenant+of+life+opened%2C+or%2C+A+treatise+of+the+covenant+of+grace%2C+%28Edinburgh%3A+Robert+Brown%2C+1655%29%2C+1.15%2C+pp+12

<blockquote><p>The Dutch Reformed theologian Herman Witsius gave the following praise to King William III for his role at the Battle of the Boyne in 1690:

Surely I shall never forget that day on which the river Boyne in Ireland had like to be distinguished by your fall, though, by the blessing of God, it was ennobled by your victory; for while, according to your wonted attention and care, you went to a nearer view of the enemy’s camp, a cannon ball, leveled at your person, happened to graze your shoulder; a wound, which gave matter of great joy to your enemies, of apprehension to your own people, than of real harm to yourself; a wound, which taught us you was a man, but a man above the common rank of mankind, a man dear to heaven; a wound, in the fine, which, however great, prevented not your performing all the parts of a brave general, nor suffered you to take repose to your own person till you had procured it for others.

O! the wisdom and goodness of propitious heaven! O! a day for ever memorable in our calendar! How near were your enemies to exult with solid joy, who now, deceived by the false reports of your death, made themselves ridiculous to the world by a theatrical and unmanly shew of indiscreet rejoicing? Great Prince, with these eyes I saw, in these hands I held, to these lips I applied that military tunick, whose wide rent testified the greatness of your wound. Those precious spoils I saw purpled with your blood, and I mixed my affectionate tears with the royal gore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dedication.html">Dedication</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William III in Herman Witsius, The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank (1677; 2 vols, London, 1822), i, 10-11.</cite></span></figcaption>

<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

doctrine+of+lawgiving+says+thus%3A+%E2%80%98No+man+may+punish+or+condemn+another+even+with+a+just+punishment%2C+except+he+have+public+power%2C+which+a+tyrant+cannot+give.+But+in+this+there+must+be+a+consideration+or+subdistinction.+For+in+rigor+this+is+true+as+to+the+tyrant%E2%80%99s+part%3B+yet+it+so+happens+that+the+commonwealth+because+it+cannot+resist+him%2C+does+tolerate+him%2C+and+suffers+itself+to+be+governed+by+him%3B+and+does+tacitly+consent%2C+and+will+that+justice+be+administered+by+him%2C+for+the+reason+already+touched%2C+because+it+is+a+less+evil+to+be+governed+by+him%2C+than+altogether+to+want+just+coaction+and+direction%3B+and+then+it+shall+not+be+a+sin+to+obey+even+in+the+things+aforesaid%2C+because+the+consent+of+the+commonwealth+does+supply+the+defect+of+the+tyrant%E2%80%99s+power.%E2%80%99+%28Suarez%2C+De+Leg.%2C+bk.+3%2C+ch.+10%29+Another+thus%3A+%E2%80%98That+his+sentences+are+valid%2C+is+proved.+Because+his+sentences%2C+and+just+commands+although+they+have+not+force+from+a+tyrannical+power%2C+yet+they+have+it+from+elsewhere.+First%2C+and+inchoatively+from+the+law+of+nature%2C+which+such+a+state+of+things+being+supposed%2C+does+dictate+that+obedience+must+be+given+for+the+common+good%2C+otherwise+all+will+be+full+of+thefts+and+robberies.+Secondly%2C+and+completely+from+the+commonwealth%3B+and+that+either+because+while+that+state+endures%2C+it+gives+authority+to+him+by+a+tacit+consent%2C+while+it+will%E2%80%99s+that+he+administer+justice%2C+and+use+his+usurped+office+in+a+due+manner%2C+or+rather+because+it+does+tacitly+approve+his+commands%2C+and+acts+being+agreeable+to+the+laws+and+common+good%2C+and+will%E2%80%99s+that+his+just+sentences%2C+whereby+the+suites+of+the+people+are+decided%2C+and+the+guilty+are+punished%2C+shall+be+valid+and+bind+the+subjects%3B+for+except+they+were+valid+and+did+bind%2C+no+man+would+obey%2C+but+only+in+show+but+every+man+would+secretly+do+the+contrary+with+a+great+inconvenience+to+the+commonwealth.+Now+the+commonwealth+may+give+this+force+to+the+sentences%2C+and+acts+of+a+tyrant%2C+because+it+is+superior+to+all+single+persons%2C+though+it+be+oppressed+with+tyranny%2C+and+may+account+the+just+sentence+of+a+tyrant+as+its+own.%E2%80%99+%28Lessius%2C+De+Justitia+%26+Jure%2C+bk.+2%2C+ch.+25%2C+Dubitat.+9%29+Thou+wilt+ask+whether+a+tyrant+do+sin+the+sin+of+murder%2C+and+be+bound+to+restitution%2C+if+he+put+to+death+guilty+persons%2C+or+deprive+them+of+their+goods+according+to+law%3F+I+answer+negatively%3B+because+the+commonwealth+does+tacitly+give+him+authority+hereunto%2C+while+it+does+consent+and+desire+that+this+should+be+done+by+him.+Thus+is+the+authority+of+acting+in+this+case+grounded+upon+a+tacit+or+implied+consent%2C+which+consent+is+the+very+dictate+of+nature+or+common+reason%2C+because+it+is+better+to+have+some+justice+than+none+at+all%2C+some+coercive+power+and+government+than+that+all+be+left+to+disorder%2C+violence+and+confusion.%E2%80%9D%0A%0A%E2%80%94+Francis+Rous%2C+The+Lawfulness+of+Obeying+the+Present+Government%2C+%E2%80%A6+%28London%2C+1649%29%2C+pp.+16-19+Rouse+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a06baff06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a06baff06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=Thirdly%2C%20it%20is%20cleared%20in%20this,left%20to%20disorder%2C%20violence%20and%20confusion&amp;text=Thirdly%2C%20it%20is%20cleared%20in%20this%20discourse%20that&amp;text=all%20be%20left%20to%20disorder%2C%20violence%20and%20confusion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Answer: Though the violation of the general [moral] law hurts the conscience, it being against the Fifth Commandment; it follows not that the violation of every particular law, even that that is merely positive, hurts the conscience before God: For then the carrying of armor in the night [which is suspicious of violence and may be dangerous to a town], suppose no ruler on earth make a law there anent, should be a sin before God, which no wise-man can say. 2. The other reason is more important, and draws with it that school-question agitated by [civil] jurists also and [ecclesiastical] canonists, An ulla detur lex pure paenalis; ‘If there be a law purely penal,’ without sin in it: And if the law of rulers in things merely positive be merely penal and co-active, and not formally obliging [connected] to sin. But I Answer: Rulers do justly punish the transgression of a positive law, not as particularly human and positive: But as:

1. It has connection with the moral reason of the law.

2. As the particular transgression is scandalous and against order, in which case the formal object of the just punishment inflicted by the ruler, is in very deed not the simple omission of the positive act of a particular human law, but the violation of the moral goodness annexed to it, and of the scandal given. Now in this meaning, the transgression of the positive human law is not kindly [in its kind], per se, of itself punishable, but by accident, and so it binds the conscience by accident; and in this sense, great doctors, as Ambrose, Anselm, Theodoret, Chrysostom, Navarra, Felinus, Taraquel, say that human laws oblige the conscience. But the most learned of the [ecclesiastical] canonists aver that not to obey civil laws, laying aside the evil of scandal, is no mortal sin, and so does not involve the conscience in guiltiness before God.</p></blockquote>

<blockquote><p>Assertion 1 — There is an oath betwixt the king and his people, laying on by reciprocation of bands mutual civil obligation upon the king to the people and the people to the king; 2 Sam. 5:3, “So all the elders of Israel came to the king to Hebron, and king David made a covenant with them in Hebron before the Lord, and they anointed David king over Israel.” 1 Chron. 11:3, “And David made a covenant with them before the Lord, and they anointed David king over Israel, according to the word of the Lord by Samuel.” 2 Chron. 23:2-3, ” And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem. And all the congregation made a covenant with the king [Joash] in the house of God.” 2 Kings 11:17, “Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people; between the king also and the people.” Eccl. 8:2, “I counsel thee to keep the king’s commandment, and that in regard of the oath of God.</p></blockquote>

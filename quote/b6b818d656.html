<main class="wrap"><figure class="quote" id="q-b6b818d656" data-kw="">
<blockquote><p>Therefore, since I expounded Aristotle’s Ethics, I have added this commentary in which I follow not only Aristotle’s meaning, but also his method. … I, however, who have been engaged in these disputes among the sects for a long time and often at length turning them upside down (anō kai katō strephōn), as Plato enjoins one to do [Gorgias 511a], urgently admonish the young to reject Stoics and Epicureans and embrace the Peripatetic school. For even if Epicureanism and Stoicism are defended zealously and, so to speak, advertised, in order to do so it is necessary to mix in much sophistry, according to the saying by Euripides: ‘The unjust word, sick in itself, needs wise remedies (ho de adikos logos, nosōn en autōi, pharmakōn deitai sophōn)’ [Fragment 354].

Furthermore, false beliefs also harm morals, and the very habit of sophistry is destructive in many ways: it corrupts one’s judgement, lures minds away from the love and study of propriety and simple truth, and accustoms the intellect to loving monstrous beliefs, and to striving to obfuscate rather than to explain things. In Aristotle, however, method governs the disputation and, so to speak, forces it within boundaries, so that it does not stray from demonstrations and the right path. For that reason it elicits true opinions and explains them in order and properly. Therefore Peripatetic philosophy is more useful, because of both the true opinions and the example of method. Aristotle himself said that beliefs that have no usefulness for life or morals should be rejected. Many Stoic ideas are of that kind, namely those on freedom from emotions, on fate and several others. …

Therefore, since in choosing a type of teaching one has to choose what is correct, true, simple, steadfast, well ordered and useful for life, I believe that young minds need to be instructed chiefly with Aristotelian doctrine, which in these qualities surpasses all other sects. Why? Because Aristotle’s Ethics should also be loved, because he alone saw and understood that the virtues are middle states. By that description he instructs us most learnedly that the impulses of the mind must be bent to moderation and held back.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dedicatory Letter to Melanchthon s, Epitome of Moral Philosophy</cite></span></figcaption>

</figure><figure class="quote" id="q-6e89666afa" data-kw="">
<blockquote><p>To God indeed the grand object of knowledge, the great source of obligation, the bestower of all happiness, the author of every good and perfect gift, your attention already has been or should have been directed in the study of his works, and especially in the study of man, the noblest of his works. God’s works should be all studied with a reference to him who created and sustains them.

The things that are made should be ever contemplated as having been made and regulated for the purpose of making known the invisible things of God, even his eternal power and Godhead; and moral philosophy, when taught as it should be, unfolds all that can be known of God, and of man’s relation to him, from the light of nature and the works of creation and providence, and especially from man’s mental constitution, in order to settle aright the nature, ground, and requirements of duty, in so far as these can be known and ascertained without an immediate and supernatural revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, ed. Thomas Smith (New York: Robert Carter and Brothers, 1878), Lecture I, pp 5-6.</span></figcaption>

<blockquote><p>The law of the Lord. Here the second part of the psalm commences. After having shown that the creatures, although they do not speak, nevertheless serve as instructors to all mankind, and teach all men so clearly that there is a God, as to render them inexcusable, the Psalmist now turns towards the Jews, to whom God had communicated a fuller knowledge of himself by means of his word. While the heavens bear witness concerning God, their testimony does not lead men so far as that thereby they learn truly to fear him, and acquire a well-grounded knowledge of him; it serves only to render them inexcusable. It is doubtless true, that if we were not very dull and stupid, the signatures and proofs of Deity which are to be found on the theatre of the world, are abundant enough to incite us to acknowledge and reverence God; but as, although surrounded with so clear a light, we are nevertheless blind, this splendid representation of the glory of God, without the aid of the word, would profit us nothing, although it should be to us as a loud and distinct proclamation sounding in our ears.

Accordingly, God vouchsafes to those whom he has determined to call to salvation special grace, just as in ancient times, while he gave to all men without exception evidences of his existence in his works, he communicated to the children of Abraham alone his Law, thereby to furnish them with a more certain and intimate knowledge of his majesty. Whence it follows, that the Jews are bound by a double tie to serve God. As the Gentiles, to whom God has spoken only by the dumb creatures, have no excuse for their ignorance, how much less is their stupidity to be endured who neglect to hear the voice which proceeds from his own sacred mouth? The end, therefore, which David here has in view, is to excite the Jews, whom God had bound to himself by a more sacred bond, to yield obedience to him with a more prompt and cheerful affection.

Farther, under the term law, he not only means the rule of living righteously, or the Ten Commandments, but he also comprehends the covenant by which God had distinguished that people from the rest of the world, and the whole doctrine of Moses, the parts of which he afterwards enumerates under the terms testimonies, statutes, and other names. These titles and commendations by which he exalts the dignity and excellence of the Law would not agree with the Ten Commandments alone, unless there were, at the same time, joined to them a free adoption and the promises which depend upon it; and, in short, the whole body of doctrine of which true religion and godliness consists.

As to the Hebrew words which are here used, I will not spend much time in endeavouring very exactly to give the particular signification of each of them, because it is easy to gather from other passages, that they are sometimes confounded or used indifferently. עדות, eduth, which we render testimony, is generally taken for the covenant, in which God, on the one hand, promised to the children of Abraham that he would be their God, and on the other required faith and obedience on their part. It, therefore, denotes the mutual covenant entered into between God and his ancient people. The word פקודים, pikkudim, which I have followed others in translating statutes, is restricted by some to ceremonies, but improperly in my judgment: for I find that it is every where taken generally for ordinances and edicts. The word מצוה, mitsvah, which follows immediately after, and which we translate commandment, has almost the same signification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 317-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

s+from+his+own+sacred+mouth%3F+The+end%2C+therefore%2C+which+David+here+has+in+view%2C+is+to+excite+the+Jews%2C+whom+God+had+bound+to+himself+by+a+more+sacred+bond%2C+to+yield+obedience+to+him+with+a+more+prompt+and+cheerful+affection.%0A%0AFarther%2C+under+the+term+law%2C+he+not+only+means+the+rule+of+living+righteously%2C+or+the+Ten+Commandments%2C+but+he+also+comprehends+the+covenant+by+which+God+had+distinguished+that+people+from+the+rest+of+the+world%2C+and+the+whole+doctrine+of+Moses%2C+the+parts+of+which+he+afterwards+enumerates+under+the+terms+testimonies%2C+statutes%2C+and+other+names.+These+titles+and+commendations+by+which+he+exalts+the+dignity+and+excellence+of+the+Law+would+not+agree+with+the+Ten+Commandments+alone%2C+unless+there+were%2C+at+the+same+time%2C+joined+to+them+a+free+adoption+and+the+promises+which+depend+upon+it%3B+and%2C+in+short%2C+the+whole+body+of+doctrine+of+which+true+religion+and+godliness+consists.%0A%0AAs+to+the+Hebrew+words+which+are+here+used%2C+I+will+not+spend+much+time+in+endeavouring+very+exactly+to+give+the+particular+signification+of+each+of+them%2C+because+it+is+easy+to+gather+from+other+passages%2C+that+they+are+sometimes+confounded+or+used+indifferently.+%D7%A2%D7%93%D7%95%D7%AA%2C+eduth%2C+which+we+render+testimony%2C+is+generally+taken+for+the+covenant%2C+in+which+God%2C+on+the+one+hand%2C+promised+to+the+children+of+Abraham+that+he+would+be+their+God%2C+and+on+the+other+required+faith+and+obedience+on+their+part.+It%2C+therefore%2C+denotes+the+mutual+covenant+entered+into+between+God+and+his+ancient+people.+The+word+%D7%A4%D7%A7%D7%95%D7%93%D7%99%D7%9D%2C+pikkudim%2C+which+I+have+followed+others+in+translating+statutes%2C+is+restricted+by+some+to+ceremonies%2C+but+improperly+in+my+judgment%3A+for+I+find+that+it+is+every+where+taken+generally+for+ordinances+and+edicts.+The+word+%D7%9E%D7%A6%D7%95%D7%94%2C+mitsvah%2C+which+follows+immediately+after%2C+and+which+we+translate+commandment%2C+has+almost+the+same+signification.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+Psalms%2C+%281557%29%2C+trans.+James+Anderson+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+4b%3A+317-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff50dc5bd73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f50dc5bd73.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/11/12/john-calvin-on-the-knowledge-of-god-from-nature-and-scripture/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5ce1756f65" data-kw="">
<blockquote><p>Warfield, following the Scottish Reformation, made the case that all humans can use reason to know God. This isn’t a statement about the noetic effects of the fall but a statement about reason. Reason makes God known. Reason is that by which we understand anything at all. It is not simply a first principle because we use reason even to form first principles. Reason is transcendental, meaning it cannot be questioned because it makes questioning possible. We use reason to form beliefs about nature, and we use reason to form beliefs about scripture. Humans are fallen having a darkened mind meaning they have rejected reason and for that they are without excuse. Reason and argument are still there to reveal their condition in unbelief and its consequences. Warfield is speaking of reason as the laws of thought (right reason), Kuyper of man’s reasoning process. Warfield’s definition is more basic. It is the failure to correctly define reason that allowed the challenges of Hume and Kant to the knowledge of God.</p></blockquote>

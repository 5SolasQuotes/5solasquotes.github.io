<main class="wrap"><figure class="quote" id="q-cb531fb3bb" data-kw="">
<blockquote><p>Love is not quick to resent evil, but is disposed to do good. … Love does not seek to win admiration and applause. Is not puffed up, i.e. conceited. This is the root of the preceding. The man who has a high conceit of himself is apt to be boastful and desirous of praise. Love, on the other hand, is modest and humble; modest because humble.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, on 13:4</span></figcaption>

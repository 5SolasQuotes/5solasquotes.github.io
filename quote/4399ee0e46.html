<main class="wrap"><figure class="quote" id="q-4399ee0e46" data-kw="">
<blockquote><p>In summary, for [John] Cameron, as for Aquinas, the fundamental core of ethics chiefly concerned immanent structures of divine rationality. By contrast, for Rutherford, ethics was grounded in both human self-denial and subjection to God and the higher, transcendent and ultimately inscrutable rationality of the divine will.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

— Simon J.G. Burton, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, p. 138">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+summary%2C+for+%5BJohn%5D+Cameron%2C+as+for+Aquinas%2C+the+fundamental+core+of+ethics+chiefly+concerned+immanent+structures+of+divine+rationality.+By+contrast%2C+for+Rutherford%2C+ethics+was+grounded+in+both+human+self-denial+and+subjection+to+God+and+the+higher%2C+transcendent+and+ultimately+inscrutable+rationality+of+the+divine+will.%E2%80%9D%0A%0A%E2%80%94+Simon+J.G.+Burton%2C+ch.+7%2C+%E2%80%98Samuel+Rutherford%E2%80%99s+Euthyphro+Dilemma%3A+A+Reformed+Perspective+on+the+Scholastic+Natural+Law+Tradition%E2%80%99+in+d.+Aaron+C.+Denlinger%2C+Reformed+Orthodoxy+in+Scotland%3A+Essays+on+Scottish+Theology%2C+1560-1775+%28Bloomsbury%2C+T%26T+Clark%2C+2016%29%2C+pt.+2%2C+pp.+123-40%2C+p.+138&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4399ee0e46.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4399ee0e46.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/natural-law/#:~:text=In%20summary%2C%20for%20%5BJohn%5D%20Cameron%2C%20as,inscrutable%20rationality%20of%20the%20divine%20will&amp;text=In%20summary%2C%20for%20%5BJohn%5D%20Cameron%2C%20as%20for%20Aquinas&amp;text=and%20ultimately%20inscrutable%20rationality%20of%20the%20divine%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-930c01a611" data-kw="">
<blockquote><p>XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 18</cite>, pp. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-ec3ab1befd" data-kw="">
<blockquote><p>§6. The reasons of this are obvious and clear. Even because it is the office of the governors to determine of such circumstances: It is the pastor’s office to guide and oversee the flock. And so the determining of time and place of worship (that’s undetermined) belongs to his office: and the choice of the subject on which he shall preach, the leading them in prayer and praise, and choice of versions, translations and other ordinary helps in his work. And therefore when he determines these, he is but in his own way and does but his own work: and therefore he is therein the judge, if the case be controvertible. If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied. We are sure that God has commanded us to obey them that are over us in the Lord (1 Thess. 5:12; Heb. 13:7, 17, etc.), and therefore a certain duty may not be forborn upon uncertain conjectures, or upon every miscarriage in them that we owe it to. This would unchurch all Churches (as they are political societies). For if pastors be taken down, and the work of pastors, the Church is taken down; and if government and obedience be taken down, then pastors and their work is taken down, which will be the fruit of this disorder.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’</cite>, pp. 461-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

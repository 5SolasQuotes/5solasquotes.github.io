</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ae1b34237" data-kw="">
<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20 | (London, 1610), 4th Sermon, pp. 125-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>Verse 20. ‘And the Lord hearkened to Hezekiah, and healed the people.’ That is, He sanctified them by his Spirit in an extraordinary way; or, He did not punish them, but forgive them that their infirmity, and accepted them as if they had been purified. Verse 22. ‘And Hezekiah spake comfortably to all the Levites, that taught the good knowledge of the Lord.’ That is, he encouraged them in their work, and gave them hope of God’s mercy to the people as concerning those that had eaten the Passover and were not cleansed according to the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Remaining Historical Part of the Old Testament</cite>, ... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Chron. 30, vv. 20 &amp; 22</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Verse 20. ‘And the Lord hearkened to Hezekiah, and healed the people.’ That is, He sanctified them by his Spirit in an extraordinary way; or, He did not punish them, but forgive them that their infirmity, and accepted them as if they had been purified. Verse 22. ‘And Hezekiah spake comfortably to all the Levites, that taught the good knowledge of the Lord.’ That is, he encouraged them in their work, and gave them hope of God’s mercy to the people as concerning those that had eaten the Passover and were not cleansed according to the Law.”

<main class="wrap"><figure class="quote" id="q-be8d7af92f" data-kw="">
<blockquote><p>The Baptists, especially those of the time of the Reformation, do not hold the common doctrine on this subject. The Anabaptists not only spoke in very disparaging terms of the old economy and of the state of the Jews under that dispensation, but it was necessary to their peculiar system, that they should deny that the covenant made with Abraham included the covenant of grace. Baptists hold that infants cannot be church members, and that the sign of such membership cannot properly be administered to any who have not knowledge and faith. But it cannot be denied that infants were included in the covenant made with Abraham, and that they received circumcision, its appointed seal and sign. It is therefore essential to their theory that the Abrahamic covenant should be regarded as a merely national covenant entirely distinct from the covenant of grace. The Romanists assuming that saving grace is communicated through the sacraments, and seeing that the mass of the ancient Israelites, on many occasions at least, were rejected of God, notwithstanding their participation of the sacraments then ordained, were driven to assume a radical difference between the sacraments of the Old Testament and those of the New. The former only signified grace, the latter actually conveyed it. From this it follows that those living before the institution of the Christian sacraments were not actually saved. Their sins were not remitted, but pretermitted, passed over. At death they were not admitted into heaven, but passed into a place and state called the limbus patrum, where they remained in a negative condition until the coming of Christ, who after his death descended to hell, sheol, for their deliverance. In opposition to these different views the common doctrine of the Church has ever been, that the plan of salvation has been the same from the beginning. There is the same promise of deliverance from the evils of the apostasy, the same Redeemer, the same condition required for participation in the blessings of redemption, and the same complete salvation for all who embrace the offers of divine mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.367.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-001aea63ff" data-kw="">
<blockquote><p>Baptism is a seal of the whole covenant of grace; but it is by way of initiation. Hence it belongs to all that are within the covenant or have the first entrance thereinto. And is there no danger of corruption by overstraining the subject of baptism? Certainly, it is a corruption to take from the rule, as well as add to it. Moses found danger in not applying the initiating seal, to such for whom it was appointed. Is there no danger of putting those out of the visible Church, whom our Lord would have kept in?… If we do not keep in the way of a converting, grace-giving covenant, and keep persons under those church dispensations, wherein grace is given, the Church will die of a lingering, though not violent, death. The Lord has not set up churches only that a few old Christians may keep one another warm while they live, and then carry away the Church into the cold grave with them when they die; no, but that they might with all care, and with all the obligations and advantages to that care that may be, nurse up still successively another generation of subjects to our Lord, that may stand up in his kingdom when they are gone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Works of Christ in America</cite>, vol. 2, p. 309</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-85a0b5f475" data-kw="">
<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 435 Latin</span></figcaption>

<blockquote><p>LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.</p></blockquote>

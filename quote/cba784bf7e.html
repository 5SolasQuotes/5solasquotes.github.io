<blockquote><p>According to the Westminster Confession of Faith, Scripture thinks of man as a covenant being. It tells us that man was originally placed on earth under the terms of the covenant of works. It informs us further that man broke this covenant of works and that God was pleased to carry through his aims with the covenant of works by means of the covenant of grace. Thus Scripture may be said to be the written expression of the provisions of God’s covenantal relationship with man. The Confession further sets forth the Protestant doctrine of Scripture under the four heads of its necessity, its authority, its sufficiency and its perspicuity. The necessity of Scripture lies in the fact that man has broken the covenant of works. He therefore needs the grace of God. There is no speech or manifestation of grace in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Apologetics, 2nd ed. (Philiipsburg, NJ: The Presbyterian and Reformed Publishing Company, 2003).</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-762291d26b" data-kw="">
<blockquote><p>How hath the Moral Law been delivered since the Fall? The Sum thereof was comprised in ten Words, (Exod. 34:28; Deut. 4:13.) commonly called the Decalogue or Ten Commandments; solemnly published and engraved in Table of Stone by God himself, (Deut. 4:14 &amp; 10:4.) Afterwards the same was more fully delivered in the Books of Holy Scripture, and so committed to the Church for all Ages, as the Royal Law for Direction of our Obedience to God our King, (James 1:8.) and for the Discovery of Sin, and the Punishment due thereto, Deut. 27:26; Rom. 1:31 &amp; 3:20. What then doth the Law now require of us? All such Duties as were required of Adam in his Innocency, (Levit. 18:5.) and all such as are required since by reason of his Fall, (Deut. 17:2–6.) binding us to eternal Death for our least defect therein. Declare now out of that which hath been said, what the Covenant of Works is? It is a Conditional Covenant between God and Man, whereby on the one side God commandeth the Perfection of Godliness and Righteousness, and promiseth that he will be our God, if we keep all his Commandments; and on the other side, Man bindeth himself to perform intire and perfect Obedience to God’s Law, by that Strength wherewith God hath indued him by the Nature of his first Creation. What was done in this Covenant on God’s part? There was his Law, backed with Promises and Threatnings; and unto them were added outward Seals. What was the Sum of this Law? Do this, and thou shalt live: If thou dost it not, thou shalt die the Death. What is meant by, Do this? Keep all my Commandments in Thought, Word, and Deed. What is meant by Life, promised to those that should keep all the Commandments? The Reward of Blessedness and Everlasting Life, Levit. 18:5; Luk. 10:28. What is meant by Death threatned to those that should transgress? In this World the Curse of God, and Death, with manifold Miseries both of Body and Soul: And (where this Curse is not taken away) Everlasting Death both of Body and Soul in the World to come, Deut. 27:26 &amp; 29:19, 20 &amp; 32:22; Levit. 26; Deut. 28. What were the outward Seals added hereunto? The two Trees, planted by God for that purpose in the midst of the Garden, Gen. 2:9 &amp; 3:3. that Adam before and in the sight of them might resort to some special place to serve God in, and might by the Sight of them be put in mind of those things whereof they were Signs and Seals.</p></blockquote>

</figure><figure class="quote" id="q-20e6ca868f" data-kw="">
<blockquote><p>This obedience of the Son was superior to all the justice of the Law. For Adam also, if he willed, could have remained in the righteousness of the Law. And to the degree that the curse was owed for every sin of the elect, to the same degree he had to fulfill all righteousness without any complaint, not even all the Angels were able to do this. Therefore, this obedience of the Son was not only regarding the righteousness of the Law, such as Adam received in creation, and such as the Law required of him, but also it exceeded the righteousness of all the Angels.</p></blockquote>

</figure><figure class="quote" id="q-30de8ba973" data-kw="">
<blockquote><p>Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 19.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).”

— John Colquhoun, A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 19.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+law+in+its+covenant+form+requires+of+all+who+are+under+it+since+the+fall+perfect+obedience+as+the+condition+of+life+and+full+satisfaction+for+sin+their+own+persons%2C+and+at+the+same+time%2C+upon+the+revelation+and+offer+of+Christ+in+the+gospel+as+Jehovah+Our+Righteousness%2C+commands+them+to+believe+in+Him+as+such%3B+yet+as+is+the+case+in+various+other+instances+of+duty%2C+it+requires+the+one+of+these+only+on+supposition+that+the+other+is+not+performed.+The+law+as+a+covenant+of+works+requires+that+all+who+are+under+it+do+present+to+it+as+the+conditions+of+eternal+life+perfect+obedience+and+complete+satisfaction+for+sin%2C+either+in+their+own+persons+or+in+that+of+a+responsible+surety.+So+long%2C+then%2C+as+a+sinner%2C+unwilling+to+be+convinced+of+his+sin+and+his+want+of+righteousness%2C+cleaves+to+the+law+as+a+covenant+and+refuses+to+accept+and+present+in+the+hand+of+faith+the+spotless+righteousness+of+the+adorable+Surety%2C+that+sinner+continues+%E2%80%9Ca+debtor+to+do+the+whole+law%E2%80%9D+%28Gal.+5%3A3%29.+He+keeps+himself+under+an+obligation+to+do%2C+in+his+own+person%2C+all+that+the+law+in+that+form+requires+and+also+to+suffer+all+that+it+threatens.+The+righteous+law%2C+accordingly%2C+goes+on+to+use+him+as+he+deserves.+It+continues+to+proceed+against+him+without+the+smallest+abatement+of+its+high+demands%2C+requiring+of+him+the+complete+payment+of+his+debt+both+of+perfect+obedience+and+of+infinite+satisfaction+for+his+disobedience.+As+it+accepts+no+obedience+but+that+which+is+absolutely+perfect+or+fully+answerable+to+all+its+demands+%28Gal.+3%3A10%E2%80%9311%29%2C+so+the+acceptance+of+a+man%E2%80%99s+person+as+righteous+according+to+it+will+depend+on+the+acceptance+of+%5BChrist%E2%80%99s%5D+obedience+%28Matt.+5%3A18%3B+Rom.+10%3A5%29.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%

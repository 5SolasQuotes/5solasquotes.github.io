<main class="wrap"><figure class="quote" id="q-a968a6d7ea" data-kw="">
<blockquote><p>The classical and confessional understanding of this principle [the RPW] led the Reformed churches to distinguish between two aspects of worship: elements and circumstances. This distinction was a corollary to the distinction between a substance and an accident. A substance is that which makes a thing what it is. An accident is something that is temporarily connected or related to the substance but such that it can be changed without changing the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Recovering the Reformed Confession (P&amp;R, 2008)</cite>, pp. 229-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-544f7ad273" data-kw="">
<blockquote><p>But as touching these ceremonies in question, we are upon evident grounds persuaded in our consciences that they are both unlawful and inexpedient for our Church: and though they were lawful in themselves, yet we may answer as the oppugners of the Interim [1548] replied to those who urged yielding to the ceremonies of the same (Friedrich Balduin [a Lutheran], On Cases of Conscience, bk. 4, ch. 11, case 3), surplice, holy days, tapers [candles], etc. because of the emperor’s commandment. That the question is not about things indifferent, but about a main article of faith, namely Christian Liberty, which admits not any yoke to be imposed upon the conscience, no not in things indifferent.</p></blockquote>

</figure><figure class="quote" id="q-68dddd2952" data-kw="">
<blockquote><p>The ceremonial law is that which prescribes rites and orders in the outward worship of God. It must be considered in three times. The first is time before the coming death of Christ: the second, the time of publishing the gospel by the apostles: the third, the time after the publishing of the Gospel. In the first, it did bind the consciences of the Jews, and the obedience of it was the true worship of God. But it did not then bind the consciences of the Gentiles, for it was the partition wall between them and the Jews. And it did continue to bind the Jews till the very death and ascension of Christ. For the hand writing of ordinances that was against us was nailed on the cross and cancelled. And when Christ says that the prophets and the law endured till John, Luke 16:16, the meaning is not that the ceremonial law ended then: but that things foretold by the prophets and obscurely prefigured by the law, began then more plainly to be preached and made manifest. The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which, ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy; the apostles after Christ’s ascension, as occasion was offered were present in the Temple, Acts 3:1; And the council of Jerusalem [Acts 15], tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel; ceremonies of the Jews’ Church became unlawful, and so shall continue to the world’s end. By this it appears what a monstrous and miserable religion the Church of Rome teaches and maintains, which stands wholly in ceremonies, partly heathenish and partly Jewish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience... (Cambridge, 1596)</cite>, pp. 19-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-fcd7807f29" data-kw="">
<blockquote><p>6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good. 7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God. 8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times. 9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power. 10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-17b927d42a" data-kw="">
<blockquote><p>The idea from which the reference to “the many” arises, however, is a very different one: Christ did not die for a few but for many, for a large multitude. He gives his life as a ransom for many; he sheds his blood for many; he will make many righteous. It is not a handful but many who by one man’s obedience will be made righteous [Rom. 5:19]. Scripture is not afraid that too many people will be saved. Therefore, based on that same consideration, it says that God has no pleasure in the death of the wicked and that he wants all humans to repent and be saved, that Christ is the expiation of and has given his life for the world, and that the gospel must be preached to all creatures. But when universalists deduce from this that the atonement is completely universal, they run afoul of both Scripture and reality, for the two seem to vie with each other in teaching that not all but only many learn of the gospel and attain genuine repentance. In all these passages, therefore, we are encountering not “the will of God’s good pleasure,” which is unknown to us and neither can nor may be the rule for our conduct, nor an “antecedent will,” which is anterior to the decision of our will and oriented to it, but the “revealed will,” which tells us by what standard we are to conduct ourselves in the new covenant. It gives us the right and lays on us the duty to bring the gospel to all people without exception. For the universal offer of grace we need no other ground than this clearly revealed will of God. We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed—in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice—also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election. In the second place, Scripture implies that the sacrifice and intercession of Christ, hence also the acquisition and application of salvation, are inseparably connected. The sacrifice is the basis for Christ’s intercession; the scope of the latter, accordingly, is as extensive as that of the former. Limborch therefore recognizes that “the intercession is not an act distinct from the sacrifice in and of itself insofar as it [the intercession] is accomplished in heaven.” If then the intercession is particular, as it is (John 17:9, 24; Rom. 8:34; Heb. 7:25; 1 John 2:1–2), so is the sacrifice. Limborch, opposing this position, indeed cites Luke 23:34, but Jesus prays here not for the salvation of his enemies but only for the nonimputation of the appalling crime that they, in their ignorance, were committing when they crucified the Messiah. There is similarly an inseparable connection between the acquisition and the application of salvation. All the benefits of the covenant of grace are linked (Rom. 8:28–34) and find their ground in the death of Christ (Rom. 5:8–11). Atonement in Christ carries with it salvation and blessedness. For Christ is the head and believers are his body, a body that receives its growth from him (Eph. 4:16; Col. 2:19). He is the cornerstone, and we are the building (Eph. 2:20–21). He is the firstborn, and we are his brothers (Rom. 8:29). Believers, accordingly, have objectively died, been crucified, buried, raised, and seated in the heavens with and in him. That is, the church is not an accidental and arbitrary aggregate of individuals that can just as easily be smaller or larger, but forms with him an organic whole that is included in him as the second Adam, just as the whole of humankind arises from the first Adam. The application of salvation must therefore extend just as far as its acquisition. The application is comprehended in it and is its necessary development. This, for that matter, is true in the nature of the case. If Jesus is truly the Savior, he must also really save his people, not potentially but really and in fact, completely and eternally. And this, actually, constitutes the core of the difference between the proponents and the opponents of particular satisfaction (atonement).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, Vol. 3: Sin and Salvation in Christ, trans. John Bolt and John Vriend (Baker Academic, 2006), 466.</span></figcaption>

<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>

<blockquote><p>III. …But what can man do for this? His demerit is infinite (by the previous thesis). But the moral value of human actions is only finite, for the act cannot exceed the dignity of its principle. Moreover, in personal offenses, such as this one, there ought to be order and proportion between the one making satisfaction and the one to whom it is made, but this is far less between God and man than between a king and the vilest slave. IV. …Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here. Hence fall:

1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…</p></blockquote>

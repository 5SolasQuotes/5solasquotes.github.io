<main class="wrap"><figure class="quote" id="q-770c21b336" data-kw="">
<blockquote><p>Our Lord Jesus Christ, since He lived on earth, acquired for Himself the right of dominion over all men but especially His own, and that with His great work of redemption. For, as Lord, He buys His servant with a specified price. In this way our Lord redeemed us not with fallen things, silver, or gold (1 Peter 1:18–19), but with His precious blood, as of a blameless and spotless lamb. And by that deed He became by right, as they say, Lord of all, not only as He was God, but also man. I said that He became Lord by right, because Christ, made humble since He lived on earth, had not yet entered into full possession of His dominion.

But it happened at last when, rising on the third day and afterward ascending into heaven, He sat at the right hand of God the Father. For to sit at the right hand of the Father is nothing else than to enter into that glorious inheritance. In Psalm 110:1 David says, “Jehovah said to my Lord, ‘Sit at my right hand until I arrange your enemies as a stool for your feet.’” In Acts 2:34–36, Peter, reciting this passage and explaining it, says, “Therefore, let the whole household of Israel certainly know He was made Lord and Christ by God, this Jesus, I say, whom you crucified.” Therefore, there Peter interprets that sitting at the right hand of the Father as the dominion and kingship of Christ. And thus it is argued from the one Son of God, the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 2647-2656.</span></figcaption>

</figure><figure class="quote" id="q-dfa6e95631" data-kw="">
<blockquote><p>It is a just feeling that the law should be vindicated. It is right that sin should never pass unnoticed. It is only proper and worthy of a holy God, that your sin should receive its commensurate punishment. But it is a delusion to imagine that a sinner can atone for sin.

It is a delusion to think that twenty days of repentance, or twenty years of amendment, can cancel that sin of which God has declared the proper penalty to be an everlasting death. It is a delusion to suppose that a sinful repentance, sinful tears, sinful prayers, sinful resolutions, can obliterate the smallest sin. But the greatest delusion of all is to think that you are wiser than God, or mightier than the Son of God. But you do think yourself wiser than God when you prefer your plan to his—when you think that it is more for the honour of the law that the sinner should suffer in his own person rather than in the person of a Divine substitute.

And you do think yourself mightier than Immanuel, if you think your work more perfect than his—if you think your repentance magnifies the law more than his obedience did—if you think that his “one offering” has not so perfected his redeemed, but that you must add your own efforts to it—if you think that Christ is not so truly “the end of the law,” not so completely the bearer of its curse, the fulfiller of its demands, the vindicator of its authority, and the embodiment of all its excellence, but that it needs something more than union with Christ to give you an absolute righteousness ([Romans 10] ver. 4).

And if you really saw the law in its majesty, and the work of Christ in its corresponding majesty, you would see that the only way to do the law true honour would be to do as the Gospel directs. Over against the law’s demands set his obedience—over against your sins set his one sacrifice. In other words, take the instant benefit of the righteousness of God, by presenting it to the law as that which is in the highest sense its “end.” Believe in Christ, who is the end of the law, and you are righteous in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-hamilton.html">James Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons why men reject the Righteousness of God in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-da5636a070" data-kw="">
<blockquote><p>That Christ Jesus by His death did bring forth salvation and reconciliation only for the elect (John 15:13; Rom. 8:32–34; 5:11; 3:25), which were those which God the Father gave Him (Job 17:2; 6; 37); and that the gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever-blessed God (Matt. 16:16; Luke 2:26; John 6:9; 7:3; 20:31; 1 John 5:11), filled with the perfection of all heavenly and spiritual excellencies, and that salvation is only and alone to be had through believing in His name.</p></blockquote>

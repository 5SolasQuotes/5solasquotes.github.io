<main class="wrap"><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8850c67c9d" data-kw="">
<blockquote><p>As Calvin and the church in Geneva sang the Apostle’s Creed and yet did not sing man-made hymns (multitudes of which were current in that era, being widely sung by the Lutherans), it is evident that they considered the Creed to be a different element of worship than singing praise to God. Calvin was very familiar, as his writings show, with creeds and the nature of them. Calvin in Geneva evidently thought that it was permissible to sing one’s confession of their faith before God in public worship and yet not to sing man-made praise to God (the two being different). This distinction is confirmed to have been well understood in that general era in that the Synod of Dort (1618), while approving of singing the Creed for the Dutch Church (whose worship practice was very similar to that of Geneva’s), yet condemned singing man-made hymns:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Origin of Reformed Psalmody’ in Songs of Zion</cite>, pp. 179-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-5477c0d736" data-kw="">
<blockquote><p>That as the Jews were wont to shut up the solemnity of the Passover by singing some of David’s Psalms; so our Saviour, after the celebration of the Sacrament of his body and blood, went out with his disciples to the mount of Olives, […] having sung the Hymn, which Hymn (say the best expositors) was the same that the Jews did ordinarily sing after the Passover, and is called by them the great Hallel, which, as Paulus Brugensis says, consisted of six Psalms, from Ps. 113 to Ps. 118, and he adds (verisimile est hos à Domino decantatos) it is most like that these were sung by our Saviour. And Drusius says, hunc hymnum hodieque canunt in nocte Paschatis; The Jews sing this Hymn in the evening of the Passover to this day. The learned Scaliger having largely described the forms and rites of celebrating the Passover, concludes thus; This was the true rite of celebrating the Passover in the times of the Messiah…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer</cite>, [John] Owen concerning that subject (London, 1658), pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

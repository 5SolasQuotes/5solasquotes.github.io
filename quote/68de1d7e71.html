<main class="wrap"><figure class="quote" id="q-68de1d7e71" data-kw="">
<blockquote><p>And it shall be, when you are come in unto the land which the Lord your God gives you for an inheritance, and possess it, and dwell therein; That you shall take of the first of all the fruit of the earth, which you shall bring of your land that the Lord your God gives you, and shall put it in a basket, and shall go unto the place which the Lord your God shall choose to place his name there. And you shall go unto the priest that shall be in those days, and say unto him, ‘I profess this day unto the Lord your God, that I am come unto the country which the Lord swore unto our fathers for to give us.’ And the priest shall take the basket out of your hand, and set it down before the altar of the Lord your God. And you shall speak and say before the Lord your God, ‘A Syrian ready to perish was my father [Jacob], and he went down into Egypt, and sojourned there with a few, and became there a nation, great, mighty, and populous: And the Egyptians evil entreated us, and afflicted us, and laid upon us hard bondage: And when we cried unto the Lord God of our fathers, the Lord heard our voice, and looked on our affliction, and our labor, and our oppression: And the Lord brought us forth out of Egypt with a mighty hand, and with an outstretched arm, and with great terribleness, and with signs, and with wonders: And He has brought us into this place, and has given us this land, even a land that flows with milk and honey. And now, behold, I have brought the firstfruits of the land, which You, O Lord, have given me.’ And you shall set it before the Lord your God, and worship before the Lord your God: And you shall rejoice in every good thing which the Lord your God has given unto you, and unto your house, you, and the Levite, and the stranger that is among you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In all the Bible Deut. 26:1-11 is the only passage where a confession or creed is used in worship. Israel is about to enter the promised land of Canaan after their 40 years in the wilderness. God speaks through Moses and tells them that when they are in the land they are to keep a yearly holiday named the Feast of Firstfruits. They are to take the first ripe portions of their harvest before the Lord’s presence at the tabernacle (and later the temple in Jerusalem) and give it to the Lord. In doing so, before the priest, they are to make a confession remembering their humble beginnings and how the Lord had prospered them. The inspired confession is given to them, word-for-word, by God. The passage reads:</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9b601c8d0" data-kw="">
<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

</figure><figure class="quote" id="q-50c5c02faf" data-kw="">
<blockquote><p>That the [Anglican] Ceremonies are a great hinderance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about… departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple… Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external…</p></blockquote>

<blockquote><p>7th Problem. Whether therefore out of the natural law, as contradistinguished from supernatural, the rule and way of worshipping God is able to be deduced or subsumed under it? Response: I deny. Indeed, in general and indefinitely in what way God is to be worshipped, and negatively, in what way He is not to be worshipped, in many things it is able to be shown from there; but the natural worship of God, positively and in the species, now as modified after the Fall, is not able to be explicitly and definitively subsumed under it or deduced from it, much less instituted worship. This is to be expected, therefore, from supernatural revelation…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“7th Problem. Whether therefore out of the natural law, as contradistinguished from supernatural, the rule and way of worshipping God is able to be deduced or subsumed under it? Response: I deny. Indeed, in general and indefinitely in what way God is to be worshipped, and negatively, in what way He is not to be worshipped, in many things it is able to be shown from there; but the natural worship of God, positively and in the species, now as modified after the Fall, is not able to be explicitly and definitively subsumed under it or deduced from it, much less instituted worship. This is to be expected, therefore, from supernatural revelation…”

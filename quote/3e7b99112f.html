<main class="wrap"><figure class="quote" id="q-3e7b99112f" data-kw="">
<blockquote><p>Scholars have often depicted English Protestant Marriage Doctrine as nearly monolithic in its praise of marriage over celibacy as well as the liberty of all Christians to marry, but the literature actually reveals considerable tension. There was a heightened emphasis on celibacy as an inherently superior state among the spiritual sects and even among conforming churchmen who advocated the vita angelica [angelic life]. However, even though most English Protestants quickly rejected such claims, they still had to square their vigorous support of marriage with the expediency that celibacy afforded for serving God and promoting one’s spiritual welfare. The pragmatic advantages of celibacy could not simply be dismissed since they had clear scriptural support. Furthermore, despite rejecting the bifurcation of Scripture into universal commands and evangelical counsels, English Protestants struggled to develop a new moral system that answered whether Christians were obligated to forsake their liberty to marry if celibacy was more expedient. Both Jesus and Paul had counseled Christians to remain single if they were able. English Protestants navigated around Scripture’s commendation of celibacy by limiting its application to those with the gift of chastity and periods of persecution. They also asserted that Scripture merely counseled or advised celibacy, rather than commanding it. Yet both solutions depended on tenuous assumptions. The first assumption was hermeneutical and depended on the conviction that Scripture’s teaching on marriage in Genesis 1-2 was normative while Paul’s was an exception for certain occasions. The second assumption was that Christians were not obligated to choose the state of life in which they could best devote themselves to God. If either of the two assumptions were challenged, as they already had been with Whately, and especially Ames, then the decision to marry or remain single would be approached much differently; it would no longer concern the Christian’s liberty to choose what was “good” but the Christian’s obligation to choose what was “best.” As it so happened, Baxter explicitly claimed to have been influenced by both Whately and Ames.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed &amp; Celibate Pastor Richard Baxter’s Argument for Clerical Celibacy PhD diss. (Southern Baptist Theological Seminary, 2018) 445 pp.</cite>, p. 108</span></figcaption>

<blockquote><p>Whereas one of them reports that I had said to him, that I thought the marriage of ministers had so great inconveniences, that though necessity made it lawful, yet it was but lawful; that is, to be avoided as far as lawfully we may. I answer that I did say so to him; and I never changed my judgment; yea, my wife lived and died in the same mind. And I here freely advise all ministers that have not some kind of necessity, to think of these few reasons among many… I did not marry till I was silenced and ejected, and had no flock or pastoral cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Breviate of the Life of Margaret</cite>, p. 106</span></figcaption>

</figure><figure class="quote" id="q-4585167369" data-kw="Unity">
<blockquote><p>Since there are various species of union—some in evil, others in good and the truth—that unity only is to be proved which rests upon the truth. Hence unity is to be estimated by faith, not faith by unity. And thus the truth of doctrine, on which all true and saving union is founded, must first be known before the church can be evident.</p></blockquote>

</figure><figure class="quote" id="q-83ea3a3447" data-kw="">
<blockquote><p>11. Forasmuch as that religious adoration given by the Church of Rome to their pretended consecrated Host, has in its public service, and whenever it is carried in procession unto the sick for its sole foundation, this false supposition, that it is by the priest’s consecration properly made the self-same body which was taken out of the womb of the blessed Virgin by the Eternal Son of God, and united unto his Divine Person, unto which belongs, both before and since his incarnation, the empire of glory and religious worship, most strictly and properly so called, and not unto his humanity separated from it: That the Church of Rome neither renders to, nor requires for its consecrated host any other adoration than that of latria; and the professors of our religion are in this point of another faith, believing this host after consecration to be that very self-same insensible and inanimate matter which it was before, and cannot, if they will follow the dictates of their own consciences, and the prime fundamental verities of Christianity, ascribe divine adoration unto a thing which by nature is not God, nor transfer the glory of the Eternal God from Him unto the basest of creatures. This synod therefore does adjure all of them, by that profession they make of serving the Lord in purity and sincerity, and by that irreparable prejudice they do the truth by their rash and inconsiderate oppugning of it; and to their own consciences, which are shamefully betrayed by them; and to their countrymen of the Romish Communion, whom they confirm in their superstitions; and to the weaker Christians among ourselves, whom by such a vile example, utterly unbecoming that worthy Name that is called upbri them, they learn to prevaricate in religion, that they would once again return unto themselves, and mourn bitterly in the Presence of the Great God, and of our Savior Jesus Christ, for that by this sin of theirs they have profaned his glory. And the Synod ordains, that when as the host shall be carried in procession, or to the sick by those of the Romish Church, every one do withdraw himself from the sight of it, that so no scandal may be given unto their neighbors. And whereas some, who do not step out of the way, do feed themselves with this frivolous imagination, that they may tarry and see it, though they do not, as those of the Romish Church, let out their thoughts to a religious adoration of the host; yet if their bodily presence be voluntary at it, it is a kind of approbation of it. And whereas some, out of a sordid, servile spirit, do comply with the received custom in taking off their hats when as the host passes by, which, say they, is not for its sake, or any reverence to it, but only out of respect and honor to the curate or vicar who carries it, or of the persons which accompany it; this is sinful, because they do not conform themselves to their intention whom they pretend to gratify; and they yield only a civil salutation, where the Romish Church ordains religious worship to be paid and performed, bestowing it on another object besides that proposed by her; which acts of theirs are directly contrary to the received maxims of civility among all men, in that they honor, though not as the Church of Rome professes to do, the Lord of Glory, but in his Presence, and to his contempt, a priest, who says he is called to serve Him, and this in that very proper act of worship, yielded by him as he pretends unto his God. Besides, this is contrary to all Christian sincerity, which requires our actious to be true copies and transcripts of our hearts, and not fallacious feignings of that which is not only not in our intentions, but is formally contrary to them, which is a most mischievous trick and abuse put upon those who see and converse with them. Yea lastly, this is contrary to those glorious patterns and examples of the primitive and ancient Christians, who being in no wise able to brook such disguises, did repute and esteem them most sacrilegious impieties, and would rather expose themselves to many deaths, than to swerve from the least tittle of that fidelity and allegiance they had sworn unto God in their baptism. Wherefore this synod ordains that such offenders be strictly and carefully admonished not to persist in this their hypocrisy; for with whatsoever glosses and fine pretexts they may color it over, it is an open mockage and scorn both of God and Man, a grievous scandal unto their brethren, and a mortal wound unto their own consciences. And in case they shall obstinately abide in their impious resolution, then all consistories are enjoined to pursue and prosecute them with all Church-censures, as being persons utterly unworthy of communion with the saints of God. And that none may pretend ignorance of this act, let it be read and notified publicly in all places and congregations where it may be judged needful.</p></blockquote>

y. And the Synod ordains, that when as the host shall be carried in procession, or to the sick by those of the Romish Church, every one do withdraw himself from the sight of it, that so no scandal may be given unto their neighbors. And whereas some, who do not step out of the way, do feed themselves with this frivolous imagination, that they may tarry and see it, though they do not, as those of the Romish Church, let out their thoughts to a religious adoration of the host; yet if their bodily presence be voluntary at it, it is a kind of approbation of it. And whereas some, out of a sordid, servile spirit, do comply with the received custom in taking off their hats when as the host passes by, which, say they, is not for its sake, or any reverence to it, but only out of respect and honor to the curate or vicar who carries it, or of the persons which accompany it; this is sinful, because they do not conform themselves to their intention whom they pretend to gratify; and they yield only a civil salutation, where the Romish Church ordains religious worship to be paid and performed, bestowing it on another object besides that proposed by her; which acts of theirs are directly contrary to the received maxims of civility among all men, in that they honor, though not as the Church of Rome professes to do, the Lord of Glory, but in his Presence, and to his contempt, a priest, who says he is called to serve Him, and this in that very proper act of worship, yielded by him as he pretends unto his God. Besides, this is contrary to all Christian sincerity, which requires our actious to be true copies and transcripts of our hearts, and not fallacious feignings of that which is not only not in our intentions, but is formally contrary to them, which is a most mischievous trick and abuse put upon those who see and converse with them. Yea lastly, this is contrary to those glorious patterns and examples of the primitive and ancient Christians, who being in no wise able to brook such disguises, did repute and esteem them most sacrilegious impieties, and would rather expose themselves to many deaths, than to swerve from the least tittle of that fidelity and allegiance they had sworn unto God in their baptism. Wherefore this synod ordains that such offenders be strictly and carefully admonished not to persist in this their hypocrisy; for with whatsoever glosses and fine pretexts they may color it over, it is an open mockage and scorn both of God and Man, a grievous scandal unto their brethren, and a mortal wound unto their own consciences. And in case they shall obstinately abide in their impious resolution, then all consistories are enjoined to pursue and prosecute them with all Church-censures, as being persons utterly unworthy of communion with the saints of God. And that none may pretend ignorance of this act, let it be read and notified publicly in all places and congregations where it may be judged needful.”

— French Reformed, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 28, of Charenton, 1644-1645, ch. 14, 10. Article of General Matters, pp. 474-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C11.+Forasmuch+as+that+religious+adoration+given+by+the+Church+of+Rome+to+their+pretended+consecrated+Host%2C+has+in+its+public+service%2C+and+whenever+it+is+carried+in+procession+unto+the+sick+for+its+sole+foundation%2C+this+false+supposition%2C+that+it+is+by+the+priest%E2%80%99s+consecration+properly+made+the+self-same+body+which+was+taken+out+of+the+womb+of+the+blessed+Virgin+by+the+Eternal+Son+of+God%2C+and+united+unto+his+Divine+Person%2C+unto+which+belongs%2C+both+before+and+since+his+incarnation%2C+the+empire+of+glory+and+religious+worship%2C+most+strictly+and+properly+so+called%2C+and+not+unto+his+humanity+separated+from+it%3A+That+the+Church+of+Rome+neither+renders+to%2C+nor+requires+for+its+consecrated+host+any+other+adoration+than+that+of+latria%3B+and+the+professors+of+our+religion+are+in+this+point+of+another+faith%2C+believing+this+host+after+consecration+to+be+that+very+self-same+insensible+and+inanimate+matter+which+it+was+before%2C+and+cannot%2C+if+they+will+follow+the+dictates+of+their+own+consciences%2C+and+the+prime+fundamental+verities+of+Christianity%2C+ascribe+divine+adoration+unto+a+thing+which+by+nature+is+not+God%2C+nor+transfer+the+glory+of+the+Eternal+God+from+Him+unto+the+basest+of+creatures.+This+synod+therefore+does+adjure+all+of+them%2C+by+that+profession+they+make+of+serving+the+Lord+in+purity+and+sincerity%2C+and+by+that+irreparable+prejudice+they+do+the+truth+by+their+rash+and+inconsiderate+oppugning+of+it%3B+and+to+their+own+consciences%2C+which+are+shamefully+betrayed+by+them%3B+and+to+their+countrymen+of+the+Romish+Communion%2C+whom+they+confirm+in+their+superstitions%3B+and+to+the+weaker+Christians+among+ourselves%2C+whom+by+such+a+vile+example%2C+utterly+unbecoming+that+worthy+Name+that+is+called+upbri+them%2C+they+learn+to+prevaricate+in+religion%2C+that+they+would+once+again+return+unto+themselves%2C+and+mourn+bitterly+in+the+Presence+of+the+Great+God%2C+and+of+our+Savior+Jesus+Christ%2C+for+that+by+this+sin+of+theirs+they+have+profaned+his+glory.+And+the+Synod+ordains%2C+that+when+as+the+host+shall+be+carried+in+procession%2C+or+to+the+sick+by+those+of+the+Romish+Church%2C+every+one+do+withdraw+himself+from+the+sight+of+it%2C+that+so+no+scandal+may+be+given+unto+their+neighbors.+And+whereas+some%2C+who+do+not+step+out+of+the+way%2C+do+feed+themselves+with+this+frivolous+imagination%2C+that+they+may+tarry+and+see+it%2C+though+they+do+not%2C+as+those+of+the+Romish+Church%2C+let+out+their+thoughts+to+a+religious+adoration+of+the+host%3B+yet+if+their+bodily+presence+be+voluntary+at+it%2C+it+is+a+kind+of+approbation+of+it.+And+whereas+some%2C+out+of+a+sordid%2C+servile+spirit%2C+do+comply+with+the+received+custom+in+taking+off+their+hats+when+as+the+host+passes+by%2C+which%2C+say+they%2C+is+not+for+its+sake%2C+or+any+reverence+to+it%2C+but+only+out+of+respect+and+honor+to+the+curate+or+vicar+who+carries+it%2C+or+of+the+persons+which+accompany+it%3B+this+is+sinful%2C+because+they+do+not+conform+themselves+to+their+intention+whom+they+pretend+to+gratify%3B+and+they+yield+only+a+civil+salutation%2C+where+the+Romish+Church+ordains+religious+worship+to+be+paid+and+performed%2C+bestowing+it+on+another+object+besides+that+proposed+by+her%3B+which+acts+of+theirs+are+directly+contrary+to+the+received+maxims+of+civility+among+all+men%2C+in+that+they+honor%2C+though+not+as+the+Church+of+Rome+professes+to+do%2C+the+Lord+of+Glory%2C+but+in+his+Presence%2C+and+to+his+contempt%2C+a+priest%2C+who+says+he+is+called+to+serve+Him%2C+and+this+in+that+very+proper+act+of+worship%2C+yielded+by+him+as+he+pretends+unto+his+God.+Besides%2C+this+is+contrary+to+all+Christian+sincerity%2C+which+requires+our+actious+to+be+true+copies+and+transcripts+of+our+hearts%2C+and+not+fallacious+feignings+of+that+which+is+not+only+not+in+our+intentions%2C+but+is+formally+contrary+to+them%2C+which+is+a+most+mischievous+trick+and+abuse+put+upon+those+who+see+and+converse+with+them.+Yea+lastly%2C+this+is+contrary+to+those+glorious+patterns+and+examples+of+the+primitive+and+ancient+Christians%2C+who+being+in+no+wise+able+to+brook+such+disguises%2C+did+repute+and+esteem+them+most+sacrilegious+impieties%2C+and+would+rather+expose+themselves+to+many+deaths%2C+than+to+swerve+from+the+least+tittle+of+that+fidelity+and+allegiance+they+had+sworn+unto+God+in+their+baptism.+Wherefore+this+synod+ordains+that+such+offenders+be+strictly+and+carefully+admonished+not+to+persist+in+this+their+hypocrisy%3B+for+with+whatsoever+glosses+and+fine+pretexts+they+may+color+it+over%2C+it+is+an+open+mockage+and+scorn+both+of+God+and+Man%2C+a+grievous+scandal+unto+their+brethren%2C+and+a+mortal+wound+unto+their+own+consciences.+And+in+case+they+shall+obstinately+abide+in+their+impious+resolution%2C+then+all+consistories+are+enjoined+to+pursue+and+prosecute+them+with+all+Church-censures%2C+as+being+persons+utterly+unworthy+of+communion+with+the+saints+of+God.+And+that+none+may+pretend+ignorance+of+this+act%2C+let+it+be+read+and+notified+publicly+in+all+places+and+congregations+where+it+may+be+judged+needful.%E2%80%9D%0A%0A%E2%80%94+French+Reformed%2C+ed.+John+Quick%2CSynodicon+in+Gallia+reformata%2C+or%2C+The+Acts%2C+Decisions%2C+Decrees+%26+Canons+of+those+Famous+National+Councils+of+the+Reformed+Churches+in+France+%28London%3A+Parkhurst%2C+1692%29%2C+Synod+28%2C+of+Charenton%2C+1644-1645%2C+ch.+14%2C+10.+Article+of+General+Matters%2C+pp.+474-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83ea3a3447.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83ea3a3447.html">Permalink</a><a class="src" href="h

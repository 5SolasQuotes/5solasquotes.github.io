<main class="wrap"><figure class="quote" id="q-fbf69b5b7a" data-kw="">
<blockquote><p>It belongs to the magistrates not only to be protectors of the second table of the Law, but also of the first. It belongs to them to cause the Lord God to be honoured and served; not to tolerate idolatry, image‑worship, or any false religion within their jurisdiction, but to root them out; to prevent the Name of God from being dishonoured by cursing, swearing, and blasphemy; to restrain Sabbath‑breaking and punish the offenders.

It belongs to them to ensure that the Gospel is preached everywhere within their territory; that the Church, as the beloved child of the Lord Jesus, be preserved; that no intrusion or trampling from within, nor any oppression from without, disturb or destroy the Church; but that she remain in safe keeping within the privileges granted to her by her King. In all these matters, the magistrates must be active — not formally, as ecclesiastical persons, but objectively. Therefore, we speak of the right of the magistrates not in the Church, but concerning the Church. In or over the Church, there must be no ruling authority whatsoever; there, Jesus alone is King. Everything the magistrates must do is concerning the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ, the Only and Sovereign King over His Church. Proclaimed in a Treatise on Psalm II, verse 6</cite>, (Amsterdam: Johannes Boekholt, 1688), preface. (Translated by Copilot.)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ebbe593af" data-kw="">
<blockquote><p>How can piety but promise to herself a zealous patron of your Highness, being the sole son and heir of so gracious and great a monarch, who is not only the defender of the faith by title, but also a defender of the faith in truth, as the Christian world hath taken notice, by his learned confuting of [Robert] Bellarmine’s overspreading heresies, and his suppressing in the blade of [Conrad] Vorstius’s Athean blasphemies? [1]

And how easy it is for your Highness to equal, if not exceed, all that were before you, in grace and greatness, if you do but set your heart to seek and to serve God, considering how religiously your Highness hath been educated by godly and virtuous governors and tutors; as also that you live in such a time, wherein God’s providence, and the King’s religious care, hath placed over this church, to the unspeakable comfort thereof, another venerable Jehoiada, that doth good in our Israel both towards God and towards his house; of whom your Highness at all times, in all doubts, may learn the sincerity of religion, for the salvation of your inward soul, and the wisest counsel for the direction of your outward state.

And to excite you the rather to the zealous practice of divine piety, often suppose with yourself, that your Highness hears your religious father James speaking unto you, as sometimes holy David spake to his son Solomon: and thou Charles my son know thou the God of thy father, and serve him with a perfect heart, and with a willing mind; for the Lord searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), xxxv-vi.</span></figcaption>

</figure><figure class="quote" id="q-ef2014537d" data-kw="">
<blockquote><p>And so the kingly power in general as given for the good of all human societies in general, is from God the Creator for the good of all societies whither heathen or Christian. So Nebuchadnezzar, Darius, Nero, and Julian were essentially kings, and yet had not their kingly power immediately from the Mediator Christ, except in this general sense that the kingly power is a lawful ordinance of God warranted by the Word of God and Testament of our Testator Jesus Christ, because these are essentially kings and lawful magistrates who either never heard of Christ, nor any thing of God; but only that He is Creator of the world, or then who persecute and hate the name of Jesus Christ… Now Formalists, denying such to be lawful kings, as either know not Christ, or believe not in Him, join hands with Papists, and make way for Anabaptistical anarchy, that a persecuting or an unbelieving king is no king, not to be obeyed, but to be turned out of his throne: And to this meaning, Calvin, Viret and Cartwright teach that the kingly power flows immediately from God the Creator, not from God in the Mediator Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 19, p. 295</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-f2bd2c70c7" data-kw="">
<blockquote><p>In what continual danger are we everywhere of running into extremes! While some, blinded and hardened by sin, never bestow one serious thought about their souls, — insensible of the malady within, they despise the physician and disregard the means of recovery, — there are others who think or at least talk of nothing else but of their disorder, saying how bad they are.

Fruitless complaints, complaints of themselves and of their condition, is the sum and substance of their religion. If they can conjure up doubts respecting themselves, and form desponding complaints of their uncomfortable condition, they fancy that they have done their duty. I have myself known several who have spent a good part of their time in such spiritual gossiping, — I know not what else to call it, in going up and down from one to another with their melancholy complaints and objections. But such conduct is utterly contrary to the life of faith.

Had they spent half this time in pouring out their complaints before the Lord, or employed it in doing good to others, they would have been long ago fat and well liking, thriving daily in holiness, and comfort, life and joy. I say not but that it is good, in our soul’s concerns and spiritual difficulties, to apply to them who are furnished with the tongue of the learned, and who know how to speak a word in season to the weary: but what I say is, that for persons to fill their minds with their own complaints and objections, without endeavouring to mix with faith and practice what is spoken for their relief, and to go on still in their own slothful and obstinate way, that this is of no sort of use or advantage, but I fear of much real hurt to the soul.

And yet some, I am apt to think, may even please themselves in such a course, as if it had somewhat in it of eminency in religion. But can they think to mend their condition by wishing it were better, or by complaining that it is so bad? If they do, they will most assuredly be disappointed. None of us will think so absurdly about worldly things. In such things we readily take an industrious course. The husbandman well knows, that if he be idle and slothful in seed-time, it will be in vain to form any expectations as to the time of harvest. “The sluggard will not sow by reason of cold;” and what return hath he in harvest? He must “beg in harvest and have nothing.” Prov. xx. 4.

So it is in spiritual things. The hand of the diligent alone maketh rich. Tell me how a man employs his time, whether he is slothful or industrious, and I will tell you what progress he makes in grace; for you may as soon gather grapes of thorns or figs of thistles, as enjoy those fruits of the Spirit, — love, joy, and peace, whilst you live after the flesh, in self-indulgence, ease, and sloth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The means to be used for obtaining peace (1782) in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>

— Thomas Charles, The means to be used for obtaining peace (1782) in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+what+continual+danger+are+we+everywhere+of+running+into+extremes%21+While+some%2C+blinded+and+hardened+by+sin%2C+never+bestow+one+serious+thought+about+their+souls%2C+%E2%80%94+insensible+of+the+malady+within%2C+they+despise+the+physician+and+disregard+the+means+of+recovery%2C+%E2%80%94+there+are+others+who+think+or+at+least+talk+of+nothing+else+but+of+their+disorder%2C+saying+how+bad+they+are.%0A%0AFruitless+complaints%2C+complaints+of+themselves+and+of+their+condition%2C+is+the+sum+and+substance+of+their+religion.+If+they+can+conjure+up+doubts+respecting+themselves%2C+and+form+desponding+complaints+of+their+uncomfortable+condition%2C+they+fancy+that+they+have+done+their+duty.+I+have+myself+known+several+who+have+spent+a+good+part+of+their+time+in+such+spiritual+gossiping%2C+%E2%80%94+I+know+not+what+else+to+call+it%2C+in+going+up+and+down+from+one+to+another+with+their+melancholy+complaints+and+objections.+But+such+conduct+is+utterly+contrary+to+the+life+of+faith.%0A%0AHad+they+spent+half+this+time+in+pouring+out+their+complaints+before+the+Lord%2C+or+employed+it+in+doing+good+to+others%2C+they+would+have+been+long+ago+fat+and+well+liking%2C+thriving+daily+in+holiness%2C+and+comfort%2C+life+and+joy.+I+say+not+but+that+it+is+good%2C+in+our+soul%E2%80%99s+concerns+and+spiritual+difficulties%2C+to+apply+to+them+who+are+furnished+with+the+tongue+of+the+learned%2C+and+who+know+how+to+speak+a+word+in+season+to+the+weary%3A+but+what+I+say+is%2C+that+for+persons+to+fill+their+minds+with+their+own+complaints+and+objections%2C+without+endeavouring+to+mix+with+faith+and+practice+what+is+spoken+for+their+relief%2C+and+to+go+on+still+in+their+own+slothful+and+obstinate+way%2C+that+this+is+of+no+sort+of+use+or+advantage%2C+but+I+fear+of+much+real+hurt+to+the+soul.%0A%0AAnd+yet+some%2C+I+am+apt+to+think%2C+may+even+please+themselves+in+such+a+course%2C+as+if+it+had+somewhat+in+it+of+eminency+in+religion.+But+can+they+think+to+mend+their+condition+by+wishing+it+were+better%2C+or+by+complaining+that+it+is+so+bad%3F+If+they+do%2C+they+will+most+assuredly+be+disappointed.+None+of+us+will+think+so+absurdly+about+worldly+things.+In+such+things+we+readily+take+an+industrious+course.+The+husbandman+well+knows%2C+that+if+he+be+idle+and+slothful+in+seed-time%2C+it+will+be+in+vain+to+form+any+expectations+as+to+the+time+of+harvest.+%E2%80%9CThe+sluggard+will+not+sow+by+reason+of+cold%3B%E2%80%9D+and+what+return+hath+he+in+harvest%3F+He+must+%E2%80%9Cbeg+in+harvest+and+have+nothing.%E2%80%9D+Prov.+xx.+4.%0A%0ASo+it+is+in+spiritual+things.+The+hand+of+the+diligent+alone+maketh+rich.+Tell+me+how+a+man+employs+his+time%2C+whether+he+is+slothful+or+industrious%2C+and+I+will+tell+you+what+progress+he+makes+in+grace%3B+for+you+may+as+soon+gather+grapes+of+thorns+or+figs+of+thistles%2C+as+enjoy+those+fruits+of+the+Spirit%2C+%E2%80%94+love%2C+joy%2C+and+peace%2C+whilst+you+live+after+the+flesh%2C+in+self-indulgence%2C+ease%2C+and+sloth.%E2%80%9D%0A%0A%E2%80%94+Thomas+Charles%2C+The+means+to+be+used+for+obtaining+peace+%281782%29+in+Edward+Morgan+%28ed.%29%2C+Essays%2C+Letters%2C+and+Interesting+Papers+of+the+Late+Rev.+Thomas+Charles%2C+A.B.+Bala%2C+Merionethshire&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2bd2c70c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2bd2c70c7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/10/thomas-charles-on-the-folly-of-spiritual-gossip/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-65f336f864" data-kw="">
<blockquote><p>Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent:

1. In that it is a foundation of the other laws, and they are reducible to it.

2. This was to abide always, not the other.

3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.</p></blockquote>

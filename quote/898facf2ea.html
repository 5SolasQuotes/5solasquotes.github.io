<blockquote><p>It is most agreeable to reason, that after six work days, one day should be consecrated to divine worship. The least division of days is into a week, the next greater division is into a month, the next into a year. Now by the light of nature it seems far more reasonable, that one day in seven should be imployed [sic] in God’s service, than one day in a month. And if a seventh part of our time be consecrated unto God, better a seventh day, than a seventh part of every day, because the worldly occupations of each of those days, must needs cause miserable distraction. Thus reason may discourse in probable manner, when God hath gone before us to open a way unto us. Certainly, when God hath once determined the proportion of time, it is so far from being accounted moral, as perpetual, and still to hold, until God himself shall alter it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the morality of the fourth commandment, as still in force to bind Christians. Delivered by way of answer to the translator of Doctor Prideaux his lecture, concerning the doctrine of the Sabbath</cite>, (London, 1641), the preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>1. Some brethren of the Classical [presbytrian] way may possibly object [to joining an accommodated church-association such as Baxter’s], that joining with us in this way may seem to signify a dislike of the resolutions of the [Westminster?] Assembly, or a consent to the undoing of what they have done. Answer: There is no ground for this scruple: For we do not disclaim or condemn the judgment or way of any party, by taking up at present with what all are agreed in. A present forbearance of the use of full Classical government is no rejecting it. We did in this county seek for authority from the parliament many years ago for the establishing of the presbyterian government, and all our endeavors were frustrated. And many brethren that make this objection do preach themselves without the exercise of the presbyterian government. For because they live not in London, Lancashire, Shropshire, where that government was authorized by parliament, therefore they will not use it: And so some of them for many years have forborne all administration of the Lord’s Supper, and others administer it without any exercise of discipline: And may not we as lawfully exercise so much as all are agreed in, as they may forbear all? Objection: But why may not you as well set up the Classical government punctually, as do what you do? Answer: We are not all of one mind; and those of us that are for the Classical government do not think those parts of it which we here omit and forbear to be of so great necessity or moment as for the present use of it to disjoin and divide from all our brethren of a different judgment. We take ourselves bound to do much for the unity and peace of the churches: Besides, being many of us at a loss in several controverted points of discipline, we think the amicable union and association of brethren where all things may be frequently and plainly debated will be the likeliest way to satisfy and rectify us in those controverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer:

1. We desire each church may have a presbytery, and then we are agreed.

2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice?

3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?</p></blockquote>

<blockquote><p>The devil is a bewitcher who deceives and ensnares the minds of people by his spells and delusions, which seem to shine with what is right and good, so that they will accept false doctrine in the place of sound teaching, false worship instead of true worship, wrong interpretations of words instead of true ones, false ways of justification for true ones. False teachers are also bewitchers who under the guidance of Satan and the pretext and appearance of true godliness deceive and ensnare the minds of people in the same way. False doctrine is bewitching doctrine, which appears in the guise of the truth, and so on.

Faced with these bewitching and subtle deceptions stirred up by the tricks of the devil, we need the greatest Christian wisdom, because otherwise it is very easy to be misled by them. Just look at the papacy, which has arisen by means of such bewitching and subtle deceptions and has now spread all over the place. Moreover, since the devil and false teachers operate by means of enchantments and delusions under the guise and appearance of true godliness, nothing could be easier than to be led astray by them. Heretics always use the Bible and Scripture to deceive people by distorting the true meaning, understanding and judgment of spiritual things.</p></blockquote>

Faced with these bewitching and subtle deceptions stirred up by the tricks of the devil, we need the greatest Christian wisdom, because otherwise it is very easy to be misled by them. Just look at the papacy, which has arisen by means of such bewitching and subtle deceptions and has now spread all over the place. Moreover, since the devil and false teachers operate by means of enchantments and delusions under the guise and appearance of true godliness, nothing could be easier than to be led astray by them. Heretics always use the Bible and Scripture to deceive people by distorting the true meaning, understanding and judgment of spiritual things.”

— Erasmus Sarcerius, In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 86.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+devil+is+a+bewitcher+who+deceives+and+ensnares+the+minds+of+people+by+his+spells+and+delusions%2C+which+seem+to+shine+with+what+is+right+and+good%2C+so+that+they+will+accept+false+doctrine+in+the+place+of+sound+teaching%2C+false+worship+instead+of+true+worship%2C+wrong+interpretations+of+words+instead+of+true+ones%2C+false+ways+of+justification+for+true+ones.+False+teachers+are+also+bewitchers+who+under+the+guidance+of+Satan+and+the+pretext+and+appearance+of+true+godliness+deceive+and+ensnare+the+minds+of+people+in+the+same+way.+False+doctrine+is+bewitching+doctrine%2C+which+appears+in+the+guise+of+the+truth%2C+and+so+on.%0A%0AFaced+with+these+bewitching+and+subtle+deceptions+stirred+up+by+the+tricks+of+the+devil%2C+we+need+the+greatest+Christian+wisdom%2C+because+otherwise+it+is+very+easy+to+be+misled+by+them.+Just+look+at+the+papacy%2C+which+has+arisen+by+means+of+such+bewitching+and+subtle+deceptions+and+has+now+spread+all+over+the+place.+Moreover%2C+since+the+devil+and+false+teachers+operate+by+means+of+enchantments+and+delusions+under+the+guise+and+appearance+of+true+godliness%2C+nothing+could+be+easier+than+to+be+led+astray+by+them.+Heretics+always+use+the+Bible+and+Scripture+to+deceive+people+by+distorting+the+true+meaning%2C+understanding+and+judgment+of+spiritual+things.%E2%80%9D%0A%0A%E2%80%94+Erasmus+Sarcerius%2C+In+Epistolas+Divi+Pauli+ad+Galatas+et+Ephesios+Annotationes%2C+%28Frankfurt%2C+1542%29.+Quoted+in+Gerald+L.+Bray%2C+Timothy+F.+George%2C+Scott+M.+Manetsch+%28eds%29%2C+Reformation+Commentary+on+Scripture+X%3A+Galatians%2C+Ephesians+%28Downers+Grove+IL%3A+IVP+Academic%2C+2011%29%2C+p.+86.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1724005e8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1724005e8a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/05/25/erasmus-sarcerius-on-the-devils-bewitching-influence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-cf0ff331ae" data-kw="">
<blockquote><p>It’s also the common and continual complaint of those of the Reformed Religion, that their accusation is never proposed but mangled, and counterfeit, that their faith is represented by its enemies, out of its natural shape. That their Adversaries in their disputations against them, doe but quarrel with their own fictions, and combat with puppets of their own making. That they represent some prints, and lineaments of our doctrine, but not in their true decency, and proportion, like certain looking-glasses which representing the visage misshapen, yet after a sort preserve something of the hue and complexion.

So they having under taken as they say to paint our deformities yet they will not suffer any one to look us in the face. What may be thought of the cunning, or ingenuity of that Painter which would have us judge of his picture without comparing it to the original? They cite, and read our books in the chair, as the false accusers of Christ, with their cavilling sophistry, alleged his words to a contrary sense. But if they deal fairly, and say no more then what is true, why give they not their people leave to look, and consider at their leisure whether matters are so or no? Why is the mere curiosity of reading, and hearing our works accounted a sin?

What a wild contradiction, what a strange confusion is this, to cite our books and forbid the reading of them? But the natural laziness of men maketh this both excusable, &amp; plausible. For to refer the people to our writings seemeth unto them, a token of assurance in their Doctor, this assurance, or rather boldness serveth them also for a note of conscionable dealing, and withal the prohibition of troubling themselves about this matter, easeth them of a labour.

They are glad to hear our books cited, that they may not seem so unreasonable, as to condemn us upon other men’s words; they are as glad to be forbid to examine the citations, that they may be discharged of such a trouble. So the lazy merchant relyeth upon his factor, and the unworthy Councillor upon his clerk, so long as the one looketh now and then to some accounts, the other to an extract of the process, but carelessly, hand over head: and both of them say, the one of his factor, the other of his clerk, that they are sufficient, and conscionable men made both for their Master’s profit, and ease, they willingly persuade themselves so, that they may sleep the quietlier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An examination of those plausible appearances which seem most to commend the Romish Church, and to prejudice the Reformed. Discovering them to be but mere shifts, purposely invented, to hinder an exact trial of doctrine by the Scriptures</cite>, trans. William Pinke (Oxford: Edward Forrest, 1626), pp 18-19.</span></figcaption>

</figure><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 300-301</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c8481f8c6b" data-kw="">
<blockquote><p>…therefore if men do, nay ought to loose the ox to the water, much more might He loose the daughter of God from her infirmity of soul and body. And He does not so much dispute what He might do, as show what everyone ought to do: For if it were a breach of the Sabbath to neglect any duty to the other creatures, than much more to withdraw our hand from our brethren, when they do stand in need of our help.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4d15f33f96" data-kw="">
<blockquote><p>But mark what a cure God in wisdom and mercy has provided for us: As it is but one day in seven which is thus to be wholly employed with God, and as much of this day is taken up with the bodily necessaries aforesaid, so for the rest, God appoints us variety of exercises, that when we are weary of one, another may be our recreation. When we have heard we must pray, and when we have prayed we must hear again: We must read, we must sing and speak God’s praises, we must celebrate the memorial of Christ’s death in the sacrament; we must meditate; we must confer, we must instruct our families: and we have variety of subjects for each of these. As a student that is weary has variety of books and studies to recreate his mind, so has every Christian variety of holy employment on the Lord’s day. And all of it [is] excellent profitable and delightful!</p></blockquote>

<blockquote><p>To this some do answer in the evening and some in the morning. My answer is this, that the Sabbath of the New Testament amongst us is to begin in the morning, and so to continue till the next morrow, and not in the evening, till the [next] evening. The reasons be these: 1. The Sabbath is to begin when other ordinary days begin, according to the order and account of the Church wherein we live. 2. It was the practice of Christ and the apostles. For Christ (as it has been thought of ancient times) consecrated the Sabbath, in that He rose from the dead early in the morning when the first day of the week began to dawn, Mt. 28:1; and therefore it is fit that the Sabbath Day should then begin when He rose, forasmuch as it is kept in remembrance of his resurrection. The same was the practice of the apostles. For Acts 20:7, the first day of the week the Jews came together at Troas in the morning, and there Paul preached from that time till midnight, being the next morning to depart, having stayed there as is plain out of the 6th verse, seven days. In that text I note two things: First, that the night there mentioned was a part of the seventh day of Paul’s abode at Troas. For if it were not so then he had stayed at least a night longer, and so more than seven days, because he should have stayed part of another day. Secondly, that this night was a part of the Sabbath which they then kept. For the apostle keeps it in manner of a Sabbath in the exercises of piety and divine worship, and namely in preaching. Yea, further he continues there till the rest was fully ended: He communed with them till the dawning of the day, and so departed, verse 11. Besides this text, David says in his Psalm of the Sabbath that he will declare Gods loving kindness in the morning and his truth in the night, Ps. 92:2, making the night following [the morning] a part of the Sabbath. Against this doctrine it is alleged, first, that the Sabbath is to begin in the evening, because in the first [chapter] of Genesis it is said six several times, ‘the evening and the morning made’ the first day, and so the second, and third, etc. Answer: First, in that text when it is said ‘the evening and the morning made’ such and such days, by the ‘evening’ is understood [on that view] the night and by the ‘morning’ the day, and [but] the evening was the end of the day, and the morning the end of the night. This [latter] exposition is ancient, and yet in Scripture we find not one place where the evening is put for the night. Secondly, I answer that the collection from that place is of no force. For thus the reason must needs be framed: That which God did in [the] appointing of days, the same must we do in using of them. But God in appointing of days began the day at the evening. Therefore, etc. The consequent is false. For the case is otherwise in the constitution of time than it is in the use of time constituted: and there is not the same reason of things in doing as there is of the same things in being and use. Thirdly, this did not bind the Jews. For they in all likelihood began their Sabbaths in the morning. Indeed their solemn feasts, as the Passover and such like, began and were kept from evening to morning, as we may read [in] Lev. 23:5. But their ordinary Sabbath was kept from morning to morning. Whence it is that St. Matthew calls the dawning of the first day of the week the end of the Sabbath of the Jews, Mt. 28:1, and there is nothing (I take it) that can be brought to the contrary. It is objected that Moses says, Lev. 23:32, ‘From even to even shall ye celebrate your Sabbath.’ Answer: The words must be understood of the feast of reconciliation [Atonement], being the tenth day of the seventh month, which was solemnized and kept from even to even. And it is called a ‘sabbath’ because it was by special commandement appointed to be kept as the Sabbath Day, and that in two respects: First because it was to be kept holy by the Jews in humbling themselves and offering sacrifices, verse 27. Secondly, because upon that day it was not lawful to do any servile work upon pain of death, verses 25 &amp; 30. Again, it is alleged that Joseph of Arimathea could not embalm Christ by reason that the Sabbath was at hand, and this was the evening. I answer: That the Jews’ Sabbath there meant concurred with the day of their Passover, and hence it was that their Sabbath began in the evening. By this that has been said the answer… is plain, to wit, that in the New Testament the Sabbath is to begin at the morning, and so to continue to the next morning, and not as some suppose to begin at the even and continue till the next even.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘When does the Sabbath Begin?’ in Cases of Conscience</cite>, (d. 1602; Cambridge, 1606), bk. 2, ch. 16, pp. 465-68</span></figcaption>

he+will+declare+Gods+loving+kindness+in+the+morning+and+his+truth+in+the+night%2C+Ps.+92%3A2%2C+making+the+night+following+%5Bthe+morning%5D+a+part+of+the+Sabbath.+Against+this+doctrine+it+is+alleged%2C+first%2C+that+the+Sabbath+is+to+begin+in+the+evening%2C+because+in+the+first+%5Bchapter%5D+of+Genesis+it+is+said+six+several+times%2C+%E2%80%98the+evening+and+the+morning+made%E2%80%99+the+first+day%2C+and+so+the+second%2C+and+third%2C+etc.+Answer%3A+First%2C+in+that+text+when+it+is+said+%E2%80%98the+evening+and+the+morning+made%E2%80%99+such+and+such+days%2C+by+the+%E2%80%98evening%E2%80%99+is+understood+%5Bon+that+view%5D+the+night+and+by+the+%E2%80%98morning%E2%80%99+the+day%2C+and+%5Bbut%5D+the+evening+was+the+end+of+the+day%2C+and+the+morning+the+end+of+the+night.+This+%5Blatter%5D+exposition+is+ancient%2C+and+yet+in+Scripture+we+find+not+one+place+where+the+evening+is+put+for+the+night.+Secondly%2C+I+answer+that+the+collection+from+that+place+is+of+no+force.+For+thus+the+reason+must+needs+be+framed%3A+That+which+God+did+in+%5Bthe%5D+appointing+of+days%2C+the+same+must+we+do+in+using+of+them.+But+God+in+appointing+of+days+began+the+day+at+the+evening.+Therefore%2C+etc.+The+consequent+is+false.+For+the+case+is+otherwise+in+the+constitution+of+time+than+it+is+in+the+use+of+time+constituted%3A+and+there+is+not+the+same+reason+of+things+in+doing+as+there+is+of+the+same+things+in+being+and+use.+Thirdly%2C+this+did+not+bind+the+Jews.+For+they+in+all+likelihood+began+their+Sabbaths+in+the+morning.+Indeed+their+solemn+feasts%2C+as+the+Passover+and+such+like%2C+began+and+were+kept+from+evening+to+morning%2C+as+we+may+read+%5Bin%5D+Lev.+23%3A5.+But+their+ordinary+Sabbath+was+kept+from+morning+to+morning.+Whence+it+is+that+St.+Matthew+calls+the+dawning+of+the+first+day+of+the+week+the+end+of+the+Sabbath+of+the+Jews%2C+Mt.+28%3A1%2C+and+there+is+nothing+%28I+take+it%29+that+can+be+brought+to+the+contrary.+It+is+objected+that+Moses+says%2C+Lev.+23%3A32%2C+%E2%80%98From+even+to+even+shall+ye+celebrate+your+Sabbath.%E2%80%99+Answer%3A+The+words+must+be+understood+of+the+feast+of+reconciliation+%5BAtonement%5D%2C+being+the+tenth+day+of+the+seventh+month%2C+which+was+solemnized+and+kept+from+even+to+even.+And+it+is+called+a+%E2%80%98sabbath%E2%80%99+because+it+was+by+special+commandement+appointed+to+be+kept+as+the+Sabbath+Day%2C+and+that+in+two+respects%3A+First+because+it+was+to+be+kept+holy+by+the+Jews+in+humbling+themselves+and+offering+sacrifices%2C+verse+27.+Secondly%2C+because+upon+that+day+it+was+not+lawful+to+do+any+servile+work+upon+pain+of+death%2C+verses+25+%26+30.+Again%2C+it+is+alleged+that+Joseph+of+Arimathea+could+not+embalm+Christ+by+reason+that+the+Sabbath+was+at+hand%2C+and+this+was+the+evening.+I+answer%3A+That+the+Jews%E2%80%99+Sabbath+there+meant+concurred+with+the+day+of+their+Passover%2C+and+hence+it+was+that+their+Sabbath+began+in+the+evening.+By+this+that+has+been+said+the+answer%E2%80%A6+is+plain%2C+to+wit%2C+that+in+the+New+Testament+the+Sabbath+is+to+begin+at+the+morning%2C+and+so+to+continue+to+the+next+morning%2C+and+not+as+some+suppose+to+begin+at+the+even+and+continue+till+the+next+even.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98When+does+the+Sabbath+Begin%3F%E2%80%99+in+Cases+of+Conscience+%28d.+1602%3B+Cambridge%2C+1606%29%2C+bk.+2%2C+ch.+16%2C+pp.+465-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb2ebabbc1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb2ebabbc1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-day/when-does-the-lords-day-begin/#:~:text=To%20this%20some%20do%20answer%20in,and%20continue%20till%20the%20next%20even&amp;text=To%20this%20some%20do%20answer%20in%20the%20evening&amp;text=the%20even%20and%20continue%20till%20the%20next%20even" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7dfb04dafa" data-kw="">
<blockquote><p>Yet 2. we assert, That by this rest all sort of actions are not condemned, but only such as are inconsistent with the end and scope of this command; as by other Scriptures, and the practice of Christ and the Saints is clear: we conceive therefore these to be permitted: … 5. Works of necessity, such as… much more preparing honestly sober allowance for the sustaining of the body, as the disciples plucked the ears of corn, Mt. 12, and the Jews, Ex. 16:23, dressed the manna on the Sabbath, though they were not to gather it, yet on the sixth day to bake and seethe a part, and to keep a part till the morrow, but not till the day following, and therefore they behoved to dress it also; yea, Jesus Christ went Himself to a feast on the Sabbath, Lk. 14 (that He might take that opportunity by his spiritual discourse to edify the company as He did notably) which He would not have done had it been unlawful to dress any meat on the Sabbath, yet his carriage was such at that feast most remarkably, that it would be followed as a pattern by such as may be invited by others to eat with them, and shall be disposed to go on the Sabbath: And if this were the design of the inviters and invited, men’s eating together on that day would not readily prejudice the sanctification of it, as very often it does… 6. Works of comliness, tending to honest or decent walking, as putting on of clothes honestly, making the house clean from any uncleanness that may fall in it throughout the Sabbath, etc. By all which believers have allowance, 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord hath not streightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will He have their consciences to be festered with inextricable scruples: He leaves it to men on other days, how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but men would look, 1 to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>

<blockquote><p>…the great rule of Gospel administrations is that all things be done to edification. This is the main end of the ministry itself, in all the duties thereof, that are purely evangelical. For this end was the office of the ministry instituted, for this end are ministerial gifts dispensed, for this end were the sacraments appointed, and all Church assemblies, Church power, and whatever else belongs to Churches; it is all ordained for this end that the Body of Christ may be edified and increased with the increase of God, Eph. 4:7-15; Col. 2:19; Acts 9:31; Rom. 14:15, 19; 1 Cor. 10:23; ch. 14:3-5; 12:26; 2 Cor. 12:19; 1 Tim. 1:4. The full and adaequate rule of all Church-order and duties is that all things be done to edification. It does not hence ensue that whatever men shall judge to conduce to edification, may be used by themselves or imposed on others in the worship of God. Christ Himself, the onely wise and competent Judge in such cases…</p></blockquote>

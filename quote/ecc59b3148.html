<blockquote><p>Neo. I pray you, sir, then proceed to the negative part, and tell us what the Lord forbiddeth in this [second] commandment.

Evan. Well then, I pray you understand, that in this commandment is forbidden, neglecting of prayer, as you may see, (Psa 14:4). And so also is absenting ourselves from the hearing of the word preached, or any other ordinance of God, when the Lord calls us thereunto, as you may see, (Luke 14:18-20). And so also is our rejecting the sacrament of baptism, as you may see, (Luke 7:30). And so also is our slighting the sacrament of the Lord’s Supper, as you may see, (2 Chron 30:10). And so also is the slighting and omitting any of the other forenamed duties, as you may see, (Psa 10:4, John 3:31, Isa 22:12-14). And so also is praying to saints and angels, as you may see, (Isa 63:16, Rev 19:10).

And so also is the making of images for religious uses, as you may see, (Lev 19:4). And so also is the representing God by an image, as you may see, (Exo 32:8,9). And so also are all carnal imaginations of God in his worship, as you may see, (Acts 17:29). And so also is all will worship, or the worshipping of God according to our own fancy, as you may see, (1 Sam 9:10,13, Col 2:23). And thus have I shown unto you both what the Lord requireth, and what he forbiddeth in this commandment, and now, neighbour Nomologista, I pray you, tell me whether you keep it perfectly or no?</p></blockquote>

squotes.github.io%2Fquote%2Fecc59b3148.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ecc59b3148.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/17/edward-fisher-on-the-negative-aspect-of-the-second-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Doctrine IV. Want of power to do more, shall not mar the acceptance of what is done from a willing mind according to power. In that case, God will accept of his people’s will for the deed. Here I shall shew,

I. In what particular cases God accepts his people’s will for the deed. II. Why he does so. III. Apply. I. I am to shew in what particular cases God accepts his people’s will for the deed.

1. Where there is a sincere will to serve him in a piece of work, requiring some external abilities which are wanting. If it be hindered only by such want, the will is accepted. The disciples would fain have watched more, but the weak body could not bear up with their mind; and Christ kindly takes notice of it; Matth. xxvi. 41, “Watch and pray, that ye enter not into temptation; the Spirit indeed is willing, but the flesh is weak.” Sometimes Satan makes a rack here to God’s children; such a duty they would do, but bodily strength will not answer, and here upon they are disquieted; but that is from Satan, and their own weakness; for God does not require that external duty from us, that we have no bodily strength for. That is a sweet word, 1 Cor. vi. 13, “The body is—for the Lord, and the Lord for the body.” Peter would fain have given to the poor man, but had it not, and it was accepted in the will, Acts iii. 6.

2. When doing the best we can through grace, our work after all is attended with many blemishes; the Lord will not reject it for these blemishes, but accepts the will to do better for the deed, Cant. v. 1. There is a broad cover of Christ’s righteousness cast over the believer’s spots, that they appear not, Cant. iv. 7; and the Lord accepts of the will to that perfection they would be at.

3. Going as far as we have access in a work, but meeting with a providential stop, the will to complete it is accepted for the deed, as if it had been fully done, as in the case of Abraham’s offering up Isaac, Heb. xi. 17. There is a great difference betwixt the stops men make in these, and those which God makes; the former argues an unwilling mind, but the latter not so.

4. Services that one really desires, and fain would perform for God, but have not opportunity; the will to them is accepted for the deed, as in the case of David’s purposing to build a house for the Lord, 2 Chron. vi. 8; and the Philippians care about supplying Paul’s wants, Philip, iv. 10. Some have opportunities of usefulness, but slight them; that is their sin; others may have a heart to be so and so useful, but they cannot have the opportunity; this God accepts.

5. Lastly, In services performed with a real desire of success for God’s honour and men’s good; the Lord accepts the good will to the success denied, as if it had succeeded according to their wish, Isa. xlix.4; 2 Cor. ii. 15. The want of success may mar their present comfort, but neither the acceptance nor reward.

II. Why does God accept such will for the deed?

1. The sincere will to a work is present, which God mainly regards. The person sincerely aims at doing such a piece of service for God, but not attaining what he really desires, his good will thereto being present before the Lord, it is accepted, as if the work had been done.

2. We have a merciful High Priest to present that will for acceptance, notwithstanding all the weaknesses, blemishes, providential hindrances, want of opportunity, and failure of success, that it may be attended with, Heb. iv. 15, 16.

3. We have a merciful Father to deal with, Psalm ciii. 13, 14, who pities the weaknesses and infirmities of his people, and graciously accepts of their upright designs to serve and honour him.

Use 1. If the Lord accepts the will for the deed in his own people, then men must answer for the ill they had a will to have done, as if they had done it, Numb. xiv. 42—45. A will and intention to do an evil action, though it be not actually done, is in God’s account the same thing with doing it, and will be resented and punished accordingly.

2. God is a gracious master to his servants, taking kindly off their hands through Christ their sincere will to his service, giving them ample testimonies of his regard in all circumstances, and be¬ stowing upon them the special comforts of his grace here, as pledges of the full reward laid up for them inglory hereafter.</p></blockquote>

<blockquote><p>To a reader, therefore, that is lately entered, we think forty marks, or more or less, as the parishioners and reader can agree, sufficient: providing that he teach the children of the parish, which he must do, besides the reading of the common prayers, and books of the New and Old Testaments. If from reading he begins to exhort, and explain the scriptures, then ought his stipend to be augmented; till finally he comes to the honour of a minister.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“To a reader, therefore, that is lately entered, we think forty marks, or more or less, as the parishioners and reader can agree, sufficient: providing that he teach the children of the parish, which he must do, besides the reading of the common prayers, and books of the New and Old Testaments. If from reading he begins to exhort, and explain the scriptures, then ought his stipend to be augmented; till finally he comes to the honour of a minister.”

</figure><figure class="quote" id="q-77aab1002f" data-kw="">
<blockquote><p>Reflection is also needful to preserve the sabbath disposition and blessing. First, this consists in reflecting upon how the day was spent publicly and privately, and upon the sins which one has committed; that is, laxity, listlessness, lack of spirituality, and the failure to abhor these. Confess this with sorrow before the Lord, and seek forgiveness through Christ.

Secondly, it consists in reflecting upon the good we have performed on this day, upon the upright objective to hallow the sabbath, and the efforts to do everything in such a manner as is pleasing to God. It furthermore consists in reflecting upon the blessings, refreshments, comforts, illumination, and quickening we enjoyed from the Spirit of the Lord. One must acknowledge this and rejoice in this, even if it were ever so little. Even if the insatiable desire of our soul has not been satisfied, we should yet thank the Lord for the good we received.

Thirdly, it consists in the acknowledgement of God‘s goodness to His church in giving her the sabbath, enabling her to gather publicly and conduct all her public worship services, and for the privilege to enjoy a holy rest.

Fourthly, it consists in yearning and longing for the rest which remains for the people of God (Heb 4:9), in rejoicing in this hope, in forgetting those things which are behind, and reaching forth unto those things which are before, pressing toward the mark for the prize of the high calling of God in Christ Jesus. Blessed is he who thus begins, observes, and ends the sabbath.</p></blockquote>

</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

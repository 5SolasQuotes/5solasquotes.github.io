<main class="wrap"><figure class="quote" id="q-26f5f30b35" data-kw="">
<blockquote><p>Nor do we say that any such previous action [to regeneration] can be performed by the creature ut de merito congrui teneatur Gratiam dare [so that it binds by congruent merit to give grace], that God is bound for the desert of any such previous action to give his inward and regenerating quickening grace: But yet this we say, that in the church of God, where men are daily stirred up by the Word and Spirit to repent and believe savingly, God will give (though not for any of these previous or dispository actions, yet) freely, regenerating grace to all such as are capable of it, unless they have resisted the Spirit of God in the preceding operations and rejected his quickening grace; but yet we deny, that any man can perform these actions so but he will offend and resist the Spirit of God in them: Now why when as all resist, God should reject some, as they have rejected Him, and leave them to the hardness of their own hearts, and work irresistibly on others who have resisted their God as much, and break open their hearts, though locked and barred against Him, and fill them with quickening grace, and pull a Lot out of Sodom by force, and draw a soul out of the wilderness by head and shoulders, I say, why He should do it, when two are grinding at the same mill, take one and leave the other… I will conclude with Dr. Davenant, is Sacrum Misterium divinae voluntati reliquendum, ‘a sacred and secret mystery to be left to the divine pleasure,’ and the reason lies in the agent’s own breast; It is because He will have mercy upon whom He will have mercy, and whom He wills He hardens; God is his own reason, and his free grace its own cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons</cite>, … (London: 1646), p. 26</span></figcaption>

<blockquote><p>III. But they [Arminians] do unwisely prove that which is not in controversy. For we do not teach, we do not acknowledge that irresistibility which they attribute to us. This conclusion therefore does not hurt us, who do willingly confess that the Holy Ghost does not always so work in men’s hearts that He takes away all resistance… the question is, whether it may be that they may never be converted, and may finally resist the spirit of adoption. To the proving of this, the places which speaks of reprobates, which we confess do finally resist God calling, and do want the spirit of adoption, are plainly besides the purpose. Finally, these sectaries do not prove that in all these places [of Scripture] it is spoken of a final resistance, of which alone it is spoken here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1635), pp. 478-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-74b4201285" data-kw="">
<blockquote><p>First, whether may a wicked man, a man as yet not called, be able to resist and keep off his own call? And that you may understand the answer hereto, I must lay down this distinction: that there is a twofold calling of Christ: a significative calling, and an operative calling. First, a significative calling, which is such a calling whereby Christ, in the ministry of the Word, signifies and declares what He would have men to do. Now this kind of call wicked men may resist; this call, I say, and this revealed will of God, in declaring what graces he would have men act, and what sins he would have men forbear. Therefore we read, Acts 7:51, “You stiff-necked people, and uncircumcised in heart and ears, you have always resisted the Holy Ghost”; meaning the preaching of the Word by the ministry of his apostles. So Prov. 1:24, ‘I have called, and ye have refused,’ etc. But then secondly, there is an operative calling, and that is such a call whereby God does not only signify to a man what he must do, but with the signification of his will gives a man a power to do what He calls him to do, accompanying the Word with his Spirit, making the heart stoop and yield to Jesus Christ. Now this call no man can resist; grace is irresistible; and this effectual calling, by the operation of the Spirit, a man cannot resist. All the gainsayings of the heart, and all the stoutness of the will, it must stoop and must be brought under subjection to Jesus Christ. Jn. 6:37, ‘All that the Father hath given Me,’ says Christ, ‘shall come unto Me.’ They shall not be able to withstand Jesus Christ, but they shall come in unto Him. So Isa. 55:10–11: ‘As the rain comes down, and the snow from heaven, and returns not thither again, but waters the earth, to make it bring forth… so shall my word be that goes out of my mouth; it shall not return in vain, but shall accomplish that which I intended, and it shall prosper in the thing whereto I sent it.’ As all the world cannot hinder the rain from coming down on the earth, no more can any man in the world, if God has an intent to convert and call him, hinder the benefit of the Word from redounding upon his soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Effectual Calling &amp; Election</cite>, ... (London: Rothwell, 1653), Sermon 5, on 2 Pet. 1:10, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-05567d1ee7" data-kw="">
<blockquote><p>When God ‘foreordains’ a sinner ‘to everlasting death,’ He decides to leave him in the sin which deserves everlasting death and results in it. The non-elect sinner has experienced the operation of common grace. It is an error to say that God shows no kind or degree of mercy to the non-elect. But he has resisted and defeated it. God decides to proceed no further with him by the bestowment of that special grace which regenerates, and ‘makes willing in the day of God’s power.’ The elect sinner has also experienced, resisted, and defeated common grace. God decides to proceed further with him, by effectual calling and regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 3, pp. 19-20</span></figcaption>

<blockquote><p>3… But more especially the Holy Ghost is compared to a wind in respect of its irresistable workings; as nothing can resist the wind, it goes and blows which way soever it will; so nothing can resist the Spirit of God, wheresoever it has a purpose to work efficaciously; I will not say, but the heart of a man may resist and reject the work of the Spirit in some measure, and in some degrees; Stephen told the Jews, they had always resisted the Holy Ghost (Act. 7:51); and the apostle tells of strong holds, and of every high thing that exalts itself against God (2 Cor. 10:5); so there is a natural contrariety, a constant enmity and active resisting of God’s Spirit by our spirits; we must therefore distinguish between a prevalent and a gradual resisting; the Spirit in conversion so works that He takes away the prevalent, but not the gradual resisting; A man before he be converted is froward, and full of cavils and prejudices; he is unwilling to be saved; he cannot abide the truth; he does what he can to stifle all good motions: yet if he belong to the election of grace, God will at last over-master his heart and make him of unwilling, willing; He will omnipotently bow and change the will and work on his soul by his mighty power efficaciously, insuperably and irresistably.</p></blockquote>

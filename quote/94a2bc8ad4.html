<main class="wrap"><figure class="quote" id="q-94a2bc8ad4" data-kw="">
<blockquote><p>The will of God in the decree and the revealing of part thereof in the command do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 17-18</span></figcaption>

<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>

<blockquote><p>He who is just could not have commanded anything impossible, nor is a man condemned for that which he could not avoid, for He is pious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology</cite>, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | 110. The conclusion is therefore proven lastly by another fundamental reason. By the very fact that God, through an antecedent will, ordains men to salvation and a supernatural end, He obliges them to observe the supernatural precepts, which are the necessary means for its attainment: according to that saying of Christ, “If you wish to enter into life, keep the commandments.” But man cannot be obliged to the observance of supernatural precepts without sufficient aids: Therefore, God, through an antecedent will, prepares sufficient aids for men. The major premise is evident; the minor is proven: | Man cannot be obliged to the impossible: But the observance of supernatural precepts, without supernatural aid, at least sufficient, is impossible: Therefore, such aid being excluded, he cannot be obliged to it: The major premise is established from the Council of Trent (sess. 6, chap. 11), where it is said that God does not command impossibilities; and from Augustine (de natura &amp; gratia, chap. 69), saying: “It is most firmly believed that God, being just and good, could not have commanded impossibilities.” And in Sermon 16 de tempore: “We execrate the blasphemy of those who say that anything impossible has been commanded by God.” And in Sermon 6:</span></figcaption>

</figure><figure class="quote" id="q-617cfcd054" data-kw="">
<blockquote><p>But though He wills all creatures as means and for his own sake, He wills some more than others to the degree they are more direct and suitable means for his glorification. God is a Father to all his creatures, but He is that especially to his children. His affection for everything He created is not as deep as his affection for his church, and that in turn is not as great as his love for Christ, the Son of his good pleasure. We speak of a general, a special, and a very special providence; in the same way we make as many distinctions in the will of God (as it relates to his creatures) as there are creatures. For the free will of God is as richly variegated as that whole world is. Hence, it must not be conceived as an indifferent power, a blind force, but as a rich and powerful divine energy, the wellspring of the abundant life that creation spreads out before our eyes. In that world, however, there is one thing that creates a special difficulty for the doctrine of the will of God, and that is the fact of evil, both evil as guilt and evil as punishment, in an ethical as well as a physical sense. Though evil is ever so much under God’s control, it cannot in the same sense and in the same way be the object of his will as the good. Hence, with a view to these two very different, in fact diametrically opposed, objects we must again make a distinction in that will of God, as Scripture itself shows. There is a big difference between the will of God that prescribes what we must do (Matt. 7:21; 12:50; John 4:34; 7:17; Rom. 12:2), and the will of God that tells us what He does and will do (Ps. 115:3; Dan. 4:17, 25,32,35; Rom. 9:18-19; Eph. 1:5,9,11; Rev. 4:11). The petition that God’s will may be done (Matt. 6:10) is very different in tenor from the childlike and resigned prayer: “Your will be done” (Matt. 26:42; Acts 21:14). Over and over in history we see the will of God assert itself in two ways. God commands Abraham to sacrifice his son, yet he does not let it happen (Gen. 22). He wants Pharaoh to let his people Israel go, yet hardens his heart so that he does not do it (Exod. 4:21). He has the prophet tell Hezekiah that he will die; still He adds fifteen years to his life (Isa. 38:1,5). He prohibits us from condemning the innocent, yet Jesus is delivered up according to the definite plan and foreknowledge of God (Acts 2:23; 3:18; 4:28). God does not will sin; He is far from iniquity. He forbids it and punishes it severely, yet it exists and is subject to his rule (Ex. 4:21; Josh. 11:20; 1 Sam. 2:25; 2 Sam. 16:10; Acts 2:23; 4:28; Rom. 1:24,26; 2 Thess. 2:11; etc.). He wills the salvation of all (Eze. 18:23,32; 33:11; 1 Tim. 2:4; 2 Pet. 3:9), yet has mercy on whom He wills and hardens whom He wills (Rom. 9:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Backer Academic, 2004), 2:241</span></figcaption>

9+is+very+different+in+tenor+from+the+childlike+and+resigned+prayer%3A+%E2%80%9CYour+will+be+done%E2%80%9D+%28Matt.+26%3A42%3B+Acts+21%3A14%29.+Over+and+over+in+history+we+see+the+will+of+God+assert+itself+in+two+ways.+God+commands+Abraham+to+sacrifice+his+son%2C+yet+he+does+not+let+it+happen+%28Gen.+22%29.+He+wants+Pharaoh+to+let+his+people+Israel+go%2C+yet+hardens+his+heart+so+that+he+does+not+do+it+%28Exod.+4%3A21%29.+He+has+the+prophet+tell+Hezekiah+that+he+will+die%3B+still+He+adds+fifteen+years+to+his+life+%28Isa.+38%3A1%2C5%29.+He+prohibits+us+from+condemning+the+innocent%2C+yet+Jesus+is+delivered+up+according+to+the+definite+plan+and+foreknowledge+of+God+%28Acts+2%3A23%3B+3%3A18%3B+4%3A28%29.+God+does+not+will+sin%3B+He+is+far+from+iniquity.+He+forbids+it+and+punishes+it+severely%2C+yet+it+exists+and+is+subject+to+his+rule+%28Ex.+4%3A21%3B+Josh.+11%3A20%3B+1+Sam.+2%3A25%3B+2+Sam.+16%3A10%3B+Acts+2%3A23%3B+4%3A28%3B+Rom.+1%3A24%2C26%3B+2+Thess.+2%3A11%3B+etc.%29.+He+wills+the+salvation+of+all+%28Eze.+18%3A23%2C32%3B+33%3A11%3B+1+Tim.+2%3A4%3B+2+Pet.+3%3A9%29%2C+yet+has+mercy+on+whom+He+wills+and+hardens+whom+He+wills+%28Rom.+9%3A18%29.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics+%28Backer+Academic%2C+2004%29%2C+2%3A241&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F617cfcd054.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/617cfcd054.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=But%20though%20He%20wills%20all%20creatures,hardens%20whom%20He%20wills%20%28Rom.%209%3A18&amp;text=But%20though%20He%20wills%20all%20creatures%20as%20means&amp;text=wills%20and%20hardens%20whom%20He%20wills%20%28Rom.%209%3A18" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>5. In so doing God does all that belongs to Him to do as Legislator: For it must be understood that here He speaks those words ‘that the world by Him might be saved’ not as absolute-Lord merely or properly, but as Rector per Leges [a Governor through laws]; And it belongs to Him as Legislator only to propound salvation to man as his end: and to promise it on his conditions, and prescribe those conditions and command man to perform them: and to threaten him with the loss of that end (of salvation) if he perform them not. But to give faith, which is the condition itself, does not belong so God as Legislator. (No man living can claim the first act of faith, or effectual grace thereto, from God by any promise that He has made): But He gives it as Dominus absolutus [an absolute Lord], and as one that may do with his own as he list. So that it is Finis prescriptus et conditionaliter datus [the end prescribed and conditionally given], that is here spoken of; and not Finis Decretus [the end decreed] to be by God eventually infallibly accomplished. It is the end of God’s Law and Legislative Will, and so of God as mere Legislator or Rector per Leges: and not of his decretive will de eventu [of the event], and of God as absolute Lord above Laws, without them disposing of his own. (The prediction of events does collaterally and secundum quid [according to that] belong to his Law: but not per se and directly.) And 6. Consider that if it be never so much denied that God has properly a conditional will de rerum eventu [respecting the event of things], yet it is beyond all question true that He has a conditional will de debito [of debt or obligation] (officii, Præmii et Pænæ [of office or duty, reward and punishment]) and so his Law is conditional most commonly. He has constituted the Debitum pramii [debt of reward], the dueness of salvation on condition of believing, loving and sincerely obeying Christ. And therefore they must nor deny conditional promises and threatnings, though they deny conditional, decrees. This I add, because I know they here usually answer that God intends no end conditionally, but where He intends also the condition itself, that so it may be equivalent to absolute: But He intends as Legislator that faith shall be the prescribed means to glory, and glory the end promised to all that perform that condition; and so conditionally gives it.</p></blockquote>

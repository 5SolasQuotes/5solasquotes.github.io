<blockquote><p>§. 44. Direction 5. Make haste away from the occasions of thy sin, and the company which ensnares thee in it. If thou knewest that they were robbers that intended to murder thee, thou wouldst be gone: If thou knewest that they had plague sores running on them thou wouldst be gone: And wilt thou not be gone when thou knowest that they are the servants of the Devil, that would infect thee with sin, and cheat thee of thy salvation? Say not, Is not this company lawful, and that pleasure lawful? etc. If it be like to entice thy heart to sin, it is unlawful to thee, whatever it is to others: It is not lawful to undo thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 623</span></figcaption>

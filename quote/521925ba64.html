</figure><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>

</figure><figure class="quote" id="q-5ceb932df3" data-kw="">
<blockquote><p>They were all eminently humble and lowly-minded men, if ever any were; and yet they all speak of their own state with an assured hope. Surely this should teach us that deep humility and strong assurance are perfectly compatible, and that there is not any necessary connection between spiritual confidence and pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holiness</cite>, ch. “Assurance”, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a> › <a href="../topics/assurance-peace-and-joy/assurance-of-salvation/assurance-of-grace-and-salvation.html">Assurance of grace and salvation</a></span></div>
<div class="actions"><button class="copy" data-copy="“They were all eminently humble and lowly-minded men, if ever any were; and yet they all speak of their own state with an assured hope. Surely this should teach us that deep humility and strong assurance are perfectly compatible, and that there is not any necessary connection between spiritual confidence and pride.”

— J. C. Ryle, Holiness, ch. “Assurance”, p. 167">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+were+all+eminently+humble+and+lowly-minded+men%2C+if+ever+any+were%3B+and+yet+they+all+speak+of+their+own+state+with+an+assured+hope.+Surely+this+should+teach+us+that+deep+humility+and+strong+assurance+are+perfectly+compatible%2C+and+that+there+is+not+any+necessary+connection+between+spiritual+confidence+and+pride.%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Holiness%2C+ch.+%E2%80%9CAssurance%E2%80%9D%2C+p.+167&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ceb932df3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ceb932df3.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-0f89033f49" data-kw="">
<blockquote><p>These things thus premised, I come to show the grounds or particulars wherein our pardon of sin is thus completed. And first, in our sense and feeling: for howsoever God pardon a sin perfectly, yet our faith which receives it is weak. This jewel is taken with a trembling and shaking hand. Hence it is that we have not full faith and confidence in our spirits. We may see this in David; though Nathan told him his sins were forgiven him, yet his faith was not so vigorous and powerful as wholly to apply this to his own soul, and therefore he had much anguish and trouble of heart afterwards. But now, at the last day, all these fears, diffidence and darkness will be quite removed out of our hearts. There shall be no more disturbance in our souls than there can be corruption in the highest heavens; we shall then have such a gourd as no worm can devour. Our souls shall not then know the meaning of sitting in darkness, and wanting God’s favour. There will then be no complaints, ‘Why has the Lord forsaken me?’ Well may God’s children be called upon to lift up their heads, when such a redemption draws nigh; and well may that day be called the times of refreshment, seeing the people of God are so often scorched with the fiery darts of Satan. Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished and not so much as any scars remain, the wound will be so fully healed. Although God does fully pardon sin, yet the effects of this are delayed; many chastisements and sad afflictions are to be undergone: howsoever, death itself, and the corruption in the grave must seize upon justified persons; now these are the fruit of sin, and howsoever the sting of these be taken away, yet they are not wholly conquered till that Last Day. Then therefore may we justly say, sin is pardoned, when there shall be no more grave, no more death, no more corruption, but all shall be swallowed up in immortality and glory. Thirdly, then, and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be. Here in this life, because the root of corruption abides in us, there are daily pullulant [sprouting] branches of sins, and so frequent guilt is contracted; whereby as we have daily sores, so we need daily plasters. It is with original corruption in us, as in that tree in Dan. 4:14-15; although the branches be cut off, yet the stump is still in the earth, and that sprouts out too fast by the temptations that are always by it. Hence it is that we always pray, ‘Forgive us our sins;’ and because of these failings the apostle, 2 Cor. 5:20, writes to, and exhorts the godly Corinthians, who were already reconciled to God, to be further reconciled to Him. But then this petition shall wholly cease; then there will be no serpent to sting us, nor will the eye of justifying faith to look upon the brazen serpent exalted be necessary any more. The Lord will not only wipe away the tear of worldly grief, but also of godly sorrow at that time. Then, and not till then, will it be true, that God sees no sin in his children. Then will the Church be without wrinkles, or any spot within her. In this respect it is, the Church of God prays so earnestly for the Bridegroom’s coming. For this it is they look for and hasten in their prayers that day. Fourthly, at that day will pardon of sin only be completed, if you consider the nature of justification. For what is that, but an overcoming the accusing adversary, and clearing of us against every charge? Now this is most eminently and fully done in those last assizes. The Syriac word to justify is also to conquer and overcome, because when a man is justified, he overcomes all those bills and indictments which were brought in against him; now this is manifestly done in the Day of Judgment, when God shall before men and angels acquit and absolve his people: and if the apostle say in this life, Rom. 6:7, of a godly man dead in Christ, he is justified from his sins, in respect of sanctification, that sin does not conquer him, but he sin, how much more will this be true at that day, when all the guilt and filth of sin shall be totally removed? Oh what a glorious conquest will that be over sin, hell, and the devil, when the Judge of the whole world shall pronounce them free from all sin, and command them to enter into his glorious rest!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, pp. 259-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures (London: Miller, 1651), Lecture 29, on Acts 3:19, pp. 259-61">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThese+things+thus+premised%2C+I+come+to+show+the+grounds+or+particulars+wherein+our+pardon+of+sin+is+thus+completed.+And+first%2C+in+our+sense+and+feeling%3A+for+howsoever+God+pardon+a+sin+perfectly%2C+yet+our+faith+which+receives+it+is+weak.+This+jewel+is+taken+with+a+trembling+and+shaking+hand.+Hence+it+is+that+we+have+not+full+faith+and+confidence+in+our+spirits.+We+may+see+this+in+David%3B+though+Nathan+told+him+his+sins+were+forgiven+him%2C+yet+his+faith+was+not+so+vigorous+and+powerful+as+wholly+to+apply+this+to+his+own+soul%2C+and+therefore+he+had+much+anguish+and+trouble+of+heart+afterwards.+But+now%2C+at+the+last+day%2C+all+these+fears%2C+diffidence+and+darkness+will+be+quite+removed+out+of+our+hearts.+There+shall+be+no+more+disturbance+in+our+souls+than+there+can+be+corruption+in+the+highest+heavens%3B+we+shall+then+have+such+a+gourd+as+no+worm+can+devour.+Our+souls+shall+not+then+know+the+meaning+of+sitting+in+darkness%2C+and+wanting+God%E2%80%99s+favour.+There+will+then+be+no+complaints%2C+%E2%80%98Why+has+the+Lord+forsaken+me%3F%E2%80%99+Well+may+God%E2%80%99s+children+be+called+upon+to+lift+up+their+heads%2C+when+such+a+redemption+draws+nigh%3B+and+well+may+that+day+be+called+the+times+of+refreshment%2C+seeing+the+people+of+God+are+so+often+scorched+with+the+fiery+darts+of+Satan.+Secondly%2C+pardon+of+sin+will+at+that+day+be+perfected.+Because+all+the+effects+of+pardon+will+then+be+accomplished+and+not+so+much+as+any+scars+remain%2C+the+wound+will+be+so+fully+healed.+Although+God+does+fully+pardon+sin%2C+yet+the+effects+of+this+are+delayed%3B+many+chastisements+and+sad+afflictions+are+to+be+undergone%3A+howsoever%2C+death+itself%2C+and+the+ ccusing+adversary%2C+and+clearing+of+us+against+every+charge%3F+Now+this+is+most+eminently+and+fully+done+in+those+last+assizes.+The+Syriac+word+to+justify+is+also+to+conquer+and+overcome%2C+because+when+a+man+is+justified%2C+he+overcomes+all+those+bills+and+indictments+which+were+brought+in+against+him%3B+now+this+is+manifestly+done+in+the+Day+of+Judgment%2C+when+God+shall+before+men+and+angels+acquit+and+absolve+his+people%3A+and+if+the+apostle+say+in+this+life%2C+Rom.+6%3A7%2C+of+a+godly+man+dead+in+Christ%2C+he+is+justified+from+his+sins%2C+in+respect+of+sanctification%2C+that+sin+does+not+conquer+him%2C+but+he+sin%2C+how+much+more+will+this+be+true+at+that+day%2C+when+all+the+guilt+and+filth+of+sin+shall+be+totally+removed%3F+Oh+what+a+glorious+conquest+will+that+be+over+sin%2C+hell%2C+and+the+devil%2C+when+the+Judge+of+the+whole+world+shall+pronounce+them+free+from+all+sin%2C+and+command+them+to+enter+into+his+glorious+rest%21%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures+%28London%3A+Miller%2C+1651%29%2C+Lecture+29%2C+on+Acts+3%3A19%2C+pp.+259-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0f89033f49.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0f89033f49.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/assurance/#:~:text=These%20things%20thus%20premised%2C%20I%20come,to%20enter%20into%20his%20glorious%20rest&amp;text=These%20things%20thus%20premised%2C%20I%20come%20to%20show&amp;text=command%20them%20to%20enter%20into%20his%20glorious%20rest" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

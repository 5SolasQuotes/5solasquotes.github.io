<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded… (1681)</cite>, p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33f20bf472" data-kw="">
<blockquote><p>Nor do the Arminians much honor the magistrate, who, walking in the steps of Erastus, do hold that the magistrate having power of public places, preachers are obliged not to preach in public places if the magistrate forbid them; but they may preach in private places. But: … 2. The Lord has no more given to magistrates power of places, or religious-actions in places, than He has given to them power of truths: Therefore, they [Arminians] must be obliged in conscience, rejecting a vain and sapless distinction, to preach in public places: for as that judicious and learned, [reformed] professor, Jacob Triglandius says, ‘The place is accident all to the worship, and changes not the nature of it;’ (Trigland, de Potest. et Eccelesiastica Dissertatio, Theol., p. 123)… 3. The apostles knew not this distinction, for they not only preached truth (the scribes and pharisees forbidding them), but in public places, and at all occasions, and daily in the Temple, and in every house they ceased not to teach and preach Jesus Christ (Acts 6:2,4; 4:1,20; 5:20-21). The magistrate, being Antichristian, forbids not preaching of saving truths because of the place, be it private or public, but he forbids them because they are saving; and if Jesus Christ has called a man to preach in public in the housetops, the magistrate has no power from God to silence him in public more than in private. The magistrate forbids that any teach false doctrine, not for the place, but because it is injurious and hurtful to human societies that men should be principled in a false religion, and cannot but disturb the public peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (1646)</cite>, pp. 557-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-e6f79cad8b" data-kw="">
<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</cite></span></figcaption>

</figure><figure class="quote" id="q-e1d886b46f" data-kw="">
<blockquote><p>…green and raw deliverances are plagues of God, not mercies; the plague is nine times removed, but Pharaoh’s heart is neither softened nor humbled, the scum abideth in the bloody city, as the Lord complains, Eze. 24:6, ‘Therefore thus saith the Lord God, Woe to the bloody City, to the pot whose scum is therein, and whose scum is not gone out;’ the prophet in Chaldea heard that Jerusalem had been boiled with the sword of the Lord, but the scum of their idolatry and blood remained in them; whilst the wicked of these kingdoms, malignants, bloody Irish, rotten hearted men, such backsliders and perjured apostates, as are in Scotland, delivered to Satan and excommunicated, while these taste of the gall and wormwood of the wrath of God in this war, the hand of God cannot be removed, and therefore that must be taken notice of, Jer. 6:29, ‘The bellows are burnt, the lead is consumed of the fire, the founder melteth in vain: for the wicked are not plucked away;’ O that our Lord would boil out on the fire the scum of both kingdoms. The whoredoms of Popish Egypt, and the ceremonies, the inventions of men are not mourned for by the pastors of the Lord, sure, I am, not by most of the ministers in Scotland…</p></blockquote>

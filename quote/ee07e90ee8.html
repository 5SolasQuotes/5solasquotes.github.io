<main class="wrap"><figure class="quote" id="q-ee07e90ee8" data-kw="">
<blockquote><p>And let them not here allege, That I am deceived in the opinion that I have of the substance of the Eucharist. For the question is not, whether the Eucharist be bread or not, (this should be disputed apart) but whether he who believes that it is bread in substance, can adore it, without making himself guilty of Sacrilege, and giving a creature that honour which is due to the Creator.

For if one should grant, That he cannot (which we now are coming to demonstrate from the premises very evidently) I have gained the point that I intended to prove: it being clear, that this supposeth We have had reason to separate from Rome, seeing we believe that the Eucharist is bread in substance; it being impossible for us to yield to that worship, which she desires we should give it, unless we give to a creature that, which we are bound to give only to the Creator. Whence all the odious question concerning schism is ended.

For we call that schism, which is a separation made without necessity. So that when my conscience forbids me under pain of God’s wrath, and my own damnation, to obey that which you command me in this particular, ’tis evident, that it is not fancy, pleasure, or faction, but a pure necessity that constraineth me to separate from you. If you cannot tax this my opinion, much less can you condemn my separation.

Accuse me if you please of stupidity, For not being able to conceive, how a body that is in heaven can be at the same time in a thousand places on earth; how all the quantity of a complete man can be brought within one single point; how a thing, that my sense and reason knoweth to be bread, and the H. Scripture calleth oftentimes bread, can not be bread at all for all this; but the very Creator of the world.

Blame as much as you please the dullness of my spirit, that cannot comprehend a whit of these pretended mysteries. But once presuppose my belief to be true, and then you cannot shew me wherein I do amiss in separating from you. At this time ’tis sufficient, that I have shown, that our separation is not contrary to charity, which obligeth no man to embrace that, in favour or love of his neighbour, which he believes disagreeable to God’s will, and pernicious to his own soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 31-32.</span></figcaption>

<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>

</figure><figure class="quote" id="q-5fae02486d" data-kw="unworthy">
<blockquote><p>The reasons are: (1) from the institution and the example of Christ. Christ broke the bread and all the evangelists, and Paul, who individually relate this, agree that he did. Now who would affirm that the Son of God in so sacred an action did anything superfluous, or that all the apostles would have related this with so great carefulness, if the thing was merely indifferent and free? Who, on the other hand, does not see that Christ wished to prescribe the sacramental rites and ceremonies by his example and command when he ordered his disciples “to do this” (i.e., with respect to those administering, to take the bread, to bless, to break and give it to the communicants)? Again, there ought to be the same reason for the breaking as the giving of thanks and for the distribution because it is placed between them. Now no one denies that these latter ceremonies are necessary, belonging to the instituted rite and not merely indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.24</span></figcaption>

<blockquote><p>I. When two commandments of the moral law are opposite in respect of use as we can not do them both at the same time: then the lesser commandment gives place to the greater and does not bind for that instant. Example 1. God commands one thing, and the magistrate commands the flat contrary: in this case which of these two commandments must be obeyed, ‘Honor God,’ or, ‘Honor the Magistrate’? The answer is, that the latter must give place to the former, and the former must only be obeyed. Acts 4:19, ‘Whether it be right in the sight of God to obey you rather than God judge ye.’

II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, … (Cambridge, 1596), pp. 14-15</span></figcaption>

II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.”

— William Perkins, A Discourse of Conscience, … (Cambridge, 1596), pp. 14-15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+When+two+commandments+of+the+moral+law+are+opposite+in+respect+of+use+as+we+can+not+do+them+both+at+the+same+time%3A+then+the+lesser+commandment+gives+place+to+the+greater+and+does+not+bind+for+that+instant.+Example+1.+God+commands+one+thing%2C+and+the+magistrate+commands+the+flat+contrary%3A+in+this+case+which+of+these+two+commandments+must+be+obeyed%2C+%E2%80%98Honor+God%2C%E2%80%99+or%2C+%E2%80%98Honor+the+Magistrate%E2%80%99%3F+The+answer+is%2C+that+the+latter+must+give+place+to+the+former%2C+and+the+former+must+only+be+obeyed.+Acts+4%3A19%2C+%E2%80%98Whether+it+be+right+in+the+sight+of+God+to+obey+you+rather+than+God+judge+ye.%E2%80%99%0A%0AII.+The+4th+Commandment+prescribes+rest+on+the+Sabbath+day.+Now+it+%5Bfalls%3F%5D+out+that+at+the+same+time+%5Bthat%5D+a+whole+town+set+on+fire%2C+and+the+Sixth+Commandment+requires+our+help+in+saving+our+neighbor%E2%80%99s+life+and+goods.+Now+of+these+two+commandments%2C+which+must+be+obeyed%3F+For+both+cannot.+The+answer+is+that+the+Fourth+Commandment+at+this+time+is+to+give+place%2C+and+the+Sixth+Commandment+alone+binds+the+conscience%3A+so+as+then+%28if+need+should+require%29+a+man+might+labor+all+the+day+without+offence+to+God.+Mt.+9%3A13%2C+%E2%80%98I+will+have+mercy+and+not+sacrifice.%E2%80%99+And+the+rule+must+not+be+omitted+that+charity+towards+our+neighbor+is+subordinate+to+the+love+of+God%2C+and+therefore+must+give+place+to+it.+For+this+cause+the+commandment+concerning+charity+must+give+place+to+the+commandment+concerning+love+to+God%3A+and+when+the+case+so+falls+out+that+we+must+either+offend+our+neighbor+or+God%2C+we+must+rather+offend+our+neighbor+than+God.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Discourse+of+Conscience%2C+%E2%80%A6+%28Cambridge%2C+1596%29%2C+pp.+14-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F644a4b274b.html&amp;via=5Sola

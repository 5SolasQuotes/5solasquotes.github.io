<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>

<blockquote><p>§X. Impotence is wont to be distinguished into physical or natural, and moral: The former arises from a defect of the natural faculty required for doing something; e.g., in the deaf for hearing; in the blind for seeing; in a wall for speaking. The latter has its origin from a voluntary evil disposition of the soul and a perverse custom, such as is in a drunken man, a gambler, and a thief; of whom the first cannot abstain from drink, the second from gaming, the third from theft. If these things are applied to the present theological matter; the impotence which is congenital to man after the Fall, and is in him from his very birth, can be called natural, not because it is a destruction of the will and of the natural liberty of the will, but because, having arisen from the first sin of Adam, it has degenerated as it were into nature and is transmitted to posterity: as if leprosy, a stone, epilepsy, or another kind of disease is propagated from parents to children by the contagion of nature through natural generation.</p></blockquote>

<blockquote><p>And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-edinburgh.html">John Brown of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses &amp; Sayings of our Lord</cite>, (1852; Banner of Truth, 1990), vol. 1, pp. 459-60</span></figcaption>

<blockquote><p>Free will, in the sense of those [errorists] who maintain it, is [said to be] a power in the will to incline either way, when that which is supernatural and saving is offered as its object; a power and freedom in the will to choose or refuse, to yield or resist, to embrace or reject, as it list. So that this with them is twofold: … 2. To choose, or embrace. The will, they [errorists] say, can incline to that which is spiritually and supernaturally good. They speak not of a capacity, which is not denied, but of an active power. A natural man, by the power of his will, as he can reject Christ, so he can embrace Him; as he can resist converting grace, so he can yield to it as he will; the will can incline itself to this as well as to the other. This is a true representation of their opinion in the other branch of it. Against which we say…</p></blockquote>

<blockquote><p>Whether the formal reason of free will consists in indifference or in rational spontaneity. The former we deny; the latter we affirm against papists, Socinians and Remonstrants. We must oppose the error of the adversaries who place its formal reason in indifference, and establish the orthodox truth which asserts that it is placed in rational willingness.</p></blockquote>

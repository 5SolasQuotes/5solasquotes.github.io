</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79a16d5352" data-kw="">
<blockquote><p>Also this power is given to certain ends: and if it be used against those ends, so that either the ends or that means must be forsaken, it is easy to see that it is means and not the ends. For the means are not always the same, God having [a] store [of means] if any one fail. Especially the means is of positive morality and the ends [are] of natural morality: For when two duties come together, and both cannot be chosen, the choosing of the less (which must give place to the greater) is a sin: and positives are less (caeteris paribus [all things being equal]) than naturals: And the substantials of positives [are] more necessary than the circumstantials:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“Also this power is given to certain ends: and if it be used against those ends, so that either the ends or that means must be forsaken, it is easy to see that it is means and not the ends. For the means are not always the same, God having [a] store [of means] if any one fail. Especially the means is of positive morality and the ends [are] of natural morality: For when two duties come together, and both cannot be chosen, the choosing of the less (which must give place to the greater) is a sin: and positives are less (caeteris paribus [all things being equal]) than naturals: And the substantials of positives [are] more necessary than the circumstantials:”

</figure><figure class="quote" id="q-b50da99f93" data-kw="">
<blockquote><p>To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologoumena Pantodapa</cite>, tr. Dr. David C. Noe</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-58960996c7" data-kw="">
<blockquote><p>I have heard many pleading for ceremonies say that if the magistrate commanded them and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law…</p></blockquote>

</figure><figure class="quote" id="q-26c2da0923" data-kw="">
<blockquote><p>Though the Old Testament rites after Christ’s death were called “the commandments and doctrines of men” (Col. 2:22), just as the sort that Jesus condemns in Mt. 15:2–9, yet Paul and the Christians did not put any opinion of holiness in these rites or opinion of necessity beyond their nature or what derived from the circumstances (though others did). Paul and the Christians used these material, inconvenient and scandalous (in some way) ceremonies in accord with nature’s light, Christian prudence and the Word’s general rules for the greater good: “Unto the pure all things are pure” (Tit. 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<main class="wrap"><figure class="quote" id="q-cd749379bb" data-kw="">
<blockquote><p>With this wicked doctrine, by which he commands men to doubt the favor of God toward them, the pope has removed God and all His promises from the church, has undermined the blessings of Christ, and has abolished the entire Gospel. Then these troubles followed of necessity, because men depended, not on God as He promises but on their own works and merits. When this happens, a man can never be certain about the will of God but is continually forced to waver and finally even to despair. It is impossible ever to decide what God wills and what is pleasing to Him, except in His Word. This Word makes us certain that God cast away all His wrath and hatred toward us when He gave His only Son for our sins, The sacraments, the power of the keys, etc., also make us certain; for if God did not love us, He would never have given us these. Thus we are overwhelmed with endless evidence of the favor of God toward us. Now that the plague of uncertainty, with which the entire church of the pope is infected, is driven away, let us believe for a certainty that God is favorably disposed toward us, that we are pleasing to Him and of concern to Him on account of Christ, and that we have the Holy Spirit, who intercedes for us with a crying and a sighing too deep for words.</p></blockquote>

</figure><figure class="quote" id="q-1e3932130d" data-kw="">
<blockquote><p>XXVII. The grace of God and the merit of Christ are not opposed, but subordinated because they are viewed here in different respects (kat’ allo kai allo): grace in respect of us, both in the giving of the surety and in the acceptance of his satisfaction for our justification; but merit in respect of God’s justice, which could not leave sin unpunished (which the apostle asserts are in the highest degree consistent with each other, Rom. 3:24, 25). XXVIII. Although the remission of God and of men are similar in various points as to the thing (and most especially in the sincere and genuine pardon offenses), it does not follow that they are exactly similar. Men are private persons to whom the right of punishment does not necessarily belong, but God is a Judge whose prerogative it is to punish sinners. XXIX. If God promises remission of sins in the new covenant, this does not deny but supposes the satisfaction of Christ because it is promised in the name of Christ (Acts 10:43), i.e., through his virtue and merit. Nor is there any remission without the shedding of blood (haimatekchysia, Heb. 9:22). And if the elders are said to have obtained pardon by faith (Heb. 11), Christ is necessarily included (whom faith regards as its proper object); indeed inasmuch as he was crucified who ought to lay down his life as a sacrifice for sin (Is. 53:10) and to be made a sin offering (2 Cor. 5:21) and a curse (katara, Gal. 3:13). For other matters bearing upon this point, see Volume I, Topic III, Question 19; and Disputation 1 and 2, on the Necessity of Satisfaction (De Satisfactionis Christi Necessitate, in Opera [1848], 4:385–435).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 426. (14.10.27–29)</span></figcaption>

</figure><figure class="quote" id="q-f9fcbf0eda" data-kw="">
<blockquote><p>13. But the doers of the Law will be justified. This passage is interpreted in a twofold way by blessed Augustine in chapter 26 of On the Spirit and the Letter. First in this way:The doers of the Law will be justified means that through justification they will become, will be made, what they were not before, doers. Second, and in a better way, will be justified means that they will be looked upon and thought of as righteous, as stated in the gloss. It is sufficiently clear from the preceding (the period 13), “for not the hearers of the Law are righteous before God,” that, if you should ask who else is righteous before God except the hearers, the answer would be: “The doers will be righteous, that is, they will be justified and looked upon as righteous.” Thus Ps. 143:2 says, “for no man living is righteous before Thee,” that is, he is not looked upon as righteous. And below, in Rom. 3:20, we read: “No human being will be justified in his sight by works of the law.” And again Luke 10:29: “And he, desiring to justify himself” (that is, he wanted to declare or to state that he was righteous, and he wanted to absolve himself of sin, as though he did not know who was his neighbor whom he was commanded to love), and similarly in many other places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, 25.184–85.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<main class="wrap"><figure class="quote" id="q-1f81758057" data-kw="">
<blockquote><p>First, for the marriage blessing, they [congregationalists] applaud the Brownists’ doctrine: they send it from the church to the townhouse, making its solemnization the duty of the magistrate; this is the constant practice of all in New England. The prime of the Independent ministers now at London have been married by the magistrate, and all that can be obtained of any of them is to be content that a minister in the name of the magistrate, and as his commissioner, may solemnize that holy band.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, pp. 115-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-008959d7e1" data-kw="">
<blockquote><p>So the love-tokens and testimonial rings and bracelets of the Husband, my love to the saints, my keeping of his word, my holy walking in Christ, being the works of his Spirit, which dwelt in Jesus Christ, are actu primo [the first act], in themselves, as infallible signs of the Bridegroom’s love to me; as the Beloved’s word who spake and said, ‘Arise, my love’: And if the spirations and breathings of the Spirit go not along, both the voice and the love-bracelets (for Christ is no more counterfeit in his love-tokens than in his word when He speaks as a Husband) are alike ineffectual to persuade the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), pp. 98-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-8ef258d6dd" data-kw="">
<blockquote><p>3. ‘Tis contrary to the example of the Apostles themselves, and condemns them as well as us, for they did not only teach and commend to the Churches that Reformation which Mr. Dell calls the mortifying or destroying of corruption and lust, or Christ dwelling and living in us, but likewise an external acclesiastical reformation, and several canons concerning the reformation of external abuses and scandals in the Church: as for instance, that the Churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick and that such widows must be at least 60 years old, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellany Questions</cite>, ch. 18, ‘Whether conscionable Christians and such as love the power and practice of piety, can without defiling their conscience…’, pp. 165-66</span></figcaption>

</figure><figure class="quote" id="q-ad4c6f2e3d" data-kw="">
<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-perre-du-moulin.html">Perre Du Moulin Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Peace &amp; Contentment of Mind (London: 1657), ch. 9, ‘Of Good Conscience’</span></figcaption>

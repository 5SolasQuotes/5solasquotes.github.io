<blockquote><p>‘O’, says the soul, ‘Lord, I have come to you upon an earnest business! I am arrested by Satan, my conscience convicts me, and I will be accused before the judgment seat of God… Lord, I am distressed, undertake for me!’ O consider your advocate a friend, and not an enemy! You must open your heart to Him and reveal your whole cause unto Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 1:171-72</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-492d7d067f" data-kw="">
<blockquote><p>God speaks with sinners through his messengers. They come for God’s purpose, and their words, counsels, exhortations, and reproofs are his. When sinners reject the words which God’s ministers bring in his name, they are actually striving with the Spirit. They are wrestling with Christ as if He were present. When God comes to reckon with sinners, it will prove just so. God will remind them of his striving and their unkind resistance. The Spirit strives with the consciences of men, debating in their own hearts the case against them, and shows man his sin in all its ugly colors. He does this so well that the creature can sometimes smell the very fire and brimstone about him, and makes him feel at present in a temporary hell. At other times, he parleys and works with them, and makes gracious overtures and offers of the gospel to them. He opens a door of hope and woos and beseeches them to throw down their rebellious arms and come to Christ for life. He reveals how Christ is in a present disposition to embrace their first motion towards mercy. The Spirit follows the sinner from place to place, and from time to time suggesting such encouragements. Many, however, cast off the Spirit’s hands in resistance. This carries such malignity in it, that some have felt the horror of the unpardonable sin, even though their condition is not final. Take heed, however, sinners, how you respond to the Spirit when He comes knocking at the door of your hearts. Open at this knock, and He will be your guest; you will have his sweet company. Repulse Him, and you have not a promise He will knock again. If once He stops striving with you, unhappy man, you are lost forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor</cite>, (†1679), 1:116-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>‘Behold I stand at the door and knock, etc.’ Here is yet further kindness declared: the Lord stands at the door knocking to be let in. He is the Good Shepherd, He seeks up that which goes astray, He stands knocking at the door of man’s heart to enter and to make it his temple to dwell in. Mark here diverse things: As first that the Lord does not only knock and call at the door of man’s heart, but continues the same: for He stands at the door, and has stood at the door, as the word imports. This is much that He must wait upon us, moving us to receive Him: but the truth is, we never have any mind of Him but when He does stand knocking at the door of our heart. Then further behold how difficult a thing it is for the heart of man to receive Christ and to be turned to God… we are so fast asleep that He may knock and knock again, we regard Him not. But let us take heed, for albeit his kindness is marvellous, yet He will not always offer Himself, nor always be found… Be not therefore too bold with Him: if He have by his Word and by the motions of his Spirit, stood daily knocking at the door of thy heart, showing thy sins and moving thee to repentance, and thou hast made light thereof, take heed lest those knockings of his cease and thine heart be more hardened, so that there is no feeling of any godly sorrow unto repentance. Make much of this knocking, make much of these motions of the Spirit, for many that have had great remorse and beginnings for to repent, are now hardened and boldened in sin. Most miserable are they which despise his knocking and drive Him away. On the contrary part, they be a thousand times blessed which open unto Him, and so receive Him. For mark what He says, ‘If any do hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ What more happy guest can be received in? what good thing can be wanting where He is? If Christ dwell in the heart by faith, if the graces and power of Christ be received in, all evil and misery is driven out, and all goodness and felicity do succeed. Darkness is driven out, the Devil is expelled, sin is destroyed and horror of the dreadful judgment does vanish away. There is light, there is God, there is righteousness, and peace and joy of the Holy Ghost. Full notably does the prophet David set forth this, Ps. 24, when he says: ‘Lift up your heads ye gates, and be ye lift up ye everlasting doors, and the king of glory shall come in. Who is the king of glory? The Lord strong and mighty, the Lord mighty in battle.’ …He sets it forth that we shall receive all good things by Him, in these words, that ‘if any open the door, He will come in and sup with him, etc.’ He brings all the dainties with Him, and compares it unto a supper, for we shall be fed with them: we shall be even filled abundantly with all sweet joys: this supper shall never be ended. … If any man will say then, how are those former speeches to be construed? Thus you must understand: First, that God works upon the hearts of men, not as men work upon blocks or stones, which have no sense nor understanding: for man has understanding, he has a will, he has affections. Then secondly, that free is opposed to bond, and free is opposed to compelled. In respect of the [latter] one, man has free will, in respect of the other he has not. Man naturally loves and delights in evil, his will not forced or compelled, does choose the same: man despises and rejects the Gospel of his own will. In this respect his will is free unto all evil, that is, he wills evil not compelled, but carried thereunto with pleasure. …The mark what Christ says, ‘No man comes unto Me, unless the Father that sent Me draw him, John 6. This drawing is not by force, but God reforms the will and the affections, so that a man joyfully receives Christ and therefore is said to open the doors of his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Whole Book of the Revelation</cite>, (London: Field, 1599), Sermon 10, pp. 109-11 Gifford (1547-1600) was a partially-conforming puritan.</span></figcaption>

<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>

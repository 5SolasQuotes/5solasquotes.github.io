<main class="wrap"><figure class="quote" id="q-6fafd94c7c" data-kw="">
<blockquote><p>And now especially in this solemn transaction, endeavour to render God great to your selves: Enlarge your minds, that as far as is possible and needful, they may take in the entire notion of him. As to what he is in himself, you must conceive of him as a Spirit, as his own Word, which can best tell us what he is, instructs us; and so as a Being of far higher excellency than any thing you can see with your eyes, or touch with your hands, or than can come under the notice of any of your senses.

You may easily apprehend Spiritual Being to be the source and spring of life, and self-moving power. This World were all a dead unmoving lump, if there were no such thing as Spirit; as your bodies when the soul is fled. You must conceive him to be an Eternal, Self-subsisting Spirit, not sprung up into Being from another, as our souls are: But who from the excellency of his own Being, was necessarily of, and from himself; comprehending originally and eternally in himself the fulness of all Life and Being.

I would fain lead you here, as by the hand, a few plain and easy steps. You are sure that somewhat now is, of this you can be in no doubt; and next you may be as sure that somewhat hath, of it self, ever been: For if nothing at all now were, you can easily apprehend it impossible that any thing should ever be, or of it self now begin to be, and spring up out of nothing. Do but make this supposition in your own minds, and the matter will be as plain to you as any thing can be, that if nothing at all were now in being, nothing could ever come into being; wherefore you may be sure, that because there is somewhat now in being, there must have been somewhat or other always in being, that was eternally of it self. And then to go a little farther, since you know there are many things in being that were not of themselves, you may be sure that what was always of it self, had in it a sufficiency of active power to produce other things, otherwise nothing that is not of it self could ever be. As you know that we were not of our selves; and the case is the same as to whatsoever else our eyes behold.

You must conceive of God therefore as comprehending originally in his own Being, which is most peculiar to himself, a power to produce all whatsoever Being, Excellency and Perfection is to be found in all the whole Creation. For there can be nothing which either is not, or arises not from, what was of it self. And therefore that he is an absolutely, universally, and infinitely perfect Being, and therefore that Life, Knowledge, Wisdom, Power, Goodness, Holiness, Justice, Truth, and whatsoever other conceivable Excellencies, do all in highest perfection, belong, as necessary Attributes, unchangeably and without possibility of diminution unto him. And all which his own Word (agreeably to the plain reason of things) doth in multitudes of places ascribe to him; as you that are acquainted with the Bible cannot but know. You must therefore conceive of him, as the All in All. So great, so excellent, so glorious a One he is, to whom you are to surrender and yield your selves.

You are to conceive of him as most essentially One, for there can be but one All. And so his Word teaches you to conceive. Hear, O Israel! the Lord our God is one Lord, Deut. 6. 4. We know there is no other God but one, &amp;c. 1 Cor. 8. 4, 5, 6. Your thoughts therefore need not be divided within you, nor your minds hang in doubt, to whom you are to betake and yield your selves: there is no place or pretence for halting between two Opinions. He most righteously lays the sole claim to you, a just God and a Saviour, and there is none besides him, Isa. 45. 21.</p></blockquote>

<blockquote><p>I hasten to mark out decisive proofs of this wide-wasting treason against the Majesty of the Holy Spirit of the living God.

Of these, the first and most prominent is —

Sabbath-breaking, or the prostitution of Sacred time.

Were it my design to establish the authority of this wise, good, holy institution, I might go back to the foundation of the world, and to the bowers of the original paradise; or I might call you to listen to that terrific voice of words, which, issuing from the tempestuous darkness and flames of Sinai, conveyed terror to the breasts of millions, while it pronounced the statute of Heaven, “Remember the Sabbath-day to keep it holy.” But I take it for granted, that the institution is Divine. My present object is to mark the atrocity of its violation, as implying a vile contempt of the influences of the Holy Spirit.

When the glorious Saviour, having finished the mysterious purchase of salvation, rose to endless life and dominion on the first day of the week, the honours of the Sabbath were justly transferred to that day; and its hours became peculiarly sacred and auspicious, as the season when mortals, humbly waiting upon God, might hope to be visited with those operations of the Spirit of Jesus Christ which apply the blessings of redemption. What then might be expected in a country wherein such a Sabbath is made known?

We plead not for the formal austerities of hypocrisy; but we contend for it, and all the sophistry in the world cannot resist us, that to refuse a serious, diligent observation of the Christian Sabbath, with a view to the spiritual ends of its appointment, is to contemn those influences of the Eternal Spirit, which bring salvation, and heaven, into immortal souls. Every Sabbath-breaker is such a despiser; every act of Sabbath-breaking expresses such contempt.

What then must be the state of a country filled with such rebels? Be astonished, ye Heavens; be ashamed, thou Sun, whom the Spirit of God placed in the skies — withdraw thy shining beams from the haunts of such transgressors; and thou solid Earth, tremble under their steps, while they assemble in unashamed crowds, to declare, before angels and men, how much they despise the Majesty and Grace of thy Creator!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Radical Cause of National Calamity: A Sermon, Preached at the Scots Church, Crown Court, Russel Street, Covent Garden, October 27. 1794 in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, and A Serious Call Respecting a Mission to the River Indus</cite></span></figcaption>

<blockquote><p>But if we love Christ and our souls better then our lives, let us resolve never to embrace any conditions of Peace which mingle the Inventions of men with the truth of God: Let us maintain the Doctrine of free Justification, our Salvation depends upon it, and let us preserve the Worship of God entire and pure; for saith he, if we look only to matters of Faith, and contend not for purity of Worship, we seem to have less care of God’s honour, then of our Salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarm. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“But if we love Christ and our souls better then our lives, let us resolve never to embrace any conditions of Peace which mingle the Inventions of men with the truth of God: Let us maintain the Doctrine of free Justification, our Salvation depends upon it, and let us preserve the Worship of God entire and pure; for saith he, if we look only to matters of Faith, and contend not for purity of Worship, we seem to have less care of God’s honour, then of our Salvation.”

— Francis Cheynell, Sion’s memento, and Gods alarm. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast, (London: Samuel Gellibrand, 1643), epistle dedicatory.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+if+we+love+Christ+and+our+souls+better+then+our+lives%2C+let+us+resolve+never+to+embrace+any+conditions+of+Peace+which+mingle+the+Inventions+of+men+with+the+truth+of+God%3A+Let+us+maintain+the+Doctrine+of+free+Justification%2C+our+Salvation+depends+upon+it%2C+and+let+us+preserve+the+Worship+of+God+entire+and+pure%3B+for+saith+he%2C+if+we+look+only+to+matters+of+Faith%2C+and+contend+not+for+purity+of+Worship%2C+we+seem+to+have+less+care+of+God%E2%80%99s+honour%2C+then+of+our+Salvation.%E2%80%9D%0A%0A%E2%80%94+Francis+Cheynell%2C+Sion%E2%80%99s+memento%2C+and+Gods+alarm.+In+a+sermon+at+Westminster%2C+before+the+Honourable+House+of+Commons%2C+on+the+31.+of+May+1643.+the+solemn+day+of+their+monthly+fast%2C+%28London%3A+Samuel+Gellibrand%2C+1643%29%2C+epistle+dedicatory.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac5c0fe7a6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac5c0fe7a6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/13/francis-cheynell-on-soteriology-and-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7e86e768d8" data-kw="">
<blockquote><p>In his book, English Popish Ceremonies, George Gillespie points out that the English Puritans and the Scottish Covenanters were not the only people in the Reformed world who opposed the religious observance of extra-biblical festivals (holy days were called holidays in Gillespie’s time):

As touching the judgment of divines, we say 1. Many divines disallow of festival days, and wish the church, were free of them. For the Belgic churches, in their synod, anno 1578, wished that the six days might be wrought upon, and that the Lord’s day alone might be celebrated. And Luther in his book, de Bonis Operibus, wished that there were no feast-days among Christians but the Lord’s day. […] The old Waldenses also, whose doctrine was restored and propagated by John Huss, and Jerome of Prague, after Wicklif, and that with the congratulation of the church of Constantinople, held, that they were to rest from labour upon no day but upon the Lord’s day, whereby it appeareth that holidays have had adversaries before us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 22.</span></figcaption>

<blockquote><p>Thus your first accusation, that we worship the true God after a false manner, is with false slander and furious outrage of speech, crying out of idolatry, blasphemies and abominations when as ye can show no one ground of the holy religion and worship of God which is not holden sound and entire among us, only ye rip up corruptions and spots in ceremonies, orders and circumstances, which touch not the foundation, but are such as men may err in and yet be God’s dear children and true worshippers.</p></blockquote>

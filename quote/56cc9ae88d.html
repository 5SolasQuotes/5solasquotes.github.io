<main class="wrap"><figure class="quote" id="q-56cc9ae88d" data-kw="">
<blockquote><p>If a man desire to have his wife chaste both in body and mind, and cannot love her if she hath given away her love and settled her heart upon another, or that she hath yielded or permitted him (I say) not her whole body, but only her mouth to kiss her, or her neck, or arms to embrace her: Think we that Jesus Christ desireth not his spouse to be much more pure both in body and mind: Think, we that he can abide that we should dedicate our heart to any other than to him: Think we that he delighteth, that we should make this body a member of an harlot, a temple of Idols, and of the Devil, and a brothel house of Satan, whereof Jesus is the head, and which he hath consecrated &amp; sanctified as a sovereign bishop, to be the temple of God and dwelling house of the holy Ghost: Think we that he can abide that we should come every day in his sight, and humble our selves before the strumpet of Babylon and do reverence to Baal, &amp; kiss strange gods, &amp; pollute all the members of our body through such fornications &amp; adulteries:

We may perceive it by that which is written in the Law. Thou shalt have none other gods before me, nor in my presence. Thou shalt doe no homage nor reverence to Images. He doth not forbid us only to settle our hearts thereon, But that we should not bow down or make any sign of honour or reverence to them at all: The husband, who that after he hath reconciled his wife to him, should see her frequent the house of the adulterer that seduced her, and see her every day in his arms kissing her, embracing her, and dallying with her, what account could be make of her, but that she is a false, impudent, and desperate strumpet: And if she were an honest woman should she not abhor, even to see him or his house, or to hear talk of him: Ought she not to fear (if she were not too impudent or over much ingrateful) to cast her eyes towards him, whether it were in presence or absence of her husband: Ought she not to fear to provoke him against her, and to give occasion as well to him as to all others, to have some evil opinion and suspicion of her, which might redound to the dishonesting, and defaming as well of her as of her husband.

Ought we not to content our selves to have lived so long &amp; been conversant in the brothel house of Satan, and to have continued in our fornications and adulteries; but that we must return thither again every day and every hour, as though of set purpose we had determined to provoke the Lord to jealousy &amp; to anger, making our members servants to all filthiness, uncleanness, idolatry and superstition: how is it possible that we should acknowledge the great grace and mercy, that God hath bestowed on us, in withdrawing us out of this sink full of blasphemies and abominations, in stead of rejecting us and casting us of, as an Adulteress which hath violated and broken her faith to her husband, and that we make so light account to be conversant always with our old companions, and to serve them, with so great dishonour to our true Spouse Jesus Christ.

Wherefore I greatly marvel that such kind of spirits are to be found amongst those which will have the names to follow the gospel, and to be counted of the number of Disciples of Christ Jesus, which dare yet maintain that the faithful and those to whom God hath revealed the truth of his Gospel may communicate with idolaters and superstitious persons, in their idolatries, and superstitions, and be partaker, of the tables of Devils, whereunto we cannot approach without overthrowing the table of Christ Jesus: I tremble when I heart that such speeches passe, from the mouths of those which boast themselves of the Gospel, and so much the more, for that so boldly, they dare give that council to others: for their opinions are so far contrary to truth, and so strange to any good Christian heart, that it were better such men had never heard speak of Christ Jesus nor his religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the faithful necessary for all the children of God: especially in the so dangerous days</cite>, trans. F. H. (London: Tobie Smith, 1582), unpaginated.</span></figcaption>

<blockquote><p>I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.</p></blockquote>

<blockquote><p>So that as God made all things in six days: so we may use them six days, as Adam did in the garden: and as the Lord rested from his works of creation, though not from his work of providence and administration, so must we set a part this day, to look for a special blessing and special benediction of God his worship, because of his own promise and institution. Why did the Lord this to our first father? He beheld the works of every day, and blessed every day? We must note, that he gave a special blessing above the other days, unto this day.

Now therefore admit that a man should grant this much to a heretic, that we should be as perfect as Adam in his innocence: (which is a manifest heresy) yet they must grant, that we stood in need of the word and Sacraments, (the use whereof they deny) seeing Adam had need of the use of all these things, being yet without sin. We therefore oppose thus much unto them, that so long as they will acknowledge a need of corporal helps, by calling for meat, sleep, apparel: so long their souls stand in need of spiritual means, as of the word, Sacraments and prayer, because their souls must as well be preserved, as their bodies nourished.

Our first father then had a Sabbath to be put in mind of the Creator, and that without distraction he might the better be put in mind of the glorious kingdom to come, that more freely he might give himself to meditation, and that he might the better glorify God in six days. As the heretics then deny the necessity of the word, prayer and Sacraments: so we look for a new heaven, and a new earth, and then we hope and acknowledge, that we shall keep a continual Sabbath. But in the meantime, seeing the Sabbath which we now have, was before sin, we, since sin came into the world, have much more need of it, because that which was needful to continue Adam in innocence, is also as needful to recover us, and to continue us in our recovery. The Lord then having sanctified this day, it is not our day, but the Lord his own day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

— Richard Greenham, A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+that+as+God+made+all+things+in+six+days%3A+so+we+may+use+them+six+days%2C+as+Adam+did+in+the+garden%3A+and+as+the+Lord+rested+from+his+works+of+creation%2C+though+not+from+his+work+of+providence+and+administration%2C+so+must+we+set+a+part+this+day%2C+to+look+for+a+special+blessing+and+special+benediction+of+God+his+worship%2C+because+of+his+own+promise+and+institution.+Why+did+the+Lord+this+to+our+first+father%3F+He+beheld+the+works+of+every+day%2C+and+blessed+every+day%3F+We+must+note%2C+that+he+gave+a+special+blessing+above+the+other+days%2C+unto+this+day.%0A%0ANow+therefore+admit+that+a+man+should+grant+this+much+to+a+heretic%2C+that+we+should+be+as+perfect+as+Adam+in+his+innocence%3A+%28which+is+a+manifest+heresy%29+yet+they+must+grant%2C+that+we+stood+in+need+of+the+word+and+Sacraments%2C+%28the+use+whereof+they+deny%29+seeing+Adam+had+need+of+the+use+of+all+these+things%2C+being+yet+without+sin.+We+therefore+oppose+thus+much+unto+them%2C+that+so+long+as+they+will+acknowledge+a+need+of+corporal+helps%2C+by+calling+for+meat%2C+sleep%2C+apparel%3A+so+long+their+souls+stand+in+need+of+spiritual+means%2C+as+of+the+word%2C+Sacraments+and+prayer%2C+because+their+souls+must+as+well+be+preserved%2C+as+their+bodies+nourished.%0A%0AOur+first+father+then+had+a+Sabbath+to+be+put+in+mind+of+the+Creator%2C+and+that+without+distraction+he+might+the+better+be+put+in+mind+of+the+glorious+kingdom+to+come%2C+that+more+freely+he+might+give+himself+to+meditation%2C+and+that+he+might+the+better+glorify+God+in+six+days.+As+the+heretics+then+deny+the+necessity+of+the+word%2C+prayer+and+Sacraments%3A+so+we+look+for+a+new+heaven%2C+and+a+new+earth%2C+and+then+we+hope+and+acknowledge%2C+that+we+shall+keep+a+continual+Sabbath.+But+in+the+meantime%2C+seeing+the+Sabbath+which+we+now+have%2C+was+before+sin%2C+we%2C+since+sin+came+into+the+world%2C+have+much+more+need+of+it%2C+because+that+which+was+needful+to+continue+Adam+in+innocence%2C+is+also+as+needful+to+recover+us%2C+and+to+continue+us+in+our+recovery.+The+Lord+then+having+sanctified+this+day%2C+it+is+not+our+day%2C+but+the+Lord+his+own+day.%E2%80%9D%0A%0A%E2%80%94+Richard+Greenham%2C+A+Treatise+of+the+Sabbath+in+The+Works+of+Richard+Greenham+%E2%80%93+Volume+Two&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdecdbbeb3b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/decdbbeb3b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/03/17/richard-greenham-on-adams-need-for-a-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>After Christ, I pray tell me, how long did the churches continue without superstitious mixtures? I doubt you will find the Church has not been long free; but we do not find separation presently and nulling of ministers. As now men should do well to give us a precept or example out of the Word where ordinances have been dispensed true for the substance, though some human mixtures have been joined to them, that therefore they were iterated [repeated].</p></blockquote>

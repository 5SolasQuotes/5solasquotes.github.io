<main class="wrap"><figure class="quote" id="q-a777c354c8" data-kw="">
<blockquote><p>8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee.

9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God.

10. Wouldst thou have more tokens of his will yet? See Him dying, hanging upon the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners should run in to Him, breathing out the breath of free grace in his very last act upon a thief that had not an hour to live; Who shall despair? who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth! corrupt heart say thou art not willing to be saved.

11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Collings</cite>, vol. 1 (London: Tomlins, 1655), A Cordial for a Fainting Soul, pp. 57–58</span></figcaption>

<blockquote><p>But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-salkeld.html">John Salkeld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Paradise</cite>, … (London: Griffin, 1617), ch. 64, pp. 319-21 Salkeld (1576–1660) was born in England, studied with Jesuits in the university of Coimbra and in Portugal, but had become a protestant again living in England by the time of this work.</span></figcaption>

<blockquote><p>Christ sets before us a picture of this kind in the character of the publican, who beats on his breast and begs for pardon with a dejected countenance. (Lk. 18:13). Thus also the sons of God throw down their prayers in that spirit of humility which springs from penitence. Then they raise their prayers by faith for when God invites them to Himself, and gives them the witness to his propitious disposition, they raise themselves up and overtop the clouds, yea, even heaven itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Daniel</cite>, 9:18</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Christ sets before us a picture of this kind in the character of the publican, who beats on his breast and begs for pardon with a dejected countenance. (Lk. 18:13). Thus also the sons of God throw down their prayers in that spirit of humility which springs from penitence. Then they raise their prayers by faith for when God invites them to Himself, and gives them the witness to his propitious disposition, they raise themselves up and overtop the clouds, yea, even heaven itself.”

<blockquote><p>I answer that, There is will in God, as there is intellect: since will follows upon intellect. For as natural things have actual existence by their form, so the intellect is actually intelligent by its intelligible form. Now everything has this aptitude towards its natural form, that when it has it not, it tends towards it; and when it has it, it is at rest therein. It is the same with every natural perfection, which is a natural good. This aptitude to good in things without knowledge is called natural appetite. Whence also intellectual natures have a like aptitude as apprehended through its intelligible form; so as to rest therein when possessed, and when not possessed to seek to possess it, both of which pertain to the will. Hence in every intellectual being there is will, just as in every sensible being there is animal appetite. And so there must be will in God, since there is intellect in Him. And as His intellect is His own existence, so is His will.</p></blockquote>

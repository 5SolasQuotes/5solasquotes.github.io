<blockquote><p>§IX. As for what regards the definition of free will; the scholastics, at least the later ones, both the Thomists and the Scotists; also the Greeks, Lutherans, and Remonstrants, and not a few of the Reformed, define free will as the power or faculty by which, with all things requisite for acting being posited, the will can act or not act, this or that, and act otherwise. Some of the Reformed, however, define free will by rational preference, by which man does what he pleases, with a preceding judgment of reason. [e.g. Turretin] But many other of the Reformed—Francis Junius, Gerhard Johann Voss, Davenant, Johann and Louis Crocius, Louis le Blanc, William Ames, Robert Baron, Johann Strangius, Richard Baxter, D. Elias Grebenitz, D. Phil. Buchius, Dn. D. Samuel Strimesius, Pierre Jurieu—out of love for truth, antiquity and ecclesiastical peace, have preferred to retain that old and accustomed definition of free will; because it, in itself, and viewed without the abuse of the Pelagians and Semi-Pelagians, contains nothing evil or inconvenient. Following their moderation, we (with the principle always being saved, from whence free will receives or has its powers, and the mode of operation of divine grace) define free will thus: Free will is the active faculty of the will, by which the will, with all things requisite for acting being posited, can act or not act, this or that, and act otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707) 25 pp. Latin, p. 7</span></figcaption>

<blockquote><p>A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), ch. 4, ‘The Will’, pp. 137-38</span></figcaption>

<blockquote><p>…yet this necessity of sinning, incident to all that are brought forth into the world, in massa peccati et perditionis, in the mass of original sin and perdition, is not such either in their, or our opinion, as whereby they cannot but sin; although they would abstain from it; though this be obtruded upon us as it was upon Remigius: whereupon he pleads for himself, and such as were of his mind in the doctrine of predestination after this manner, p 53: Nemo it a sentit aut dicit quod Dei praedestinatio aliquem invitum faciat peccare, ut jam non propriae voluntatis perversitate sed Divinae praedestinationis necessitate peccare videatur. ‘No man’ (says he) ‘does so think or speak as if God’s predestination made a man to sin against his will, in such sort as he should seeme to sin, not through the perverseness of his own will, but by the necessity of divine predestination.’ So say we; neither is this impotency of doing good, anywhere else, but in the corruption of the will, it being a moral impotency according to that of Saint Augustine, Libertas sine gratia non est libertas sed contumacia; ‘Liberty without grace, is not liberty, but wilfullness,’ and Remigius, Histor: Gottescal, p. 29, Ex quibus (says he) speaking of reprobates: Nemo potest salvari, non propter violentiam aliquam Divinae potestatis, sed propter indomabilem et perseverantem nequitiam suae iniquitatis. ‘Not one of them can be saved, not because of any violence of divine power, but by reason of the untameable and persevering naughtiness of their own iniquity.’ and p. 144: De reprobis nullum salvari ullatenus existimavi, non quia non possunt homines de bono ad malum commutari et de malis ac pravis boni ac recti fieri, sed quia in meliùs mutare noluerunt, et in pessimis operibus usque ad fiaē perseverare voluerunt. ‘None of the reprobates do we judge to be saved, not because they could not be changed from evil to good, and of evil and depraved become good and right, but because they would not be changed into better and would to the end persevere in wicked works.’ So then they could be changed but would not: But in what respect is it said they could be changed? was it in respect of the freedom of their wills without grace? Nothing less; see his own words, p. 34: Si dixisset generaliter, nemo hominum sine Dei gratia libero bene uti potest arbitrio, esset catholicus: ‘Had he said generally that no man can rightly use his free will, without the grace of God, he had been a catholic.’ But all the question is about the manner how this grace does work (to wit) whether God gives men grace to believe and repent if they will, and leaves to them to perform the act of faith and repentance; or whether God works the very act of faith and repentance, not to dispute of this point out of God’s Word, which clearly teaches that God works in us the will and the deed, according to his good pleasure, Phil. 3:13. And that he makes us perfect to every good work, working in us that which is pleasing in his sight through Jesus Christ. (Heb. 13:21) Let us take notice of the discourse between Hincmarus and Remigius on this argument that till the love of God comes, man is dead, his will is dead to that which is good. Now love is only given to the believers, posse charitatem habere naturae est hominum, charitatem autem habere gratiae est fidelium. (Of the Predestination of the Saints, ch. 5) For thus writes Hincmarus, p. 3.113: Bonum quod agimus et Dei est et nostrum, Dei per praevenientem gratiam, nostrum per subsequentē liberam voluntatem. ‘The good that we do is both God’s work and ours; of God by grace preventing, ours by free will following.’ To this Remigius answers and first he says Hincmarus discourses after such a manner as if a good work were partly God’s work and partly ours; and again as if the beginning of a good work were God’s, but the effect thereof of man’s free will; although as he (Hincmarus) does endeavor to temper this speech of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653) | Book 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, pp. 14-15</span></figcaption>

ch of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;”

3A+De+reprobis+nullum+salvari+ullatenus+existimavi%2C+non+quia+non+possunt+homines+de+bono+ad+malum+commutari+et+de+malis+ac+pravis+boni+ac+recti+fieri%2C+sed+quia+in+meli%C3%B9s+mutare+noluerunt%2C+et+in+pessimis+operibus+usque+ad+fiae%CC%84+perseverare+voluerunt.+%E2%80%98None+of+the+reprobates+do+we+judge+to+be+saved%2C+not+because+they+could+not+be+changed+from+evil+to+good%2C+and+of+evil+and+depraved+become+good+and+right%2C+but+because+they+would+not+be+changed+into+better+and+would+to+the+end+persevere+in+wicked+works.%E2%80%99+So+then+they+could+be+changed+but+would+not%3A+But+in+what+respect+is+it+said+they+could+be+changed%3F+was+it+in+respect+of+the+freedom+of+their+wills+without+grace%3F+Nothing+less%3B+see+his+own+words%2C+p.+34%3A+Si+dixisset+generaliter%2C+nemo+hominum+sine+Dei+gratia+libero+bene+uti+potest+arbitrio%2C+esset+catholicus%3A+%E2%80%98Had+he+said+generally+that+no+man+can+rightly+use+his+free+will%2C+without+the+grace+of+God%2C+he+had+been+a+catholic.%E2%80%99+But+all+the+question+is+about+the+manner+how+this+grace+does+work+%28to+wit%29+whether+God+gives+men+grace+to+believe+and+repent+if+they+will%2C+and+leaves+to+them+to+perform+the+act+of+faith+and+repentance%3B+or+whether+God+works+the+very+act+of+faith+and+repentance%2C+not+to+dispute+of+this+point+out+of+God%E2%80%99s+Word%2C+which+clearly+teaches+that+God+works+in+us+the+will+and+the+deed%2C+according+to+his+good+pleasure%2C+Phil.+3%3A13.+And+that+he+makes+us+perfect+to+every+good+work%2C+working+in+us+that+which+is+pleasing+in+his+sight+through+Jesus+Christ.+%28Heb.+13%3A21%29+Let+us+take+notice+of+the+discourse+between+Hincmarus+and+Remigius+on+this+argument+that+till+the+love+of+God+comes%2C+man+is+dead%2C+his+will+is+dead+to+that+which+is+good.+Now+love+is+only+given+to+the+believers%2C+posse+charitatem+habere+naturae+est+hominum%2C+charitatem+autem+habere+gratiae+est+fidelium.+%28Of+the+Predestination+of+the+Saints%2C+ch.+5%29+For+thus+writes+Hincmarus%2C+p.+3.113%3A+Bonum+quod+agimus+et+Dei+est+et+nostrum%2C+Dei+per+praevenientem+gratiam%2C+nostrum+per+subsequente%CC%84+liberam+voluntatem.+%E2%80%98The+good+that+we+do+is+both+God%E2%80%99s+work+and+ours%3B+of+God+by+grace+preventing%2C+ours+by+free+will+following.%E2%80%99+To+this+Remigius+answers+and+first+he+says+Hincmarus+discourses+after+such+a+manner+as+if+a+good+work+were+partly+God%E2%80%99s+work+and+partly+ours%3B+and+again+as+if+the+beginning+of+a+good+work+were+God%E2%80%99s%2C+but+the+effect+thereof+of+man%E2%80%99s+free+will%3B+although+as+he+%28Hincmarus%29+does+endeavor+to+temper+this+speech+of+his%2C+by+the+addition+of+grace%2C+not+by+the+fulness+of+it%3B+gratiae+adjunctione+non+etiam+plenitudine%2C+%E2%80%98by+the+adjunction+of+grace%2C+not+also+by+the+fulness+of+it.%E2%80%99+So+he+should+have+done%2C+says+Remigius%2C+cum+vere+totum+sit+Dei%3B+seeing+indeed+the+whole+is+God%E2%80%99s+work%3B+As+the+truth+itself+says%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+the+apostle%2C+%E2%80%98What+hast+thou+that+that+thou+hast+not+received%3F%E2%80%99+Whence+the+blessed+and+glorious+martyr+Cyprian+has+so+defined+it%2C+saying+we+must+glory+in+nothing%2C+seeing+nothing+is+ours%2C+and+concludes+thus%3A+Bonum+itaque+nostrum+totum+Dei+est%2C+quia+totum+est+ex+Deo%3B+et+nihil+boni+nostri%2C+nostrum+est%2C+quia+nihil+boni+nostri+est+ex+nobis.+%E2%80%98Therefore+our+good+works+are+wholly+God%E2%80%99s%2C+and+no+good+of+ours+is+ours%2C+because+it+is+not+of+us.%E2%80%99+And+to+reconcile+this+seeming+contradiction%2C+in+calling+it+our+good%2C+yet+denying+it+to+be+from+us%2C+he+concludes+thus%3A+omne+bonum+nostrum%2C+et+totum+Dei+est%2C+donando%3B+et+totum+nostrum+est%2C+accipiendo.+%E2%80%98Every+good+thing+of+ours+is+wholy+God%E2%80%99s+in+as+much+as+He+gives+it%2C+and+it+becomes+ours+full+and+whole%2C+for+as+much+as+we+receive+it.%27%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29+%7 </figure><figure class="quote" id="q-c4b9695639" data-kw="">
<blockquote><p>Yet God tempers the severity of this spiritual slavery, first inwardly, by certain remaining shards of the divine image and original righteousness (James 3:9): first with respect to wisdom in the intellect, when he leaves to it certain principles of truth, through which man’s judgment, both theoretical and practical, is directed, the prior through the knowledge of what is speculatively true and false, for example, that God exists, and so forth, which we observed in all people who are not thoroughly demented (Rom. 1:19–21, 32; 2:14–15), but the latter through the knowledge of what is upright and fair, and what is unfair, for example, that God must be worshipped, that to each must be rendered his own, that to another must not be done what you do not want done to yourself (Rom. 2:15), from which things the natural conscience receives some force (Rom. 2:15). Then with respect to some inclination and propensity to good in the will, one that is indeed frail and dead, but yet not absolutely non-existent, and indeed such a one as that at least the appearances of virtues are approved and honored by all (2 Tim. 3:5). In addition to these things, with regard to both intellect and will, there is, internally, restraining grace, by which sin itself is not removed or diminished, but its action is curbed so that it would not burst its restraint, a grace also by which the more upright at least abhor more atrocious sins (1 Cor. 5:1); then externally, through certain political, ecclesiastical, economic, and academic remedies, by which in some measure the license of sin is restrained, and indeed there is added a stimulus to perform upright deeds.</p></blockquote>

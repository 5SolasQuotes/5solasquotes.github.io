<blockquote><p>The sin of Adam does pass to his posterity by two means, by imputation and propagation.</p></blockquote>

<blockquote><p>11. There are two parts of this [original] sin: the former is the defection from God in the loins of Adam; the latter is the pravitas (depravity) that followed that defection. Hence it happens that original sin is said to be both inherent and imputed. 12. Imputed sin is that disobedience or defection of Adam, which was imputed to all his posterity who were in his loins, because they were in Adam as in their stock and root. For it is most just before God, and indeed it is received among all nations, that what the head does is deservedly imputed to the whole body, and that children are despoiled of all paternal goods on account of the father’s rebellion. But the case is not the same for other sins of parents, which, because they are truly personal, are therefore not transfused into their children. 13. The sin of Adam in the very act of his sinning is indeed alien from us, because we were not yet in act, but only in potentiality (δυνάμει) and originally in his loins; but with respect to the nature common to us and to him, it is proper to each. Therefore, we are punished not on account of the sin of Adam, but on account of our own which is in reality inherent in us. Just as someone infected in a time of contagion infects others, and the infected die; he who dies, dies not on account of the plague of another, but on account of his own. … 23. As to the mode by which this sin is derived into posterity, we confess that this cannot be explained with sufficient precision. Augustine advises that nothing should be rashly asserted in such a question; and certainly, one should rather ask by what way we can escape from that evil, than how it has come down to us. 24. It must be known, however, that it is not transferred to us only by custom or by example and imitation of the sin of the first parents, as the Pelagians contended, for those who cannot imitate the sins of others also die and are judged (Rom. 5:14); but by propagation and natural traduction, we who are born such as Adam was after the sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), p. 5 Latin Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>

</figure><figure class="quote" id="q-a4595f704a" data-kw="Original Sin Author of sin">
<blockquote><p>Although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.</p></blockquote>

<blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</span></figcaption>

</figure><figure class="quote" id="q-3a7960a975" data-kw="">
<blockquote><p>Canon 10: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head androot with the whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty. Canon 11: For a double reason, therefore, man, because of sin, is by nature, and hence from his birth, before committing any actual sin, exposed to God’s wrath and curse; first, on account of the transgression and disobedience which he committed in the loins of Adam; and, secondly, on account of the consequent hereditary corruption implanted to his very conception, whereby his whole nature is depraved and spiritually dead; so that original sin may rightly be regarded as twofold, imputed sin and inherent hereditary sin. Canon 12: Accordingly we can not, without harm to the Divine truth, agree with those who deny that Adam represented his posterity by God’s intention, and that his sin is imputed, therefore, immediately to his posterity; and under this mediate and consequent imputation not only destroy the imputation of the first sin, but also expose the doctrine of hereditary corruption to grave danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/contra-mediate-imputation.html">Contra Mediate Imputation</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, 1675</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

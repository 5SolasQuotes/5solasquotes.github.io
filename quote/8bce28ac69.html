<blockquote><p>§7. Differing opinions or practices about things indifferent, no nor about the mere integrals of religion [those things which complete religion and make it whole], which are not essentials, do not make men of different religions or Churches (universally considered). (Rom. 14 &amp; 15; Gal. 2:13-15; Phil. 3:16-17) §8. Nothing will warrant us to separate from a church as no church, but the want [lack] of something essential to a church. §9. The essential or constitutive parts of the Church-catholic (or universal) are Christ the Head and all Christians as the members. (Eph. 1:22 &amp; 4:15; Col. 1:18 &amp; 2:19; 1 Cor. 12:27; Eph. 4:12 &amp; 5:23; Mt. 28:19; 1 Cor. 5) … §13. He that does not nullify or unchurch a church, may lawfully remove from one church to another, and make choice of the best and purest, or that which is most suited to his own edification, if he be a free-man. §14. But in case of such choice or personal removal, the interest of the whole Church, or of religion in common, must be first taken into consideration by him that would rightly judge of the lawfulness of the fact. (Rom. 9:3; 1 Cor. 12:25-26) §15. If a Church which in all other respects is purest and best, will impose any sin upon all that will have local communion with it, though we must not separate from that Church as no Church, yet must we not commit that sin, but patiently suffer them to exclude us from their communion. (Rom. 3:8) §16. True heresy (that is, an error contradictory to an essential article of the Christian Faith) if it be seriously and really held, so that the contrary truth is not held seriously and really, does nullify the Christianity of him that holds it, and the Church-state of that congregation which so professes it. But so does not that fundamental error which is held but in words through ignorance, thinking it may consist with the contrary truth, while that truth is not denied, but held majore fide [with greater faith]; so that we have reason to believe that if they did discern the contradiction, they would rather forsake the error than the truth. (Tit. 3:10; 2 Jn. 10; Heb. 5:11-12; 1 Cor. 15:1-2, etc. Lk. 18:34; Jn. 12:16; Gal. 5:2 &amp; 1:7-9 &amp; 3:1-2; In isto factiosissimo soeculo, vix quisquam eximie doctus haereseos suspicione carebat. [In that most partisan age, scarcely anyone who was exceptionally learned was free from suspicion of heresy.] Erasmus in The Life of Jerome. Et profecto ita est, ut id habendum sit antiquissimum et Deo proximum, quod sit optimum. [And indeed it is so: that which is best must be regarded as both the most ancient and the closest to God.] Cicero, Of Laws, bk. 2, p. 244)</p></blockquote>

<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

<blockquote><p>And in the Acts we read that the faithful continued in the doctrine of the apostles, in the communion and breaking of bread, and in prayers (Acts 2:42), which is no other thing but a brief description of the true Church of Christ, instructed by the Word, in true faith and knit together in true charity, through the communion that is in Him. The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And in the Acts we read that the faithful continued in the doctrine of the apostles, in the communion and breaking of bread, and in prayers (Acts 2:42), which is no other thing but a brief description of the true Church of Christ, instructed by the Word, in true faith and knit together in true charity, through the communion that is in Him. The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.”

— Philip Mornay, A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+in+the+Acts+we+read+that+the+faithful+continued+in+the+doctrine+of+the+apostles%2C+in+the+communion+and+breaking+of+bread%2C+and+in+prayers+%28Acts+2%3A42%29%2C+which+is+no+other+thing+but+a+brief+description+of+the+true+Church+of+Christ%2C+instructed+by+the+Word%2C+in+true+faith+and+knit+together+in+true+charity%2C+through+the+communion+that+is+in+Him.+The+which+thing+St.+Ambrose+teaches+us+saying+%28De+Salubr.%2C+ch.+7%29%2C+that+the+catholic+Church+is+that+where+God+speaks+with+his+servants%3A+and+St.+Augustine+also+%28contra+Cresco.+Gramat.%2C+bk.+%E2%80%A2%2C+ch.+11+etc.%29%2C+where+He+places+the+ministry+of+ministers+and+pastors+of+the+Church%2C+in+the+Word+of+God+and+sacraments.+Let+us+yet+add+hereunto+the+third+mark+of+this+Church%2C+albeit+it+be+not+of+the+substance%2C+but+outward%2C+to+wit%2C+the+lawful+vocation+of+pastors+and+ministers+of+the+Church%2C+which+have+the+administration+of+the+things+aforesaid.%E2%80%9D%0A%0A%E2%80%94+Philip+Mornay%2C+A+Notable+Treatise+of+the+Church+in+which+are+handled+all+the+Principal+Questions+that+have+been+moved+in+our+Time+concerning+that+matter+%5Bin+controversy+with+Romanism%5D+%28London%3A+Barker%2C+1579%29%2C+ch.+2%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89bdd6d968.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89bdd6d968.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=And%20in%20the%20Acts%20we%20read,the%20administration%20of%20the%20things%20aforesaid&amp;text=And%20in%20the%20Acts%20we%20read%20that%20the&amp;text=which%20have%20the%20administration%20of%20the%20things%20aforesaid" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74e165a50d" data-kw="">
<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>

<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>

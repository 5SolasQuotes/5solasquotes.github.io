<main class="wrap"><figure class="quote" id="q-feaede9d94" data-kw="">
<blockquote><p>A holy, a prudent silence under affliction doth not exclude and shut out a sense and feeling of our afflictions. Ps. xxxix. 9, though he ‘was dumb, and laid his hand upon his mouth,’ yet he was very sensible of his affliction: verses 10, 11, ‘Remove thy stroke away from me, I am consumed by the blow of thine hand. When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man is vanity.’ He is sensible of his pain as well as of his sin; and having prayed off his sin in the former verses, he labours here to pray off his pain. Diseases, aches, sicknesses, pains, they are all the daughters of sin, and he that is not sensible of them as the births and products of sin, doth but add to his sin and provoke the Lord to add to his sufferings, Isa. xxvi. 9-11.

No man shall ever be charged by God for feeling his burden, if he neither fret nor faint under it. Grace doth not destroy nature, but rather perfect it. Grace is of a noble offspring; it neither turneth men into stocks nor to stoics. The more grace, the more sensible of the tokens, frowns, blows, and lashes of a displeased Father. Though Calvin, under his greatest pains, was never heard to mutter nor murmur, yet he was heard often to say, ‘How long, Lord, how long?’ A religious commander being shot in battle, when the wound was searched, and the bullet cut out, some standing by, pitying his pain, he replied, Though I groan, yet I bless God I do not grumble. God allows his people to groan, though not to grumble. It is a God-provoking sin to be stupid and senseless under the afflicting hand of God. God will heat that man’s furnace of affliction sevenfold hotter, who is in the furnace but feels it not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 306-07.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-c753238167" data-kw="">
<blockquote><p>When God brings any great calamity upon us, he means us to feel it. He designs that we should be humbled, that we should mourn and pray. It is thus that he makes our trials the means of good. If we harden our hearts under his chastening hand; if we refuse to mourn and to humble ourselves in his sight, our afflictions become punishments, and work out for us only evil, however they may minister to the good of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>President Lincoln in Biblical Repertory and Princeton Review</cite></span></figcaption>

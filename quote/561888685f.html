<main class="wrap"><figure class="quote" id="q-561888685f" data-kw="">
<blockquote><p>‘Complying’ also is an ambiguous word: if it mean an approbation of any sin, so no man must comply. If it mean communicating in good where there is a faulty mixture of some evil, so he that will not comply must join with no Church and with no man living.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>And shall endeavor to bring the churches of God in the three kingdoms to the nearest conjunction and uniformity in religion, confession of faith,” etc. The solemn League and Covenant was sworn in the year 1643, the Confession of Faith was sent hither and approven by the Assembly not till the year 1647, for which see the Act of assembly, printed before the Confession. And can we think, that those who, in pursuance of the [Solemn League and] covenant, framed this Confession of Faith, to declare to the world the faith of covenanters, would so juggle, as to put in articles of faith which would bind others, but not themselves?</p></blockquote>

</figure><figure class="quote" id="q-9cb473f394" data-kw="">
<blockquote><p>…especially seeing his Majesty shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>

</figure><figure class="quote" id="q-41b1fa392b" data-kw="">
<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God: the power that is, must be from God; the magistrate, as magistrate, is good in nature of office, and the intrinsic end of his office (Rom. 13:4), ‘for he is the minister of God for thy good;’ and, therefore, a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power; and is no more from God, but from sinful nature and the old serpent, than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843) | question 9, p. 34</span></figcaption>

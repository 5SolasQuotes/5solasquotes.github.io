<blockquote><p>The binder of conscience is either proper or improper. Proper is that thing which has absolute and sovereign power in itself to bind the conscience. And that is the Word of God written in the books of the Old and New Testament. Reason 1. He which is the Lord of [???] by his Word and laws binds conscience: but God is the only Lord of conscience, because He once created it, and He alone governs none but He knows it. Therefore his Word and laws only bind conscience properly.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-993670cede" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>

<blockquote><p>To open this, consider, That there is a twofold original fountain of Righteousness towards man:

1. There is the immediate command and word of God, and that is called Jus Divinum, Divine Righteousness.

2. There is the Law and Command of Nature, and that is Jus Humanum, An humane Righteousness, or Right: And this is either general, the first and immediate principles of nature, such as the apostle speaks of, Rom. 1, concerning the gentiles, that they had ‘a Law written in their hearts,’ [sic] verse 7 [2:14-15], about just and unjust things, and their consciences accusing or excusing, upon the omission or commission of such things, or else they are more remote and particular dictates, such as the good and wholesome laws of all lawgivers, in respective nations. So what is righteous and just between man and man, is to be determined by the laws of that land where they live: Indeed, if any lawgivers (as some heathenish have) commanded or allowed anything that is against the Law of God, or the universal dictates of right reason; such commands are not worthy the name of laws, they are rather unjust decrees, and so do not bind: But otherwise, the laws of a land determine what is righteous and just between man and man: for although it be God’s command, that a man should not steal, yet they are human laws that give the bounds and proprieties of estates to men: So that we Christians, and the Jews, do something differ about the rules of righteousness and equity; for God was the immediate Lawgiver unto that people: Moses as a messenger from God, received from God’s mouth the Judicial Law, which he delivered to them; so that the Judicial Law appointed by God Himself, was the statute-law of that realm: Their Laws were not human, as all the laws of kingdoms and states are since Christ’s coming, but they were Divine: Their laws about a thief, a murderer, the buyer and the seller, were all Divine laws, because immediately commanded by God, though the matter was merely human. Now its greatly disputed how far these Judicial Laws commanding judgement and justice between man and man, do bind us Christians; and whether all lawgivers and statesmen, are not bound to bring in those Judicial Laws? For who can determine what is righteousness and equity better then God, a righteous and wise God? It’s not pertinent to wade into this excellent question at this time: Though some in this point are very rigid, to make all obligatory, that are not expressly repealed by Christ; and some again are very remiss and lax; yet all conclude that the Moral Equity and Reason that was in every Judicial Law, does bind Christians as well as Jews; and with that we shall conclude this particular, whatsoever law God made about justice, restitution or punishment to the Jews, the equity and reason of that law, does still bind us, though not the particular manner. As for the New Testament, Christ’s Kingdoms was not temporal, or of this world; and therefore He only commands righteousness in the general, and commands that excellent maxim, which an heathen emperor did so much admire, saying, he received it from Christians, ‘What ye would have men do to you, do ye to them, for this is the Law and the Prophets,’ Mt. 7:12… Christ therefore He has only given us general rules of righteousness, and for the particulars, He does command Christians to obey and submit to the wholesome laws of that place where they are; as Rom. 13, ‘Pay tribute to whom tribute, custom to whom custom:’ And this the Scripture does often press, that none might think that the freedom they had by Christ did take them off from human obligations and relations: This was a great temptation, they thought because they were Christians, and made free by Christ, that this also did take them off from obedience to civil magistrates, and from the laws they lived under: No, the Scripture is diligent to teach this, That Christianity and the Gospel does not abolish political and civil government, but rather greatly advances it as an institution of God, pressing obedience thereunto for conscience sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), pp. 565-66</span></figcaption>

<blockquote><p>4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.”

— Samuel Rutherford, Lex Rex… (1646), Question 23, pp. 106-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+That+which+is+the+garland+and+proper+flower+of+the+King+of+kings%2C+as+He+is+absolute+above+his+creatures%2C+and+not+tied+to+any+law%2C+without+Himself+that+regulates+his+will%2C+that+must+be+given+to+no+mortal+man+or+king+except+we+would+communicate+that+which+is+God%E2%80%99s+proper+due+to+a+sinful+man%2C+which+must+be+idolatry.+But+to+do+royal+acts+out+of+an+absolute+power+above+law+and+reason%2C+is+such+a+power+as+agrees+to+God%2C+as+is+evident+in+positive+laws+and+in+acts+of+God%E2%80%99s+mere+pleasure%2C+where+we+see+no+reason+without+the+Almighty+for+the+one+side+rather+than+for+the+other%2C+as+God%E2%80%99s+forbidding+the+eating+of+the+Tree+of+Knowledge+makes+the+eating+sin+and+contrary+to+reason%3B+but+there+is+no+reason+in+the+object%3B+for+if+God+should+command+eating+of+that+tree%2C+not+to+eat+should+also+be+sin.+So+God%E2%80%99s+choosing+Peter+to+glory+and+his+refusing+Judas%2C+is+a+good+and+a+wise+act%2C+but+not+good+or+wise+from+the+object+of+the+act%2C+but+from+the+sole+wise+pleasure+of+God%3B+because%2C+if+God+had+chosen+Judas+to+glory+and+rejected+Peter%2C+that+act+had+been+no+less+a+good+and+a+wise+act+than+the+former.+For+when+there+is+no+law+in+the+object+but+only+God%E2%80%99s+will%2C+the+act+is+good+and+wise%2C+seeing+infinite+wisdom+cannot+be+separated+from+the+perfect+will+of+God%3B+but+no+act+of+a+mortal+king%2C+having+sole+and+only+will%2C+and+neither+law+nor+reason+in+it%2C+can+be+a+lawful%2C+a+wise%2C+or+a+good+act.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%E2%80%A6+%281646%29%2C+Question+23%2C+pp.+106-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3dca8c4bdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3dca8c4bdb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text=4.%20

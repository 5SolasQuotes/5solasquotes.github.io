<blockquote><p>…it becometh not Mr. Hooker with Arminians and Socinians to impeach the wisdom of the Holy One, because He appoints the giving of the seals, baptism to Judas and to Magus, who have no right, true and real in foro Dei [in the court of God], in the Decree of God, and in his holy intention, as I spake [on] pp. 248, 249, to the seals, and the grace sealed; nor to the engraven Law, and God’s teaching of the heart, and to perseverance; .. Again, God giveth a right to the seals to hypocrites; that is, he commandeth the Church to give the seals to Magus, whether such really or hypocritically believe; this is a right not properly inherent in visible members, for their profession, yea, or their supposed conversion:

1. Because all saving and real right to ordinances is relative to election to glory, and flows from the merit of Christ’s death; but visible professors, as such, of whose society Magus and Judas are, have not any saving and real right, as chosen and redeemed in Christ, by grant of our [Congregationalist] Brethren.

2. A right flowing only from an external profession, and from composed hypocrisy in Magus, is no true right; a lie cannot give a true right: I offend that Mr. Hooker so anxiously contends for a charter to such bastards as Magus.

3. It is a favor to hear the Gospel and partake of the seals; and jus activum, ‘an active right’ the Church and ministers have to call and admit to the seals all who profess as Magus, that the elect in the visible Church may be converted, but it is not a right proprie dictum ne quidem Ecclesiasticum [properly said with certainty to the Church], that they have who are such hypocrites as Judas and Magus; for the command and revealed Will of God most unproperly is said to give Magus a right to the seals: Except [for] Mr. Hooker, never [a] divine so spake; the command reveals the right, but gives none. As also the right of visible professors is jus passivum, and a conditional and passive right; for Magus and Judas have no right to be visible members, or to partake of the seals, yea or to profess the Covenant and Name of God, Ps. 50:16, but upon condition of faith: for God cannot command sin and an hypocritical profession: yea, He forbids [their] treading in his courts, Isa. 1:12-13, except they repent and believe, vv. 16, 17; therefore Magus sins in professing, and in being baptized: he remaining rotten. But the Church sins not, but does the command of Christ in calling, inviting all that profess, whether they be really, or in the judgement of charity, converts or no. Which distinction not being observed, our [congregationalist] Brethren and Mr. Hooker mistake the nature of an ecclesiastical right; for the Lord in the command gives to all visible professors, such as Peter, who really believe, both the ecclesiastic and external right to the seals which He decreed to give them, and the same internal and real right which they have by faith, and no other than according to his eternal decree, they have given them in time by real believing. But for hypocrites, as Magus, they have no right ecclesiastic to the seals, but a sort of active and permissive right, by which they claim room in the visible Church, and the seals from the Church. Therefore taking the Church-visible as only visible, as contra-distinguished from the invisible and really believing: and as visibility is common to both Peter and Magus, and their external profession obvious to the eye of man, so the visible Church hath no right that is true and real to the seals. So I retort the Argument upon Mr. Hooker: True real believers, as Peter, and hypocrites, as Magus, have either one and the same Church-right to membership and seals, or another, and diverse. The same right they cannot have:

1. Because the right of truly and really believing ones, is according to the decree of election, such as the Lord ordained to be purchased to them by the merits of Christ, and also according to the Lord’s revealed Will. He who believes hath right to eat of the Tree of Life, and to membership and seals: But this right Magus and hypocrites have not, for they have no part in Christ.

2. The right that believers, as Peter and John, have, is by fulfilling of the condition. He who believes, and loves to be reformed, hath right to the Covenant, promises, to perseverance, to the anointing that teacheth all things. These are promised and decreed to them, Jer. 31:33-34 &amp; 32:38-40; Isa. 54:10-11 &amp; 59:20-21; compared with Acts 13:47-48; Jn. 6:44-46 &amp; 6:37 &amp; 10:26-27; and to them only, not to Magus and to reprobates.

3. Magus, and such like wooden and tree-legs, might claim the same life, living membership, lively and vital operations, and to have the anointing, and to be kept through faith unto salvation by the power of God, 1 Pet. 1:4 and to have the fear of God put in their hearts, that they should not depart from God, as Jer. 31:39-40, if they have the same right to membership and the seals in their substance and grace signified with sound believers. And this is most absurd.</p></blockquote>

<blockquote><p>When you [congregationalists] say that ‘a seal does not make a thing that was not, but confirm a thing that was,’ while you would seem to refute Papists, who vainly teach that sacraments do confer grace ex opere operato, by the deed done, yet do you make the sacrament but a naked sign and take part with Arminians and Socinians, whose very arguments in express words you use, for Socinius goes before you in this argument, and so does Smalcius follow him: ‘To obsignation and sealing there is required the trying of the thing, and some teaching or document; but that ceremony (a baptism) and that rite, though it be holy, does nothing to the remission of sins, but it does only shadow out, and as it were delineate and point forth remission of sins by the washing of water exponed in the Word of God.’ You say, ‘Sacraments do not make a thing that was not, but confirm a thing that was before;’ you can have no other meaning than to deny all causality and all real exhibition of grace in the sacraments: for if a sacrament make not a thing that was not before, or if God give not, and really produce, confer and exhibit grace, and a stronger measure of faith, and assurance of remission of sins, at the due and right use of the sacrament [that is with faith], the Sacrament is a naked sign, and not an exhibitive seal. But if† Christ give and in the present exhibit as surely remission of sins, as the infant is washen with water, as our divines and the Palatinate [Heidelberg] Catechism teaches, yea and the [Belgic] confession thereof, and the Synod of Dort teaches, then by the sacrament of baptism, a thing is made that which it was not. † [That is, this does not necessarily always occur, but if it does, then etc.] It is true a civil seal, as I said before, adds no new lands to the owner of the charter, but if Christ by his seals rightly and in faith used, do not only confirm grace and pardon, but also really exhibit and give grace and pardon in a further degree, and a new measure of assurance to the conscience which there was not before, you go not a streas [star’s?] breadth from Arminians and Socinians, especially seeing Episcopius, Henricus Welsingius say that remission of sins is not sealed by baptism, but signified only, and the Remonstrants in their Apology, while they expone our communion with Christ in the Lord’s Supper, and will reject a physical union of our souls with the physical substance of Christ’s body, which we also reject, they say that communion signifies, ‘only a profession of one and the same worship, whereby Christians solemnly testify that they adhere to Christ as to be partaker of the table of devils and of devils themselves, 1 Cor. 10:18,20, is a testimony of a communion with the devils’: But the Word of God says more, Gal. 3:17, ‘As many of you as are baptized have put on Christ;’ So Rom. 6:3, ‘Therefore we are buried with Him by baptism unto his death, that like as Christ was raised up from the dead, by the glory of the Father, even so we also should walk in newness of life,’ Eph. 5:26, ‘That He might sanctify and cleanse his Church with the washing of water by the Word,’ Tit. 3:5, and 1 Pet. 3:21, ‘The like figure whereunto even baptism does also now save us, etc.’ All this is more than a naked signification, otherwise manna saved Israel, and the water of the rock did wash them from their sins, and the sacrifice of bulls and goats did cleanse from sin, and open Heaven to sinners. Therefore by baptism and the Lord’s Supper something is made what it was not before, as by partaking of the table of devils, the partaker is really made a partaker with the devil, and an idolater; and his idolatry that he committed before was not only confirmed and signified to be what it was before. And in this civil seals and sacraments differ…</p></blockquote>

 pardon in a further degree, and a new measure of assurance to the conscience which there was not before, you go not a streas [star’s?] breadth from Arminians and Socinians, especially seeing Episcopius, Henricus Welsingius say that remission of sins is not sealed by baptism, but signified only, and the Remonstrants in their Apology, while they expone our communion with Christ in the Lord’s Supper, and will reject a physical union of our souls with the physical substance of Christ’s body, which we also reject, they say that communion signifies, ‘only a profession of one and the same worship, whereby Christians solemnly testify that they adhere to Christ as to be partaker of the table of devils and of devils themselves, 1 Cor. 10:18,20, is a testimony of a communion with the devils’: But the Word of God says more, Gal. 3:17, ‘As many of you as are baptized have put on Christ;’ So Rom. 6:3, ‘Therefore we are buried with Him by baptism unto his death, that like as Christ was raised up from the dead, by the glory of the Father, even so we also should walk in newness of life,’ Eph. 5:26, ‘That He might sanctify and cleanse his Church with the washing of water by the Word,’ Tit. 3:5, and 1 Pet. 3:21, ‘The like figure whereunto even baptism does also now save us, etc.’ All this is more than a naked signification, otherwise manna saved Israel, and the water of the rock did wash them from their sins, and the sacrifice of bulls and goats did cleanse from sin, and open Heaven to sinners. Therefore by baptism and the Lord’s Supper something is made what it was not before, as by partaking of the table of devils, the partaker is really made a partaker with the devil, and an idolater; and his idolatry that he committed before was not only confirmed and signified to be what it was before. And in this civil seals and sacraments differ…”

<blockquote><p>Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?</p></blockquote>

<blockquote><p>Dr. Forbess goes about to warrant private baptism by Philip’s baptizing the eunuch, there being no greater company present, so far as we can gather from the narration of Luke, Acts 8. As likewise by Paul and Silas, their baptizing the goaler [jailer] and all his in his own private house, Acts 16. Touching the first of those places, we answer:

1. How thinks he that a man of so great authority and charge was alone in his journey? We suppose a great man traveling in a chariot must have some number of attendants, especially having come to a solemn worship at Jerusalem.

2. What Philip then did, the extraordinary direction of the Spirit guided him unto it, vv. 29, 39. As to the other place, there was in that time of persecution no liberty for Christians to meet together in temples and public places as now there is. Wherefore the example of Paul and Silas does prove the lawfulness of the like deed in the like case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 6, p. 96</span></figcaption>

<blockquote><p>His second objection is that the Lord’s Supper is not given to the sick at their homes. I wish that they [the Lutherans] had gone before us in this with a purer example. Had they been careful to adapt their practice to the genuine rule of Christ, we would willingly have followed them. But since nothing is less accordant with the doctrine of our heavenly Master than that the bread should be carried about in procession like cakes in a fair, and then that one individual should receive in private and eat apart, disregarding the law of communicating, pious and learned men were from the very first much averse to private dispensations of the Supper. Nothing, therefore, can be more absurd than Westphal’s calumny, that owing to the crafty counsel of Satan, poor souls are deprived of consolation. For we [the Genevan Church] carefully recall to the remembrance of the sick the pledge of life which was once deposited with us, that they may thence confirm their faith, and borrow weapons for the spiritual combat. In short, we herein profit so far that the Supper received in the public assembly, according to the ordinance of Christ, supports them with present consolation not less effectually than if they were to enjoy it privately without communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, Second Defense of the… Sacraments, in Answer to the Calumnies of Joachim Westphal (1556) in Tracts, containing Treatises on the Sacraments… vol. 2 tr. Henry Beveridge (Edinburgh: Calvin Translation Society, 1849), pp. 320-21</span></figcaption>

<div class="actions"><button class="copy" data-copy="“His second objection is that the Lord’s Supper is not given to the sick at their homes. I wish that they [the Lutherans] had gone before us in this with a purer example. Had they been careful to adapt their practice to the genuine rule of Christ, we would willingly have followed them. But since nothing is less accordant with the doctrine of our heavenly Master than that the bread should be carried about in procession like cakes in a fair, and then that one individual should receive in private and eat apart, disregarding the law of communicating, pious and learned men were from the very first much averse to private dispensations of the Supper. Nothing, therefore, can be more absurd than Westphal’s calumny, that owing to the crafty counsel of Satan, poor souls are deprived of consolation. For we [the Genevan Church] carefully recall to the remembrance of the sick the pledge of life which was once deposited with us, that they may thence confirm their faith, and borrow weapons for the spiritual combat. In short, we herein profit so far that the Supper received in the public assembly, according to the ordinance of Christ, supports them with present consolation not less effectually than if they were to enjoy it privately without communion.”

— John Calvin, Second Defense of the… Sacraments, in Answer to the Calumnies of Joachim Westphal (1556) in Tracts, containing Treatises on the Sacraments… vol. 2 tr. Henry Beveridge (Edinburgh: Calvin Translation Society, 1849), pp. 320-21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHis+second+objection+is+that+the+Lord%E2%80%99s+Supper+is+not+given+to+the+sick+at+their+homes.+I+wish+that+they+%5Bthe+Lutherans%5D+had+gone+before+us+in+this+with+a+purer+example.+Had+they+been+careful+to+adapt+their+practice+to+the+genuine+rule+of+Christ%2C+we+would+willingly+have+followed+them.+But+since+nothing+is+less+accordant+with+the+doctrine+of+our+heavenly+Master+than+that+the+bread+should+be+carried+about+in+procession+like+cakes+in+a+fair%2C+and+then+that+one+individual+should+receive+in+private+and+eat+apart%2C+disregarding+the+law+of+communicating%2C+pious+and+learned+men+were+from+the+very+first+much+averse+to+private+dispensations+of+the+Supper.+Nothing%2C+therefore%2C+can+be+more+absurd+than+Westphal%E2%80%99s+calumny%2C+that+owing+to+the+crafty+counsel+of+Satan%2C+poor+souls+are+deprived+of+consolation.+For+we+%5Bthe+Genevan+Church%5D+carefully+recall+to+the+remembrance+of+the+sick+the+pledge+of+life+which+was+once+deposited+with+us%2C+that+they+may+thence+confirm+their+faith%2C+and+borrow+weapons+for+the+spiritual+combat.+In+short%2C+we+herein+profit+so+far+that+the+Supper+received+in+the+public+assembly%2C+according+to+the+ordinance+of+Christ%2C+supports+them+with+present+consolation+not+less+effectually+than+if+they+were+to+enjoy+it+privately+without+communion.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Second+Defense+of+the%E2%80%A6+Sacraments%2C+in+Answer+to+the+Calumnies+of+Joachim+Westphal+%281556%29+in+Tracts%2C+containing+Treatises+on+the+Sacraments%E2%80%A6+vol.+2+tr.+Henry+Beveridge+%28Edinburgh%3A+Calvin+Translation+Society%2C+1849%29%2C+pp.+320-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd6f009ea0d.html&amp;via=5S

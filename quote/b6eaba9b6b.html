<main class="wrap"><figure class="quote" id="q-b6eaba9b6b" data-kw="">
<blockquote><p>In the third clause of article first [of the Solemn League and Covenant], they engage that they “shall endeavour to bring the churches of God in the three kingdoms to the nearest conjunction and uniformity in religion.” It cannot be denied that this article is Scriptural.

All churches ought be one, because there is but one Bible. To endeavour, therefore, to bring all the churches in the three kingdoms into a state of union, to attempt to incorporate them into one harmonious body, was a most Godlike undertaking, affording full proof, that those who devised it were men of large hearts and large understandings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), p. 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ca31b729b" data-kw="">
<blockquote><p>It is a delusion to think that it is the only way to testify against what I judge amiss in the minister, to cast at this ministry, and to withdraw from him. Whosoever adopts this principle and practices it accordingly, has not the mind of Christ; for there are other patent and obvious ways to witness against all the evil of our ways besides these: Nay, this way of witnessing is such as Christ will witness against it, as not the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-321cf00249" data-kw="">
<blockquote><p>We shall here declare what offences are censurable with this greatest and last censure of excommunication, according to the order that is there prescribed, and which, as it requires, ‘that it be inflicted with great and mature deliberation, and after all other good means have been essayed;’ so it appoints in these express words: ‘That such errours in practice as subvert the Faith, or any other errours which overthrow the power of godliness; if the party who holds them spread them, seeking to draw others after him; and such sins in practice as cause the name and truth of God to be blasphemed, cannot stand with the power of godliness; and such practices, as in their own nature manifestly subvert that order, unity and peace which Christ has established in his Church; and particularly all those scandalous sins, for which any person is to be suspended from the sacrament of the Lord’s Supper, obstinately persisted in; these being publicly known, to the just scandal of the Church; The sentence of excommunication may and ought to proceed, according to the directions after following. But the persons that hold other errors in judgment, about which learned and godly men possibly may and do differ, and which subvert not the faith, nor are destructive to godliness, or that be guilty of such sins of infirmity as are commonly found in the children of God: or being otherwise sound in the Faith and holy in life (and so not falling under censure by the former rules) endeavour to keep the unity of the spirit in the bond of peace; and do yet out of conscience not come up to the observation of all those rules which are or shall be established by authority for regulating the outward worship of God and government of his Church; the sentence of excommunication for these causes shall not be denounced against them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancaster-presbyterians.html">Lancaster Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Censures of the Church Revived</cite>, … (London: Eversden, 1659) sect. 4, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-3144978610" data-kw="">
<blockquote><p>I give my testimony against that calumny cast upon presbyterians, that they are seditious and disloyal persons; the which aspersion I do abhor: Therefore I exhort all people, that they will show loyalty to the king, and all lawful magistrates, in all their just and lawful commands, insofar as their commands agree with the Word of God.</p></blockquote>

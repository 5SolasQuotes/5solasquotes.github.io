<main class="wrap"><figure class="quote" id="q-16e4b882f4" data-kw="">
<blockquote><p>2. To preach publicly as ordinary messengers, I say ‘ordinary’ because of our expectants of the ministry, who preach by the call of the Church for a time, as the sons of the prophets, while they be ordained pastors [in the time that they are in the process of being or becoming ordained]. To preach, I say, ‘publicly’, is a formal act of pastors who are sent, Rom. 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 16, p. 248</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f423a7e4c7" data-kw="">
<blockquote><p>7. A calling to the ministry is either such as wants the essentials, as gifts in any messenger, and the Churches’ consent, or these who occupy the room of the Church, the Church consenting, such a minister is to be reputed for no minister. Or. 2. An entry to a calling, or a calling, where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas who entered by favor and money, and contrary to the Law was High-Priest but for a year: yet was a true High-Priest, and prophesied as the High-Priest. 8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud, the ordinance of God is conferred upon him and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165 | pt. 2, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-7f9ea39fee" data-kw="">
<blockquote><p>29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.”

</figure><figure class="quote" id="q-ac7c6dfc76" data-kw="">
<blockquote><p>8. Vocation uneffectual is common to pagans. Vocation thoroughly effectual is of the same extent as justification, and (I think) election. Vocation which is effectual only to bring men to an outward profession of saving faith is larger than election and makes men such whom we are bound to baptize.</p></blockquote>

<blockquote><p>There is also a received distribution of theology into doctrine concerning God and the works of God. Indeed, whatever things are treated in theology are able to be referred to this double doctrine, even sin itself: which, although it is not a work of God, yet it is an accidental property of a divine work, namely, of angels and men; not concreated, but derived from elsewhere, namely, from the fall of angels and men.</p></blockquote>

<blockquote><p>XXIV. It is asked, fifth, whether infants before all use of reason are subject to actual sin… The Cartesian theologians, because they state that the rational soul is nothing except actual thought, such as is either agreeable or repugnant to the divine law, are also compelled to state that actual sin occurs also in infants… The Reformed, although they acknowledge that original corruption is actually present in infants, from which by nature they are prone to all actual sins, and moreover bear in themselves the seeds of the same, nonetheless deny that they are properly subject to any actual sin, because: (1) Scripture teaches that they do not sin according to the similitude of Adam, that is, actually. Also because (2) Scripture calls them innocent (Ps. 106:38). For since this could not be said with regard to original sin, from which they are pronounced unclean (1 Cor. 7:14), nothing remains except that they are called innocent with regard to actual sin, inasmuch as they do not discern between their right hand and their left hand ( Jonah 4:11). (3) They are said to have done neither good nor evil (Rom. 9:11). (4) To infants as such, there is no law prescribed against which they would commit that which is against the law; they recognize no law, and thus also cannot compose themselves to any law, nor deviate from any. Nevertheless they object: (1) that the imagination of man’s heart is called evil from his youth (Gen. 8:21 with 6:5). I respond, יצר in this passage means that the shape and disposition of the heart in infants is, not from actual sins, but from original corruption, only evil, from their very infancy (Prov. 22:15). (2) That the human mind consists in actual thought, which can not only be congruent with divine law, but also repugnant to it. I respond: (1) That the human mind is a thinking substance which, with organs adequately disposed, can think, we do not doubt, just as it is a reasoning substance, not because it is always reasoning in actuality, but because it can reason, with necessary things put in place. (b) If we grant that the mind in the infant thinks in actuality, yet it does not follow from this that he actually sins, because, as we have said, the infant before all use of reason does not have prescribed to him a law which could be transgressed. Nor is it valid to say that his actual thought can be not conformable, in fact repugnant, to the law, since even a goring ox’s killing of a man is materially repugnant to the law, and yet from this that ox is not properly a murderer, and does not sin by slaying him, because there is not prescribed to it a law which would be transgressed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 24</cite>, p. 511-12</span></figcaption>

</figure><figure class="quote" id="q-d3fea535f4" data-kw="">
<blockquote><p>Whether God is able to hate sin and will its existence? It is asked whether that distinction is frivolous by which we teach God to hate sin, and yet to will its existence? So says that Arminian against Perkins (p. 701). We deny: 1. Because for God to hate sin is not for God to intend that sin would never exist, as it is false that God decreed that the crucifixion of the Savior, the selling of Joseph, the carrying off of his people into captivity by the Assyrians and Chaldeans, the defecting of the ten tribes from the family of David and the spoiling of Job by the Sabeans, would not exist. 2. Because sin in itself is a disgraceful evil and an object of the displeasing and disapproving will [of God]. But truly for sin to exist is a useful good, conducing to the glory of God; and all good existing in time is from God, from the eternal decree. 3. Because in the explication of our distinction, Arminius falsely imputes to us that we teach that God wills and approves sin existing and that God does not hate sin existing. For God hates sin and hates the existence of sin in the genus of a disgraceful thing, and yet He decrees to permit that it would exist under the genus of a useful thing. 4. [William] Twisse rightly says, Marcus Cato[1] willed Carthage [an enemy city] to exist inasmuch as it was a grindstone and material exercising youth of Roman virtue, and yet he willed against it, i.e. to hate Carthage. I further add that Peter rightly willed that Christ would spare Himself, that He would not be killed by ungodly foes; and yet Christ wills against this, rightly declaring him to be of Satan; notwithstanding, Peter was bound to hate that occasion as it was sin (Mt. 16:21-23). [1] Marcus Cato the elder (234-149 B.C.) was a Roman soldier, senator and historian known for his opposition to Hellenization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Examination of Arminianism, p. 233-234, as trans. in Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter trans. Charles Johnson &amp; Travis Fentiman (1668 / 2019)</cite>, pp. 68-69</span></figcaption>

<blockquote><p>Whatever is anomon (“lawless” in the abstract) or anomia (“lawlessness”) is really sin, but not forthwith what is called “lawless” (anomon) in the concrete because it has sin in itself. In this sense, human nature is called “lawless” (anomos); not that it is sin itself, but because having sin in itself it is well called “sinful.”</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1e5b3da6f1" data-kw="">
<blockquote><p>At Sinai the covenant became a truly national covenant. The civil life of Israel was linked up with the covenant in such a say that the two could not be separated. In a large measure Church and Sate became one. To be in the Church was to be in the nation, and vice versa; and to leave the Chuch was to leave the nation. There was no spiritual excommunication; the ban meant cutting off by death. The Sinaitic covenant included a service that contained a positive reminder of the strict demands of the covenant of works. The law was placed very much in the foreground, giving prominence once more to the earlier legal element. But the covenant of Sinai was not a renewal of the covenant of works; in it the law was made subservient to the covenant of grace. This is indicated already in the introduction to the ten commandments, Ex. 20:2; Deut. 5:6, and further in Rom. 3:20; Gal. 3:24. It is true that at Sinai a conditional element was added to the covenant, but it was not the salvation of the Israelite but his theocratic standing in the nation, and the enjoyment of external blessings that was made dependent on the keeping of the law, Deut. 28:1-14. The law served a twofold purpose in connection with the covenant of grace: (1) to increase the consciousness of sin, Rom. 3:20; 4:15; Gal. 3:19; and (2) to be a tutor unto Christ, Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 4th edn, 298 (emphasis added).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-294cf7d1da" data-kw="">
<blockquote><p>Don’t make the mistake of thinking that Christians are people who never sin or feel sinful. Rather, because of their faith in Christ, God simply doesn’t attribute their sin to them. This teaching is comforting to those who have terrified consciences. For good reason, we often try to impress on people that sins are forgiven and that righteousness is attributed to believers for the sake of Christ. Similarly, Christians should not have anything to do with the law or with sin. To the extent we are Christians, we stand above the law and sin. Christ is the Lord of the law. He is present and locked in our hearts, just as a precious stone is firmly mounted in a ring. When the law accuses us and sin terrifies us, all we need to do is look to Christ. When we have taken hold of him in faith, we have the victor over the law, sin, death, and the devil with us. Because Christ rules over all of these, we won’t be harmed. That’s why a Christian, correctly defined, is free from all laws and subject to no one, either inwardly or outwardly. But notice that I said, “to the extent we are Christians,” not just to the extent we are human and have consciences. We are free to the extent we have consciences that are transformed and made rich through faith. This faith is a great and immeasurable treasure—as Paul says, an “indescribable gift” (2 Corinthians 9:15), a gift that cannot be raised high enough or praised enough. It makes us children and heirs of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone. Zondervan. Kindle Edition. 201</cite></span></figcaption>

</figure><figure class="quote" id="q-5481a13ede" data-kw="fifth commandment parents">
<blockquote><p>Among others in relation to the fifth precept, this question concerning the honoring of parents is agitated between us and the papists. In many ways, the latter weaken this precept, maintaining that children, against the consent of their parents, may not only contract marriage, but even adopt a monastic life. May children withdraw themselves from the power of their parents and marry without their consent? We deny against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.15.1</span></figcaption>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2</span></figcaption>

</figure><figure class="quote" id="q-a1bd63ace0" data-kw="judicial equity abrogation">
<blockquote><p>In that law various ends must be distinguished. For inasmuch as it was a distinction of the Jewish state from the Gentiles and a type of the kingdom of Christ, it is simply abrogated because there is no longer any distinction between the Jews and the Gentiles in Christ (Gal. 3:28; Eph. 2:14). As the Jewish state and polity has been destroyed, so there is no need of a type to adumbrate the future kingdom of Christ, since it has already come. But as to the good order or form of government of the people of God, those things which are of common and perpetual equity remain and must still be observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.26.3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9c26e91603" data-kw="">
<blockquote><p>First, faith is obedience, insofar as its proper act responds to the command of the Gospel, “Believe in the Lord Jesus”; and thus faith is obedience toward the Gospel, as the Apology of the Augsburg Confession [written by Philip Melanchthon] says. As far as the Gospel differs from the Law, so far this obedience is distinguished from that, says Mentzer. Second, faith is also obedience insofar as, by a metonymic synecdoche, it signifies the whole worship rendered by believers—the root together with its fruits (Heb. 13:7; Rom. 1:8; 1 Thess. 1:8). Nor is it doubtful that when it is said, “this is the commandment, that we believe and love” (1 Jn. 3:23), just as in the command to love both the habit of charity and the fruits and works to which that habit is ordered are commanded, so also in the command to believe, both the habit of faith and its fruits are commanded to us. Hence, since charity itself is among the fruits of faith, it comes about that the whole Christian doctrine is sometimes called the word or preaching of faith, and the whole Christian religion, the entire economy of the New Testament, is called faith (Gal. 1:23; 1 Tim. 4:6; Gal. 5:6; 3:23). Thus Luther, often understanding by “faith” chiefly and formally the apprehension of the promise in Christ and the renunciation of one’s own merit, nevertheless at the same time includes the whole obedience and inclination of the will, and love agreeing with the Gospel; and by “works,” on the contrary, he understands actions done with an opinion of merit and with the expectation of justification and eternal life as a reward due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-bergius.html">Conrad Bergius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praexi Cathol. Divin. Canon., Dissertation 7</cite>, pp. 973 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.</span></figcaption>

<blockquote><p>CXIII. Then, it seems somewhat uncertain when they [some Reformed theologians] distinguish between the act that predisposes one to justification and the act they say is formally justifying. According to the Reformed perspective, faith does not justify as a sort of form through which we are justified but rather as an instrument grasping Christ’s merit, as many say, or as a condition of the covenant of grace, which God counts as righteousness for Christ’s sake, as others prefer to say. These views, upon closer examination, converge to the same point. No one would say faith is a physical instrument of our justification; it can only intervene as a moral instrument. But faith can’t be a moral instrument of justification unless in the sense that God has promised forgiveness of sins to believers, which cannot be attained without the intervention of a living and effective faith. This is essentially the same as being a condition of the covenant of grace, wherein God offers grace and glory to believers and repentants.</p></blockquote>

<blockquote><p>That God ‘requires of sinners faith in Christ that they may be saved,’ admits of no dispute. The part assigned to faith, however, has been much controverted. Many excellent divines, in consequence of the distinction which they made between the covenant of redemption and the covenant of grace, were led to speak of faith as the condition of the latter covenant. But the term, as used by them, signifies not a meritorious or procuring cause, but simply something which goes before, and without which the other cannot be obtained. They consider faith merely as a condition of order or connection, as it has been styled, and as an instrument or means of obtaining an interest in the salvation offered in the gospel. This is very different from the meaning attached to the term by Arminians and Neonomians, who represent faith as a condition on the fulfilment of which the promise is suspended. The Westminster Assembly elsewhere affirm, that God requires of sinners faith in Christ, “as the condition to interest them in him.” But this is very different from affirming that faith is the condition of the covenant of grace. That faith is indispensably necessary as the instrument by which we are savingly interested in Christ, and personally instated in the covenant, is a most important truth, and this is all that is intended by the Westminster Divines. They seem to have used the term condition as synonymous with instrument; for, while in one place they speak of faith as the condition to interest sinners in the Mediator, in other places they affirm, that ‘faith is the alone instrument of justification,’ and teach, that ‘faith justifies a sinner in the sight of God, only as it is an instrument by which he receiveth and applieth Christ and his righteousness.’ As the word condition is ambiguous, apt to be misunderstood, and is frequently employed in an unsound and dangerous sense, it is now disused by evangelical divines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite>, 8th ed. (Glasgow: Blackie &amp; Son, 1857), pp. 91–92</span></figcaption>

<div class="actions"><button class="copy" data-copy="“That God ‘requires of sinners faith in Christ that they may be saved,’ admits of no dispute. The part assigned to faith, however, has been much controverted. Many excellent divines, in consequence of the distinction which they made between the covenant of redemption and the covenant of grace, were led to speak of faith as the condition of the latter covenant. But the term, as used by them, signifies not a meritorious or procuring cause, but simply something which goes before, and without which the other cannot be obtained. They consider faith merely as a condition of order or connection, as it has been styled, and as an instrument or means of obtaining an interest in the salvation offered in the gospel. This is very different from the meaning attached to the term by Arminians and Neonomians, who represent faith as a condition on the fulfilment of which the promise is suspended. The Westminster Assembly elsewhere affirm, that God requires of sinners faith in Christ, “as the condition to interest them in him.” But this is very different from affirming that faith is the condition of the covenant of grace. That faith is indispensably necessary as the instrument by which we are savingly interested in Christ, and personally instated in the covenant, is a most important truth, and this is all that is intended by the Westminster Divines. They seem to have used the term condition as synonymous with instrument; for, while in one place they speak of faith as the condition to interest sinners in the Mediator, in other places they affirm, that ‘faith is the alone instrument of justification,’ and teach, that ‘faith justifies a sinner in the sight of God, only as it is an instrument by which he receiveth and applieth Christ and his righteousness.’ As the word condition is ambiguous, apt to be misunderstood, and is frequently employed in an unsound and dangerous sense, it is now disused by evangelical divines.”

— Robert Shaw, An Exposition of the Confession of Faith of the Westminster Assembly of Divines, 8th ed. (Glasgow: Blackie &amp; Son, 1857), pp. 91–92">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+God+%E2%80%98requires+of+sinners+faith+in+Christ+that+they+may+be+saved%2C%E2%80%99+admits+of+no+dispute.+The+part+assigned+to+faith%2C+however%2C+has+been+much+controverted.+Many+excellent+divines%2C+in+consequence+of+the+distinction+which+they+made+between+the+covenant+of+redemption+and+the+covenant+of+grace%2C+were+led+to+speak+of+faith+as+the+condition+of+the+latter+covenant.+But+the+term%2C+as+used+by+them%2C+signifies+not+a+meritorious+or+procuring+cause%2C+but+simply+something+which+goes+before%2C+and+without+which+the+other+cannot+be+obtained.+They+consider+faith+merely+as+a+condition+of+order+or+connection%2C+as+it+has+been+styled%2C+and+as+an+instrument+or+means+of+obtaining+an+interest+in+the+salvation+offered+in+the+gospel.+This+is+very+different+from+the+meaning+attached+to+the+term+by+Arminians+and+Neonomians%2C+who+represent+faith+as+a+condition+on+the+fulfilment+of+which+the+promise+is+suspended.+The+Westminster+Assembly+elsewhere+affirm%2C+that+God+requires+of+sinners+faith+in+Christ%2C+%E2%80%9Cas+the+condition+to+interest+them+in+him.%E2%80%9D+But+this+is+very+different+from+affirming+that+faith+is+the+condition+of+the+covenant+of+grace.+That+faith+is+indispensably+necessary+as+the+instrument+by+which+we+are+savingly+interested+in+Christ%2C+and+personally+instated+in+the+covenant%2C+is+a+most+important+truth%2C+and+this+is+all+that+is+intended+by+the+Westminster+Divines.+They+seem+to+have+used+the+term+condition+as+synonymous+with+instrument%3B+for%2C+while+in+one+place+they+speak+of+faith+as+the+condition+to+interest+sinners+in+the+Mediator%2C+in+other+places+they+affirm%2C+that+%E2%80%98faith+is+the+alone+instrument+of+justification%2C%E2%80%99+and+teach%2C+that+%E2%80%98faith+justifies+a+sinner+in+the+sight+of+God%2C+only+as+it+is+an+instrument+by+which+he+receiveth+and+applieth+Christ+and+his+righteousness.%E2%80%99+As+the+word+condition+is+ambiguous%2C+apt+to+be+misunderstood%2C+and+is+frequently+employed+in+an+unsound+and+dangerous+sense%2C+it+is+now+disused+by+evangelical+divines.%E2%80%9D%0A%0A%E2%80%94+Robert+Shaw%2C+An+Exposition+of+the+Confession+of+Faith+of+the+Westminster+Assembly+of+Divines%2C+8th+ed.+%28Glasgow%3A+Blackie+%26+Son%2C+1857%29%2C+pp.+91%E2%80%9392&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78696e7bc2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78696e7bc2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=That%20God%20%E2%80%98requires%20of%20sinners%20faith,is%20now%20disused%20by%20evangelical%20divines&amp;text=That%20God%20%E2%80%98requires%20of%20sinners%20faith%20in%20Christ&amp;text=sense%2C%20it%20is%20now%20disused%20by%20evangelical%20divines" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

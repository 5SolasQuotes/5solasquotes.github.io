<main class="wrap"><figure class="quote" id="q-e969d4333a" data-kw="">
<blockquote><p>…the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.</p></blockquote>
<figcaption>— <a href="../authors/french-reformed-churches.html">French Reformed Churches</a>, <cite>The French Confession</cite>, 1559, Art. 20</figcaption>
<div class="meta"><span class="t">Nature of Saving Faith</span><span class="t">Assurance of Salvation</span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9fb981b913" data-kw="">
<blockquote><p>Here the question arises by what means are we justified? We answer with Paul, &quot;By faith only in Christ are we pronounced righteous, and not by works.&quot; Not that we reject good works. Far from it. But we will not allow ourselves to be removed from the anchorage of our salvation.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Commentary on Galatians</cite>, on 2:16, p. 55</figcaption>
<div class="meta"><span class="t">Instrumental Cause: Faith Alone</span><span class="t">Justification and Good Works</span></div>
<div class="actions"><button class="copy" data-copy="“Here the question arises by what means are we justified? We answer with Paul, &quot;By faith only in Christ are we pronounced righteous, and not by works.&quot; Not that we reject good works. Far from it. But we will not allow ourselves to be removed from the anchorage of our salvation.”

— Martin Luther, Commentary on Galatians, on 2:16, p. 55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+the+question+arises+by+what+means+are+we+justified%3F+We+answer+with+Paul%2C+%22By+faith+only+in+Christ+are+we+pronounced+righteous%2C+and+not+by+works.%22+Not+that+we+reject+good+works.+Far+from+it.+But+we+will+not+allow+ourselves+to+be+removed+from+the+anchorage+of+our+salvation.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+on+2%3A16%2C+p.+55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9fb981b913.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9fb981b913.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</figcaption>
<div class="meta"><span class="t">Faith as Instrument</span></div>

</figure><figure class="quote" id="q-98f9938805" data-kw="">
<blockquote><p>The third opinion is of those who attribute the work of justification unto God, but place their righteousness partly in their faith, as their own work, and partly in the obedience of Christ; and make two actions of God in justifying. … All these three opinions do attribute man’s righteousness, either wholly or in part, to his own working. The first and last do join grace and merit together in justification. Which things are most contrary to the truth of God</p></blockquote>
<figcaption>— <a href="../authors/john-forbes.html">John Forbes</a>, <cite>A Treatise Tending to Clear the Doctrine of Justification</cite>, 1616, p. 52</figcaption>
<div class="meta"><span class="t">Faith Not Our Righteousness</span><span class="t">Rome: Justification</span></div>

</figure><figure class="quote" id="q-fb228d71e6" data-kw="">
<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners…</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>First London Baptist Confession</cite>, 1644, Art. 25</figcaption>

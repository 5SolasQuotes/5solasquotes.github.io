<main class="wrap"><figure class="quote" id="q-e969d4333a" data-kw="">
<blockquote><p>This is, therefore, done because the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed-churches.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The French Confession</cite>, 1559, Art. 20</span></figcaption>

</figure><figure class="quote" id="q-cb098ede78" data-kw="">
<blockquote><p>True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits (Eph. 2:7–9; Rom. 3:24–25; Gal. 2:16; Acts 10:43).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 21</span></figcaption>

</figure><figure class="quote" id="q-7251b10f7e" data-kw="">
<blockquote><p>By justifying faith we understand, not only the common belief of the articles of the Christian religion, and a persuasion of the truth of God’s Word in general, but also a particular application of the gracious promises of the gospel to the comfort of our own souls, whereby we lay hold on Christ with all His benefits, having an earnest trust and confidence in God, that He will be merciful unto us for His only Son’s sake. So that a true believer may be certain, by the assurance of faith, of the forgiveness of his sins, and of his everlasting salvation by Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-ireland.html">Church of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Irish Articles</cite>, 1615, Art. 37</span></figcaption>

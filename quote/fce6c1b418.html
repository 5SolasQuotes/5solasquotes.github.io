<main class="wrap"><figure class="quote" id="q-fce6c1b418" data-kw="">
<blockquote><p>This is no separation from the Church of Scotland, either in her doctrine, worship, discipline or government, but only a departing, or going forth from her sins, backslidings and defections, as we are commanded by the Lord; and for a time only from some congregations, because of these. This is not a positive or active separation form the Church, casting at it as no Church, or defaming the ministry thereof, or gathering new distinct Churches; only a negative and passive separation, refusing to follow the declining part of the Church holding on in their new course, and choosing rather to stand still and cleave to that part, though smaller, endeavoring to retain and maintain the covenanted work of reformation against Popery, prelacy, Erastianism and sectarianism, schism and defection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-f2de4a259d" data-kw="">
<blockquote><p>…and every party pretending to be the only Anti’s [anti-Erastian, anti-Popish, etc. persons] in the kingdom, against all evil things, and for all good; maintaining and transmitting the testimony, as it was handed down to the [Glorious] Revolution [1689]: yet they all agree in these two Anti-Presbyterian principles in such a period: [1.] In a positive proclaiming their disowning of the State, and separation from the Church and [from] all ministers and members that dare not go up with them in every jot in their over-stretched consequences. 2. They all agree against paying of all Crown-dues, even under this peaceable [civil] government under which we enjoy religion, life, and liberty. Which never any of our ministers, martyrs, did preach or witness against… It is a piece of demented infatuation to make little or no difference betwixt that period and this, and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>

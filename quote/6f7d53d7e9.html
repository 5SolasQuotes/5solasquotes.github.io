<main class="wrap"><figure class="quote" id="q-6f7d53d7e9" data-kw="">
<blockquote><p>How then can his repentance atone for his iniquities, or entitle him to the favour of God and to the happiness of heaven? How can that evangelical repentance, which he is incapable of exercising till after his sins be all forgiven on the ground of an infinite atonement imputed to him, make atonement for them? How can that true repentance, which he cannot exercise until in justification he be already entitled to eternal life, entitle him to eternal life? Does not the consummate righteousness of Jesus Christ, imputed for justification, entitle the believer fully to it? What need is there, then, that his repentance should entitle him? How can that exercise of repentance which is the consequence of pardon, afford a previous title to pardon? or that which is a part of eternal life be a ground of right to eternal life?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Repentance</cite>, (pp. 103–04). Monergism Books. Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5fa9a9717c" data-kw="">
<blockquote><p>And lastly the Scripture speaks in a twofold manner of our conversion: [1] Sometimes the Lord attributes to us, and requires of us the whole work thereof, as if it depended altogether on our will; ‘If ye be willing and obedient, ye shall eat the good things of the land.’ (Isa. 1:19) ‘Turn ye unto Me, and I will turn unto you:’ (Zech. 1:3) ‘Make you a new heart, and a new spirit: for why will ye die, O house of Israel:’ (Eze. 18:31) ‘Repent ye and believe the Gospel’ (Mk. 1:15; Why God requires and attributes conversion to man: On Grace &amp; Free Will, ch. 6; Of Corruption &amp; Grace, ch. 3) not, as if it were [Greek] or in our power to do these things. For how can they spiritually move who are dead in sins? But the Scripture thus speaks: 1. To teach us that we neither will, nor can do anything of ourselves: but are bound to ask it of God. And 2. Because God by such exhortations, threatenings, promises and conditions does please effectually to raise up our desire and by his Spirit enables us to perform his will. Augustine says well: ‘God commands us those things which we cannot do, that we may know what we ought to ask of Him.’ And in another place: ‘O man observe from the commandment what thou shouldst have: by reproofs, what thou art deprived of by thy own default, and in prayer acknowledge whence to receive what thou desirest to have.’ [2] And again other [passages] where the Lord ascribes the whole work of our conversion unto Himself alone and commands us so to acknowledge it. As: ‘I will make you to walk in my ways, and I will take the stony heart out of your flesh, and I will give you an heart of flesh.’ (Eze. 36:26) ‘Turn thou me, and I shall be turned.’ (Jer. 31:18) ‘No man can come unto me, except the Father draw him.’ (Jn. 6:44) ‘Without Me ye can do nothing.’ (Jn. 15:6) See the like: Eph. 2:1; 1 Cor. 2:13-14; Rom. 8:7; 2 Cor. 3:5; Lk. 24:45; Acts 16:14; 11:18. All which testimonies do plainly evince that the grace of conversion is not indifferent or universal: but as our sufficient [help], so also our effectual help does wholly depend upon the general and particular pleasure and motion of God. Which difference of the Scriptures, and the cause thereof, because the Pelagians and their adherents have not observed: But ••ther abused the former places, as if they were absolutely spoken: and corrupted the latter by their equivocations about grace, calling it (as they also do to this day) a suasory, indifferent and resistible grace, limited by the will of man either to that which is good or evil: they have most falsely wrested the same, for to establish their idol of free-will. Now herewithal they must of necessity embrace all other Pelagian heresies and impieties also, as namely: 1. That faith and good works foreseen, do go before God’s predestination: and so are not from God’s predestinating of them: whereupon it will follow that predestination, being an effect of causes and conditions foreseen, is not to be called a predestination, but rather a post-destination. 2. That faith going before predestination must also be before vocation: seeing we are elected before we are called: And by this ground not God, but man should be the author of faith: contrary to that of Rom. 9:16, ‘It is not of him that willeth, or of him that runneth, but of God that sheweth mercy.’ 3. That the will either co-working, or not co-working with foregoing grace does make men to differ, which is contrary to 1 Cor. 4:7, ‘Who maketh thee to differ from another? And what hast thou that thou didst not receive?’ And so the increase of faith and grace should be given according to the merit of congruity. 4. That man’s will is not corrupted or made worse by the Fall of Adam: and so either there should be no original sin at all, or else but in name only: whereas, ‘The heart of man is deceitful above all things.’ 5. That the Law is not above man’s strength, but that he may absolutely fulfill the same: and be altogether free from sin in this life, if he would: wheras the Scriptures on the contrary teach that there is not any one just man in the earth which does good and sins not. All which errors establish merits of condignity, overthrow the grace and merits of Christ, and so consequently the truth of Christian religion, being nothing indeed, but in name only: and in a word confirms pagan divinity and philosophy. For in all these positions, the names only excepted, there is nothing but what philosophy itself teaches, both concerning the beginnings and reward of virtue: which to philosophers is faith, righteousness and works.</p></blockquote>

<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) Latin Whether sufficient grace for conversion and avoiding sins is given to all men? 291-97 … Necessity of grace for fallen nature for salvific good and true piety: Roman doctrine 847 . pt. 2, Protestants’ doctrine compared with Roman 859 Whether man, in a state of sin, can prepare and dispose himself for grace by his natural powers alone 867 . pt. 2, Roman school 879 . pt. 3, Protestant and Roman opinions are compared 891-906 Le Blanc (1614-1675) was a reformed professor of theology at Sedan. . 1700’s de Moor, Bernard – Continuous Commentary on John Marck’s Didactic-Elenctic Compendium of Christian Theology Buy (1761-1772), ch. 2, Scripture Theological Disputation on Eph. 5:14, “Wherefore he saith, Awake thou that sleepest, and arise from the dead, and Christ shall give thee light.</p></blockquote>

<blockquote><p>XXII. Nor does the law contain any implicit condition of repentance, as if the meaning of its penalties were this: “Whoever breaks the law shall die—unless he repents.” For if that were the case, then by repenting, the sinner would have satisfied the law and could demand acquittal not as grace, but as right, and the judge would be bound by law to justify him.</p></blockquote>

</figure><figure class="quote" id="q-220fd0f8ce" data-kw="">
<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>

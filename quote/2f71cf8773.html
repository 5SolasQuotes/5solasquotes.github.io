<main class="wrap"><figure class="quote" id="q-2f71cf8773" data-kw="">
<blockquote><p>There is no doubt, therefore, that Government have conferred a vast benefit upon the community at large, by appropriating the superfluous funds, and applying them as they are now applied. Still the great want, which the Christian philanthropist perceives and regrets, is that Book which contains the words of eternal life. Shakespeare is a class-book; but the sublime poetry of the Inspired Volume, and the simple narrative of the life and character of Him who “spake as never man spake,” are not permitted to have a place there.

The system under which the Hooghly college, as well as every other Government school and college, is placed, excludes the purest morality, the truest history, the most sublime lessons and precepts, from forming a part of the education of immortal creatures. Such is the tyranny of system. When followed out to its full extent, the plan involves inconsistency, so far as its patrons and advocates are concerned; and restricts the teachers employed from doing the very thing which, as teachers, they ought to feel themselves bound to do, if they call themselves servants of the living and true God, and the followers of Him who “came in the name of the Lord to save.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-ewart.html">David Ewart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes of a Journey of Missionary Survey. In a letter to the Convener of the Committee on Indian Missions. Part I. in Christian Miscellany</cite></span></figcaption>

<blockquote><p>[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.</p></blockquote>

</figure><figure class="quote" id="q-ff022d37d0" data-kw="">
<blockquote><p>What if we should yield to the Bishop that kneeling [to the bread and wine in the Supper] and holidays are with us applied to another service, and used with another meaning than they are with the Papists [as is often claimed with vestments]? Does that excuse our conformity with Papists in the external use of these ceremonies? If so, J. [John] Hart did rightly argue out of Pope Innocentius, that the church does not Judaize by the sacrament of unction or anointing, because it figures and works another thing in the New Testament than it did in the Old (Rainolds, Conference with Hart, ch. 8, div. 4, p. 496). Rainolds answers, that though it were so, yet is the ceremony Jewish; and mark his reason (which carries a fit proportion to our present purpose), ‘I trust’, he says, ‘you will not maintain but it were Judaism for your church to sacrifice a lamb in burnt-offering, though you did it to signify, not Christ that was to come, as the Jews did, but that Christ is come, etc. St. Peter did constrain the Gentiles to Judaize, when they were induced by his example and authority to follow the Jewish rite in choice of meat; yet neither he nor they allowed it in that meaning which it was given to the Jews in; for it was given them to betoken that holiness, and train them up into it, which Christ by his grace should bring to the faithful. And Peter knew that Christ had done this in truth, and taken away that figure, yea the whole yoke of the law of Moses; which point he taught the Gentiles also. Wherefore, although your church keeps the Jewish rites with another meaning than God ordained them for the Jews… yet this of Peter shows that the thing is Jewish, and you to Judaize to keep them. (Ibid., p. 496 [567])</p></blockquote>

<blockquote><p>I rather think, with the learned Cappellus, that this apostolical prescript or canon of good order was founded upon some civil custom then obtaining among the Corinthians and elsewhere; from whence he concludes that according to the difference of several countries, such an habit and deportment is to be used in divine service which is commonly used to express reverence and decency in conversation. … (He, that will see the different customs of nations in this matter, both in and out of sacred uses, may consult Grotius and Cappellus at large on the place.)</p></blockquote>

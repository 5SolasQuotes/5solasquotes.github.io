<main class="wrap"><figure class="quote" id="q-b230cc27ff" data-kw="">
<blockquote><p>Objection 2. Christ by His death, merited that our works should merit life everlasting. Answer. That is false. All we find in Scripture is that Christ, by His merit procured pardon of sin, imputation of righteousness, and life everlasting. And it is nowhere said in the Word of God that Christ did merit that our works should merit. It is a dotage of their own devising. He died not for our good works to make them able to satisfy God’s anger, but for our sins that they might be pardoned. Thus much says the Scripture, and no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, in Works</cite>, 7:54.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8064395f9" data-kw="">
<blockquote><p>We must therefore hold these two principles, first, that believers are called to the possession of the kingdom of heaven, so far as relates to good works, not because they deserved them through the righteousness of works, or because their own minds prompted them to obtain that righteousness, but because God justifies those whom he previously elected, (Romans 8:30.) Secondly, although by the guidance of the Spirit they aim at the practice of righteousness, yet as they never fulfill the law of God, no reward is due to them, but the term reward is applied to that which is bestowed by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>

</figure><figure class="quote" id="q-f16acd9be1" data-kw="">
<blockquote><p>It is able to be conceded that Christ merited immortality, that is, He exhibited such obedience as deserved such remuneration. It is asked whether Christ merited for us in all of his works equally?…</p></blockquote>

</figure><figure class="quote" id="q-5b54395096" data-kw="">
<blockquote><p>Let them, if they will, expect eternal life for their good works; only let us on the authority of Paul hope for it from the grace of God. … Let the saying of Paul then stand fast — that “the inheritance is not of the law but of faith, that the promise according to grace may be sure to every one that believeth.” (Romans 4:14.)</p></blockquote>

</figure><figure class="quote" id="q-fd1c7f51b5" data-kw="">
<blockquote><p>According to the view of the Scotists and the Nominalists, the reason for the meritoriousness of good works lies exclusively in God’s free acceptance so that God could have accepted as merit and rewarded with everlasting life merely naturally good works. According to the better-founded Thomistic view, the ground of the meritoriousness lies also in the intrinsic value of good works performed in the state of grace. The state of grace effects an inner equivalence (meritum de condigno) between the good actions and the eternal reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §24, 3</span></figcaption>

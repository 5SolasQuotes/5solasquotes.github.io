<main class="wrap"><figure class="quote" id="q-5d4a47d677" data-kw="">
<blockquote><p>This study addresses the issue of v. 15 in 1 Cor 11:2-16 from the perspective of a veiling custom. If veiling is in view (the position adopted here), then how does one confront the difficulty of reconciling the overall context with the exceptional statement in v. 15 that long hair for a woman is a glory. If, as the text argues, long hair is to be taken as a ‘glory,’ by what logic could a woman understand that she should place a veil upon her head? This article provides a way out of the dilemma by showing how a veil can serve the double function of reflecting the hair’s beauty while at the same time preserving a symbol of female modesty.” – Abstract ‘Veiling among Men in Roman Corinth: 1 Corinthians 11:4 &amp; the Potential Problem of East Meeting West’ Pre Journal of Biblical Literature, vol. 137, no. 2 (Summer, 2018), pp. 501-17 Brown (below) had previously argued against Massey and another scholar on whether the key greek syntax in 1 Cor. 11:4 could mean, or primarily does mean, that it was a shame for men to have long hair while praying (Brown), or that it was a shame for a man to pray with a material head-covering on (Massey). This article of Massey follows that of Brown but never appears to address Brown’s article directly. This work of Massey “is based on the foundational work of Oster, Gill, and Finney.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Long Hair as a Glory &amp; as a Covering: Removing an Ambiguity from 1 Cor 11:15’ Novum Testamentum</cite>, vol. 53, Fasc. 1 (2011), pp. 52-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-fcc025fa63" data-kw="">
<blockquote><p>He lets them know that both these kinds of disorders are repugnant to the institution of God and the dictates of reason. But especially the latter of these practices is confuted here by an appeal to nature, which is a comprehensive topic, and you may understand by it the general dictate of natural reason, and the particular law of nature concerning distinction of sexes, as also usage and custom, which is a second nature… In a word, a man must not be like a woman either as to her veil and covering or as to her long and dressed hair, because he is taught otherwise by the law of reason, and by that of the sex, and even by the practice and custom of the soberest part of the world, which are all comprised in the large extent of the word ‘nature’ in this place of the apostle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Four Remarkable Texts of the New Testament which Contain Some Difficulty in Them</cite>, … (Cambridge, 1692), The 2nd Text Inquired into, 1 Cor. 11:14, pp. 135-36</span></figcaption>

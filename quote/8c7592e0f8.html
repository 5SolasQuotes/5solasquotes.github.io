<main class="wrap"><figure class="quote" id="q-8c7592e0f8" data-kw="">
<blockquote><p>Theology in general is teaching or a word about divine things. In this sense, the old Greek writers called those who taught a word about divine things theologians. And since there can be a word about God or divine things from either nature or revelation, the former comes as natural theology and the latter as revealed theology.

Natural theology is a word about God from nature, taught by the dictation of reason alone. For “what can be known about God is manifest in them, for God has manifested it to them. For since the creation of the world His invisible attributes are seen, having been observed in what has been made, His eternal power and divinity”—not unto the end that they may be saved through such knowledge, but “so that they are inexcusable” (Rom. 1:19–20).

Revealed theology is teaching about God, reconciling man, the sinner, to Himself in Christ, and in the same right knowledge and godly worship, revealing it through His word for the salvation of man, the sinner, and the glory of God. For “this is eternal life, that they may know You, the only true God, and the one whom You have sent, Jesus Christ” (John 17:3). “We speak out of sincerity, as from God, before the face of God in Christ” (2 Cor. 2:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), I.I-III, Kindle Locations 562-572.</span></figcaption>

2e0f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c7592e0f8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/06/29/johann-heinrich-heidegger-on-theology-natural-and-revealed/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e34b41b393" data-kw="">
<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1 | ch. 7, ‘That the truth of reason is not in opposition to the truth of the Christian faith’</span></figcaption>

</figure><figure class="quote" id="q-2744cc85f0" data-kw="">
<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology</cite>, (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</span></figcaption>

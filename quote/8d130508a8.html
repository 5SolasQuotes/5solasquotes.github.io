<blockquote><p>But there is a third kind of holiness, Relative Holiness, being nothing but a state of relation of peculiarity to God-ward, either in respect of presence, or propriety and dominion. 1. Of Presence, when God is peculiarly and in a special manner present; as when He appeared to Moses in the flaming bush, Ex. 3:5…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd31cbe326" data-kw="">
<blockquote><p>Images of God. Since God as Spirit is in essence invisible and immense, he cannot really be expressed by any art or image. For this reason we have no fear pronouncing with Scripture that images of God are mere lies. Therefore we reject not only the idols of the Gentiles, but also the images of Christians. Images of Christ. Although Christ assumed human nature, yet he did not on that account assume it in order to provide a model for carvers and painters. He denied that he had come “to abolish the law and the prophets” (Matt. 5:17). But images are forbidden by the law and the prophets” (Deut. 4:15; Isa. 44:9). He denied that his bodily presence would be profitable for the Church, and promised that he would be near us by his Spirit forever (John 16:7). Who, therefore, would believe that a shadow or likeness of his body would contribute any benefit to the pious? (2 Cor. 5:5). Since he abides in us by his Spirit, we are therefore the temple of God (1 Cor. 3:16). But “what agreement has the temple of God with idols?” (2 Cor. 6:16). … But in fact in order to instruct men in religion and to remind them of divine things and of their salvation, the Lord commanded the preaching of the Gospel (Mark 16:15) – not to paint and to teach the laity by means of pictures. Moreover, he instituted sacraments, but nowhere did he set up images. The Scriptures of the laity. Furthermore, wherever we turn our eyes, we see the living and true creatures of God which, if they be observed, as is proper, make a much more vivid impression on the beholders than all images or vain, motionless, feeble and dead pictures made by men, of which the prophet truly said: “They have eyes, but do not see” (Ps. 115:5). Lactantius. Therefore we approved the judgment of Lactantius, and ancient writer, who says: “Undoubtedly no religion exists where there is an image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 2nd Helvetic Confession 1566 (Bullinger was the principal author), ch. 4, ‘Of idols or images of God, Christ and the saints</span></figcaption>

<blockquote><p>the eighth anathema of the Council of 754, which condemns anyone who would contemplate the incarnate Logos ‘through the medium of material colors, and does not worship him with the whole heart, with the eyes of the mind, as he sits in excelsis, more dazzling than the sun, at the right hand of God, on the throne of glory.’ The whole case in behalf of this type of image is summarized in the sixteenth anathema of the Council as follows: ‘If anyone ventures to set up profitless figures of all the saints in soul-less, speechless images made of material colors — for this is a vain invention and the discovery of diabolical craft — and does not, on the contrary, reproduce their virtues in himself as actually living images, with the aid of what has been recorded about them in books, in order to be stimulated to zeal like theirs, as our inspired fathers have said, let him be anathema.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers</cite>, vol. 8 (1954), pp. 153-60, p.155</span></figcaption>

</figure><figure class="quote" id="q-0150883e5c" data-kw="">
<blockquote><p>…those who are not contented with His voice, but seek His visible form, substitute imaginations and phantoms in His place. But here arises a difficult question, for God made Himself known to the patriarchs in other ways besides by His voice alone; thus Abraham, Isaac and Jacob knew Him not only by hearing, but by sight. Moses himself saw Him in the midst of the burning bush; and He also manifested Himself to the prophets under visible figures…. And yet God was not forgetful of Himself when He thus presented Himself to the sight of His servants. Wherefore, this argument does not appear to be valid and good, that it is sinful to represent God in a visible image, because His voice was once heard without His being seen [Dt. 4:15-16]; when, on the other side, it is easy to object that visible forms have often been exhibited, wherein He testified His presence. The solution is twofold: first, that, although God may have invested Himself in certain forms for the purpose of manifesting Himself, this must be accounted as a peculiar circumstance, and not be taken as a general rule;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 4 | verse 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>This prior motion or immediate influence on the cause is not necessary for the will to be able to act if it wishes; for it has that by its own power or through supernatural habits; but it is necessary only for it to act actually. Hence, from the fact that the will is not moved by God with that prior motion, it does not follow that it cannot will or act; but it only follows that it will not actually act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXIV. Alvares attempts to reconcile the physical predetermination of the human will to its acts by the impulse of the moving God with the free choice of the same will in another way. After proposing this objection to himself, “If the prior divine influence is necessary for the cause so that the will may act, it follows that without it, the will cannot act, thus its freedom will perish,” he responds:</span></figcaption>

</figure><figure class="quote" id="q-b7e4f428d6" data-kw="">
<blockquote><p>How may we attribute this same work to God, to Satan, and to man as author, without either excusing Satan as associated with God, or making God the author of evil? Easily, if we consider first the end, and then the manner, of acting. The Lord&#x27;s purpose is to exercise the patience of His servant by calamity; Satan endeavors to drive him to desperation; the Chaldeans strive to acquire gain from another&#x27;s property contrary to law and right. So great is the diversity of purpose that already strongly marks the deed. There is no less difference in the manner. The Lord permits Satan to afflict His servant; He hands the Chaldeans over to be impelled by Satan, having chosen them as His ministers for this task. Satan with his poison darts arouses the wicked minds of the Chaldeans to execute that evil deed. They dash madly into injustice, and they render all their members guilty and befoul them by the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.2</span></figcaption>

</figure><figure class="quote" id="q-94813ced0a" data-kw="">
<blockquote><p>It would be to be wished that this contestation had not gone out of the schools of the Roman Communion, where it [the teaching of divine premotion] took birth. But by a misfortune that one could not deplore enough, it has passed even into ours, although with some difference. In effect in the Roman Church there is no one who has not taken sides on this, while in ours few writers have paid attention to this dispute, of which the matter is in effect quite metaphysical. When one reads the works of most of our theologians one has much difficulty perceiving that they have even heard speaking of it. The others [of the Reformed], to whom this contestation has not been unknown, have divided themselves on this. Most have declared themselves for premotion. This is what have done among the supralapsarians Piscator, Maccovius, Voet, Twisse, Rutherford and others, and among the infralapsarians Rivet, Maresius, Turrettin, etc. Several have said things quite opposed to this sentiment, like Junius, Pareus, the theologians of England deputies to the Synod of Dort, H. Alting, P. Ferri, M. Amyraut, M. Morus, etc. Some have explained themselves more clearly, and have positively rejected this dogma, like four of our philosophers, Gockenius, Rutgersius, Jacchæus and Burgersdijk. Some even have refuted it amply and solidly, like Robert Baron, Strangius, Baxter, Heidegger and M. Holsius. That alone makes it clear that it is more or less the same with the Roman Church as with ours, at least in this regard, that in one and in the other premotion has adversaries and partisans, from which one can conclude what is the injustice of the reproaches that the missionaries make to us on this in such an insulting manner. For finally if it is wrong for us to suffer the Predeterminants in our communion, by what right do the Pope and his councils suffer them in theirs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>La Placette vs. Naude on Premotion, Concurrence &amp; Decrees</cite>, trans. from French by AI (Amsterdam: 1707 ff.), pp. 265-66 La Placette (1639-1718) was a French reformed minister who was against divine premotion.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-111d9a548d" data-kw="">
<blockquote><p>I returned, and saw under the sun, that the race is not to the swift, nor the battle to the strong, neither yet bread to the wise, nor yet riches to men of understanding, nor yet favour to men of skill; but time and chance happeneth to them all.” – Eccl. 9:11 Wettstein, Gernler &amp; Buxtorf – 6. Providence in A Syllabus of Controversies in Religion which come between the Orthodox Churches &amp; whatever other Adversaries, for material for the regular disputations… customarily held in the theological school of the academy at Basil (Basil, 1662), pp. 19-21 . 1700’s Hottinger, Johann J. – A Theological Exercitation on the Immediate Operation of God in the Soul of Man (Zurich, 1714) 54 pp. . . Latin Book 1600’s Rutherford, Samuel – A Scholastic Disputation on Divine Providence… (Edinburgh, 1649) 620 pp. ToC English ToC . . Historical Theology On the 1500’s-1600’s Article Matava, R.J. – ‘A Sketch of the Controversy de auxiliis‘ in Journal of Jesuit Studies (Apr, 2020) Abstract: “In the 16th century, the Dominicans and the Jesuits engaged in a polarized theological debate about how God can move the human will in a way that neither compromises human free choice nor makes God the author of moral evil. This debate, called the “controversy de auxiliis,” was never resolved. In 1607, Pope Paul V decreed that neither side was heretical and forbade further publishing on the issue without his explicit permission. This article explains the main theological points of the various Dominican and Jesuit actors, the human factors that contributed to the debate…</p></blockquote>

<blockquote><p>There are many things that are very discouraging like; but there is comfort, Jesus Christ is a King, and seeing He is a King, He will have subjects; yea, He will reign till He put all his enemies under his feet. Shall not the pleasure of the Lord prosper in his hand? “He will see of the travail of his soul, and be satisfied.” And may not our souls feed upon the ravishing thoughts of the pureness of that Church that He will have in Scotland? What shall be the end of all these things? shall they not all tend to the purging of Jacob from his sin? […]

A sight of the preciousness that is in Him will cause us to go through fire and water with Him and for Him. Will not the consolations of his Spirit bear up the soul in all its difficulties? especially when it is aye made to see in the end, that it could not want one dram-weight of its cup?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8ff24dd24" data-kw="">
<blockquote><p>The third opinion is, that the Magistrate may and ought to exercise his coercive power, in suppressing and punishing Heretics and Sectaries, less or more, according as the nature and degree of the error, schism, obstinacy, and danger of seducing others, doth require. This as it was the judgement of the orthodox Ancients, (vide Optati opera, edit. Albaspin. pag. 204. 215.) so it is followed by our soundest Protestant Writers; most largely by Beza against Bellius and Monfortius, in a peculiar Treatise De Haereticis à Magistratu puniendis. And though Gerhard, Brochmand, and other Lutheran Writers, make a controversy where they need not, alledging that the Calvinists (so nicknamed) hold as the Papists do, that all Heretics without distinction are to be put to death:

The truth is, they themselves say as much as either Calvin or Beza, or any other whom they take for adversaries in this Question, that is, that Heretics are to be punished by mulcts, imprisonments, banishments, and if they be gross idolaters or blasphemers, and seducers of others, then to be put to death. What is it else that Calvin teacheth, when he distinguisheth three kinds of errors: some to be tolerated with a spirit of meekness, and such as ought not to separate betwixt brethren: others not to be tolerated, but to be suppressed with a certain degree of severity: a third sort so abominable and pestiferous, that they are to be cut off by the highest punishments?

And lest it be thought that this is but the opinion of some few, that the magistrate ought thus by a strong hand, and by civil punishments suppress Heretics and Sectaries: let it be observed what is held forth and professed concerning this business, by the Reformed Churches in their public Confessions of Faith. In the latter Confession of Helvetia, cap. 30. it is said that the magistrate ought to root out lies and all superstition, with all impiety and idolatry. And after; Let him suppress stubborn Heretics.

In the French Confession, art. 39. Therefore he hath also delivered the sword into the hands of the Magistrates, to wit, that offences may be repressed, not only those which are committed against the second Table, but also against the first. In the Belgic Confession, art. 36. Therefore hath he armed the Magistrate with the sword for punishing them that do evil, and for defending such as doe well. Moreover it is their duty not only to be careful and watchful for the preservation of the civil government, but also to defend the holy Ministry, and to abolish and overthrow all Idolatry, and counterfeit worship of God.

Beza de haeret, à magistr. puniend, tells us in the beginning, that the Ministers of Helvetia had declared themselves to be of the same judgement, in a book published of that Argument. And toward the end he citeth the Saxon Confession, Luther, Melancthon, Brentius, Bucerus, Wolfangus Capito, and Bullinger. The Synod of Dort, Ses. 138. in their sentence against the Remonstrants doth not only interdict them of all their Ecclesiastical and Academical functions, but also beseech the States General by the secular power further to suppress and restrain them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome severity reconciled with Christian liberty, or, The true resolution of a present controversy concerning liberty of conscience here you have the question stated, the middle way betwixt popish tyranny and schismatizing liberty approved and also confirmed from Scripture and the testimonies of</cite>, (London: Christopher Meredith, 1645), pp 3-5.</span></figcaption>

<blockquote><p>2. My second distinction shall be this: The magistrate may and ought not only to conserve justice, peace and order in the commonwealth and in the church, as it is in the commonwealth, but also to take special care of the conservation of the true reformed religion and of the reformation of it when and wherein it needs to be reformed, imperative [by command], not elicitive [not by drawing forth the power by oneself]. The magistrate (says Dr. [Andrew] Rivet on the Decalogue, p. 262) is neither to administer Word, nor sacra- ments, nor church discipline, etc., but he is to take care that all these things be done by those whom God has called thereunto. Whatever is properly spiritual, belonging to the soul and inward man (such as church censures, and the other particular before mentioned), cannot be actus elicitus [an elicited act] of the magistrate… Yet all these, and generally the administration of the keys of the kingdom of Heaven, are actus imperati [having been commanded] of the Christian magistrate, and that both antecedenter [antecedently, before-hand] and consequenter [consequently, after-the-fact]: Antecedently, the magistrate may command church officers to suspend or excommunicate all obstinate and scandalous persons; he may command the classes to ordain able and godly ministers, and no other; he may command a synod to meet to debate and determine such or such a controversy. Consequently, also, when the thing is examined, judged, resolved, or done by the ecclesiastical power, the magistrate has power and authority to add his civil sanction, confirmation, or ratification; to make the ecclesiastical sentence to be obeyed and submitted unto by all whom it concerns; — in all which the Christian magistrate does exceeding much for the conservation and purgation of religion, not eliciendo actus, doing or exercising by himself, or by his own authority, acts of church government or discipline, but taking care that such and such things be done by those to whom they do belong.</p></blockquote>

<blockquote><p>Though the Jewish Church and commonwealth were for the most part not different materially, the same men being members of both, even as in all Christian republics; yet they were formally different from one another in regard of distinct acts, laws, courts, officers, censures, and administrations. For, 1. The ceremonial law was given to them as a Church, the judicial law given to them as a State.

2. They did not worship, do sacrifice, pray, praise, etc. as a State; nor did they kill malefactors with the sword as a Church.

3. As the Lord’s matters and the King’s matters were distinguished, so there were two different courts for judging of the one and the other (2 Chron. 19:8, 11).</p></blockquote>

</figure><figure class="quote" id="q-e1d97dcd68" data-kw="">
<blockquote><p>There is therefore need that both our hands should be employed in doing good. Now the two hands of a Christian Kingdom are the Magistracy and Ministry thereof. The business of Reformation calls for both. As we commonly use our hands for the washing and cleansing of each other. So if the Minister be extravagant, the Magistrate may correct him; then the right hand washeth the left: If the Magistrate do amiss, the Minister may admonish him, then the left hand clenseth the right.

But he that makes use of one hand to cut off the other with, destroys his body: such would our condition be, if either Ministers should suffer the Magistracy to be cried down; or Magistrates permit the Ministry to be debased. Scripture and experience bid us hope, that Amalek shall then be foiled, and Israel prevail, when faith in Christ, and zeal for truth shall support both these hands, as Aaron and Hur did those of Moses upon the mount.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>This language of ‘authentic’ [WCF 1.8] arose on account of the Roman Catholic assertion that the Latin Vulgate was the authentic standard by which the church should be appealing as authoritative. This was codified by the papists at the Council of Trent… Therefore, the Reformers were required to state unequivocally that the authoritative or authentic Scripture was that in the original Greek and Hebrew Scriptures and not the Latin translation…. It is clear, then, that our own Confession is not using the term “authentic” void of meaning. It is a reference to that which has final authority in matters of religious controversy and to that which the church should appeal. But notice again, it is not a printed text that is the appeal. It is to the original languages of the Hebrew and Greek. Therefore, “authentic” in §1.8 does not have historical connection to a particular printed text… Like Turretin, Owen is speaking of the manuscript tradition of copies rather than a collated, edited, and printed edition of the Greek New Testament.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee65977391" data-kw="">
<blockquote><p>To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 74-75 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>His [Knewstubs’s] objection against the cross consisted of three interrogatories: 1. Whether the Church had power to institute an external significant sign? To which was replied: First, that he did mistake the use of the cross with us, which was not used in baptism any otherwise than only as a ceremony. Secondly, by their own example, who make imposition of hands in their ordination of pastors to be a sign significant. Thirdly, in prayer, says the Bishop of Winton, the kneeling on the ground, the lifting up of our hands, the knocking of our breasts are ceremonies significant: the first, of our humility coming before the mighty God, the second, of our confidence and hope, the other of our sorrow and detestation of our sins, and these are, and may lawfully be used. Lastly, M. Deane of the chapel, remembered the practice of the Jews, who unto the institution of the Passeover, prescribed unto them by Moses, had as the rabbins witness added both signs and words, eating sour herbs and drinking wine, with these words to both, ‘Take, and eat these in remembrance, etc. Drink this in remembrance, etc.’ Upon which addition and tradition of theirs, our Sauiour instituted the sacrament of his Last Supper, in celebrating it with the same words and after the same manner; thereby approving that fact of theirs in particular; and generally, that a Church may institute and retain a sign significant: which satisfied his Maiesty exceeding well. And here the king desired, to have himself made acquainted about the antiquity of the use of the cross. Which Doctor [John] Reynolds confessed to have been ever since the apostles times, but this was the difficulty, to prove it of that ancient use in baptism… it fell from one, I think it was my Lord of Winchester, obiter, to say, that, in Constantine’s time it was used in baptism. What, quoth the King, and is it now come to that pass that we shall appeach Constantine of Popery and superstition; if then it were used, says his Majesty, I see no reason but that still we may continue it. Mr. Knewstubs’s second question was that, put [the] case [that] the Church had such power to add significant signs, whether it might there add them where Christ had already ordained one; which he said, was no less derogatory to Christ’s institution, as he thought, than if any potentate of this land should presume to add his seal unto the great seal of England. To which his Majesty answered that the case was not alike, for that no sign or thing was added to the sacrament, which was fully and perfectly finished, before any mention of the cross is made; for confirmation whereof, he willed the place to be read [in the Book of Common Prayer]. Lastly, if the Church had that power also, yet the greatest scruple to their conscience was, how far such an ordinance of the Church was to bind them, without impeaching their Christian liberty? Whereat the king, as it seemed, was much moved, and tolde him he would not argue that point with him, but answer therein as kings are wont to speak in Parliament, Le Roy J’auisera: adding withall, that it smelled very rankly of Anabaptism: comparing it unto the usage of a beardless boy (one Mr. John Black) who the last Conference his Majesty had with the ministers in Scotland (in December, 1602) told him that he would hold conformity with his Majesty’s ordinances for matters of doctrine: but for matters of ceremony, they were to be left in Christian liberty unto every man as he received more and more light from the illumination of God’s Spirit; even till they go mad, quoth the king, with their own light: but I will none of that, I will have one doctrine and one discipline, one religion in substance, and in ceremony: and therefore I charge you, never speak more to that point (how far you are bound to obey?) when the Church has ordained it. And so asked them again, if they had anything else to say? Dr. Reynolds objected the example of the brasen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>

BJohn%5D+Reynolds+confessed+to+have+been+ever+since+the+apostles+times%2C+but+this+was+the+difficulty%2C+to+prove+it+of+that+ancient+use+in+baptism%E2%80%A6+it+fell+from+one%2C+I+think+it+was+my+Lord+of+Winchester%2C+obiter%2C+to+say%2C+that%2C+in+Constantine%E2%80%99s+time+it+was+used+in+baptism.+What%2C+quoth+the+King%2C+and+is+it+now+come+to+that+pass+that+we+shall+appeach+Constantine+of+Popery+and+superstition%3B+if+then+it+were+used%2C+says+his+Majesty%2C+I+see+no+reason+but+that+still+we+may+continue+it.+Mr.+Knewstubs%E2%80%99s+second+question+was+that%2C+put+%5Bthe%5D+case+%5Bthat%5D+the+Church+had+such+power+to+add+significant+signs%2C+whether+it+might+there+add+them+where+Christ+had+already+ordained+one%3B+which+he+said%2C+was+no+less+derogatory+to+Christ%E2%80%99s+institution%2C+as+he+thought%2C+than+if+any+potentate+of+this+land+should+presume+to+add+his+seal+unto+the+great+seal+of+England.+To+which+his+Majesty+answered+that+the+case+was+not+alike%2C+for+that+no+sign+or+thing+was+added+to+the+sacrament%2C+which+was+fully+and+perfectly+finished%2C+before+any+mention+of+the+cross+is+made%3B+for+confirmation+whereof%2C+he+willed+the+place+to+be+read+%5Bin+the+Book+of+Common+Prayer%5D.+Lastly%2C+if+the+Church+had+that+power+also%2C+yet+the+greatest+scruple+to+their+conscience+was%2C+how+far+such+an+ordinance+of+the+Church+was+to+bind+them%2C+without+impeaching+their+Christian+liberty%3F+Whereat+the+king%2C+as+it+seemed%2C+was+much+moved%2C+and+tolde+him+he+would+not+argue+that+point+with+him%2C+but+answer+therein+as+kings+are+wont+to+speak+in+Parliament%2C+Le+Roy+J%E2%80%99auisera%3A+adding+withall%2C+that+it+smelled+very+rankly+of+Anabaptism%3A+comparing+it+unto+the+usage+of+a+beardless+boy+%28one+Mr.+John+Black%29+who+the+last+Conference+his+Majesty+had+with+the+ministers+in+Scotland+%28in+December%2C+1602%29+told+him+that+he+would+hold+conformity+with+his+Majesty%E2%80%99s+ordinances+for+matters+of+doctrine%3A+but+for+matters+of+ceremony%2C+they+were+to+be+left+in+Christian+liberty+unto+every+man+as+he+received+more+and+more+light+from+the+illumination+of+God%E2%80%99s+Spirit%3B+even+till+they+go+mad%2C+quoth+the+king%2C+with+their+own+light%3A+but+I+will+none+of+that%2C+I+will+have+one+doctrine+and+one+discipline%2C+one+religion+in+substance%2C+and+in+ceremony%3A+and+therefore+I+charge+you%2C+never+speak+more+to+that+point+%28how+far+you+are+bound+to+obey%3F%29+when+the+Church+has+ordained+it.+And+so+asked+them+again%2C+if+they+had+anything+else+to+say%3F+Dr.+Reynolds+objected+the+example+of+the+brasen+serpent%2C+demolished+and+stamped+to+powder+by+Ezekiel%2C+because+the+people+abused+it+to+idolatry%3A+wishing%2C+that%2C+in+like+sort%2C+the+cross+should+be+abandoned%2C+because+in+the+time+of+Popery+it+had+been+superstitiously+abused.+Whereunto+the+King%E2%80%99s+Majesty+answered+diverse+ways.+First%2C+quoth+he%2C+though+I+be+sufficiently+persuaded+of+the+cross+in+baptism%2C+and+the+commendable+use+thereof+in+the+Church+so+long%3A+yet%2C+if+there+were+nothing+else+to+move+me%2C+this+very+argument+were+an+inducement+to+me+for+the+retaining+of+it%2C+as+it+is+now+by+order+established%3A+For%2C+inasmuch%2C+as+it+was+abused%2C+so+you+say%2C+to+superstition+in+time+of+popery%2C+it+does+plainly+imply%2C+that+it+was+well+used+before+Popery.+I+will+tell+you%2C+I+haue+lived+among+this+%5Bdissenting%5D+sort+of+men+%28speaking+to+the+lords+and+bishops%29+ever+since+I+was+ten+years+old%2C+but+I+may+say+of+myself+as+Christ+did+of+Himself%3A+Though+I+lived+amongst+them%2C+yet+since+I+had+ability+to+judge%2C+I+was+never+of+them%3B+neither+did+anything+make+me+more+to+condemn+and+detest+their+courses+than+that+they+did+so+peremptorily+disallow+of+all+things+which+at+all+had+been+used+in+Popery.+For+my+part%2C+I+know+not+how+to+answer+the+objection+of+the+Papists%2C+when+they+charge+us+with+novelties%3A+but+truly+to+tell+them+that+their+abuses+are+new%2C+but+the+things+which+they+abused+we+retain+in+their+primitive+use%2C+and+forsake+only+the+novel+corruption.+By+this+argument+we+might+renounce+the+Trinity+and+all+that+is+holy%2C+because+it+was+abused+in+Popery+%28and+speaking+to+Doctor+Reynolds+merely%29+they+used+to+wear+hose+and+shoes+in+Popery%2C+therefore%2C+you+shall%2C+now%2C+go+barefoot.+Secondly%2C+quoth+his+Majesty%2C+what+resemblance+is+there+between+the+brazen+serpent%2C+a+material+visible+thing%2C+and+the+sign+of+the+cross+made+in+the+air%3F+Thirdly%2C+I+am+given+to+understand+by+the+bishops%2C+and+I+find+it+true%2C+that+the+Papists+themselves+did+never+ascribe+any+power+or+spiritual+grace+to+the+sign+of+the+cross+in+baptism.+Fourthly%2C+you+see%2C+that+the+material+crosses%2C+which+in+time+of+Popery+were+made%2C+for+men+to+fall+down+before+them%2C+as+they+passed+by+them%2C+to+worship+them+%28as+the+idolatrous+Jews+did+the+brazen+serpent%29+are+demolished%2C+as+you+desire.%E2%80%9D%0A%0A%E2%80%94+King+James+I%2C+ed.+William+Barlow%2C+The+Sum+%26+Substance+of+the+Conference+which+it+pleased+his+excellent+Majesty+to+have+with+the+Lords%2C+Bishops+%26+other+of+his+Clergy%E2%80%A6+at+Hampton+Court%2C+January+14%2C+1603+%28London%3A+Windet%2C+1604%29%2C+2nd+Day%2C+pp.+67-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2aa09de7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2aa09de7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross,serpent%29%20are%20demolished%2C%20as%20you%20desire&amp;text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross%20consisted%20of&amp;text=the%20brazen%20serpent%29%20are%20demolished%2C%20as%20you%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-f42801b205" data-kw="">
<blockquote><p>Under this black, rough tree of the cross of Christ, He hath ravished me with His love, and taken my heart to heaven with Him. Well and long may He brook it. I would not niffer Christ with all the joys that man or angel can devise beside Him.</p></blockquote>
<figcaption>— <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a>, <cite>Letters</cite>, letter CXL, to Lady Mar, Younger</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c1d6fb7e15" data-kw="">
<blockquote><p>Hence it follows, that none does, or can love like Christ: His love to man is matchless. The freeness, strength, antiquity, and immutability of it, puts a luster on it beyond all examples. Surely it was a strong love indeed, that made him lay aside his glory, to be found in fashion as a man, to become anything, though never so much below himself, for our salvation. … His love, like himself, is wonderful.</p></blockquote>
<figcaption>— <a href="../authors/john-flavel.html">John Flavel</a>, <cite>The Fountain of Life</cite>, sermon 18, “The Necessity of Christ’s Humiliation … by Incarnation”</figcaption>

</figure><figure class="quote" id="q-85b10e50c5" data-kw="">
<blockquote><p>A soule acquainted with the Gospell, knowes that there is no Property of Christ rendred more glorious therein, than that of his patience; That he should beare with so many unkindnesses, so many causelesse breaches, so many neglects of his love, so many affronts done to his Grace, so many violations of ingagements, as he doth; it manifests his Gospell to be not only the word of his Grace, but also of his patience. He suffers also from them, in all the reproaches, they bring upon his name and wayes: and he suffers in them; for in all their Afflictions, he is afflicted.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Of Temptation</cite>, Oxford, 1658, ch. 8, p. 145</figcaption>

</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption>— <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a>, <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</figcaption>

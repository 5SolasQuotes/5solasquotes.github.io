<main class="wrap"><figure class="quote" id="q-af238627d4" data-kw="">
<blockquote><p>[T]ill a man be called and his person justified and sanctified, all that ever he does is sin. First, his common actions, his eating, drinking, sleeping, walking, talking are all sins. Yea, secondly, the works of his calling and his labour in the same, though never so just, equal, and upright. Thirdly, further, his civil actions – namely, the practice of civil virtues. His outward gravity, meekness, sobriety, temperance, quietness, uprightness, and all outward conformity are all sins.

Yea, more than all this, his best actions – namely, his practicing of the parts of God’s worship, or his deeds of charity, his prayer, his hearing the word, his receiving of the sacraments, his giving of alms – they are all sins unto him, if he have not a believing and penitent heart. Yea, such sins as shall condemn him, if he had no other.

Objection. This should seem strange divinity that the most holy actions, as prayer, etc., should be damnable sins. I answer, they are in themselves holy and good and as far as God has commanded them. Yet in the doer they are sins because he does them from a foul and unholy heart, for the same action may be holy in itself and in regard of God the author of it and yet a sin in him that is the doer of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 41.</span></figcaption>

<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>

<blockquote><p>Although a thing may have its origin in Scripture, if it is to be indifferent, it is nevertheless required that there be no positive precept by which it is ordered, nor any negative one by which it is prohibited, but that it be left to us as something free, to use or not to use, as shall seem useful… Indifferent things must have a manifest and open usefulness, known in the Church, lest they may seem to be received for no purpose, or to be forced into the Church by treachery and deceit… power is given to edification and not to destruction (1 Cor. 14)… …the writings of the apostles and evangelists, which place before us most clearly the annulment of the rituals of Aaron, his ceremonies, priesthood, images, and peculiar figures, and the institution of the new and perfect priesthood of Christ. They must demonstrate to us from these books the grounds and occasion when some peculiar and special vestments should be worn in the ministry, for the adornment of the ministry itself, or for the preferring of its decorum, or for some distinctive mark, by which the minister can be distinguished from the people, as once was ordained by the Lord in the ministry of Aaron’s priesthood. But the statutes, canons and decrees of the apostles and evangelists make no mention of this matter… …What is prohibited by God can in no way be indifferent, as we have given warning above. For this is the doctrine of Paul in Gal. 2, that whatever re-establishes things that have been annulled in Christ, transgresses the will of God… Neither is it without its mystery that our Saviour Jesus Christ hung naked from the Cross. For Aaron’s priests used vestments in their own ministry because the reality of their priesthood, Christ Himself, had not yet come. But when Christ Himself was to be sacrificed, stripped of all clothing, displaying in this way his own priesthood, which since He was Reality itself, now had no further need of veils or semblances…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Regulative Principle &amp; Things Indifferent’</cite>, (1550) in ed. Iain Murray, The Reformation of the Church: a Collection of Reformed &amp; Puritan Documents on Church Issues</span></figcaption>

<blockquote><p>28. Ministers with their families ought to be maintained with honest and liberal stipends. We also believe that the church cannot well be governed unless such necessary maintenance be bestowed on the ministers as whereby they and their family may live in an honest estate; For no man, except he have whereupon to live (Mt. 10:10), can do his duty; and Christ says, “the workman is worthy of his wages” and the apostle writes largely thereof in more than one place (1 Cor. 9:7 etc.) showing by many reasons that ministers which serve the churches ought to receive of the same church what so is needful for them: (1 Tim. 5:17 etc.) and that they have good right to demand the same: so far from offence is it, that they should take it, as some would cavil: yet notwithstanding covetousness, as well in all other as chiefly in ministers we do with the apostle utterly condemn: (1 Tim. 3:3,8) as also we allow not prodigality: and we teach that both these faults are to be shunned and avoided.

29. The church goods should not be wasted, but be bestowed on the maintenance of ministers, and other godly uses. And whereas many goods have in times past, and yet in some places are given to churches, by the liberality of princes and other godly persons: we judge that if any church have such goods, great care is to be had that the same be not wasted nor converted into profane uses, and much less into sacriligious uses, nor feigned to be so converted: but to be only bestowed upon that purpose whereto they were given, even to a godly intent. And we well allow of that ancient partition of church goods, where one part went to the bishops, that is, to the teachers, (Deu[…] […]) and ministers of the Word and their families; another to the clerks, that is to students and such as were ordained to the ministry of the church and to them that attended on the church: the third part to poor people and travelers: a fourth part to repairing of churches and schools, to which part also, belong not only the houses of ministers, teachers, students, libraries and books, all kinds of instruments and things necessary for churches and schools: but also spittles and hospitals and other such like places, where such live as are peculiarly to be relieved and cared for of the church.</p></blockquote>

— Jerome Zanchi, The Whole Body of Christian Religion, (d. 1590; London, 1659)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C28.+Ministers+with+their+families+ought+to+be+maintained+with+honest+and+liberal+stipends.+We+also+believe+that+the+church+cannot+well+be+governed+unless+such+necessary+maintenance+be+bestowed+on+the+ministers+as+whereby+they+and+their+family+may+live+in+an+honest+estate%3B+For+no+man%2C+except+he+have+whereupon+to+live+%28Mt.+10%3A10%29%2C+can+do+his+duty%3B+and+Christ+says%2C+%E2%80%9Cthe+workman+is+worthy+of+his+wages%E2%80%9D+and+the+apostle+writes+largely+thereof+in+more+than+one+place+%281+Cor.+9%3A7+etc.%29+showing+by+many+reasons+that+ministers+which+serve+the+churches+ought+to+receive+of+the+same+church+what+so+is+needful+for+them%3A+%281+Tim.+5%3A17+etc.%29+and+that+they+have+good+right+to+demand+the+same%3A+so+far+from+offence+is+it%2C+that+they+should+take+it%2C+as+some+would+cavil%3A+yet+notwithstanding+covetousness%2C+as+well+in+all+other+as+chiefly+in+ministers+we+do+with+the+apostle+utterly+condemn%3A+%281+Tim.+3%3A3%2C8%29+as+also+we+allow+not+prodigality%3A+and+we+teach+that+both+these+faults+are+to+be+shunned+and+avoided.+29.+The+church+goods+should+not+be+wasted%2C+but+be+bestowed+on+the+maintenance+of+ministers%2C+and+other+godly+uses.+And+whereas+many+goods+have+in+times+past%2C+and+yet+in+some+places+are+given+to+churches%2C+by+the+liberality+of+princes+and+other+godly+persons%3A+we+judge+that+if+any+church+have+such+goods%2C+great+care+is+to+be+had+that+the+same+be+not+wasted+nor+converted+into+profane+uses%2C+and+much+less+into+sacriligious+uses%2C+nor+feigned+to+be+so+converted%3A+but+to+be+only+bestowed+upon+that+purpose+whereto+they+were+given%2C+even+to+a+godly+intent.+And+we+well+allow+of+that+ancient+partition+of+church+goods%2C+where+one+part+went+to+the+bishops%2C+that+is%2C+to+the+teachers%2C+%28Deu%5B%E2%80%A6%5D+%5B%E2%80%A6%5D%29+and+ministers+of+the+Word+and+their+families%3B <blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankfurt] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things† should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>

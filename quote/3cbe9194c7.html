<main class="wrap"><figure class="quote" id="q-3cbe9194c7" data-kw="">
<blockquote><p>Question 36. But how are we justified by faith? Answer: Not because of the worthiness of our faith, as if God justifies us because of it, as the Remonstrants would have it, and [as if] faith is here reckoned as a virtue and a remarkable good work, and therefore as the meritorious cause of the same [i.e. of justification]. …Question 38. How should faith here then be understood? Answer: As a hand or instrument, whereby we grab and take hold of the righteousness of the Redeemer, hence the sayings ‘take hold of God’s strength’ Is. 27:5; ‘receiving Jesus’ Jn. 1:12; ‘receiving the gift of righteousness’ Rom 5:17 and Acts 26:18. Question 39. By which analogy do you clear this up? Answer: Of the beggar who would receive alms of the generosity of a rich man, to which he must stretch out the hand, in which case it [i.e. the hand] deserves nothing, but is only the means by which he receives the gift; or alternatively, of one who in the navigation of the sea capsizes and sees a plank, grabs hold of it, and hauls himself onto it, thereby to be spared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henricus-siccama.html">Henricus Siccama</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Kort Begrip der Waare Godtgeleertheit</cite>, Chapter XVI (On Justification) (Trans. Jake Griesel)</span></figcaption>

</figure><figure class="quote" id="q-86ce0050dd" data-kw="">
<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>

</figure><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

</figure><figure class="quote" id="q-1b9191431a" data-kw="">
<blockquote><p>The Galatians are removed not only from the doctrine of Paul, but also from the grace of God. And the reason is because they joined the works of the law with Christ and His grace in the cause of their justification and salvation. Here it must be observed that they which make a union of grace and works in the cause of justification are separated from the grace of God. Grace admits no partner or fellow. Grace must be freely given every way, or it is no way grace. Hence it follows that the present Church of Rome is departed from the grace of God, because it makes a concurrence of grace and works in the justification of a sinner before God. And we may not make any reconciliation with that church in religion, because it is become an enemy of the grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 29–30.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5b778fc720" data-kw="">
<blockquote><p>…we cannot give an account of the whole process of generation, which consists of conception, formation or the delineation of the several parts, and animation by infusing the soul; but this we know, that it far surpasses all finite power. And without doubt Monsieur Descartes, who was so thinking a philosopher, would never have ascribed this great work to mere mechanism, but that he was unawares betrayed into it by his solving of other things by mechanic principles: So that it would be expected that he should make an uniform piece of philosophy. And thence he was, as it were, forced to go through with his work that he had begun, and to maintain that all is done mechanically, even in the production of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Demonstration of the Existence &amp; Providence of God</cite>, … (London, 1696), 2nd Part, ch. 6, pp. 109-110</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-020abbb182" data-kw="">
<blockquote><p>It hence also follows that the conception of Christ in the womb, being the effect of a creating act, was not accomplished successively and in process of time, but was perfected in an instant; for although the creating acts of infinite power, where the works effected have distinct parts, may have a process or duration of time allotted unto them, as the world was created in six days, yet every part of it that was the object of an especial creating act was instantaneously produced. So was the forming of the body of Christ, with the infusion of a rational soul to quicken it, though it increased afterwards in the womb unto the birth. And as it is probable that this conception was immediate upon the angelical salutation, so it was necessary that nothing of the human nature of Christ should exist of itself antecedently unto its union with the Son of God: for in the very instant of its formation, and therein, was the “Word made flesh,” John 1:14; and the Son of God was “made of a woman,” Gal. 4:4; so that the whole essence of his nature was created in the same instant. Thus far the Scriptures go before, and herein it is necessary to assert the forming of the body and soul of Christ by the Holy Spirit. The curious inquiries of some of the schoolmen and others are to be left unto themselves, or rather, to be condemned in them; for what was farther in this miraculous operation of the Holy Ghost, it seems purposely to be hid from us in that expression, [Greek] ‘The power of the Most High shall overshadow thee.’ Under the secret, glorious covert hereof we may learn to adore that holy work here, which we hope to rejoice in and bless God for unto eternity. And I suppose, also, that there is in the word an allusion unto the expression of the original acting of the Holy Spirit towards the newly-produced mass of the old creation, whereof we spake before. Then it is said of Him that he was [Hebrew], as it were ‘hovering’ and ‘moving’ over it for the formation and production of all things living; for both the words include in them an allusion unto a covering like that of a fowl over its eggs, communicating, by its cognate warmth and heat, a principle of life unto their seminal virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3, pp. 165-66</span></figcaption>

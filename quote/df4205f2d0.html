<main class="wrap"><figure class="quote" id="q-df4205f2d0" data-kw="">
<blockquote><p>The law in its commanding power differs much from the gospel. The law says, “Do and you shall live; you shall, by performing personal and perfect obedience, entitle yourselves to eternal life” (see Matt. 19:17). Whereas the gospel says, “Live, for all is already done; all the righteousness, meritorious of eternal life for believers, is already fulfilled by the second Adam, their adorable surety. First, live in union and communion with Him, and then do—not for—but from life already received.” The law proceeds on the supposition that we still have all that we originally had and requires perfect obedience; the gospel supposes that we have nothing and furnishes us with all that the law demands. The former requires perfection from us but offers us no supply of strength to attain to it, whereas the latter teaches us that we have it in Christ and offers it to us as an inestimable gift of grace (Rom. 5:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 133.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity: but they are not the cause of, but only a precedent qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the Covenant of Grace, by condition we understand whatsoever is required on our part, as precedent, concomitant or subsequent to justification: repentance, faith and obedience are all conditions; but if by condition we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>

</figure><figure class="quote" id="q-45d25bffc7" data-kw="">
<blockquote><p>What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | See especially Ch. 5, ‘Divine Revelation itself the only foundation and reason of faith’, p. 69 ff., pp. 69, 72, 81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.”

— John Owen, bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | See especially Ch. 5, ‘Divine Revelation itself the only foundation and reason of faith’, p. 69 ff., pp. 69, 72, 81">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+the+work+of+the+Holy+Ghost+with+respect+unto+the+objective+evidence+which+we+have+concerning+the+Scripture%2C+that+it+is+the+word+of+God%2C+which+is+the+formal+reason+of+our+faith%2C+and+whereinto+it+is+resolved%3F%E2%80%A6+%E2%80%A6+These+things+being+supposed+%2C+we+do+affirm%2C+That+it+is+the+authority+and+truth+of+God%2C+as+manifesting+themselves+in+the+supernatural+revelation+made+in+the+Scripture+%5Bemphasis+added%5D%2C+that+our+faith+arises+from+and+is+resolved+into.+%E2%80%A6+As+the+issue+of+this+whole+discourse%2C+it+is+affirmed+that+our+faith+is+built+on+and+resolved+into+the+Scripture+itself%2C+which+carries+with+it+its+own+evidence+of+being+a+divine+revelation%3B+and+therefore+doth+that+faith+ultimately+rest+on+the+truth+and+authority+of+God+alone%2C+and+not+on+any+human+testimony%2C+such+as+is+that+of+the+church%2C+nor+on+any+rational+arguments+or+motive+that+are+absolutely+fallible.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+bk.+6%2C+pt.+1%2C+The+Reason+of+Faith%3B+or%2C+an+Answer+unto+that+inquiry%2C+%E2%80%98Wherefore+we+believe+the+Scripture+to+be+the+Word+of+God%3B%E2%80%99+with+the+causes+and+nature+of+that+faith+wherewith+we+do+so%3A+wherein+the+grounds+whereon+the+Holy+Scripture+is+believed+to+be+the+Word+of+God+with+faith+divine+and+supernatural+are+declared+and+vindicated+in+Pneumatologia%3A+or%2C+A+Discourse+con

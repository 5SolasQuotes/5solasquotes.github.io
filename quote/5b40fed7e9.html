<blockquote><p>That man being made by God, and subject to his will, and owing unto him worship and obedience, which in reason ought to be prescribed by none other than by him to whom it is to be performed; that, therefore, requisite and congruous it is, that the will of God should be made known unto his creature, in such a manner, and by such means, as that he shall not, without his own wilful neglect, mistake it: inasmuch as law is the rule of obedience, and promulgation the force of law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 147.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>10. Q. What duties are done by the Minister?

A. 1 Reading the word. Act. 13.27. Col. 4.16.

2 Preaching it. Luk. 4.20, 21. Act. 13.15.

3 Praying and praising God. I Cor. 14. 15, 16. Neh. 8.6 &amp; 9.5, 6.

4 Administring Sacraments. Mat. 28.19 &amp; 26.26. Act. 20.11.

5. Blessing the people. Num. 6.23.

In performing the two first (reading and preaching the word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising him) he is the people’s mouth to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>I say, we close our prayers ordinarily with praise and glory to the Father, the Son, and the Holy Ghost; because it is warrantable from Scripture-practice, to wit, in blessing; and agreeable to the truth and liberty of Gospel-worship; and yet we refuse it in singing (mark it, not in praising), because, for that exercise, the Lord having instructed us with a sufficient plenty of Divine composures, we think it neither needful nor acceptable that we should gratify an arbitrary imposition in receiving the supplement of a human addition: It is true, the words are Scriptural, but can you say that the Scripture bears any such allowance for their use in singing as it doth for the Psalms of David? Yea and many other spiritual songs in Scripture, whereof you might indeed with some reason reprehend our too great disuse:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 279-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>All this is sealed up to us in the last word, Amen; which may signify, either so be it, so let it be, or so is shall be. The word Amen sometimes is taken nominally: Rev. 3:14, ‘Thus saith the Amen, the faithful and true Witness, the beginning of the creation of God.’ Sometimes it is taken adverbially, and so it signifies verily, and truly; and so either it may express a great asseveration, or an affectionate desire. Sometimes it expresses a great and vehement asseveration: John 6:47, ‘Amen, amen, verily, verily, I say unto you.’ In other places it is put for an affectionate desire: Jer. 28:6. When the false prophets prophesied peace, and Jeremiah pronounced war, ‘Amen! the Lord do so; the Lord perform thy words which thou hast prophesied.’ Amen, it is not an asseveration, as confirming the truth of their prophecy, but expressing his own hearty wish and desire, if God saw it good. Two things are required in prayer—a fervent desire and faith. A fervent desire; therefore it is said, James 5:16, ‘The effectual fervent prayer of a righteous man availeth much.’ And then faith: James 1:6, ‘But let him ask in faith, nothing wavering.’ What is that faith required in prayer? A persuasion that those things we ask regularly according to God’s will, that God will grant them for Christ’s sake. Now both these [things, fervent desire and faith,] Amen signifies: our hearty desire that it may be so; and our faith, that is, our acquiescency in the mercy and power and wisdom of God concerning the event. Christ would have us bind up this prayer, and conclude it thus: Amen, so let it be, so it shall be. Observe hence, That it is good to conclude holy exercises with some vigor and warmth. Natural motion is swifter in the end and close: so should our spiritual affections, as we draw to a conclusion, put forth the efficacy of faith and holy desires, and recollect, as it were, all the foregoing affections; that we may go out of the presence of God with a sweet savor and relish, and a renewed confidence in his mercy and power. Again, this Amen relates to all the foregoing petitions, not to one only. Many, when they hear, ‘Lord, give us this day our daily bread,’ will say, ‘Amen;’ but when they come to the petition, ‘Thy will be done on earth, as it is in heaven,’ they are cold there, and have not hearty desires and earnest affections. Many beg pardon of sin; but to be kept from evil, to bridle and restrain their souls from sin, they do not say amen to that. Many would have defense, maintenance, and victory over their enemies; but not with respect to God’s glory. They forget that petition, ‘Hallowed by thy name;’ but this should be subordinated to his glory. Nay, we must say Amen to all the clauses of this prayer. Many say, ‘Lord forgive us our debts,’ but do not like that, ‘as we forgive our debtors:’ they are loth to forgive their enemies, but carry a rancorous mind to them which have done them wrong. But now we must say Amen to all that is specified in this prayer. Then, Mark this Amen, it is put in the close of the doxology. Observe, hence, There must be a hearty Amen to our praises as well as our prayers, that we may show zeal for God’s glory, as well as affection to our profit. Your Allelujahs should sound as loud as your supplications; and not only say Amen when you come with prayers and requests, things you stand in need of, but Amen when you are praising of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Lord’s Prayer, ‘For ever. Amen.’</cite>, vol. 1, pp. 253-4</span></figcaption>

ve+hence%2C+That+it+is+good+to+conclude+holy+exercises+with+some+vigor+and+warmth.+Natural+motion+is+swifter+in+the+end+and+close%3A+so+should+our+spiritual+affections%2C+as+we+draw+to+a+conclusion%2C+put+forth+the+efficacy+of+faith+and+holy+desires%2C+and+recollect%2C+as+it+were%2C+all+the+foregoing+affections%3B+that+we+may+go+out+of+the+presence+of+God+with+a+sweet+savor+and+relish%2C+and+a+renewed+confidence+in+his+mercy+and+power.+Again%2C+this+Amen+relates+to+all+the+foregoing+petitions%2C+not+to+one+only.+Many%2C+when+they+hear%2C+%E2%80%98Lord%2C+give+us+this+day+our+daily+bread%2C%E2%80%99+will+say%2C+%E2%80%98Amen%3B%E2%80%99+but+when+they+come+to+the+petition%2C+%E2%80%98Thy+will+be+done+on+earth%2C+as+it+is+in+heaven%2C%E2%80%99+they+are+cold+there%2C+and+have+not+hearty+desires+and+earnest+affections.+Many+beg+pardon+of+sin%3B+but+to+be+kept+from+evil%2C+to+bridle+and+restrain+their+souls+from+sin%2C+they+do+not+say+amen+to+that.+Many+would+have+defense%2C+maintenance%2C+and+victory+over+their+enemies%3B+but+not+with+respect+to+God%E2%80%99s+glory.+They+forget+that+petition%2C+%E2%80%98Hallowed+by+thy+name%3B%E2%80%99+but+this+should+be+subordinated+to+his+glory.+Nay%2C+we+must+say+Amen+to+all+the+clauses+of+this+prayer.+Many+say%2C+%E2%80%98Lord+forgive+us+our+debts%2C%E2%80%99+but+do+not+like+that%2C+%E2%80%98as+we+forgive+our+debtors%3A%E2%80%99+they+are+loth+to+forgive+their+enemies%2C+but+carry+a+rancorous+mind+to+them+which+have+done+them+wrong.+But+now+we+must+say+Amen+to+all+that+is+specified+in+this+prayer.+Then%2C+Mark+this+Amen%2C+it+is+put+in+the+close+of+the+doxology.+Observe%2C+hence%2C+There+must+be+a+hearty+Amen+to+our+praises+as+well+as+our+prayers%2C+that+we+may+show+zeal+for+God%E2%80%99s+glory%2C+as+well+as+affection+to+our+profit.+Your+Allelujahs+should+sound+as+loud+as+your+supplications%3B+and+not+only+say+Amen+when+you+come+with+prayers+and+requests%2C+things+you+stand+in+need+of%2C+but+Amen+when+you+are+praising+of+God.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Practical+Exposition+of+the+Lord%E2%80%99s+Prayer%2C+%E2%80%98For+ever.+Amen.%E2%80%99%2C+vol.+1%2C+pp.+253-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2380f3e7e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2380f3e7e6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/saying-amen-after-prayers-in-worship/#:~:text=All%20this%20is%20sealed%20up%20to,when%20you%20are%20praising%20of%20God&amp;text=All%20this%20is%20sealed%20up%20to%20us%20in&amp;text=but%20Amen%20when%20you%20are%20praising%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

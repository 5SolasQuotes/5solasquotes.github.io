<main class="wrap"><figure class="quote" id="q-bb7c6bef38" data-kw="">
<blockquote><p>1. Man is to be considered as a creature [and] 2. as such a creature, to wit, endued with reason and the Image of God; in either considerations, especially in the former, all that are created are obliged to do and suffer the will of God though they never sinned. It’s not enough to say that sun, moon, trees, herbs, vines, earth, beasts, birds and fishes cannot suffer the ill of punishment which is relative to the break of a Law, for the whole creation is subject to vanity for our sins, Rom. 8:20-21. The servant is smitten and sickened for the master’s sake, and God may take from them what He gave them, [even] their lives without sense of pain and dolor, for all beings, yea [even] defects and privations, are debtors to the glory-declarative of God, Prov. 16:4; Rom. 11:36; yea, and no-beings [things that could be, but are not,] are under this debt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (1655)</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-81ed76e0e9" data-kw="">
<blockquote><p>Some things were created in themselves, others in their causes, such as meteors; animals that arise from the commixture of species, like mules, leopards; and according to some, insects, which are thought, but falsely, to be made from putrefaction. Some things are co-created rather than created, such as accidents and adjuncts in their subjects; universals in their species and individuals; time and place or space, in which creatures are received.</p></blockquote>

</figure><figure class="quote" id="q-b3534ad0fd" data-kw="">
<blockquote><p>Creation is the action of God, whereby out of nothing He brought forth nature itself and all things in nature, both substances and accidents, in and with the substances, and finished them in the space of six days, both to his own glory and the salvation of the elect… Or thus, creation is a transient or external action of God, whereby in the beginning He made the world by a mere command out of his own free will in six days’ space to the glory of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity (London: 1654), bk. 3, ch. 2</cite>, p. 225</span></figcaption>

</figure><figure class="quote" id="q-90594fc31d" data-kw="">
<blockquote><p>The possible, on the other hand, can be defined as that to which existence is not repugnant. So it is the same as the notion of being or of thing, and it includes both actually existing things and things that do not actually exist but can exist. For something to be possible in this sense, both extrinsic and intrinsic impossibility must be excluded. Logical possibility in the broad sense therefore includes both internal non-repugnance to existing (logical possibility properly speaking) and, if the being is causable, virtual existence in its cause (virtual possibility).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

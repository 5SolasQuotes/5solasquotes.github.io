<main class="wrap"><figure class="quote" id="q-5254a69952" data-kw="">
<blockquote><p>A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), ch. 4, ‘The Will’, pp. 137-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cbb708b33" data-kw="">
<blockquote><p>They all happen and are according to the decree, but they are not caused by it, and therefore rational agents may act freely notwithstanding the preordination of God. For the decree does not so affect the actions of men, as to lay any force upon the actors. It is not denied that there is a necessity of the certain futurition of the acts and events, so that they shall infallibly and inevitably come to pass; but there is not on the things themselves or the actors a necessity, whereby the persons are forced to do what they do, and ot do it unwillingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Veritas Redux</cite>, p. 266</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

— John Edwards, Veritas Redux: Evangelical Truths Restored: Namely, Those Concerning God’s Eternal Decrees, The Liberty of Man’s Will, Grace &amp; Conversion, The Extent &amp; Efficacy of Christ’s Redemption, &amp; Perseverance in Grace, p. 266">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+all+happen+and+are+according+to+the+decree%2C+but+they+are+not+caused+by+it%2C+and+therefore+rational+agents+may+act+freely+notwithstanding+the+preordination+of+God.+For+the+decree+does+not+so+affect+the+actions+of+men%2C+as+to+lay+any+force+upon+the+actors.+It+is+not+denied+that+there+is+a+necessity+of+the+certain+futurition+of+the+acts+and+events%2C+so+that+they+shall+infallibly+and+inevitably+come+to+pass%3B+but+there+is+not+on+the+things+themselves+or+the+actors+a+necessity%2C+whereby+the+persons+are+forced+to+do+what+they+do%2C+and+ot+do+it+unwillingly.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Veritas+Redux%3A+Evangelical+Truths+Restored%3A+Namely%2C+Those+Concerning+God%E2%80%99s+Eternal+Decrees%2C+The+Liberty+of+Man%E2%80%99s+Will%2C+Grace+%26+Conversion%2C+The+Extent+%26+Efficacy+of+Christ%E2%80%99s+Redemption%2C+%26+Perseverance+in+Grace%2C+p.+266&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cbb708b33.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8cbb708b33.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=They%20all%20happen%20and%20are%20according,do%2C%20and%20ot%20do%20it%20unwillingly&amp;text=They%20all%20happen%20and%20are%20according%20to%20the&amp;text=what%20they%20do%2C%20and%20ot%20do%20it%20unwillingly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a541fa9b54" data-kw="">
<blockquote><p>It is true that people, through corruption of nature, are averse to submit to governors ‘for conscience sake, as unto the Lord,’ because the natural man, remaining in the state of nature, can do nothing that is truly good, but it is false that men have no active moral power to submit to superiors, but only a passive capacity to be governed. He [John Maxwell] quite contradicts himself; for he said before (ch. 4, p. 49) that there is an ‘innate fear and reverence in the hearts of all men naturally, even in heathens, toward their sovereign;’ yea, as we have a natural moral active power to love our parents and superiors (though it be not evangelically, or legally in God’s court, good) and so to obey their commandments, only we are averse to penal laws of superiors. But this proves no way that we have only by nature a passive capacity to government; for heathens have, by instinct of nature, both made laws morally good, submitted to them, and set kings and judges over them, which clearly proves that men have an active power of government by nature. Yea, what difference makes the Prelate betwixt men and beasts? for beasts have a capacity to be governed, even lions and tigers; but here is the matter, if men have any natural power of government, the Popish Prelate would have it, with his brethren the Jesuits and Arminians, to be not natural, but done by the help of universal grace; for so do they confound nature and grace. But it is certain our power to submit to rulers and kings, as to rectors, and guides, and fathers, is natural;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 30</span></figcaption>

</figure><figure class="quote" id="q-ddacbd6460" data-kw="">
<blockquote><p>Free will, in the sense of those [errorists] who maintain it, is [said to be] a power in the will to incline either way, when that which is supernatural and saving is offered as its object; a power and freedom in the will to choose or refuse, to yield or resist, to embrace or reject, as it list. So that this with them is twofold: … 2. To choose, or embrace. The will, they [errorists] say, can incline to that which is spiritually and supernaturally good. They speak not of a capacity, which is not denied, but of an active power. A natural man, by the power of his will, as he can reject Christ, so he can embrace Him; as he can resist converting grace, so he can yield to it as he will; the will can incline itself to this as well as to the other. This is a true representation of their opinion in the other branch of it. Against which we say…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Man’s Insufficiency to do Anything of Himself’, on John 15:5</cite>, vol. 2, p. 128-29</span></figcaption>

<blockquote><p>No creature can do those things that are above nature as principal agent; however, it can cause a motion by uncreated power as instrumental agent: for as there is an obediential potency in creation, so that whatever the Creator has disposed happens in it, thus also so that it happens by means of it, which is the definition of an instrument.</p></blockquote>

<blockquote><p>But unto the place which the Lord your God shall choose out of all your tribes to put his name there, even unto his habitation shall ye seek, and thither thou shalt come: And thither ye shall bring your burnt offerings… And there ye shall eat before the Lord your God, and ye shall rejoice in all that ye put your hand unto, ye and your households, wherein the Lord thy God hath blessed thee… But thou must eat them before the Lord thy God in the place which the Lord thy God shall choose, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite that is within thy gates: and thou shalt rejoice before the Lord thy God in all that thou puttest thine hands unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Deut. 12:5-7 &amp; 18</cite></span></figcaption>

<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-8a66e20ff8" data-kw="">
<blockquote><p>It being impossible for the mind of man to be always intent upon business and for the body to be exercised in continual labours, the wisdom of God has therefore adjudged some diversion and recreation (the better to fit both body and mind for the service of their Maker) to be both needful and expedient: such is the constitution of our bodies and the complexion of our minds that neither of them can endure a constant toil without some relaxation and delighting diversion. As a bow, if always bent, will prove sluggish and unserviceable, in like manner will a Christian’s mind if always intent upon the best things: the arrow of devotion will soon flag, and fly but slowly towards heaven. A wise and good man perhaps could wish that his body needed no such diversion, but finding his body tire and grow weary, he is forced to give way and choose such recreations as are healthful, short and proper to refresh both mind and body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help &amp; Guide to Christian Families</cite>, … (d. 1703; London: SPCK, 1840), ch. 6, ‘Of Glorifying God in our Recreations,’, p. 27</span></figcaption>

</figure><figure class="quote" id="q-a27b0f61c7" data-kw="">
<blockquote><p>1. That we are to spend the whole time in public and private exercises of God’s worship.

2. Except so much as it be taken up in the works of necessity and mercy. The former directs us to that which is the main work of the Day, the latter to that which is subordinate and occasional. …we are therefore to keep it [the Day] holy, as we are enjoined in the body of the [4th] Command, which we observed, includes in it something positive. 2. The duties of worship to be attended by us on this Day, are either Natural or Instituted…

1. The duties of natural worship, are such as are suited to the nature of man, and flow from the great End he was made for, viz. actively to glorify God. And therefore the light of Nature directs men to practice them on all occasions, certainly then these are fitted for the Sabbath, according to the End and usefulness of it…

2. The duties of instituted worship. And under these are contained all the positive ordinances and sacred ceremonies of God’s appointment. In the days of the Law there were sacrifices appointed to be offered on these days… But all these are not out of doors under the Gospel, being to give place to a more spiritual worship, which is adapted thereunto. Nevertheless, there are appointments under the Gospel, which are positive, and these are either the way and manner, in which the duties of natural worship are to be attended, in the public assemblies, and the ministration of the Word, and preaching of it, which is also required on the Sabbath; or the dispensation of the sacraments of the Gospel, which we have before taken notice of, as belonging to the Sabbath. …

4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: Nevertheless because this is the principal and direct business of the Day, it is to have a very great regard had to it in all that we do. And here I shall only offer a few general rules: …

2. It is not necessary that all the duties of worship be solemnly attended on every Sabbath. Though there are none that belong to, and are proper for that day, yet there is no obligation lying upon us to go through them all every time the Sabbath recurs; but there is a prudence to be used by the people of God on this account, though still there are some which should be more constantly attended, and others more intermittedly. And here observe, that there are the duties of natural worship, which challenge the first place and more constant attendance, viz. prayer, and the dispensation of the Word of God, and holy meditation: whereas those which are ceremonial may have their particular times to be attended…

3. That the public and private duties of worship, ought so to be ordered, that they may help and not thrust out one the other. The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… the seasons of public worship must be ordered for edification, which naturally requires that all are agreed in it, else there will be no avoiding of confusion. …

5. That whatsoever they do on that Day, ought to be with a suitable regard to the holiness of the time… (2.) There is an exception made of so much time, as is to be taken up, in works of necessity and mercy: i.e. These may and must interrupt the other duties, so far as they do intervene. And for a right understanding of this, let these things be observed:

1. That the Sabbath was appointed for man’s good, and not for his harm. This is a general rule, but may be particularly accommodated with due caution. Our Savior makes use of it, in reflecting upon the unjust censures of the Pharisees cast upon his disciples, for gathering and eating ears of corn on the Sabbath Day, Mk. 2:27, “And He said unto them, The Sabbath was made for man, and not man for the Sabbath.” It was indeed to advance man’s spiritual interest, in giving him opportunity to sequester himself for communion with God in the way of mediate worship, but was never intended to hurt any of his interests in this world.

2. That as there are duties of worship to be performed on our days, so there are duties of righteousness to be done on God’s Day. These duties, though they differ in the next object and end, the one belonging to the First, the other to the Second Table, yet they agree on the ultimate object and end, which is God and his glory; for this as well as that is to be done in obedience to Him; and when they are so done sincerely, we have communion with God in them: The one belongs to our duty to man, but it is in order of serving God, and so they do not necessarily thwart one the other… In like manner there are Second Table duties that may or ought to be done on Holy Time; and are either stated duties of the Day, or are occasionally called for by the circumstances: what these are will be presently considered.

3. In the doing of the duties of the Sabbath, we are to employ our body as well as our soul… Nor can God’s people hold visible communion one with another, without the using of their bodies in it: We are therefore commanded, 1 Cor. 6:20, “Glorify God in your body, and in your spirit, which are God’s. And the reason for it is cogent, viz. Christ has redeemed the whole man; and indeed the body is necessarily the soul’s organ in the working of its imperate [commanded] acts in which all outward worship of God is to be performed by man; and therefore a pretense to a spiritual communion to exclude the other is Enthusiastical.

4. Hence that the body may be fit to discharge these duties aright, there is something to be done for it on that Day. The body has a dependence on means for the maintaining of the vigor and activity of it, whereby it may be fit to attend the service it is appointed to, without tiring, fainting or giving in: and it stands in need of this as well for Sabbath service, as for the business of this life; for we are to do these with our might, as well as the other: whatsoever is requisite for this, must be very proper for the Day…

5. And there are duties which we owe to our neighbor on the Sabbath, as well as at any other time. The duty of loving our neighbor as ourselves is an abiding duty, and uninterrupted: It is not only a Week Day duty, and to be omitted on the Sabbath; though that be to govern us in the right discharge of it: And he may, and very often does, stand in need of our affording it to him, not only for his soul, by counseling and instructing him in the things of God; but also in regard of his bodily and outward concerns, which are not in themselves the acts of worship, but of charity; but yet are not to be omitted, till this Day be over.

6. These duties are usually distributed into the works of necessity and mercy. It is true, the works of mercy here called for, are such as have a moral necessity on them, arising from the physical necessity of the subject, which makes it our duty, if we will not bring guilt of sin upon ourselves, to attend on: And the works of necessity here intended, may in a sense be called the works of mercy, because they succour the subject against that misery which they must otherwise undergo: But we look upon them under this distinct consideration. And then: (1.) Under the head of Necessity we rank two sorts, viz.

1. Such as are of Ordinary necessity or convenience. For we are not to think the Precept is here tied up to things absolutely necessary; as if nothing might be done, but what the creature could not subsist without, but such things as are needful, for the comfortable serving of God. …

2. Such as fall out Extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’ (2.) To quench fires that break forth, which otherwise would lay all waste before them. That is a sudden emergency, and was not to be seen before, and calls for speed and expedition, and the least hindrance will soon make all attempts too late, for miracles are not in this case to be expected. And hence any other thing of like importance, that falls out in the Day, and may not be delayed, comes within this verge. (2.) Under the head of mercy, these things more especially do come; (1.) To visit the sick. That is in itself a duty of Christians, appears in that it is referred to Pure Religion, James 1:27. And the reason of this is, because their necessity calls for it, and it is a work of mercy to do it, and to neglect it when needed is inhumane: and there are cases in which that will stand, Mt. 9:13, “I will have mercy, and not sacrifice.</p></blockquote>

3. That the public and private duties of worship, ought so to be ordered, that they may help and not thrust out one the other. The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… the seasons of public worship must be ordered for edification, which naturally requires that all are agreed in it, else there will be no avoiding of confusion. …

5. That whatsoever they do on that Day, ought to be with a suitable regard to the holiness of the time… (2.) There is an exception made of so much time, as is to be taken up, in works of necessity and mercy: i.e. These may and must interrupt the other duties, so far as they do intervene. And for a right understanding of this, let these things be observed:

1. That the Sabbath was appointed for man’s good, and not for his harm. This is a general rule, but may be particularly accommodated with due caution. Our Savior makes use of it, in reflecting upon the unjust censures of the Pharisees cast upon his disciples, for gathering and eating ears of corn on the Sabbath Day, Mk. 2:27, “And He said unto them, The Sabbath was made for man, and not man for the Sabbath.” It was indeed to advance man’s spiritual interest, in giving him opportunity to sequester himself for communion with God in the way of mediate worship, but was never intended to hurt any of his interests in this world.

2. That as there are duties of worship to be performed on our days, so there are duties of righteousness to be done on God’s Day. These duties, though they differ in the next object and end, the one belonging to the First, the other to the Second Table, yet they agree on the ultimate object and end, which is God and his glory; for this as well as that is to be done in obedience to Him; and when they are so done sincerely, we have communion with God in them: The one belongs to our duty to man, but it is in order of serving God, and so they do not necessarily thwart one the other… In like manner there are Second Table duties that may or ought to be done on Holy Time; and are either stated duties of the Day, or are occasionally called for by the circumstances: what these are will be presently considered.

3. In the doing of the duties of the Sabbath, we are to employ our body as well as our soul… Nor can God’s people hold visible communion one with another, without the using of their bodies in it: We are therefore commanded, 1 Cor. 6:20, “Glorify God in your body, and in your spirit, which are God’s. And the reason for it is cogent, viz. Christ has redeemed the whole man; and indeed the body is necessarily the soul’s organ in the working of its imperate [commanded] acts in which all outward worship of God is to be performed by man; and therefore a pretense to a spiritual communion to exclude the other is Enthusiastical.

4. Hence that the body may be fit to discharge these duties aright, there is something to be done for it on that Day. The body has a dependence on means for the maintaining of the vigor and activity of it, whereby it may be fit to attend the service it is appointed to, without tiring, fainting or giving in: and it stands in need of this as well for Sabbath service, as for the business of this life; for we are to do these with our might, as well as the other: whatsoever is requisite for this, must be very proper for the Day…

5. And there are duties which we owe to our neighbor on the Sabbath, as well as at any other time. The duty of loving our neighbor as ourselves is an abiding duty, and uninterrupted: It is not only a Week Day duty, and to be omitted on the Sabbath; though that be to govern us in the right discharge of it: And he may, and very often does, stand in need of our affording it to him, not only for his soul, by counseling and instructing him in the things of God; but also in regard of his bodily and outward concerns, which are not in themselves the acts of worship, but of charity; but yet are not to be omitted, till this Day be over.

6. These duties are usually distributed into the works of necessity and mercy. It is true, the works of mercy here called for, are such as have a moral necessity on them, arising from the physical necessity of the subject, which makes it our duty, if we will not bring guilt of sin upon ourselves, to attend on: And the works of necessity here intended, may in a sense be called the works of mercy, because they succour the subject against that misery which they must otherwise undergo: But we look upon them under this distinct consideration. And then: (1.) Under the head of Necessity we rank two sorts, viz.

1. Such as are of Ordinary necessity or convenience. For we are not to think the Precept is here tied up to things absolutely necessary; as if nothing might be done, but what the creature could not subsist without, but such things as are needful, for the comfortable serving of God. …

2. Such as fall out Extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’ (2.) To quench fires that break forth, which otherwise would lay all waste before them. That is a sudden emergency, and was not to be seen before, and calls for speed and expedition, and the least hindrance will soon make all attempts too late, for miracles are not in this case to be expected. And hence any other thing of like importance, that falls out in the Day, and may not be delayed, comes within this verge. (2.) Under the head of mercy, these things more especially do come; (1.) To visit the sick. That is in itself a duty of Christians, appears in that it is referred to Pure Religion, James 1:27. And the reason of this is, because their necessity calls for it, and it is a work of mercy to do it, and to neglect it when needed is inhumane: and there are cases in which that will stand, Mt. 9:13, “I will have mercy, and not sacrifice.”

— Samuel Willard, A Complete Body of Divinity, … (Boston, 1726), Sermon 172, Q. 60, pp. 584-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+That+we+are+to+spend+the+whole+time+in+public+and+private+exercises+of+God%E2%80%99s+worship.+2.+Except+so+much+as+it+be+taken+up+in+the+works+of+necessity+and+mercy.+The+former+directs+us+to+that+which+is+the+main+work+of+the+Day%2C+the+latter+to+that+which+is+subordinate+and+occasional.+%E2%80%A6we+are+therefore+to+keep+it+%5Bthe+Day%5D+holy%2C+as+we+are+enjoined+in+the+body+of+the+%5B4th%5D+Command%2C+which+we+observed%2C+includes+in+it+something+positive.+2.+The+duties+of+worship+to+be+attended+by+us+on+this+Day%2C+are+either+Natural+or+Instituted%E2%80%A6+1.+The+duties+of+natural+worship%2C+are+such+as+are+suited+to+the+nature+of+man%2C+and+flow+from+the+great+End+he+was+made+for%2C+viz.+actively+to+glorify+God.+And+therefore+the+light+of+Nature+directs+men+to+practice+them+on+all+occasions%2C+certainly+then+these+are+fitted+for+the+Sabbath%2C+according+to+the+End+and+usefulness+of+it%E2%80%A6+2.+The+duties+of+instituted+worship.+And+under+these+are+contained+all+the+positive+ordinances+and+sacred+ceremonies+of+God%E2%80%99s+appointment.+In+the+days+of+the+Law+there+were+sacrifices+appointed+to+be+offered+on+these+days%E2%80%A6+But+all+these+are+not+out+of+doors+under+the+Gospel%2C+being+to+give+place+to+a+more+spiritual+worship%2C+which+is+adapted+thereunto.+Nevertheless%2C+there+are+appointments+under+the+Gospel%2C+which+are+positive%2C+and+these+are+either+the+way+and+manner%2C+in+which+the+duties+of+natural+worship+are+to+be+attended%2C+in+the+public+assemblies%2C+and+the+ministration+of+the+Word%2C+and+preaching+of+it%2C+which+is+also+required+on+the+Sabbath%3B+or+the+dispensation+of+the+sacraments+of+the+Gospel%2C+which+we+have+before+taken+notice+of%2C+as+belonging+to+the+Sabbath.+%E2%80%A6+4.+That+this+whole+time+is%2C+as+far+as+may+be%2C+to+be+employed+in+some+or+other+of+these+exercises.+That+it+cannot+all+of+it+be+actually+so+attended%2C+will+be+considered+afterwards%3A+Nevertheless+because+this+is+the+principal+and+direct+business+of+the+Day%2C+it+is+to+have+a+very+great+regard+had+to+it+in+all+that+we+do.+And+here+I+shall+only+offer+a+few+general+rules%3A+%E2%80%A6+2.+It+is+not+necessary+that+all+the+duties+of+worship+be+solemnly+attended+on+every+Sabbath.+Though+there+are+none+that+belong+to%2C+and+are+proper+for+that+day%2C+yet+there+is+no+obligation+lying+upon+us+to+go+through+them+all+every+time+the+Sabbath+recurs%3B+but+there+is+a+prudence+to+be+used+by+the+people+of+God+on+this+account%2C+though+still+there+are+some+which+should+be+more+constantly+attended%2C+and+others+more+intermittedly.+And+here+observe%2C+that+there+are+the+duties+of+natural+worship%2C+which+challenge+the+first+place+and+more+constant+attendance%2C+viz.+prayer%2C+and+the+dispensation+of+the+Word+of+God%2C+and+holy+meditation%3A+whereas+those+which+are+ceremonial+may+have+their+particular+times+to+be+attended%E2%80%A6+3.+That+the+public+and+private+duties+of+worship%2C+ought+so+to+be+ordered%2C+that+they+may+help+and+not+thrust+out+one+the+other.+The+whole+Sabbath+is+not+to+be+spent+in+public%2C+nor+yet+in+private+ordinarily%2C+except+when+the+providence+of+God+prevents+the+opportunity+of+public+assemblies%2C+which+is+wont+%5Baccustomed%5D+to+fall+out+in+times+of+persecution%E2%80%A6+the+seasons+of+public+worship+must+be+ordered+for+edification%2C+which+naturally+requires+that+all+are+agreed+in+it%2C+else+there+will+be+no+avoiding+of+confusion.+%E2%80%A6+5.+That+whatsoever+they+do+on+that+Day%2C+ought+to+be+with+a+suitable+regard+to+the+holiness+of+the+time%E2%80%A6+%282.%29+There+is+an+exception+made+of+so+much+time%2C+as+is+to+be+taken+up%2C+in+works+of+necessity+and+mercy%3A+i.e.+These+may+and+must+interrupt+the+other+duties%2C+so+far+as+they+do+intervene.+And+for+a+right+understanding+of+this%2C+let+these+things+be+observed%3A+1.+That+the+Sabbath+was+appointed+for+man%E2%80%99s+good%2C+and+not+for+his+harm.+This+is+a+general+rule%2C+but+may+be+particularly+accommodated+with+due+caution.+Our+Savior+makes+use+of+it%2C+in+reflecting+upon+the+unjust+censures+of+the+Pharisees+cast+upon+his+disciples%2C+for+gathering+and+eating+ears+of+corn+on+the+Sabbath+Day%2C+Mk.+2%3A27%2C+%E2%80%9CAnd+He+said+unto+them%2C+The+Sabbath+was+made+for+man%2C+and+not+man+for+the+Sabbath.%E2%80%9D+It+was+indeed+to+advance+man%E2%80%99s+spiritual+interest%2C+in+giving+him+opportunity+to+sequester+himself+for+communion+with+God+in+the+way+of+mediate+worship%2C+but+was+never+intended+to+hurt+any+of+his+interests+in+this+world.+2.+That+as+there+are+duties+of+worship+to+be+performed+on+our+days%2C+so+there+are+duties+of+righteousness+to+be+done+on+God%E2%80%99s+Day.+These+duties%2C+though+they+differ+in+the+next+object+and+end%2C+the+one+belonging+to+the+First%2C+the+other+to+the+Second+Table%2C+yet+they+agree+on+the+ultimate+object+and+end%2C+which+is+God+and+his+glory%3B+for+this+as+well+as+that+is+to+be+done+in+obedience+to+Him%3B+and+when+they+are+so+done+sincerely%2C+we+have+communion+with+God+in+them%3A+The+one+belongs+to+our+duty+to+man%2C+but+it+is+in+order+of+serving+God%2C+and+so+they+do+not+necessarily+thwart+one+the+other%E2%80%A6+In+like+manner+there+are+Second+Table+duties+that+may+or+ought+to+be+done+on+Holy+Time%3B+and+are+either+stated+duties+of+the+Day%2C+or+are+occasionally+called+for+by+the+circumstances%3A+what+these+are+will+be+presently+considered.+3.+In+the+doing+of+the+duties+of+the+Sabbath%2C+we+are+to+employ+our+body+as+well+as+our+soul%E2%80%A6+Nor+can+God%E2%80%99s+people+hold+visible+communion+one+with+another%2C+without+the+using+of+their+bodies+in+it%3A+We+are+therefore+commanded%2C+1+Cor.+6%3A20%2C+%E2%80%9CGlorify+God+in+your+body%2C+and+in+your+spirit%2C+which+are+God%E2%80%99s.+And+the+reason+for+it+is+cogent%2C+viz.+Christ+has+redeemed+the+whole+man%3B+and+indeed+the+body+is+necessarily+the+soul%E2%80%99s+organ+in+the+working+of+its+imperate+%5Bcommanded%5D+acts+in+which+all+outward+worship+of+God+is+to+be+performed+by+man%3B+and+therefore+a+pretense+to+a+spiritual+communion+to+exclude+the+other+is+Enthusiastical.+4.+Hence+that+the+body+may+be+fit+to+discharge+these+duties+aright%2C+there+is+something+to+be+done+for+it+on+that+Day.+The+body+has+a+dependence+on+means+for+the+maintaining+of+the+vigor+and+activity+of+it%2C+whereby+it+may+be+fit+to+attend+the+service+it+is+appointed+to%2C+without+tiring%2C+fainting+or+giving+in%3A+and+it+stands+in+need+of+this+as+well+for+Sabbath+service%2C+as+for+the+business+of+this+life%3B+for+we+are+to+do+these+with+our+might%2C+as+well+as+the+other%3A+whatsoever+is+requisite+for+this%2C+must+be+very+proper+for+the+Day%E2%80%A6+5.+And+there+are+duties+which+we+owe+to+our+neighbor+on+the+Sabbath%2C+as+well+as+at+any+other+time.+The+duty+of+loving+our+neighbor+as+ourselves+is+an+abiding+duty%2C+and+uninterrupted%3A+It+is+not+only+a+Week+Day+duty%2C+and+to+be+omitted+on+the+Sabbath%3B+though+that+be+to+govern+us+in+the+right+discharge+of+it%3A+And+he+may%2C+and+very+often+does%2C+stand+in+need+of+our+affording+it+to+him%2C+not+only+for+his+soul%2C+by+counseling+and+instructing+him+in+the+things+of+God%3B+but+also+in+regard+of+his+bodily+and+outward+concerns%2C+which+are+not+in+themselves+the+acts+of+worship%2C+but+of+charity%3B+but+yet+are+not+to+be+omitted%2C+till+this+Day+be+over.+6.+These+duties+are+usually+distributed+into+the+works+of+necessity+and+mercy.+It+is+true%2C+the+works+of+mercy+here+called+for%2C+are+such+as+have+a+moral+necessity+on+them%2C+arising+from+the+physical+necessity+of+the+subject%2C+which+makes+it+our+duty%2C+if+we+will+not+bring+guilt+of+sin+upon+ourselves%2C+to+attend+on%3A+And+the+works+of+necessity+here+intended%2C+may+in+a+sense+be+called+the+works+of+mercy%2C+because+they+succour+the+subject+against+that+misery+which+they+must+otherwise+undergo%3A+But+we+look+upon+them+under+this+distinct+consideration.+And+then%3A+%281.%29+Under+the+head+of+Necessity+we+rank+two+sorts%2C+viz.+1.+Such+as+are+of+Ordinary+necessity+or+convenience.+For+we+are+not+to+think+the+Precept+is+here+tied+up+to+things+absolutely+necessary%3B+as+if+nothing+might+be+done%2C+but+what+the+creature+could+not+subsist+without%2C+but+such+things+as+are+needful%2C+for+the+comfortable+serving+of+God.+%E2%80%A6+2.+Such+as+fall+out+Extraordinarily%2C+or+on+special+occasions%2C+which+put+unavoidable+necessity+of+intermitting+the+proper+duties+of+the+Day%3B+and+if+we+do+not+attend+them%2C+we+shall+be+further+exposed.+And+of+this+sort+are%3A+%281.%29+To+fight+or+fly+from+an+invading+enemy%3A+if+not+to+be+aggressors+on+such+a+Day%2C+yet+to+stand+on+their+own+defense%2C+when+assaulted.+The+law+of+self-preservation+calls+for+it%2C+and+the+thing+itself+puts+by+duties+of+worship%2C+and+if+this+were+not+a+duty%2C+but+unlawful%2C+we+should+by+it+become+a+prey+to+them+that+hate+us.+And+as+to+flying%2C+when+oppressed+on+a+Sabbath+by+a+prevailing+foe%2C+against+whom+we+cannot+defend+ourselves%2C+our+Savior+supposes+it+lawful%2C+though+afflictive%2C+in+Mt.+24%3A20%2C+%E2%80%98Pray+that+your+flight+be+not+on+the+Sabbath+Day.%E2%80%99+%282.%29+To+quench+fires+that+break+forth%2C+which+otherwise+would+lay+all+waste+before+them.+That+is+a+sudden+emergency%2C+and+was+not+to+be+seen+before%2C+and+calls+for+speed+and+expedition%2C+and+the+least+hindrance+will+soon+make+all+attempts+too+late%2C+for+miracles+are+not+in+this+case+to+be+expected.+And+hence+any+other+thing+of+like+importance%2C+that+falls+out+in+the+Day%2C+and+may+not+be+delayed%2C+comes+within+this+verge.+%282.%29+Under+the+head+of+mercy%2C+these+things+more+especially+do+come%3B+%281.%29+To+visit+the+sick.+That+is+in+itself+a+duty+of+Christians%2C+appears+in+that+it+is+referred+to+Pure+Religion%2C+James+1%3A27.+And+the+reason+of+this+is%2C+because+their+necessity+calls+for+it%2C+and+it+is+a+work+of+mercy+to+do+it%2C+and+to+neglect+it+when+needed+is+inhumane%3A+and+there+are+cases+in+which+that+will+stand%2C+Mt.+9%3A13%2C+%E2%80%9CI+will+have+mercy%2C+and+not+sacrifice.%E2%80%9D%0A%0A%E2%80%94+Samuel+Willard%2C+A+Complete+Body+of+Divinity%2C+%E2%80%A6+%28Boston%2C+1726%29%2C+Sermon+172%2C+Q.+60%2C+pp.+584-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa27b0f61c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a27b0f61c7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=1.%20That%20we%20are%20to%20spend,will%20have%20mercy%2C%20and%20not%20sacrifice&amp;text=1.%20That%20we%20are%20to%20spend%20the%20whole&amp;text=9%3A13%2C%20%E2%80%9CI%20will%20have%20mercy%2C%20and%20not%20sacrifice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day, and for bringing them unto holy and public assemblies and places of prayer and of God’s worship and holy service, that without such working and laboring even on that day they neither can be so fit and able to serve God joyfully, and to worship Him with cheerful hearts… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labour and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Saviour and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1.2.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day, and for bringing them unto holy and public assemblies and places of prayer and of God’s worship and holy service, that without such working and laboring even on that day they neither can be so fit and able to serve God joyfully, and to worship Him with cheerful hearts… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labour and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Saviour and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1.2.”

— George Walker, The Doctrine of the Sabbath… (Amsterdam, 1638), ch. 21, p. 152. Walker was a Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+second+sort+of+works+allowed+to+be+done+on+the+Lord%E2%80%99s+day%3A+are+bodily+works+and+labors+which+are+so+necessary+for+the+fitting+and+enabling+of+Christians+to+sanctify+that+day%2C+and+for+bringing+them+unto+holy+and+public+assemblies+and+places+of+prayer+and+of+God%E2%80%99s+worship+and+holy+service%2C+that+without+such+working+and+laboring+even+on+that+day+they+neither+can+be+so+fit+and+able+to+serve+God+joyfully%2C+and+to+worship+Him+with+cheerful+hearts%E2%80%A6+And+because+men+cannot+be+so+cheerful+in+the+service+of+God%2C+nor+so+heartily+rejoice+before+Him%2C+not+with+strength+and+delight+spend+the+whole+day+in+Sabbath+duties%2C+without+warm+and+wholesome+food%2C+and+plentiful+refreshing+of+their+weak+bodies%2C+therefore+the+dressing%2C+boiling%2C+baking+and+roasting+of+meat+is+lawful+on+the+Lord%E2%80%99s+day%2C+so+far+as+it+more+helps+than+hinders+holy+duties+and+the+service+of+God.+This+is+manifest+by+the+words+of+the+law%2C+Ex.+12%3A16%2C+where+the+Lord+forbidding+all+manner+of+work+on+his+holy+Sabbaths%2C+excepts+labour+and+work+about+that+which+people+were+to+eat%2C+and+which+was+necessary+for+the+upholding+of+an+holy+moderate+feasting+on+those+days.+This+was+practised+by+the+Pharisees+and+by+our+Saviour+and+his+apostles+who+on+the+Sabbath+day+came+to+a+feast+to+the+house+of+a+chief+Pharisee%2C+Lk.+14%3A1.2.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+Doctrine+of+the+Sabbath%E2%80%A6+%28Amsterdam%2C+1638%29%2C+ch.+21%2C+p.+152.+Walker+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F132618e73c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/132618e73c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=A%20second%20sort%2

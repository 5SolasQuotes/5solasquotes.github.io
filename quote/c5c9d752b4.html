<main class="wrap"><figure class="quote" id="q-c5c9d752b4" data-kw="">
<blockquote><p>If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), question 16, pp. 66-67</span></figcaption>

</figure><figure class="quote" id="q-70a973b5f5" data-kw="">
<blockquote><p>But it is a question of more moment: How God promises a reward to these sons of Jonadab [who are Rechabites] for obeying the command of their [fore-]father [to dwell in tents and not drink wine], and whether they had sinned if they had not obeyed this command of Jonadab; which brings in another question: Whether parents have a power to oblige their children in matters which God has left at liberty? To which I answer: 1. God might reward these Rechabites for their reverence and obedience to Jonadab their father, though these were not strictly, by the Divine law, obliged thus far to have obeyed him; as He rewarded David for his thoughts in his heart to build him a house, though it was not God’s will that He should do it; so as God’s promise of the reward does not prove their obedience in this particular to have been their duty. Admit that it remained still a matter of liberty, yet the general honour and reverence they testified might be rewarded by God. 2. Unquestionably parents have not a power to determine children in all things as to which God has left them a liberty, for then they have a power to make their children slaves, and to take away all their natural liberty. To marry or not, and to this or that person, is [a] matter of liberty. Parents cannot in this case determine their children; Bethuel, Gen. 24:58, asks Rebekah if she would go with Abraham’s servant before he would send her. 3. In matters of civil concernment they have a far greater power than in matters of religion. All souls are God’s, and conscience can be under no other dominion than that of God. 4. In civil things parents have a great power, during the nonage of children, and after also in matters which concern their parents’ good, as to command them to assist them, to help to supply their necessities, etc. 5. Parents being set over children, and instead of God to them, as it is their duty to advise their children to the best of their ability for their good; so it is the duty of children to receive their advice, and not to depart from it, unless they see circumstances so mistaken by parents, or so altered by the providence of God, as they may reasonably judge their parents, had these known or foreseen it, would not have so advised. But that parents have an absolute power to determine children in all things as to which God has not forbidden them, and that children by the law of God are obliged to an obedience to all such commands, however they may see their parents mistaken, or God by his providence may have altered circumstances, I see no reason to conclude. Jonadab had prudently advised his sons as before mentioned; they were things they might do, and which by experience they found not hurtful to them, but of great profit and advantage, and that with reference to all the ends of man’s life: herein they yield obedience, and pay a reverence to their parent; this pleases God, He promises to reward them with the continuance of their family, according to what He had said, Ex. 20:12, in the Fifth Commandment, which the apostle calls the first commandment with promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, v. 19</span></figcaption>

<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. … 9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’… 10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition… 11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>

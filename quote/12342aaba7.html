<main class="wrap"><figure class="quote" id="q-12342aaba7" data-kw="">
<blockquote><p>I suppose none will deny, but that the Church of Israel had such Governors: instance their Priests and Levites. In Jehoshaphat’s time there is an express distinction made betwixt Ecclesiastical and Civil Governors under these two phrases, matters of the Lord, and matters of the King. If Church-Governors were an evidence of God’s good Providence under the Law, surely his Providence in this kind, would not be more scanty to the Church under the Gospel: for he hath promised to do better then at her beginnings. A change of Governors there may be, and that for the better; but an utter abolishing of all Governors, proper and peculiar to the Church, cannot be to the better. We expressly read that God hath set in his Church, among other good functions, Governments.

If it be said, that under that word, Governments, civil Magistrates are understood: I answer, that first this phrase, God hath set in the Church, and then the other particulars, among which Governments are reckoned, being all proper and peculiar to the Church, admit not such an interpretation thereof. To them which ask where any mention is made of a ruling Elder, I allege these words of an Apostle, (1 Tim. 5. 17.) The Elders that rule well, &amp;c. Apply them as you please, to Ministers or others: there are ruling Elders.

The word ἡγουμένων twice used by an Apostle, (Heb. 13. 7, 17.) and translated by our last and best Translators of the Bible, them that have rule, sheweth, that Ministers of the Gospel are Church-Governors: for Christians are required to obey them. And that Ministers are there meant, is evident by these phrases, They have spoken unto you the word of God, and they watch for your souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 24-25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15b6f3d606" data-kw="">
<blockquote><p>Forasmuch as it has pleased the Almighty God by the wise disposition of his divine providence so to Order and dispose of things that we… are now cohabiting and dwelling in and upon the River of Conectecotte… And well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God… do therefore… enter into Combination and Confederation together, to maintain and preserve the liberty and purity of the gospel of our Lord Jesus which we now profess, as also the discipline of the Churches, which according to the truth of the said gospel is now practiced amongst us… 1. It is Ordered, sentenced and decreed that there shall be yearly two general Assemblies or Courts… wherein shall be yearly chosen form time to time so many magistrates and other public officers… Whereof one to be chosen Governor… which… shall have power to administer justice according to the Laws here established, and for want thereof according to the rule of the word of God… … The Oath of the Governor, for the [Present] I N. W…. do swear by the great and dreadful name of the everliving God, to promote the public good and peace of the same… and will further the execution of Justice according to the rule of God’s word; so help me God, in the name of the Lord Jesus Christ.</p></blockquote>

</figure><figure class="quote" id="q-26ffe900ba" data-kw="">
<blockquote><p>Following the Revolutionary war, religious diversity in Connecticut continued to increase. In 1784, Connecticut finally passed an “Act for Securing the Rights of Conscience,” that secured religious freedom for those “professing the Christian religion,” of whatever denomination, and decreed they no longer be taxed to support the Congregational church. But non-Christians could be taxed to support the established church, and Congregationalism remained the established state religion until 1818, when Connecticut passed a new state constitution, replacing the laws of the old colonial charter obtained in 1662. This was not the end of the power and influence of the descendants of the Puritans, however…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nancy-finlay.html">Nancy Finlay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Importance of Being Puritan</cite></span></figcaption>

</figure><figure class="quote" id="q-0350d090e9" data-kw="">
<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

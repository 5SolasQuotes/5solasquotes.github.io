</figure><figure class="quote" id="q-bb2401ee82" data-kw="">
<blockquote><p>But as far as images are concerned, whether painted or sculpted, though we do not reject their use when sacred material or histories are represented, nevertheless we do not admit them in holy places without hesitation. Nor do we do we judge it prudent especially that sculpted images be set up in Temples, not because it is impious in and of itself, or because we think it not allowed, but rather because of the sad appearance of the Churches we see in Temples of the Papists, which took its origin from the use of Images and pictures… For this reason, though I completely concede that the use of images in which sacred things and histories are represented in temples is a matter of indifference (adiaphoron), nevertheless since people easily abuse thme when they are seen in sacred places, I think they do wisely who eliminate all these things from temples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4</cite>, pp. 469-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

</figure><figure class="quote" id="q-cd3a190048" data-kw="">
<blockquote><p>Universus locus demonstrat deum esse, qui apparuit. Dicitur Angelus, ut cognoscamus, quod is, qui visus est, non est Deus Pater (cuius enim Angelus esset Pater) sed unigenitus Filius, qui magni consilij est angelus, qui sacris discipulis dixit; Omnia quaecun{que} audiui apatre meo, nota fecivobis. Quemadmodum autem angeli nomen posuit, non quidem volens ministrorum quempiam innuere, sed personam unigeniti demonstrare: sic iterum ipsius tum naturam, tum potentiam praedicat, inquiens ipsum dixisse: Ego sum qui sum, et Ego Deus Abraham, Deus Isaack, Deus Iacob, etc.</p></blockquote>

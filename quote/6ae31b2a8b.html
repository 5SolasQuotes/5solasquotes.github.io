<main class="wrap"><figure class="quote" id="q-6ae31b2a8b" data-kw="">
<blockquote><p>Before we proceed to the more particular consideration of the words, it is very much worthy of our notice, to observe the apostle’s order and method of doctrine, and how he knits the believer’s privilege and duty together. He would have the privilege first believed, and then the duty performed: he would have us first believe, that the door of the holiest is opened by the blood of Jesus, that there is a new and living way consecrated for us, that we have a High Priest over the house of God, ready to introduce us into his presence; and upon these grounds of faith, he presses and inculcates the duty, Let us draw near, &amp; c. It is pleasant hence to observe, how the method and order of the covenant of works is just inverted in the covenant of grace. In the covenant of works, duty was the foundation of our privilege; man was first to perform duty, and upon his doing of that, might expect the privilege in a way of pactional debt. But now, I say, the very reverse of this is God’s order and method in the covenant of grace; for here we are first to believe the privilege, or to receive it as a grant of sovereign grace, and upon that ground we are to go on to duty. This is a thing that needs to be adverted to with the utmost attention, in regard the very bensil of nature runs in the way of the covenant of works, namely, to expect the privilege on the force of duty, and to fancy that God is a debtor to us, when we have done this and the other duty required in the law: whereas the stream of nature runs quite cross to the order and method laid in the covenant of grace, namely, first to receive the privilege in a way of grace, like beggars receiving God’s alms; and then to perform duty, as a testimony of gratitude for the privilege received, without expecting any thing from the Lord upon the account of duty done by us. This is what proud nature spurns against with the utmost reluctancy. What? To take all freely, without money, and without price, and to reckon ourselves unprofitable servants when we have done all, is what depraved nature cannot yield to, till the heart be new moulded by sovereign and efficacious grace. Will the Lord be pleased with thousands of rams, or with ten thousands of rivers of oil? ‘ &amp; c. Wherefore have we fasted, and prayed, and thou takest no knowledge? is expressive of our natural way of thinking. But though this way be cross unto nature, yet this is the way in which God will have sinners saved, or else they shall never share of his salvation: he will have them to receive eternal life begun here, and consummate here- after, as the gift of God through Jesus Christ our Lord, ‘ without regard to any of our doings as a foundation of our claim or title thereunto. Boasting must be for ever excluded, that the glory of our salvation may redound allenarly unto grace, which reigns through imputed righteousness unto eternal life, by Jesus Christ our Lord. And therefore, I say, study to rivet upon your minds the order and method laid by God in the covenant of grace, where privilege received by faith is made the foundation of duty, and not duty the foundation of our claim to the privilege. This is the scheme or order laid in our Lesser Catechism, by the Westminster Assembly; where, in answer to the 3d question, we are told, that the scriptures principally teach, first, what man is to believe concerning God, and then, what duty God requires of man. And, according to this order, we have, first, the objects of faith, and privileges of believers explained; and then, the duties of the moral law inculcate upon that ground. And if this order of doctrine be inverted, we destroy the covenant of grace, and return to a covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Ebenezer Erskine</cite>, 2 vols. (Edinburgh, 1826) 1.194–95</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-4d45975794" data-kw="">
<blockquote><p>The seducers that had infiltrated the Galatians and corrupted the purity of the gospel…Paul stops here, and says that if we are being forced and obliged to perform this task for God and to enter into this covenant with him, Jesus Christ will not profit us. …Why? Because they look no further than the external act…making us think that we are obliged to do it to be acceptable to God; we have entered into a covenant with him based upon doing our duty. Whoever has fulfilled his duty has made God his debtor, according to the devilish doctrines…We can only obtain grace by our merits, and the memory of our sins and iniquities can be wiped out by making our own satisfaction for sin and thereby appeasing God’s wrath. We see, therefore, that if we can obtain our own pardon, Jesus Christ is made of no value and cannot profit us at all. Why? Because Jesus Christ is not our righteousness if we do not seek remission of our sins through the sacrifice of his death. We need to be sure that God is our Father, and that we can call upon him with a peaceful conscience, having been adopted through the Lord Jesus Christ. …We need the assurance that he accepts us as his children and supports us so compassionately that he approves of what we do, though it is worthless, because of the fatherly love he bears us. If we do not have this assurance, the thought of serving God will make us grind our teeth. If, however, we are persuaded that God looks upon us favourably; if, though we are weak and can do nothing worthy of his approval, he accepts us in the name of the Lord Jesus Christ, then we will surely be filled with courage. We will be like a ship’s sail that has been stretched and filled by the breeze! Thus, our hearts will run to obey him, like a ship driven along by its sail, when we know that God delights in us and accepts our works, not wanting us to be compelled into servitude. He is happy for us to be his children, and that we desire to obey him. Knowing this, we can serve our God with all the more zeal. With his grace as our foundation, we are so filled with his joy that we can offer the sacrifice of praise. Likewise, having sought him in prayer, we can know that he will answer us and, in return, we can thank him for the priceless gifts that he communicates to us every day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Galatians 5:1–3</cite>, Other citations (work not named), 1557–58; HT: John Fonville)</span></figcaption>

<blockquote><p>…although the testimony of the Spirit cannot be granted in us without the use of means (i.e., the desire of holiness), it does not follow that it is doubtful and uncertain because even these means are promised to us by God and procured for us by the Spirit.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2c78390de1" data-kw="">
<blockquote><p>We fear, that the tale we are about to tell labours under this disadvantage. It is recent; for the catastrophe occurred last month. And it is too true; for in little more than a day’s journey the reader may see for himself all its sad details of desolate sanctuaries and forsaken homes and weeping families.

But it is co-temporary history. It is a tale of the times, and the russet light of antiquity is not fading over it. And, therefore, some who garnish the sepulchres of the Covenanters, and build the tombs of the Puritans, may grudge a stone to this modern cairn.

But when we reflect a little longer, and remember that it is not so much a tale of ruin as of restoration — when we consider that this disruption of the northern Establishment is the resuscitation of the National Church, the revival of the Kirk in the energy of its first reformation, in the purity of its second reformation, and in the catholicity of this, its third, reformation, we almost forget the privations with which it has been purchased, and rejoice that it is such a modern story.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-hamilton.html">James Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Egypt. To which is Appended the Original Protest, read at the General Assembly in May 1843 (Montreal: John C. Becket, 1844), pp 5-6.</cite></span></figcaption>

</figure><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-5b76ba6123" data-kw="">
<blockquote><p>And the reason why there must be this sanctifying of the heart is:

1. First, because the Lord does first accept of the person before He does accept of the action: Men indeed do accept of the persons of men because they do good actions, but God accepts of the actions of men because their persons are good. If indeed we see a man do good, then we love him and accept of the person of the man; but God first will accept of the person before the action: As the Lord accepted of Abel first, and then He accepted his offering [Gen. 4:4; Heb. 11:4]… you must first look after means of acceptation of your persons, which is through the righteousness of Jesus Christ, and through the sanctification of his Spirit, whereby you come to have his image and life, and so are accepted, and then all that proceeds from you comes to be accepted…

2. Secondly, our hearts must be sanctified because the Lord does look more to the principle from whence a thing comes than at the thing itself… So God is not pleased with anything that comes from us except He knows that it comes from a principle of love, grace, and holiness in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, pp. 69-70</span></figcaption>

<blockquote><p>Nay thou worshippest them, who makest them that they may be worshipped. But in all other senses the making a picture is not making an idol; and therefore that severe sense of the commandment, though as it is most probable it did oblige the Jews, and all persons in equal danger; yet because the reason may cease, and the danger be secured, when it is ceased, the obligation also is null; and therefore though that was in the commandment, yet it is no part of its morality; but that excepted, every other clause [of the Second Commandment] is moral and eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 342</span></figcaption>

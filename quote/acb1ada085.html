<main class="wrap"><figure class="quote" id="q-acb1ada085" data-kw="">
<blockquote><p>In 1662, the same spirit and sentiment afresh appeared; when most of the considerable ejected London ministers met, and agreed to hold occasional communion with the now re-established Church—not quitting their own ministry, or declining the exercise of it as they could have opportunity. And as far as I could by inquiry learn, I can little doubt this to have been the judgment of their fellow sufferers through the nation, in great part, ever since… any one of common sense can see through it; such as that: ‘How can a man dissent and conform at the same time?’ when all the world knows, or may, conformity consists of numerous parts; and is it such a miracle for a man to conform in some part and not in every part? Conscientiously to scruple constant entire conformity, and not scruple some part of it, at some time?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (Religious Tract Society, 1863), pp. 261-90, p. 289</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>7. If we may make images and crosses alike in shape, but dislike in use, in God’s worship, we may bring in golden calves to the temples [church buildings], and the image of Dagon, and the Sidonian gods, and altars such as Josiah destroyed, so at their first molding we imprint on them chaste and innocent religious intentions and signification, and make them alike in shape, but dislike in use to heathen worship. But sure the calf of Egypt and the calf that Aaron made, though like in shape, yet were dislike in use.</p></blockquote>

</figure><figure class="quote" id="q-529047fc76" data-kw="">
<blockquote><p>For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, Section 2, pp. 15-16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.”

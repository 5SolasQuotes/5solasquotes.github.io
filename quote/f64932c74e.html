<main class="wrap"><figure class="quote" id="q-f64932c74e" data-kw="">
<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652) | section 7, sermon 57</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-933beb0721" data-kw="">
<blockquote><p>But there are some so grossly ignorant of what prayer is that they make use of the Ten Commands, and Belief [the Apostles’ Creed] as a prayer: so void are they of the knowledge and spirit of God that they cannot discern betwixt God’s commands to themselves and their own requests to God, betwixt his speaking to men and their speaking to Him, between their professing of Him before men and praying and confessing to Him; all this is but forged imaginary worship, worship falsely so called which the Father seeks not and receives not.</p></blockquote>

</figure><figure class="quote" id="q-d2d1d6ebfb" data-kw="">
<blockquote><p>Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, 1642, London | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons</span></figcaption>

</figure><figure class="quote" id="q-e9b601c8d0" data-kw="">
<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite>, #104</span></figcaption>

<blockquote><p>I do not here conceive that the Church acknowledges she has cast off her garments of Christ’s righteousness; for then how should she remain the spouse of Christ? Yea, how then should her heart have been otherwise than asleep too? But only she pleads she should appear too naked if she should open to Christ, if she should worship Him in the simplicity and nakedness of his simple ordinances.</p></blockquote>

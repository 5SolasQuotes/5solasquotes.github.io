<main class="wrap"><figure class="quote" id="q-1e721d28af" data-kw="">
<blockquote><p>XX. The absolution committed to the ministers of the gospel is not judicial, such as belongs to a judge or lord; but ministerial, such as is partly by the preaching of the gospel (which consists in remission of this kind) or by his heralding or ministry of it, and in the exercise of ecclesiastical discipline, as it is subordinated to that preaching of the gospel (which is none other than that declaration by which he who was before leprous is declared clean); or such as belongs to a herald, who officially announces the favor of the magistrate to anyone. Nor does the power of the keys involve anything else because they are not the principal keys of the Lord (which are ascribed to Christ alone, Rev. 1:18; 3:7), but ministerial, such as belong to stewards and doorkeepers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, Q. 31, ‘The Five False Sacraments of the Romanists, p. 554</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-8e97531428" data-kw="">
<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law: 1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people. 2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law. 3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, vol. 2, p. 108, section 40, ‘Of the law of paying tithes,’ on Heb. 7:5-7 Gouge (d. 1653) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>They seem sometimes so to speak, as if it greatly offended them, that such hymns and psalms as are Scripture should in common prayer be otherwise used than the rest of the Scripture is wont: sometime displeased they are at the artificial music which we add unto psalms of this kind, or of any other nature else; sometime the plainest and the most intelligible rehearsal of them yet they savor not, because it is done by interlocution, and with a mutual return of sentences from side to side.</p></blockquote>

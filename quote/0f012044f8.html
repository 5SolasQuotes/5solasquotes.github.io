<main class="wrap"><figure class="quote" id="q-0f012044f8" data-kw="">
<blockquote><p>7. We must distinguish betwixt a dependance ‘absolute’, and ‘in some respect’; a congregation does absolutely depend upon the holy Scriptures alone, as the perfect rule of faith, and manners, of worship and of Church-Government; for we accurse the tyranny of prelates, who claimed to themselves autocratoric power over congregations to whom they gave their naked-will for a law: one of themselves told a whole synod that they ought to esteem that best which seems so to superiors; and that this is a sufficient ground to the conscience for obeying, though the thing be inconvenient. We say that congregations ought indeed to be subject to presbyteries and synods, yet not absolutely, but in the Lord, and in things lawful: and to this purpose the constitutions of presbyteries and synods are to be examined by the judgement of Christian discretion; for a synod is judex judicandus [a judge which ought to be judged], and regula regulata [a rule having been regulated], so that it ought not to be blindly obeyed, whether the ordinances be convenient or inconvenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), pt. 2, ch. 2, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a3500b3359" data-kw="">
<blockquote><p>We offer and we perform all obedience which God has commanded, and we deny neither toll, tribute nor fear to her nor officers: We only bridle her blind rage, in which she would erect and maintain idolatry, and would murder our brethren who refuse the same. Neither yet fear we in this present day, that against us she makes a malicious lie, where that she says that it is not religion we go about, but a plain usurpation of authority: God forbid that such impiety should enter into our hearts, that we should make his holy religion a cloak and cover of our iniquity. From the beginning of this controversy ’tis evidently known what have been our requests, which, if the rest of the nobility and commonality of Scotland will cause to be performed unto us, if then in us appear any sign of rebellion, let us be reputed and punished as traitors, etc.</p></blockquote>

<blockquote><p>We say that it is a superstition to esteem one day more holy than another. or to think that to abstain from labor is something which, in itself, pleases God (Rom 14:5, 6; Col 2:16, 17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us not Judaistic ceremony or stupid superstition. This is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early church (1 Cor 16:2; Acts 20:7; Rev 1:10). As for other festival days, we have removed them as much as possible from us, especially those which have been introduced through manifest idolatry. We have done this so as to correct the innumerable abuses which flowed from such, and to relieve the poverty of many. Nevertheless, because there are certain festivals devoted, since ancient times, to the celebration of certain mysteries concerning our redemption, we use Christian liberty, and submit all to edification, according to the different circumstances of pleas, times, and persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 5.41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dca39c3099" data-kw="">
<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law; but at other times he held separate assemblies in the wilderness of Judea at Jordan, and at Enon, where he taught and baptized… Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One while we find them in the Temple at public worship and teaching there. (Acts 3:1; 4:1) Another while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel, and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows, 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy</cite>, … (London: Baldwin, 1703), pp. 7-9</span></figcaption>

<blockquote><p>Let God be ‘praised in the dance with timbrel and harp,’ according to the usage of the Old-Testament church very early (Ex. 15:20), where we find God praised with timbrels and dances. Those who from this urge the use of [instrumental] music in religious worship must by the same rule introduce dancing, for they went together, as in David’s dancing before the ark, and Judg. 21:21. But, whereas many scriptures in the New Testament keep up singing as a gospel-ordinance, none provide for the keeping up of [instrumental] music and dancing; the gospel-canon for psalmody is to sing with the spirit and with the understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 149, verse 4</span></figcaption>

<blockquote><p>Question: Why did Christ take bread rather than any other element? Answer: … 2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance: 1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’ 2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace. 3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy Eucharist, or, The Myystery of the Lord’s Supper Briefly Explained</cite>, ... (London, 1668), ‘The Mystery of the Lord’s Supper’, pp. 7-9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Question: Why did Christ take bread rather than any other element? Answer: … 2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance: 1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’ 2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace. 3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;”

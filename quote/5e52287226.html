<blockquote><p>…union has the advantage over division, because: It is a commanded mean tending to edification, which division is not. 2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it. 3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>

<blockquote><p>As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Tota ratio Schismatis, the very essence of a schism consists in the separating from the Church, I say, from the true and orthodoxal Church. It is a renting or dissolving of that unity which ought to be amongst Christians; See Mr. [Stephen] Marshall’s Sermon on Rom. 12:4-5. It was a memorable speech of Calvin, who said he would willingly travel all over the seas and countries in the world to put an end to the differences that were in the Reformed Churches. [John] Cameron well distinguishes of a double schism: 1. Negative, which is a bare secession or subduction, and is unlawful. Non separatio sed causa facit Schismaticum [Not the separation but the cause that makes the schismatic]. Cassander. 2. Positive, when there is a certain consociation, which uses ecclesiastical laws, the Word of God and administration of the sacraments separatim [in a separated way], which he calls setting up an altar against an altar; this is called schism Antonomastic [Greek], and [Greek], says he [in] De Ecclesia. Different forms of Churches and Church-government in one state must needs lay a foundation of strife and division therein. It is no wisdom (says Mr. [John] Dury in a letter [about congregationalists]) in a state, to reject an approved way of government, which all the best reformed Churches have received all this while, and acknowledged to be God’s way, and by experience found to be safe, sound; and instead of it to take up another, which it is not yet known what it is, nor was ever tried but in two or at the most three churches, and that for the space of a few years. The slighter the cause of separation, the greater the fault of schism; when men hold the same Faith and orthodox truths, yet separate for lesser matters. The true saints in the 7 Churches of the Revelation were never bid go out of them though they were very corrupt, as they were out of Babylon, Mr. [Richard] Vines. The first separatist in the Scripture (says one) was Cain, Gen. 4:16. Enforcements to love are clear, 1 Cor. 13:1. That question of Separation in Scripture is dark. See Mr. [George] Gillespie, Miscellaneous Questions, ch. 10 and 15, and Mr. [Thomas] Manton on James 3. 17. Schisma est secessio in religionis negotio vel temeraria vel injusta, Cameron, De Ecclesia. Schism is a causeless separation from external communion with any true Church of Christ: Mr. [John] Ball, Against Separation, ch. 8. Schism is a breach of the unity of the Church. Dr. Field, bk. 3, Of the Church, ch. 5. We do not leave communion of true Churches for corruptions and sins, but only abstain from the practice of evil in our own persons, and witness against it in others, still holding communion with the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 4, ch. 22, ‘Schism’, pp. 376-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>[Contra a civil toleration of sects:] 1. Because it cannot but open a door to all sorts of erroneous opinions. 2. It is dangerous for the State; it may breed factions and divisions between all persons of whatsoever relation—between the magistrate and the subject, the husband and the wife, the father and the son, brothers, sisters, the master and the servant—when the one is of one religion or ecclesiastical government, and the other of another, as you have experienced. The son may refuse to receive any communion with the father, and the brother with the brother, and so dissolve all natural, civil, and domestic bonds of society. 3. No State in Christendom, where there is one only religion established, will admit the public exercise of any other, or endure a schism in that which is already received. Wherefore then should it be done here? 4. If it be granted to our brethren, I cannot see how it can well be denied to other sects. If it be said that other sects differ more from us than they do, it is all one; magis et minus non mutant speciem [more or less does not change the species] in the matter of toleration. For then all must be tolerated, some more, some less. And some of our brethren grant all this argument. And if we distinguish so, you must declare and expound clearly what sects and what opinions are to be tolerated, and what not—an inextricable question, which no mortal man, apparently, is able distinctly to determine. And some may say: the less the difference is, the less need there is for a toleration to be granted to such a sect; for the less it is, the greater is the schism. 5. God in the Old Testament granted no toleration of diverse religions or disciplines; and the New Testament requires no less union among Christians than the Old among the Jews. 6. Either our brethren assent to our doctrine and are resolved likewise to assent to the discipline which (God willing) shall be established by common consent, or they do not. If they grant the first, what need they any other toleration than the rest? If the second, it should first be discussed wherein they are resolved to dissent, and afterwards considered whether it is of such importance that, in consideration thereof, they dare not in good conscience entertain communion with us. 7. They are not pressed to be actors in anything against their consciences. Therefore they need not be suitors for a toleration; or if they be, it may justly be refused. 8. It is against the nature of the communion of saints to live in sects apart, without communicating at the Lord’s Table—which very hardly will be avoided if toleration be granted. 9. Because Scripture exhorts us evermore to unity, which cannot be easily procured by a toleration of sects, which cannot but daily beget new schisms and divisions. 10. Because the difference among the members of the Church of Corinth in the time of Saint Paul was greater, and yet they communicated together; indeed, the Apostle exhorted them to mutual communion and forbearance of sects and divisions. 11. Because the opinion of our brethren resembles too much that of the Donatists, who separated themselves from other churches under pretext that they were not so holy as their own. Neither is it unlike the convents and monasteries among the Papists; for as they all profess one doctrine with the Romish Church, and yet every order has its own discipline—Saint Francis one, Saint Dominic another—and in every order one general, and in every monastery one abbot, prior, or president, so all your churches believe one doctrine together with us, and every one of your churches has one minister, as their convents have a particular abbot or prior. You only differ in this, that you have no general, or anything answering thereto, to keep you in unity and conformity. … 13. We have but one God, one Christ, and one Lord, one Spirit; we are one body; we have one faith and one baptism, whereby we enter into the Church. Wherefore shall we not have one communion, whereby to be spiritually fed, and one discipline to be ruled by? 14. If churches have disciplines or governments different in their species, then the churches must be different in their species also; for all collective bodies or consociations that are governed are differentiated by their different governments, as we see in civil government, in the constitution and distinction of states, kingdoms, and republics. Wherefore, as many diverse governments as there are in churches, so many different species of churches must we admit. I speak here of the Church considered according to her visible form. But the consequent is false, since there is but one Church. Therefore— 15. Neither Christ nor his Apostles ever granted any toleration to diverse sects and governments in the Church; wherefore then will you be suitors for that which they never granted? … 17. Besides all this, Scripture forbids all such toleration as that of Jezebel. (Rev. 2:20) There must be no such speeches among us as “I am of Paul,” “I of Apollos,” “I of Cephas” (1 Cor 1:12); nor that some are “Calvinians,” as you term us, some “Independents,” some Brownists, some Anabaptists, etc. We must all be Christ’s; we must all think and speak the same things (v. 10). Otherwise men are carnal. Neither has the Church of God a custom to be contentious. [1 Cor. 11:16] Neither does the apostle permit schisms. [1 Cor. 12:25] We must not quit our mutual meetings, as others do, and as must be done in a public toleration. They that trouble the Church must be cut off. [Gal. 5:12] 18. Such a toleration cannot but expose our churches to the calumnies of Papists, who always object to Protestants the innumerable number of their sects, whereas they pretend to be nothing but one Church. 19. From such a toleration follows all that we formerly deduced out of Independency. … 21. Neither can it but overthrow all ecclesiastical government; for a man being censured in one church may flee to another, and being again suspended in that other, from thence to another, and so scorn all the churches of God and their censures; and thus this order by necessary consequence will breed all disorder.</p></blockquote>

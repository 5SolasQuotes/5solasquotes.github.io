<main class="wrap"><figure class="quote" id="q-4b59b4279c" data-kw="">
<blockquote><p>Although Christians should condemn cruelty to animals, it is a mistake to prefer the good of animals to that of human beings:

[I]t is a perverse thing to love any Creature so well as Mankind: against those Men that make more of their Horses and Hounds than of their Wives; and against those Women which make more of a Monkey, or of a Parrot, or of a Spaniel, than of their Husbands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A body of divinity: or, the sum and substance of Christian religion</cite>, ed. Michael Nevarr (1648; Herndon VA, 2007), p. 94.</span></figcaption>

<blockquote><p>1. Jesus preached peace (Eph. 2:17); don’t be a better preacher than Jesus.

2. Preach first to yourself.

3. Preach from your heart, not only to their heart.

4. Leverage your own distress.

5. How much do you have to hate the people to try to impress them rather than help them?

6. A pervasive tone of encouragement.

7. Vivid imagery. Visceral, sensory. Littered with analogues.

8. They’re more distressed than they’re revealing.

9. The power is in the Word, not your cleverness.

10. The Spirit works with your weakness and need, not our strength and sufficiency.

11. Think yourself full, pray yourself aglow.

12. Be concrete, not abstract.

13. Specificity communicates universality.

14. Be clear. Lewis: sheep. If you given them a route to misunderstand, they’ll take it.

15. Be simple but not simplistic.

16. Ruthlessly cut everything extraneous.

17. Smile. And mean it. Preaching is an act of pastoral love.

18. Doctrine is not enough; but, people do want to know doctrine.

19. Regularly reveal something of your own weakness.

20. Let them know of exegetical discoveries new to you.

21. Don’t ask adjectives to do the work verbs should be doing.

22. Make the gospel clear at some point.

23. Both unbelievers and believers are present.

24. Both eager and stagnant belieers are present.

25. Remember, and speak directly to, the kids.

26. Speak in your natural everyday voice; resist every form of ‘the preacher’s voice’.

27. Handle objections.

28. When on the fence, shorter is better.

29. Quit preaching while you still have them.

30. You don’t look as happy as you are; so stretch for joy.

31. If they feel loved by you (Phil. 4:1), they will feel hurt with you (Phil. 4:14).

32. ‘We will hear you again about this’ (Acts 17:32). Intrigue them with Jesus, even if they haven’t collapsed into his arms yet.

33. Don’t let your main points be transposable onto any other text in the Bible.

34. Slow down to notice every actual word of the text–what it says, and doesn’t say.

35. Calm down and be yourself.

36. Be a farmer, not a penny stock trader. Crock pot, not microwave.

37. They don’t need eloquence; they need radiance.

38. T.F. Tenney: ‘Preach every sermon like your son is sitting on the last row and giving church one last chance.’

39. Tincture. Give them a taste of what Jesus himself is like. Rutherford.</p></blockquote>

<blockquote><p>However not the fact only of his showing Himself to Mary, but likewise the manner of it claims our attention. When first beholding Him she did not know the Lord, and even after his speech she still supposed Him to be the gardener. The chief cause for this may have lain the change which had taken place in Him when the mortal put on immortality. Now behold with what exquisite tact the Lord helps her to restore the broken bond between the image her memory retained of Him and that new image in which henceforth He would walk through her life and hold converse with her spirit. Even these first words: “Women why weepest thou? Whom seekest thou?” though in form scarcely differing from the question of the angels, go far beyond the latter in their power to reach Mary’s heart. In the word “woman” with which He addresses her speaks all the majesty of one who felt Himself the Son of God in power by resurrection from the dead. It is a prelude to the still more majestic, “Touch me not” spoken soon afterwards. And yet in the words, “Why weepest thou? Whom seekest thou?” He extends to her that heart-searching sympathy, which at a single glance can read and understand the whole secret of her sorrow. He knew that such weeping results only there where one who is more than father or mother has been taken away. And how instantaneous the effect these words produced! Though she still supposes him the gardener, she takes for granted that he at least could not have taken the body with evil intent, that he will not refuse to restore it: “Sir, if thou hast born Him hence, tell me where thou hast laid Him, and I will take Him away.” A certain response to his sympathy is also shown in this, that three times she refers to Jesus as “Him,” deeming it unnecessary to mention his name. Thus in the way she met the gardener there was already the beginning resumption of the bond of confidence between her and the Lord. And thus Jesus found the way prepared for making Himself known to her in a most intimate manner. “Jesus saith unto her ‘Mary.’ She turneth and saith unto Him, ‘Rabboni’.” It happened all in a moment, and by a simple word, and yet in this one moment Mary’s world was changed for her. She had in that instant made the transition from hopelessness because Jesus was absent, to fullness of joy because Christ was there. We may well despair of conveying by any process of exposition the meaning of these two words. This is speech the force of which can only be felt. And it will be felt by us in proportion as we clearly remember some occasion when the Lord spake a similar word to us and drew from us a similar cry of recognition. Doubtless much of the magical effect of Jesus’ word was due to the tone in which He spoke it. It was a tone calling to her remembrance the former days of closest fellowship. This was the voice that He alone could use, the same voice that had once commanded the demons to depart from her, and to which ever since she had been wont to listen for guidance and comfort. By using it He meant to assure her, that, whatever transformation had taken place, there could be and would be no change in the intimate, personal character of their relationship. And Mary was quick to apprehend this. The Evangelist takes pains to preserve for us the word she uttered in its original Aramaic form, because he would have us understand that it meant more at this moment than could be conveyed by the ordinary rendering of “Teacher” or “Master.” “Rabboni” has a special untranslatable significance. It was the personal response to the personal “Mary,” to all intents a proper name no less than the other. By speaking it Mary consciously re-entered upon the possession of all that as Rabboni He had meant to her. Only one thing she had yet to learn, for teaching her which the Lord did not deem even this unique moment too joyful or sacred. In the sudden revulsion from her grief Mary would have given some external expression to the tumult within by grasping and holding Him. But He restrained her, saying: “Touch me not, for I am not yet ascended unto the Father; but go unto my brethren and say to them, I ascend unto my Father and your Father, and my God and your God.” At first sight these words may seem a contrast to those immediately preceding. And yet no mistake could be greater than to suppose that the Lord’s sole or chief purpose was to remind her of the restrictions which henceforth were to govern the intercourse between Himself and her. His intention was much rather to show that the desire for a real communion of life would soon be met in a new and far higher way than was possible under the conditions of local earthly nearness. “Touch me not” does not mean: Touch is too close a contact to be henceforth permissible; it means: the provision for the highest, the ideal kind of touch has not been completed yet: “I am not yet ascended to my Father.” His words are a denial of the privilege she craved only as to the form and moment in which she craved it; in their larger sense they are a pledge, a giving, not a withholding of Himself from her. The great event of which the resurrection is the first step has not yet fulfilled itself; it requires for its completion the ascent to the Father. But when once this is accomplished then all restrictions will fall away, and the desire to touch that made Mary stretch forth her hand shall be gratified to its full capacity. The thought is not different from that expressed in the earlier saying to the disciples: “Ye shall see me because I go to the Father.” There is a seeing, a hearing, a touching, first made possible by Jesus’ entrance into heaven and by the gift of the Spirit dependent on that entrance. And what He said to Mary He commissioned her to repeat to his brethren, that they also might be taught to view the event in its proper perspective. May we not fitly close our study of the text with reminding ourselves, that we too are included among the brethren to whom He desired these tidings to be brought? Before this He had never called the disciples by this name, as He had never until now so suggestively identified Himself with them by speaking of “your Father and my Father” and “your God and my God.” We are once more assured that the new life of glory, instead of taking Him from us, has made us in a profounder sense his brethren and his Father our Father. Though, unlike Mary and the disciples, we have not been privileged to behold Him in the body, yet together with the believers of all ages we have an equal share in what is far sweeter and more precious, the touch through faith of his heavenly Person for which the appearances after the resurrection were but a preparation. Let us then not linger at the tomb, but turn our faces and stretch our hands upwards into heaven, where our life is hid with Him in God, and whence He shall also come again to show Himself to us as He did to Mary, to make us speak the last great “Rabboni,” which will spring to the lips of all the redeemed, when they meet their Savior in the early dawn of that eternal Sabbath that awaits the people of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“However not the fact only of his showing Himself to Mary, but likewise the manner of it claims our attention. When first beholding Him she did not know the Lord, and even after his speech she still supposed Him to be the gardener. The chief cause for this may have lain the change which had taken place in Him when the mortal put on immortality. Now behold with what exquisite tact the Lord helps her to restore the broken bond between the image her memory retained of Him and that new image in which henceforth He would walk through her life and hold converse with her spirit. Even these first words: “Women why weepest thou? Whom seekest thou?” though in form scarcely differing from the question of the angels, go far beyond the latter in their power to reach Mary’s heart. In the word “woman” with which He addresses her speaks all the majesty of one who felt Himself the Son of God in power by resurrection from the dead. It is a prelude to the still more majestic, “Touch me not” spoken soon afterwards. And yet in the words, “Why weepest thou? Whom seekest thou?” He extends to her that heart-searching sympathy, which at a single glance can read and understand the whole secret of her sorrow. He knew that such weeping results only there where one who is more than father or mother has been taken away. And how instantaneous the effect these words produced! Though she still supposes him the gardener, she takes for granted that he at least could not have taken the body with evil intent, that he will not refuse to restore it: “Sir, if thou hast born Him hence, tell me where thou hast laid Him, and I will take Him away.” A certain response to his sympathy is also shown in this, that three times she refers to Jesus as “Him,” deeming it unnecessary to mention his name. Thus in the way she met the gardener there was already the beginning resumption of the bond of confidence between her and the Lord. And thus Jesus found the way prepared for making Himself known to her in a most intimate manner. “Jesus saith unto her ‘Mary.’ She turneth and saith unto Him, ‘Rabboni’.” It happened all in a moment, and by a simple word, and yet in this one moment Mary’s world was changed for her. She had in that instant made the transition from hopelessness because Jesus was absent, to fullness of joy because Christ was there. We may well despair of conveying by any process of exposition the meaning of these two words. This is speech the force of which can only be felt. And it will be felt by us in proportion as we clearly remember some occasion when the Lord spake a similar word to us and drew from us a similar cry of recognition. Doubtless much of the magical effect of Jesus’ word was due to the tone in which He spoke it. It was a tone calling to her remembrance the former days of closest fellowship. This was the voice that He alone could use, the same voice that had once commanded the demons to depart from her, and to which ever since she had been wont to listen for guidance and comfort. By using it He meant to assure her, that, whatever transformation had taken place, there could be and would be no change in the intimate, personal character of their relationship. And Mary was quick to apprehend this. The Evangelist takes pains to preserve for us the word she uttered in its original Aramaic form, because he would have us understand that it meant more at this moment than could be conveyed by the ordinary rendering of “Teacher” or “Master.” “Rabboni” has a special untranslatable significance. It was the personal response to the personal “Mary,” to all intents a proper name no less than the other. By speaking it Mary consciously re-entered upon the possession of all that as Rabboni He had meant to her. Only one thing she had yet to learn, for teaching her which the Lord did not deem even this unique moment too joyful or sacred. In the sudden revulsion from her grief Mary would have given some external expression

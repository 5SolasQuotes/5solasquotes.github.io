<main class="wrap"><figure class="quote" id="q-6c67a959d7" data-kw="">
<blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38be200369" data-kw="">
<blockquote><p>VI. Participation in Prayer How is the congregation to pray together in public worship?… The congregation prays by ‘one mouth speaking for all,’ by an elder leading the people to the throne of grace… What should the worshipper do while the solitary voice is praying aloud? He may allow his mind to pray the same thing silently. He may say in his heart following each petition, ‘Yes, Lord, that is my prayer as well,’ or add his own brief petitions which are suggested by the petitions being offered. And at the conclusion of the prayer he should join audibly in saying the ‘Amen’ as has been the practice of God’s people in both the Old Covenant and the New (Neh. 9:6; 1 Cor. 14:16). Jerome said that the ‘Amen’ following the prayers of the fourth century church was like a clap of thunder! This practice is much to be preferred over the common custom of interrupting or punctuating the prayers by audible ‘Amens’ (or grunts or groans or other such expressions such as, ‘Yes, Lord,’ or ‘Thank you, Jesus!’). Better to nod the head in silent agreement than to distract other worshippers or the one praying or to subject yourself to the temptation of attempting to appear more spiritual than others on the basis of the number or loudness of the audible responses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-schneider-iii.html">Michael Schneider III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Chapter 13, ‘Prayer Regulated by God’s Word’ in Worship in the Presence of God, ed. David Lachman &amp; Frank Smith (Greenville Seminary Press, 1992), pp. 240-1</span></figcaption>

38be200369.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38be200369.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/saying-amen-after-prayers-in-worship/#:~:text=VI.%20Participation%20in%20Prayer%20How%20is,or%20loudness%20of%20the%20audible%20responses&amp;text=VI.%20Participation%20in%20Prayer%20How%20is%20the%20congregation&amp;text=the%20number%20or%20loudness%20of%20the%20audible%20responses" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But how can we imagine that many thousands [of Jerusalem Christians] could in one meeting communicate at one Table in the Lord’s Supper, and that ordinarily? 1. What voice could reach to so many thousands, as they did grow unto?… 3. Can we believe that seeing congregational meetings of fewer, and that in private houses, was less obnoxious to the indignation of authority, than meeting in the Temple, as is most evident, Acts 4:1-2; and seeing [that] the apostles had liberty to meet, Acts 5:26, [can we believe] that they would draw the first mold of the Christian visible-Church after the pattern of a convention [i.e. all gathering unto one place] most unfit, yea impossible for attaining the intended end, to wit, edification, especially not being compelled thereunto by an extrinsical necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, p. 428</span></figcaption>

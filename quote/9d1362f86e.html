<blockquote><p>XXV. Concerning the soul, life and sense of brutes, two extreme and one middle opinion obtains: They err in excess who have attributed not only a sensitive soul, life and sense to brutes, but also a mind; such were the Pythagoreans and Platonists, whom Plutarch favors in his book, “That brute animals use reason,” Opera, tome 2, ch. 25. From the Fathers, Lactantius vindicates wisdom, by which they understand God and religion, for men alone, yet he attributes reason, intelligence, and thought to all living things: with whom Hieronymus Rorarius agrees, a former Papal Exlegate, in his treatise, That Brute Animals use Reason better than Man. They err in defect who, like Gometius Pereira, a Spanish philosopher and physician, in the book which he inscribed from the names of his parents, Antony and Margaret, Antoniana Margarita, in which he imagines brute animals to be mere automata of nature, devoid of a sensitive soul and of sense: whose hypothesis Descartes embraced, Discourse on Method; Principia, pt. 4, n. 23; also Replies to Objections 4, p. m. 109; pt. 1, epistle 66; pt. 2, epistles 40, 45, whom, among others, Anton le Grand followed in his Dissertation on the Lack of Sense and Cognition in Brutes, also Institutio Philosophica, pt. 7, ch. 18. The middle opinion attributes to brutes a sensitive soul, by which they cognize sensible objects, desire things salutary to themselves and decline what they see will be harmful, and are moved from place to place. We approve this: 1. From Gen. 1:24, where a brute is called ‘a living soul’; cf. Prov. 12:10. In Gen. 6:17, the spirit of life [Hebrew] is attributed to brutes, and in Gen. 7:22, the breath of life. In Eccl. 3:21, the spirit… Isa. 1:3, it is said: “The ox knows his owner, and the ass his master’s crib.” Jer. 8:7, “The stork in the heaven knows her appointed times; and the turtle and the crane and the swallow observe the time of their coming.” Jude v. 10, “the wicked know… as brute beasts.” Appetite is attributed to brutes, Ps. 42:2; Ps. 104:11; Prov. 28:15. [2.] And this is confirmed by reason and experience: for brutes know their owners, they know and distinguish males and females, they sense enemies and dangers, they artfully construct nests, they take care of their young, and seek pasture for themselves and them, they desire coitus, they fawn on their masters, etc. etc. which testify to the sense of brutes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

<blockquote><p>§XXVII. With respect to Duration, the human soul is immortal, which Christian Religion teaches against the Sadducees, Epicureans, and Atheists, who think that souls are extinguished with their bodies. This is contradicted by: 1. Scripture, Eccl. 12:7, “The dust returns to its earth from whence it was, and the Spirit returns to God who gave it.” Mt. 10:28, “Fear not them which kill the body, but are not able to kill the soul: but rather fear him, which is able to destroy both soul and body in Hell.” Mt. 22:32, “I am the God of Abraham, and the God of Isaac, and the God of Jacob: God is not the God of the dead, but of the living.” Lk. 16:23, “The rich man in torments saw Abraham afar off, and Lazarus in his bosom,” etc. Lk. 23:43, Christ to the converted thief: “Today you will be with me in Paradise.” v. 46, Christ, expiring, cried out: “Father, into your hands I commend my Spirit.” 2 Cor. 5:8, Paul says: “We are willing rather to be absent from the body, and to be present with the Lord.” Phil. 1:23, “I have a desire to depart, and to be with Christ.” 1 Pet. 3:19, “By which also he went and preached unto the spirits in prison,” etc. add Ps. 49:15, “God will redeem my soul from the power of the grave: for He shall receive me.” 2 Sam. 12:23, “But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.” 1 Kn. 17:21, “O Lord my God, I pray thee, let this child’s soul come into him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), sect. 27, pp. 13-14 trans. AI Latin</span></figcaption>

<blockquote><p>Aquinas and other Scholastic philosophers often employ the principle agere sequitur esse (Latin for “action follows being”). The basic idea is that what a thing does necessarily reflects what it is. Eyes and ears function differently because they are structured differently. Plants take in nutrients, grow, and reproduce while stones do none of these things, because the former are living things and the latter are inanimate… The PPC [Principle of Proportionate Causality] tells us, again, that whatever is in the thing that changes or comes to exist must in some way have been in the total set of factors that brought about this change or existent. In this sense, the effect cannot go beyond the cause. A formal cause is the nature of a thing, that which makes it the kind of thing it is… The principle agere sequitur esse basically says that these attributes and activities cannot go beyond that nature, any more than an effect can go beyond its efficient cause. Hence, a stone cannot exhibit attributes and activities like nutrition, growth, and reproduction, because these go beyond the nature of a stone. Anything that could do these things wouldn’t be a stone in the first place. The principle agere sequitur esse, like the PPC, follows from the PSR [Principle of Sufficient Reason, that everything has a sufficient reason for it]. If an effect could go beyond its total efficient cause, then the part of the effect that went beyond it would have no explanation and be unintelligible. Similarly, if a thing’s activities could go beyond its nature—if, for example, a stone could take in nutrients or use language—then this activity would lack an explanation and be unintelligible… …even a materialist could agree that if intellectual activity were immaterial, then the thing which carries out that activity would itself have to be immaterial. And indeed, the naturalist philosopher John Searle takes precisely that view in criticizing a theory known as property dualism. Property dualism holds that mental properties are immaterial but that they are nevertheless properties of a material thing —namely, the brain. The theory is essentially an attempt to acknowledge the problems with materialist theories of the mind without having to accept the dualist view that the mind is an immaterial thing. Searle’s criticism is that the theory is unstable. If the property dualist maintains that a mental property is something ‘over and above’ the brain, then the trouble in Searle’s view is that such a property cannot be a property of the brain, but must be ‘a separate thing, object, or non-property type of entity’. On the other hand, if a mental property really is a property of the brain, then it cannot be something ‘over and above’ the brain. Other critics of property dualism have complained that it is mysterious how an entirely material thing like the brain could give rise to immaterial properties.</p></blockquote>

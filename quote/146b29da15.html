<blockquote><p>There is a day mentioned by John, in the Revelation, (which we shall afterwards consider,) that he calleth ἡμέρᾳν κυριακῇν “diem dominicam,” “the Lord’s day.” This appellation, what day soever is designed, is neither natural nor civil, nor doth it relate unto any thing in nature or in the common usage of men. It must therefore be sacred; and it is, or may be, very comprehensive of various respects. It is “the Lord s day,” the day that he hath taken to be his lot or especial portion among the days of the week; as he took, as it were, possession of it in his resurrection. So his people are his lot and portion in the world, therefore called his people. It is also, or may be, his day subjectively, or the day whereon his businesses and affairs are principally transacted. …

This is the day wherein the affairs of the Lord Jesus Christ are transacted, his person and mediation being the principal subjects and objects of its work and worship. And it is, or may be, called his, “the Lord’s day,” because enjoined and appointed to be observed by him or his authority over the church. So the ordinance of the supper is called “the supper of the Lord” on the same account. On supposition, therefore, that such a day of rest there is to be observed under the new testament, the name whereby it ought to be called is “the Lord’s day;” which is peculiarly expressive of its relation unto our Lord Jesus Christ, the sole author and immediate object of all gospel worship.

But whereas the general notion of a sabbatical rest is still included in such a day, a superaddition of its relation to the Lord Christ will entitle it unto the appellation of “the Lord’s-day Sabbath;” that is, the day of sacred rest appointed by the Lord Jesus Christ. And thus, most probably, in the continuation of the old testament phraseology, it is called “the Sabbath day,” Matt. xxiv. 20, and in our Epistle comes under the general notion of a sabbatism, chap. iv. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. William H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 285-86.</span></figcaption>

<blockquote><p>Furthermore, those who, having forsaken Scripture, imagine some way or other of reaching God, ought to be thought of as not so much gripped by error as carried away with frenzy. For of late, certain giddy men have arisen who, with great haughtiness exalting the teaching office of the Spirit, despise all reading and laugh at the simplicity of those who, as they express it, still follow the dead and killing letter.1 But I should like to know from them what this spirit is by whose inspiration they are borne up so high that they dare despise the Scriptural doctrine as childish and mean. For if they answer that it is the Spirit of Christ, such assurance is utterly ridiculous. Indeed, they will, I think, agree that the apostles of Christ and other believers of the primitive church were illumined by no other Spirit. Yet no one of them thence learned contempt for God’s Word; rather, each was imbued with greater reverence as their writings most splendidly attest. And indeed it had thus been foretold through the mouth of Isaiah. For where he says, “My Spirit which is in you, and the words that I have put in your mouth, will not depart from your mouth, nor from the mouth of your seed … forever” [Isa. 59:21 p., cf. Vg.], he does not bind the ancient folk to outward doctrine as if they were learning their ABC’s; rather, he teaches that under the reign of Christ the new church will have this true and complete happiness: to be ruled no less by the voice of God than by the Spirit. Hence we conclude that by a heinous sacrilege these rascals tear apart those things which the prophet joined together with an inviolable bond. Besides this, Paul, “caught up even to the third heaven” [2 Cor. 12:2], yet did not fail to become proficient in the doctrine of the Law and the Prophets, just as also he urges Timothy, a teacher of singular excellence, to give heed to reading [1 Tim. 4:13]. And worth remembering is that praise with which he adorns Scripture, that it “is useful for teaching, admonishing, and reproving in order that the servants of God may be made perfect” [2 Tim. 3:16–17]. What devilish madness is it to pretend that the use of Scripture, which leads the children of God even to the final goal, is fleeting or temporal? Then, too, I should like them to answer me whether they have drunk of another spirit than that which the Lord promised his disciples. Even if they are completely demented, yet I do not think that they have been seized with such great dizziness as to make this boast. But in promising it, of what sort did he declare his Spirit would be? One that would speak not from himself but would suggest to and instill into their minds what he had handed on through the Word [John 16:13]. Therefore the Spirit, promised to us, has not the task of inventing new and unheard-of revelations, or of forging a new kind of doctrine, to lead us away from the received doctrine of the gospel, but of sealing our minds with that very doctrine which is commended by the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, repr. 2011), 1.9.1.</span></figcaption>

</figure><figure class="quote" id="q-b80133b8f3" data-kw="">
<blockquote><p>We say that it is a superstition to esteem one day more holy than another. or to think that to abstain from labor is something which, in itself, pleases God (Rom 14:5, 6; Col 2:16, 17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us not Judaistic ceremony or stupid superstition. This is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early church (1 Cor 16:2; Acts 20:7; Rev 1:10). As for other festival days, we have removed them as much as possible from us, especially those which have been introduced through manifest idolatry. We have done this so as to correct the innumerable abuses which flowed from such, and to relieve the poverty of many. Nevertheless, because there are certain festivals devoted, since ancient times, to the celebration of certain mysteries concerning our redemption, we use Christian liberty, and submit all to edification, according to the different circumstances of pleas, times, and persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 5.41</span></figcaption>

<blockquote><p>…if so be that thou makest conscience of sanctifying God’s name in duties, then He will sanctify his name in a way of mercy; that is, He will manifest how He does accept of the least degree of holiness though there be much mixture: God has a way to take away the mixture by the blood of his Son, and then to accept of any holiness He sees in thee, He will sanctify his name by meeting with thee and revealing his glory to thee when thou art worshiping of Him: There is an excellent scripture for this, Ex. 29:43, ‘There I will meet with the children of Israel and the Tabernacle shall be sanctified by my glory.’ Thou that hast a gracious heart and art worshiping of God in sincerity, thou art as a tabernacle of God, and God has his service and worship from thee; thou art as the temple of God, and ‘There will I meet with thee’ (says God) ‘and I will sanctify my Tabernacle by my glory.’ God will sanctify thy heart by his glory if thou doest sanctify his name.</p></blockquote>

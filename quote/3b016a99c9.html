<main class="wrap"><figure class="quote" id="q-3b016a99c9" data-kw="">
<blockquote><p>The sum of the whole discussion amounts to this: [1] that celibacy is better than marriage, because it has more liberty, so that persons can serve God with greater freedom; but at the same time, that [2] no necessity ought to be imposed, so as to make it unlawful for individuals to marry, if they think proper; and farther, that [3] marriage itself is a remedy appointed by God for our infirmity, which all ought to use that are not endowed with the gift of continency. Every person of sound judgment will join with me in acknowledging and confessing, that the whole of Paul’s doctrine on this point is comprehended in these three articles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 7, v. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84de3e55fc" data-kw="">
<blockquote><p>For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>

</figure><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><figure class="quote" id="q-c5da5c0efa" data-kw="">
<blockquote><p>Were a man in a wilderness where are a multitude of cross paths, all pretending to lead unto an inhabited City, whither he must go or perish; if he see men not only contending some for one way, some for another, but killing and destroying one another, about the preference of the several ways they esteem best and safest; he deserves to wander and perish, if he refuse a guide that is tendered unto him with sufficient evidence of his truth and faithfulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>* The Church of Rome, No Safe Guide</cite>, (London, 1679) being two sermons 47 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

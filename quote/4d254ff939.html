<main class="wrap"><figure class="quote" id="q-4d254ff939" data-kw="">
<blockquote><p>Effectual prayer has the mind of the Spirit, and is in accordance with the divine will; and this will is revealed in the Word so that faith rests on a sure warrant; but in other matters in which his will is not revealed we say, ‘Thy will be done.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-f3f8afa285" data-kw="">
<blockquote><p>Oh, all you who know and delight in this King, observe all this. Let it wound your heart; let your soul bleed; and for sorrow let your eyes cry rivers of tears by reason of the fact that this glorious King of His Church is thus despised and scorned. Pray continually for Him (Ps. 72:15) and to Him, that He would reveal Himself to His Church as King before the eyes of the entire world. ‘Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that dwellest between the cherubims, shine forth. Before Ephraim and Benjamin and Manasseh stir up thy strength, and come and save us’ (Ps. 80:1-2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 1, ch. 21, ‘The Kingly Office of Jesus Christ’, p. 568</span></figcaption>

</figure><figure class="quote" id="q-92fe329262" data-kw="">
<blockquote><p>The prayer for the blessed resurrection of bodies is a form of charity toward the dead, through which we wish for them and ask God that their bodies may rise to eternal life on the last day. This does not contradict faith: Because it is commanded by Christ: When He instructs us to pray that the kingdom of our Father in heaven may come, He refers not only to the kingdom of grace but also to the kingdom of glory, which will not come without the resurrection of bodies. Therefore, when we pray, “Thy kingdom come,” we are also praying for the future resurrection of the dead… Because we have the promise of the resurrection of the flesh to eternal life. Whatever is promised to us and to others, even to the deceased in Christ’s faith, it is right to pray for its fulfillment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Theology</cite>, (Hanau, 1609; 1615), vol. 2, bk. 10, ‘Moral Virtues’ Latin | 15. ‘On the Prayer [voto] for the Blessed Resurrection of Bodies’, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

<main class="wrap"><figure class="quote" id="q-a8aa9a691e" data-kw="">
<blockquote><p>IT may look well presumptuous-like to read, or undertake to open this Book: and indeed there is need of much humility and soberness in going about such a work, and that the Spirit of Jesus Christ, who hath given this Book for a benefit to His Church, help us to a right uptaking of it; Yet, considering that the subject matter of it, is so profitable and comfortable to the Church, to the end of the world; considering also what was Christ’s and in giving it, as His last Will and Word, to His Church, to wit, to be a Revelation, and thereby to make manifest His mind to them: therefore John is forbidden to seal it, that it might be open for the good of His Church; and considering withal the many motives and encouragements that are given to read and search into it, as ver. 3. Blessed is he that readeth, and they that hear the words of this Prophecy: which saying, is also renewed again after the prophetic part is immediately closed, chap. 22.7, 14. which seem to be notable encouragements, not only to undertake, but also to lay it on as a duty, to read and seek to understand it. We resolve, through God’s grace, to essay it, that it be not altogether useless to the Servants of God to whom it is sent, as ver. 1. It is true, many things in it are obscure; and it is like, that the full clearing of them is not to be expected, till God in some singular way shall open them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Book of the Revelation</cite>, (1658; Willow Street PA: Old Paths Publications, 2000), p. 1.</span></figcaption>

691e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/25/james-durham-on-encouragements-to-study-revelation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-74561d709a" data-kw="">
<blockquote><p>Thus he will have images adored with the same worship that is given to God: But I answer: 1. if he shall kiss that creature and direct religious bowing toward it, and through that external religious act, convey his worship to God, and give no other external adoration and sign of heart submission to God, then that which is tied and alligated of purpose to that fair creature, as Papists and Jews did of old, who kissed the calves and fell down before the images (as Isa. 44:17, which yet were but memorials of Jehovah teaching them of Iehovah, Isa. 40:18; 46:6-7; Hab. 2:18-19), such a one should also worship that fair creature.</p></blockquote>

</figure><figure class="quote" id="q-0150883e5c" data-kw="">
<blockquote><p>…those who are not contented with His voice, but seek His visible form, substitute imaginations and phantoms in His place. But here arises a difficult question, for God made Himself known to the patriarchs in other ways besides by His voice alone; thus Abraham, Isaac and Jacob knew Him not only by hearing, but by sight. Moses himself saw Him in the midst of the burning bush; and He also manifested Himself to the prophets under visible figures…. And yet God was not forgetful of Himself when He thus presented Himself to the sight of His servants. Wherefore, this argument does not appear to be valid and good, that it is sinful to represent God in a visible image, because His voice was once heard without His being seen [Dt. 4:15-16]; when, on the other side, it is easy to object that visible forms have often been exhibited, wherein He testified His presence. The solution is twofold: first, that, although God may have invested Himself in certain forms for the purpose of manifesting Himself, this must be accounted as a peculiar circumstance, and not be taken as a general rule;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 4 | verse 12</span></figcaption>

</figure><figure class="quote" id="q-c47959bd3f" data-kw="">
<blockquote><p>In Scotland it appears to have been the regular custom for ministers to wear a gown when conducting divine service. The cassock also was in frequent use, but this is not surprising since it was not a liturgical vestment, but the usual out-of-doors dress of the ministry. In England, however, the Puritans appear to have discarded the cassock, whilst there is little evidence to show that the early Puritans wore gowns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 46-48 in Ch. 4 of The Worship of the English Puritans (Soli Deo Gloria, 1997), p. 47</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8f24577347" data-kw="">
<blockquote><p>If a people trusting in the goodness of their prince, enslave themselves to him, and he shall after turn tyrant; a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium: Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and therefore the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and therefore, when the contract is made for the utility of the one party [only], the law says their place is for after wits, that men may change their mind, and resume their liberty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1644; Edinburgh: Ogle, 1843), question 16</cite>, p. 66 rt col mid</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96635466a4" data-kw="">
<blockquote><p>Hence it is true that if a man shall keep the whole law, and yet offend in one point, he becomes guilty of all, because he does what is contrary to the love on which hangs the whole law. A man, therefore, becomes guilty of all by doing what is contrary to that on which all hang.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 167.5,16</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-624fc38974" data-kw="">
<blockquote><p>For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment, for whatever frees a man from actual obligation, frees him also from actual sinning, for all sin is a doing against a Law-obligation, and if so, then are none to be led by any rule but their own conscience, the written Law and Gospel is not henceforth our rule any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649)</cite>, p. 34</span></figcaption>

</figure><figure class="quote" id="q-8c9a5919f4" data-kw="Temptation">

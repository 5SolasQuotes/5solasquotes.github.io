<main class="wrap"><figure class="quote" id="q-74084b10ea" data-kw="">
<blockquote><p>Again, my friends, we would beseech you all to cultivate a catholic spirit. Think not that merely because you are Presbyterians you are therefore better than others. There are many members of the Independent and Episcopal churches whom the Son of God has delighted to honour, and who shall doubtless shine throughout all eternity, as pearls in his royal diadem. Our forms of government and discipline are but perishable barriers by which the various sections of the church are now separated, but at death these partitions fall asunder, and the faithful in the world above are all one in Christ Jesus for ever.

The Saviour will certainly honour his own ordinances, and, other things being equal, we may expect to find the purest piety where the Redeemer is worshipped according to the purest forms; but still we are not to trust to our privileges — we are not to worship the temple, instead of the God of the temple. Love is the essence of Christianity, and a Presbyterian church, where the life of piety is wanting, is a temple from which the glory has departed. Again, whilst Presbyterians act towards others in a spirit of expansive charity, and whilst they acknowledge that their ecclesiastical arrangements are not of such importance as the more enduring treasures of the new covenant, let them not imagine that they may therefore disregard the peculiarities of their religious system. Everything is precious which the Redeemer has ordained.

As Presbyterians consider that their own church is more perfect than others in her constitution, let them bestow upon her more abundant honour. Let them cleave steadfastly to her ordinances; let them not be seduced from her apostolic forms by the pageantry or the profits of a more gorgeous establishment. A good conscience is a constant feast; and let not Presbyterians sell, for any of the beggarly elements of this world, even the smallest portion of their birth-right as citizens of Zion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-d-killen.html">William D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse I in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4307c99bbc" data-kw="">
<blockquote><p>I remember one of our brethren of Scotland, in a discourse tending to the advancing of the presbyterian way, tells us that Dr. Montague, the late worthy bishop of Winchester, asked King James of blessed memory (whose sweet affability the world well knew) how it came about that there were so few heresies and errors of doctrine broached and prosecuted to the public disturbance of the Church of Scotland? Unto which the wise and learned king is said to have returned this answer: ‘That every parish has their pastor ever present with them and watching over them; that the pastor has his elders and deacons sorted with him; that he with them once a week meets at a set time and place for the censure of manners or whatever disorder falls out in the parish; so as he by this means perfectly knows his flock and every aberration of them, either in matter of opinion or practice: And lest any error or heresy may seize upon the pastor; they have their presbyteries, consisting of several shrivalties, which meet together in the chief town or city next to them, every week also once; and have there their exercise of prophesying; after which the moderator of the said meeting asks and gathers the judgements of all the said pastors concerning the doctrine then delivered, or, of any other doubtful point that is then and there propounded; And if the said presbyters be divided in their opinions, then the question is, under an enjoined silence, put over to the next synod, which is held twice a year; unto that all the pastors of that quarter or province duly resort; accompanied with their elders; the moderator of the former synod begins the action; then a new moderator is chosen for the present, or (as it seldom falls out) the last moderator, by voices, continued. Any question of doubt being proposed is either decided by that meeting or (if it cannot be so done) is, with charge of silence, reserved till the national synod or general assembly; which they hold every year once; whither come not the pastors only, but the king himself or his commissioners and some of all orders and degrees sufficiently authorized for the determining of any controversy that shall arise amongst them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as narrated by Joseph Hall, ‘A Modest Offer of some meet Considerations tendered to the Learned Prolocutor and to the rest of the Assembly of Divines met at Westminster’</cite>, (Oxford, 1644), pp. 8-10</span></figcaption>

</figure><figure class="quote" id="q-faa6039eea" data-kw="">
<blockquote><p>Commenting on the conduct of the majority Scottish RP Synod (1863) in removing ecclesiastical censure from those who voted in British elections, the London-Scottish Reformed Presbyterian Magazine (which represented the minority who dissented from this) argued that it was a violation of the covenants to admit those who voted to communion:

[W]e cannot refrain from remarking further here, that the Synod and congregations of the majority part of the Reformed Presbyterians do not themselves keep the Covenants. Extending church privileges to such as take part in political action with the British Constitution, they hold fellowship with malignants against the express engagements both of the National and the Solemn League and Covenant. If those who supported popery, prelacy, and arbitrary civil power in the days of the Covenant engagements were malignants, what else are they who now uphold popery, prelacy, and Erastianism, and condemn the Covenants themselves as unlawful deeds? There is need for the Synod and congregations, therefore, to instead of descending to loose and unworthy union, ascending to reformation, by retracing steps of defection already taken, even although this would cost a sacrifice, which few professors in this age of the world are inclined to make.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london-scottish-reformed-presbyterian-magazine.html">London-Scottish Reformed Presbyterian Magazine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The union movement’ in London-Scottish Reformed Presbyterian Magazine</cite>, (Apr. 1871), p. 228.</span></figcaption>

</figure><figure class="quote" id="q-94c6016077" data-kw="">
<blockquote><p>In England it [civilly] belongs: 1. to the patron to present; 2. to the bishop to ordain and institute, and therefore to approve and invest; 3. to the people jure divino to be free consenters; 4. and to the magistrate to protect and to judge who shall be protected or tolerated under him. If now these four parties be for four ministers or for three, or two several men, and cannot agree in one, the culpable dissenters will be the causes of the schism.</p></blockquote>

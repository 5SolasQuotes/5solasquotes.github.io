<main class="wrap"><figure class="quote" id="q-5ba96ff518" data-kw="">
<blockquote><p>The learned Amyraldus did not service to the cause of the Reformation by his distinction between A PHYSICAL AND MORAL POWER OF BELIEVING IN CHRIST. He supposed the sinner to have the former, but not the latter. He held that Christ died for all men according to a decree of God, by which salvation was secured to sinners on condition of faith; which general decree, according to him, was to be considered as going before the particular decree about giving faith to the elect. When it was mentioned to him that his notion of the general decree now mentioned was absurd, as it suspended the end of Christ’s death on an impossible condition, he denied that the condition was impossible. ‘For,’ said he, ‘though I do not, with the Arminians, deny the impotence of fallen man, or his inability to believe (I allow him to be morally impotent), yet I hold that man has still a physical or natural power of believing, as he possesses the natural faculties of the understanding and the will.’ Herein Amyraldus has given a sad example of the abuse of great parts. Shall we suppose that when Christ undertook for sinners in the covenant of grace, He considered them any otherwise than as most miserable, lost, dead in sin, utterly impotent (Rom. 5:7; 8:3); or that the wisdom of God gave Christ to die for this end, that sinners might attain salvation by a natural power of believing—a power which Amyraldus confesses could never be exerted? Further, is not faith a most holy and moral act, and, as it takes place in the sinner, [a] purely supernatural act? And shall we allow that a principle which is not moral, but merely physical, can be productive of such a moral and supernatural act? Ought not an act and its principle to correspond with one another? Let the same thing be said of love which Amyraldus has said of faith, and the Pelagians will triumph who used to speak so much about a natural faculty of loving God above all things. Indeed, upon this scheme there will be no keeping out of the Pelagian opinion about the powers of pure nature, and about physical or natural faculties in man of doing what is morally good. For, in confuting that opinion, our divines still maintained that the image of God was requisite in the first man, in order to his exerting such morally good acts as those of loving and seeking true blessedness in the enjoyment of Him. But Amyraldus overthrows this doctrine, while he is led, by the distinction he makes between natural and moral power, to hold that the conception of man’s rational nature necessarily includes in it a power of exerting acts morally good, such as those of desiring and endeavouring to obtain the restoration of communion with the infinitely holy and blessed God. The tendency of this scheme became more manifest when Pajonius—a disciple of Amyraldus—began to deny the necessity of the Spirit’s work in the internal illumination of sinners, in order to their saving conversion. For, said Pajonius, nothing more is necessary to that end than that the understanding which has in itself a sufficiency of clear ideas (according to the language of the Cartesian philosophy then in vogue) should only be struck by the light of external revelation, as the eye is struck by the rays of light coming form a luminous object</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydecker.html">Melchior Leydecker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Veritate Religionis Reformatae et Evangelicalae</cite>, (1688), lib. ii., cap. 6, sect. 82; quoted in George Smeaton, The Doctrine of the Holy Spirit (Great Britain: Banner, rep. 1958), pp. 363-364</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb0ca35f61" data-kw="">

</figure><figure class="quote" id="q-9268f81703" data-kw="">
<blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>

<blockquote><p>…For I am of no other mind than Prosper [in the early Church] was: Habet populus Dei plenitudinem suam, et quamvis magna pars hominum salvantis gratiam aut repellat aut negligat, in electis tamen et praescitis atque ab omni generalitate discretis, specialis quaedam censetur universitas, ut de toto mundo, totus mundus liberatus, et de omnibus hominibus, omnes homines videantur assumpti. [“The people of God possess their own fullness; and although a great part of mankind either rejects or neglects saving grace, yet in the elect and foreknown, and those distinguished from the whole generality [of mankind], there is reckoned a certain special universality, so that, from the whole world, the whole world may be said to have been liberated, and from among all men, all men may appear to have been taken up.”] That Christ died for his apostles, for his sheep, for his friends, for his Church, may make peradventure against those who make all men to have a share alike in the death of our Savior: but I profess myself to hold fully with him who said: Etsi Christus pro omnibus mortuus est, tamen specialiter pro nobis passus est, quia pro Ecclesia passus est. [“Although Christ died for all, yet He suffered especially for us, because He suffered for the Church.”] Yea, and in my former writing I did directly conclude, that as in one respect Christ might have been said to die for all, so in another respect truly said not to have died for all; and my belief is, that the principal end of the Lord’s death, was, ‘that He might gather together in one the children of God scattered abroad,’ and, that for their sakes He did specially sanctify Himself, that they ‘also might be sanctified through the truth.’ And therefore it may be well concluded that Christ in a special manner died for these; but to infer from hence, that in no manner of respect He died for any others, is but a very weak collection, especially the respect by me expressed being so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, pp. 567-68</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…For I am of no other mind than Prosper [in the early Church] was: Habet populus Dei plenitudinem suam, et quamvis magna pars hominum salvantis gratiam aut repellat aut negligat, in electis tamen et praescitis atque ab omni generalitate discretis, specialis quaedam censetur universitas, ut de toto mundo, totus mundus liberatus, et de omnibus hominibus, omnes homines videantur assumpti. [“The people of God possess their own fullness; and although a great part of mankind either rejects or neglects saving grace, yet in the elect and foreknown, and those distinguished from the whole generality [of mankind], there is reckoned a certain special universality, so that, from the whole world, the whole world may be said to have been liberated, and from among all men, all men may appear to have been taken up.”] That Christ died for his apostles, for his sheep, for his friends, for his Church, may make peradventure against those who make all men to have a share alike in the death of our Savior: but I profess myself to hold fully with him who said: Etsi Christus pro omnibus mortuus est, tamen specialiter pro nobis passus est, quia pro Ecclesia passus est. [“Although Christ died for all, yet He suffered especially for us, because He suffered for the Church.”] Yea, and in my former writing I did directly conclude, that as in one respect Christ might have been said to die for all, so in another respect truly said not to have died for all; and my belief is, that the principal end of the Lord’s death, was, ‘that He might gather together in one the children of God scattered abroad,’ and, that for their sakes He did specially sanctify Himself, that they ‘also might be sanctified through the truth.’ And therefore it may be well concluded that Christ in a special manner died for these; but to infer from hence, that in no manner of respect He died for any others, is but a very weak collection, especially the respect by me expressed being so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.”

— James Ussher, The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, pp. 567-68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6For+I+am+of+no+other+mind+than+Prosper+%5Bin+the+early+Church%5D+was%3A+Habet+populus+Dei+plenitudinem+suam%2C+et+quamvis+magna+pars+hominum+salvantis+gratiam+aut+repellat+aut+negligat%2C+in+electis+tamen+et+praescitis+atque+ab+omni+generalitate+discretis%2C+specialis+quaedam+censetur+universitas%2C+ut+de+toto+mundo%2C+totus+mundus+liberatus%2C+et+de+omnibus+hominibus%2C+omnes+homines+videantur+assumpti.+%5B%E2%80%9CThe+people+of+God+possess+their+own+fullness%3B+and+although+a+great+part+of+mankind+either+rejects+or+neglects+saving+grace%2C+yet+in+the+elect+and+foreknown%2C+and+those+distinguished+from+the+whole+generality+%5Bof+mankind%5D%2C+there+is+reckoned+a+certain+special+universality%2C+so+that%2C+from+the+whole+world%2C+the+whole+world+may+be+said+to+have+been+liberated%2C+and+from+among+all+men%2C+all+men+may+appear+to+have+been+taken+up.%E2%80%9D%5D+That+Christ+died+for+his+apostles%2C+for+his+sheep%2C+for+his+friends%2C+for+his+Church%2C+may+make+peradventure+against+those+who+make+all+men+to+have+a+share+alike+in+the+death+of+our+Savior%3A+but+I+profess+myself+to+hold+fully+with+him+who+said%3A+Etsi+Christus+pro+omnibus+mortuus+est%2C+tamen+specialiter+pro+nobis+passus+est%2C+quia+pro+Ecclesia+passus+est.+%5B%E2%80%9CAlthough+Christ+died+for+all%2C+yet+He+suffered+especially+for+us%2C+because+He+suffered+for+the+Church.%E2%80%9D%5D+Yea%2C+and+in+my+former+writing+I+did+directly+conclude%2C+that+as+in+one+respect+Christ+might+have+been+said+to+die+for+all%2C+so+in+another+respect+truly+said+not+to+have+died+for+all%3B+and+my+belief+is%2C+that+the+principal+end+of+the+Lord%E2%80%99s+death%2C+was%2C+%E2%80%98that+He+might+gather+together+in+one+the+children+of+God+scattered+abroad%2C%E2%80%99+and%2C+that+for+their+sakes+He+did+specially+sanctify+Himself%2C+that+they+%E2%80%98also+might+be+sanctified+through+the+truth.%E2%80%99+And+therefore+it+may+be+well+concluded+that+Christ+in+a+special+manner+died+for+these%3B+but+to+infer+from+hence%2C+that+in+no+manner+of+respect+He+died+for+any+others%2C+is+but+a+very+weak+collection%2C+especially+the+respect+by+me+expressed+being+so+reasonable%2C+that+no+sober+mind+advisedly+considering+thereof+can+justly+make+question+of+it%2C+viz.+That+the+Lamb+of+God+offering+Himself+a+sacrifice+for+the+sins+of+the+world%2C+intended+by+giving+satisfaction+to+God%E2%80%99s+justice+to+make+the+nature+of+man+which+He+assumed%2C+a+fit+subject+for+mercy%2C+and+to+prepare+a+sovereign+medicine+that+should+not+only+be+a+sufficient+cure+for+the+sins+of+the+whole+world%2C+but+also+should+be+laid+open+to+all%2C+and+denied+to+none%2C+that+indeed+do+take+the+benefit+thereof%3A+for+he+is+much+deceived+that+thinks+a+preaching+of+a+bare+sufficiency+is+able+to+yield+sufficient+ground+of+comfort+to+a+distressed+soul%2C+without+giving+a+further+way+to+it%2C+and+opening+a+further+passage.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Whole+Works+of+the+Most+Rev.+James+Ussher%E2%80%A6+17+vols.+%28Dublin%3A+Hodges+%26+Smith%2C+1864%29%2C+vol.+12+%7C+%E2%80%98An+Answer+of+the+Archbishop+of+Armagh+to+some+Exceptions+taken+against+his+aforesaid+Letter%E2%80%99%2C+pp.+562-71%2C+pp.+567-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F033263c571.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/033263c571.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=For%20I%20am%20of%20no%20other,it%2C%20and%20opening%20a%20further%20passage&amp;text=For%20I%20am%20of%20no%20other%20mind%20than&amp;text=way%20to%20it%2C%20and%20opening%20a%20further%20passage" rel="noopener" target="_blank">Read it <blockquote><p>Also, it should be pointed out again that the doctrinal difference between the Saumur theologians and Turretin do not involve any of the fundamental tenets of the Reformed faith. Turretin himself mentions this fact in a letter to Jean Claude which we shall consider later in this thesis. As we have seen various times in this chapter, Turretin refers to the Salmurians as fellow Reformed pastors and theologians, and the Salmurians certainly view themselves as being within the Reformed tradition. In fact, Amyraut goes to great lengths in attempting to prove that the orthodox Reformed theologians are in agreement with him. Thus, even though this controversy was a serious and lengthy one, nevertheless it was entirely an internal dispute within the Reformed churches concerning non-fundamental matters.</p></blockquote>

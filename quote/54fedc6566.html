<main class="wrap"><figure class="quote" id="q-54fedc6566" data-kw="">
<blockquote><p>It is therefore clear from the foregoing, that if there be an intellect which knows all things by its essence, then its essence must needs have all things in itself immaterially; thus the early philosophers held that the essence of the soul, that it may know all things, must be actually composed of the principles of all material things. Now this is proper to God, that His Essence comprise all things immaterially as effects pre-exist virtually in their cause. God alone, therefore, understands all things through His Essence: but neither the human soul nor the angels can do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 84, art. 2, I answer that</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>But that this world should be made at such a time, and at first of no pre-existent matter, and in the space of six days, and in that order one part after another, and by the Word of God as the sole efficient, and so many years ago, is far above reason.</p></blockquote>

</figure><figure class="quote" id="q-102cf7c00b" data-kw="">
<blockquote><p>So that the creation of the world was like the building of the Temple, there was no noise of any tool or hammer heard in it; but like Jonas his gourd though it was not planted, nor watered grew up on a sudden, even in the short space of six days, and this is another wonder. The Temple of Jerusalem was a stately and magnificent building, yet it was not built in less time than forty and six years, notwithstanding many hands went to it; but the whole fabric of heaven and earth was finished in the space of six days: and He that made it in so few days, could (if he had pleased) have made it in as few minutes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-valentine.html">Henry Valentine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Sea-Sermons… (London: Flesher, 1635), 2nd Sermon</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-8a99d1bd51" data-kw="">
<blockquote><p>These people believe that the Bible clearly states that the Earth does not move, and hence the only acceptable Biblical cosmology is a geocentric one… We examine these arguments, and find them poorly founded. The Scriptural passages quoted do not address cosmology. Some geocentrists draw distinctions that do not exist in the original autographs or even in translations. In short, the Bible is neither geocentric nor heliocentric… Many evolutionists claim that disbelief in evolution is like disbelief that the Earth goes round the Sun. The obvious flaw is that the latter is repeatable and observable while the former is not…. …Aardsma’s ICR Impact article, where he points out something well known to high-school physics students, but apparently not to bibliosceptics—that it’s valid to describe motion from any reference frame, although an inertial one usually makes the mathematics simpler. But there are many times when the Earth is a convenient reference frame; i.e. at some point we all use the geocentric model in one sense. For instance, a planetarium is a geocentric model. Calculation of rising, transiting, and setting of various celestial objects is calculated geocentrically. There are numerous other examples. Since modern astronomers often use an Earth-centred reference frame, it’s unfair and anti-scientific to criticise the Bible for doing the same. But this is hardly the issue, and the use of the geocentric model under these circumstances hardly makes one a geocentrist. I’m using the term to describe those who claim that the Earth is the only valid reference frame and oppose the use of any other reference frame. Perhaps the best-known geocentrist in the world today [2001] is Gerardus Bouw, who has been a professor at Baldwin-Wallace College in Berea, Ohio… To distinguish modern geocentrism from ancient geocentrism, Bouw has coined the term ‘geocentricity’ for the former. Bouw has a Ph.D. in astronomy from Case Western Reserve University… Given Bouw’s stature as the chief champion of geocentricity, we will use his book by the same name as the primary source on the topic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/danny-r-faulkner.html">Danny R. Faulkner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geocentrism &amp; Creation’ Technical Journal (now Journal of Creation) 15, no. 2 (August 2001): 110–121.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

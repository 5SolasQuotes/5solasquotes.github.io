<main class="wrap"><figure class="quote" id="q-8ffaeccd41" data-kw="">
<blockquote><p>1st. The highest and closest union is between those things that are actuated by one spirit dwelling and moving in them… 2dly. Things at the greatest distance, and between which there is no physical continuity, may be acted by the same spirit, providing he be immense and infinite… 3dly. ‘Tis Christ as mediator that believers are united to… 4. The Holy Ghost did in a singular manner operate upon and reside in the human nature of Christ… 5thly. The Holy Ghost is the immediate renewer and sanctifier of the elect… 6thly. ‘Tis from, by, and through Jesus Christ as mediator that the Spirit, whether it be with respect to his Immediate seisure of us and dwelling in us, or with reference to any of his saving operations, is given to and bestowed upon us… 7ly. Through the communication of the Spirit from Christ to us, and immediately upon his taking the possession of us, the nature of Christ, the seed of God, and a vital living principle comes to be formed in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-ferguson.html">Robert Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Of the Union of Believers with Christ’ Outline in The Interest of Reason in Religion… &amp; the Nature of the Union Betwixt Christ &amp; Believers; (with Reflections on Several Late Writings, especially Mr. Sherlock’s Discourse…)… (London, 1675), pp. 421-665, pp. 656-661:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d04c21ab00" data-kw="Grace">
<blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</span></figcaption>

</figure><figure class="quote" id="q-6a06c5a511" data-kw="">
<blockquote><p>9. In Christ, the person must be distinguished from the enhypostatic adjunct. Person is only the divine nature. For one should not think that the person of Christ is a kind of conflation of human and divine nature – as if the person was composed out of parts. But because the divine nature, which assumed the human nature into the divine personality, is alone person, human nature is an enhypostatic adjunct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite>, (1644), ch. 11, ‘On the Person &amp; Office of Christ’, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

— Johannes Maccovius, Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy (1644), ch. 11, ‘On the Person &amp; Office of Christ’, p. 205">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C9.+In+Christ%2C+the+person+must+be+distinguished+from+the+enhypostatic+adjunct.+Person+is+only+the+divine+nature.+For+one+should+not+think+that+the+person+of+Christ+is+a+kind+of+conflation+of+human+and+divine+nature+%E2%80%93+as+if+the+person+was+composed+out+of+parts.+But+because+the+divine+nature%2C+which+assumed+the+human+nature+into+the+divine+personality%2C+is+alone+person%2C+human+nature+is+an+enhypostatic+adjunct.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+Scholastic+Discourse%3A+The+Distinctions+%26+Rules+of+Theology+%26+Philosophy+%281644%29%2C+ch.+11%2C+%E2%80%98On+the+Person+%26+Office+of+Christ%E2%80%99%2C+p.+205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a06c5a511.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a06c5a511.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=9.%20In%20Christ%2C%20the%20person%20must,human%20nature%20is%20an%20enhypostatic%20adjunct&amp;text=9.%20In%20Christ%2C%20the%20person%20must%20be%20distinguished&amp;text=alone%20person%2C%20human%20nature%20is%20an%20enhypostatic%20adjunct" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ec7ec52a0c" data-kw="">
<blockquote><p>A part coming to a whole does not give esse [existence] to the whole, but receives it, because it is perfected by the form of the whole. For if it remained distinct, as before, it would not receive the esse of the whole, but would either have proper esse or none. But the human nature united to the Word is not informed by the Word, but remains simply distinct. Therefore it either has no esse [denied], or [a] proper [esse of its own, affirmed].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as trans. Richard Cross, Union &amp; Communion | p. 14, from Ord. III, d. 6, q. 1, n. 26 (Vatican ed., IX, 240)</cite></span></figcaption>

</figure><figure class="quote" id="q-4dff76414d" data-kw="">
<blockquote><p>A threefold being is usually distinguished: of essence, of existence, and of subsistence… Therefore, concerning this being of existence, the present question is whether in Christ there is one existence of the divine nature and another of the human nature, or rather there is only a single being of existence, namely the uncreated existence of the Word itself, by which the assumed humanity is also said to exist… In this controversy there are two opposed opinions. The first is common in the school of Thomists, denying that in the humanity of Christ there is any created existence, and affirming that by union it was assumed not only to the subsistence of the Word but also to existence… And so the Thomists commonly teach in the cited place: Cajetan, Capreolus, Ferrara, Medina, Cabrera, Alvarez, and other notable followers of the same school. The opposed opinion is common outside the school of St. Thomas, affirming that the assumed humanity has its own created existence by which it exists. For although it was assumed to the subsistence of the Word, nevertheless [it was] not [assumed] to [his] existence. So Scotus holds (Ordinatio 3, d. 6, q. 1), St. Bonaventure (Sent. 3, d. 5, a. 3, q. 3), and the Scotists commonly follow, and all the more recent [theologians], some of whom strive to benignly interpret St. Thomas and draw him into this opinion as well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartolomeo-mastrius.html">Bartolomeo Mastrius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, bk. 3, Of the Incarnation of the Lord (d. 1673), Disputation 1 tr. by AI by OmegaPoint99 | quest. 6, ‘Whether the human nature in Christ has its own existence, or rather exists by the existence of the Word’ 140 | art. 1, Resolution of the question 141 art. 2, The foundations of the opposing opinion are overthrown 152-58, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

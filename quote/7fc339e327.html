<main class="wrap"><figure class="quote" id="q-7fc339e327" data-kw="">
<blockquote><p>In 1857 the minister of Londonderry Reformed Presbyterian Church, the Revd Robert Nevin, visited the American Covenanter Synod. The letter below informs us of the reaction of the Americans to his visit and their interest in Roman Catholic mission and covenant renewal:

To the Moderator and the members of the Reformed Presbyterian Synod of Ireland.

Dear brethren,

[…] Your brother, Rev. R. Nevin, whose intention of visiting our land you mention, is present with us at our synodical meeting. It gives us great pleasure to say that we have been comforted by his appearing among us. In an address, which at our request he kindly delivered, he gave such and encouraging account of your estate – of the success of your various schemes for adorning the interests of the covenanted cause, especially your mission among the Roman Catholic population and of the fruits of your renewal of the covenants, as made our hearts glad. To us in our trials and difficulties, his words were cheering, and in fact that his kind and seasonable counsel was suited to animate us with a firmer purpose to go forward with the solemn work to which we had assigned the first two days of our meeting. […]

Samuel Sterrit, Mod

John G. Boyd, Clerk</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-sterrit.html">Samuel Sterrit</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Irish Synod, 23 June 1857 (Reformed Presbyterian Historical Library, Knockbracken, American correspondence, no. 19).</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a19e0e1f64" data-kw="">
<blockquote><p>…yet has there been too much mischief done by these acts, to wit… the barring of hopeful young-men from trials, in order to public preaching, and of able and godly expectants from being called and tried, in order to their entrance in the ministry, because they had no freedom in their consciences to take upon them the bonds required, which we have already set down: for, this act, as it has kept sundry congregations from calling expectants of that judgment, because there was no probable way how they could be tried or admitted to the ministry; So have sundry expectants, being called, been thereby barred from proceeding to their trials…; and sundry hopeful young-men have been necessitated to remove from the presbyteries and provinces wherein they do live, before they could be admitted to give any proof of their gifts for preaching…</p></blockquote>

</figure><figure class="quote" id="q-c02becb5ea" data-kw="">
<blockquote><p>It is a very mean apology for them, to tell the world, that the grievance of patronage (that is, the civil law, establishing patronages) has led them to counteract the laws of the only Lord and Lawgiver of Zion. If our author had dealt faithfully with his brethren, and according to the great zeal that he professes, he ought plainly to have told, they ought ‘rather to suffer than sin.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, Separation’ 15, pp. (1584) in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-743a6abc4a" data-kw="">
<blockquote><p>Can anything be more plain than the duty of kings and all in authority to promote among their subjects the advancement of true religion and the glory of God, as that duty is enjoined in the second Psalm; — “Be wise now therefore, O ye kings; be instructed, ye judges of the earth. Serve the Lord with fear, and rejoice with trembling. Kiss the Son, lest he be angry, and ye perish from the way.” So that it is not merely a dictate and a duty of natural religion, but a revealed command, that monarchs should reign for the glory of God; — yea, that His revealed religion — His holy Word, as it declares the religion of Christ, the Son of God — should be honoured by them; that they should “kiss the Son.” For the Father hath set the Son on the holy hill of Zion — made Him “the Prince of the kings of the earth.”

This duty does not, of course, permit them to invade the liberties of Christ’s Church as a divinely-organised and divinely-ordered society, free to obey Christ as her only Head. On the contrary, it is the doctrine we are now maintaining, — the duty of kings to glorify Christ, to consult His Word, and consult for His honour, — it is this that will alone ever effectually prevent them interfering with the prerogatives of His Headship or the liberties of His people. When we maintain, therefore, as the Church to which I have the honour to belong maintains, that the civil magistrate has no jurisdiction within or over the Church, God forbid we should set it on the ground that he has nothing to do with religion, or the Church of Christ, at all.

Poor foundation, indeed, would that be for the principle maintained! He has so much to do with religion, and is so bound in his public capacity to act under religious obligation and duty to Christ, that he is bound to know and recognise Christ’s Church; and then to leave her free to serve Christ in all spiritual things. He is bound to know the truth of Christ; to protect those who maintain the truth of Christ; and to promote by every means in his power their labours to circulate and extend it. He is bound to suppress blasphemy, perjury, Sabbath desecration, and all that necessarily tends to the dishonouring of God and the demoralising of the people. He cannot command or compel man to be religious. No commandment can make man religious — not even God’s commandment can do it. The gospel of the grace of God, rendered effectual by the free and sovereign Spirit of God, can alone renew the heart of man or make him sincerely religious. Spiritual obedience to God neither magistrate nor parent can secure.

But is no authority, on that account, to be exercised? Is no obligation, on that account, to be enforced? Does God’s own authority cease? Is the obligation to obey God’s commandment at an end? His commandment even will never make men religious. Is it, therefore, set aside? No, verily. The assertion of law, obligation, and authority, does not rest upon consequences: whether owned or not, the obligation is the same. And be it remembered that while God uses His own authority and gives forth His own commands as means with which He often sends the accompanying grace and power to obey; so a parent or superior may not only use his entreaty, example, persuasion, and exhortation in the hope that God will accompany them with His blessing; but may specially put forth his authority and peremptory command in the same hope that God will bless them likewise, and secure a true obedience — secure the good and righteous end designed.

Let parents, masters, and all in authority make the 101st Psalm the rubric of their household or public procedure “I will sing of mercy and judgment: unto thee, O Lord, will I sing. I will behave myself wisely in a perfect way. O when wilt thou come unto me? I will “walk within my house with a perfect heart. I will set no wicked thing before mine eyes: I hate the work of them that turn aside; it shall not cleave to me. A froward heart shall depart from me: I will not know a wicked person. . . . Mine eyes shall be upon the faithful of the land, that they may dwell with me: he that walketh in a perfect way, he shall serve me. He that worketh deceit shall not dwell within my house: he that telleth lies shall not tarry in my sight.” “I know Abraham, that he will command his children and his household after him; and they shall keep the way of the Lord to do justice and judgment; that the Lord may bring upon Abraham that which he hath spoken of him.”

It is an evil and a dangerous principle that would exempt the rulers of a kingdom from being in subjection, in their public capacity, to the Word of Christ, and from being under obligation in their government to rule for the promotion of His kingdom. It strikes at the root of all family as well as national religion; and while it would confine Christ to the separate consciences of individual men, it would refuse Him the right to govern the households and communities into which, in Providence, they are combined. Its universal and perpetual prevalence would prevent the fulfilment of the promise that “the kingdoms of the world shall become the kingdoms of Jehovah and His anointed One;” and would subject all nations to the threatening: “The kingdom and nation that will not serve the Church shall perish; yea, those nations shall be utterly wasted” (Isa. lx. 12). Again, we repeat, it was fortunate and good for Nineveh that no such notion prevailed there. Theirs was a national fast, decreed by royal authority.</p></blockquote>

<blockquote><p>Now toleration lays this ground as a principle: Men are not to be troubled for their conscience, because they believe, hold, publish and teach what they do, right or wrong, according to their conscience, be it erroneous or not erroneous; and their zeal, hope, persuasion, comfort, carries them to undergo the reproaches of heretics, seducers, false prophets, imprisonment, torture, death, burning quick, rather than they would sin against known truth, and offend against a conscience, though erroneous; Yet because the sufferers are not infallible, and it may be a lie, they believe, publish, and suffer, for their hope may be grounded on a lie, their comfort not bottomed on the Scripture, and so false hope and comfort, their rejoicing in sufferings, and undergoing torture and violent death, but fleeting and counterfeit joy, their zeal without knowledge, a bastard zeal, having nothing to do with the Word and Gospel-promises; but in the bottom, as contrary to them as light is to darkness: For what any saint or professor believes and publishes, he is to believe and publish, and die in it, and for it, with a faith that the contrary may be a truth of God, and so to be tolerated and born with: Now the hope of the hypocrite is therefore compared to the spider’s web, to a broken tree, to a blasted olive tree, his joy to a night vision, a dream, the cracking of thorns under a pot, because both hope and joy, and all his comfort is grounded on an erroneous conscience, a lie, an imagination, not on the Word of God.</p></blockquote>

uotes.github.io%2Fquote%2F33bd25eab4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33bd25eab4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=Now%20toleration%20lays%20this%20ground%20as,not%20on%20the%20Word%20of%20God&amp;text=Now%20toleration%20lays%20this%20ground%20as%20a%20principle&amp;text=an%20imagination%2C%20not%20on%20the%20Word%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>9. The prime Positive Law of God is the Judicial Law, which God by the ministry of Moses, prescribed to the people of Israel, wherein the Lord was pleased to be the particular Lawgiver and Judge of that people, whom He had chosen from among all nations for a peculiar people to Himself, and to whose inclinations it is befitted. There are not a few who esteem the Judicial Law obliging unto all nations, mainly, because it does not appear in the Gospel, to be abolished as the Ceremonial Laws are, and because of its excellency beyond the laws of heathens, or other men, who might not only err in expediency, rendering their laws unprofitable, but also might make them unjust and inconsistent with the immutable moral Law of Nature; which reasons do sufficiently infer, that in the constitution of human laws, chief respect ought to be had to the Judicial Laws of God, and they assumed where the inclination of the people and their condition do not render them inconvenient. But that these laws were accommodat[ed] unto the Jews proper temper, is evident in the law concerning the bill of divorcement [Dt. 24:1-4], which bears, to be permitted for the hardness of their hearts; which was natural and peculiar to them, of jealousy and bitterness against their wives, therefore the Lord not only appointed trial, neither natural, necessary, nor accustomed elsewhere, by those tokens of virginity, for evidencing the wife’s unfaithfulness in not giving a polluted woman for a chaste [Dt. 22:14-20], but also the extraordinary and miraculous trial, by the water of jealousy [Num. 5:12-31], and therefore Christ did expressly abrogate that law [Mt. 5:31-32] and show us that Moses did not command to divorce, but for the hardness of their hearts only permitted it, and did command that when the husband would put away his wife, he should give her a bill of divorce, but it does not follow that the Judicial Law is in itself a Law to all nations, or that the Lord purposed it so to her, but on the contrair, it appears that his purpose was only to deliver it, for a peculiar Law to Israel, when He says, ‘What nation is so great that has statutes and judgments so righteous, as is all this Law, which I set before you this day,’ Dt. 4:8. And again ‘He shows his Word unto Jacob, his statutes and judgments to Israel, He has not dealt so with every nation, and as for his Judgments, they have not known them.’ Ps. 147:19 And therefore the same Law was not to Israelites and to strangers, even to proselytes; as appears in the matter of usury and bondage, which were allowed to strangers, but the former simply forbidden, and the latter limited as to Israelites: Neither is there any necessity of an express abolition of this Law in the Gospel, seeing it was not given to all nations; and it does yet bind the Jews so far as it does not build upon the Ceremonial Law: And therefore that part of the Judicial Law, which is founded upon, or conducible to the Moral Law may be well received by other nations, to whose inclination the same expediences will agree as most of the criminal laws are…</p></blockquote>

<blockquote><p>Over the coming months we will be posting a lot of quotes from the Reformer, Martin Bucer. He was a major influence on the shaping of Reformed theology, and had a very big influence upon the English Reformation. His book De Regno Christi has been translated into English, and can be purchased from here (sadly, not all chapters were translated). In this quote, Bucer upholds the Bible’s command to root out incorrigible criminals:

Thirdly, it is common to the kingdoms of this world and to the Kingdom of Christ that they should tolerate the wicked while they lie hidden among the good; but when they have done their impious misdeeds openly, and will not change their ways when corrected, it is proper to remove them from the commonwealth, as Plato indicates in his Politics. For the Lord has commanded his people quite strictly that they are to drive criminal and incorrigible men from their midst, and to burn them with fire, and thus to wipe out their offensiveness as completely as possible (Deut. 13:5 ff; 17:2-5; 19:11-21; 21:18-21; 22:13-28 and 24:7).</p></blockquote>

<blockquote><p>There was some Priests in it, and some Civil men, and they judged together in the LORD’s Matters; The Matters of the LORD belonged to them, to wit, The Priests. And the Kings Matters belonged to the others: But all was to judge according to the Word of GOD. We shall say this one word more, there is one Great Thing Folk stumbles at in that Paper that Kings ought to Rule or Judge according to the Judicial Law; and that these Laws Kings ought to Rule by, ought to be according to the Word of GOD, And think ye this a Great Wrong? The People of GOD was ruled Two Hundred Years and upwards by this Law only, and can any be fitter to be a Law-Giver than GOD? Have we Laws, have we them from Men or of GOD? If of Men, then they had them from Men or of GOD? Then the GOD of Nature, or the GOD that Created All is far better to Teach Laws than Man that is under GOD. We say stumble not that it is said, the Laws of GOD ought to be the Laws of the Land; For it will never be well with you (especially the Mein of the Land) till the Laws of GOD be the Laws of the Land; Then we will not be fashed [sic] with Great Ones to Oppress: For when they have Laws to make, they never do [any] thing but Oppress the Poor. But when the Law of GOD speaks, it will give Right to the Poor as well as to the Great. So the Law of GOD should be our Law. Where the Law of GOD is received where Christians are; Let Christians go to the Law which GOD has found out; And let Heathens and Turks go to the Law that Nature finds out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-cargill.html">Donald Cargill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A lecture and sermon preached in different times by that faithful and painful minister of the gospel, and now glorified martyr, Mr Donald Cargill, concerning Jehosophat and his association with Ahab, and the difficulty where to make recourse, when staged before the tribunal of God</cite>, (n.p., 1681), p. 10.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There was some Priests in it, and some Civil men, and they judged together in the LORD’s Matters; The Matters of the LORD belonged to them, to wit, The Priests. And the Kings Matters belonged to the others: But all was to judge according to the Word of GOD. We shall say this one word more, there is one Great Thing Folk stumbles at in that Paper that Kings ought to Rule or Judge according to the Judicial Law; and that these Laws Kings ought to Rule by, ought to be according to the Word of GOD, And think ye this a Great Wrong? The People of GOD was ruled Two Hundred Years and upwards by this Law only, and can any be fitter to be a Law-Giver than GOD? Have we Laws, have we them from Men or of GOD? If of Men, then they had them from Men or of GOD? Then the GOD of Nature, or the GOD that Created All is far better to Teach Laws than Man that is under GOD. We say stumble not that it is said, the Laws of GOD ought to be the Laws of the Land; For it will never be well with you (especially the Mein of the Land) till the Laws of GOD be the Laws of the Land; Then we will not be fashed [sic] with Great Ones to Oppress: For when they have Laws to make, they never do [any] thing but Oppress the Poor. But when the Law of GOD speaks, it will give Right to the Poor as well as to the Great. So the Law of GOD should be our Law. Where the Law of GOD is received where Christians are; Let Christians go to the Law which GOD has found out; And let Heathens and Turks go to the Law that Nature finds out.”

— Donald Cargill, A lecture and sermon preached in different times by that faithful and painful minister of the gospel, and now glorified martyr, Mr Donald Cargill, concerning Jehosophat and his association with Ahab, and the difficulty where to make recourse, when staged before the tribunal of God, (n.p., 1681), p. 10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+was+some+Priests+in+it%2C+and+some+Civil+men%2C+and+they+judged+together+in+the+LORD%E2%80%99s+Matters%3B+The+Matters+of+the+LORD+belonged+to+them%2C+to+wit%2C+The+Priests.+And+the+Kings+Matters+belonged+to+the+others%3A+But+all+was+to+judge+according+to+the+Word+of+GOD.+We+shall+say+this+one+word+more%2C+there+is+one+Great+Thing+Folk+stumbles+at+in+that+Paper+that+Kings+ought+to+Rule+or+Judge+according+to+the+Judicial+Law%3B+and+that+these+Laws+Kings+ought+to+Rule+by%2C+ought+to+be+according+to+the+Word+of+GOD%2C+And+think+ye+this+a+Great+Wrong%3F+The+People+of+GOD+was+ruled+Two+Hundred+Years+and+upwards+by+this+Law+only%2C+and+can+any+be+fitter+to+be+a+Law-Giver+than+GOD%3F+Have+we+Laws%2C+have+we+them+from+Men+or+of+GOD%3F+If+of+Men%2C+then+they+had+them+from+Men+or+of+GOD%3F+Then+the+GOD+of+Nature%2C+or+the+GOD+that+Created+All+is+far+better+to+Teach+Laws+than+Man+that+is+under+GOD.+We+say+stumble+not+that+it+is+said%2C+the+Laws+of+GOD+ought+to+be+the+Laws+of+the+Land%3B+For+it+will+never+be+well+with+you+%28especially+the+Mein+of+the+Land%29+till+the+Laws+of+GOD+be+the+Laws+of+the+Land%3B+Then+we+will+not+be+fashed+%5Bsic%5D+with+Great+Ones+to+Oppress%3A+For+when+they+have+Laws+to+make%2C+they+never+do+%5Bany%5D+thing+but+Oppress+the+Poor.+But+when+the+Law+of+GOD+speaks%2C+it+will+give+Right+to+the+Poor+as+well+as+to+the+Great.+So+the+Law+of+GOD+should+be+our+Law.+Where+the+Law+of+GOD+is+received+where+Christians+are%3B+Let+Christians+go+to+the+Law+which+GOD+has+found+out%3B+And+let+Heathens+and+Turks+go+to+the+Law+that+Nature+finds+out.%E2%80%9D%0A%0A%E2%80%94+Do

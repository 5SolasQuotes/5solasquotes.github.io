<main class="wrap"><figure class="quote" id="q-d08938eaf8" data-kw="">
<blockquote><p>The ordinary recreations which we have in winter, and in most solitary times busy our minds with, are cards, tables, and dice, shovelboard, chess-play, the philosophers’ game, small trunks, music, masks, singing, dancing, ulegames, catches, purposes, xmerry tales, news, etc. Many too nicely take exceptions at cards, tables, and dice, and such lusorious lots, whom Gataker well confutes. Which though they be honest recreations in themselves, yet may justly be otherwise excepted at, as they are often abused… So good things may be abused, and that which was first invented to refresh men’s weary spirits, when they come from other labors and studies to exhilarate the mind, to entertain time and company, tedious otherwise in those long solitary winter nights, and keep them from worse matters, an honest exercise is contrarily perverted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-burton.html">Robert Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Melancholy… (Oxford: Lichfield, 1621), 2nd Partition, Section 2, Member 4, ‘Exercise Rectified of Body &amp; Mind,’ pp. 346-47 Burton (1577-1640) was an Anglican clergyman and Oxford fellow.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

iv>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1826e86ef5" data-kw="oath obligation third commandment">
<blockquote><p>To the third commandment belongs the celebrated question concerning the faith of an oath; or what and how great is the obligation of an oath; and in what cases we can violate or are bound to keep plighted faith. First, every oath repugnant to the law of God and the lawful obedience to magistrates (concerning things either unlawful or impossible) does not bind the swearer to a performance of it. An oath ought not to be a bond of iniquity and no one ought to be compelled to do anything iniquitously. The apostolic maxim ought always to hold good here, “It is better to obey God rather than men” (Acts 5:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/third-commandment-the-name.html">Third commandment (the name)</a></span><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a> › <a href="../topics/worship/oaths-and-vows/lawful-oaths.html">Lawful oaths</a></span></div>

</figure><figure class="quote" id="q-dfed102fe5" data-kw="">
<blockquote><p>…there is a certain other kind of gaming which stands partly upon chance and partly upon industry, as is playing at tables, and such like, where in very deed they cast by chance, but the casts are governed by endeavor. Wherfore Plato affirmed the life of man to be like unto the playing at tables. For even as in table-play, so also in the life of man, if anything chance amiss, the same by art must be corrected. Unto which sentence Terence in his Comedy Adelphorum alludes. And indeed these kind of plays seem to be such, that sometime they may be permitted, so that they hurt not, so they recreate the spirits and be joined with honesty, and that the time, which should be spent vpon better things, be not consumed in these… But what shall we answer unto Ambrose?… the reason, which Ambrose first alleged, was because there was nothing found in the holy Scriptures, how these things ought to be used. Thereunto we answer that they are found in the holy Scriptures generally, ‘Whether ye eat, or whether ye drink, or whether you do anything else, do all things to the glory of God.’ (1 Cor. 10:31) Wherefore the body and the mind must otherwhiles be so refreshed with plays, as afterward we may be cheerful and prompt to weightier matters. Furthermore, there is nothing found particularly in the Scriptures touching bakers, cooks, or shipmen, and yet nevertheless their exercises must not be altogether excluded… But now to conclude, me thinks that those kind of [stage] plays, which serve for refreshing of men’s strength, are not utterly to be forbidden.</p></blockquote>

</figure><figure class="quote" id="q-bcd03ed59b" data-kw="">
<blockquote><p>Q. 112. What is required in the third commandment? A. The third commandment requires, That the name of God, his titles, attributes, ordinances, the word, sacraments, prayer, oaths, vows, lots,[r] his works, and whatsoever else there is whereby he makes himself known, be holily and reverently used in thought,[t] meditation,[v] word,[w] and writing;[x] by an holy profession,[y] and answerable conversation,[z] to the glory of God,[a] and the good of ourselves,[b] and others.[c] … [r] Acts 1:24,26. [s] Job 36:24. [t] Mal. 3:16. [v] Ps. 8. [w] Col. 3:17. Ps. 105:2,5. [x] Ps. 102:18. [y] 1 Pet. 3:15. Micah 4:5. [z] Phil. 1:27. [a] 1 Cor. 10:31. [b] Jer. 32:39. [c] 1 Pet. 2:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

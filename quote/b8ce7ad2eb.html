<main class="wrap"><figure class="quote" id="q-b8ce7ad2eb" data-kw="">
<blockquote><p>XXV. Although copulation had not take place in that marriage [between Joseph and Mary], it did not cease to be true and ratified (although unconsummated) for not intercourse, but consent makes marriage. Therefore it was perfect as to form (to wit, undivided conjunction of life and unviolated faith, but not as to end (to wit, the procreation of children [Turretin held to the perpetual virginity of Mary], although it was not deficient as to the raising of the offspring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13th Topic, ‘The Person &amp; State of Christ’, 11th Question, ‘The Conception &amp; Nativity of Christ’, section 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXV. Although copulation had not take place in that marriage [between Joseph and Mary], it did not cease to be true and ratified (although unconsummated) for not intercourse, but consent makes marriage. Therefore it was perfect as to form (to wit, undivided conjunction of life and unviolated faith, but not as to end (to wit, the procreation of children [Turretin held to the perpetual virginity of Mary], although it was not deficient as to the raising of the offspring).”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e90e17e47" data-kw="">
<blockquote><p>Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-de54466b40" data-kw="">
<blockquote><p>Faith then is the hand and wheel which must frame a vessel for honor, prepared, as for all other, so for this work of marriage. And in truth, as it is all religion (upon point) so it is the marriage ring, which makes the soul one with the Lord; and this ring is beset with many rich jewels, all of them serving for the honor, that is, the well carrying and discharge of marriage duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matrimonial Honour</cite>, (1642), pp. 24-25</span></figcaption>

</figure><figure class="quote" id="q-ad4c6f2e3d" data-kw="">
<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-perre-du-moulin.html">Perre Du Moulin Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Peace &amp; Contentment of Mind (London: 1657), ch. 9, ‘Of Good Conscience’</span></figcaption>

</figure><figure class="quote" id="q-e3075bbc9d" data-kw="">
<blockquote><p>‘Therefore he that giveth in marriage.’… You are not, however, to understand that celibacy is here preferred to marriage, otherwise than under the exception which was a little before expressed. For if power be wanting [lacking] on the part of the daughter, the father acts an exceedingly bad part if he endeavors to keep her back from marriage, and would be no longer a father to her, but a cruel tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 7, v. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<main class="wrap"><figure class="quote" id="q-b70c1d282f" data-kw="">
<blockquote><p>Primo Adami there was a government instituted by God immediately, of universal peace, civil, national, domestical, spiritual, corporal peace, nothing but peace, peace; yet Adam and Eve there, as Achan here, took but one bit of the excommunicated thing, that God had specially reserved, and thereby became Achans, troublers of all the peace public, so that he made himself and all the world anathema, an accursed thing thereby. After, when peace begun to be restored, and religion repaired in the Family of Seth, the sons of God offended in the execrable thing in marrying the Daughters of excommunicate Cain, and so not only disturbed, but brought ruin and destruction upon the whole World, Gen. 6. v. 2, 7.

When that great Law-giver Moses, with Laws judicial, moral and also Ceremonial, to tally divine, had settled the glory and peace of the Church, and Common-wealth of Israel, the people offending in the accursed thing of the Golden Calf, so disturbed all that notwithstanding Law and Government also, they were like to be consumed as one man and wholly extirpated, Exod. 32. Saul was a Monarch anointed of God himself, 2. Sam. 1. 15. elected by the vehement desire of all the subjects, yet offending in the execrable thing of Agag, reserving but one person which God had destinated to utter destruction, utterly ruinated his Government, and posterity. Solomon the Prince of peace, that had a Patent of peace, 1. Kings. 11. 11. and such skill in Governments as never any Monarch before him, or after him shall attain, yet by offending in the execrable thing of Chemosh and Milcom disturbed the peace public, and made such a rent in his Kingdom, as could never after be repaired.

Machiavelli himself in his Book De Repub: gives us one ground for this, whilst persuading Kings, above all things, if they mean to maintain obedience of their subjects to themselves, and peace one with another, to possess them with reverence of divine things, and fear of divine vengeance, as well as terror of human penalty: for, saith he, whosoever makes no scruples, to neglect or offend against these, will make much less, when occasion is offered, to plot sedition, to accommodate themselves to changes, to practice Treason, though to the utter overthrow of the whole Government. And surely he that is so loose conscience, and desperate, that he fears not with Achan to offend in the Babylonish Garment, though he doth thereby incur, and expose himself to the curse of the King of Heaven, hath no banks, or bonds to restrain him when occasion is offered, to ruin others, to disturb and trouble Church and Commonwealth, and to turn Traitor to the best established Government, or Governors on the Earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-fairclough.html">Samuel Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The troublers troubled, or, Achan condemned and executed. A sermon preached before sundry of the honourable House of Commons at Westminster, April 4, 1641</cite>, (London: Henry Overton, 1641), pp 6-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e67c526b51" data-kw="">
<blockquote><p>A number of proclamations issued in the relation of the visitation [of the plague in 1665] pertained to the concourse of the people. Under most circumstances the concourse of people was vehemently prohibited in political plague texts, upholding an understanding of material protection against the threat of contagion. However, the persistent belief in the moral dimension of illness manifested in proclamations that gestured to instances when gatherings could be justified, in the interest of providential salvation. On 6 July [1665], measures for designated fast days and the severity of the growing outbreak were proclaimed in a text entitled ‘By the King. A Proclamation for a Generall Fast Throughout the Realm of England’. Fast days during plague had been enacted first during an outbreak in 1563 under Elizabeth I, who, alongside her council and the church, scheduled prayer and fasting, with fasting on Wednesdays… The proclamation [in 1665] requested that citizens not only maintain the request, ‘And that the solemnization of these days may be with such Order and Decency as is requisite’… Meetings in churches continued through the outbreak, though the circumstances changed once many pulpits were left abandoned by their Anglican ministers. The flight of ministers meant nonconformist ministers took up the task of preaching at some of the vacant pulpits. Writing of the height of the epidemic, nonconformist Thomas Vincent described the scene at a church in God’s Terrible Voice in the City: ‘Now there is such a vast concourse of people in the Churches, where these ministers are to be found, that they cannot many times come near the Pulpit doors [in order to enter the pulpit to preach] for the press [of the people]’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-examples.html">Kathleen Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Literary Culture of Plague in Early Modern England Pre</cite>, (Palgrave, 2016), p. 36</span></figcaption>

<blockquote><p>But now in our times men have taken in hand to dispute this question upon this occasion, That many do so greatly fear this disease, and death which commonly followeth the same that forsaking all duties, not only of Christians, but also of Humanity, they have greatly increased the very wrath of God, which is the chief cause of this Sickness: and there hath in a manner been no stay or let in them; but where this great misery hath happened, the bonds of Man’s fellowships being once broken, it is much to be wondered at, that all Mankind hath not perished and been destroyed. …

For I deny, although it be agreed upon, that the Plague, of all other diseases, is most infectious; yea, and that unavoidable death for the most part doth presently follow: that therefore the Standing, in which God hath placed every man, is to be forsaken. I deny, I say, that therefore that thing is not to be preferred before Life itself, which we owe unto God, to our Country, and which we owe unto men, either for some public or pri­vate respect. And I had much more rather they would bestow their endeavours in persuasive disputes, to restrain men’s flying away for fear of the Plague, than that they should labour to prove their strange opinion of the Plague not to be contagious. …

But surely it is the part of a wise man to follow the Golden mean, so that he fly not when he should tarry, neither when he should go aside (for the term of flying away in this Argument seemeth to me to be very improper) by his rash tarrying, offend against the self-same Charity, which seemed to counsel him to stay.</p></blockquote>

</figure><figure class="quote" id="q-b3b6ba9c2e" data-kw="">
<blockquote><p>This book studies the concept of a ‘self-evident’ God in American legal thought from the Revolution to the present.</p></blockquote>

<blockquote><p>Wherefore not undeservedly does [Martin] Bucer in his Pastoral complain of those magistrates who neither care for nor procure the salvation of the peoples subject to them, holding them only as cattle for gain, and as often happens, devouring rather than feeding them, although kings and princes are also called pastors of peoples in profane and sacred letters.

Likewise do those magistrates sin and deserve most grave reprehension who after they have subdued new dominions by arms or other means take first thoughts for appointing quaestors and exactors themselves, but in no way labour to seek men fit for instructing them in religion or for appointing them to instruct, and are little solicitous what their subjects believe, provided they pay annual tributes and annual burdens.</p></blockquote>

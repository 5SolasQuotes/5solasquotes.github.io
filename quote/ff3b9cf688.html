<blockquote><p>What compelled people may do to redeem their lives, with loss of liberty, is nothing to the point… and that they may sell the liberty of their posterity, not yet born, is utterly denied as unlawful; yea, a violentated father to me is a father, and not a father, and the posterity may vindicate their own liberty given away unjustly before they were born, Qua omne regnum vi partum potest vi dissolvi.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 66 lt col bot</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da17ea4484" data-kw="">
<blockquote><p>If it be said, The fathers may engage the posterity by an oath to surrender themselves as loyal subjects to the man who justly and deservedly made the fathers vassals by the title of the sword of justice, I answer: The fathers may indeed dispose of the inheritance of their children, because that inheritance belongs to the father as well as to the son; but because the liberty of the son being born with the son (all men being born free from all civil subjection), the father has no more power to resign the liberty of his children than their lives; and the father, as a father, has not power of the life of his child; as a magistrate he may have power, and, as something more than a father, he may have power of life and death. I hear not what Grotius says, ‘Those who are not born have no accidents, and so no rights, Non entis nulla sunt accidentia [There are no accidents of non-being]; then children not born have neither right nor liberty.” And so no injury (may some say) can be done to children not born, though the fathers should give away their liberty to the conquerors — those who are not capable of law are not capable of injury contrary to law. Answer: There is a virtual alienation of rights and lives of children not born unlawful, because the children are not born. To say that children not born are not capable of law and injuries virtual, which become real in time, might say, Adam did not any injury to his posterity by his first sin, which is contrary to God’s word; so those who vowed yearly to give seven innocent children to the Minotaur to be devoured, and to kill their children not born to bloody Molech, did no acts of bloody injury to their children; nor can any say, then, that fathers cannot tie themselves and their posterity to a king by succession. But I say, to be tied to a lawful king is no making away of liberty, but a resigning of a power to be justly governed, protected and awed from active and passive violence.</p></blockquote>

<blockquote><p>2. Calvin thinks their vow not lawful. Bucanus, Polyander and Willet think it the lawful vow of the Nazarites, commanded [in] Num. 6. What then? if by God’s Law of the Nazarites, they abstained from wine and the Passover? God is above his own Law… 3. How prove ye, they abstained from the Passover? being so divine a law, might not their vow suffer an exception for a greater law in eating the Passover? I think it might, for in case of necessity they [the Rechabites] came and dwelt at Jerusalem for fear of the army of the Chaldeans, Jer. 35:11, and yet their vow was to dwell in tents.</p></blockquote>

</figure><figure class="quote" id="q-692c5a2f69" data-kw="">
<blockquote><p>Of three kinds of liberty, and how servitude is agreeable to the Law of Nature. But here it will further be demanded, whether servitude be agreeable to the Law of nature, and how it comes to pass, that the Lord suffered the Israelites being a free people, to be servants one unto another. For the deciding of this doubt, there is a threefold kind of liberty to be considered, a natural liberty, civil, and spiritual.

1. The natural liberty I call that, wherein Adam was created, being subdued to no bondage, neither spiritual of sin, nor corporal in any outward subjection to any creature: but as he had a freedom of will, and was made Lord of his affections within, that he needed not to have sinned, unless he would himself: so he had the dominion of the creatures given unto him. This original liberty of nature considered, servitude and bondage was brought in as a punishment of sin, and so is not simply, and of itself agreeable to the Law of nature.

2. But now since Adam’s fall, there is another kind of civil liberty, and civil servitude opposite unto it. Civil liberty is defined to be a natural faculty, for every man to do as himself likes. . . unless one be hindered by force or in right; for that is no true liberty for a man against right, to do what him likes . . . Now this servitude simply accords not with nature, as the Apostle says, If yet thou mayest be free, use it rather, 1 Cor. 7.21. showing that every one by nature desires liberty and freedom. But after a sort this servitude is agreeable to nature, not simply, or of itself, but as other punishments are said to be natural, as tending to the maintenance of society among men which is properly natural. And if it be objected, why since all men are fallen in Adam, and so brought into subjection, why all likewise become not servants: the answer is, that two things must be considered in this our corrupt state: the one is the Law of corruption, brought in by sin, the other the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others.

3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum: that is, A Sixfold Commentary</cite>, … (London, 1633), on Ex. 21, Question 10</span></figcaption>

2. But now since Adam’s fall, there is another kind of civil liberty, and civil servitude opposite unto it. Civil liberty is defined to be a natural faculty, for every man to do as himself likes. . . unless one be hindered by force or in right; for that is no true liberty for a man against right, to do what him likes . . . Now this servitude simply accords not with nature, as the Apostle says, If yet thou mayest be free, use it rather, 1 Cor. 7.21. showing that every one by nature desires liberty and freedom. But after a sort this servitude is agreeable to nature, not simply, or of itself, but as other punishments are said to be natural, as tending to the maintenance of society among men which is properly natural. And if it be objected, why since all men are fallen in Adam, and so brought into subjection, why all likewise become not servants: the answer is, that two things must be considered in this our corrupt state: the one is the Law of corruption, brought in by sin, the other the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others.

3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]”

e+fallen+in+Adam%2C+and+so+brought+into+subjection%2C+why+all+likewise+become+not+servants%3A+the+answer+is%2C+that+two+things+must+be+considered+in+this+our+corrupt+state%3A+the+one+is+the+Law+of+corruption%2C+brought+in+by+sin%2C+the+other+the+goodness+of+God%3A+that+although+all+men+are+subject+by+sin+to+the+same+bondage+and+corruption%2C+yet+the+goodness+of+God+qualifies+that+slavish+condition+of+nature%2C+as+that+some+do+enjoy+an+outward+liberty+and+freedom%3A+like+as+in+the+inward+faculties+of+the+soul%2C+the+Lord+gives+unto+some+more+light+of+understanding%2C+dexterity+of+wit%2C+profoundness+of+judgement%2C+and+other+natural+gifts%2C+than+unto+others.+3.+The+spiritual+liberty+is+wrought+in+us+by+grace+in+Christ%2C+which+is+from+the+subjection+of+sin%2C+and+malediction+of+the+Law%3B+that+our+conscience+is+no+more+terrified+with+slavish+fear%2C+but+we+are+at+peace+with+God%3A+and+beside%2C+by+this+spiritual+liberty%2C+the+faithful+have+restored+unto+them+the+dominion+over+all+creatures%3A+that+though+not+in+external+possession%2C+yet+in+a+spiritual+right%2C+all+things+are+theirs%2C+whether+the+world%2C+life%2C+death%2C+things+present+or+things+to+come%2C+1+Cor.+3.22.+and+all+things+work+to+the+best%2C+to+those+that+love+God%2C+Rom.+8.28.+So+these+may+very+well+stand+together%2C+external+servitude%2C+and+spiritual+freedom%3A+it+is+possible+for+one+to+bee+a+freeman+to+God%2C+and+yet+a+servant+in+the+world%2C+and+another+to+be+a+bondman+to+sin%2C+and+yet+free+in+the+world%3A+for+there+are+divers+objects+of+these+two+kinds+of+liberty+and+bondage%3B+the+outward+freedom+respects+this+life+and+state%2C+the+free+use+of+riches%2C+and+pleasures+of+this+life%3A+the+spiritual+and+internal+freedom+hath+set+before+it+the+salvation+of+the+soul%2C+the+favor+of+God%2C+and+life+eternal.+Christian+religion+then+overthrows+not+the+diversity+of+degrees+among+men%3A+But+as+Christ%2C+though+he+were+by+his+spiritual+right%2C+free+from+all+taxes+and+impositions%2C+yet+lest+he+should+offend%2C+payed+poll+money%2C+Matt.+17.+so+Christians%2C+though+they+are+made+free+by+faith+in+the+Son%2C+yet+for+the+maintenance+of+peace+and+love%2C+and+avoiding+of+offence%2C+in+disturbing+the+temporal+State%2C+they+are+bound+as+well+as+others%2C+to+be+subject+unto+the+powers+of+this+world%5B.%5D%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+Hexapla+in+Genesin+%26+Exodum%3A+that+is%2C+A+Sixfold+Commentary%2C+%E2%80%A6+%28London%2C+1633%29%2C+on+Ex.+21%2C+Question+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F692c5a2f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/692c5a2f69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=Of%20three%20kinds%20of%20liberty%2C%20and,unto%20the%20powers%20of%20this%20world&amp;text=Of%20three%20kinds%20of%20liberty%2C%20and%20how%20servitude&amp;text=be%20subject%20unto%20the%20powers%20of%20this%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

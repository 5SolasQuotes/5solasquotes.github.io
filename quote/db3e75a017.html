<main class="wrap"><figure class="quote" id="q-db3e75a017" data-kw="">
<blockquote><p>Many rest upon their outward civility &amp; morality, or negative holiness. They cannot be challenged for gross faults, and that is all the way they have to rest in: alas, could not a wicked Pharisee say, as much as they, viz That he was no extortioner, unjust person, nor an adulterer, nor such as the publican was, Luk. 18:11?

How many heathens, as to this, shall outstrip such as profess themselves Christians? and yet they lived and died strangers to the right way to happiness. See what that poor young man said Luk. 18: 21.

… Some may win to more then civility, and attain unto a kind of outward holiness, and outward performance of the duties of religion, such as hearing, reading, prayer, communicating; and rest there, and yet perish: for that is but their own way; it is not the right way.

Had not the foolish virgins lamps? and did they not wait with the rest Matt. 25? and will not many say in that day, we have eaten and drunken in thy presence, and thou hast taught in our streets, to whom Christ shall answer, I know not whence you are, depart from me, all ye workers of iniquity, Luk. 13: 26, 27? were not the Jews much in duties &amp; outward ordinances? and yet see how the Lord rejecteth them all, Esa. 1: 11, 12, 13, 14, 15, &amp; 66: 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the way, and the truth, and the life. Or, A short discourse pointing forth the way of making use of Christ for justification and especially and more particularly for sanctification in all its parts, from Johan. XIV: vers. VI. Wherein several cases of conscience are briefly answered, chiefly </cite>, (Rotterdam: John Cairns, 1677), p. 25.</span></figcaption>

</figure><figure class="quote" id="q-acf56f7acf" data-kw="">
<blockquote><p>3. Works needful for the comfortable passing of the Sabbath, as dressing of moderate food, and the like, may be done on the Sabbath-day; for seeing Christ allows us to lead the ox to the water, and requires not to fetch in water for him over night, he allows us to dress meat, and requires not to dress it over night. For the order in the Law of not kindling a fire pertained alone to the business of the Tabernacle, and that order of dressing what they would dress on the sixth day, pertained alone to the matter of manna. And for this we have Christ’s clear example, who being invited went to a feast on the Sabbath-day, which he might not have done if it had been unlawful to dress meat and drink on the Lord’s day, for a feast sure was not kept without some preparation of warm meat. This example of Christ we have Luke 14:1, 8, 12, which verses compared make it apparent that it was a feast whereto He was bidden amongst diverse others. So then all labors and businesses except in these three cases are unlawful, for mercy, necessity, and present needful comfort… but as sauce for work, only the spiritual pastimes of singing holy Psalms and songs as a spiritual recreation is allowed to prevent all weariness.</p></blockquote>

<blockquote><p>…if because of the ceremony of the surplice and cross… the second being only a monitory sign annexed to a rite of worship is not fitly termed worship…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Right Institution, Administration &amp; Receiving of the Sacrament of the Lord’s Supper… (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-d051acd45b" data-kw="">
<blockquote><p>As for your [Gilbert Burnet’s] demand, why in your worship [that of the Scottish non-cponformists] do you not kiss one another with a holy kiss? Seing it is nowhere commanded in worship, as you seem boldly and ignorantly to suppose, and the Christian manner of the thing, in customary civility, is only recommended by the apostle, as an allay of chastity and kindnesse in civil rencounters, the question is but a petulant extravagancy of your vain imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… (1671), 3rd Dialogue</cite>, pp. 117</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-09b3b03b78" data-kw="">
<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies... ([Leiden] 1637), | pt. 4, ‘Against the Indifferency of the Ceremonies’ | ch. 3, ‘Whether There be Anything Indifferent In Actu Exercito [In the Exercised Act]?’ No.</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-fb9b120c8b" data-kw="">
<blockquote><p>XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>section 12 of ch. 17, ‘Of the Lord’s Supper’ in bk. 4 of The Economy of the Covenants Between God &amp; Man… (NY: George Forman, 1798), vol. 3</cite>, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

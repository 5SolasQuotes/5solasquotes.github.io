<main class="wrap"><figure class="quote" id="q-2a2daaae1f" data-kw="">
<blockquote><p>The end which God aimed at in giving the law of Moses, was not, that any should ever attain to holiness or salvation by condition of perfect or sincere obedience to it; though, if there had been any such way of salvation at that time, it must have consisted in the performance of that law, which was then given to the church, to be a rule of life, as well as a covenant. There was another covenant made before that time with Abraham, Isaac, and Jacob, a covenant of grace, promising all blessings freely through Christ, the promised seed, by which only they were to be saved. And the covenant of the law was added, that they might see their sinfulness, and subjection to death and wrath, and the impossibility of attaining to life or holiness by their works, and be forced to trust on the free promise only for all their salvation, and that sin might be restrained by the spirit of bondage, until the coming of that promised seed Jesus Christ, and the more plentiful pouring out of the sanctifying Spirit, by him. This the apostle Paul shows largely (Gal. 3:15-24; Rom. 5:20,21 and 10:3,4). None of the Israelites under the Old Testament were ever saved by the Sinai covenant; neither did any of them ever attain to holiness by the terms of it. Some of them did indeed perform the commandments of it sincerely, though imperfectly: but those were first justified, and made partakers of life and holiness, by virtue of that better covenant made with Abraham, Isaac, and Jacob, which was the same in substance with the new covenant or testament established by the blood of Christ. Had it not been for the better covenant, the Sinai covenant would have proved to them an occasion of no happiness , but only of sin, despair, and destruction. Of itself it was only a killing letter, the ministration of death and condemnation: and therefore it is now abolished, 2 Cor. 3:6,8,9,11. – We have cause to praise God, for delivering His church, by the blood of Christ, from this yoke of bondage; and we have cause to abhor the device of those that would lay upon us a more grievous and terrible yoke, by turning our very new covenant in a covenant of sincere works, and leaving us no such better covenant, as the Israelites had under their yoke, to relieve us in our extremity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, 51</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38ad15fc71" data-kw="">
<blockquote><p>Come we to your [John Cotton‘s] proper opinion: You ‘do not acknowledge any unwillingness in God to reward the men of this world with life, upon any condition whatsoever.‘ I know no reason why you should conceive any of our divines to differ from you in this, although you had spoken out your meaning never so plainly and fully: not only denying unwillingness, but acknowledging a willingness, as afterwards you do; not a willingness only, which may have place though joined with a will to the contrary, as in all mixed actions, which yet are not incident to God, though they are to a creature, as who sometimes does some thing volens nolens [willingly not willingly]: for certainly God will save any man upon condition he believes and repents: and on the other side, neither is there any unwillingness in God, but a willingness rather, yea and that a resolute will to damn any man in case he dies in infidelity and impenitency. For we have the clear word of God to justify us herein, professing most evidently that ‘Whosoever believeth shall be saved; whosoever believeth not shall be damned.’ So that I wonder not a little whereto these expressions [of Cotton’s] tend, save that commonly such is the issue of imperfect conceptions, all preparations to the justifying of them fall miserably short of that whereunto they aim.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2, pp. 54-55</span></figcaption>

</figure><figure class="quote" id="q-14e906f598" data-kw="">
<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 566</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-ee7dbeaba1" data-kw="">
<blockquote><p>That goodness which surmounted so many difficulties and conquered so many motions that might be made against any repeated exercise of it after it had been abused by the first rebellion of man: That goodness that after so much contempt of it appeared in such a majestic tenderness and threw aside those impediments which men had cast in the way of divine inclinations: This goodness is the foundation of all reliance upon God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, p. 678</span></figcaption>

</figure><figure class="quote" id="q-8512b1e2d9" data-kw="">
<blockquote><p>Moreover, the chief point of all Scripture is that we should not doubt but hope, trust, and believe for a certainty that God is merciful, kind, and patient, that He does not lie and deceive but is faithful and true. He keeps His promises and has now accomplished what He had promised, handing over His only Son into death for our sins, so that everyone who believes in the Son should not perish but have eternal life (John 3:16). Here there can surely be no doubt whether God has been reconciled and is favorably disposed toward us, whether the hate and wrath of God have been removed; for He permits His own Son to die for us sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 386.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Moreover, the chief point of all Scripture is that we should not doubt but hope, trust, and believe for a certainty that God is merciful, kind, and patient, that He does not lie and deceive but is faithful and true. He keeps His promises and has now accomplished what He had promised, handing over His only Son into death for our sins, so that everyone who believes in the Son should not perish but have eternal life (John 3:16). Here there can surely be no doubt whether God has been reconciled and is favorably disposed toward us, whether the hate and wrath of God have been removed; for He permits His own Son to die for us sinners.”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 386.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoreover%2C+the+chief+point+of+all+Scripture+is+that+we+should+not+doubt+but+hope%2C+trust%2C+and+believe+for+a+certainty+that+God+is+merciful%2C+kind%2C+and+patient%2C+that+He+does+not+lie+and+deceive+but+is+faithful+and+true.+He+keeps+His+promises+and+has+now+accomplished+what+He+had+promised%2C+handing+over+His+only+Son+into+death+for+our+sins%2C+so+that+everyone+who+believes+in+the+Son+should+not+perish+but+have+eternal+life+%28John+3%3A16%29.+Here+there+can+surely+be+no+doubt+whether+God+has+been+reconciled+and+is+favorably+disposed+toward+us%2C+whether+the+hate+and+wrath+of+God+have+been+removed%3B+for+He+permits+His+own+Son+to+die+for+us+sinners.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1-4%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+386.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8512b1e2d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8512b1e2d9.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/03/luther-on-the-chief-point-of-scripture/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

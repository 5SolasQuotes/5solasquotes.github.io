<main class="wrap"><figure class="quote" id="q-71d1c41f51" data-kw="">
<blockquote><p>Or it may be taken as a poetical figure designed to represent the subject more affectingly. God, in his Word and ordinances, is thus to be welcomed by us, 1. With great readiness: the doors and gates must be thrown open to Him. Let the Word of the Lord come into the innermost and uppermost place in our souls; and, if we had 600 necks, we should bow them all to the authority of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 24, verses 7-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19034cd159" data-kw="">
<blockquote><p>Christ spake by saint Paul and the rest of the apostles in their time (2 Cor. 13:3), and He speaks by us, which are His ambassadors at this day: therefore harden not your hearts against his preaching, lest He shut you out of his rest, but reverently embrace his preaching; let Christ enter into your hearts by his Word and Spirit, that ye may have rest and peace of conscience in this life; and be received up into his everlasting rest where ye shall never be molested any more, in the life to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Philemon and Hebrews</cite>, (London, R.B., 1635), on Heb. 3:11, p. 133</span></figcaption>

</figure><figure class="quote" id="q-b4d63f5295" data-kw="">
<blockquote><p>So in the 23rd [of] Proverbs, v. 26. ‘My son give me thy heart;’ ‘O my son,’ says God, ‘give Me thy heart;’ Christ is the Everlasting Father, and He says, ‘My son, give me thy heart, come to Me.’ One place more in the 3rd [chapter of] Revelation is worth your observing; ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in to him and will sup with him, and he with Me:’ ‘Behold I stand at the door and knock;’ I came down from heaven into mine ordinances, I knock at the door of your hearts and consciences, if any man will open now, if any many would have water of life from me, if any man would have bread of life from Me, if any man would have communion with Me, let him but open and receive Me in, and I will sup with him and he with Me: what sweet invitations have we from Christ, how forward, how ready is the Lord Jesus to do poor sinners good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-greenhill.html">Ezekiel Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ</cite>, … (London: R.I., 1656), “Christ’s Willingness to Save Sinners, Sermon 1”, p. 156</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

 Online</a></div>
</figure><figure class="quote" id="q-2f10b64d60" data-kw="">
<blockquote><p>Because thou hast rejected the Lord tendering Himself to thee, therefore now He stands at a distance from thee: many proffers did He make to thee, but thou slightest them; many calls thou hast from Him, and wouldst not hear them; many knocks has He given at the door of thy heart, and begged for entrance, but thou keptst thy heart shut still against Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love-Sick Spouse, or the Substance of Four Sermons</cite>, (London: Simmons, 1665), ch. 7, pp. 15–16 Gearing (c. 1625 – c. 1690) was an English puritan minister.</span></figcaption>

</figure><figure class="quote" id="q-b3098677bd" data-kw="">

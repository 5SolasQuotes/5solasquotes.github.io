<main class="wrap"><figure class="quote" id="q-8f67dd81e5" data-kw="">
<blockquote><p>I was one day thinking of the different things which keep man far from God. My thoughts dwelt principally on those mistaken thousands who experience neither the force nor the sweetness of religion, but are content with mere appearance and outward forms. I felt grieved for the guilty self-deceiving of those who sigh after peace, while they neglect the means whereby peace cometh, and, wavering between heaven, which they love too little, and earth, which they love too much, consume themselves in desires that are unavailing, because contradictory.

How from this subject my imagination wandered I cannot tell; but my mind stumbled on an old tale of some robbers, whose watchword always was, “Your purse or your life” Far as my mind had strayed, I found here a clue to bring me back to my subject. Said I to myself, “Are there not many sinners lost, because, in so many cases, the purse is preferred to life eternal? Is it not because religion imperatively requires a renouncing of the love of the world, that she finds so few honest followers?”

The world is evidently going a wrong way. One of the most horrible things we see, is the impious and cruel employment of money. Since Jesus came into the world, to redeem mankind and to teach true charity, money has become a thing most precious. By means of money, the Gospel is printed, spread abroad, and preached; the poor are relieved and assisted. Money is a powerful means of eternal and temporal good; it is useful for the saving of the soul, and for the relief of the body.

But whilst money, under the guidance of charity, can accomplish such blessed results, it can also, in the service of the world’s love, perpetuate and increase the troubles, vices, pride, gluttony, the sufferings and the degradation of men. With money, then, we may do much good, or much evil. By God, it is destined to do good; by man, it is employed to do evil.

To make known to mankind the fruits of his atoning death, Jesus has bequeathed his Holy Word, and has instituted the preaching of the Gospel. During every minute of time, hundreds of our fellow-beings, pass away into hell. There is nothing more sure than this. Nevertheless, the Word of reconciliation has been sent to them by God; and if those who possess that Word, and know it for themselves, were to multiply it by the printing-press and the pulpit, souls would receive it, and would go to heaven. To spread abroad the Word, and to send forth heralds of salvation, there must needs be money.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/napoleon-roussel.html">Napoléon Roussel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Your Purse or Your Life! in Christian Miscellany</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb6c918bbc" data-kw="">
<blockquote><p>Let us not say, ‘We have bad health.’ Remember the apostle Paul – he had a thorn in the flesh – some never-ceasing ailment, probably – and yet it seemed a spur rather, than a hindrance to his soul.

Let us not say, ‘We have many trials.’ Remember Job. Wave upon wave came rolling over him, and yet his faith did not give way; and the record of his patience is on high.

Let us not say, ‘We have families and children to make us anxious and keep us back.’ Remember David – none was ever so tried at home as he was, yet he was a man after God’s own heart.

Let us not say, ‘We have press of distracting business to attend on.’ Remember Daniel – he had far more affairs on his hands probably than any of us, yet he found time to pray three times a day and was a proverb for godliness.

Let us not say, ‘I stand alone, the times are evil, and none around me serve God.’ Remember Noah. The whole world was against him, yet he did not give way. By faith he held fast.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop J. C. Ryle’s Autobiography: The Early Years</cite>, ed. Andrew Atherstone (Edinburgh: Banner of Truth, 2017), pp 280-81.</span></figcaption>

<blockquote><p>…it lies as a necessary duty upon all to worship and serve God. The Hebrew words and Greek are several and observable that express this worship, which are exactly handled among the learned; The ground of this worship is because He is the Jehovah, who giveth us our being, and all other mercies: It is therefore most natural and a most indispensable debt to acknowledge Him for his supreme excellency herein and to give Him a peculiar and proper worship. Now this worship and service is either internal, or external, or mixed, compounded of both; internal consists in our love of God above all things, faith and hope in Him, obedience to his commands, which the Scripture prefers before all external worship; External is that of adoration and inclination of the body, kissing the hand, bowing the knee, dedicating temples, altars, and offering of sacrifices; Mixed is compounded of both these, such as calling upon God’s name by petition and thanksgiving.</p></blockquote>

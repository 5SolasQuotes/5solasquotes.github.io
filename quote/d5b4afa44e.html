<blockquote><p>See 2 Cor. 3:5; Rom. 9:15-16. We confess that God is not wont to infuse saving grace but into hearts fitted and prepared, but He works these preparations by his own Spirit. See Bishop Davenant, Determination of Question 34.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b7bdd323b" data-kw="">
<blockquote><p>Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise:

1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12.

3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them.

4. We are to believe without staggering, Rom. 4.19.

5. We have peace of conscience through faith, Rom. 5:1.

6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-32536b3234" data-kw="">
<blockquote><p>1. Regeneration is the work of the one and only God.

2. Hence man in the first moment of his regeneration is merely passive.

3. Nor are there any internal preparations in a spiritually dead man for the same.</p></blockquote>

</figure><figure class="quote" id="q-24b8ee6b33" data-kw="">
<blockquote><p>Assertion 2. The soul or its faculties are not destroyed in conversion: Peter’s will which he had when he was young, was the same when converted, but renewed, Jn. 21:18; the saints that Peter writes to are not to run to the same excess of riot as of old they wrought the will of the gentiles, 1 Pet. 4:3-4. Paul and Titus were the same men, when disobedient and serving diverse lusts, and when converted, and now washen, regenerated and justified heirs, Tit. 3:1-4. Paul: the same man, a persecuter and an apostle, but grace made a change, 1 Cor. 15:9-10, the same mind and spirit remains in nature, but they are renewed in the spirit of the mind, Rom. 12:2; Eph. 4:23. It is the same heart, but turned to the Lord, 2 Cor. 3:15-16. Christ but removes the scum and the dross, and the false metal, and frames the man a new vessel of mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London, 1647), p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

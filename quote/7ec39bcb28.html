</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6b2cfa0ec6" data-kw="">
<blockquote><p>III… Although this concept cannot be conveniently defined, since it is not a single entity by its nature but rather an aggregate of various diverse natures, and therefore defies categorization according to logical principles, it can be most conveniently described as the conformity of man, according to his measure, to the supreme perfection of God. As D. Ames presents it in Medulla Theologiae (Book 1, Chapter 8, Sections 9 and 68), it is helpful to analyze this further. It is called conformity because an image, as such, is a kind of likeness expressed from another; therefore, it must be described through similarity and conformity, not identity… The subject of this image, both directly and indirectly, is man. Here we note two points: first, that man can be considered in his fourfold state: as whole in creation, fallen in corruption, restored in regeneration, and glorified in glorification. For each of these states, a different aspect of the image is attributed to him by the Holy Scriptures in various ways… Secondly, we must note, following Genesis 1:26-28, that women are by no means excluded from this image… Furthermore, the phrase “according to his measure” is not without significance, for although this conformity is in itself most perfect, it varies according to the capacity of its subjects (since it applies differently to angels than to humans). Consequently, this image was also implanted in humans according to their measure—that is, perfectly (for nothing imperfect comes from God), yet in a way divinely adjusted to their capacity, as they were not endowed with supreme perfection. Lastly, the phrase “to the supreme perfection of God” alludes to the genuine archetype and original exemplar to which man, as a secondary type and copy, is said to conform. The reason for this conformity is explained in the prolegomena. I will add only this: that this communication should in no way be conceived as formal but only effective, by way of effect… IV… Therefore, we examine the parts or the substance from which it (as previously mentioned, it is composed of multiple elements) consists, in three aspects: first, those concerning the body; second, those concerning the soul, which are further divided into 1) essence, 2) faculties, and 3) habits; and third, those concerning the whole composite… although various parts constituting this image are enumerated here, it should be understood that not all contribute equally—some antecedently and presuppositionally, others formally and primarily, and still others consequentially and sequentially.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</cite></span></figcaption>

</figure><figure class="quote" id="q-ffafce369f" data-kw="">
<blockquote><p>It ought to be well understood in approaching this topic that the delineated distinctions, and further ones that will be made, are not magic solutions to ethical predicaments. Rather they are (very useful) tools that will go a long way towards working to what is righteous and pleasing before God. As with all tools, they may be used well, or irresponsibly. If through the multiplying of distinctions and terms (or the opposite, the lack of using such), a conclusion is reached that seems off or suspect, sophistry is likely being committed. Ethical conclusions reached should go with, and support an informed common sense in line with Scripture, not go against it. The purpose is to clearly understand and ground the reasons for right action, and to clear away all the mist, leaps and gymnastics of those who advocate error and manipulate truth as a wax-nose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’, ‘Extended Intro’, ‘The Beginnings of Answers: Distinctions’</cite></span></figcaption>

</figure><figure class="quote" id="q-2e7bfd0106" data-kw="">
<blockquote><p>The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>

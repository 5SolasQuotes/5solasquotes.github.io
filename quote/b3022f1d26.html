<blockquote><p>This crass separation of sanctification from justification, as if it was merely an additional gift of grace to be sought and obtained for itself — instead of, as it is, an inseparable component part of the one salvation that belongs to all believers — lays the foundation, of course, for that circle of ideas which are summed up in the phrase, “the Second Blessing.” These are far from wholesome. Among them may be mentioned, for example, the creation of two different kinds of Christians, a lower and a higher variety.

With Mr. [Charles G.] Trumbull, these two classes of Christians are “merely saved people” and “real disciples of Christ.” “Thousands of saved people,” he says, are not following after Christ, are not bearing the cross, and therefore are not disciples. A Christian is one who is saved from the penalty of his sin; a disciple is one who, after being saved, becomes a learner, goes on learning more and more about Christ. This does not seem to be just Christ’s teaching (Mat. xvi. 24; Mark viii. 34; Luke ix. 23).

And one asks in amazement, What is the penalty of sin? And what is salvation from it? Is not our sinfulness the penalty above all other penalties of sin, and is not holiness just salvation from sin? Are we not to credit Paul when he tells us that “God chose us from the beginning unto salvation in sanctification of the Spirit?” (2 Thess. ii. 13), and in pursuance of this His primal purpose has called us in sanctification (1 Thess. iv. 7); and that therefore, saved by grace through faith, “we are His workmanship, created in Christ Jesus for good works, which God afore prepared that we should walk in them” (Eph. ii. 10)?

Mr. Trumbull’s distinction, however, is a necessary consequence of separating sanctification from justification, as a distinct blessing subsequently sought and obtained. As an inevitable result of it a most unpleasant note is sounded throughout the whole literature of this movement of what we cannot call anything else than spiritual pretension. These writers are always felicitating themselves upon not being as other men are — “ordinary Christians,” “average Christians”; and these “ordinary” or “average” Christians come in for a good deal of little-disguised scorn.

We are told by the tract called Subdued that not more than one in a thousand of converted men attain to “victory” — that is to say to the status of “disciples.” The rest are satisfied to live on a lower plane. “Where others are content with a meagre measure of piety and power, with an ambition merely to be saved as by fire,” we read in the tract called Victory, — “and you claim your full inheritance in Christ — an overcomer in order to reign with Him — that is victory.” It is possibly only the language employed here that reminds us of the incident recorded in Mat. xx. 20 ff. But it is not of humility that we especially are made to think as we read.</p></blockquote>

<blockquote><p>Thus a Christian man is righteous and a sinner at the same time, holy and profane, an enemy of God and a child of God.* None of the sophists will admit this paradox, because they do not understand the true meaning of justification. This was why they forced men to go on doing good works until they would not feel any sin at all. By this means they drove to the point of insanity many men who tried with all their might to become completely righteous in a formal sense but could not accomplish it. And innumerable persons even among the authors of this wicked dogma were driven into despair at the hour of death, which is what would have happened to me if Christ had not looked at me in mercy and liberated me from this error. We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph. 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.” As I have said, therefore, any Christian is a supreme pontiff, because, first, he offers and slaughters his reason and the mind of the flesh, and, secondly, he attributes to God the glory of being righteous, truthful, patient, kind, and merciful. This is the continuous evening and morning sacrifice in the New Testament. The evening sacrifice is to kill the reason, and the morning sacrifice is to glorify God. Thus a Christian is involved, daily and perpetually, in this double sacrifice and in its practice. No one can adequately proclaim the value and the dignity of Christian sacrifice. Therefore this is a marvelous definition of Christian righteousness: it is a divine imputation or reckoning as righteousness or to righteousness, for the sake of our faith in Christ or for the sake of Christ. When the sophists hear this definition, they laugh; for they suppose that righteousness is a certain quality that is first infused into the soul and then distributed through all the members. They cannot strip off the thoughts of reason, which declares that righteousness is a right judgment and a right will. Therefore this inestimable gift excels all reason, that without any works God reckons and acknowledges as righteous the man who takes hold by faith of His Son, who was sent into the world, who was born, who suffered, and who was crucified for us.</p></blockquote>

<blockquote><p>The apostle signifies the same thing by different words when he says, ‘Ye are washed, ye are sanctified, ye are justified:’ he has said, ‘ye are washed,’ on account of holy baptism; ‘ye are sanctified,’ on account of the Holy Ghost; but ‘ye are justified,’ on account of justifying faith, etc.</p></blockquote>

</figure><figure class="quote" id="q-09706511d9" data-kw="">
<blockquote><p>When I lately read one saying: “That this was one principle that the Church of England went on, in the Reformation, that faith and works have the same consideration in the business of justification,” I could not but stand amazed, and conclude that either he or I had been asleep ever since we were born; or that there were two Churches of England, – one that I never knew, and another that he never knew; or else that prejudice is powerful, and makes men confident. Is that the doctrine of the Church of England, as they call it? When, where, by whom was it taught, but by Papists and Socinians, until within a very few years, in England? What place hath it in confessions, homilies, liturgies, controversy writers, or any place of repute for learning and religion in England?</p></blockquote>

<blockquote><p>BY Formality. Where the Worship of God is set up, Men don’t readily lose the form, but it is a frequent thing to lose the power of Godliness. It is an easy thing to carry on Praying, to attend Public Worship, and to attend duties of Religion on the Sabbath: this may be done, though their hearts are violently set upon the World, and they be under great prevailings of evil affections: but it is very cross to nature to mortify corruptions, and to exercise themselves in self-denial; give their hearts to God, and to be rejoicing in the righteousness of Christ. Many times People that retain the name of living lose the life of Religion, Rev. 3.1. People are wont to grow lukewarm, Rev. 3.15. The spirit of Religion doth decay by degrees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of Gospel-ministers to preserve a people from corruption. Set forth, in a sermon preached at Brookfield, October 16. 1717. Being the day wherein the church was gathered, and Mr. Thomas Cheney, was ordained Pastor</cite>, (Boston: Samuel Phillips, 1718), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>All delight arising from suitableness between the mind and the object; a mind that is truly great cannot please it self in these low things that others do: To eat and drink, gather riches, build houses, and delight themselves in these contentments of the flesh. As Sueton reports of Domitian: Who had the great affaires of the Empire to busy himself in; yet he did constantly spend some time every day in catching of flies:

But a truly noble spirit is with David considering how he may lay out himself in some great service for the glory of God, the advancement of his Ordinances, and the enlargement of the Kingdom of his dear Son. As for other things he looks upon Them as beneath him, As Themistocles after a great victory won against the Persians, walked up and down among the slain, and saw here &amp; there some great &amp; rich spoils, which he disdained to stoop for, but said to one that stood by him, Tolle haec, tu qui Themistocles non es. Let such take care of these things that have spirits fit for no higher things.</p></blockquote>

<blockquote><p>I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies:

1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines:

1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing.

2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold:

1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will.

2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared</cite>, … (London: Salusbury, 1694), ch. 2, pp. 28-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

— Richard Baxter, Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared, … (London: Salusbury, 1694), ch. 2, pp. 28-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+shall+therefore+a+little+further+explain+this+distinction+and+then+show+you+the+soundness+of+it%2C+and+then+the+exceeding+usefulness+and+necessity+of+it%2C+both+in+this+and+many+other+controversies%3A+1.+For+the+title+I+choose+rather+to+denominate+it+from+the+object+than+the+act%2C+because+the+diversity+is+in+the+object%2C+but+none+in+the+species+of+the+act+naturally+considered%3A+Debitum+and+natural+being+are+two+distinct+things%3B+but+%E2%80%98to+will%E2%80%99+one+and+%E2%80%98to+will%E2%80%99+the+other+is+all+one+as+to+the+nature+of+willing.+God+does+as+properly+will+duty+as+He+wills+natural+beings.+Yet+if+I+must+denominate+it+from+the+acts%2C+I+would+distinguish+between+God%E2%80%99s+Directive+Will+and+his+Legislative.+For+to+call+it+voluntas+praecepti+is+too+narrow+a+term%2C+for+the+precept+is+but+one+part+of+God%E2%80%99s+Law+and+determines+only+of+one+sort+of+right%2C+that+is%2C+of+the+dueness+of+obediential+actions+or+forbearance+of+forbidden+actions.+But+there+is+also+a+debitum+praemii+et+beneficii%E2%80%93pure+vel+absolute%E2%80%93dati%2C+et+debitum+poenae+%5Bdebt+of+reward+and+benefit%2C+whether+purely+or+absolutely+given%2C+and+a+debt+of+punishment%5D%2C+which+the+rest+of+the+Law%2C+Testament+or+Covenant+of+God+determines+of%2C+which+must+all+be+here+included+as+well+as+the+former.+In+sum%2C+the+Law+determines%3A+1.+What+shall+be+due+from+us%3B+2.+and+what+shall+be+due+to+us%2C+and+on+what+terms.+I+call+it+therefore%2C+The+will+of+God+de+eventu%2C+et+de+debito+%5Bof+event%2C+and+of+debt%5D%2C+as+such.+I+say+%E2%80%98as+such%2C%E2%80%99+for+else+they+are+coincident%3A+For+God%E2%80%99s+will+de+rerum+natura%2C+vel+existentia+determines+de+debito+quatenus+evenit+esse+debitum+%5Bdetermines+the+nature+or+existence+of+things%2C+and+debt+so+far+as+debt+comes+about%5D%2C+but+not+qua+debitum+%5Bas+debt%5D.+And+his+will+de+debito+determines+of+the+dueness+of+some+events%2C+not+as+eventual+%5Bas+to+the+event%5D%2C+but+as+due.+Or+to+avoid+all+ambiguity%3A+call+it+God%E2%80%99s+will+de+ente+mere+naturali+%5Bconcerning+merely+natural+being%5D+and+his+will+de+debito+morali+%5Bconcerning+moral+debt%5D%2C+or+Legislative+or+Governing.+2.+And+for+the+nature+of+the+distinction%2C+understand+further+that+there+are+two+acts+which+I+call+God%E2%80%99s+will+de+debito%3A+The+first+is+that+immanent+act+of+his+will+by+which+He+strictly+and+properly+wills+what+shall+be+due.+This+also+is+twofold%3A+1.+Productive%2C+or+instituting+dueness%3B+2.+and+approbative%2C+or+taking+complacency+in+duty.+The+former+of+these+I+principally+intend%2C+but+exclude+not+the+latter.+God+does+eternally+will+every+due%2C+but+it+is+not+therefore+eternally+or+from+eternity+due.+For+He+wills+from+eternity+%28to+speak+vulgarly%29+only+that+this+shall+be+due+at+such+a+time+and+by+such+a+means.+I+say+by+such+means%3A+For+though+God%E2%80%99s+will+produce+all+dueness%2C+yet+only+by+means+does+He+produce+it.+That+means+is+the+revelation+of+his+will.+2.+This+revelation+of+God%E2%80%99s+will+de+debito+we+call+his+Law.+This+therefore+is+the+second+thing+which+I+call+God%E2%80%99s+will+de+debito%2C+or+his+Legislative+will%2C+that+is%2C+the+Law+as+it+is+signum+voluntatis+divinae+%5Ba+sign+of+the+divine+will%5D%2C+that+is%2C+formally+as+a+law.+This+I+call+God%E2%80%99s+will+de+debito%2C+only+metonymically%2C+as+it+is+the+sign+of+his+will+before+expressed.+If+the+proper+will+of+God+were+separated+from+this%2C+it+would+then+be+no+producer+of+dueness+or+right+at+all%2C+for+it+would+be+no+law%2C+no+signum%3B+it+would+lose+its+nature+as+abrogated+laws+do.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Universal+Redemption+of+Mankind+by+the+Lord+Jesus+Christ+Stated+%26+Cleared%2C+%E2%80%A6+%28London%3A+Salusbury%2C+1694%29%2C+ch.+2%2C+pp.+28-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdcbe19221d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dcbe19221d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-ceremonial-law/#:~:text=I%20shall%20therefore%20a%20little%20further,its%20nature%20as%20abrogated%20laws%20do&amp;text=I%20shall%20therefore%20a%20little%20further%20explain%20this&amp;text=would%20lose%20its%20nature%20as%20abrogated%20laws%20do" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

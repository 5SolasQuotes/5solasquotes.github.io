<blockquote><p>The real alternative placed before the country is that the Government shall become absolutely neutral, and assuredly you never are entitled on scriptural grounds to put that alternative to statesmen, or to any men.

You may put the alternative, no doubt, of giving money to one class or more class; for the mode of countenancing religion may vary with circumstances, but you never lawfully can put the alternative to nations or individuals, of being entirely neutral and indifferent in regard to the cause of Christ; for “he that is not with Christ is against Him.”

Every man is bound to support the cause of Christ, and to oppose that of antichrist. All statesmen are bound to support the cause of Christ, and we must tell them so. No doubt, there may be different forms in which that duty may be discharged, but the duty itself is unalterable and universal. (Hear, hear.) There cannot therefore be lawfully any such alternative as is alleged. It may be, and I believe it is, a more aggravated sin to endow all than to endow none, but to be indifferent to the cause of Christ or to oppose it are always sins. …

But I say, Suppose you get the matter your own way, and that all these endowments of Protestantism in Ireland are overthrown, how is the Government then to support the truth in Ireland? Suppose you disendow Protestantism in Ireland, what of disestablishing it? Does that mean anything else than simply disowning it practically? (Hear, hear.) And when this is done — and done not because Protestantism is untrue, but because it is in a minority — does it not imply that the Government is to become utterly indifferent in regard to religion? I just ask the question. In these circumstances, how is your Establishment principle, or any defensible form of an Establishment principle, to be carried out in Ireland by the Government of this country? …

Well, I would just ask these gentlemen. If you sweep away the Established Church and the Presbyterian Church [in Ireland], as far as the Government is concerned — if you publicly disown both, and the truth which they maintain — if you treat Protestant truth and Popish falsehood as if they were precisely alike, how are those principles to be developed and manifested in regard to Ireland? (Hear, hear.)

This is a very important practical question, and I think, if clearly answered, it would go farther to make us understand what the principles of our friends are than anything else that has occurred. In the absence of any information of that sort, it seems to me that what they and some amongst us are prepared to maintain is this, that the Government are under an obligation to support neither truth nor falsehood, but to be entirely neutral in regard to these in so far as Ireland is concerned. This is a thoroughly indefensible position, and yet this is your ground, as far as I can understand it; and if this be not your ground, I am very anxious that some one should rise up and clearly explain what your doctrine, and that of your allies, is; for there is an immense amount of ambiguity in the statements that are made on the subject. If this be the ground that is taken, I maintain that it is utterly untenable ground, and in a Christian Church, monstrous.

We are no doubt bound to protest to the uttermost against indiscriminate endowments; and I, for my part, would go the length of saying that it is more impious to endow all than to endow none, and that the greatest calamity that could befall the country is the support of Popery by the Government in Ireland, I repudiate such a result in every shape and form. But, on the other hand, I do not see — I have not been able to see — that the Government of this country, especially looking at it as the Government of the United Kingdom, a Protestant kingdom, of which Ireland is merely a part, are entitled to speak of having no alternative but to endow Popery, or to be neutral, or that we, as a Christian Church, are entitled to tell them that any such alternative is presented to them. Will any man take his Bible, and show me out of that Bible, that there is any such principle in the Word of God, before we go an inch farther in that direction? (Hear, hear.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 7, 8, 9.</span></figcaption>

<blockquote><p>…the pope… can excommunicate a ruler and thereby dissolve all obligations his subjects have to support and obey him, thus overthrowing governments at will. Thomas [of Aquinas] wrote: …if someone commits the sin of unbelief he can be deprived of his right to rule by judicial sentence, just as for other failings… Therefore, as soon as someone falls under a sentence of excommunication for apostasy from the faith, his subjects are ipso facto absolved from his rule and from the oath of fealty by which they were bound to him. (Summa Theologiae, ii-ii, Question 12, in Basic Writings of Thomas Aquinas, Anton C. Pegis, editor. New York: Random House, 1945.)</p></blockquote>

<blockquote><p>The Law of nature, which teacheth men self-preservation, requireth this as a means for that end. whatsoever is needful for our defence, is a duty, it requires and enjoins whatsoever is a means for this end; so that acquaintance with or the exercise of ourselves in the use of arms, or other parts of military exercise, may be enforced from that Commandment which requires men to use all means to preserve life, to defend themselves it were to no end to make a law requiring duty, if to our might we should not use the proper means for our own preservation. Let out a Prince never so great, tread upon a worm, and it will turn; they have that instinct in them to defend themselves.

There are our Rights both as Men, and as Christians, our civil Rights and Liberties as Men and our religious Liberties and Rights as Christians; both which we are to defend with the sword, as far as we are able, or to commit ourselves to God in the way of duty in doing of it. There is such a thing as Liberty and Property given to us, both by the Laws of God &amp; Men when these are invaded, we may defend ourselves. God hath not given great ones in the world that absolute power over men, to devour them at pleasure, as great Fishes do the little ones; he hath set Rulers their bounds &amp; by his Law hath determined peoples liberties and property.

He that rules over men must be just that is should be so, ruling in the fear of God: therefore Kings are commanded to read the Book of the Law because it is a boundary of their authority, as well as of the peoples’ liberty. Naboth’s Vineyard taken away by Ahab in that manner as it was, was revenged by God on Ahab and Jezebel too. If we have that that is our Right and Due, it is not another’s being stronger can make our Right Null and void: therefore that Law that gives us a Right, requires attendance on the work of this day, that is Martial exercise, in order to the defence of our selves by Arms, when the providence of God puts us upon it.</p></blockquote>

%99+liberty.+Naboth%E2%80%99s+Vineyard+taken+away+by+Ahab+in+that+manner+as+it+was%2C+was+revenged+by+God+on+Ahab+and+Jezebel+too.+If+we+have+that+that+is+our+Right+and+Due%2C+it+is+not+another%E2%80%99s+being+stronger+can+make+our+Right+Null+and+void%3A+therefore+that+Law+that+gives+us+a+Right%2C+requires+attendance+on+the+work+of+this+day%2C+that+is+Martial+exercise%2C+in+order+to+the+defence+of+our+selves+by+Arms%2C+when+the+providence+of+God+puts+us+upon+it.%E2%80%9D%0A%0A%E2%80%94+Samuel+Nowell%2C+Abraham+in+arms%3B+or+The+first+religious+general+with+his+army+engaging+in+a+war+for+which+he+had+wisely+prepared%2C+and+by+which%2C+not+only+an+eminent+victory+was+obtained%2C+but+a+blessing+gained+also.+Delivered+in+an+artillery-election-sermon%2C+June%2C+3.+1678%2C+%28Boston+MA%3A+John+Foster%2C+1678%29%2C+pp+9-10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64d85a1f4d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64d85a1f4d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/11/29/samuel-nowell-on-warfare-in-defence-of-our-rights-as-men-and-christians/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-103d5b18c0" data-kw="">
<blockquote><p>2. For since man, by departing from God, reached such a pitch of fury as even to look upon his brother as his enemy, and engaged without fear in every kind of restless conduct, and murder, and avarice; God imposed upon mankind the fear of man, as they did not acknowledge the fear of God, in order that, being subjected to the authority of men, and kept under restraint by their laws, they might attain to some degree of justice, and exercise mutual forbearance through dread of the sword suspended full in their view, as the apostle says: “For he beareth not the sword in vain; for he is the minister of God, the avenger for wrath upon him who does evil.”

And for this reason too, magistrates themselves, having laws as a clothing of righteousness whenever they act in a just and legitimate manner, shall not be called in question for their conduct, nor be liable to punishment. But whatsoever they do to the subversion of justice, iniquitously, and impiously, and illegally, and tyrannically, in these things shall they also perish; for the just judgment of God comes equally upon all, and in no case is defective. Earthly rule, therefore, has been appointed by God for the benefit of nations, and not by the devil, who is never at rest at all, nay, who does not love to see even nations conducting themselves after a quiet manner, so that under the fear of human rule, men may not eat each other up like fishes; but that, by means of the establishment of laws, they may keep down an excess of wickedness among the nations. And considered from this point of view, those who exact tribute from us are “God’s ministers, serving for this very purpose.”

3. As, then, “the powers that be are ordained of God,” it is clear that the devil lied when he said, “These are delivered unto me; and to whomsoever I will, I give them.” For by the law of the same Being as calls men into existence are kings also appointed, adapted for those men who are at the time placed under their government. Some of these [rulers] are given for the correction and the benefit of their subjects, and for the preservation of justice; but others, for the purposes of fear and punishment and rebuke: others, as [the subjects] deserve it, are for deception, disgrace, and pride; while the just judgment of God, as I have observed already, passes equally upon all. The devil, however, as he is the apostate angel, can only go to this length, as he did at the beginning, [namely] to deceive and lead astray the mind of man into disobeying the commandments of God, and gradually to darken the hearts of those who would endeavour to serve him, to the forgetting of the true God, but to the adoration of himself as God.</p></blockquote>

</figure><figure class="quote" id="q-b55edb9a75" data-kw="">
<blockquote><p>Abrogation of the judicial laws is a difficult question. It can neither simply be said to endure since the Mosaic polity was abolished, and yet neither can it be said that all have been abrogated since many laws, whose purpose and aim is perpetual, continue.

Thus, however, it seems to be established: the Christian magistrate is not bound by the judicial law of Moses as far as it pertains to circumstances particular to the people of Israel; that, however, which pertains to the kinds of punishments sanctioned to protect the authority of the Ten Commandments of God, it seems certain that the magistrate of a Christian people is to be bound by these today no less than the people of Israel were in the past. …

Judicial law, to the extent that it was properly accommodated to the Jewish people, does not obligate the magistrate of a Christian people. Nevertheless, insofar as it determines punishments for crimes, it obliges the Christian magistrate no less today than it obliged Jewish ones in the past.</p></blockquote>

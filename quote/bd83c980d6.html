<main class="wrap"><figure class="quote" id="q-bd83c980d6" data-kw="necessity amp">
<blockquote><p>Although all the truths revealed in Scripture are necessary to be believed as divine and infallible, yet they are not all equally necessary and the amplitude and extension of faith must be accurately distinguished here from its necessity. Not everything which belongs to the amplitude of faith must therefore belong to its necessity. All truths are not of the same weight. Some have a greater, others a lesser degree of necessity. For example, some are necessary by the necessity of means; others only by the necessity of precept. Some relate to doctrines strictly so called, others only to rites and ceremonies. One relates to some article or doctrine as to substance (for instance that Christ suffered and died); another to the same considered only with reference to circumstances (for instance, that Christ suffered under Pontius Pilate and was crucified between two thieves). For we might be ignorant of the latter without peril to our salvation. Proof of this from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.14.5</span></figcaption>

</figure><figure class="quote" id="q-c0521c3f2b" data-kw="fundamentals">
<blockquote><p>As in a house that is the foundation which has such a position that the house can neither be erected nor stand without it, so in religion that is the foundation upon which the whole of religion depends and it standing, religion stands; removed, religion falls. It is used in two senses: either simply and personally (applied to Christ the foundation of all salvation upon which the church and religion are built as upon a firm and immovable rock, Mt. 16:18; 1 Pet. 2:6, 7; 1 Cor. 3:11—“for other foundation can no man lay than that is laid, which is Jesus Christ”); or comprehensively and naturally for the fundamental truth which all are required to believe and which is therefore called the foundation of faith. But this may be either widely extended to the first rudiments of the Christian religion (which were taught the catechumens for initiation and are called by the apostle the foundation [themeliou], or the principles [archēs]): such as repentance from dead works, faith toward God, the doctrine of baptisms, the laying on of hands, the resurrection of the dead and eternal judgment (Heb.</p></blockquote>

</figure><figure class="quote" id="q-63853b70b9" data-kw="theologian">
<blockquote><p>Although the human understanding is very dark, yet there still remains in it some rays of natural light and certain first principles, the truth of which is unquestionable: such as, the whole is greater than its part, an effect supposes a cause, to be and not to be at the same time are incompatible (asystatous), etc. If this were not the case, there could be no science, nor art, nor certainty in the nature of things. (2) These first principles are true not only in nature, but also in grace and the mysteries of faith. Faith, so far from destroying, on the contrary borrows them from reason and uses them to strengthen its own doctrines. (3) Although reason and faith are of different classes (the one natural, the other supernatural), they are not however opposed, but hold a certain relation and are subordinate to each other. Reason is perfected by faith and faith supposes reason, upon which to found the mysteries of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.9</span></figcaption>

</figure><figure class="quote" id="q-d9312c1d79" data-kw="necessity scripture">
<blockquote><p>Three things particularly prove the necessity of the Scripture: (1) the preservation of the word; (2) its vindication; (3) its propagation. It was necessary for a written word to be given to the church that the canon of true religious faith might be constant and unmoved; that it might easily be preserved pure and entire against the weakness of memory, the depravity of men and the shortness of life; that it might be more certainly defended from the frauds and corruptions of Satan; that it might more conveniently not only be sent to the absent and widely separated, but also be transmitted to posterity. For by “letters,” as Vives well observes, “all the arts are preserved as in a treasury, so that they can never perish, while on the contrary, tradition by the hand is unhappy” (De disciplinis … de Corruptis Artibus 1 [1636], p. 5). This is a divine and wonderful advantage of letters, as Quintilian says, “that they guard words and deliver them to readers as a sacred trust” (Institutio Oratoria 1.7.31 [Loeb, 1:144–45]). Nor for any other reason are the public laws, statutes and edicts of kings and the decrees of the commonality inscribed upon brass or committed to public tablets, except that this is the most sure method of preserving them uncorrupted and of propagating through many ages the remembrance of those things which it is important for the people to know.</p></blockquote>

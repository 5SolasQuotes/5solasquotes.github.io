<main class="wrap"><figure class="quote" id="q-13e0408f9c" data-kw="">
<blockquote><p>Although the work of redemption was not actually wrought by Christ till after his incarnation, yet the virtue, efficacy, and benefits thereof were communicated unto the elect, in all ages successively from the beginning of the world, in and by those promises, types, and sacrifices, wherein he was revealed, and signified to be the seed of the woman which should bruise the serpent’s head, and the Lamb slain from the beginning of the world, being yesterday and today the same, and forever. (Gen 3:15; Gal 4:4-5; Heb 13:8; Rev 13:8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 8.6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da02e8c88a" data-kw="">
<blockquote><p>4. Newness of being is essential to it [created being], or of its notion… 5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, pt. 2, On Creation, pt. 2, p. 118, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-dc26438617" data-kw="">
<blockquote><p>Creation therefore is the action of God, whereby out of nothing he brought forth Nature, and all things in Nature, both substances and accidents, in and with the substances, and finished them in the space of six days, to his own glory, and salvation of the elect.</p></blockquote>

</figure><figure class="quote" id="q-62d6ab6209" data-kw="">
<blockquote><p>With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-barker.html">William S. Barker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘The Westminster Assembly on the Days of Creation: a Reply to David W. Hall’ in Word to the World (Ross-shire, UK: Christian Focus Publications, 2005), pp. 259-70, pp. 263, 265-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-b3534ad0fd" data-kw="">
<blockquote><p>Creation is the action of God, whereby out of nothing He brought forth nature itself and all things in nature, both substances and accidents, in and with the substances, and finished them in the space of six days, both to his own glory and the salvation of the elect… Or thus, creation is a transient or external action of God, whereby in the beginning He made the world by a mere command out of his own free will in six days’ space to the glory of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 225</span></figcaption>

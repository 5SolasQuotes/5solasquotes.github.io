<main class="wrap"><figure class="quote" id="q-cd2cbc97f4" data-kw="">
<blockquote><p>How do you prove that there is a God?

1. Out of the book of Nature, or the works of God.

2. Out of the book of the Scripture, or the word of God.

The book of Nature, is this universal world, which is so called because of the beauty, furniture, order and use thereof. All which do proclaim the chief-builder thereof to be most wise, most mighty, and most bountiful: but of all the rest man, being a little world, whether you respect his soul and the faculties thereof, or the frame of his body, and the manifold and worthy use of the parts of this frame, doth prove and commend the work-man: as Psal. 19.1. The heavens declare the glory of God, and the firmament sheweth the work of his hands. Day unto day uttereth the same, and night unto night sheweth knowledge. Yea every herb declares that there is a God. Yet this knowledge is very imperfect, and very weak, and no ways available to salvation: which notwithstanding makes men without excuse. Whereupon Tertullian said: First God sent Nature to be our school-dame, purposing afterward to send the word; that so having learned in the school of Nature, we might the more easily believe the word of God. So then as when I see an house, I say there hath bin a Carpenter though I see him not: so when I look upon the frame of this world, I must say, it had a builder, though I behold him not.

Shew me the principal reasons to prove that there is a God.

First, because there is motion in the world. Now nothing can be moved but by some being, which actually is. 2. Because there must be a primary cause, on which all the rest depend. 3. Because all things are directed to an end. Whence it must needs be, that there is some one supreme Spirit, which doth order all things, not only to their special ends, but also to some one sovereign end. Prov. 16.4. The Lord hath made all things for himself. 4. Because it necessarily followeth, that there must be some Summum Bonum, and first Being, which may be the cause of goodness, existence, and perfection in the rest. 5. Because no cause is worse then his effect: now there are creatures which use reason, and a wise order, therefore the cause of these creatures must needs be most wise. 6. Because man’s conscience after sin committed, doth naturally stand in fear of a supreme Judge. 7. Because upon grievous sins (even in this life) there are inflicted grievous punishments. Psa. 37.36.38.11.8. Because all nations, be they never so barbarous, are persuaded that there is a God.</p></blockquote>

<blockquote><p>But, are not the knowledge of God and the principles, like the common sentences, imprinted in the nature of man, even though it is so corrupted?

They obviously are, though they are like the ruins of a magnificent building. Most importantly I say that this [saving] faith does not consist of natural knowledge, but it is necessary to add that which God particularly revealed to the world through the Prophets &amp; Apostles, which flesh and blood could never deduce. This final point must be noted, that in which we find the special difference between faith and natural knowledge, that is, that each believer particularly applies to himself the promise of eternal life, whose testimony the Scriptures call certainty.</p></blockquote>

<blockquote><p>Q. You will say then, But what is that Conversation becoming the Gospel, that is beyond the light of Nature?

First, The light of Nature teaches to worship a God: That many of you do, you worship God: But this is that that becomes the Gospel of Christ, To worship &amp; honour God as a Father, &amp; as the Father of our Lord Jesus Christ; this goes beyond the light of Nature in that particular; not only I am convinced that there is a God, that He is the Creator of Heaven and Earth, and my Creator, and therefore I’ll worship Him; but I do not do that that becomes the Gospel of Christ, till I get my self to this, That I am able through the grace of the Gospel to worship God as a Father reconciled to me in Christ, and as the Father of our Lord Jesus Christ, and so do I come and present all my services unto God: This few of our Civil men do; yet your Civil men will make a profession of the Gospel too, and your Civil men they worship God, but it is in a mere natural way. The God of Heaven and Earth, that made them, is to be worshiped: they can say their old Catechism.

Q. Who made you?

A. God.

Q. Wherefore did he make you?

A. He made me to serve Him &amp;c. I but dost thou (when thou comest to serve and worship the Lord) look upon God as a Father reconciled in Christ, and as the Father of our Lord Jesus Christ? and so dost thou tender up all thy services to God? Thou art not raised to that that becomes the Gospel of Christ, except thou dost thus worship God in this way; that’s that which becomes the Gospel of Christ; and know that all other worship that thou tenderest up to God, merely as God is Creator, God that made thee, and therefore thou must serve him: I say al that worship (if thou goest no further) God rejects it; indeed we are to worship God as a Creator, God would have that; I but, if He hath not that and the other too, and if He have not both, he will not accept of one, for the first is included in the second, but the second is not included in the first.

A man that worships God as a Father, and as the Father of our Lord Jesus Christ, he doth worship God as a Creator too; but a man may worship God as a Creator and not at all be acquainted with Him as a Father, and as the Father of our Lord Jesus, and therefore till the Lord in the Ministry of the Gospel hath been pleased to shine in upon thy soul as a Father, and the Father of our Lord Jesus Christ, and thou comest to worship God thus, or at least this is the endeavour of thy soul that thou mayest worship God in this way, thou art not satisfied in worshiping God after the other way, because he made thee, and thy heart works after this, indeed I have not got this full assurance that he is my Father, but this is that my heart is unsatisfied until I have got it, and I cannot be quiet in any other kind of worshiping God, till I find some ability to tender up all to him as a Father, and as the Father of our Lord Jesus Christ, (I say) till thou comest to this, thou dost not in that particular worship God as becomes the Gospel of Jesus Christ.

And so in the point of Justice, thou dost give every one his own. I but this is beneath that that is required in thy dealing with men according to the Gospel of Christ. If you read the 5. of Mat. there you shall find when Christ comes to preach what he requires, he raises the point of Justice beyond doing as we would be dealt with: saith Christ there, You have heard that it hath been said, Thou shalt love thy neighbour and hate thine enemy. But I say unto you, love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you; this is higher than merely to be just, and for one man not to wrong another; you shall have manie men say, Who is able to say black is mine eye?

I live and no body can say I wrong them; you think this is an excellent Conversation, it’s true, it is good in its kind and it were good if all Professors of Religion could say they live so that no body can charge them for unjust dealings, I but this doth not rise to that height to be the Conversation as becomes the Gospel of Christ; you must come to this height, to love your enemies, and to bless them that curse you, you must do good to them that hate you, and pray for them that despightfully use you and persecute you; Can you find this: this is somewhat like the Gospel of Christ, this is somewhat more than to do no wrong to others.

And to do as we would be done to, we must go higher, we must not only set this as a pattern, I’ll do as I would be done by. No, But I’ll labour to do to another as God hath done to me. This is higher; that’s thus, hath God shewed Himself gracious unto me? I’ll labour to do that good to others as much as I am able even as God hath done to me: You have for that those two Scriptures, Ephes. 4. 31, 32. Let all bitterness, and wrath, and anger, and clamour, and evil speaking be put away from you with all malice, and be ye kind one towards another, tender hearted, forgiving one another. The light of Nature now will justify all this: But mark the conclusion, Even as God for Christs sake hath forgiven you:

Set the example of God before you, what God hath done for you for Christ’s sake, and let that be the great motive; Do not only argue thus, well, I would be forgiven if I had offended; and I would not have another to bear anger and malice against me, and therefore I will not be angry with them nor malign them; this is a low principle: but if I find that this is revealed in the Gospel, that the Lord for Christ’s sake hath forgiven me, and it’s this that quiets my passion, when I feel my corruption rising and stirring against any that hath offended me, when I do but think of Gods mercy in forgiving me for Christ’s sake, this quiets me. I this is somewhat like as becomes the Gospel of Christ, when we walk upon such principles as these are. And so you have it in Col. 3. 13. Forbearing one another, and forgiving one another: If any man have a quarrel against any, even as Christ forgive you, so also do ye.

It is very unbeseeming such as profess the Gospel of Christ to be quarrelsome with their neighbours: Now you shall have some that are of very meek and quiet dispositions naturally, I love to live quiet (say some men;) thus far thou mayest come by the light of Nature not to love to quarrel: But now when any doth cause any quarrel, dost thou labour to quiet the quarrel upon this ground: Even as Christ forgave me: O I have found the Lord Jesus Christ, notwithstanding my wretchedness against Him, and all the wrong I have done Him, He hath forgiven me, and therefore seeing Christ will not take advantage against me as He might, I will not take advantage against another: Is it upon this ground?

And dost thou raise thy Conversation with thy Neighbour in keeping from quarrelsomeness, and contentiousness, dost thou raise it to this height, upon this ground, so to forgive as Christ hath forgiven you? I will not forgive only in this particular, or in this less offence, But as Christ hath forgiven me. We shall still have further occasion to mention these things, in opening the suitableness of our Conversations to the Gospel; that is, for the point of Justice, it must rise higher than that of doing as we would be done by.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q. You will say then, But what is that Conversation becoming the Gospel, that is beyond the light of Nature?

First, The light of Nature teaches to worship a God: That many of you do, you worship God: But this is that that becomes the Gospel of Christ, To worship &amp; honour God as a Father, &amp; as the Father of our Lord Jesus Christ; this goes beyond the light of Nature in that particular; not only I am convinced that there is a God, that He is the Creator of Heaven and Earth, and my Creator, and therefore I’ll worship Him; but I do not do that that becomes the Gospel of Christ, till I get my self to this, That I am able through the grace of the Gospel to worship God as a Father reconciled to me in Christ, and as the Father of our Lord Jesus Christ, and so do I come and present all my services unto God: This few of our Civil men do; yet your Civil men will make a profession of the Gospel too, and your Civil men they worship God, but it is in a mere natural way. The God of Heaven and Earth, that made them, is to be worshiped: they can say their old Catechism.

Q. Who made you?

A. God.

Q. Wherefore did he make you?

A. He made me to serve Him &amp;c. I but dost thou (when thou comest to serve and worship the Lord) look upon God as a Father reconciled in Christ, and as the Father of our Lord Jesus Christ? and so dost thou tender up all thy services to God? Thou art not raised to that that becomes the Gospel of Christ, except thou dost thus worship God in this way; that’s that which becomes the Gospel of Christ; and know that all other worship that thou tenderest up to God, merely as God is Creator, God that made thee, and therefore thou must serve him: I say al that worship (if thou goest no further) God rejects it; indeed we are to worship God as a Creator, God would have that; I but, if He hath not that and the other too, and if He have not both, he will not accept of one, for the first is included in the second, but the second is not included in the first.

A man that worships God as a Father, and as the Father of our Lord Jesus Christ, he doth worship God as a Creator too; but a man may worship God as a Creator and not at all be acquainted with Him as a Father, and as the Father of our Lord Jesus, and therefore till the Lord in the Ministry of the Gospel hath been pleased to shine in upon thy soul as a Father, and the Father of our Lord Jesus Christ, and thou comest to worship God thus, or at least this is the endeavour of thy soul that thou mayest worship God in this way, thou art not satisfied in worshiping God after the other way, because he made thee, and thy heart works after this, indeed I have not got this full assurance that he is my Father, but this is that my heart is unsatisfied until I have got it, and I cannot be quiet in any other kind of worshiping God, till I find some ability to tender up all to him as a Father, and as the Father of our Lord Jesus Christ, (I say) till thou comest to this, thou dost not in that particular worship God as becomes the Gospel of Jesus Christ.

And so in the point of Justice, thou dost give every one his own. I but this is beneath that that is required in thy dealing with men according to the Gospel of Christ. If you read the 5. of Mat. there you shall find when Christ comes to preach what he requires, he raises the point of Justice beyond doing as we would be dealt with: saith Christ there, You have heard that it hath been said, Thou shalt love thy neighbour and hate thine enemy. But I say unto you, love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you; this is higher than merely to be just, and for one man not to wrong another; you shall have manie men say, Who is able to say black is mine eye?

I live and no body can say I wrong them; you think this is an excellent Conversation, it’s true, it is good in its kind and it were good if all Professors of Religion could say they live so that no body can charge them for unjust dealings, I but this doth not rise to that height to be the Conversation as becomes the Gospel of Christ; you must come to this height, to love your enemies, and to bless them that curse you, you must do good to them that hate you, and pray for them that despightfully use you and persecute you; Can you find this: this is somewhat like the Gospel of Christ, this is somewhat more than to do no wrong to others.

And to do as we would be done to, we must go higher, we must not only set this as a pattern, I’ll do as I would be done by. No, But I’ll labour to do to another as God hath done to me. This is higher; that’s thus, hath God shewed Himself gracious unto me? I’ll labour to do that good to others as much as I am able even as God hath done to me: You have for that those two Scriptures, Ephes. 4. 31, 32. Let all bitterness, and wrath, and anger, and clamour, and evil speaking be put away from you with all malice, and be ye kind one towards another, tender hearted, forgiving one another. The light of Nature now will justify all this: But mark the conclusion, Even as God for Christs sake hath forgiven you:

Set the example of God before you, what God hath done for you for Christ’s sake, and let that be the great motive; Do not only argue thus, well, I would be forgiven if I had offended; and I would not have another to bear anger and malice against me, and therefore I will not be angry with them nor malign them; this is a low principle: but if I find that this is revealed in the Gospel, that the Lord for Christ’s sake hath forgiven me, and it’s this that quiets my passion, when I feel my corruption rising and stirring against any that hath offended me, when I do but think of Gods mercy in forgiving me for Christ’s sake, this quiets me. I this is somewhat like as becomes the Gospel of Christ, when we walk upon such principles as these are. And so you have it in Col. 3. 13. Forbearing one another, and forgiving one another: If any man have a quarrel against any, even as Christ forgive you, so also do ye.

It is very unbeseeming such as profess the Gospel of Christ to be quarrelsome with their neighbours: Now you shall have some that are of very meek and quiet dispositions naturally, I love to live quiet (say some men;) thus far thou mayest come by the light of Nature not to love to quarrel: But now when any doth cause any quarrel, dost thou labour to quiet the quarrel upon this ground: Even as Christ forgave me: O I have found the Lord Jesus Christ, notwithstanding my wretchedness against Him, and all the wrong I have done Him, He hath forgiven me, and therefore seeing Christ will not take advantage against me as He might, I will not take advantage against another: Is it upon this ground?

And dost thou raise thy Conversation with thy Neighbour in keeping from quarrelsomeness, and contentiousness, dost thou raise it to this height, upon this ground, so to forgive as Christ hath forgiven you? I will not forgive only in this particular, or in this less offence, But as Christ hath forgiven me. We shall still have further occasion to mention these things, in opening the suitableness of our Conversations to the Gospel; that is, for the point of Justice, it must rise higher than that of doing as we would be done by.”

— Jeremiah Burroughs, Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth, (London: Peter Cole, 1650), pp 35-38.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+You+will+say+then%2C+But+what+is+that+Conversation+becoming+the+Gospel%2C+that+is+beyond+the+light+of+Nature%3F%0A%0AFirst%2C+The+light+of+Nature+teaches+to+worship+a+God%3A+That+many+of+you+do%2C+you+worship+God%3A+But+this+is+that+that+becomes+the+Gospel+of+Christ%2C+To+worship+%26+honour+God+as+a+Father%2C+%26+as+the+Father+of+our+Lord+Jesus+Christ%3B+this+goes+beyond+the+light+of+Nature+in+that+particular%3B+not+only+I+am+convinced+that+there+is+a+God%2C+that+He+is+the+Creator+of+Heaven+and+Earth%2C+and+my+Creator%2C+and+therefore+I%E2%80%99ll+worship+Him%3B+but+I+do+not+do+that+that+becomes+the+Gospel+of+Christ%2C+till+I+get+my+self+to+this%2C+That+I+am+able+through+the+grace+of+the+Gospel+to+worship+God+as+a+Father+reconciled+to+me+in+Christ%2C+and+as+the+Father+of+our+Lord+Jesus+Christ%2C+and+so+do+I+come+and+present+all+my+services+unto+God%3A+This+few+of+our+Civil+men+do%3B+yet+your+Civil+men+will+make+a+profession+of+the+Gospel+too%2C+and+your+Civil+men+they+worship+God%2C+but+it+is+in+a+mere+natural+way.+The+God+of+Heaven+and+Earth%2C+that+made+them%2C+is+to+be+worshiped%3A+they+can+say+their+old+Catechism.%0A%0AQ.+Who+made+you%3F%0A%0AA.+God.%0A%0AQ.+Wherefore+did+he+make+you%3F%0A%0AA.+He+made+me+to+serve+Him+%26c.+I+but+dost+thou+%28when+thou+comest+to+serve+and+worship+the+Lord%29+look+upon+God+as+a+Father+reconciled+in+Christ%2C+and+as+the+Father+of+our+Lord+Jesus+Christ%3F+and+so+dost+thou+tender+up+all+thy+services+to+God%3F+Thou+art+not+raised+to+that+that+becomes+the+Gospel+of+Christ%2C+except+thou+dost+thus+worship+God+in+this+way%3B+that%E2%80%99s+that+which+becomes+the+Gospel+of+Christ%3B+and+know+that+all+other+worship+that+thou+tenderest+up+to+God%2C+merely+as+God+is+Creator%2C+God+that+made+thee%2C+and+therefore+thou+must+serve+him%3A+I+say+al+that+worship+%28if+thou+goest+no+further%29+God+rejects+it%3B+indeed+we+are+to+worship+God+as+a+Creator%2C+God+would+have+that%3B+I+but%2C+if+He+hath+not+that+and+the+other+too%2C+and+if+He+have+not+both%2C+he+will+not+accept+of+one%2C+for+the+first+is+included+in+the+second%2C+but+the+second+is+not+included+in+the+first.%0A%0AA+man+that+worships+God+as+a+Father%2C+and+as+the+Father+of+our+Lord+Jesus+Christ%2C+he+doth+worship+God+as+a+Creator+too%3B+but+a+man+may+worship+God+as+a+Creator+and+not+at+all+be+acquainted+with+Him+as+a+Father%2C+and+as+the+Father+of+our+Lord+Jesus%2C+and+therefore+till+the+Lord+in+the+Ministry+of+the+Gospel+hath+been+pleased+to+shine+in+upon+thy+soul+as+a+Father%2C+and+the+Father+of+our+Lord+Jesus+Christ%2C+and+thou+comest+to+worship+God+thus%2C+or+at+least+this+is+the+endeavour+of+thy+soul+that+thou+mayest+worship+God+in+this+way%2C+thou+art+not+satisfied+in+worshiping+God+after+the+other+way%2C+because+he+made+thee%2C+and+thy+heart+works+after+this%2C+indeed+I+have+not+got+this+full+assurance+that+he+is+my+Father%2C+but+this+is+that+my+heart+is+unsatisfied+until+I+have+got+it%2C+and+I+cannot+be+quiet+in+any+other+kind+of+worshiping+God%2C+till+I+find+some+ability+to+tender+up+all+to+him+as+a+Father%2C+and+as+the+Father+of+our+Lord+Jesus+Christ%2C+%28I+say%29+till+thou+comest+to+this%2C+thou+dost+not+in+that+particular+worship+God+as+becomes+the+Gospel+of+Jesus+Christ.%0A%0AAnd+so+in+the+point+of+Justice%2C+thou+dost+give+every+one+his+own.+I+but+this+is+beneath+that+that+is+required+in+thy+dealing+with+men+according+to+the+Gospel+of+Christ.+If+you+read+the+5.+of+Mat.+there+you+shall+find+when+Christ+comes+to+preach+what+he+requires%2C+he+raises+the+point+of+Justice+beyond+doing+as+we+would+be+dealt+with%3A+saith+Christ+there%2C+You+have+heard+that+it+hath+been+said%2C+Thou+shalt+love+thy+neighbour+and+hate+thine+enemy.+But+I+say+unto+you%2C+love+your+enemies%2C+bless+them+that+curse+you%2C+do+good+to+them+that+hate+you%2C+and+pray+for+them+which+despitefully+use+you%2C+and+persecute+you%3B+this+is+higher+than+merely+to+be+just%2C+and+for+one+man+not+to+wrong+another%3B+you+shall+have+manie+men+say%2C+Who+is+able+to+say+black+is+mine+eye%3F%0A%0AI+live+and+no+body+can+say+I+wrong+them%3B+you+think+this+is+an+excellent+Conversation%2C+it%E2%80%99s+true%2C+it+is+good+in+its+kind+and+it+were+good+if+all+Professors+of+Religion+could+say+they+live+so+that+no+body+can+charge+them+for+unjust+dealings%2C+I+but+this+doth+not+rise+to+that+height+to+be+the+Conversation+as+becomes+the+Gospel+of+Christ%3B+you+must+come+to+this+height%2C+to+love+your+enemies%2C+and+to+bless+them+that+curse+you%2C+you+must+do+good+to+them+that+hate+you%2C+and+pray+for+them+that+despightfully+use+you+and+persecute+you%3B+Can+you+find+this%3A+this+is+somewhat+like+the+Gospel+of+Christ%2C+this+is+somewhat+more+than+to+do+no+wrong+to+others.%0A%0AAnd+to+do+as+we+would+be+done+to%2C+we+must+go+higher%2C+we+must+not+only+set+this+as+a+pattern%2C+I%E2%80%99ll+do+as+I+would+be+done+by.+No%2C+But+I%E2%80%99ll+labour+to+do+to+another+as+God+hath+done+to+me.+This+is+higher%3B+that%E2%80%99s+thus%2C+hath+God+shewed+Himself+gracious+unto+me%3F+I%E2%80%99ll+labour+to+do+that+good+to+others+as+much+as+I+am+able+even+as+God+hath+done+to+me%3A+You+have+for+that+those+two+Scriptures%2C+Ephes.+4.+31%2C+32.+Let+all+bitterness%2C+and+wrath%2C+and+anger%2C+and+clamour%2C+and+evil+speaking+be+put+away+from+you+with+all+malice%2C+and+be+ye+kind+one+towards+another%2C+tender+hearted%2C+forgiving+one+another.+The+light+of+Nature+now+will+justify+all+this%3A+But+mark+the+conclusion%2C+Even+as+God+for+Christs+sake+hath+forgiven+you%3A%0A%0ASet+the+example+of+God+before+you%2C+what+God+hath+done+for+you+for+Christ%E2%80%99s+sake%2C+and+let+that+be+the+great+motive%3B+Do+not+only+argue+thus%2C+well%2C+I+would+be+forgiven+if+I+had+offended%3B+and+I+would+not+have+another+to+bear+anger+and+malice+against+me%2C+and+therefore+I+will+not+be+angry+with+them+nor+malign+them%3B+this+is+a+low+principle%3A+but+if+I+find+that+this+is+revealed+in+the+Gospel%2C+that+the+Lord+for+Christ%E2%80%99s+sake+hath+forgiven+me%2C+and+it%E2%80%99s+this+that+quiets+my+passion%2C+when+I+feel+my+corruption+rising+and+stirring+against+any+that+hath+offended+me%2C+when+I+do+but+think+of+Gods+mercy+in+forgiving+me+for+Christ%E2%80%99s+sake%2C+this+quiets+me.+I+this+is+somewhat+like+as+becomes+the+Gospel+of+Christ%2C+when+we+walk+upon+such+principles+as+these+are.+And+so+you+have+it+in+Col.+3.+13.+Forbearing+one+another%2C+and+forgiving+one+another%3A+If+any+man+have+a+quarrel+against+any%2C+even+as+Christ+forgive+you%2C+so+also+do+ye.%0A%0AIt+is+very+unbeseeming+such+as+profess+the+Gospel+of+Christ+to+be+quarrelsome+with+their+neighbours%3A+Now+you+shall+have+some+that+are+of+very+meek+and+quiet+dispositions+naturally%2C+I+love+to+live+quiet+%28say+some+men%3B%29+thus+far+thou+mayest+come+by+the+light+of+Nature+not+to+love+to+quarrel%3A+But+now+when+any+doth+cause+any+quarrel%2C+dost+thou+labour+to+quiet+the+quarrel+upon+this+ground%3A+Even+as+Christ+forgave+me%3A+O+I+have+found+the+Lord+Jesus+Christ%2C+notwithstanding+my+wretchedness+against+Him%2C+and+all+the+wrong+I+have+done+Him%2C+He+hath+forgiven+me%2C+and+therefore+seeing+Christ+will+not+take+advantage+against+me+as+He+might%2C+I+will+not+take+advantage+against+another%3A+Is+it+upon+this+ground%3F%0A%0AAnd+dost+thou+raise+thy+Conversation+with+thy+Neighbour+in+keeping+from+quarrelsomeness%2C+and+contentiousness%2C+dost+thou+raise+it+to+this+height%2C+upon+this+ground%2C+so+to+forgive+as+Christ+hath+forgiven+you%3F+I+will+not+forgive+only+in+this+particular%2C+or+in+this+less+offence%2C+But+as+Christ+hath+forgiven+me.+We+shall+still+have+further+occasion+to+mention+these+things%2C+in+opening+the+suitableness+of+our+Conversations+to+the+Gospel%3B+that+is%2C+for+the+point+of+Justice%2C+it+must+rise+higher+than+that+of+doing+as+we+would+be+done+by.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel-conversation%3A+wherein+is+shewed%2C+I.+How+the+conversation+of+believers+must+be+above+what+could+be+by+the+light+of+nature.+II.+Beyond+those+that+lived+under+the+law.+III.+And+suitable+to+what+truths+the+Gospel+holds+forth%2C+%28London%3A+Peter+Cole%2C+1650%29%2C+pp+35-38.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37ab241ce4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37ab241ce4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/13/jeremiah-burroughs-gospel-conversation-transcends-the-light-of-nature/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>But the same truth [of theology’s existence] is sufficiently confirmed à posteriori by universal Experience among men, and the Consensus of all peoples admitting some Theology, although often quite corrupt. Although these have naturally strayed in a disgraceful manner from true Theology, yet they have attested that such a Theology is given by their pursuit of the same: but a disposition innate in all to acknowledge and worship the true God is not able to be vain.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-27f900eae4" data-kw="">
<blockquote><p>…Whereby it comes to pass that He, in that He is man… He is able to do all those things which pertain to his office: yea and such things as cannot be performed of any created substance, but only of God Himself, may be done by Him, by the power of his deity, yet his human will always working therewithal evermore by consent and as it were by desire: so that in all the actions of Christ, as He is God, pertaining to our salvation, always his soul in some sort joins itself thereunto by love, by desire, and will: as also in all things which He did as man, the deity was always concurrent, yea even in his death and passion: not that the deity suffered, but that it willed both the passion and death of Christ, and added to his passion and death an infinite power, even to cleanse us of our sins. To conclude, concerning the two natures in Christ, and the union and proprieties of them, we believe whatsoever has been determined in the Nicene, Constantinopolitane, Ephesian, and Calcedonian councils, against Arrius, Apollinaris, Nestorius, and Eutyches: and in the sixth synod against the Monothelites. 13. Two kinds of actions in Christ: and all those things which we read that He did and suffered, were done indeed according to the truth of the matter, and not after a vain show or illusion. Now from the person of Christ, and his natures, and the union of the natures, to pass over peculiarly to his actions and his office: First we believe, that as there are two true natures in Christ, whereof each has had and has her true and essential proprieties, coupled together, even as the natures are also united, but not confounded together: so there are two kinds of actions, which our Lord Jesus Christ is said partly to have performed, and partly will yet perform for our salvation: some whereof proceed from his deity, and some from his humanity: and the same partly have been, and partly are so joined together, and yet distinct that each of their forms (as Leo speaks) always works with communion of the other, the Word, performing those things which are of the Word, and the flesh, those things which pertain to the flesh. Moreover, as those things which Christ did and does by virtue of his divine nature, were true and not feigned deeds, (for He truly reconciled us to his father, he truly forgives sins, and truly sanctifies, and regenerates). So whatsoever we read that He did or suffered for us according to his humanity, we believe that He did and suffered all those things truly and indeed, and not only in a vain show and (as some speak) an appearance only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion… (1599)</cite>, ch. 11, ‘Of Christ the Redeemer’; pp. 68-9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b48546fda" data-kw="">
<blockquote><p>5. Christ, God and man, indeed forgives sins, but in a diverse manner: as He is God, and as He is man. Whereon it also follows, that Christ, God and man (which we also confess) together with the Father and the Holy Ghost, forgives sins: but He does it in one sort, as He is God, and in another, as He is man. For as He is God, He does effect the same properly and of his authority: but as He is man, He does it, and did it in the flesh, as being a fellow-worker with the deity: in his human will consenting to the divine, and pronouncing the words ‘Thy sins are forgiven thee’: as also Leo the First, Epistle 10 [28], ch. 4, so expounds it to Flavianus, saying, each form (namely of God and man) works with communion of the other, that which is proper to itself: as, the Word working that which is proper to the Word, and the flesh performing that which belongs to the flesh. To forgive sins was the proper action of the divine nature: and to say, ‘Thy sins are forgiven thee’, of the human. Thus far he.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion… (1599) | Ch. 27, ‘Of Perpetual Remission of Sins in the Church of Christ’</cite>, pp. 253-4</span></figcaption>

</figure><figure class="quote" id="q-60948dd10c" data-kw="">
<blockquote><p>Of these natures, the necessity, and verity whereof hath been declared, there are divers operations; for there are two natures in Christ, as it were two inward, and effectual beginnings; out of which formally, Actions, and their manners, are deduced: wherefore, as all things in Christ, (his subsisting only excepted,) are two-fold, (or of two sorts) to wit, his Nature, Properties, Will, Knowledge: so are there two-fold operations; some divine, some humane, distinguished by their beginnings, manners of doing, and the particular Actions of each of them. By their beginnings: because, look how many Natures there are; so many formal beginnings of actions there are. By the manners of doing: for every beginning works according to it own manner, and condition: the God-head, after a supernatural, and divine manner: the man-hood after a Natural and Human manner. By particular Actions; for the Word works that, which is of the Word, and the Flesh, that, which is of the Flesh, without any confusion of Natures, in the unity of Person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), ‘Of the Person of Christ’, Part Confirmative, ch. 6</cite>, pp. 152-3</span></figcaption>

</figure><figure class="quote" id="q-346a73a762" data-kw="session right hand dominion">
<blockquote><p>This phrase is used to denote the supreme dignity and sway of Christ. The metaphor is taken from the custom of kings and chiefs, who are accustomed to place on their right hand those to whom they concede the nearest degree to them, both of honor and of power in governing. This phrase is understood of the nearest degree of honor in 1 K. 2:19, where Solomon, about to show his mother special honor, places her on his right hand. And in Ps. 45:9, the wife of the king (i.e., the church) is said to stand upon the right hand of the Messiah (i.e., in the next degree of dignity to him). It is used of dominion or the administration of a kingdom (Mt. 20:21).</p></blockquote>

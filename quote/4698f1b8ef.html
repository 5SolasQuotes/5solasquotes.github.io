<main class="wrap"><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 65 rt col</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-89f7088cea" data-kw="">
<blockquote><p>Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), pp. 171-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-dfe292c970" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book… I find not myself in my understanding convinced thereby of the necessity of lawfulness of conforming unto or complying with an unjust prevailing power, further than I was before persuaded it might be lawful or necessary so to do: viz. paying taxes and submitting to some other things (in themselves not unlawful) by them imposed or required, such as I had a lawful liberty to have done in the same manner, though they had not been so command; and seem to me in the conjuncture of present circumstances prudentially necessary to preserve myself or my neighbor from the injuries of those that would be willing to make use of my non-submission to mine or his ruin. So as it be done with these cautions:

1. Without any violation either of duty to God, or of any other just obligation that lies upon me by oath, law, or otherwise.

2. Only in the case of necessity otherwise not to be avoided.

3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek:] dunamis (to the force), but not acknowledge the [Greek:] exousia (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right title, or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide presume, that the oppressed power, to whom my obedience is justly due, if he perfectly knew the present condition I am in, together with the exigence and necessity of the present case, and of all the circumstances thereof, would give his willing consent to such conformity or compliance. So that upon the whole matter and in short, I conceive I may so far submit to the impositions or comply with the persons of a prevailing usurped power, unjustly commanding things in themselves not unlawful, or make use of that power to protect me from others’ injuries, as I may submit unto, comply with, or make use of an highway thief or robber, when I am fallen into his hands and lie at his mecy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Resolution of Conscience</cite>, (by a learned divine) in Answer to a letter sent with Mr. Ascham’s book, treating how far it may be lawful to submit to an usurped power… (London: 1649), pp. 1-3 GB</span></figcaption>

<blockquote><p>‘It was a very useful companion to every biblical student…’ – Dr. Clarke. The third edition of this work is the most correct: it is beautifully printed. The notes are chiefly extracted from [Matthew] Poole’s Synopsis.” – Thomas Hartwell Horne . . Bibliographies 1800’s Darling, James – Cyclopedia Bibliographica: A Library Manual of Theological and General Literature, vol. 1 (Subjects) (1859) On Romans On Rom. 13 This is perhaps the most exhaustive bibliographical collection up to its day. It includes foreign language titles. Malcom, Howard – ‘Romans’ in ‘Commentators’ in Theological Index: References to the Principal Works in Every Department of Religious Literature, embracing nearly Seventy Thousand Citations, Arranged under Two Thousand Heads (Boston, 1868), pp. 110-11 Malcom was likely an old Princeton grad as he mentioned his indebtedness to the Drs. Alexander and Miller in the ‘Preface’. Malcom was a pastor who worked on this volume for over 40 years. This work includes titles in foreign languages and is more comprehensive than the work of James Darling. The drawback is that there is very limited reference information, which can make finding the works difficult at times. Hurst, John Fletcher – ‘Romans’ in Literature of Theology: A Classified Bibliography of Theological &amp; General Religious Literature (1896), pp. 107-9 Hurst (1834–1903) was an American bishop in the Methodist Episcopal Church, a historian, and the first Chancellor of the American University in Washington, D.C. This work only includes titles in English. “Based on his 1882 work: Biblioteca Theologica [which has a smaller listing]. An extensive classified bibliography of ‘the best and most desirable books in theology and general religious literature published in Great Britain, the United States, and the Dominion of Canada.’</p></blockquote>

<blockquote><p>It is an agreed principle of theological and sociological teaching that Catholic citizens should not vote for leaders who are inimical to Christianity… It is, however, held to be lawful to vote for an unworthy candidate in certain circumstances—for instance, if this is necessary to exclude an even more unsuitable one, or if failure to vote for a particular candidate would involve disproportionate personal loss, or if there is good hope, all things considered, that the election of this candidate may ultimately conduce to the common good… To sum up then: we agree that normally Catholics should not vote for non-Christian candidates. But if it is clear, when account is taken of the circumstances of person and place, that a particular non-Christian candidate is willing to act in accordance with Christian principles, we think that it is not unlawful to vote for him…</p></blockquote>

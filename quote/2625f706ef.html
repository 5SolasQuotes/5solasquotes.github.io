<main class="wrap"><figure class="quote" id="q-2625f706ef" data-kw="">
<blockquote><p>A fallacy of accident is also committed by those who claim that if God were immutable, then He could not be said to have life. For while the living things of our experience do indeed change in various ways (by growing, taking in nutrients, moving about, learning, and so forth), it doesn’t follow that any possible living thing must undergo change. What is essential to a thing’s being alive, at least on the traditional Aristotelian account of life, is that the thing operate in the basis of an internal principle, as opposed to being entirely dependent on external forces. Hence, an animal can be said to be alive insofar as at least much of what it does flows from its own nature, whereas a stone is not alive because it is entirely passive, and can do things (such as breaking a window) only insofar as other things act upon it… Now, as the uncaused cause of all things, God certainly acts in a way which does not require his being acted upon by anything else. Hence, He can certainly be said to have life. Indeed, unlike other living things (all of which to some extent, even if not entirely, require being acted upon by other things, insofar as they need to eat, breathe, and so forth), God acts in a way which is completely independent of anything else. Hence, He can be said to have life in the fullest way possible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ab74cff97" data-kw="">
<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see [Francis] Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If he were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest then that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been. … God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

nline</a></div>
</figure><figure class="quote" id="q-5c958fc60f" data-kw="">
<blockquote><p>Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. … The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 19-20</span></figcaption>

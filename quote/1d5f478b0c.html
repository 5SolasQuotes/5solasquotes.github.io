<main class="wrap"><figure class="quote" id="q-1d5f478b0c" data-kw="">
<blockquote><p>…I will divide the whole course of this question into two parts, treating, first, of the authority and supreme tribunal for interpreting Scripture, with whom it is lodged [that is the Scriptures themselves and the Holy Spirit, ch. 8]; next, of the means to be used in the interpretation of Scripture [ch. 9]. But first we must premise something in the way of prolegomena [chs. 2-3]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1st Controversy, Question 5, ‘Concerning the Interpretation of Scripture’, pp. 402-496 in A Disputation on Holy Scripture, Against the Papists... (1588; Parker Society, 1849), p. 403</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b92934789" data-kw="">
<blockquote><p>Although we allow to individual believers the judgment of private discretion (because &quot;he that is spiritual judgeth all things&quot; [1 Cor. 2:15], and the apostle commands us to &quot;prove all things&quot; [1 Thess. 5:21]), we do not therefore assert in opposition to Peter (2 Pet. 1:20*) that the Scriptures are of private interpretation (idia epilysis). For epilysis here does not mean the interpretation of the Scriptures so much as the origin of the prophetic oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.33</span></figcaption>

</figure><figure class="quote" id="q-c7614cee12" data-kw="">
<blockquote><p>There is a twofold trial of doctrine, private and public. The private trial is that by which every one settles his own faith, when he wholly acquiesces in that doctrine which he knows has come from God. … Public trial refers to the common consent and polity of the Church; for as there is danger lest fanatics should rise up, who may presumptuously boast that they are endued with the Spirit of God, it is a necessary remedy, that the faithful meet together and seek a way by which they may agree in a holy and godly manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>

</figure><figure class="quote" id="q-2850ed89a9" data-kw="">
<blockquote><p>The increasingly rationalistic biblicism of the Socinian movement in its seventeenth- century forms posed an even more intense problem for the Reformed orthodox… the Socinians opposed the balance of revelation and reason advocated by the Reformed and claimed a fundamental biblical basis for their doctrine and repudiated natural theology — at the same time that they argued against the simplicity and infinity of God, denied the Trinity and the two natures of Christ, and proposed an alternative view of the work of Christ. From the Reformed perspective, all of these doctrines appeared to be at the same time the result of a new rationalism and a radically deviant exegesis. On all of these points, the high orthodox developed detailed argumentation: elements of debate not found in the Reformation and early orthodox era theologies, but arguably presented in defense of the same basic body of doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics 2nd</cite>, ed. (Baker Academic, 2003), vol. 1; p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-c75d8d272c" data-kw="">
<blockquote><p>Therefore he declares that the most precise norm, canon, or rule of faith is not the Scripture but the judgment of the church. … In his Hierarchiae ecclesiasticae assertio (Bk. 1, ch. 2), Pighius says that the apostles wrote some things not in order that these writings should rule over our faith and religion but rather that they should be subject to them. … the Holy Scripture is the most certain rule of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Concerning Sacred Scripture</span></figcaption>

<main class="wrap"><figure class="quote" id="q-37920b71b5" data-kw="">
<blockquote><p>…God indeed, in the time of the Jews was the king of Israel in another manner than He was the king of all the nations, and is the king of Christian realms now, and, therefore, the people’s despising of Samuel was a refusing that God should reign over them, because God, in the judges, revealed Himself even in matters of policy, as what should be done to the man that gathered sticks on the Sabbath-day, and the like, as He does not now to kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-74b996f70a" data-kw="">
<blockquote><p>Since we have need of civil laws and the power of punishing, it will be wisest not to contemn those given by Moses; but seriously rather to consider what the meaning of God was in them, what he chiefly required, and how much it might be to the good of every nation, if they would borrow thence their manner of governing the commonwealth; yet freely all things and with the Spirit of Christ. For what Solon or Plato, or Aristotle, what lawyers or Caesars could make better laws than God? And it is no light argument, that many magistrates at this day do not enough acknowledge the Kingdom of Christ, though they would seem most Christian, in that they govern their States by laws so diverse from those of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 5:19, as quoted by John Milton, A Complete Collection of the Historical, Political &amp; Miscellaneous Works of John Milton, vol. 1, p. 394</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d217a63508" data-kw="">
<blockquote><p>Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help to True Happiness, or a Brief &amp; Learned Exposition of the Main &amp; Fundamental Points of Christian Religion</cite>, (London, 1618), pt. 1, question 3, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-25e69cf988" data-kw="">
<blockquote><p>…It is false which he [Thomas Hooker, an Anglican] says, for kneeling in receiving the Communion is in its own nature evil and idolatrous, because religious adoration, before a mere creature, which purposly we set before us in the act of adoring, to have state in the worship, especially if it be an actual image in that act representing Christ to us (such as the bread in the act of receiving), draws us within the compass of co-adoration, or relative worship, as shall be copiously proven afterwards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 2</cite>, ch. 9; p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3</cite>, ch. 2, pp. 27-28</span></figcaption>

</figure><figure class="quote" id="q-f073f8f4b1" data-kw="">
<blockquote><p>Swearing by appeal to God is a most solemn act of worship: but the sign of taking an oath is left free to convenient choice. Abraham‘s servant did it by putting his hand under his thigh: Was this a common law or institution? Others did it otherwise: We do it by laying our hand on the Book and kissing it. These are neither sinful additions or idolatry. The memorial of God’s works and men’s covenants were kept, sometime by pitching stones, sometime by pillars, sometime by set days (as the Feast of Purim), sometime by laying up the ensigns (as Goliah‘s sword, etc.). And all these lawful and no idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, pp. 13-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-f9b50cc58d" data-kw="">
<blockquote><p>Let them [Independents] produce a particular Word for the order of God’s worship, what must be performed first, what second, what third, what fourth, and so of the rest, and that no ordinance nor part of worship may be in another order… let them produce what is required in the Word particularly, as the form of excommunication, or as the form of ordination; let them set down the outward worship and gesture of the external reverence which must be used, and no other way, in the several ordinances of God, as Word, prayer, singing of psalms, reading Scriptures, baptism, Lord’s Supper, excommunication, which if they cannot (as we know they are not able, neither in these nor many other things which may be named) let them then learn that many things in government and discipline have but general rules with equity of practices…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons Against the Independant Government of Particular Congregations… (London, 1641), ‘Reasons Against the Independant Government of Particular Congregations’</cite>, p. 17</span></figcaption>

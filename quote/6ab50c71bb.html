<main class="wrap"><figure class="quote" id="q-6ab50c71bb" data-kw="">
<blockquote><p>Let as many servants as are under the yoke count their own masters worthy of all honour, that the name of God and his doctrine be not blasphemed. And they that have believing masters, let them not despise them, because they are brethren; but rather do them service, because they are faithful and beloved, partakers of the benefit. These things teach and exhort. If any man teach otherwise, and consent not to wholesome words, even the words of our Lord Jesus Christ, and to the doctrine which is according to godliness; He is proud, knowing nothing, but doting about questions and strifes of words, whereof cometh envy, strife, railings, evil surmisings…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Tim., 6:1-4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-b9cc3fe6ec" data-kw="">
<blockquote><p>New School ministers, while often perceived as enemies of confessional subscription, were in fact strong advocates of the principles of 1729. The leaders of the New School asserted that throughout the nineteenth century, the majority of New School members had maintained a solid attachment to the Presbyterian creed. They allowed more theological diversity than their Old School counterparts, but there were confessional boundaries to that latitude which they openly acknowledged. New School Presbyterians were moderate Calvinists who loved the Reformed Tradition but were unwilling to allow the West minster Standards to become the only test of one’s orthodoxy. While viewing itself as generally conservative, the New School also promoted an openness to express traditional Reformed theology in fresh ways.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“New School ministers, while often perceived as enemies of confessional subscription, were in fact strong advocates of the principles of 1729. The leaders of the New School asserted that throughout the nineteenth century, the majority of New School members had maintained a solid attachment to the Presbyterian creed. They allowed more theological diversity than their Old School counterparts, but there were confessional boundaries to that latitude which they openly acknowledged. New School Presbyterians were moderate Calvinists who loved the Reformed Tradition but were unwilling to allow the West minster Standards to become the only test of one’s orthodoxy. While viewing itself as generally conservative, the New School also promoted an openness to express traditional Reformed theology in fresh ways.”

</figure><figure class="quote" id="q-14a00d8b26" data-kw="">
<blockquote><p>Truly we can expect nothing from the Tridentines who serve under Neptune but what is of a watery nature, when the business to be undertaken is the Reformation of the Church. But when persecution is to rage against the innocent, and impious tyranny is to be confirmed by the blood of the godly, they at once blaze into flame.</p></blockquote>

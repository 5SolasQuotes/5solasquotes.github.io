<main class="wrap"><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations on the Whole Bible</cite>, 3rd ed. (1658), on Song 5:2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-335fa336ff" data-kw="">
<blockquote><p>We must ‘make us a new heart and a new spirit.’ This was the matter of a promise, Eze. 11:19. Here it is the matter of a precept. We must do our endeavour, and then God will not be wanting to us to give us his grace. St. Augustine well explains this precept: Deus non jubet impossibilia, sed jubendo monet et facere quod possis et petere quod non possis. ‘God does not enjoin impossibilities, but by his commands admonishes us to do what is in our power and to pray for what is not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ezekiel</cite>, 18, verse 31</span></figcaption>

<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized</cite>, (London: E.M., 1660), Sermon 18, p. 397</span></figcaption>

<blockquote><p>(2) If they would comply with his admonitions, he was ready to make them good to their souls: Behold, I stand at the door and knock, etc., v. 20. Here observe, [1.] Christ is graciously pleased by his Word and Spirit to come to the door of the heart of sinners; He draws near to them in a way of mercy, ready to make them a kind visit. [2.] He finds this door shut against Him; the heart of man is by nature shut up against Christ by ignorance, unbelief, sinful prejudices. [3.] When He finds the heart shut, He does not immediately withdraw, but He waits to be gracious, even till his head be filled with the dew. [4.] He uses all proper means to awaken sinners, and to cause them to open to Him: He calls by his Word, He knocks by the impulses of his Spirit upon their conscience.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“(2) If they would comply with his admonitions, he was ready to make them good to their souls: Behold, I stand at the door and knock, etc., v. 20. Here observe, [1.] Christ is graciously pleased by his Word and Spirit to come to the door of the heart of sinners; He draws near to them in a way of mercy, ready to make them a kind visit. [2.] He finds this door shut against Him; the heart of man is by nature shut up against Christ by ignorance, unbelief, sinful prejudices. [3.] When He finds the heart shut, He does not immediately withdraw, but He waits to be gracious, even till his head be filled with the dew. [4.] He uses all proper means to awaken sinners, and to cause them to open to Him: He calls by his Word, He knocks by the impulses of his Spirit upon their conscience.”

— William Tong, in Matthew Henry’s Commentary on the Whole Bible. Tong (1662-1727) was one of the puritans that finished Henry’s Commentary when died, still on Acts. | Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%282%29+If+they+would+comply+with+his+admonitions%2C+he+was+ready+to+make+them+good+to+their+souls%3A+Behold%2C+I+stand+at+the+door+and+knock%2C+etc.%2C+v.+20.+Here+observe%2C+%5B1.%5D+Christ+is+graciously+pleased+by+his+Word+and+Spirit+to+come+to+the+door+of+the+heart+of+sinners%3B+He+draws+near+to+them+in+a+way+of+mercy%2C+ready+to+make+them+a+kind+visit.+%5B2.%5D+He+finds+this+door+shut+against+Him%3B+the+heart+of+man+is+by+nature+shut+up+against+Christ+by+ignorance%2C+unbelief%2C+sinful+prejudices.+%5B3.%5D+When+He+finds+the+heart+shut%2C+He+does+not+immediately+withdraw%2C+but+He+waits+to+be+gracious%2C+even+till+his+head+be+filled+with+the+dew.+%5B4.%5D+He+uses+all+proper+means+to+awaken+sinners%2C+and+to+cause+them+to+open+to+Him%3A+He+calls+by+his+Word%2C+He+knocks+by+the+impulses+of+his+Spirit+upon+their+conscience.%E2%80%9D%0A%0A%E2%80%94+William+Tong%2C+in+Matthew+Henry%E2%80%99s+Commentary+on+the+Whole+Bible.+Tong+%281662-1727%29+was+one+of+the+puritans+that+finished+Henry%E2%80%99s+Commentary+when+died%2C+still+on+Acts.+%7C+Rev.+3%3A20%2C+%E2%80%9CBehold%2C+I+stand+at+the+door%2C+and+knock%3A+if+any+man+hear+my+voice%2C+and+open+the+door%2C+I+will+come+in+to+him%2C+and+will+sup+with+him%2C+and+he+with+me.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F240af0c0f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/240af0c0f7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=2%29%20If%20they%20would%20comply%20with,of%20his%20Spirit%20

<blockquote><p>In support, however, of this kind of truth [i.e. of things of faith which cannot be known by reason alone], certain probable arguments must be adduced for the practice and help of the faithful, but not for the conviction of our opponents, because the very insufficiency of these arguments would rather confirm them in their error if they thought that we assented to the truth of faith on account of such weak reasonings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1</cite>, ch. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-5f9a0d0635" data-kw="">

</figure><figure class="quote" id="q-d0aee5950c" data-kw="">
<blockquote><p>Another reason can be drawn from the words of Aristotle. For in 2 Metaphysics 1, 5, he shows that those things which excel as true excel as beings, and in 4 Metaphysics 3, 4, 27-28, he shows that there is something supremely true because we see that of two false things one is falser than the other, from which it follows that one is also truer than the other. Now this is by its approximation to that which is simply and supremely true. Therefore, we may further conclude that there is something that is supremely being. And this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1, ch. 13, ‘Arguments in Proof of God’s Existence’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Another reason can be drawn from the words of Aristotle. For in 2 Metaphysics 1, 5, he shows that those things which excel as true excel as beings, and in 4 Metaphysics 3, 4, 27-28, he shows that there is something supremely true because we see that of two false things one is falser than the other, from which it follows that one is also truer than the other. Now this is by its approximation to that which is simply and supremely true. Therefore, we may further conclude that there is something that is supremely being. And this we call God.”

— Aquinas, Summa Contra Gentiles, bk. 1, ch. 13, ‘Arguments in Proof of God’s Existence’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnother+reason+can+be+drawn+from+the+words+of+Aristotle.+For+in+2+Metaphysics+1%2C+5%2C+he+shows+that+those+things+which+excel+as+true+excel+as+beings%2C+and+in+4+Metaphysics+3%2C+4%2C+27-28%2C+he+shows+that+there+is+something+supremely+true+because+we+see+that+of+two+false+things+one+is+falser+than+the+other%2C+from+which+it+follows+that+one+is+also+truer+than+the+other.+Now+this+is+by+its+approximation+to+that+which+is+simply+and+supremely+true.+Therefore%2C+we+may+further+conclude+that+there+is+something+that+is+supremely+being.+And+this+we+call+God.%E2%80%9D%0A%0A%E2%80%94+Aquinas%2C+Summa+Contra+Gentiles%2C+bk.+1%2C+ch.+13%2C+%E2%80%98Arguments+in+Proof+of+God%E2%80%99s+Existence%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd0aee5950c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d0aee5950c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Another%20reason%20can%20be%20drawn%20from,being.%20And%20this%20we%20call%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2a8ade0fe4" data-kw="">
<blockquote><p>And it assuredly exists so truly, that it cannot be conceived not to exist. For it is possible to conceive of a being which cannot be conceived not to exist; and this is greater than one which can be conceived not to exist… There is, then, so truly a being than which nothing greater can be conceived to exist, that it cannot even be conceived not to exist; and this being thou art, O Lord, our God… For, if a mind could conceive of a being better than thee, the creature would rise about the Creator; and this is most absurd. And, indeed, whatever else there is, except thee alone, can be conceived not to exist. To thee alone, therefore, it belongs to exist more truly than all other beings, and hence in a higher degree than all others. For, whatever else exists does not exist so truly, and hence in a less degree it belongs to it to exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon… tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), pp. 1-34</cite>, ch. 3, pp. 8-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“And it assuredly exists so truly, that it cannot be conceived not to exist. For it is possible to conceive of a being which cannot be conceived not to exist; and this is greater than one which can be conceived not to exist… There is, then, so truly a being than which nothing greater can be conceived to exist, that it cannot even be conceived not to exist; and this being thou art, O Lord, our God… For, if a mind could conceive of a being better than thee, the creature would rise about the Creator; and this is most absurd. And, indeed, whatever else there is, except thee alone, can be conceived not to exist. To thee alone, therefore, it belongs to exist more truly than all other beings, and hence in a higher degree than all others. For, whatever else exists does not exist so truly, and hence in a less degree it belongs to it to exist.”

</figure><figure class="quote" id="q-64ef925976" data-kw="">
<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>

</figure><figure class="quote" id="q-16910d1a50" data-kw="">
<blockquote><p>We hold that the Scriptures are most perfect, containing in them all doctrines needful to salvation, whether they concern faith or manners: and therefore we acknowledge no such traditions beside the written word, which shall be necessary to salvation; so as he which believe them not, cannot be saved.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We hold that the Scriptures are most perfect, containing in them all doctrines needful to salvation, whether they concern faith or manners: and therefore we acknowledge no such traditions beside the written word, which shall be necessary to salvation; so as he which believe them not, cannot be saved.”

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

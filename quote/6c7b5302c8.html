<blockquote><p>…for you lay down as an undeniable principle, and the basis of your whole doctrine of independent government that there are no visible Churches in the world but a congregation meeting in one place to worship God, which I have demonstrated to be most false… so, though a congregation may only be actually seen when it is convened within the four angles of a material house, yet all the congregations on earth make one visible Church, and have some visible and audible acts of external government common to all, as that all pray, praise, fast, mourn, rejoice, one with another; and are to rebuke, exhort, comfort one another and to censure one another, so far as is possible, and of right and by law meet in one council, and so by Christ’s institution are that way visible, that a single congegation is visible which meets in one house, though many be absent de facto, through sickness, callings, imprisonment and some through sinful neglect;</p></blockquote>

</figure><figure class="quote" id="q-6c67a959d7" data-kw="">
<blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, ([Hempstead] 1573), ‘To the next section contained in the 77th, 78th and a piece of the 79th page’, pp. 138-39</span></figcaption>

</figure><figure class="quote" id="q-2d6dcbbc1b" data-kw="">
<blockquote><p>We reject therefore these opposite opinions following… 2. That a particular visible Church is by the Word of God limited to such bounds as that of necessity, [that] they may be ordinarily contained and ought to meet in one place for performing the public worship of God with mutual edification. For as we have showed that the consitution of such a church, as by reason of their multitude or some other cause, cannot ordinarily meet in one place, does well agree with the Word of God and apostolical institution. For the essence and lawful constitution of a church depends not on the outward circumstance of place, but on a due profession of faith, and bond of holy communion. For as [William] Ames says, ‘that same in profession does constitute a Church-visible, which in reality and its internal nature constitutes the Church-mystical, that is, faith.’ Marrow of Theology, bk. 1, ch. 32, thesis 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willhelm-apollonius.html">Willhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 41-42 of ch. 3, ‘Of an Institute Visible Church’ in A Consideration of Certaine Controversies at this Time Agitated in the Kingdome of England, Concerning the Government of the Church of God (1645) Apollonius was a Dutch presbyterian, who is arguing against the English Independents.</span></figcaption>

<blockquote><p>1. Our [Independent] Brethren say [that] it is… another thing to say [as the presbyterians] that it was impossible that they [the Christians in Jerusalem in Acts] could be one congregation and meet in one place… [Rutherford’s] Answer: …now the question then is… whether or no[t] was the Church at Jerusalem of such a competent number, only as that they could meet not only occasionally to hear a sermon, but in an ordinary Church-meeting, to hear the Word and communicate in the breaking of bread and seals of the Covenant; and though the want [lack] of a capacious house be also an extrinsic impediment why they could not meet… but it cannot be said that they wanted a capacious house for the ordinary meeting of a congregation, the ordinary and genuine use whereof is to be edified by the Word and sacraments; and that an ordinary house could contain such a number of thousands and multitudes as can be edified in a congregational way is denied.</p></blockquote>

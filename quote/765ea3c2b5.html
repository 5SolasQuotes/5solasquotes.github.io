<main class="wrap"><figure class="quote" id="q-765ea3c2b5" data-kw="">
<blockquote><p>…the Rejoinder [of an opponent] brings abundance of instances [for human ceremonies in worship though they had been idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which are a form of natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>

<blockquote><p>Whether both the symbols of bread and wine are to be administered? It is affirmed. Whether usual and truly ordinary bread [is to be used]? It is affirmed. … What in place of wine ought to be administered where wine may not be had? What is analogous. Of what kind [is to be administered to] those that abstain from the supper? The same [as the previous answer]. Whether water ought to be mixed with the wine? It is denied.</p></blockquote>

</figure><figure class="quote" id="q-0ca78b48f6" data-kw="">
<blockquote><p>The very many questions that the [Medieval] Scholastics usually raise on this point are foolish ones: whether it is permitted to use for baptism anything other than every-day water, or whether it is permitted to use lye [a liquor made from ashes of wood], urine, boiled or distilled water, or also wine, vinegar, or even sand or mud. For as they rashly identify many materials on the assumption that baptism is absolutely necessary, so we read that Christ and the apostles consecrated and used for this sacrament nothing other than every-day water, and therefore, and therefore since these materials lack any commandment or promise, they cannot be used in faith. Accordingly we see that also John preached in Aenon because there was much water there (John 3:23), and that Philip did not baptize the already believing Ethiopian until they came to a place where there was water (Acts 8:36). And since there is obviously nothing more common than water (so that it has even become a proverb), instances of that sort can arise very rarely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 2, Disputation 44, ‘On the Sacrament of Baptism’, section 17, p. 145</span></figcaption>

</figure><figure class="quote" id="q-a531f12cdc" data-kw="">
<blockquote><p>There is nothing accidental in the worship of God. Every thing that belongs to it, is part of it. Some things are of more weight, use and importance than others (Mt. 23:27), but all things duly belonging to it, are parts of it, or of its subsistence; outward circumstances are natural and occasional, no accidental parts of worship.</p></blockquote>

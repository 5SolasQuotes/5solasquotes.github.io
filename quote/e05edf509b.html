<main class="wrap"><figure class="quote" id="q-e05edf509b" data-kw="">
<blockquote><p>Even in those who have submitted to the righteousness of God, and put on Christ in sincerity, this spirit of pride and independency will still exert itself. It will strive in various ways to keep them from simply relying, as altogether guilty, on him, who is made of God unto us righteousness: and it is not without the greatest difficulty that they are brought, in the face of sin and guilt, to rejoice wholly in the Lord their righteousness.

When led to see their own righteousness as filthy rags, and driven from placing any confidence in the flesh,–in their own doings,—they are still anxious to possess something in themselves, on which to depend and build their hopes of acceptance with God; they will be tempted to look to the work of the Spirit in the heart, and make it the foundation, which can never be anything but the superstructure.

Christ, in his obedience and death, is the only sure foundation for sinners, as to pardon and acceptance with God. “Other foundation can no man lay , than that which is laid, which is Christ Jesus.” The holiest saint stands in equal need of it, with the most profligate sinner; and to eternity it must be the alone stay and support of the spirits of just men made perfect. The building on this foundation is holiness and obedience. But if care be not taken, the natural pride of man will place the superstructure in the room of the foundation, or at least will attempt to put partly as the foundation some of those materials which are fit only for the construction of the building.

‘Thus known holiness is apt to degenerate into self-righteousness; and what God gives for sanctification we are in danger of applying for justification.’ [John Owen] We are such Pharisees by nature, that we know not how to feel grace, and at the same time, believe, as if we had none, – to rest simply on Christ’s righteousness, without the addition of anything in us, either of out ward performances or of inward grace; but we are still found mixing something of our own with the foundation; if we lay and fix it, it must be with some cement of our own graces, duties or endeavours.

But the attempt is utterly fruitless. These things are wholly distinct in themselves, and must be distinctly managed by the soul in its dealings with God. The confounding of them by pride will only dishonour the grace of God, disturb our peace, and weaken our strength for obedience, as well as keep us from that humble posture which at all times becometh us as sinners. This principle of self-righteousness must be mortified, before we can walk humbly with God, and before we can be brought from every thing without or within us, to rest simply for favour and acceptance with God, on Him in whom the Father is well pleased.

Not only is the foundation laid in mere grace, but the top-stone will be brought forth with shouting, “Grace, grace!” The Lord alone must and shall be exalted; and we shall be brought to count all things but loss and dung for the excellency of the knowledge of Christ. Not only shall nothing be exalted for our justification before God besides Him; but nothing shall be exalted with Him; for “the Lord alone shall be exalted in that day.”

To correct this self-righteous spirit, the Lord often plunges his own people into the ditch, and causes their own clothes to abhor them, when, it may be, they have washed themselves in snow-water, and thought their hands clean. He takes off the restraint from some one or another of their corruptions, suffers the world and the devil, with their temptations to assail them, till feeling still more their sinfulness and misery, they abhor themselves and repent in dust and ashes, and are more frequent and earnest in their applications to his blood which cleanseth from all sin, and are brought to exalt “the Lord alone” in their hearts, and to rejoice in “the Lord their righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Pride in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>

<blockquote><p>V. Faith is the alone instrument of the sinner’s justification. That we are justified by faith is so frequently and expressly declared in the Scriptures, that no one who professes to receive the Word of God as the rule of his faith can venture to deny it. There are very different opinions, however, in regard to the office of faith in the justification of a sinner. Some say that a sinner is justified by faith, as it is an act performed by him; as if faith came in the room of perfect obedience, required by the law. This we have already disproved; and “it is well known,” says Witsius, “that the Reformed Churches condemned Arminius and his followers for saying that faith comes to be considered, in the matter of justification, as a work or act of ours.</p></blockquote>

</figure><figure class="quote" id="q-6876250b9b" data-kw="">
<blockquote><p>Hence, it is also manifest that if any good quality or work of ours were made the condition of our justification or title to eternal life, this would turn the covenant of grace exhibited in the gospel into a covenant of works. The covenant of grace revealed and offered to sinners in the gospel is the only covenant according to which a sinner can be justified and entitled to life eternal. It is absolutely impossible that he can be justified according to the broken covenant of works. But were any graces, acts, or works of his the proper conditions of his justification, the covenant of grace would be as much a covenant of works as ever the covenant made with Adam was. The condition of Adam’s covenant was perfect obedience, and according to this imaginary law of easier terms, the conditions of the covenant of grace are sincere faith and sincere obedience.</p></blockquote>

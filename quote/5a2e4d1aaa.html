<main class="wrap"><figure class="quote" id="q-5a2e4d1aaa" data-kw="">
<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23</cite>, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3767a9a094" data-kw="">
<blockquote><p>…there were no oblations [in the OT, such as free-will offerings] left wholly to the pleasure of men, for though the particulars were not, nor could not be determined by a distinct rule in general, yet they were determined by the circumstances, as our divines are wont to answer the Papists about their vows, counsels, superarrogations: ‘Not by a general law, but by concurrence of circumstances.’ So Dt. 16:10, Moses shows that the freest offerings were to be according as God had blessed them, from whence it follows it had been sin for any Israelite whom God had plentifully blessed to offer a pair of pigeons instead of a bullock, or two, upon his own mere pleasure:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship (Amsterdam: Thorp, 1633), Manuduction, ch. 12, section 2</cite>, pp. 152-53</span></figcaption>

</figure><figure class="quote" id="q-3dca8c4bdb" data-kw="">
<blockquote><p>4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1646), Question 23</cite>, pp. 106-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-dda84bdd5e" data-kw="">
<blockquote><p>4. Let it be remembered that those things we call morally good, [are those] which agree to right reason: those morally evill, which disagree from right reason: and those indifferent, which include nothing belonging to the order of reason, and so are neither consonant unto nor dissonant from the same. [The following shows that no rational action, and hence thing commanded, is simply indifferent, but must be good or bad to some degree, and hence to be done or not done; and if it is bad in any degree, it cannot be absolutely required.] 5. When we speak of the indifferency of an individual action, it may be conceived two ways, either absolute et sine respectu ad aliud [absolute and without respect to another], or, comparate et cum respectu ad aliud [comparatively and with respect to another]. In the free-will offrings, if so be a man offered according as God had blessed and prospered his estate, it was indifferent to offer either a bullock or a sheep, or a goat; but if he choosed to offer any of them, his action of offering could not be indifferent, but either good or evil. When we speak of the indifferency of an action comparate [comparatively], the sense is only this, that it is neither better not worse than another action, and that there is no reason to make us choose to do it more than another thing. But when we speak of the indifferency of an action, considered absolutely and by itself, the simple meaning is whether it be either good or evil, and whether the doing of the same must needs be either sin or evil doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | pt. 4, ch. 3</cite>, p. 8</span></figcaption>

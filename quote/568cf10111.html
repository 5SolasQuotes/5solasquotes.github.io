<main class="wrap"><figure class="quote" id="q-568cf10111" data-kw="">
<blockquote><p>The Law holdeth forth a perfect righteousness, and will not admit of any other; but the Gospel, that condescends, and brings pardon through Christ. And this is the main difference, and in which they can never be made one. Now the Papists, Arminian, Socinian, and others do overthrow this grand and main difference holding justification by works under some notion, or other: whereas the Apostle maketh an immediate opposition, If of faith, then not of works. The Apostle doth not distinguish of works of nature, and works of grace, or of works of grace perfect imperfect: but speaketh absolutely, &amp; so doth also exclude that subtle opinion, of making faith to justify as a work; for the Apostle, making an opposition between faith and works, must necessarily take faith under such a notion, as cannot be a work. And this truth is that which is the pillar of the Church of God, and that which differenceth us from Jews, Turks, Papists, and many Hereticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 258.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-745348e364" data-kw="">
<blockquote><p>I. They bring that place of Saint John, Chapter 3. Verse 16. Where God is said to have so loved the world, that he gave his Son: which place we have already taught, doth hurt Arminius; and that the sending of the Son is in the following words, restrained to the believers alone. Whence it is manifest, that Christ was not sent, but to save them who were to believe.

I might say that the world is here taken for the faithful alone; as, John 6. 33 and I Tim. 3.16 and Heb. 2.5. But although we grant, that by the world all mankind are contained in the whole, yet it will not thence follow, that Christ purchased Salvation for all, and particular men, doth abundantly testify, that mankind is loved by God.

II. And it is worth the labour to know what meaning the Arminians apply to Christ, and what according to the Arminians is the sense of these Words of Christ. God so loved the world that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life.

According to the Doctrine of Arminius, this must be the sense of these words; God so loved all mankind, with a love wherewith he hath not willed their Salvation that he decreed to send his Son, before he thought of saving man, to purchase for himself the power of saving man, and afterward he decreed to give every man power of believing, if he himself would, that so he might have eternal life. A monster of Doctrine and a new Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 29.1-2, p. 215.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

sies+of+These+Times+%28Formerly+Handled+in+the+Low-Countries%29+Concerning+the+Doctrine+of+Providence%2C+of+Predestination%2C+of+the+Death+of+Christ%2C+of+Nature+and+Grace%2C+%26c%2C+%281619%3B+London%3A+Nathanael+Newbery%2C+1635%29%2C+29.1-2%2C+p.+215.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F745348e364.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/745348e364.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/16/pierre-du-moulin-on-arminianism-and-john-316/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Reader,

THERE are two rotten pillars on which the fabric of late Arminianism (an egg of the old Pelagianism, which we had well hoped had been long since chilled, but is sit upon and brooded by the wanton wits of our degenerate and apostate spirits) doth principally stand.

The one is, That God loveth all alike, Cain as well as Abel, Judas as the rest of the apostles.

The other is, That God giveth (nay is bound, “ex debito,” so to do) both Christ, the great gift of his eternal love, for all alike to work out their redemption, and “vires credendi,” power to believe in Christ to all alike to whom he gives the gospel; whereby that redemption may effectually be applied for their salvation, if they please to make right use of that which is so put into their power.

The former destroys the free and special grace of God, by making it universal; the latter gives cause to man of glorying in himself rather than in God, — God concurring no farther to the salvation of a believer than a reprobate. Christ died for both alike; — God giving power of accepting Christ to both alike, men themselves determining the whole matter by their free-will; Christ making both savable, themselves make them to be saved.

This cursed doctrine of theirs crosseth the main drift of the holy Scripture; which is to abase and pull down the pride of man, to make him even to despair of himself, and to advance and set up the glory of God’s free grace from the beginning to the end of man’s salvation. His hand hath laid the foundation of his spiritual house; his hand shall also finish it.

The reverend and learned author of this book hath received strength from God (like another Samson) to pull down this rotten house upon the head of those Philistines who would uphold it. Read it diligently, and I doubt not but you will say with me, there is such variety of choice matter running through every vein of each discourse here handled, and carried along with such strength of sound and deep judgment, and with such life and power of a heavenly spirit, and all expressed in such pithy and pregnant words of wisdom, that you will both delight in the reading and praise God for the writer. That both he and it may be more and more profitable shall be my hearty prayers. — The unworthiest of the ministers of the gospel,

Stanley Gower.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-098640a508" data-kw="">
<blockquote><p>First, They [Remonstrant Arminians] affirm that God is said properly to expect and desire divers things which yet never come to pass. “We grant,” saith Corvinus, “that there are desires in God that never are fulfilled.” Now, surely, to desire what one is sure will never come to pass is not an act regulated by wisdom or counsel; and, therefore, they must grant that before he did not know but perhaps so it might be.

“God wisheth and desireth some good things, which yet come not to pass,” say they, in their Confession; whence one of these two things must needs follow, — either, first, that there is a great deal of imperfection in his nature, to desire and expect what he knows shall never come to pass; or else he did not know but it might, which overthrows his prescience. Yea, and say they expressly, “That the hope and expectation of God is deceived by man;” and confess, “that the strength of their strongest argument lies in this, that God hoped and expected obedience from Israel.”

Secondly, That he complaineth that his hope is deluded, which, being taken properly, and as they urge it, cannot consist with his eternal prescience; for they disesteem the usual answer of divines, that hope, expectation, and such like passions, which include in them any imperfection, are ascribed unto God per ἀνθρωποπάθειαν, — in regard of that analogy his actions hold with such of ours as we perform having those passions.</p></blockquote>

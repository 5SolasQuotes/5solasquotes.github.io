<main class="wrap"><figure class="quote" id="q-7b9e3ff6fa" data-kw="">
<blockquote><p>In this commandment there are properly said to be two parts—the one natural, the other moral [positive]; the one the genus, the other the species. Of the former it is said, that the natural part or genus is perpetual, and cannot be abrogated, as being a command concerning the maintenance of the public ministry, so that on some one day the people should be taught, and divinely appointed ceremonies handled. But the species, which bears respect to the seventh day in particular, is abrogated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in Paul Barth, ‘Natural Law &amp; Divine Positive Law’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1de98177b2" data-kw="">
<blockquote><p>43. There are, however, exceptions. First, all those works are permitted which are part of honorable conduct. At all times we ought to live and act honestly and decently, and especially on the day dedicated to divine worship. All things which look simply to this are clearly allowed. Second, those things are permitted which are imposed upon us by special necessity, Matt. 12:11. We should eliminate all those things which men make or pretend to make necessary. But there are still those which in the providence of God are unexpected, necessary, and unavoidable, e.g., when a necessity allowed by the Scripture is present as a sufficient cause for doing ordinary work. Third, all work is permitted which directly affects the worship and glory of God, Matt. 12:5; John 5:8,9. For such work which of its own nature is servile passes into the nature of a holy work and is not properly our work but God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 2, ch. 15, ‘The Time of Worship’, section 43, p. 299</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-2fdd3db89d" data-kw="">
<blockquote><p>So also no bodily sports, recreations and pleasures are to be tolerated or used merely to cherish the flesh, to refresh the body, and to procure bodily strength, but only such as are in very deed needful in themselves, and used and intended by God’s people with this purpose, and to this end, that they may with more ability, alacrity, and cheerfulness do the holy works and perform the holy duties of God’s worship and service which are proper to the Lord’s holy day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (1638), ch. 21 Westminster divine, p. 156</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-eb6a4c61db" data-kw="">
<blockquote><p>Section 3, That on the Lord’s Day we must abstain from carnal recreations… we ought to… feed and cherish it with vain sports and worldly recreations… To them that are wearied with labour, the rest of the Lord’s Day is the best and fittest recreation for the refreshing of their bodies; and if they be spiritually-minded, the exercises of the Sabbath before spoken of, are the best recreations for the cheering of the heart and mind. For who can reasonably think when a man is tired with the week’s labour, that… should recreate a man more, than an holy and religious rest, hearing the Word, singing of Psalms, holy conferences, and such like…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, … (London: Kingstone, 1622), ch. 39, sections 2 &amp; 3, p. 385</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-08ee15b796" data-kw="">
<blockquote><p>…let our rest and confidence be only in Christ, and to such as take Him for their rest, his work is but recreation, and so indeed we should esteem it in a spiritual sense; not looking upon it as a sour task, or a rigid exaction, but calling the Sabbath a delight, we should keep it accordingly, even the whole day, with the whole man, as a day of delights to the Lord, being transported beyond flesh and the world, and having our conversation in heaven, as much as is possible for creatures clothed with flesh.</p></blockquote>

<blockquote><p>Doct. That Christ is set forth in the gospel, as having all men’s sins laid upon him. The word carrieth it in such a general way, that none is excepted, and there are very many other places to confirm it, where Christ is said to reconcile the world: 2 Cor. 5:19, ‘God was in Christ, reconciling the world to himself;’ and to ‘taste death for every man,’ Heb. 2:9; and to ‘die for all.’ It is good to mark that: 2 Cor. 5:14, ‘If one died for all.’ I shall come to the reasons why Christ is proposed so generally.

1. Because all men in some sort have benefit by him. So far Christ suffered his Father’s wrath that was due to all men’s sins, that in a large sense they have benefit by him. All the common mercies we enjoy we have by virtue of Christ’s death. You know how the threatening ran, ‘In the day thou eatest thereof, thou shalt die,’ Gen. 2:17; nay, it is ‘surely die.’ And all mankind might have been lost; but yet you see the absolute accomplishment of the sentence, even to wicked men, is referred to the day of judgment. The worst, at least, enjoy a reprieve by Christ.

In this sense it is said, 1 Tim. 4:10, ‘We trust in the living God, who is the Saviour of all men, especially of them that believe.’ Such as is spoken of, Ps. 36:6, ‘O Lord, thou preservest man and beast;’ by a common salvation and preservation. And the word σωτὴρ which is usually applied to Christ as Mediator, is used there to hint that it cometh by Christ; though it be a common mercy, it is from him. Thus it is said, Eph. 1:10, ‘That in the dispensation of the fulness of time he might gather together in one all, things in Christ, both which are in heaven, and which are on earth, even in him.’

Some understand it of collecting the scattered parts of the world, and renewing the creature, which, had it not been for Christ, would have been lost. As an orator collects the heads of a discourse, that nothing be lost, and bringeth it into one sum. So the heathens, all their mercies come to them swimming in the blood of Christ; so. the word, ordinances, covenant, and outward graces to the church. Thus he suffered for the sins of the whole world, that the whole should enjoy these common favours and blessings by him.

2. Because there is a sufficiency in the merits of Christ for all, so that if it had pleased God to give Christ to all mankind, his justice had been sufficiently satisfied. For there is no defect in the Redeemer, and therefore there are so many general expressions in scripture to set out the value of Christ’s sacrifice; so that if there were ten thousand times more sins committed than there are, here is enough to expiate them all, the person that suffered being so eminent, and the sufferings so great and infinite. Those that perish do not perish out of any defect or insufficiency in the merit of Christ, as if enough were not done to save them; but out of their own fault, because they did not believe it.

Thus it is said, 1 Cor. 15:22, ‘For as in Adam all die, so in Christ shall all be made alive;’ that is, as there was a sufficiency in Adam, the first common person, to ruin all his posterity, so there was a sufficiency in Christ to save all that Adam ruined; for it must needs be understood so, for take it literally and it is against all common experience. Many know not Christ, many hate him and will not come unto him: “Ye will not come unto me, that ye may have life;’ Rom. 5:18, ‘Therefore, as by the offence of one judgment came upon all to condemnation; even so by the righteousness of one the free gift came upon all men to justification of life.’ The text proveth nothing but that there was as much sufficiency in Christ to justify, as there was in Adam to condemn. That we may not have too low and undervaluing thoughts of Christ’s sufferings, the scripture speaks thus generally: there is enough for me and thee, and all the world. It is a great injury done to Christ to lessen and extenuate him beneath Adam, as if he were not as able to recover as the other to ruin us.

3. Therefore it is expressed thus generally, that all conditions of men might be included. God would not have any enclosure of his mercy within the bounds of any nation, persons, and conditions of men, that he might take off all outward exceptions, and comprise every believer, of what condition and rank soever; and therefore he expresseth himself promiscuously to all of every state, every nation, every order. It is the nature of man to confine privileges to their own nation and order. We would be singular and shine alone, and have none share with us; envy, I say, grudgeth at the commonest mercies. We see in common things nothing is so welcome to us as that which we enjoy alone. The Romans would be the only civil nation, all else were barbarians. The Romish clergy would have all learning and knowledge confined within their function; and the Jews could not endure to hear of a general salvation for other nations.

It was the harshest note that could be sounded in their ears, that Christ died for all. It is much urged by the apostle, because of the rage of the Jews, for the enlargement of the pale of God’s church. Therefore I conceive the apostle did inculcate, and so largely insist upon it, to meet with this perverseness of the Jews, as that which they would never hear of. In this sense it is said, Heb. 2:9, he ‘tasted death for every man;’ and so 1 John 2:2, ‘And he is the propitiation for our sins, and not for ours only, but also for the sins of the whole world;’ that is, not only for us Jews, but for all the world, even of all places, orders, and ranks. God would not have the creatures envy it to any man, he proposeth it so generally to take away that Jewish indignation against the Gentiles. Therefore the apostles do so plentifully abound in these expressions.

4. That no man might accuse God as if he had not made sufficient provision for, his soul. Men are apt to transfer their guilt; though they will not charge Christ with it in a way of faith, they will charge God with it in a way of censure; as Prov. 19:3, ‘The foolishness of man perverteth his way, and his heart fretteth against the Lord.’ It is their own folly and unbelief, and we are apt to impute it to God, as if he did not intend Christ to us. Now there would be more occasion offered, if the Lord should have pointed out by name those to whom he intended Christ. God keepeth it secret what he will do with men, that he may provoke them to endeavours after duty, leaving themselves to his good pleasure.

No man can plead now, as an excuse for his negligence, that God left him out; it is we leave out ourselves; and therefore the proposal and offer of Christ is general. God hath expressed enough of his will to show man his duty, though not enough of his will to tell man his pleasure and secret intention. Now the will of God concerning any particular person is hidden. Men would fain excuse themselves of duty by prying into God’s secrets. God giveth a check to such curious impudence, by making the proposal and offer of Christ general, though his intentions to give Christ may be particular; yet we must not meddle with that. Foolish curiosity proceeds from an innate desire in the creature to charge God with all its miscarriages: Deut. 29:29, ‘Secret things belong unto the Lord, but those things which are revealed belong to us, and our children for ever.’ The proposal of Christ in the gospel, that is a revealed thing, and it belongeth to the creatures. God would have it carried so as rather typing out duty to them than revealing his own purposes; he would not give the creature such an occasion to murmur.

5. To denote the multitude that should come into Christ, especially in the latter times; they are as good as a whole world: he ‘so loved the world,’ John 3:16. It is understood by many of mundus credentium; they were but a world when Christ saved them. God’s elect, compared with the wicked world, are but a little flock by themselves, but they are accounted in the scripture as innumerable: Rev. 7:9, ‘I beheld, and lo, a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, stood before the throne, and before the Lamb, clothed with white robes, and palms in their hands.’ Mark, it is a multitude which none can number; the sheep of Christ’s flock are so many that it is innumerable: in a sort especially, there shall be a great increase in the last times. And thus you may expound that place: Heb. 2:9, ‘He tasted death for every man.’

In the next verse it is so intended, ‘in bringing many sons unto glory.’ So Ps. 2:8, ‘Ask of me, and I will give thee the heathen for an inheritance, and the uttermost parts of the earth for thy possession.’ The gospel shall then be spread far and near. God hath given Christ to have and to hold all the world: Heb. 1:3, ‘Whom he hath appointed heir of all things.’ And it is said in the 10th verse of this Isa. 53, that ‘the pleasure of the Lord shall prosper in his hands.’ Therefore the scripture speaketh this generally, to comprise the vast multitude that should embrace the doctrine of Christ.

6. To denote the oneness, or the one way by which all are reconciled to God: all that have it have it by Christ. I say, many times the expressions are general, to show that God disposeth of the sins of all his people one way. Such expressions are rather exclusive of other ways, than inclusive and comprising all persons. God is said to lay the iniquities of us all upon Christ, because all those whose iniquities are disposed in a merciful way, they are disposed this way.

Let me exemplify this a little: —The philosophers define good thus … good is that which all things desire. It is not to be understood as if all things in the world did desire good; for stones and timber, and many other things, have no appetite. The meaning is, all things that desire, desire that which is good. But I will give you instances in scripture: Col. 1:20, ‘And having made peace through the blood of his cross, by him to reconcile all things unto himself.’ Not that everything is reconciled, but everything that is reconciled, is reconciled this way, by the blood of Christ’s cross. So Titus 2:11, ‘The grace of God that bringeth salvation hath appeared to all men;’ that is, to all to whom salvation is brought, it is brought by the grace of God; it rather noteth Christ’s merits than the persons that enjoy it.

Divers such expressions there are in scripture. Thus, John 1:9, ‘That was the true light which lighteth every man that cometh into the world.’ Not that every man that cometh into the world is enlightened, there are many that perish and die in their ignorance: the meaning is, every man that is enlightened, is enlightened by him. As, for example, such a man cured all the city; not that every particular man was cured, but all that were cured were cured by him: so Christ is the Saviour of all men, that is, of all that are saved. These expressions are exclusive of all other ways, not inclusive of every person. Thus you have the reasons.</p></blockquote>

will+not+come+unto+him%3A+%E2%80%9CYe+will+not+come+unto+me%2C+that+ye+may+have+life%3B%E2%80%99+Rom.+5%3A18%2C+%E2%80%98Therefore%2C+as+by+the+offence+of+one+judgment+came+upon+all+to+condemnation%3B+even+so+by+the+righteousness+of+one+the+free+gift+came+upon+all+men+to+justification+of+life.%E2%80%99+The+text+proveth+nothing+but+that+there+was+as+much+sufficiency+in+Christ+to+justify%2C+as+there+was+in+Adam+to+condemn.+That+we+may+not+have+too+low+and+undervaluing+thoughts+of+Christ%E2%80%99s+sufferings%2C+the+scripture+speaks+thus+generally%3A+there+is+enough+for+me+and+thee%2C+and+all+the+world.+It+is+a+great+injury+done+to+Christ+to+lessen+and+extenuate+him+beneath+Adam%2C+as+if+he+were+not+as+able+to+recover+as+the+other+to+ruin+us.%0A%0A3.+Therefore+it+is+expressed+thus+generally%2C+that+all+conditions+of+men+might+be+included.+God+would+not+have+any+enclosure+of+his+mercy+within+the+bounds+of+any+nation%2C+persons%2C+and+conditions+of+men%2C+that+he+might+take+off+all+outward+exceptions%2C+and+comprise+every+believer%2C+of+what+condition+and+rank+soever%3B+and+therefore+he+expresseth+himself+promiscuously+to+all+of+every+state%2C+every+nation%2C+every+order.+It+is+the+nature+of+man+to+confine+privileges+to+their+own+nation+and+order.+We+would+be+singular+and+shine+alone%2C+and+have+none+share+with+us%3B+envy%2C+I+say%2C+grudgeth+at+the+commonest+mercies.+We+see+in+common+things+nothing+is+so+welcome+to+us+as+that+which+we+enjoy+alone.+The+Romans+would+be+the+only+civil+nation%2C+all+else+were+barbarians.+The+Romish+clergy+would+have+all+learning+and+knowledge+confined+within+their+function%3B+and+the+Jews+could+not+endure+to+hear+of+a+general+salvation+for+other+nations.%0A%0AIt+was+the+harshest+note+that+could+be+sounded+in+their+ears%2C+that+Christ+died+for+all.+It+is+much+urged+by+the+apostle%2C+because+of+the+rage+of+the+Jews%2C+for+the+enlargement+of+the+pale+of+God%E2%80%99s+church.+Therefore+I+conceive+the+apostle+did+inculcate%2C+and+so+largely+insist+upon+it%2C+to+meet+with+this+perverseness+of+the+Jews%2C+as+that+which+they+would+never+hear+of.+In+this+sense+it+is+said%2C+Heb.+2%3A9%2C+he+%E2%80%98tasted+death+for+every+man%3B%E2%80%99+and+so+1+John+2%3A2%2C+%E2%80%98And+he+is+the+propitiation+for+our+sins%2C+and+not+for+ours+only%2C+but+also+for+the+sins+of+the+whole+world%3B%E2%80%99+that+is%2C+not+only+for+us+Jews%2C+but+for+all+the+world%2C+even+of+all+places%2C+orders%2C+and+ranks.+God+would+not+have+the+creatures+envy+it+to+any+man%2C+he+proposeth+it+so+generally+to+take+away+that+Jewish+indignation+against+the+Gentiles.+Therefore+the+apostles+do+so+plentifully+abound+in+these+expressions.%0A%0A4.+That+no+man+might+accuse+God+as+if+he+had+not+made+sufficient+provision+for%2C+his+soul.+Men+are+apt+to+transfer+their+guilt%3B+though+they+will+not+charge+Christ+with+it+in+a+way+of+faith%2C+they+will+charge+God+with+it+in+a+way+of+censure%3B+as+Prov.+19%3A3%2C+%E2%80%98The+foolishness+of+man+perverteth+his+way%2C+and+his+heart+fretteth+against+the+Lord.%E2%80%99+It+is+their+own+folly+and+unbelief%2C+and+we+are+apt+to+impute+it+to+God%2C+as+if+he+did+not+intend+Christ+to+us.+Now+there+would+be+more+occasion+offered%2C+if+the+Lord+should+have+pointed+out+by+name+those+to+whom+he+intended+Christ.+God+keepeth+it+secret+what+he+will+do+with+men%2C+that+he+may+provoke+them+to+endeavours+after+duty%2C+leaving+themselves+to+his+good+pleasure.%0A%0ANo+man+can+plead+now%2C+as+an+excuse+for+his+negligence%2C+that+God+left+him+out%3B+it+is+we+leave+out+ourselves%3B+and+therefore+the+proposal+and+offer+of+Christ+is+general.+God+hath+expressed+enough+of+his+will+to+show+man+his+duty%2C+though+not+enough+of+his+will+to+tell+man+his+pleasure+and+secret+intention.+Now+the+will+of+God+concerning+any+particular+person+is+hidden.+Men+would+fain+excuse+themselves+of+duty+by+prying+into+God%E2%80%99s+secrets.+God+giveth+a+check+to+such+curious+impudence%2C+by+making+the+proposal+and+offer+of+Christ+general%2C+though+his+intentions+to+give+Christ+may+be+particular%3B+yet+we+must+not+meddle+with+that.+Foolish+curiosity+proceeds+from+an+innate+desire+in+the+creature+to+charge+God+with+all+its+miscarriages%3A+Deut.+29%3A29%2C+%E2%80%98Secret+things+belong+unto+the+Lord%2C+but+those+things+which+are+revealed+belong+to+us%2C+and+our+children+for+ever.%E2%80%99+The+proposal+of+Christ+in+the+gospel%2C+that+is+a+revealed+thing%2C+and+it+belongeth+to+the+creatures.+God+would+have+it+carried+so+as+rather+typing+out+duty+to+them+than+revealing+his+own+purposes%3B+he+would+not+give+the+creature+such+an+occasion+to+murmur.%0A%0A5.+To+denote+the+multitude+that+should+come+into+Christ%2C+especially+in+the+latter+times%3B+they+are+as+good+as+a+whole+world%3A+he+%E2%80%98so+loved+the+world%2C%E2%80%99+John+3%3A16.+It+is+understood+by+many+of+mundus+credentium%3B+they+were+but+a+world+when+Christ+saved+them.+God%E2%80%99s+elect%2C+compared+with+the+wicked+world%2C+are+but+a+little+flock+by+themselves%2C+but+they+are+accounted+in+the+scripture+as+innumerable%3A+Rev.+7%3A9%2C+%E2%80%98I+beheld%2C+and+lo%2C+a+great+multitude%2C+which+no+man+could+number%2C+of+all+nations%2C+and+kindreds%2C+and+people%2C+and+tongues%2C+stood+before+the+throne%2C+and+before+the+Lamb%2C+clothed+with+white+robes%2C+and+palms+in+their+hands.%E2%80%99+Mark%2C+it+is+a+multitude+which+none+can+number%3B+the+sheep+of+Christ%E2%80%99s+flock+are+so+many+that+it+is+innumerable%3A+in+a+sort+especially%2C+there+shall+be+a+great+increase+in+the+last+times.+And+thus+you+may+expound+that+place%3A+Heb.+2%3A9%2C+%E2%80%98He+tasted+death+for+every+man.%E2%80%99%0A%0AIn+the+next+verse+it+is+so+intended%2C+%E2%80%98in+bringing+many+sons+unto+glory.%E2%80%99+So+Ps.+2%3A8%2C+%E2%80%98Ask+of+me%2C+and+I+will+give+thee+the+heathen+for+an+inheritance%2C+and+the+uttermost+parts+of+the+earth+for+thy+possession.%E2%80%99+The+gospel+shall+then+be+spread+far+and+near.+God+hath+given+Christ+to+have+and+to+hold+all+the+world%3A+Heb.+1%3A3%2C+%E2%80%98Whom+he+hath+appointed+heir+of+all+things.%E2%80%99+And+it+is+said+in+the+10th+verse+of+this+Isa.+53%2C+that+%E2%80%98the+pleasure+of+the+Lord+shall+prosper+in+his+hands.%E2%80%99+Therefore+the+scripture+speaketh+this+generally%2C+to+comprise+the+vast+multitude+that+should+embrace+the+doctrine+of+Christ.%0A%0A6.+To+denote+the+oneness%2C+or+the+one+way+by+which+all+are+reconciled+to+God%3A+all+that+have+it+have+it+by+Christ.+I+say%2C+many+times+the+expressions+are+general%2C+to+show+that+God+disposeth+of+the+sins+of+all+his+people+one+way.+Such+expressions+are+rather+exclusive+of+other+ways%2C+than+inclusive+and+comprising+all+persons.+God+is+said+to+lay+the+iniquities+of+us+all+upon+Christ%2C+because+all+those+whose+iniquities+are+disposed+in+a+merciful+way%2C+they+are+disposed+this+way.%0A%0ALet+me+exemplify+this+a+little%3A+%E2%80%94The+philosophers+define+good+thus+%E2%80%A6+good+is+that+which+all+things+desire.+It+is+not+to+be+understood+as+if+all+things+in+the+world+did+desire+good%3B+for+stones+and+timber%2C+and+many+other+things%2C+have+no+appetite.+The+meaning+is%2C+all+things+that+desire%2C+desire+that+which+is+good.+But+I+will+give+you+instances+in+scripture%3A+Col.+1%3A20%2C+%E2%80%98And+having+made+peace+through+the+blood+of+his+cross%2C+by+him+to+reconcile+all+things+unto+himself.%E2%80%99+Not+that+everything+is+reconciled%2C+but+everything+that+is+reconciled%2C+is+reconciled+this+way%2C+by+the+blood+of+Christ%E2%80%99s+cross.+So+Titus+2%3A11%2C+%E2%80%98The+grace+of+God+that+bringeth+salvation+hath+appeared+to+all+men%3B%E2%80%99+that+is%2C+to+all+to+whom+salvation+is+brought%2C+it+is+brought+by+the+grace+of+God%3B+it+rather+noteth+Christ%E2%80%99s+merits+than+the+persons+that+enjoy+it.%0A%0ADivers+such+expressions+there+are+in+scripture.+Thus%2C+John+1%3A9%2C+%E2%80%98That+was+the+true+light+which+lighteth+every+man+that+cometh+into+the+world.%E2%80%99+Not+that+every+man+that+cometh+into+the+world+is+enlightened%2C+there+are+many+that+perish+and+die+in+their+ignorance%3A+the+meaning+is%2C+every+man+that+is+enlightened%2C+is+enlightened+by+him.+As%2C+for+example%2C+such+a+man+cured+all+the+city%3B+not+that+every+particular+man+was+cured%2C+but+all+that+were+cured+were+cured+by+him%3A+so+Christ+is+the+Saviour+of+all+men%2C+that+is%2C+of+all+that+are+saved.+These+expressions+are+exclusive+of+all+other+ways%2C+not+inclusive+of+every+person.+Thus+you+have+the+reasons.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Practical+Exposition+upon+the+Fifty-Third+Chapter+of+Isaiah%2C+%281703%29+in+The+Complete+Works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%3A+James+Nisbet+%26+Co.%2C+1871%29%2C+3%3A+328-31.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F790d309c32.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/790d309c32.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/06/thomas-manton-on-the-infinite-sufficiency-of-christs-death/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.</p></blockquote>

<blockquote><p>9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>

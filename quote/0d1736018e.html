<main class="wrap"><figure class="quote" id="q-0d1736018e" data-kw="">
<blockquote><p>And it seems particularly necessary, at the present time, when our Free Church has been organized on so scriptural a footing, that we should ask breath from the four winds, to make it the means of converting souls. Our ecclesiastical constitution may be good, but, unless we have the quickening Spirit, it will be no better than a candlestick without any oil burning in it the candlestick may be all of gold, and decorated with pomegranates and flowers, but if it emits no flame, it is useless in the eyes of God.

We read in the prophecies of Ezekiel of the temple that is to be erected at Jerusalem in the latter days; this is generally understood, by those who do not look for a personal advent of the Saviour, to usher in the millennial splendours, as emblematic of the constitution that will distinguish the Church, when the Jews are replaced in their own territory. Now, after the edifice is completed, according to the prescribed model, the healing waters issue forth, to pour their waves into the salt sea; and, since, by the providence of God, the external arrangements of our Zion are consummated, let us seek that a kindred stream of reviving influence should flow out, diffusing life and gladness.

The form of the windows, and columns, and chapiter in our temple, is determined; let us seek that it may be the seat and centre of a quickening energy that will pervade many lands. God has enabled us to lay out and hedge the garden in which we are to carry on our labours; our engrossing aim should now be, that the sun may illuminate its beds, that many lilies may be planted in it, so that the Son of God shall walk in the midst of it, regaled with their fragrance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-cumming.html">Alexander Cumming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dispensation of the Spirit in Gospel Times. (Preached before the Free Synod of Perth, 15th October 1844, and published at their request.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c0b7e3aec0" data-kw="">
<blockquote><p>Legal and of Works, which stands in that conformity unto God’s law, which is inherent within ourselves, when in our own persons and works we possess and practise that righteousness which is required of the Law. …

Evangelical, and of Faith, which is such a conformity to God’s Law as is not inherent in our own persons; but being in another is imputed unto us and reckoned ours. The righteousness of the Law, and of the Gospel, are not two several kinds of righteousness; but the same in regard of the matter and substance thereof: only they differ in the Subject and Manner of application. The righteousness of works is that holiness and obedience which is inherent in our own persons and performed by ourselves: the righteousness of Faith is the same holiness and obedience inherent in the person of Christ and performed by him; but embraced by our faith, and accepted by God, as done in our stead, and for our benefit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A treatise of justification by faith wherein that point is fully cleared, and vindicated from the cavils of it’s adversaries. Delivered in certain lectures at Magdalen Hall in Oxford</cite>, (Oxford: John Lichfield, 1625), pp 2, 3.</span></figcaption>

e · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-3deccb32a6" data-kw="">
<blockquote><p>Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11), angels, by reason of the quickness and strength of their understanding, apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>

</figure><figure class="quote" id="q-1035334f61" data-kw="">
<blockquote><p>That this righteousness of ours, that is, whereby we are righteous, or made righteous before God; is not Legal, but Evangelical. Man’s first righteousness was Legal, but that is a Non-ens now; there is no such thing in being now betwixt God and us, as Legal Righteousness: once it was, but now ’tis cast out, in the Bond-woman and her Son, Gal. 4.

The Law is not able to justify a sinner; therefore the Apostle saith, If there had been a Law which could have given life, i.e. Justification unto life (as Rom. 5.18.) verily righteousness should have been by Law: but the Scripture, i.e. the Law hath concluded all under sin, that the promise by faith of Jesus Christ might be given to them that believe.

‘Tis true, Christ’s Righteousness, as in himself was legal, being the satisfaction of the Law, and Justice of God in our behalf. But as this Righteousness is imputed to us, so it is Evangelical Righteousness; because it is not Righteousness in us, but Righteousness accounted to us: Abraham believed, and it was accounted to him for righteousness. So that there is now another way to Justification, and so to life and glory, than once there was, which the Epistle to the Hebrews calls a New way; and this is the Righteousness of Christ made ours, or Christ, the Lord our Righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ, the Lord our Righteousness, or, Christ the Righteousness of a Sinner before God delivered in Several Sermons</cite>, (London; John Brooke, 1669), pp 18-19.</span></figcaption>

</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

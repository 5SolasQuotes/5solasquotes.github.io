<main class="wrap"><figure class="quote" id="q-f8da12c4f0" data-kw="">
<blockquote><p>Magistrates, who should know theology and should have the law before their eyes (Deut. 17:18-20; Josh. 1:8; Psalm 19), prescribe it for their subordinates (2 Chron. 17:7-9; Josh. 24:14ff.), protect it against enemies, as nursing fathers of the church (Isa. 49:23; 60:16) and as guardians of both tables of the law, and propagate it (Gen 18:19). In sum they should, in all ways, kiss Christ (Ps. 2:10-12), so that their polity becomes a theocracy, that is, a Christocracy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.XXVIII, p. 90.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb1b33fbe2" data-kw="">
<blockquote><p>The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27).¹ ¹ See ‘On the Ethics of Paying Specific Taxes designated to a Corrupt Purpose or Imposed by a Usurped Authority or Usurper’ and ‘On the Ethics of Paying the Scottish Cess Near &amp; During the Killing Times’ at ‘On Paying Taxes’ (RBO). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged [Scottish ministers] censured the indulged with?² Did Jesus compromise his authority or the exercise of his ministry? ² Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, p. 151 in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</span></figcaption>

</figure><figure class="quote" id="q-dd7252cd57" data-kw="">
<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 220</span></figcaption>

<blockquote><p>My Lords and Gentlemen, — You know that the wisest prince that ever sat upon a throne hath told us that ‘righteousness exalts a nation,’ Prov. xiv. 34. It is not valour in war, but righteousness; it is not policy in government, but righteousness; it is not wittiness of invention, but righteousness; it is not civility in behaviour, but righteousness; it is not antiquity of forms, but righteousness; it is not largeness of dominion, but righteousness; nor it is not greatness of command, but righteousness, that is the honour and the safety, that is the renown and the security of a nation. That nation that exalts righteousness, that nation shall be certainly exalted by righteousness, Amos v. 24.

It is not Ahithophel’s policy, it is not Jeroboam’s calves in Dan and Bethel, it is not Jehu’s pompous zeal, it is not Goliath’s sword, it is not rich mines of gold and silver, nor magazines, nor armies, nor councils, nor fleets, nor forts, but justice and righteousness that exalts a nation, and that will make a mean people to become a great, a glorious, and a famous people in the world. The world is a ring, and righteousness is the diamond in that ring: the world is a body, and righteousness and justice is the soul of that body.

Ah! England, England! so long as judgment runs down as waters in the midst of thee, and righteousness as a mighty stream, thou shalt not die, but live and bear up bravely against all gainsayers and opposers; but if injustice shall grow rampant, and thou shalt brandish the sword of justice in the behalf of the friends of Baal, Balaam, and Bacchus, and turn the wheel upon the righteous; if the sword of justice shall be a sword of protection to the desperate swearer, and to the cruel oppressor, and to the roaring drunkard, and to the cursing monster, and to the gospel despiser, and to the Christ contemner, &amp;c., and shall be a devouring sword to the upright and peaceable in the land, divine vengeance will dig thy grave, and divine justice will tumble thee into it, though all the nations of the earth should labour to prevent it.

It is a base and ignoble spirit, to pity Cataline more than to pity Rome; to pity any particular sort of men, more than to pity the whole. It is cruelty to the good, to justify the bad: it is wrong to the sheep, to animate the wolves: it is danger if not death to the lambs, not to restrain or chain up the lions. But from all these vanities the Lord deliver all your souls!

And oh that you would for ever remember this, that as the constitution of a man’s body is best known by his pulse: if it stir not at all, then we know he is dead; if it stir violently, then we know him to be in a fever; if it keep an equal stroke, then we know he is sound, well, and whole: so the estate and constitution of a kingdom or commonweal is best known by the manner of executing justice therein; for justice is the pulse of a kingdom.

If justice be violent, then the kingdom is in a fever, in a very bad estate; if it stir not at all, then the kingdom is dead; but if it have an equal stroke, if it be justly and duly administered, then the kingdom is in a good, a safe, and sound condition. When Vespasian asked Apollonius what was the cause of Nero’s ruin, he answered, that Nero could tune the harps well, but in government: he did always wind up the strings too high, or let them down too low.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 7-8.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“My Lords and Gentlemen, — You know that the wisest prince that ever sat upon a throne hath told us that ‘righteousness exalts a nation,’ Prov. xiv. 34. It is not valour in war, but righteousness; it is not policy in government, but righteousness; it is not wittiness of invention, but righteousness; it is not civility in behaviour, but righteousness; it is not antiquity of forms, but righteousness; it is not largeness of dominion, but righteousness; nor it is not greatness of command, but righteousness, that is the honour and the safety, that is the renown and the security of a nation. That nation that exalts righteousness, that nation shall be certainly exalted by righteousness, Amos v. 24.

It is not Ahithophel’s policy, it is not Jeroboam’s calves in Dan and Bethel, it is not Jehu’s pompous zeal, it is not Goliath’s sword, it is not rich mines of gold and silver, nor magazines, nor armies, nor councils, nor fleets, nor forts, but justice and righteousness that exalts a nation, and that will make a mean people to become a great, a glorious, and a famous people in the world. The world is a ring, and righteousness is the diamond in that ring: the world is a body, and righteousness and justice is the soul of that body.

Ah! England, England! so long as judgment runs down as waters in the midst of thee, and righteousness as a mighty stream, thou shalt not die, but live and bear up bravely against all gainsayers and opposers; but if injustice shall grow rampant, and thou shalt brandish the sword of justice in the behalf of the friends of Baal, Balaam, and Bacchus, and turn the wheel upon the righteous; if the sword of justice shall be a sword of protection to the desperate swearer, and to the cruel oppressor, and to the roaring drunkard, and to the cursing monster, and to the gospel despiser, and to the Christ contemner, &amp;c., and shall be a devouring sword to the upright and peaceable in the land, divine vengeance will dig thy grave, and divine justice will tumble thee into it, though all the nations of the earth should labour to prevent it.

It is a base and ignoble spirit, to pity Cataline more than to pity Rome; to pity any particular sort of men, more than to pity the whole. It is cruelty to the good, to justify the bad: it is wrong to the sheep, to animate the wolves: it is danger if not death to the lambs, not to restrain or chain up the lions. But from all these vanities the Lord deliver all your souls!

And oh that you would for ever remember this, that as the constitution of a man’s body is best known by his pulse: if it stir not at all, then we know he is dead; if it stir violently, then we know him to be in a fever; if it keep an equal stroke, then we know he is sound, well, and whole: so the estate and constitution of a kingdom or commonweal is best known by the manner of executing justice therein; for justice is the pulse of a kingdom.

If justice be violent, then the kingdom is in a fever, in a very bad estate; if it stir not at all, then the kingdom is dead; but if it have an equal stroke, if it be justly and duly administered, then the kingdom is in a good, a safe, and sound condition. When Vespasian asked Apollonius what was the cause of Nero’s ruin, he answered, that Nero could tune the harps well, but in government: he did always wind up the strings too high, or let them down too low.”

— Thomas Brooks, The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 7-8.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMy+Lords+and+Gentlemen%2C+%E2%80%94+You+know+that+the+wisest+prince+that+ever+sat+upon+a+throne+hath+told+us+that+%E2%80%98righteousness+exalts+a+nation%2C%E2%80%99+Prov.+xiv.+34.+It+is+not+valour+in+war%2C+but+righteousness%3B+it+is+not+policy+in+government%2C+but+righteousness%3B+it+is+not+wittiness+of+invention%2C+but+righteousness%3B+it+is+not+civility+in+behaviour%2C+but+righteousness%3B+it+is+not+antiquity+of+forms%2C+but+righteousness%3B+it+is+not+largeness+of+dominion%2C+but+righteousness%3B+nor+it+is+not+greatness+of+command%2C+but+righteousness%2C+that+is+the+honour+and+the+safety%2C+that+is+the+renown+and+the+security+of+a+nation.+That+nation+that+exalts+righteousness%2C+that+nation+shall+be+certainly+exalted+by+righteousness%2C+Amos+v.+24.%0A%0AIt+is+not+Ahithophel%E2%80%99s+policy%2C+it+is+not+Jeroboam%E2%80%99s+calves+in+Dan+and+Bethel%2C+it+is+not+Jehu%E2%80%99s+pompous+zeal%2C+it+is+not+Goliath%E2%80%99s+sword%2C+it+is+not+rich+mines+of+gold+and+silver%2C+nor+magazines%2C+nor+armies%2C+nor+councils%2C+nor+fleets%2C+nor+forts%2C+but+justice+and+righteousness+that+exalts+a+nation%2C+and+that+will+make+a+mean+people+to+become+a+great%2C+a+glorious%2C+and+a+famous+people+in+the+world.+The+world+is+a+ring%2C+and+righteousness+is+the+diamond+in+that+ring%3A+the+world+is+a+body%2C+and+righteousness+and+justice+is+the+soul+of+that+body.%0A%0AAh%21+England%2C+England%21+so+long+as+judgment+runs+down+as+waters+in+the+midst+of+thee%2C+and+righteousness+as+a+mighty+stream%2C+thou+shalt+not+die%2C+but+live+and+bear+up+bravely+against+all+gainsayers+and+opposers%3B+but+if+injustice+shall+grow+rampant%2C+and+thou+shalt+brandish+the+sword+of+justice+in+the+behalf+of+the+friends+of+Baal%2C+Balaam%2C+and+Bacchus%2C+and+turn+the+wheel+upon+the+righteous%3B+if+the+sword+of+justice+shall+be+a+sword+of+protection+to+the+desperate+swearer%2C+and+to+the+cruel+oppressor%2C+and+to+the+roaring+drunkard%2C+and+to+the+cursing+monster%2C+and+to+the+gospel+despiser%2C+and+to+the+Christ+contemner%2C+%26c.%2C+and+shall+be+a+devouring+sword+to+the+upright+and+peaceable+in+the+land%2C+divine+vengeance+will+dig+thy+grave%2C+and+divine+justice+will+tumble+thee+into+it%2C+though+all+the+nations+of+the+earth+should+labour+to+prevent+it.%0A%0AIt+is+a+base+and+ignoble+spirit%2C+to+pity+Cataline+more+than+to+pity+Rome%3B+to+pity+any+particular+sort+of+men%2C+more+than+to+pity+the+whole.+It+is+cruelty+to+the+good%2C+to+justify+the+bad%3A+it+is+wrong+to+the+sheep%2C+to+animate+the+wolves%3A+it+is+danger+if+not+death+to+the+lambs%2C+not+to+restrain+or+chain+up+the+lions.+But+from+all+these+vanities+the+Lord+deliver+all+your+souls%21%0A%0AAnd+oh+that+you+would+for+ever+remember+this%2C+that+as+the+constitution+of+a+man%E2%80%99s+body+is+best+known+by+his+pulse%3A+if+it+stir+not+at+all%2C+then+we+know+he+is+dead%3B+if+it+stir+violently%2C+then+we+know+him+to+be+in+a+fever%3B+if+it+keep+an+equal+stroke%2C+then+we+know+he+is+sound%2C+well%2C+and+whole%3A+so+the+estate+and+constitution+of+a+kingdom+or+commonweal+is+best+known+by+the+manner+of+executing+justice+therein%3B+for+justice+is+the+pulse+of+a+kingdom.%0A%0AIf+justice+be+violent%2C+then+the+kingdom+is+in+a+fever%2C+in+a+very+bad+estate%3B+if+it+stir+not+at+all%2C+then+the+kingdom+is+dead%3B+but+if+it+have+an+equal+stroke%2C+if+it+be+justly+and+duly+administered%2C+then+the+kingdom+is+in+a+good%2C+a+safe%2C+and+sound+condition.+When+Vespasian+asked+Apollonius+what+was+the+cause+of+Nero%E2%80%99s+ruin%2C+he+answered%2C+that+Nero+could+tune+the+harps+well%2C+but+in+government%3A+he+did+always+wind+up+the+strings+too+high%2C+or+let+them+down+too+low.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+The+Crown+and+Glory+of+Christianity%3B+or+Holiness%2C+the+only+way+to+Happiness.+Discovered+in+LVIII+Sermons+from+Heb.+12.+14%2C+%281662%29+in+The+Works+of+Thomas+Brooks%2C+ed.+Alexander+B.+Grossart+%286+vols%2C+Edinburgh%3A+James+Nichol%2C+1861-67%29%2C+4%3A+7-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F306e0b1b7b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/306e0b1b7b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/21/thomas-brooks-on-righteousness-exalting-a-nation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

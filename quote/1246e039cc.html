<main class="wrap"><figure class="quote" id="q-1246e039cc" data-kw="">
<blockquote><p>As certainly, then, as we are the descendants of the first man created in the image of God, and by transgression fallen from his primaeval condition of holiness, dignity, and happiness, and thus made liable to misery here and to everlasting destruction from the presence of the Lord and from the glory of his power hereafter, so assuredly we inherit a nature corrupted by the spiritual disease which, prevailing against him, brought him low, and incur the penalty of that doom to which he was adjudged by the sentence pronounced on the very spot which had been the scene of his rebellion. “As by one man sin entered into the world, and death by sin, so death hath passed upon all men, for that all have sinned.”

This doctrine has been often derided and loudly anathematised as unworthy of the belief of any but the slaves of a wretched superstition;—the rational thinker laughs to scorn such an absurdity. But if the Word of God were silent on the subject, instead of being as express on the point as language can be, the existence of moral evil is manifest in the experience of every man born of woman, and proclaimed by the accusings of conscience even before the individual who is the object of their attack has been savingly awakened to a sense of his guilt, and renewed in the spirit of his mind, and before he can joyfully declare that with him old things have passed away, and that all things are become new.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-jeffrey.html">Robert Jeffrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lot s Flight from Sodom’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>And here we must consider, that the Divine Nature did not assume an human Person, but the divine Person did assume an human Nature: and that of the three Divine Persons, it was neither the first nor the third that did assume this Nature; but it was the middle Person, who was to be the middle one, that must undertake this mediation betwixt God and us. which was otherwise also most requisite, as well for the better preservation of the integrity of the blessed Trinity in the Godhead, as for the higher advancement of Man-kind by means of that relation which the second Person the Mediator did bear unto his Father.

For if the fullness of the Godhead should have thus dwelt in any human person, there should then a fourth Person necessarily have been added unto the Godhead. And if any of the three Persons, beside the second, had been borne of a Woman; there should have been two Sons in the Trinity: whereas now the Son of God and the Son of the blessed Virgin, being but one Person, is consequently but one Son; and so no alteration at all made in the relations of the Persons of the Trinity.</p></blockquote>

<blockquote><p>Nor was this perfect exemption from violence or injury at the hand of men a mere isolated fact. It was part of the general scheme or of the understood relation to human life occupied by Christ. He was not to dash His foot against a stone (Ps. xci.). Disease in the ordinary course, or as it is commonly contracted, could not touch Him, because He did not come within the power of sin in the world; and hence we never read of His contracting any distemper or disease like other men. Nor could death in any of the thousand forms in which it comes to other men, come to Him, till He consented…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Atonement as Taught by Christ Himself</cite>, (Edinburgh: T&amp;T Clark, 1868), pp. 130-31</span></figcaption>

<blockquote><p>His profound feeling of dependence on God, for example, is illustrated in every conceivable way, not least strikingly in the constant habit of prayer which the Evangelists ascribe to him. But we are never directly told that he felt this dependence on God or “feared God”, or felt the emotions “of reverence and awe in the divine presence…¹ The narrative brings Jesus before us as acting under the impulse of all the religious emotions; but it does not stop to comment upon the emotions themselves. ¹ Cf. Heb. v. 7: “having been heard for his godly fear ([Greek] Eulabeia)”, i.e. for his reverent and submissive awe,” that religious fear of God and anxiety not to offend Him which manifests itself in voluntary and humble submission to his will” (Delitzsch in loc.). Davidson in loc: “The clause throws emphasis on the Son’s reverent submission.” Humanitarian writers debate whether “fear” of God is to be attributed to Jesus. Wellhausen (Israel, und jud. Geschichte, p. 383, expanded in Skizzen und Vorarbeiten, i. 1884, p. 98) represents him as passing his life in fear of the judge of all: “He feels the reality of God dominating life, he breathes in the fear of the Judge who demands account of every idle word and has power to destroy body and soul in hell.” Similarly Bousset (Jesus, 1904, pp. 54, 99, E. T. pp. 112, 203) speaks of him as learning by his own experience” that God is terrible (furchtbar) and that an awful darkness and dread encircles him even for those who stand nearest to him,” and as “sharing to the bottom of his soul” “the fear of that almighty God who has power to damn body and soul together,” which he “has stamped upon the hearts of his disciples with such marvellous energy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’</cite>, (1912), pp. 80-81</span></figcaption>

<blockquote><p>Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“Certainly from one perspective, as a creature and as man, it seems that He [Christ] cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs).”

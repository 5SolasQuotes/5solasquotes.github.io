<main class="wrap"><figure class="quote" id="q-b5df3ae534" data-kw="">
<blockquote><p>Q. DId God create the world at the same instant, or in the space of six days? A. In the space of six days: First, because Moses’ narration is historical, and therefore he speaks of six distinct days. Secondly, Moses, Ex. 20 &amp; 31, urges the Jews to work six days and rest the seventh, because God created the world in six days and rested the seventh; this reason had been ridiculous if God had made the world in an instant. Thirdly, if we understand Moses in this place allegorically, then we must make this whole history an allegory. Fourthly, if the seventh day had been the first (and in it God had created the world), then how is it understood that God rested the seventh day? Fiftly, how could so many diverse kinds of creatures be created in the same instant of time? yea, then we must say that man was created and brought into Paradise and was cast asleep, and Eve was formed of his rib the same instant. Q. How then is that understood, Ecclesiasticus 18 [v. 1], ‘He that lives forever, created all things together’? A. It is to be understood of that confused mass that God created in the beginning: out of the which afterward He created the rest of the creatures in their distinct days. Q. Why did God spend so much time in making the world? A. Not because He was weak and could not make it in less time, but that we might the more seriously consider the order of the creation, distinction and replenishing of the world; and in these, the omnipotency, wisdom and goodness of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Fourteen First Chapters of Genesis, by way of Question &amp; Answer… (London, 1626), Questions on the 2nd Chapter</cite>, pp. 28-29</span></figcaption>

</figure><figure class="quote" id="q-879510ff62" data-kw="">
<blockquote><p>In God, however, it is otherwise. For it was shown above (Q. 4, A. 2) that whatever perfection exists in any creature, wholly pre-exists and is contained in God in an excelling manner. Now not only what is common to creatures—viz., being—belongs to their perfection, but also what makes them distinguished from each other; as living and understanding, and the like, whereby living beings are distinguished from the non-living, and the intelligent from the non-intelligent. Likewise every form whereby each thing is constituted in its own species, is a perfection; and thus all things pre-exist in God, not only as regards what is common to all, but also as regards what distinguishes one thing from another. And therefore as God contains all perfections in Himself, the essence of God is compared to all other essences of things, not as the common to the proper, as unity is to numbers, or as the center (of a circle) to the (radiating) lines; but as perfect acts to imperfect; as if I were to compare man to animal; or six, a perfect number, to the imperfect numbers contained under it. Now it is manifest that by a perfect act, imperfect acts can be known not only in general, but also by proper knowledge; thus, for example, whoever knows a man, knows an animal by proper knowledge; and whoever knows the number six, knows the number three also by proper knowledge. As therefore the essence of God contains in itself all the perfection contained in the essence of any other being, and far more, God can know in Himself all of them with proper knowledge. For the nature proper to each thing consists in some degree of participation in the divine perfection. Now God could not be said to know Himself perfectly unless He knew all the ways in which His own perfection can be shared by others. Neither could He know the very nature of being perfectly, unless He knew all modes of being. Hence it is manifest that God knows all things with proper knowledge, in their distinction from each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 14, art. 6, I answer that</cite></span></figcaption>

<blockquote><p>3rd Problem. Whether God is universally perfect, as it were having in Himself the perfection of all things? Answer: Affirmed—provided you distinguish the “having,” or the “containing,” into the virtual or eminent and the formal. For certain perfections are in God formally, as life, goodness, intellect, will, etc. But certain others only virtually or causally, as in a producing and conserving cause, but not formally—as, e.g., sensitive life, corporeal perfections, and all the other specific perfections of the stars, elements, minerals, plants, animals, etc. According to this distinction, the Enthusiastic frenzies are to be refuted; and rightly are to be explained the texts which say that all things are, or subsist, in God. By this same distinction is determined another Problem, which occurs a little later in my syllabus: Whether created perfections can be in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations | ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin</cite>, vol. 5 (1669)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>…creation is instantaneous, unpreceded by a process of becoming… St. Thomas excels in explaining this distinction, just now noted, between passive potency and active potency. Real passive potency is not simple possibility. Simple possibility is prerequired and suffices for creation ex nihilo. But it does not suffice as prerequisite for motion, change, mutation. Mutation presupposes a real subject, determinable, transformable, mutable, whereas creation is the production of the entire created being, without any presupposed real potency. Now, since active potency, active power, must be greater in proportion to its passive correlative, it follows that when passive potency is reduced to zero, the active potency must be infinite. In other words, the most universal of effects, the being of all [created] things, cannot be produced except by the most universal of all causes, that is, by the Supreme Being. (Summa, pt. 1, q. 45, art. 1, 2, 5; pt. 3, q. 75, art. 8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: A Synthesis of Thomistic Thought (n.p., 1946), ch. 5, ‘Act &amp; Potency’, pp. 29-30 Lagrange is a Romanist, neo-Thomist theologian.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“…creation is instantaneous, unpreceded by a process of becoming… St. Thomas excels in explaining this distinction, just now noted, between passive potency and active potency. Real passive potency is not simple possibility. Simple possibility is prerequired and suffices for creation ex nihilo. But it does not suffice as prerequisite for motion, change, mutation. Mutation presupposes a real subject, determinable, transformable, mutable, whereas creation is the production of the entire created being, without any presupposed real potency. Now, since active potency, active power, must be greater in proportion to its passive correlative, it follows that when passive potency is reduced to zero, the active potency must be infinite. In other words, the most universal of effects, the being of all [created] things, cannot be produced except by the most universal of all causes, that is, by the Supreme Being. (Summa, pt. 1, q. 45, art. 1, 2, 5; pt. 3, q. 75, art. 8)”

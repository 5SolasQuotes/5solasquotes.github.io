<main class="wrap"><figure class="quote" id="q-f9b50cc58d" data-kw="">
<blockquote><p>Let them [Independents] produce a particular Word for the order of God’s worship, what must be performed first, what second, what third, what fourth, and so of the rest, and that no ordinance nor part of worship may be in another order… let them produce what is required in the Word particularly, as the form of excommunication, or as the form of ordination; let them set down the outward worship and gesture of the external reverence which must be used, and no other way, in the several ordinances of God, as Word, prayer, singing of psalms, reading Scriptures, baptism, Lord’s Supper, excommunication, which if they cannot (as we know they are not able, neither in these nor many other things which may be named) let them then learn that many things in government and discipline have but general rules with equity of practices…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons against the Independant Government of Particular Congregations</cite>, … (London, 1641), ‘Reasons Against the Independant Government of Particular Congregations’, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13058b77a4" data-kw="">
<blockquote><p>…he [the opponent] was required to prove it significative of some spiritual duty [in order for it to be warrant for a human, significant ceremony in worship]: For it was in probability only a common sign of subjection, as well out of an oath, as in it, without any respect unto Christ. …but men’s conceits are no great proofs. He adds 2. that if it were a sign of subjection yet might it be significant of a spiritual duty. But may be and might be is no proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), ch. 3 | section 7, ‘Concerning the Oath-Gesture of Abraham’s Servant’, pp. 304-9</span></figcaption>

</figure><figure class="quote" id="q-fe03b67d34" data-kw="">
<blockquote><p>But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded, but if I do esteem it a matter of religious necessity to God-ward, to pray in such a place rather than such, and conceive that my prayers shall be more effectual for my good there rather than elsewhere, not having any such warrant from God, I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, II.xvi</cite>, (1654), Second Commandment, p. 772</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-501c80bd1e" data-kw="">
<blockquote><p>Paybody thinks kneeling in the act of receiving the Communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it, but I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with feare and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 2, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

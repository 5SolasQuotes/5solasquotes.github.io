<blockquote><p>No baptism shall be administred but in Church assemblies or where there is a formed public Church. But where there is no public Church and the parents through infirmity are afraid to carry them unto public baptism in the congregation, ministers shall consult how far in prudence they ought to yield unto them. Yet nevertheless there shall be some face of a Church and both exhortation and prayer; but if there be no Church, and a congregation cannot be assembled, the minister shall not make any difficulty to baptize the infants of believing parents tendered to him, with exhortation and prayer.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-873da605b8" data-kw="">
<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments: 1. Christ only administered the Supper in the assembly of the disciples. 2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33). 3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections: 1. Christ performed it in private houses. Reply: But the Church gathered there. 2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments: 1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either. 2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread. 3. There is no example or institution of it in the Word of God. Objections: 1. It is the body of Christ. Reply: No. The body of Christ is not bread. 2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 17, ‘The Sacraments’</cite>, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

es.github.io%2Fquote%2F873da605b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/873da605b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Controversy%2011%20%E2%80%93%20Should%20the%20holy,a%20sign%20and%20seal%20of%20it&amp;text=Controversy%2011%20%E2%80%93%20Should%20the%20holy%20Supper%20for&amp;text=it%20is%20a%20sign%20and%20seal%20of%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d1233e8e1e" data-kw="">
<blockquote><p>Furthermore, did Christ deliver his Last Supper to all his disciples that were present? Did none stand by, and gaze on while other received? Then hereby fall to the ground the private communions of the popish Church, where all is devoured by the priest, nothing delivered to the people. For whereas the ordinance of Christ and ancient order of the church was for the minister and people to receive the sacrament together: among them the priest accompanied with his boy to make answer, receives the sacrament himself alone, without distribution made to others, yea although the whole congregation be present and look upon him, whereby God is dishonored, the communion is abolished, the people of God are there by deprived and robbed of all comfort. How is this a feast which the priest prepares for himself, not for others: receives by himself, not with his brethren: he speaks to himself, and not to the assembly: he uses a strange tongue, and no man knows what he means: the people is taught nothing, they understand nothing, they hear nothing, they receive nothing; and a few childish, apish, foolish, and unseemly gestures excepted, they see nothing: they taste nothing, they partake nothing, neither comfort of heart, nor memory of Christ, nor benefit of his passion. But Christ in his Last Supper, did not eat up all alone, but after the disciples had supped as Mathew sets it down, He took bread and blessed He brake and gave it to them, saying, ‘Take ye, eat ye:’ neither did He drink alone of the fruit of the vine, but taking the cup He gave thanks, and gave to them all, saying, ‘Drink ye all of this.’ So then, albeit a certain number of communicants are not limited and determined: yet Christ in these words appoints a company to be present, as appears by the number, ‘take ye, eat ye,’ ‘drink ye all,’ ‘divide ye it among yourselves,’ ‘do ye this in my remembrance,’ ‘ye set forth the Lord’s death,’ ‘when ye come together to eat,’ ‘tarry ye one for another,’ ‘as often as ye shall eat this bread.’ These words cannot be understood of one particular man, but necessarily import a greater number of men: nay, the Philosopher teaches that the word ‘all’ must be verified at the least of the number of three, which is the least and lowest number that would be admitted to this supper. Neither do we read that so soon as one was gained to the faith, that the apostles administered this sacrament to him, much less would they minister to themselves alone, when none were converted in a nation or city.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments… (London, 1606), bk. 3, ‘Of the Lord’s Supper’</cite>, pp. 276-77</span></figcaption>

<blockquote><p>If any good Christian visited with long sickness and known to the pastor, by reason of his present infirmity [be] unable to resort to the church for receiving of the holy Communion, or being sick shall declare to the pastor upon his conscience that he thinks his sickness to be deadly, and shall earnestly desire to receive the same in his house: The minister shall not deny to him so great a comfort, lawful warning being given to him upon the night before, and that there be three or four [persons] of good religion and conversation, free of lawful impediments, present with the sick person to communicate with him, who must also provide a convenient place in his house and all things necessary for the reverend administration thereof, according to the order prescribed in the Church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If any good Christian visited with long sickness and known to the pastor, by reason of his present infirmity [be] unable to resort to the church for receiving of the holy Communion, or being sick shall declare to the pastor upon his conscience that he thinks his sickness to be deadly, and shall earnestly desire to receive the same in his house: The minister shall not deny to him so great a comfort, lawful warning being given to him upon the night before, and that there be three or four [persons] of good religion and conversation, free of lawful impediments, present with the sick person to communicate with him, who must also provide a convenient place in his house and all things necessary for the reverend administration thereof, according to the order prescribed in the Church.”

— Scottish Articles of Perth, As given in David Lindsay, ‘The Acts concluded at Perth, touching Private Baptism &amp; Communion’ in A True Narration of All the Passages of the Proceedings in the General Assembly of the Church of Scotland… 1618… together with a just defence of the Articles… against a Seditious Pamphlet [by Calderwood] (London, 1621)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+any+good+Christian+visited+with+long+sickness+and+known+to+the+pastor%2C+by+reason+of+his+present+infirmity+%5Bbe%5D+unable+to+resort+to+the+church+for+receiving+of+the+holy+Communion%2C+or+being+sick+shall+declare+to+the+pastor+upon+his+conscience+that+he+thinks+his+sickness+to+be+deadly%2C+and+shall+earnestly+desire+to+receive+the+same+in+his+house%3A+The+minister+shall+not+deny+to+him+so+great+a+comfort%2C+lawful+warning+being+given+to+him+upon+the+night+before%2C+and+that+there+be+three+or+four+%5Bpersons%5D+of+good+religion+and+conversation%2C+free+of+lawful+impediments%2C+present+with+the+sick+person+to+communicate+with+him%2C+who+must+also+provide+a+convenient+place+in+his+house+and+all+things+necessary+for+the+reverend+administration+thereof%2C+according+to+the+order+prescribed+in+the+Church.%E2%80%9D%0A%0A%E2%80%94+Scottish+Articles+of+Perth%2C+As+given+in+David+Lindsay%2C+%E2%80%98The+Acts+concluded+at+Perth%2C+touching+Private+Baptism+%26+Communion%E2%80%99+in+A+True+Narration+of+All+the+Passages+of+the+Proceedings+in+the+General+Assembly+of+the+Church+of+Scotland%E2%80%A6+1618%E2%80%A6+together+with+a+just+defence+of+the+Articles%E2%80%A6+against+a+Seditious+Pamphlet+%5Bby+Calderwood%5D+%28London%2C+1621%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa16dd689d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a16dd689d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=If%20any%20good%20Christian%20visited%20with,the%20order%20prescribed%20in%20the%20Church&amp;text=If%20any%20good%20Christian%20visited%20with%20long%20sickness&amp;text=according%20to%20the%20order%20prescribed%20in%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

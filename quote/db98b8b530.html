<main class="wrap"><figure class="quote" id="q-db98b8b530" data-kw="">
<blockquote><p>We say with the Scripture, that the Relation of the works to the Reward doth herein consist, that by the liberal promise of God there is the same respect between them, as between Antecedents and Consequents by Covenant, &amp;c. because it pleased God so to appoint it: who yet in that appointment would shew that he is delighted in the good works of his own, and animateth them to the exercise thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholicus Orthodoxus, tract 4, Question 17 as trans. in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, p. 406</cite>, p. 318</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-343193af46" data-kw="">
<blockquote><p>just as the other acts signified under faith, as it were materially and by synecdoche, are not of themselves and directly ordered to the properly effecting of friendship with God and salvation, but either to faith (to which they in some way contribute), or at least to the not-losing of friendship with God or salvation; so neither do they properly and directly justify or save. They are useful, however, insofar as by them we exclude and avoid sins and ingratitude, which would altogether be the true cause of losing righteousness and salvation—such a cause as they are accustomed to refer to as a removing or prohibiting cause, and among causes per accidens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-bergius.html">Conrad Bergius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praexi Cathol. Divin. Canon., Dissertation 7, pp. 986-87 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-d62514d3a9" data-kw="">
<blockquote><p>Now this object of his [Paul’s] praying, and praising [in Col. 1:12], was not for their justification only, but verse 10, their walking worthy of the Lord unto all well-pleasing, being fruitful in every good work, verse 11, strengthened unto all patience. This was a part of their fitness, and that holy walking conferreth a fitness and disposition for salvation to me is clear, because no unclean thing can enter within the gates of that higher City, and because that love which we have here in our way, being the same in nature, though not in degree, with that which in our country shall remain, as a part of our garland, and crown, the one must be a fit disposition to the other; and when the apostle saith “Follow peace with all men, and holiness, without which no man shall see the Lord.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, (London, 1648), Part 2, Ch. 48, ‘Antinomians hold that the believer cannot sin against God…’, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>19. In this life they [powers of human choice] avail nothing without the help of God, whether general or special.

20. General help is called the general motion of divine providence by which all things are governed and preserved. Acts 17:28; Heb. 1:3.

21. Special help is called the particular grace that moves, strengthens, and advances unto action.

22. And this is either apart from regenerating grace, by which God distributes moral gifts and moral virtues to whom he wills, even to the reprobate (1 Cor. 12), or it is joined with regenerating grace, that is, the saving grace of Christ, of which it is said in Jn. 15:5 and 1 Cor. 15:10.

23. I say that the powers of human choice (vires humani arbitrii) avail nothing in themselves, neither in earthly matters nor in heavenly matters.

24. I call earthly matters those things which pertain only to earthly life.

25. And these are either natural or moral.

26. Natural things are called those which are common to all living beings, such as eating, drinking, sleeping, walking, procreating, etc.

27. Moral things are called political or civil matters which pertain to establishing and preserving human life, household management, society, and the commonwealth—such as buying, selling, administering justice, serving in the military, cultivating peace, governing a family, learning the sciences and arts whether liberal or mechanical, etc.

28. Heavenly matters are those things which pertain to the heavenly and spiritual life in the kingdom of Christ, such as believing in God, calling upon God, doing the will of God, fulfilling the commandments of God, etc. These are also called spiritual matters, matters pertaining to salvation, pious, Christian, and religious matters. …

38. After the fall, choice, both regenerate and unregenerate, can choose and accomplish no natural things without the general help of God.

39. Much less is it able to choose and pursue political matters without the general help of God.

40. Indeed, it cannot desire and pursue moral virtues, disciplines, and arts without the special help of God, who in his goodness bends the will and supplies strength.</p></blockquote>

<blockquote><p>Id circo Apostolus aperte ait, vitam aeternam esse donum Dei. Praeterea, etiam si detur, bona opera aliquo modo causas esse, propter quas recipiamur in possessionem aeternae vitae ex Dei liberalitate, quatenus scilicet unum Dei donum causa est alterius, praecedens insequentis (quemadmodum alias declarauimus) ut vocatio iustificationis, iustificatio glorificationis: tamen nullo modo dici possunt causa electionis ac praedestinationis ad aeternam vita: cum sint eius effecta, et cum nullam posterius causa esse possit efficiens prioris.</p></blockquote>

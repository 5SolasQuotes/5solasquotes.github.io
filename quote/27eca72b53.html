</figure><figure class="quote" id="q-23cb3ef646" data-kw="">
<blockquote><p>A guiding presupposition [of Matthew Barrett’s The Reformation as Renewal] is that the intellectual life of the second half of the thirteenth century was ‘characterized by a Thomistic atmosphere’ and that the later medieval theologians progressively fell away from the classical positions affirmed by Aquinas. Indeed, according to Barrett it was this degeneration away from Thomism in the later middle ages that was a significant catalyst for the Reformation. As soon as this presupposition is outlined, however, it is possible to see that Barrett’s account has, at the very best, an outdated view of later medieval thought. This kind of ‘decline’ narrative has not been maintained by experts in the thought of the period for many years, despite its persistence among historians whose direct acquaintance with scholastic texts ends with the death of Aquinas. The reason is that, outside the Dominican order (and, for that matter, inside it too at least until the middle of the fifteenth century), there never was a ‘Thomistic atmosphere.’ Why it was ever believed that there was one is not clear to me. But it is true to say that we do not pervasively find the kind of narrative Barrett reproduces until after Leo XIII’s Aeterni patris of 1879, and it is hard to avoid the conclusion that this encyclical itself had something to do with bringing about the anachronistic centering of Aquinas in our medieval intellectual history. This was no doubt an unintended consequence of Leo’s action, since it is clear enough that Leo’s motivation had to do with an appraisal of Aquinas’s intellectual weight, not of his influence on later medieval theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Accidental Reformation?’ in Hanover Review</cite>, 3.1 (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>5. …And certainly, the nature of first principles requires that they not be proven, but taken for granted. 6. That habit or natural intellectual power (…since the natural power of the intellect itself, both practical and speculative, suffices [for the innate knowledge of God]; which is to establish its necessity with Thomas Aquinas in his 1st book of the Sentences, dist. 21, ad 1) comprehends the truth of principles immediately, without reasoning or proof, by a kind of simple intuition. It grasps partly theoretical principles and partly practical ones. Among the particular theoretical first principles, I place first and formost: ‘God exists’; and among the practical first principles, first and foremost: ‘God ought to be worshipped.&#x27;</p></blockquote>

<blockquote><p>The overall chain of argument, then, goes something like this: Pure reason proves through philosophical arguments that there is a God and that we have immortal souls. This by itself entails that a miracle like a resurrection from the dead is possible. Now the historical evidence that Jesus Christ was in fact resurrected from the dead is overwhelming when in interpreted in light of that background knowledge. Hence pure reason also shows that Jesus really was raised from the dead. But Jesus claimed to be divine, and claimed that the authority of his teachings would be confirmed by His being resurrected. So the fact that He was resurrected provides divine authentication of His claims. Hence reason shows that He really was divine… Of course some of those teachings [of Christ] are taken on the basis of authority, but the point is that the trustworthiness of that authority is something that, it is claimed, can be established by reason.. We can know such-and-such a teaching was true because Christ taught it… and a divine being cannot be in error… Every link in the chain is supported by argument… All I am interested in doing here is sketching out the general strategy that Christian theology has traditionally used in justifying its doctrinal claims, and the point of doing so is to understand where faith fits into the picture… So how does it come into play? This way… suppose that the general strategy just sketched can be successfully fleshed out. Then it follows that if you are rational you will believe anything Christ taught; indeed, if you are rational you will believe it even if it is something that you could not possibly have come to know in any other way, and even if it is something highly counterintuitive and difficult to understand. For reason will have told you that Christ is infallible, and therefore cannot be wrong in anything He teaches. In short, reason tells you to have faith in what Christ teaches, because He is divine. And that is at bottom what faith is from the point of view of traditional Christian theology: belief in what God has revealed because if God has revealed it it cannot be in error; but where the claim that He revealed it is itself something that is known on the basis of reason. Faith doesn’t conflict with reason, then; it is founded on reason and completes reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (Southbend, IN: St. Augustine’s Press, 2008), pp. 155-157</span></figcaption>

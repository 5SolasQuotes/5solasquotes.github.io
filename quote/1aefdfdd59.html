<blockquote><p>Furthermore here, by this that we hear his [Adoni-Bezek’s] cruelty, thus laid out by his own mouth, that he had played the tyrant against many, and those no meaner persons then Kings, to cut off the thumbs of their hands and feet, and not to some few of them, but even seventy persons; we see what a raging fury this vice of cruelty is, and to what depth of evil it carrieth men, that do not wisely consider the foulness and shamefulness of it. For whereas one man should be sociable with another, yea with strangers, if occasion be offered, (seeing everyone is our neighbour,) this cruelty cutteth of all fellowship, nay all liberty of enjoining such benefits of peace, goods, or the like.

So that the cruel man is far worse then the thief, who (yet) is odious, and driven from habitation with men in their free dwelling houses, into a loathsome prison among brutish companions. For he, unless he be cruel also, is content to take a share in his goods, whom he robbeth; but the cruel man is not content with a share, but if his might be suitable to his mind, he will have all, at one time or other, that is his whom he pursueth, yea he will thrust him out of house and home, yea, and out of the world also, before he can be satisfied.

Cain, a little after the corrupt estate of things entered into the world, was a pattern of cruel ones, who when he had no cause given him by Abel his innocent brother, of hard handling him; yet because he was accepted of God, and himself not, did not hate him only without a cause, but which was most unnatural and monstrous in him, rose up against him, and slew him. Pharaoh, when he had almost tired the poor people of God, who were strangers in his land, with burdens and toile as much as they could bear; yet was not satisfied therewith, but made their burden far greater, ‘til their life was more unwelcome then death itself, that his cruelty might be manifest to all. Haman so exceeded herein, that it was too little to take the goods of God’s people from them, and to hold them bondmen, unless he might have their lives also.

And what should I speak of Jezebel, who being a woman, exceeded men who were cruel also? And of Rehoboam’s cruel handling his subjects, as his story declareth, and of Joseph’s brethren, who consented to sell him into a far country, whence he might never return to trouble them, as they hoped, but further, the most of them agreed to take away his life also, and yet if they had killed him, even they themselves had lost their lives also in the famine that God sent afterwards, they being preserved by Joseph among all other men.</p></blockquote>

<blockquote><p>No logical Christian mind can avoid the suspicion that the first principles of the true doctrine touching the relation of the temporal and spiritual powers must have very generally fallen out of the consciousness of Christendom, as he contemplates the singular fact that, after 1800 years of experiment, the whole question seems as unsettled as ever; and that all parts of Chistendom alike are still divided and agitated by antagonistic theories on the subject. In Papal countries, everywhere, he finds the old contest going on as keenly as ever, between the various theories of Ultra-montanism which makes the State a creature and subject of the Church, and of Cis-Montanism which make the Church the creature and subject of the State. He finds the continental Protestantism aroused to new vigor in the 19th century, in the conflict between the various forms of the old Zuinglian, semi-Erastian theories, which ignore the separate and independent existence of the Church, and the new theories of the school of Hegel, that the Church is but an incidental and temporary aid to the state in developing its moral ideal of a religious Commonwealth or theocracy—that, as Strauss hath it, “The Church is but the crutch of the State,” the theories of the school of Stahl and Klieforth that the Church (not the congregation, but the incorporated officers and orders of the church) constitutes a government above the state; or of Schleiermacher, contending for the co-existence of the Church and state. In Great Britain, independent of various semi-Erastian denominations of Dissenters, he finds the Anglican Church agitated by earnest conflict between the theories of the Lords in council and the lawyers, that the Church is merely a head servant of the Crown, incompetent to dismiss even her infidel servants from the priesthood, except at the bidding of the Crown; the Broad Church theories of Arnold, ignoring the separate existence of the Church, and, with Hegel, contemplating the Church as a temporary means employed by the state in the process of developing its ideal of a Christian state; and the theories of the school of Palmer, claiming the independence of the church, and at the same time, support from the revenues of the state. In Scotland, he finds the descendants of the Covenanters divided between the theories of both state support and submission to state dictation by the Church; of support from the state without submission to state dictation, and of neither Support nor dictation by the state to the Church. And even the yearnings after ecclesiastical union between the evangelical bodies whom the secularism of state support and dictation has driven out of the state Church at various eras, are seriously impeded in giving effect to these Christian truths by grave dissension’s on the theoretic question whether the Church may not sell her birthright for the state’s “mess of pottage!” But, what is more remarkable still, he finds the American Churches, whose boast it has been for near 100 years that here at last the Church’s independent existence has been recognized by the civil power, apparently eager to assume the secular yoke again as if tired of their liberty, to engage in the service of Caesar, and shout with the mob “We have no king but Caesar!” And, in consequence of this tendency, they are agitated by conflicts similar to those of the churches under the state yoke, between the theories—First, of what may be called the Virginia, or Scoto–American school, denying any connection or coordinate jurisdiction in spirituals or temporals between the State and the Church; the theories of the New England school claiming the Church as one of the agencies fostered by the State for secular purposes and to develop the Christian state; and the theories of what may be called the Galliio school of entire indifference to the whole question of what the relation of Church and state which so agitates all Christendom.</p></blockquote>

<blockquote><p>Why is it right to defend ourselves against unlawful violence?

Self-defence against unlawful violence is always legitimate. It is more than legitimate: it is a moral obligation. Our life is not our own; it belongs to God, and therefore as stewards of God’s possessions we are under obligation to preserve our own life, and the lives of others, from destruction by criminal violence. The principle that necessary self-defence is legitimate is generally upheld by the civil laws of nations.

To claim that the “Golden Rule,” or the obligation to love our neighbour, means that it is wrong to kill in an effort at self-defence is to push loving our neighbour to an absurd and fanatical extreme. The Scripture commands a person to love his neighbour as himself: that is, love for one’s neighbour is to be kept in balance with a proper love for oneself. The person who will let himself be murdered by a criminal, without attempting self-defence, loves his neighbour too much, and does not love himself enough.</p></blockquote>

</figure><figure class="quote" id="q-6fd9ace109" data-kw="">
<blockquote><p>Anyone who has spent any real time among those influenced by the Religious Right in America will know that they hate the thought of anything being “socialised”. Our Reformed forebears, however, did not share this antagonism. They realised that society, not just the individual, was held accountable by God for observing the moral law. That is why the Reformers “socialised” care for the afflicted and education, because the law of God commands the nations to promote these things. (No, this is not “communism”. The Reformers did not advocate wealth equalisation or even the inherent virtue of public ownership of the means of production, but they did recognise that citizens were to contribute to the common good. Consequently, the Reformed position is rightly described as Social Theocratic, and not communist in any real sense of the word.) Since the law applies to society, they entered into social covenants to observe the commandments of the Lord. Notwithstanding the emphasis of modern theonomists on returning to the Old Testament law, not many of them have advocated social covenanting – even though social covenanting has not been abrogated in the New Testament. This is another sorry example of them preferring Mises to Moses. By way of contrast, Samuel Simms demonstrates that social covenanting remains obligatory upon modern societies:

176. What are some of the approved examples of Covenanting in the Old Testament times, to which you refer?

The Old Testament abounds with such examples. The children of Israel, in their national and ecclesiastical capacity, entered into a public, social Covenant at Mount Sinai, after their deliverance from Egypt. (See Exod. xix., xx., xxi, xxii., xxiii., xxiv.) That there was a national Covenant entered into by the Israelites at Sinai few will deny. “The words which the Lord commanded” were “laid before” the people, and “all the people answered together, and said, All that the Lord hath spoken we will do” (chap. xix. 7, 8); and the transaction is spoken of as a “Covenant,” chap. xxiv. 7, 8) […]

180. What is the nature of the argument for Covenant drawn from the New Testament?

It is threefold. First, the New Testament does not abrogate the ordinance; secondly, there are in the New Testament certain general principles which afford a strong presumptive proof in support of the doctrine; and, thirdly, the New Testament contains passages directly bearing on the subject.</p></blockquote>

<blockquote><p>The ceremonial law is that which prescribes rites and orders in the outward worship of God. It must be considered in three times. The first is time before the coming death of Christ: the second, the time of publishing the gospel by the apostles: the third, the time after the publishing of the Gospel. In the first, it did bind the consciences of the Jews, and the obedience of it was the true worship of God. But it did not then bind the consciences of the Gentiles, for it was the partition wall between them and the Jews. And it did continue to bind the Jews till the very death and ascension of Christ. For the hand writing of ordinances that was against us was nailed on the cross and cancelled. And when Christ says that the prophets and the law endured till John, Luke 16:16, the meaning is not that the ceremonial law ended then: but that things foretold by the prophets and obscurely prefigured by the law, began then more plainly to be preached and made manifest. The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which, ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy; the apostles after Christ’s ascension, as occasion was offered were present in the Temple, Acts 3:1; And the council of Jerusalem [Acts 15], tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel; ceremonies of the Jews’ Church became unlawful, and so shall continue to the world’s end. By this it appears what a monstrous and miserable religion the Church of Rome teaches and maintains, which stands wholly in ceremonies, partly heathenish and partly Jewish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, ... (Cambridge, 1596), pp. 19-22</span></figcaption>

<blockquote><p>Besides, there were in the first churches continued for a while certain extraordinary gifts, that had their effects visibly on the outward senses of men, and tended not immediately unto the edification of the church in their faith, but unto the conviction of others, and vindication of the authority of them by whom the gospel was preached and propagated. Such was that gift of healing the sick, which being an especial effect of the Holy-Ghost for the advantage of the Church in those days, in some places it was accompanied by anointing with oil; but this being no universal practice, and used only in the exercise of a gift extraordinary, whose use and being are long since ceased, it never was appointed nor intended to be of continuance in the Church, which is not tied by the Lord Christ to the empty signs and shadows of things whose substance is not enjoyed: besides, no spiritual grace of the Covenant was ever intimated, sealed, or exhibited by that usage of anointing with oil. The first mention of it is, Mark 6:13 where its practice is reckoned among the effects of that extraordinary power which the Lord Christ committed unto his twelve disciples on their first sending out, and is referred unto the same series of miracles which they wrought in pursuit, and by virtue thereof, they cast out many devils, and anointed with oil many that were sick, and healed them. And by what is there recorded, the subsequent mention of it, James 5:14 is to be regulated, but now unto a real evangelical institution of worship, it is required: (1.) That it be a command of Christ manifested by his Word, or example proposed unto our imitation, Mt. 28:20. (2.) That it be given and enjoined unto the whole Church with the limitation of its administration expressed in the Word, 1 Cor. 11:25. (3.) That unto the due performance of it, Gospel grace be required in them that attend unto it. (4.) That it teach, or represent, or seal, or improve some grace of the Covenant, and have a promise of acceptation annexed unto it, and whatever is thus appointed, the Church is indispensably to continue in the observation of, unto the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Short Catechism on Worship</cite>, Question #13 1667 For the fuller context, see Owen above on the holy kiss, which section immediately precedes this section.</span></figcaption>

<blockquote><p>To these may be added dances (but the dances of pious girls must be separate from the dances of young boys) which may be danced to pure and holy songs (Plato, Laws II, 654 ff.), with chaste and modest motion befitting those who profess piety, as Miriam, the sister of Moses, danced and the matrons of Israel when they had crossed the Red Sea and sang the praises of God for such a wonderful delivery of their nation from the slavery of Egypt (Ex. 15:20-21). Such was the dance of the holy girls who celebrated David and Saul in a song of victory when they returned from the slaughter of the Philistines (1 Sam. 18:6), the kind of dance the Holy Spirit requires in Ps. 149:3 and 150:4 when he says, ‘Praise the Lord with timbrel and dance.’ … In pious singing, therefore, we are reminded of these gifts from such an immense goodness of God. And should the spirit not rightly leap with joy and gladness and excite the body to bear witness to this joy and impel it to express this gladness, by action, however, becoming to every age and nation? Certainly a deeper recollection of divine blessings strongly moved David, although he was a king, when he was bringing in the Ark of the Lord, so that he danced before it (II Sam. 6:12-15). He was a Palestinian, I admit, of a nation far more emotional and uninhibited than our European people. But since our young people delight in dancing, why are such dances not introduced among us too, who have become citizens of heaven through the blood of Christ, so that they spring forth from a pious and holy exultation of the mind over the goodness of God and strengthen and increase that exultation and inflame the spirit with a desire for all piety? … For this reason, no singing nor any kind of dancing should be allowed, either privately or publicly, which has not been approved by wise and religious men to whom this responsibility will be referred by Your Majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Reign of Christ, bk. 2, ch. 54, ‘Honest Games’ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), pp. 347-48</span></figcaption>

<blockquote><p>3. Immodest spectacles: lascivious representations on a stage, wanton places, amorous books, etc.

4. Lewd company, which is as pitch: touch pitch and it defiles. This is it which the wiseman intends about fire, Prov. 6:27-28, Young mens and maids dalliance: so husbands and wives of others, without just cause, are occasions of whoredom and adultery. … 6. Lascivious dancing and masking, Mt. 14:6-7.</p></blockquote>

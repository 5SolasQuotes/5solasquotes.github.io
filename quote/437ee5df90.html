<blockquote><p>True, God makes us willing of unwilling, and so we resist not. But how does He make us willing? Whether by an irresistible manner of working in us, or not, this, say the opponents, is the main question. Surely so, as that, to use Aquinas his word, the will is impelled, though not compelled; so as that, though there is in the nature of the will a freedom and capacity of agreeing or dissenting, in respect of itself, yet as it is for the present moved and actuated by the effectual inclination of the Almighty, now it so sways one way as if it had for the time put off the power of refusing. What need we then trouble ourselves with these upstart terms of ‘resistible’ and ‘irresistible’? Let it content us that the gracious in-operation of God effectually draws the heart of man to will, to receive, to entertain the happy motions of his good Spirit to our renovation. If we yield not this to God, we yield nothing; and if we give Him this, He will not quarrel us for more. But what place soever these differences have found in foreign schools and pulpits, ours have reason to be free, if we shall listen to that wise and moderate voice of our [Anglican] Church, which our forecited reverend author [Bishop Overall] commends unto us, who, after the relation of the two extreme opinions, rests in this, medio tutissimus: that men are so stirred and moved by grace that they may, if they attend thereunto, obey the grace which calls and moves them; and that they may, by their free will, also resist it. But withal, that God, when He will, and to whom He will, gives such an abundant, such powerful, such congruous, otherwise effectual grace, that although the will may, in respect of the liberty thereof, resist, yet it resists not, but does certainly and infallibly obey; and that thus God deals with those whom He has chosen in Christ so far as shall be necessary to their salvation. Who so cannot sit down quietly in this decision, methinks, should be no friend to peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall… (d. 1656; London: Cadwel, 1660), 5th Article, ‘Of Perseverance’</cite>, pp. 383-84</span></figcaption>

<blockquote><p>Davenant recognized that if God wills the means of salvation to be procured for the reprobate, then God’s intention to save appears thwarted. Does this not imply that God’s will is ineffectual because of God’s universal desire to save all? Davenant responds to God’s apparent impotence by noting that God oftentimes obtains (and sometimes actually grants) the means to an end wherein the end is never attained. Davenant appeals to the scholastic distinction between providence and predestination employed by Aquinas. (Davenant, De Morte Christi, in DD, 23 (370); Davenant, Sententia de Gallicana controversia, in DD, fol. Ii4v. Cf. Aquinas, [Disputed Questions,] De Veritate, in CT, q. 6 [on Predestination] a. 2 co. [actually art. 3, body]) Providence is a general appointment of a thing toward an end (universaliter ordinationem in finem), whereas predestination represents the outcome or result of an ordering (exitum vel eventum ordinis). Predestination differs from providence in that “not everything that is ordained to an end [as in providence] reaches that end.” (Aquinas, De Veritate, in CT, q. 6 a. 2 co. [actually art. 3, body]) Like providence, then, the evangelical covenant is grounded upon an ordination to an end that does not infallibly obtain. God has ordained that Christ make a universal satisfaction on condition of belief, which condition being not always fulfilled, necessitates that not all are forgiven. This evangelical covenant, which displays the “freedom, mercy, and justice of God,” is made, consonant with God’s general love for mankind, between humanity and God promising the saving benefits of Christ to those who repent and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021)</cite>, p. 138</span></figcaption>

<blockquote><p>3… But more especially the Holy Ghost is compared to a wind in respect of its irresistable workings; as nothing can resist the wind, it goes and blows which way soever it will; so nothing can resist the Spirit of God, wheresoever it has a purpose to work efficaciously; I will not say, but the heart of a man may resist and reject the work of the Spirit in some measure, and in some degrees; Stephen told the Jews, they had always resisted the Holy Ghost (Act. 7:51); and the apostle tells of strong holds, and of every high thing that exalts itself against God (2 Cor. 10:5); so there is a natural contrariety, a constant enmity and active resisting of God’s Spirit by our spirits; we must therefore distinguish between a prevalent and a gradual resisting; the Spirit in conversion so works that He takes away the prevalent, but not the gradual resisting; A man before he be converted is froward, and full of cavils and prejudices; he is unwilling to be saved; he cannot abide the truth; he does what he can to stifle all good motions: yet if he belong to the election of grace, God will at last over-master his heart and make him of unwilling, willing; He will omnipotently bow and change the will and work on his soul by his mighty power efficaciously, insuperably and irresistably.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3… But more especially the Holy Ghost is compared to a wind in respect of its irresistable workings; as nothing can resist the wind, it goes and blows which way soever it will; so nothing can resist the Spirit of God, wheresoever it has a purpose to work efficaciously; I will not say, but the heart of a man may resist and reject the work of the Spirit in some measure, and in some degrees; Stephen told the Jews, they had always resisted the Holy Ghost (Act. 7:51); and the apostle tells of strong holds, and of every high thing that exalts itself against God (2 Cor. 10:5); so there is a natural contrariety, a constant enmity and active resisting of God’s Spirit by our spirits; we must therefore distinguish between a prevalent and a gradual resisting; the Spirit in conversion so works that He takes away the prevalent, but not the gradual resisting; A man before he be converted is froward, and full of cavils and prejudices; he is unwilling to be saved; he cannot abide the truth; he does what he can to stifle all good motions: yet if he belong to the election of grace, God will at last over-master his heart and make him of unwilling, willing; He will omnipotently bow and change the will and work on his soul by his mighty power efficaciously, insuperably and irresistably.”

— Isaac Ambrose, Looking unto Jesus… (d. 1664; London: Chiswel, 1680), bk. 8, Ascension, ch. 1, sect. 9, ‘Manner how the Holy Ghost was sent’, p. 488">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3%E2%80%A6+But+more+especially+the+Holy+Ghost+is+compared+to+a+wind+in+respect+of+its+irresistable+workings%3B+as+nothing+can+resist+the+wind%2C+it+goes+and+blows+which+way+soever+it+will%3B+so+nothing+can+resist+the+Spirit+of+God%2C+wheresoever+it+has+a+purpose+to+work+efficaciously%3B+I+will+not+say%2C+but+the+heart+of+a+man+may+resist+and+reject+the+work+of+the+Spirit+in+some+measure%2C+and+in+some+degrees%3B+Stephen+told+the+Jews%2C+they+had+always+resisted+the+Holy+Ghost+%28Act.+7%3A51%29%3B+and+the+apostle+tells+of+strong+holds%2C+and+of+every+high+thing+that+exalts+itself+against+God+%282+Cor.+10%3A5%29%3B+so+there+is+a+natural+contrariety%2C+a+constant+enmity+and+active+resisting+of+God%E2%80%99s+Spirit+by+our+spirits%3B+we+must+therefore+distinguish+between+a+prevalent+and+a+gradual+resisting%3B+the+Spirit+in+conversion+so+works+that+He+takes+away+the+prevalent%2C+but+not+the+gradual+resisting%3B+A+man+before+he+be+converted+is+froward%2C+and+full+of+cavils+and+prejudices%3B+he+is+unwilling+to+be+saved%3B+he+cannot+abide+the+truth%3B+he+does+what+he+can+to+stifle+all+good+motions%3A+yet+if+he+belong+to+the+election+of+grace%2C+God+will+at+last+over-master+his+heart+and+make+him+of+unwilling%2C+willing%3B+He+will+omnipotently+bow+and+change+the+will+and+work+on+his+soul+by+his+mighty+power+efficaciously%2C+insuperably+and+irresistably.%E2%80%9D%0A%0A%E2%80%94+Isaac+Ambrose%2C+Looking+unto+Jesus%E2%80%A6+%28d.+1664%3B+London%3A+Chiswel%2C+1680%29%2C+bk.+8%2C+Ascension%2C+ch.+1%2C+sect.+9%2C+%E2%80%98Manner+how+the+Holy+Ghost+was+sent%E2%80%99%2C+p.+488&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d4d0791d2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d4d0791d2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=But%20more%20especially%20the%20Holy%20Ghost,mighty%20power%20efficaciously%2C%20insuperably%20and%20irresistably&amp;text=But%20more%20especially%20the%20Holy%20Ghost%20is%20compared&amp;text=by%20his%20mighty%20power%20efficaciously%2C%20insuperably%20and%20irresistably" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life. 10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish. 11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Mt. 19:23–26, compared with Eph. 1:19; Prov. 21:1; Rom. 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.</p></blockquote>

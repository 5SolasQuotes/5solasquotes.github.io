<main class="wrap"><figure class="quote" id="q-455255632b" data-kw="">
<blockquote><p>Therefore St. John rejects a false and feigned faith; he demands a genuine faith which will openly confess before the world the two things it has learned, namely, that Christ is the Son of God and of Mary and that He became our Savior. If this Christian confession stands, other good works will follow. If you were a fornicator, an adulterer, or a drunkard, you will now be that no longer; for if you are redeemed from sin, you will henceforth desist from sin. Consider how you could harmonize a sinful life, greed, anger, hatred, and fornication with a claim to Christianity. No faith can exist where sin abounds. You must cease your fornication and marry; you dare not steal or bear false witness against your neighbor. If you do wallow in sin and commit adultery, unchastity, fornication, gluttony, carousing, and gambling, you are not yet redeemed from sin. For wherever sin still holds sway, there is no forgiveness of sin and no faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 22: Sermons on the Gospel of St. John: Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Saint Louis: Concordia Publishing House, 1999), 393–94.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore St. John rejects a false and feigned faith; he demands a genuine faith which will openly confess before the world the two things it has learned, namely, that Christ is the Son of God and of Mary and that He became our Savior. If this Christian confession stands, other good works will follow. If you were a fornicator, an adulterer, or a drunkard, you will now be that no longer; for if you are redeemed from sin, you will henceforth desist from sin. Consider how you could harmonize a sinful life, greed, anger, hatred, and fornication with a claim to Christianity. No faith can exist where sin abounds. You must cease your fornication and marry; you dare not steal or bear false witness against your neighbor. If you do wallow in sin and commit adultery, unchastity, fornication, gluttony, carousing, and gambling, you are not yet redeemed from sin. For wherever sin still holds sway, there is no forgiveness of sin and no faith in Christ.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39efa5d0a2" data-kw="">
<blockquote><p>21… But the most of our acquaintance [being parish ministers in England in the 1650’s, under Cromwell] were peaceable, moderate men that thought several parties [of various views of Church government] had somewhat of the right, and that the points of difference were so few and small that they might well live in peace and love, and that none of the parties was so right as that in all things they should be followed, and others trod down to set them up: And many of these were young men that, being at the schools, had not been engaged in the first quarrels [in the 1640’s and before], and desired not to side with any dividing parties, and modestly professed that they had not maturity enough to study themselves to any great confidence in the controversies [about Church government]. 22. This last sort of men beginning in Worcestshire set on foot a work of reconciling [an] Association, in which the Episcopal, Presbyterians and Independants agreed to practise so much of Church government and ministration as they were all agreed in, with mutual love and assisting concord, and to forbear one another in the rest, till God should bring us nearer (and after[wards] they added another agreement, to catechize every person in their parishes old and young that would come to them, or receive them thereto, and personally to instruct and exhort them about the practicals of religion, and preparation for death and the life to come). This example was presently followed by the ministers in Cumberland and Westmorland, Wiltshire, Dorsetshire, Essex, and going on in other counties, till the confusions [of] 1659 interrupted it [when Cromwell died], and the return of the prelacy [in 1662] ended it and many such endeavors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), section 7, pp. 130-31</span></figcaption>

</figure><figure class="quote" id="q-9b2bfcd600" data-kw="">
<blockquote><p>It is a radical [root] principle of our system ‘that a larger part of the Church, or a representation of it, should govern a smaller, or determine matters of controversy which arise therein.’… This is of the essence of Presbyterianism. It is involved in the declaration that the Church is to be governed not only by congregational and presbyterial, but also by synodical assemblies; and more expressly in the declaration that synods have authority ‘to redress whatever has been done by presbyteries contrary to order.&#x27;</p></blockquote>

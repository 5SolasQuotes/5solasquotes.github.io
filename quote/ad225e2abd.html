<main class="wrap"><figure class="quote" id="q-ad225e2abd" data-kw="">
<blockquote><p>Elders not teaching but governing are distinguished from pastors or teaching elders. The institution of those is divine because Christ commanded that one or two more prudent be summoned for the refutation of the brother sinning, and the church for those who have not listened—that is, “more” (πλείονας) should be approached (2 Cor. 2:6; Matt. 18:16, etc.). “Having gifts … whether ministry by ministering or teaching by teaching,” and “the one who leads (ὁ προϊστάμενος) leading with devotion” (Rom. 12:6–8).

Elsewhere “those administering” (κυβερνήσεις) are mentioned as distinct from those teaching (1 Cor. 12:28). Paul above all makes this point clearly: “Those who lead, elders, are worthy of double honour, especially those who labour in word and teaching” (1 Tim. 5:17). Their office agrees with the office of pastors, except that they neither teach nor dispense the sacraments. They rule the church concerning another common counsel, and “presiding over” (περιοδευταὶ) (Ezek. 39:14), they surround and watch over all and exercise refutation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, trans. Casey Carmichael, Classic Reformed Theology, vol. 4 (1697; Grand Rapids MI: Reformation Heritage Books, 2019), XXVII.VIII, Kindle Locations 4307-4315.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<blockquote><p>3. That the Fraternity only, and no women, gave their tacit [understood or implied without being stated] consent to the choosing of Matthias (Acts 1), of the deacons (Acts 6), of the elders (Acts 14:23), since their consciences were concerned and they are parts of the fed and redeemed Church as well as men, can never be proved; and who can deny women to be of the plebs, people and fraternity, as Cyprian speaks? and of the brethren that Paul, James and the apostles wrote unto?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 307</span></figcaption>

</figure><figure class="quote" id="q-a3ebbade9d" data-kw="">
<blockquote><p>After this sixthly, he names ordinary offices and gifts, viz. helps, or the office of Deacons, whose work it was to see to the maintenance of Ministers, and the necessities of the Saints, and the dispensation of the public revenues of the Church: which office, though it may seem the meanest, it appears to be in no small account, and imposed not upon men of inferior rank, but upon those that were of tried fidelity, and the more able, or men of fairest estate, as vers. 22, 23, 24.

And that for the necessary use of it; for without the help of this office, the work of the Ministry would be much hindered, for had there not been helps or Deacons, who undertook the care of collecting the stipends, that the Ministers might more freely attend the work of the Lord: It is necessary that the Ministers with the Levites, Nehem. 13. to whom a designed portion was not given, should betake themselves to their fields, and their work, or secular businesses, and also to Law-suits, being debarred of their due allowance, they might lose their zeal of labouring in the Lord’s Vineyard, or the fruit of their labours.

After these (unless perhaps there was no difference touching these inferior offices) the Apostle is not solicitous any further about the order; He names Governors, or Ruling Presbyters, who take notice of the peoples manners, and as presidents with the Pastors and Teachers, with the Ecclesiastical Assembly attend to the removing of scandals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 61.</span></figcaption>

<blockquote><p>This we are taught by the rites of the old Testament, where, by God’s commandment, Aaron and his children were openly chosen into the holy ministry, all the people looking on. Neither let it trouble us, that Paul seemeth to give authority to Titus and Timothy to choose Bishops. For he would not have them of their private authority to do anything, but according to the duty of Superintendents, to take heed that such as were worthy and meet, might be chosen for Ministers. And it is not likely, that they had more granted to them, than the Apostles had, which without the Church’s counsel, would never do anything in this matter. For not long after they chose Deacons openly before the congregation, and Paul and Barnabas by election ordained Elders in every congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An hundred, threescore and fifteen Homilies or Sermons, upon the Acts of the Apostles, written by Saint Luke</cite>, trans. John Bridges (London: Henry Denham, 1572), p. 67.</span></figcaption>

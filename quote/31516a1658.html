<main class="wrap"><figure class="quote" id="q-31516a1658" data-kw="">
<blockquote><p>Why does Mr. [Thomas] Hooker [a congregationalist] give this new [type of] Church [a congregationalist church,] a Latin name, ‘The Fraternity’, that is, a Church of redeemed ones built on the Rock, made up of brethren and no sisters? Ah! are women, servants, aged children, nor redeemed, not built on the Rock? So is there a Gospel-instituted Church described. The word [in Greek], as Stephanus tells us, is only twice in the New Testament: 1 Pet. 2:17, ‘Love the brotherhood’, that is, the company of the brethren, say Mr. Leigh, Beza, Calvin, English Annotators. ‘The company of the brethren’, Lorinus; ‘The Church’, Esthius; the brethren by regeneration, and new birth. So Piscator, the brethren that are regenerated; as ‘the nobility’ is put for the nobles. Let any man judge, if name or thing [as signifying only males] be so much as hinted at, when Paul and the rest of the apostles exhort the brethren, Jam. 5:12, ‘My brethren, swear not’, does he not forbid women to swear?… Yea, and when Paul determined to come to the brethren at Rome, Rom. 1:13-14, to whom he was debtor to preach the Gospel, came he only as such a debtor to brethren of a single congregation [as in congregationalism]? or only such brethren of a single congregation justified by faith? are they only no debtors to the flesh? Rom. 8:12 &amp; 7:1 &amp; 10:1 &amp; 7:4, ‘Wherefore my brethren, ye are become dead to the law by the body of Christ’: are not women dead to the law through Christ? See Rom. 8:12; 1 Cor. 1:10,26, and in many places of the Old and New Testament, if the Scripture mean only unofficed men by ‘the Fraternity’ and ‘Brethren’. Cyprian hath the word ‘Fraternity’, the whole Fraternity: but all that read him know, he means most ordinarily the whole Church and flock of men and women. And when it is taken for only men, it is brethren in office, Acts 10:23 &amp; 15:23, never for brethren of this new devised Church. Augustine useth it sometime for brethren in the Ministry, and so doth Basil and the Fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), pp. 285-86</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7196856abe" data-kw="">
<blockquote><p>All the officers of the New Testament both ordinary and extraordinary are designed and distinguished by their names, or compellations, as apostles, evangelists, presbyters, deacons. The extraordinary and superior have upon good reason the names of the ordinary and inferior common unto them, as the apostles are called ‘elders’ (1 Pet. 5:1). But this is not reciprocal, for the ordinary and inferior are never called by the names of the extraordinary and superior: the deacon is not called an ‘elder,’ nor the pastor by the name of the ‘apostle’ or ‘evangelist’. It is true that Barnabas is called an ‘apostle’ (Acts 14:4, 14) because he was an apostle [messenger] of Christ as Paul was. Titus and others and Epaphroditus are only called ‘apostles’ or messengers of the Church (2 Cor. 8:23; Phil. 2:25). Whence it must follow that the office of a bishop is not an office superior to the office of a pastor, since the name ‘bishop’ is common to the pastor; and that the office of a bishop and the office of a pastor are not different, but one and the same office, since the names are altogether common in all the places of the New Testament (Acts 20:28; Phil 1:1; 1 Tim. 3:2; 1 Pet. 5:1), and the Syriac Interpreter has translated the one by the other (Tit. 1:7). What reason can there be, while the officers are distinguished by their names and the names of ‘bishop’ and ‘pastor’ are common, but that the office of the bishop and elder is one and the same office; the one name signifying, sapientiae maturitatem [a maturity of wisdom], and the other Industriam curae Pastoralis [the industry of the pastoral oversight], says Beda.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered</cite>, (1641), pp. 3-4</span></figcaption>

</figure><figure class="quote" id="q-aca6ea0189" data-kw="">
<blockquote><p>Yea in favor of lay-elders he [Hugo Grotius] asserts (having argued them not to be of divine institution, yet):

1. That they may be lawfully instituted by sovereigns, or by the Church on their permission.

2. That it may be proved by Scripture that this institution is not displeasing to God.

3. That there are examples in pious antiquity, either of this same way, or one very near it.

4. That it is no contemptible benefit that by these elders may be received. But these [are] to exercise their office with several cautions:

1. Not claiming institution by divine precept.

2. Not usurping any of the power of the keys, nor of excommunication, further than excommunication belongs to the people (executively).

3. That the men be not unmeet.

4. Exercising no external jurisdiction but by public law.

5. Standing as mutable. Thus far Grotius.</p></blockquote>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8012655f8e" data-kw="">
<blockquote><p>To my mind the whole subject is to be decided not by the exegesis of any difficult passage in St. Paul’s letters, but by common sense, by expediency, and by a regard for the law of nature and by what the Church has found to be good in the past. Now, you may interpret those passages as you please, but is not this the fact, that the principle there laid down has been accepted as sound by the Church in all generations? Take even those Churches that have long admitted women to ordination on the same footing as men. Why is it that there is no tendency to increase the number of women as ministers? There must be some great and almost indefinable law of nature that is against the thing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clarence-e-mccartney.html">Clarence Macartney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Place of Woman in the Church’ in</cite>, ed. J.R. Fleming, Proceedings of the Eleventh General Council of the Alliance of Reformed Churches holding the Presbyterian System, held at Pittsburgh, 1921 (Edinburgh: Office of the Alliance, 1922), pp. 157-66</span></figcaption>

<div class="actions"><button class="copy" data-copy="“To my mind the whole subject is to be decided not by the exegesis of any difficult passage in St. Paul’s letters, but by common sense, by expediency, and by a regard for the law of nature and by what the Church has found to be good in the past. Now, you may interpret those passages as you please, but is not this the fact, that the principle there laid down has been accepted as sound by the Church in all generations? Take even those Churches that have long admitted women to ordination on the same footing as men. Why is it that there is no tendency to increase the number of women as ministers? There must be some great and almost indefinable law of nature that is against the thing…”

— Clarence E. McCartney, ‘The Place of Woman in the Church’ in ed. J.R. Fleming, Proceedings of the Eleventh General Council of the Alliance of Reformed Churches holding the Presbyterian System, held at Pittsburgh, 1921 (Edinburgh: Office of the Alliance, 1922), pp. 157-66">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+my+mind+the+whole+subject+is+to+be+decided+not+by+the+exegesis+of+any+difficult+passage+in+St.+Paul%E2%80%99s+letters%2C+but+by+common+sense%2C+by+expediency%2C+and+by+a+regard+for+the+law+of+nature+and+by+what+the+Church+has+found+to+be+good+in+the+past.+Now%2C+you+may+interpret+those+passages+as+you+please%2C+but+is+not+this+the+fact%2C+that+the+principle+there+laid+down+has+been+accepted+as+sound+by+the+Church+in+all+generations%3F+Take+even+those+Churches+that+have+long+admitted+women+to+ordination+on+the+same+footing+as+men.+Why+is+it+that+there+is+no+tendency+to+increase+the+number+of+women+as+ministers%3F+There+must+be+some+great+and+almost+indefinable+law+of+nature+that+is+against+the+thing%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Clarence+E.+McCartney%2C+%E2%80%98The+Place+of+Woman+in+the+Church%E2%80%99+in+ed.+J.R.+Fleming%2C+Proceedings+of+the+Eleventh+General+Council+of+the+Alliance+of+Reformed+Churches+holding+the+Presbyterian+System%2C+held+at+Pittsburgh%2C+1921+%28Edinburgh%3A+Office+of+the+Alliance%2C+1922%29%2C+pp.+157-66&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8012655f8e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8012655f8e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=To%20my%20mind%20the%20whole%20subject,nature%20that%20is%20against%20the%20thing&amp;text=To%20my%20mind%20the%20whole%20subject%20is%20to&amp;text=law%20of%20nature%20that%20is%20against%20the%20thing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. The Church is not made ministerial by us, without the body exclusively wholly (for Christ’s government is voluntary), nor ought any new thing to be concluded in our assemblies while the people hear of it: for if the Romans used rogare et suadere legem [to ask and persuade the law], and obtain the consent of the people thereunto, far more are they not to be acknowledged as Church-laws that are to be obtruded upon the godly against their will and knowledge; and much more if they be against the Word of God, and former godly acts with consent agreed unto by the Church; that is, whether the people consent or not, but yet without the body, whether they exercise acts of jurisdiction or not, for no act of jurisdiction is due to them; and to exclude the consent of women, no less interessed [interested] in practice of conscience than men, is to be Lord’s of their faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cad23babcc" data-kw="">
<blockquote><p>And now, before we close, let us once more entreat you who are unconverted to turn to Jesus. Could ministers but give you some faint idea of Christ’s willingness to save you! If any soul here can declare that it is willing to receive Christ, let it know that Christ is yet more willing to save and to bless. He does not wish you to remain an hour longer a stranger to his love. Why did He suffer? Why did He die? Oh! not merely that He might be glorified in your destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-c-burns.html">William C. Burns</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of William Chalmers Burns</cite>, ed. Parisis &amp; Link (†1868; 2011), ch. 18, pt. 5, The Secret Place, p. 186</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>…for God inclines more to show mercy than to punish: therefore when He punishes, He is said facere opus non suum, Isa. 28:21. When He punishes, He punishes to the third and fourth generation; but He shows mercy to the thousandth generation, Ex. 20:6. Therefore it must be a greater sin to contemn his mercy than his justice.</p></blockquote>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject [who held to a universal atonement]. I think that the word ‘world’, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>

</figure><figure class="quote" id="q-b9629d077f" data-kw="">
<blockquote><p>III Proposition: In asking any spiritual gift we are encouraged by the bounty and mercy of God [as in Ps. 119:64]. David signifies both:

1. His bounty or benignity, or that free inclination which is in God to do good to his creatures.

2. His mercy respects the creature as affected with any misery. Mercy properly is a proneness to succour and relieve a man in misery notwithstanding sin. Now the larger thoughts of mercy, the more hope, partly because we have no plea of merit and therefore mercy is the fountain of all the good which comes to us from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm</cite>, … (London: T.P., 1681) | sermon 72, on Ps. 119:64, pp. 436-37</span></figcaption>

</figure><figure class="quote" id="q-45d5f9a9b5" data-kw="">
<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Practical Exposition Upon the Fifty-Third Chapter of Isaiah: the First Verse” in The Complete Works of Thomas Manton</cite>, (London: Nisbet &amp; Co., 1873), vol. 3, pp. 210–11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

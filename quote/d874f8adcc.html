<main class="wrap"><figure class="quote" id="q-d874f8adcc" data-kw="attributes not accidental">
<blockquote><p>Attributes are not ascribed to God properly as something superadded to his essence (something accidental to the subject), making it perfect and really distinct from himself; but improperly and transumptively inasmuch as they indicate perfections essential to the divine nature conceived by us as properties.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-35331571cc" data-kw="natural knowledge Romans 1">
<blockquote><p>The Scripture ascribes a knowledge of God to all nations in the world, Rom. 1:19; not only a faculty of knowing, but an actual knowledge: “manifest in them”; “they knew God”—not they might know him, they knew him when they did not care for knowing him. The notices of God are as intelligible to us by reason as any object in the world is visible; he is written in every letter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Existence of God</span></figcaption>

</figure><figure class="quote" id="q-273e5c17f4" data-kw="Jehovah self-existent">
<blockquote><p>God is both a being singular in the highest sense, and in his own nature distinct from every thing whatsoever. He is Jehovah, independent of any other, self-existent—“I am that I am” (Ex. 3:14). Hence he is called simply the being, as the ancient philosophers and Plato especially acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.4.1</span></figcaption>

</figure><figure class="quote" id="q-7eb132bfe3" data-kw="attributes essence">
<blockquote><p>The divine attributes are the essential properties by which he makes himself known to us who are weak and those by which he is distinguished from creatures; or they are those which are attributed to him according to the measure of our conception in order to explain his nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.5.1</span></figcaption>

</figure><figure class="quote" id="q-acf12c4772" data-kw="revelation nature Scripture">
<blockquote><p>God has condescended to reveal himself to us both in nature and in the Scriptures. First, that we may know that he is (with respect to existence) against the atheist. Second, that we may know what he is (with respect to his nature and attributes) against the heathen. Third, that we may know who he is (with respect to the persons) against the Jews and heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.1.1–2</span></figcaption>

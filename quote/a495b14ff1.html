<main class="wrap"><figure class="quote" id="q-a495b14ff1" data-kw="">
<blockquote><p>Article 1… the Sieur de la Milletiere… a fellow who would not submit himself unto their judgment and authority, and who has told the world that for these two last years he had no other intention than to incorporate himself into the communion of the Church of Rome, and to form a party against all the Reformed Churches, impugning with might and main the common confessions of all Protestants, perpetually accusing them of contemning the Catholic, that is, his Romish Church, and of schism from it, and propounding to them for the Rule of their Faith the Acts and Canons of the Council of Trent… But the said de la Milletiere having given it under his own hand in writing that he would submit himself unto the judgment of this synod; when as the commissioners, whom he himself had nominated, brought in their report… the Synod did once more refuse him, especially, because that he had fully opened his intentions, and in formal words declared that by that writing subscribed with his own hand, he never promised to submit his doctrine, but himself and person to the judgment of the Assembly; who taking, as in truth they could not but take this distinction, such an one as it was, in any other sense than a notorious scorn of their just and charitable endeavours for his eternal welfare; They told him plainly, that neither they nor any of their commissioners would waste a moment more of their precious time about him, and adjured him… to give Glory unto God, and to relinquish his most impious designs; and added farther, that they did as the National Synod of Alanson had done before them, declare, that for diverse years past he was not to be reputed a member of our Reformed Churches.</p></blockquote>

<blockquote><p>… Many other moderate passages I could show in our Assembly’s Confession to some that have need to imitate them, and the Antinomians may see their doctrine subverted in their excellent definition of saving faith, in both Catechisms and in the Confession; in their determination of the natural effects of sin in whomsoever, ch. 6, sect. 6, in their determination of the necessity of repentance (as sine qua non) to remission, ch. 15:3, with more the like. And now if they have any standing rule to know a Papist or Arminian, I think I have acquit myself from their accusation; But if there be no rule of the orthodox doctrine and for rejection of error but the giddy distracted brains of Libertines that know not where to fix themselves, then I am content to bear the name of Jesuit, Papist or what these men shall please to call me. Yet let me add this, lest my seeking to satisfy the offended may draw me into guilt; Though I have voluntarily myself professed my consent to these several canons and confessions of faith, yet, for the Synod of Dort, the Confession of our Assembly; yea, or the larger Catechism, without some correction, I do hereby protest my dissent against the so imposing them to a word upon all ministers, that no man that cannot subscribe to them shall be permitted in the Church: Whether our Confession were intended for such a necessary test, I know not well; But that the Synod of Dort was, is expressed in the end. I abhor unlimited liberty of conscience, so called, that is, of divulging intolerable doctrines; and I lament also that instead of moderation, the Churches for 1,300 years [since 300 AD] have been so guilty of proud and cruel tyranny. There is singular use for a full body of theology, or a profession concluded on by such reverend assemblies, that the younger ministers may be taught by it, and the reverence of it may restrain them from rash contradicting it: And there is a necessity of exercising power in ministerial assemblies, for the actual restraint of such as shall teach things intolerably unsound: and all ministers should be there accountable for their doctrine. But before any forms be tendered us to subscribe, we must have them reduced into a narrower room, and into phrase so clearly rational or Scriptural, as no sober, studious, competent, godly divine shall scruple: Call it Socinian, or what name soever imperious faction shall put upon it, yet tender consciences will expect this, and the Churches shall never have peace in any other way, unless I be a false prophet; and the contrary course does but tend to do the same in doctrine, as the Common Prayer Book did in worship, even to ensnare the most conscientious, and work them out of the ministry by degrees, and to create us insensibly a lazy formal ministry that will take all upon trust and run to the authority of their confession instead of their Bible. I have long feared that the toleration threatened in these times for all is a judgment of God for our running into the tyrannical extreme so long; and I withal hope that He will turn this judgment to a mercy. Though I dislike too much liberty in the commonwealth more than too little (and in the Church much more such toleration is intolerable, in cases of clear duty or sin), yet I fear tyranny more than too much toleration: 1. For experience sadly tells me that tyrannical usurpation of dominion over men’s faith has distracted the Church, even beyond any visible probability of recovery; and it has been the cause of its misery for 1,300 years; but the experience of the mischiefs of toleration is nothing so great. 2. And I know that man’s nature is so prone to proud domineering, and so idolatrously inclined to have all men of their mind, and to dance after their pipe, that it will be still by assing rulers to that extreme: So that it’s easy without a spirit of prophesy to foretell that unlimited tolerations will not long be granted by anyone except a mere infidel, that having no religion himself, cares for nothing but his own politic ends; or a Julian that is contriving the extirpation of religion, and intends by the tailing of foxes to fire the field of Christ rather than by the yoking of oxen to plow and sow it. And policy will never long work that way neither, without some persecution intermixed. It’s easy to prognosticate this to him that knows what the heart of man is. So that for my part, I think the cause of God’s permission of too much looseness in these times, is to cure our former rigor and our being righteous and orthodox overmuch, by suffering men to go as much too far into the contrary extremes. Little do some men lay this to heart, who only continue exclamations (though deserved) against toleration, when it is but their own disease and what they have caused, that God is curing by this sad remedy. They should rather see their sin in this glass and be humbled.</p></blockquote>

</figure><figure class="quote" id="q-0616ec9e74" data-kw="">
<blockquote><p>I have said elsewhere that the Westminster Divines, from their earnest desire to form one comprehensive Church, did not require subscription to their Directories for Public Worship and for Church Government, nor exact conformity to their minute details, as [Archbishop] Laud had done to those of the Prayer-Book and Canons. It may be doubted if the English section of them meant to require more for their Confession of Faith than that it should be (like the Irish Articles) the norm of public teaching. They felt with Baxter that ‘there is a singular use for a full body of theology or a profession concluded on by such reverend assemblies, that the younger ministers may be taught by it, and the reverence of it may restrain them from rash contradicting it; and there is a necessity of exercising power in ministerial assemblies for the actual restraint of such as shall teach things intolerably unsound, and all ministers should be there accountable for their doctrine.’ Such a full body of theology in a non-liturgical Church was essential as a guide in prayer as well as in preaching, and its authority as the norm of both was the least restriction that could be imposed if reasonable soundness was to be maintained, and due security given to the congregations that the liberty allowed in the devotional services should not degenerate into licence. Probably this was all that the majority of the English divines were disposed to insist on. At any rate a sentence of Tuckney often quoted, seems to point in that direction. ‘In the Assembly I gave my vote with others that the Confession of Faith, put out by authority, should not be either required to be sworn or subscribed to… but only so as not to be publicly preached or written against.’ I have not come on any clear trace of this vote in the Minutes of the Assembly, but possibly it occurred on or soon after 26th November 1646, when the Confession was completed, and about to be sent up to the Houses, and when it is recorded that ‘Mr. Nye, Mr. Carter junior, and Mr. Greenhill enter their dissent to the sending up of the Confession of Faith in order to the Preface,’ and is ordered that ‘before the Confession of Faith be sent up the Preface shall be debated and prepared to be sent up with it, if any be made.’ But so far as appears from the Minutes none was debated or sent up. The Church of Scotland, while agreeing with the English Divines as to the Directory of Public Worship, and Form of Church Government, has always required her ministers to regard the Confession of Faith as something more than the norm of teaching to which in their public ministrations they were to conform [this is not actually true, as the WCF was not enacted to be subscribed till 1693], and by the Act of the Scottish Parliament in 1693 she was sufficiently authorised to require more than this, including at least personal acceptance of its main doctrines, and of the sum and substance of the Reformed faith, as set forth in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-mitchell.html">Alexander Mitchell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix: “Subscription to the Confession” in The Westminster Assembly: its History &amp; Standards</cite>, (1884), pp. 511-12</span></figcaption>

</figure><figure class="quote" id="q-8e6b20902e" data-kw="Creeds below Scripture">
<blockquote><p>The authority of confessions ought indeed to be great with the pious in the churches, but still sinking below the authority of the Scripture. For the latter is a rule, they the thing ruled. It alone is self-credible (autopistos) with respect to words as well as to things, divine and infallible; they, as divine in things, still in words and manner of treatment are human writings. Faith is immediately and absolutely due to it; to them an examination is due and that having been made, if they agree with the word, faith. It is the constant and immutable canon of faith; while they are subject to revision and new examination, in which it is right not only to explain and amplify them, but also to correct whatever fault should be found in them and reform according to the rule of the word. Hence it is evident that they err here in excess who hold such confessions as the rule of the truth itself and make them equal to the word of God.</p></blockquote>

</figure><figure class="quote" id="q-7b62193997" data-kw="">
<blockquote><p>For it is said [in Acts 8] that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning [of the Romanist opponent], would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian…</p></blockquote>

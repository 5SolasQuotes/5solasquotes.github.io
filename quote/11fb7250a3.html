<blockquote><p>The principal, and indeed the whole, contention lies in the point of number: whether two Gods may be admitted, by poetic license (if they must be), or pictorial fancy, or by the third process, as we must now add, of heretical depravity. But the Christian truth has distinctly declared this principle, “God is not, if He is not one;” because we more properly believe that has no existence which is not as it ought to be. In order, however, that you may know that God is one, ask what God is, and you will find Him to be not otherwise than one. So far as a human being can form a definition of God, I adduce one which the conscience of all men will also acknowledge,—that God is the great Supreme, existing in eternity, unbegotten, unmade, without beginning, without end. For such a condition as this must needs be ascribed to that eternity which makes God to be the great Supreme, because for such a purpose as this is this very attribute in God; and so on as to the other qualities: so that God is the great Supreme in form and in reason, and in might and in power. Now, since all are agreed on this point (because nobody will deny that God is in some sense the great Supreme, except the man who shall be able to pronounce the opposite opinion, that God is but some inferior being, in order that he may deny God by robbing Him of an attribute of God), what must be the condition of the great Supreme Himself? Surely it must be that nothing is equal to Him, i.e. that there is no other great supreme; because, if there were, He would have an equal; and if He had an equal, He would be no longer the great Supreme, now that the condition and (so to say) our law, which permits nothing to be equal to the great Supreme, is subverted. That Being, then, which is the great Supreme, must needs be unique, by having no equal, and so not ceasing to be the great Supreme. Therefore He will not otherwise exist than by the condition whereby He has His being; that is, by His absolute uniqueness. Since, then, God is the great Supreme, our Christian verity has rightly declared, “God is not, if He is not one.” Not as if we doubted His being God, by saying, He is not, if He is not one; but because we define Him, in whose being we thoroughly believe, to be that without which He is not God; that is to say, the great Supreme. But then the great Supreme must needs be unique. This Unique Being, therefore, will be God—not otherwise God than as the great Supreme; and not otherwise the great Supreme than as having no equal; and not otherwise having no equal than as being Unique. Whatever other god, then, you may introduce, you will at least be unable to maintain his divinity under any other guise, than by ascribing to him too the property of deity—both eternity and supremacy over all. How, therefore, can two great Supremes co-exist, when this is the attribute of the Supreme Being, to have no equal,—an attribute which belongs to One alone, and can by no means exist in two?</p></blockquote>

<blockquote><p>But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer to his Five Reasons against Absolute Reprobation’, pp. 225-27</span></figcaption>

<blockquote><p>I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 47 | Treatment of the Questions</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.”

— Bonaventure, Commentary on the Sentences (d. 1274), bk. 1 | dist. 47 | Treatment of the Questions">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer%3A+For+the+understanding+of+the+aforesaid%2C+it+must+be+noted+that%2C+according+to+John+Damascene%2C+the+will+of+good+pleasure+is+twofold%2C+namely%2C+antecedent+and+consequent%3A+antecedent+or+conditional%2C+by+which+He+wills%2C+as+far+as+is+in+Him%2C+the+salvation+of+all%2C+and+absolute%2C+by+which+He+determinately+wills+something+that+He+knows+with+certainty+will+happen.+It+must+be+understood%2C+therefore%2C+that+it+is+not+possible+for+any+will+of+God+to+be+overcome%3B+it+is+not+possible+for+any+to+be+rendered+void%3B+yet+it+is+possible+for+some%2C+such+as+the+antecedent%2C+not+to+be+fulfilled%3B+and+it+is+necessary+for+some%2C+such+as+the+consequent%2C+to+be+fulfilled%2C+and+it+is+impossible+for+it+to+be+hindered.+None%2C+I+say%2C+is+possible+to+be+overcome.+For+if+a+man+does+not+do+what+God+wills%2C+as+far+as+is+in+him%2C+by+the+antecedent+will%2C+God+does+with+him+what+He+wills+by+the+consequent+will%3B+and+thus+it+is+always+fulfilled+either+of+the+man+or+by+the+man%2C+and+thus+it+is+never+vanquished+or+overcome.+Nor+is+it+possible+for+the+will+of+God+to+be+rendered+void.+For+something+is+said+to+be+void+when+it+is+deprived+of+its+proper+effect%2C+for+which+it+is%3A+but+no+will+is+deprived+of+the+effect+for+which+it+is+properly.+For+what+is+said%2C+that+God+wills+all+men+to+be+saved%2C+as+far+as+is+in+Him%2C+this+will+does+not+connote+salvation%2C+nor+is+it+properly+for+the+effect+of+salvation%2C+but+it+connotes+the+ordination+of+nature+or+a+nature+ordainable+to+salvation.+Hence+it+is+nothing+more+to+say%3A+God+wills+this+person+to+be+saved%2C+as+far+as+is+in+Him%2C+than+that+it+pleased+God+to+give+this+person+a+nature+through+which+he+could+arrive+at+salvation%2C+and+that+God+was+prepared+to+help%2C+so+that+salvation+does+not+fail+because+of+a+defect+on+the+part+of+God.+Hence+it+is+not+rendered+void%2C+because+it+has+its+proper+effect.+But+concerning+the+absolute+will%2C+it+is+plain+that+it+cannot+be+rendered+void%2C+because+it+posits+all+its+effect+and+never+remains+unfulfilled.+Since%2C+therefore%2C+it+is+true+that+the+will+of+God+can+in+no+way+be+overcome+or+rendered+void%2C+yet+it+is+necessary+that+the+absolute+will+be+fulfilled%2C+but+the+conditional+will+not+at+all.%E2%80%9D%0A%0A%E2%80%94+Bonaventure%2C+Commentary+on+the+Sentences+%28d.+1274%29%2C+bk.+1+%7C+dist.+47+%7C+Treatment+of+the+Questions&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F10c6b7e1b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/10c6b7e1b6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=I%20answer%3A%20For%20the%20understanding%20of,the%20conditional%20will%20not%20at%20all&amp;text=I%20answer%3A%20For%20the%20understanding%20of%20the%20aforesaid&amp;text=fulfilled%2C%20but%20the%20conditional%20will%20not%20at%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-07a072d47b" data-kw="">
<blockquote><p>We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, (Sources in Early Modern Economics, Ethics, and Law) (CLP Academic, 2015), thesis 2, p. 42</span></figcaption>

</figure><figure class="quote" id="q-ef49ade55e" data-kw="eternity perpetual">
<blockquote><p>Eternity is a perpetual duration, which hath neither beginning nor end. Time hath both. Those things we say are in time, that have beginning, grow up by degrees, have succession of parts. Eternity is contrary to time, and is therefore a permanent and immutable state, a perfect possession of life without any variation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Eternity of God</span></figcaption>

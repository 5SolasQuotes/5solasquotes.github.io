<main class="wrap"><figure class="quote" id="q-c06009f30e" data-kw="">
<blockquote><p>Assuredly, [it is clear] that peoples did not in the first instance originate from rulers, but whatever peoples desired to be ruled by a single monarch or by chief men elected by them were anterior to their rulers. Hence it follows that peoples were not created for the sake of rulers, but on the contrary the rulers for the sake of the people, even as the guardian is appointed for the ward, not the ward for the guardian, and the shepherd on account of the flock, not the flock on account of the shepherd.

This proposition is not merely obvious in itself but may be corroborated by the history of nearly all nations, So much so that God Himself, although he had elected Saul to substitute him for Samuel in accordance with the desires of the people, yet willed that he should be chosen and accepted as King by the suffrages of the people. Thus David, although he had first been chosen as king by God Himself, yet would not undertake the administration of the Kingdom except he had first been confirmed by the suffrages and unfettered concord of the tribes of Israel.

On similar grounds it happened even afterwards that though the kingship had by the will of God been granted to the family of David, yet in the last resort that one from the descendants of David should rule whom the people had approved and none other (unless perchance something irregular befell to prevent it as when now the Egyptian and then the Syrian kings ruled as tyrants over the people of God).

So much so that this kingship was hereditary as far as the family was concerned, but elective as regards the individual incumbent, i.e. dependent upon the election of the people. This may be seen from the histories of Solomon, Rehoboam, Joas, Ocias and Jehoahaz. For this reason also Absalom grasped the occasion of usurping his father’s throne. For thus Hushai the friend of David answered him: “Nay, but whom the LORD, and this people, and all the men of Israel have chosen, his will I be, and with him will I abide.”

… [T]he people existed before there was any magistrate and that the magistrates were made for the sake of the people and not vice versa, the people for the sake of the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), pp 108, 122.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13e6b614f3" data-kw="">
<blockquote><p>Whether they are sure that these superstitions of theirs may not run the round as other superstitions have done before them?… What if the next age should turn them into a dead formality? And what if the next age after that should make laws to enforce them? And then godly people first scruple them, and then fly from them as discerned superstition? And then the worst men be glad of that advantage to persecute those that would not submit to them? By this circulation, if the same men who invented… new and needless Church covenants, etc. could but live two or 300 years, they might come to be among the number of those who cry out of them as superstitious, and suffer persecution because they will not use them.</p></blockquote>

<blockquote><p>After the Restoration of the English monarchy in the person of Charles II in 1660, the new king and his first Parliament declared the anniversary of the beheading of his father Charles I (January 30, 1649) a religious holiday with a special commemoration in the Book of Common Prayer, naming the late monarch a saint and martyr. This holiday was not generally celebrated in Massachusetts until the emergence of several Anglican churches there in the early eighteenth century. In 1750, Jonathan Mayhew, the twenty-nine-year old pastor of the West (Congregational) Church in Boston, took occasion to dispute the first Charles’ credentials to saintship, martyrdom, and even his kingship as well. Mayhew’s Discourse is an extremely interesting bridge between the radical Puritan past and the American Revolutionary future. His sermon contains the language, rhetoric, symbolism, typology, and religious and philosophical arguments that would be used extensively in the agitation for American independence twenty-five years later. Mayhew (1720-1766) would subsequently take a leading role in the resistance to the Stamp Act of 1765, and his sermons and writings had an enormous impact on the evolution of New England Puritanism into American republican ideology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-mayhew.html">Jonathan Mayhew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning Unlimited Submission &amp; Non-Resistance to the Higher Powers</cite>, (1750) 55 pp. Mayhew was liberal both in his religion and politics. This famous sermon was credited by John Adams with being greatly influential in leading to the commencement of the War of American Independence. | The University of Nebraska abstract:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

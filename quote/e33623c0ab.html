<main class="wrap"><figure class="quote" id="q-e33623c0ab" data-kw="">
<blockquote><p>And amonge these thinges whiche ought to have the principal place, as touching this spiritual worshipping, is obedience: wherof we read that it is better than sacrifices. Neither had God a regard in a manner to any other thing in the whole law and rites of ceremonies than to have men truly subject and obedient unto Him.</p></blockquote>

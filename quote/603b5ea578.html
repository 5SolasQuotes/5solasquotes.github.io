<blockquote><p>The design of it is, to wean Christians from the overmuch love of their bodies. All men by nature are prone curare cutem magis quàm animam, to take more care and spend more time for their bodies, then for their souls: Hence it is that they think no cost too much that is laid out for the feeding and clothing of their bodies, no gift too great that is given to the Physician to heal them when diseased, but any thing too much which is given to a godly Minister for the good of their souls:

Hence it is, that the working days are too few, and too short for their bodily profits and pastimes, but the Lord’s day which is the Queen of days, because it is the Souls Market-day for Heaven, is burdensome to them, and very tedious. Hence it is also that they are willing to lay out Nine parts of their Estate for their bodies, but unwilling to part with the Tenth for soul-advantages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The saint’s transfiguration, or, The body of vileness changed into a body of glory a sermon preached at Martins Ludgate, October 19, 1654, at the funeral of that reverend and faithful minister of Jesus Christ, Dr. Samuel Bolton, late master of Christs College in Cambridge: with a short account of hi</cite>, (London: Joseph Crawford, 1655), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04b2742d9c" data-kw="">
<blockquote><p>THESIS 29: And indeed the statutes of Moses in whatever way they possess the law, they possess the common law, obligating either by a common reason or by analogy, and thus it is necessary to preserve either the laws or their analogy, just as the jurists teach regarding their own laws.

THESIS 30: But this analogy is only mutable in the circumstances, not in the foundation of reason or in its substance. Accordingly, whoever civilly by the common law is liable to death penalty according to the law of Moses, likewise the same person must be considered liable to the death penalty in our time because there is a single and immutable rationale of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, trans. Todd M. Rester, ed. Andrew M. McGinnis (1593; Grand Rapids, 2015), p. 34.</span></figcaption>

</figure><figure class="quote" id="q-4d7b72c231" data-kw="">
<blockquote><p>But the church of God is in God the Father, and in the Lord Jesus Christ; it is the company of the faithful, whom God hath gathered together in Christ by his word and by the Holy Ghost, to honour him, as he himself hath appointed. This church heareth the voice of the Shepherd; it will not follow a stranger, but flieth from him; for it knoweth not the voice of strangers. Of this church St. Jerome saith, “The church of Christ, which containeth the churches through all the world, is joined together in the unity of the spirit, and hath the cities of the law, of the Prophets, of the Gospel, and of the Apostles. This church goeth not forth, or beyond her bounds, that is, the holy Scriptures.”

It is the pillar of the truth, the body, the fulness, and the spouse of Christ; it is the vine, the house, the city, and the kingdom of God; they which dwell in it, are no more strangers and foreigners, but citizens with the saints, and of the household of God, and are built upon the foundation of the Apostles and Prophets; Jesus Christ himself being the head corner-stone, in whom all the building coupled together, groweth into an holy temple in the Lord. This church Christ loved, and gave himself for it, that he might sanctify it, and cleanse it by the washing of water through the word; that he might make it unto himself a glorious church, not having spot or wrinkle, or any such thing, but that it should be holy, and without blame. (Eph. v.)

Such a church was the church of God at Thessalonica; such a church are they, whosoever in any place of the world fear the Lord, and call upon his name; their names are written in the book of life; they have received the spirit of adoption, by which they cry Abba, Father; they grow from grace to grace, and abound more and more in knowledge and in judgment; they cast away the works of darkness, and put on the armour of light; they are made absolute and perfect unto all good works; they are evermore comforted in the mercies of God, both by the holy Scriptures, wherein God declareth his gracious goodness towards them, and by the sacraments, which are left unto the church to be witnesses and assured pledges for performance of the promises of God’s good will and favour towards them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 10-11.</span></figcaption>

</figure><figure class="quote" id="q-a94f7a05bf" data-kw="">
<blockquote><p>We have no such custom, of women’s praying or prophesying with their heads uncovered, or men’s praying or prophesying with their heads covered; or we have no such custom of contending for these little frivolous things; neither any of the churches of God; and good Christians, in their practices, ought, in things of this nature, to have an eye and regard to the custom of their own church, and also of other Christian churches. Thus the apostle closes this discourse, and proceeds in the next verses to tax other abuses which were crept into this famous church.</p></blockquote>

<blockquote><p>Next you [Gilbert Burnet] inquire, Why do you [Scottish non-conformists] not anoint the sick with oil? I answer, though you address this demand to a non-conformist, yet it is evident that your conclusion of deformity to the Scripture pattern thence inferred, is equally levelled against the whole Protestant Church, wherein this ceremony is universally disused, and that not from your vain warrant of the Church’s authority in and over things expressly commanded, as you judge this rite to be; No, this is a presumption so high, and lax, that even the grossest Papists are unwilling to avouch it; But the sound answer of all the Churches is that, as the custom of anointing might have been occasioned from an observance then in use in these parts, where anointings were much more ordinary than in our parts of the world, so it is mentioned in the Scripture by the apostle James, not by way of command, but as the accustomed symbol adhibite[d] in the exercise of the gift of healing, which being then ordinary in the Church, is commanded to be applied by the prayer of faith, whereunto the effect is solely referred, and only with the formality of anointing, as being then customary in the like cases. Seeing then that the text runs clearly thus, ‘Is any sick? Let him call the elders, and let them pray over him anointing him with oil in the name of the Lord, and the prayer of faith shall save the sick;’ and that the application of the extraordinary gift of healing by prayer, with the then us […]all circumstance of anointing […] is here only enjoined, how can you make this text binding as to the manner and circumstance, when you cannot but acknowledge that the substance, viz. the power of healing, is ceased? But having made your non-conformist say that the apostle promises recovery upon the anointing, you turn to fight with your own shadow, and tell him there is no such matter, that the recovery is promised to prayer, and also forgiveness; and seing we pray by all for their raising up, and that they may be forgiven, why do we not as well anoint? But, what logic can make out this consequence inasmuch as anointing, being there only spoken of as the concomitant rite used in the application of the gift of healing, it is manifest that without the existence and exercise of the gift itself, it is not now to be repeated; and therefore though prayer be principally commanded as the special mean, by which even the gift of miracles was actuate[d] and made effectual, and to this day does remain as the great one by which all the promises either for raising up or remission are drawn out unto effect; yet thence to infer that anointing, a peculiar solemnity in the gift of healing, should still continue, notwitstanding the gift itself be ceased, is very absurd: Now, that anointing was an ordinary observance in the exercise of the gift of healing, you may read it clearly in the disciples’ practice, Mk. 6:13. And they anointed with oil many that were sick and healed them. This being then the just and true account, not only of our practice, but also of that of the whole reformed Churches, how vain and ridiculous are you to tell us, that our pretence of Scripture is but to impose on women and simple people, and all our persuasion, grave nods and big words: but leaving you to puff petulantly where you can prove nothing.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“Next you [Gilbert Burnet] inquire, Why do you [Scottish non-conformists] not anoint the sick with oil? I answer, though you address this demand to a non-conformist, yet it is evident that your conclusion of deformity to the Scripture pattern thence inferred, is equally levelled against the whole Protestant Church, wherein this ceremony is universally disused, and that not from your vain warrant of the Church’s authority in and over things expressly commanded, as you judge this rite to be; No, this is a presumption so high, and lax, that even the grossest Papists are unwilling to avouch it; But the sound answer of all the Churches is that, as the custom of anointing might have been occasioned from an observance then in use in these parts, where anointings were much more ordinary than in our parts of the world, so it is mentioned in the Scripture by the apostle James, not by way of command, but as the accustomed symbol adhibite[d] in the exercise of the gift of healing, which being then ordinary in the Church, is commanded to be applied by the prayer of faith, whereunto the effect is solely referred, and only with the formality of anointing, as being then customary in the like cases. Seeing then that the text runs clearly thus, ‘Is any sick? Let him call the elders, and let them pray over him anointing him with oil in the name of the Lord, and the prayer of faith shall save the sick;’ and that the application of the extraordinary gift of healing by prayer, with the then us […]all circumstance of anointing […] is here only enjoined, how can you make this text binding as to the manner and circumstance, when you cannot but acknowledge that the substance, viz. the power of healing, is ceased? But having made your non-conformist say that the apostle promises recovery upon the anointing, you turn to fight with your own shadow, and tell him there is no such matter, that the recovery is promised to prayer, and also forgiveness; and seing we pray by all for their raising up, and that they may be forgiven, why do we not as well anoint? But, what logic can make out this consequence inasmuch as anointing, being there only spoken of as the concomitant rite used in the application of the gift of healing, it is manifest that without the existence and exercise of the gift itself, it is not now to be repeated; and therefore though prayer be principally commanded as the special mean, by which even the gift of miracles was actuate[d] and made effectual, and to this day does remain as the great one by which all the promises either for raising up or remission are drawn out unto effect; yet thence to infer that anointing, a peculiar solemnity in the gift of healing, should still continue, notwitstanding the gift itself be ceased, is very absurd: Now, that anointing was an ordinary observance in the exercise of the gift of healing, you may read it clearly in the disciples’ practice, Mk. 6:13. And they anointed with oil many that were sick and healed them. This being then the just and true account, not only of our practice, but also of that of the whole reformed Churches, how vain and ridiculous are you to tell us, that our pretence of Scripture is but to impose on women and simple people, and all our persuasion, grave nods and big words: but leaving you to puff petulantly where you can prove nothing.”

— Robert MacWard, The True Non-Conformist, … (1671), 3rd Dialogue, pp. 117-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNext+you+%5BGilbert+Burnet%5D+inquire%2C+Why+do+you+%5BScottish+non-conformists%5D+not+anoint+the+sick+with+oil%3F+I+answer%2C+though+you+address+this+demand+to+a+non-conformist%2C+yet+it+is+evident+that+your+conclusion+of+deformity+to+the+Scripture+pattern+thence+inferred%2C+is+equally+levelled+against+the+whole+Protestant+Church%2C+wherein+this+ceremony+is+universally+disused%2C+and+that+not+from+your+vain+warrant+of+the+Church%E2%80%99s+authority+in+and+over+things+expressly+commanded%2C+as+you+judge+this+rite+to+be%3B+No%2C+this+is+a+presumption+so+high%2C+and+lax%2C+that+even+the+grossest+Papists+are+unwilling+to+avouch+it%3B+But+the+sound+answer+of+all+the+Churches+is+that%2C+as+the+custom+of+anointing+might+have+been+occasioned+from+an+observance+then+in+use+in+these+parts%2C+where+anointings+were+much+more+ordinary+than+in+our+parts+of+the+world%2C+so+it+is+mentioned+in+the+Scripture+by+the+apostle+James%2C+not+by+way+of+command%2C+but+as+the+accustomed+symbol+adhibite%5Bd%5D+in+the+exercise+of+the+gift+of+healing%2C+which+being+then+ordinary+in+the+Church%2C+is+commanded+to+be+applied+by+the+prayer+of+faith%2C+whereunto+the+effect+is+solely+referred%2C+and+only+with+the+formality+of+anointing%2C+as+being+then+customary+in+the+like+cases.+Seeing+then+that+the+text+runs+clearly+thus%2C+%E2%80%98Is+any+sick%3F+Let+him+call+the+elders%2C+and+let+them+pray+over+him+anointing+him+with+oil+in+the+name+of+the+Lord%2C+and+the+prayer+of+faith+shall+save+the+sick%3B%E2%80%99+and+that+the+application+of+the+extraordinary+gift+of+healing+by+prayer%2C+with+the+then+us+%5B%E2%80%A6%5Dall+circumstance+of+anointing+%5B%E2%80%A6%5D+is+here+only+enjoined%2C+how+can+you+make+this+text+binding+as+to+the+manner+and+circumstance%2C+when+you+cannot+but+acknowledge+that+the+substance%2C+viz.+the+power+of+healing%2C+is+ceased%3F+But+having+made+your+non-conformist+say+that+the+apostle+promises+recovery+upon+the+anointing%2C+you+turn+to+fight+with+your+own+shadow%2C+and+tell+him+there+is+no+such+matter%2C+that+the+recovery+is+promised+to+prayer%2C+and+also+forgiveness%3B+and+seing+we+pray+by+all+for+their+raising+up%2C+and+that+they+may+be+forgiven%2C+why+do+we+not+as+well+anoint%3F+But%2C+what+logic+can+make+out+this+consequence+inasmuch+as+anointing%2C+being+there+only+spoken+of+as+the+concomitant+rite+used+in+the+application+of+the+gift+of+healing%2C+it+is+manifest+that+without+the+existence+and+exercise+of+the+gift+itself%2C+it+is+not+now+to+be+repeated%3B+and+therefore+though+prayer+be+principally+commanded+as+the+special+mean%2C+by+which+even+the+gift+of+miracles+was+actuate%5Bd%5D+and+made+effectual%2C+and+to+this+day+does+remain+as+the+great+one+by+which+all+the+promises+either+for+raising+up+or+remission+are+drawn+out+unto+effect%3B+yet+thence+to+infer+that+anointing%2C+a+peculiar+solemnity+in+the+gift+of+healing%2C+should+still+continue%2C+notwitstanding+the+gift+itself+be+ceased%2C+is+very+absurd%3A+Now%2C+that+anointing+was+an+ordinary+observance+in+the+exercise+of+the+gift+of+healing%2C+you+may+read+it+clearly+in+the+disciples%E2%80%99+practice%2C+Mk.+6%3A13.+And+they+anointed+with+oil+many+that+were+sick+and+healed+them.+This+being+then+the+just+and+true+account%2C+not+only+of+our+practice%2C+but+also+of+that+of+the+whole+reformed+Churches%2C+how+vain+and+ridiculous+are+you+to+tell+us%2C+that+our+pretence+of+Scripture+is+but+to+impose+on+women+and+simple+people%2C+and+all+our+persuasion%2C+grave+nods+and+big+words%3A+but+leaving+you+to+puff+petulantly+where+you+can+prove+nothing.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%2C+%E2%80%A6+%281671%29%2C+3rd+Dialogue%2C+pp.+117-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Febc7ade868.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ebc7ade868.html">Per

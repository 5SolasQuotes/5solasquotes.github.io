<main class="wrap"><figure class="quote" id="q-b0e6909a7b" data-kw="">
<blockquote><p>From what has been said, it appears that we can, by the power of nature, know God, and that God himself is the author of this knowledge, both by that notion of himself which he has engraven on the minds of all men, and by the excellent works he has done, from the contemplation of which it necessarily follows that God exists. Hence it is that the natural knowledge of God may be considered in two points of view, as innate and acquired.

The innate notion of the Deity is that which is so peculiar to man, that, as soon as he is capable of using his reason, he cannot avoid very often thinking of God, and is not able entirely to reject the thoughts of him, although he sometimes may attempt it. The acquired notion is that which is drawn from the careful observation of created things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 1.2, p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f59812f657" data-kw="">
<blockquote><p>In the book The Open Secret: A New Vision for Natural Theology, Alister McGrath sets out to lay the foundations for an entirely new natural theology… ‘…if nature is to disclose the transcendent, it must be ‘seen’ or ‘read’ in certain specific ways – ways that are not themselves necessarily mandated by nature itself.’ He does not wish to embark on a neutral natural theology, but to advance a Christian natural theology – one which, rather than proving the doctrinal claims of Christianity, begins by accepting the doctrinal claims of Christianity, and then goes on to show how the Christian worldview gives the best interpretation of our perceptions of this universe. The claim that he will seek to validate in his book is summarized briefly as follows: ‘…A Christian understanding of nature is the intellectual prerequisite for a natural theology which discloses the Christian God.’ In order to understand his revised natural theology we must first understand the need for this revision. What does McGrath perceive as the old natural theology, and what is so wrong with it that we need a new vision? Once we have understood these contentions we will be able to better understand McGrath’s revised version, which will allow us to give it a critical analysis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Alister McGrath &amp; Natural Theology’</cite></span></figcaption>

<blockquote><p>For just as it is self-evident to us that a whole is greater than its part, so is it most evident to those who see the very essence of God that God exists, since his essence is his existence. But because we are unable to see his essence, we come to know his existence not in himself, but in his effects. … Therefore, man must come by reasoning to know God in the likenesses to him which he discovers in God’s effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 11</span></figcaption>

</figure><figure class="quote" id="q-f791fe3c1c" data-kw="">
<blockquote><p>Indeed there is what is called natural religion. There are many truths concerning God, and our duty to him, which are evident by the light of nature. But christian divinity, properly so called, is not evident by the light of nature; it depends on revelation. Such are our circumstances now in our fallen state, that nothing which it is needful for us to know concerning God, is manifest by the light of nature, in the manner in which it is necessary for us to know.

For the knowledge of no truth in divinity is of significance to us, any otherwise than as it some way or other belongs to the gospel-scheme, or as it relates to a Mediator. But the light of nature teaches us no truth in this matter. Therefore it cannot be said, that we come to the knowledge of any part of christian truth by the light of nature. It is only the word of God, contained in the Old and New Testament, which teaches us christian divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Knowledge in Jonathan Edwards on Knowing Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

For the knowledge of no truth in divinity is of significance to us, any otherwise than as it some way or other belongs to the gospel-scheme, or as it relates to a Mediator. But the light of nature teaches us no truth in this matter. Therefore it cannot be said, that we come to the knowledge of any part of christian truth by the light of nature. It is only the word of God, contained in the Old and New Testament, which teaches us christian divinity.”

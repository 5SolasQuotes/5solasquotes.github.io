<main class="wrap"><figure class="quote" id="q-52c14a01f6" data-kw="">
<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.”

— Gisbertus Voetius, Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+Christ+actually+expiated+and+satisfied+for+our+sins%3F+It+is+affirmed+contra+the+Socinians.+Whether+such+an+expiation+was+necessary%3F+It+is+affirmed+contra+the+Socinians.+Whether+it+was+a+full+and+total+expiation%3F+It+is+affirmed.+Whether+it+is+able+to+be+said+Christ+according+to+each+nature+was+a+sacrifice+and+victim%3F+It+is+denied.+Whether+his+oblation+of+Himself+was+properly+a+victim%3F+It+is+affirmed.+Whether+therefore+passions+ought+not+to+be+referred+to+the+sacrifice+and+victim%3F+It+is+affirmed.+Whether+the+whole+passive+obedience+of+Christ+is+able+to+be+called+a+victim+and+sacrifice%3F+It+is+denied+with+a+distinction.+Whether+that+dignity%2C+by+which+the+death+of+Christ+redounds+dignity+and+efficacy%2C+so+it+is+a+ransom+%28lutron%29%2C+is+able+to+be+called+part+of+the+victim%3F+It+is+distinguished.+Whether+the+divine+nature+was+the+altar%2C+or+indeed+the+sign+of+the+cross+was%3F+The+former+is+affirmed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Syllabus+of+Theological+Problems+%28Utrecht%2C+1643%29%2C+pt.+1%2C+section+2+Abbr.+%7C+tract+2+%7C+Of+the+First+Part%2C+or+of+the+Act%3A+The+Sacrifice+of+the+Priestly+Office%2C+even+the+Full+Satisfaction+%26+Expiation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52c14a01f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52c14a01f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/atonement#:~:text=Whether%20Christ%20actually%20expiated%20and%20satisfied,cross%20was%3F%20The%20former%20is%20affirmed&amp;text=Whether%20Christ%20actually%20expiated%20and%20satisfied%20for%20our&amp;text=of%20the%20cross%20was%3F%20The%20former%20is%20affirmed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-42f7ff9a1c" data-kw="">
<blockquote><p>Position 1. As there is no merit, good deserving, work or hire in the miserable sinner dying in his blood, dead in sins, out of his wit and disobedient, deceived and serving diverse lusts, Eze. 16:4-8; Eph. 2:1-4; Tit. 3:3-4, so there is as much love, man-kindness and free grace in heaven in the breast of Christ as would save all in hell, or out of hell. I speak this in regard, not of the Lord’s intention, as if He did bear all and every one of mankind a good will, purposing to save them. But because their lies and flows such a sea and ocean of infinite love about the heart and in the bowels of Jesus Christ as would over-save and out-love infinite worlds of sinners (so all could come and draw and drink, and suck the breasts of overflowings of Christ’s free grace) in regard of the intrinsical weight and magnitude of this love, that if you appoint banks to channel or marches to bound this free love, God should not be God, nor the Redeemer the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-df5b903686" data-kw="">
<blockquote><p>But as much as many being called by the Gospel do not repent nor believe in Christ, but perish in their infidelity, this comes not to pass for want of, or by any insufficiency of the sacrifice of Christ offered upon the Cross, but by their own default.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-culverwell.html">Ezekiel Culverwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted by Erroll Hulse, ‘Adding to the Church – The Puritan Approach to Persuading Souls’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-d8e09614c0" data-kw="">
<blockquote><p>Whether Christ died for us, that is vicariously and in our place, and further that salvation was brought forth for us? It is affirmed against the Socinians. … Whether He is our mediator only so far as a messenger is? It is denied. Whether Christ truly reconciled us to the Father, or whether our redemption done through that indeed was only metaphorical? The former is affirmed, the latter is denied. … Whether Christ’s death is meritorious to us, or it was in truth a preparation only unto his priesthood? The former is affirmed. Whether the dogma of satisfaction and merit in the sacred pages is founded, or repugnant to right reason? The former is affirmed, the latter is denied. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 3 | 1. Of the Obedience, Satisfaction &amp; Merit of Christ</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-2a4490c1ea" data-kw="">
<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1</cite>, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity, pp. 359-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

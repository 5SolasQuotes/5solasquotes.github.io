<blockquote><p>As to the true State of the Doctrine, it may be taken up in these two or three Propositions.

1. That as God, from everlasting, was pleased, in his own free Sovereignty, to decree and determine, to create this World; and to make Man in it a reasonable Creature, in his own Image, holy and upright, every Way fitted and empowered for that Duty which was due, from such a rational Creature, to the great God Creator, with full Ability to persevere and continue in that happy State of Integrity; and to enter into a Covenant of Life with him, wherein all the human Race were to be concerned and engaged; and Adam, their first Father, constituted their public Head and Representative; so that as he kept or broke the Covenant, they were to enjoy or lose the promised Blessings of it:

And as God infallibly foreknew the Fall and Transgression of Adam, as what he had decreed to permit, and so the Depravity and Ruin of his Posterity consequent thereupon, according to the Covenant; with all the actual Sins which every Individual should ever be guilty of; so he was likewise pleased, of his own mere Grace and free Favour, to decree and determine, to recover and save a Number, only known to himself, of that fallen wretched Race, thro’ the Meditation of his own Son’s Redeeming them, by answering the Precept and Penalty of the broken Law for them; and thro’ the Sanctification of his eternal Spirit, making them fit for and capable of glorifying and enjoying him forever.

2. That God’s determining and appointing to save any of fallen Mankind, or any in particular more than others, was not up on the Foresight of any Difference which he foresaw they would make among themselves, by the better Improvement of any common Helps and Advantages, as the Reason of it: But it was purely of his own sovereign, free, wise Pleasure, and distinguishing Grace.

3. That the rest of fallen Mankind, not thus chosen and ordained to eternal Life, he was pleased, of his sovereign, wise and righteous Pleasure, as a just King and Lawgiver, to determine to leave in their fallen State; and to punish them according to all the Sin and Disobedience, which they should be guilty of, and chargeable with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-blair.html">Samuel Blair</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of predestination truly and fairly stated: confirmed from clear Scripture-evidence, and defended against all the material arguments and objections advanced against it</cite>, (Philadelphia PN: B. Franklin, 1742), pp 6-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b32de3280c" data-kw="">
<blockquote><p>For the foreknowledge (as in the larger signification it is taken for his providence) is God’s eternal decree, by which he determined to make the world, and all that is therein, and to make his glory manifest unto reasonable creatures, namely, unto men and Angels, by the government of the things which he had made.

But predestination chiefly is referred and restrained unto mankind, which God by predestination hath divided into two kinds of men, so that of his own sole and undeserved grace he hath chosen some from eternity, whom he would make his heirs in Christ, and bring to everlasting salvation: and hath appointed other some unto everlasting punishment and destruction, to the which also he brings them by his just judgement from their own deserts. Then the Apostle proceedeth unto the subordinate causes of salvation, and sheweth by what means and degrees, the elect on the one side come to eternal life, and the reprobate on the other side are brought to eternal torments …

For God by his foreknowledge foresaw all things from before all beginnings. Nothing is exempt from this foreknowledge of God, but all things, and every one thing is contained and comprehended in that.</p></blockquote>

<blockquote><p>4. Eternal life does not come to anyone by chance, for it is a lot that God, according to the good pleasure of His will, assigns only to those whom He has decreed and not to others. If the entire plan of the lot is from Jehovah in the distribution of earthly inheritances [Prov. 16:33], then much more does the heavenly inheritance depend on His good pleasure. Therefore, it should never be admitted that some were saved in the past or are being saved now by the chance mercy of God.</p></blockquote>

</figure><figure class="quote" id="q-e430f5a8c3" data-kw="">
<blockquote><p>GOD, whose judgments no man can comprehend, whose ways cannot be found out, and whose will ought to stop all men’s mouths, according to the determinate and unchangeable purpose of his will, by the virtue whereof all things are made, yea even those things which are evil and execrable (not in that they be wrought by his divine counsel, but forasmuch as they proceed of the prince of the air, and that spirit which works in the children of disobedience) has determined from before all beginning with himself, to create all things in their time, for his glory, and namely men: whom he has made after two sorts, clean contrary one to the other.

Whereof he makes the one sort (which it pleased him to choose by his secret will and purpose) partakers of his glory through his mercy, and these we call according to the word of God, the vessels of honour, the elect, the children of promise, and predestinate to salvation: and the others, whom likewise it pleased him to ordain to damnation (that he might show forth his wrath and power, to be glorified also in them) we do call the vessels of dishonour and wrath, the reprobate and cast off from all good works.</p></blockquote>

<blockquote><p>First, if we seek God’s fatherly mercy and kindly heart, we should turn our eyes to Christ, on whom alone God’s Spirit rests [cf. Matt. 3:17]. If we seek salvation, life, and the immortality of the Heavenly Kingdom, then there is no other to whom we may flee, seeing that he alone is the fountain of life, the anchor of salvation, and the heir of the Kingdom of Heaven. Now what is the purpose of election but that we, adopted as sons by our Heavenly Father, may obtain salvation and immortality by his favor? No matter how much you toss it about and mull it over, you will discover that its final bounds still extend no farther. Accordingly, those whom God has adopted as his sons are said to have been chosen not in themselves but in his Christ [Eph. 1:4]; for unless he could love them in him, he could not honor them with the inheritance of his Kingdom if they had not previously become partakers of him. But if we have been chosen in him, we shall not find assurance of our election in ourselves; and not even in God the Father, if we conceive him as severed from his Son. Christ, then, is the mirror wherein we must, and without self-deception may, contemplate our own election. For since it is into his body the Father has destined those to be engrafted whom he has willed from eternity to be his own, that he may hold as sons all whom he acknowledges to be among his members, we have a sufficiently clear and firm testimony that we have been inscribed in the book of life [cf. Rev. 21:27] if we are in communion with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Westminster Press, 1961), 3.24.5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“First, if we seek God’s fatherly mercy and kindly heart, we should turn our eyes to Christ, on whom alone God’s Spirit rests [cf. Matt. 3:17]. If we seek salvation, life, and the immortality of the Heavenly Kingdom, then there is no other to whom we may flee, seeing that he alone is the fountain of life, the anchor of salvation, and the heir of the Kingdom of Heaven. Now what is the purpose of election but that we, adopted as sons by our Heavenly Father, may obtain salvation and immortality by his favor? No matter how much you toss it about and mull it over, you will discover that its final bounds still extend no farther. Accordingly, those whom God has adopted as his sons are said to have been chosen not in themselves but in his Christ [Eph. 1:4]; for unless he could love them in him, he could not honor them with the inheritance of his Kingdom if they had not previously become partakers of him. But if we have been chosen in him, we shall not find assurance of our election in ourselves; and not even in God the Father, if we conceive him as severed from his Son. Christ, then, is the mirror wherein we must, and without self-deception may, contemplate our own election. For since it is into his body the Father has destined those to be engrafted whom he has willed from eternity to be his own, that he may hold as sons all whom he acknowledges to be among his members, we have a sufficiently clear and firm testimony that we have been inscribed in the book of life [cf. Rev. 21:27] if we are in communion with Christ.”

— John Calvin, Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles, The Library of Christian Classics (Westminster Press, 1961), 3.24.5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+if+we+seek+God%E2%80%99s+fatherly+mercy+and+kindly+heart%2C+we+should+turn+our+eyes+to+Christ%2C+on+whom+alone+God%E2%80%99s+Spirit+rests+%5Bcf.+Matt.+3%3A17%5D.+If+we+seek+salvation%2C+life%2C+and+the+immortality+of+the+Heavenly+Kingdom%2C+then+there+is+no+other+to+whom+we+may+flee%2C+seeing+that+he+alone+is+the+fountain+of+life%2C+the+anchor+of+salvation%2C+and+the+heir+of+the+Kingdom+of+Heaven.+Now+what+is+the+purpose+of+election+but+that+we%2C+adopted+as+sons+by+our+Heavenly+Father%2C+may+obtain+salvation+and+immortality+by+his+favor%3F+No+matter+how+much+you+toss+it+about+and+mull+it+over%2C+you+will+discover+that+its+final+bounds+still+extend+no+farther.+Accordingly%2C+those+whom+God+has+adopted+as+his+sons+are+said+to+have+been+chosen+not+in+themselves+but+in+his+Christ+%5BEph.+1%3A4%5D%3B+for+unless+he+could+love+them+in+him%2C+he+could+not+honor+them+with+the+inheritance+of+his+Kingdom+if+they+had+not+previously+become+partakers+of+him.+But+if+we+have+been+chosen+in+him%2C+we+shall+not+find+assurance+of+our+election+in+ourselves%3B+and+not+even+in+God+the+Father%2C+if+we+conceive+him+as+severed+from+his+Son.+Christ%2C+then%2C+is+the+mirror+wherein+we+must%2C+and+without+self-deception+may%2C+contemplate+our+own+election.+For+since+it+is+into+his+body+the+Father+has+destined+those+to+be+engrafted+whom+he+has+willed+from+eternity+to+be+his+own%2C+that+he+may+hold+as+sons+all+whom+he+acknowledges+to+be+among+his+members%2C+we+have+a+sufficiently+clear+and+firm+testimony+that+we+have+been+inscribed+in+the+book+of+life+%5Bcf.+Rev.+21%3A27%5D+if+we+are+in+communion+with+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+ed.+John+T.+McNeill%2C+trans.+Ford+Lewis+Battles%2C+The+L

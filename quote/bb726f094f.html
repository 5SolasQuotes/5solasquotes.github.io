<main class="wrap"><figure class="quote" id="q-bb726f094f" data-kw="">
<blockquote><p>True worship is that immediate service that the true God Himself requires to be performed unto Himself. In the exercise whereof consists true holiness and religion.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Believe those things which are written; the things which are not written, seek not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">St Basil</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 29, Advers. Calumniantes S. Trinitate</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Believe those things which are written; the things which are not written, seek not.”

— St Basil, Homily 29, Advers. Calumniantes S. Trinitate">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBelieve+those+things+which+are+written%3B+the+things+which+are+not+written%2C+seek+not.%E2%80%9D%0A%0A%E2%80%94+St+Basil%2C+Homily+29%2C+Advers.+Calumniantes+S.+Trinitate&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6d4ceaeae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6d4ceaeae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=Believe%20those%20things%20which%20are%20written%3B,which%20are%20not%20written%2C%20seek%20not." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-926b5fe04f" data-kw="">
<blockquote><p>First, that God offers to the men of this world, helps and means, either of the knowledge of God in Nature, or of grace in Christ: and that to this end, to lead them to repentance and salvation… Thus God offered to the carnal Israelites means of grace to purge them, to turn them, Prov. 1:13, to gather them, Mt. 23:37, to convince them, Jn. 16:8-9, to draw them with cords of man and bands of love, Hos. 11:4, to dress them to bring forth good fruit, Isa. 5:4. Secondly, that the means God uses for these good ends are in some measure sufficient (if they be not hindered by men) to bring them to the attainment of these ends: for when God says Himself, He uses these means for these ends; for us to say, these means are not sufficient for these ends, seems to me to derogate from the wisdom and sufficiency of God, whose works are all of them perfect, Deut. 32:4, and so sufficient for the ends for which He wrought them. Yet God forbid I should doubt of that which our Savior tells the Jews, ‘No man can come to Christ, except the Father draw him,’ Jn. 6:44, by the same almighty power and authority whereby He sent Christ into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s Clearing Certain Doubts Concerning Predestination... (London, 1646), 5th Doubt, Question 5</cite>, pp. 207-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

hrist%20into%20the%20world." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0e39098969" data-kw="">
<blockquote><p>By the one same act man both serves and worships God, for worship regards the excellence of God, to Whom reverence is due: while service regards the subjection of man who, by his condition, is under an obligation of showing reverence to God. To these two belong all acts ascribed to religion, because, by them all, man bears witness to the Divine excellence and to his own subjection to God, either by offering something to God, or by assuming something Divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, second part, Question 81, ‘Of Religion’, Article 3, ‘Whether religion is one virtue’, Reply to Objection 2. Rutherford (below) follows Aquinas in this.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary Upon the Three First Chapters of the First Epistle General of St. Peter (1637)</cite>, p. 420</span></figcaption>

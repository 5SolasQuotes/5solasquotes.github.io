<blockquote><p>Concerning Musical Organs It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolized the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed, he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical Masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal chronicles attribute its introduction to Pope Vitalian [†672]. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore, they do wrong that mumble foolishly before God the canonical hours as if superstitiously chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13)…</p></blockquote>

<blockquote><p>II. A Voluntate Dei, ‘from the will of God’. This is the other reason: ‘For the Father seeks such to worship Him.’ [Jn. 4:23] God requires such worship and worshippers. The foundation of this reason is this: The rule of worship is not mans fancy, but God’s will: Men’s fancies and wills are infinitely various, and therefore those that have gone that way, have been divided into a thousand varieties; they worship they know not what, as v. 22. Only God’s will is the stable rule: None knows the mind of God but the Spirit of God: Now this is the worship God requires in Gospel times. Argument Second: From the end [design] of worship. Look what the ends of worship are, such must the worship be: And that was the reason why the Jewish worship was so much typical, because the end of it was to represent Christ; And that end being now attained, and Christ exhibited [revealed], we must consider what were and are the further ends of worship. Now the ends are of two sorts. 1. In reference to God. 2. In reference to men. And both will show us that the worship must be spiritual. I. In relation to God; so it is double: 1. To please God: this is finis operis &amp; operantis too [‘the end of the work, and of working’], (if a man be sincere) Ps. 19:14, ‘Let the words of my mouth and the meditation of my heart be acceptable in thy sight.’ Now it is only spiritual worship that can please God: That man does but little consider the nature of God, that thinks God is pleased with the bowing of the knee to an altar, no, it is the bending of the heart that God respects. It is not an organ in a church, but the organ of a gracious heart, and melody in the heart that pleases God. 2. To exalt God amongst men, to render Him glorious in the eyes of the world: Now how is that done? Do you think that it makes God glorious, when men seek to honor Him with bodily and external services? No, you cannot dishonor God more than by giving Him such a worship as begets a carnal representation of God, etc. And when God would set Himself forth in his glory, He represents Himself in a spiritual manner, and He takes them off from all corporeal thoughts and fancies: ‘God is a Spirit.’ ‘To whom will you liken Me?’ ‘You saw no shape.’ ‘God dwells not in temples made with hands.’ II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), pp. 13-14 Poole was an English puritan.</span></figcaption>

<blockquote><p>The specific element, then, in the part of worship we are considering is singing. Now it is pleaded that the church has discretionary power to employ instrumental music, as one of the circumstances allowed by our Standards. Let us submit it to the test of the criteria by which these circumstances are determined: First, they are not parts of the acts of worship by which they are modified; but this circumstance is a part of the act of singing praise by which it is performed. Secondly, these circumstances are common to the acts of human societies, not peculiar to, and distinctive of, those of the church. It is very certain that instrumental music is not such a circumstance. It will hardly be said that all societies play on instruments as well as the church. Thirdly, these circumstances are conditions necessary to the performance of the acts of worship, without which they either cannot be done at all, or not done decently and in order. That the singing of praise cannot be performed at all without instrumental music will be affirmed by none. But it may be affirmed that it cannot without it be performed decently and in order. Let it be noticed that the question is not whether it may be performed in an indecent and disorderly manner. Granted; but so may instrumental music. The question is, whether it cannot be done decently and in order without instrumental accompaniment. The question can only be determined by reference of the practice to a permanent and universal standard of propriety and decorum. And to say that the simple singing of God’s praise in His house is indecent and disorderly is to say, that for twelve centuries the church of Christ was guilty of this impropriety; for it is a matter of history that for that period not even the Church of Rome knew anything of instruments in her worship. To say that the simple singing of God’s praise violates the standard of decency and order of this age is to censure the glorious Free Church of Scotland and the Irish Presbyterian Church for an indecent and disorderly conduct of this part of divine worship. The ground, therefore, that instrumental music in public worship is one of those circumstances required by the rule that all things be done decently and in order cannot be maintained without a spirit of arrogance and censoriousness which would itself violate the higher principle of Christian charity. It is submitted, with all modesty, that this line of argument ought to be conclusive with Presbyterians, at least, against ranking instrumental music in public worship as one of the circumstances common to human actions and societies which fall under the discretion of the church.</p></blockquote>

— John L. Girardeau, ‘The Discretionary Power of the Church, Matt 28:20’ (1875) in Sermons, ed. George A. Blackburn (1907).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+specific+element%2C+then%2C+in+the+part+of+worship+we+are+considering+is+singing.+Now+it+is+pleaded+that+the+church+has+discretionary+power+to+employ+instrumental+music%2C+as+one+of+the+circumstances+allowed+by+our+Standards.+Let+us+submit+it+to+the+test+of+the+criteria+by+which+these+circumstances+are+determined%3A+First%2C+they+are+not+parts+of+the+acts+of+worship+by+which+they+are+modified%3B+but+this+circumstance+is+a+part+of+the+act+of+singing+praise+by+which+it+is+performed.+Secondly%2C+these+circumstances+are+common+to+the+acts+of+human+societies%2C+not+peculiar+to%2C+and+distinctive+of%2C+those+of+the+church.+It+is+very+certain+that+instrumental+music+is+not+such+a+circumstance.+It+will+hardly+be+said+that+all+societies+play+on+instruments+as+well+as+the+church.+Thirdly%2C+these+circumstances+are+conditions+necessary+to+the+performance+of+the+acts+of+worship%2C+without+which+they+either+cannot+be+done+at+all%2C+or+not+done+decently+and+in+order.+That+the+singing+of+praise+cannot+be+performed+at+all+without+instrumental+music+will+be+affirmed+by+none.+But+it+may+be+affirmed+that+it+cannot+without+it+be+performed+decently+and+in+order.+Let+it+be+noticed+that+the+question+is+not+whether+it+may+be+performed+in+an+indecent+and+disorderly+manner.+Granted%3B+but+so+may+instrumental+music.+The+question+is%2C+whether+it+cannot+be+done+decently+and+in+order+without+instrumental+accompaniment.+The+question+can+only+be+determined+by+reference+of+the+practice+to+a+permanent+and+universal+standard+of+propriety+and+decorum.+And+to+say+that+the+simple+singing+of+God%E2%80%99s+praise+in+His+house+is+indecent+and+disorderly+is+to+say%2C+that+for+twelve+centuries+the+church+of+Christ+was+guilty+of+this+impropriety%3B+for+it+is+a+matter+of+history+that+for+that+period+not+even+the+Church+of+Rome+knew+anything+of+instruments+in+her+worship.+To+say+that+the+simple+singing+of+God%E2%80%99s+praise+violates+the+standard+of+decency+and+order+of+this+age+is+to+censure+the+glorious+Free+Church+of+Scotland+and+the+Irish+Presbyterian+Church+for+an+indecent+and+disorderly+conduct+of+this+part+of+divine+worship.+The+ground%2C+therefore%2C+that+instrumental+music+in+public+worship+is+one+of+those+circumstances+required+by+the+rule+that+all+things+be+done+decently+and+in+order+cannot+be+maintained+without+a+spirit+of+arrogance+and+censoriousness+which+would+itself+violate+the+higher+principle+of+Christian+charity.+It+is+submitted%2C+with+all+modesty%2C+that+this+line+of+argument+ought+to+be+conclusive+with+Presbyterians%2C+at+least%2C+against+ranking+instrumental+music+in+public+worship+as+one+of+the+circumstances+common+to+human+actions+and+societies+which+fall+under+the+discretion+of+the+church.%E2%80%9D%0A%0A%E2%80%94+John+L.+Girardeau%2C+%E2%80%98The+Discretionary+Power+of+the+Church%2C+Matt+28%3A20%E2%80%99+%281875%29+in+Sermons%2C+ed.+George+A.+Blackburn+%281907%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff988c5ccbc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f988c5ccbc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/are-musical-instruments-circumstances-of-worship/#:~:text=The%20specific%20element%2C%20then%2C%20in%20the,under%20the%20discretion%20of%20the%20church&amp;text=The%20specific%20element%2C%20then%2C%20in%20the%20part%20of&amp;text=which%20fall%20under%20the%20discretion%20of%20the%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As it [singing divine praises] a moral duty, so it is never abolished, but continues under the New Testament as well as the Old. Though their manner of praising with a great variety of musical instruments and the like is abolished as being suited to that dispensation, wherein was much more of outward pomp and ceremony, yet praising God with the music of the voice is moral and never was abolished.</p></blockquote>

<blockquote><p>§45. 5. And for organs or other instruments of music in God’s worship, they being a help partly natural and partly artificial, to the exhilarating of the spirits for the praise of God, I know no argument to prove them simply unlawful, but what would prove a cup of wine unlawful, or the tune and meter, and melody of singing unlawful. But yet if any would abuse it, by turning God’s worship into carnal pomp, and levity, especially by such non-intelligible singing, or bleating as some of our choristers used, the common people would have very great reason to be weary of it as accidentally evil.</p></blockquote>

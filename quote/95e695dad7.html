<main class="wrap"><figure class="quote" id="q-95e695dad7" data-kw="">
<blockquote><p>§II. In the State of Innocence, man was disposed to the good and to its practice, yet was indeterminate and indifferent to both, with Calvin as author, Institutes, bk. 1, ch. 15, §8, also bk. 2, ch. 3, §10; Spanheim, Syntagma Disputationum, pt. 1, p. 738, th. 7; Maresius, Systema Theologicum, locus 8, th. 50; Lud. Crocius, Syntagma Theologiae, bk. 3, ch. 37, §6; and therefore he was immune from the necessity and servitude of sin and misery; not however from the necessity of dependence [on God]; nor from the necessity of obligation to commit good and omit evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-c16e5bdc40" data-kw="">
<blockquote><p>But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr: Beveridge (1559), bk. 2, ch. 12, section 6, pp. 9-10</span></figcaption>

<blockquote><p>39. It is a dreadful thing to be over-bold, rash and presumptuous, in speaking and asserting anything without clear proof, of God’s knowledge and will, especially to reduce them to all the modes and methods of a man, even as to the order of his acts: seeing we are forced to confess that even intellection and volition are spoken of God with exceeding great impropriety, and man’s acts, which are the prius significatum [the primary meaning], are further below God’s than a worm is below a man. Therefore were it not that the presumption of the schools and polemical writers has made that necessary as defensive, which else would not be so, I should scarce dare to say this little following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), sect. 4, ‘Of God’s relations to the creature…’</span></figcaption>

</figure><figure class="quote" id="q-d397250552" data-kw="">
<blockquote><p>…whether any non-human animals are intelligent. Certainly some of them are, in a loose sense of ‘intelligent’. For some of them solve problems, produce crude tools, and so forth… So, the question of whether any non-human animals are intelligent in the strict sense ultimately boils down to the question of whether any of them exhibits linguistic behavior that is plausibly interpreted as conveying abstract concepts, propositions and logical inferences. The answer is that none of them does… as Noam Chomsky observes, there are five crucial differences between human language and what such apes are capable of. Two of them are biological. In human beings, Chomsky observes, language is associated with specific language centers in the brain that have no apparent parallel in apes… …In human beings, Chomsky points out, language is used in a way that is largely independent of immediate stimuli, the satisfaction of needs, or instrumental purposes… Our use is also governed by rules determining the structure of utterances, in a recursive way that allows for a potentially infinite number of sentences. The alleged cases of language use by apes exhibits none of these key features. Furthermore, human children come to learn language by mere exposure to it, without the need for explicit training… …Wishful thinking, dubious inferences, problematic methodology, and conceptual imprecision are rife in the work of researchers who claim to have taught ASL [American Sign Language] or some other linguistic system to apes… Nor is there behavior clearly exhibiting anything more than mere conditioning to carry out an action so as to secure some reward (as opposed to genuine understanding of a name), or simple associations of the kind a dog exhibits when it carries its leash over to its owner so as to go out for a walk. Nor is there any serious evidence that apes follow grammatical rules when emitting sequences of symbols (as opposed, say, to rote repetition of paired terms)… Nor do apes emit the alleged linguistic behavior they exhibit in a spontaneous way, as opposed to under prompting. Nor do they take turns in conversation, but sign simultaneously with their partner and in a manner that is not clearly visible to him. Nor once they gain whatever favility with words human trainers are able to impart to them, do they pass it on to other chimpanzees. Nor, unlike human beings, are they able to introduce new words by use of existing words. Arguments for linguistic competence in apes seem to get off the ground only because such obvious differences are ignored, while relatively trivial analogies between human and ape performance are overemphasized… As Chomsky says, to think this shows that such apes are exhibiting the early stages of genuine linguistic development is like supposing that a human child flapping his arms ‘is exhibiting’exhibiting incipient flight motions.”</p></blockquote>

eward+%28as+opposed+to+genuine+understanding+of+a+name%29%2C+or+simple+associations+of+the+kind+a+dog+exhibits+when+it+carries+its+leash+over+to+its+owner+so+as+to+go+out+for+a+walk.+Nor+is+there+any+serious+evidence+that+apes+follow+grammatical+rules+when+emitting+sequences+of+symbols+%28as+opposed%2C+say%2C+to+rote+repetition+of+paired+terms%29%E2%80%A6+Nor+do+apes+emit+the+alleged+linguistic+behavior+they+exhibit+in+a+spontaneous+way%2C+as+opposed+to+under+prompting.+Nor+do+they+take+turns+in+conversation%2C+but+sign+simultaneously+with+their+partner+and+in+a+manner+that+is+not+clearly+visible+to+him.+Nor+once+they+gain+whatever+favility+with+words+human+trainers+are+able+to+impart+to+them%2C+do+they+pass+it+on+to+other+chimpanzees.+Nor%2C+unlike+human+beings%2C+are+they+able+to+introduce+new+words+by+use+of+existing+words.+Arguments+for+linguistic+competence+in+apes+seem+to+get+off+the+ground+only+because+such+obvious+differences+are+ignored%2C+while+relatively+trivial+analogies+between+human+and+ape+performance+are+overemphasized%E2%80%A6+As+Chomsky+says%2C+to+think+this+shows+that+such+apes+are+exhibiting+the+early+stages+of+genuine+linguistic+development+is+like+supposing+that+a+human+child+flapping+his+arms+%E2%80%98is+exhibiting%E2%80%99exhibiting+incipient+flight+motions.%E2%80%9D%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Immortal+Souls%3A+a+Treatise+on+Human+Nature+%28Editiones+Scholasticae%2C+2024%29+%7C+pt.+2%2C+ch.+6%2C+%E2%80%98Animality%E2%80%99+%7C+%E2%80%98Animal+Intelligence%E2%80%99%2C+pp.+245-56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd397250552.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d397250552.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=whether%20any%20non%2Dhuman%20animals%20are%20intelligent,arms%20%E2%80%98is%20exhibiting%E2%80%99exhibiting%20incipient%20flight%20motions&amp;text=whether%20any%20non%2Dhuman%20animals

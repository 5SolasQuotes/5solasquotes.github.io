<main class="wrap"><figure class="quote" id="q-a7ad219589" data-kw="">
<blockquote><p>As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral.

1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant.

2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly.

3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases.

4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, (1646) | Part 2, ch. 8, p. 120</span></figcaption>

</figure><figure class="quote" id="q-53d9370573" data-kw="">
<blockquote><p>Here comes in that question, whether or not the power of the temporal magistrate (as such) be so derived from Christ, not only as God, but as Mediator, so that he is his deputy and vice-gerent. The negative may be made good by these following arguments:

1. The power of Christ’s deputies as Mediator is only ministerial, the power of servants or heralds (Lk. 22:25-26; Mt. 20:25-27): as Protestants prove against Papists in the controversy touching the supremacy of the Pope. But now the power of magistrates may be imperial and monarchical, and therefore it is not derived from Christ as He is Mediator unto his deputies.

2. All the deputies and vice-gerents of Christ as Mediator are obliged to promote the Kingdom and Gospel of Christ. But now heathenish magistrates that never heard, nor could hear of the name of Christ, are not bound to promote Christ’s Mediatory Kingdom and gospel: for they are invincibly ignorant thereof, and there can be no obligation without revelation (Jn. 15:22; Rom. 2:12). Therefore they are not the deputies and vice-gerents of Christ as Mediator, and therefore [they are] no magistrates as such: for, à quatenus ad de omni valet consequentia.

3. All the deputies and vice-gerents of Christ as Mediator have their commission from the Gospel; but now temporal magistrates have their commission at least from the secondary law of nature, the law of nations. But now the law of nature and nations dictates nothing of a Mediator, or anything relating unto Him as such. I should send the reader unto Mr. Gillespie in his Aaron’s Rod Blossoming, Book 2, chs. 6–7; to see farther of this subject, but because Mr. Baxter thinks Mr. Rutherford a more able disputant than Gillespie, I shall refer unto him, in his Lex &amp; Rex, Question 42, from pp. 422-433, as also his Divine Right of Church Government, [ch. 28] from pp. 600-42 where he prosecutes these and other arguments at large…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates</cite>, (Oxford, 1656), p. 43. Jeanes was an English presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-c6bf230a07" data-kw="">
<blockquote><p>VII. When the Scripture then says that Christ died for all, that He gave Himself a ransom for all, that He died for all, that He is a propitiation for the sins of the whole world: this is necessarily understood, either of the greatness of the price, or of the sufficiency of his merit for all men, or of the effectual redemption of all Jews and Gentiles that embrace by faith the benefits of his death: For in these, says Ambrose, a certain kind of universality is conceived [see footnote]. And this is no more repugnant [as the adversaries claim it is] to the doctrine of the Gospel than if some [adversaries] should say that Christ by his death did indifferently redeem and reconcile to God faithful Christians, and faithless Turks, heathens, Epicures, hypocrites, etc. although they receive not the merit of Christ by faith: which [latter] opinion [of the adversaries] is both impious, and repugnant to God’s Word.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“VII. When the Scripture then says that Christ died for all, that He gave Himself a ransom for all, that He died for all, that He is a propitiation for the sins of the whole world: this is necessarily understood, either of the greatness of the price, or of the sufficiency of his merit for all men, or of the effectual redemption of all Jews and Gentiles that embrace by faith the benefits of his death: For in these, says Ambrose, a certain kind of universality is conceived [see footnote]. And this is no more repugnant [as the adversaries claim it is] to the doctrine of the Gospel than if some [adversaries] should say that Christ by his death did indifferently redeem and reconcile to God faithful Christians, and faithless Turks, heathens, Epicures, hypocrites, etc. although they receive not the merit of Christ by faith: which [latter] opinion [of the adversaries] is both impious, and repugnant to God’s Word.”

— David Pareus, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVII.+When+the+Scripture+then+says+that+Christ+died+for+all%2C+that+He+gave+Himself+a+ransom+for+all%2C+that+He+died+for+all%2C+that+He+is+a+propitiation+for+the+sins+of+the+whole+world%3A+this+is+necessarily+understood%2C+either+of+the+greatness+of+the+price%2C+or+of+the+sufficiency+of+his+merit+for+all+men%2C+or+of+the+effectual+redemption+of+all+Jews+and+Gentiles+that+embrace+by+faith+the+benefits+of+his+death%3A+For+in+these%2C+says+Ambrose%2C+a+certain+kind+of+universality+is+conceived+%5Bsee+footnote%5D.+And+this+is+no+more+repugnant+%5Bas+the+adversaries+claim+it+is%5D+to+the+doctrine+of+the+Gospel+than+if+some+%5Badversaries%5D+should+say+that+Christ+by+his+death+did+indifferently+redeem+and+reconcile+to+God+faithful+Christians%2C+and+faithless+Turks%2C+heathens%2C+Epicures%2C+hypocrites%2C+etc.+although+they+receive+not+the+merit+of+Christ+by+faith%3A+which+%5Blatter%5D+opinion+%5Bof+the+adversaries%5D+is+both+impious%2C+and+repugnant+to+God%E2%80%99s+Word.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+Article+2%2C+%E2%80%98Of+Christ%E2%80%99s+Death+%26+Merit%E2%80%99+in+Aphorisms+of+the+Orthodox+Doctrine+of+the+Reformed+Churches+in+Zachary+Ursinus%2C+The+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29%2C+pp.+694-98&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc6bf230a07.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c6bf230a07.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=VII.%20When%20the%20Scripture%20then%20says,impious%2C%20and%20repugnant%20to%20God%E2%80%99s%20Word&amp;text=VII.%20When%20the%20Scripture%20then%20says%20that%20Christ

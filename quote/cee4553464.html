<main class="wrap"><figure class="quote" id="q-cee4553464" data-kw="">
<blockquote><p>The law is known partly by the light of nature (Rom. 2:14–15), but the gospel is known only by a revelation from heaven (Matt. 11:27). Man, though he is a fallen creature, has in some degree a natural knowledge of the law, but he has no natural knowledge of the gospel. The gospel was wrapped up in profound secrecy till it was revealed from heaven by the Son of God immediately after the fall, and therefore it is called “the mystery,” and “the mystery of Christ” (Rom. 16:25; Eph. 3:4). Hence, unregenerate sinners are commonly not so averse from hearing the doctrine of the law as they are from hearing that of the gospel. Legal doctrine they can naturally understand, for it has a testimony in their consciences; but evangelical doctrine is a strange, unaccountable, and incredible doctrine to them (1 Cor. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 132.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>

</figure><figure class="quote" id="q-6ac70eebd0" data-kw="">
<blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>

<blockquote><p>If the changeable [being] is taken strictly [see p. 11], there must be a subject of the change that is relatively permanent; therefore there is something else that is absolutely and independently permanent (from conclusion 2…); therefore there is something that is in itself unchangeable. If the changeable is taken in a broad sense then either it always existed thus or it did not; if it did not it is transient, and then too the unchangeable must exist. If the changeable always existed thus in fact, nevertheless it could not be altogether independent with respect to its persistence, for otherwise it would not be changeable in the broad sense. Therefore it would be dependent as to its persisting; therefore it would, like the relatively persistent, require a first independent thing existing simultaneously that is unchangeable also in the broad sense.” p. 37 12. An eternal being actually exists, or something actually existing is eternal.

13. An unchangeable being actually exists, or something actually existing is unchangeable.

14. Therefore being is divided into temporal and eternal (from conclusions 8, 9, and 10).

15. Therefore being is divided into unchangeable and changeable. If changeable is taken broadly [see p. 11], this conclusion follows from conclusions 8, 9, and 13. If it is taken strictly the existence of the unchangeable follows from what was said above about constant elements of our experience [see p. 33]. The existence of the unchangeable follows from conclusion 13.</p></blockquote>

<blockquote><p>For indeed, as the Creator of all things, He was from the beginning discovered equally with them, they having been themselves manifested that He might become known as God. For although Moses, some long while afterwards, seems to have been the first to introduce the knowledge of the God of the universe in the temple of his writings, yet the birthday of that knowledge must not on that account be reckoned from the Pentateuch. For the volume of Moses does not at all initiate the knowledge of the Creator, but from the first gives out that it is to be traced from Paradise and Adam, not from Egypt and Moses. The greater part, therefore, of the human race, although they knew not even the name of Moses, much less his writings, yet knew the God of Moses; and even when idolatry overshadowed the world with its extreme prevalence, men still spoke of Him separately by His own name as God, and the God of gods, and said, “If God grant,” and, “As God pleases,” and, “I commend you to God.” Reflect, then, whether they knew Him, of whom they testify that He can do all things. To none of the writings of Moses do they owe this. The soul was before prophecy. From the beginning the knowledge of God is the dowry of the soul, one and the same amongst the Egyptians, and the Syrians, and the tribes of Pontus. For their souls call the God of the Jews their God. Do not, O barbarian heretic, put Abraham before the world. Even if the Creator had been the God of one family, He was yet not later than your god; even in Pontus was He known before him. Take then your standard from Him who came first: from the Certain (must be judged) the uncertain; from the Known the unknown. Never shall God be hidden, never shall God be wanting. Always shall He be understood, always be heard, nay even seen, in whatsoever way He shall wish. God has for His witnesses this whole being of ours, and this universe wherein we dwell. He is thus, because not unknown, proved to be both God and the only One, although another still tries hard to make out his claim.</p></blockquote>

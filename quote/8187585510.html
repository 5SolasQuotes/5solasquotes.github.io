<blockquote><p>6. Though it were lawful to add other things contrived by ourselves, the Fathers, the papists or others to the sacred ceremonies instituted by God, yet nevertheless they must not be vain or frivolous; they are not to be multiplied excessively, and neither their perpetuity, uniformity or observation is necessary without a case of scandal or contempt.</p></blockquote>

</figure><figure class="quote" id="q-bf17dd8e89" data-kw="">
<blockquote><p>It is a contradiction that an action-individual should be indifferent, and so neither good nor evil, and yet done in faith and referred to God’s glory: For the ground of doing, which is faith, and the end, which is God’s glory, are individual properties necessarily concurring to the individuation of the action-moral. 2. An action-individual that is merely indifferent, and so without sin, may be performed without sin or omitted without sin, cannot be an action of faith referred to God’s glory: For what may be done without sin and may not be done without sin, is a will-action, and wants all necessity of reason, and so is an idle and sinful action; but a sinful action may be done in fancy, but in faith it cannot be done; it may in the vain intention of the doer be referred to God’s glory, in intentione erronea operantis, but ex conditione operis, according to the nature of the work, it serves not for God’s glory. This way to cast stones in the water [for example], should be of faith, and referred to God’s glory: But shall I believe I am doing in faith and glorifying God when I am casting stones in the water, and I have as good reason not to cast at all? If one will-action that may be done, and may not be done, may be of faith and referred to God’s glory, then may they all be of faith and referred to God’s glory: This is a laughter, rather than divinity. 3. I cannot believe that an action that has as good reason to be omitted as to be done, can be acceptable to God, because I have no ground for my faith; for my faith here leans neither on Scripture nor on Reason; but there is no reason why the action should rather be, nor not be, because it is indifferent; yea, crossing and kneeling [as worship] of themselves shall be of faith, because I believe them to be of faith: But it is a vain thing to say that faith makes its object. 4. There are no actions in the world but they have all their moral necessity from their intrinsic goodness: For from whence is it necessary to love God, but from the intrinsic goodness that the love of God has from God’s command? For there is no necessity an action to be at all; yea, it is idle and superfluous if there be no goodness in it at all. If then crossing and kneeling (laying aside the respect of humane laws commanding them) have no necessity-moral from any commandment of God why they should be at all, their necessity must be all from man’s will: this is tyranny in rulers for their sole pleasure to command under the heaviest pain things that have no necessity at all but their will. 5. Neither is it any yoke to men’s conscience, to square all their moral-action by God’s Word and so to see (‘according as it is written’) before they venture upon any action-moral. It is liberty to keep God’s way accurately.</p></blockquote>

<blockquote><p>Yet, with all his serenity, unlike the violence of his contemporaries, Shakspere showed in no uncertain way his dislike of the Puritans and their growing power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-balfour-daniels.html">R. Balfour Daniels</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Shakespere &amp; the Puritans’ in The Shakespeare Association Bulletin</cite>, vol. 13, no. 1 (Jan, 1938), pp. 40-53, p. 53</span></figcaption>

</figure><figure class="quote" id="q-60cf19bccc" data-kw="">
<blockquote><p>When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ([1637]), pt. 4, ch. 3, pp. 6-7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]”

— George Gillespie, English-Popish Ceremonies ([1637]), pt. 4, ch. 3, pp. 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+we+measure+the+goodness+or+the+badness+of+a+human+action%2C+we+must+not+only+measure+it+by+the+object+and+the+end%2C+but+by+all+the+circumstances+which+accompany+it.+Fed.+Morellus+upon+those+words+of+Seneca%2C+Refert+quid%2C+cui%2C+quando%2C+quare%2C+ubi%2C+etc.+says+that+without+those+circumstances+of+things%2C+persons%2C+times%2C+places%2C+facti+ratio+non+constat+%5Bit+does+not+consist+with+reason+of+fact%5D.+Circumstances+sometimes+constituunt+rerum+earum+quae+aguntur+speciem+%5Bestablish+those+things+which+direct+the+species%5D%2C+say+our+divines%2C+meaning+that+circumstances+do+make+an+action+good+or+bad.+Humani+actus+%5Ba+human+action%5D+say+the+Schoolmen%2C+non+solum+ex+objectis%2C+verum+ex+circumstantiis+boni+vel+mali+esse+dicuntur.+It+is+not+every+mans+part%2C+%28says+one+of+our+opposites%29+to+judge+de+circumstantia%2C+quae+reddit+actionem+vel+bonam+vel+malam.+Some+circumstances+says+another+of+them%2C+are+intrinsical+and+essential+to+actions%2C+and+specially+making+up+their+nature.+The+principal+circumstances+which+here+we+speak+of%2C+are+comprehended+in+this+versicle%3A+%E2%80%98Quis%2C+Quid%2C+Ubi%2C+Quibus+auxiliis%2C+Cur%2C+Quomodo%2C+Quando.%E2%80%99+%5B%E2%80%98Who%2C+what%2C+where%2C+by+what+means%2C+why%2C+what+way%2C+when.%E2%80%99%5D%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%28%5B1637%5D%29%2C+pt.+4%2C+ch.+3%2C+pp.+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60cf19bccc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/60cf19bccc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=When%20we%20measure%20the%20goodness%20or,what%20means%2C%20why%2C%20what%20way%2C%20when&amp;text=When%20we%20measure%20the%20goodness%20or%20the%20badness&amp;text=where%2C%2

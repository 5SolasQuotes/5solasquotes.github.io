<main class="wrap"><figure class="quote" id="q-c9e225d1ed" data-kw="">
<blockquote><p>How few be they in our times, who by observing this distance do declare that they believe the Church to be God’s house, how many that come in without preparing themselves at first by devotion and prayer? How many who clap on their hats when God is speaking to them by his Word, I mean in the time when the very text is reading? Nay the servant who will be uncovered before this master in his own house, will many times be covered before him in God’s house; all which bewrays that many men do either take the Church not to be ‘my house’ [Mt. 21:13], that is, God’s; or (which is worse) God’s house not to be so good as their own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-balcanquhall.html">Walter Balcanquhall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Honor of Christian Churches &amp; the Necessity of Frequenting of Divine Service &amp; Public Prayers in them. Delivered in a Sermon at White-Hall before the King’s most excellent Majesty</cite>, … (London, 1633), p. 14 Balcanquhall (1586?–1645) was a Scottish clergyman who became a staunch royalist and supporter of the church policy of Charles I of England (which was fundamentally Anglican), Balcanquhall being the author the defense of the King’s actions against the Scots in the 2nd Reformation, His Majestie’s Large Declaration concerning the Late Tumults in Scotland (1639).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15a6d09e85" data-kw="">
<blockquote><p>Part III will find the exact ‘covering’ prohibited to men while ‘praying or prophesying’ (11:4) is less certain [compared to the woman’s covering], though it seems Paul proscribed Corinthian men from wearing any dishonoring covering in the assemblies, namely which hung down from their heads, whether material, a hair–bun or long hair, yet not wreaths, helmets, hats or turbans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Part III of 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pp. 232-57, p. 9</span></figcaption>

</figure><figure class="quote" id="q-cdfc0eea12" data-kw="">
<blockquote><p>All that outward reverence which we show towards God in his worship and service must be measured and estimated according to the customs and usage of places and countries; so that what they use as a sign and expression of honor to their superiors, they ought much more to use it in the presence of the great God, the King of Kings and Lord of Lords. And therefore uncovering of the head [for men], bowing of the body, an humble submiss and settled composure of the whole man, which among us are but fitting signs of respect and reverence, when we appear in the presence of those who are much our superiors, ought likewise to be used by us in the presence of God, who is infinitely such, not indeed that they are essential parts of worship, but signs and testimonies of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments with other Sermons</cite>, … (London, 1691) | Second Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-82a48c5391" data-kw="">
<blockquote><p>[Durell:] ‘There was a great irreverence at prayer in their congregations, very few kneeling, many not so much as putting off their hats, and of this,’ he says, he was an eye-witness. …Into how many congregations he went where many did not so much as put off their hats in the time of prayer? And whether he either saw or heard that the ministers of those churches did any way countenance that irreverence? …For ought I know those in whom he observed this irreverence might be sectaries, who did more bitterly inveigh against presbyterians than against any other men whatever; perhaps also they might be episcopal-men, who designed to put an affront upon the presbyterians’ prayers: just as now some are observed to sit upon their breech all the time of pulpit-prayer, unless when just the Lord’s prayer is repeating, because forsooth pulpit-prayer is not allowed by the [establishing Anglican] Church, but only bidding of prayer. I write it with grief, but I must write it, I never in any congregations where I have been observed so much irreverence as I have observed in those in which there is the greatest abundance of such as always pretended a love to the English [Anglican] liturgy; particular stories I might relate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans</cite>, [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662., pp. 125-26</span></figcaption>

</figure><figure class="quote" id="q-395f676083" data-kw="">
<blockquote><p>I will address the following three questions: (1) To what extent would male head-covering ideology in Greek and Roman cultures be at loggerheads with the text of 1 Cor 11:4? (2) To what extent would wearing a veil for a man create tensions of shame and conflict in the church in Roman Corinth? And (3) what is the specific issue regarding male sartorial practice? I will first address the controversial and long-standing issue of whether the verse refers to veils, long hair, or both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Long Hair as a Glory &amp; as a Covering: Removing an Ambiguity from 1 Cor 11:15’ Novum Testamentum</cite>, vol. 53, Fasc. 1 (2011), pp. 52-72, p. 503</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

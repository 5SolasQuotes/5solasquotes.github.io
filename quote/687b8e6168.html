<blockquote><p>Moreover, what the orthodox fathers and the scholastics who followed their steps handed down very well was commonly known: namely that the natural gifts have been corrupted and the supernatural ones lost. So from this statement we establish that supernatural theology, which by the sin of man had been, as it were, rejected and most undeservedly spurned, retreated from here to the heavens; and natural theology, as all the other things which arise from nature, was corrupted. For how could it have remained uncorrupted in a subject that was corrupted in every part?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f393fe631" data-kw="">
<blockquote><p>4. Another expression of this arrogant ignorance is, when men will not believe the several truths of God, because they are not able to reconcile them, and place each one in its own order, and see the method and body of truth in its true locations and proportion: Nay, perhaps they will believe none, because they cannot discern the harmony. …These self-conceited ignorant souls, do imagine all to be impossible which exceeds their knowledge; and because they cannot see[?] the sweet consent of Scripture, and how those places do suit, and fortify each other, which to them seemed to contradict each other, therefore they think that no one else can see it; no not God Himself… And upon this account many cast away particular truths, though they will not cast away all. Some cannot reconcile the efficiency of the Spirit, with that of the Word, in the Conversion and Confirmation of sinners; and therefore some exclude one, and some the other, or own by the empty names; some cannot reconcile the Law, and the Gospel: And too great a part of the teachers, in the Christian world, have been so troubled to reconcile God’s grace, with man’s free-will, that of old, many did too much exclude the natural liberty of the will, upon a supposition of the inconsistency; only the names of both were still owned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arrogancy of Reason Against Divine Revelations</cite>, Repressed. Or, Proud Ignorance the Cause of Infidelity, and of Men’s Quarrelling with the Word of God (1655; London), pp. 21-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

olas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f393fe631.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=4.%20Another%20expression%20of%20this%20arrogant,names%20of%20both%20were%20still%20owned&amp;text=4.%20Another%20expression%20of%20this%20arrogant%20ignorance%20is&amp;text=only%20the%20names%20of%20both%20were%20still%20owned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-e052571c14" data-kw="">
<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

 href="../quote/e052571c14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-nature-grace/#:~:text=I%20answer%20that%20immortality%20indicates%20a,and%20spiritual%2C%20as%20well%20as%20impassible&amp;text=I%20answer%20that%20immortality%20indicates%20a%20certain%20potential&amp;text=agile%2C%20bright%2C%20and%20spiritual%2C%20as%20well%20as%20impassible" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4941084f95" data-kw="">
<blockquote><p>Today, the doctors of the Roman Church accuse the Protestants of denying free will; where, however, it should be noted that the question is not about the state of Integrity… But when they deal with the state of sin, they attribute to Luther, Calvin and other reformers that they teach that free will was utterly extinguished and lost through the Lapse of Adam, and therefore that man after the Lapse does not have free will. But it never came into the mind of the Protestants to simply deny free will, even after the lapse, neither with respect to natural works, nor civil, nor moral works of the natural order; but they only denied the rectitude and sanity of free will, and its natural powers for spiritual good, in which matter they followed Augustine, Enchiridion, ch. 30, ‘Man, by making bad use of free will, destroyed both himself and it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), p. 5 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<main class="wrap"><figure class="quote" id="q-76e3017eee" data-kw="">
<blockquote><p>We deny not the possibility of salvation within the communion of the Romish Church; for even on the eve of her destruction, God has a people to be brought out of her. But subverting, as she does, the grace of the Gospel, there is extreme peril to the salvation of any who remain in such a connection. If saved at all, the adherents of the Papacy will be saved, not by Rome, but in spite of her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of the Papacy: And the Reign of Righteousness</cite>, (1851) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 1: 351.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

— Thomas Houston, The Judgment of the Papacy: And the Reign of Righteousness, (1851) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 1: 351.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+deny+not+the+possibility+of+salvation+within+the+communion+of+the+Romish+Church%3B+for+even+on+the+eve+of+her+destruction%2C+God+has+a+people+to+be+brought+out+of+her.+But+subverting%2C+as+she+does%2C+the+grace+of+the+Gospel%2C+there+is+extreme+peril+to+the+salvation+of+any+who+remain+in+such+a+connection.+If+saved+at+all%2C+the+adherents+of+the+Papacy+will+be+saved%2C+not+by+Rome%2C+but+in+spite+of+her.%E2%80%9D%0A%0A%E2%80%94+Thomas+Houston%2C+The+Judgment+of+the+Papacy%3A+And+the+Reign+of+Righteousness%2C+%281851%29+in+Works+Doctrinal+and+Practical+of+the+Rev.+Thomas+Houston%2C+D.D.%2C+Knockbracken+%284+vols%2C+Edinburgh%3A+Andrew+Elliot%2C+1876%29%2C+1%3A+351.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76e3017eee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76e3017eee.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/12/26/thomas-houston-on-salvation-within-the-church-of-rome/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c105d82d17" data-kw="">
<blockquote><p>That these [apostates] fall away, that is, come to gross sinful deeds. For a true believer can fall into all sins, excepting that against the Holy Ghost; and can remain in them, some for shorter, some for longer periods, as David did for almost a year at least; but these so fall away as to have pleasure in it, as to blaspheme the former way and entertain a secret hatred of all who are truly godly, unless it be such as protect and help them in difficulties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), p. 103.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

</figure><figure class="quote" id="q-a391f5c7aa" data-kw="">
<blockquote><p>3rd Consideration. There is a separation from the Church in the most part, or from the Church in the least and best part. In Ahab’s time, Israel, and the Church thereof, for the most part, worshipped Baal; Elijah, Micah, Obadiah and other godly separated from the Church of Israel in the most part: Jeremiah wished to have a cottage in the wilderness (no doubt a godly wish) that he might separate from the Church all then for the most part corrupted, yet remained they a part of the visible Church and a part in the visible Church, and therefore did he not separate from the Church according to the least and best part thereof; The godly in England who refused the Popish ceremonies and Antichristian Bishops did well not to separate from the visible Church in England, and yet they separated from the mainest and worst part [in the Roman fold], which cannot be denied to be a ministerial Church. … 5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church.

6. We may well hold that Ambrose says well that a Church wanting the foundation of the apostles is to be forsaken.

7. There is a forced separation through tyranny from personal communion, and a voluntary separation; David was forced to leave Israel and was cast out of the Inheritance of the Lord; the former is not our sin, and our separation from Rome has something of the former, the latter would be wisely considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644) | pt. 2, pp. 253-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

</figure><figure class="quote" id="q-19218df25b" data-kw="">

</figure><figure class="quote" id="q-c39fb5cf7c" data-kw="Apostolic succession">
<blockquote><p>Here, then, is the value of succession when not conjoined with imitation and corresponding conduct: posterity, as soon as they are convicted of having revolted from their origin, are deprived of all honour; unless, indeed, we are prepared to say, that because Caiaphas succeeded many pious priests (nay, the series from Aaron to him was continuous), that accursed assembly deserved the name of Church. … That in the government of the Church especially, nothing is more absurd than to disregard doctrine, and place succession in persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.3</span></figcaption>

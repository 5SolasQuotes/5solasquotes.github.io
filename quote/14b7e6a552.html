<blockquote><p>XII. Indeed in the I Tim. 4. 10. God is called σωτηρ, the Saviour of all men. But the Apostle there speaketh of the preservation in this present life, and of the providence of God, which is extended to the preservation of all men: which care, David, Psal. 36 doth extend even to the beasts, for there God is called the preserver of men and beasts. The precedent words of the Apostle doth declare this: We hope in the living God; for he speaketh of God, as he doth give life to things created by him. A like place you have, Acts. 17.25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 29.12, p. 218.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (1637), p. 420</span></figcaption>

</figure><figure class="quote" id="q-3ee62f6ad6" data-kw="">
<blockquote><p>Speaking at Inverness on 25 April 1638, Andrew Mant reminded the Covenanters that the Scottish Reformation was far superior to that in England and even that in Geneva. This was because the Scots had got rid of popish innovations, such as holy days, which other Reformers had not been able to extirpate:

LONG ago our gracious God was pleased to visit this nation with the light of His glorious Gospel, by planting a vineyard in, and making His glory to arise upon Scotland. A wonder! that so great a God should shine on so base a soil! Nature hath been a stepmother to us in comparison of those who live under a hotter climate, as in a land like Goshen, or a garden like Eden. But the Lord looks not as man: His grace is most free, whereby it often pleaseth Him to compense what is wanting in nature: whence upon Scotland (a dark obscure island, inferior to many) the Lord did arise, and discovered the tops of the mountains with such a clear light, that in God’s gracious dispensation, it is inferior to none. How far other nations outstripped her in naturals, as far did she out-go them in spirituals. Her pomp less, her purity more: they had more of antichrist than she, she more of Christ than they: in their reformation something of the beast was reserved; in ours, not so much as a hoof. When the Lord’s ark was set up among them, Dagon fell, and his neck brake, yet his stump was left; but with us, stump and all was cast into the brook Kidron. Hence king James his doxology in face of parliament, thanking God who made him king in such a kirk that was far beyond England (they having but an ill-said mass in English) yea, beyond Geneva itself; for holy-days (one of the beast’s marks) are in part there retained, which (said he) to day are with us quite abolished. […] Such was the glory, perfection, order, and unity of this house, that the altar of Damascus could have no peace, the Canaanite no rest, heresy no hatching, schism no footing, Diotrephes no incoming, the papists no couching, and Jezebel no fairding [sic].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-cant.html">Andrew Cant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The National Covenant: exhortation at Inverness in James Kerr (ed.), The Covenants and the Covenanters: covenants, sermons, and documents of the Covenanted Reformation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-84ac2bae91" data-kw="">
<blockquote><p>First, among the Gentiles at Antioch, he uses Christian liberty in eating things forbidden by the ceremonial law. Yet after the coming of certain Jews from Jerusalem, he separates himself from the Gentiles and plays the Jew among the Jews. Like to this was the halting of the Israelites between God and Baal (1 Kings 18:21), and the practice of sundry men who are Protestants with us; and yet in other countries go to Mass, and the practice of our people, who change their religion with the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:102 (on Galatians 2:12–13; HT: Inwoo Lee).</span></figcaption>

<blockquote><p>We consider the placement of images and statues in the places of worship as explicitly forbidden by God’s Word a thousand times. For why else would they be placed there except for worship? Is it to stir the memory? And yet the Holy Spirit is wiser than we are.</p></blockquote>

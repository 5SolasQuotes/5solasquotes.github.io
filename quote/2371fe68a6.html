<main class="wrap"><figure class="quote" id="q-2371fe68a6" data-kw="limbo">
<blockquote><p>Still it must be confessed that others are not so rigid, but allow certain exceptions. First, that this necessity had a place only after the death of Christ and from the day of Pentecost. Again, the baptism of water could be supplied by the desire for it or by martyrdom. Hence the Council of Trent utters an anathema against those “who say that without the sacraments, or a desire for them, men receive the grace of justification by faith alone” (Session 7, Canon 4, Schroeder, p. 52).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/baptism-in-rome.html">Baptism in Rome</a> › <a href="../topics/baptism/baptism-in-rome/necessity-of-baptism.html">Necessity of baptism</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4c1b9cb59" data-kw="">
<blockquote><p>If the sacraments are said to remit sins, to save and to regenerate (Acts 2:38; 22:16; Eph. 5:26; Tit. 3:5; 1 Pet. 3:21), they do not do this by a proper, immediate and internal force (as is evident from 1 Pet. 3:21). Rather they do it sacramentally and improperly because they are efficacious signs by which those benefits are signified and sealed and in their legitimate use conferred.… When remission of sins is ascribed to baptism (Acts 22:16), it is not ascribed to it except under the relation of a sign and seal and not under the relation of a true, proper and immediate physical cause… In fine, although that remission is ascribed to baptism, it does not belong to it by reason of the external action properly, but by reason of the internal grace and receiving faith, without which all the external ablution is in vain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 19</span></figcaption>

</figure><figure class="quote" id="q-fb2d831f99" data-kw="immersion">
<blockquote><p>Now, however, in colder places especially, when the church began to extend itself towards the north, katapontismos was changed into rhantismon and sprinkling only was used. As by no means repugnant to the institution of Christ, so this can be confirmed by the examples of the apostolic church and the primitive church which followed it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19</span></figcaption>

</figure><figure class="quote" id="q-c75cdbc07a" data-kw="">
<blockquote><p>The grace which is exhibited in or by the sacraments rightly used, is not conferred by any power in them; neither doth the efficacy of a sacrament depend upon the piety or intention of him that doth administer it: but upon the work of the Spirit, and the word of institution, which contains, together with a precept authorizing the use thereof, a promise of benefit to worthy receivers. … Although it be a great sin to contemn or neglect this ordinance, yet grace and salvation are not so inseparably annexed unto it, as that no person can be regenerated, or saved, without it; or, that all that are baptized are undoubtedly regenerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 27.3; 28.5</span></figcaption>

</figure><figure class="quote" id="q-305c2b20cb" data-kw="">
<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on Mark 16:16 (the necessity of baptism)</span></figcaption>

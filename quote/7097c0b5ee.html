<main class="wrap"><figure class="quote" id="q-7097c0b5ee" data-kw="">
<blockquote><p>…it remains to consider what third, middle path he [Scotus] appears to have chosen. Namely, that God concurs with free secondary causes in such a way that He does not await their free consent before concurring… nor does He merely accompany them by offering concurrence if they wish to act… nor does He predetermine them to act by means of some prior quality or physical motion impressed antecedently upon the will… Rather, God determines them in such a way that through the very same act or concurrence which He provides with certainty and determination toward the free act — by virtue of the essential subordination and dependence which the secondary cause has with respect to the first — He determines them antecedently, yet contingently and freely. And this mode of determining is such that it is not contrary to created freedom; indeed, it is fitting and necessary, and through this determination the proper subordination and dependence of the creature upon the Creator is established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, p. 396</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>
<div class="actions"><button class="copy" data-copy="“…it remains to consider what third, middle path he [Scotus] appears to have chosen. Namely, that God concurs with free secondary causes in such a way that He does not await their free consent before concurring… nor does He merely accompany them by offering concurrence if they wish to act… nor does He predetermine them to act by means of some prior quality or physical motion impressed antecedently upon the will… Rather, God determines them in such a way that through the very same act or concurrence which He provides with certainty and determination toward the free act — by virtue of the essential subordination and dependence which the secondary cause has with respect to the first — He determines them antecedently, yet contingently and freely. And this mode of determining is such that it is not contrary to created freedom; indeed, it is fitting and necessary, and through this determination the proper subordination and dependence of the creature upon the Creator is established.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d43476860a" data-kw="">
<blockquote><p>All the acts necessary for war-making are, in an eminent manner, ascribed to God, as (1) The Lord fights for his own people. (2) The Lord scattered the enemies. (3) The Lord slew Og, king of Bashan. (4) The battle is the Lord’s. (5) The victory [is] the Lord’s; therefore Israel never fought a battle. So Deut. 32[:10], The Lord alone led his people — the Lord led them in the wilderness — their bow and their sword gave them not the land. God wrought all their works for them (Isa. 26:12), therefore Moses led them not; therefore the people went not on their own legs through the wilderness; therefore the people never shot an arrow, never drew a sword. It follows not. God did all these as the first, eminent, principal and efficacious pre-determinator of the creature (though this Arminian and popish prelate [John Maxwell] mind not so to honour God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-efaf10d6c9" data-kw="">
<blockquote><p>This prior motion or immediate influence on the cause is not necessary for the will to be able to act if it wishes; for it has that by its own power or through supernatural habits; but it is necessary only for it to act actually. Hence, from the fact that the will is not moved by God with that prior motion, it does not follow that it cannot will or act; but it only follows that it will not actually act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXIV. Alvares attempts to reconcile the physical predetermination of the human will to its acts by the impulse of the moving God with the free choice of the same will in another way. After proposing this objection to himself, “If the prior divine influence is necessary for the cause so that the will may act, it follows that without it, the will cannot act, thus its freedom will perish,” he responds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin">
<blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Absolute Predestination</cite>, tr. Augustus Toplady, on the omnipotence of God</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f1d9a78bd" data-kw="">
<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mary-fellman.html">Mary Fellman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Social Context Of Tertullian’s ‘On The Veiling Of Virgins” MA thesis (Cornell Univ., 2009) 55</cite>, pp. no pictures</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-fdb471fcca" data-kw="">
<blockquote><p>Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-richardson.html">John Richardson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Choice Observations &amp; Explanations upon the Old Testament… which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.”

— John Richardson, Choice Observations &amp; Explanations upon the Old Testament… which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+signs+of+lamentations+are+expressed+here.+Which+from+hence+and+other+Scriptures+may+more+fully+be+gathered+thus%3A+Sighing%2C+mourning%2C+mournful+songs%2C+weeping%2C+howling%2C+fasting%2C+changing+of+the+garments%2C+mourning+women%2C+Jer.+9%3A17%3B+2+Chron.+35%3A25%3B+Amos+5%3A16%2C+rending+of+the+clothes%2C+wearing+black+and+sackcloth%2C+sitting+on+the+ground+and+keeping+silence%2C+lying+prostrate+upon+the+ground%2C+sitting%2C+lying%2C+covering%2C+rolling%2C+wallowing+in+ashes%2C+in+dust+and+ashes%2C+casting+up+dust%2C+ashes%2C+earth+upon+them+and+their+heads%2C+spreading+and+wringing+the+hands%2C+laying+the+hands+upon+the+head%2C+smiting+with+the+hand%2C+stamping+with+the+feet%2C+hanging+down+the+head%2C+uncovering+the+head+and+bare%2C+and+again+in+some+ages%2C+the+covering+the+head%2C+covering+head+and+face+too%2C+as+our+close+mourners%2C+covering+the+upper+lip%2C+bare-foot%2C+shaving+the+head+and+beard%2C+making+baldness%2C+plucking+off+the+hair%2C+beating+the+breast%2C+printing+marks+upon+the+flesh%2C+tearing+it%2C+cutting+it.%E2%80%9D%0A%0A%E2%80%94+John+Richardson%2C+Choice+Observations+%26+Explanations+upon+the+Old+Testament%E2%80%A6+which+are+Additionals+to+the+Large+Annotations+made+by+some+of+the+Assembly+of+Divines%E2%80%A6+%28d.+1654%3B+London%2C+1655%29%2C+on+Lamentations%2C+p.+425+Richardson+%281580-1654%29+was+an+English+bishop+of+the+Church+of+Ireland.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdb471fcca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdb471fcca.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Many%20signs%20of%20lamentations%20are%20expressed,the%20flesh%2C%20tearing%20it%2C%20cutting%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d7eea18eda" data-kw="">
<blockquote><p>The Greek word εξουσια [authority or power] more properly signifies the power she had of putting on and off her covering as she pleased, according as times, places, and persons made it necessary:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11 | v. 10</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Greek word εξουσια [authority or power] more properly signifies the power she had of putting on and off her covering as she pleased, according as times, places, and persons made it necessary:”

— John Gill, Exposition of the Whole Bible, on 1 Cor. 11 | v. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Greek+word+%CE%B5%CE%BE%CE%BF%CF%85%CF%83%CE%B9%CE%B1+%5Bauthority+or+power%5D+more+properly+signifies+the+power+she+had+of+putting+on+and+off+her+covering+as+she+pleased%2C+according+as+times%2C+places%2C+and+persons+made+it+necessary%3A%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+Exposition+of+the+Whole+Bible%2C+on+1+Cor.+11+%7C+v.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd7eea18eda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d7eea18eda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=The%20Greek%20word%20%CE%B5%CE%BE%CE%BF%CF%85%CF%83%CE%B9%CE%B1%20%5Bauthority%20or,places%2C%20and%20persons%20made%20it%20necessary%3A" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb9354003c" data-kw="">
<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

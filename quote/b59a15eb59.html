<blockquote><p>2. THE PROMISE OF THE COVENANT. The great promise of the covenant of works was the promise of eternal life. They who deny the covenant of works generally base their denial in part on the fact that there is no record of such a promise in the Bible. And it is perfectly true that Scripture contains no explicit promise of eternal life to Adam. But the threatened penalty clearly implies such a promise. When the Lord says, “for in the day that thou eatest thereof thou shalt surely die,” his statement clearly implies that, if Adam refrains from eating, he will not die, but will be raised above the possibility of death. The implied promise certainly cannot mean that, in the case of obedience, Adam would be permitted to live on in the usual way, that is, to continue the ordinary natural life, for that life was his already in virtue of his creation, and therefore could not be held out as a reward for obedience. The implied promise evidently was that of life raised to its highest development of perennial bliss and glory. Adam was indeed created in a state of positive holiness, and was also immortal in the sense that he was not subject to the law of death. But he was only at the beginning of his course and did not yet possess the highest privileges that were in store for man. He was not yet raised above the possibility of erring, sinning, and dying. He was not yet in possession of the highest degree of holiness, nor did he enjoy life in all its fulness. The image of God in man was still limited by the possibility of man’s sinning against God, changing from good to evil, and becoming subject to the power of death. The promise of life in the covenant of works was a promise of the removal of all the limitations of life to which Adam was still subject, and of the raising of his life to the highest degree of perfection. When Paul says in Rom. 7:10 that the commandment was unto life, he means life in the fullest sense of the word. The principle of the covenant of works was: the man that does these things shall live thereby; and this principle is reiterated time and again Scripture, Lev. 18:5; Ezek. 20:11, 13, 20; Luke 10:28; Rom. 10:5; Gal. 3:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 216.</span></figcaption>

<blockquote><p>It therefore now appears, that as the law or dictates of pure nature, comprehended together with other fit additionals, became at first one entire constitution aptly suited to the government of man in his innocent state, unto which the title did well agree of the law or covenant of works: so the same natural dictates, transcribed and made express (because now sullied, and not so legible in the corrupted nature of man) do, with such allays [alleviation] and additions as the case required, compose and make up the constitution which bears the title of the law or covenant of grace, or the law of faith, or the gospel of Christ; and is only suitable to the state of man lapsed and fallen, as the measure of that righteousness which he is now to aim at, and aspire unto.</p></blockquote>

<blockquote><p>Canon 8: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon 9: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself.</p></blockquote>

· Reformed Books Online</a></div>
</figure><figure class="quote" id="q-30de8ba973" data-kw="">
<blockquote><p>Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).</p></blockquote>

</figure><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.”

— John Calvin, Institutes of the Christian Religon (1559), 2.1.4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause+what+God+so+severely+punished+must+have+been+no+light+sin+but+a+detestable+crime%2C+we+must+consider+what+kind+of+sin+there+was+in+Adam%E2%80%99s+desertion+that+enkindled+God%E2%80%99s+fearful+vengeance+against+the+whole+of+mankind.+To+regard+Adam%E2%80%99s+sin+as+gluttonous+intemperance+%28a+common+notion%29+is+childish.+As+if+the+sum+and+head+of+all+virtues+lay+in+abstaining+solely+from+one+fruit%2C+when+all+sorts+of+desirable+delights+abounded+everywhere%3B+and+not+only+abundance+but+also+magnificent+variety+was+at+hand+in+that+blessed+fruitfulness+of+earth%21+We+must%2C+therefore%2C+look+deeper+than+sensual+intemperance.+The+prohibition+to+touch+the+Tree+of+Knowledge+of+good+and+evil+was+a+trial+of+obedience+%28obedientiae+examen%29%2C+that+Adam%2C+by+observing+it%2C+might+prove+his+willing+submission+to+the+command+of+God.+%E2%80%A6The+promise%2C+which+gave+him+hope+of+eternal+life+as+long+as+he+should+eat+of+the+tree+of+life+%28arbore+vitae%29%2C+and%2C+on+the+other+hand%2C+the+fearful+denunciation+of+death+the+moment+he+should+taste+of+the+Tree+of+Knowledge+of+good+and+evil%2C+were+meant+to+test+and+exercise+his+faith.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religon+%281559%29%2C+2.1.4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d4fed99d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d4fed99d8.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/calvin-on-the-substance-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

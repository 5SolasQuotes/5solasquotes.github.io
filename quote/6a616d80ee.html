<main class="wrap"><figure class="quote" id="q-6a616d80ee" data-kw="">
<blockquote><p>No more baseless fantasy ever entered the mind of man than that the Church and State can be completely separate! […] In good sooth, I can look upon it as little less than a species of infatuation, to teach that Church and State must be entirely separated – because, if the Church cannot reform and Christianize the State, then, undoubtedly, the State will tyrannise over and persecute the Church! Does the British Constitution let the United Secession Church alone? Indeed it does no such thing! That Constitution binds down every minister and member of that Church to swear, if called upon, that Christ is not the Head of the Church, but that a man, a woman, or a child, is the Head of the Church! Does the constitution and government of the United States of America – where there is no Established Church – let the Church alone? Indeed it does not; for, in America the Sabbath is systematically profaned, so that ministers and church-goers can scarcely “hear their ears,” in some cases, so loud is the unholy din of the freebooters on the domain of the Fourth Commandment, who, intent on business or pleasure, tramp along the streets and highways!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), pp 20-1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e661f7cd8d" data-kw="">
<blockquote><p>2. This [God’s injunction to obey civil magistrates] condemns the clergy of Rome, that exempt themselves from all princes’ authority, whereas God has said, ‘Let every soul be subject to the higher powers’ [Rom. 13:1]: If they have souls they must be subject. But how do they exempt themselves? … 2. By the Donation of Constantine; but its not in the power of princes so to do: They [princes] may exempt them [clergy] from tribute [taxes], if they will, as Pharoah took not the priests’ lands to gage for Corn; but to exempt them from subjection: they cannot. This were to make themselves wiser then God, who has put them under their authority, yea, the too much indulgence and favor of emperors, has been the bane of the Church, and helped up the Pope into his stirrup; Therefore its wisdom in them to hold their authority which God has given them.</p></blockquote>

</figure><figure class="quote" id="q-ae496d5d91" data-kw="">
<blockquote><p>Some that live in countries where none in twenty miles openly use the New [translation of Scripture, the KJV] one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that:

1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit.

2. That when they have no public church or worship to join with, but what uses the Old [faulty] one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit.

3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says:

1. That it is a cursed thing to offer God a worse [worship] while we have better.

2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.]

3. That it is false worship and obeying man before God.

4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them.

5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers:

I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice.

II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-25a73203b7" data-kw="">
<blockquote><p>But I pray you what do people get when wars for recoveries of dubious rights are long and calamitous? What are the people of France or the people of Spain better for the long and hereditary anger of their two kings? Or what was the world better for Alexander’s conquering it? The [English Parliament] Houses which are burnt and the millions of bodies left dead in the field are the peoples; and princes scorning to derive from them [the people] still trample them to dung.</p></blockquote>

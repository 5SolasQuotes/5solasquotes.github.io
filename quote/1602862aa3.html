<main class="wrap"><figure class="quote" id="q-1602862aa3" data-kw="">
<blockquote><p>Our graces are imperfect, our comforts ebb and flow—but God&#x27;s foundation stands sure. They who are built upon this rock of God&#x27;s eternal purpose, need not fear falling away; neither the power of man, nor the violence of temptation, shall ever be able to overturn them!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Divine Cordial</cite>, p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a> › <a href="../topics/perseverance-of-the-saints/grounds-of-perseverance/election.html">Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c7372b0c9" data-kw="Perseverance Comfort">
<blockquote><p>Christ your Head is risen, therefore you cannot be lost: nay, he is not only risen from the dead himself, but is also &quot;become the first-fruits of them that slept,&quot; 1 Cor. 15: 20. Believers are his members, his fulness, he cannot therefore be complete without you: a part of Christ cannot perish in the grave, much less burn in hell. Remember, when you feel the natural union dissolving, that this mystical union can never be dissolved: the pangs of death cannot break this tye.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), Inference 7</span></figcaption>

</figure><figure class="quote" id="q-d608331739" data-kw="">
<blockquote><p>Though many storms and floods arise and beat against them, yet they shall never be able to take them off that foundation and rock which by faith they are fastened upon; notwithstanding, through unbelief and the temptations of Satan, the sensible sight of the light and love of God may for a time be clouded and obscured from them, yet he is still the same, and they shall be sure to be kept by the power of God unto salvation, where they shall enjoy their purchased possession, they being engraven upon the palm of his hands, and their names having been written in the book of life from all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 17.1</span></figcaption>

</figure><figure class="quote" id="q-780939a2cf" data-kw="">
<blockquote><p>God continues to forgive the sins of those that are justified, and although they can never fall from the state of justification, yet they may, by their sins, fall under God’s fatherly displeasure; and in that condition they usually do not have the light of his countenance restored to them, until they humble themselves, beg pardon, and renew their faith and repentance (Matt. 6:12; 1 John 1:7, 9; John 10:28; Ps. 89:31–33; Ps. 32:5; Ps. 51; Matt. 26:75).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ce5e3f750a" data-kw="">
<blockquote><p>1. What is meant by saying that the union of the elect with Christ “is the work of God’s grace”? This means that union with Christ is a gift of God, which is accomplished by the almighty work of his Holy Spirit; it is not something that we can achieve or do for ourselves.

2. What is meant by saying that we are “spiritually and mystically” joined to Christ? This expression guards against the idea that we are literally joined to Christ as if he were an earthly person. The church is the body of Christ, and Christians are the members of Christ, but only in a spiritual sense, not in a physical or material sense of the word.

3. Why does the catechism add the words “yet really and inseparably”? Because spiritual relationships, while mysterious and invisible, are yet true and real. We naturally tend to regard that which we cannot see or understand as imaginary or unreal. Our spiritual union with Christ is both invisible and mysterious, but that does not mean that it is unreal. Spiritual things, in their own sphere, are just as real as material things. Moreover, our union with Christ is also unbreakable and permanent. The person who is once truly joined to Christ will always be joined to Christ; therefore the catechism adds the word inseparably.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 144-45.</span></figcaption>

<blockquote><p>Durand [d. 1296] distinguisheth of a twofold composition: Hujus ex his [of this out of that], &amp; hujus ad hoc [of this to that] (bk. 3, Distinction 7, question 3 [this distinction is from Aristotle]). … ‘There is’ (says he) ‘a second kind of composition, and that is hujus ad hoc, and it is not so properly a composition of a third thing out of the things united, as an adjoining of one of the things united unto the other. And thus the person of the Word after the incarnation may be said to be compounded. For hereby, the human nature is added unto the person of the Word and unto the divine nature in the unity of the same person.’ But now, he also subdivides this composition, which he terms hujus ad hoc. ‘For it is either by inherence of one thing in another, and such is the composition of an accident with its subject: or else by way of a supposital dependance of one thing upon, and relation unto another: so that the one should substantially inexist in the other, and the other should terminate the respect and dependance of the former, which inexists, and after this latter manner the person of the Word is after the incarnation compounded. Because, whereas before, it subsisted only in the divine nature, after the incarnation, it by it’s subsistence terminated the dependance of the human nature.’ Thus he. … A second objection is taken from the completeness of the Word. That which comes unto a thing already complete and perfect, comes thereunto only accidentally, and makes therewith only an aggregation, and not a substantial union. But now the person of the Word, from all eternity, was most perfect, and complete. And therefore the adding or coming of the manhood unto it, is not substantial, but accidental. For answer: The major is true only, when one thing is so added, and comes unto another, as that it pertains not to the same subsistence. And thus a man’s garment is added unto him, and therefore united with him only accidentally; so that homo vestitus is ens unum tantum per accidens. But now the manhood is so added, and comes unto the Word, that it is drawn, or assumed into a communion of subsistence with the word, and it’s divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity</cite>, … (Oxford, 1656), ‘There dwelleth in Christ all fullness’, pp. 146 &amp; 149-50 Jeanes was an English presbyterian.</span></figcaption>

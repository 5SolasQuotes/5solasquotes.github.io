<main class="wrap"><figure class="quote" id="q-af57185e4a" data-kw="">
<blockquote><p>There is, therefore, a powerful call on all who love the Lord Jesus Christ in sincerity, to strive and pray for the triumphs of the cross, for the extension of Christ’s cause. My friends, the great Head of the Church has committed, in some measure, into the hands of his believing people, the interests of his kingdom—the diffusion of his religion. He does not look for success in their public exertions exclusively; for how shall they conquer the pride of human wisdom—how shall they pull down the temples of idolatry—how shall they burst asunder the shackles of superstition—how shall they overthrow the lengthened and long-maintained reign of ignorance, error, prejudice, corruption, and vice! That is impossible.

But he calls upon them to be fellow-workers with Him in the glorious cause; to go forth in his name, and, relying on his strength, and animated with the spirit of faith and prayer, and girded with the armour of righteousness, he summons them to the conflict—he calls on them to fight the battles of the Lord. And oh! were their zeal, and their faith, and their love, proportioned to the magnitude of the work, and the goodness of the cause, and the encouragements they possess, under the banners of the Captain of Salvation, they should go forth conquering and to conquer—one should chase a thousand, and two should put ten thousand to flight.

In the early ages of Christianity, the activity, the devotedness, and the prayerfulness of Christians, were essential to the evangelizing of the world, as needful in the Divine economy as the miracles that accompanied the preaching of the Apostles; and shall these be less necessary now that these supernatural gifts are withdrawn and have ceased—shall their duty be still imperative, and yet their faith fail, their zeal flag, their efforts become feeble, and their supplications faint—shall they relax, shall they intermit, now that Peter ceases to strengthen the brethren and to feed the flock, now that James and John are withdrawn from the field of labour and conflict, now that Paul and Barnabas have ceased to struggle and strive for the cause of Zion’s King? Surely not.

But it may be asked, What can individual Christians do? What can they do? They can pray and cry aloud—they can plead the honour of Christ’s name—they can remember God’s covenant promises, and witness their fulfilment—they can bear in mind what God did in the generations of old, and pray that the arm of the Lord would awake and put on strength, and cause light to arise on the dreary waste. They can urge, with intensity, this prayer, “Let thy kingdom come.” What Christian cannot do this, and what Christian, animated with love to Christ, and convinced of the value of the gospel, and the need of salvation to the perishing sinner, does not do this?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brown.html">Thomas Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duty of Prayer for the “Peace of Jerusalem. Preached at the opening of the General Assembly, 16th May 1844 in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>For God in his holy wisdom has set such a divine mark upon this our Lord’s day, that at once it reminds us of the greatest works of God, which either conduce to his glory, or his church’s good; as, of the creation of the world in six days, when he rested the seventh, which specially is attributed to the Father; and of man’s redemption by Christ, of whose resurrection this day is a remembrance, which is specially attributed to the Son; also of our sanctification by the Spirit, for that the observation of the Sabbath is a sign and means of holiness, which work is specially attributed to the Holy Ghost; lastly, of your and the church’s glorification, which shall be the joint work of the blessed Trinity, when we shall cease from all our works, Heb. iv. 9, 10, and shall rest, and be glorious with the same glory which our head Christ has with the Father, to whom be glory for ever and ever, Amen. Do all these with delight, Psa. xcii. Isa. lviii. 13, raising up yourself hereby to a greater measure of holiness and heavenly-mindedness.</p></blockquote>

<blockquote><p>[Durell:] ‘There was a great irreverence at prayer in their congregations, very few kneeling, many not so much as putting off their hats, and of this,’ he says, he was an eye-witness. …Into how many congregations he went where many did not so much as put off their hats in the time of prayer? And whether he either saw or heard that the ministers of those churches did any way countenance that irreverence? …For ought I know those in whom he observed this irreverence might be sectaries, who did more bitterly inveigh against presbyterians than against any other men whatever; perhaps also they might be episcopal-men, who designed to put an affront upon the presbyterians’ prayers: just as now some are observed to sit upon their breech all the time of pulpit-prayer, unless when just the Lord’s prayer is repeating, because forsooth pulpit-prayer is not allowed by the [establishing Anglican] Church, but only bidding of prayer. I write it with grief, but I must write it, I never in any congregations where I have been observed so much irreverence as I have observed in those in which there is the greatest abundance of such as always pretended a love to the English [Anglican] liturgy; particular stories I might relate…</p></blockquote>

<blockquote><p>2. Rash [Schisms]. 1. Where a ground and cause is pretended, but it is but a light cause. Possibly… some corruptions in or about the worship of God, but those not destructive to the ordinances, being not in substance, but in ceremony; and those such as the person offended is not enforced to be active in… Now in this case to separate, it is a rash separation, because it is upon a ground not sufficient, a light ground.</p></blockquote>

<blockquote><p>But the church of God is in God the Father, and in the Lord Jesus Christ; it is the company of the faithful, whom God hath gathered together in Christ by his word and by the Holy Ghost, to honour him, as he himself hath appointed. This church heareth the voice of the Shepherd; it will not follow a stranger, but flieth from him; for it knoweth not the voice of strangers. Of this church St. Jerome saith, “The church of Christ, which containeth the churches through all the world, is joined together in the unity of the spirit, and hath the cities of the law, of the Prophets, of the Gospel, and of the Apostles. This church goeth not forth, or beyond her bounds, that is, the holy Scriptures.”

It is the pillar of the truth, the body, the fulness, and the spouse of Christ; it is the vine, the house, the city, and the kingdom of God; they which dwell in it, are no more strangers and foreigners, but citizens with the saints, and of the household of God, and are built upon the foundation of the Apostles and Prophets; Jesus Christ himself being the head corner-stone, in whom all the building coupled together, groweth into an holy temple in the Lord. This church Christ loved, and gave himself for it, that he might sanctify it, and cleanse it by the washing of water through the word; that he might make it unto himself a glorious church, not having spot or wrinkle, or any such thing, but that it should be holy, and without blame. (Eph. v.)

Such a church was the church of God at Thessalonica; such a church are they, whosoever in any place of the world fear the Lord, and call upon his name; their names are written in the book of life; they have received the spirit of adoption, by which they cry Abba, Father; they grow from grace to grace, and abound more and more in knowledge and in judgment; they cast away the works of darkness, and put on the armour of light; they are made absolute and perfect unto all good works; they are evermore comforted in the mercies of God, both by the holy Scriptures, wherein God declareth his gracious goodness towards them, and by the sacraments, which are left unto the church to be witnesses and assured pledges for performance of the promises of God’s good will and favour towards them.</p></blockquote>

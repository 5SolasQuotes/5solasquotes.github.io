<main class="wrap"><figure class="quote" id="q-567ceb6c81" data-kw="">
<blockquote><p>Employing the vivid imagery that was the hallmark of Spurgeon’s preaching, he wrote, ‘The house is being robbed, its very walls are being digged down, but the good people who are in bed are too fond of the warmth, and too much afraid of getting broken heads, to go downstairs and meet the burglars; they are even half vexed that a certain noisy fellow will spring his rattle, or cry, ‘Thieves!”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/macarthur-jr-john.html">MacArthur, Jr., John</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Spurgeon &amp; the Downgrade Controversy’ from Ashamed of the Gospel</cite>, (Wheaton: Crossway, 1992)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-37debbfd3e" data-kw="">
<blockquote><p>The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another?</p></blockquote>

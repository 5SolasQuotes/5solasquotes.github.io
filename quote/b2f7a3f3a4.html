<main class="wrap"><figure class="quote" id="q-b2f7a3f3a4" data-kw="">
<blockquote><p>Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical... (1685), on Rev. 3, verse 20</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e250a42f4" data-kw="">
<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts. 4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

</figure><figure class="quote" id="q-5b7beba402" data-kw="">
<blockquote><p>As for repentance and new obedience; there is as much difference between them and faith, in regard of its peculiar office, in this latter [New] Covenant; so much more between them and works in the former [Old Covenant]. 1. Between them and faith, in the point of justification, or the discharge of a sinner from the guilt of his sins; for that, howsoever they are both required as conditions to be necessarily performed by all those that expect life, or pardon of sin, and salvation by Christ; yet neither of them comes in, as having any hand in the business of our justification, or discharge of us from the guilt of our sin; because that neither do they cast ought in toward the discharge of our debt, nor have they any peculiar act in the application of, or special relation unto, that whereby our debt is discharged. Whereas our faith, though it afford not the least mite of itself toward the making up of that price wherewith our debt is to be discharged, yet it is that whereby we receive Jesus Christ (Jn. 1:12) and in Him and with Him the price by Him paid for us, and whereby we trust to Him and rely upon Him for the discharge of our debt by the merit of his sufferings: in regard whereof it is called, as ‘faith on Christ’ (Acts 20:21; 26:18), so more specially, on his blood. (Rom. 3:25)</p></blockquote>

<blockquote><p>Now to make application of this to our inquiry touching the original of faith, you may perceive by what is spoken, whereof faith is a part, and when faith is wrought in the soule: namely, that faith is a part of our sanctification, that faith is wrought in the soul then when we are regenerate by the infusion of the habit [inward power] of grace into our whole man. This will appear if we distinguish between: 1. The habit of faith, which is in general the renewed quality of the soul, whereby it is made able to discern and yield assent unto, and also willing to put affiance in all divine truth revealed. 2. The act of faith, when the understanding and will do actually know and rely upon God’s truth and goodness. This is a fruit of the former, and follows it in time; the former is a branch of the image of God restored unto us, a stream of the common fountain of sanctification, whence all graces flow, a part of our inherent righteousness, as is most apparant: It being impossible that the understanding and will of man should be effectually inclined towards their spiritual and supernatural object, to give credence and put confidence in it, until such time as they be first rectified by grace and purged from their habitual inbred blindness and rebellion: Which change when it is wrought in the soul by the Spirit of grace, sanctifying and quickening it in all the powers thereof with spiritual life: then follow those living actions of faith, hope, love, etc. performed by the strength of inherent and assisting grace. Wherefore we are not to imagine that faith is infused either before or without other graces, or that the soul is not at the same time and as soon disposed to love and fear God as to believe in Him, or to humility, to patience, to charity, to repentance, as for faith. The seed of all these graces is sown at once; and for their habits they are coeval stems of one common root of inherent sanctity: though yet some of them shoot up faster and bear fruit sooner than other. … Hence this conclusion is to be observed: 1. That faith properly is not the root of all other graces, nor the first degree of our sanctification and spiritual life. Take faith in which sense we please, for the act or for the habit: If for the act, the habit [inward power] is before that, and the root of it; If for the habit, that is not before, but a part of our sanctification, nor yet a solitary habit infused alone by itself, but together with the actus primi [first act], or habits of all supernatural graces whatsoever. Tis true in some sense that before faith, there is no life nor sanctity in the soul: because faith is a part of our life of grace and of sanctity. But there are other parts too, hope, charity, etc. and of these it may be said as well as of faith, there’s no grace in the soul till hope and charity be wrought in it. All are parts of our spiritual life wrought together. For as the corporal, so the spiritual life is not one distinct, but omnes actus primi, of every faculty whereby it can work regularly. And though in the body some part may live alone, and others be dead, yet in our spiritual life tis far otherwise, all powers are quickened and live together: where the habit of one grace is, there are all, and as soon all, as one, every faculty being rectified as well as any: and all the operations of each faculty tending to all its objects, renewed as well as any one operation directed to some one object. Wherefore I see not, under correction of quick eyes, how faith can be accounted the root whence spring all other fruits of righteousness, the efficient cause of our sanctification, the only pipe through which the waters of life flow into the soul, that firstborn grace in our spiritual regeneration, so much that before its actual operation there is no jot of spiritual life and sanctity in our hearts. Many divine eulogies are given to faith in the Scriptures, but none such as to cause us to make it the fountain of all graces. That the heart is regenerate before the act of believing and other graces wrought therein, together with the habit of faith, may appear by these reasons: 1. It is the true and general doctrine of all divines, that actual faith is never wrought in the soul till, besides the supernatural illumination of the understanding, the will be also changed and freed in part from its natural perversness: For till this be done, tis utterly impossible it should ever embrace the promise. Now the doing away of this ignorance and rebellion, what is it but an effect of the grace of sanctification implanted in the soul, by which it is sweetly and freely inclined to all heavenly things? 2. To believe is an action of a man living by grace, not dead in sin. The soul therefore is first endued with the life of grace before it can perform this living action. 3. There can be no reason given why in our regeneration it should be necessary first to have faith before we can have any other grace of sanctification, no more than that it should be needful to have some other grace before we can have faith; or, why we are more fit being unconverted to receive the grace of faith rather than any other grace, as of repentance, etc. A man unregenerate, having no preparations at all to any grace, is alike disposed to receive every one: and so there is no difference on man’s part. If any say that the Spirit, which must work other graces, is not received till we do actually believe: in so saying he confutes himself, it being most apparant that the Spirit is given to men incredulous [unbelieving], to the end to make them believers: and no man should ever be converted were not the Holy Ghost given to him whilst he is unconverted, to work his conversion. Now God, that for Christ’s sake gives faith unto us when we had none, without any predisposition in us to receive it, can and does for the same Christ’s sake give us all other graces as well at the same time. 4. It cannot well be shown how faith produces all other virtues in us, seeing that all habits of grace are infused, not acquired; and one habit cannot produce another, nor does one habit bring forth the operations of another. Tis true that faith lends a hand to help forward all gracious actions, and does much in their guidance and direction; but tis like as the understanding guides the actions of the will and inferiour faculties, or as prudence moderates the actions of all other moral virtues; which actions notwithstanding come from their proper faculties and habits as their immediate principia and fountains. But of this point more at large when we come to show the dependance that obedience has upon faith. Against this may be objected that: We live by faith, Gal. 2:20, that by faith Christ dwells in our hearts, Eph. 3:17, that through faith we are risen with Christ, Col. 2:12, that by faith we receive the Holy Ghost, Jn. 7:38-39; Eph. 1:13, so that we have no life till we be in Christ, no being in Him till we have faith to believe on Him, no sap from the vine, no virtue from the body till we be united as branches, as members, which union is by faith only; no Spirit of grace to give us life till we have faith to receive it. In briefe thus: Christ by his Spirit is the author of all our spiritual life and sanctification. But till we believe we have no participation nor fellowship with Christ and his Spirit. Therefore till we believe we have in us no life at all, and consequently by faith we are made partakers of all life and grace. To which I answer: We must carefully distinguish between a twofold union and communion we have with Christ: 1. By the Spirit on his part: for Christ as by his death, he is the meritorious cause of life and grace unto the elect, so by his Spirit He is the only efficient of life and grace in the regenerate. To whom, whilst they are yet dead in sin and destitute of all grace, so as they neither do nor possibly can believe, Christ sends his Spirit which breathes life into them, changes and purifies their nature by working all holy and rectified abilities in every part. Now this first work of the Spirit, creating of grace in the soul, does most apparantly precede not only the act of believing, but the habit also: for the habit itself is infused by this work. And therefore it is also manifest that before all faith we have and must have some participation with Christ, even to this end that we may have faith. But this union with Him is wrought merely by the Holy Spirit, which is that band whereby Christ knits Himself to us, communicating all gracious and quickening virtue from Himself to us, and thereby making us living members of his body. 2. By our faith on our parts: when being quickened by infused grace we actually apply ourselves to embrace the promise and to rely upon Christ only. And here we knit ourselves to Christ, resting upon Him alone for all comfort. By which uniting of ourselves to Christ we receive a greater increase and larger measure of grace from Him. In the first union we were insensible of it, and grace is given to us non petentibus, that asked not after it: in this second union we are most sensible of its comfort and benefit; and here an augmentation of grace is bestowed on us petentes, earnestly suing for it, and by faith expecting the receiving of it. Wherefore I conclude, all grace and virtue whatsoever in us is given us from the fulness of Christ, the fountain of all supernatural life; but yet all is not wrought by Christ embraced by our faith, but by Christ conveying his grace unto us by his Spirit. This first quickens us: we then with Lazarus after life put into us, can awake, stand up, come forth, and by faith look on Him that raised us, fall down, worship and believe in Him as our Lord and God. The places alleged either touch not our sanctification at all, or speak only of the increase of grace, not of its first infusion, faith being a means of that, but no efficient or instrument of this.</p></blockquote>

ity%2C+to+patience%2C+to+charity%2C+to+repentance%2C+as+for+faith.+The+seed+of+all+these+graces+is+sown+at+once%3B+and+for+their+habits+they+are+coeval+stems+of+one+common+root+of+inherent+sanctity%3A+though+yet+some+of+them+shoot+up+faster+and+bear+fruit+sooner+than+other.+%E2%80%A6+Hence+this+conclusion+is+to+be+observed%3A+1.+That+faith+properly+is+not+the+root+of+all+other+graces%2C+nor+the+first+degree+of+our+sanctification+and+spiritual+life.+Take+faith+in+which+sense+we+please%2C+for+the+act+or+for+the+habit%3A+If+for+the+act%2C+the+habit+%5Binward+power%5D+is+before+that%2C+and+the+root+of+it%3B+If+for+the+habit%2C+that+is+not+before%2C+but+a+part+of+our+sanctification%2C+nor+yet+a+solitary+habit+infused+alone+by+itself%2C+but+together+with+the+actus+primi+%5Bfirst+act%5D%2C+or+habits+of+all+supernatural+graces+whatsoever.+Tis+true+in+some+sense+that+before+faith%2C+there+is+no+life+nor+sanctity+in+the+soul%3A+because+faith+is+a+part+of+our+life+of+grace+and+of+sanctity.+But+there+are+other+parts+too%2C+hope%2C+charity%2C+etc.+and+of+these+it+may+be+said+as+well+as+of+faith%2C+there%E2%80%99s+no+grace+in+the+soul+till+hope+and+charity+be+wrought+in+it.+All+are+parts+of+our+spiritual+life+wrought+together.+For+as+the+corporal%2C+so+the+spiritual+life+is+not+one+distinct%2C+but+omnes+actus+primi%2C+of+every+faculty+whereby+it+can+work+regularly.+And+though+in+the+body+some+part+may+live+alone%2C+and+others+be+dead%2C+yet+in+our+spiritual+life+tis+far+otherwise%2C+all+powers+are+quickened+and+live+together%3A+where+the+habit+of+one+grace+is%2C+there+are+all%2C+and+as+soon+all%2C+as+one%2C+every+faculty+being+rectified+as+well+as+any%3A+and+all+the+operations+of+each+faculty+tending+to+all+its+objects%2C+renewed+as+well+as+any+one+operation+directed+to+some+one+object.+Wherefore+I+see+not%2C+under+correction+of+quick+eyes%2C+how+faith+can+be+accounted+the+root+whence+spring+all+other+fruits+of+righteousness%2C+the+efficient+cause+of+our+sanctification%2C+the+only+pipe+through+which+the+waters+of+life+flow+into+the+soul%2C+that+firstborn+grace+in+our+spiritual+regeneration%2C+so+much+that+before+its+actual+operation+there+is+no+jot+of+spiritual+life+and+sanctity+in+our+hearts.+Many+divine+eulogies+are+given+to+faith+in+the+Scriptures%2C+but+none+such+as+to+cause+us+to+make+it+the+fountain+of+all+graces.+That+the+heart+is+regenerate+before+the+act+of+believing+and+other+graces+wrought+therein%2C+together+with+the+habit+of+faith%2C+may+appear+by+these+reasons%3A+1.+It+is+the+true+and+general+doctrine+of+all+divines%2C+that+actual+faith+is+never+wrought+in+the+soul+till%2C+besides+the+supernatural+illumination+of+the+understanding%2C+the+will+be+also+changed+and+freed+in+part+from+its+natural+perversness%3A+For+till+this+be+done%2C+tis+utterly+impossible+it+should+ever+embrace+the+promise.+Now+the+doing+away+of+this+ignorance+and+rebellion%2C+what+is+it+but+an+effect+of+the+grace+of+sanctification+implanted+in+the+soul%2C+by+which+it+is+sweetly+and+freely+inclined+to+all+heavenly+things%3F+2.+To+believe+is+an+action+of+a+man+living+by+grace%2C+not+dead+in+sin.+The+soul+therefore+is+first+endued+with+the+life+of+grace+before+it+can+perform+this+living+action.+3.+There+can+be+no+reason+given+why+in+our+regeneration+it+should+be+necessary+first+to+have+faith+before+we+can+have+any+other+grace+of+sanctification%2C+no+more+than+that+it+should+be+needful+to+have+some+other+grace+before+we+can+have+faith%3B+or%2C+why+we+are+more+fit+being+unconverted+to+receive+the+grace+of+faith+rather+than+any+other+grace%2C+as+of+repentance%2C+etc.+A+man+unregenerate%2C+having+no+preparations+at+all+to+any+grace%2C+is+alike+disposed+to+receive+every+one%3A+and+so+there+is+no+difference+on+man%E2%80%99s+part.+If+any+say+that+the+Spirit%2C+which+must+work+other+graces%2C+is+not+received+till+we+do+actually+believe%3A+in+so+saying+he+confutes+himself%2C+it+being+most+apparant+that+the+Spirit+is+given+to+men+incredulous+%5Bunbelieving%5D%2C+to+the+end+to+make+them+believers%3A+and+no+man+should+ever+be+converted+were+not+the+Holy+Ghost+given+to+him+whilst+he+is+unconverted%2C+to+work+his+conversion.+Now+God%2C+that+for+Christ%E2%80%99s+sake+gives+faith+unto+us+when+we+had+none%2C+without+any+predisposition+in+us+to+receive+it%2C+can+and+does+for+the+same+Christ%E2%80%99s+sake+give+us+all+other+graces+as+well+at+the+same+time.+4.+It+cannot+well+be+shown+how+faith+produces+all+other+virtues+in+us%2C+seeing+that+all+habits+of+grace+are+infused%2C+not+acquired%3B+and+one+habit+cannot+produce+another%2C+nor+does+one+habit+bring+forth+the+operations+of+another.+Tis+true+that+faith+lends+a+hand+to+help+forward+all+gracious+actions%2C+and+does+much+in+their+guidance+and+direction%3B+but+tis+like+as+the+understanding+guides+the+actions+of+the+will+and+inferiour+faculties%2C+or+as+prudence+moderates+the+actions+of+all+other+moral+virtues%3B+which+actions+notwithstanding+come+from+their+proper+faculties+and+habits+as+their+immediate+principia+and+fountains.+But+of+this+point+more+at+large+when+we+come+to+show+the+dependance+that+obedience+has+upon+faith.+Against+this+may+be+objected+that%3A+We+live+by+faith%2C+Gal.+2%3A20%2C+that+by+faith+Christ+dwells+in+our+hearts%2C+Eph.+3%3A17%2C+that+through+faith+we+are+risen+with+Christ%2C+Col.+2%3A12%2C+that+by+faith+we+receive+the+Holy+Ghost%2C+Jn.+7%3A38-39%3B+Eph.+1%3A13%2C+so+that+we+have+no+life+till+we+be+in+Christ%2C+no+being+in+Him+till+we+have+faith+to+believe+on+Him%2C+no+sap+from+the+vine%2C+no+virtue+from+the+body+till+we+be+united+as+branches%2C+as+members%2C+which+union+is+by+faith+only%3B+no+Spirit+of+grace+to+give+us+life+till+we+have+faith+to+receive+it.+In+briefe+thus%3A+Christ+by+his+Spirit+is+the+author+of+all+our+spiritual+life+and+sanctification.+But+till+we+believe+we+have+no+participation+nor+fellowship+with+Christ+and+his+Spirit.+Therefore+till+we+believe+we+have+in+us+no+life+at+all%2C+and+consequently+by+faith+we+are+made+partakers+of+all+life+and+grace.+To+which+I+answer%3A+We+must+carefully+distinguish+between+a+twofold+union+and+communion+we+have+with+Christ%3A+1.+By+the+Spirit+on+his+part%3A+for+Christ+as+by+his+death%2C+he+is+the+meritorious+cause+of+life+and+grace+unto+the+elect%2C+so+by+his+Spirit+He+is+the+only+efficient+of+life+and+grace+in+the+regenerate.+To+whom%2C+whilst+they+are+yet+dead+in+sin+and+destitute+of+all+grace%2C+so+as+they+neither+do+nor+possibly+can+believe%2C+Christ+sends+his+Spirit+which+breathes+life+into+them%2C+changes+and+purifies+their+nature+by+working+all+holy+and+rectified+abilities+in+every+part.+Now+this+first+work+of+the+Spirit%2C+creating+of+grace+in+the+soul%2C+does+most+apparantly+precede+not+only+the+act+of+believing%2C+but+the+habit+also%3A+for+the+habit+itself+is+infused+by+this+work.+And+therefore+it+is+also+manifest+that+before+all+faith+we+have+and+must+have+some+participation+with+Christ%2C+even+to+this+end+that+we+may+have+faith.+But+this+union+with+Him+is+wrought+merely+by+the+Holy+Spirit%2C+which+is+that+band+whereby+Christ+knits+Himself+to+us%2C+communicating+all+gracious+and+quickening+virtue+from+Himself+to+us%2C+and+thereby+making+us+living+members+of+his+body.+2.+By+our+faith+on+our+parts%3A+when+being+quickened+by+infused+grace+we+actually+apply+ourselves+to+embrace+the+promise+and+to+rely+upon+Christ+only.+And+here+we+knit+ourselves+to+Christ%2C+resting+upon+Him+alone+for+all+comfort.+By+which+uniting+of+ourselves+to+Christ+we+receive+a+greater+increase+and+larger+measure+of+grace+from+Him.+In+the+first+union+we+were+insensible+of+it%2C+and+grace+is+given+to+us+non+petentibus%2C+that+asked+not+after+it%3A+in+this+second+union+we+are+most+sensible+of+its+comfort+and+benefit%3B+and+here+an+augmentation+of+grace+is+bestowed+on+us+petentes%2C+earnestly+suing+for+it%2C+and+by+faith+expecting+the+receiving+of+it.+Wherefore+I+conclude%2C+all+grace+and+virtue+whatsoever+in+us+is+given+us+from+the+fulness+of+Christ%2C+the+fountain+of+all+supernatural+life%3B+but+yet+all+is+not+wrought+by+Christ+embraced+by+our+faith%2C+but+by+Christ+conveying+his+grace+unto+us+by+his+Spirit.+This+first+quickens+us%3A+we+then+with+Lazarus+after+life+put+into+us%2C+can+awake%2C+stand+up%2C+come+forth%2C+and+by+faith+look+on+Him+that+raised+us%2C+fall+down%2C+worship+and+believe+in+Him+as+our+Lord+and+God.+The+places+alleged+either+touch+not+our+sanctification+at+all%2C+or+speak+only+of+the+increase+of+grace%2C+not+of+its+first+infusion%2C+faith+being+a+means+of+that%2C+but+no+efficient+or+instrument+of+this.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+pp.+11-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55961cc683.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55961cc683.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=Now%20to%20make%20application%20of%20this,no%20efficient%20or%20instrument%20of%20this." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-3d8348a348" data-kw="">
<blockquote><p>A godly person observed that Christians are usually to blame for three things: 1) they seek in themselves what they can only find in Christ; 2) they seek in the law what will only be found in the gospel; and 3) they seek on earth what will only be enjoyed in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on James</cite>, 3:2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6eef9a0dc" data-kw="">
<blockquote><p>In fact let us learn how greatly our nature inclines toward idolatry.… That saying of Horace still stands: once the gods of fools are born of fear. Or rather, as Scripture teaches, once the true knowledge of God has been blotted out by sin, the mind of man becomes a perpetual forge of idols.… Man will be compelled to confess that he is a transient being, and that those whose images he worships were once mortals like himself; yet he transfers divinity to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.8–9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span></div>

</figure><figure class="quote" id="q-a11b97b7cb" data-kw="">
<blockquote><p>Many are the mistakes at present about religious matters; but none are more destructive than those which concern the law and the gospel. The generality of our people confound them, and put one in the place of the other. Some suppose they are to be accepted of God for their works, and that they can be justified by the law in the sight of God. Others make their keeping of the law the condition of their receiving the blessings of the gospel, as if these were to be the purchase and reward of their partial obedience. Some are persuaded they must do all they can, and keep the law with all their might, and wherein they come short of the perfect demands of the law, Christ will, out his his merits, atone for their failings. And others again think that Christ has abated the rigor of the law, and that the gospel is nothing more than a new law dispensation, in which the Lord has been pleased to declare that he will accept of sincere obedience instead of perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-romaine.html">William Romaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Twelve Discourses on the Law and the Gospel” in The Whole Works of the Late Rev. William Romaine</cite>, (London, 1837).</span></figcaption>

</figure><figure class="quote" id="q-80dd888a05" data-kw="">
<blockquote><p>The law as a rule of life is also of great use to believers. … Now in this point of view, it serves in the following ways, under the illuminating influences of the Holy Spirit: …To show them how far they are from perfection of holiness. In order to render them humbler and more contrite; to cause them to renounce, in a higher degree, all confidence in their own wisdom, righteousness, and strength; and to trust constantly and only in the Lord Jesus for all their salvation, the law discovers to them the sin that dwells in them and that cleaves to all their thoughts, words, and actions. It is of great use to teach them the need that they have to be more humble, penitent, and holy. And so it serves, in a high degree, to promote their sanctification and their desire to attain perfection of holiness (Rom. 7:22–24; Phil. 3:10–14). As it requires them to be holy in a perfect degree (Matt. 5:48), it shows them that their want of perfect conformity to it is, every moment, their sin and that they ought continually to press on toward perfection and long for heaven, where their holiness and happiness will be perfect (2 Cor. 5:2–4; Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 117-18.</span></figcaption>

</figure><figure class="quote" id="q-294cf7d1da" data-kw="">
<blockquote><p>Don’t make the mistake of thinking that Christians are people who never sin or feel sinful. Rather, because of their faith in Christ, God simply doesn’t attribute their sin to them. This teaching is comforting to those who have terrified consciences. For good reason, we often try to impress on people that sins are forgiven and that righteousness is attributed to believers for the sake of Christ. Similarly, Christians should not have anything to do with the law or with sin. To the extent we are Christians, we stand above the law and sin. Christ is the Lord of the law. He is present and locked in our hearts, just as a precious stone is firmly mounted in a ring. When the law accuses us and sin terrifies us, all we need to do is look to Christ. When we have taken hold of him in faith, we have the victor over the law, sin, death, and the devil with us. Because Christ rules over all of these, we won’t be harmed. That’s why a Christian, correctly defined, is free from all laws and subject to no one, either inwardly or outwardly. But notice that I said, “to the extent we are Christians,” not just to the extent we are human and have consciences. We are free to the extent we have consciences that are transformed and made rich through faith. This faith is a great and immeasurable treasure—as Paul says, an “indescribable gift” (2 Corinthians 9:15), a gift that cannot be raised high enough or praised enough. It makes us children and heirs of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone. Zondervan. Kindle Edition. 201</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

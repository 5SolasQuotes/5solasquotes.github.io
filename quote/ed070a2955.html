<blockquote><p>On the sixteenth day of January, 1546, the Regent and cardinal arrived after night-fall at Elphingston Tower, in the neighbourhood of Ormiston, with five hundred men, and despatched the Earl of Bothwell to apprehend Wishart, holding themselves in readiness, if need were, to support him by force. As soon as the Reformer became aware of his errand, he cried out to Cockburn and his other friends, “Open the gates), the blessed will of my God be done.” The earl being admitted with some other gentlemen who accompanied him, Wishart addressed him thus: “I praise my God that so honourable a man as you, my lord, receives me this night in the presence of these noblemen, for now I am assured, that for your honour’s sake, you will suffer nothing to be done unto me contrary to the order of law. I am not ignorant that their law is nothing but corruption, and a cloak to shed the blood of the saints; but yet I less fear to die openly, than secretly to be murdered.” …On the morning of the 28th day of February, 1546, the Tribunal of Heresy was constituted with great pomp and solemnity in the cathedral; and George Wishart was brought from the Sea-tower by the Captain of the Castle at the head of a hundred men, armed with jacks, spears, and axes. As he entered the church, he threw his purse to a poor man lying at the door, who asked alms. John Wynram, sub-prior of the Abbey and dean of the Cathedral, opened the proceedings with a sermon, which formed a singular prelude to what followed. He took for his text the parable of the sower, and explained it in a way which must have been much more satisfactory to the Reformer at the bar, than to the prelates and doctors on the tribunal. The good seed, he said, was the Word of God, and the evil seed was heresy. But what was heresy? “Heresy,” said Wynram, “is a false opinion, defended with pertinacity, clearly repugnant to the Word of God;” a definition which entirely ignored the dogmas of the church. Passing to the cause of heresy within that realm, and all other realms, he declared it to be the ignorance of those who had the care of men’s souls; “to whom,” said he, “it necessarily belongeth to have the true understanding of the Word of God, that they may be able to win again the false teachers of heresies with the sword of the spirit, which is the Word of God; and not only to win again, but also to overcome, as saith Paul, ‘a bishop must be faultless, as becometh the minister of God, and such as cleaveth unto the true word of doctrine, that he may be able to exhort with wholesome learning, and to reprove that which they say against him.’ ” If Sir David Lindsay had been in the pulpit, he could not have spoken more plainly what the bishops needed to hear. Once more demanded the preacher, how heresies should be known? and “heresies,” quoth he, “may be known in this manner: As the goldsmith knoweth the fine gold from the imperfect by the touchstone, so likewise may we know heresy by the undoubted touchstone; that is, the true, sincere, and undefiled Word of God.” …His Articles were eighteen in number, and turned chiefly upon the doctrine which he was alleged to have taught respecting the seven sacraments of the Church of Rome. The third article was this, “Thou, false heretic, preachest against the sacraments, saying that there are not seven sacraments;” to which Wishart replied, “My lords, if it be your pleasure, I taught never of the number of the sacraments, whether they were seven or eleven. So many as are instituted by Christ, and are shown to us by the Evangel, I profess openly. Except it be the Word of God I dare affirm nothing.” The fourth ran thus, “Thou, false heretic, hast openly taught that auricular confession is not a blessed sacrament, and thou sayest that we should only confess us to God, and to no priest.” He answered, “My lords, I say that auricular confession, seeing that it hath no promise of the Evangel, cannot therefore be a sacrament. Of the confession to be made to God there are many testimonies in Scripture, as when David saith, ‘I thought that I would acknowledge my iniquity unto the Lord, and He forgave the trespasses of my sins.’ Here confession signifieth the secret acknowledgment of our sins before God. When I exhorted the people on this manner, I reproved no manner of confession. And farther St. James saith, ‘Confess your sins one to another.’ Here the apostle meaneth nothing of auricular confession, but that we should acknowledge and confess ourselves to be sinners before our brethren and before the world, and not to esteem ourselves as the Grey Friars do, thinking themselves already purged.” When he had said these words, the horned bishops and their accomplices cried out, and grinned with their teeth, saying, “See ye not what colours he hath in his speech, that he may beguile us and seduce us to his opinion.” When accused of having preached plainly that there is no purgatory, his reply was equally explicit and characteristic. “My lords, as I have oftentimes said heretofore, without express witness and testimony of Scripture I dare affirm nothing; I have oft and divers times read over the Bible, and yet such a term found I never, nor yet any place of Scripture applicable thereunto; therefore, I was ashamed ever to teach of that thing which I could not find in Scripture.” Then said he to Lauder, his accuser, “If you have any testimony of the Scripture by the which ye may prove any such place, show it now before this auditory.” But Lauder was dumb. At last the bishops grew impatient of his “witty and godly answers.” John Scot, a Grey Friar and a notorious deceiver of the people, who was standing behind Lauder, “hasted him to read the rest of the articles, and not to tarry upon his answers.” “For we may not abide them,” quoth he, “no more than the devil may abide the sign of the cross.” …Immediately after, his room was entered by two executioners; one brought him a coat of linen dyed black, and put it upon him; the other carried some bags full of powder, which he tied to several parts of his body. Thus arrayed for the fire, they brought him forth to an outer room, near the gate of the castle. Meanwhile, the artillery of the block houses was charged and pointed in the direction of the scaffold, and cushions and green-cloths were spread upon the wall-heads, for the cardinal and bishops to sit upon. “When all things were made ready,” says Spottiswoode, “he was led forth, with his hands tied behind his back, and a number of soldiers guarding him, to the place of execution. As he was going forth at the castle-gate, some poor creatures who were lying there, did ask of him some alms for God’s sake, to whom he said, ‘I have not the use of any hands wherewith I should give you alms, but our merciful God, who out of his abundance feedeth all men, vouchsafe to give you the things which are necessary both for your bodies and for your souls.’ ” When he ascended the scaffold, he fell upon his knees, and thrice he said these words, “O thou Saviour of the world, have mercy upon me. Father of heaven, I commend my spirit into thy holy hands.” Then he turned to the people and said these words, “I beseech you, Christian brethren and sisters, that ye be not offended at the word of God, for the affliction and torments which ye see prepared for me, but I exhort you that ye love the word of God your salvation, and suffer patiently and with a comfortable heart, for the Word’s sake. Moreover, I pray you, show my brethren and sisters which have heard me oft before, that they cease not to learn the word of God, which I taught unto them, for no persecutions nor troubles in this world which lasteth not. For the Word’s sake, and the true Evangel which was given to me by the grace of God, I suffer this day not sorrowfully, but with a glad heart and mind. Consider and behold my visage; ye shall not see me change my colour. This grim fire I fear not. I know surely that my soul shall sup with my Saviour this night, for whom I suffer this.” Then he prayed for his accusers, saying, “I beseech the Father of heaven to forgive them that have, of any ignorance, or else of any evil mind, forged lies upon me. I forgive them with all my heart. I beseech Christ to forgive them that have this day ignorantly condemned me to death.” And last of all he said to the people on this manner, “I beseech you, brethren and sisters, to exhort your prelates to the learning of the word of God, that they may be ashamed to do evil, and learn to do good; and if they will not convert themselves from their wicked error, there shall hastily come upon them the wrath of God, which they shall not eschew.” After these words, the martyr gave himself into the hands of the executioner. “Sir, I pray you forgive me,” cried the tormentor, “for I am not guilty of your death;” to whom he answered, kissing his cheek, “Lo! here is a token that I forgive thee; my heart, do thine office.” He carried a chain of iron at his middle, by which he was fastened to a gibbet which rose in the centre of the scaffold. Fire was then put to the pile; the powder-bags exploded, and enveloped him in fierce flames; a cord, which had been placed round his neck, was pulled tightly till he was suffocated, and the body of the lifeless martyr was speedily reduced to ashes. “When the people beheld his great tormenting, they might not withhold from piteous mourning, and complaining of the innocent lamb’s slaughter.” The cardinal and the bishops, unforgiving even in death, caused a proclamation the same night to be made throughout the city, that none should pray for the soul of the heretic, under pain of the heaviest censures of the church.</p></blockquote>

mber+of+the+sacraments%2C+whether+they+were+seven+or+eleven.+So+many+as+are+instituted+by+Christ%2C+and+are+shown+to+us+by+the+Evangel%2C+I+profess+openly.+Except+it+be+the+Word+of+God+I+dare+affirm+nothing.%E2%80%9D+The+fourth+ran+thus%2C+%E2%80%9CThou%2C+false+heretic%2C+hast+openly+taught+that+auricular+confession+is+not+a+blessed+sacrament%2C+and+thou+sayest+that+we+should+only+confess+us+to+God%2C+and+to+no+priest.%E2%80%9D+He+answered%2C+%E2%80%9CMy+lords%2C+I+say+that+auricular+confession%2C+seeing+that+it+hath+no+promise+of+the+Evangel%2C+cannot+therefore+be+a+sacrament.+Of+the+confession+to+be+made+to+God+there+are+many+testimonies+in+Scripture%2C+as+when+David+saith%2C+%E2%80%98I+thought+that+I+would+acknowledge+my+iniquity+unto+the+Lord%2C+and+He+forgave+the+trespasses+of+my+sins.%E2%80%99+Here+confession+signifieth+the+secret+acknowledgment+of+our+sins+before+God.+When+I+exhorted+the+people+on+this+manner%2C+I+reproved+no+manner+of+confession.+And+farther+St.+James+saith%2C+%E2%80%98Confess+your+sins+one+to+another.%E2%80%99+Here+the+apostle+meaneth+nothing+of+auricular+confession%2C+but+that+we+should+acknowledge+and+confess+ourselves+to+be+sinners+before+our+brethren+and+before+the+world%2C+and+not+to+esteem+ourselves+as+the+Grey+Friars+do%2C+thinking+themselves+already+purged.%E2%80%9D+When+he+had+said+these+words%2C+the+horned+bishops+and+their+accomplices+cried+out%2C+and+grinned+with+their+teeth%2C+saying%2C+%E2%80%9CSee+ye+not+what+colours+he+hath+in+his+speech%2C+that+he+may+beguile+us+and+seduce+us+to+his+opinion.%E2%80%9D+When+accused+of+having+preached+plainly+that+there+is+no+purgatory%2C+his+reply+was+equally+explicit+and+characteristic.+%E2%80%9CMy+lords%2C+as+I+have+oftentimes+said+heretofore%2C+without+express+witness+and+testimony+of+Scripture+I+dare+affirm+nothing%3B+I+have+oft+and+divers+times+read+over+the+Bible%2C+and+yet+such+a+term+found+I+never%2C+nor+yet+any+place+of+Scripture+applicable+thereunto%3B+therefore%2C+I+was+ashamed+ever+to+teach+of+that+thing+which+I+could+not+find+in+Scripture.%E2%80%9D+Then+said+he+to+Lauder%2C+his+accuser%2C+%E2%80%9CIf+you+have+any+testimony+of+the+Scripture+by+the+which+ye+may+prove+any+such+place%2C+show+it+now+before+this+auditory.%E2%80%9D+But+Lauder+was+dumb.+At+last+the+bishops+grew+impatient+of+his+%E2%80%9Cwitty+and+godly+answers.%E2%80%9D+John+Scot%2C+a+Grey+Friar+and+a+notorious+deceiver+of+the+people%2C+who+was+standing+behind+Lauder%2C+%E2%80%9Chasted+him+to+read+the+rest+of+the+articles%2C+and+not+to+tarry+upon+his+answers.%E2%80%9D+%E2%80%9CFor+we+may+not+abide+them%2C%E2%80%9D+quoth+he%2C+%E2%80%9Cno+more+than+the+devil+may+abide+the+sign+of+the+cross.%E2%80%9D+%E2%80%A6Immediately+after%2C+his+room+was+entered+by+two+executioners%3B+one+brought+him+a+coat+of+linen+dyed+black%2C+and+put+it+upon+him%3B+the+other+carried+some+bags+full+of+powder%2C+which+he+tied+to+several+parts+of+his+body.+Thus+arrayed+for+the+fire%2C+they+brought+him+forth+to+an+outer+room%2C+near+the+gate+of+the+castle.+Meanwhile%2C+the+artillery+of+the+block+houses+was+charged+and+pointed+in+the+direction+of+the+scaffold%2C+and+cushions+and+green-cloths+were+spread+upon+the+wall-heads%2C+for+the+cardinal+and+bishops+to+sit+upon.+%E2%80%9CWhen+all+things+were+made+ready%2C%E2%80%9D+says+Spottiswoode%2C+%E2%80%9Che+was+led+forth%2C+with+his+hands+tied+behind+his+back%2C+and+a+number+of+soldiers+guarding+him%2C+to+the+place+of+execution.+As+he+was+going+forth+at+the+castle-gate%2C+some+poor+creatures+who+were+lying+there%2C+did+ask+of+him+some+alms+for+God%E2%80%99s+sake%2C+to+whom+he+said%2C+%E2%80%98I+have+not+the+use+of+any+hands+wherewith+I+should+give+you+alms%2C+but+our+merciful+God%2C+who+out+of+his+abundance+feedeth+all+men%2C+vouchsafe+to+give+you+the+things+which+are+necessary+both+for+your+bodies+and+for+your+souls.%E2%80%99+%E2%80%9D+When+he+ascended+the+scaffold%2C+he+fell+upon+his+knees%2C+and+thrice+he+said+these+words%2C+%E2%80%9CO+thou+Saviour+of+the+world%2C+have+mercy+upon+me.+Father+of+heaven%2C+I+commend+my+spirit+into+thy+holy+hands.%E2%80%9D+Then+he+turned+to+the+people+and+said+these+words%2C+%E2%80%9CI+beseech+you%2C+Christian+brethren+and+sisters%2C+that+ye+be+not+offended+at+the+word+of+God%2C+for+the+affliction+and+torments+which+ye+see+prepared+for+me%2C+but+I+exhort+you+that+ye+love+the+word+of+God+your+salvation%2C+and+suffer+patiently+and+with+a+comfortable+heart%2C+for+the+Word%E2%80%99s+sake.+Moreover%2C+I+pray+you%2C+show+my+brethren+and+sisters+which+have+heard+me+oft+before%2C+that+they+cease+not+to+learn+the+word+of+God%2C+which+I+taught+unto+them%2C+for+no+persecutions+nor+troubles+in+this+world+which+lasteth+not.+For+the+Word%E2%80%99s+sake%2C+and+the+true+Evangel+which+was+given+to+me+by+the+grace+of+God%2C+I+suffer+this+day+not+sorrowfully%2C+but+with+a+glad+heart+and+mind.+Consider+and+behold+my+visage%3B+ye+shall+not+see+me+change+my+colour.+This+grim+fire+I+fear+not.+I+know+surely+that+my+soul+shall+sup+with+my+Saviour+this+night%2C+for+whom+I+suffer+this.%E2%80%9D+Then+he+prayed+for+his+accusers%2C+saying%2C+%E2%80%9CI+beseech+the+Father+of+heaven+to+forgive+them+that+have%2C+of+any+ignorance%2C+or+else+of+any+evil+mind%2C+forged+lies+upon+me.+I+forgive+them+with+all+my+heart.+I+beseech+Christ+to+forgive+them+that+have+this+day+ignorantly+condemned+me+to+death.%E2%80%9D+And+last+of+all+he+said+to+the+people+on+this+manner%2C+%E2%80%9CI+beseech+you%2C+brethren+and+sisters%2C+to+exhort+your+prelates+to+the+learning+of+the+word+of+God%2C+that+they+may+be+ashamed+to+do+evil%2C+and+learn+to+do+good%3B+and+if+they+will+not+convert+themselves+from+their+wicked+error%2C+there+shall+hastily+come+upon+them+the+wrath+of+God%2C+which+they+shall+not+eschew.%E2%80%9D+After+these+words%2C+the+martyr+gave+himself+into+the+hands+of+the+executioner.+%E2%80%9CSir%2C+I+pray+you+forgive+me%2C%E2%80%9D+cried+the+tormentor%2C+%E2%80%9Cfor+I+am+not+guilty+of+your+death%3B%E2%80%9D+to+whom+he+answered%2C+kissing+his+cheek%2C+%E2%80%9CLo%21+here+is+a+token+that+I+forgive+thee%3B+my+heart%2C+do+thine+office.%E2%80%9D+He+carried+a+chain+of+iron+at+his+middle%2C+by+which+he+was+fastened+to+a+gibbet+which+rose+in+the+centre+of+the+scaffold.+Fire+was+then+put+to+the+pile%3B+the+powder-bags+exploded%2C+and+enveloped+him+in+fierce+flames%3B+a+cord%2C+which+had+been+placed+round+his+neck%2C+was+pulled+tightly+till+he+was+suffocated%2C+and+the+body+of+the+lifeless+martyr+was+speedily+reduced+to+ashes.+%E2%80%9CWhen+the+people+beheld+his+great+tormenting%2C+they+might+not+withhold+from+piteous+mourning%2C+and+complaining+of+the+innocent+lamb%E2%80%99s+slaughter.%E2%80%9D+The+cardinal+and+the+bishops%2C+unforgiving+even+in+death%2C+caused+a+proclamation+the+same+night+to+be+made+throughout+the+city%2C+that+none+should+pray+for+the+soul+of+the+heretic%2C+under+pain+of+the+heaviest+censures+of+the+church.%E2%80%9D%0A%0A%E2%80%94+Peter+Lorimer%2C+The+Scottish+Reformation%3A+A+Historical+Sketch+%28London%3B+Glasgow%3A+Richard+Griffin+and+Company%2C+1860%29%2C+143%2C+145%E2%80%93146%2C+148%E2%80%93149%2C+151%E2%80%93153.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed070a2955.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed070a2955.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/03/the-martyrdom-of-george-wishart-1-march-1546/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Every person is engaged in his place and capacity to appear against vice, and to endeavor the extirpation of it; but here the Magistrate in a special manner is concerned, who is to see that all infected persons be shut up. The leper under the Law was to dwell alone without the camp, that he might not converse with those that were whole: now I have told you, that sin is the worst of plagues and leprosies. You therefore that are in public places and offices are to set a watch over notorious sinners, that they go not abroad to infect others: if they break out, you may shoot at them; if sinners will be bold and daring, you are bound to unsheath the sword of justice and strike at them; as indeed there are a sort of hardened sinners that stare justice in the face, and say she is blind, and laugh at her sword, and make their brag that they never felt the edge of it. Here you will do well to make them experience how sharp it is; that others too, beholding the punishment inflicted on them, may not presume to glory in their shame.</p></blockquote>

<blockquote><p>A Holy Commonwealth… is a candid confession as to why a conservative [congregationalist] Puritan fought for Parliament in the Civil War and gave his support to the Cromwells. Baxter publicly repudiated the work in 1670, and in 1683 the Oxford University authorities ordered it to be part of a book-burning that included the works of Hobbes and Milton.” – on Amazon Hale, Matthew – The Analysis of the Law 3rd ed. (d. 1676; n.p., n.d.) Hale (1609-1676) was an Anglican and influential barrister, judge and jurist most noted for his treatise, The History of the Pleas of the Crown. Hale’s early works, including, A Discourse of the Knowledge of God, reflect his early Puritan and Reformed background. After ca. 1660 his thought becomes more Arminian. Hale’s Analysis of the Common Law (below) is noted as the first published history of English law and a strong influence on William Blackstone’s Commentaries on the Laws of England. Hale’s jurisprudence struck a middle-ground between Edward Coke’s “appeal to reason” and John Selden’s “appeal to contract”, while refuting elements of Thomas Hobbes’s theory of natural law. Stair, James Dalrymple – The Institutions of the Law of Scotland, Deduced from its Originals, &amp; Collated with the Civil, Canon &amp; Feudal Laws, &amp; with the Customs of Neighboring Nations… (Edinburgh, 1681) Dalrymple (1619–1695), 1st Viscount of Stair, was a Scottish lawyer, statesman and had close relationships at times with leading covenanters. In 1662, as a judge, though it was required of him, he refused to declare the National Covenant and the Solemn League &amp; Covenant to be unlawful oaths. The work above shows influences from Stair’s philosophical training, his foreign travels, and continental jurists as well as English lawyers. In 1695 there was published a small volume entitled, A Vindication of the Divine Perfections, Illustrating the Glory of God in them by Reason and Revelation, methodically digested… It is undoubtedly Stair’s work, and was edited by the two Nonconformist divines, William Bates and John Howe. . 1700’s See below on Common Law &amp; English law. . 1800’s Thomas, John Penford – A Treatise of Universal Jurisprudence (London, 1829) ToC Bastiat, Frederic – The Law (1850; NY: 1964) Bastiat (1801–1850) was a French economist, writer and a prominent member of the French Liberal School. A Freemason and a member of the French National Assembly, Bastiat developed the economic concept of opportunity cost. As an advocate of classical economics and the economics of Adam Smith, his views favored a free market and influenced the Austrian School. Bastiat did most of his writing during the years just before — and immediately following — the Revolution of February 1848. This was the period when France was rapidly turning to complete socialism. As a Deputy to the Legislative Assembly, Bastiat was studying and explaining each socialist fallacy as it appeared. And he explained how socialism must inevitably degenerate into communism. But most of his countrymen chose to ignore his logic. Lindley, Nathaniel – An Introduction to the Study of Jurisprudence, being a translation of the general part of [Anton] Thibaut’s System Des Pandekten Rechts, with Notes &amp; Illustrations (London, 1855) Thibaut (1772–1840) was a German jurist. Wiki: “The fame of this book [of Thibaut’s] results from its being the first modern complete compendium of the subject, distinguished alike by the accuracy of its sources and the freedom and unpedantic manner in which the subject is handled. It is, in effect, a codification of the Roman law as it then obtained in Germany, modified by canon law and the practice of the courts into a comprehensive system of Pandect [Roman] law.</p></blockquote>

<blockquote><p>But this is not all the usurpers that rose up in those days. Eugenius [the usurper] soon becomes more terrible than he (who once was but a schoolmaster). And how does this loyal St. Ambrose carry it? When he had got of Theodosius a pardon for all that took part with Maximus, even his army except two or three, yea and benefits too, yet did not this holy loyal man think it sinful to write thus to the tyrant Eugenius (Epistles, bk. 2, p. 103), Clementissimo Imperatori Eugenio, Ambrosius Episcopus, ‘Bishop Ambrose to the most clement emperor Eugenius.’ And thus concludes: In his vero in quibus vos rogari decet, etiam exhibere sedulitatem potestati debitam▪ sicut et scriptum est, cui honorem, honorem, cui tributum, tributum: Nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori? i.e. ‘But in these matters where it becomes us to petition you, we must also give the diligence due to power: as it is written, honor to whom honor, tribute to whom tribute: For when I honored you, when you were a private man from the inwards of my heart, how should I not honor you an emperor?’</p></blockquote>

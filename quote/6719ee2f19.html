<blockquote><p>VI. No more can the rite of the sacrament of confirmation than the name be shown from the Scriptures. The apostles indeed employed the imposition of hands (cheirothesian, Acts 8:17; 19:6), but since it is evident that that was done in a visible dispensation of the Holy Spirit in the nascent condition of the church and indeed from a special promise, it is clear that it was an extraordinary rite and for this reason only temporary (whose end ceased together with other miracles). That the sacerdotal chrism and anointing were altogether different from the apostolic laying on of hands (cheirothesia) and that this [chrism/anointing] referred to the bestowal of the extraordinary gifts of the Spirit is not obscurely gathered…</p></blockquote>

</figure><figure class="quote" id="q-7bb5dc3c23" data-kw="">
<blockquote><p>Ordination appears to have been performed by apostles, by evangelists, and by a presbytery, Acts 6:6, and 14:23; Tit. 1:5; 1 Tim. 5:22, and 4:14: but never by private Christians. Could these [private Christians] ordain their pastors or other ecclesiastic officers, to what purpose did Paul leave Titus at Crete to ordain elders in every city? Or why did he write never a word about ordination to the people, in any of his epistles, but to their rulers?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters on the Constitution, Government &amp; Discipline of the Christian Church</cite>, (d. 1787), pp. 73-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-47c8ab8f0f" data-kw="">
<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 3rd Distinction. Public preaching, as it is the ordinary mean of saving such as believe, is proper and peculiar to the Church, both subjectively, as being only in the Church, and objectively as being only exercised on the Church members per se, but upon pagans by accident. 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are. 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another; 4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office. 5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Pt. 2, p. 272</span></figcaption>

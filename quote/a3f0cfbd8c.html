<main class="wrap"><figure class="quote" id="q-a3f0cfbd8c" data-kw="">
<blockquote><p>That glorious covenant, consists likewise of two essential parts; which were the articles agreed upon, between God the Father, and Christ the second Adam; namely, the conditionary part, and the promissory part. In the settled order of that august contract, the having of the quickening Spirit, goes before faith, faith, before justification, justification, before sanctification, true repentance for sin, before God’s fatherly forgiveness of sin and holiness in time, before happiness in eternity. These, therefore, may be styled, conditions in the covenant of grace; that is to say, conditions of order and connection, in it; and they belong to the established order of the promises, and of the administration of the covenant, which are contradistinguished from the condition of it.

Such conditions, however, can with no propriety be styled, the conditions of the covenant of grace; any more, than the hireling’s receiving of his hire, can be termed, the condition of a covenant of service. When the word condition, is improperly taken, and no more meant by it than that, particular duties performed, must, in the order of the covenant, precede the enjoyment of particular benefits promised, many duties may be styled conditions. As faith in particular is, in the public dispensation of the covenant, not only required as is repentance too; but is the appointed instrument by which, sinners receive the benefits thereof, it often has been, and still might be, styled a condition of connection in it.

But when the word condition, is used in its proper signification,—to express that, which in itself, or at least by paction, is meritorious of the promised benefit; or that, which when performed, gives a full right to claim the promised reward; or that, on the performance of which, not only the possession of the promise or benefit promised, but the right to possess it, is founded; nothing but the spotless, the finished, righteousness of Jesus Christ, by which, all the demands of the broken law, are completely answered, can be admitted to be the condition of that Divine, that eternal covenant. That consummate righteousness is justly styled, the condition of the covenant; for, as the reader will soon see, it comprises all the proper conditions of it.

The condition properly so-called, then, of the covenant of grace, is, Christ’s fulfilling of all righteousness, owing, in virtue of the broken covenant of works, to God, by his spiritual seed, and that, as the second Adam their federal Representative. Faith, it is true, may be styled, a condition of saving interest in Christ, of justification and salvation by him, in the covenant; but, it is the surety-righteousness of the second Adam, only, that can be regarded as the condition of the covenant. It is that, and nothing else, which of itself as well as by paction, is meritorious of eternal life for believers, and is the proper ground of their title thereto, in its beginning, progress, and consummation. They cannot, they must not;, presume to plead their imperfect faith, as the ground of their title; but they can, and they do, plead that transcendently perfect righteousness.</p></blockquote>

<blockquote><p>In Psalm 68:31 we read, “Ethiopia [or Cush] shall soon stretch out her hands unto God.” The early Seceder, Ebenezer Erskine, interpreted this text as a prediction that the Gentile nations, including those in Africa, would enter into covenant with God:

The words read … are a declaration of the success of the gospel among the Gentile nations. Ethiopia, Egypt, and other places of the world, would submit unto his royal sceptre, when it should be swayed among them in the dispensation of the gospel, Princes shall come out of Egypt, Ethiopia shall soon stretch out her hands unto God. …

From which it appears, that Ethiopia, Scotland, and all the Gentile nations, and every individual among them is, by nature, in a most dismal and deplorable condition, without God, the chief good, without Christ, the only Saviour, without hope of salvation, without the true church, where life and immortality alone is brought to light; without God’s covenant of promise, which is the only charter of salvation; under the power of sin and Satan, the great enemy of their salvation; and, consequently, in a state of hostility against God. …

Lastly, This phrase of stretching out the hand to God implies an open profession of the faith in Christ, before the world, angels, men, and devils, which is sometimes called in Scripture an avouching of the Lord to be our God; and is sometimes done there by a person or people, with the solemnity of lifting up the hand, an ancient form of swearing, Rev. x. 5, 6, when the angel swore by him that liveth for ever and ever, he doth it with his hand lifted up to heaven.

So here, Ethiopia shall soon stretch out her hands unto God, that is, the inhabitants of Ethiopia, and of the Gentile nations, shall openly profess the God and Father of our Lord Jesus Christ to be their God, and they shall do it with the solemnity of an oath or covenant, as Israel they shall do it with the solemnity of an oath or covenant, as Israel did, Josh. xxiv. 22. When Joshua told them, “Ye are witnesses against yourselves, that ye have chosen you the Lord, to serve him.” And in this manner have we, in this land, and neighbouring nations, lifted up our hand to God, declaring him to be our God, and ourselves to be his people, although, alas! these covenants have been scandalously broken, burnt, and in a great measure buried. …

See from this doctrine, wherein the essence either of personal or national covenanting with God doth consist. Why, it just lies in following the example of Ethiopia, which stretched out the hand unto God, in a way of faith and solemn profession, that the God of Christ shall be their God, and that the Father of Christ shall be their Father; and that in the strength of the grace that is in Jesus, promised in a new covenant of grace, they will cleave unto him by a personal holy walk and conversation; and that, through grace, they will cleave unto the doctrine, discipline, worship, and government, that he has appointed in his house, in his holy oracles.

It must be a strange kind of spirit, that either sets his people on edge against such covenants, or turns them to an indifferency about the public work and cause of Christ, as if it were not worth the contending for, or suffering for. When God commands us to “contend for the faith delivered to the saints,” Jude iii., and to “stand fast in the liberty wherewith Christ hath made us free,” Gal. v. 1. It appears evidently to be a plot of hell for burying a testimony for our solemn covenants, and for the reformation of Scotland, and for our encouraging judicatories to go on in their course of backsliding from the Lord, and his work and way.</p></blockquote>

<blockquote><p>Secondly, Consider we the Law as in the administration of it to Moses, and so to the people of the Jews: The administration of the Law to them it was under another notion, it was to bring them to Christ, and that they might come to see their inability of keeping of that Covenant, and come to understand Christ so much the more, and to be driven unto Christ by having the Law presented to them, God did never intend by giving of the Law to the people of the Jews that it should be a Covenant of eternal life to them; indeed there was this in the administration of it somewhat different from us, some special Covenant about their living in Canaan, and about mercies in that promised Land, beyond that that we have in the Law, as we find in the new Testament, they (I say) had this annexed to it.

The Law that was first given unto Adam and written in his heart, afterwards even obliterated, then it was transcribed by the same hand in tables of stone and given unto them chiefly to shew them their misery, and their need of Christ; to be a preparation for Christ’s coming into the world; and with this one addition beyond what we have in the new Testament, that there was a temporal Covenant annexed unto it, that concerned their living prosperously in the Land of Canaan, (&amp; so far we are delivered even from the Law as it was given by Moses, that is, from the connexion of the Covenant that was added unto the delivering of the Law) concerning their happy and comfortable condition in the Land of Canaan upon the keeping of their Law; but now (how ever it was) certainly that Conversation that becomes the Gospel should be beyond what could be even from godly men in the time of the Law.

As first, The Law to them it was given under low Promises, their promises were but very low that were under the Law: It’s true, they had somewhat of the Gospel that we have, but extreme darkly, and very little that they knew of it, but the chief Ministration of God towards them was then in a legal way, and that had but low promises, as their living in Canaan; you shall find generally al the promises that are annexed to the Law even by Moses, it is but, that they shall prolong their days in the Land the Lord their God shall give them, That they should be blest in their basket and store: their Promises were under Heaven-Promises, Promises of this life only; and therefore it could raise them but to a very low degree of holiness.

Secondly, Their Ordinances were but poor and mean, and beggarly in comparison of our; for so the Gospel calls them, Col. 2. They were but beggarly rudiments, which stood only in meats and drinks, and divers washings, and carnal Ordinances imposed on them until the time of reformation. Heb. 9. 10. They had an earthly Tabernacle, a worldly Sanctuary, Heb. 9. 1. &amp;c.

Thirdly, The burden of them under the Law was very great, they were under a heavy yoke &amp; burden that did bow them down: A man that is under a heavy burden it makes him stoop &amp; bend in the back, he cannot stand so upright nor fast as others that have no such weight upon them. Fourthly, The administration of the Law was with Thunder and Lightning very terrible, It made even Moses quake and tremble, (as the Author to the Hebrews speaks.)

Fifthly, Their spirits were very servile under the Law, they were subject to bondage even all their days; God so ordered things as to carry on his people even in a very servile way, they were but mean servants then, hewers of wood and drawers of water.

But now under the Gospel, First, our Promises are far better, and our Covenant better, in Heb. 8. 6. there the Apostle compares their Condition and ours, Who serve (saith he) unto the example and shadow of heavenly things, There was but the shadow of heavenly things; the Gospel hath the Heavenly things themselves, and they are but the shadow, for so you have it in Heb. 10. 1. For the Law having a shadow of good things to come, and not the very image of the things: They had but a shadow of good things to come, and not the very image it self. As Moses was admonished of God, when he was about to make the Tabernacle, For see (saith he) that thou make all things according to the pattern shewed to thee in the Mount.

And then in Heb. 8. 6. But now hath he obtained a more excellent Ministry, [that’s Christ] By how much also he is the Mediator of a better Covenant, which was established upon better promises: A better Covenant, and stablished upon better promises, or a better Testament: Their promises I say were but low and mean; and our promises are high and precious, and we have a better Covenant, a Covenant not of living in the Land of Canaan, but of Heaven, of which that Canaan was but a Type, and therefore our Conversations should rise higher in holiness according as our Covenant and Promises are better than theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 47-49.</span></figcaption>

</figure><figure class="quote" id="q-b0039051eb" data-kw="old new">
<blockquote><p>However, we readily grant that the Old Testament and the Mosaic covenant taken strictly and absolutely as to the legal relation (schesin) differ in entire substance from the New. Hence the law and Moses are opposed to grace and to Christ (Jn. 1:17) and by Paul the letter and the Spirit, the ministration of condemnation and of righteousness (2 Cor. 3:6, 7). So we maintain that taken broadly and with the other evangelical relation (schesei) (clothed, namely, with its pedagogical circumstances), it did not differ as to substance, but only as to manner of dispensation.</p></blockquote>

<blockquote><p>…just as in human beings, the term ‘virtues’ is reserved for ‘excellent and confirmed habits’ or dispositions that conduce to the proper use of the faculties, so also in God is the word ‘virtues’ applied to the workings of the divine essence, with specific reference to the disposition and use of the ‘faculties’ of intellect and will. This approach is analogical, given that the divine virtues are not separable from the divine essence as human virtues are separable from humanity. In short, the virtues of God are the divine moral perfections, specifically the goodness and righteousness of the divine willing. These virtues are also the source of all finite or creaturely goodness and righteousness. (Leigh, Treatise, II.x (pp. 78-79).)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c311faf9e1" data-kw="">
<blockquote><p>Though it is true, that such as are rejected in the Purpose of God, will never be converted in the Use of all the Means of Grace; yet, seeing they do not know the secret Purpose of God concerning them, but have the same Reason to entertain Hopes that they may be chosen to Life, that any other unconverted Persons have, it would be a high and provoking Contempt of God for them, to neglect the Ordinances, which he has appointed as Means, for the communicating special Grace and sweet Consolation to his Elect; and which he therefore, by his sovereign Authority, requires all, who have the Opportunity, to attend upon: And they shall find it, if guilty of it, brought into the Account against them, at the great Day, when every Man shall be judged according to his Works, and they shall receive, proportionably, the greater Punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-blair.html">Samuel Blair</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of predestination truly and fairly stated: confirmed from clear Scripture-evidence, and defended against all the material arguments and objections advanced against it</cite>, (Philadelphia PN: B. Franklin, 1742), p. 73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27b62fa696" data-kw="">
<blockquote><p>If you did aright consider that you are no more worthy of the least blessing of God than the vilest creature in the world, and that not your goodness, but God’s goodness is the cause that you excel others, there would be no place left for over-weening conceits of your self, but you would conclude (as the truth is) that the better you are gifted, the more you are indebted, and the more talents you have, the more thanks you owe unto God, and the more service unto his people. And thus much for the first remedy against pride, which is, to try our selves and our actions by the true touchstone of God’s word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal</cite>, (London: William Welbie, 1611), p. 28.</span></figcaption>

</figure><figure class="quote" id="q-6e6e9458d0" data-kw="">
<blockquote><p>If the terms of our utmost ‘endeavors’ and ‘all the days of our lives’ are to be understood literally [in the SL&amp;C], and that we must not survive any violation of the Covenant… The terms of ‘forever’ [which the SL&amp;C does not use] or ‘for all the days of our lives’ are not in our contracts to be understood naturally, but morally. For we find it plainly in the [Mosaic] Judicial Law that after a Jew had taken a servant and bored a hole through his ear he was (as the text [Ex. 21:6] says) to serve him ‘forever,’ although one of them might possibly have died the next day, and both of them after a while might have been made captives to others. The law calls the league of marriage individua vitae consuetudo, a cohabitation for all the days of our lives, for so it should be ex voto contrahenti [out of the vow binding], in the sincere desires of the contractors. Yet we know one ordinarily dies before the other and that many conditions may happen to legitimate their divorce afterwards, though the contract was never so religiously made in the presence of almighty God at first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Anthony Ascham on the Expiring of the Solemn League &amp; Covenant</cite>, 1649’ (RBO)</span></figcaption>

<blockquote><p>‘Which is your reasonable service;’ or, which is agreeable to reason; nothing is more reasonable, than that you should devote yourselves to God in this manner… Others, by ‘reasonable service,’ understand spiritual service, and expound this place by 1 Peter 2:5, where you read of spiritual sacrifices acceptable to God by Jesus Christ… And so the service or worship here spoken of is opposed to that will worship, of which you read in Colossians 2:23.</p></blockquote>

</figure><figure class="quote" id="q-f5bbf1d0d4" data-kw="">
<blockquote><p>we must see why it is that St. Paul praises the Corinthians… Now we note that in the Church of God there is first of all doctrine, and then there is order and policy… As for the rest, other than doctrine, there is also policy, and this policy is left to us in liberty. So, for example, we are presently assembled at eight o’clock; one might well arrange for it to be at seven o’clock, or change the order in some regard. And, indeed, we often see that one Church will by no means have precisely the same order as another… and do we have a different Christianity on that account? Not at all. For what belongs to outward order and policy (as I said) has been left to human liberty. It is true we must proceed with sound-mindedness and modesty, and ever consider what is fitting for the edification of the Church, as we will be exhorted in the fourteenth chapter, and there it will be treated more fully. …he did not inject himself by imposing certain laws, bringing souls into bondage; he did not erect a ‘divine service’ such as one sees in Papistry. None of all that. Rather he conveyed to them an order designed to maintain decency, peace and concord among them… So, when the gospel is preached in any place, and a church is raised up, some particular ordinances must be established, which one will know to be proper and which everyone will use in his liberty. But this (as I said) has nothing to do with adding to the doctrine of faith, nor with making laws that put our souls in bondage.</p></blockquote>

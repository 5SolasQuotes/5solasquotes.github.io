<main class="wrap"><figure class="quote" id="q-cfefc8c245" data-kw="">
<blockquote><p>This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ursinus.html">Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sudhoff, Olevianus und Ursinus</cite>, pp. 633 ff. as quoted in Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’, p. 264-5 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6cdc3733d6" data-kw="">
<blockquote><p>I. Children of pagans, of whatever age and however they have come into the power of Christians, whether legitimately or illegitimately, if they are taken into Christian families as their slaves or servants, who can be manumitted [released] again at their masters’ pleasure and ejected from Christian families, should not be baptized, but should first be taught the Christian religion, and a confession of the same should be required from them before they are admitted to baptism. For such children of pagans are not and should not be considered members of the visible church either by right of birth or by right of adoption into Christian families. Not by right of birth, for they are born outside the church from unbelieving and polluted parents, and therefore they themselves are also rightly considered unbelieving and polluted, according to 1 Corinthians 7:14. Not by right of adoption into Christian families, for this, if it is done only for the sake of servitude and with reserved liberty of expulsion, makes no one a member of the church. For thus in the Old Testament, in the families of faithful patriarchs, and in the time of the primitive apostolic church in Christian families, many children were born from pagan servants, who nevertheless were outside the church no less than their parents, and were not considered its members, until their parents, having abandoned paganism, transferred to the Jewish or Christian religion and brought their children with them to the church. Nor does the example of Abraham in Genesis 17 stand opposed [to our position], who also circumcised those bought with money and foreigners. For Abraham did not force such unwilling ones to circumcision, nor did he admit them while still unbelieving, for otherwise God’s covenant would have been profaned. Instead, he first instructed them in the doctrine of the covenant and circumcised those who embraced that doctrine along with their infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/no.html">No</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Hessian Delegation at the Synod of Dordt on the Baptism of Slave Children’</cite>, tr. Michael Lynch from Early Sessions of the Synod of Dordt (V&amp;R, 2018), pp. 134-36 at Translationes Lyncei</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-51a882480b" data-kw="">

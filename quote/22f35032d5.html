<main class="wrap"><figure class="quote" id="q-22f35032d5" data-kw="">
<blockquote><p>Reason itself also teaches us this; for whosoever has any thought and sense of deity, must acknowledge that only to be deity, than which nothing can be conceived better, more sublime, and more perfect; but of such a nature as this, there can be only one; for if such a being could have an equal, we could conceive of some more perfect Being, having none equal to himself, and possessing all the perfections of that other deity in himself alone, and having him dependent on himself.

Again, if there were more Gods than one, there would be more supreme Beings, than one, which is impossible; for if there were several supreme Beings, either one would be greater than the other, or they would be entirely equal; if the former, one of these would be the sole deity, namely, that which excelled the other; if the latter, neither of them would be supreme, because that only is supreme, which is greater than all other beings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 2.1, pp 66-67.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c80bf07373" data-kw="">
<blockquote><p>For the possibility of thinking that He does not exist is not on account of the imperfection of his being, or the uncertainty of it—since in itself his being is supremely manifest—but is the result of the weakness of our mind, which is able to see Him only in his effects and not in Himself, so that it is led by reasoning to know that He is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 11</span></figcaption>

</figure><figure class="quote" id="q-b3f7519ad4" data-kw="">
<blockquote><p>If I cannot by this Attempt convince Atheists, (which perhaps is next to blanching an Ethiopian) yet I hope I shall do something towards preventing the Spreading of that pernicious Infection which they are the Authors of; I hope I shall effect something towards checking the Progress of that Hellish Ferment which works in the World at this day. It may be what I shall offer will be serviceable to bridle the Insolence of those bold Men, and to make them recoil and give back. It may be it will cripple and disable them, though they make a shift to be upon their Feet. Perhaps it may give them a Mortification, though they will not let us know so much.

Or, if my Hopes fail me as to this, yet I will not despair of Confirming, and Strengthening such who are really persuaded of the Doctrine here treated of. I may be helpful to establish these Persons in their Belief, though I cannot reclaim the Infidelity of others. But this is not the height of what I aim at; for, besides what I have already suggested, my Intention is that this Discourse should afford variety of matter to the Religious for their Devout Contemplations. I have set the Greater and Lesser World before them, and have so displayed the several parts of both, that they may everywhere discern the Eternal Godhead.

I have propounded those Visible and Remarkable Topicks whence pious Minds may infallibly deduce the Truth and Reality of Providence, and the adorable Excellency of the Power, Wisdom and Goodness of God, and his other Divine Perfections and Properties which respect Mankind. If I had not chiefly designed these Papers for such, I should not have so often alleged the Holy Scriptures: which with the other sort of Men are in no esteem, and are thought to have no Authority; no more than the Alcoran, or some Legendary Tale. But all those that have a true Sense of Religion on their Spirits, reverence and prize these Writings next to the Blessed Author of them; and they know that it is proper to prove a God out of his Own Book.

The Reader may observe that I frequently make use of Scripture in setting forth Natural things, those which appertain to the Heavens, Earth, Sea, &amp;c. and the Body of Man; because I would let the World see that this Holy Book is not only useful as to Divine and Spiritual Matters, but even in respect of all sorts of Humane Learning, which I have on another occasion amply proved. Having thus propounded the Designs of my Undertaking, (and if I be successful in any of them, I shall reckon it a great Happiness) I will enter upon the Work itself, by the Assistance of Him whose Existence and Providence I am now to demonstrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A demonstration of the existence and providence of God, from the contemplation of the visible structure of the greater and the lesser world in two parts, the first shewing the excellent contrivance of the heavens, earth, sea, &amp;c., the second the wonderful formation of the body of man</cite>, (London: Jonathan Robinson and John Wyat, 1696), vii-viii.</span></figcaption>

</figure><figure class="quote" id="q-26a3d50a53" data-kw="">
<blockquote><p>Conviction [of atheists] involves assertion and confutation. Here only the method or titles and classes of arguments of the former are to be indicated. Leaving all others aside, I will exhibit here only those of [Marin] Mersenne [d. 1648, a Romanist] (who embraces all): One is that all creatures in some way affirm the existence of deity;

2. That all men have that thought;

3. Because it is necessary that something be from itself;

4. From the eternity of truth;

5. From the best entity and goodness;

6. From the axiom ‘Whatever has the power of moving has it from another’;

7. From the grades of beings;

8. Because God is the light manifesting the rest, and it is known through itself that God exists;

9. Because a creature is a being produced by another from nothing;

10. From the beauty of each creature;

11. From the immutable natural law;

12. From our appetite [desire for something greater, best and satisfying];

13. From the concord of dissonant things;

14. From the government of things;

15. From metaphysical science, its object, etc.;

16. From arithmetic and algebra, namely from the monad, the principle of number, and other admirable things of numbers;

17. From geometry, namely from the abstruse and admirable things of figures and dimensions;

18. From music, where he discusses the harmony of the macrocosm and microcosm and the comparison of mundane music with human;

19. From astrology, namely from the ordered revolution of the stars, especially the swiftness of the diurnal motion from east to west;

20. From mechanics, especially the crane which lifts the greatest weight by the least force;

21. From any sciences and arts;

22. From other inferior sciences;

23. From all species of divinations;

24. From the six determinations of things which are indeterminate by their own nature–they are of (1) quantity, (2) disposition and parts, (3) duration, (4) figure, (5) multitude of individuals and species, (6) intension of grades, and existence;

25. From moral matters;

26. From all artifacts and from the stars;

27. From the collection of all beings;

28. From geography and hydrography;

29. From poverty, from the diversity of faces, voice, writing, states, gaits;

30. From the end to which all things tend;

31. From this, that an object ought to be assigned which can terminate and satiate our love;

32. From various absurdities and disadvantages and from the advantages which follow from the opposite or varying opinion;

33. From optics;

34. From gnomonics [using dials];

35. From architecture;

36. From nautical science. And this is a most diffuse assertion. Its confutation occupied in the solution and attack of atheistic exceptions, twenty-six in number, I do not exhibit here because the reason of the theses does not bear refuting them. Let Mersenne himself be consulted, p. 234, and Valesius, Mornay, and others cited above in part 1. You have the marrow of them in Mornay and those who defend the Providence of God. In the course and repetition of the common topics which we complete in this Academy about every year and a half, we have hitherto set forth those classes of arguments to our students and to the best of our ability deduced and defended them. The arguments [against atheists] are either intrinsic or extrinsic. The former are more as if a priori [from first things] or more a posteriori [from things following]. The former are drawn from certain principles and axioms of the light of nature:

1. There is not given an infinite regress in causes;

2. Nothing is from itself, or nothing is the cause of itself;

3. Whatever is moved is moved by another, and so finally one must come to an unmoved mover;

4. In order there is something first. The latter arguments are drawn:

1. From the adornment, perfection, order, actions, powers of the creatures or universe, Ps. 8 &amp; 19; Isa. 40; Rom. 1;

2. From the intellectual nature of angels, devils and their appearances, operations, ἐνεργήματα;

3. From man, the microcosm, considered both in his nature and essential, integral parts, etc., and in the symbiotic, economic, political, ecclesiastical, scholastic order, with the changes and rewards and punishments in this life: Ps. 8 collated with Isa. 40 and the Ecclesiastes of Solomon;

4. From miracles and prophecies, Isa. 64. The extrinsic arguments or testimonies are:

1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions;

2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian. But if anyone having been advised persists in playing the fool and involving himself and the truth in mere begging of the question or obscure or uncertain consequences, such as [Descartes’s] ‘I think, therefore I am’, and ‘That of which the idea is in me, that very thing, etc.’–skepticism having first been inducted and all natural, innate and acquired knowledge having been erased or sequestered by doubt, and also all principles and demonstrations hitherto customary to all of Christendom, and indeed agreeably to the Scriptures, having been denied and snatched away, certainly to those proud betrayers or corrupters of the cause it must be suggested what Tertullian said, “Evidently the truth was waiting to be liberated by the Valentinians and Marcionites.” To the same men and their favorers all students and masters of all sciences, especially of theology, could say, “Render the legions. For easy is the descent to Avernus, but to retrace one’s steps, etc.</p></blockquote>

27. From the collection of all beings;

28. From geography and hydrography;

29. From poverty, from the diversity of faces, voice, writing, states, gaits;

30. From the end to which all things tend;

31. From this, that an object ought to be assigned which can terminate and satiate our love;

32. From various absurdities and disadvantages and from the advantages which follow from the opposite or varying opinion;

33. From optics;

34. From gnomonics [using dials];

35. From architecture;

36. From nautical science. And this is a most diffuse assertion. Its confutation occupied in the solution and attack of atheistic exceptions, twenty-six in number, I do not exhibit here because the reason of the theses does not bear refuting them. Let Mersenne himself be consulted, p. 234, and Valesius, Mornay, and others cited above in part 1. You have the marrow of them in Mornay and those who defend the Providence of God. In the course and repetition of the common topics which we complete in this Academy about every year and a half, we have hitherto set forth those classes of arguments to our students and to the best of our ability deduced and defended them. The arguments [against atheists] are either intrinsic or extrinsic. The former are more as if a priori [from first things] or more a posteriori [from things following]. The former are drawn from certain principles and axioms of the light of nature:

1. There is not given an infinite regress in causes;

2. Nothing is from itself, or nothing is the cause of itself;

3. Whatever is moved is moved by another, and so finally one must come to an unmoved mover;

4. In order there is something first. The latter arguments are drawn:

1. From the adornment, perfection, order, actions, powers of the creatures or universe, Ps. 8 &amp; 19; Isa. 40; Rom. 1;

2. From the intellectual nature of angels, devils and their appearances, operations, ἐνεργήματα;

3. From man, the microcosm, considered both in his nature and essential, integral parts, etc., and in the symbiotic, economic, political, ecclesiastical, scholastic order, with the changes and rewards and punishments in this life: Ps. 8 collated with Isa. 40 and the Ecclesiastes of Solomon;

4. From miracles and prophecies, Isa. 64. The extrinsic arguments or testimonies are:

1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions;

2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian. But if anyone having been advised persists in playing the fool and involving himself and the truth in mere begging of the question or obscure or uncertain consequences, such as [Descartes’s] ‘I think, therefore I am’, and ‘That of which the idea is in me, that very thing, etc.’–skepticism having first been inducted and all natural, innate and acquired knowledge having been erased or sequestered by doubt, and also all principles and demonstrations hitherto customary to all of Christendom, and indeed agreeably to the Scriptures, having been denied and snatched away, certainly to those proud betrayers or corrupters of the cause it must be suggested what Tertullian said, “Evidently the truth was waiting to be liberated by the Valentinians and Marcionites.” To the same men and their favorers all students and masters of all sciences, especially of theology, could say, “Render the legions. For easy is the descent to Avernus, but to retrace one’s steps, etc.”

— Gisbertus Voetius, Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1, pp. 206-9 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConviction+%5Bof+atheists%5D+involves+assertion+and+confutation.+Here+only+the+method+or+titles+and+classes+of+arguments+of+the+former+are+to+be+indicated.+Leaving+all+others+aside%2C+I+will+exhibit+here+only+those+of+%5BMarin%5D+Mersenne+%5Bd.+1648%2C+a+Romanist%5D+%28who+embraces+all%29%3A+One+is+that+all+creatures+in+some+way+affirm+the+existence+of+deity%3B+2.+That+all+men+have+that+thought%3B+3.+Because+it+is+necessary+that+something+be+from+itself%3B+4.+From+the+eternity+of+truth%3B+5.+From+the+best+entity+and+goodness%3B+6.+From+the+axiom+%E2%80%98Whatever+has+the+power+of+moving+has+it+from+another%E2%80%99%3B+7.+From+the+grades+of+beings%3B+8.+Because+God+is+the+light+manifesting+the+rest%2C+and+it+is+known+through+itself+that+God+exists%3B+9.+Because+a+creature+is+a+being+produced+by+another+from+nothing%3B+10.+From+the+beauty+of+each+creature%3B+11.+From+the+immutable+natural+law%3B+12.+From+our+appetite+%5Bdesire+for+something+greater%2C+best+and+satisfying%5D%3B+13.+From+the+concord+of+dissonant+things%3B+14.+From+the+government+of+things%3B+15.+From+metaphysical+science%2C+its+object%2C+etc.%3B+16.+From+arithmetic+and+algebra%2C+namely+from+the+monad%2C+the+principle+of+number%2C+and+other+admirable+things+of+numbers%3B+17.+From+geometry%2C+namely+from+the+abstruse+and+admirable+things+of+figures+and+dimensions%3B+18.+From+music%2C+where+he+discusses+the+harmony+of+the+macrocosm+and+microcosm+and+the+comparison+of+mundane+music+with+human%3B+19.+From+astrology%2C+namely+from+the+ordered+revolution+of+the+stars%2C+especially+the+swiftness+of+the+diurnal+motion+from+east+to+west%3B+20.+From+mechanics%2C+especially+the+crane+which+lifts+the+greatest+weight+by+the+least+force%3B+21.+From+any+sciences+and+arts%3B+22.+From+other+inferior+sciences%3B+23.+From+all+species+of+divinations%3B+24.+From+the+six+determinations+of+things+which+are+indeterminate+by+their+own+nature%E2%80%93they+are+of+%281%29+quantity%2C+%282%29+disposition+and+parts%2C+%283%29+duration%2C+%284%29+figure%2C+%285%29+multitude+of+individuals+and+species%2C+%286%29+intension+of+grades%2C+and+existence%3B+25.+From+moral+matters%3B+26.+From+all+artifacts+and+from+the+stars%3B+27.+From+the+collection+of+all+beings%3B+28.+From+geography+and+hydrography%3B+29.+From+poverty%2C+from+the+diversity+of+faces%2C+voice%2C+writing%2C+states%2C+gaits%3B+30.+From+the+end+to+which+all+things+tend%3B+31.+From+this%2C+that+an+object+ought+to+be+assigned+which+can+terminate+and+satiate+our+love%3B+32.+From+various+absurdities+and+disadvantages+and+from+the+advantages+which+follow+from+the+opposite+or+varying+opinion%3B+33.+From+optics%3B+34.+From+gnomonics+%5Busing+dials%5D%3B+35.+From+architecture%3B+36.+From+nautical+science.+And+this+is+a+most+diffuse+assertion.+Its+confutation+occupied+in+the+solution+and+attack+of+atheistic+exceptions%2C+twenty-six+in+number%2C+I+do+not+exhibit+here+because+the+reason+of+the+theses+does+not+bear+refuting+them.+Let+Mersenne+himself+be+consulted%2C+p.+234%2C+and+Valesius%2C+Mornay%2C+and+others+cited+above+in+part+1.+You+have+the+marrow+of+them+in+Mornay+and+those+who+defend+the+Providence+of+God.+In+the+course+and+repetition+of+the+common+topics+which+we+complete+in+this+Academy+about+every+year+and+a+half%2C+we+have+hitherto+set+forth+those+classes+of+arguments+to+our+students+and+to+the+best+of+our+ability+deduced+and+defended+them.+The+arguments+%5Bagainst+atheists%5D+are+either+intrinsic+or+extrinsic.+The+former+are+more+as+if+a+priori+%5Bfrom+first+things%5D+or+more+a+posteriori+%5Bfrom+things+following%5D.+The+former+are+drawn+from+certain+principles+and+axioms+of+the+light+of+nature%3A+1.+There+is+not+given+an+infinite+regress+in+causes%3B+2.+Nothing+is+from+itself%2C+or+nothing+is+the+cause+of+itself%3B+3.+Whatever+is+moved+is+moved+by+another%2C+and+so+finally+one+must+come+to+an+unmoved+mover%3B+4.+In+order+there+is+something+first.+The+latter+arguments+are+drawn%3A+1.+From+the+adornment%2C+perfection%2C+order%2C+actions%2C+powers+of+the+creatures+or+universe%2C+Ps.+8+%26+19%3B+Isa.+40%3B+Rom.+1%3B+2.+From+the+intellectual+nature+of+angels%2C+devils+and+their+appearances%2C+operations%2C+%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%AE%CE%BC%CE%B1%CF%84%CE%B1%3B+3.+From+man%2C+the+microcosm%2C+considered+both+in+his+nature+and+essential%2C+integral+parts%2C+etc.%2C+and+in+the+symbiotic%2C+economic%2C+political%2C+ecclesiastical%2C+scholastic+order%2C+with+the+changes+and+rewards+and+punishments+in+this+life%3A+Ps.+8+collated+with+Isa.+40+and+the+Ecclesiastes+of+Solomon%3B+4.+From+miracles+and+prophecies%2C+Isa.+64.+The+extrinsic+arguments+or+testimonies+are%3A+1.+Internal%2C+of+synteresis+and+conscience%2C+Rom.+2%2C+and+here+about+the+common+notions%3B+2.+External%2C+the+consensus+of+all+nations%2C+and+the+doctrine+of+all+sages.+But+with+all+reasons+having+been+subtracted+and+repeated+thoughts+more+often+recurring%2C+we+have+found+that+the+order+both+of+nature+and+of+our+better+knowledge+is+rather+to+be+observed+and+more+safely+served+in+this+way%2C+that+the+demonstration+from+effects+to+cause%2C+from+works+to+maker+and+governor%2C+be+put+first+as+preeminent+and+universal%2C+which+embraces+all+others+in+itself+since+indeed+all+others+depend+on+it+and+are+derived+from+it%2C+and+all+presuppose+it.+For+no+one+doubts+that+the+law+of+nature+and+of+implanted+common+notion%2C+and+hence+the+acknowledgment+and+profession+of+deity%2C+in+addition+miracles%2C+prophecies+and+political+order%2C+are+to+be+referred+to+the+works+of+God.+As+for+those+axioms+about+causes%2C+about+motion%2C+about+order%2C+those+complex+principles+would+not+exist+unless+those+things+from+which+induction+and+finally+complex+theses+and+principles+arise+had+been+observed+in+the+works+of+God+or+creatures%3B+there+would+not+be+observation+nor+induction+about+and+from+creatures+unless+there+were+creatures.+But+that+this+method+is+safest%2C+most+expeditious%2C+and+most+evident%2C+the+doctrine+and+example+of+the+Holy+Spirit+persuade+Christians%2C+Rom.+1%2C+Ps.+19%2C+Acts+17%2C+Isa.+40%2C+etc.+To+accuse+Him+of+ignorance+or+pseudography+is+atheism+lurking+under+the+cloak+of+a+Christian.+But+if+anyone+having+been+advised+persists+in+playing+the+fool+and+involving+himself+and+the+truth+in+mere+begging+of+the+question+or+obscure+or+uncertain+consequences%2C+such+as+%5BDescartes%E2%80%99s%5D+%E2%80%98I+think%2C+therefore+I+am%E2%80%99%2C+and+%E2%80%98That+of+which+the+idea+is+in+me%2C+that+very+thing%2C+etc.%E2%80%99%E2%80%93skepticism+having+first+been+inducted+and+all+natural%2C+innate+and+acquired+knowledge+having+been+erased+or+sequestered+by+doubt%2C+and+also+all+principles+and+demonstrations+hitherto+customary+to+all+of+Christendom%2C+and+indeed+agreeably+to+the+Scriptures%2C+having+been+denied+and+snatched+away%2C+certainly+to+those+proud+betrayers+or+corrupters+of+the+cause+it+must+be+suggested+what+Tertullian+said%2C+%E2%80%9CEvidently+the+truth+was+waiting+to+be+liberated+by+the+Valentinians+and+Marcionites.%E2%80%9D+To+the+same+men+and+their+favorers+all+students+and+masters+of+all+sciences%2C+especially+of+theology%2C+could+say%2C+%E2%80%9CRender+the+legions.+For+easy+is+the+descent+to+Avernus%2C+but+to+retrace+one%E2%80%99s+steps%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1%2C+pp.+206-9+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26a3d50a53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26a3d50a53.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Conviction%20%5Bof%20atheists%5D%20involves%20assertion%20and,but%20to%20retrace%20one%E2%80%99s%20steps%2C%20etc&amp;text=Conviction%20%5Bof%20atheists%5D%20involves%20assertion%20and%20confutation.%20Here&amp;text=to%20Avernus%2C%20but%20to%20retrace%20one%E2%80%99s%20steps%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Although the Deity is unbounded and incomprehensible, yet because God has condescended to reveal himself to us both in nature and in the Scriptures (and it is incumbent upon the one who approaches God to believe that he is and is a rewarder of those who seek him, Heb. 11:6), the discussion concerning God holds the first place in theology and embraces the sum of all saving knowledge.</p></blockquote>

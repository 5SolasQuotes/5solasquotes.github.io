<blockquote><p>1st Conclusion: Fire and sword, or war, or the coactive power of a magistrate is not God’s way of planting the Gospel in a heathen nation which never heard of the gospel before: 1. Because the apostles were commanded by teaching the gospel to all nations, Mt. 28:19-20; Mk. 16:15; Acts 7:8; and not by war to spread the gospel; 2. Because Christ’s Kingdom is not of this world, for then his servants would fight for Him (Jn. 18:36), nor are the weapons of our warfare carnal (2 Cor. 10:4), nor is Christ’s sword any other thing than the Word of God (Rev. 19:15; Gal. 6:17). And in this meaning, and with relation to the internal acts of sound believing, have the learned taught us that, religio suaderi potest, cogi non potest [‘Religion can be persuaded; it cannot be forced.’]. If these be the Constitutions of Clement, let it go for a truth in this sense, that: ‘God has given liberty of will to men, not punishing them with temporal death, but calls them to give an account of their doings in the life to come.’ …and Athanasius meant with us, when he cites that, ‘If any will come after me, let him take up his cross,’ to prove that the will cannot be compelled; and that of Lactantius is approved by all: Defendenda tamen religio est, non occidendo, sed moriendo, non saevitia, sed sapientia, non scelere, sed fide; illa enim malorum sunt, haec bonorum; et necesse est bonum in religione versari, non malum: Nam si sanguine, si tormentis, si malo religionem defendere velis, jam non defendetur illa, sed polluetur, et violabitur. Nihil est tam voluntarium quam religio, in qua si animus sacrificantis est eversus, jam sublata, jam nulla est. (Institutes, bk. 5, ch. 19) [“Religion, however, must be defended not by killing but by dying, not by cruelty but by wisdom, not by crime but by faith; for the former belong to the wicked, the latter to the good. And it is necessary that good, not evil, should be found in religion. For if you wish to defend religion by blood, by tortures, or by evil, it will no longer be defended but polluted and profaned. Nothing is so voluntary as religion; for if the heart of the worshiper is overturned, it is already destroyed—it no longer exists.”] All which tends to this, that religion is like free-will, and free-will like a virgin which cannot be ravished. Let that of Tertullian stand, Lex nostra non se vindicat ultore gladio [‘Our Law does not avenge itself with the avenging sword.’]. Procopius says that Justinian was blamed, because he compelled the Samaritans to embrace the Christian faith. (Procopius, in Arca. Histor.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: 1644), pt. 2, ch. 6, p. 353</span></figcaption>

<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>

<blockquote><p>48. For to that end also is the holy Scripture profitable, to show which is the best manner of governing a commonwealth, and that the Magistrate as being God’s Minister may by this guiding star be so directed, as that he may execute the parts of his office, according to the will of God, and may perfectly be instructed to every good work; yet the Minister is not said properly to treat of civil businesses, but of the scandals which arise about them, or of the cases of conscience which occur in the administration of the commonwealth: So also the Magistrate is not properly said to be exercised about the spiritual things of the Church, but rather about those external things which adhere unto and accompany the spiritual things. … 53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul… … 56. Surely the faithful and godly ministers, although they could do it unchallenged and uncontrolled, and were therein allowed by the Magistrate (as in the prelatical times it was), yet would not usurp the power of life and death, or judge and determine concerning men’s honors, goods, inheritance, division of families, or other civil businesses; seeing they well know these things to be heterogeneous to their office: But as they ought not to entangle themselves with the judging of civil causes… 86. What then? Shall it be lawful ordinarily for ministers and elders to do what they list, or shall the governors in the Churches, glorying in the Law, by their transgression dishonor God? God forbid. For first, if they shall trespass in anything against the Magistrate or municipal Laws, whether by intermeddling in judging of civil causes, or otherwise disturbing the peace and order of the commonwealth, they are liable to civil trial and judgments, and it is in the power of the Magistrate to restrain and punish them.</p></blockquote>

<blockquote><p>I offer (Worthy Reader) to your impartial and ingenuous censure these my ensuing thoughts against Liberty of Conscience, from which way, looking to me with a face of atheism, I call the adversaries, Libertines, not intending to reach a blow to any godly man, or to wound those who out of weakness are captivated with that error, but to breed in the hearts of the godly a detestation of that way, which in truth has its rise from Libertinism, and savors rankly of wide, loose and bold atheistical thoughts of the majesty of God, as if our conscience had a Prerogative Royal beside[s] a rule… and our faith and hope [according to it] must be resolved in the first principle of skepticism. So it seems to me, for the young daughters of the mind, the simplest acts of apprehending, knowing, believing God and divine truths are innocent, harmless ill-less soul-works, being from under all dominion of either free-will or a divine Law; and the mind [according to it, being] a free-born absolute Princess, can no more incur guiltiness in its operations about an infinite Sovereign God and his revealed will by this lawless way, than the fire in burning, the sun in enlightening, the stone in moving downward, be arraigned of any breach of Law, if toleration have place. All certainty of believing, all steadfastness, rooting and unmovable establishing in the truth, all life of consolations and comforts in the Scriptures, all peace of heavenly confidence, all joy unspeakable and full of glory, all lively hope, all patient and submissive waiting for the fruits of the harvest, all wrestling in prayer, all gloriation in tribulation and all triumphing in praising, all rejoicing in the Spirit, being bottomed on fallible opinions, on doubtful disputations of skeptics, may be the reelings of windmills, fair fancies and dreams; for who (say they) is infallible? and who hath known the mind of the Lord? so as the truth must be monopolized to any one sect or way? Who in faith or fullness of assurance can convince or rebuke gainsayers, heretics, or such as bring another doctrine, as those whom you so labor to convince and rebuke? 3. Conscience is hereby made every man’s rule, umpire, judge, Bible, and his God, which if he follow, he is but at the worst, a godly, pious, holy heretic, who fears his conscience more than his Creator, and is to be judged of you a saint. 4. Hence conscience being deified, all rebuking, exhorting, counter-arguing, yea all the ministry of the Gospel must be laid aside; no man must judge [a] brother [an] idolater, or brother Familist, or saints to be Socinians, or men of corrupt minds, perverse disputers, vain-janglers, wresters, rackers or torturers of Scripture, whose words eat as a canker, who subvert whole houses, who speak the visions of their own head and see false burdens, for all these who were of old, but are now quite gone out of the world; for who can make a window in any man’s soul and see there heart-obstinacy which only does essentially constitute the heretic, the blasphemer, the false prophet [according to them]? But is not brotherly forbearance, Christian indulgence a debt we owe to brethren, saints, and the truly godly in errors, and mind infirmities, which by a natural emanation or resultance get the fore-start of freewill? To which I shall speak in these few considerations: 1. It is much to be desired with the prayers and suits of the children of God that where there are two opinions, there may be one heart, that the Father of Spirits would unite the hearts of all the children of one Father and the heirs of one house. 2. Papists here have exceeded in boundless domination and tyranny over the consciences of men: and what ever is contrary to the lawless decrees of their councils and popes is an unexpiable heresy and cannot be purged but by fire and fagot. 2. Whoever refuse subjection of conscience to that enemy of Christ, and to that woman-mistress of witchcrafts, on whose skirts is found the blood of the martyrs of Jesus, is presently an heretic, and his arguments answered with burning-quick [alive]: this tyranny over conscience we disclaim; yet for that, ought not the other extremity of wild toleration be embraced. 3. We cannot think but all saints in this side of glory carry to Heaven with them errors, mistakes and prophesying in part [1 Cor. 13], and the fairest stars and lights in this lower firmament of the Church are clouded, and the benefit of the moon serves to enlighten the under garden of lillies, where ‘Christ feedeth, till the day break, and the shadows flee away.’ And here brotherly indulgence and reciprocation of the debt of compassionate forbearance of the infirmities one of another must have place. 4. Yet so, as there can be no conflict of grace against grace, nor can the taking off the foxes which destroy the vines be contrary to the gentleness and meekness of the saints in fulfilling the law of love and bearing one another’s burdens, nor can love seated essentially in a new born child of the second birth be contrary to the zeal of God in withstanding to the face a Saint looking awry, and walking not with a straight foot according to the truth of the gospel; which way if heeded in sincerity, should breed more union of hearts, and be a greater testimony of faithfulness to a straying sheep than our cruel meekness and bloody gentleness in a pretended bearing with tender consciences under a color of paying the debt of bastard love, while as we suffer millions to perish, through silence and merciless condolency with them in their sinful depraving of the truth.</p></blockquote>

<blockquote><p>The British Baptists held to a high view of the magistrate and followed largely in the Magisterial Protestant tradition in terms of constitutional monarchy, the two kingdoms, and, to varying degree, the magistrate’s care of religion… the English Baptist theologian John Gill exemplifes this political perspective. Judging from his statements about the duties of a magistrate, that include securing right religious worship in the commonwealth and enforcing virtue using the two tables of the Decalogue, it is apparent that Gill would not have agreed with Jeferson’s wall of separation, nor with the Baptists who followed him. The “frst care of government” is of divine things. Though the Second London Confession does not stipulate the magistrate’s responsibility for care of religion, it does not argue against it, and so Gill is not in violation of this doctrinal standard for maintaining this view held by the Magisterial Reformers.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5e2deb465d" data-kw="">
<blockquote><p>Therefore, angels and human beings, because of the fact that they have been created as rational, have received from God in the very creation of a spiritual nature, the gift of eternity and happiness. This was done in such a way that, if they adhered uninterruptedly to the love of the Creator, at the same time, they would remain eternally blessed; if, on the other hand, by a decision of their own free will, they would endeavour to do their own will against the command of the Most High Creator, blessedness would immediately depart from the recalcitrant, and there would be left for them as a punishment eternal misery, henceforward subjected to error and grief. Concerning the angels, God has decided this and carried it out, that, if any of them loses the goodness of will, he will never restore it by divine gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To Peter on the Faith</cite>, in Selected Works, trans. Robert B. Enos, The Fathers of the Church: A New Translation, vol. 95 (Washington D.C.: The Catholic University of America Press, 1997), III.32, p. 80.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-041822af0e" data-kw="angels spirits">
<blockquote><p>Are angels spiritual and incorporeal substances? We affirm. Scripture expressly calls them spirits; now for what purpose would they be called “spirits” if they are corporeal? Spirit is diametrically opposed to body: “A spirit hath not flesh and bones,” says Christ, “as ye see me have” (Lk. 24:39). For the same reason they are classed among things “invisible” (Col. 1:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.2.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/nature-number-orders.html">Nature, number, orders</a></span></div>

</figure><figure class="quote" id="q-0d1736018e" data-kw="">
<blockquote><p>And it seems particularly necessary, at the present time, when our Free Church has been organized on so scriptural a footing, that we should ask breath from the four winds, to make it the means of converting souls. Our ecclesiastical constitution may be good, but, unless we have the quickening Spirit, it will be no better than a candlestick without any oil burning in it the candlestick may be all of gold, and decorated with pomegranates and flowers, but if it emits no flame, it is useless in the eyes of God.

We read in the prophecies of Ezekiel of the temple that is to be erected at Jerusalem in the latter days; this is generally understood, by those who do not look for a personal advent of the Saviour, to usher in the millennial splendours, as emblematic of the constitution that will distinguish the Church, when the Jews are replaced in their own territory. Now, after the edifice is completed, according to the prescribed model, the healing waters issue forth, to pour their waves into the salt sea; and, since, by the providence of God, the external arrangements of our Zion are consummated, let us seek that a kindred stream of reviving influence should flow out, diffusing life and gladness.

The form of the windows, and columns, and chapiter in our temple, is determined; let us seek that it may be the seat and centre of a quickening energy that will pervade many lands. God has enabled us to lay out and hedge the garden in which we are to carry on our labours; our engrossing aim should now be, that the sun may illuminate its beds, that many lilies may be planted in it, so that the Son of God shall walk in the midst of it, regaled with their fragrance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-cumming.html">Alexander Cumming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dispensation of the Spirit in Gospel Times. (Preached before the Free Synod of Perth, 15th October 1844, and published at their request.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-e411c59bf1" data-kw="">
<blockquote><p>…and it is most certain that angelical persons have a limited presence, because they have a finite essince [as opposed to God]… I need say no more concerning angels than what is commonly said, ‘Angeli sunt alicuoi definitive; sunt enim in suo ubi non per operationem vel circumscriptionem, sed per designationem definitivam,’ angels are naturally somewhere; though they are not in any place by extension of parts, yet their finite nature is contained within certain bounds and limits. Hence it is that some learned men affirm that it is improper to say, that God is somewhere because He is everywhere; somewhere is a definitive word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, … (London, 1650), ch. 6, pp. 169-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><figure class="quote" id="q-06e5794c6a" data-kw="">
<blockquote><p>Bodies are in places circumscriptively bounded by their dimensions without penetration. Angels are in places definitively, that is, though they are not bounded by dimensions of height, breadth and depth, as bodies, yet they are not in two places at once; whilst they are in this place, they are not in another. God is in every place always.</p></blockquote>

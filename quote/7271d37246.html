<blockquote><p>5. That we must not dote upon sensible consolation. The merciful nature of God should be a support to us though we see nothing of the effects of it in the course of his dealings with us; and we should believe his love when we do not actually feel it. Job 10:13, ‘And these things hast Thou hid in thine heart; I know that this is with Thee.’ He speaks of his favorable inclination to show pity to his creatures. We are not able always to reconcile his present dispensations with his gracious nature, nor our former experience of his goodnessת yet faith must not quit its holdfast but we must see what is hid in God’s heart and comfort ourselves with concealed favor and mercy, when we cannot comfort ourselves with felt favor and mercy. Though mercies be not visible and obvious to sense, yet the disposition and inclination is ever in God unchangeable and sure. A withdrawn God is a merciful God still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture</cite>, … (London: J.D., 1693) | A Sermon on Isa. 50:10, p. 813</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works</cite>, vol. 2, pp. 358-61</span></figcaption>

</figure><figure class="quote" id="q-ba65e7d881" data-kw="">
<blockquote><p>The sum of this study of these passages in Matthew and Luke [6:35-36] is simply this, that presupposed in God’s gifts bestowed upon the ungodly there is in God a disposition of love, kindness, mercifulness, and that the actual gifts and the blessing accruing therefrom for the ungodly must not be abstracted from the lovingkindness of which they are the expression. And, of course, we must not think of this lovingkindness as conditioned upon a penitent attitude in the recipients. The lovingkindness rather is exercised towards them in their ungodly state and is expressed in the favours they enjoy. What bearing this may have upon the grace of God manifested in the free offer of the gospel to all without distinction remains to be seen. But we are hereby given a disclosure of goodness in the heart of God and of the relation there is between gifts bestowed and the lovingkindness from which they flow. And there is indicated to us something respecting God’s love or benevolence that we might not or could not entertain if we concentrated our thought simply on the divine decree of reprobation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’ | Matthew, 5:44–48</span></figcaption>

<blockquote><p>3. I reply: In us can be distinguished a double act of will, namely to will and to will-not, and each is a positive act; and if they be about the same object, they are contrary acts – which also are expressed by different words, which are ‘to love’ and ‘to hate’. 4. And both [of these] in us can be distinguished, so that to will is distinguished into efficacious and remiss: so that ‘efficacious willing’ is called that whereby to the will is not only the being of what is willed pleasing but, if it can at once put what is willed into being, it at once does; so too ‘efficacious willing-not’ is called that whereby not only does he who wills-not impede something but, if he can, he altogether destroys it. ‘Remiss will’ is that by which a willed thing so pleases that yet the will does not put it into being, although it can put it into being; ‘remiss willing-not’ is that whereby the thing willed-not thus displeases that it [the will] not prevent it from being, although it could. 5. In us, therefore, weak [or remiss] willing-not – properly speaking – seems to be the permission of something bad that I know: for I am not said to permit that about which I know nothing, or that which is so done by another that it pleases me – but that which I know is wrongly done by another but do not prevent, this I permit. 6. A sign of efficacious willing, if it be done immediately by the will, is fulfilment; if through another, it is precept; and of weak [remiss] willing in us, perhaps counsel is a sign, or persuasion or warning. And a sign of weak [remiss] willing-not is permission or dissuasion; and a sign of efficacious willing-not is prohibition. 7. But this distinction could be posited in God, so that as one act of his is willing and willing-not (and this without contrariety or dissimilarity in the act in itself), so over certain objects of his willed would be put ‘efficacious willing’, and similarly his willing-not over certain objects: willed-not ‘efficacious’, and over certain, not [efficaciously, or remissly]. And then could God’s willing-not be called weak with respect to those objects which he so wills-not that he wills-not to prohibit them; and this willing-not of God can be called his permission – and so the act in God, insofar as it passes over the object, thus disposes itself to the divine will. 8. But if this [n. 7] does not please (to the extent the willing-not of anything posited in being would seem to be with some sadness and with some imperfection of the volition and will), then it can be said that permission outwardly, or the sign, is that an effect be, which [sign] however is against the divine precept – and this is the permission that is a sign of the divine will; but to this does not correspond anything in the divine will save the not-willing to prohibit something being done, or the not willing-not, which is a negation of a divine positive act and consequently is not a positive [act]. 9. And that he is called ‘willing to allow’, this can be meant, not that he has a direct willing about what he permits, but a reflex act; for he offers to his will that this man will sin or is sinning, and first his will does not have a ‘to will’ about this man (for he cannot will him to have sin); secondly he can understand his will not to be willing this, and then he can will his will ‘not to will this’, – and so he is called willing to allow and to allow willingly; willing to permit and to permit willingly. Just as on the other side, with Judas presented to him: first God has a not willing him glory, and not first a willing-not (according to the final position in Ord. I, d. 41, n. 45); and he can then secondly reflect on this negation of act and will it – and so willing (or willingly) he does not choose Judas going to sin finally and a willing-not of glory, but a non-willing of glory.</p></blockquote>

ts: willed-not ‘efficacious’, and over certain, not [efficaciously, or remissly]. And then could God’s willing-not be called weak with respect to those objects which he so wills-not that he wills-not to prohibit them; and this willing-not of God can be called his permission – and so the act in God, insofar as it passes over the object, thus disposes itself to the divine will. 8. But if this [n. 7] does not please (to the extent the willing-not of anything posited in being would seem to be with some sadness and with some imperfection of the volition and will), then it can be said that permission outwardly, or the sign, is that an effect be, which [sign] however is against the divine precept – and this is the permission that is a sign of the divine will; but to this does not correspond anything in the divine will save the not-willing to prohibit something being done, or the not willing-not, which is a negation of a divine positive act and consequently is not a positive [act]. 9. And that he is called ‘willing to allow’, this can be meant, not that he has a direct willing about what he permits, but a reflex act; for he offers to his will that this man will sin or is sinning, and first his will does not have a ‘to will’ about this man (for he cannot will him to have sin); secondly he can understand his will not to be willing this, and then he can will his will ‘not to will this’, – and so he is called willing to allow and to allow willingly; willing to permit and to permit willingly. Just as on the other side, with Judas presented to him: first God has a not willing him glory, and not first a willing-not (according to the final position in Ord. I, d. 41, n. 45); and he can then secondly reflect on this negation of act and will it – and so willing (or willingly) he does not choose Judas going to sin finally and a willing-not of glory, but a non-willing of glory.”

— John Duns Scotus, Ordinatio, tr. Peter Simpson (2013 / 2023), bk. 1, dist. 26-48, 47. Whether divine permission is some act of the divine will?, pp. 198-99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+I+reply%3A+In+us+can+be+distinguished+a+double+act+of+will%2C+namely+to+will+and+to+will-not%2C+and+each+is+a+positive+act%3B+and+if+they+be+about+the+same+object%2C+they+are+contrary+acts+%E2%80%93+which+also+are+expressed+by+different+words%2C+which+are+%E2%80%98to+love%E2%80%99+and+%E2%80%98to+hate%E2%80%99.+4.+And+both+%5Bof+these%5D+in+us+can+be+distinguished%2C+so+that+to+will+is+distinguished+into+efficacious+and+remiss%3A+so+that+%E2%80%98efficacious+willing%E2%80%99+is+called+that+whereby+to+the+will+is+not+only+the+being+of+what+is+willed+pleasing+but%2C+if+it+can+at+once+put+what+is+willed+into+being%2C+it+at+once+does%3B+so+too+%E2%80%98efficacious+willing-not%E2%80%99+is+called+that+whereby+not+only+does+he+who+wills-not+impede+something+but%2C+if+he+can%2C+he+altogether+destroys+it.+%E2%80%98Remiss+will%E2%80%99+is+that+by+which+a+willed+thing+so+pleases+that+yet+the+will+does+not+put+it+into+being%2C+although+it+can+put+it+into+being%3B+%E2%80%98remiss+willing-not%E2%80%99+is+that+whereby+the+thing+willed-not+thus+displeases+that+it+%5Bthe+will%5D+not+prevent+it+from+being%2C+although+it+could.+5.+In+us%2C+therefore%2C+weak+%5Bor+remiss%5D+willing-not+%E2%80%93+properly+speaking+%E2%80%93+seems+to+be+the+permission+of+something+bad+that+I+know%3A+for+I+am+not+said+to+permit+that+about+which+I+know+nothing%2C+or+that+which+is+so+done+by+another+that+it+pleases+me+%E2%80%93+but+that+which+I+know+is+wrongly+done+by+another+but+do+not+prevent%2C+this+I+permit.+6.+A+sign+of+efficacious+willing%2C+if+it+be+done+immediately+by+the+will%2C+is+fulfilment%3B+if+through+another%2C+it+is+precept%3B+and+of+weak+%5Bremiss%5D+willing+in+us%2C+perhaps+counsel+is+a+sign%2C+or+persuasion+or+warning.+And+a+sign+of+weak+%5Bremiss%5D+willing-not+is+permission+or+dissuasion%3B+and+a+sign+of+efficacious+willing-not+is+prohibition.+7.+But+this+distinction+could+be+posited+in+God%2C+so+that+as+one+act+of+his+is+willing+and+willing-not+%28and+this+without+contrariety+or+dissimilarity+in+the+act+in+itself%29%2C+so+over+certain+objects+of+his+willed+would+be+put+%E2%80%98efficacious+willing%E2%80%99%2C+and+similarly+his+willing-not+over+certain+objects%3A+willed-not+%E2%80%98efficacious%E2%80%99%2C+and+over+certain%2C+not+%5Befficaciously%2C+or+remissly%5D.+And+then+could+God%E2%80%99s+willing-not+be+called+weak+with+respect+to+those+objects+which+he+so+wills-not+that+he+wills-not+to+prohibit+them%3B+and+this+willing-not+of+God+can+be+called+his+permission+%E2%80%93+and+so+the+act+in+God%2C+insofar+as+it+passes+over+the+object%2C+thus+disposes+itself+to+the+divine+will.+8.+But+if+this+%5Bn.+7%5D+does+not+please+%28to+the+extent+the+willing-not+of+anything+posited+in+being+would+seem+to+be+with+some+sadness+and+with+some+imperfection+of+the+volition+and+will%29%2C+then+it+can+be+said+that+permission+outwardly%2C+or+the+sign%2C+is+that+an+effect+be%2C+which+%5Bsign%5D+however+is+against+the+divine+precept+%E2%80%93+and+this+is+the+permission+that+is+a+sign+of+the+divine+will%3B+but+to+this+does+not+correspond+anything+in+the+divine+will+save+the+not-willing+to+prohibit+something+being+done%2C+or+the+not+willing-not%2C+which+is+a+negation+of+a+divine+positive+act+and+consequently+is+not+a+positive+%5Bact%5D.+9.+And+that+he+is+called+%E2%80%98willing+to+allow%E2%80%99%2C+this+can+be+meant%2C+not+that+he+has+a+direct+willing+about+what+he+permits%2C+but+a+reflex+act%3B+for+he+offers+to+his+will+that+this+man+will+sin+or+is+sinning%2C+and+first+his+will+does+not+have+a+%E2%80%98to+will%E2%80%99+about+this+man+%28for+he+cannot+will+him+to+have+sin%29%3B+secondly+he+can+understand+his+will+not+to+be+willing+this%2C+and+then+he+can+will+his+will+%E2%80%98not+to+will+this%E2%80%99%2C+%E2%80%93+and+so+he+is+called+willing+to+allow+and+to+allow+willingly%3B+willing+to+permit+and+to+permit+willingly.+Just+as+on+the+other+side%2C+with+Judas+presented+to+him%3A+first+God+has+a+not+willing+him+glory%2C+and+not+first+a+willing-not+%28according+to+the+final+position+in+Ord.+I%2C+d.+41%2C+n.+45%29%3B+and+he+can+then+secondly+reflect+on+this+negation+of+act+and+will+it+%E2%80%93+and+so+willing+%28or+willingly%29+he+does+not+choose+Judas+going+to+sin+finally+and+a+willing-not+of+glory%2C+but+a+non-willing+of+glory.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+Ordinatio%2C+tr.+Peter+Simpson+%282013+%2F+2023%29%2C+bk.+1%2C+dist.+26-48%2C+47.+Whether+divine+permission+is+some+act+of+the+divine+will%3F%2C+pp.+198-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F917c1a7623.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/917c1a7623.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/how-did-the-first-human-sin-happen/#:~:text=3.%20I%20reply%3A%20In%20us%20can,glory%2C%20but%20a%20non%2Dwilling%20of%20glory&amp;text=3.%20I%20reply%3A%20In%20us%20can%20be%20distinguished&amp;text=willing%2Dnot%20of%20glory%2C%20but%20a%20non%2Dwilling%20of%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

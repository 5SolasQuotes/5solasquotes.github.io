<main class="wrap"><figure class="quote" id="q-1b98dd77e9" data-kw="">
<blockquote><p>Hymns of human composition are used so commonly now in public worship by Presbyterian churches that it is difficult to believe that the practice is not a hundred years old, and that in some of the churches it is of very recent date. On the supposition that it is good and dutiful and wise to sing such hymns in worship, it is equally difficult to account for the neglect of the churches at the time of the Reformation, and for generations afterwards. What could have so blinded the reformers as to make them reject hymns and sing the Psalms alone? How could the Westminster Divines, in framing their Confession of Faith and Directory for Worship, have been so unanimous in the blunder that the service of praise is to consist of the “Singing of Psalms?” And apart from the aspect of duty, how could the Presbyterian churches, for about a hundred and fifty or two hundred years after the Westminster Assembly, have been so insensible to the power of hymns as an attractive addition to their public services? We cannot by any means understand how it was that, if it was dutiful to use hymns in worship, the reformers did not discover the Scriptural warrant for the duty, especially as hymns had been used for centuries by the Church of Rome. Nor can we understand how they rejected the hymns and used the Psalms alone, unless on the supposition that they believed the use of hymns to be part of the will-worship of Rome.

If they were wrong on this point, then Rome and our modern Presbyterian churches are right. In that case, the Puritans and Covenanters were fanatics, and Romanists were truly enlightened. And most of our Presbyterian churches of the present day were fanatical too, and did not become truly enlightened and liberal till they got hack to the Romish practice! The Free Church of Scotland, for example, which existed for nearly forty years without an authorized hymn-book must have been so far an heir to Puritanic and Covenanting fanaticism till the year of grace 1882, when it went back beyond the time of the Presbyterian Reformation to find a nobler inheritance in the Romish practice of singing uninspired hymns in worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1785612b35" data-kw="">
<blockquote><p>As for the argument that the New Testament contains numerous fragments of hymns, it is significant that there is not a tittle of evidence to show that most of the alleged fragments are quotations, or that they were ever sung or intended to be sung, or that they are uninspired hymns, or that they are hymns or poetry at all!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-f72725eb53" data-kw="">
<blockquote><p>First of all, then, on behalf of human hymns, it has been said, “We live now under a better and brighter dispensation than that of the Old Testament, therefore the inspired Psalms of David, and other Psalms in Holy Scripture, are insufficient.”

But the question is not whether the dispensation under which we now live is better and brighter than that which preceded it; but whether, under this better and brighter dispensation, there is any security for better and brighter hymns than the Psalms of David, and whether there is a promise given to any man, or any body of men, of a richer unction of the Spirit – and not a richer unction only, but a specifically inspiring action of the Spirit – for the purpose of composing hymns for the public worship of God in the Church than was given to him, of whom it is written, that in his blessed swan song he spoke as follows:– “David, the son of Jesse, said, and the man who was raised up on high, the anointed of the God of Jacob, and the sweet Psalmist of Israel, said, The Spirit of the Lord spoke by me, and His Word was in my tongue.” Is there any modern hymnologist in circumstances to say that? Dr. Adam must tell us who he is, before his argument from the greater brightness of the New Testament dispensation is of any worth, otherwise it is an argument not only on behalf of hymns, but against the Book of Psalms.

Further, we are told that “it would be strange if we were never to rise in this respect above the dispensation which had passed away.” Yes, no doubt, when the fulness of the times was come, the Church rose above the dispensation which then passed away. But the question is not whether we are to rise above the Old Testament dispensation, but whether we are, by the help of uninspired hymnologists, to rise above the Spirit and Word of God in the mouth of “David, the son of Jesse, the man who was raised up on high, the anointed of the God of Jacob, the sweet Psalmist of Israel.”

Is it modest to talk of rising above the height to which he who was “raised up on high” was raised? Still further, it has been said, “It would be strange if we were always to walk in the morning dawn, and never pass into the sunshine of the perfect day.” Sir, who can fail to admire the ingenuity which has discovered the resplendent fulness of noontide glory in uninspired songs, and nothing but twilight in the Psalms of David! Was it an uninspired modern hymnologist whose pen produced the following, or was it the Psalmist of Israel?

“Because of life the fountain pure Remains alone with thee, And in that purest light of thine We clearly light shall see.”

If the Psalms are but twilight, and human hymns the sunshine of the perfect day, then walk always in the perfect light … Sing nothing but human hymns, for that is perfect sunshine; and sing no Psalms of David, for that is going back to twilight. Excuse me, however, if I think that this argument of our friends is moonshine, and the logic of it is the logic of the twilight, and suited for those only who are of weaker vision. I say the Psalms are the full noonday light of Messianic glory, and the hymns are but the twilight – likely, if you trust to them, or put them on a level with the Word of God, to prove an evening and not a morning twilight, and you know the fatal difference there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine</cite></span></figcaption>

<blockquote><p>Should we hesitate to embrace a faithful witness for the cause of truth, and one, too, suffering in that cause? Surely not. It is not the cause of a party. The question between us and our antagonists is, in my opinion, come to this—Is the Testament of our Lord and Saviour Jesus Christ one Testament? Is it given by the inspiration of God, or not? Did holy men of God speak as moved by their own passions and local prejudices, or as moved by the Holy Ghost? If the book of Psalms be such as many represent it, and if it must be set aside from the peculiar use for which the Lord and Saviour Jesus Christ intended it, I see not but it is a thrust at the whole Bible, and implicitly dishonours and subverts the whole.

I believe the men have no such intention, they mean not so. But they appear to me to be under the influence of most dreadful and dangerous temptations; and to yield to them would be the greatest evil we could do to them, the greatest cruelty and injustice to themselves and their posterity, as well as unfaithfulness to the Lord. This has been long my opinion, and I yet see no cause to alter it. The cunning adversary of the church is never at rest. By various artifices and deceptions he endeavours to subvert the faith of Christians, and weaken their attachment to the Word of God. I cannot help ranking the present opposition to the pure scriptural Psalmody in the same class with Deism, Socinianism, Arianism, Arminianism, Universal Salvation, Antinomianism, and that it is a trial of the faith and patience of the saints. May the Lord enable us to stand fast, and to keep clean garments.

Conscious of much unworthiness, and that I am less than the least of all saints, yet I should shudder to chime in with the prevailing defamation, not to say blaspheming of that part of the Word of God, the book of Psalms, which indeed falls equally, though indirectly, on the whole of the Old Testament, and from that rebounds with equal force on the New Testament; for without faith in the one, I cannot see how there can be a true and saving faith in the other. The saying of the apostle respecting the law, is equally applicable here — “He that offends in one point, is guilty of all.” Whoever lifted up a tool on God’s altar, was guilty of polluting it. But what impure tools have proud, carnal, daring mortals, lifted against the Bible, with the pretext, as they say, of smoothing and polishing the rough stones thereof! But they have by their foolish and sinful attempts diminished its majesty, sublimity, grandeur, and dignity, and made ‘it like the works of men, and not of God. If those men could with equal ease form our globe into a smooth surfaced ball, no doubt they would try their hands on it, and imagine they had greatly improved it. But it is not as easy to spoil God’s works, as it is to reproach and blaspheme his Word.

I pretend not to be wiser than others, much less to infallibility; but I must judge for myself, and I see no great danger of being too strongly attached to the Word of God, or any part of it, not even to what they call the old, obsolete Jewish Psalms. The danger is all on the other side. Often, too often, my carnal heart has started objections against the book of God; and had not the Lord made me frequently taste the goodness and sweetness of it, I might have been a Deist. And what good fruits have proceeded from those men’s innovations and polishings?

Now, who were the first offended with the scriptural Psalmody, and most forward to introduce the new? To my certain knowledge, in New York, (where it first began in the Presbyterian churches,) they were the carnal and worldly part of professors, who could find no spiritual delight in any part of Divine worship. And have their attempts been blessed? Have conversions been promoted? Have saints been more edified, united, and sanctified, by their improvements? Is the worship of God more spiritual, heavenly, and holy? Let the fruits declare it.</p></blockquote>

<blockquote><p>But it can be proved by perfectly sufficient evidence that the terms “hymns” and “songs” are actually different names for the inspired Psalms, and must have been perfectly familiar as such to the Ephesians and Colossians. The terms “psalms, and hymns, and songs” are all employed as titles to different psalms in the inspired collection in the Septuagint translation of the Old Testament into the Greek language. Moreover, in Colossians iii. 16, the command to sing psalms and hymns and song is prefaced by the expression, “Let the word of Christ dwell in you richly;” and then there follow the participial clauses, “speaking to one another, and singing with grace,” as explanatory of the command about the word of Christ, and showing, we think, unmistakably that the psalms, hymns, and songs are all “the word of Christ,” or portions of his inspired psalmody. Besides, the word “spiritual” following all three terms, as it does in the Greek, may more rationally be regarded as qualifying all three than only the last one, and may without violence he translated “inspired.” The command would then be to sing the psalms, hymns, and songs given by the Spirit of God for that purpose.</p></blockquote>

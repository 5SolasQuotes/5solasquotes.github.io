<main class="wrap"><figure class="quote" id="q-3f1e671f45" data-kw="">
<blockquote><p>Insofar as the matter of an oath is lawful or unlawful, pleasing or displeasing to God, it may and ought to be kept or broken. When Herod beheaded John the Baptist for keeping of his oath, he added sin to sin. But David did well in sparing Nabal and his family, whom he had sworn to destroy: and he blessed God, for the good counsel of Abigail, whereby he was diverted from performing that oath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable Warning to the subjects in Scotland given in the year of God 1638 (Aberdeen: Raban, 1638), ch. 4</cite>, pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-72e8445630" data-kw="keep faith lawful oaths">
<blockquote><p>First, to keep faith is an act of truth, justice and fidelity. He that keeps faith does what he says, the characteristic of truth. He does what he has promised and to which he is bound, the characteristic of fidelity. He restores to another what is his due according to the promise, the characteristic of justice. Second, it is lawful to swear faith to infidels, therefore also to keep faith with them as appears from the examples of Abraham making a covenant with Abimelech (Gen. 21:23, 24), of Isaac (Gen. 26:26), of Jacob (Gen. 31:53), of the spies with Rahab (Jos. 6:22), of the Israelites with the Gibeonites (Jos. 9:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.9–10</span></figcaption>

</figure><figure class="quote" id="q-3aac0fad19" data-kw="">
<blockquote><p>Now if any pretense to liberty in mine own behalf or others does become an occasion of discontentedness, of strife, of murmurings and of sullenness of spirit, whereby I am discomposed so that I cannot serve all men freely in the duties of my calling, then I am a transgressor of the apostle’s rule, and walk not according to the law of liberty in the kingdom of Jesus Christ: because I suffer my conscience to be under the power of some other relations to liberty which I have not made subordinate unto the relations of Christianity, which nevertheless cannot be prejudged by any oaths of an inferior concernment, according to the rule, Quod in juramento semper jus superioris intelligitur exceptum [That in an oath the right of something superior is always excepted], and in our National [Solemn League &amp;] Covenant, the obligation towards the maintaining of the liberties of the kingdom is expressed to be only in order to our calling and place. Now if we do not reckon our spiritual calling as Christians, and our place in the ministry to be the rule according to which that Engagement and the endeavors which we owe to our civil freedoms are to be managed, I know not what it is in our sphere of the ministry that can be meant by the restriction of that performance to our calling and place. I say then, that by the express words of the Covenant, I am obliged not to make my plea for civil liberties (if infringed) such as may prejudge my Christian or ministerial liberties; as if it should be lawful for me to forgoe these for want [lack] of satisfaction in those, or think it unlawful for me to make use of these when I conceive my self deprived of those.</p></blockquote>

</figure><figure class="quote" id="q-c7997c10a9" data-kw="">
<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into by all the members of the visible Church of one nation or kingdom: when the Church in that kingdom or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not accrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn Covenant in the presence of God. 4. …it is lawful also expressely, publicly and solemnly to vow to God those things which are in the precepts of God enjoined to all believers: But that necessity of making this public, solemn and express covenant, in the presence of the whole Church, requiring it as a thing of absolute necessity to the essential constitution of a particular church, we do not acknowledge: But that union above mentioned, we conceive sufficient by the Word of God for the joining men professing the faith into one particular church. So that, by the Word of God, to the essence and entireness of a particular Church, this union is sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/apollonius.html">Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God (London, 1645), ch. 2, ‘Of a church-covenant’</cite>, pp. 15-16</span></figcaption>

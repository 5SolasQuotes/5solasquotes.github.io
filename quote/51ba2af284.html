<main class="wrap"><figure class="quote" id="q-51ba2af284" data-kw="">
<blockquote><p>Surely that which is most sweet to the soul of God should be most sweet to our souls: You would wonder to hear a man say that he takes as much delight and he can recreate himself as much in reading, in praying, in hearing sermons, in holy conference as you can do in all your good cheer, in playing and drinking of wine in bowls: You think that men are made to say that they have as much pleasure in those things, as playing at cards, and merriment, and music, and good cheer: you call upon them to play at cards with you, or be merry, you say to them, why should you be dumpish and never be merry? They tell you again that they can be as merry and as cheerful in hearing the Word, and praying, and reading, as you in all your playing, and all that you account delightful. You say to them that they have no recreation. They tell you that those things that are your burdens, are their recreation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, ... (London: Cole, 1650), pp. 164-65. The context of this does not regard the Sabbath specifically. Burroughs was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-4bc153b4ac" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>

v>
</figure><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>

</figure><figure class="quote" id="q-8ecc087c02" data-kw="">
<blockquote><p>…whatsoever recreations and exercises of body and mind are necessar[il]y required for the bettering of our sanctification of the Lord’s day and the enabling of us to perform with more cheerfulness, strength and courage the holy worship of God, and the work and service of his holy Sabbath, and which are also intended by us only to that end and use, them we may use, and so far as they serve to further and in no wise to hinder God’s holy worship and the immediate works and duties thereof. This is manifest by God’s allowing to his people in the Law dressing of meat and cheerful feasting on his Sabbath and holy days: which are needfull to cheer up men, and to provoke them to worship Him with all thankfulness of heart, also to put on our best apparel that we may come decently to God’s house. As these are lawful, being directed to holy use, so undoubtedly honest refreshing with recreations which cheer up the heart and refresh the spirits are lawful when they are helpful to holy exercises and are directed to that end, as stirring of the body, walking into gardens or fields to take fresh air, being found very helpful to preachers to revive their spirits, strengthen their loins, clear their voices, sharpen and quicken their wits and memories; and being done only to that end are lawful. So also walking into the corn fields in summer or harvest, or into meadows or pastures in the spring, both to refresh our bodies and spirits, and to give us occasion to admire God’s bounty in clothing the bodies, and his Fatherly providence in making the earth so fruitful, and to laud and praise Him, is lawful for us. And if after public and private exercise we do so walk about, diverse together, conferring of heavenly things and taking occasion by sight of earthly blessings to provoke one another to thankfulness and acknowledgment of God’s love, this no doubt is a recreation fit for the Lord’s day, and helps much our devotion; and this seems to have been practiced by our Savior, who went through the corn fields on the Sabbath day, Mt. 12:1, and his disciples with them.</p></blockquote>

d+taking+occasion+by+sight+of+earthly+blessings+to+provoke+one+another+to+thankfulness+and+acknowledgment+of+God%E2%80%99s+love%2C+this+no+doubt+is+a+recreation+fit+for+the+Lord%E2%80%99s+day%2C+and+helps+much+our+devotion%3B+and+this+seems+to+have+been+practiced+by+our+Savior%2C+who+went+through+the+corn+fields+on+the+Sabbath+day%2C+Mt.+12%3A1%2C+and+his+disciples+with+them.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+Doctrine+of+the+Sabbath%E2%80%A6+%281638%29%2C+ch.+21+Westminster+divine%2C+pp.+158-59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ecc087c02.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ecc087c02.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=whatsoever%20recreations%20and%20exercises%20of%20body,12%3A1%2C%20and%20his%20disciples%20with%20them&amp;text=whatsoever%20recreations%20and%20exercises%20of%20body%20and%20mind&amp;text=day%2C%20Mt.%2012%3A1%2C%20and%20his%20disciples%20with%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

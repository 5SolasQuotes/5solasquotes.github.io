<main class="wrap"><figure class="quote" id="q-980568f110" data-kw="">
<blockquote><p>A controversy respecting the atonement sprang up between Duns Scotus and the followers of Aquinas, which involved fundamental principles in ethics and religion, and divided the Romish Church into two great parties of Thomists and Scotists. Duns Scotus denied the Anselmic doctrine that sin is of infinite demerit, and consequently denied that the suffering of Christ is of infinite value. The relation of the atonement of the Son of God to the sin of mankind, he maintained, is merely an arbitrary and constituted one. The principle upon which he founded his theory was: “Tantum valet omne creatum oblatum, pro quanto acceptat Deus illud, et non plus.” There is no interior fitness and adaptation between Christ’s atonement and man’s sin. God was pleased to accept this particular sacrifice as an offset and equivalent for human transgression, not from any intrinsic value in it, but because he so pleased. He might have accepted any other substitute, or he might have dispensed with accepting any substitute at all. In opposition to this view, the followers of Aquinas maintained the old Anselmic theory of the infinite demerit of sin, and the infinite and objective value of Christ’s satisfaction. In this controversy, the soteriology of the adherents of Aquinas is more in harmony with the Protestant view and feeling; so that we might reverse what Melanchthon remarks of Augustine, and say, that “the opinion of Aquinas is more pertinent, fit and convenient when he disputed than it was when not disputing.” And yet it would be difficult to see how the followers of Aquinas could in the end avoid the conclusions of Duns Scotus, if they started from that doctrine of a relative necessity of satisfying justice which we have seen Aquinas held, in common with all the Schoolmen excepting Anselm. If omnipotence and bare will are more ultimate in the Divine Nature than justice and truth are, then it is difficult to see how Scotus can be censured for holding, that in the last analysis God can dispense with an atonement altogether, and that whatever value the existing judicial provision possesses in the divine plan, it possesses not in itself, but solely by virtue of its optional acceptance by the Omnipotent One who is not limited by anything, not even by his own moral attributes. The controversy, however, ran high between the adherents of Aquinas and Scotus,—the Dominican order generally siding with the former, and the Franciscan with the latter. The Nominalists in philosophy also naturally favoured the views of Scotus, as his theory was that of a nominal and putative satisfaction, in distinction from a real and objective one. The extravagantly speculative minds of the age, those who have given the reputation of hair-splitting and excessive dialectics to Scholasticism, also adopted the positions of Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Theology</cite>, (New York: Scribners) 2.315</span></figcaption>

<blockquote><p>A further point to make about cause and effect is that whatever is in some effect must in some way or other be in the cause, even if not always in the same way. For a cause cannot give what it does not have to give. This is sometimes called the principle of proportionate causality. Suppose, for example, that I give you $20. The effect in this case is your having the $20, and I am the cause of this effect. But the only way I can cause that effect is if I have the $20 to give you in the first place. Now there are several ways in which I might have it. I might have a $20 bill in my wallet, or two $10 bills, or four $5 bills. Or I may have no money in my wallet, but do have $20 in my bank account and write you a check. Or I may not even have that, but I am able to borrow the $20 from someone else, or work for it, so that I can go on to give it to you. Or perhaps I have a friend who has a key to the U.S. Treasury printing press and I get him to run off an official $20 bill for me to give to you. Or to take an even more farfetched scenario, suppose that in order to guarantee that you get that $20 I somehow convince Congress to pass a law which permits me personally to manufacture my own $20 bills. These are all various ways in which I might in theory give you $20. But if none of these ways are available to me, then I can’t do it. Again, these are different ways in which the cause may have what is in the effect. When I myself have a $20 bill ready to hand and I cause you to have it, what is in the effect was in the cause formally, to use some traditional jargon. That is to say, I myself was an instance of the form or pattern of having a $20 bill, and I caused you to become another instance of that form or pattern. When I don’t have the $20 bill ready to hand but I do have at least $20 credit in my bank account, you might say that what was in the effect was in that case in the cause virtually. For though I didn’t actually have the $20 on hand, I did have the power to get hold of it. And when I get Congress to grant me the power to manufacture $20 bills, you might say (once again to use some traditional jargon) that I had the $20 eminently. Because in that case, I not only have the power to acquire already existing $20 bills, but the more “eminent” power of causing them to exist in the first place. When it is said, then, that what is in an effect must in some way be in its cause, what is meant is that it must be in the cause at least “virtually” or “eminently” even if not “formally”. … These things [namely all things] thereby exist in that purely actual cause eminently and virtually even if not formally. For the cause of things is not itself a cat or a tree (and cannot be, given that it is immaterial), but it can cause a cat or a tree, or anything else that might exist.</p></blockquote>

<blockquote><p>Being is what is called in A[ristotelian]-T[homistic] metaphysics a transcendental, something above every genus, common to all beings and thus not restricted to any category or individual. The other transcendentals are thing, one, something, true, and good, and each is ‘convertible’ with being in the sense that each designates one and the same thing—namely being—under a different aspect. (To put the point in terms made familiar by Frege, the transcendentals differ in sense but not in reference, referring to the same thing under different names just as ‘Superman’ and ‘Clark Kent’ do.)</p></blockquote>

<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectarum Disputationum Theologicarum Pars Prima</cite>, (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</span></figcaption>

<blockquote><p>In the order of eminence he [Scotus] shows that 1) some eminent nature is simply first in perfection; 2) a supreme nature is uncausable; 3) a supreme nature actually exists. Next Scotus shows that this triple primacy, namely of efficiency, finality, and eminence, belongs to the same quiddity or nature. Having proved these relative properties of the first being, he proceeds further to prove the infinity of the first being. Having proved infinity, he demonstrates that God is unique in nature, using six (or seven) arguments…</p></blockquote>

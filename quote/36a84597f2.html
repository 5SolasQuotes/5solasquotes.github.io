<main class="wrap"><figure class="quote" id="q-36a84597f2" data-kw="">
<blockquote><p>5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member [in some way] of the visible Church and converted to God, who is excommunicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6670386a33" data-kw="">
<blockquote><p>Our divines from Scripture make three degrees of excommunication: 1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication. 2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially. 3. Maranatha in the Syriac, is an utter cursing till Christ’s Second Coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, Ch. 9, section 9, p. 283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-cd9083cc8d" data-kw="">
<blockquote><p>Auxilius, a fresh young Bishop, having excommunicated a person of good account with his whole family for infringing the liberties of his Church, as he supposed, saint Augustine treats with him by letters to know what ground he had out of the Scriptures to excommunicate the son for the father’s, the wife for the husband’s, the servants for their master’s offense; and amongst others uses these words (Augustine Epistle 75): ‘Lo, I am ready to learn, an old man of a young, a bishop of so long continuance, from my colleague, not yet a year’s standing: what good reason we may yield to God or to men, if for another man’s sin we endanger innocent souls with a spiritual punishment. If you can give a reason for it, vouchsafe by writing to acquaint me with it, that I may be able likewise; if you cannot, what is it for you to do (such a thing) upon an unadvised motion of the mind, whereof being asked, you are not able to yield a just reason? Neither think that uniust anger cannot overtake us, because we are bishops; but let us rather remember we live dangerously amidst the snares of temptations, because we are men.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bilson.html">Thomas Bilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetual Government of Christ’s Church</cite>, (London, 1593), ch. 9, p. 121</span></figcaption>

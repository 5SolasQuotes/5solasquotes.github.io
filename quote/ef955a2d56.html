<main class="wrap"><figure class="quote" id="q-ef955a2d56" data-kw="">
<blockquote><p>The only admissible figure of the humanity of Christ, however, is bread and wine in the holy Supper. This and no other form, this and no other type, has He chosen to represent his incarnation.</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preference of Duties: Morals Before Rituals’ on Mt. 9:13 in Works</cite>, vol. 2, Several Discourses Tending to Promote Peace and Holiness, pp. 6-22, p. 2</span></figcaption>

<blockquote><p>Humbly offer this: two sorts of signs: sacramental, these are from institution, sitting is not of this kind. 2. There are other sorts of signs, you may call it natural. This gesture belongs to it as it is cena [a supper], and convivium [a meal in company], though not as a sacrament. We can hardly part from it, nay, I may add, we may not posibly part from it.</p></blockquote>

<blockquote><p>In administering the Supper I have sometimes made use of the words of Paul; but since they could not be repeated for each individual without causing too long a delay (and if, during the reading, several persons went forward, scarcely one in ten could apprehend what I intended, and no one perceived the sentence as a whole), I preferred to desist.</p></blockquote>

</figure><figure class="quote" id="q-8eb3be1fc7" data-kw="">
<blockquote><p>This sacrament, therefore, consists in the rite and the promise annexed to it, or in the signs and the things signified. The rite, or signs are the bread which is broken and eaten, and the wine which is poured out, and drunk. The things signified are the broken body, and shed blood of Christ, which are eaten and drunk, or our union with Christ by faith, by which we are made partakers of Christ and all his benefits, so that we derive from him everlasting life, as the branches draw their life from the vine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, (P&amp;R), pp. 378 &amp; 385</span></figcaption>

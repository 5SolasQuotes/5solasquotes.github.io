<main class="wrap"><figure class="quote" id="q-c50c2aea6e" data-kw="">
<blockquote><p>This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Saviour commanded to obey Csesar, and to pay tribute unto him…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ee9865af2" data-kw="">
<blockquote><p>With that in mind, I contend that the best commonwealth is the one that has as its chief end, the common or public good, especially in relation to spiritual matters, the glorifying and enjoying of God forever. If this is the chief end of man, it ought to be the chief end of every institution in the world, whether government, school, family, or religious assembly… If the chief end of government is the public good, as the [Westminster] Confession says and the American founders said, especially the spiritual welfare of its subjects, then he [the magistrate] must both decide what is true religion for himself and promote it. The most obvious means is the enforcement of God’s moral law, classically understood as both tables of the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Almost Christian Nationalist” (2025) at American Reformer</cite></span></figcaption>

</figure><figure class="quote" id="q-c1a9a1236c" data-kw="">
<blockquote><p>Man’s natural liberty is this: privilege of having and doing those things only to which the individual has a moral right. Consequently, the natural liberty of two men in the same commonwealth may be different, because under Providence, their natural endowments and relations may differ. Were it possible to frame a government thoroughly equitable, each person’s civic liberty would be identical with his natural: the privilege of having and doing all those things, and those only, to which each has a moral right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Philosophy (Mexico, MO, 1897)</cite>, p. 383</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-81609f3c8d" data-kw="">
<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 84-85, 112-13, 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-193f78de04" data-kw="">
<blockquote><p>They spoil kings and parliaments of their legislative power. But their great tenet about the magistracy is this, that no prince nor state on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either church or state; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the Laws of God set down in Scripture; that the judicial Law of Moses binds at this day all the nations of the world as well as ever it did the Jews: They tell us that whatever God in Scripture has left free, it may not be bound by any human law, whether civil or ecclesiastic; and what God has bound by any law in Scripture, they will not have it loosed by the hand of any man.</p></blockquote>

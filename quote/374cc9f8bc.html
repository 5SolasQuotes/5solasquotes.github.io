<blockquote><p>The direct worship of God is that which is offered directly to God and which is taught in the first table.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9f8a76d35" data-kw="">
<blockquote><p>7th Problem. Whether therefore out of the natural law, as contradistinguished from supernatural, the rule and way of worshipping God is able to be deduced or subsumed under it? Response: I deny. Indeed, in general and indefinitely in what way God is to be worshipped, and negatively, in what way He is not to be worshipped, in many things it is able to be shown from there; but the natural worship of God, positively and in the species, now as modified after the Fall, is not able to be explicitly and definitively subsumed under it or deduced from it, much less instituted worship. This is to be expected, therefore, from supernatural revelation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (Utrecht, 1648 ff.), | vol. 1, 21. ‘Appendices to… on the Authority &amp; Righteousness of God, pt. 2’, p. 398, 7th Problem</span></figcaption>

</figure><figure class="quote" id="q-4179e7598d" data-kw="">
<blockquote><p>The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or signification. … Ceremonies are external rites and sacred accidents of the worship of God. They are not of themselves the worship of God, but concomitant adjuncts and assistants by signification, exercise, exercise, work and decorum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R, 1994), vol. 2, 11th Topic, ‘On the Law of God’, Question 24, ‘What was the end and use of the ceremonial law under the Old Testament?’, section 4 &amp; 6, pp. 146-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-447a4bfa17" data-kw="">
<blockquote><p>Too high an estimation of any peculiar way of worship is apt to entice the minds of some into a hurtful confidence in these things. Having an apprehension that they alone have attained unto the right way of gospel worship and the administration of its ordinances, and that, perhaps, on such accounts as wherein they are eminently deceived, they begin first greatly to value themselves, and then to despise all others, and, if they can, to persecute them. This insensibly works them into a trust in that which they esteem so excellent, and that unto an open neglect of things of a greater weight and moment. Thus is it not unusual to see persons who are under the power of some singular opinion and practice in religion to make one thing almost their whole business, the measure of other things and persons, the rule of communion and of all sincere love;—to value and esteem themselves and others according unto their embracing or not embracing of that opinion… Wherefore, although we ought greatly to prize and to endeavour after the true order of the church of Christ, the purity of worship, and regular administration of ordinances, yet let us take heed that we prize not ourselves too much on what we have attained; for if we do so, we shall be very apt to countenance ourselves in other neglects thereby, which will certainly bring us into a spiritual sickness and declension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, (NY: Robert Carter, 1852), vol. 7, Nature &amp; Causes of Apostasy from the Gospel, ch. 12, pp. 252-53</span></figcaption>

17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=Too%20high%20an%20estimation%20of%20any,into%20a%20spiritual%20sickness%20and%20declension&amp;text=Too%20high%20an%20estimation%20of%20any%20peculiar%20way&amp;text=bring%20us%20into%20a%20spiritual%20sickness%20and%20declension" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2e9436ec60" data-kw="">
<blockquote><p>By the worship of God inquired after [in this treatise], not that which is natural or moral, which is required in the First Commandment is intended. Such is our faith and confidence in Him, our fear of Him, our subjection of soul and conscience unto Him as the great Soveraign Lord, first cause, last end, Judge and Rewarder of all men; the Law whereof was originally written in the heart of man, and has been variously improved and directed by new revelations and institutions. And this worship is called natural upon a double account. First, because it depends on the nature of God, a due perception and understanding whereof makes all this worship indispensibly necessary: for none can know God but it is his duty to glorify Him as God, that is, to believe in Him, love Him, trust Him, and call upon Him, which all are therefore cursed that do not, Ps. 79:6; 2 Thess. 1:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 1, pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

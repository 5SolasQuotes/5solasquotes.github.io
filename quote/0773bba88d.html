<main class="wrap"><figure class="quote" id="q-0773bba88d" data-kw="">
<blockquote><p>But He does not defect prior in nature in the evil act, because deficiency is not a concurrence but rather a defect thereof, arising from the non-operation of the will.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41d7db1dae" data-kw="Author of sin">
<blockquote><p>God does not infuse malice into the wills of evil men, as He infuses goodness into the hearts of the godly.—In one and the same work of the godly what is a good and just action proper to God is to be distinguished from the defect and vice of the ungodly. The sin of the wicked is their own; their doing this or that by sinning is of God’s power,—and so in the same work God is ascertained to be righteous, man to be guilty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion</cite>, 19.11 (as quoted in Heinrich Heppe, Reformed Dogmatics)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-does-not-put-evil-into-mens-hearts.html">God does not put evil into men&#x27;s hearts</a></span><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span></div>

</figure><figure class="quote" id="q-203bb6b5d2" data-kw="Author of sin">
<blockquote><p>Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.5.16</span></figcaption>

</figure><figure class="quote" id="q-aee029b880" data-kw="Author of sin Free Will">
<blockquote><p>He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.</p></blockquote>

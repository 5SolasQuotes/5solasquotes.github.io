<blockquote><p>III. Problem: Whether man’s intellect and will concur to regeneration? Response: Negatively, if you understand active concourse as of a cause, so that synergy is attributed to them; but if you understand concourse as of a subject, it is granted: for it conducts itself purely passively in the first moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-03be889c9b" data-kw="">
<blockquote><p>He says not: ‘ye are the children of God because ye are circumcised, because ye have heard the law and have done the works thereof’ (as the Jews do imagine, and the false apostles teach): but ‘by faith in Jesus Christ’ [Gal. 3:26]. The law then makes us not the children of God, and much less men’s traditions. It cannot beget us into a new nature or a new birth: but it sets before us that old birth whereby we were born to the kingdom of the Devil: And so it prepares us to a new birth which is by faith in Jesus Christ and not by the law, as Paul plainly witnesses: ‘For ye are all the children of God by faith, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary</cite>, … upon… Galatians… (London: Vautroullier, 1575), on Gal., 3:26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-151fbd74c5" data-kw="">
<blockquote><p>XXIV. In this [third state] it is asked: Whether in man’s first conversion to God our will cooperates actively with divine grace by its natural and inherent faculty, or whether in first conversion it behaves passively such that at the first moment of conversion it does not contribute at all, but allows the power of willing well to be infused into itself. The Papists assert the former; we, with Scripture, the latter. XXV. Eze. 11:19: ‘I will take away the heart of stone and give a heart of flesh.’ 1 Cor. 12:3: ‘No one can say Jesus is Lord except through the Holy Spirit.’ Ps. ‘Create in me a clean heart, O Lord, and renew a right spirit within me.’ Jn. 6:44: ‘No one can come to me unless the Father who sent me draws him.’ Phil. 2:13: ‘God is the one who works both to will and to accomplish.’ And these things concern that third [state]; the fourth follows. XXVI. In which those renewed and made children of God, moved by the Holy Spirit, act, namely freely cooperating with divine grace: for since the new man is gradually restored, that is, that image of God lost in Adam is gradually brought back, there is no doubt that they then freely will and meditate on actions conforming to divine Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on Free Will’</cite>, (Leiden: Patius, 1603), trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-5103ae4678" data-kw="">
<blockquote><p>The Root of David He is called, according to Isa. 53:2, whereas He is said to be a branch out of the root, Isa. 11:1, because although He be but a branch according to the flesh for so much as he came of David, yet He is a root according to his divinity (Rupertus; Pannonius), whereupon David and all the godly are born by faith partaking of his grace, as of sap coming from Him, and consequently of salvation by Him.</p></blockquote>

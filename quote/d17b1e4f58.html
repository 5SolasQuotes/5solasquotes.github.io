<main class="wrap"><figure class="quote" id="q-d17b1e4f58" data-kw="">
<blockquote><p>The law of the Lord our God that was handed down to His people through Moses is partly ethical, partly sacrificial, and partly political. The ethical portion shows in what way each person must be disposed both toward God most of all, then toward his neighbor. And so, as it stands in judgment upon us for condemnation in our own persons because of the accompanying threatenings joined to it that are against those who have transgressed the law even at the smallest point, so in Christ, who has been made our righteousness by most abundantly fulfilling the law for us at the same time as He also satisfied the penalties we owed, the law is so far from harming us that, on the contrary, in Christ, who is laid hold of by faith, we are absolved from its condemnation, we gain the crown which the law promises to those who keep it, and the itself shows to us who are sanctified by the Spirit of the gospel the path of the good and straight road.

The sacrificial law consists in that internal worship which we owe to God, as a certain kind of picture offered to our external senses. In addition to this, it trained the Israelites in the external profession of true religion and demonstrated to the people of God, under the tutelage He established, the true image both of the condemnation, which all men earn because of their transgression of the moral law, and of that freedom which was awaited from the Messiah to come.

The political law shows what profit the moral law is in the common society of men and arms the magistrate against its transgressors. These laws indeed occur in a scattered fashion, as they have been handed down by God in various times and places. As Moses, in addition, does not describe them with the same tenor, they seem to me not inconveniently distributed into these categories and can be, as it were, assembled into one unit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moral, Ceremonial, and Political Law of God as Derived from the Books of Moses and Distributed into Particular Classes (1577) in Theodore Beza, A Clear and Simple Treatise on the Lord’s Supper</cite></span></figcaption>

</figure><figure class="quote" id="q-d2d80dc4b4" data-kw="">
<blockquote><p>Finally, one thing merits serious consideration by all those who earnestly desire to have such schools and languages established and maintained in Germany. It is this: no effort or expense should be spared to provide good libraries or book repositories, especially in the larger cities which can well afford it.

For if the gospel and all the arts are to be preserved, they must be set down and held fast in books and writings (as was done by the prophets and apostles themselves, as I have said above).

This is essential, not only that those who are to be our spiritual and temporal leaders may have books to read and study, but also that the good books may be preserved and not lost, together with the arts and languages which we now have by the grace of God. St Paul too was concerned about this when he charged Timothy to give attention to reading [I Tim. 4:13], and bade him bring with him the parchments from Troas [II Tim. 4:13]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Councilmen of all Cities in Germany that they Establish and Maintain Christian Schools</cite>, (1524), trans. A. T. W. Steinhaeuser, rev. W. I. Brandt in Luther’s Works: The Christian in Cociety II, ed. W. I. Brandt (55 vols, Philadelphia PA: Fortress Press, 1962), 45: 373.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

raries/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

</figure><figure class="quote" id="q-952af7cefe" data-kw="">
<blockquote><p>Here is the Tongue, the grand instrument of Speech, which is a Faculty that God hath vouchsafed to Man alone, and therefore we are obliged to make use of it in celebrating the Praises of our Creator, who hath given it us on purpose to extol his Infinite Wisdom and Providence in the structure and frame of our Bodies, and particularly of this Noble Part, whereby we not only make known his Perfections, but hold Converse with our Brethren in the World. We can never sufficiently admire the Excellency and Usefulness of this divine Gift of Speaking.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Here is the Tongue, the grand instrument of Speech, which is a Faculty that God hath vouchsafed to Man alone, and therefore we are obliged to make use of it in celebrating the Praises of our Creator, who hath given it us on purpose to extol his Infinite Wisdom and Providence in the structure and frame of our Bodies, and particularly of this Noble Part, whereby we not only make known his Perfections, but hold Converse with our Brethren in the World. We can never sufficiently admire the Excellency and Usefulness of this divine Gift of Speaking.”

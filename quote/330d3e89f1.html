<main class="wrap"><figure class="quote" id="q-330d3e89f1" data-kw="">
<blockquote><p>And therefore when they that separate do plead that they agree with us in the fundamentals of Faith, they do not excuse, but aggravate their schism in violating the unity of that Church which is sound in the Faith. (St. Augustine, Contra Faustus, bk. 20, ch. 2) For ’tis not diversity of Faith, but the breach of unity that makes a schismatic.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-49d1b19504" data-kw="">
<blockquote><p>Rule Two. We must have a respect to the ordinance itself, that it be not made contemptible, that the discipline of Christ’s house be not rendered obnoxious to reproach and contempt; and as in the first reformation of religion, when men were coming out of popery and were ready to fear and spurn at discipline, and knew not the difference between the popish yoke and Christ’s yoke, in that case and in that time there was forbearance on this account. ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>

<blockquote><p>Reason 1. Because no man ought to separate himself from the true Church of Christ: Now such is an assembly professing the true faith, notwithstanding other corruption; for as holiness, if it might be supposed without true faith, cannot make a true Church, but false doctrine and error in the foundation overthrows it for being a Church: So e contra [from the contrary], corruptions in manners cannot make it no Church, when true faith is taught and maintained.</p></blockquote>

</figure><figure class="quote" id="q-411e307970" data-kw="">
<blockquote><p>Doubtless, no opinion that does not thwart the fundamentals of religion should make a separation, and destroy our love and charity; and that, because we have only probable arguments for our opinions, but we have an express command for our love; one excellent property of which, is, that it ‘Bears all things, suffers long, and is kind:’ And indeed, if we do but consider the long suffering of God towards us, how much he bears with us every day, we have all the reason in the world to make that excellent character and property ours, and as much as may be, to bear with one another, to support, and not devour the weak; to strengthen, and not confound the feeble knees; to raise up, and not to trample upon those that are down; and by this means we may do more good, than by all the violence we can use, since a gentle persuasion accompanied with kindness, will reach farther than the strongest argument urged with hatred and ill nature. Christianity should appear with all the ornaments of a meek and quiet spirit, and show a love mixed with sorrow, towards those that are strangers or enemies to it; and this will make them esteem the love that’s showed them, the persons that show it, and praise the religion that moves them to it, and sooner than anything else, persuade them to be of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons… (London: 1675), 1st Sermon, p. 14 Jekyll (1646–1698) was an Anglican conforming minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-872ff92360" data-kw="">
<blockquote><p>Yet (which we Protestants confess) all errors in doctrine do not give a man a just and sufficient cause to make a division from those that hold them. For the apostle commands us to receive him that is weak in the Faith, Rom. 14:1, and not to trouble him with disputes, and to afford him ourselves for an example in bearing gently with those who are not of our mind in everything. ‘Let us all who are perfect,’ says he, ‘be of the same mind; and if any of you think otherwise, God shall reveal even this unto him.’ Phil. 3:15. ‘Tis evident that this weaknesse in faith and this diversity in opinon whereof St. Paul speaks are errors, but such as he would have us bear with. Yet since he elsewhere pronounceth anathema against those that preach any other Gospel than that which he preached, we must of necessity conclude that there are two sorts of errors in religion: The one such, as a man may bear with without dividing from them who hold them; and the other such, for which he is bound to avoid their communion: and this difference depends upon the nature of errors themselves. For as the truths which we are to believe are not all of equal importance, some being esteemed fundamental and so absolutely requisite, that a man cannot come to the kingdom of Heaven if he be ignorant of them; others being profitable, yet not so necessary but that a man may without the knowledge of them serve God and enjoy salvation, so it is with errors: Some are pernicious and no way consistent with a true piety; others are less hurtful and do not necessarily draw in men to perdition. St. Paul does clearly enough discover to us this distinction, 1 Cor. 3:13, 15, where, after he had said that ‘none could lay any other foundation but that which he had laid,’ to wit, Jesus Christ, he adds that ‘they who builded upon this foundation wood, hay, stubble, should have loss in their work when it comes to be tried; nevertheless they should be saved, yet so as by fire;’ that is to say, with difficulty, their person only, or that wherein their chief good consisted, escaping a burning, an evident sign that there be errors which do not deprive the authors thereof of salvation, much less exclude such from happiness as believe them after them, and take them up (when they are dead or gone) merely upon their trust and credit. And to conclude, who does not see plainly that there be errors which utterly overthrow the foundations of Christianity, engaging us unavoidably in such things as are inconsistent with salvation? and that there be others which do not so? As for example: If one should think that he were bound to worship the sun (for seeing the sun is a creature, and those who worship creatures have no portion in the kingdom of Heaven), ’tis evident that he who has such an opinion cannot attain eternal happiness. And ’tis so with all other errors which overthrow any of the first, necessary, and fundamental articles of Christian religion. But the errour of those who believed of old that the Church shall continue a thousand years (or some long time) with Jesus Christ upon earth after the resurrection, is no way repugnant to piety towards God or charity towards our neighbor, nor does it directly overthrow any of the foundations of the Gospel, though it be in my opinion contrary to diverse passages of St. Paul and scarce consonant to the nature of Christ’s Kingdom. A man would scarce believe how necessary it is to mark this difference among the errors of men in matters of religion for preventing that vain scrupulosity and importunate pensiveness which many melancholy spirits are troubled with, who condemn all errors alike, and thunder out one and the same anathema against whatever differs (though never so little) from their apprehensions: yet for keeping them from falling on the other side, into the indifferency of profane persons who conform to any thing and swallow a camel as well as a gnat. Indeed the true pious person will endeavor to keep himself from all error; and will purge his neighbor too, as well as himself, so far as he is able. For any deviation from truth, though it may be a light and small error, yet ’tis an error (that is to say an ignorance, and contradiction to the truth) and by consequence an evil. But a man must be very diligent and circumspect in observing this distinction among errors and acknowledge that one is much more dangerous than another, and he should more or less abhor them all, according as he shall judge them to be more or less dangerous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 7, ‘That there are two sorts of errors, the one overthrowing the foundation of faith and obliging men to separate, and the other not. That the opinions of the Church of Rome which we reject are of the first sort and those of the Lutherans of the second’ in An Apology for the Reformed Churches, wherein is showed the necessity of their Separation from the Church of Rome: against those who accuse them of making a Schism in Christendom (Cambridge: 1653), pp. 18-26</cite>, pp. 19-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

y fire;’ that is to say, with difficulty, their person only, or that wherein their chief good consisted, escaping a burning, an evident sign that there be errors which do not deprive the authors thereof of salvation, much less exclude such from happiness as believe them after them, and take them up (when they are dead or gone) merely upon their trust and credit. And to conclude, who does not see plainly that there be errors which utterly overthrow the foundations of Christianity, engaging us unavoidably in such things as are inconsistent with salvation? and that there be others which do not so? As for example: If one should think that he were bound to worship the sun (for seeing the sun is a creature, and those who worship creatures have no portion in the kingdom of Heaven), ’tis evident that he who has such an opinion cannot attain eternal happiness. And ’tis so with all other errors which overthrow any of the first, necessary, and fundamental articles of Christian religion. But the errour of those who believed of old that the Church shall continue a thousand years (or some long time) with Jesus Christ upon earth after the resurrection, is no way repugnant to piety towards God or charity towards our neighbor, nor does it directly overthrow any of the foundations of the Gospel, though it be in my opinion contrary to diverse passages of St. Paul and scarce consonant to the nature of Christ’s Kingdom. A man would scarce believe how necessary it is to mark this difference among the errors of men in matters of religion for preventing that vain scrupulosity and importunate pensiveness which many melancholy spirits are troubled with, who condemn all errors alike, and thunder out one and the same anathema against whatever differs (though never so little) from their apprehensions: yet for keeping them from falling on the other side, into the indifferency of profane persons who conform to any thing and swallow a camel as well as a gnat. Indeed the true pious person will endeavor to keep himself from all error; and will purge his neighbor too, as well as himself, so far as he is able. For any deviation from truth, though it may be a light and small error, yet ’tis an error (that is to say an ignorance, and contradiction to the truth) and by consequence an evil. But a man must be very diligent and circumspect in observing this distinction among errors and acknowledge that one is much more dangerous than another, and he should more or less abhor them all, according as he shall judge them to be more or less dangerous.”

— Jean Daillé, ch. 7, ‘That there are two sorts of errors, the one overthrowing the foundation of faith and obliging men to separate, and the other not. That the opinions of the Church of Rome which we reject are of the first sort and those of the Lutherans of the second’ in An Apology for the Reformed Churches, wherein is showed the necessity of their Separation from the Church of Rome: against those who accuse them of making a Schism in Christendom (Cambridge: 1653), pp. 18-26, pp. 19-21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet+%28which+we+Protestants+confess%29+all+errors+in+doctrine+do+not+give+a+man+a+just+and+sufficient+cause+to+make+a+division+from+those+that+hold+them.+For+the+apostle+commands+us+to+receive+him+that+is+weak+in+the+Faith%2C+Rom.+14%3A1%2C+and+not+to+trouble+him+with+disputes%2C+and+to+afford+him+ourselves+for+an+example+in+bearing+gently+with+those+who+are+not+of+our+mind+in+everything.+%E2%80%98Let+us+all+who+are+perfect%2C%E2%80%99+says+he%2C+%E2%80%98be+of+the+same+mind%3B+and+if+any+of+you+think+otherwise%2C+God+shall+reveal+even+this+unto+him.%E2%80%99+Phil.+3%3A15.+%E2%80%98Tis+evident+that+this+weaknesse+in+faith+and+this+diversity+in+opinon+whereof+St.+Paul+speaks+are+errors%2C+but+such+as+he+would+have+us+bear+with.+Yet+since+he+elsewhere+pronounceth+anathema+against+those+that+preach+any+other+Gospel+than+that+which+he+preached%2C+we+must+of+necessity+conclude+that+there+are+two+sorts+of+errors+in+religion%3A+The+one+such%2C+as+a+man+may+bear+with+without+dividing+from+them+who+hold+them%3B+and+the+other+such%2C+for+which+he+is+bound+to+avoid+their+communion%3A+and+this+difference+depends+upon+the+nature+of+errors+themselves.+For+as+the+truths+which+we+are+to+believe+are+not+all+of+equal+importance%2C+some+being+esteemed+fundamental+and+so+absolutely+requisite%2C+that+a+man+cannot+come+to+the+kingdom+of+Heaven+if+he+be+ignorant+of+them%3B+others+being+profitable%2C+yet+not+so+necessary+but+that+a+man+may+without+the+knowledge+of+them+serve+God+and+enjoy+salvation%2C+so+it+is+with+errors%3A+Some+are+pernicious+and+no+way+consistent+with+a+true+piety%3B+others+are+less+hurtful+and+do+not+necessarily+draw+in+men+to+perdition.+St.+Paul+does+clearly+enough+discover+to+us+this+distinction%2C+1+Cor.+3%3A13%2C+15%2C+where%2C+after+he+had+said+that+%E2%80%98none+could+lay+any+other+foundation+but+that+which+he+had+laid%2C%E2%80%99+to+wit%2C+Jesus+Christ%2C+he+adds+that+%E2%80%98they+who+builded+upon+this+foundation+wood%2C+hay%2C+stubble%2C+should+have+loss+in+their+work+when+it+comes+to+be+tried%3B+nevertheless+they+should+be+saved%2C+yet+so+as+by+fire%3B%E2%80%99+that+is+to+say%2C+with+difficulty%2C+their+person+only%2C+or+that+wherein+their+chief+good+consisted%2C+escaping+a+burning%2C+an+evident+sign+that+there+be+errors+which+do+not+deprive+the+authors+thereof+of+salvation%2C+much+less+exclude+such+from+happiness+as+believe+them+after+them%2C+and+take+them+up+%28when+they+are+dead+or+gone%29+merely+upon+their+trust+and+credit.+And+to+conclude%2C+who+does+not+see+plainly+that+there+be+errors+which+utterly+overthrow+the+foundations+of+Christianity%2C+engaging+us+unavoidably+in+such+things+as+are+inconsistent+with+salvation%3F+and+that+there+be+others+which+do+not+so%3F+As+for+example%3A+If+one+should+think+that+he+were+bound+to+worship+the+sun+%28for+seeing+the+sun+is+a+creature%2C+and+those+who+worship+creatures+have+no+portion+in+the+kingdom+of+Heaven%29%2C+%E2%80%99tis+evident+that+he+who+has+such+an+opinion+cannot+attain+eternal+happiness.+And+%E2%80%99tis+so+with+all+other+errors+which+overthrow+any+of+the+first%2C+necessary%2C+and+fundamental+articles+of+Christian+religion.+But+the+errour+of+those+who+believed+of+old+that+the+Church+shall+continue+a+thousand+years+%28or+some+long+time%29+with+Jesus+Christ+upon+earth+after+the+resurrection%2C+is+no+way+repugnant+to+piety+towards+God+or+charity+towards+our+neighbor%2C+nor+does+it+directly+overthrow+any+of+the+foundations+of+the+Gospel%2C+though+it+be+in+my+opinion+contrary+to+diverse+passages+of+St.+Paul+and+scarce+consonant+to+the+nature+of+Christ%E2%80%99s+Kingdom.+A+man+would+scarce+believe+how+necessary+it+is+to+mark+this+difference+among+the+errors+of+men+in+matters+of+religion+for+preventing+that+vain+scrupulosity+and+importunate+pensiveness+which+many+melancholy+spirits+are+troubled+with%2C+who+condemn+all+errors+alike%2C+and+thunder+out+one+and+the+same+anathema+against+whatever+differs+%28though+never+so+little%29+from+their+apprehensions%3A+yet+for+keeping+them+from+falling+on+the+other+side%2C+into+the+indifferency+of+profane+persons+who+conform+to+any+thing+and+swallow+a+camel+as+well+as+a+gnat.+Indeed+the+true+pious+person+will+endeavor+to+keep+himself+from+all+error%3B+and+will+purge+his+neighbor+too%2C+as+well+as+himself%2C+so+far+as+he+is+able.+For+any+deviation+from+truth%2C+though+it+may+be+a+light+and+small+error%2C+yet+%E2%80%99tis+an+error+%28that+is+to+say+an+ignorance%2C+and+contradiction+to+the+truth%29+and+by+consequence+an+evil.+But+a+man+must+be+very+diligent+and+circumspect+in+observing+this+distinction+among+errors+and+acknowledge+that+one+is+much+more+dangerous+than+another%2C+and+he+should+more+or+less+abhor+them+all%2C+according+as+he+shall+judge+them+to+be+more+or+less+dangerous.%E2%80%9D%0A%0A%E2%80%94+Jean+Daill%C3%A9%2C+ch.+7%2C+%E2%80%98That+there+are+two+sorts+of+errors%2C+the+one+overthrowing+the+foundation+of+faith+and+obliging+men+to+separate%2C+and+the+other+not.+That+the+opinions+of+the+Church+of+Rome+which+we+reject+are+of+the+first+sort+and+those+of+the+Lutherans+of+the+second%E2%80%99+in+An+Apology+for+the+Reformed+Churches%2C+wherein+is+showed+the+necessity+of+their+Separation+from+the+Church+of+Rome%3A+against+those+who+accuse+them+of+making+a+Schism+in+Christendom+%28Cambridge%3A+1653%29%2C+pp.+18-26%2C+pp.+19-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F872ff92360.html&amp;via=5Solas" target="_blank" rel=

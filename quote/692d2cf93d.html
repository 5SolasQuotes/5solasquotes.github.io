<blockquote><p>I. God made a double Covenant with man, the one of works, the other of Grace, that before, this after the fall.

II. The Covenant of works was confirmed by a double Sacrament, to wit, the Tree of Life, and the Tree of Knowledge of good and evil, both being planted in the midst of Paradise.

III. They had a double use. I. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the tree of life might ratify eternal happiness to those that should obey, but the Tree of knowledge should signifie to the disobedient the loss of the greatest happiness, and the possession of the greatest misery.

IV. Therefore the Tree of life was so called, not from any innate faculty it had to give life, but from a sacramental signification.

V. Likewise the Tree of Knowledge of good and evil, hath this denomination from signifying the chief good and evil, and from the event.

For in effect, and by experience, man found out how great that happiness and good was which he lost, and how great evil and misery he brought upon himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 68.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59dd07b4c9" data-kw="">
<blockquote><p>A difference exists between a furnished and destitute state. The one is of the law considered in itself and its own nature; the other, in relation to us. The law was given to man in the beginning (before the fall) for life and by itself also led to life according to the sanction “do this and thou shalt live” (cf. Rom. 2:13). But after the fall, being destitute of strength through the flesh, it is not given for life, but for a mirror of sin and misery to render the sinner inexcusable (Rom. 3:19, 20). [1.4.15] …So God seriously wills (i.e., commands man to obey the law that he may live, according to the brief clause of the covenant of works: “Do this and thou shalt live”). [4.17.45] IV. (2) If Adam was righteous, he ought to have been immortal because there is a necessary connection between righteousness and life. (a) From the order of God who has joined righteousness and life in the law by an indissoluble bond (as he joined closely together sin and death: “Do this and thou shalt live; the soul that sinneth it shall die”). [5.12.4] XVII. There is not the same relation of justification and of the covenant through all things. To the former, faith alone concurs, but to the observance of the latter other virtues also are required besides faith. These conduce not only to the acceptance of the covenant, but also to its observance. For these two things ought always to be connected—the acceptance of the covenant and the keeping of it when accepted. Faith accepts by a reception of the promises; obedience keeps by a fulfillment of the commands. “Be ye holy, for I am holy.” And yet in this way legal and evangelical obedience are not confounded because the legal is prescribed for the meriting of life, the evangelical, however, only for the possession of it. The former precedes as the cause of life (“Do this and thou shalt live”); the latter follows as its fruit, not that you may live but because you live. The former is not admitted unless it is perfect and absolute; the latter is admitted even if imperfect, provided it be sincere. That is only commanded as man’s duty; this is also promised and given as the gift of God. [12.3.17]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, ed. James T. Dennison Jr. (Phillipsburg, NJ: P&amp;R Publishing, 1992–97).</span></figcaption>

</figure><figure class="quote" id="q-13bf37024c" data-kw="">
<blockquote><p>Everyone will have to agree that for Adam, perfect keeping of the law for a fixed period of time was the means to acquire eternal beatitude that cannot be lost. When the covenant of works was broken, God could have rescinded this promise. He was no longer bound to honor it. Nevertheless, He allowed the promise and the condition to stand and repeatedly be published anew, especially by the proclamation of the Sinaitic law (Lev 18:5, “The one who does them will live by them”; cf. Rom 10:5, “For Moses describes the righteousness that is by the law,” etc.; Gal 3:12). Fulfillment of this condition from man’s side was no longer conceivable; thus the repetition must have had a different significance. This significance can only be that after the fall God gave His covenant of grace, in which the same demand and promise are fulfilled in the Mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, ed. and trans. Richard B. Gaffin Jr., vol. 3 (Bellingham, WA: Lexham Press, 2012–16), 132.</span></figcaption>

<blockquote><p>1. He from all eternity decreed the creation of man after his own image, and the making of the covenant of works with him, in time. All things brought forth in time, lay from eternity in the womb of God’s decree; in virtue whereof they have their being in time: for which cause the decree is said to bring forth, as a woman doth a child, Zeph. ii. 2. And the creation of angels and men, with the providence about them, made many lines in the volume of the sealed book of the decrees.

God self-sufficient needed neither man nor angel: but, for the manifestation of his own glory, he purposed from eternity to create them; and moreover, to enter into such a covenant with man, as one should therein represent the whole family; sovereign pleasure meanwhile taking another method with the angelic tribe: but withal purposing to give both the one and the other a sufficient ability to stand in their integrity, if they would. Thus, from eternity, the covenant of works, in all the parts and appurtenances thereof, was before the eternal mind; though being made with a mere man, it could not actually be entered into, till once man was created. But, “Known unto God are all his works from the beginning of the world,” Acts xv. 18.

2. He decreed also from eternity, to permit the first man, the representative of the whole family, to fall, and so to break the covenant, and involve himself, and all his posterity in ruins. It is evident from the spotless holiness of God, and the nature of the thing, that the divine permission was not the cause of man’s fall; and from the necessary dependence of the creature upon the Creator, that without it, he could not have fallen. But the sovereign Lord of the creatures, permitted the fall of man for his own holy ends, purposing to bring about good from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 386-87.</span></figcaption>

<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/girolamo-zanchi.html">Girolamo Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians, p. 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6</cite>, pp. 139-140</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7cdb80497d" data-kw="">
<blockquote><p>The Law of Nature dictates that all who are admitted into this [Chuch] Society, must consent to be governed by the laws and rules of that society, according to its constitution. For none can be looked upon as a member of a society, but such a one as submits to the rules and laws of the society, as constituted at the time of his entrance into it. That all civil societies are founded upon voluntary consent and agreement of parties, and do depend upon contracts and covenants made between them, is evident to any that consider that men are not bound by the Law of Nature to associate themselves with any but whom they shall judge fit; that dominion and propriety was introduced by free consent of men: and so there must be laws and bonds fit, agreement made, and submission acknowledged to those laws, else men might plead their natural right and freedom still, which would be destructive to the very nature of these societies. When men then did first part with their natural Liberties, two things were necessary in the most express terms to be declared: First, a free and voluntary consent to part with so much of their natural rights as was not consistent with the well-being of the society; Secondly, a free submission to all laws, which should be agreed upon at their entrance into society, or afterwards as they see cause. But when societies were already entered, and children born under them, no such express consent was required in them, being bound by virtue of the protection they find from authority to submit to it, and an implicit consent is supposed in all such as are born under that authority. But for their more full understanding of this obligation of theirs, and to lay the greater tie of obedience upon them, when they come to understanding, it has been conceived very requisite by most states to have an explicit declaration of their consent, either by some formal oath of allegiance, or some other way sufficiently expressing their fidelity, in standing to the covenants long since supposed to be made. To apply this now to the Church. … Our Savior has determined how this consent should be expressed, viz. by receiving baptism from those who have the power to dispense it: which is the federal rite whereby our consent is expressed to own all the laws and submit to them, whereby this society is governed: Which at the first entering of men into this society of the Church was requisite to be done by the express and explicit consent of the parties themselves, being of sufficient capacity to declare it, but the Covenant being once entered into by themselves, not only in their own name, but in the name of their posterity (a thing implied in all covenants wherein benefits do redound to posterity, that the obligation should reach them to; but more particular in this, it having been always the tenor of God’s Covenants with men, to enter the seed as well as the persons themselves, as to outward privileges, Dt. 29:15; Acts 2:38), an implicit consent as to the children in Covenant is sufficient to enter them upon the privileges of it by baptism, although withal it be highly rational for their better understanding the engagement they entered into, that when they come to age, they should explicitly declare their own voluntary consent to submit to the laws of Christ, and to conform their lives to the profession of Christianity… …but in religious societies [in contrast to natural societies], though the act of consent be free, yet there is an antecedent obligation upon men, binding them to this voluntary consent… It is granted, Church-power does suppose consent, but then all Christians are under an obligation from the nature of Christianity to express this consent, and to submit to all censures legally inflicted. … …yet I no ways deny the lawfulness or expediency, in many cases, of having a personal profession from all baptized in infancy when they come to age (which we may, if we please, call Confirmation) and the necessity of desiring admission, in order to participation of all ordinances: which desire of admission, does necessarily imply men’s consenting to the laws of that society, and walking according to the duties of it; and so they are consequentially and virtually, though not expressly and formally, bound to all the duties required from them in that relation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 7 in Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined... (London: Mortlock, 1662), pt. 1</cite>, pp. 132-40</span></figcaption>

</figure><figure class="quote" id="q-b13340ca0f" data-kw="">
<blockquote><p>From this it follows that the children of believers are baptized not in order that they who were previously strangers to the church may then for the first time become children of God, but rather that, because by the blessing of the promise they already belonged to the body of Christ, they are received into the church with this solemn sign.</p></blockquote>

<blockquote><p>Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world. 2. Note that the holiness of the child received from one of the parents believing is more than the sanctification of the wife by her believing husband, because such a wife is not taken into Covenant with her husband, but the child is; and therefore the apostle says not that such as is the sanctification of the wife, such is the holiness of the child: But thus, Such as is the holiness of the believing party, such is the child’s holiness in respect of Church-membership; and so the faith of the believing husband is the cause of both these effects, viz. That his coupling with his wife is not impure, and also that his children are holy: And this latter [is] an evidence of the former. And thus the holiness of the child is a sign of the mother’s sanctification to holy cohabitation, and an effect of the father’s faith by virtue of God’s Covenant. To have said, ‘That their children were lawful’, was no more than to have said, ‘That their marriage was lawful’, which was not the question; But to say, that the children of their lawful marriage were holy, this did infer not only the lawfulness of their marriage but the sanctified use: As Mr Baily has well observed, Of Anabaptism, p. 138. 3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world. 2. Note that the holiness of the child received from one of the parents believing is more than the sanctification of the wife by her believing husband, because such a wife is not taken into Covenant with her husband, but the child is; and therefore the apostle says not that such as is the sanctification of the wife, such is the holiness of the child: But thus, Such as is the holiness of the believing party, such is the child’s holiness in respect of Church-membership; and so the faith of the believing husband is the cause of both these effects, viz. That his coupling with his wife is not impure, and also that his children are holy: And this latter [is] an evidence of the former. And thus the holiness of the child is a sign of the mother’s sanctification to holy cohabitation, and an effect of the father’s faith by virtue of God’s Covenant. To have said, ‘That their children were lawful’, was no more than to have said, ‘That their marriage was lawful’, which was not the question; But to say, that the children of their lawful marriage were holy, this did infer not only the lawfulness of their marriage but the sanctified use: As Mr Baily has well observed, Of Anabaptism, p. 138. 3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?”

— William Lyford, An Apology for our Public Ministery &amp; Infant-Baptism, written Some Years Ago… (London, 1652), pp. 42-44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+%5Bfrom+a+baptist%5D%3A+The+sanctification+of+the+wife+is+but+a+civil+sanctification+in+that+place%2C+i.e.+she+is+sanctified+to+his+use%2C+that+he+ought+not+to+put+her+away.+Again%2C+the+holiness+there+spoken+of+is+a+fruit+of+that+sanctification+of+the+wife%2C+whereof+it+will+follow%2C+that+seeing+%5Bas%5D+the+effect+cannot+be+greater+then+the+cause%2C+the+cause+cannot+produce+a+greater+effect+than+itself%2C+the+cause+being+only+a+civil+sanctification%2C+the+holiness+of+the+children+must+be+the+same%3B+thus+argues+Thomas+Collier.+Answer+1%3A+The+question+%5Bin+the+text%5D+was%2C+Whether+the+believer+were+polluted+by+his+unbelieving+wife%3F+The+apostle+says%2C+%E2%80%98No%E2%80%99%2C+quia+pluris+est+pietas+unius+ad+sanctificandum+conjugium%2Cqu%C3%A0m+alterius+impietas+ad+inquinandum%2C+i.e.+the+faith+of+the+believer+is+of+greater+force+to+sanctify+their+present+cohabitation%2C+than+the+unbelief+of+the+other+to+pollute+it.+This+he+proves+from+a+greater+effect+and+fruit+of+the+husband%E2%80%99s+faith%2C+viz.+the+holiness+of+the+children+born+of+such+a+husband+by+such+a+woman.+The+children+are+holy%2C+not+only+civilly%2C+as+being+born+of+lawful+wedlock%2C+but+federally+as+being+severed+from+all+children+of+unbelievers+by+special+prerogative%2C+holy+to+the+Lord%2C+consecrated+unto+Him%2C+whereas+by+nature+they+were+aliens+and+unclean%3B+according+to+that+of+Paul%2C+Rom.+11%3A16%2C+%E2%80%98if+the+root+be+holy%2C+so+are+the+branches.%E2%80%99+The+faith+of+the+believing+party+sanctifies+the+unbelieving+wife+to+bear+not+only+a+lawful%2C+but+a+holy+seed%3B+yea%2C+it+sanctifies+the+children+and+severs+them+from+the+common+condition+of+other+children%2C+which+are+profane+and+unclean+without+the+Church%2C+without+God+in+the+world.+2.+Note+that+the+holiness+of+the+child+received+from+one+of+the+parents+believing+is+more+than+the+sanctification+of+the+wife+by+her+believing+husband%2C+because+such+a+wife+is+not+taken+into+Covenant+with+her+husband%2C+but+the+child+is%3B+and+therefore+the+apostle+says+not+that+such+as+is+the+sanctification+of+the+wife%2C+such+is+the+holiness+of+the+child%3A+But+thus%2C+Such+as+is+the+holiness+of+the+believing+party%2C+such+is+the+child%E2%80%99s+holiness+in+respect+of+Church-membership%3B+and+so+the+faith+of+the+believing+husband+is+the+cause+of+both+these+effects%2C+viz.+That+his+coupling+with+his+wife+is+not+impure%2C+and+also+that+his+children+are+holy%3A+And+this+latter+%5Bis%5D+an+evidence+of+the+former.+And+thus+the+holiness+of+the+child+is+a+sign+of+the+mother%E2%80%99s+sanctification+to+holy+cohabitation%2C+and+an+effect+of+the+father%E2%80%99s+faith+by+virtue+of+God%E2%80%99s+Covenant.+To+have+said%2C+%E2%80%98That+their+children+were+lawful%E2%80%99%2C+was+no+more+than+to+have+said%2C+%E2%80%98That+their+marriage+was+lawful%E2%80%99%2C+which+was+not+the+question%3B+But+to+say%2C+that+the+children+of+their+lawful+marriage+were+holy%2C+this+did+infer+not+only+the+lawfulness+of+their+marriage+but+the+sanctified+use%3A+As+Mr+Baily+has+well+observed%2C+Of+Anabaptism%2C+p.+138.+3.+Lastly%2C+If+by+holy%2C+be+only+meant+a+civil+holiness%2C+then+on+the+contray%2C+by+%E2%80%98unclean%E2%80%99%2C+must+be+meant+a+civil+uncleanness.+But+when+Paul+says+%28else+were+your+children+unclean%29+his+intent+is+not+to+make+them+all+as+an+unclean+birth+and+impure+offspring%2C+which+were+born+at+Corinth+of+unbelieving+parents%2C+but+to+show+that+they+are+not+comprehended+within+God%E2%80%99s+Covenant%3A+And+so+when+he+says+%E2%80%98but+now+are+they+holy%E2%80%99%2C+he+notes+some+preeminence+of+the+children+of+Christians+above+the+heathens%E2%80%99+children%3A+Though+in+civil+respects%2C+in+respect+of+a+lawful+birth%2C+both+sorts+of+children+were+equal%2C+yet+that+civil+holiness+being+common+to+both%2C+there+is+a+preeminence+of+the+Christian%E2%80%99s+child+above+the+heathen%E2%80%99s.+The+child+of+an+infidel+at+Corinth+is+today+unclean+and+the+next+day+holy+in+case+his+parents+turn+Christians%3B+And+what%E2%80%99s+the+reason+of+this+so+sudden+alteration%3F+It+must+needs+be+in+regard+of+the+Covenant+into+which+the+party+now+believing+is+taken+with+his+children%2C+his+unbelieving+neighbor+with+his+children+still+remaining+unclean%3A+Hence+I+conclude+with+Calvin%2C+in+location%2C+Seeing+our+children+are+exempted+from+the+common+condition+of+lost+mankind%2C+and+admitted+into+God%E2%80%99s+Church+and+family%2C+Cur+eos+a+signo+arceamus%3F+upon+what+reason+can+we+drive+them+from+the+sign+of+their+admittance%3F%E2%80%9D%0A%0A%E2%80%94+William+Lyford%2C+An+Apology+for+our+Public+Ministery+%26+Infant-Baptism%2C+written+Some+Years+Ago%E2%80%A6+%28London%2C+1652%29%2C+pp.+42-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8511263fc1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8511263fc1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Objection%20%5Bfrom%20a%20baptist%5D%3A%20The%20sanctification,from%20the%20sign%20of%20their%20admittance%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c995c769a3" data-kw="">
<blockquote><p>Many of us confuse spiritual desertion with the mental health condition of melancholy (or depression). The Dutch Reformed theologian, Gisbertus Voetius, gave some directions for distinguishing between the two conditions (we omit number five owing to an error that caused the author to say the opposite of what he probably meant to say):

It is distinguished from melancholy as follows. In the first place, a melancholic disorder is directly lodged in the imagination, but abandonment is located in the rational soul.

Second, the symptoms of melancholia are pain and fear without the kind of discernible cause the depressed could advance to explain them, but the abandoned show by a sharp and refined judgment that they know the cause of their disturbance and the total mystery of the temptations and promptings of Satan and can make sense of them by their answers as well as their excuses, their refutations and replies.

Third, this desertion can exist and is frequently there (as the most competent and experienced practical writers such as Perkins, Downame, Abernethy, and Bolton attest) when a person’s temperament and physical condition show no tendency to melancholia and when also no bad humour, intestinal diseases, and such ailments can in any way be found. But this is not true of melancholia.

Fourth, melancholics are most afraid of fantastic and illusory vanities that do not now exist nor have ever existed, as this has been unfolded in the work of the practical writers. … The abandoned, on the other hand, fear only the prospect of becoming insensitive to the grace of God and of coming under his wrath. …

Sixth, melancholia is often cured by medical treatment and medicines, but this is by no means true for abandonment.

Seventh, melancholia is often alleviated or eliminated by recreation, physical diversion, and mental entertainment, by games, music, and song, by the speeches and conversations of comical and farcical entertainers, and so forth, but these measures only intensify the bitterness and severity of desertion and its attendant woes.

Finally, melancholics as well as old fogies are incapable of doing certain things, but the abandoned surpass not only others but often even themselves in intellect and memory, wisdom and prudence, respecting divine and human matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius-and-johannes-hoornbeeck.html">Gisbertus Voetius and Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Desertion</cite>, trans. John Vriend and Harry Boonstra, ed. M. Eugene Osterhaven (1659; Grand Rapids MI: Reformation Heritage Books, 2003), p. 39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>It is commonly said by others who do not know what melancholy [depression] is, “Why do you think and pore so much? Divert yourselves; think of something else.” But it is no more possible for people, where this disease comes with violence, to divert their thoughts than it is possible for a man to be alert in apoplexy or calm in a raging fever; no more than a man who has a broken arm or leg can walk and act as he used to do before.</p></blockquote>

</figure><figure class="quote" id="q-766a5a5f6c" data-kw="">
<blockquote><p>Two centuries ago, in the days of the Stuarts, it would have been impossible for the Church to purchase her freedom even at this cost. On the 1st November 1662, four hundred ministers of the Church of Scotland, substantially for the same principle of Christ’s sole kingly authority in his Church, left their churches and pleasant homes, and cast themselves and their families on the world. But it was not to poverty only, with its manifold hardships, they thus committed themselves, but, as every reader of his country’s history knows, to all manner of sufferings even unto death. And they deemed the principle worth suffering for even to death.

Well it was for the liberties of all Great Britain, as the issue proved, that they did, that they had no sympathy with those in our time who say—it is but a question about external things after all, not touching doctrine, not affecting the truths on which salvation depends. Indeed? Christ’s sole kingly authority in his Church not a matter of vital doctrine! It was well, at least, that our martyr-forefathers thought otherwise, thought that if the shepherds’ consent to the pulling down of the fence which protects the flock, and the wolf thus get in among them, it is small consolation for the sheep that it was only the fence the shepherds suffered to be broken down.

With John Knox, a hundred years before, they judged, “Take from us our assemblies, and take from us the gospel” And thus were they willing, for Christ’s sole regal authority in his kingdom, to surrender, not their livings only, but their lives. The difference in our happier times simply is, that we were able to secure our freedom by parting, not with our lives, but with our livings only. Hence the Disruption of 1843.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-j-brown.html">Charles J. Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh</cite>, (Edinburgh: T. Nelson and Sons, 1863), p. 12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<main class="wrap"><figure class="quote" id="q-1a14cb342a" data-kw="">
<blockquote><p>And because I have past it by before, I shall say something of the Westminster Assembly here. This Synod was not a Convocation according to the Diocesan way of Government, nor was it called by the Votes of the Ministers according to the Presbyterian way: But the Parliament not intending to call an Assembly which should pretend a Divine Right to make obliging Laws or Canons to bind their Brethren, but an Ecclesiastical Council to be Advisers to themselves, did think that they best knew who were the fittest to give them Advice, and therefore chose them all themselves. Two were to be chosen out of each County; but some few Counties (I know not upon what reason) had but one: I suppose it was long of the Parliament Men of those Counties.

And because they would seem Impartial, and have each Party to have liberty to speak, they over and above the number chose many Episcopal Divines, even the Learnedest of them in the Land, as Archbishop Usher Primate of Ireland, Dr. Holdsworth, Dr. Hammond, Dr. Wincop, Bishop Westford, Bishop Prideaux, and many more. But they would not come, because it was not a Legal Convocation, and because the King declared himself against it: Dr. Dan[iel]. Featley and very few more of that Party came: (But at last he was charged with sending Intelligence to the King’s Quarters at Oxford, of what was done in the Synod and Parliament, and was imprisoned; which much reflected on the Parliament, because whatever his Fact were, he was so Learned a Man, as was sufficient to dishonour those he suffered by).

The Prolocutor or Moderator was Dr. William Twisse (a Man very famous for his Scholastical Wit and Writings in a very smooth triumphant Stile): The Divines there Congregate were Men of Eminent Learning and Godliness, and Ministerial Abilities and Fidelity: And being not worthy to be one of them my self, I may the more freely speak that Truth which I know even in the Face of Malice and Envy, that, as far as I am able to judge by the Information of all History of that kind, and by any other Evidences left us, the Christian World, since the days of the Apostles, had never a Synod of more Excellent Divines (taking one thing with another) than this Synod and the Synod of Dort were.

This Assembly was confined by the Parliament to debate only such things as they proposed to them: And many Lords and Commons were joined in Commission with them, to see that they did not go beyond their Commission: Six or seven Independents were joined with them, that all sides may be heard; of whom five were called the Dissenting Brethren, (Philip Nye, Thomas Goodwyn, Jeremiah Burroughs, Sydrach Simpson, and William Bridge) who joined with the rest till they had drawn up a Confession of Faith, a larger and a shorter Catechism.

But when they came to Church Government, they engaged them in many long Debates, and kept that Business as long as possibly they could undetermined; and after that kept it so long unexecuted in almost all parts of the Land, saving London and Lancashire, that their Party had time to strengthen themselves in the Army and the Parliament, and hinder the Execution after all, and keep the Government determined of, a Stranger to most of the People of this Land, who knew it but by hearsay, as it was represented by Reporters.

For my own part, as highly as I honour the Men, I am not of their Mind, in every Point of the Government which they would have set up; and some words in their Catechism I could wish had been more clear; and above all, I could wish that the Parliament and their more skillful Hand, had done more than was done to heal our Breaches, and had hit upon the right way either to unite with the Episcopal and Independents (which was possible, as distant as they are) or at least had pitched on the Terms that are fit for Universal Concord, and left all to come in upon those Terms that would. But for all this dissent I must testify my Love and Honour to the Persons of such great Sincerity, and Eminent Ministerial Sufficiency, as were Gataker, Vines, Burgess, White, and the greater part of that Assembly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ, or, Mr. Richard Baxter’s narrative of the most memorable passages of his life and times faithfully publish’d from his own original manuscript by Matthew Sylvester</cite>, (London: T. Parkhurst, 1696), Part 1, § 117, p. 73.</span></figcaption>

<blockquote><p>There is now no national membership in the Church of Christ, limited to one hereditary family or favored race; but in the fellowship of one faith and one spirit, all, of whatever tribe or tongue or nation, are one with Christ, and one with each other. The narrow barriers of former economy have been thrown down; and in the gift of the Spirit to all believers, and in the fellowship of the Spirit coextensive with all, there is laid the foundation of a Church, no longer confined to one nation as before under the law, but worldwide and universal… Earthly and outward causes of separation are overborne and controlled by this higher principle of unity. Separation in race or tongue is no separation to be accounted of among the followers of Christ, who are joined together in that one Spirit. Distance on the earth is no distance to be regarded between those who are partakers together of the same Holy Ghost. Local churches or societies, divided in place and outward worship, become merged in the oneness of a higher fellowship. Separated in the outward act of worship, they are joined in the communion of the same Spirit. The assemblies of Christians in every quarter of the globe, who worship God in sincerity and truth, are one in such a sense as their distance from one another admits of; and they must all be regarded as branches of the universal Church of Christ throughout the world, the great community of believers, separated by distance and kindred and tongue, who cannot meet together in the body, but who really meet together in the Spirit. The invisible Church of Christ on earth is local, but it is also catholic.</p></blockquote>

— James Bannerman, The Church of Christ, ... (Edinburgh: T&amp;T Clark, 1868), vol. 1, pt. 1, ‘Nature of the Church’, ch. 4, ‘The Church in its Twofold Character as Catholic &amp; Local’, pp. 43-44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+now+no+national+membership+in+the+Church+of+Christ%2C+limited+to+one+hereditary+family+or+favored+race%3B+but+in+the+fellowship+of+one+faith+and+one+spirit%2C+all%2C+of+whatever+tribe+or+tongue+or+nation%2C+are+one+with+Christ%2C+and+one+with+each+other.+The+narrow+barriers+of+former+economy+have+been+thrown+down%3B+and+in+the+gift+of+the+Spirit+to+all+believers%2C+and+in+the+fellowship+of+the+Spirit+coextensive+with+all%2C+there+is+laid+the+foundation+of+a+Church%2C+no+longer+confined+to+one+nation+as+before+under+the+law%2C+but+worldwide+and+universal%E2%80%A6+Earthly+and+outward+causes+of+separation+are+overborne+and+controlled+by+this+higher+principle+of+unity.+Separation+in+race+or+tongue+is+no+separation+to+be+accounted+of+among+the+followers+of+Christ%2C+who+are+joined+together+in+that+one+Spirit.+Distance+on+the+earth+is+no+distance+to+be+regarded+between+those+who+are+partakers+together+of+the+same+Holy+Ghost.+Local+churches+or+societies%2C+divided+in+place+and+outward+worship%2C+become+merged+in+the+oneness+of+a+higher+fellowship.+Separated+in+the+outward+act+of+worship%2C+they+are+joined+in+the+communion+of+the+same+Spirit.+The+assemblies+of+Christians+in+every+quarter+of+the+globe%2C+who+worship+God+in+sincerity+and+truth%2C+are+one+in+such+a+sense+as+their+distance+from+one+another+admits+of%3B+and+they+must+all+be+regarded+as+branches+of+the+universal+Church+of+Christ+throughout+the+world%2C+the+great+community+of+believers%2C+separated+by+distance+and+kindred+and+tongue%2C+who+cannot+meet+together+in+the+body%2C+but+who+really+meet+together+in+the+Spirit.+The+invisible+Church+of+Christ+on+earth+is+local%2C+but+it+is+also+catholic.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%2C+...+%28Edinburgh%3A+T%26T+Clark%2C+1868%29%2C+vol.+1%2C+pt.+1%2C+%E2%80%98Nature+of+the+Church%E2%80%99%2C+ch.+4%2C+%E2%80%98The+Church+in+its+Twofold+Character+as+Catholic+%26+Local%E2%80%99%2C+pp.+43-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6549f3b241.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6549f3b241.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-communion-of-the-saints/#:~:text=There%20is%20now%20no%20national%20membership,local%2C%20but%20it%20is%20also%20catholic&amp;text=There%20is%20now%20no%20national%20membership%20in%20the&amp;text=earth%20is%20local%2C%20but%20it%20is%20also%20catholic" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

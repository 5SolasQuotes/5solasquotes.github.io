<main class="wrap"><figure class="quote" id="q-da5636a070" data-kw="">
<blockquote><p>That Christ Jesus by His death did bring forth salvation and reconciliation only for the elect (John 15:13; Rom. 8:32–34; 5:11; 3:25), which were those which God the Father gave Him (Job 17:2; 6; 37); and that the gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever-blessed God (Matt. 16:16; Luke 2:26; John 6:9; 7:3; 20:31; 1 John 5:11), filled with the perfection of all heavenly and spiritual excellencies, and that salvation is only and alone to be had through believing in His name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4653bc431" data-kw="">
<blockquote><p>Scripture, however, says absolutely nothing to the effect that we either should or could make satisfaction to God for our sins in some part either by our works or by our sufferings. It does not say that when the priest in absolution looses and remits sin he should impose penalties as punishment and satisfaction for sins. It says nothing about the punishments of purgatory; it has nothing about a treasury of works of supererogation; it teaches nothing about a key, delivered solely to the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 4, p. 168</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/penance-and-confession.html">Penance and Confession</a> › <a href="../topics/repentance-and-conversion/penance-and-confession/satisfactions.html">Satisfactions</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>

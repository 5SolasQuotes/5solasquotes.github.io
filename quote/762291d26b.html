<main class="wrap"><figure class="quote" id="q-762291d26b" data-kw="">
<blockquote><p>How hath the Moral Law been delivered since the Fall? The Sum thereof was comprised in ten Words, (Exod. 34:28; Deut. 4:13.) commonly called the Decalogue or Ten Commandments; solemnly published and engraved in Table of Stone by God himself, (Deut. 4:14 &amp; 10:4.) Afterwards the same was more fully delivered in the Books of Holy Scripture, and so committed to the Church for all Ages, as the Royal Law for Direction of our Obedience to God our King, (James 1:8.) and for the Discovery of Sin, and the Punishment due thereto, Deut. 27:26; Rom. 1:31 &amp; 3:20. What then doth the Law now require of us? All such Duties as were required of Adam in his Innocency, (Levit. 18:5.) and all such as are required since by reason of his Fall, (Deut. 17:2–6.) binding us to eternal Death for our least defect therein. Declare now out of that which hath been said, what the Covenant of Works is? It is a Conditional Covenant between God and Man, whereby on the one side God commandeth the Perfection of Godliness and Righteousness, and promiseth that he will be our God, if we keep all his Commandments; and on the other side, Man bindeth himself to perform intire and perfect Obedience to God’s Law, by that Strength wherewith God hath indued him by the Nature of his first Creation. What was done in this Covenant on God’s part? There was his Law, backed with Promises and Threatnings; and unto them were added outward Seals. What was the Sum of this Law? Do this, and thou shalt live: If thou dost it not, thou shalt die the Death. What is meant by, Do this? Keep all my Commandments in Thought, Word, and Deed. What is meant by Life, promised to those that should keep all the Commandments? The Reward of Blessedness and Everlasting Life, Levit. 18:5; Luk. 10:28. What is meant by Death threatned to those that should transgress? In this World the Curse of God, and Death, with manifold Miseries both of Body and Soul: And (where this Curse is not taken away) Everlasting Death both of Body and Soul in the World to come, Deut. 27:26 &amp; 29:19, 20 &amp; 32:22; Levit. 26; Deut. 28. What were the outward Seals added hereunto? The two Trees, planted by God for that purpose in the midst of the Garden, Gen. 2:9 &amp; 3:3. that Adam before and in the sight of them might resort to some special place to serve God in, and might by the Sight of them be put in mind of those things whereof they were Signs and Seals.</p></blockquote>

<blockquote><p>The Law—considered as a national covenant, by which their continued possession of the land of Canaan, and of all their privileges under the Theocracy, was left to depend on their external obedience to it,— might be called a national Covenant of Works, since their temporal welfare was suspended on the condition of their continued adherence to it; but, in that aspect of it, it had no relation to the spiritual salvation of individuals, otherwise than as this might be affected by their retaining, or forfeiting, their outward privileges and means of grace.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Law—considered as a national covenant, by which their continued possession of the land of Canaan, and of all their privileges under the Theocracy, was left to depend on their external obedience to it,— might be called a national Covenant of Works, since their temporal welfare was suspended on the condition of their continued adherence to it; but, in that aspect of it, it had no relation to the spiritual salvation of individuals, otherwise than as this might be affected by their retaining, or forfeiting, their outward privileges and means of grace.”

— James Buchanan, The Doctrine of Justification (Oxford: Oxford University Press, 1867), 38–39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Law%E2%80%94considered+as+a+national+covenant%2C+by+which+their+continued+possession+of+the+land+of+Canaan%2C+and+of+all+their+privileges+under+the+Theocracy%2C+was+left+to+depend+on+their+external+obedience+to+it%2C%E2%80%94+might+be+called+a+national+Covenant+of+Works%2C+since+their+temporal+welfare+was+suspended+on+the+condition+of+their+continued+adherence+to+it%3B+but%2C+in+that+aspect+of+it%2C+it+had+no+relation+to+the+spiritual+salvation+of+individuals%2C+otherwise+than+as+this+might+be+affected+by+their+retaining%2C+or+forfeiting%2C+their+outward+privileges+and+means+of+grace.%E2%80%9D%0A%0A%E2%80%94+James+Buchanan%2C+The+Doctrine+of+Justification+%28Oxford%3A+Oxford+University+Press%2C+1867%29%2C+38%E2%80%9339.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F706737c25c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/706737c25c.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/08/the-law-might-be-called-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-79a18339a4" data-kw="">
<blockquote><p>Once more, are true believers delivered from the commanding, condemning, and irritating power of the law as a covenant? Let them then, amid all their trials and all their conflicts with spiritual enemies, be of good comfort. Oh, let them rejoice exceedingly in that almighty, compassionate, dear Redeemer who, in His love and pity, has redeemed them from the dominion and curse of the broken law (Gal. 3:13). You, O believer, have become dead to the law by the body of Christ and are married to another husband, even to Him who is raised from the dead, that you may bring forth fruit unto God (Rom. 7:4). You are dead to the law of works; nevertheless, you live. You live to God as your own God, your covenant God, and you serve Him in newness of spirit. In union with your living Redeemer, who loved you and gave Himself for you, you live a life of justification, and consequently, it is your privilege as well as your duty to live a life of sanctification and consolation. Being justified by faith, you have peace with God through our Lord Jesus Christ and, in some measure, peace of conscience. If then the law as a covenant of works should at any time enter your conscience again and require perfect obedience from you as the ground of your title to eternal life, saying, “This do, and thou shalt live” (Luke 10:28), present to it, in the hand of faith, the perfect obedience of your divine Surety in answer to that demand. And as often as the law in your conscience repeats the high demand, renew your application of His consummate obedience and trust firmly that it was performed for you in order to entitle you to eternal life. The righteous law, magnified and made honorable by that meritorious obedience, will, in proportion as you do so, cease to disturb the peace of your conscience. The spotless obedience of the second Adam is, as was observed above, the only obedience that you should present to the law as a covenant of works; and your own personal obedience is the only obedience that you ought to exhibit to it as a rule of life.</p></blockquote>

</figure><figure class="quote" id="q-956ef8743f" data-kw="">
<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments: 1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21). 2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life. 3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare). 4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>

<blockquote><p>6. Our next step is to show that baptism has come in the room of circumcision, and therefore, that the former is rightfully and properly applied to the same subjects as the latter. When we say this, we mean, not merely that circumcision is laid aside in the church of Christ, and that baptism has been brought in, but that baptism occupies the same place, as the appointed initiatory ordinance in the church, and that, as a moral emblem, it means the same thing.

The meaning and design of circumcision was chiefly spiritual. It was a seal of a covenant which had not solely, or even mainly, a respect to the possession of Canaan, and to the temporal promises which were connected with a residence in that land; but which chiefly regarded higher and more important blessings, even those which are conveyed through the Messiah, in whom “all the families of the earth” are to be blessed. So it is with baptism. While it marks an external relation, and seals outward privileges, it is, as circumcision was, a “seal of the righteousness of faith,” and has a primary reference to the benefits of the Messiah’s mission and reign. Circumcision was a token of visible membership in the family of God, and of covenant obligation to him. So is baptism.

Circumcision was the ordinance which marked, or publicly ratified, entrance into that visible family. So does baptism. Circumcision was an emblem of moral cleansing and purity. So is baptism. It refers to the remission of sins by the blood of Christ, and regeneration by his Spirit; and teaches us that we are by nature guilty and depraved, and stand in need of the pardoning and sanctifying grace of God by a crucified Redeemer. Surely, then, there is the best foundation for asserting that baptism has come in the place of circumcision. The latter, as all grant, has been discontinued; and now baptism occupies the same place, means the same thing, seals the same covenant, and is a pledge of the same spiritual blessings. Who can doubt, then, that there is the utmost propriety, upon principle, in applying it to the same infant subjects?

Yet, though baptism manifestly comes in the place of circumcision, there are points in regard to which the former differs materially from the latter. And it differs precisely as to those points in regard to which the New Testament economy differs from the Old, in being more enlarged, and less ceremonial. Baptism is not ceremonially restricted to the eighth day, but may be administered at any time and place. It is not confined to one sex; but, like the glorious dispensation of which it is a seal, it marks an enlarged privilege, and is administered in a way which reminds us that “there is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female,” in the Christian economy; but that we are all one in Christ Jesus.</p></blockquote>

<blockquote><p>All ministers must be admonished to be more careful to instruct the ignorant than ready to satisfy their appetites; and more sharp in examination than indulgent, in admitting to that great mystery such as are ignorant of the use and virtue of the same. And therefore we think that the administration of the Table ought never to be without that examination pass before, especially of those whose knowledge is suspect. We think that none are apt to be admitted to that mystery who cannot formally say the Lord’s Prayer, the articles of the belief, and declare the sum of the law… Every master of household must be commanded either to instruct, or else cause [to] be instructed, his children, servants, and family, in the principles of the Christian religion; without the knowledge whereof ought none to be admitted to the Table of the Lord Jesus. For such as are so dull and so ignorant, that they can neither try themselves, neither yet know the dignity and mystery of that action, cannot eat and drink of that Table worthily. And therefore of necessity we judge it, that every year at least, public examination be had by the ministers and elders of the knowledge of every person within the church: to wit, that every master and mistress of household come themselves, and their family (so many as are come to maturity), before the ministers and elders, to give confession of their faith, and to answer to such chief points of religion as the ministers shall demand. Such as are ignorant in the articles of their faith; understand not, nor cannot rehearse the commandments of God; know not how to pray, neither whereinto their righteousness consists, ought not to be admitted to the Lord’s Table.</p></blockquote>

<blockquote><p>Baptism is a seal of the whole covenant of grace; but it is by way of initiation. Hence it belongs to all that are within the covenant or have the first entrance thereinto. And is there no danger of corruption by overstraining the subject of baptism? Certainly, it is a corruption to take from the rule, as well as add to it. Moses found danger in not applying the initiating seal, to such for whom it was appointed. Is there no danger of putting those out of the visible Church, whom our Lord would have kept in?… If we do not keep in the way of a converting, grace-giving covenant, and keep persons under those church dispensations, wherein grace is given, the Church will die of a lingering, though not violent, death. The Lord has not set up churches only that a few old Christians may keep one another warm while they live, and then carry away the Church into the cold grave with them when they die; no, but that they might with all care, and with all the obligations and advantages to that care that may be, nurse up still successively another generation of subjects to our Lord, that may stand up in his kingdom when they are gone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Works of Christ in America</cite>, vol. 2, p. 309</span></figcaption>

<blockquote><p>15. But when and in what sort and degree Christ gives the actual operations of the Spirit to all covenanted infants, it is wonderful hard for us to know. But this much seems clear:

1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason.

2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.</p></blockquote>

1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason.

2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.”

" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The religious observance of this institution was required under a very severe penalty, Gen. 17:14. The contempt of circumcision was a contempt of the covenant; if the parents did not circumcise their children, it was at their peril, as in the case of Moses, Ex. 4:24–25. With respect to those that were not circumcised in their infancy, if, when they grew up, they did not themselves come under this ordinance, God would surely reckon with them. If they cut not off the flesh of their foreskin, God would cut them off from their people. It is a dangerous thing to make light of divine institutions, and to live in the neglect of them.</p></blockquote>

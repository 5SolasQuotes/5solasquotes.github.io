<blockquote><p>Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits we may with better reason say it of ourselves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: 1644), pt. 2, p. 204</span></figcaption>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>

<blockquote><p>3. Those duties which are required of all those who publicly preach the Word of God in the Name of Christ are not required of all those Christians that are gifted: as that there lies on them the pastoral charge of souls, of which they are to give an account to God, Heb. 13:17, that they ought to give themselves wholly to the reading and studying of the Scriptures, 2 Tim. 4:15-16, that they may not apply themselves to the things of this world, 2 Tim. 2:4, that in the Name of Christ as his Ambassadors they entreat men to be reconciled to God, 2 Cor. 5. 20, that they are to distribute to all and every one in the house of God their portion of food in due season, Mt. 24:46, that they are authoritatively in the Name of Christ to remit and retain sins, Jn. 20:21. Now all these things are not enjoined on all Christians who have received the gifts of the Spirit. 4. Hence also the privileges and promises which are made to pastors, who preach the Word in the Name of God, are not given to all believers who are endued with the gifts of the Spirit; as, that they are worthy of double honor, 1 Tim. 5:17, that God will by a peculiar and singular assistance of his Spirit be present with them, Mt. 28:20; Lk. 21:14-15. And so a prophet’s recompence and reward is distinguished from the reward of a righteous man, Mt. 10:42. Therefore that labor, duty, and burden, to which these promises are made, is not imposed on all the righteous that are endued with gifts of the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 79-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

</figure><figure class="quote" id="q-091e61afe4" data-kw="">
<blockquote><p>Our judgement is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4. It is certain from the Word of God that God enjoins all believers to exhort, comfort, reprove, and edify one another, Heb. 3:13; 1 Thess. 4:18 &amp; 5:14, but it is from the common duty of charity, and the law of nature that they are thus bound: and therefore the Word which they declare to their neighbours does not by the authority of any special office bind to obedience those that hear it, but by virtue of the subject or matter contained in that Word. But the Church’s ministers declare the Word of God as Christ’s ambassadors, with authority of special office, and power to bind and loose, 1 Cor. 4:1-2; 2 Cor. 5:20; Jn. 20:21-22. There is therefore a many-fold difference between the charitative admonitions of private Christians and the authoritative preaching of God’s ministers. For: 1. The admonitions of ordinary Christians are to our neighbor privately, and as joined to us by the bond of charity and the law of nature: The ministers of churchs do publicly preach the Word of God with pastoral charge of souls, and God’s authority, to the Church, as a Church, over which God has made them watchmen and overseers. 2. The ministers’ authoritative preaching the Word has joined with it the ecclesiastical power of binding and loosing sinners, remitting and retaining sins, Mt. 16:18-19; Jn. 20:21-22, which authority is not affixed to the charitative admonitions of private Christians. 3. There is not so absolute and strict an obligation on private Christians for that brotherly correction which is performed by them, as the obligation on the pastors of the Church of God for their office of preaching, who may not involve themselves in the affairs of this world, to the end that they may wholly attend upon the office of preaching, 2 Tim. 2. 4. and who are in a special manner to give an account of the salvation of their hearers committed to them, Heb. 13:17; Eze. 3:18 &amp; 33:18, which do not concern private Christians in the exercise of charitative admonition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Our judgement is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4. It is certain from the Word of God that God enjoins all believers to exhort, comfort, reprove, and edify one another, Heb. 3:13; 1 Thess. 4:18 &amp; 5:14, but it is from the common duty of charity, and the law of nature that they are thus bound: and therefore the Word which they declare to their neighbours does not by the authority of any special office bind to obedience those that hear it, but by virtue of the subject or matter contained in that Word. But the Church’s ministers declare the Word of God as Christ’s ambassadors, with authority of special office, and power to bind and loose, 1 Cor. 4:1-2; 2 Cor. 5:20; Jn. 20:21-22. There is therefore a many-fold difference between the charitative admonitions of private Christians and the authoritative preaching of God’s ministers. For: 1. The admonitions of ordinary Christians are to our neighbor privately, and as joined to us by the bond of charity and the law of nature: The ministers of churchs do publicly preach the Word of God with pastoral charge of souls, and God’s authority, to the Church, as a Church, over which God has made them watchmen and overseers. 2. The ministers’ authoritative preaching the Word has joined with it the ecclesiastical power of binding and loosing sinners, remitting and retaining sins, Mt. 16:18-19; Jn. 20:21-22, which authority is not affixed to the charitative admonitions of private Christians. 3. There is not so absolute and strict an obligation on private Christians for that brotherly correction which is performed by them, as the obligation on the pastors of the Church of God for their office of preaching, who may not involve themselves in the affairs of this world, to the end that they may wholly attend upon the office of preaching, 2 Tim. 2. 4. and who are in a special manner to give an account of the salvation of their hearers committed to them, Heb. 13:17; Eze. 3:18 &amp; 33:18, which do not concern private Christians in the exercise of charitative admonition.”

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+judgement+is+that+none+may+publicly+in+the+church+assembly+of+the+faithful+preach+the+Word+of+God+in+the+Name+of+Christ+and+of+God%2C+but+he+who+is+sent+by+a+divine+calling+for+that+work%3B+as+the+Protestants+demonstrate+against+the+Socinians+and+Anabaptists+from+Rom.+10%3A14-15%3B+Heb.+5%3A4-5%3B+Acts+13%3A1-2+%26+14%3A22%3B+Tit.+1%3A5%3B+2+Tim.+2%3A2%2C+and+other+places+and+arguments%3B+and+from+the+examples+of+all+those%2C+who+either+in+an+extraordinary+or+ordinary+manner+were+sent+to+preach+the+Word.+Which+mission%2C+or+sending%2C+consists+not+only+in+conferring+gifts%2C+whereby+an+ability%2C+%5BGreek%5D%2C+is+given+by+God%3B+but+in+conferring+a+power%2C+whereby+is+given+an+authority%2C+%5BLatin%5D%2C+to+preach+the+Word+of+God%3B+which+authority+is+oft-times+not+conferred+on+those%2C+on+whom+yet+God+bestows+gifts+and+ability.+For+it+is+by+the+Word+of+God+denied+to+women%2C+in+whose+lips+is+the+Law+of+God%2C+Prov.+31%3A26%2C+and+a+fitness+to+teach+the+yonger+women%2C+Tit.+2%3A3-4.+It+is+certain+from+the+Word+of+God+that+God+enjoins+all+believers+to+exhort%2C+comfort%2C+reprove%2C+and+edify+one+another%2C+Heb.+3%3A13%3B+1+Thess.+4%3A18+%26+5%3A14%2C+but+it+is+from+the+common+duty+of+charity%2C+and+the+law+of+nature+that+they+are+thus+bound%3A+and+therefore+the+Word+which+they+declare+to+their+neighbours+does+not+by+the+authority+of+any+special+office+bind+to+obedience+those+that+hear+it%2C+but+by+virtue+of+the+subject+or+matter+contained+in+that+Word.+But+the+Church%E2%80%99s+ministers+declare+the+Word+of+God+as+Christ%E2%80%99s+ambassadors%2C+with+authority+of+special+office%2C+and+power+to+bind+and+loose%2C+1+Cor.+4%3A1-2%3B+2+Cor.+5%3A20%3B+Jn.+20%3A21-22.+There+is+therefore+a+many-fold+difference+between+the+charitative+admonitions+of+private+Christians+and+the+authoritative+preaching+of+God%E2%80%99s+ministers.+For%3A+1.+The+admonitions+of+ordinary+Christians+are+to+our+neighbor+privately%2C+and+as+joined+to+us+by+the+bond+of+charity+and+the+law+of+nature%3A+The+ministers+of+churchs+do+publicly+preach+the+Word+of+God+with+pastoral+charge+of+souls%2C+and+God%E2%80%99s+authority%2C+to+the+Church%2C+as+a+Church%2C+over+which+God+has+made+them+watchmen+and+overseers.+2.+The+ministers%E2%80%99+authoritative+preaching+the+Word+has+joined+with+it+the+ecclesiastical+power+of+binding+and+loosing+sinners%2C+remitting+and+retaining+sins%2C+Mt.+16%3A18-19%3B+Jn.+20%3A21-22%2C+which+authority+is+not+affixed+to+the+charitative+admonitions+of+private+Christians.+3.+There+is+not+so+absolute+and+strict+an+obligation+on+private+Christians+for+that+brotherly+correction+which+is+performed+by+them%2C+as+the+obligation+on+the+pastors+of+the+Church+of+God+for+their+office+of+preaching%2C+who+may+not+involve+themselves+in+the+affairs+of+this+world%2C+to+the+end+that+they+may+wholly+attend+upon+the+office+of+preaching%2C+2+Tim.+2.+4.+and+who+are+in+a+special+manner+to+give+an+account+of+the+salvation+of+their+hearers+committed+to+them%2C+Heb.+13%3A17%3B+Eze.+3%3A18+%26+33%3A18%2C+which+do+not+concern+private+Christians+in+the+exercise+of+charitative+admonition.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England%2C+Concerning+the+Government+of+the+Church+of+God+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+75-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F091e61afe4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/091e61afe4.html">Permalink</a><a class="src" href="https://reformedbooksonline.co

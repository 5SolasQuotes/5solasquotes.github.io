<main class="wrap"><figure class="quote" id="q-dadc29f0dc" data-kw="">
<blockquote><p>[T]he simplicity of God: he is without all composition, without any parts, not having soul and body, as we have, not being compounded of substance and accident, as we are, but he is simple, without all composition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life Eternal or, A Treatise of the Knowledge of the Divine Essence and Attributes</cite>, (2nd edn, London: Nicholas Bourne, 1631), 2, pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“[T]he simplicity of God: he is without all composition, without any parts, not having soul and body, as we have, not being compounded of substance and accident, as we are, but he is simple, without all composition.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-840df9d4d5" data-kw="">
<blockquote><p>It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God’s Serious &amp; Unfeigned Ardency of Desire that we do what is our Duty’ from Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London 1647), pp. 443-45 (irregular pagination: colophon lll2-lll3) &amp;, pp. 440-42 (colophon: Kkk4-Lll1)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.”

— Samuel Rutherford, ‘God’s Serious &amp; Unfeigned Ardency of Desire that we do what is our Duty’ from Christ Dying &amp; Drawing Sinners to Himself, … (London 1647), pp. 443-45 (irregular pagination: colophon lll2-lll3) &amp;, pp. 440-42 (colophon: Kkk4-Lll1)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt%E2%80%99s+much+worthy+of+observation%2C+how+that+sweet+evangelic+invitation+is+conceived%2C+Isa.+55%3A1%E2%80%A6+For+the+interjection%2C+%E2%80%98Ho%E2%80%99%2C+is+a+mark+of+sorrowing%2C+as+%E2%80%98ah%E2%80%99%2C+or+%E2%80%98woe%2C+everyone+that+thirsts%E2%80%99.+It+expresses+two+things%3A+1.+A+vehemency+and+a+serious+and+unfeigned+ardency+of+desire+that+we+do+what+is+our+duty%2C+and+the+concatenation+of+these+two%2C+extremely+desired+of+God%2C+our+coming+to+Christ+and+our+salvation.+This+moral+connection+between+faith+and+salvation+is+desired+of+God+with+his+will+of+approbation%2C+complacency%2C+and+moral+liking%2C+without+all+dissimulation%2C+most+unfeignedly+%5Bmargin%3A+What+the+revealed+will+of+God+is%5D%3B+%E2%80%A6+%E2%80%A6we+say+with+good+reason+of+God%E2%80%99s+good+will%2C+called+voluntas+signi%2C+it+might+have+its+complete+and+entire+end+and+effect+though+not+any+one+of+men+or+angel+obey%E2%80%A6+We+are+hence+taught+to+acknowledge+no+love+to+be+in+God+which+is+not+effectual+in+doing+good+to+the+creature%3B+there+is+no+lip-love%2C+no+raw+well-wishing+to+the+creature+which+God+does+not+make+good%E2%80%A6+yet+does+not+the+Lord%E2%80%99s+general+love+fall+short+of+what+He+wills+to+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+%E2%80%98God%E2%80%99s+Serious+%26+Unfeigned+Ardency+of+Desire+that+we+do+what+is+our+Duty%E2%80%99+from+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%E2%80%A6+%28London+1647%29%2C+pp.+443-45+%28irregular+pagination%3A+colophon+lll2-lll3%29+%26%2C+pp.+440-42+%28colophon%3A+Kkk4-Lll1%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F840df9d4d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/840df9d4d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-signified-will-or-will-of-sign/#:~:text=It%E2%80%99s%20much%20worthy%20of%20observation%2C%20how,of%20what%20He%20wills%20to%20them&amp;text=It%E2%80%99s%20much%20worthy%20of%20observation%2C%20how%20that%20sweet&amp;text=fall%20short%20of%20what%20He%20wills%20to%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3e5c57f66e" data-kw="">
<blockquote><p>…God, if we speak of his absolute power, without respect to his free decree, He could have pardoned sin without a ransom, and gifted all mankind and fallen angels with heaven, without any satisfaction of either the sinner or his Surety; for He neither punishes sin, nor tenders heaven to men or angels by necessity of nature–as the fire casts out heat, and the sun light—but freely:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: Crooke, 1647), pp. 7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/holiness-and-justice.html">Holiness and Justice</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

</figure><figure class="quote" id="q-a96a7c4a35" data-kw="will necessary free">
<blockquote><p>Does God will some things necessarily and others freely? We affirm. Because good is either uncreated and infinite or finite and created, a twofold object can be assigned to the will: a primary (viz., God) as the infinite good; but the secondary (all created things out of God). Himself, indeed, necessarily by complacency, but all other things freely by decree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.14.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/free-and-necessary-will.html">Free and necessary will</a></span></div>
<div class="actions"><button class="copy" data-copy="“Does God will some things necessarily and others freely? We affirm. Because good is either uncreated and infinite or finite and created, a twofold object can be assigned to the will: a primary (viz., God) as the infinite good; but the secondary (all created things out of God). Himself, indeed, necessarily by complacency, but all other things freely by decree.”

— Francis Turretin, Institutes of Elenctic Theology, 3.14.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDoes%20God%20will%20some%20things%20necessarily%20and%20others%20freely%3F%20We%20affirm.%20Because%20good%20is%20either%20uncreated%20and%20infinite%20or%20finite%20and%20created%2C%20a%20twofold%20object%20can%20be%20assigned%20to%20the%20will%3A%20a%20primary%20%28viz.%2C%20God%29%20as%20the%20infinite%20good%3B%20but%20the%20secondary%20%28all%20created%20things%20out%20of%20God%29.%20Himself%2C%20indeed%2C%20necessarily%20by%20complacency%2C%20but%20all%20other%20things%20freely%20by%20decree.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.14.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa96a7c4a35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a96a7c4a35.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-2de6b7a68d" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 5, ‘The Attributes of God’, section 25 in Reformed Dogmatics, ed. Bizer (1950; Wipf &amp; Stock, 2007), pp. 85-88, p. 88</span></figcaption>

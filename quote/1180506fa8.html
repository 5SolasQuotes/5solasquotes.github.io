<main class="wrap"><figure class="quote" id="q-1180506fa8" data-kw="">
<blockquote><p>XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who since he has been most fully satisfied for us and now intercedes for us in heaven, will then come as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works (Matt 25:31–40). The pious will not hear the publication of their sins, but the reward of their love and benevolence. (3) The gratuitous mercy of Christ does not wish our sins to be remembered anymore, but casts them behind it’s back. Now what God has once wish to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious, from which they ought to be free. For Christ will return for this end—that he may be glorious in his saints and be admired in all believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, Twentieth topic, question six.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a3ce0384e" data-kw="">
<blockquote><p>The Reformed–deny the necessity of good works for obtaining the right to eternal life. Indeed if done with this intention they say that in consequence they are actually evil and pernicious. But they declare that they are necessary by divine prescript for receiving possession of life, as conditions without which God refuses to bestow salvation upon us.” – trans. Heinrich Heppe, Reformed Dogmatics (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580 Vitringa, Sr., Campegius – ‘Of the Necessity of Good Works’, theses 20-24, pp. 358-73 in Ch. 17, ‘Of Sanctification, Good Works &amp; the Perseverance of the Saints’ in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 3 (d. 1722) Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition…</p></blockquote>

</figure><figure class="quote" id="q-93e1437b17" data-kw="">
<blockquote><p>I grant that the works of regeneration are necessary unto eternal life promised in the gospel, but not as merits or meritorious causes, but as the means and way wherein we are to proceed on from justification and regeneration unto glory and life eternal. They may also be said to be causes, after a sort, for they please God in Christ, and in some respects move Him, but not as merits, but as effects of the only merit of Jesus Christ, whereof they testify.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 41-45 of ch. 3 of A Treatise of our Effectual Calling in Select Works of Robert Rollock, vol. 1 (Wodrow Society, 1844)</cite></span></figcaption>

</figure><figure class="quote" id="q-475892f890" data-kw="">
<blockquote><p>We are not enemies to good works (as our adversaries falsely charge us), nay we preach good works, we exhort to good works, we establish good works, teaching the right use of them out of the Word of God: which is not to concur, or be joined with faith in our justification, but to follow necessarily and issue out of faith, as lively testimonies thereof, to the glory of God, the example of others, and our comfort…</p></blockquote>

</figure><figure class="quote" id="q-b9de188dcd" data-kw="">
<blockquote><p>For I admit not the distinction laid down by otherwise learned and pious men, that good works merit the favors which are conferred upon us in this life, whereas eternal life is the reward of faith only. … Therefore, every help to salvation bestowed upon believers, and blessedness itself, are entirely the gift of God, and yet in both the Lord testifies that he takes account of works, since to manifest the greatness of his love toward us, he thus highly honors not ourselves only, but the gifts, which he has bestowed upon us.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0150883e5c" data-kw="">
<blockquote><p>…those who are not contented with His voice, but seek His visible form, substitute imaginations and phantoms in His place. But here arises a difficult question, for God made Himself known to the patriarchs in other ways besides by His voice alone; thus Abraham, Isaac and Jacob knew Him not only by hearing, but by sight. Moses himself saw Him in the midst of the burning bush; and He also manifested Himself to the prophets under visible figures…. And yet God was not forgetful of Himself when He thus presented Himself to the sight of His servants. Wherefore, this argument does not appear to be valid and good, that it is sinful to represent God in a visible image, because His voice was once heard without His being seen [Dt. 4:15-16]; when, on the other side, it is easy to object that visible forms have often been exhibited, wherein He testified His presence. The solution is twofold: first, that, although God may have invested Himself in certain forms for the purpose of manifesting Himself, this must be accounted as a peculiar circumstance, and not be taken as a general rule;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 4 | verse 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b07f9bac9e" data-kw="">
<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Instruction into Christian Religion</cite>, (London: 1548), A Short Instruction Concerning the Ten Commandments, First Sermon, no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

tures%20which%20declare&amp;text=into%20the%20church%20by%20the%20occasion%20of%20images" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5f6717e9f4" data-kw="">
<blockquote><p>The worst men and the most superstitious will yet pretend the honoring of God. So it is again in regard of those days that men have set apart for God, and it is that which has settled men in the superstitious observation of them, that it is for the honor of Christ. ‘What’ (say they) ‘shall we not honor the birth of our blessed Savior?’ What a profaness, what a disrespect is this unto Jesus Christ? ‘Well let others do what they will, for our parts we will do it, for hereby we shall do honor unto our blessed Savior.’ So the Papists for the adoration of images, say they, ‘What not regard, not to reverence the image the picture of our blessed Savior and of the holy saints?’ And the truth is if it be duly weighed, there is the same reason of images of Christ and the saints, and of days set apart for the honor of Christ by man’s invention; and there is as fair a pretence of honoring Christ by setting up his image before me to put me in mind of Him as of honoring of Him by keeping a day of mine own appointment. There is (I say) the same reason of both, and whatsoever argument any man shall bring me against the one, I dare undertake to make it good to be against the other. As now, is not natural reason as strong to set up the picture of the King to honor him (and you do it for that end) is not this as much as to keep a day once a year to remember him? So the reason may be as strong to honor Christ by way of picture as to honor Him by observing any day set apart for that end by the inventions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, … (London: Cole, 1650), on Hos. 5:6, pp. 408-9</span></figcaption>

<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.”

— French Reformed, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren, p. 297">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+The+Province+of+Burgundy+demanding%2C+Whether+the+faithful+of+the+Augustane+%5BAugsburg%5D+Confession+might+be+permitted+to+contract+marriages+in+our+Churches%2C+and+to+present+children+in+our+churches+unto+baptism%2C+without+a+precedaneous+abjuration+of+those+opinions+held+by+them%2C+contrary+to+the+belief+of+our+churches%3F+This+synod+declares+that+inasmuch+as+the+Churches+of+the+Confession+of+Ausbourg+do+agree+with+the+other+Reformed+Churches+in+the+principal+and+fundamental+Points+of+the+True+Religion%2C+and+that+there+is+neither+superstition+nor+idolatry+in+their+worship%2C+the+faithful+of+the+said+Confession%2C+who+with+a+spirit+of+love+and+peaceableness+do+join+themselves+to+the+communion+of+our+churches+in+this+kingdom%2C+may+be%2C+without+any+abjuration+at+all+made+by+them%2C+admitted+unto+the+Lord%E2%80%99s+Table+with+us%3B+and+as+sureties+may+present+children+unto+baptism%2C+they+promising+the+consistory+that+they+will+never+solicit+them%2C+either+directly+or+indirectly%2C+to+transgress+the+doctrine+believed+and+professed+in+our+Churches%2C+but+will+be+content+to+instruct+and+educate+them+in+those+points+and+articles+which+are+in+common+between+us+and+them%2C+and+wherein+both+the+Lutherans+and+we+are+unanimously+agreed.%E2%80%9D%0A%0A%E2%80%94+French+Reformed%2C+ed.+John+Quick%2CSynodicon+in+Gallia+reformata%2C+or%2C+The+Acts%2C+Decisions%2C+Decrees+%26+Canons+of+those+Famous+National+Councils+of+the+Reformed+Churches+in+France+%28London%3A+Parkhurst%2C+1692%29%2C+Ch.+22%2C+An+Act+in+favor+of+the+Lutheran+Brethren%2C+p.+297&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe627d178b5.html&amp;via=5Solas" target="

<main class="wrap"><figure class="quote" id="q-062119f733" data-kw="">
<blockquote><p>The Socinian doctrine of Jesus dying as a holy martyr, sealing his doctrine with his blood, will that remove the scandal? Nay: it blasphemes the character of God and shocks the conscience of man.

Was the righteous overruling God, the judge of all, evoking merely a martyr’s testimony, when he awoke all legal and official powers in Jerusalem to serve the ends of his “determinate counsel,” and put the case against Jesus into legal shape, and follow it out from first to last in all due legal form? God forbid.

Or will the Arminian notion of Jesus dying in some sense, and in the same sense, for all men?—that is, when rightly sifted and examined, merely in some sense for the good of men, so that now all men can make better terms with God or have another chance of escaping hell,—an opportunity, through a relaxed or softened covenant, to save themselves. That also is very far from removing this grievous scandal or explaining this most offensive exhibition.

There must be an explanation that will gloriously vindicate the justice of God in so pursuing and prosecuting legally the man of sorrows. There must be an explanation which will not merely vindicate the character of God, in the sense of showing that this process or prosecution which the divine “determinate counsel” carried on, is no impeachment of the divine justice, but that it involves an illustrious instance and forthgoing of this divine justice. There must be an explanation which will even swallow up the scandal in glory, and make the very offence of the cross a fountain and a revelation of high moral excellence and triumph, not only not the eclipse, but the victory of righteousness.

The doctrine which thus at once vindicates the personal innocence of Jesus and the public righteousness of God, and transforms the scandal into glory, and the shame into moral loveliness, is the suretyship and substitution of Jesus in the room of his people, with the imputation to him, thereon, of his people’s transgressions. Accordingly, for this very reason—the Holy Ghost signifying this very truth— both at the commencement and at the close of this criminal process, the imputation of sin to Jesus is announced as the satisfactory and sufficient explanation of the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Calvary: Gethsemane – The Arrest – The Trial</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 134-35.</span></figcaption>

<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways:

I. As God.

II. As Judge of the World.

III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>

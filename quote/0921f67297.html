<main class="wrap"><figure class="quote" id="q-0921f67297" data-kw="">
<blockquote><p>There is one God, whom we do not otherwise acknowledge, brethren, but out of the holy Scriptures. For as he that would profess the wisdom of this world cannot otherwise attain hereunto, unless he read the doctrine of the philosophers; so whosoever of us will exercise piety toward God, cannot learn this elsewhere but out of the holy Scriptures. Whatsoever therefore the Holy Scriptures preach, let us know; and whatsoever they teach, let us understand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus.html">Hippolytus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>tome 3, Bibliotheca. Pat.</cite>, pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship… (London: Maxwell, 1682), p. 5 Stoddon was an English, congregationalist minister.</cite></span></figcaption>

<blockquote><p>Therefore, as I have already said, He caused man (human nature) to cleave to and to become, one with God. For unless man had overcome the enemy of man, the enemy would not have been legitimately vanquished. And again: unless it had been God who had freely given salvation, we could never have possessed it securely. And unless man had been joined to God, he could never have become a partaker of incorruptibility. For it was incumbent upon the Mediator between God and men, by His relationship to both, to bring both to friendship and concord, and present man to God, while He revealed God to man.

For, in what way could we be partaken of the adoption of sons, unless we had received from Him through the Son that fellowship which refers to Himself, unless His Word, having been made flesh, had entered into communion with us? Wherefore also He passed through every stage of life, restoring to all communion with God. Those, therefore, who assert that He appeared putatively, and was neither born in the flesh nor truly made man, are as yet under the old condemnation, holding out patronage to sin; for, by their showing, death has not been vanquished, which “reigned from Adam to Moses, even over them that had not sinned after the similitude of Adam’s transgression.”

But the law coming, which was given by Moses, and testifying of sin that it is a sinner, did truly take away his (death’s) kingdom, showing that he was no king, but a robber; and it revealed him as a murderer. It laid, however, a weighty burden upon man, who had sin in himself, showing that he was liable to death. For as the law was spiritual, it merely made sin to stand out in relief, but did not destroy it. For sin had no dominion over the spirit, but over man.

For it behoved Him who was to destroy sin, and redeem man under the power of death, that He should Himself be made that very same thing which he was, that is, man; who had been drawn by sin into bondage, but was held by death, so that sin should be destroyed by man, and man should go forth from death. For as by the disobedience of the one man who was originally moulded from virgin soil, the many were made sinners, and forfeited life; so was it necessary that, by the obedience of one man, who was originally born from a virgin, many should be justified and receive salvation.

Thus, then, was the Word of God made man, as also Moses says: “God, true are His works.” But if, not having been made flesh, He did appear as if flesh, His work was not a true one. But what He did appear, that He also was: God recapitulated in Himself the ancient formation of man, that He might kill sin, deprive death of its power, and vivify man; and therefore His works are true.</p></blockquote>

<blockquote><p>The same multiplication of relics has prevailed in the case of Anthony. By pretending that he is passionate and mischievous, and inflames those who may have given him offence, they have made him an object of dread; from this dread has arisen a superstitious desire to possess his body, and so have a security against harm. Accordingly, the city of Arles had a keen and tedious litigation on the subject with the monks of St Anthony at Vienne. The result was just that which usually takes place in controversies of this description; that is, the whole matter still remains in darkness. Indeed, had any thing been actually proved on the subject, and the truth been made manifest, it would not have been to the advantage of either party. To these two bodies they have added a knee, which is in the Vivarais, in the possession of the Augustins; besides various members which exist at Bourges, Mascon, Dijon, Chalons, Ovron, and Besançon, and others, which are everywhere hawked about by travelling impostors. Of these the number is not small. See what it is to get a name for doing mischief. But for this, that good saint would still be in his tomb, or, at least, concealed in some corner. I have omitted St Petronilla, Peter’s daughter, whose entire body is in the church dedicated to her father, besides some separate remains in the church of Saint Barbara; nevertheless, another body is in the possession of the people of La Maine, in the monastery of the Dominicans, and is held in the very highest repute, because alleged to cure fever. As there were various saints of the name of Susanna, I cannot say whether they have thought proper to give two bodies to any one of them. There is one body of a Susanna at Rome, in the church which bears her name, and there is another at Toulouse. Helen has not been so highly favoured. The Venetians have the body, but in addition to it, she has not gained any superfluous part, with the exception of another head which exists at Cologne in the church of Grisgon. In this respect St Ursula has the advantage of her. For, first, she has her body in the church of St John the Angel; then she has one head at Cologne, and part of another with the Dominicans of La Maine, as also the Dominicans of Tours, and at Bergers. Of her companions, to whom they give the name of the Eleven Thousand Virgins, whatever may be thought, it must, at least, be admitted, that by feigning them to be so numerous, they have enabled themselves to lie with greater freedom. Beside the bones which are at Cologne, and which would be quite sufficient to load an hundred waggons, there is scarcely a city in Europe which does not possess them as the ornament of one or more of their churches. Were I to take a survey of the common herd of saints, I should get entangled in a forest out of which I should never be able to escape. It will be sufficient, therefore, to adduce some specimens, from which a judgment may be formed in regard to the rest. There are two churches in Poictou which contend for the body of Hilary, viz., the cathedral church dedicated to him, and that of the Monks at Selle. The controversy is at present awaiting the visitation which is to take place. In the interval, the idolaters will be forced to worship two bodies as those of the same individual; whereas true believers, feeling no anxiety whatever about his body, will allow it to rest, be it where it may. The body of St Honoratus is at Arles, and is also in the Island of Lerins near Antiboul. Ægidius has one of his bodies at Toulouse, and another in a town at Aquitaine, which is named after him. William is in a monastery of Aquitaine, which is called St William in the Desert, and also in a town of Holstein, which is called Ecrichum, where also his head exists separately, although he has also another head in the suburb of Tours, among the Williamites. What shall I say of Symphorianus, whose body and bones exist in so many places? Also of Lupus, which is at Auxerre, at Sienna, at Lyons, and which they have also pretended to be at Geneva? What likewise shall I say of Ferreolus, whose whole body is at Uzes in Aquitaine, and also at Brioude in Auvergne? Not to betray their lies so openly, they ought, at least, to enter into an arrangement, as the monks of Treves have done, as to their dispute with those of Lodi about the head of Lambert. They have agreed as to the offerings, by compounding, for a certain sum of money, with this condition, however, that the body possessed by the former shall not be publicly exhibited, lest suspicion might be excited by both being seen in two cities so near each other. Thus it is, as I mentioned before at the outset; they never supposed that any observer would appear who would ever dare to open his lips in exposure of such impudence. But any one may ask, how have these fabricators of relics omitted the many notable things connected with the Old Dispensation, since, without any regard to reason, they have heaped up all that ever came into their mind, and, as it were with a breath, called into existence whatever they pleased? To this question I can give no other answer than that they did not think it worth their while, because they had no prospect of deriving much advantage from such relics; and yet they have not forgotten them entirely, for at Rome they gave out that they have the bones of Abraham, Isaac, and Jacob, in the church of Mary supra Minerva. They also boast that in the church of Joannes Lateranensis they have the ark of the covenant and Aaron’s rod within it. The same rod, however, is at Paris in the Holy Chapel, while some fragment of it also is in St Salvator’s in Spain. I omit the inhabitants of Bourdeaux, who maintain that the rod of St Martial, which is exhibited in the church of Severinus, is the identical rod of Aaron. It would seem that they had wished to perform a new miracle as in rivalship of God; for whereas He, by his power, turned the rod into a serpent, so they have now turned it into three rods. Very probably they have many other toys of the same description, but let it suffice merely to have mentioned this, in order to make it manifest that they have been as honest here as in other matters. Now, I would entreat my readers to remember what I said at the outset, viz., that I have not searchers at hand to examine the sacraria of all the regions which I have here mentioned. Wherefore, what I have said of relics must not be taken as if it were a perfect inventory of all the things which might be discovered. I have mentioned only six German cities, or thereabouts, three, as far as I know, of Spain, fifteen of Italy, and between thirty or forty of France; nor am I even acquainted with all the relics that are in them. Let every one, therefore, consider with himself what a farrago there would be if we saw the multitude of relics existing throughout the world described in order, or only in the regions which are known to us, or in which we live. For it is to be particularly observed, that all the relics of Christ and the Apostles exhibited in Europe exist also in Greece, Asia, and other countries where Christian churches are found. Now, I ask, when the Christians of the Eastern Church say that all these things which we pretend to have are in their possession, what decision can we come to upon the subject? If, in answer to them, we aver that this body was brought thither by merchants—that one by monks—and that other by a bishop—that part of the crown of thorns was sent by the Emperor of Constantinople to the King of France—that another was obtained in war—and so on of each, they will laugh and shake their heads. How will the controversy be decided? In doubtful matters we must trust to conjecture, and, therefore, in this respect, they will always get the better of us. For what they produce in their behalf is much more probable than what we can produce in ours. Those who defend relics have certainly a very difficult knot to loose. To draw to a conclusion, I beseech my readers, in the name of God, to give heed to the truth while it lies plainly before them, and recognise how Divine Providence has wonderfully provided, that those who thus wished to mislead the meanest of the people have been so blind that they never thought of using a cloak for their lies, but moving blindfolded, like the Midianites, have set about slaughtering one another. As we see how they are still warring among themselves, and charging each other with falsehood, every man, who is not obstinately determined against the truth, though he may not yet clearly perceive that the worship of any relics, of whatever kind they be, whether genuine or spurious, is execrable idolatry, yet seeing how clear their falsehood is, will have no desire to kiss them any more, and whatever reverence they may have previously inspired, will cease to have any relish for them. The best thing, indeed, would be, as I mentioned at the outset, if, among us who profess the name of Christ, this heathenish custom were abolished, whether they be relics of Christ or of the saints. In as much as they do degenerate into idols, the pollution and defilement which they occasion ought not on any account to be tolerated in the Church. This we have already demonstrated, both by argument and by the testimony of Scripture. If any one is not satisfied with this, let him look to the manner and practice of the ancient fathers, and conform to their example. Many patriarchs, prophets, kings, and other faithful worshippers, existed under the Old Testament. More ceremonies were then appointed by God than it becomes us to observe in the present day. Nay, even burial itself required more show than it now does, because by its figures it represented the resurrection, which was not so clearly revealed to them as it has been to us. But do we read that the saints were ever dug out of their graves, in order that they might be converted into a kind of puppets for children? Was Abraham, the father of all the faithful, thus carried in state, or was Sarah, a princess in the Church of God, taken out of her coffin? Were they not left in quiet along with the other saints, and was not the body of Moses so concealed, by the express will of God, that it never could be discovered? Did not Satan, as Jude tells us, contend for it with the angels? The Lord then withdrew it from the sight of men, and the devil tried to bring it back. God confessedly took it away, in order that it might not become an occasion of idolatry to the Jewish people; and the devil would have brought it back, that he might make it an occasion of idolatry. But that people, it will perhaps be said, was prone to superstition; and what, pray, are we? Is there not in this respect greater perversity among Christians than there was among the Jews? And what do we find to have been the practice of the ancient Church? The faithful, it is true, always exerted themselves to rescue the bodies of martyrs, and prevent their being torn by wild beasts and ravenous birds, so as to secure for them an honourable burial. This they did in the case of John the Baptist and Stephen. They did it, however, for the purpose of committing them to the earth, that they might there rest till the resurrection—not that they might be brought forward into public view in order that all might prostrate themselves before them. This unhappy pomp of consecrating was never introduced into the Church until all things were subverted, and, as it were, profaned, partly by the stupidity or avarice of some prelates and pastors, and partly by the inability of others to withstand a practice which had already begun to prevail. Nay, even the people themselves courted deception, by giving their mind to mere frivolities rather than to the pure worship of God. Wherefore, if a complete reformation of this corrupt practice is desired, it will be necessary to begin at the very foundation, and abolish a practice which was at first instituted improperly, and against all reason. But if any one is not able at one step to make such an advance towards true understanding, let him at least proceed gradually. And, in the first place, let him open his eyes, and exercise his judgment upon any relics which may be presented to him. No one inclined to make the attempt will find it at all difficult; for among the many transparent lies, such as those to which I have already adverted, where will any relics be found whose genuineness amounts to anything like certainty? Nay, at the very time when this little book was passing through the press, I was informed of a third prepuce, which I had not mentioned, and which is shown at Hildesheim. The number of similar follies is indeed infinite, and a careful inspection would discover more than it is possible to enumerate. Let every one, then, be on his guard, and not allow himself to be led along like an irrational animal, and as if he were incapable of discerning any way or path by which he might be guided safely. I recollect when I was a boy how they were wont to do with the images of our parish. When the feast of Stephen drew near, they adorned them all alike with garlands and necklaces, just decking the murderers who stoned Stephen in the same way as they decked Stephen himself. When the old women saw the murderers thus adorned, they imagined that they were Stephen’s companions. Accordingly, every one was presented with his candle. Nay, the same honour was conferred on the devil who contended with Michael, and so on with the rest. And so completely, are they all mixed up and huddled together, that it is impossible to have the bones of any martyr without running the risk of worshipping the bones of some thief or robber, or, it may be, the bones of a dog, or a horse, or an ass. Nor can the Virgin Mary’s ring, or comb, or girdle, be venerated without the risk of venerating some part of the dress of a strumpet. Let every one, therefore, who is inclined, guard against this risk. Henceforth no man will be able to excuse himself by pretending ignorance. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 334–341. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.</p></blockquote>

r head which exists at Cologne in the church of Grisgon. In this respect St Ursula has the advantage of her. For, first, she has her body in the church of St John the Angel; then she has one head at Cologne, and part of another with the Dominicans of La Maine, as also the Dominicans of Tours, and at Bergers. Of her companions, to whom they give the name of the Eleven Thousand Virgins, whatever may be thought, it must, at least, be admitted, that by feigning them to be so numerous, they have enabled themselves to lie with greater freedom. Beside the bones which are at Cologne, and which would be quite sufficient to load an hundred waggons, there is scarcely a city in Europe which does not possess them as the ornament of one or more of their churches. Were I to take a survey of the common herd of saints, I should get entangled in a forest out of which I should never be able to escape. It will be sufficient, therefore, to adduce some specimens, from which a judgment may be formed in regard to the rest. There are two churches in Poictou which contend for the body of Hilary, viz., the cathedral church dedicated to him, and that of the Monks at Selle. The controversy is at present awaiting the visitation which is to take place. In the interval, the idolaters will be forced to worship two bodies as those of the same individual; whereas true believers, feeling no anxiety whatever about his body, will allow it to rest, be it where it may. The body of St Honoratus is at Arles, and is also in the Island of Lerins near Antiboul. Ægidius has one of his bodies at Toulouse, and another in a town at Aquitaine, which is named after him. William is in a monastery of Aquitaine, which is called St William in the Desert, and also in a town of Holstein, which is called Ecrichum, where also his head exists separately, although he has also another head in the suburb of Tours, among the Williamites. What shall I say of Symphorianus, whose body and bones exist in so many places? Also of Lupus, which is at Auxerre, at Sienna, at Lyons, and which they have also pretended to be at Geneva? What likewise shall I say of Ferreolus, whose whole body is at Uzes in Aquitaine, and also at Brioude in Auvergne? Not to betray their lies so openly, they ought, at least, to enter into an arrangement, as the monks of Treves have done, as to their dispute with those of Lodi about the head of Lambert. They have agreed as to the offerings, by compounding, for a certain sum of money, with this condition, however, that the body possessed by the former shall not be publicly exhibited, lest suspicion might be excited by both being seen in two cities so near each other. Thus it is, as I mentioned before at the outset; they never supposed that any observer would appear who would ever dare to open his lips in exposure of such impudence. But any one may ask, how have these fabricators of relics omitted the many notable things connected with the Old Dispensation, since, without any regard to reason, they have heaped up all that ever came into their mind, and, as it were with a breath, called into existence whatever they pleased? To this question I can give no other answer than that they did not think it worth their while, because they had no prospect of deriving much advantage from such relics; and yet they have not forgotten them entirely, for at Rome they gave out that they have the bones of Abraham, Isaac, and Jacob, in the church of Mary supra Minerva. They also boast that in the church of Joannes Lateranensis they have the ark of the covenant and Aaron’s rod within it. The same rod, however, is at Paris in the Holy Chapel, while some fragment of it also is in St Salvator’s in Spain. I omit the inhabitants of Bourdeaux, who maintain that the rod of St Martial, which is exhibited in the church of Severinus, is the identical rod of Aaron. It would seem that they had wished to perform a new miracle as in rivalship of God; for whereas He, by his power, turned the rod into a serpent, so they have now turned it into three rods. Very probably they have many other toys of the same description, but let it suffice merely to have mentioned this, in order to make it manifest that they have been as honest here as in other matters. Now, I would entreat my readers to remember what I said at the outset, viz., that I have not searchers at hand to examine the sacraria of all the regions which I have here mentioned. Wherefore, what I have said of relics must not be taken as if it were a perfect inventory of all the things which might be discovered. I have mentioned only six German cities, or thereabouts, three, as far as I know, of Spain, fifteen of Italy, and between thirty or forty of France; nor am I even acquainted with all the relics that are in them. Let every one, therefore, consider with himself what a farrago there would be if we saw the multitude of relics existing throughout the world described in order, or only in the regions which are known to us, or in which we live. For it is to be particularly observed, that all the relics of Christ and the Apostles exhibited in Europe exist also in Greece, Asia, and other countries where Christian churches are found. Now, I ask, when the Christians of the Eastern Church say that all these things which we pretend to have are in their possession, what decision can we come to upon the subject? If, in answer to them, we aver that this body was brought thither by merchants—that one by monks—and that other by a bishop—that part of the crown of thorns was sent by the Emperor of Constantinople to the King of France—that another was obtained in war—and so on of each, they will laugh and shake their heads. How will the controversy be decided? In doubtful matters we must trust to conjecture, and, therefore, in this respect, they will always get the better of us. For what they produce in their behalf is much more probable than what we can produce in ours. Those who defend relics have certainly a very difficult knot to loose. To draw to a conclusion, I beseech my readers, in the name of God, to give heed to the truth while it lies plainly before them, and recognise how Divine Providence has wonderfully provided, that those who thus wished to mislead the meanest of the people have been so blind that they never thought of using a cloak for their lies, but moving blindfolded, like the Midianites, have set about slaughtering one another. As we see how they are still warring among themselves, and charging each other with falsehood, every man, who is not obstinately determined against the truth, though he may not yet clearly perceive that the worship of any relics, of whatever kind they be, whether genuine or spurious, is execrable idolatry, yet seeing how clear their falsehood is, will have no desire to kiss them any more, and whatever reverence they may have previously inspired, will cease to have any relish for them. The best thing, indeed, would be, as I mentioned at the outset, if, among us who profess the name of Christ, this heathenish custom were abolished, whether they be relics of Christ or of the saints. In as much as they do degenerate into idols, the pollution and defilement which they occasion ought not on any account to be tolerated in the Church. This we have already demonstrated, both by argument and by the testimony of Scripture. If any one is not satisfied with this, let him look to the manner and practice of the ancient fathers, and conform to their example. Many patriarchs, prophets, kings, and other faithful worshippers, existed under the Old Testament. More ceremonies were then appointed by God than it becomes us to observe in the present day. Nay, even burial itself required more show than it now does, because by its figures it represented the resurrection, which was not so clearly revealed to them as it has been to us. But do we read that the saints were ever dug out of their graves, in order that they might be converted into a kind of puppets for children? Was Abraham, the father of all the faithful, thus carried in state, or was Sarah, a princess in the Church of God, taken out of her coffin? Were they not left in quiet along with the other saints, and was not the body of Moses so concealed, by the express will of God, that it never could be discovered? Did not Satan, as Jude tells us, contend for it with the angels? The Lord then withdrew it from the sight of men, and the devil tried to bring it back. God confessedly took it away, in order that it might not become an occasion of idolatry to the Jewish people; and the devil would have brought it back, that he might make it an occasion of idolatry. But that people, it will perhaps be said, was prone to superstition; and what, pray, are we? Is there not in this respect greater perversity among Christians than there was among the Jews? And what do we find to have been the practice of the ancient Church? The faithful, it is true, always exerted themselves to rescue the bodies of martyrs, and prevent their being torn by wild beasts and ravenous birds, so as to secure for them an honourable burial. This they did in the case of John the Baptist and Stephen. They did it, however, for the purpose of committing them to the earth, that they might there rest till the resurrection—not that they might be brought forward into public view in order that all might prostrate themselves before them. This unhappy pomp of consecrating was never introduced into the Church until all things were subverted, and, as it were, profaned, partly by the stupidity or avarice of some prelates and pastors, and partly by the inability of others to withstand a practice which had already begun to prevail. Nay, even the people themselves courted deception, by giving their mind to mere frivolities rather than to the pure worship of God. Wherefore, if a complete reformation of this corrupt practice is desired, it will be necessary to begin at the very foundation, and abolish a practice which was at first instituted improperly, and against all reason. But if any one is not able at one step to make such an advance towards true understanding, let him at least proceed gradually. And, in the first place, let him open his eyes, and exercise his judgment upon any relics which may be presented to him. No one inclined to make the attempt will find it at all difficult; for among the many transparent lies, such as those to which I have already adverted, where will any relics be found whose genuineness amounts to anything like certainty? Nay, at the very time when this little book was passing through the press, I was informed of a third prepuce, which I had not mentioned, and which is shown at Hildesheim. The number of similar follies is indeed infinite, and a careful inspection would discover more than it is possible to enumerate. Let every one, then, be on his guard, and not allow himself to be led along like an irrational animal, and as if he were incapable of discerning any way or path by which he might be guided safely. I recollect when I was a boy how they were wont to do with the images of our parish. When the feast of Stephen drew near, they adorned them all alike with garlands and necklaces, just decking the murderers who stoned Stephen in the same way as they decked Stephen himself. When the old women saw the murderers thus adorned, they imagined that they were Stephen’s companions. Accordingly, every one was presented with his candle. Nay, the same honour was conferred on the devil who contended with Michael, and so on with the rest. And so completely, are they all mixed up and huddled together, that it is impossible to have the bones of any martyr without running the risk of worshipping the bones of some thief or robber, or, it may be, the bones of a dog, or a horse, or an ass. Nor can the Virgin Mary’s ring, or comb, or girdle, be venerated without the risk of venerating some part of the dress of a strumpet. Let every one, therefore, who is inclined, guard against this risk. Henceforth no man will be able to excuse himself by pretending ignorance. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 334–341. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.”

— John Calvin, An Admonition Showing the Advantages Which Christendom Might Derive From an Inventory of Relics, Vol. 1 | Edinburgh: Calvin Translation Society, 1844, pp. 334–41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+same+multiplication+of+relics+has+prevailed+in+the+case+of+Anthony.+By+pretending+that+he+is+passionate+and+mischievous%2C+and+inflames+those+who+may+have+given+him+offence%2C+they+have+made+him+an+object+of+dread%3B+from+this+dread+has+arisen+a+superstitious+desire+to+possess+his+body%2C+and+so+have+a+security+against+harm.+Accordingly%2C+the+city+of+Arles+had+a+keen+and+tedious+litigation+on+the+subject+with+the+monks+of+St+Anthony+at+Vienne.+The+result+was+just+that+which+usually+takes+place+in+controversies+of+this+description%3B+that+is%2C+the+whole+matter+still+remains+in+darkness.+Indeed%2C+had+any+thing+been+actually+proved+on+the+subject%2C+and+the+truth+been+made+manifest%2C+it+would+not+have+been+to+the+advantage+of+either+party.+To+these+two+bodies+they+have+added+a+knee%2C+which+is+in+the+Vivarais%2C+in+the+possession+of+the+Augustins%3B+besides+various+members+which+exist+at+Bourges%2C+Mascon%2C+Dijon%2C+Chalons%2C+Ovron%2C+and+Besan%C3%A7on%2C+and+others%2C+which+are+everywhere+hawked+about+by+travelling+impostors.+Of+these+the+number+is+not+small.+See+what+it+is+to+get+a+name+for+doing+mischief.+But+for+this%2C+that+good+saint+would+still+be+in+his+tomb%2C+or%2C+at+least%2C+concealed+in+some+corner.+I+have+omitted+St+Petronilla%2C+Peter%E2%80%99s+daughter%2C+whose+entire+body+is+in+the+church+dedicated+to+her+father%2C+besides+some+separate+remains+in+the+church+of+Saint+Barbara%3B+nevertheless%2C+another+body+is+in+the+possession+of+the+people+of+La+Maine%2C+in+the+monastery+of+the+Dominicans%2C+and+is+held+in+the+very+highest+repute%2C+because+alleged+to+cure+fever.+As+there+were+various+saints+of+the+name+of+Susanna%2C+I+cannot+say+whether+they+have+thought+proper+to+give+two+bodies+to+any+one+of+them.+There+is+one+body+of+a+Susanna+at+Rome%2C+in+the+church+which+bears+her+name%2C+and+there+is+another+at+Toulouse.+Helen+has+not+been+so+highly+favoured.+The+Venetians+have+the+body%2C+but+in+addition+to+it%2C+she+has+not+gained+any+superfluous+part%2C+with+the+exception+of+another+head+which+exists+at+Cologne+in+the+church+of+Grisgon.+In+this+respect+St+Ursula+has+the+advantage+of+her.+For%2C+first%2C+she+has+her+body+in+the+church+of+St+John+the+Angel%3B+then+she+has+one+head+at+Cologne%2C+and+part+of+another+with+the+Dominicans+of+La+Maine%2C+as+also+the+Dominicans+of+Tours%2C+and+at+Bergers.+Of+her+companions%2C+to+whom+they+give+the+name+of+the+Eleven+Thousand+Virgins%2C+whatever+may+be+thought%2C+it+must%2C+at+least%2C+be+admitted%2C+that+by+feigning+them+to+be+so+numerous%2C+they+have+enabled+themselves+to+lie+with+greater+freedom.+Beside+the+bones+which+are+at+Cologne%2C+and+which+would+be+quite+sufficient+to+load+an+hundred+waggons%2C+there+is+scarcely+a+city+in+Europe+which+does+not+possess+them+as+the+ornament+of+one+or+more+of+their+churches.+Were+I+to+take+a+survey+of+the+common+herd+of+saints%2C+I+should+get+entangled+in+a+forest+out+of+which+I+should+never+be+able+to+escape.+It+will+be+sufficient%2C+therefore%2C+to+adduce+some+specimens%2C+from+which+a+judgment+may+be+formed+in+regard+to+the+rest.+There+are+two+churches+in+Poictou+which+contend+for+the+body+of+Hilary%2C+viz.%2C+the+cathedral+church+dedicated+to+him%2C+and+that+of+the+Monks+at+Selle.+The+controversy+is+at+present+awaiting+the+visitation+which+is+to+take+place.+In+the+interval%2C+the+idolaters+will+be+forced+to+worship+two+bodies+as+those+of+the+same+individual%3B+whereas+true+believers%2C+feeling+no+anxiety+whatever+about+his+body%2C+will+allow+it+to+rest%2C+be+it+where+it+may.+The+body+of+St+Honoratus+is+at+Arles%2C+and+is+also+in+the+Island+of+Lerins+near+Antiboul.+%C3%86gidius+has+one+of+his+bodies+at+Toulouse%2C+and+another+in+a+town+at+Aquitaine%2C+which+is+named+after+him.+William+is+in+a+monastery+of+Aquitaine%2C+which+is+called+St+William+in+the+Desert%2C+and+also+in+a+town+of+Holstein%2C+which+is+called+Ecrichum%2C+where+also+his+head+exists+separately%2C+although+he+has+also+another+head+in+the+suburb+of+Tours%2C+among+the+Williamites.+What+shall+I+say+of+Symphorianus%2C+whose+body+and+bones+exist+in+so+many+places%3F+Also+of+Lupus%2C+which+is+at+Auxerre%2C+at+Sienna%2C+at+Lyons%2C+and+which+they+have+also+pretended+to+be+at+Geneva%3F+What+likewise+shall+I+say+of+Ferreolus%2C+whose+whole+body+is+at+Uzes+in+Aquitaine%2C+and+also+at+Brioude+in+Auvergne%3F+Not+to+betray+their+lies+so+openly%2C+they+ought%2C+at+least%2C+to+enter+into+an+arrangement%2C+as+the+monks+of+Treves+have+done%2C+as+to+their+dispute+with+those+of+Lodi+about+the+head+of+Lambert.+They+have+agreed+as+to+the+offerings%2C+by+compounding%2C+for+a+certain+sum+of+money%2C+with+this+condition%2C+however%2C+that+the+body+possessed+by+the+former+shall+not+be+publicly+exhibited%2C+lest+suspicion+might+be+excited+by+both+being+seen+in+two+cities+so+near+each+other.+Thus+it+is%2C+as+I+mentioned+before+at+the+outset%3B+they+never+supposed+that+any+observer+would+appear+who+would+ever+dare+to+open+his+lips+in+exposure+of+such+impudence.+But+any+one+may+ask%2C+how+have+these+fabricators+of+relics+omitted+the+many+notable+things+connected+with+the+Old+Dispensation%2C+since%2C+without+any+regard+to+reason%2C+they+have+heaped+up+all+that+ever+came+into+their+mind%2C+and%2C+as+it+were+with+a+breath%2C+called+into+existence+whatever+they+pleased%3F+To+this+question+I+can+give+no+other+answer+than+that+they+did+not+think+it+worth+their+while%2C+because+they+had+no+prospect+of+deriving+much+advantage+from+such+relics%3B+and+yet+they+have+not+forgotten+them+entirely%2C+for+at+Rome+they+gave+out+that+they+have+the+bones+of+Abraham%2C+Isaac%2C+and+Jacob%2C+in+the+church+of+Mary+supra+Minerva.+They+also+boast+that+in+the+church+of+Joannes+Lateranensis+they+have+the+ark+of+the+covenant+and+Aaron%E2%80%99s+rod+within+it.+The+same+rod%2C+however%2C+is+at+Paris+in+the+Holy+Chapel%2C+while+some+fragment+of+it+also+is+in+St+Salvator%E2%80%99s+in+Spain.+I+omit+the+inhabitants+of+Bourdeaux%2C+who+maintain+that+the+rod+of+St+Martial%2C+which+is+exhibited+in+the+church+of+Severinus%2C+is+the+identical+rod+of+Aaron.+It+would+seem+that+they+had+wished+to+perform+a+new+miracle+as+in+rivalship+of+God%3B+for+whereas+He%2C+by+his+power%2C+turned+the+rod+into+a+serpent%2C+so+they+have+now+turned+it+into+three+rods.+Very+probably+they+have+many+other+toys+of+the+same+description%2C+but+let+it+suffice+merely+to+have+mentioned+this%2C+in+order+to+make+it+manifest+that+they+have+been+as+honest+here+as+in+other+matters.+Now%2C+I+would+entreat+my+readers+to+remember+what+I+said+at+the+outset%2C+viz.%2C+that+I+have+not+searchers+at+hand+to+examine+the+sacraria+of+all+the+regions+which+I+have+here+mentioned.+Wherefore%2C+what+I+have+said+of+relics+must+not+be+taken+as+if+it+were+a+perfect+inventory+of+all+the+things+which+might+be+discovered.+I+have+mentioned+only+six+German+cities%2C+or+thereabouts%2C+three%2C+as+far+as+I+know%2C+of+Spain%2C+fifteen+of+Italy%2C+and+between+thirty+or+forty+of+France%3B+nor+am+I+even+acquainted+with+all+the+relics+that+are+in+them.+Let+every+one%2C+therefore%2C+consider+with+himself+what+a+farrago+there+would+be+if+we+saw+the+multitude+of+relics+existing+throughout+the+world+described+in+order%2C+or+only+in+the+regions+which+are+known+to+us%2C+or+in+which+we+live.+For+it+is+to+be+particularly+observed%2C+that+all+the+relics+of+Christ+and+the+Apostles+exhibited+in+Europe+exist+also+in+Greece%2C+Asia%2C+and+other+countries+where+Christian+churches+are+found.+Now%2C+I+ask%2C+when+the+Christians+of+the+Eastern+Church+say+that+all+these+things+which+we+pretend+to+have+are+in+their+possession%2C+what+decision+can+we+come+to+upon+the+subject%3F+If%2C+in+answer+to+them%2C+we+aver+that+this+body+was+brought+thither+by+merchants%E2%80%94that+one+by+monks%E2%80%94and+that+other+by+a+bishop%E2%80%94that+part+of+the+crown+of+thorns+was+sent+by+the+Emperor+of+Constantinople+to+the+King+of+France%E2%80%94that+another+was+obtained+in+war%E2%80%94and+so+on+of+each%2C+they+will+laugh+and+shake+their+heads.+How+will+the+controversy+be+decided%3F+In+doubtful+matters+we+must+trust+to+conjecture%2C+and%2C+therefore%2C+in+this+respect%2C+they+will+always+get+the+better+of+us.+For+what+they+produce+in+their+behalf+is+much+more+probable+than+what+we+can+produce+in+ours.+Those+who+defend+relics+have+certainly+a+very+difficult+knot+to+loose.+To+draw+to+a+conclusion%2C+I+beseech+my+readers%2C+in+the+name+of+God%2C+to+give+heed+to+the+truth+while+it+lies+plainly+before+them%2C+and+recognise+how+Divine+Providence+has+wonderfully+provided%2C+that+those+who+thus+wished+to+mislead+the+meanest+of+the+people+have+been+so+blind+that+they+never+thought+of+using+a+cloak+for+their+lies%2C+but+moving+blindfolded%2C+like+the+Midianites%2C+have+set+about+slaughtering+one+another.+As+we+see+how+they+are+still+warring+among+themselves%2C+and+charging+each+other+with+falsehood%2C+every+man%2C+who+is+not+obstinately+determined+against+the+truth%2C+though+he+may+not+yet+clearly+perceive+that+the+worship+of+any+relics%2C+of+whatever+kind+they+be%2C+whether+genuine+or+spurious%2C+is+execrable+idolatry%2C+yet+seeing+how+clear+their+falsehood+is%2C+will+have+no+desire+to+kiss+them+any+more%2C+and+whatever+reverence+they+may+have+previously+inspired%2C+will+cease+to+have+any+relish+for+them.+The+best+thing%2C+indeed%2C+would+be%2C+as+I+mentioned+at+the+outset%2C+if%2C+among+us+who+profess+the+name+of+Christ%2C+this+heathenish+custom+were+abolished%2C+whether+they+be+relics+of+Christ+or+of+the+saints.+In+as+much+as+they+do+degenerate+into+idols%2C+the+pollution+and+defilement+which+they+occasion+ought+not+on+any+account+to+be+tolerated+in+the+Church.+This+we+have+already+demonstrated%2C+both+by+argument+and+by+the+testimony+of+Scripture.+If+any+one+is+not+satisfied+with+this%2C+let+him+look+to+the+manner+and+practice+of+the+ancient+fathers%2C+and+conform+to+their+example.+Many+patriarchs%2C+prophets%2C+kings%2C+and+other+faithful+worshippers%2C+existed+under+the+Old+Testament.+More+ceremonies+were+then+appointed+by+God+than+it+becomes+us+to+observe+in+the+present+day.+Nay%2C+even+burial+itself+required+more+show+than+it+now+does%2C+because+by+its+figures+it+represented+the+resurrection%2C+which+was+not+so+clearly+revealed+to+them+as+it+has+been+to+us.+But+do+we+read+that+the+saints+were+ever+dug+out+of+their+graves%2C+in+order+that+they+might+be+converted+into+a+kind+of+puppets+for+children%3F+Was+Abraham%2C+the+father+of+all+the+faithful%2C+thus+carried+in+state%2C+or+was+Sarah%2C+a+princess+in+the+Church+of+God%2C+taken+out+of+her+coffin%3F+Were+they+not+left+in+quiet+along+with+the+other+saints%2C+and+was+not+the+body+of+Moses+so+concealed%2C+by+the+express+will+of+God%2C+that+it+never+could+be+discovered%3F+Did+not+Satan%2C+as+Jude+tells+us%2C+contend+for+it+with+the+angels%3F+The+Lord+then+withdrew+it+from+the+sight+of+men%2C+and+the+devil+tried+to+bring+it+back.+God+confessedly+took+it+away%2C+in+order+that+it+might+not+become+an+occasion+of+idolatry+to+the+Jewish+people%3B+and+the+devil+would+have+brought+it+back%2C+that+he+might+make+it+an+occasion+of+idolatry.+But+that+people%2C+it+will+perhaps+be+said%2C+was+prone+to+superstition%3B+and+what%2C+pray%2C+are+we%3F+Is+there+not+in+this+respect+greater+perversity+among+Christians+than+there+was+among+the+Jews%3F+And+what+do+we+find+to+have+been+the+practice+of+the+ancient+Church%3F+The+faithful%2C+it+is+true%2C+always+exerted+themselves+to+rescue+the+bodies+of+martyrs%2C+and+prevent+their+being+torn+by+wild+beasts+and+ravenous+birds%2C+so+as+to+secure+for+them+an+honourable+burial.+This+they+did+in+the+case+of+John+the+Baptist+and+Stephen.+They+did+it%2C+however%2C+for+the+purpose+of+committing+them+to+the+earth%2C+that+they+might+there+rest+till+the+resurrection%E2%80%94not+that+they+might+be+brought+forward+into+public+view+in+order+that+all+might+prostrate+themselves+before+them.+This+unhappy+pomp+of+consecrating+was+never+introduced+into+the+Church+until+all+things+were+subverted%2C+and%2C+as+it+were%2C+profaned%2C+partly+by+the+stupidity+or+avarice+of+some+prelates+and+pastors%2C+and+partly+by+the+inability+of+others+to+withstand+a+practice+which+had+already+begun+to+prevail.+Nay%2C+even+the+people+themselves+courted+deception%2C+by+giving+their+mind+to+mere+frivolities+rather+than+to+the+pure+worship+of+God.+Wherefore%2C+if+a+complete+reformation+of+this+corrupt+practice+is+desired%2C+it+will+be+necessary+to+begin+at+the+very+foundation%2C+and+abolish+a+practice+which+was+at+first+instituted+improperly%2C+and+against+all+reason.+But+if+any+one+is+not+able+at+one+step+to+make+such+an+advance+towards+true+understanding%2C+let+him+at+least+proceed+gradually.+And%2C+in+the+first+place%2C+let+him+open+his+eyes%2C+and+exercise+his+judgment+upon+any+relics+which+may+be+presented+to+him.+No+one+inclined+to+make+the+attempt+will+find+it+at+all+difficult%3B+for+among+the+many+transparent+lies%2C+such+as+those+to+which+I+have+already+adverted%2C+where+will+any+relics+be+found+whose+genuineness+amounts+to+anything+like+certainty%3F+Nay%2C+at+the+very+time+when+this+little+book+was+passing+through+the+press%2C+I+was+informed+of+a+third+prepuce%2C+which+I+had+not+mentioned%2C+and+which+is+shown+at+Hildesheim.+The+number+of+similar+follies+is+indeed+infinite%2C+and+a+careful+inspection+would+discover+more+than+it+is+possible+to+enumerate.+Let+every+one%2C+then%2C+be+on+his+guard%2C+and+not+allow+himself+to+be+led+along+like+an+irrational+animal%2C+and+as+if+he+were+incapable+of+discerning+any+way+or+path+by+which+he+might+be+guided+safely.+I+recollect+when+I+was+a+boy+how+they+were+wont+to+do+with+the+images+of+our+parish.+When+the+feast+of+Stephen+drew+near%2C+they+adorned+them+all+alike+with+garlands+and+necklaces%2C+just+decking+the+murderers+who+stoned+Stephen+in+the+same+way+as+they+decked+Stephen+himself.+When+the+old+women+saw+the+murderers+thus+adorned%2C+they+imagined+that+they+were+Stephen%E2%80%99s+companions.+Accordingly%2C+every+one+was+presented+with+his+candle.+Nay%2C+the+same+honour+was+conferred+on+the+devil+who+contended+with+Michael%2C+and+so+on+with+the+rest.+And+so+completely%2C+are+they+all+mixed+up+and+huddled+together%2C+that+it+is+impossible+to+have+the+bones+of+any+martyr+without+running+the+risk+of+worshipping+the+bones+of+some+thief+or+robber%2C+or%2C+it+may+be%2C+the+bones+of+a+dog%2C+or+a+horse%2C+or+an+ass.+Nor+can+the+Virgin+Mary%E2%80%99s+ring%2C+or+comb%2C+or+girdle%2C+be+venerated+without+the+risk+of+venerating+some+part+of+the+dress+of+a+strumpet.+Let+every+one%2C+therefore%2C+who+is+inclined%2C+guard+against+this+risk.+Henceforth+no+man+will+be+able+to+excuse+himself+by+pretending+ignorance.+John+Calvin%2C+Theodore+Beza%2C+and+Henry+Beveridge%2C+Tracts+Relating+to+the+Reformation%2C+vol.+1+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+334%E2%80%93341.+John+Calvin%2C+Theodore+Beza%2C+and+Henry+Beveridge%2C+Tracts+Relating+to+the+Reformation%2C+vol.+1+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+332%E2%80%93334.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+An+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+334%E2%80%9341&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa279dce91a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a279dce91a.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-14/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>…the pope… can excommunicate a ruler and thereby dissolve all obligations his subjects have to support and obey him, thus overthrowing governments at will. Thomas [of Aquinas] wrote: …if someone commits the sin of unbelief he can be deprived of his right to rule by judicial sentence, just as for other failings… Therefore, as soon as someone falls under a sentence of excommunication for apostasy from the faith, his subjects are ipso facto absolved from his rule and from the oath of fealty by which they were bound to him. (Summa Theologiae, ii-ii, Question 12, in Basic Writings of Thomas Aquinas, Anton C. Pegis, editor. New York: Random House, 1945.)</p></blockquote>

</figure><figure class="quote" id="q-ad1e725bd4" data-kw="">
<blockquote><p>For there are some who deny that a commonwealth is daily framed which, neglecting the political system of Moses, is ruled by the common laws of nations. Let other men consider our perilous and seditious this notion is.; it will be enough for me to have proved it false and foolish. We must bear in mind that common division of the whole law of God, administered by Moses, into moral, ceremonial, and judicial laws. And we must consider each of these parts, that we may understand what there is in them that pertains to us, and what does not. In the meantime, let no one be concerned over the small point that ceremonial and judicial laws also pertain to morals. For the ancient writers who taught this division, although they were not ignorant that these two latter parts had some bearing upon morals, still, because these could be changed or abrogated while morals remained untouched, did not call the, moral laws. They applied this name especially to the first part, without which the true holiness of morals cannot stand. The moral law (to begin first with it) is contained under two heads, one of which simply commands us to worship God with pure faith and piety; the other, to embrace men with sincere affection. Accordingly, it is the true and eternal rule of righteousness, prescribed for men of all nations and times, who wish to conform their lives to God’s will. For it is his eternal and unchangeable will that he himself indeed be worshipped by us all, and that we love one another. The ceremonial law was the tutelage of the Jews, with which it seemed good to the Lord to train this people, as it were, in their childhood, until the fullness of time should come…in order that he might fully manifest his wisdom to the nations, and show the truth of these things which then were foreshadowed in figures. The judicial law, given to them for civil government, imparted definite formulas of equity and justice, by which they might live together blamelessly and peaceably. Those ceremonial practices indeed properly belonged to the doctrine of piety (inasmuch as they kept the church of the Jews in service and reverence to God) and yet could be distinguished from piety itself. In like manner, the form of their judicial laws (although it had no other intent than how best to preserve that very love which is enjoined by God’s eternal law) had something distinct from the precept of love.</p></blockquote>

to+the+nations%2C+and+show+the+truth+of+these+things+which+then+were+foreshadowed+in+figures.+The+judicial+law%2C+given+to+them+for+civil+government%2C+imparted+definite+formulas+of+equity+and+justice%2C+by+which+they+might+live+together+blamelessly+and+peaceably.+Those+ceremonial+practices+indeed+properly+belonged+to+the+doctrine+of+piety+%28inasmuch+as+they+kept+the+church+of+the+Jews+in+service+and+reverence+to+God%29+and+yet+could+be+distinguished+from+piety+itself.+In+like+manner%2C+the+form+of+their+judicial+laws+%28although+it+had+no+other+intent+than+how+best+to+preserve+that+very+love+which+is+enjoined+by+God%E2%80%99s+eternal+law%29+had+something+distinct+from+the+precept+of+love.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+1536+Edition%2C+trans.+F.+L.+Battles+%28Grand+Rapids%3A+Eerdmans%2C+1975%29%2C+6.48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fad1e725bd4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ad1e725bd4.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/calvin-contra-theonomy-1536/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-409738f1d6" data-kw="">
<blockquote><p>But the Christian Church is by no means to be considered as a mere voluntary association. It is a Body called out of the world, created by divine institution, and created, as its members believe, for the express purpose of bearing testimony for Christ, in the midst of a revolted and rebellious world, and maintaining in their purity the truth and ordinances which He has appointed. The members of this body, therefore, by the act of uniting themselves with it, profess to believe certain doctrines, to be under obligation to perform certain duties, and to be bound to possess a certain character.

Of course, the very purpose for which, and the very terms on which the Master has formed this body, and bound its members together, necessarily imply, not only the right, but the, duty, of refusing to admit those who are manifestly hostile to the essential principles of its institution, and of casting out those who, after their admission, as manifestly depart from those principles. To suppose less than this, would be to suppose that a God of infinite wisdom has withheld from a body, formed for a certain purpose, that which is absolutely necessary for its defence against intrusion, insult, and perversion; in other words, for its own preservation.</p></blockquote>

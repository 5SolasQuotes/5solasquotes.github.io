<blockquote><p>It is thus also evident that the abuse of the lot in games, entertainment, and gambling is a dreadful abuse of the providence of God. There are games which are played solely with one’s skill or strength, and there are games played together with others such as chess, checkers, handball, fencing, shuffle board, etc. These are lawful in and of themselves, but they must be played with a holy objective: to refresh a weary mind, to preserve the health of the body, or to render one more fit for his next task. It must occur neither too frequently nor too long, for then you would fail to achieve the objective. You would waste your time and the heart would be estranged from God and become attached to the game. There are also mixed games which are partly played by chance and partly by skill, such as the game of cards, backgammon, etc. These are as unlawful as games of pure chance, for the casting of the lot also rules such games. If chance is entirely against someone, his skill will be of no avail. Then there are games which are entirely dependent on chance, such as games in which dice only are used, straws are drawn, etc. It is unlawful to play games of chance, be it all by chance or in conjunction with skill. This is evident for the following reasons: First, there is neither a command, example, nor argument in God’s Word from which one can logically deduce the legality of games of chance. Evasive Argument #1: This can also be said of other games in which use is made of either skill or strength. Answer: This is not so, for it is founded upon God’s Word that one may rest, sleep, eat, and drink, and at the same time, may endeavor to keep soul and body in good condition in order to be fit for the service of God. Evasive Argument #2: A game of chance can also serve that purpose. Answer: This cannot be so, since it is nothing but sin—and a soul, if it were sensitive to sin, would be distraught. One may not draw a conclusion by relating that which is founded upon God’s Word to that which is not founded upon it. Secondly, the use of the lot is a religious activity governed by the Word of God, which states the circumstances when, the manner in which, and the purpose for which it may be used. It is a religious activity; that is, it is a seeking for guidance from the Lord and a making request that He would reveal His will. Therefore prayer precedes its use (Acts 1:24–26). It must be used in weighty circumstances wherein God’s hand needs to be observed in an extraordinary manner. This was true for the selection of the two goats, the division of the land of Canaan, and the selection of a twelfth apostle. It must be done in faith, believing that the entire disposal is of the Lord (Prov. 16:33), that He will reveal His will, and that one must rest in this with delight. It must also be used to settle disputes (Prov. 18:18). All these dimensions are absent, however, in the game of chance, and it is thus unlawful. Thirdly, the lot is an extraordinary means by which to discern God’s will in a situation of extraordinary importance. However, in a game of chance there is neither a weighty matter to be determined, nor a dispute to be settled. One does not endeavor by such a game to know the will of God in order to be subject to it. Thus, to play a game of chance is to tempt God, and is therefore forbidden. “Thou shalt not tempt the Lord thy God” (Mat. 4:7). To tempt God is to depart from the ordinary way prescribed to us and to desire something extraordinary from God. It makes a mockery of God’s providence and makes Him a servant of our foolish will. Evasive Argument: The gambler may say: “I do not even think about this; I am only interested in honor and financial gain.” Answer: It is sinful to have such objectives, and it is even sinful not to think about God. One must think about God in everything. If one does not think about God in the act of lying, is it therefore no sin? Fourthly, the outcome of the casting of the lot—which the gambler hopes to be to his advantage—is not in the hands of the player; and yet he is hopeful. In whom does he put his hope—in the devil? No. Is it fate (which the heathen designate as an idol) as if it were able to bring something about? No. Does one expect it then from the dice? Then one designates them to be his God. It is abominable to expect any happiness from any other source but God. Evasive Argument: The gambler may say, “I do not expect the outcome from anyone; I only look to the outcome.” Answer: This would be the answer of the atheist; the outcome is ruled by God (Prov. 16:33). It is thus inherent in the issue itself that one expects happiness from God in an extraordinary way—this being by a game. This is nothing else but a tempting of and mocking with God, and to make Him a servant of one’s lust. Fifthly, games of chance—not due to chance itself—inherently engender harmful consequences. They draw the heart from God, which, due to His righteous judgment, is occupied with a bewitching power. If the outcome of the casting of the lot is disappointing, a silent fretfulness toward God arises in the heart, even though this may not be expressly stirred up. From this comes cursing, blaspheming, and displeasure toward the winner. The one loses his goods (be it much or little) and the other receives a profit which is corrupt and contaminated. Sixthly, add to this the general witness of the godly and scholars of all ages, as well as of synods and imperial decrees. If there is occasionally one who favors games of chance, it is a papist or a worldly person who has no regard for the Bible. Or if there is an occasional scholar who approves, there are those who have refuted them and stopped their mouths. In doing so, such a scholar has brought a blemish upon himself and upon his other writings.</p></blockquote>

<blockquote><p>§44. 4. And though the taking of an oath be a sort of worship, yet not the natural worship of the First Commandment, nor the instituted of the Second, but the reverent use of his name in the third; so that it is not primarily an act of worship, but reductively and consequentially: It being the principal use of an oath to confirm the truth and end strife, by appealing to God, which appellation is indeed an acknowledgment of his government and justice. And the laying the hand upon the book, or kissing it, is but a professing sign of my own intentions, such as my words themselves are: and therefore is left to human choice, and a lawful thing. And I have met but with very few [non-conformists], among all our ceremonies, that questioned this.</p></blockquote>

<blockquote><p>Some vows are no more worship for the matter of them (and that only is left unto choice, not the manner) than fighting in a lawful war upon the bond of an oath is religious worship.</p></blockquote>

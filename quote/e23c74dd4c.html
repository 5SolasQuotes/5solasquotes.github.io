<main class="wrap"><figure class="quote" id="q-e23c74dd4c" data-kw="">
<blockquote><p>3. Every man (especially experienced Christians) have more sense and knowledge of what is profitable and congruous to them than standers-by have, how learned soever: As ignorance makes a few, short, plain, oft repeated words in a familiar style more profitable to low-bred persons than an accurate learned discourse would be, so men’s several tempers and vices makes that matter and manner of preaching profitable to them which to others seems otherwise; And as a nice lady must not tie her family of laboring persons to the matter and measure of her diet, nor revile them as gluttons or fools if they like it not. No more must learned men confine plain people to wordy orations (whether learned or pedantic) and say, ‘This is best for them’. Much less must they silence causlessly such teachers as truly profit them, or tie them to homilies or liturgies only and say, ‘Here is as much as is necessary to salvation.’ Nor is it any schism in the people if they refuse to be so confined by them and denied such helps to their salvation as God has sent them and made their due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-d400a62bf4" data-kw="">
<blockquote><p>The first step towards what might be called the re-organisation of the [United] Societies appears to have been taken by Robert Hamilton, who had been on the Continent from 1679 to 1688, and who had constituted himself the leader in opposition to the movements proposed by the ‘ministers and majority of the people’ during the two years after the [Glorious] Revolution [of 1689]. All who did not approve his views were guilty of ‘gross defections.’ …when the first General Meeting was held after the issue of this paper [in 1691], it was found that there were tares among the wheat. “When gathered and searching into one another’s judgement as to the state of the testimony,” says the writer of the Informatory Vindication [of 1691(?)], ‘We found ourselves to be but a mix’d company,” and consequently, before anything was done, they had to ‘purge their meetings from all such as had sinfully joined with the courses of the times and were defending the same.’… How many were removed at the ‘purging’ is also unknown, but they must have formed a considerable proportion of the body… The Societies seem to have done very little without causing controversy in their own ranks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenanters after the Revolution of 1688’</cite>, (Scottish Church History Society, 1950), pp. 144-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>There were schisms and contentions, envying and strife, incest and incest tolerated, such as is not named amongst the gentiles; going to law with their brethren for gain before infidels, harlotry, eating at the idol’s table, keeping fellowship with devils, coming to the Lord’s table drunken, eating and drinking damnation, a denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, murdering of weak souls whom Christ had died for, Paul’s name despitefully traduced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>In comparison with these sanctimonious hypocrites of the papacy, publicans and harlots are not bad. They at least feel remorse. They at least do not try to justify their wicked deeds. But these pretended saints, so far from acknowledging their errors, justify them and regard them as acceptable sacrifices unto God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1d1ebfccd9" data-kw="">
<blockquote><p>And to complete the dismal scene of our misery, we have had for a long time among us one of the most scandalous, pernicious and most unaccountable schisms that perhaps ever was in any age of the Church; a schism carried on by three weak men, supported by a poor people, and both are equally ignorant of the nature of union with, and separation from, a Church, and of what will justify the one or other; they cannot, in a consistency with their principles, hold communion with any Church this day on earth. We confess to our shame there are many things wrong with us, and that there are errors in the administration, against which we are, with the help of grace, still struggling and contending; and we resolve ever to plead against such corruptions: But no man of common understanding will think this national Church should be cast off, and that we should separate from her; we have a good constitution; we have a standard of doctrine without error; Westminster Confession of Faith, which we own as the confession of our faith; we have subscribed and preach the doctrine therein contained; our worship is pure, without men’s additions; our discipline and government, in their constitution, are agreeable unto, founded on, and appointed in the Word of God; and there are no sinful terms of communion imposed. As we cannot, and hope never shall, justify the measures some take, and for which they shall answer to God; so we will not despise the dust of Zion: What of the covenanted work of reformation is remaining among us, we must favor that dust, and look on it as precious, and pray and wrestle, by the help of grace, that our Lord would return to build his own House (for men have not courage to do it) and take a new infeftment[?] thereof by a cloud of his glory. There are a set of faithful ministers in this Church who are troubled for the many offenses that are given, and for laying so many stumbling blocks before the blind: And as they mourn for these in secret, so they give frequent testimony against them.</p></blockquote>

<blockquote><p>But because he conceives the dissenting churches to be true churches also, their ministers generally men of real piety, good learning, and zealously active to save immortal souls… And… because he finds the discipline of the Established Church defective… on the other hand [he] finds the preaching of the dissenting ministers generally more close, methodical, and lively; their ministrations more pure, without those human mixtures… the power of practical religion is more visibly kept up among them… These, and other considerations of the like nature, determine him to hold stated communion with some dissenting congregation, where he thinks himself better edified than in the parochial assemblies. He judges himself obliged to get the best helps he can for his soul, and thinks he ought not to be more restrained in the choice of a spiritual guide for the benefit of his soul than he is in the choice of a lawyer or physician for the preserving of his estate and bodily health.</p></blockquote>

</figure><figure class="quote" id="q-5f064b23ae" data-kw="">
<blockquote><p>There are several cases in which separation from the Church of England is sinful, as:

1. If any separate as the Papists do, because they are against sound doctrine or any good that is in the Church.

2. If any renounce communion with all the parish-churches under the name of the Church of England.

3. If any renounce communion with the Church of England as it is a Christian kingdom, headed by one Christian protestant king.

4. If they renounce communion with the Church of England as it is called one from the association or concord of its pastors or Church governors.

5. If any renounce communion with faulty bishops or worship, or discipline, simply and absolutely, and not only secundum quid [according to what; that is in a qualified manner], and so forsake the good that is in them for the sake of the evil. In a word, 1. all that separate for a wrong cause, 2. or further than they separate from Christ, or than Christ would have them separate, do sin. 2. But they that renounce any corruption as such, and the Church no further than secundum quid [according to that], as it is faulty, do well: For we must so renounce the faults of all Churches and Christians in the world (and our own first), but not the Churches and Christians for any tolerable faults, so that we commit no sin ourselves, which they impose as the condition of their communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 85</span></figcaption>

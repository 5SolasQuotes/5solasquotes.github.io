<main class="wrap"><figure class="quote" id="q-02fc0c8db1" data-kw="institution words">
<blockquote><p>The reasons are various. First, here belong all those which have been adduced against the proper sense and transubstantiation, to which we add the following. (1) From the words of institution, which cannot admit that corporeal presence; both because Christ’s body is proposed in the Supper to us and represented by the sacramental signs as dead and his blood as poured out of his veins (in which manner it is impossible for Christ’s body to be made present to us at this day corporeally and indistantly [adiastatōs], since he can die no more); and because Christ commands us “to do this in remembrance of him” (Lk. 22:19). Now memory is only of things absent and past, not of those present; nor, if all things are said to be present to faith, is this understood of a local presence as to real being (which is beyond the intellect), but of an objective, as to intentional being and the spiritual hypostasis of faith. If we are commanded to remember God, his absence from our mind through thoughtlessness and oblivion is supposed (although he is always present to us as to himself by his essence). Now</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.28.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a> › <a href="../topics/the-lords-supper/elements-and-words/this-is-my-body.html">This is my body</a></span><span class="t"><a href="../topics/the-lords-supper/presence-of-christ.html">Presence of Christ</a> › <a href="../topics/the-lords-supper/presence-of-christ/spiritual-presence.html">Spiritual presence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5fae02486d" data-kw="unworthy">
<blockquote><p>The reasons are: (1) from the institution and the example of Christ. Christ broke the bread and all the evangelists, and Paul, who individually relate this, agree that he did. Now who would affirm that the Son of God in so sacred an action did anything superfluous, or that all the apostles would have related this with so great carefulness, if the thing was merely indifferent and free? Who, on the other hand, does not see that Christ wished to prescribe the sacramental rites and ceremonies by his example and command when he ordered his disciples “to do this” (i.e., with respect to those administering, to take the bread, to bless, to break and give it to the communicants)? Again, there ought to be the same reason for the breaking as the giving of thanks and for the distribution because it is placed between them. Now no one denies that these latter ceremonies are necessary, belonging to the instituted rite and not merely indifferent. To no purpose is the reply: (a) many other circumstances and actions are studiously related by the evangelists and were observed by Christ, which ought not</p></blockquote>

</figure><figure class="quote" id="q-aee103fb5c" data-kw="real spiritual">
<blockquote><p>Now although this spiritual presence does not take place except faith mediates, it does not follow (as our opponents falsely charge upon us) that it is only imaginary and unreal (phantastikēn), by which not so much Christ as a phantasm (phantasma) of him or his image becomes present. Spiritual things are no less real and true than corporeal; nay, as they are more perfect, so their mode of presence ought to have perfection. I confess that by those to whom faith is only historical and consists in the bare knowledge of the object, that presence can be called less real (although not even so is a presence denied by philosophers by whom whatever is perceived by the intellect can be said to be truly present to it). But the Scriptures far otherwise describe faith and the presence which it works, while they designate it by sight, hearing and touch, by access, reception and manducation: all of which prove not an unreal (phantasticam) presence (which is made only by phantasms or notions and imaginary ideas), but a true and real presence. Otherwise our union with Christ (which is made by faith,</p></blockquote>

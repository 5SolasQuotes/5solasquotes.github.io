<main class="wrap"><figure class="quote" id="q-dd1fec55c9" data-kw="">
<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Predestination &amp; Justification, tr. Frank A. James (Kirksville, Missouri: Sixteenth Century Essays &amp; Studies, 2003), vol. 8</cite>, p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 447</span></figcaption>

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>

</figure><figure class="quote" id="q-67cb1ff92e" data-kw="">
<blockquote><p>For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).”

— David Pareus, Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27, p. 25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+this+properly+means+to+die+for+another%3A+to+liberate+another+from+death+by+one%E2%80%99s+own+death%2C+that+he+may+live.+Thus+David+in+his+lamentation+exclaims%3A+%E2%80%9CMy+son+Absalom%3A+who+shall+give+me+to+die+for+thee%3F%E2%80%9D+meaning%2C+would+that+by+my+death+I+could+redeem+thy+life%2C+or+liberate+thee+from+death+%282+Sam.+18%3A33%29.+In+the+same+way+Christ+is+said+to+have%E2%80%9D+died+for+us+when+we+were+enemies%E2%80%9D+and+%E2%80%9Cungodly%E2%80%9D%3A+that+is%2C+to+have+liberated+us%2C+being+enemies+and+ungodly%2C+from+death+by+his+own+death+%28Rom.+5%3A6%29.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+Article+2%2C+%E2%80%98Concerning+the+Death+of+Christ+for+All%E2%80%99+in+%E2%80%98Oration+on+the+Synod+of+Dort+%26+the+Remonstrants%E2%80%99+Articles%E2%80%99+trans.+AI+%281619%3B+Monergism%2C+2026%29%2C+pp.+24-27%2C+p.+25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67cb1ff92e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67cb1ff92e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=For%20this%20properly%20means%20to%20die,by%20his%20own%20death%20%28Rom.%205%3A6&amp;text=For%20this%20properly%20means%20to%20die%20for%20another&amp;text=from%20death%20by%20his%20own%20death%20%28Rom.%205%3A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6337527b5a" data-kw="">
<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible (London, 1631)</cite>, vol. 1, pp. 495–98 on 1 Tim. 2:4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

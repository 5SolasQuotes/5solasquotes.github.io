<main class="wrap"><figure class="quote" id="q-da9337af2a" data-kw="">
<blockquote><p>We believe that the ceremonies and figures of the law ceased at the coming of Christ, and that all the shadows are accomplished are accomplished; so that the use of them must be abolished among Christians: yet the truth and substance of them remain with us in Jesus Christ, in whom they have their completion. In the mean time we still use the testimonies taken out of the law and the prophets, to confirm us in the doctrine of the gospel, and to regulate our life in all honesty to the glory of God, according to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belgic-confession.html">Belgic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, art. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b80133b8f3" data-kw="">
<blockquote><p>We say that it is a superstition to esteem one day more holy than another. or to think that to abstain from labor is something which, in itself, pleases God (Rom 14:5, 6; Col 2:16, 17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us not Judaistic ceremony or stupid superstition. This is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early church (1 Cor 16:2; Acts 20:7; Rev 1:10). As for other festival days, we have removed them as much as possible from us, especially those which have been introduced through manifest idolatry. We have done this so as to correct the innumerable abuses which flowed from such, and to relieve the poverty of many. Nevertheless, because there are certain festivals devoted, since ancient times, to the celebration of certain mysteries concerning our redemption, we use Christian liberty, and submit all to edification, according to the different circumstances of pleas, times, and persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 5.41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-3904a79ece" data-kw="">
<blockquote><p>Consecrating of churches is taken two ways:

1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches:

1. That the end being sacred, to wit, the habitual worshipping of God in that place.

2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple.

2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place.

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 90-91</span></figcaption>

<blockquote><p>…let them who commend them [dances] to the Church, see where those sober and modest dances which they speak of can find any place: and to those that expound choreas ducere [to conduct dances], only of lascivious dances, we will in a form of speech commodious enough interpret these dances to be meant of all dancings whatsoever: otherwise St. Cyprian had not affirmed that David danced before God, unless any should think that the Blessed [Peter] Martyr (which never came into his mind) would brand the royal prophet with a mark of lascivious and obscene dancing. And if there be any that think that dancing be sober and modest, they are at their liberty for me to abound in their own sense: at least, with Octavius, that good defender of the Christian religion, and other lights of Reformed Christianity, it seems meet for me to repute them as obscene and evil pleasures. Lastly, let the patrons of those dances which they call sober…</p></blockquote>

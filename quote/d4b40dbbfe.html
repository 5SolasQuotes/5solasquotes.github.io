<blockquote><p>Have not you been glad, when the Lord’s Day was over; or at least, when the Preaching was done, that ye might get your Liberty? Has it not been a Burden to you, to sit so long in the Church? Well, this is a great Sin, which was one of the Grounds of GOD’s Controversy with his own People, Mai i. 13. Isa. xliii. 21. Ames viii 5. ‘Tis to be weary of well doing, against the express Command of GOD, Gal. vi. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern of Salvation</cite>, (Edinburgh, 1721), p. 100.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c8604102a" data-kw="">
<blockquote><p>Scottish Sabbatarianism had, properly speaking, nothing ritualistic about it at alL It was never held that there was any virtue in merely ceasing from ordinary toil and ordinary recreations on the first day of the week. These things they held, indeed, to be commanded of God, to whom men were bound to give a reverent and dutiful obedience, and obedience to whom, wlien in a right spirit, was spiritually elevating; but the day of rest was ever and chiefly regarded as a means to a blessed end. …

And, for my part, I do not comprehend how any person with religious feelings and sympathies should not be ready to admit that at least there is something very grand about the Scottish Sabbath, in its idea of a day of communion with the Unseen and Eternal; of adoration of our Maker and our Saviour; of self-examination and moral exercise; of acquisition of religious knowledge; and all this in order to the spiritual elevation of the soul, the replenishing of our moral energies, and a closer hold of the verities which have a place in our creed.

Of course, Scotch religion has had its formalism; and that formalism very naturally connects itself with the Sabbath. The Sabbath is the thing among us in which the Pharisaic tendency and conscience find readiest exercise. It is our chief opportunity for religious display. And no doubt we have had our share of the miserable thing. Nor do I hold myself obliged to defend all the minutiae of Sabbatic observance which you may find in presbytery records, or of which people may have heard stray reports.

In breaking in a turbulent, and energetic, and uneducated people, a certain rigour was, I believe, both necessary and advantageous. But is there more of sham and unreality in the North than the South of our Island? Under any of the ordinary tests which you apply in such cases, can it be said that Scottish religion, when it has been a day of power with it, has been deficient comparatively in vital moral force?

At the same time we admit that Scotch religion has been distinguished by a certain Sabbatic stringency. We have regarded the outward observance of the day of holy rest as resting upon direct divine command and as including in it a larger measure of abstinence from work and the ways of ordinary every-day life. Have we suffered from this? I do not believe it. … On mere grounds of patriotism, I think no Scotchman should be over-ready to find fault with the Sabbath of his country, and should be very chary in meddling with an institution so entwined with our history, and I believe our nation’s progress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-walker.html">James Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Theology and Theologians of Scotland, Chiefly of the Seventeenth and Eighteenth Centuries</cite>, (2nd edn, Edinburgh: T. &amp; T. Clark, 1888), pp 183-85, 187.</span></figcaption>

</figure><figure class="quote" id="q-f50ac8ff78" data-kw="">
<blockquote><p>Richard Cameron believed that those who trust in Christ alone for societal salvation will only vote for those whom Christ has designated in his word as fit for magisterial office; to vote for anyone else is trusting in unlawful means, and thus making a messiah out of a politician. Listen carefully to his reasoning:

Ye will not look to Christ, and yet there is no other ye can have help from but from Him. There is none to help you at all, except you acknowledge Him as your King and Head, and except you acknowledge no other magistrate but according to what He ordains in His word. See what David says, “He that ruleth over men must be just, ruling in the fear of God.” Compare this with “Moreover, thou shalt provide out of all the people, able men, such as fear God, men of truth hating covetousness. Therefore let the fear of God be upon you, take heed, and do it, for there is no iniquity with the Lord your God.” Ye see such should be men that fear God, and men of truth. Oh, take heed and consider what you are doing! Cry unto the Lord, and let us fight against these wicked rulers with the weapons of the spiritual warfare, the arms of secret prayer. Let us pray unto the Lord to cut them off, and the Lord will raise up those that will condemn and despise them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Hosea 13:9-10 (1680)′ in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite>, ed. James Kerr (Edinburgh, 1880), p. 417.</span></figcaption>

<blockquote><p>…suppose the 〈◊〉 of churches in a city meet at nine of the clock for God’s 〈◊〉, and in the country parishes adjoining, where many people live at a great distance from their churches, they meet at ten or half an hour after nine, nay in the same church at one and the same time [as they have feed animals, etc. and can’t leave sooner], whilst the Word of God is read or preached, those that sit in seats may have their heads uncovered, and those that stand in allies may keep on their hats the whole sermon〈◊〉, because the crowd or throng may render it inconvenient to keep them off. Now in both these instances there is not uniformity in the same circumstances, and yet there may be order observed, and confusion may very well, notwithstanding, be avoided in all the parts of God’s worship and service.</p></blockquote>

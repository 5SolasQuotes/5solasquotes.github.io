<main class="wrap"><figure class="quote" id="q-4f35eb7f6b" data-kw="">
<blockquote><p>The woman said to Him, “Sir, I perceive that You are a prophet. Our fathers worshipped on this mountain, and you Jews say that in Jerusalem is the place where one ought to worship.” John 4:19-20

Commenting on this passage, John Calvin warns us about the danger of human autonomy in the worship of God:

Our fathers. It is a mistaken opinion which some hold, that the woman, finding the reproof [of her sexual immorality] to be disagreeable and hateful, cunningly changes the subject. On the contrary, she passes from what is particular to what is general, and, having been informed of her sin, wishes to be generally instructed concerning the pure worship of God. She takes a proper and regular course, when she consults a Prophet, that she may not fall into a mistake in the worship of God. It is as if she inquired at God himself in what manner he chooses to be worshipped; for nothing is more wicked than to contrive various modes of worship without the authority of the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the gospel according to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), xvii, 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ef8a55396" data-kw="">
<blockquote><p>Your [John Owen’s] wrong exposition of all the texts of Scripture here cited by you is more than one mistake. Dt. 4:2 and 12:32; Prov. 30:6, forbid adding to God’s worship, which is broken by all that either say that that is in God’s Word which is not there (as you here do), or that devise any worship-ordinances coordinate, or of the same sort, with his own, as if they were imperfect. But there is not a word forbidding subordinate, secondary acts of worship, such as kneeling, putting off the hat, using written notes in preaching or forms of singing, praying, catechizing, laying the hand on the Book, or putting it under the thigh, or lifting it up in swearing, the formal words of vows, oaths, covenants, confessions, professions and many such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-76c0e41e69" data-kw="">
<blockquote><p>‎”He that ruleth over men must be just, ruling in the fear of God,” 2 Samuel xxiii. 3, not merely by acting religiously himself, but by promoting religion among those over whom he rules; “scattering away all evil,” and cutting off all wicked doers from the city of the Lord.” “The fear of God” disposed Nehemiah, the governor, to “seek the welfare of the children of Israel,” not only be generously sacrificing the emoluments of his office, but by exerting his authority for preventing the profanation of the Sabbath, and issuing his commands and threatenings to those who persisted in its violation, Neh. xiii. 17, 18. In the same religious manner did he act in repairing the house of God, purging it from defilement which the priest had suffered, and in providing for the regular performance of divine ordinances: “And I perceived (says he) that the portions of the Levites had not given them; for the Levites and singers that did the work, were fled every one to his field. Then contended I with the nobles, &amp;c. Remember me, O my God, concerning this, and wipe not out my good deeds that I have done for the house of my God, and the offices thereof,” chap. xiii. 9-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), pp 16-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-5c9449eabd" data-kw="">
<blockquote><p>‘Worship,’ in our English tongue, and as it is used to express the original scriptures, is diversely taken. Sometime largely, as when it expresses the Greek word latreuo, as Phil. 3:3, ‘we are the circumcision which worship God in the spirit:’ and Acts 24:14, ‘so worship I the God of my fathers.’ And thus both the English &amp; Greek answers to the Hebrew ghnabad [עָבַד], which properly signifies to serve, Ex. 3:12; Dt. 10:12; 2 Sam. 15:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Holy Scriptures, Worship &amp; Ministery, used</cite>, ... (Amsterdam: Thorp, 1609), ‘Of Worship’, p. 5</span></figcaption>

<blockquote><p>33. Effectual calling consists in the production of faith, nor is it made only through illumination of the intellect, but also through the efficacious motion of the heart.</p></blockquote>

</figure><figure class="quote" id="q-560f9af762" data-kw="">
<blockquote><p>Conversion, accepted in this notion, is considered either according to the acts of second regenerating grace as they are on the part of God; or according to new and spiritual acts as they are from us, who being acted upon, act. … The acts and progress of regeneration in the second moment (as indeed it is considered in its effect, on our part—namely, insofar as, the divine impression and touch being passively received by us, we simultaneously actively formally work those acts, Phil. 2:12–13)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

— Gisbertus Voetius, XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConversion%2C+accepted+in+this+notion%2C+is+considered+either+according+to+the+acts+of+second+regenerating+grace+as+they+are+on+the+part+of+God%3B+or+according+to+new+and+spiritual+acts+as+they+are+from+us%2C+who+being+acted+upon%2C+act.+%E2%80%A6+The+acts+and+progress+of+regeneration+in+the+second+moment+%28as+indeed+it+is+considered+in+its+effect%2C+on+our+part%E2%80%94namely%2C+insofar+as%2C+the+divine+impression+and+touch+being+passively+received+by+us%2C+we+simultaneously+actively+formally+work+those+acts%2C+Phil.+2%3A12%E2%80%9313%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+XI.+%E2%80%98Appendix+concerning+the+Second+Moment+of+Conversion%E2%80%99+in+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F560f9af762.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/560f9af762.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Conversion%2C%20accepted%20in%20this%20notion%2C%20is,formally%20work%20those%20acts%2C%20Phil.%202%3A12%E2%80%9313&amp;text=Conversion%2C%20accepted%20in%20this%20notion%2C%20is%20considered%20either&amp;text=simultaneously%20actively%20formally%20work%20those%20acts%2C%20Phil.%202%3A12%E2%80%9313" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bd3525cc7f" data-kw="">
<blockquote><p>It is customary to consider this repentance in two ways: either as a spiritual disposition poured into our hearts by the Holy Spirit, or as an action from us that proceeds from that disposition. In the first way, it is properly speaking and in its strict sense called regeneration; in the second way, it is called repentance, taken in a more restricted sense, or penitence. And when the two are taken together it is called the circumcision of the heart, the conversion to God, the renewal of the Spirit, the sanctification of man, the new creation, and the first resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, tr. Reimer Faber, ed. Henk van den Belt (Brill, 2016), Disputation 32, ‘On Repentance’, section 2, p. 277</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is customary to consider this repentance in two ways: either as a spiritual disposition poured into our hearts by the Holy Spirit, or as an action from us that proceeds from that disposition. In the first way, it is properly speaking and in its strict sense called regeneration; in the second way, it is called repentance, taken in a more restricted sense, or penitence. And when the two are taken together it is called the circumcision of the heart, the conversion to God, the renewal of the Spirit, the sanctification of man, the new creation, and the first resurrection.”

— Anthony Walaeus, Synopsis of Pure Theology tr. Reimer Faber, ed. Henk van den Belt (Brill, 2016), Disputation 32, ‘On Repentance’, section 2, p. 277">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+customary+to+consider+this+repentance+in+two+ways%3A+either+as+a+spiritual+disposition+poured+into+our+hearts+by+the+Holy+Spirit%2C+or+as+an+action+from+us+that+proceeds+from+that+disposition.+In+the+first+way%2C+it+is+properly+speaking+and+in+its+strict+sense+called+regeneration%3B+in+the+second+way%2C+it+is+called+repentance%2C+taken+in+a+more+restricted+sense%2C+or+penitence.+And+when+the+two+are+taken+together+it+is+called+the+circumcision+of+the+heart%2C+the+conversion+to+God%2C+the+renewal+of+the+Spirit%2C+the+sanctification+of+man%2C+the+new+creation%2C+and+the+first+resurrection.%E2%80%9D%0A%0A%E2%80%94+Anthony+Walaeus%2C+Synopsis+of+Pure+Theology+tr.+Reimer+Faber%2C+ed.+Henk+van+den+Belt+%28Brill%2C+2016%29%2C+Disputation+32%2C+%E2%80%98On+Repentance%E2%80%99%2C+section+2%2C+p.+277&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd3525cc7f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd3525cc7f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-being-born-again-as-subsequent-to-faith-in-receiving-christ-the-fullness-of-life-by-faith/#:~:text=It%20is%20customary%20to%20consider%20this,new%20creation%2C%20and%20the%20first%20resurrection&amp;text=It%20is%20customary%20to%20consider%20this%20repentance%20in&amp;text=man%2C%20the%20new%20creation%2C%20and%20the%20first%20resurrection" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7ebc79b998" data-kw="">
<blockquote><p>God does not ravish our wills, but by setting up a sacred light in our understandings, and a sacred power in our wills, He makes our will fit to determine themselves; we do not determine God’s will, nor does God immediately determine our wills, but by infusing a life and soul, as it were, of grace, without precedent preparations often and where there be preparations, yet the first preparation must needs be without a former, we cannot take in anything without a light of grace; but the light of grace, as of glory, must needs be received immediately into the soul. By an habit of grace, deserved for us by Christ, God makes our wills determine themselves to follow Him; and this the Scripture calls, not a forcing, but a drawing of us, not as we draw a man to the gibbet, but as we draw a man to a wedding who has the wedding garment, or as we draw a sheep after us with a bush of ivy, as we draw children after us with nuts and apples, by way of persuasion, indeed, which is so forcible, that Scripture calls it a kind of constraining… The act of knowing works so in clear evidence of the object, that the understanding cannot choose but assent: The act of believing waits upon the will. All this must be received with a grain of salt thus; There is an act of the will to receive grace, which is antecedent to the first infusion of faith, but so as that it is concomitant with it: Antecedent in the first moment of nature, concomitant in the first moment of time, as the wind by blowing opens the window, and the window by opening lets in the wind. This wind which ‘blows as it lists’ (Jn. 3:8), is the voice of the Spirit within (a voice behind us, Isa. 30:20), which knows and tells a man what is in a man…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tentations: their Nature, Danger, Cure, the Fourth Part</cite>, pp. 38-39 bound in Tentations… sixth edition, the Fourth Part left enlarged (London: Ratcliffe, 1659)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a45f6ee05b" data-kw="">
<blockquote><p>If it be asked, whether the consent of parents be essential to marriage? the common sentence will resolve it, Multa impediunt matrimonium contrahendum, quae non dirimunt contractum, so that consent is necessary, necessitate praecepti, sed non necessitate medii [by the necessity of precept, but not by a necessity of means]; though by human constitution such marriages may be disallowed, and the issue repute as unlawful, but the marriage cannot be annulled, l. 11. de stat. hom. l. 13 §. 6. de Adult, by which laws, not only the Issue of such marriages are excluded from succession, but the marriage itself insinuate to be null, which human constitutions cannot reach, though the magistrate or minister, celebrator of the marriage, may refuse to proceed without consent of the parents; as by the law and custom of Holland, Art. 3. Ord. Pol. It is statute that… where the parties are minor, they be not married without consent of their parents; and where they are both major, intimation must be made to the parents, and if they appear not, their consent is presumed; and if they do appear and dissent, they must condescend upon the reasons, that it may be cognosced whether they be sufficient or not: And if the marriage do otherways proceed, they account it null… neither do the civil constitutions of princes annul or dissolve marriage, whatever they may work as to the interest of the married persons… Yea, between Jews and Christians, for diversity of religion cannot annul it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals, … (Edinburgh: Anderson, 1681), pp. 28-44, p. 32</span></figcaption>

</figure><figure class="quote" id="q-89da217c34" data-kw="">
<blockquote><p>§18. Of a child’s carriage in case a parent provide an unfit mate or none at all. … 2nd Question, “What if the parent be negligent, and in due time provide no fit match? May not the child provide one for himself? Answer: A parent’s negligence is not a sufficient pretext to make a child [wholly] cast off that subiection which he owes to his parent. Yet I deny not but that a child knowing where a fit match is to be had, may make known as much to his parent (as Sampson did) and crave both his consent and help thereunto, Judg. 14:2. And if his parent give no ear to his humble suit, he may use the mediation of his kindred or other friends. Yea if necessity require that the child be married, and his parent add wilfulness to negligence, and will not be moved at all, neither by the humble suit of his child, nor by the earnest solicitation of any friends, means may be made to the Magistrate (who is in God’s place over the parent as well as over the child, and ought to afford relief unto the child) and what the Magistrate does in that case is as good a warrant to the child as if the parent had done it. The like means may be used if a parent be an idolater, heretic, or atheist, and will not yield that his child be married to any but to one of his own profession and disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London, 1662), the 5th Treatise, the Duties of Children, pp. 449-50</span></figcaption>

<blockquote><p>Secondly, the mate [spouse] must be fit… diverse men have many virtues, and yet do not fit to some women: and therefore we see many times, even the godly couples to jar when they are married, because there is some unfitness between them which makes odds. What is odds but the contrary to even?… From hence came the first use of the ring in weddings, to represent this evenness: for if it be straighter than the finger it will pinch, and if it be wider than the finger it will fall off; but if it be fit, it neither pinches nor slips: So they which are like strive not…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591), pp. 30-31</span></figcaption>

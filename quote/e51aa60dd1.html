<main class="wrap"><figure class="quote" id="q-e51aa60dd1" data-kw="">
<blockquote><p>It is a question: An sancti fruantur beatitudine ante ultimum judicium? [Whether the saints enjoy blessedness before the Last Judgment?] It was a current opinion among most of the Fathers, if not all that the souls of men after their death do not go immediately to heaven, but are in a receptacle or mansion-place till the day of Judgement, and some of late have followed it, especially the Anabaptists. The souls immediately departed have not the compleat fullness of that happiness which they shall have, yet they are not excluded from the enjoying of God, Lk. 23:43; 2 Cor. 5:1; Phil. 1:23. Some say there is a difference of those that are raised again, as Lazarus and some others; for it is likely (say they) that their souls went not into heaven, but were detained by God, who would unite them again to show forth his glory. The accidental joy of the saints (say the [Medieval] Schoolmen) shall be greater, both extensively, because it shall be in soul and body, and intensively, because the soul shall rejoyce to see the body glorified. 2. The essential glory shall increase extensively, because it shall redound unto the body. The souls of the godly immediately after their departure hence from the body are said to be in rest, Heb. 4:11 in consolation, Lk. 16:25, in security, Jn. 11:15,18, therefore they presently go to heaven, to God and Christ. Consider the names given to the state of glory: it is called Life, ‘These shall enter into life’; Rest, find rest, go to rest; our home, our Fathers’ house; a purchased and glorious inheritance; A Kingdom, the Kingdom of heaven; Joy, our Master’s joy, everlasting joy; Glory, weight of glory, eternal weight of glory; The City of our God. The Scripture calls it Paradise, a place of all delight and pleasure, alluding to that Paradise planted by God’s own hand, to make it a delight for the innocent state of man, and Abrahams bosom, wherein the Saints receive refreshing, which is a borrowed speech taken from fathers carrying and cherishing their little one, in their bosome, so the elect are cherished in the bosom of the father of all the faithful. There is perfection, perpetuity, immutability, there is Foelix securitas, secura foelicitas. Bernard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, 1654), bk. 10, ch. 4, ‘Of Everlasting Life’</cite>, pp. 869-70</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80e7476069" data-kw="">
<blockquote><p>The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3. ‘Was Christ during the three days of his death and burial a true man?’ in Theoretical Practical Theology (RHB), vol. 4, bk. 5, ch. 13, Polemical Part, §XIII</cite>, pp. 466-68</span></figcaption>

</figure><figure class="quote" id="q-605a0ea47d" data-kw="saints know one another">
<blockquote><p>Will the saints in the other world know one another? We affirm. As in the Scriptures nothing is taught expressly and distinctly on this question, so nothing is set forth to be necessarily believed concerning it. In the meanwhile, the more common opinion is the affirmative, which asserts that the saints will know each other. In our opinion, this is also the more probable.</p></blockquote>

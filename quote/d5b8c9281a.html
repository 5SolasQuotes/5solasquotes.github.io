<blockquote><p>No creature can do those things that are above nature as principal agent; however, it can cause a motion by uncreated power as instrumental agent: for as there is an obediential potency in creation, so that whatever the Creator has disposed happens in it, thus also so that it happens by means of it, which is the definition of an instrument.</p></blockquote>

<blockquote><p>74. From this is plain how there is freedom in the will. For I am said ‘to see freely’ because I can freely use the visual power for seeing; so in the matter at hand, however much any cause be natural and always uniformly acting (as far as is on its own part), yet because it does not determine nor necessitate the will to willing, but the will of its own liberty can concur with it for willing or not willing and so can freely use it, therefore is it said that ‘to will and to refuse freely’ is in our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 25th Distinction, Question: ‘Whether an act of will is caused in the will by the object moving it, or by the will moving itself’ in Ordinatio, bk. 2, dist. 15-25 tr. Peter Simpson (2025), pp. 58-71, p. 67</span></figcaption>

<blockquote><p>…yet this necessity of sinning, incident to all that are brought forth into the world, in massa peccati et perditionis, in the mass of original sin and perdition, is not such either in their, or our opinion, as whereby they cannot but sin; although they would abstain from it; though this be obtruded upon us as it was upon Remigius: whereupon he pleads for himself, and such as were of his mind in the doctrine of predestination after this manner, p 53: Nemo it a sentit aut dicit quod Dei praedestinatio aliquem invitum faciat peccare, ut jam non propriae voluntatis perversitate sed Divinae praedestinationis necessitate peccare videatur. ‘No man’ (says he) ‘does so think or speak as if God’s predestination made a man to sin against his will, in such sort as he should seeme to sin, not through the perverseness of his own will, but by the necessity of divine predestination.’ So say we; neither is this impotency of doing good, anywhere else, but in the corruption of the will, it being a moral impotency according to that of Saint Augustine, Libertas sine gratia non est libertas sed contumacia; ‘Liberty without grace, is not liberty, but wilfullness,’ and Remigius, Histor: Gottescal, p. 29, Ex quibus (says he) speaking of reprobates: Nemo potest salvari, non propter violentiam aliquam Divinae potestatis, sed propter indomabilem et perseverantem nequitiam suae iniquitatis. ‘Not one of them can be saved, not because of any violence of divine power, but by reason of the untameable and persevering naughtiness of their own iniquity.’ and p. 144: De reprobis nullum salvari ullatenus existimavi, non quia non possunt homines de bono ad malum commutari et de malis ac pravis boni ac recti fieri, sed quia in meliùs mutare noluerunt, et in pessimis operibus usque ad fiaē perseverare voluerunt. ‘None of the reprobates do we judge to be saved, not because they could not be changed from evil to good, and of evil and depraved become good and right, but because they would not be changed into better and would to the end persevere in wicked works.’ So then they could be changed but would not: But in what respect is it said they could be changed? was it in respect of the freedom of their wills without grace? Nothing less; see his own words, p. 34: Si dixisset generaliter, nemo hominum sine Dei gratia libero bene uti potest arbitrio, esset catholicus: ‘Had he said generally that no man can rightly use his free will, without the grace of God, he had been a catholic.’ But all the question is about the manner how this grace does work (to wit) whether God gives men grace to believe and repent if they will, and leaves to them to perform the act of faith and repentance; or whether God works the very act of faith and repentance, not to dispute of this point out of God’s Word, which clearly teaches that God works in us the will and the deed, according to his good pleasure, Phil. 3:13. And that he makes us perfect to every good work, working in us that which is pleasing in his sight through Jesus Christ. (Heb. 13:21) Let us take notice of the discourse between Hincmarus and Remigius on this argument that till the love of God comes, man is dead, his will is dead to that which is good. Now love is only given to the believers, posse charitatem habere naturae est hominum, charitatem autem habere gratiae est fidelium. (Of the Predestination of the Saints, ch. 5) For thus writes Hincmarus, p. 3.113: Bonum quod agimus et Dei est et nostrum, Dei per praevenientem gratiam, nostrum per subsequentē liberam voluntatem. ‘The good that we do is both God’s work and ours; of God by grace preventing, ours by free will following.’ To this Remigius answers and first he says Hincmarus discourses after such a manner as if a good work were partly God’s work and partly ours; and again as if the beginning of a good work were God’s, but the effect thereof of man’s free will; although as he (Hincmarus) does endeavor to temper this speech of his, by the addition of grace, not by the fulness of it; gratiae adjunctione non etiam plenitudine, ‘by the adjunction of grace, not also by the fulness of it.’ So he should have done, says Remigius, cum vere totum sit Dei; seeing indeed the whole is God’s work; As the truth itself says, ‘Without Me ye can do nothing,’ and the apostle, ‘What hast thou that that thou hast not received?’ Whence the blessed and glorious martyr Cyprian has so defined it, saying we must glory in nothing, seeing nothing is ours, and concludes thus: Bonum itaque nostrum totum Dei est, quia totum est ex Deo; et nihil boni nostri, nostrum est, quia nihil boni nostri est ex nobis. ‘Therefore our good works are wholly God’s, and no good of ours is ours, because it is not of us.’ And to reconcile this seeming contradiction, in calling it our good, yet denying it to be from us, he concludes thus: omne bonum nostrum, et totum Dei est, donando; et totum nostrum est, accipiendo. ‘Every good thing of ours is wholy God’s in as much as He gives it, and it becomes ours full and whole, for as much as we receive it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, … (d. 1646; Oxford, 1653) | Book 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, pp. 14-15</span></figcaption>

od+agimus+et+Dei+est+et+nostrum%2C+Dei+per+praevenientem+gratiam%2C+nostrum+per+subsequente%CC%84+liberam+voluntatem.+%E2%80%98The+good+that+we+do+is+both+God%E2%80%99s+work+and+ours%3B+of+God+by+grace+preventing%2C+ours+by+free+will+following.%E2%80%99+To+this+Remigius+answers+and+first+he+says+Hincmarus+discourses+after+such+a+manner+as+if+a+good+work+were+partly+God%E2%80%99s+work+and+partly+ours%3B+and+again+as+if+the+beginning+of+a+good+work+were+God%E2%80%99s%2C+but+the+effect+thereof+of+man%E2%80%99s+free+will%3B+although+as+he+%28Hincmarus%29+does+endeavor+to+temper+this+speech+of+his%2C+by+the+addition+of+grace%2C+not+by+the+fulness+of+it%3B+gratiae+adjunctione+non+etiam+plenitudine%2C+%E2%80%98by+the+adjunction+of+grace%2C+not+also+by+the+fulness+of+it.%E2%80%99+So+he+should+have+done%2C+says+Remigius%2C+cum+vere+totum+sit+Dei%3B+seeing+indeed+the+whole+is+God%E2%80%99s+work%3B+As+the+truth+itself+says%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+the+apostle%2C+%E2%80%98What+hast+thou+that+that+thou+hast+not+received%3F%E2%80%99+Whence+the+blessed+and+glorious+martyr+Cyprian+has+so+defined+it%2C+saying+we+must+glory+in+nothing%2C+seeing+nothing+is+ours%2C+and+concludes+thus%3A+Bonum+itaque+nostrum+totum+Dei+est%2C+quia+totum+est+ex+Deo%3B+et+nihil+boni+nostri%2C+nostrum+est%2C+quia+nihil+boni+nostri+est+ex+nobis.+%E2%80%98Therefore+our+good+works+are+wholly+God%E2%80%99s%2C+and+no+good+of+ours+is+ours%2C+because+it+is+not+of+us.%E2%80%99+And+to+reconcile+this+seeming+contradiction%2C+in+calling+it+our+good%2C+yet+denying+it+to+be+from+us%2C+he+concludes+thus%3A+omne+bonum+nostrum%2C+et+totum+Dei+est%2C+donando%3B+et+totum+nostrum+est%2C+accipiendo.+%E2%80%98Every+good+thing+of+ours+is+wholy+God%E2%80%99s+in+as+much+as+He+gives+it%2C+and+it+becomes+ours+full+and+whole%2C+for+as+much+as+we+receive+it.%27%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29+%7 </figure><figure class="quote" id="q-a7f8ab653f" data-kw="">
<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’</cite>, (2022) at Public Discourse</span></figcaption>

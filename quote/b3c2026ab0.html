<main class="wrap"><figure class="quote" id="q-b3c2026ab0" data-kw="">
<blockquote><p>‘Which is your reasonable service;’ or, which is agreeable to reason; nothing is more reasonable, than that you should devote yourselves to God in this manner… Others, by ‘reasonable service,’ understand spiritual service, and expound this place by 1 Peter 2:5, where you read of spiritual sacrifices acceptable to God by Jesus Christ… And so the service or worship here spoken of is opposed to that will worship, of which you read in Colossians 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Whole Bible</cite>, (d. 1679), on Romans 12, verse 1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b2c07aaf0" data-kw="">
<blockquote><p>Worship is nothing else but a rendering to God the honor that is due to Him; and therefore the right posture of our spirits in it is as much or more due than the material worship in the modes of his own prescribing;</p></blockquote>

</figure><figure class="quote" id="q-32dd884dec" data-kw="">
<blockquote><p>The worship (or service) of God is a work commanded of God, wrought through faith (principally) to the setting forth of the glory of God. In this definition there be three things, which in the true worship of God are necessarily joined together: First: The matter (or material part), which is a work commanded of God. Secondly: The cause, namely that the same work be done of faith, in Jesus Christ. Thirdly: The end, namely the glory of God, which the worker respects, that by this means he may declare himself obedient to his heavenly father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Way of Life A Christian, &amp; Catholic Institution comprehending Principal Points of Christian Religion</cite>, … (London: Jones, 1578), ‘Of the Worship (or Service) of God’, p. 180 Hemmingsen was a Lutheran.</span></figcaption>

</figure><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, pp. 209-10</span></figcaption>

</figure><figure class="quote" id="q-b3b10d3a32" data-kw="">
<blockquote><p>…the most part of men have some form in worshipping God and please themselves in it so well that they think God well-pleased with it; but few there are who know indeed what it is to worship Him in a manner acceptable to his majesty: Now you know it is all one not to worship Him at all, as not to worship Him in that way He likes to be worshipped: Therefore the most part of men are but self-worshippers, because they please none but themselves in it, it is not the worship his soul has chosen, but their own invention, for you must take this as an undeniable ground, that God must be worshipped according to his own will and pleasure, and not according to your humor, or invention; therefore his soul abhors will-worship, devised by men out of ignorant zeal, or superstition, though there might seem much devotion in it, and much affection to God, as in the Israelites sacrificing their children, what more seeming self-denial? And yet what more real self-idolatry; God owns not such a service, for it is not service and obedience to his will and pleasure, but to men’s own will and humor: therefore a man must not look for a reward but from Himself. Now it is not only will-worship when the matter and substance of the worship is not commanded of God, but also when a commanded worship is not discharged in the appointed manner: Therefore, O how few true worshippers will the Father find? True worship must have truth for the substance and spirit for the manner of it: else it is not such a worship as the Father seeks and will be pleased with; divine worship must have truth in it, that is plain, but what was that truth, it must be conformed to the rule and pattern of worship, which is God’s will and pleasure revealed in the word of truth, true worship is the very practice of the word of truth, it caries the image and superscription and command upon it, which is a necessary ingredient in it, and constituent of it. Therefore if thy service have the image of thy own will stamped on it, it is not divine worship, but will-worship. Thus all human ceremonies and ordinances enjoined for service of God, carry the inscription not of God, but of man who is the author and original of them, and so are but adulterated and false coin, that will not pass current with God…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1066704188" data-kw="">
<blockquote><p>For even if images can be retained [in churches] without offense to God, in which are represented sacred matters and histories, and which are extant throughout holy Scripture, and call to mind for the illiterate the stories of the deeds… Luther in fact, of pious memory, cleansed Churches in those locations by means of the Word of the Lord alone from the beginning, and through this one instrument of the Holy Spirit dragged away all idols from the hearts of his hearers… before he ever removed even the smallest ones from their eyes. For an idol in the world is nothing, as the apostle testifies, 1 Corinthians 8[:4], but instead they reside in the hearts of people… Thus Luther for many years [after the Reformation] wore the monastic hood or habit [clothing]… We experienced the same thing in the Dukedom of Wurttemberg, where in the first year after the light of the Gospel was introduced and lit, and Papal idolatry abrogated, images were removed throughout all the temples before the imagination of their worship was pulled away from the minds of men. This is why it has come about that very many people were so offended by this unseasonable reformation undertaken with a two-edged sword… that neither listened to evangelical assemblies nor approached their sacraments any longer, but rather clung to their Papist idolatry till their final breath, despising the teaching of the Gospel and the true use of the sacraments. This was the fruit of the unseasonable reformation in which everything was destroyed with no regard given to the weak in faith… But there is less danger when pure and genuine doctrine is heard, by which all people are called away from idolatry to the true worship of God in daily meetings, should they be retained, than if they should be abolished rashly and unthoughtfully. Because of this, we think that the magistrate of each place sins less, and takes counsel to the advantage of the salvation of souls far better, if they have endured them longer than if they have unseasonably abrogated them… If in fact they are matters of indifference [adiaphora], as is the consensus between us… Beza: This whole business can best be described as resting on two points, namely, the prudence of pastors and the consideration of circumstances… The custom was observed in certain places that images of this kind were retained for four years after reformation. But I do not want to fight with anyone about these things or reprove the deeds of other people; let us just be on guard against all opportunities for idolatry, as much as possible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’ Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza. | Andreae:, pp. 472-75</span></figcaption>

</figure><figure class="quote" id="q-dc45fd21f5" data-kw="">
<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>

<blockquote><p>It should make me come with expectation of great things from God; do not come unto God as unto an empty vine, but as unto a full vine, and the more thy faith is raised to expect great things from God, the more acceptable art thou to God: Certainly the higher anyone’s faith is raised when they come into his presence, to expect the greatest things, the more acceptable;</p></blockquote>

</figure><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>

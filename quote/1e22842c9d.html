<main class="wrap"><figure class="quote" id="q-1e22842c9d" data-kw="">
<blockquote><p>But, alas! what need is there of miracles, such as healing sick bodies and restoring sight to blind eyes, when we see greater miracles done every day by the power of God’s Word? Do not the spiritually blind now see?… And if we have the thing already which such miracles were only intended to introduce, why should we tempt God in requiring further signs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-whitefield.html">John Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Arnold A. Dallimore, George Whitefield: the Life &amp; Times… (Banner of Truth, 1970), vol. 1</cite>, pp. 348-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

— John Whitefield, Arnold A. Dallimore, George Whitefield: the Life &amp; Times… (Banner of Truth, 1970), vol. 1, pp. 348-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%2C+alas%21+what+need+is+there+of+miracles%2C+such+as+healing+sick+bodies+and+restoring+sight+to+blind+eyes%2C+when+we+see+greater+miracles+done+every+day+by+the+power+of+God%E2%80%99s+Word%3F+Do+not+the+spiritually+blind+now+see%3F%E2%80%A6+And+if+we+have+the+thing+already+which+such+miracles+were+only+intended+to+introduce%2C+why+should+we+tempt+God+in+requiring+further+signs%3F%E2%80%9D%0A%0A%E2%80%94+John+Whitefield%2C+Arnold+A.+Dallimore%2C+George+Whitefield%3A+the+Life+%26+Times%E2%80%A6+%28Banner+of+Truth%2C+1970%29%2C+vol.+1%2C+pp.+348-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e22842c9d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e22842c9d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-miracles-the-cessation-of-the-gift-of-miracles/#:~:text=But%2C%20alas%21%20what%20need%20is%20there,tempt%20God%20in%20requiring%20further%20signs&amp;text=But%2C%20alas%21%20what%20need%20is%20there%20of%20miracles&amp;text=should%20we%20tempt%20God%20in%20requiring%20further%20signs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c212e3221" data-kw="">
<blockquote><p>By this term [‘prophets’ in this passage] he means (in my opinion) not those who were endowed with the gift of prophesying, but those who were endowed with a peculiar gift, not merely for interpreting Scripture, but also for applying it wisely for present use. My reason for thinking so is this, that he prefers prophecy to all other gifts, on the ground of its yielding more edification — a commendation that would not be applicable to the predicting of future events. Farther, when he describes the office of prophet, or at least treats of what he ought principally to do, he says that he must devote himself to consolation, exhortation, and doctrine. Now these are things that are distinct from prophesyings. Let us, then, by ‘prophets’ in this passage understand, first of all, eminent interpreters of Scripture, and farther, persons who are endowed with no common wisdom and dexterity in taking a right view of the present necessity of the Church, that they may speak suitably to it, and in this way be, in a manner, ambassadors to communicate the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians 12, verse 28</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-19b35ae52e" data-kw="">
<blockquote><p>Fecundity: “increase and multiply.” These words can have: (1) an imperative sense, in which way the ancient Hebrews wanted there to be here a universal precept, placed upon all people, of contracting marriage, which they call ונמה פיריה מצות” ,the commandment of fruitfulness and multiplication,” because one who does not confirm this commandment has no part, they say, in the age to come. But in this way the commandment would fall even upon brute beasts, since the same thing is said of them in verse 22; in this way also there would be a commandment to have dominion over the fish, “have dominion over the fish of the sea,” and so forth. (2) A concessive sense, just as in Genesis 2:16 and Deuteronomy 14:11, 20. Finally, (3) a promissory sense, so that the imperative stands in place of the future, “increase” in place of “you will increase,” and so forth, such that he is promising fertility, power, and appetite to beget what is similar to them; hence this is said only of fecund things, but not of light, stars, plants, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-mastricht.html">Peter Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3, bk. 3</cite>, ch. 9, Exegetical Part, p. 252</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-8203363a8d" data-kw="">
<blockquote><p>It is not by Romanists only that it is denied, practically at least, if not theoretically. Nothing is more common among Protestants, especially in our day, than the attempt to coerce the conscience of men by public opinion; to make the opinions of men on questions of morals a rule of duty for the people, and even for the Church. If we would stand fast in the liberty wherewith Christ has made us free, we must adhere to the principle that in matters of religion and morals the Scriptures alone have authority to bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. VI, §4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-91df145c0c" data-kw="">
<blockquote><p>This statement does not rest upon any express declaration of the Scriptures. It is, however, a concise and correct mode of asserting a plain Scriptural fact, namely, that God made to Adam a promise suspended upon a condition, and attached to disobedience a certain penalty. This is what in Scriptural language is meant by a covenant, and this is all that is meant by the term as here used. Although the word covenant is not used in Genesis, and does not elsewhere, in any clear passage, occur in reference to the transaction there recorded, yet inasmuch as the plan of salvation is constantly represented as a New Covenant, new, not merely in antithesis to that made at Sinai, but new in reference to all legal covenants whatever, it is plain that the Bible does represent the arrangement made with Adam as a truly federal transaction. The Scriptures know nothing of any other than two methods of attaining eternal life: the one that which demands perfect obedience, and the other that which demands faith. If the latter is called a covenant, the former is declared to be of the same nature. It is of great importance that the Scriptural form of presenting truth should be retained. Rationalism was introduced into the Church under the guise of a philosophical statement of the truths of the Bible free from the mere outward form in which the sacred writers, trained in Judaism, had presented them. On this ground the federal system, as it was called, was discarded. On the same ground the prophetic, priestly, and kingly offices of Christ were pronounced a cumbrous and unsatisfactory form under which to set forth his work as our Redeemer. And then the sacrificial character of his death, and all idea of atonement were rejected as mere Jewish drapery. Thus, by theory of accommodation, every distinctive doctrine of the Scriptures was set aside, and Christianity reduced to Deism. It is, therefore, far more than a mere matter of method that is involved in adhering to the Scriptural form of presenting Scriptural truths. God then did enter into a covenant with Adam. That covenant is sometimes called a covenant of life, because life was promised as the reward of obedience. Sometimes it is called the covenant of works, because works were the condition on which that promise was suspended, and because it is thus distinguished from the new covenant which promises life on condition of faith. …The condition of the covenant made with Adam is said in the symbols of our church to be perfect obedience. That that statement is correct may be inferred (1.) From the nature of the case and from the general principles clearly revealed in the word of God. Such is the nature of God, and such the relation which He sustains to his moral creatures, that sin, the transgression of the divine law, must involve the destruction of the fellowship between man and his Creator, and the manifestation of the divine displeasure. The Apostle therefore says, that he who offends in one point, who breaks one precept of the law of God, is guilty of the whole. (2.) It is everywhere assumed in the Bible, that the condition of acceptance under the law is perfect obedience. “Cursed is every one who continueth not in all things written in the book of the law to do them.” This is not a peculiarity of the Mosaic economy, but a declaration of a principle which applies to all divine laws. (3.) The whole argument of the Apostle in his epistles to the Romans and to the Galatians, is founded on the assumption that the law demands perfect obedience. If that be not granted, his whole argument falls to the ground. The specific command to Adam not to eat of a certain tree, was therefore not the only command he was required to obey. It was given simply to be the outward and visible test to determine whether he was willing to obey God in all things. Created holy, with all his affections pure, there was the more reason that the test of his obedience should be an outward and positive command; something wrong simply because it was forbidden, and not evil in its own nature. It would thus be seen that Adam obeyed for the sake of obeying. His obedience was more directly to God, and not to his own reason. The question whether perpetual, as well as perfect obedience was the condition of the covenant made with Adam, is probably to be answered in the negative. It seems to be reasonable in itself and plainly implied in the Scriptures that all rational creatures have a definite period of probation. If faithful during that period they are confirmed in their integrity, and no longer exposed to the danger of apostasy. Thus we read of the angels who kept not their first estate, and of those who did. Those who remained faithful have continued in holiness and in the favour of God. It is therefore to be inferred that had Adam continued obedient during the period allotted to his probation, neither he nor any of his posterity would have been ever exposed to the danger of sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (repr. Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.117–18, 119–120.</cite></span></figcaption>

<blockquote><p>Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law</p></blockquote>

<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>There are some general obscure threatenings annexed to the prohibitions in the Law of Nature; that is, Nature may discern that God will punish the breakers of his Law, but how, or with what degree of punishment it cannot discern: Also it may collect that God will be favorable and gracious to the obedient: but it neither knows truly the conditions, nor the nature or greatness of the reward, nor God’s engagement thereto. Therefore as it is in Nature, it is a mere Law; and not properly a Covenant. Yea to Adam in his perfection, the form of the Covenant [of Works] was known by superadded revelation, and not written naturally in his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification… (Hague, 1655), thesis 3</cite>, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“There are some general obscure threatenings annexed to the prohibitions in the Law of Nature; that is, Nature may discern that God will punish the breakers of his Law, but how, or with what degree of punishment it cannot discern: Also it may collect that God will be favorable and gracious to the obedient: but it neither knows truly the conditions, nor the nature or greatness of the reward, nor God’s engagement thereto. Therefore as it is in Nature, it is a mere Law; and not properly a Covenant. Yea to Adam in his perfection, the form of the Covenant [of Works] was known by superadded revelation, and not written naturally in his heart.”

— Richard Baxter, Aphorisms of Justification… (Hague, 1655), thesis 3, pp. 9-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+are+some+general+obscure+threatenings+annexed+to+the+prohibitions+in+the+Law+of+Nature%3B+that+is%2C+Nature+may+discern+that+God+will+punish+the+breakers+of+his+Law%2C+but+how%2C+or+with+what+degree+of+punishment+it+cannot+discern%3A+Also+it+may+collect+that+God+will+be+favorable+and+gracious+to+the+obedient%3A+but+it+neither+knows+truly+the+conditions%2C+nor+the+nature+or+greatness+of+the+reward%2C+nor+God%E2%80%99s+engagement+thereto.+Therefore+as+it+is+in+Nature%2C+it+is+a+mere+Law%3B+and+not+properly+a+Covenant.+Yea+to+Adam+in+his+perfection%2C+the+form+of+the+Covenant+%5Bof+Works%5D+was+known+by+superadded+revelation%2C+and+not+written+naturally+in+his+heart.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Aphorisms+of+Justification%E2%80%A6+%28Hague%2C+1655%29%2C+thesis+3%2C+pp.+9-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5caa5bb914.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5caa5bb914.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=There%20are%20some%20general%20obscure%20threatenings,not%20written%20naturally%20in%20his%20heart&amp;text=There%20are%20some%20general%20obscure%20threatenings%20annexed%20to&amp;text=revelation%2C%20and%20not%20written%20naturally%20in%20his%20heart" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d25d2c5fd9" data-kw="">
<blockquote><p>But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.</p></blockquote>

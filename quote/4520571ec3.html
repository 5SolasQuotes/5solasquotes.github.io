<main class="wrap"><figure class="quote" id="q-4520571ec3" data-kw="">
<blockquote><p>And whatsoever is done in any such exercise of religion, for the end and purpose of pleasing God and getting grace from him with respect of conscience to Him (as esteeming that He must and will have it so, or else the service shall not be well-pleasing and acceptable to Him) this is a part of worship, or of divine service.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33a10a09f9" data-kw="">
<blockquote><p>Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

asquotes.github.io%2Fquote%2F33a10a09f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33a10a09f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=Civil%20worship%20is%20the%20honor%20done,invocation%20signified%20by%20any%20bodily%20adoration&amp;text=Civil%20worship%20is%20the%20honor%20done%20to%20men&amp;text=as%20namely%20invocation%20signified%20by%20any%20bodily%20adoration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b4884cf61b" data-kw="">
<blockquote><p>Step Five: Analysis Becomes Myth At this stage, the explanation stops needing actual proof. Not because the evidence is overwhelming, but because the story has become self-sustaining. It can explain everything if you just try hard enough. … The belief now no longer functions as an explanation of reality, instead it’s a closed or “self-sealing” system. It can’t be tested, corrected, or falsified. And most importantly, it can’t be escaped without significant psychological cost. It’s a bit like a prison. Because at this point, abandoning it would mean admitting that the soothing clarity you felt was an illusion. This allows anxiety back in the front door, often holding hands with public humiliation. For many “disaffected” and isolated young men, this is an intolerable duo to entertain. But once a belief can’t be falsified, it’s no longer analysis. It’s a mythology. And mythology has a dangerous advantage: it feels deeper than facts, like a soul-level insight. You’ve finally seen behind the curtain to where the puppet masters pull the strings. You don’t have to guess or speculate, you know. … Step Six: Myth Becomes Moral Signal This is when conspiracy thinking stops being a private explanation held by an individual, and instead becomes a public signal to others. You can hear it in the language: … ”If you don’t see it, you’re asleep.” ”Once you see it, you can’t unsee it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/will-spencer.html">Will Spencer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Eight Steps to Scapegoating’</cite>, (2026)</span></figcaption>

</figure><figure class="quote" id="q-d60eb4534a" data-kw="">
<blockquote><p>The means for the maintenance of the poor are collected, by the deacons, the first day of the week, and other days of the public assembling of the people to the worship of God, at the entry of the Church. And if this prove not a competency, then do the people either bring in their charity on such days as are appointed by the eldership, or are willing to be taxed, according as they shall be judged to be able. In some cities, and parishes where this order has been carefully observed, none have been suffered to beg, and none have lacked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Alexander Henderson, The Government and Order of the Church of Scotland</cite>, (1641), pp. 31-32</span></figcaption>

</figure><figure class="quote" id="q-886a61bd3d" data-kw="">
<blockquote><p>38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

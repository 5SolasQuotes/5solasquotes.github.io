<blockquote><p>1. The medieval scholastics that Roman Catholics turn to for the doctrine of God, such as Thomas Aquinas and Bonaventure, were completely ignorant of Greek and Hebrew, so they are incapable of giving a useful discussion of the names of God. Only one question of Aquinas’s Summa is devoted to the names of God ([pt. 1] q. 13), and it doesn’t actually state what his names are and what they mean, how they are used in Scripture, etc. Instead, it focuses on scholastic questions like “Whether any name can be applied to God substantially?” and “Whether what is said of God and of creatures is univocally predicated of them?” Protestant writers, meanwhile, such as Zanchi, Polanus, etc, give lengthy and profound analyses of the names of God in Greek and Hebrew.” (Charles Johnson, ‘No, Roman Catholic authors are not better on the doctrine of God’) . God’s Attributes Agreements Calvin: “I am that I am</p></blockquote>

</figure><figure class="quote" id="q-2d8fd31874" data-kw="">
<blockquote><p>Though Christian dogma cannot be explained in terms of Greek philosophy, it also did not come into being apart from it. There is as yet no dogma and theology, strictly speaking, in Scripture. As long as revelation itself was still in progress, it could not become the object of scientific reflection. Inspiration had to be complete before reflection could begin. To speak of “Mosaic”, “Pauline”, or the “Bible’s” theology and dogmatics therefore, is not advisable; the word theology, for that matter, does not occur in Scripture and has only gradually acquired its present meaning. Theology first arose in the Christian community after the naïveté of childhood lay behind it and the adult thinking mind had awakened. Gradually a need arose to think through the ideas of revelation, to link it with other knowledge and to defend it against various forms of attack. For this purpose people needed philosophy. Scientific theology was born with its help. This did not, however, happen accidentally. The church was not the victim of deception. In the formation and development of the dogmas, the church fathers made generous use of philosophy. They did that, however, in the full awareness of and with clear insight into the dangers connected with that enterprise; they were conscious of the grounds on which they did it with express recognition of the word of the apostles as the only rule of faith and conduct. For that reason also they did not utilize the whole of Greek philosophy but made a choice; they only utilized the philosophy that was most suited to help them think through and defend the truth of God. They went to work eclectically and did not take over any single philosophical system, be it either from Plato or from Aristotle, but with the aid of Greek philosophy produced a Christian philosophy of their own. Furthermore, they only used that philosophy as a means. Just as Hagar was the servant of Sarah, as the treasures of Egypt were employed by the Israelites for the adornment of the tabernacle, as the wise men from the East placed their gifts at the feed of the child in Bethlehem, so, in the opinion of the church fathers, philosophy was the servant of theology. From everything it is clearly evident that the use of philosophy in theology was based, not on a mistake, but on firm and clear conviction. The church fathers knew what they were doing. Mind you, this does not rule out the possibility that at some points the influence of philosophy was too strong. But in that connection we must make a distinction between the theology of the fathers and the dogmas of the church. The church was at all times alert against the misuse of philosophy; it not only rejected Gnosticism but also condemned Origenism. And up until now no one has succeeded in explaining the dogmas materially in terms of philosophy; however often this has been attempted, in the end the scriptural character of orthodoxy has been vindicated. Initially the Reformation assumed a hostile posture toward scholasticism and philosophy. But it soon changed its mind. Because it was not, nor wanted to be, a sect, it could not do without theology. Even Luther and Melanchton, therefore, already resumed the use of philosophy and recognized its usefulness. Calvin assumed this high position from the start, saw in philosophy an “outstanding gift of God”, and was followed in this assessment by all Reformed theologians. The question here is not whether theology should make use of a specific philosophical system. Christian theology has never taken over any philosophical system without criticism and given it the stamp of approval. Neither Plato’s nor Aristotle’s philosophy has been held to be the true one by any theologian. That theologians nevertheless preferred these two philosophical systems was due to the fact that these systems best lent themselves to the development and defense of the truth. Present also was the idea that the Greeks and Romans had been accorded a special calling and gift for the life of culture. Still to this day, in fact, our whole civilization is built upon that of Greece and Rome.</p></blockquote>

<blockquote><p>The controversy over Aristotelianism hardly ended with Aquinas’s work, much less with his death. In 1270, while Aquinas was still alive, Stephen Tempier, the bishop of Paris, had condemned several propositions associated with Averroism, though these did not include any defended by Aquinas. But after Aquinas’s death, in 1277, Tempier went on to condemn 219 propositions, some of which were clearly to be found in Aquinas. This led Albert the Great to come to Paris to defend his former student, and other Dominicans also threw themselves into the task of upholding the doctrine of their fellow friar. Indeed, the study of Aquinas was to become mandatory within the order. This Dominican defense and consolidation of Aquinas’s teaching beginning just after his death is sometimes taken by historians to constitute the beginning of the first of three periods in the history of Thomism. That it was successful is evidenced by the facts that Aquinas was declared a saint by Pope John XXII in 1323, and that two years later, in 1325, Tempier’s condemnations of 1277 were revoked by his successor. Just as Dominicans had generally defended Aquinas, members of the Franciscan order had been among his fiercest critics. The rivalry between the two orders would only become more bitter as a result of the influence of the Franciscan thinkers John Duns Scotus (c. 1266-1308) and William of Ockham (c. 1287-1347). Scotus and Ockham tended toward voluntarism, which emphasizes God’s will over his intellect and thus makes his actions more impenetrable to our rational understanding than they are on Aquinas’s account. Ockham is famously associated with nominalism, which denies the existence of universals. From the Thomistic point of view, these doctrines threaten to undermine the intelligibility of the world and the rational foundations of ethics and of our knowledge of God. Aquinas’s positions were ably defended against them by the likes of John Capreolus (1380-1444), who became known as princeps Thomistarum or ‘foremost Thomist.’ A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63)…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The controversy over Aristotelianism hardly ended with Aquinas’s work, much less with his death. In 1270, while Aquinas was still alive, Stephen Tempier, the bishop of Paris, had condemned several propositions associated with Averroism, though these did not include any defended by Aquinas. But after Aquinas’s death, in 1277, Tempier went on to condemn 219 propositions, some of which were clearly to be found in Aquinas. This led Albert the Great to come to Paris to defend his former student, and other Dominicans also threw themselves into the task of upholding the doctrine of their fellow friar. Indeed, the study of Aquinas was to become mandatory within the order. This Dominican defense and consolidation of Aquinas’s teaching beginning just after his death is sometimes taken by historians to constitute the beginning of the first of three periods in the history of Thomism. That it was successful is evidenced by the facts that Aquinas was declared a saint by Pope John XXII in 1323, and that two years later, in 1325, Tempier’s condemnations of 1277 were revoked by his successor. Just as Dominicans had generally defended Aquinas, members of the Franciscan order had been among his fiercest critics. The rivalry between the two orders would only become more bitter as a result of the influence of the Franciscan thinkers John Duns Scotus (c. 1266-1308) and William of Ockham (c. 1287-1347). Scotus and Ockham tended toward voluntarism, which emphasizes God’s will over his intellect and thus makes his actions more impenetrable to our rational understanding than they are on Aquinas’s account. Ockham is famously associated with nominalism, which denies the existence of universals. From the Thomistic point of view, these doctrines threaten to undermine the intelligibility of the world and the rational foundations of ethics and of our knowledge of God. Aquinas’s positions were ably defended against them by the likes of John Capreolus (1380-1444), who became known as princeps Thomistarum or ‘foremost Thomist.’ A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63)…”

<blockquote><p>A being is considered as possible, or as actual. When it is considered as possible, it is said to have an essence or nature; such were all things before their creation; When it is considered as actual, then it is said to have existence also; such are all things which are created, and God himself the Creator. Essence, therefore, is but the very nature of any being, whether it be actually existing or not… There is but one Being which includes existence in the very essence of it, and that is God, who therefore actually exists by natural and eternal necessity; but the actual existence of every creature is very distinct from its essence, for it may be, or may not be, as God pleases.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1c472c9be6" data-kw="">
<blockquote><p>Finally, they [the prophets] foresaw that after the full expiration of this exile and banishment, a prince should come, and a son should be given in the fullness of time, which should possess the throne of his father David, and take upon him the government of the Kingdom, and should establish the same in a permanent and unperishable course of continuance, peace and tranquillity for ever.

And this also was performed even then accordingly, when as the son of God was borne in the city of David: that wonderful counsellor, the mighty God, the prince of peace: who albeit died once according to the flesh, &amp; seemed to be vanquished, yet was he not holden of death above three days, but survived of his own power, and liveth for ever and ever: and in dying hath obtained an endless conquest of death, and triumpheth now (not much unlike unto Sampson) victoriously over death, hath rent in sunder the iron gates of sin, hath crushed the tyranny of the devil in pieces, and purchased everlasting life for his elect, not perishable by any assault of haughty adversary, nor vanquishable by any power of worldly policy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

And this also was performed even then accordingly, when as the son of God was borne in the city of David: that wonderful counsellor, the mighty God, the prince of peace: who albeit died once according to the flesh, &amp; seemed to be vanquished, yet was he not holden of death above three days, but survived of his own power, and liveth for ever and ever: and in dying hath obtained an endless conquest of death, and triumpheth now (not much unlike unto Sampson) victoriously over death, hath rent in sunder the iron gates of sin, hath crushed the tyranny of the devil in pieces, and purchased everlasting life for his elect, not perishable by any assault of haughty adversary, nor vanquishable by any power of worldly policy.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0da10203e8" data-kw="">
<blockquote><p>To go as pirates and catch up poor negroes or people of another land, that never forfeited life or liberty, and to make them slaves, and sell them, is one of the worst kinds of thievery in the world; and such persons are to be taken for the common enemies of mankind; and they that buy them and use them as beasts, for their mere commodity, and betray, or destroy, or neglect their souls, are fitter to be called incarnate devils than Christians, though they be no Christians whom they so abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (Soli Deo Gloria, 1990), 1:462</span></figcaption>

</figure><figure class="quote" id="q-765006402a" data-kw="">
<blockquote><p>XXVII. Self-interest, self-Government and family-government are all antecedent to publick government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-7b7d914c61" data-kw="">
<blockquote><p>Though God never, in Scripture, commands that any lesser mistakes in religion, or a simple neglect of religious duties should be punished; yet he commands magistrates, suitably and seasonably, to punish, even to death, idolaters, particularly seducers to it, Deut. xiii. 2-15; 17:2-7; Ex. xxii. 20; blasphemers, Lev. xxiv. 15-16; insolent profaners of the Sabbath, Num. xv. 30-36. Where in all the New Testament, is there a single hint of repeal of such laws, any more than of those concerning murder (Gen. ix. 6; Num. xxxv. 30-31)? Where is a single hint, that Christ’s incarnation abolished these laws and proceed for magistrates a right and power to encourage and protect heretics, blasphemers, and idolaters, who openly and obstinately labour to offend God, and destroy and damn men?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The absurdity and perfidy of all authoritative toleration of gross heresy, blasphemy, idolatry, popery, in Britain. In two letters to a friend. In which the doctrine of the Westminster Confession of Faith relative to toleration of a false religion, and the power of the civil magistrate about sacred </cite>, (1780; Glasgow, 1803), pp 38-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

ner" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-48222a1bd5" data-kw="">
<blockquote><p>…when there is a protestation against the constitution and very being of an Assembly, ‘tis true there is no submitting to it by the protesters. But yet there may be a protesting against some one or more particular deeds of an assembly when the constitution and being of it is acknowledged, and to such an assembly submission is not refused or denied by any principles of ours. So there may be a protesting or testifying against some particular abuses in a Church, and yet communion kept with that Church in lawful, true, necessary acts of divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-wood.html">James Wood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Stone Pretended to be out of the Mountain, Tried &amp; found to be a Counterfeit</cite>, (Edinburgh, 1654), pp. 348-53, from the page at Naphtali Press. Wood was a covenanting colleague of Samuel Rutherford.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

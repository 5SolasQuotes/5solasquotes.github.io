<main class="wrap"><figure class="quote" id="q-0bddb2a82d" data-kw="">
<blockquote><p>IX. Although natural liberty agrees in essentials with the liberty of man constituted in other states, still it differs greatly in accidentals. For the liberty of glory in blessedness is not to be able to sin (non posse peccare). The liberty of sinners in the state of sin is not to be able not to sin (non posse non peccare). The liberty of believers, in grace, is to be able to sin, and not to sin (posse peccare et non peccare). But the liberty of Adam was to be able not to sin (posse non peccare). The first was an absolute incapability of sinning; the second an incapability of acting well; the third the power of sinning and of acting well. The fourth was the power of not sinning. Augustine explains this excellently: “We must diligently and attentively examine if these good things differ, to be able not to sin (posse non peccare), and not to be able to sin (non posse peccare), to be able not to die, and not to be able to die, to be able not to leave the good, and not to be able to leave the good. For the first man was able not to sin, not to die, not to leave the good” (Admonition and Grace 12* [33] [FC 2:285; PL 44.936]). And afterwards: “Therefore the first liberty of will was to be able not to sin (posse non peccare), the last will be much greater, not to be able to sin (non posse peccare). The first immortality was the power of not dying, the last will be much greater, the incapability of dying. The first was the power of perseverance, the power to not desert the good, the last will be the happiness of perseverance, the want of power to desert the good” (ibid., pp. 285–86).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, trans. George Musgrave Giger, ed. James T. Dennison Jr., vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.9 (p. 571).</cite></span></figcaption>

</figure><figure class="quote" id="q-c4b9695639" data-kw="">
<blockquote><p>Yet God tempers the severity of this spiritual slavery, first inwardly, by certain remaining shards of the divine image and original righteousness (James 3:9): first with respect to wisdom in the intellect, when he leaves to it certain principles of truth, through which man’s judgment, both theoretical and practical, is directed, the prior through the knowledge of what is speculatively true and false, for example, that God exists, and so forth, which we observed in all people who are not thoroughly demented (Rom. 1:19–21, 32; 2:14–15), but the latter through the knowledge of what is upright and fair, and what is unfair, for example, that God must be worshipped, that to each must be rendered his own, that to another must not be done what you do not want done to yourself (Rom. 2:15), from which things the natural conscience receives some force (Rom. 2:15). Then with respect to some inclination and propensity to good in the will, one that is indeed frail and dead, but yet not absolutely non-existent, and indeed such a one as that at least the appearances of virtues are approved and honored by all (2 Tim. 3:5). In addition to these things, with regard to both intellect and will, there is, internally, restraining grace, by which sin itself is not removed or diminished, but its action is curbed so that it would not burst its restraint, a grace also by which the more upright at least abhor more atrocious sins (1 Cor. 5:1); then externally, through certain political, ecclesiastical, economic, and academic remedies, by which in some measure the license of sin is restrained, and indeed there is added a stimulus to perform upright deeds.</p></blockquote>

<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>

<blockquote><p>§XVI. In the prestituted state or the State of Glory, the blessed will be free even from misery itself and from the sense or root of sin. Concerning which state Augustine in his Enchiridion, ch. 105, says: “free will will be much more free, because it will be altogether unable to serve sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707)</cite>, p. 27 Latin</span></figcaption>

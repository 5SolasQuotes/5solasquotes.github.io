<main class="wrap"><figure class="quote" id="q-d9cb792a33" data-kw="">
<blockquote><p>Meanwhile, seeing that this brutish stupidity has overspread the globe, men longing after visible forms of God, and so forming deities of wood and stone, silver and gold, or of any other dead and corruptible matter, we must hold it as a first principle, that as often as any form is assigned to God, his glory is corrupted by an impious lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.1</span></figcaption>

</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary Mediator Invocation of saints Idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>

</figure><figure class="quote" id="q-03e5a05929" data-kw="Mary Queen of Heaven Mediator Idolatry">

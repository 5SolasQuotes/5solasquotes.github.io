<main class="wrap"><figure class="quote" id="q-aba4ef230c" data-kw="">
<blockquote><p>But such reasoning [that there is only one divine person, not three], if it is approved, is really the heresy of Sabellius. For if we also affirm of the other person everything we affirm of one person, since the two persons are one thing, then Son and Word and begotten should be affirmed of the Father in the same way that these things are affirmed of the Son. And both Father and begetter and unbegotten should be affirmed of the Son in the same way that the Father is such. But if this is so, the Father does not differ from the Son, nor the Son from the Father. Therefore, there is one person, not two.

For although God will be Father and Son, we affirm two persons because we believe the Father and the Son to be distinct from one another. For a father is always the father of someone, and a son the son of someone, nor is a father ever the father of his very self, or a son the son of his very self; rather, a father is one person, and his son another person, and a son is likewise one person, and his father another person.

Therefore, if the Father in God is not one person, and the one of whom he is the Father another person, and if the Son is not one person, and the one of whom he is the Son another person, we falsely call God a Father or a Son. For there can be no Father in God if the one of whom the Father is supposed to be the Father is not distinct from the Father. And likewise, there can be no Son in God if the one of whom the Son is supposed to be the Son is not distinct from the Son. Therefore, there will be no grounds for us to affirm that there are two persons in God, which we affirm because God is Father, and God is Son, and the Father is ever one person, and the Son another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm-of-canterbury.html">Anselm of Canterbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incarnation of the Word</cite>, (c. 1090), 3 in Anselm of Canterbury: The Major Works, eds Brian Davies and Gillian Evans, Oxford World’s Classics (Oxford: Oxford University Press, 1998), p. 242.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b6bb4e4ba" data-kw="">
<blockquote><p>What do you call Persons in the Godhead?

Ans. Such as having one Essence or being equally common, are distinguished (not divided) one from another by some incommunicable property.

How cometh it to pass that there should be this diversity of Persons in the Godhead?

Ans. Though the Essence or being of the Godhead be the same, and most simply as hath been declared; yet the manner of this being is not the same, and hence ariseth the distinction of persons, in that beside the being which is common to all, and the self-same in all, they have every one some especial property which cannot be common to the rest.

Which are these persons, and what are these personal Properties?

Ans. The first Person in order is the Father, who begetteth the Son. The second is, the Son begotten of the Father. The third is, the Holy-Ghost, proceeding from the Father and the Son.

Doth the Godhead of the Father beget the God-head of the Son?

Ans. No, but the Person of the Father begetteth the Person of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Christian Religion Summarily set down according to the Word of God: together with A Brief Epitome of the Body of Divinity</cite>, (London: Geo. Badger, 1645), pp 55-57.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

<blockquote><p>Thesis XVII. ὁμούσια (homousia) or ὁμοούσια (homoousia)… And so this term was adopted for divine phenomena in order to refute the Arians, who claimed that the Son was from the Father—not begotten from the Father’s substance but made ex nihilo. Consequently, they claim, the Son is God by participating in his power, not by nature. Therefore, against such men it was decided that the Son is ὁμούσιον (homousion) or ὁμοούσιον (homoousion) with the Father. They did not, however, intend by this term merely that the essence of the Father and of the Son is similar, as is the case in natural phenomena (this is how two essences numerically would be taken, and thus there would be numerically two gods, which is anathema). Instead, they wished to describe two realities: first, that the Son is not different from the Father in essence, not because he was made ex nihilo, but as he was begotten from the Father himself, and so from eternity. This distinction they marked by another term, coeternal. Second, that he is from the Father insofar as he is the Son, such that he is one with the Father insofar as he is God. That is to say, that the Son’s essence is not somehow a derivative essence which took its origin from another principal. The heretics called this notion ex traduce, and today some men advance this idea under the term essentiation. But we assert that the actual, complete essence—by which the Father is God—is the Son by begetting, as the essence has been shared with him by the Father. As a result, Father and Son—insofar as they subsist in one and the same essence, or are of one and the same essence numerically, with respect to essence—are the one and same God, although, nevertheless the Father is not the Son. … Thesis XX. The ancients used these formulas [such as homoousios and homousios] not to convey the notion of a plurality of essences but to show that there was identity of essence in the relations of the persons, against those who said that Christ was made ex nihilo and in fact made in time. For statements of the Arians like the following lead to that understanding: “there was a time when he was not” and, “he was created from things that were not.” In other words, that he was established from things that did not exist. Therefore the Fathers added to the Creed the phrase “true God from true God” to show that God from whom God exists, i.e., the Father, and God who is from God, i.e., the Son, are by reason of essence one God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beza on the Trinity</cite>, 21 Theses’ from Tractationes Theologicae Bezae, Volumen I (Geneva: Jean Crespin, 1570), p. 651 trans. David Noe</span></figcaption>

<blockquote><p>71. Fourthly, they [Romanists] accuse us of blasphemy against the Son of God, for denying (as they say) that He is Deus ex Deo, God of God: against the doctrine of the Nicene Creed; and this they call the atheism of Calvin and Beza: a palpable slander: for neither Calvin nor Beza did ever imagine, much less utter the same in that sense which they lay to their charges: for let [Robert] Bellarmine their sworn adversary speak for them: ‘Calvin and Beza teach’ (says he) ‘that the Son is of Himself in respect of his essence, but not in respect of his Person, and they seem to say that the essence of the Deity in Christ is not begotten, but is of itself: which opinion’ (says he) ‘I see not why it may not be called Catholic.’ Here Bellarmine tells us truly what their opinion was, and does acknowledge it to be a true catholic doctrine: and yet in the same chapter he contemns Calvin for his manner of speaking of it and of intolerable sauciness for finding fault with the harshness of the phrase used by the Nicene Council, ‘God of God: Light of light’. Mark (I pray you) his absurdity, it is catholic, and yet it may not be spoken: it is true, and yet it is to be blamed. May not a catholic doctrine be spoken then? or must the truth be smothered? This is such an inconsequence as neither reason nor religion can any ways bear withal: and for his saucy dealing with the Nicene Council, all that ever he says is, that it is durum dictum, ‘a hard phrase’: yet so that he confesses it may receive a good and commodious interpretation if it be understood in the concrete, that Christ who is God, is of the Father that is God: the word being taken personally, and not in the abstract; as if the essence of the Deity of the Son should be from the Father, which is entirely subsisting, in, of, and by its own eternal, incomprehensible, and most glorious nature: and this without question was the true intendement of the Council; for else it had not confuted, but favored the blasphemous heresy of Arius, against whom it was assembled, which Calvin and Beza do not anyways cross, but onely bring unto it a fit and fauourable exposition. Thus we have Bellarmine, Calvin’s and Beza’s patron in this doctrine, though full ill against his will: and not only him, but Ribera and Gregory de Valentia, two other no mean Rabbies, both which do conclude that: ‘the Son as He is a Person, is of another; but as He is a simple ens [being], is not of another: and that the essence does not beget the essence, but the Father the Son;’ so that either they are slanderers of the truth, or their catholic doctrines may be atheism and blasphemy.</p></blockquote>

</figure><figure class="quote" id="q-819fdb1e4d" data-kw="">
<blockquote><p>Further I say that the force and efficacy of this most pure holiness which is in the flesh of Christ, flows even into us by the working of the Holy Ghost in us, so as we be hallowed in ourselves, that is to say, we be segregated from the defilings of this world, and serve God both in spirit and body. Which benefit is everywhere in the Scriptures called sanctification, or holiness, regeneration, or newbirth, illumination or enlightening, the new man, the new creature, and the Spirit or Spiritualness.</p></blockquote>

</figure><figure class="quote" id="q-69a6893b9f" data-kw="">
<blockquote><p>XXIII. The mode by which God acts in efficacious vocation having now been explained, it remains for us to see how man conducts himself toward it. Here, there can be a twofold notion of man, as he is considered either in the first act of conversion or in the second act. Considered in the former, he behaves purely passively toward the efficacy of his vocation, contributing nothing as such, only receiving what is impressed upon him from elsewhere. XXIV. In the second act, however, there is some operation of man, and here he also performs his parts, so that he himself acts, believes, and wills rightly; yet in such a way that he perfects all these things in the virtue of the Holy Spirit as the principal mover. He indeed moves himself, but as one who has been moved, and thus he receives all good inclinations from Him, by which he is active (Phil. 2:12-13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation trans. AI (Leiden: Marcus, 1620)</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

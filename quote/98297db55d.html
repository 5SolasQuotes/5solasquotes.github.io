<main class="wrap"><figure class="quote" id="q-98297db55d" data-kw="">
<blockquote><p>But is it not really selfish to pay so much attention to personal assurance? There are some well-meaning Christians who, in spite of themselves, are inclined to think that the charge is true, and are therefore rather hesitant to speak about this assurance. But the objection is really absurd. The underlying assumption would seem to be that all attention to self with a view to its welfare, is selfish. It is a patent fact, however, that the Modernist himself does not believe that, for then he would also have to consider eating and drinking, hygienic measures, physical exercise, the cultivation of moral purity, etc., as thoroughly selfish, and yet these are the very things that are stressed by the social gospel. It is certainly no more selfish to cultivate spiritual, than it is to promote physical well-being. …

But seeking personal assurance is not in itself an evidence of selfishness. We may be seeking our spiritual well-being in this respect, in order that we may be more able to help others, to promote the cause of God, to reveal the glory of his grace, and to magnify Him for the riches of the inheritance which He has prepared for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assurance of Faith</cite>, (1928; Monergism Books, Kindle Edition, 2018), Kindle Locations 73-83.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5100f6088f" data-kw="">
<blockquote><p>Thirdly get assurance of glory with Christ, be sure of reigning with him, and thou shalt be joyful in suffering and laying all down for him were the soldier sure of the conquest and the crown, he would never fear to enter the battle, assurance of the crown of life exceedingly sweetens man’s passage through the valley of death.

Get clear and invincible evidence of God’s love, and of interest in the first resurrection, and then as Joseph willingly put of his prison garment, so shall you this garment of your flesh, and as Israel went joyfully through the sea to Canaan, so shall you through the deep waters of all sorrows, troubles, changes yea death it self, unto heaven. You shall have a desire to depart and be with Christ which is far better.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-grosse.html">Alexander Grosse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Christian’s choice. Or A sermon preached at the funeral of Mr John Cavvs one of the magistrates of the famous corporation of Plymouth. March the 29. Anno Dom. 1645</cite>, (London: John Bartlet, 1645), p. 21.</span></figcaption>

</figure><figure class="quote" id="q-5ceb932df3" data-kw="">
<blockquote><p>They were all eminently humble and lowly-minded men, if ever any were; and yet they all speak of their own state with an assured hope. Surely this should teach us that deep humility and strong assurance are perfectly compatible, and that there is not any necessary connection between spiritual confidence and pride.</p></blockquote>

</figure><figure class="quote" id="q-b8ba812231" data-kw="">
<blockquote><p>Assurance is a jewel of that worth, a pearl of that price, that he who will have it must work, and sweat, and weep, and wait to obtain it. He must not only use diligence—but he must use all diligence; not only dig—but he must dig deep, before he can come to this golden mine. Assurance is that &quot;white stone,&quot; that &quot;new name,&quot; that hidden manna, which none can obtain but such as labor for it as for life. Assurance is such precious gold, that a man must win it before he can wear it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 34</span></figcaption>

</figure><figure class="quote" id="q-88019769ac" data-kw="">
<blockquote><p>Faith may be a persuasion in some sense, but that it is a persuasion that my faith or persuasion is true, not counterfeit, and so formally, is utterly denied. How many believe and love Christ with the heart who are not persuaded that they do so; yea, much doubt whether they believe with the heart and would give a world to know (if it were possible) that they truly love God? No divine who knows that a direct act of faith and to believe is, when there is no reflex act, can deny this.</p></blockquote>

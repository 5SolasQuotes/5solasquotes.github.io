<main class="wrap"><figure class="quote" id="q-9d0147f246" data-kw="">
<blockquote><p>Without holiness no man shall see the Lord.” God’s priest is one who sanctifies all for whom he acts; he is exalted at the right hand of the Father to give repentance as well as remission of sins. These two things cannot be separated in his glorious ministrations. That they cannot be is a matter of thankfulness and joy to all who desire to be saved from sin, and not merely from its penal doom.

But it is very different with those who dread the tribunal of God, and yet are in love with sin. They admire a priesthood which shall not by the life of its members remind them of the inexorable demands of holiness, which shall usurp the kingly as well as the priestly office of God’s king and priest, and claim the prerogative of dispensing with the precept of the law as well as that of remitting its penalty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Two Professions in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-2a4490c1ea" data-kw="">
<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1</cite>, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity, pp. 359-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-db1c19f040" data-kw="">
<blockquote><p>A clear apprehension of this truth, that Jesus Christ is a King—Founder and Head of the Kingdom of Heaven upon earth, is fundamental to any proper understanding, either of the spirit and language of the Scriptures, or of the nature and relations of the Christian life. Through the whole revealed scheme of Redemption, this truth runs parallel with the truth of the Priesthood of Christ.

Nay, it is rather the essential form of that truth, and therefore the essential form of the Gospel itself. For “Christ crucified,” according to the apostle, is not merely a doctrine contained in the Gospel; it is the Gospel itself; the one idea of all the revelation which God has made of himself. As in the physical structure of man, the blood, driven by the heart to every extremity of his system, imparts to every atom the vitality without which it would be only so much dead clay: so in the structure of God’s revealed truth.

The Cross of Jesus is the grand heart of the system, and the atoning blood flowing from the cross is that which imparts to every syllable its divine life as the truth of God. Every other idea in the book has its life from this idea; without this the other truths of Scripture may be fashioned, as men who love not the doctrine of atonement have fashioned them, into a beautiful system of Ethical Theology. But when their highest skill has been exhausted upon the work, it is no living gospel.

It stands forth merely as the marble smitten by the wand of the genius of sculpture, beautiful indeed in form and structure, but a cold and lifeless thing—powerless to extend an arm to save, or speak a word of compassion to the fallen soul. So, on the other hand, conversely—as the life-bearing blood in the physical system must needs have, as one of its conditions, the bodily structure and form—at once a condition and a result of the outworking of the life that is in it; in like manner, in the system of Redemption, the doctrine of atonement by blood must ever develop its life-giving power in the formation of a body of Christ—his Church—the Kingdom of Heaven.

With this general view corresponds the successive developments of the story of Redemption. It is ever the story of an atoning Redeemer, embodied in the story of a King of Glory. The very first shadowy glimpse of Messiah at the opening of Genesis, as the seed of the woman, in the prophetic promise to the two trembling sinners in Eden, is of a wounded but victorious king, crushing the head of the mighty arch-enemy of humanity. In the amazing history of the actual fulfilment of the prophecy, even as we behold him hanging on the cross; there, over his head is still the inscription, “This is the King of the Jews.” In the last glimpse we catch of him through the door which John’s prophecy opens in heaven, He is still “the King of kings, and Lord of lords;” “the Lamb in the midst of the throne,” reigning in triumph over the myriads of his redeemed.

And so in every stage of the revelation of God’s purposes of mercy to the race. In the theology of Paul, the central truth is Christ risen and reigning, “till he hath put all enemies under his feet.” The story of the evangelist is of him concerning whom the wise men and Herod inquired, “Where is he that is born King of the Jews?” at his birth; and concerning whom Pilate inquired, “Art thou a King, then?” on the day of his death. Going back to the revelations of Him through the prophets, He appears in every vision that was vouchsafed to encourage the faith of the saints, as at once the atoning Limb that shall be led to the slaughter, but also as the Lion of the tribe of Judah. As the wailing sufferer “stricken of God,” but also as the Holy King in Zion, who “shall divide the spoil with the strong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stuart-robinson.html">Stuart Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom on Earth: A Self-Expanding Missionary Society. A Discourse for the Presbyterian Board of Foreign Missions; Preached in the First Presbyterian Church, N.Y., May 6, 1855</cite>, (New York: Edward O. Jenkins, 1855), pp 4-5.</span></figcaption>

+to+extend+an+arm+to+save%2C+or+speak+a+word+of+compassion+to+the+fallen+soul.+So%2C+on+the+other+hand%2C+conversely%E2%80%94as+the+life-bearing+blood+in+the+physical+system+must+needs+have%2C+as+one+of+its+conditions%2C+the+bodily+structure+and+form%E2%80%94at+once+a+condition+and+a+result+of+the+outworking+of+the+life+that+is+in+it%3B+in+like+manner%2C+in+the+system+of+Redemption%2C+the+doctrine+of+atonement+by+blood+must+ever+develop+its+life-giving+power+in+the+formation+of+a+body+of+Christ%E2%80%94his+Church%E2%80%94the+Kingdom+of+Heaven.%0A%0AWith+this+general+view+corresponds+the+successive+developments+of+the+story+of+Redemption.+It+is+ever+the+story+of+an+atoning+Redeemer%2C+embodied+in+the+story+of+a+King+of+Glory.+The+very+first+shadowy+glimpse+of+Messiah+at+the+opening+of+Genesis%2C+as+the+seed+of+the+woman%2C+in+the+prophetic+promise+to+the+two+trembling+sinners+in+Eden%2C+is+of+a+wounded+but+victorious+king%2C+crushing+the+head+of+the+mighty+arch-enemy+of+humanity.+In+the+amazing+history+of+the+actual+fulfilment+of+the+prophecy%2C+even+as+we+behold+him+hanging+on+the+cross%3B+there%2C+over+his+head+is+still+the+inscription%2C+%E2%80%9CThis+is+the+King+of+the+Jews.%E2%80%9D+In+the+last+glimpse+we+catch+of+him+through+the+door+which+John%E2%80%99s+prophecy+opens+in+heaven%2C+He+is+still+%E2%80%9Cthe+King+of+kings%2C+and+Lord+of+lords%3B%E2%80%9D+%E2%80%9Cthe+Lamb+in+the+midst+of+the+throne%2C%E2%80%9D+reigning+in+triumph+over+the+myriads+of+his+redeemed.%0A%0AAnd+so+in+every+stage+of+the+revelation+of+God%E2%80%99s+purposes+of+mercy+to+the+race.+In+the+theology+of+Paul%2C+the+central+truth+is+Christ+risen+and+reigning%2C+%E2%80%9Ctill+he+hath+put+all+enemies+under+his+feet.%E2%80%9D+The+story+of+the+evangelist+is+of+him+concerning+whom+the+wise+men+and+Herod+inquired%2C+%E2%80%9CWhere+is+he+that+is+born+King+of+the+Jews%3F%E2%80%9D+at+his+birth%3B+and+concerning+whom+Pilate+inquired%2C+%E2%80%9CArt+thou+a+King%2C+then%3F%E2%80%9D+on+the+day+of+his+death.+Going+back+to+the+revelations+of+Him+through+the+prophets%2C+He+appears+in+every+vision+that+was+vouchsafed+to+encourage+the+faith+of+the+saints%2C+as+at+once+the+atoning+Limb+that+shall+be+led+to+the+slaughter%2C+but+also+as+the+Lion+of+the+tribe+of+Judah.+As+the+wailing+sufferer+%E2%80%9Cstricken+of+God%2C%E2%80%9D+but+also+as+the+Holy+King+in+Zion%2C+who+%E2%80%9Cshall+divide+the+spoil+with+the+strong.%E2%80%9D%0A%0A%E2%80%94+Stuart+Robinson%2C+Christ%E2%80%99s+Kingdom+on+Earth%3A+A+Self-Expanding+Missionary+Society.+A+Discourse+for+the+Presbyterian+Board+of+Foreign+Missions%3B+Preached+in+the+First+Presbyterian+Church%2C+N.Y.%2C+May+6%2C+1855%2C+%28New+York%3A+Edward+O.+Jenkins%2C+1855%29%2C+pp+4-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb1c19f040.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db1c19f040.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/27/stuart-robinson-on-the-kingship-and-priesthood-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>If CHRIST had not been our Rock, there had been no Dwelling in him, he would not have keeped Wind and Weather off us: Therefore the Divine Nature was a Pillar on which the Human Nature did hang, and this is the Cause why CHRIST-man leans to the Divine Nature, as his Warrant in all that he does. For if ye will consider in this Work, there is Three Bargains, or Covenants to speak so.

First, GOD and Man bargained together, ye shall believe, that’s your Part. I shall give you Life Eternal, that’s my Part says GOD. Now Man dare not promise this of himself without CHRIST’s Bond to Relieve him, that is to Enable him throw his Grace to believe.

Secondly, GOD Bargains with his Son, Isaiah 53. 10. Son, if Thou shall lay down Thy Life, Thou shall see Thy Seed, and Prolong Thy Days, and have many fair Children, Psalms 2. Ye shall have the Heathen to Serve You. Heb. 1. I will be Your Father, and Ye shall be My Son. CHRIST is content, but he cannot do this alone; he must borrow Flesh and Blood from Man, and in it Suffer.

Thirdly, The Man CHRIST Bargains with the Divine Nature. The Human Nature says, I Love Man, and I will Die for him: The Divine Nature says, now I shall hold Thee up under Thy Sufferings, and Thou shall overcome Death. The Man Christ without the Back-bond (to speak so) durst not for Ten Thousand Worlds have ventured to Yoke in the Fields with the Justice of GOD, and Death, and Hell, and Sin, and the Devil, except he had the Divine Nature in a Personal Union to bear him up under his Sufferings: Therefore CHRIST when he looks upon his Sufferings, looks also upon his Warrant, Isaiah 56. I gave My Back to the Smiters, and My Checks to them that pulled off the Hair. These be the Words of the Man CHRIST.

Now because it might have been said a Man will Suffer all that his alone; But here he looks to his Warrant, Verse 7. and says, I have my Warrant with Me, The LORD GOD will help Me, I shall not be confounded. I have GODs Warrant who is united to Me in a Personal Union to bear Me up. Even Sick-like CHRIST goes down to the Grave, Psalms 16. 10. Thou wilt not leave My Soul in Hell, (or the Grave,) neither wilt Thou suffer Thy Holy One to see Corruption.

As if Christ would say, I am sure LORD Thou will be as Good as Thy Word, and make Good Thy Bargain, and will Warrant Me against Death: See then how it goes; The Man Christ takes Man by the Hand to bring him out from under GOD’s Wrath. So Beloved, Be Glad in such a Saviour, come all into the Rock, for God, Christ, and Man, all these Three are linked together as in a Chain, and Christ in the middle link of the Chain.</p></blockquote>

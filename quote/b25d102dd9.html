<main class="wrap"><figure class="quote" id="q-b25d102dd9" data-kw="">
<blockquote><p>If we do not commit the sins which daily and hourly, either in deed, word, or thoughts, we do commit: yet in the good things which we do, how many defects are there intermingled? God in that which is done, respecteth the mind &amp; intention of the doer. Cut of then all these things wherein we have regarded our own glory, those things which men do to please men, and to satisfy our own liking, those things which we do by any respect, not sincerely, &amp; purely for the love of God: and a small score will serve for the number of our righteous deeds.

Let the holiest and best thing we do, be considered: we are never better affected unto God, then when we pray; yet when we pray, how are our affections many times distracted? How little reverence do we shew unto the grand majesty of God unto whom we speak? How little remorse of our own miseries? How little taste of the sweet influence of his tender mercies do we feel? Are we not as unwilling many times to begin, and as glad to make an end; as if in saying, call upon me, he had set us a very burdensome task? It may seem somewhat extreme which I will speak: therefore let every one judge of it, even as his own heart shall tell him, and no otherwise …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works, and how the Foundation of Faith is Overthrown</cite>, (Oxford: Joseph Barnes, 1612), p. 10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-48ff4442f1" data-kw="">
<blockquote><p>Let notice be taken whether Muntzer and his companions be not of that number, who dare not plainly say as much, but they will say as we do; but being put unto it, they make Jesus Christ but an half Saviour, by bringing in good works. We say, That faith without works is dead: but they justify us not before God, neither blot out our sins.

As the flame is not without light, otherwise it were not flame; yet it’s light burneth not, it is the fire, and the flame only that doth lighten: so faith is not without works; but works burn not, i. e. take not away sin; it is faith in Christ only: thus we speak of the virtue of the property of faith, shewing that those who have this true faith, cannot be lazy, so as out of love to God, they should not do good works to glorify God, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, spring and foundation of the Anabaptists, or re-baptized of our time</cite>, trans. Joshua Scottow (1565; Cambridge MA: Marmaduke Johnson, 1668), p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>And if you please further to infer that, because perseverance in sin of infidelity and impenitency, as they are the meritorious causes of damnation so they are the meritorious causes of the decree of damnation also: I think I may with as good reason take liberty to infer from the former, that seeing faith and repentance, yea and good works also are the disposing causes of salvation, therefore they are to be accounted the disposing causes of the decree of salvation, that is of our election also: And so your opinion shall appear at full and to life in his proper colors, not an hair’s breadth different, either from the Arminian heresy of late, or from the Pelagian heresy of old.</p></blockquote>

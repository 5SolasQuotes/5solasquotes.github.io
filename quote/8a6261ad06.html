<main class="wrap"><figure class="quote" id="q-8a6261ad06" data-kw="">
<blockquote><p>The Church’s power is one and the same in things indifferent and necessary in matters of doctrine, discipline, and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find pre-existent goodness in doctrine, discipline, and matters of order. Therefore will of authority, as will, has no power to dispose of the least circumstance of time, place or person; but the Church’s power is ministerial, and determined to what is good, expedient, and convenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), An Introduction to the Doctrine of Scandal, ‘Whether or No Things Indifferent can be Commanded Because Indifferent?’, p. 649</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-eded29dfcb" data-kw="">
<blockquote><p>The Judicial Law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles (Eph. 2:14-15) and the typical signification of the kingdom of Christ (Col. 2:17; Heb. 10:1). However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments of crimes, these same all remain. The reason is that it enters into the order of the Moral Law and is thus perpetual. It was prescribed to the Jews, not as Jews, as a peculiar people admitted into Covenant, but as men, by the Law of Nature, subject with the other nations. If the same conclusion is recognized by the rule of common law from other [countries’] legislators, or it is discovered to be framed in view of the precepts of the Decalogue: it is sanctioned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘7th Place: of the Law of God’ in Common Places in The Scriptural Theology of Heidelberg</cite>, vol. 1, p. 112, trans. Adam Brink &amp; Travis Fentiman</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Judicial Law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles (Eph. 2:14-15) and the typical signification of the kingdom of Christ (Col. 2:17; Heb. 10:1). However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments of crimes, these same all remain. The reason is that it enters into the order of the Moral Law and is thus perpetual. It was prescribed to the Jews, not as Jews, as a peculiar people admitted into Covenant, but as men, by the Law of Nature, subject with the other nations. If the same conclusion is recognized by the rule of common law from other [countries’] legislators, or it is discovered to be framed in view of the precepts of the Decalogue: it is sanctioned.”

venant/the-civil-law/#:~:text=The%20Judicial%20Law%20is%20entirely%20abrogated,of%20the%20Decalogue%3A%20it%20is%20sanctioned&amp;text=The%20Judicial%20Law%20is%20entirely%20abrogated%20so%20far&amp;text=the%20precepts%20of%20the%20Decalogue%3A%20it%20is%20sanctioned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2f32087deb" data-kw="">
<blockquote><p>XIII. The glory of God, the good of souls, the happiness of Christian societies, are irresistible motives to quicken the magistrate to act (against such dangerous persons as we have described according to the law of judgement, and their different demerits) in Faith and Love: 1. In Faith; for the Christian magistrate does not act like himself, if he does not perform acts of civil-justice in faith. And it is clear that if there be no moral equity in any of the judicial laws in the Old Testament (and there are none at all extant in the New) [then] the Christian magistrate cannot perform any act of Civil-justice in faith. But it is indeed too evident to be denied that all divine laws which concern the punishment of moral transgressions are of perpetual obligation, and therefore still remain in force according to their substance and general equity, abstracted from special circumstances, typical accessories and the old forms of Mosaical polity, for: 1. These divine laws are not expired in their own nature. 2. They are not repealed by God. 3. The authority of the Lawgiver is the same under both administrations, old and new; the consciences of Christians as well as Jews are subject to his sovereign and perpetual jurisdiction. 4. The matter of the laws is moral, and very agreeable to the dictates of nature, as does appear by the several laws and decrees of heathens: Dan. 3:29; Ezra. 7:23,25-27; Ezra 10:3,5,8 compared with Num. 15:30-31; Lev. 24:15-16; Deut. 13:8-9; Zech. 13:3,6. Seducing, poisoning, slaying of souls is by the law of Nature and Nations the worst of injuries. 5. The reason of these divine laws is immutable, and that reason is sometimes expressed and declared: But it is not necessary that there should be any express ratification of every moral law in the New Testament which is plainly delivered in the Old. 6. These divine laws are independent on the will of man, and therefore indispensable man’s authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, pp. 476-74</span></figcaption>

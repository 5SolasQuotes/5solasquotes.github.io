<main class="wrap"><figure class="quote" id="q-2f912cd634" data-kw="">
<blockquote><p>3… Yet I intend not to handle the case of invasion, to show in what cases only an invasion of another nation in a hostile manner is lawful: I am from all my books, that I cannot consult with casuists in that point… Had God given me life, I intended a large Treatise concerning the Usurpation of the Government of England, and the unlawfulness of the invasion of Scotland [by Cromwell]; but my collections being lost and taken away, they must die with me; I hope more able hands will write against the invasion, though they cannot fight against the invaders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Necessary Vindication of the Principles &amp; Practices of me, Christopher Love, since my trial before, and condemnation by the High Court of Justice (London, 1651)</cite>, p. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-509b384deb" data-kw="">
<blockquote><p>Those prisoners being taken at [the Battle of] Bothwell Bridge [1679] were pressed to bind themselves not to take up arms against the king’s person and authority, under the certification of no less punishment than death. … Though they had not been subjects, but only prisoners of war in the victor’s power, to deprive them of life or liberty forever, I suppose they could not have been blamed for the preservation of their life to have given in such a bond; some who were taken prisoners by [Oliver] Cromwell, for their liberty engaged not to carry arms against him; and I do not remember that any censured them for it. What they [the opponents against taking the Scottish Indulgence] say in a parenthesis, that hazard will not make a moral change in actions, is a palpable error: If there were twenty with drawn swords waiting at the church door to kill a minister if he should come to preach, it were rash, furious, self-destroying, self-murdering zeal for a minister to venture to go to preach at that time, in despite of the hazard, so certain, visible and unavoidable, and yet it were his duty at another time to preach where there were no such hazard. For a merchant to cast his wares in the sea in a calm were wicked folly contrary to the 8th Command, a stealing from his family and himself; and yet in a storm, Paul and the passengers and mariners thought it their duty to cast out both goods and tackling of the ship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of ‘The History of the Indulgence’ (London: Cockerill, 1681)</cite>, pp. 610-11</span></figcaption>

</figure><figure class="quote" id="q-6e30913758" data-kw="">
<blockquote><p>No person is exempt by any Law of God from this punishment, be he king, queen, or emperor, he must die the death, for God has not placed them above others, to transgress his laws as they list, but to be subject to them as well as others, and if they be subject to his laws, then to the punishment also, so much the more as their example is more dangerous.</p></blockquote>

</figure><figure class="quote" id="q-48fc74db78" data-kw="">
<blockquote><p>II. These general laws are that all things be done to edification (the circumstances fitted to the end, the glory of God and the public good, the promoting of truth and godliness), that all be done in love, to the promoting of love and unity; and that all be done in order and decently, and as may avoid offense or scandal to all, both those without and those within. Gal. 6:15-16; Phil. 3:15-16; 1 Cor. 14:3, 5, 12, 26-27; Rom. 14:19; 15:2; 1 Cor. 10:23; Eph. 4:12, 16, 19; 2 Cor. 12:19; 6:3 &amp; 11:7; 1 Cor. 8:13. III. Therefore no rulers, civil or ecclesiastical, have their power to scandalize and destroy, but only to edify, being the ministers of God for good: Rom. 13:3-5; 2 Cor. 10:8; 13:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679)</cite>, sect. 4, p. 19</span></figcaption>

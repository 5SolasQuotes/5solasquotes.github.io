<main class="wrap"><figure class="quote" id="q-89204ccdb9" data-kw="">
<blockquote><p>The sorts of this worship are twofold: 1. Solemn, 2. Common… The Common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or anything of his.</p></blockquote>

</figure><figure class="quote" id="q-227cbc8461" data-kw="">
<blockquote><p>The giving of alms for the support of the suffering, the poor, and the neglected has become an increasingly important liturgical concern [in ‘twentieth-century American Protestantism’]. This is expressed by the fact that the collection of alms is made during the service of worship rather than before it or after it. This was not the older practice; there has always been a certain hesitancy about collecting alms during worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hughes Old, Themes &amp; Variations, pp. 109-10, as cited in Terry Johnson, Leading in Worship, p. 35, fn. #12</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The giving of alms for the support of the suffering, the poor, and the neglected has become an increasingly important liturgical concern [in ‘twentieth-century American Protestantism’]. This is expressed by the fact that the collection of alms is made during the service of worship rather than before it or after it. This was not the older practice; there has always been a certain hesitancy about collecting alms during worship.”

— Hughes Oliphant Old, Hughes Old, Themes &amp; Variations, pp. 109-10, as cited in Terry Johnson, Leading in Worship, p. 35, fn. #12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+giving+of+alms+for+the+support+of+the+suffering%2C+the+poor%2C+and+the+neglected+has+become+an+increasingly+important+liturgical+concern+%5Bin+%E2%80%98twentieth-century+American+Protestantism%E2%80%99%5D.+This+is+expressed+by+the+fact+that+the+collection+of+alms+is+made+during+the+service+of+worship+rather+than+before+it+or+after+it.+This+was+not+the+older+practice%3B+there+has+always+been+a+certain+hesitancy+about+collecting+alms+during+worship.%E2%80%9D%0A%0A%E2%80%94+Hughes+Oliphant+Old%2C+Hughes+Old%2C+Themes+%26+Variations%2C+pp.+109-10%2C+as+cited+in+Terry+Johnson%2C+Leading+in+Worship%2C+p.+35%2C+fn.+%2312&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F227cbc8461.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/227cbc8461.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=The%20giving%20of%20alms%20for%20the,hesitancy%20about%20collecting%20alms%20during%20worship&amp;text=The%20giving%20of%20alms%20for%20the%20support%20of&amp;text=a%20certain%20hesitancy%20about%20collecting%20alms%20during%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d2d1d6ebfb" data-kw="">
<blockquote><p>Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peaceable and Temperate Plea for Paul’s Presbytery in Scotland, 1642, London | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.”

— Samuel Rutherford, Peaceable and Temperate Plea for Paul’s Presbytery in Scotland, 1642, London | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUpon+the+first+day+of+the+week%2C+everyone+lays+by+in+store%2C+as+God+prospers+him%2C+giving+it+into+a+broad+%5Bcollection+plate%5D+at+the+church+door%2C+for+the+relief+of+the+poor%2C+as+1+Cor.+16%3A2.+It+is+provided+that+ministers+have+competent+stipends%2C+as+1+Cor.+9%3A13%2C+and+that+hospitals+be+upholden%2C+Matt+25%3A35%2C36%3B+Eccl.+11%3A1%2C2%2C+and+that+the+fabric+%5Bbuildings+and+external+furniture%5D+of+the+Church+be+upholden+by+the+%5Bcivil%5D+patron+and+free-holders+%5Bcivil+town+citizens%5D%2C%C2%B9+as+Mal.+1%3A10%3B+Hag.+1%3A4%3B+Hag.+2%3A16.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Peaceable+and+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland%2C+1642%2C+London+%7C+Ch.+20%2C+Whether+or+not+the+government+of+the+Church+of+Scotland+can+be+proved+by+God%E2%80%99s+Word+to+be+lawful%3F+%7C+11th+Article%2C+Elders+and+Deacons&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd2d1d6ebfb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d2d1d6ebfb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=Upon%20the%20first%20day%20of%20the,Mal.%201%3A10%3B%20Hag.%201%3A4%3B%20Hag.%202%3A16&amp;text=Upon%20the%20first%20day%20of%20the%20week%2C%20everyone&amp;text=citizens%5D%2C%C2%B9%20as%20Mal.%201%3A10%3B%20Hag.%201%3A4%3B%20Hag.%202%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fd3f638bb2" data-kw="">
<blockquote><p>Not long since [during the times of Romanism] what a stir was there about the more than decent, even superstitious adorning of temples, and building of altars, and brave canopies, what sumptuous things and fine knacks had they, and all to set out a pompous superstitious way of worship? This altogether prevailed; as for the purity and simplicity of Gods ways and worship, how was it trampled under feet as an unworthy contemptible thing? But these things that for a while seemed so glorious, begin to vanish, and we hope ere long will come to nothing, the very memory of them shall perish, the purity of God’s worship, and the simplicity of the Gospel in God’s ordinances shall recover their beauty and glory when those braveries shall be no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Prophesy of Hosea… (d. 1646; London, 1652), on 2:16-18</cite>, p. 412</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-d3a95cec76" data-kw="">
<blockquote><p>As to the first table, man hath some confused knowledge that there is a God, who is to be worshipped, to be spoken of with reverence and observance; that there is some time to be set apart for his worship. Now what this God is, what is his worship, what time is to be set apart for it, and how it is to be spent, there reason faileth. We have some ways that seem right to us for that; and we are guided either by our own reason, or prescript of time, or education, or example, or custom.

It is our own ways that we turn to, and therefore do not give God the glory that is due to his name: Rom. 1:21, ‘Because that when they knew God, they glorified him not as God, neither were thankful, but became vain in their imaginations, and their foolish heart was darkened.’ They do not glorify him as God. We paint out worship by our own lazy thoughts, or overdo it by some fancies of our own: this is our own way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 310.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e878b279c" data-kw="">
<blockquote><p>As altered from the seventh to the first day of the week, the Sabbath should be kept by us, as we are enjoined to do so in the fourth commandment.

That precept requires us to devote one day in seven unto God; by abstaining “even from such worldy employments and recreations, as are lawful on other days, and spending the whole time in the public and private exercises of God’s worship, except so much as it to be taken upon in the works of necessity and mercy.” It is not disputed that the fourth commandment once required this, it is, however, denied that we are now bound to keep the Sabbath, with all the strictness which it enjoins.

To those who advocate a relaxed mode of observing the Sabbath, we reply; the fourth commandment was given by God, – it was once the duty of men to keep the Sabbath as required by that precept, – it is incumbent upon them to do so still – unless it can be shewn that it has been annulled or modified by divine authority. No such inference can be drawn from our spiritual necessities. Are not our hearts as carnal as were those of the Jews?

Are not our employments as secularizing? Had not they many other days, besides Sabbath, that were set apart for public worship, while we have no other? And have not we then as much need as they had, to spend one whole seventh part of our time in the public and private exercises of God’s worship? And are we not under stronger obligations to give a whole seventh of our time unto God, than the Jews were? Our privileges are greater than theirs, and shall our homage, therefore, be less?

The economy under which we live, is more spiritual than theirs, and we will not believe it, until we are expressly told so by God, that our Sabbaths should be less sacred. It is true, that there is no precept in the New Testament, that commands us to keep the Sabbath as strictly as we are required by the fourth commandment; but we must remember, that after a law is once enacted, it continues to bind unless it is repealed, although it be not enacted a second time; and, therefore, unless we can shew that the fourth commandment has been repealed, it is still binding upon us, although no similar law be found in the New Testament.

It is also true, that the Mosaical economy has come to an end, and abolished such things as were commanded only in the judicial or ceremonial law. The fourth commandment, however, has not its place in either of these laws, but in that law which was written by the finger of God upon the tables of stone. This law, the abrogation of the Mosaical economy did not affect; amid all that it swept away, it left every one of its precepts remaining.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), pp 15-16.</span></figcaption>

</figure><figure class="quote" id="q-9757f66d0a" data-kw="">
<blockquote><p>Here I shall only give you this caution, Take heed of taking your notions of God from sense, or merely from reason:

1. Not from sense: Spiritual beings fall under no cognisance of the external senses. None ever saw God’s shape; none ever saw his similitude; and here let me caution you, against any pictures of God, or any Person in the Godhead. We are ready in our minds to form ideas in our minds of any beings according to the representations which pictures and images make of them. It is impossible but all pictures, images or external representations of the Divine Being must be teachers of lies. It is impossible that a limner [painter] should draw the true representation of a man whom he never saw. How is it possible he should draw any representation of an invisible God, a Being which he neither ever saw nor can see? The fairest pretence is for the picture of our Saviour, who assumed our nature and was a man in all things. But all those pictures must be teachers of lies too: For Christ was God-Man, and the representation of a man is no representation of the Person of the Mediator. Does any say that upon the same argument there should be no pictures drawn, for a picture does but represent our fleshly part, the soul cannot be expressed. I answer there yet are these differences:

1. The picture of our friend is the representation of a being that we know is or was informed with a reasonable soul, so as the other essential part of the man is on course understood; but it is not so as to Christ. Though the picture of an human shape has this advantage, that we may understand under it a reasonable soul, of which every man is possessed, yet we cannot under any such shape understand the Divine Nature personally united to the human nature.

2. Again even the picture of a man, if it has no similitude of the man, is but a teacher of a lie and does but help our thoughts with false notions and conceptions. And what limner ever saw the Lord in his human shape, to draw a representation of Him? What need any pictures of Christ when every man we see is as true a representation of Him as any limner can make who never saw Him in the flesh, nor a true copy to draw Him by. I am apt to believe that this was one reason of God’s so severe prohibition of images and the likeness of anything to represent God, because He knew that those things would be of this pernicious use, to give us false notions and ideas of God: for you shall observe when you have seen the pretended picture or resemblance of a man, you will fancy him according to that representation, whether the picture be anything like the person for whom it is made, yea or no.

3. To which I might add that admitting a picture of a man or a friend be not like the person and give our fancies a false notion of him, yet in this there is no sin, no defilement, no guilt upon the soul by it; but to conceive amiss of God is a thing quite of another nature and of further danger to the soul. This has made me sometimes wonder that Luther, though he abhorred images, and showed as great a detestation of them as any other, as they are used in Popery, as they are means or objects of adoration; yet allowed the use and standing of them in Churches. Certainly it is a thing of very dangerous consequence, whether in Churches or our own private houses; for we shall find a great proneness in us to form out notions of God according to such representations; and if those representations be lies and false, such will our notions be: and if this be not a fair way to fill the soul with atheistical and blasphemous thoughts concerning God and Christ, I do not know what is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defensative Armour against Four of Satan’s most fiery Darts, viz. Temptations to atheistical and blasphemous impressions and thoughts, self-murder, despair and presumption</cite>, … (London: Alsop, 1680), Blasphemous Thoughts, ch. 5, pp. 41-44</span></figcaption>

ul%2C+of+which+every+man+is+possessed%2C+yet+we+cannot+under+any+such+shape+understand+the+Divine+Nature+personally+united+to+the+human+nature.+2.+Again+even+the+picture+of+a+man%2C+if+it+has+no+similitude+of+the+man%2C+is+but+a+teacher+of+a+lie+and+does+but+help+our+thoughts+with+false+notions+and+conceptions.+And+what+limner+ever+saw+the+Lord+in+his+human+shape%2C+to+draw+a+representation+of+Him%3F+What+need+any+pictures+of+Christ+when+every+man+we+see+is+as+true+a+representation+of+Him+as+any+limner+can+make+who+never+saw+Him+in+the+flesh%2C+nor+a+true+copy+to+draw+Him+by.+I+am+apt+to+believe+that+this+was+one+reason+of+God%E2%80%99s+so+severe+prohibition+of+images+and+the+likeness+of+anything+to+represent+God%2C+because+He+knew+that+those+things+would+be+of+this+pernicious+use%2C+to+give+us+false+notions+and+ideas+of+God%3A+for+you+shall+observe+when+you+have+seen+the+pretended+picture+or+resemblance+of+a+man%2C+you+will+fancy+him+according+to+that+representation%2C+whether+the+picture+be+anything+like+the+person+for+whom+it+is+made%2C+yea+or+no.+3.+To+which+I+might+add+that+admitting+a+picture+of+a+man+or+a+friend+be+not+like+the+person+and+give+our+fancies+a+false+notion+of+him%2C+yet+in+this+there+is+no+sin%2C+no+defilement%2C+no+guilt+upon+the+soul+by+it%3B+but+to+conceive+amiss+of+God+is+a+thing+quite+of+another+nature+and+of+further+danger+to+the+soul.+This+has+made+me+sometimes+wonder+that+Luther%2C+though+he+abhorred+images%2C+and+showed+as+great+a+detestation+of+them+as+any+other%2C+as+they+are+used+in+Popery%2C+as+they+are+means+or+objects+of+adoration%3B+yet+allowed+the+use+and+standing+of+them+in+Churches.+Certainly+it+is+a+thing+of+very+dangerous+consequence%2C+whether+in+Churches+or+our+own+private+houses%3B+for+we+shall+find+a+great+proneness+in+us+to+form+out+notions+of+God+according+to+such+representations%3B+and+if+those+representations+be+lies+and+false%2C+such+will+our+notions+be%3A+and+if+this+be+not+a+fair+way+to+fill+the+soul+with+atheistical+and+blasphemous+thoughts+concerning+God+and+Christ%2C+I+do+not+know+what+is.%E2%80%9D%0A%0A%E2%80%94+John+Collinges%2C+Defensative+Armour+against+Four+of+Satan%E2%80%99s+most+fiery+Darts%2C+viz.+Temptations+to+atheistical+and+blasphemous+impressions+and+thoughts%2C+self-murder%2C+despair+and+presumption%2C+%E2%80%A6+%28London%3A+Alsop%2C+1680%29%2C+Blasphemous+Thoughts%2C+ch.+5%2C+pp.+41-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9757f66d0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9757f66d0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Here%20I%20shall%20only%20give%20you,I%20do%20not%20know%20what%20is&amp;text=Here%20I%20shall%20only%20give%20you%20this%20caution&amp;text=and%20Christ%2C%20I%20do%20not%20know%20what%20is" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9f35839d58" data-kw="">
<blockquote><p>In Queen Elizabeth’s days [1558-1603] the Bishop’s Translation of the Bible and that called “the Old one,” being faulty, were only in use. King James procured a better [translation in 1611, the KJV], but the [Anglican] Liturgy still retained the Old one. Suppose a law were made [in the 1630’s] that only the Old faulty translation be used; many refuse it and suffer for it; the [largely puritan] Parliament comes [in the 1640’s] and establishes the New Translation, and swears all men [in the Solemn League &amp; Covenant, 1643] to promote it as a part of reformation; we are in possession of it for sixteen years: then a law is made [in 1662] that all shall go to prison that use any but the Old; two thousand [ministers] break this law and use the New, and suffer part of the penalty [in the Great Ejection of 1662], and shift from the rest as long as they can. At last the State is resolved to suffer them no longer [in the following two decades], but in prison they shall lie: Hereupon many suffer imprisonment; many die there. Some few in London keep up secret worship with the New Translation and others go to the Churches where the Old is used. In the countries there is not past one minister in twelve or twenty miles that keeps up a meeting in the use of the New one. The few that yet do say that to use the Old one, or join with such as do, is covenant-breaking and false worship, and unlawful, and a going back from reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | A Real Parable</span></figcaption>

</figure><figure class="quote" id="q-8b51f5e102" data-kw="">
<blockquote><p>As for the curses drawn out of divers Psalms, where David craveth God’s help against his enemies, desiring that they may be overthrown and confounded, we say as we have said touching that which S. Paul writeth of Alexander the copper smith that is: that David having the spirit of prophecy, might have certain revelation of the overthrow of those against whom he prayed and guided by the same spirit, he forsheweth and wisheth (in conforming him self to the just judgement of God) that his enemies shall come to shame and confusion:

Considering also that this Prophet represented the head of the Church, that is to say Jesus Christ, King of Kings and only head of the faithful: And in this respect he boldly proceedeth and saith: that all they that withstand him whom God hath raised up above others, shall be sharply punished for their boldness and rashness for that they with stand God and his Christ. We may not then defend our selves with such like cursings as are found in many places of Scriptures, seeing there are certain things particular to Prophets, which cannot consequently belong to them that are much inferior to such holy personages: which did as it were foresee their overthrow at hand, whom they wished to be saved if they would have repented: …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-marlorat.html">Augustine Marlorat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of the sin against the holy ghost made by M. Augustine Marlorate. Translated out of French to the great consolation of all such as repent them of their sins, and to the astonying [sic] of those that mock and despise the gospel of our Lord Jesus Christ</cite>, (London: Lucas Harison, [1570]), unpaginated.</span></figcaption>

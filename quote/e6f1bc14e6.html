<main class="wrap"><figure class="quote" id="q-e6f1bc14e6" data-kw="">
<blockquote><p>We utterly deny that Antinomians can make good their charge, that we mix works and the Law in matter of justification, with faith, and the free grace of God.

1. Works done by grace smell of the mired fountain they spring from, they are polluted with sin; now Paul Rom. 3. saith, All Jews and Gentiles have sinned, none doth good. Psal. 14. Psal. 53. Void of sin, therefore by the Law can no flesh be justified; and so the righteousness by which we stand before God must be free of sin, and free of a breach deserving a curse, which must fall on us, if we continue not in all the Law in the most gracious works we can do, yea, if not in all that the Law requires to the least jot or tittle; we are not justified now with such a Gospel-inherent righteousness as no man hath.

2. Christ must be a Saviour by halves and quarters, if we divide the righteousness of our Saviour between faith or works, between Christ and our merits. Free grace is a jealous thing, and admitteth of neither compartner, corrivall, or fellow with Christ. Paul will have his own righteousness in the plea, but dung.

3. It quite brangleth the peace of God that issueth from justification, that it is a peace that free will createth to my self from my own works, and not a peace dipt in satisfactory blood.

4. It taketh much glory from Christ, that we wear a garment for eternity of our spinning, better the wedding garment bee begged, and all its threads be of free grace, and that full glory be given to the Lamb.

5. Law and Gospel, Grace and Law-payment must be confounded.

6. Christ must die in vain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.21, pp 23-24.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc9dff461e" data-kw="">
<blockquote><p>The Discourse of Albertus Pighius… shall be once again repeated, both for its Worth and Truth…: ‘…God therefore does justify us by his free grace or goodness wherewith he embraces us in Christ Jesus, when he clothes us with his innocency and righteousness as we are ingrafted into Him; for as that alone is true and perfect which only can endure in the sight of God, so that alone ought to be presented and pleaded for us before the divine tribunal, as the advocate of, or plea in our cause; resting hereon, we here obtain the daily pardon of sin; with whose purity being covered, our filth and the uncleanness of our imperfections are not imputed unto us, but are covered as if they were buried, that they may not come into the Jugdment of God; until the old man being destroyed and slain in us, divine Goodness receives us into peace with the second Adam.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677)</span></figcaption>

</figure><figure class="quote" id="q-a06625619a" data-kw="">
<blockquote><p>Is the law of the Lord perfect, and does it require that our obedience be perfect in its principles, parts, degrees, and continuance? It is impossible, then, that sincere obedience can entitle a sinner to eternal life. A man’s faith may be sincere, but if it is not perfect it cannot be a proper condition of life; it cannot procure for him a right to eternal life. His repentance also may be deep and sincere, but if it is not absolutely perfect, it cannot afford him the smallest title either to the progress or the consummation of life eternal.3 His obedience, in general, may be sincere, yet if it is not absolutely perfect, it cannot give him the smallest degree of title to eternal salvation. These cannot entitle him in the smallest degree to life, either according to the law as a covenant of works or as a rule of life. They are necessary as parts of salvation and as means of attaining complete salvation, but they cannot be the grounds of a man’s title to salvation. Nothing can be the ground of a believer’s title to salvation but the perfect righteousness of Jesus Christ, received by faith and imputed to him for justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 76.</span></figcaption>

<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>

<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no [legal] suffering [by the saint] for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

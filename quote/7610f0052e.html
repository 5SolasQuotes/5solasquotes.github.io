<blockquote><p>Therefore, “the law entered,” [Rom 5:20] that Adam’s offence and their own actual transgression might abound, so that now the Lord saw it needful, that there should be a new edition and publication of the covenant of works, the sooner to compel the elect unbelievers to come to Christ the promised seed, and that the grace of God in Christ to the elect believers might appear the more exceeding glorious. So that you see the Lord’s intention therein was, that they, by looking upon this covenant, might be put in mind what was their duty of old, when they were in Adam’s loins; yea and what was their duty still, if they would stand to that covenant, and so go the old and natural way to work; yea, and hereby they were also to see what was their present infirmity in not doing their duty:f that so they seeing an impossibility of obtaining life by that way of works, first appointed in Paradise, they might be humbled, and more heedfully mind the promise made to their father Abraham, and hasten to lay hold on the Messiah, or promised seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: An Explication of the Assembly’s Shorter Catechism</cite>, ed. Samuel M‘Millan, vol. 7 (Aberdeen: George and Robert King, 1850) 202–03. From Boston’s notes on The Marrow of Modern Divinity.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

<blockquote><p>Note in relation to non-conformity: as the power of eliciting religious acts extends further than the power of publicly commanding religious acts with due authority, so in resistance to public authorities, one might elicit such acts (and that with others consenting of their own will) where one might not publicly command and enforce such acts over others.</p></blockquote>

</figure><figure class="quote" id="q-39efa5d0a2" data-kw="">
<blockquote><p>21… But the most of our acquaintance [being parish ministers in England in the 1650’s, under Cromwell] were peaceable, moderate men that thought several parties [of various views of Church government] had somewhat of the right, and that the points of difference were so few and small that they might well live in peace and love, and that none of the parties was so right as that in all things they should be followed, and others trod down to set them up: And many of these were young men that, being at the schools, had not been engaged in the first quarrels [in the 1640’s and before], and desired not to side with any dividing parties, and modestly professed that they had not maturity enough to study themselves to any great confidence in the controversies [about Church government]. 22. This last sort of men beginning in Worcestshire set on foot a work of reconciling [an] Association, in which the Episcopal, Presbyterians and Independants agreed to practise so much of Church government and ministration as they were all agreed in, with mutual love and assisting concord, and to forbear one another in the rest, till God should bring us nearer (and after[wards] they added another agreement, to catechize every person in their parishes old and young that would come to them, or receive them thereto, and personally to instruct and exhort them about the practicals of religion, and preparation for death and the life to come). This example was presently followed by the ministers in Cumberland and Westmorland, Wiltshire, Dorsetshire, Essex, and going on in other counties, till the confusions [of] 1659 interrupted it [when Cromwell died], and the return of the prelacy [in 1662] ended it and many such endeavors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), section 7, pp. 130-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 228 1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way. 2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first bee removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years. 3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>

<blockquote><p>We have no new calves, new altars, new feasts, but profess, and really do hazard life and estate to put away the Prelate’s calves, images, tree-worship, altar-worship, saints, feast-days, idolatry, masses; and nothing is said here but Jesuits, and Canaanites, and Baalites, might say (though falsely) against the reformation of Josiah. Truth and purity of worship this year is new in relation to idolatry last year, but it is simpliciter older.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 32</span></figcaption>

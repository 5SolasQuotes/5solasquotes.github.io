<main class="wrap"><figure class="quote" id="q-80744c4e31" data-kw="">
<blockquote><p>6. [The Independents hold] ‘That none but confederates by the explicit Church-Covenant have right to Ordinances’: which is to keep out many precious souls from communion with their fellow-members, and their children from baptism, and to make them no better than infidels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Inconsistency of the Independent Way with Scripture &amp; Itself. Manifested in a Threefold Discourse</cite>, 1. Vindicia Vindiciarum, with Mr. Cotton. 2. A Review of Mr. Hooker’s ‘Survey of Church-Discipline’, the first part. 3. A Diatribe with the Same Mr. Hooker Concerning Baptism of Infants of Non-Confederate Parents, ch. 2 of his Third Part (London, 1651), no page number</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. [The Independents hold] ‘That none but confederates by the explicit Church-Covenant have right to Ordinances’: which is to keep out many precious souls from communion with their fellow-members, and their children from baptism, and to make them no better than infidels.”

</figure><figure class="quote" id="q-d4a248405c" data-kw="">
<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 9. ‘What is Meant in Scripture by the Word ‘Heresies’…’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-e2fe3ccfb3" data-kw="">
<blockquote><p>The fifth argument taken of the end [design] of baptism, to wit, because that they which are baptized, are baptized for dead, that is to say, that they may have a remedy against death because that baptism is a token of regeneration. They that are baptized [are baptized] to this end and purpose, that death may be put out in them, or, to rise again from the death, whereof baptism is a seal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Testament of our Lord Jesus Christ</cite>, … with brief summaries and expositions upon the hard places, on 1 Cor. 15:29 (1599)</span></figcaption>

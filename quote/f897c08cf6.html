<main class="wrap"><figure class="quote" id="q-f897c08cf6" data-kw="">
<blockquote><p>V… These habits perfected and adorned these faculties [of Adam in the Garden] excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>Plus, the proof he [Francis Suarez] tries to give there says nothing peculiar that exceeds in certainty and evidence the common method of demonstrating from effect to cause, from creation to creator, shown in sacred Scripture (Isaiah 40, Psalm 19, Romans 1 and 2, Acts 17), explained and developed by the church fathers, Thomas Aquinas with the scholastics, and more recent thinkers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-094b574bde" data-kw="">
<blockquote><p>…the Fifth Way, at least as developed by later Thomists, does indeed plausibly get us to a divine intelligence. By contrast, Paley’s argument is often acknowledged to get us at best to a designer who is extremely powerful and and intelligent, but who for all we know may yet be finite and, thus non-divine. But it is not just that Paley’ s designer may be something other than God as Aquinas understands Him. There is reason to think that Paley’s designer could not be God as Aquinas understands Him. For Aquinas, when we predicate attributes of God, we necessarily do so analogously rather than univocally. But Paley is evidently predicating attributes to his designer and to us in a univocal way, which (for the Thomist at least) entails a radically deficient conception of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147</cite>, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-2886544a8b" data-kw="">
<blockquote><p>1. The consideration of the world, the mass, the skillful production, the form, the continuous sustaining, the very wise governance, the innumerable variety, the order of bodies, the diverse movement, and the admirable virtues of which teach that there is some intelligent nature from which all of these things come. Ps. 8, 19; Rom. 1:19-20. “Seeing as τὸ γνωστὸν τοῦ θεοῦ, that which can be known of God, is manifest in them, for God has shown it to them. For the invisible things of him are clearly seen from the creation of the world, being understood by the things that are made, even his eternal power and Godhead, so that they are without excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma, bk. 2, ch. 4, Arguments for the Existence of God trans. Charles Johnson</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-94f2641b32" data-kw="">
<blockquote><p>The soul, by which each was man, was not educed from the potency of the body, but was created from nothing by God [in Gen. 2], infused into the body and personally united with it. For God breathed into the body the spirit of life, that is, the soul, Gen. 2:7, and thus man was made a living soul, in the same place and 1 Cor. 15:45. Therefore the soul of man is of a spiritual nature, as it is everywhere called ‘spirit’, Ps. 31:5; Eccl. 12:7; Zech. 12:1; Lk. 23:46; Acts 7:59. It is immortal, which cannot be killed, Mt. 10:28, but after death remains surviving, Mt. 22:32; Phil. 1:23; Lk. 16:22-23ff. Endowed also with the faculty of understanding and willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

<blockquote><p>Frame takes it for granted that “worldview” is a durable, if not permanent, concept. This assumption seems unwarranted. Worldview is itself a product of modern philosophy—of Hegel’s idealism, to be precise. Frame doesn’t see an antithesis between worldview and Christianity. But that tension needs to be explored. Worldview as a concept may not even survive the passing of the modern age. If not, then Christians need to be equipped for life after worldview.</p></blockquote>

<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 84-85, 112-13, 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>1. The medieval scholastics that Roman Catholics turn to for the doctrine of God, such as Thomas Aquinas and Bonaventure, were completely ignorant of Greek and Hebrew, so they are incapable of giving a useful discussion of the names of God. Only one question of Aquinas’s Summa is devoted to the names of God ([pt. 1] q. 13), and it doesn’t actually state what his names are and what they mean, how they are used in Scripture, etc. Instead, it focuses on scholastic questions like “Whether any name can be applied to God substantially?” and “Whether what is said of God and of creatures is univocally predicated of them?” Protestant writers, meanwhile, such as Zanchi, Polanus, etc, give lengthy and profound analyses of the names of God in Greek and Hebrew.” (Charles Johnson, ‘No, Roman Catholic authors are not better on the doctrine of God’) . God’s Attributes Agreements Calvin: “I am that I am</p></blockquote>

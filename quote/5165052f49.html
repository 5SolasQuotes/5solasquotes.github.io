<blockquote><p>‘It was a very useful companion to every biblical student…’ – Dr. Clarke. The third edition of this work is the most correct: it is beautifully printed. The notes are chiefly extracted from [Matthew] Poole’s Synopsis.” – Thomas Hartwell Horne . . Bibliographies 1800’s Darling, James – Cyclopedia Bibliographica: A Library Manual of Theological and General Literature, vol. 1 (Subjects) (1859) On Romans On Rom. 13 This is perhaps the most exhaustive bibliographical collection up to its day. It includes foreign language titles. Malcom, Howard – ‘Romans’ in ‘Commentators’ in Theological Index: References to the Principal Works in Every Department of Religious Literature, embracing nearly Seventy Thousand Citations, Arranged under Two Thousand Heads (Boston, 1868), pp. 110-11 Malcom was likely an old Princeton grad as he mentioned his indebtedness to the Drs. Alexander and Miller in the ‘Preface’. Malcom was a pastor who worked on this volume for over 40 years. This work includes titles in foreign languages and is more comprehensive than the work of James Darling. The drawback is that there is very limited reference information, which can make finding the works difficult at times. Hurst, John Fletcher – ‘Romans’ in Literature of Theology: A Classified Bibliography of Theological &amp; General Religious Literature (1896), pp. 107-9 Hurst (1834–1903) was an American bishop in the Methodist Episcopal Church, a historian, and the first Chancellor of the American University in Washington, D.C. This work only includes titles in English. “Based on his 1882 work: Biblioteca Theologica [which has a smaller listing]. An extensive classified bibliography of ‘the best and most desirable books in theology and general religious literature published in Great Britain, the United States, and the Dominion of Canada.’</p></blockquote>

<blockquote><p>But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.</p></blockquote>

<blockquote><p>[John Brown of] Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>
<div class="actions"><button class="copy" data-copy="“[John Brown of] Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)”

— Travis Fentiman, “Editor’s Extended Introduction”, “The 3rd Indulgence &amp; Wamphray’s Arguments” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 150-51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BJohn+Brown+of%5D+Wamphray+argues%2C+%E2%80%982.+If+the+Council%E2%80%99s+act+or+grant%E2%80%A6+be+sinful%2C+then+the+giving+of+this+bond+%5Bby+the+indulged%5D%E2%80%A6+must+be+much+more+sinful%E2%80%A6%E2%80%99+Yet+it+is+plain%2C+though+an+authority+sin+in+giving+commands%2C+it+is+not+necessarily+sinful+for+one+to+keep%2C+or+promise+to+keep%2C+those+commands+%28otherwise+there+would+be+no+such+thing+as+passive+obedience%2C+but+there+is%29.+%5BRichard%5D+Baxter+had+previously%2C+rightly+argued+at+length%C2%B9+against+the+view+Wamphray+puts+forth%3B+Baxter%E2%80%99s+position+was+precisely+the+indulged+ministers%E2%80%99+viewpoint.%C2%B2+%C2%B9+Baxter%2C+Five+Disputations%2C+5th+Disputation%2C+ch.+12%2C+%E2%80%9DIt+may+be+very+sinful+to+command+some+ceremonies%2C+when+yet+it+may+be+the+subjects%E2%80%99+duty+to+use+them+when+they+are+commanded%2C%E2%80%9D+pp.+460%E2%80%9363.+%C2%B2+Bairdie%3A+%E2%80%9Cyour+indulged+ministers%2C+looking+upon+these+statuted+rules%2C+at+least+ways%2C+as+unjust+upon+their+matter%2C+have+never+embraced+nor+observed+them%2C+except+it+be+in+some+civil+points+%28inflicted+on+them+as+penal%29%2C+and+that+only+so+far+as+they+judged+might+be+lawfully+submitted+unto%2C+however+unjustly+imposed.%E2%80%9D+Balm+from+Gilead%2C+p.+77.+Saul+unjustly+required+100+Philistine+foreskins+for+David+to+marry+his+daughter.+David+gave+200+%281+Sam.+18%3A17%E2%80%9327%29+and+could+have+promised+to+do+so+in+that+broken+and+declining+Church.+The+king+of+Babylon+sinfully+exacted+from+king+Zedekiah+of+Israel+an+oath+to+serve+him.+Zedekiah+broke+this+oath+and+would+not+serve+him+in+that+broken+and+declining+Church-state.+God+condemned+Zedekiah+for+it%2C+seeing+as+he+should+have+kept+the+sinfully+exacted+service+%28Eze.+17%3A11%E2%80%9319%29.+The+magistrates+sinfully+required+Christ+to+pay+an+Erastian%2C+tribute+tax+upon+the+Church+%28Mt.+17%3A24%E2%80%9327%29.+Christ%2C+speaking+of+his+example+as+a+precedent+for+all+his+disciples+for+all+history%2C+chose+the+lesser+material+evil+%28or+rather+fulfilled+the+highest+good+attainable%29%2C+submitted+to+this+bondage%2C+here+declined+the+exercise+of+his+%28and+our%29+Christian+liberty+and+publicly+gave+that+bond+while+verbally+testifying+privately+%28not+publicly%29+that+He+was+not+so+subject+%28Mt.+17%3A24%E2%80%9327%29.+Is+this+a+protestatio+contraria+facto%2C+%E2%80%9Ca+protestation+contrary+to+fact%2C%E2%80%9D+as+the+non-indulged+censured+the+indulged+with%3F%C2%B3+Did+Jesus+compromise+his+authority+or+the+exercise+of+his+ministry%3F+Pilate%E2%80%99s+court+sinfully+determined+Christ+to+be+crucified+%28Jn.+19%3A15%E2%80%9316%29.+Christ+willingly+took+up+his+cross+%28Jn.+19%3A17%29%3B+He+had+power+to+lay+down+his+own+life+%28Jn.+10%3A15%29%2C+as+we+do+%28Jn.+15%3A13%29%2C+for+his+sheep.+Therefore+the+Father+loves+Him+%28Jn.+10%3A17%29.+%C2%B3+Wodrow%2C+History%2C+2.179+%26+492.+Was+the+protest+God+told+Samuel+to+make+against+the+people%E2%80%99s+desires+having+their+own+human+king+contrary+to+the+fact+when+Samuel%2C+per+God%E2%80%99s+direction%2C+facilitated%2C+anointed+and+enthroned+king+Saul+for+them%3F+%281+Sam.+8%3A9%29%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D%2C+%E2%80%9CThe+3rd+Indulgence+%26+Wamphray%E2%80%99s+Arguments%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+pp.+150-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9001b2502.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9001b2502.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-paying-taxes/#:~:text=John%20Brown%20of%5D%20Wamphray%20argues%2C%20%E2%80%982,Saul%20for%20them%3F%20%281%20Sam.%208%3A9&amp;text=John%20Brown%20of%5D%20Wamphray%20argues%2C%20%E2%80%982.%20If%20the&amp;text=enthroned%20king%20Saul%20for%20them%3F%20%281%20Sam.%208%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

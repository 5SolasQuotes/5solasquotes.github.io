<main class="wrap"><figure class="quote" id="q-48d4512d52" data-kw="">
<blockquote><p>IV. God is no wise the author, or instigator of sin, Psal. 5.5. Ps. 45.8. For God is not only just, but also justice it self: And it is as impossible that he who is Justice it self should sin, or be the author of sin, as that whiteness should black the wall, or heat make one cold. … And yet it is certain, that he can do nothing that is contrary to his own Nature. God cannot lie, because he is truth it self. God cannot sin, because he is perfect righteousness it self. These speeches, that sin is committed either by God’s procuring or furthering, are altogether to be rooted out of divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 3.4, pp 6-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-430dc08f14" data-kw="">
<blockquote><p>…the work of the Spirit, or the Holy Ghost, [is] to sanctify. And hereupon some have thought that opposition unto holiness is the sin against the Holy Ghost: But you find here it is a ‘blasphemy,’ therefore not every opposition [is such]. And if you look into Acts 7, you find that Stephen speaking of the Jews says at verse 51, ‘Ye stiff-necked and uncircumcised in heart and ear, ye do always resist the Holy Ghost;’ yet they did not sin this sin against the Holy Ghost. Why? For Stephen prays for them, at the last verse, ‘Lord, lay not this sin to their charge.’ But now says the apostle John, in 1 John, 5:16, ‘There is a sin unto death, I do not say that ye shall pray for it.’ Had they in Stephen’s account sinned this sin unto death, he would not have prayed for them; but he did pray for them. So that this sin against the Holy Ghost does not consist in every opposition unto the work of the Holy Ghost, as it is distinct from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I. Scripture-Light the most sure Light</cite>, … delivered in three Sermons on 2 Pet. 1:19; II. Christ in Travail... (London: Cole, 1656), ‘Of the Sin Against the Holy Ghost,’, p. 356</span></figcaption>

</figure><figure class="quote" id="q-1b3756b939" data-kw="">
<blockquote><p>The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, 4.3.21</span></figcaption>

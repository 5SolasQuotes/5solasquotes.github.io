<blockquote><p>We, on the other hand, declare with Paul that no law, whether it is human or divine, justifies or makes alive. Therefore we distinguish the Law from righteousness as sharply as death from life or hell from heaven. We are prompted to declare this by the clear statement of Paul: “The Law was not given in order to justify, make live, or save, but merely in order to condemn, kill, and destroy, contrary to the opinion of all men, who naturally suppose that the Law was given in order to obtain righteousness, life, and salvation.” Such a proper distinction between the function of the Law and that of the Gospel keeps all genuine theology in its correct use. It also establishes us believers in a position as judges over all styles of life and over all the laws and dogmas of men. Finally it provides us with a faculty for testing all the spirits (1 John 4:1). By contrast, because the papists have completely intermingled and confused the doctrine of the Law and that of the Gospel, they have been unable to teach anything certain either about faith or about works or about styles of life or about judging the spirits. And the same thing is happening to the sectarians today. After these refutations and arguments, therefore, Paul teaches, at some length and with considerable beauty, that if you consider the true and best use of the Law, it is nothing but some sort of discipline toward righteousness. It humbles men and makes them ready for the righteousness of Christ, if it performs its proper function, that is, if it makes them guilty, terrifies them, makes them conscious of sin, wrath, death, and hell. When this has happened, the presumption of their own righteousness and holiness disappears, and Christ, with His blessings, begins to become sweet. Therefore the Law is not against the promises of God; it is for them. Although it does not fulfill the promise and does not grant righteousness, still, in its use and function, it humbles us and thus makes us ready for the grace and blessing of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 331.</cite></span></figcaption>

<blockquote><p>Query 1. Are believers freed from obedience to the Moral Law; or from the Moral Law as a Rule of obedience? There are some who positively or peremptorily affirm that we are freed from the Law as a Rule, and we are not, since Christ, tied to the obedience of it. Others say it still remains in force as a Rule of Obedience, though it is abolished in other respects. We are still under the conduct and commands of the Law, though not under the curses and penalties of it. Others say, again, that we are freed from the law as given by Moses, and are only tied to the obedience of it as it is given by Christ. And though they are subject to those commands, and that Law which Moses gave, yet not as he gave it, but as Christ renews it; and as it comes out of the hand, and from the authority of Christ. Joh 13.34, A new commandment I give you, that you love one another. This is a commandment, for Christ is both a Savior and a Lord; and it is a new one — not that it didn’t exist before; but because it is now renewed, and we have it immediately from the hands of Christ. I will not dislike this much; I acknowledge the Moral Law as a Rule of obedience and of Christian walking; and there will be no falling out, whether you take it as promulgated by Moses, or as handed to you and renewed by Christ. Indeed, the Law as it is considered as a Rule, can no more be abolished or changed, than the nature of good and evil can be abolished and changed. The substance of the Law is the sum of doctrine concerning piety towards God, charity towards our neighbors, temperance and sobriety towards ourselves. And for the substance of it, it is Moral and Eternal, and cannot be abrogated. We grant the circumstances, that they were but temporary and changeable, and we now have nothing to do with the Promulgator, Moses; nor the place, Mount Sinai; nor the time, fifty days after they came out of Egypt; nor yet that it was written on Tablets of stone, delivered with thunder and lightning, etc. We don’t look to Sinai the hill of bondage, but to Zion the mountain of Grace. And we take the Law as the Image of the divine Will of God, which we desire to obey, but from which we do not expect life and favor, nor fear death and rigor. And this, I conceive, is the concurrent opinion of all Divines. The Law is abrogated in respect to its power to justify or condemn; but it still remains in force to direct us in our lives. It condemns sin in the faithful, though it cannot condemn the faithful for sin. Far be that profane opinion from us, to take away the Law as a Rule, which is an inflexible rule of living. By teaching, admonishing, chiding, and reproving, it prepares us for every good work, as Calvin says. The Law is void for its damnatory power, not its directory power; we are not under its curse, but we are still under its commands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Bounds of Christian Freedom (London, 1545; 1656), 31.</cite></span></figcaption>

<blockquote><p>5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin, and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery, but, being weak through the flesh, leaves the transgressor under the curse, and man cannot by this law obtain saving grace. 6. What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit through the word or ministry of reconciliation; which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe, as well under the Old as under the New Testament.</p></blockquote>

<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.””

<blockquote><p>Obj. 9. That is not to be taught in the church which increases sin. The law increases sin. (Rom. 7:8.) Therefore, it is not to be taught. Ans. There is here a fallacy of accident in the minor proposition. The law increases sin by an accident, or on account of the corruption of man, and that in two ways. First, because the nature of man is so depraved and alienated from God, that men do not perform what they know to be pleasing to God; and, on the other hand, what they know to be prohibited by God, that they desire, and do with the greatest willingness. Secondly, because it works wrath, when men fret and murmur against God, hate and turn away from him, and rush into despair according as the law reveals to them a knowledge of their sins, and the punishment which they deserve in consequence thereof. The law in itself produces righteousness, conformity with God, love to God, etc. The law also in itself increases sin, if we understand the word increase in a different sense, viz., that it shows unto us, and brings it to pass that we acknowledge the greatness and magnitude of our sins; but not that it so increases sin as that which in itself is small is made greater and more aggravated. There are, therefore, four terms in this syllogism, in consequence of the ambiguity of the word increase in the minor proposition.</p></blockquote>

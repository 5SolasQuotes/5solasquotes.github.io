<main class="wrap"><figure class="quote" id="q-5c9449eabd" data-kw="">
<blockquote><p>‘Worship,’ in our English tongue, and as it is used to express the original scriptures, is diversely taken. Sometime largely, as when it expresses the Greek word latreuo, as Phil. 3:3, ‘we are the circumcision which worship God in the spirit:’ and Acts 24:14, ‘so worship I the God of my fathers.’ And thus both the English &amp; Greek answers to the Hebrew ghnabad [עָבַד], which properly signifies to serve, Ex. 3:12; Dt. 10:12; 2 Sam. 15:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Holy Scriptures, Worship &amp; Ministery, used in the Christian Churches Separated from Antichrist... (Amsterdam: Thorp, 1609), ‘Of Worship’</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-beaf4df64b" data-kw="">
<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wikipedia.html">Wikipedia</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Purity Spiral” 12-2025</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-f64932c74e" data-kw="">
<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652) | section 7, sermon 57</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-80aa743a1a" data-kw="">
<blockquote><p>…in the use of all indifferencies, in our meals, in our feastings, and merry meetings, in our journeys, in our ordinary talk, and discourse, in our walks, in the actions of our ordinary vocations: Indeed the rule of God’s Word does not at all either command, or forbid the matter of such actions: but the manner of performing them comes under the rule: They are all to be done to the glory of God, in the name of Christ: every good creature is to be sanctified by the Word, and prayer: That command which God gave Abraham (to walk before Him [Gen. 17:1]) is not to be straitened unto the ordinances of God, but to be extended unto all deliberate acts of a man’s life and conversation, Gen. 17:1. Zechariah (in his prophecy of the general call or conversion of Jews, and gentiles) gives this for one character of such, as shall be converted, that they shall have a sacred and sanctified use of things common and indifferent: ‘In that day shall there be upon the bells of their horses, holiness unto the Lord, yea, every pot in Jerusalem and Judah shall be holiness unto the Lord of Hosts,’ Zech. 14:20-21. Not only acts of immediate worship, but all rationall actions, whatsoever, should be offered up as spiritual sacrifices acceptable unto God by Jesus Christ, 1 Pet. 2:5. The apostle exhorts the Romans to salute one another with a holy kiss, Rom. 16:16, this kiss was no religious rite in God’s worship, but a ceremony of civility; and therefore in itself a thing indifferent: And yet the apostle requires holiness for the qualification of it: All our civil actions ought to be such, as becomes saints; that is, so far forth holy for manner, that they be free from sin, and unto the glory of God: Indeed this is a strictness impossible unto lapsed man: But though we cannot exactly and perfectly observe it, yet we may sincerely and cordially endeavor it:</p></blockquote>

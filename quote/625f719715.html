<main class="wrap"><figure class="quote" id="q-625f719715" data-kw="" data-pol="">
<blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate…</p></blockquote>
<figcaption>— <a href="../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Art. 16</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/election.html">Election</a><a class="tag" href="../topics/salvation/assurance.html">Assurance</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a></div>

</figure><figure class="quote" id="q-1ef2c0c632" data-kw="" data-pol="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>
<figcaption>— <a href="../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Head 1, Art. 12</figcaption>

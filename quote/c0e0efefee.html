<main class="wrap"><figure class="quote" id="q-c0e0efefee" data-kw="">
<blockquote><p>God not only sustains and governs all things by His providence but also impels to motion and action with His intimate power those things that move and act, in such a way that while He does not hinder the efficiency of secondary causes, He nevertheless prevents it; since His most hidden power extends to each thing and, as the wise man testifies, reaches from one end to the other mightily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XI. This seems to be the doctrine of the Roman Catechism itself, published by the order of the Council of Trent, whose words at the end of the explanation of the first article of the Creed are:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XI. This seems to be the doctrine of the Roman Catechism itself, published by the order of the Council of Trent, whose words at the end of the explanation of the first article of the Creed are:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+not+only+sustains+and+governs+all+things+by+His+providence+but+also+impels+to+motion+and+action+with+His+intimate+power+those+things+that+move+and+act%2C+in+such+a+way+that+while+He+does+not+hinder+the+efficiency+of+secondary+causes%2C+He+nevertheless+prevents+it%3B+since+His+most+hidden+power+extends+to+each+thing+and%2C+as+the+wise+man+testifies%2C+reaches+from+one+end+to+the+other+mightily.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98How+Divine+Concurrence+can+be+Reconciled+with+Free+Will%E2%80%99%2C+pp.+339-42+Latin+Le+Blanc+%281614-1675%29+was+a+French+reformed+professor+of+theology+at+Sedan.+%7C+XI.+This+seems+to+be+the+doctrine+of+the+Roman+Catechism+itself%2C+published+by+the+order+of+the+Council+of+Trent%2C+whose+words+at+the+end+of+the+explanation+of+the+first+article+of+the+Creed+are%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0e0efefee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0e0efefee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=God%20not%20only%20sustains%20and%20governs,one%20end%20to%20the%20other%20mightily&amp;text=God%20not%20only%20s </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab805995cb" data-kw="">
<blockquote><p>7. Because the opponents deny predetermining grace to good acts, and subject habitual grace to the nod and motion of the created will, so that the will by nature influences the good work prior to divine grace. Hence, if God is moved to give grace on account of previous dispositions, then conversion will begin from the endeavor, influence and natural motion of free will. But on the contrary, God begins the good work in us, Phil. 1:6. Neither man, nor angel, first gives something to God, Rom. 11:33-34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 7, State of Fallen Man, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.6.8</span></figcaption>

</figure><figure class="quote" id="q-daddf12d64" data-kw="">
<blockquote><p>[Thomas:] ‘The word of the apostle is not to be understood as if man does not will and does not run by free choice; but because free choice is not sufficient for this unless it is moved and aided by God.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-bfe47d0801" data-kw="">
<blockquote><p>We reject likewise the fictions of the Pelagianizers: Concerning the conditioned will, concerning the decree of velleity or desire. Concerning Middle or conditioned Knowledge, by which that desired determination is said to be foreseen. Concerning the intention of conditioned concourse concomitantly into the effect—and consequently concerning the simultaneous concourse and egress of grace and free will, which is really independence and primacy, pre-running and predetermination of the second cause. Concerning universal sufficient grace, and according to it a salvific calling, whose presupposition is the grace of universal redemption, reconciliation, and confederation. Which fictions have been sufficiently sifted by the authors just cited, partly also by the Dominican theologians and other genuine followers of Thomas, whom you will see alleged in those authors passim [throughout], and especially in Sylvius the Douai theologian, in his treatise On the Motion of the First Mover. Of our men, Ferri in his Orthodox Scholastic and its Defense against the Jesuit Perrin has rendered most useful service here. The Various Dissertations on the [End] Term of Life edited by Beverovicio can also be compared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

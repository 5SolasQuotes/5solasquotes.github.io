<main class="wrap"><figure class="quote" id="q-aacdbafef7" data-kw="">
<blockquote><p>And so he proceeds to answer their next query, which concerned decent behavior of men and women in Church-assemblies… so the man, being inferior to Christ, is yet above the woman, being her head. From which they may understand that order in Church-assemblies is to be observed. …having any covering on his head, that is, having his head and face covered, he dishonors himself, and does an indecent thing against the liberty and dignity of his sex, it being a sign of shame and infamy for a man to have his head covered, but was a sign of power and dominion (in that country) to have his head, and face bare and uncovered… …He further appeals to the common custom of those countries, and demands of them whether it would not be uncomely for men to wear long and dishevelled hair, like women, to whom nature has given long hair for an ornament and a covering, and so to be a token to them of their subjection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-cradock.html">Samuel Cradock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Apostolical History, containing the Acts, Labors, Travels, Sermons, Discourses, Miracles, Successes &amp; Sufferings of the Holy Apostles</cite>, … (London, 1672), ch. 6, section 7, pp. 171-2 Cradock (1621?–1706) was an English presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c30adc8ce" data-kw="">

</figure><figure class="quote" id="q-d95edf01bb" data-kw="">
<blockquote><p>Three things about the worship of God are to be considered: 1. The kinds of it… 2. The parts of it… 3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-586625ff3c" data-kw="">
<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). … 13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. … 14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). … 15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. … 16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on 1 Cor. 11, n.p.</span></figcaption>

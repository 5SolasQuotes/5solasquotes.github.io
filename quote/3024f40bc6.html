<main class="wrap"><figure class="quote" id="q-3024f40bc6" data-kw="">
<blockquote><p>From this, also, we infer, that we cannot be justified freely through faith alone without at the same time living holily. For these fruits of grace are connected together, as it were, by an indissoluble tie, so that he who attempts to sever them does in a manner tear Christ in pieces. Let therefore the man who seeks to be justified through Christ, by God&#x27;s unmerited goodness, consider that this cannot be attained without his taking him at the same time for sanctification, or, in other words, being renewed to innocence and purity of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Epistles to the Corinthians</cite>, 1 Corinthians 1:30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/distinguished-but-inseparable.html">Distinguished but inseparable</a></span><span class="t"><a href="../topics/union-with-christ/union-and-justification-sanctification.html">Union and Justification / Sanctification</a> › <a href="../topics/union-with-christ/union-and-justification-sanctification/both-flow-from-union.html">Both flow from union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2292c0d676" data-kw="">
<blockquote><p>In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/osiander.html">Osiander</a> › <a href="../topics/union-with-christ/osiander/essential-righteousness.html">Essential righteousness</a></span><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/the-confusion-of-the-two.html">The confusion of the two (Rome)</a></span></div>

</figure><figure class="quote" id="q-b5c6d58415" data-kw="">
<blockquote><p>Since faith embraces Christ as he is offered by the Father, and he is offered not only for justification, for forgiveness of sins and peace, but also for sanctification, as the fountain of living waters, it is certain that no man will ever know him aright without at the same time receiving the sanctification of the Spirit; or, to express the matter more plainly, faith consists in the knowledge of Christ; Christ cannot be known without the sanctification of his Spirit: therefore faith cannot possibly be disjoined from pious affection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.8</span></figcaption>

</figure><figure class="quote" id="q-eceb6fae86" data-kw="">
<blockquote><p>For, in the whole of this discussion, the noun righteousness and the verb to justify, are extended by Osiander to two parts; to be justified being not only to be reconciled to God by a free pardon, but also to be made just; and righteousness being not a free imputation, but the holiness and integrity which the divine essence dwelling in us inspires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 3.11.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%2C+in+the+whole+of+this+discussion%2C+the+noun+righteousness+and+the+verb+to+justify%2C+are+extended+by+Osiander+to+two+parts%3B+to+be+justified+being+not+only+to+be+reconciled+to+God+by+a+free+pardon%2C+but+also+to+be+made+just%3B+and+righteousness+being+not+a+free+imputation%2C+but+the+holiness+and+integrity+which+the+divine+essence+dwelling+in+us+inspires.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feceb6fae86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eceb6fae86.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-b01fcdf19a" data-kw="">
<blockquote><p>It is indeed true, that we are justified in Christ through the mercy of God alone; but it is equally true and certain, that all who are justified are called by the Lord, that they may live worthy of their vocation. Let then the faithful learn to embrace him, not only for justification, but also for sanctification, as he has been given to us for both these purposes, lest they rend him asunder by their mutilated faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 8:13</span></figcaption>

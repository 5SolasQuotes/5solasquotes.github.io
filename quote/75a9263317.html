<main class="wrap"><figure class="quote" id="q-75a9263317" data-kw="">
<blockquote><p>VIII. None but the faithful do truly eat Christ’s true flesh.

But albeit the flesh of Christ be offered unto all in the supper to be eaten, yet we believe that it is truly eaten of the faithful only, both because they alone have communion with Christ and with his flesh and blood, and others have not, neither by receiving the bread are made partakers of him, and also because they alone have the Spirit of Christ by virtue of whom only the flesh of Christ is truly communicated, yea, and also because they alone do bring true faith, without which the same cannot be truly received and eaten. For Christ giveth not his true body to be truly and indeed eaten, but only to them, which do as well believe that the same was betrayed for them unto death, and his blood shed for remission of their sins, as those words to be true: ‘This is my body.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, eds Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XVI.VIII, 1: 305-07.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb4c5f438f" data-kw="">
<blockquote><p>It hath been always believed among Christians, and that upon infallible grounds, as I shall show hereafter, that all the decrees of God, as they are internal, so they are eternal, acts of his will; and therefore unchangeable and irrevocable. Mutable decrees and occasional resolutions are most contrary to the pure nature of Almighty God.

Such principles as these, evident and clear by their own light, were never questioned by any before the Arminians began ἀκίνητα κινεῖν, and to profess themselves to delight in opposing common notions of reason concerning God and his essence, that they might exalt themselves into his throne. To ascribe the least mutability to the divine essence, with which all the attributes and internal free acts of God are one and the same, was ever accounted ὑπερβολὴ ἀφεότητος, “transcendent atheism,” in the highest degree.</p></blockquote>

</figure><figure class="quote" id="q-e276a209dc" data-kw="">
<blockquote><p>The median position we hold … requires us not to tear asunder the hypostatic union of Christ (as they call it), on account of which the properties of the two natures, divine and human, communicate with each other; yet also to distinguish with sound understanding exactly what we have communicated by alternation of the properties, so that the divinity is not made subject to human infirmities, nor the humanity so deified that it leave the bounds of its own nature and be destroyed.

Thereby by a spiritual wisdom, such as only holy Scripture provides, we must discern what is agreeable to Christ in respect of one nature and the other. In this regard, the presence of the body of Christ which I remove from the Eucharist is that by which it is everywhere diffused, or else in many places at once, so that it frees itself from the quantity and limitation necessary to a human body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), dedication, p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

Thereby by a spiritual wisdom, such as only holy Scripture provides, we must discern what is agreeable to Christ in respect of one nature and the other. In this regard, the presence of the body of Christ which I remove from the Eucharist is that by which it is everywhere diffused, or else in many places at once, so that it frees itself from the quantity and limitation necessary to a human body.”

</figure><figure class="quote" id="q-82abafdbd3" data-kw="">
<blockquote><p>The Sacraments they are the crucifixes of Christ, in which Christ is represented as crucified afresh before our eyes: the bread broken doth preach unto us the breaking of Christ: The wine powered forth doth preach unto us the Blood of Christ poured forth for our sins. And who is it that can with the eye of faith, look upon a broken Christ, but with a broken heart? a wounded Christ, but with a wounded spirit? a bleeding Christ but with a bleeding soul? God hath made in nature the same organ for seeing and weeping: And in grace he who sees clearly, weeps thoroughly, Lam. 3.5. The eye will affect the heart. The Passover under the Law was to be eaten with bitter herbs: So Christ, the true Passover, is here to be eaten with bitterness of soul: as it was prophesied; They shall look on him whom they have pierced, and shall lament, and mourn; first seeing, and then weeping, &amp;c. Zach. 12.10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 78-79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

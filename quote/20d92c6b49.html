<main class="wrap"><figure class="quote" id="q-20d92c6b49" data-kw="">
<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

</figure><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Mortification of Sin in Believers</cite>, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

</figure><figure class="quote" id="q-6b796f8cf5" data-kw="">
<blockquote><p>That which we most love we worship as our God; for love is an act of soul-worship.… This is undoubtedly true, if we intend hereby that love which is superlative and transcendent; for to be loved above all things is an act of honour, worship, which the Lord challenges as his due in peculiar, Deut. 6:5.… Other things may be loved, but he will be loved above all other things.… He looks upon us as not worshipping him at all, not taking him for a God, when we love other things more, or as much as himself, 1 John 2:15.… Those that love their riches, the things of the world, more than, or equally with, God, they make these their gods.… Love, whenever it is inordinate, it is an idolatrous affection.… That which we most trust we make our god; for confidence and dependence is an act of worship which the Lord calls for as due only to himself.… Trust in the creature is always idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (love and trust as soul worship)</span></figcaption>

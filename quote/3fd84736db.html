<blockquote><p>In regard to the linen clothes in which our Saviour’s body was wrapped, I would, in like manner, ask how it comes, that while the Evangelists carefully enumerate the miracles which took place at the death of Christ, and omit nothing which is pertinent to the history, this wondrous miracle so completely escaped them, that they say not a word about the impression of our Lord’s body which was stamped on his grave-clothes? The circumstance surely was as worthy of being mentioned as many others. John declares that Peter went into the sepulchre, and saw the linen clothes lying in a place by themselves, but he makes no mention of the miraculous impression. It cannot be supposed that he would have suppressed so wondrous a miracle, had it really been performed. But another doubt occurs. It is nowhere said by the Evangelists that the linen clothes were carried away out of the sepulchre by the disciples or the holy women. Though they do not speak in express terms, they rather insinuate that they left them there. Then the sepulchre was guarded by the soldiers, and of course the linen clothes remained in their power. Is it likely that they gave them to some pious individual for the purpose of being converted into relics; especially when it is considered that the Pharisees had bribed them to perjure themselves by declaring that the disciples had secretly stolen away the body? It is almost unnecessary to add, that the imposture may be completely detected merely by inspecting the impression which is exhibited. It is perfectly clear that it was painted by a human hand. I cannot cease wondering how those who framed the imposture were so dull of understanding as not to use more craft in the doing of it; and, still more, how others were so silly as to allow themselves to be blindfolded, and thereby unfitted to see through a matter so very transparent. Nay, it appears that they have painters at hand. For one napkin happening to be burned, another was forthwith produced. No doubt, it was affirmed to be the same that was shown before, but the picture was so fresh that there would have been no room for the falsehood, had not eyes been altogether wanting to perceive it. To conclude in one word, their impudence will be proved by an argument which cannot be gainsayed. In all the places where they pretend to have the grave-clothes, they show a large piece of linen by which the whole body, including the head, was covered, and, accordingly, the figure exhibited is that of an entire body. But the Evangelist John relates that Christ was buried, “as is the manner of the Jews to bury.” What that manner was may be learned, not only from the Jews, by whom it is still observed, but also from their books, which explain what the ancient practice was. It was this: The body was wrapped up by itself as far as the shoulders, and then the head by itself was bound round with a napkin, tied by the four corners, into a knot. And this is expressed by the Evangelist, when he says that Peter saw the linen clothes in which the body had been wrapped lying in one place, and the napkin which had been wrapped about the head lying in another. The term napkin may mean either a handkerchief employed to wipe the face, or it may mean a shawl, but never means a large piece of linen in which the whole body may be wrapped. I have, however, used the term in the sense which they improperly give to it. On the whole, either the Evangelist John must have given a false account, or every one of them must be convicted of falsehood, thus making it manifest that they have too impudently imposed on the unlearned. I would never come to an end were I to go, one by one, over all the absurd articles which they have drawn into the service. At Rome, in the church of Joannes Lateranensis, is shown the reed which was put into our Saviour’s hand as a sceptre, when he was mocked and scourged at Pilate’s judgment-seat. At the same place, in the church of Santa Croce, is shown the spunge which was offered to our Saviour containing vinegar mixed with gall. How, I ask, were those things recovered? They were in the hands of the wicked. Did they give them to the Apostles, that they might preserve them for relics? Or did they, themselves, lock them up that they might preserve them for some future period? What blasphemy, to abuse the name of Christ by employing it as a cloak for such drivelling fables! The same account must be given of the money which Judas received to betray his Master. The Evangelist relates that it was returned by himself in the synagogue of the Pharisees, and was afterwards employed in the purchase of a field to bury strangers in. Who got back this money out of the hands of the seller of the field? It would be too ridiculous to say it was the disciples. Some more plausible account must be given. If they answer that it took place a long time after, the thing will be still less plausible, since in that case the pieces of silver must have passed through many hands, and been mingled with other pieces. They will, therefore, require to show that the owner of the field actually sold it with the intention of getting possession of these pieces of money, that he might be able to use them as relics, or to sell them over again to the faithful. Of this, however, there is no mention whatever in the ancient Church. There is a similar fiction with regard to the steps of Pilate’s judgment-seat. These exist at Rome, in the church of Joannes Lateranensis, together with the holes into which they say that drops of blood fell from our Saviour’s body. In like manner, in the church of Praxed is shown the pillar to which he was bound when he was scourged, and three other pillars in the church of Santa Croce, round which he was led when taken away to die. I know not how they Game to dream of all these pillars. This much, at least, is certain, that they are the offspring of their own brain; for we read not a word of them in the whole Gospel history. We read, no doubt, that Christ was scourged; but that he was bound to a pillar is their own invention. It must be obvious, therefore, that these impostors have done nothing else than attempt to rear up a huge pile of lies. In doing this, they have carried their license to such a length that they have not hesitated to make a relic of the tail of the ass on which our Saviour rode, and which is exhibited at Genoa. But it is not so much their impudence that astonishes us as the infatuation and stupidity of men, in religiously embracing such absurdities. Here, perhaps, some one will allege it to be improbable that the relics which I have now named would be exhibited with so much pomp if they were not able to show whence they came, and by whose hands they were received. I answer, in one word, that nothing like probability is employed to cloak these transparent lies. For how much soever they may shelter themselves under the name of Constantine, or King Louis, or some of the Popes, all this avails them not when they have to prove that fourteen nails were used in fixing our Saviour to the cross, that a whole hedge was plaited in making his crown of thorns, that the spear’s point produced three other points, that his robe was so multiplied as to be converted into three, or that it changed its form so as to be metamorphosed into a robe for mass, to which it had not the least resemblance, or that one napkin produced as many other napkins as a hen does chickens, or that our Saviour was buried after a different fashion from that which the Evangelists relate. Were I to take a lump of lead, and pointing to it, to say, “This gold was given me by such a prince,” I would deservedly be thought mad. At all events, my assertion would make no change upon the colour or the nature of the lead, so as to convert it into gold. In the same way, when it is said, “See what Godfrey of Boulogne sent into these quarters after he had subdued Judea,” though the lie is obviously repugnant to reason, will we allow ourselves to take the account without using our eyes to see what lies plain before them?</p></blockquote>

udently+imposed+on+the+unlearned.+I+would+never+come+to+an+end+were+I+to+go%2C+one+by+one%2C+over+all+the+absurd+articles+which+they+have+drawn+into+the+service.+At+Rome%2C+in+the+church+of+Joannes+Lateranensis%2C+is+shown+the+reed+which+was+put+into+our+Saviour%E2%80%99s+hand+as+a+sceptre%2C+when+he+was+mocked+and+scourged+at+Pilate%E2%80%99s+judgment-seat.+At+the+same+place%2C+in+the+church+of+Santa+Croce%2C+is+shown+the+spunge+which+was+offered+to+our+Saviour+containing+vinegar+mixed+with+gall.+How%2C+I+ask%2C+were+those+things+recovered%3F+They+were+in+the+hands+of+the+wicked.+Did+they+give+them+to+the+Apostles%2C+that+they+might+preserve+them+for+relics%3F+Or+did+they%2C+themselves%2C+lock+them+up+that+they+might+preserve+them+for+some+future+period%3F+What+blasphemy%2C+to+abuse+the+name+of+Christ+by+employing+it+as+a+cloak+for+such+drivelling+fables%21+The+same+account+must+be+given+of+the+money+which+Judas+received+to+betray+his+Master.+The+Evangelist+relates+that+it+was+returned+by+himself+in+the+synagogue+of+the+Pharisees%2C+and+was+afterwards+employed+in+the+purchase+of+a+field+to+bury+strangers+in.+Who+got+back+this+money+out+of+the+hands+of+the+seller+of+the+field%3F+It+would+be+too+ridiculous+to+say+it+was+the+disciples.+Some+more+plausible+account+must+be+given.+If+they+answer+that+it+took+place+a+long+time+after%2C+the+thing+will+be+still+less+plausible%2C+since+in+that+case+the+pieces+of+silver+must+have+passed+through+many+hands%2C+and+been+mingled+with+other+pieces.+They+will%2C+therefore%2C+require+to+show+that+the+owner+of+the+field+actually+sold+it+with+the+intention+of+getting+possession+of+these+pieces+of+money%2C+that+he+might+be+able+to+use+them+as+relics%2C+or+to+sell+them+over+again+to+the+faithful.+Of+this%2C+however%2C+there+is+no+mention+whatever+in+the+ancient+Church.+There+is+a+similar+fiction+with+regard+to+the+steps+of+Pilate%E2%80%99s+judgment-seat.+These+exist+at+Rome%2C+in+the+church+of+Joannes+Lateranensis%2C+together+with+the+holes+into+which+they+say+that+drops+of+blood+fell+from+our+Saviour%E2%80%99s+body.+In+like+manner%2C+in+the+church+of+Praxed+is+shown+the+pillar+to+which+he+was+bound+when+he+was+scourged%2C+and+three+other+pillars+in+the+church+of+Santa+Croce%2C+round+which+he+was+led+when+taken+away+to+die.+I+know+not+how+they+Game+to+dream+of+all+these+pillars.+This+much%2C+at+least%2C+is+certain%2C+that+they+are+the+offspring+of+their+own+brain%3B+for+we+read+not+a+word+of+them+in+the+whole+Gospel+history.+We+read%2C+no+doubt%2C+that+Christ+was+scourged%3B+but+that+he+was+bound+to+a+pillar+is+their+own+invention.+It+must+be+obvious%2C+therefore%2C+that+these+impostors+have+done+nothing+else+than+attempt+to+rear+up+a+huge+pile+of+lies.+In+doing+this%2C+they+have+carried+their+license+to+such+a+length+that+they+have+not+hesitated+to+make+a+relic+of+the+tail+of+the+ass+on+which+our+Saviour+rode%2C+and+which+is+exhibited+at+Genoa.+But+it+is+not+so+much+their+impudence+that+astonishes+us+as+the+infatuation+and+stupidity+of+men%2C+in+religiously+embracing+such+absurdities.+Here%2C+perhaps%2C+some+one+will+allege+it+to+be+improbable+that+the+relics+which+I+have+now+named+would+be+exhibited+with+so+much+pomp+if+they+were+not+able+to+show+whence+they+came%2C+and+by+whose+hands+they+were+received.+I+answer%2C+in+one+word%2C+that+nothing+like+probability+is+employed+to+cloak+these+transparent+lies.+For+how+much+soever+they+may+shelter+themselves+under+the+name+of+Constantine%2C+or+King+Louis%2C+or+some+of+the+Popes%2C+all+this+avails+them+not+when+they+have+to+prove+that+fourteen+nails+were+used+in+fixing+our+Saviour+to+the+cross%2C+that+a+whole+hedge+was+plaited+in+making+his+crown+of+thorns%2C+that+the+spear%E2%80%99s+point+produced+three+other+points%2C+that+his+robe+was+so+multiplied+as+to+be+converted+into+three%2C+or+that+it+changed+its+form+so+as+to+be+metamorphosed+into+a+robe+for+mass%2C+to+which+it+had+not+the+least+resemblance%2C+or+that+one+napkin+produced+as+many+other+napkins+as+a+hen+does+chickens%2C+or+that+our+Saviour+was+buried+after+a+different+fashion+from+that+which+the+Evangelists+relate.+Were+I+to+take+a+lump+of+lead%2C+and+pointing+to+it%2C+to+say%2C+%E2%80%9CThis+gold+was+given+me+by+such+a+prince%2C%E2%80%9D+I+would+deservedly+be+thought+mad.+At+all+events%2C+my+assertion+would+make+no+change+upon+the+colour+or+the+nature+of+the+lead%2C+so+as+to+convert+it+into+gold.+In+the+same+way%2C+when+it+is+said%2C+%E2%80%9CSee+what+Godfrey+of+Boulogne+sent+into+these+quarters+after+he+had+subdued+Judea%2C%E2%80%9D+though+the+lie+is+obviously+repugnant+to+reason%2C+will+we+allow+ourselves+to+take+the+account+without+using+our+eyes+to+see+what+lies+plain+before+them%3F%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CAn+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%E2%80%9D+in+Tracts+Relating+to+the+Reformation%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+308%E2%80%93312&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fd84736db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3fd84736db.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-7/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>2. How does [Richard] Hooker prove that the vessels made for Baal are in their own nature more incurable than the sign of the cross? You may remove the superstitious intention and idolatrous use of any vessel and turn it to a good use; yet Josiah burnt them to ashes. The like may be said of the groves which he stamped to powder and cast in the brook Kidron, and of the chariots five of the sun which he burnt with fire, and of the bones of dead men, not any of these being of their own nature more indifferent and innocent creatures of God, [nor] were of their own nature more scandalous and more incurable than the sign of the cross. The like may be said of altars…</p></blockquote>

<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>

<blockquote><p>Thesis 12… If any work be done for any worldly gain, profit or livelihood, to acquire and purchase the things of this life by (which is the principal end of week-day labor, Eph. 4:28; 1 Thess. 4:12), this is a servile work, all one with what the commandment calls ‘thy work’. Hence buying, selling, sowing, reaping, which are done for worldly gain, are unlawful on this day, being therefore servile works… [Buying and selling not done for worldly gain would not then be a servile work or prohibited, if this might not be done before or after the Sabbath, per the following section.] hence also such works as are done only for the preservation of the creatures… to keep fire in the iron mills, to sit at stern and guide the ship, and a thousand such like actions (being not done properly for worldly gain) are not unlawful; God Himself not ceasing from works of preservation…</p></blockquote>

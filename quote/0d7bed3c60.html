<main class="wrap"><figure class="quote" id="q-0d7bed3c60" data-kw="">
<blockquote><p>First, I say, let us view the love of a God of love, in the different kinds of it. … 2, He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?” And because of your obstinacy in unbelief and sin, He may challenge you as he did Israel, and say, Micah 6:3, “O my people, what have I done unto thee, and wherein have I wearied thee? testify against me. Was I ever a barren wilderness, or a land of darkness?” Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God in Christ, A God of Love’, a sermon on 1 John 4:16, in The Whole Works of the late Rev. Ebenezer Erskine, vol. 1</cite>, pp. 280-81</span></figcaption>

<blockquote><p>The Reformed commonly acknowledge a universal grace concerning natural things and a common grace concerning moral things, but saving grace concerning things that accompany salvation they do not allow, except as a grace proper to the elect: they acknowledge no saving grace that extends equally to each individual, not even that grace that they call objective.</p></blockquote>

</figure><figure class="quote" id="q-a3aacc10bb" data-kw="">
<blockquote><p>After these common mercies, I say, whereof the reprobate are often partakers, he opens the treasure of his rich mercies, which are kept in Christ Jesus for his Elect. Such as willingly delight not in blindness may clearly see that the Holy Ghost makes a plain difference betwixt the graces and mercies which are common to all, and that sovereign mercy which is immutably reserved to the chosen children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Knox, ed. David Laing (Wodrow Society, 1856), vol. 5, On Predestination</cite>, p. 87</span></figcaption>

</figure><figure class="quote" id="q-ec40d74b95" data-kw="">
<blockquote><p>It must also be borne in mind that elsewhere Hoeksema’s [who denies common grace] definition of the word ‘goodness’ is very different from the meaning commonly given to it by Reformed writers and, more particularly, its usage in the Westminster Standards. For example, in Answer 4 of the Shorter Catechism, we read, ‘God is a Spirit, infinite eternal and unchangeable in his being, wisdom, power, holiness, justice, goodness and truth’. The Shorter Catechism has been criticised by some at this point for not using the terms ‘grace, mercy, love’, but it must be recognised that in the minds of the Westminster Assembly the term goodness included all of these. This explains why the term ‘goodness’ is expanded in the Larger Catechism as equivalent to ‘most merciful and gracious, long-suffering, and abundant in goodness’ (Answer 7) and in the Westminster Confession as ‘most loving, gracious, merciful, longsuffering, abundant in goodness…forgiving iniquity, transgression and sin; the rewarder of them that diligently seek him…’ (Ch. 2.1). The terms ‘good’ and ‘goodness’ (Heb. tob) are consistently linked to God’s mercy or faithful love (Heb. chesed), for example in Psalms 23:6, 25:7-8, 86:5, 100:5, 145:9 etc., and when Psalm 34:8 is referred to in 1 Peter 2:3, the term is rendered ‘gracious’ (Gk. chreestos: A.V. ‘kind’). No doubt this explains why the term is rendered ‘gracious’ in the 1650 Metrical Psalter rendering Psalm 86:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-silversides.html">David Silversides</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Offer: Biblical &amp; Reformed (Marpet Press, 2005)</cite>, p. 16-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

ed+%28Marpet+Press%2C+2005%29%2C+p.+16-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec40d74b95.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ec40d74b95.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/common-grace/the-westminster-confession-on-common-grace/#:~:text=It%20must%20also%20be%20borne%20in,1650%20Metrical%20Psalter%20rendering%20Psalm%2086%3A5&amp;text=It%20must%20also%20be%20borne%20in%20mind%20that&amp;text=in%20the%201650%20Metrical%20Psalter%20rendering%20Psalm%2086%3A5" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1468d42deb" data-kw="">
<blockquote><p>The infinite goodness of God bestows more mercies upon us in the method of prevention, than of answer to particular prayers. We enjoy most things before we ask, and often more excellent in kind and more abundant in measure than we ask… He makes his sun to rise every morning upon the unjust, and his moon to fill her orb with light upon the ungodly crescent [Muslims]. His paths in the clouds drops fatness upon the fields of bloody tyrants, and His ocean is open, and sweet western gales often swell the sails of rambling and roving pirates. The earth is full of his goodness. He spread and filled the tables of Heliogabalus with His hidden treasures. There is no inhabitant but is laden with his benefits, however abused to their luxury, pride, and wantonness. His mercies are over all his works; He makes the out-goings of the morning and evening to sing. He preserves the goings out and the comings in of all the children of Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eliothriambos: Or the Triumph of Mercy in the Chariot of Praise (London: John Hancock, 1677), 1, 2, 11 as quoted in Day by Day with the English Puritans: Selected Readings for Daily Reflection, ed. Randall J. Pederson (Hendrickson, 2004)</cite>, p. 202</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The infinite goodness of God bestows more mercies upon us in the method of prevention, than of answer to particular prayers. We enjoy most things before we ask, and often more excellent in kind and more abundant in measure than we ask… He makes his sun to rise every morning upon the unjust, and his moon to fill her orb with light upon the ungodly crescent [Muslims]. His paths in the clouds drops fatness upon the fields of bloody tyrants, and His ocean is open, and sweet western gales often swell the sails of rambling and roving pirates. The earth is full of his goodness. He spread and filled the tables of Heliogabalus with His hidden treasures. There is no inhabitant but is laden with his benefits, however abused to their luxury, pride, and wantonness. His mercies are over all his works; He makes the out-goings of the morning and evening to sing. He preserves the goings out and the comings in of all the children of Adam.”

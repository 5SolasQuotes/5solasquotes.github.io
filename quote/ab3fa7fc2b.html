<main class="wrap"><figure class="quote" id="q-ab3fa7fc2b" data-kw="">
<blockquote><p>That original sin is derived to us, and inheres deeply fixed within us, is more than clear enough; but how it was propagated from Adam to his posterity ought to be believed rather than investigated, and can be investigated more easily than it can be understood, and is better understood than it is explained. It is not so much our concern now to care how we fell into this evil, as to be freed from it; just as Augustine relates of the one who had fallen into a well: to someone admiring how he could have fallen into the well, he said, “You think about how to free me from here, not ask how I fell in here.</p></blockquote>

</figure><figure class="quote" id="q-9c343373fe" data-kw="">
<blockquote><p>II. And if anyone would exactly view the manner and circumstances of Adam’s sin, he shall find that in every man, the character, and no obscure image, of that first sin, is deeply impressed: for there is engrafted in every man curiosity and desire of knowing those things which pertain nothing to him: and also a distrustful hesitation, and doubting of the Word of God: And as Adam laid the fault upon his wife, and his wife upon the Serpent, so is it natural to every man to cover his fault with another’s fault: Also flight and trembling at the meeting of God, lying, dissembling, and a sense of indecent nakedness are in all men by nature, and are derived into posterity from that fountain; and to these things we are not taught, but made, not instructed, but infected: to these things we do not only not need a master, but contrary to the teaching of masters, and to discipline, all stayes and bars being broken, we return to them, nature being conqueror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1620), pp. 57-73 | 10. ‘Of the propagation of the sin of Adam to his posterity, where also of the traduction of the soul and of sin itself’, pp. 64-65</span></figcaption>

<blockquote><p>I say indeed the guilt of Adam’s transgression is derived unto us, that is to our persons by imputation; but that very sin of Adam was the sin of our natures, as Augustine speaks: Non modo natura facta est peccatrix, sed et genuit peccatores. ‘Not only our human nature became a sinner, but also begat sinners.’ (De Nuptitis, ch. 34) And accordingly it is justly imputed unto our persons, otherwise how could it be just with God to condemn any man for original sin; which yet is expressly acknowledged by Mr. Hoord. And the apostle says expressly that ‘in Adam all have sinned.’ And Augustine gives the reason of it: De Adamo omnes peccatum originale trahunt, quia omnes unus fuerunt. ‘All draw original sin from Adam, because all were that one.’… And that the corruption consequent is derived to us only by propagation, I think it is without doubt amongst all who concur not with Pelagius in maintaining that it is derived unto us by imitation, and so [by this] only… they proceed from a false ground, supposing that the reason of this imputation of Adam’s sin, and propagation of his corruption unto all his posterity, is merely built upon this foundation, that we were in Adam’s loins when he sinned, which is untrue: 1. In his first reason he does miserably overlash; for we could not be guilty of all the sins which were committed by Adam from his fall to his life’s end, no not upon the ground whereon this authour builds; so long we were not in his Ioines, nor any longer than till he begat Seth; for from Seth sprang Noah, and we all from him. Neither is it credible that Adam continued to beget children till the last yeare, and month, and day of his life. Indeed we no where read that we are guilty of any other of his sins besides the first, the reason whereof shall be given in the next place. 2. Therefore I say, in answer unto them both that the ground of imputing Adam’s sin unto his posterity is not only because we were in Adam’s Ioins, but because the first sin of Adam was it that bereaved his nature of God’s image; and so brought corruption upon himself by an aversion from the Creator and unchangeable good, and conversion unto the creature, wherein the Lord left him, bereaving him of his Spirit; and this nature, by this sin alone so corrupt, is the fountain of all our natures: Like as if Adam had stood, of the same fountain of integrity we had all received incorrupt natures, so that the like cannot be said of any other sin of Adam afterwards committed by him, nor of the sin of any other our progenitors succeeding him. For as for the wicked, they have no such spirit of God to loose; and as for the godly, they have indeed the Spirit of God, but so as not to be taken from them by the sins committed by them, any more than it was from David upon the committing of so foul sins in the matter of Uriah; neither do any godly parents propagate their state of grace to their posterity. And Aquinas is so bold hereupon as to profess that (Summa, pt. 1 of 2, q. 81, art. 2, in the body): Impossibile est, quod aliqua peccata parentum proximorum, vel etiam primi parentis praeter primum, per originem traducantur. ‘It is impossible that the sins of our immediate parents, or of our first parents, besides the first, should be derived unto posterity by propagation.’ For, says he, a man generates the same with himself in kind [or nature] only, not in individual. And therefore those things, which pertain to him as a particular person, as acts personal, he does not propagate unto his children. Now to the nature of man, something may pertain naturally, something by the gift of grace. And this original righteousness as a gift of grace was bestowed on the whole nature of mankind in our first parents, which Adam lost by his first sin; so that like as original righteousness had been propagated to posterity together with the human nature, so also the opposite inordination. But as for other actual sins, either of our first parents, or of others, they do not corrupt the nature of man, as touching that which pertains to nature, but as touching that which pertains to his person; therefore other sins are not propagated unto posterity. And this reason which Aquinas gives, was long before given by Anselm, De Conceptu Virginali et Originali Peccato, ch. 23.</p></blockquote>

t parents, or of others, they do not corrupt the nature of man, as touching that which pertains to nature, but as touching that which pertains to his person; therefore other sins are not propagated unto posterity. And this reason which Aquinas gives, was long before given by Anselm, De Conceptu Virginali et Originali Peccato, ch. 23.”

+it+credible+that+Adam+continued+to+beget+children+till+the+last+yeare%2C+and+month%2C+and+day+of+his+life.+Indeed+we+no+where+read+that+we+are+guilty+of+any+other+of+his+sins+besides+the+first%2C+the+reason+whereof+shall+be+given+in+the+next+place.+2.+Therefore+I+say%2C+in+answer+unto+them+both+that+the+ground+of+imputing+Adam%E2%80%99s+sin+unto+his+posterity+is+not+only+because+we+were+in+Adam%E2%80%99s+Ioins%2C+but+because+the+first+sin+of+Adam+was+it+that+bereaved+his+nature+of+God%E2%80%99s+image%3B+and+so+brought+corruption+upon+himself+by+an+aversion+from+the+Creator+and+unchangeable+good%2C+and+conversion+unto+the+creature%2C+wherein+the+Lord+left+him%2C+bereaving+him+of+his+Spirit%3B+and+this+nature%2C+by+this+sin+alone+so+corrupt%2C+is+the+fountain+of+all+our+natures%3A+Like+as+if+Adam+had+stood%2C+of+the+same+fountain+of+integrity+we+had+all+received+incorrupt+natures%2C+so+that+the+like+cannot+be+said+of+any+other+sin+of+Adam+afterwards+committed+by+him%2C+nor+of+the+sin+of+any+other+our+progenitors+succeeding+him.+For+as+for+the+wicked%2C+they+have+no+such+spirit+of+God+to+loose%3B+and+as+for+the+godly%2C+they+have+indeed+the+Spirit+of+God%2C+but+so+as+not+to+be+taken+from+them+by+the+sins+committed+by+them%2C+any+more+than+it+was+from+David+upon+the+committing+of+so+foul+sins+in+the+matter+of+Uriah%3B+neither+do+any+godly+parents+propagate+their+state+of+grace+to+their+posterity.+And+Aquinas+is+so+bold+hereupon+as+to+profess+that+%28Summa%2C+pt.+1+of+2%2C+q.+81%2C+art.+2%2C+in+the+body%29%3A+Impossibile+est%2C+quod+aliqua+peccata+parentum+proximorum%2C+vel+etiam+primi+parentis+praeter+primum%2C+per+originem+traducantur.+%E2%80%98It+is+impossible+that+the+sins+of+our+immediate+parents%2C+or+of+our+first+parents%2C+besides+the+first%2C+should+be+derived+unto+posterity+by+propagation.%E2%80%99+For%2C+says+he%2C+a+man+generates+the+same+with+himself+in+kind+%5Bor+nature%5D+only%2C+not+in+individual.+And+therefore+those+things%2C+which+pertain+to+him+as+a+particular+person%2C+as+acts+personal%2C+he+does+not+propagate+unto+his+children.+Now+to+the+nature+of+man%2C+something+may+pertain+naturally%2C+something+by+the+gift+of+grace.+And+this+original+righteousness+as+a+gift+of+grace+was+bestowed+on+the+whole+nature+of+mankind+in+our+first+parents%2C+which+Adam+lost+by+his+first+sin%3B+so+that+like+as+original+righteousness+had+been+propagated+to+posterity+together+with+the+human+nature%2C+so+also+the+opposite+inordination.+But+as+for+other+actual+sins%2C+either+of+our+first+parents%2C+or+of+others%2C+they+do+not+corrupt+the+nature+of+man%2C+as+touching+that+which+pertains+to+nature%2C+but+as+touching+that+which+pertains+to+his+person%3B+therefore+other+sins+are+not+propagated+unto+posterity.+And+this+reason+which+Aquinas+gives%2C+was+long+before+given+by+Anselm%2C+De+Conceptu+Virginali+et+Originali+Peccato%2C+ch.+23.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29%2C+bk.+2%2C+An+Examination+of+Certain+Passages+inserted+into+Mr.+Hord%E2%80%99s+Discourse%2C+Answer+to+the+Additions%2C+p.+140&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F201b1eb355.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/201b1eb355.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/original-sin/#:~:text=I%20say%20indeed%20the%20guilt%20of,Virginali%20et%20Originali%20Peccato%2C%20ch.%2023&amp;text=I%20say%20indeed%20the%20guilt%20of%20Adam%E2%80%99s%20transgression&amp;text=De%20Conceptu%20Virginali%20et%20Originali%20Peccato%2C%20ch.%2023" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

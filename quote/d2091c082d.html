<blockquote><p>In the first book-length treatment of this doctrine, Adonis Vidu… engaging with recent and historical objections. Taking aim at a common ‘soft’ interpretation of the inseparability rule, according to which the divine persons merely cooperate and work in concert with one another, Vidu argues for the retrieval of ‘hard inseparability,’ which emphasizes the unity of divine action, primarily drawing from the patristic and medieval traditions. Having probed the biblical foundations of the rule and recounted the story of its emergence in nascent Trinitarianism and its neglect in modern theology, Vidu builds a constructive case for its retrieval. The rule is then tested precisely on the battlegrounds that were thought to have witnessed its defeat: the doctrines of creation, incarnation, atonement, ascension, and the indwelling of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adonis-vidu.html">Adonis Vidu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Same God Who Works All Things</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a922f0ea6" data-kw="">
<blockquote><p>By person, then, I mean a subsistence in the Divine essence,--a subsistence which, while related to the other two, is distinguished from them by incommunicable properties. By subsistence we wish something else to be understood than essence. For if the Word were God simply and had not some property peculiar to himself, John could not have said correctly that he had always been with God. When he adds immediately after, that the Word was God, he calls us back to the one essence. But because he could not be with God without dwelling in the Father, hence arises that subsistence, which, though connected with the essence by an indissoluble tie, being incapable of separation, yet has a special mark by which it is distinguished from it. Now, I say that each of the three subsistences while related to the others is distinguished by its own properties. Here relation is distinctly expressed, because, when God is mentioned simply and indefinitely the name belongs not less to the Son and Spirit than to the Father. But whenever the Father is compared with the Son, the peculiar property of each distinguishes the one from the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.6</span></figcaption>

</figure><figure class="quote" id="q-b5f431b62f" data-kw="">

</figure><figure class="quote" id="q-ee137d1657" data-kw="">
<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 87-88</span></figcaption>

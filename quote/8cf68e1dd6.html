<main class="wrap"><figure class="quote" id="q-8cf68e1dd6" data-kw="">
<blockquote><p>….we have seen that anything that exists or could exist other than God would have potentials that need actualization, parts that need to be combined, and an essence distinct from its existence, and would therefore be contingent. We have also seen that such things can exist, even for an instant, only insofar as they are caused by that which is purely actual, absolutely simple, subsistent existence itself, and absolutely necessary; and we have seen that there cannot in principle be more than one such cause. It follows that anything that exists or could exist other than God depends at every instant on God for its existence. Recall also the principle agere sequitur esse [action follows existence], according to which a thing’s attributes and activities cannot go beyond its nature. When we combine this principle with the thesis that the sheer existence of anything at any moment depends on God’s causing it to exist, we get the result that the operation or activity of anything at any moment also depends on God. For if a thing could not even exist for an instant apart from God, how could it act at any instant apart from God? If the thing has no independent capacity for existence, where could an independent capacity for action possibly come from? Existing, after all, is more fundamental than acting, since it is presupposed by acting. So, if a thing’s essence gives it no capacity even to exist apart from God, it cannot intelligibly give it power to act apart from God. So, everything that exists or could exist other than God depends at every instant not only for its existence, but also for its capacity to do anything, on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Omnipotence’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b8d5182a4" data-kw="">
<blockquote><p>It becomes us, as Christ’s example goes before us, to submit in the hardest and most bloody providences, to the straight and holy will of God: 1. Christ presses He has no will divided from God’s will; He lays down his glory, his heaven, his life, his fruition of the sweet influence of an highest vision, love, presence, feeling of God in a personal union at the feet of God, that the Lord may carve and cut and dispose of Him and his blood as He thought good. 2. All the difficulty in us, in whom dwells a body of sin is to answer the objections that flesh and blood has against a sad providence, which I will labor to do, and then give some rules for direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 141-58 of Christ Dying &amp; Drawing Sinners to Himself (London: 1647) Including answering 9 objections and giving 13 rules</cite>, p. 141</span></figcaption>

</figure><figure class="quote" id="q-ee4a4b51ea" data-kw="">
<blockquote><p>Regarding the nature of free will; it suffices that from the previous judgment of the practical intellect, it chooses one of the opposites, while still being able to choose the other from a different judgment of the same intellect; because, namely, the root and foundation of free will lie in the intellect, insofar as it can consider various aspects of good in opposites and propose them to the will. But the nature of free will does not include that while the free agent chooses from previous judgment, it is not moved by a superior cause to judge and choose so. Therefore, since the divine motion predetermining the will does not hinder a person from having full and perfect judgment of reason and judging that one means is contingent and the other is necessarily connected to the end, and could also choose otherwise from a different judgment, it follows that such a motion does not harm the freedom of our will. For it is proper to the uncreated will to have its choice from no prior cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXIII. To this, he responds:</cite></span></figcaption>

</figure><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin Permission">
<blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite></span></figcaption>

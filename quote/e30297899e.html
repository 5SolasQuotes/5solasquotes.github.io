<blockquote><p>But, the counterfeiters of truth, who do not teach their minds to follow the Scripture, but distort the meaning of Scripture according to their own will, say that matter is implied by these words. This, they say, is naturally invisible and unfinished, being without qualities because of its condition, and dissociated from all form and shape. Having taken it over, the Craftsman formed It by His own intelligence, reduced it to order, and thus through it gave visible things existence.

If matter itself is uncreated, it is, in the first place, of equal rank with God, worthy of the same honours. What could be more impious than this, that the most extreme unsightliness, without qualities, without form, unshapen ugliness (I have used, indeed, their own expressions) be considered worthy of the same superior ranking as the wise and powerful and all good Craftsman and Creator of all things?

In the next place, if matter is so great as to take in entirely the intelligence of God, on this supposition also, in a way, they compare its substance with the inscrutable power of God, since it would be capable of measuring by itself all the intelligence of God. But, if matter is inferior to the activity of God, then also their explanation will be turned into a more absurd blasphemy, since His own works would be keeping God unsuccessful and inefficacious because of the deficiency in matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Hexaemeron</cite>, (379), 2.2 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 22-23.</span></figcaption>

<blockquote><p>XI. At what time of the year the world began, whether in spring or in autumn, the learned disagree:

      1. Gerardus Mercator thinks the world was created in summer time.

      2. Many fathers and scholastics contend that it was founded in spring, with whom agree; from the Jews, R. Joshua, and from the Reformed, Alsted, Polanus, Keckermann, and Braun.

      3. But the rest of the Jews commonly, and very many of the Orthodox, for example Voet, Maresius, Cocceius, Burmann, Turretin, Rijssen, Mastricht, etc., state that the world was founded in autumn; whose opinion we approve:

      1. Because the civil year of the Israelites, which was also that of the patriarchs, was begun in the month of Tishri, Ex. 23:16, where the feast of the collection of all fruits from the fields is commanded to be celebrated at the end of the year.

      2. Because in Ex. 34:22, the Feast of Tabernacles is commanded to be celebrated in the seventh month, at the revolution of the year, i.e., in the month of Tishri.

      3. Because the sabbatical and jubilee year of the Jews was celebrated in the month of Tishri, which corresponds to our September or October, Lev. 25:9.

      4. Because the Jews to this day celebrate ראש השנה (Rosh Hashanah) in the month of Tishri, and with it they begin the year, and they explode the different opinion of R. Joshua as singular.

      5. Because in Gen. 7:11, the flood is said to have occurred in the second month; which, however, was most probably done at that time of year which is suitable for inundations, so that the second month should be computed from the autumnal equinox.

      6. Because in autumn the fruits of the trees are ripe and the plants are heavy with seeds, to sustain the first parents and the animals.

      7. The Egyptians, Persians, Greeks and all the Orientals begin the year from September, which it is not to be doubted they received from tradition.

      8. Because in the Gemara, Avodah Zarah, ch. 1, it is handed down that Adam, immediately after creation was made, noticed that the days were declining and becoming shorter; which could not have happened except in the month of September. See Menasseh ben Israel, Problems, 9, Of Creation, also The Conciliator, quest. 11 in Exodus, p. 118. For the rest, just as the Jews begin the civil year in the month of Tishri, so they begin the sacred year in the month of Nisan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, On Creation, pp. 22-23 trans. AI Latin</span></figcaption>

<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.”

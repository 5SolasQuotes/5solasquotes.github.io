<main class="wrap"><figure class="quote" id="q-d9a4793fdf" data-kw="">
<blockquote><p>In what place is (the H. Supper) to be administered? In public assembly, not to individuals privately or to those ill in bed at home or about to die without the congregation of the faithful and their participation. Communication should be ecclesiastical and public, not an idion deipnon [a private supper]. And the Supper is a symbol of the communion of saints…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics</cite>, ed. Bizer &amp; trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 26, ‘The Lord’s Supper’, pp. 635-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“In what place is (the H. Supper) to be administered? In public assembly, not to individuals privately or to those ill in bed at home or about to die without the congregation of the faithful and their participation. Communication should be ecclesiastical and public, not an idion deipnon [a private supper]. And the Supper is a symbol of the communion of saints…”

— William Bucanus, as quoted in Heinrich Heppe, Reformed Dogmatics ed. Bizer &amp; trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 26, ‘The Lord’s Supper’, pp. 635-36">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+what+place+is+%28the+H.+Supper%29+to+be+administered%3F+In+public+assembly%2C+not+to+individuals+privately+or+to+those+ill+in+bed+at+home+or+about+to+die+without+the+congregation+of+the+faithful+and+their+participation.+Communication+should+be+ecclesiastical+and+public%2C+not+an+idion+deipnon+%5Ba+private+supper%5D.+And+the+Supper+is+a+symbol+of+the+communion+of+saints%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+as+quoted+in+Heinrich+Heppe%2C+Reformed+Dogmatics+ed.+Bizer+%26+trans.+Thomson+%281950%3B+Wipf+%26+Stock%2C+2007%29%2C+ch.+26%2C+%E2%80%98The+Lord%E2%80%99s+Supper%E2%80%99%2C+pp.+635-36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd9a4793fdf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d9a4793fdf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=In%20what%20place%20is%20%28the%20H,symbol%20of%20the%20communion%20of%20saints&amp;text=In%20what%20place%20is%20%28the%20H.%20Supper%29%20to&amp;text=is%20a%20symbol%20of%20the%20communion%20of%20saints" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c14575093b" data-kw="">
<blockquote><p>But as public baptism is that which is now performed in the public place, where public ordinances are usually administered, the accustomed signs being given for the assembling of the congregation there, at such time when it is to be celebrated, so private baptism, on the contrary, is that which is done either in the place of public assembly when no public notice is duly given for the congregation to resort thither, or in a private house, where although many are present, yet it is not free, or at least its generally supposed it would not be civil for any Christian that will, though uninvited, to come to the ordinance of baptism there administered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-langley.html">Samuel Langley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether</cite>, (or if at all in what cases) Baptism may be now Administered Privately, not Publicly?’ 20 pp. being the bottom 2/3rds of the Epistle Dedicatory of Suspension Reviewed, Stated, Cleared &amp; Settled upon Plain Scripture-Proof: Agreeable to the former &amp; late constitutions of the Protestant Church of England &amp; other Reformed Churches… (London, 1658) no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“But as public baptism is that which is now performed in the public place, where public ordinances are usually administered, the accustomed signs being given for the assembling of the congregation there, at such time when it is to be celebrated, so private baptism, on the contrary, is that which is done either in the place of public assembly when no public notice is duly given for the congregation to resort thither, or in a private house, where although many are present, yet it is not free, or at least its generally supposed it would not be civil for any Christian that will, though uninvited, to come to the ordinance of baptism there administered.”

— Samuel Langley, ‘Whether (or if at all in what cases) Baptism may be now Administered Privately, not Publicly?’ 20 pp. being the bottom 2/3rds of the Epistle Dedicatory of Suspension Reviewed, Stated, Cleared &amp; Settled upon Plain Scripture-Proof: Agreeable to the former &amp; late constitutions of the Protestant Church of England &amp; other Reformed Churches… (London, 1658) no page numbers">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+as+public+baptism+is+that+which+is+now+performed+in+the+public+place%2C+where+public+ordinances+are+usually+administered%2C+the+accustomed+signs+being+given+for+the+assembling+of+the+congregation+there%2C+at+such+time+when+it+is+to+be+celebrated%2C+so+private+baptism%2C+on+the+contrary%2C+is+that+which+is+done+either+in+the+place+of+public+assembly+when+no+public+notice+is+duly+given+for+the+congregation+to+resort+thither%2C+or+in+a+private+house%2C+where+although+many+are+present%2C+yet+it+is+not+free%2C+or+at+least+its+generally+supposed+it+would+not+be+civil+for+any+Christian+that+will%2C+though+uninvited%2C+to+come+to+the+ordinance+of+baptism+there+administered.%E2%80%9D%0A%0A%E2%80%94+Samuel+Langley%2C+%E2%80%98Whether+%28or+if+at+all+in+what+cases%29+Baptism+may+be+now+Administered+Privately%2C+not+Publicly%3F%E2%80%99+20+pp.+being+the+bottom+2%2F3rds+of+the+Epistle+Dedicatory+of+Suspension+Reviewed%2C+Stated%2C+Cleared+%26+Settled+upon+Plain+Scripture-Proof%3A+Agreeable+to+the+former+%26+late+constitutions+of+the+Protestant+Church+of+England+%26+other+Reformed+Churches%E2%80%A6+%28London%2C+1658%29+no+page+numbers&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc14575093b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c14575093b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=But%20as%20public%20baptism%20is%20that,the%20ordinance%20of%20baptism%20there%20administered&amp;text=But%20as%20public%20baptism%20is%20that%20which%20is&amp;text=come%20to%20the%20ordinance%20of%20baptism%20there%20administered" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-387578e5a1" data-kw="">
<blockquote><p>But to prevent all mistakes, it must be remembered, that exception and allowance is still to be made for the case of invincible necessity, of extreme sickness, and danger of death; at which time the [Anglican] Church admits of private baptism…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-strong.html">Martin Strong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Indecency &amp; Unlawfulness of Baptizing Children in Private: without Necessity &amp; with the Public Form</cite>, … to which is added, a Brief Exhortation to the Constant Receiving of the Lord’s Supper (London: Tho. Bennet, 1692) 35 pp., p. 2, also p. 20</span></figcaption>

</figure><figure class="quote" id="q-80f4c94ea9" data-kw="">
<blockquote><p>First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Private Communion’ in Answer to the Reasons for Refusal of Subscription in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 194 Cotton was an Anglican bishop.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-1dc5a90de5" data-kw="">
<blockquote><p>But dost thou think that nothing ought to be determined concerning the place [for baptism]? Answer: Yea, seeing all things must be done in the Church comely and in order: and forasmuch as baptism is a part of the ministry of the Gospel, I think that one and the same place is to be used both for the Word and sacraments, so as baptism be ministered in the public congregation of the Church and with common prayer [mid-week], neither will I rashly admit those, I cannot tell what, cases of necessity, that some allege to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Other Part of Christian Questions &amp; Answers, which is concerning the Sacraments</cite>, … (London, 1580), 151st Question</span></figcaption>

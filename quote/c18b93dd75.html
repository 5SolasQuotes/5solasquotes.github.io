<main class="wrap"><figure class="quote" id="q-c18b93dd75" data-kw="">
<blockquote><p>The first right which God gave to man to eat flesh, was after the promise, and after that Beasts were consecrated to be sacrificed as Types of Christ, and of his Death. Now these sacrifices of Beasts did shew the nature of the Covenant, and the manner of man’s reconciliation; choosing of clean and harmless Beasts, showed that Christ should be pure and holy in himself, like a Lamb without spot; The consecration of them showed that Christ should in his conception be sanctified, and take our nature, and our sins upon him, that he might be our Redeemer, and our Sacrifice.

The killing of the Beasts, and the burning of the fat, and some parts of them, signified the manner of Christ’s reconciling of us, and working our peace, even by his Death, and passing through the fire of God’s wrath. God’s clothing of Adam and his wife with their skins, signified that Man’s sin and shame is covered with Christ’s satisfaction, and the faithful are to be clothed with the robe of his Righteousness. The liberty which God gave man to eat flesh of Beasts, which he might not before sacrifices were ordained, showeth that we gain more by Christ, than we lost in Adam. This was the first making and revealing of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference</cite>, (London: John Bartlet, 1641), pp 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e77844b8c" data-kw="">
<blockquote><p>How could he die, if he were not a reputed sinner? Had he not first had a relation to our sin, he could not in justice have undergone our punishment. He must in the order of justice be supposed a sinner really, or by imputation; really he was not, by imputation then he was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 4.532</span></figcaption>

</figure><figure class="quote" id="q-52c14a01f6" data-kw="">
<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

er%20is%20affirmed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b72cabf94f" data-kw="">
<blockquote><p>Let us remember, on the other hand, that while life is promised universally to all who believe in Christ, still faith is not common to all. For Christ is made known and held out to the view of all, but the elect alone are they whose eyes God opens, that they may seek him by faith. Here, too, is displayed a wonderful effect of faith; for by it we receive Christ such as he is given to us by the Father—that is, as having freed us from the condemnation of eternal death, and made us heirs of eternal life, because, by the sacrifice of his death, he has atoned for our sins, that nothing may prevent God from acknowledging us as his sons. Since, therefore, faith embraces Christ, with the efficacy of his death and the fruit of his resurrection, we need not wonder if by it we obtain likewise the life of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, vol. 1 (Bellingham, WA: Logos Bible Software, 2010), 125.</span></figcaption>

</figure><figure class="quote" id="q-67cb1ff92e" data-kw="">
<blockquote><p>For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’</cite>, Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).”

— David Pareus, ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’, Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27, p. 25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+this+properly+means+to+die+for+another%3A+to+liberate+another+from+death+by+one%E2%80%99s+own+death%2C+that+he+may+live.+Thus+David+in+his+lamentation+exclaims%3A+%E2%80%9CMy+son+Absalom%3A+who+shall+give+me+to+die+for+thee%3F%E2%80%9D+meaning%2C+would+that+by+my+death+I+could+redeem+thy+life%2C+or+liberate+thee+from+death+%282+Sam.+18%3A33%29.+In+the+same+way+Christ+is+said+to+have%E2%80%9D+died+for+us+when+we+were+enemies%E2%80%9D+and+%E2%80%9Cungodly%E2%80%9D%3A+that+is%2C+to+have+liberated+us%2C+being+enemies+and+ungodly%2C+from+death+by+his+own+death+%28Rom.+5%3A6%29.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+%E2%80%98Oration+on+the+Synod+of+Dort+%26+the+Remonstrants%E2%80%99+Articles%E2%80%99%2C+Article+2%2C+%E2%80%98Concerning+the+Death+of+Christ+for+All%E2%80%99+in+%E2%80%98Oration+on+the+Synod+of+Dort+%26+the+Remonstrants%E2%80%99+Articles%E2%80%99+trans.+AI+%281619%3B+Monergism%2C+2026%29%2C+pp.+24-27%2C+p.+25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67cb1ff92e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67cb1ff92e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=For%20this%20properly%20means%20to%20die,by%20his%20own%20death%20%28Rom.%205%3A6&amp;text=For%20this%20properly%20means%20to%20die%20for%20another&amp;text=from%20death%20by%20his%20own%20death%20%28Rom.%205%3A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

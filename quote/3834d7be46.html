<main class="wrap"><figure class="quote" id="q-3834d7be46" data-kw="">
<blockquote><p>I do no less heartily thank, then worthily commend in the Lord, all you that are present, who, according to your accustomed manner, are so willingly and joyfully gathered together, induced hereunto, not through any vain delight of fond novelty, but of a serious, and studious zeal of godliness, not as gazers of frivolous fantastical fables, but as willing witnesses of this great and inestimable benefit of almighty God.

Lastly, I do from the bottom of my heart rejoice in the behalf of this person, for whose cause we are as now met here together, who being transported from out the uttermost parts of Barbary into England, and conversant amongst us, by the space of six whole years, renouncing now at the last the natural contumacy of his native country, doth with so earnest bent affection of voluntary will, cheerfully desire to become a member of Jesus Christ, and to be made partaker of his holy congregation through faith, and Baptism.

And withal I most humbly beseech Almighty God, that he will not only vouchsafe his gracious increase to this glorious work begun with this Israelite stranger, but also to allure the whole remnant of the circumcised Race, by this his example, to be desirous of the same communion: So that at the length, all nations, as well Jews, as Gentiles, embracing the faith, and Sacraments of Christ Jesus, acknowledging one Shepherd, united together in one sheepfold, may with one voice, one soul, and one general agreement, glorify the only begotten son our saviour Jesus Christ, &amp; be glorified again of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-37c89f6727" data-kw="">
<blockquote><p>However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-17afc6fb4a" data-kw="">
<blockquote><p>Repentance is a detestation of wicked life, and a turn to the better. Whence the parts of repentance are two: withdrawal from evil, and approach to the good, Psalm 34:14, depart from evil, and do good. It is evident that this repentance, insofar as it is saving conversion to God, that is, Sanctification begun or continued, pertains to the Gospel: (1.) Because it is an effect of evangelical doctrine. (2.) Because the baptism of repentance, which John preached, Mk. 1:4, is not a sacrament of the Law, but of the Gospel. (3.) Because the Gospel alone works that sorrow that is according to God, 2 Cor. 7:10. But the Law works wrath, Rom. 4:15. (4.) Because it immediately flows from the remission of sins, insofar as the Gospel is the preaching of the remission of sins and of repentance, Mk. 6:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634). ‘Gospel-Offer &amp; Covenant of Grace’ Wendelin (1584-1652)</span></figcaption>

<blockquote><p>XXII. Nor does the law contain any implicit condition of repentance, as if the meaning of its penalties were this: “Whoever breaks the law shall die—unless he repents.” For if that were the case, then by repenting, the sinner would have satisfied the law and could demand acquittal not as grace, but as right, and the judge would be bound by law to justify him.</p></blockquote>

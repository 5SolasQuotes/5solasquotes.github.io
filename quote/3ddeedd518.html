<main class="wrap"><figure class="quote" id="q-3ddeedd518" data-kw="">
<blockquote><p>Now for the last thing which makes things indifferent with us scandalous: we are not left without witness from the Scriptures in such cases. But that ceremonies, known to be scandalous, were notwithstanding used: for, it is manifest concerning the Jewish ceremonies that they were scandalous in the usage to the gentiles and in the omitting to the Jews, Acts 21:21-22, 27-28; Gal. 2:3, 9, 12. But that this point of scandal may be distinctly understood, diverse rules are to be considered of: First, that the angering or bare displeasing of other men is not the offense or scandal condemned in Scripture, as not only the words in the original show, but all sound divines grant. A scandal is a stumbling block that occasions a man to fall from grace in the profession of it, into sin or error. Secondly, that to give offense, by doing anything which is simply evil in itself (as David did by his adultery and murder), this is out of all question abominable. Thirdly, that the offense of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so, offense must not be given either to the Jews or to the Grecian, 1 Cor. 10:31. Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons; but must make conscience of it, that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13] to obey the human ordinances of men in authority, from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances, and that we be careful not to offend private men in free ceremonies. Fiftly, that where ceremonies are left free and indifferent and have no commandement to restrain their use or enjoin it, there are men to redeem the offense of their brethren with no other price than the loss of liberty in things indifferent. The apostle Paul says rather than [that] he will offend his brother, he will never eat flesh while he lives, 1 Cor. 10:8, 13. He does not say he will never preach the Gospel while he lives, or never receive the sacraments while he lives: a necessity lay upon him to preach the Gospel, and to yield to the use of all lawful things to get his liberty, whosoever be offended. Sixtly, that where the person that takes offense is wilfully ignorant and by all means avoids instruction and will not have the patience to be taught, such offense is not to be regarded. Thus our Savior Christ teaches confidently his doctrine of eating his flesh, though the Capernaites were offended: and some of his disciples turned apostates about it, being such persons as would not abide the exposition of his meaning, Jn. 6:52. Seventhly, the like is to be said of such persons as take offense out of envy or malice, as the man in the parable that envied Christ’s bounty (Mt. 20:15), or the Pharisees, that out of malice were offended at Christ, Mt. 15:14; 1 Pet. 2:8. Eighthly, that in things that have proved scandalous, yet we are not bound to lose our liberty till the weak brother declare his offense. Meat sacrificed to idols was offensive to many in all countries, yet the apostle’s rule is, ‘Eat and make no question unless one say, ‘This is meat sacrificed to idols,” 1 Cor. 10:25, 28.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), on 1 Pet. 2:13</cite>, pp. 595-97</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3be58e389" data-kw="">
<blockquote><p>Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.</p></blockquote>

</figure><figure class="quote" id="q-fbb443ae3f" data-kw="">
<blockquote><p>Scandal or offence is not the grieving or displeasing of my brother; for peradventure when I grieve him or displease him, I do edify him; now edification and scandal are not compatible. But scandal is a word or deed proceeding from me which is, or may be, the occasion of another man’s halting or falling into, or swerving from the straight way of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 8</cite>, p. 31</span></figcaption>

<blockquote><p>Lastly, there is difference in the faulty carriage of the persons: and that on both parts; especially on ours. For though our non-conforming brethren condemn us [conformists] with much liberty of speech and spirit, having yet less reason for it than the weak Romans had [in ch. 14] (for the strong among them might have forborn some things for the weak’s sake; and it would well have become them for the avoiding of scandal so to have done; which we cannot do without greater scandal in the open contempt of lawful authority…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Sermons: Preached at Two Several Visitations... (London: 1622), Sermon 1</cite>, pp. 35-36</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2d54bba5f6" data-kw="">
<blockquote><p>This promise of sanctification, is the principal promise of the covenant, made to Christ for his elect seed. Among the other promises of that class, it shines as the moon among the twinkling stars. Sanctification, is the chief subordinate end of the covenant; standing in it next to the glory of Jehovah, which is the chief ultimate end of it.

All the foregoing promises; the promise of preservation, of the quickening Spirit, of faith, of justification, and of a new and saving relation to God, tend thereto, and stand related to it as means to their end. They are all fulfilled to elect sinners, on purpose to render them holy. And all the subsequent promises, even the promise of glorification itself, are but the promise of sanctification extended. …

For the great object which Satan aimed at, in seducing our first parents to sin, was the defacing of the image of God in them; that so, the human race might no longer resemble God, but resemble himself: and the mystery of God for the recovery of lost sinners, is then and not till then, finished, when holiness restored to them, is brought to perfection.

From all this, it is obvious that the sanctification of all, who shall ever enter into heaven, is, in the covenant, secured on the firmest grounds, infinitely beyond the possibility of failure; that the unsanctified, have no personal interest in the covenant; and that the less holy the believer is, the less, is the promise of eternal life in the covenant, fulfilled, to him. The sanctification of sinners, is the great design of that holy covenant. It is that which the Father, Son, and Holy Spirit, next to the glory of redeeming grace, had principally in their view: and the promise of it is, in respect of sinners, the chief, the capital branch, of the promise of eternal life to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 217, 218.</span></figcaption>

<blockquote><p>Let no Church therefore think itself perfect, and needing nothing, (as bragging Laodicea did) especially when it hath but that first foundation which it had when it came newly out of Babylon; and more especially in matters of worship and discipline.

It is no dishonour unto those Reformers, to say, that they fully finished not this work; as it was not unto Zerubbabel here, that he perfected not the Temple at first. Blessed men! It is evident they purposed more then they did or could effect, because the people’s hearts were not [as yet] prepared, as the phrase is, 2 Chron. 20. 33. In our very Common-Prayer book, there is an [Until] the said discipline may be restored, which argueth they aimed at more. And besides, They were not Apostles, to whom nothing might be added, as Gal. 2. 6.

And God raising up the Tabernacle that was fallen down, not by immediate inspiration, (as at first by the Apostles) but by his Spirit, renewing and begetting light in an ordinary way: Hence therefore the Churches coming out of the darkness of Popery, must needs recover that fulness and perfection of light (which the Apostolical times had) …, by piece-meals and degrees. As for the great things of the Gospel, matters of Faith, or Doctrine, they had so happy a hand therein, that there is to be found little, if any Hay or stubble therein: But in matters of Order, which concern Worship and Discipline, (for so the Apostle distinguisheth, Colos. 2. 5. [Faith and Order] let it be enquired into, whether they were so exact therein.

Although this must be said, that God did take care for all Fundamental Ordinances of his worship; and it is a bitter error, and full of cruelty, to say, We have had no Churches, no Ministers, no Sacraments, but Antichristian all. God’s first and chief care was to build up his Church mystical, to make men Saints, and he hath made glorious ones in their personal walkings with him: and to that end he made a plentiful provision in matters of faith, even from the very first.

It fell out in this case, as in a new Plantation; which if men were to make in another world, and so to begin the world anew, their first care would be to provide necessaries for their subsistence as they are men; to have corn for bread, cattle for meat, and the like: But matters of Order &amp; Government they think of afterwards, and often fall into the right, by seeing their errors by degrees. Think not much, therefore, that men call for (as most men do) a reformation of some things amiss in matters of worship &amp; discipline, or an addition of some things; perhaps a Candlestick, or some other utensil or ordinance of Church-worship is found wanting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zerubbabel’s encouragement to finish the temple. A sermon preached before the honourable House of Commons, at their late solemn fast, Apr. 27 1642</cite>, (London: R. Dawlman, 1642), pp 16-18.</span></figcaption>

<blockquote><p>Whether the infusion of grace is required for justification? It is distinguished. Whether some movement of free choice and faith is required? It is affirmed with a distinction. … Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, 9. ‘Justification’, Of Justification in General in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 3 Abbr.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether the infusion of grace is required for justification? It is distinguished. Whether some movement of free choice and faith is required? It is affirmed with a distinction. … Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished.”

<main class="wrap"><figure class="quote" id="q-90109a807c" data-kw="">
<blockquote><p>After his [Saul’s] death, the crown was set upon David‘s head. Whose constant pious life, and holy devotions (in Hymns, Psalms, and Spiritual Songs) are left, as the best patterns, directions, and encouragements to all posterity. And we are sure enough, that he himself, after his own use of them (to shew the difference betwixt His end, and Saul‘s) was happily assured to be one of the Heavenly Quire above, and there Crowned again with an immortal Crown of Glory. David is an ancient Pattern, a Royal Prophet, and Grand Guide to such, as are willing to fight the Battles of the Lord, in their Pilgrimage towards the true Land of Promise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-stokes.html">David Stokes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Verus Christianus</cite>, [The True Christian], or, Directions for Private Devotions and Retirements… (Oxford, 1668), ‘A Transition to What Follows in the Appendix’, no page number. Stokes (1591?-1669) was an educated Anglican.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1a602939db" data-kw="">
<blockquote><p>Teaching and admonishing one another. This is one way wherein we are to be the means of each others’ instruction and one means whereby the Word of God, particularly that part of the Word that consists in psalms &amp; hymns and spiritual songs is to dwell in us richly in all wisdom. Singing of Psalms is a Great help to a spiritual understanding of the Psalms. The mind of the Holy Ghost in the Psalms is often times conveyed while the Psalm is a singing, and as it is a means of a spiritual understanding of that excellent part of the Word of God… What should be sung, viz. Psalms. What seems to be here intended, at least chiefly, is the Psalms and spiritual songs that are contained in the Word of God, for the apostle is speaking of the Word of God. Let the Word of God, says he, dwell in you richly in all wisdom, and then he mentions singing as a means, but then it must be singing some part of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon Notes on Col. 3:16 in Sermons, Series II</cite>, 1736 (WJE Online Vol. 51)</span></figcaption>

</figure><figure class="quote" id="q-cf628fee0b" data-kw="">
<blockquote><p>Teaching and admonishing one another in Psalms, and Hymns, and spiritual Songs] See Eph. 5:19. In both which places, as the Apostle exhorteh us to singing, so he instructs what the matter of our song should be,† viz. Psalms, Hymns, and spiritual Songs. Those three are the titles of the songs of David, as they are delivered to us by the Holy Ghost Himself; some of them are called Mizmorim, Psalms; some Tehillim, Hymns; some Shirim, Songs, Spiritual Songs. †Mr. Cotton of singing of Psalms, ch. 4, and on 1 Cant., Psalmus est in quo concinendo adhibetia musicum aliquod instrumentum praeter linguam. Hymnus propriè est laudis canticum, sive alta voce, sive aliter canatur. Oda non laudes tantum continet, sed paraeneses &amp; alia argumenta. Calvinus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, (London: 1650) | on Col. ch. 3, verse 16, p. 306</span></figcaption>

</figure><figure class="quote" id="q-db563e53ef" data-kw="">
<blockquote><p>In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Psalms in meter. Agreeable to the Hebrew, to be sung in usual tunes. To the benefit of the churches of Christ</cite>, 1655 | Background to White’s psalter by Andrew Myers:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>43. Vocal prayer is either in prose, or in meter.

44. In meter singing is joined, and therefore there must be more care of the speech and tone, then in prose.

45. But the melody of singing is ordained for a certain spiritual delight, whereby the mind is detained in the meditation of the thing that is sung. … 48. But because this religious melody has the respect of prayers: therefore it is not so fit, that the Decalogue, and other such like which do not partake the nature of prayer, be turned into meter and be sung instead of psalms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, &amp; the Interpreters thereof, and brought into Method</cite>, (London: 1642), Book 2, ch. 9, ‘Of Prayer’, pp. 283-4</span></figcaption>

<blockquote><p>Q. WHAT ought to be the chief, &amp; continual care of every man in this life?

A. To glorify God, and save his soul.

Expos. 1. God’s glory, that is, his surpassing worthiness, cannot be increased, nor fully manifested. Ex. 33. 20. because he is most perfect. Psal. 16. 2. and infinite. Job 22. 2. and 35. 7. God is said to glorify himself when he makes his excellency to appear. Numb. 14. 21. Psal. 72. 19. Ezeck. 43. 2. Angels and men glorify him when they extoll his greatness, and testify their acknowledgement of his glory. Luc. 2. 14. Rev. 14. 7. Ex. 15. 2. Here then to glorify God, is inwardly in heart. Rom. 4. 20. 1. Cor. 6. 20. and outwardly in word and action. Matth. 5. 16. 1. Pet. 2. 12. to acknowledge God to be such a one as he hath revealed himself. Rev. 4. 9. 11. Psal. 29. 1. 2. and. 50. 23. Of glorifying God, man should be most careful: for God is the beginning from which, and the end unto which all things do tend. Rom. 11. 36. his glory is in it self most excellent. Exod. 33. 18. 19. Psal. 148. 13. most dear to him. Ex. 7. 4. 5. Esa. 42. 8. and 48. 11. the supreme end of all divine revelation. Eph. 2. 7. of all his works. Eph. 1. 5. 6. Pro. 16. 4. Exod. 9. 16. Psal. 50. 15. Ioh. 11. 4. 40. of man’s life. Psa. 6. 4. 5. and service. Zach. 7. 5. 6. Psa. 101. 1. Joh. 3. 28. 29: and all means furthering the same, are available to man’s salvation. Rom. 4. 20. 21. Jer. 13. 16. Matth. 2. 2. 1. Sam. 2. 30. Psal. 50. 23.

2. To take care for our salvation, is so to live here, that we may live with the Lord hereafter. Phi. 2. 12. 2. Pet. 3. 11. 14. The salvation of the soul is most precious. Psal. 49. 8. cannot be obtained without care. Act. 2. 37. 1. Cor. 9. 24. Matth. 7. 13. Luk. 12 24. and he is ever mindless of God’s glory, that is careless of his eternal happiness. Eph. 2. 12. Joh. 5. 44. and, 7. 18. Also eternal life is a durable treasure. Luk. 12. 33. and 16. 9. 10. 1. Tim. 6. 17. 18. all worldly things are vain, uncertain, and transitory. Matth. 6. 19. Psa. 73. 18. 19. the soul came from God and is after a restless manner carried to seek, and desire communion with God, and a desire to be happy, is naturally planted in the hearts of all men, by God himself; therefore we should earnestly set our affections upon things that are above. Col. 3. 1, 2. Phil. 3. 12, 13, 14. and infinitely desire the enjoying of God’s presence in heaven, for he is infinite in goodness, the highest of all things that are to be desired.

Q. Whence must we take direction to attain hereunto?

A. Out of the word of God alone.

Expos. 3. God only can give the crown of glory. 2. Tim. 4. 8. Jam. 1. 12. he also is the author, object, &amp; end of true religion. Gen. 18. 19. Act. 18. 25. 26. Joh. 6. 29. therefore none but he can reveal the way how we should obtain that everlasting inheritance. Psal. 16. 11. Pro. 2. 6. 9. For the nature of God is incomprehensible, his will and works are unsearchable. Heb. 11. 6. Deut. 4. 4. 6. and 29. 29. Heb. 11. 3. No man hath known the Father but the Son, and he to whom the Son hath revealed him. Joh. 1. 18. Matth. 11. 27. and the Gospel is an hidden mystery. 1. Cor. 2. 7. 10. Rom. 16. 25. 26. so that we can know nothing of God, until God himself manifesteth it unto us. Psal. 103. 7. and 147. 19. 20. By the word of God, we understand the will of God revealed to reasonable creatures, teaching them what to do, believe, and leave undone. Deut. 29. 29.</p></blockquote>

<blockquote><p>That God cannot but prove efficient when those means are used for the salvation of men which he himself hath ordained for that purpose. Although, therefore, the preaching of the Gospel by men weak, despised, defiled by sin, may seem an insignificant means to the attainment of human salvation; yet, since it is the ordinance and will of God, it will prove most effectual: for the foolishness of God is wiser than men, and the weakness of God is stronger than man, 1 Cor. i. 25. There will be no need therefore to expect either an angel from heaven, or extraordinary visions and divine revelations; we have only to hearken to apostolic doctrine, and it will be the power of God to salvation to all that believe.</p></blockquote>

<blockquote><p>Q. 3. How, then, are these ways and means of the worship of God made known unto us? A. In and by the written word only, which contains a full and perfect revelation of the will of God as to his whole worship and all the concernments of it.—John 5:39; Isa. 8:20; Luke 16:29; 2 Tim. 3:15–17; 2 Pet. 1:19; Deut. 4:2, 12:32; Josh. 1:7; Prov. 30:6; Rev. 22:18, 19; Isa. 29:13, 14. EXPLICATION—The end wherefore God granted his word unto the church was, that thereby it might be instructed in his mind and will as to what concerns the worship and obedience that he requireth of us, and which is accepted with him. This the whole Scripture itself everywhere declares and speaks out unto all that do receive it; as 2 Tim. 3:15–17, with the residue of the testimonies above recited, do declare. It supposeth, it declareth, that of ourselves we are ignorant how God is, how he ought to be, worshipped, Isa. 8:20. Moreover, it manifests him to be a “jealous God,” exercising that holy property of his nature in an especial manner about his worship, rejecting and despising every thing that is not according to his will, that is not of his institution, Exod. 20:4–6. That we may know what is so, he hath made a revelation of his mind and will in his written word,—that is, the Scripture. And to the end that we might expect instruction from thence alone in his worship, and act therein accordingly,— First, He sends us and directs us thereunto expressly for that purpose, Isa. 8:20; Luke 16:29; John 5:39; and not once intimates in the least any other way or means of instruction unto that end. Secondly, He frequently affirms that it is sufficient, able, and perfect to guide us therein, 2 Tim. 3:15–17; 2 Pet. 1:19; Ps. 19:7–9. And whereas he hath expressly given it unto us for that end, if there be any want or defect therein it must arise from hence, that either God would not or could not give unto us a perfect revelation of his will; neither of which can be imagined. Thirdly, He hath commanded us to observe all whatsoever he hath appointed therein, and not to make any addition thereunto, Josh. 1:7; Deut. 4:2, 12:32; Prov. 30:6; Rev. 22:18, 19. And,— Fourthly, Peculiarly interdicted us the use of any such things as are of the institution or appointment of men, Isa. 29:13, 14. So that from the Scriptures alone are we to learn what is accepted with God in his worship.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q. 3. How, then, are these ways and means of the worship of God made known unto us? A. In and by the written word only, which contains a full and perfect revelation of the will of God as to his whole worship and all the concernments of it.—John 5:39; Isa. 8:20; Luke 16:29; 2 Tim. 3:15–17; 2 Pet. 1:19; Deut. 4:2, 12:32; Josh. 1:7; Prov. 30:6; Rev. 22:18, 19; Isa. 29:13, 14. EXPLICATION—The end wherefore God granted his word unto the church was, that thereby it might be instructed in his mind and will as to what concerns the worship and obedience that he requireth of us, and which is accepted with him. This the whole Scripture itself everywhere declares and speaks out unto all that do receive it; as 2 Tim. 3:15–17, with the residue of the testimonies above recited, do declare. It supposeth, it declareth, that of ourselves we are ignorant how God is, how he ought to be, worshipped, Isa. 8:20. Moreover, it manifests him to be a “jealous God,” exercising that holy property of his nature in an especial manner about his worship, rejecting and despising every thing that is not according to his will, that is not of his institution, Exod. 20:4–6. That we may know what is so, he hath made a revelation of his mind and will in his written word,—that is, the Scripture. And to the end that we might expect instruction from thence alone in his worship, and act therein accordingly,— First, He sends us and directs us thereunto expressly for that purpose, Isa. 8:20; Luke 16:29; John 5:39; and not once intimates in the least any other way or means of instruction unto that end. Secondly, He frequently affirms that it is sufficient, able, and perfect to guide us therein, 2 Tim. 3:15–17; 2 Pet. 1:19; Ps. 19:7–9. And whereas he hath expressly given it unto us for that end, if there be any want or defect therein it must arise from hence, that either God would not or could not give unto us a perfect revelation of his will; neither of which can be imagined. Thirdly, He hath commanded us to observe all whatsoever he hath appointed therein, and not to make any addition thereunto, Josh. 1:7; Deut. 4:2, 12:32; Prov. 30:6; Rev. 22:18, 19. And,— Fourthly, Peculiarly interdicted us the use of any such things as are of the institution or appointment of men, Isa. 29:13, 14. So that from the Scriptures alone are we to learn what is accepted with God in his worship.”

— John Owen, The Works of John Owen, ed. William H. Goold, vol. 15 (Edinburgh: T&amp;T Clark, n.d.), 449–50.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+3.+How%2C+then%2C+are+these+ways+and+means+of+the+worship+of+God+made+known+unto+us%3F+A.+In+and+by+the+written+word+only%2C+which+contains+a+full+and+perfect+revelation+of+the+will+of+God+as+to+his+whole+worship+and+all+the+concernments+of+it.%E2%80%94John+5%3A39%3B+Isa.+8%3A20%3B+Luke+16%3A29%3B+2+Tim.+3%3A15%E2%80%9317%3B+2+Pet.+1%3A19%3B+Deut.+4%3A2%2C+12%3A32%3B+Josh.+1%3A7%3B+Prov.+30%3A6%3B+Rev.+22%3A18%2C+19%3B+Isa.+29%3A13%2C+14.+EXPLICATION%E2%80%94The+end+wherefore+God+granted+his+word+unto+the+church+was%2C+that+thereby+it+might+be+instructed+in+his+mind+and+will+as+to+what+concerns+the+worship+and+obedience+that+he+requireth+of+us%2C+and+which+is+accepted+with+him.+This+the+whole+Scripture+itself+everywhere+declares+and+speaks+out+unto+all+that+do+receive+it%3B+as+2+Tim.+3%3A15%E2%80%9317%2C+with+the+residue+of+the+testimonies+above+recited%2C+do+declare.+It+supposeth%2C+it+declareth%2C+that+of+ourselves+we+are+ignorant+how+God+is%2C+how+he+ought+to+be%2C+worshipped%2C+Isa.+8%3A20.+Moreover%2C+it+manifests+him+to+be+a+%E2%80%9Cjealous+God%2C%E2%80%9D+exercising+that+holy+property+of+his+nature+in+an+especial+manner+about+his+worship%2C+rejecting+and+despising+every+thing+that+is+not+according+to+his+will%2C+that+is+not+of+his+institution%2C+Exod.+20%3A4%E2%80%936.+That+we+may+know+what+is+so%2C+he+hath+made+a+revelation+of+his+mind+and+will+in+his+written+word%2C%E2%80%94that+is%2C+the+Scripture.+And+to+the+end+that+we+might+expect+instruction+from+thence+alone+in+his+worship%2C+and+act+therein+accordingly%2C%E2%80%94+First%2C+He+sends+us+and+directs+us+thereunto+expressly+for+that+purpose%2C+Isa.+8%3A20%3B+Luke+16%3A29%3B+John+5%3A39%3B+and+not+once+intimates+in+the+least+any+other+way+or+means+of+instruction+unto+that+end.+Secondly%2C+He+frequently+affirms+that+it+is+sufficient%2C+able%2C+and+perfect+to+guide+us+therein%2C+2+Tim.+3%3A15%E2%80%9317%3B+2+Pet.+1%3A19%3B+Ps.+19%3A7%E2%80%939.+And+whereas+he+hath+expressly+given+it+unto+us+for+that+end%2C+if+there+be+any+want+or+defect+therein+it+must+arise+from+hence%2C+that+either+God+would+not+or+could+not+give+unto+us+a+perfect+revelation+of+his+will%3B+neither+of+which+can+be+imagined.+Thirdly%2C+He+hath+commanded+us+to+observe+all+whatsoever+he+hath+appointed+therein%2C+and+not+to+make+any+addition+thereunto%2C+Josh.+1%3A7%3B+Deut.+4%3A2%2C+12%3A32%3B+Prov.+30%3A6%3B+Rev.+22%3A18%2C+19.+And%2C%E2%80%94+Fourthly%2C+Peculiarly+interdicted+us+the+use+of+any+such+things+as+are+of+the+institution+or+appointment+of+men%2C+Isa.+29%3A13%2C+14.+So+that+from+the+Scriptures+alone+are+we+to+learn+what+is+accepted+with+God+in+his+worship.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+15+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+449%E2%80%9350.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac8160d8eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac8160d8eb.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/04/owen-on-sola-scriptura-as-applied-to-public-worship/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>And after all this, if it should please God [that] any person of the blessed and most holy Trinity should appear in any visible shape, that shape might be depicted; of that shape an image might be made; I mean, it might naturally; it might if it were done for lawful ends, and unless a commandment were to the contrary; and therefore so long as God keeps himself within the secret recesses of his sanctuary, and the majesty of his invisibility, so long it is plain he intends the very first sense and words of his [Second] Commandement: but if he should cancel the great reason [Dt. 4, end] of his Commandement, and make that by an act of his own to become possible which in the nature of things is impossible, that is, that an image can be made of God; I should believe that God did intend to dispense in that part of the Commandement, and declare that he intended it only for a temporary band: For if the reason of the commandement were taken away; either the commandement also ceases to oblige; or must be bound upon us by another reason, or a new sanction, or at lest a new declaration; or else it would follow that then his visible appearance would become a snare to mankind. But because yet he has not yet appeared visibly and has by no figure or idea represented the Godhead; and that it is a truth which must last as long as Christian religion lasts, that no man can see God, therefore it follows that it is at no hand lawful to make an image of God or relating to the divinity. If a dove be made it must not be intended to represent the Holy Ghost, for besides that no dove did appear, nor shape of a dove, yet if it did, it related not to the person of the Holy Ghost, but to the impression made upon the person on whom the light descended: and if the figure of the crucifix be made, or of Jesus in the flesh, it is wholly relative to the creature, not to him as God; for that is impious, and unreasonable and impossible to be done in any natural proportion.</p></blockquote>

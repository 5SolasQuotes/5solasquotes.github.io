<main class="wrap"><figure class="quote" id="q-d662f50fd5" data-kw="">
<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 6</cite>, pp. 45-56</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe52bd7c6f" data-kw="">
<blockquote><p>Frame takes it for granted that “worldview” is a durable, if not permanent, concept. This assumption seems unwarranted. Worldview is itself a product of modern philosophy—of Hegel’s idealism, to be precise. Frame doesn’t see an antithesis between worldview and Christianity. But that tension needs to be explored. Worldview as a concept may not even survive the passing of the modern age. If not, then Christians need to be equipped for life after worldview.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-m-gamble.html">Richard M. Gamble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Horizons (March 2017), a magazine of the OPC</cite></span></figcaption>

<blockquote><p>The Achilles heel of Van Til is his commitment to the idea that all rational beings observe, necessarily, the phenomena of this world through an interpretative schema by which they interpret everything, and from which they cannot escape;and, that there is, therefore, no common ground. We suggest that the greatest difficulty for Presuppositionalism is that if these claims constitute the foundation of Presuppositionalism, then it would seem that there is no way to know, with any measure of certainty, that Van Til (and, therefore, his particular school of reformed Christianity) is telling the truth, and that all other views say false… There are no reasons that can be given either to defend his system or to attack his system; and this would also be true of all those beliefs that fall within interpretative systems of fallen man… (3) If a person interprets all of reality, always, through his interpretative schema, then he cannot have unmediated and uninterpreted access to reality in order to compare the proposed truth claims of his schema with the way in which things really are (in other words, there is no common ground or objective position from which a person could accomplish the unmediated and uninterpreted comparison that he must accomplish, according to the second premise, in order to know the truth or falsity of his schema.)… Is there any way to avoid this embarrassing situation?… The third premise seems to be the most analytical affirmation that is to be found in the postmodern theory that is Presuppositionalism. It is quite simply a fact that, if a person always interprets reality through their interpretive schema, then one cannot have access, without mediation or interpretation, to reality in order to compare the truth claims of said schema to the way things really are. That is to say, if a person always interprets reality through their interpretive schema, then even if they wanted (or attempted) to compare the statements of their schema with “reality”, they would be doing this comparison through the interpretive schema that they are attempting to examine. It’s like having a pair of colored spectacles (let us say that they are pink) permanently cemented on your face… It follows that if we reject either the third or fourth premise, or both, then we reject at the same time, Presuppositionalism; what we accept, however, would be the classical position of orthodox reformed theology, as seen in such great theologians as John Calvin and Francis Turretin.</p></blockquote>

<blockquote><p>It is a common thought among the Reformed that there are no meaningful differences between our views and those of the Roman Catholic church on the doctrine of God and of the Trinity…</p></blockquote>

</figure><figure class="quote" id="q-bd3490fb52" data-kw="">
<blockquote><p>The first sort [of objectors] say, ‘It is to no purpose to dispute against such as deny grounded principles.’ And by this means, because one grounded principle is denied them, they break off quite and clean, as though all mean of conference were taken away. Surely this principle of theirs is very true, but yet (in my judgment) it is very ill understood. I grant it is to no purpose to dispute against such as deny grounded principles, by the same principles which they deny: That is very true. But there may be some other principles common to both sides, by the which a man may profitably dispute with them, and by those common principles oftentimes prove and verify his own principles. And that is the thing which I intend to do in this work. As for example: The Christian grounds himself upon the Gospel; the Jew denies it: and therefore it were to no purpose to allege it unto him. But both the Jew and the Christian have one common principle and ground, which is the Old Testament: By this may the Christian profitably dispute against the Jew, yea even to the verifying of the Gospel. … Likewise the Jew is grounded upon the Old Testament, which the Gentile would mock at if he should allege it unto him. But both the Gentile and the Jew have one common nature, which furnishes them both with one common philosophy, and with one common sort of principles; as that there is one God which governs all things; that He is good, and no author of evil; that He is wise, and does not anything in vain. Also that man is born to be immortal; that to be happy he ought to serve God and continue in his favor. And therewithal, that he is subject to passions, inclined to evil, weak unto good and so forth. Of these common principles, the Jew may draw necessary conclusions, which the Gentile shall not perceive at the first, like as when a man understands a proposition, but conceives not yet the drift and consequence thereof… Thus shall the Jew by common principles and conclusions, verify his own ground which is the Old Testament… And what else is all this than that which is commonly done in geometry and logic, which by two lines or by two propositions that are commonly known and certain, do gather… a third proposition (that is to say, a conclusion) that was… either doubted of or hidden, and by means of the other two is evidently found out, and necessarily proved. … To be short, the mark that our faith looks at, is the Author of Nature and principle of all principles. The rules therefore and the principles of nature which He has made cannot be contrary unto Himself. And He is also the very reason and truth itself. All other reason then, and all other truth depends upon Him, and relies upon Him, neither is there, or can there be any reason or truth but in Him: So far off is it, that the thing which is true and reasonable in nature, is or can be false in divinity, which (to speak properly) is not against nature, but against the corruption of nature, and in very deed about nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-du-mornay.html">Philip Du Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Work concerning the Trueness of the Christian Religion… against Atheists, Epicures, Paynims, Jews, Mahumetists and other Infidels (London: Cadman, 1587), Preface, n.p.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The first sort [of objectors] say, ‘It is to no purpose to dispute against such as deny grounded principles.’ And by this means, because one grounded principle is denied them, they break off quite and clean, as though all mean of conference were taken away. Surely this principle of theirs is very true, but yet (in my judgment) it is very ill understood. I grant it is to no purpose to dispute against such as deny grounded principles, by the same principles which they deny: That is very true. But there may be some other principles common to both sides, by the which a man may profitably dispute with them, and by those common principles oftentimes prove and verify his own principles. And that is the thing which I intend to do in this work. As for example: The Christian grounds himself upon the Gospel; the Jew denies it: and therefore it were to no purpose to allege it unto him. But both the Jew and the Christian have one common principle and ground, which is the Old Testament: By this may the Christian profitably dispute against the Jew, yea even to the verifying of the Gospel. … Likewise the Jew is grounded upon the Old Testament, which the Gentile would mock at if he should allege it unto him. But both the Gentile and the Jew have one common nature, which furnishes them both with one common philosophy, and with one common sort of principles; as that there is one God which governs all things; that He is good, and no author of evil; that He is wise, and does not anything in vain. Also that man is born to be immortal; that to be happy he ought to serve God and continue in his favor. And therewithal, that he is subject to passions, inclined to evil, weak unto good and so forth. Of these common principles, the Jew may draw necessary conclusions, which the Gentile shall not perceive at the first, like as when a man understands a proposition, but conceives not yet the drift and consequence thereof… Thus shall the Jew by common principles and conclusions, verify his own ground which is the Old Testament… And what else is all this than that which is commonly done in geometry and logic, which by two lines or by two propositions that are commonly known and certain, do gather… a third proposition (that is to say, a conclusion) that was… either doubted of or hidden, and by means of the other two is evidently found out, and necessarily proved. … To be short, the mark that our faith looks at, is the Author of Nature and principle of all principles. The rules therefore and the principles of nature which He has made cannot be contrary unto Himself. And He is also the very reason and truth itself. All other reason then, and all other truth depends upon Him, and relies upon Him, neither is there, or can there be any reason or truth but in Him: So far off is it, that the thing which is true and reasonable in nature, is or can be false in divinity, which (to speak properly) is not against nature, but against the corruption of nature, and in very deed about nature.”

— Philip Du Mornay, A Work concerning the Trueness of the Christian Religion… against Atheists, Epicures, Paynims, Jews, Mahumetists and other Infidels (London: Cadman, 1587), Preface, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+first+sort+%5Bof+objectors%5D+say%2C+%E2%80%98It+is+to+no+purpose+to+dispute+against+such+as+deny+grounded+principles.%E2%80%99+And+by+this+means%2C+because+one+grounded+principle+is+denied+them%2C+they+break+off+quite+and+clean%2C+as+though+all+mean+of+conference+were+taken+away.+Surely+this+principle+of+theirs+is+very+true%2C+but+yet+%28in+my+judgment%29+it+is+very+ill+understood.+I+grant+it+is+to+no+purpose+to+dispute+against+such+as+deny+grounded+principles%2C+by+the+same+principles+which+they+deny%3A+That+is+very+true.+But+there+may+be+some+other+principles+common+to+both+sides%2C+by+the+which+a+man+may+profitably+dispute+with+them%2C+and+by+those+common+principles+oftentimes+prove+and+verify+his+own+principles.+And+that+is+the+thing+which+I+intend+to+do+in+this+work.+As+for+example%3A+The+Christian+grounds+himself+upon+the+Gospel%3B+the+Jew+denies+it%3A+and+therefore+it+were+to+no+purpose+to+allege+it+unto+him.+But+both+the+Jew+and+the+Christian+have+one+common+principle+and+ground%2C+which+is+the+Old+Testament%3A+By+this+may+the+Christian+profitably+dispute+against+the+Jew%2C+yea+even+to+the+verifying+of+the+Gospel.+%E2%80%A6+Likewise+the+Jew+is+grounded+upon+the+Old+Testament%2C+which+the+Gentile+would+mock+at+if+he+should+allege+it+unto+him.+But+both+the+Gentile+and+the+Jew+have+one+common+nature%2C+which+furnishes+them+both+with+one+common+philosophy%2C+and+with+one+common+sort+of+principles%3B+as+that+there+is+one+God+which+governs+all+things%3B+that+He+is+good%2C+and+no+author+of+evil%3B+that+He+is+wise%2C+and+does+not+anything+in+vain.+Also+that+man+is+born+to+be+immortal%3B+that+to+be+happy+he+ought+to+serve+God+and+continue+in+his+favor.+And+therewithal%2C+that+he+is+subject+to+passions%2C+inclined+to+evil%2C+weak+unto+good+and+so+forth.+Of+these+common+principles%2C+the+Jew+may+draw+necessary+conclusions%2C+which+the+Gentile+shall+not+perceive+at+the+first%2C+like+as+when+a+man+understands+a+proposition%2C+but+conceives+not+yet+the+drift+and+consequence+thereof%E2%80%A6+Thus+shall+the+Jew+by+common+principles+and+conclusions%2C+verify+his+own+ground+which+is+the+Old+Testament%E2%80%A6+And+what+else+is+all+this+than+that+which+is+commonly+done+in+geometry+and+logic%2C+which+by+two+lines+or+by+two+propositions+that+are+commonly+known+and+certain%2C+do+gather%E2%80%A6+a+third+proposition+%28that+is+to+say%2C+a+conclusion%29+that+was%E2%80%A6+either+doubted+of+or+hidden%2C+and+by+means+of+the+other+two+is+evidently+found+out%2C+and+necessarily+proved.+%E2%80%A6+To+be+short%2C+the+mark+that+our+faith+looks+at%2C+is+the+Author+of+Nature+and+principle+of+all+principles.+The+rules+therefore+and+the+principles+of+nature+which+He+has+made+cannot+be+contrary+unto+Himself.+And+He+is+also+the+very+reason+and+truth+itself.+All+other+reason+then%2C+and+all+other+truth+depends+upon+Him%2C+and+relies+upon+Him%2C+neither+is+there%2C+or+can+there+be+any+reason+or+truth+but+in+Him%3A+So+far+off+is+it%2C+that+the+thing+which+is+true+and+reasonable+in+nature%2C+is+or+can+be+false+in+divinity%2C+which+%28to+speak+properly%29+is+not+against+nature%2C+but+against+the+corruption+of+nature%2C+and+in+very+deed+about+nature.%E2%80%9D%0A%0A%E2%80%94+Philip+Du+Mornay%2C+A+Work+concerning+the+Trueness+of+the+Christian+Religion%E2%80%A6+against+Atheists%2C+Epicures%2C+Paynims%2C+Jews%2C+Mahumetists+and+other+Infidels+%28London%3A+Cadman%2C+1587%29%2C+Preface%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd3490fb52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd3490fb52.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/apologetics#:~:text=The%20first%20sort%20%5Bof%20objectors%5D%2

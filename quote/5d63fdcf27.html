<main class="wrap"><figure class="quote" id="q-5d63fdcf27" data-kw="">
<blockquote><p>We believe that God the Father, by the Son, together with the Holy Ghost, in the space of six days created of nothing all things visible and invisible, which the Holy Spirit in the holy Scriptures comprehends under the name of ‘heauen and earth’;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Religion… (1586; Cambridge, 1599), Confession, ch. 5, sect. 1</cite>, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1d631ae1a" data-kw="">
<blockquote><p>To the eternal decree corresponds temporal execution. For since God neither changes His counsel nor can be hindered by anyone, whatever He decreed with Himself from eternity, He executes outside Himself in time. From the variety of this execution arises the distinction of God’s works. … Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-031055852b" data-kw="">
<blockquote><p>Q. 9. What is the work of creation? A. The work of creation is God’s making all things of nothing, by the Word of his power, in the space of six days, and all very good. … Q. In what time did He make them? A. In the space of six days.</p></blockquote>

</figure><figure class="quote" id="q-1072d9342b" data-kw="">
<blockquote><p>Of all the creatures in it, it may be truly said that they are but of yesterday, Job. 8:9, if we measure them according to God’s (that is according to the true) account, to whom a thousand years are but as yesterday, Ps. 90:4, in which estimation the world is not yet six days old… What are five or six thousand years to eternity? which God enjoys, who is from everlasting to everlasting, Ps. 90:2.</p></blockquote>

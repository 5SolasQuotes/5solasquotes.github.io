<main class="wrap"><figure class="quote" id="q-12966101eb" data-kw="">
<blockquote><p>1st. On the week day before the Sabbath, or Lord’s day, remember it, Exod. xx. 8, 9, to the end that none of your worldly business be left undone, or put off till then; especially upon Saturday, you must prepare for it. Then you must put an end to the works of your calling; and do whatsoever may be well done beforehand, to prevent bodily labour even in your necessary actions, that, when the day comes, you may have less occasion of worldly thoughts, less incumbrance and distractions; and may be more free, both in body, and mind, for spiritual exercises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s daily walk in holy security and peace</cite>, (1627; Philadelphia, 1800), p. 87.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4a4f9e44f" data-kw="">
<blockquote><p>I could not help observing, one day, how much Mr. N[ewton]. was grieved with the mistake of a minister, who appeared to pay too much attention to politics. “For my part,” said he, “I have no temptation to turn politician, and much less to inflame a party, in these times. When a ship is leaky, and a mutinous spirit divides the company on board, a wise man would say, ‘My good friends, while we are debating the water is gaining on us. We had better leave the debate, and go to the pumps.’ — I endeavour,” continued he, “to turn my people’s eyes from instruments to God. I am continually attempting to shew them, how far they are from knowing either the matter of fact or the matter of right. I inculcate our great privileges in this country, and advise a discontented man to take a lodging for a little while in Russia or Prussia.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cecil.html">Richard Cecil</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of the Rev. John Newton, with General Remarks on His Life, Connections, and Character</cite>, (1808) in The Works of the Rev. John Newton (6 vols, London: Hamilton, Adams, and Co., 1824), 1: 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-7d18767a50" data-kw="">
<blockquote><p>The law of the Sabbath is not only of universal and perpetual obligation, but it is a most benignant provision for man and the lower animals. It was instituted in paradise, immediate after the appointment of marriage, – the foundation of families and social relations. “The Sabbath was made for man,” designed for universal man, for his benefit in the fullest sense, and secured to him by divine authority and prescription, so as that no inferior power should dare to infringe the sacred enactment, or rob man of its beneficent provision. The Sabbath is God’s great and all-pervading means of giving efficiency to his moral government, and holds a similar relation to general morality that marriage does to social purity and happiness. It was intended to commemorate and enforce the rights of God, as the Creator, Preserver, and Redeemer of man. It was in every way designed for man’s welfare, bodily, mental, and spiritual; and its due observance contributes to his health, peace, and happiness, both as an individual, and as placed in various social relations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The races: the evils connected with horse-racing and the steeple-chase and their demoralizing effects</cite>, (1853) in Works doctrinal and practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh, 1876), iv, 361.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-c3b11cf246" data-kw="">
<blockquote><p>As touching private persons, their bonds of friendship and amity are diverse and manifold; among these, this is the chiefest, unto which also natural conjunction of blood (as God witnesses) must give place, I mean the bond and tie of wedlock: so that in my judgement the husband cannot with a good conscience go or the wife from the husband, especially if one of them be [infected with?] the plague: And how much parents do owe unto their children, and children to their parents, kinsmen to kinsmen, the very laws of nature declares, the which Christian charity is so far off from letting loose, that contrariwise it draws them more and harder together: Yea, and for servants to forsake their masters, or masters to look slenderly to their servants being sick (which comes too often to pass), who have made use of their service when they were well, is cruelty. Yet is not the bond of all these friendships alike or equal, and therefore that which is not so near must give place to the nearer, forasmuch as many cannot be discharged at once.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (London, 1665), p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93bcfc0f7e" data-kw="">
<blockquote><p>And so judgement-like is [men’s] withdrawing [from God], and smells so of vengeance, that God plagues withdrawing with withdrawing: Hos. 5:4, ‘They will not frame their doings to turn unto their God.’ And what is the issue of that? ‘They shall go with their flocks and herds to seek the Lord, but they shall not find Him; for He hath withdrawn Himself from them.’ Prov. 1:24, ‘I called, and ye refused;’ Verse 26, then this must follow, verse 28 (as also Jn. 8:21, the like is) ‘they shall call upon Me, but I will not answer.’ Use 6. It’s a terrible plague of God, which we would eschew as hell, to wit, provoking of God by such sins as may procure that God should in his judgement mar the lock of the heart, the will, that the door should neither shut nor open; and cast poison into the soul, so as angels and men, heaven and earth cannot help or cure it: Christ is good at opening hearts, and drawing sinners; and He is as good at judicial closing of hearts: If He but put his finger in the eye, and snap in pieces the optic nerves, all the world cannot restore sight, or open the heart. He that is nearest to be drawn to Christ, and yet never drawn, is deepest in hell: An evangelic-fire of God’s fury is worse than a Sinai-fire, though it burn up to mid-heaven: 1. Sinning against the light of nature and the known will of God, as idolatry and the principles of your own religion, true and known to be so, brings delivering up to judicial blindness, Rom. 1:21. 2. If ye put your finger in nature’s eye, and blow out that candle, God will give you up to vile affections, Rom. 1:24 and a reprobate mind, vv. 26-28. Some blow out the candle of nature, and God blows out the sun of the Gospel, that it is to them like sack-cloth of hair, and a moon like blood. 3. Resisting of the call of God, brings on the plague of hardness of heart; Pro. 1:24-27; Acts 28:23-27; Jn. 8:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, ... (London, 1647), pp. 332-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-8307f08a51" data-kw="">
<blockquote><p>Profession [of faith] looketh like Paradise and the rainbow; its big in its own eyes, and the fairest for variety of colors; but its a self-plague and doth carry millions of souls to hell without din and noise of feet; its Christ acting judicially on the hypocrite within pistol shot of a besieged soul, making fire-works under the earth; and when all within are sleeping, Christ springeth a powder-mine, and burneth up all forward: Gospel-fire-works maketh more than ordinary fury in the soul; open, open to Christ; multiplied fastings, and taking Christ’s crown from Him are dreadful.</p></blockquote>

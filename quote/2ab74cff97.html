<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see [Francis] Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If he were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest then that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been. … God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might.</p></blockquote>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: 1. Because to act voluntarily is the most noble and plainly absolute perfection of all perfections of which we have an idea, conceived with and under the ratio of the most perfect spontaneity [spontaneitas], whereby He acts spontaneously and according to His own good pleasure: for it is among all other perfections the highest, to be the most free lord of one’s own actions by a certain supreme αὐτεξουσία [self-determination], compelled by no external cause or brute necessity of nature to do anything. And accordingly that free will, or spontaneity, is pre-eminently comprehended in the idea of the supremely perfect being. … §9. According to this diversity of objects, the will of God is partly necessary, partly free. It is necessary because God, beholding Himself, takes delight in Himself in His sufficiency and absolute perfection: and it is called necessary because He has its object so intimately present to Himself in His nature that without this thought God cannot even be conceived. Free is the will of the decree, whereby He determines concerning possible things: and it is called free because it is occupied with things depending purely upon the judgment [arbitrium] of God. … §.13… 3. The will of God is also most free, inasmuch as it is determined by no cause outside God, and this on account of the independence of the divine essence. Nor does it stand in the way that we have a little before distinguished a certain necessary will from the free: since there we regard only the necessary existence of God, and that it effects that the will of God, inasmuch as it regards Himself, cannot be removed from the concept of the Deity. Otherwise, that very will of God by which He loves Himself is supremely free with the freedom of complacency and spontaneous approbation. Meanwhile it is inquired concerning the will of God tending toward creatures (which we have called free, because in them alone a possible existence can be conceived) whether God has willed and wills them with a freedom of indifference. We, if anyone by the indifference of God understands that the will of God in decreeing was not determined by the objects regarded in the decree, acknowledge that all things which are proposed to the decree as possible must in themselves be conceived as indifferent toward futurition, involving no necessity in their concept that they should be made, or compelling God to determine anything. If also by the indifference of the freedom of God anyone understands the sufficiency of God, whereby, being in need of nothing outside Himself, He did not need to seek the supply of any deficiency outside Himself, and therefore to deliberate concerning the production of creatures—in this respect also we acknowledge that God acted with a freedom of indifference. Which, however, is not to be extended so far as though, the will to manifest His glory being posited, His freedom was not determined by His own decency [decentia], which did not admit that He should will otherwise than what is consonant with His glory and virtues. But whether God was so indifferent to creation itself and the manifestation of His glory, considered antecedently to the decree, that He could decently also not create, or not will to manifest His glory, is a problem which is debated among learned men, worthy of further investigation. You may see here the celebrated Wittichius of blessed memory and the celebrated Roëllius disagreeing. 4. We also urge that the will or volition of the eternal God is eternal, because God is a pure act, by no means passing from not willing to willing—which itself also extends to the will of the decree: for unless it were eternal, a change would befall God, which is absurd; or at least a succession of thoughts and anterior and posterior acts, thoughts mutually following one another—which imperfections we have shown, under the heading on the eternity of God, must be removed from God. But if anyone objects that this opinion strips God of all indifference in willing, since the state of indifference must necessarily be conceived before the determination of things made by the decree: I reply: (a.) That indifference is still in question. (b.) Nor does the consequence proceed, since a priority of order suffices for the matter, and a priority of time is not precisely required. Indeed, the freedom of indifference suffices for us, insofar as it excludes determination by objects, or by a necessity of nature, or even by a demand of indigence—since the determination made must be conceived from the eternal good pleasure of God, willing to manifest His glory, and that in the most wise and prudent manner: without which decree we do not conceive that God existed even for a moment.</p></blockquote>

ated+Ro%C3%ABllius+disagreeing.+4.+We+also+urge+that+the+will+or+volition+of+the+eternal+God+is+eternal%2C+because+God+is+a+pure+act%2C+by+no+means+passing+from+not+willing+to+willing%E2%80%94which+itself+also+extends+to+the+will+of+the+decree%3A+for+unless+it+were+eternal%2C+a+change+would+befall+God%2C+which+is+absurd%3B+or+at+least+a+succession+of+thoughts+and+anterior+and+posterior+acts%2C+thoughts+mutually+following+one+another%E2%80%94which+imperfections+we+have+shown%2C+under+the+heading+on+the+eternity+of+God%2C+must+be+removed+from+God.+But+if+anyone+objects+that+this+opinion+strips+God+of+all+indifference+in+willing%2C+since+the+state+of+indifference+must+necessarily+be+conceived+before+the+determination+of+things+made+by+the+decree%3A+I+reply%3A+%28a.%29+That+indifference+is+still+in+question.+%28b.%29+Nor+does+the+consequence+proceed%2C+since+a+priority+of+order+suffices+for+the+matter%2C+and+a+priority+of+time+is+not+precisely+required.+Indeed%2C+the+freedom+of+indifference+suffices+for+us%2C+insofar+as+it+excludes+determination+by+objects%2C+or+by+a+necessity+of+nature%2C+or+even+by+a+demand+of+indigence%E2%80%94since+the+determination+made+must+be+conceived+from+the+eternal+good+pleasure+of+God%2C+willing+to+manifest+His+glory%2C+and+that+in+the+most+wise+and+prudent+manner%3A+without+which+decree+we+do+not+conceive+that+God+existed+even+for+a+moment.%E2%80%9D%0A%0A%E2%80%94+Salomon+Van+Til%2C+Compendium+of+Both+Theologies%2C+even+Natural+%26+Revealed%E2%80%A6+%281703%3B+1719%29%2C+1.+Nature+of+God%2C+subsection+4%2C+%E2%80%98On+the+Will+of+God%E2%80%99+tr.+AI+by+Roman+Prestarri+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9cf5183ee9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9cf5183ee9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/god#:~:text=3.%20That%20this%20will%20or%20volition,God%20existed%20even%20for%20a%20moment&amp;text=3.%20That%20this%2 <blockquote><p>22. And so we must conceive of God by all these following inadequate conceptions, confessing the impropriety, but having no better: I. The essence of God, who in Scripture is called in two words “An Infinite Spirit,” is necessarily conceived of by these three conceptions: 1. [Greek], 2. Vita [life], 3. Perfectio [perfection]. The two first being the substantial conceptus of a spirit, and the third that which answers to all perfective degrees, properties, and accidents in creatures, and comprehends a multitude of perfective attributes; which I express in the abstract, being loath much to use concretes or adjectives of God. Of these, as the first answers to matter in materials and to the genus and substantia abstracte sumpta in spirits, so the second to the form and difference, when yet in God there is no composition or matter. 22. II. And the formal conceptus ‘Vita’ must itself be conceived of in this threefold inadequate conception: 1. Potentia-Actus [power-act], 2. Intellectus [understanding], 3. Voluntas [will]. I call the first Potentia-Actus to avoid concretes, and to signify that as God has no potentia passiva [passive power], so his potentia activa [active power] is not an idle, ceasing power, but in perpetual perfect act; and that act is a most powerful act: so that neither potentia alone, nor actus alone, but both together, are our best conception of this first principle in the Deity. And I take it for granted that even in man’s soul, the potentia vitalis activa [vital active power], the intellect, and the will, are not, as Thomas thought, accidents, but the formal essence of the soul, as the Scotists and Nominalists better say. And I have largely elsewhere proved this, and therefore stand not here upon it. … 25. IV. The essential immanent acts of God are three: 1. Sibi vivere [to live to Himself], or to be essential active life in Himself; 2. Se intelligere [to understand Himself], to know Himself; 3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

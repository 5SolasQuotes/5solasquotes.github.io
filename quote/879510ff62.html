<blockquote><p>In God, however, it is otherwise. For it was shown above (Q. 4, A. 2) that whatever perfection exists in any creature, wholly pre-exists and is contained in God in an excelling manner. Now not only what is common to creatures—viz., being—belongs to their perfection, but also what makes them distinguished from each other; as living and understanding, and the like, whereby living beings are distinguished from the non-living, and the intelligent from the non-intelligent. Likewise every form whereby each thing is constituted in its own species, is a perfection; and thus all things pre-exist in God, not only as regards what is common to all, but also as regards what distinguishes one thing from another. And therefore as God contains all perfections in Himself, the essence of God is compared to all other essences of things, not as the common to the proper, as unity is to numbers, or as the center (of a circle) to the (radiating) lines; but as perfect acts to imperfect; as if I were to compare man to animal; or six, a perfect number, to the imperfect numbers contained under it. Now it is manifest that by a perfect act, imperfect acts can be known not only in general, but also by proper knowledge; thus, for example, whoever knows a man, knows an animal by proper knowledge; and whoever knows the number six, knows the number three also by proper knowledge. As therefore the essence of God contains in itself all the perfection contained in the essence of any other being, and far more, God can know in Himself all of them with proper knowledge. For the nature proper to each thing consists in some degree of participation in the divine perfection. Now God could not be said to know Himself perfectly unless He knew all the ways in which His own perfection can be shared by others. Neither could He know the very nature of being perfectly, unless He knew all modes of being. Hence it is manifest that God knows all things with proper knowledge, in their distinction from each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 14, art. 6, I answer that</cite></span></figcaption>

<blockquote><p>’The sun and the moon stood still in their habitation’ – they stood still in their several spheres wherein they move, for these be their habitations, and note that they both stood still, sun and moon. For the moon borrowing all her light of the sun, had she kept her course while the sun had stool still the length of a day, there had been great irregularity of motion in these celestial bodies, from the constant order set them by their Maker in their creation. Observe also, he does not say the earth stood still, but the sun: it had been, as some said, the earth and moon stood still as the sun and moon, and our understanding would have soon apprehended, if that new astronomy had been then revealed, which some of our empericks, and journeymen in that excellent science of astronomy have late revived in their almanacs, telling the world that they have long been in a wrong belief, that the sun moves and the earth is fixed, for they believe that the sun is fixed, and the earth is moved. And to evade the clear evidence of the text, which tells it for a wonder that the sun stood still, they say, this is spoken to our capacity, because to our sight it so seems, that the sun moves and the earth is fixed, but indeed it is otherwise. Our capacity I think has much wrong done in this, for if the Word of God had told us that God had created the sun to stand still, and the earth to move, it is more likely that we should have taken his word for it, and have believed it as it is, as well as we now believe it, as it appears. We are neither incapable nor incredulous, but that many against the letter of Scripture have written, and made more believe, that the sun stands still from the creation. The common defence of this opinion grounded on God’s application of himself, to human capacity, does make figures in a story where is no need, and makes David a man of small judgement in the knowledge of the sun, who says, that God ‘hath set a tabernacle for the sun in the heavens’ (called here) a habitation, ‘which is a bridegroom coming out of his chamber, and rejoiceth, as a strong man, to run his race.’ His going forth is from the end of the Heaven, and his circuit unto the ends of it. Does not this prophet speak of the glory of God, declared in the motion, not the station of the sun? or in the glory of God showed in our opinion of the sun’s motion, not in the truth thereof. Greater secrets then this are revealed in holy Scripture, which are against the vouchie of the outward sense, or the rational discourse of man, and no doubt, but if the sun had stood still, and the earth that we live upon had moved, when this miracle was by the spirit of truth recorded, it had been so set down to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-marbury.html">Edward Marbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary or Exposition upon the Prophecy of Habbakuk... (London, 1650), on Hab. 3:11</cite>, pp. 127-128</span></figcaption>

<blockquote><p>An act of the cognitive faculty is according as the thing known is in the knower; while an act of the appetite faculty is directed to things as they exist in themselves. But all that can have the nature of being and truth virtually exists in God, though it does not all exist in created things. Therefore God knows all truth; but does not will all good, except in so far as He wills Himself, in Whom all good virtually exists.</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin | See also Petrus Gassendus, Syntagma Philosophiae Epicuri, sect. 2, ch. 3, 4, Opera, tome 3, pp. 28-29, and Physics, bk. 3, sect. 1, ch. 5, Opera, tome 1, pp. 259-60, who on ibid. Physics, bk. 1, sect. 1, ch. 6</cite>, p. 163, truly writes:</span></figcaption>

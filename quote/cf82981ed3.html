<main class="wrap"><figure class="quote" id="q-cf82981ed3" data-kw="">
<blockquote><p>VII. II. An adjunct of the world is its goodness and perfection, by which the world is conformable to the divine will, and consists of all its parts. It is therefore perfect, not simply and absolutely, in which sense only God is good and perfect, Mk. 1018; but in a certain respect and in its own kind, because nothing is wanting in it which belongs to the world from the intention of the Creator. Gen. 1:31, “all things that God had made were very good.” Ps. 104:24 “how magnificent are your works, O Lord, you have made all things in wisdom: the earth is full of your possessions.” 1 Tim. 4:4, “Every creature of God is good.” cf. Ps. 8. And this is shown both by the order of the parts of the world, and by their varieties and integrity: which David praises in the whole of Ps. 104. Those things which seem viler and more imperfect are only such separately from the whole and comparatively, since they too were wisely and well made, and contribute to the perfection of the universe. To that which is wont to be asked: Whether God could have made the world more perfect; it must be said: The species of beings could indeed have been made accidentally more perfect, because their qualities and endowments can be increased, and they admit of more and less; yet they could not have been made essentially more perfect, their essences remaining safe and unchanged, because species are like numbers, to which if a unit is added or subtracted, the numbers are changed. If, therefore, God were to add an essential perfection to a certain species, that species would be changed, and would not remain such a species. Meanwhile, God could have produced other species, more perfect than those which He actually produced; since the power of God is infinite, and not exhausted by the production of the creatures actually existing in the world. It can also be said that God can make something better, not adverbially, because He made all things in the best way, but adjectivally, because He can make good things better and increase their accidental goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), ch. 2, On Creation</cite>, p. 20 trans. AI Latin</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1fa55170b9" data-kw="">
<blockquote><p>Conservation, as it is here understood, is defined as the action by which a being from-another remains in the existence it has received. It is double, namely: a) Negative, or the action by which what can destroy the existence of the thing is removed or impeded. Penicillin, for example, which destroys bacteria, conserves the health of the body; b) Positive is the act that consists in the positive inflow by which a thing is continually given existence. Hence it is a sort of continued creation. Conclusion 24: All created things are positively conserved in existence by God. Whatever does not have in itself a reason for its existence positively requires, if it remains in existence, a cause of its remaining in existence. But there cannot be an infinite regress in conserving causes, because such causes need to exist simultaneously; therefore the thing is conserved positively by God as first cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-f53017dc80" data-kw="">
<blockquote><p>Although Christ is to be adored wherever He is present, it does not follow that everything in which He is present is to be adored. Christ dwells in all believers and yet believers are not to be adored with Christ… We are not bound to adore God with an external adoration wherever He is present; but only where He is present with rays of his glorious majesty and where He wishes to be adored. Otherwise as God is in all creatures (in stones, in trees and in animals), He would have to be adored in them. Thus we are commanded to adore God in the heavens, where He manifests Himself gloriously. The Israelites were bound to adore Him at the ark, which was teh symbol of his presence…. The essential and internal glory of God (which consists in the eminence of his perfections) differs from the accidental and external glory (which is placed in some sensible, miraculous and extraordinary effect; as was seen in the bush, the ark and other like symbols of God’s presence). Although the internal and essential glory is the foundation of external adoration, still it does not bind to the exercise of actual adoration unless it is connected with the external glory (i.e., with some miraculous and extraordinary effect which makes an impression on the senses). Otherwise, as God is everywhere with his essential glory and in all his creatures, He would have to be adored there (which is absurd). … The distinctions between the absolute, ultimate, intransitive, direct and formal worship (which is exhibited to Christ in the Eucharist); and the transitive, indirect, relative, and concomitant worship (given to the species of the Eucharist), cannot remove the crime of idolatry. (1) They are unknown to the Scriptures, which recognize no religious worship excepting one alone, which is absolute and direct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite>, 3:545-46</span></figcaption>

</figure><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1</span></figcaption>

<blockquote><p>For he that believes the whole architecture of this world was framed by the handiwork of God in the space of six days, he is indeed led by a right faith, as all truths are to be believed with a most sure faith, whatsoever are mentioned in the books of the Scripture…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Free Justification by Christ… (d. 1587; London: Parkhurst, 1694), bk. 2, On what condition properly does the Promise of Justification rely</cite>, p. 293</span></figcaption>

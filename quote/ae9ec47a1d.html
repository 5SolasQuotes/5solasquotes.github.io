<main class="wrap"><figure class="quote" id="q-ae9ec47a1d" data-kw="">
<blockquote><p>The law of Mahomet claimed to be a revelation from Heaven, and though, in accordance with its pretensions, it demanded faith, yet, as it presented no rational grounds of conviction, its policy was to intimidate or bribe the understanding, according as fear, prejudice, or lust was the predominant principle of action.

Where it could not extort a blind credulity, it made the passions the vehicles of its doctrines—the timid it frightened to submission, the profligate it allured to acquiescence, and the heretic and skeptic it wheedled and cajoled by a partial patronage of their errors. Exclusively a system of authority, it gave no scope to discussion. Its great argument was the word of its Prophet, its decisive sanction the sword of its soldiers, and its strongest attractions, the licence it gave to voluptuous indulgences. Paganism wore the “face of error, and Mohammedanism of imposture.” [Lord Bacon]

Christianity, on the contrary, attaches preeminent importance to truth, and acknowledges no faith but that which is founded in conviction. At the same time it professes to be from God, and therefore, as becomes it, speaks with authority. As a system claiming to be Divine, it invites the fullest discussion. As a system proved to be Divine, it demands implicit submission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Office of Reason in Regard to Revelation in Southern Presbyterian Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

<blockquote><p>It is reported, as some write, that up to a hundred thousand men and women of both sexes migrated to the Turks in those times. Moreover, it is handed down to memory that the Turkish Emperor was accustomed to say that he marveled at the stupidity of Christian kings, in that they preferred to expel such a great multitude—whom, if they did not wish to kill, they could nevertheless have retained in the place of slaves to perform useful and suitable services—rather than retain them for their own profit, according to the Horatian precept: When you can sell a captive, do not kill him; he will serve usefully.</p></blockquote>

<blockquote><p>On occasion of this question it is asked whether those who come to the Faith from the Jews are to be received quickly or not, and similarly it can be asked concerning pagans. And it seems that not: a. from the fact that it is said in dist. 4, On Consecration, Jews, where it is said that for eight months they should enter within the catechumens of the church this threshold, and, if they are known to come with pure faith, only then should they merit the grace of baptism; the same is found there, Lest, which God forbid, where it is said that abstinence for forty days is enjoined. In both places therefore a great space of time is given for probation and for the work of penance to be carried out. But the contrary seems true:

1. From the fact that it is said, Acts 2:38, where Peter speaks to the Jews, saying: ‘Repent, and let each one of you be baptized.’ Since therefore they were baptized quickly, by his example it does not seem that reception into the Faith, or the sacrament of Faith, which is Baptism, should be deferred so long.

2. Likewise it is found, Acts 10:47-48, where it is said by Peter: ‘Can anyone forbid water, so that those who have received the Holy Spirit should not be baptized? And he commanded them to be baptized in the name of Jesus Christ.’ Acts 8:36-38. From these things therefore it seems that so great a delay is not fitting. [Solution]: To which it must be said that things were otherwise in the primitive Church in part and otherwise in the progress of the Church. For in the primitive Church there was the gift of the Holy Spirit, which was also shown in a visible sign in believers; there were also other signs manifesting faith in them; on account of which it was not necessary to defer the sacrament of Faith. But in the progress of the Church, where there were no such signs showing or powerfully proving faith, and hypocrisy of heart was hidden or could be hidden, a delay of time was necessary, so that there might be a testing of faith and catechesis, through which there would be enabling for baptism. And therefore according to the different times a different term was appointed according to earlier and later, so that it might be clear concerning the enabling for faith and that the ease of returning to vomit might be removed in the judgment of a discerning prelate, according as more or less it shall seem expedient. But such a term is left to the judgment of a discerning prelate, according as more or less it shall seem expedient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology</cite>, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 5, ‘Whether those coming to the Faith are to be Quickly Received?’</span></figcaption>

elievers%3B+there+were+also+other+signs+manifesting+faith+in+them%3B+on+account+of+which+it+was+not+necessary+to+defer+the+sacrament+of+Faith.+But+in+the+progress+of+the+Church%2C+where+there+were+no+such+signs+showing+or+powerfully+proving+faith%2C+and+hypocrisy+of+heart+was+hidden+or+could+be+hidden%2C+a+delay+of+time+was+necessary%2C+so+that+there+might+be+a+testing+of+faith+and+catechesis%2C+through+which+there+would+be+enabling+for+baptism.+And+therefore+according+to+the+different+times+a+different+term+was+appointed+according+to+earlier+and+later%2C+so+that+it+might+be+clear+concerning+the+enabling+for+faith+and+that+the+ease+of+returning+to+vomit+might+be+removed+in+the+judgment+of+a+discerning+prelate%2C+according+as+more+or+less+it+shall+seem+expedient.+But+such+a+term+is+left+to+the+judgment+of+a+discerning+prelate%2C+according+as+more+or+less+it+shall+seem+expedient.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+1+%7C+ch.+5%2C+%E2%80%98Whether+those+coming+to+the+Faith+are+to+be+Quickly+Received%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb846f7892.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db846f7892.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=On%20occasion%20of%20this%20question%20it,or%20less%20it%20shall%20seem%20expedient&amp;text=On%20occasion%20of%20this%20question%20it%20is%20asked&amp;text=as%20more%20or%20less%20it%20shall%20seem%20expedient" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the religion of the Mahumetans I find much good, viz. a confession of one only God, and most of the natural parts of religion; a vehement opposition to all idolatry; a testimony to the veracity of Moses, and of Christ; that Christ is the Word of God, and a great prophet, and the writings of the apostles true: All this therefore where Christianity is approved, must be embraced. And there is no doubt but God has made use of Mahumet as a great scourge to the idolaters of the world; as well as to the Christians who had abused their sacred privileges and blessings: Wherever his religion does prevail, he casts down images, and fills men’s minds with a hatred of idols, and all conceit of multitude of Gods, and brings men to worship one God alone, and does that by the sword in this, which the preaching of the Gospel had not done in many obstinate nations of idolaters.</p></blockquote>

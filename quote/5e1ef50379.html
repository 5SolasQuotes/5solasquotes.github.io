<blockquote><p>…if I drew not up a fair contract of marriage betwixt you and Christ, if I went not with offers betwixt the bridegroom and you, and your conscience did bear you witness, your mouths confessed that there were many fair trysts and meetings drawn on betwixt Christ and you at communion-feasts and other occasions; there were bracelets, jewels, rings, and love-letters sent to you by the Bridegroom, it was told you what a fair dowry you should have and what a house your husband and ye should dwell in, and what was the bridegroom’s excellency, sweetness, might, power. The eternity, and glory of his Kingdom, the exceeding deepness of his love, who sought his black wife through pain, fires, shame, death and the grave; and swimmed the salt sea for her, undergoing the curse of the law, and then was made a curse for you, and you then consented and said, ‘Even so I take Him’.</p></blockquote>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood: Or a Comparison between the Truth now taught in England &amp; the Doctrine of the Romish Church</cite>, … (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-1d8c041065" data-kw="">
<blockquote><p>Some have upon these words made a question whether it be lawful for the husband or the wife separated for adultery to marry again while each other lives. As to the party offending, it may be a question; but as to the innocent person offended, it is no question, for the adultery of the person offending has dissolved the knot of marriage by the Divine law. It is true that the knot cannot be dissolved without the freedom of both persons each from another, but yet it seemeth against reason that both persons should have the like liberty to a second marriage. For:

1. The adulteress is by God’s law a dead woman, and so in no capacity to a second marriage.

2. It is unreasonable that she should make an advantage of her own sin and error.

3. This might be the occasion of adultery, to give a wicked person a legal liberty to satisfy an extravagant lust. But for the innocent person, it is as unreasonable that he or she should be punished for the sin of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on Matthew</cite>, ch. 19, v. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<main class="wrap"><figure class="quote" id="q-d9e7f736c8" data-kw="">
<blockquote><p>Thirdly, consider the solemn Obligation that lies upon us, by a National Covenant, (famous through the Christian world, and we infamous for the breach of it,) to promote, and procure with our utmost endeavours the Reformation of the Land. God hath, I believe, most of your hands to shew for this, and darest thou who hast bound thy self in such a Covenant, give thy voice for an unworthy man to sit in Parliament, whom thy conscience, (if thou wouldst have patience to hear it,) will tell thee, he will never be the man that will help on that work with any Vote of his, yea, that is an enemy to it, and fears it more then desires it? if thou hast got the mastery of thy conscience, so far as to do this bold act, let me tell thee what thou doest; thou comest this day to declare in the face of all the Country, yea, before God, men, and Angels, that thou art a forsworne wretch; and if thou gettest this brand upon thy forehead once, go where thou wilt, thou dragest a chain after thee, that will bind thee over to the fearful expectation of God’s wrath; that (come it sooner or later) will take hold on thee.

And now tell me, hadst thou not better have been asleep in thy bed, yea, sick in thy bed, yea, dead in thy grave, then to have come hither to do so unhappy a days work? Oh, think when thou goest this day to give thy suffrage for any that thou didst see the Covenant with thy hand at it spread before thee; durst thou then venture, to blot out what there thou hast wrote, by a wicked and unworthy choice? Suppose one should put himself under an oath of friendship, to promote the good and welfare of another, to his utmost power, (as Jonathan to David) and this his friend, to whom he is thus engaged, falling sick, should trust him to bring a Physician to him, and he should fetch a murderer to poison him, or an Empiric which by his ignorance should kill him (which comes to all one) Oh, how would his oath rot upon his conscience?

This thou doest, only with this aggravation, thou doest it to a Nation, he to a private person; before therefore thou subscribest, spend one thought more upon the matter. Consider, thou standest at the greatest advantage of paying thy vows, and performing thy Covenant this day, that thou mayest in all thy life; possible, before the three years for a Parliament come about, thou mayest be summoned into another world, to give an account, how thou bestowedst thy voice now; or if alive, thou mayest be reserved to see a poor Nation helped to its ruin by thy hand and such as thou art.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Magistrate’s Pourtraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County</cite>, (London: Ralph Smith, 1656), pp 26-27.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-379021b5c3" data-kw="">
<blockquote><p>The Gibbites in 1681, and Russelites in 1682, and for some years, did maintain the same unhappy principles and practices [as the later M’Millianites after 1689]; and stated their testimonies against paying of excise and customs, and other fool things, not only for themselves, but separation from all that durst not go their lengths, even when imprisoned together going as far from us as the walls of the prison would allow them, and stopping their ears when we went about publick worship three times a day, which was our ordinary in each room… It is a piece of demented infatuation to make little or no difference betwixt that period [before 1689] and this [period after 1689 during toleration], and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>

<blockquote><p>Man’s natural liberty is this: privilege of having and doing those things only to which the individual has a moral right. Consequently, the natural liberty of two men in the same commonwealth may be different, because under Providence, their natural endowments and relations may differ. Were it possible to frame a government thoroughly equitable, each person’s civic liberty would be identical with his natural: the privilege of having and doing all those things, and those only, to which each has a moral right.</p></blockquote>

</figure><figure class="quote" id="q-dfe292c970" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book… I find not myself in my understanding convinced thereby of the necessity of lawfulness of conforming unto or complying with an unjust prevailing power, further than I was before persuaded it might be lawful or necessary so to do: viz. paying taxes and submitting to some other things (in themselves not unlawful) by them imposed or required, such as I had a lawful liberty to have done in the same manner, though they had not been so command; and seem to me in the conjuncture of present circumstances prudentially necessary to preserve myself or my neighbor from the injuries of those that would be willing to make use of my non-submission to mine or his ruin. So as it be done with these cautions:

1. Without any violation either of duty to God, or of any other just obligation that lies upon me by oath, law, or otherwise.

2. Only in the case of necessity otherwise not to be avoided.

3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek:] dunamis (to the force), but not acknowledge the [Greek:] exousia (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right title, or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide presume, that the oppressed power, to whom my obedience is justly due, if he perfectly knew the present condition I am in, together with the exigence and necessity of the present case, and of all the circumstances thereof, would give his willing consent to such conformity or compliance. So that upon the whole matter and in short, I conceive I may so far submit to the impositions or comply with the persons of a prevailing usurped power, unjustly commanding things in themselves not unlawful, or make use of that power to protect me from others’ injuries, as I may submit unto, comply with, or make use of an highway thief or robber, when I am fallen into his hands and lie at his mecy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Resolution of Conscience</cite>, (by a learned divine) in Answer to a letter sent with Mr. Ascham’s book, treating how far it may be lawful to submit to an usurped power… (London: 1649), pp. 1-3 GB</span></figcaption>

3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek:] dunamis (to the force), but not acknowledge the [Greek:] exousia (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right title, or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide presume, that the oppressed power, to whom my obedience is justly due, if he perfectly knew the present condition I am in, together with the exigence and necessity of the present case, and of all the circumstances thereof, would give his willing consent to such conformity or compliance. So that upon the whole matter and in short, I conceive I may so far submit to the impositions or comply with the persons of a prevailing usurped power, unjustly commanding things in themselves not unlawful, or make use of that power to protect me from others’ injuries, as I may submit unto, comply with, or make use of an highway thief or robber, when I am fallen into his hands and lie at his mecy.”

— Robert Sanderson, A Resolution of Conscience, (by a learned divine) in Answer to a letter sent with Mr. Ascham’s book, treating how far it may be lawful to submit to an usurped power… (London: 1649), pp. 1-3 GB">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUpon+perusal+of+Mr.+Ascham%E2%80%99s+book%E2%80%A6+I+find+not+myself+in+my+understanding+convinced+thereby+of+the+necessity+of+lawfulness+of+conforming+unto+or+complying+with+an+unjust+prevailing+power%2C+further+than+I+was+before+persuaded+it+might+be+lawful+or+necessary+so+to+do%3A+viz.+paying+taxes+and+submitting+to+some+other+things+%28in+themselves+not+unlawful%29+by+them+imposed+or+required%2C+such+as+I+had+a+lawful+liberty+to+have+done+in+the+same+manner%2C+though+they+had+not+been+so+command%3B+and+seem+to+me+in+the+conjuncture+of+present+circumstances+prudentially+necessary+to+preserve+myself+or+my+neighbor+from+the+injuries+of+those+that+would+be+willing+to+make+use+of+my+non-submission+to+mine+or+his+ruin.+So+as+it+be+done+with+these+cautions%3A+1.+Without+any+violation+either+of+duty+to+God%2C+or+of+any+other+just+obligation+that+lies+upon+me+by+oath%2C+law%2C+or+otherwise.+2.+Only+in+the+case+of+necessity+otherwise+not+to+be+avoided.+3.+Without+any+explicit+or+implicit+acknowledgment+of+the+justice+and+legality+of+their+power%3A+I+may+submit+to+the+%5BGreek%3A%5D+dunamis+%28to+the+force%29%2C+but+not+acknowledge+the+%5BGreek%3A%5D+exousia+%28the+authority%29%2C+or+by+any+%5Bof%5D+my+voluntary+act+give+strength%2C+assistance+or+countenance+thereunto.+4.+Without+any+prejudice+unto+the+claim+of+the+oppressed+party+that+has+a+right+title%2C+or+casting+myself+into+an+incapacity+of+lending+him+my+due+and+bounden+assistance%2C+if+in+time+to+come+it+may+be+useful+to+him+towards+the+recovery+of+his+right.+5.+Where+I+may+reasonably+and+bona+fide+presume%2C+that+the+oppressed+power%2C+to+whom+my+obedience+is+justly+due%2C+if+he+perfectly+knew+the+present+condition+I+am+in%2C+toge

<blockquote><p>It cannot be denied but that there were in Christ during the state of his humiliation, those acts of the will that the Schools call efficaces and inefficaces; such acts of holy love that were complete and perfect in themselves and in the issue and accomplishment, and such other acts of holy love that were imperfect in themselves and also ineffectual in the event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-creed.html">William Creed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>paragraphs 61-73</cite>, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660), p. 236</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are: 1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.] 2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.] 3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.] 4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.] 5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.] 361. I tell you their sense that I may the better open the plain truth to you, which is as follows: 1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man. 2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it. 3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology</cite>, ... (London: White, 1675) | pt. 1, sect. 14, Of Several Distinctions of God’s Will, pp. 56-57</span></figcaption>

<blockquote><p>They ought not to have despaired, for whom the Lord, hanging on the cross, deigned to pray. He saw some of His own among many strangers. He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ All of which seems to be referred to some of His own, not to the many strangers. 17. Nevertheless, I judge, according to the mind of St. Augustine it is to be carried to each man of the whole collection in which Christ the Lord saw some of his own among many strangers, so that the salvation of certain ones was especially and efficaciously intended, and this was the principal motive on account of which the prayer and redemption were extended to the whole collection, in which many strangers were mixed in. For thus are received universally and without restriction those sentences: ‘He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ [Ruiz continues to section 26 with further, similar quotes from Augustine and the fathers on the subject.]</p></blockquote>

<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

<blockquote><p>38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’ 39. Therefore there is no cause properly so called to be given of God’s will. 40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself. 41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another. 42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature. 43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed. 44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’ 45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-feb4f173a4" data-kw="">
<blockquote><p>But that which abides always is certainly not changed, therefore if it suffers no change it is eternal. And so the Holy Spirit is eternal, but the creature is liable to fault, and therefore subject to change. But that which is subject to change cannot be eternal, and there cannot therefore be anything in common between the Spirit and the creature, because the Spirit is eternal, but every creature is temporal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit</cite>, (381), 3.11.80 in Nicene and Post-Nicene Fathers 2, 10: 106.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 2.3</span></figcaption>

</figure><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VIII</span></figcaption>

</figure><figure class="quote" id="q-fda756477c" data-kw="">
<blockquote><p>For what reason does God send the Spirit of his Son into our hearts after we have become children of God? He does this in order to reveal to our hearts that we are indeed his children, in order to confirm and make us certain of that fact, in order to bear witness to it, in order to expel every doubt and uncertainty and in order to seal us in our sonship and inheritance. For this reason Scripture calls the Holy Spirit the first fruits of our inheritance. Note that the invocation of God the Father that comes from the heart is the expression of a mind that the Holy Spirit has made sure and certain of the fact that the Father has been placated by Christ the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 138.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>
<div class="actions"><button class="copy" data-copy="“For what reason does God send the Spirit of his Son into our hearts after we have become children of God? He does this in order to reveal to our hearts that we are indeed his children, in order to confirm and make us certain of that fact, in order to bear witness to it, in order to expel every doubt and uncertainty and in order to seal us in our sonship and inheritance. For this reason Scripture calls the Holy Spirit the first fruits of our inheritance. Note that the invocation of God the Father that comes from the heart is the expression of a mind that the Holy Spirit has made sure and certain of the fact that the Father has been placated by Christ the Son.”

</figure><figure class="quote" id="q-3276ad4d8b" data-kw="another Comforter">
<blockquote><p>Christ clearly teaches that the Spirit is a person distinct from the Father and the Son, besides the formula of baptism, by saying: &quot;The Father will give you another Comforter&quot; (John 14:16). Therefore, we condemn the Macedonians who deny the divinity of the Spirit.</p></blockquote>

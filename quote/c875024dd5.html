<main class="wrap"><figure class="quote" id="q-c875024dd5" data-kw="">
<blockquote><p>There was an interesting range of opinion among our Reformed divines as to whether or not the covenant of works was republished under Moses and, if so, what form this republication took. The Scots-born Huguenot theologian, John Cameron, whose arguments were reprinted by the Westminster divine Samuel Bolton, argued that what scripture calls the old covenant was actually a distinct covenant, which was subservient to the one covenant of grace:

7 Thesis.

We say therefore there is a Covenant of Nature, another Covenant of Grace, and another Subservient to the Covenant of Grace; (which is called in Scripture, the Old Covenant) and therefore we will deal with that in the last place; giving the first place to the Covenant of Nature, and of Grace; because they are the chief, and because they have no respect to any other Covenant, although we do not deny the Covenant of Nature, in this corruption of our nature, to be subservient to the Covenant of Grace, as it doth inflame the minds of men with the desire of it: which thing yet it doth by accident …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedomor a Treatise Wherein the Rights of the Law are Vindicated, the Liberties of Grace Maintained, and the Several late opinions against the Law are Examined and Confuted. Whereunto is Annexed a Discourse of the Learned John Cameron’s, Touching the Threefold Covenant of God with Man (London: Philemon Stephens, 1656), p. 356.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-688db4ad07" data-kw="">
<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>

<blockquote><p>III. God tells us, that sinners will their death, ‘Why will ye die,’ saith God, — The way which sinners take is the way of death, and it is their voluntary choice, they are not force’t to it by God, and neither are they drag’d to by the Devil — but it is their free will &amp; act— Adam acted voluntarily in what he did — IV. God expressly tells us in our text and context, that He has no pleasure in the death of a sinner, but yt [that] he turn and live — God wills the life and eternal salvation of poor sinners turn ye turn ye for why will ye die — God is sincere, hearty, and earnest in his will, it is plainly to be seen and understood by word, which is his revealed will to the children,— in particular his amazing will to save sinners is to be discovered in his sending his dearly beloved and only begotten Son into this world in amazing manner as He did.</p></blockquote>

</figure><figure class="quote" id="q-bc5b6209af" data-kw="">
<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>

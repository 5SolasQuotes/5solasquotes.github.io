<main class="wrap"><figure class="quote" id="q-b6d80b7d0a" data-kw="">
<blockquote><p>Let Peter have the pre-eminence, still there is a great difference between the honour of rank and the possession of power. We see that the Apostles usually left it to Peter to address the meeting, and in some measure take precedence in relating, exhorting, admonishing, but we no where read any thing at all of power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/primacy-of-peter.html">Primacy of Peter</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41deb671e7" data-kw="">
<blockquote><p>Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful. How then shall I acquiesce in their sentence? How can my conscience certainly determine, so as to leave no room for my faith to waver, that whatever they may pronounce is true? This is surely to leave no difference between God and men. For I believe what God says to be true, because he says it, and seek no other reason; but when I hear scripture saying that “all men are liars,” I dare not ascribe so much to man, lest I make him equal to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-9b3ca4374e" data-kw="">
<blockquote><p>The apostles were all equal among themselves; no one had either office or office-power above others. So were all the ordinary bishops and presbyters mentioned in the Scripture, as shall be proved afterward. No intimation is given of any pre-eminence or superiority amongst them of one over others.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The apostles were all equal among themselves; no one had either office or office-power above others. So were all the ordinary bishops and presbyters mentioned in the Scripture, as shall be proved afterward. No intimation is given of any pre-eminence or superiority amongst them of one over others.”

</figure><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/the-pope-as-antichrist.html">The pope as Antichrist</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;”

— Martin Luther, Commentary on Galatians, p. 214">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Apostle%27s+attack+upon+the+false+apostles+was+not+unjustified.+Neither+are+our+attacks+upon+the+papacy.+When+we+call+the+Pope+the+Antichrist+and+his+minions+an+evil+brood%2C+we+do+not+slander+them.+We+merely+judge+them+by+the+touchstone+of+God%27s+Word+recorded+in+the+first+chapter+of+this+Epistle%3A+%22Though+we%2C+or+an+angel+from+heaven%2C+preach+any+other+gospel+unto+you+than+that+which+we+have+preached+unto+you%2C+let+him+be+accursed.%22%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+p.+214&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75fb9ddff4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75fb9ddff4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-8e7f2dc0ca" data-kw="temporal power">
<blockquote><p>Only one thing may be gathered—that princes as to spiritual matters are subjected to the spiritual power; not in like manner that they lose their political authority over ministers in temporal matters. (b) No better “are Christians distinguished here from priests, so that these things are addressed to them as Christians and not as priests.” Things to be joined together are absurdly separated; for if a priest is a Christian he ought always to be subject (although in the exercise of his office and as to spiritual matters he is free). Also, if the mark of baptism and of gospel liberty in Christ does not release from obedience to the king, much less does clerical character. For the liberty of the church is stated concerning faith and the soul before temporal matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

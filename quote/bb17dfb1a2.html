<main class="wrap"><figure class="quote" id="q-bb17dfb1a2" data-kw="">
<blockquote><p>We shall with the same sincerity, reality and constancy, in our several vocations, endeavor, with out estates and lives, to preserve and defend the King’s Majesty’s person and authority, in the preservation and defense of the true religion and liberties of the kingdom; that the world may bear witness with our consciences of our loyalty, and that we have no thoughts or intentions to diminish his Majesty’s just power and greatness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab4d79663e" data-kw="">
<blockquote><p>For the Kirk ought to be no more severe than God declares Himself to be, who witnesses that in whatsoever hour a sinner unfeignedly repents, and turns from his wicked way, that he will not remember one of his iniquities: And therefore ought the Kirk diligently to advert that it excommunicate not those whom God absolves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-49c7f784b9" data-kw="">
<blockquote><p>This was the constant judgment of the old non-conformists, which I shall transcribe from a grave author. ‘Those,’ says he: ‘that for many years together, during the reign of the three last princes [Edward VI, James I, Charles I], denied to come up to a full conformity to this [Anglican] Church, had a low oinion of the discipline then exercised (of which they have left behind them large evidences), yet how tender were they of the Church’s honour to keep Christians in communion? How zealous were they against separation? as may appear in the labours of Mr. [Robert] Parker, Mr. [John] Paget, Mr. [John] Ball. Mr. [Thomas] Brightman laid us low enough, when he [in his Commentary on Revelation] did not only parallel us with luke-warm Laodicea, but made that Church the type, and we the antitype, by reason of our discipline; yet how zealous is he against separation from these assemblers, and breaks out in these words: ‘Therefore their error is wicked and blasphemous, who so forsake the Church, as if Christ were altogether banished thence.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bibliographies.html">Bibliographies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London Ministers | A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’</cite>, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-20c7b97333" data-kw="">
<blockquote><p>Here is no separation from the Church of Scotland, either in her doctrine, worship, discipline or government, but rather a cleaving more closely thereto, by departing or going forth from her backslidings and defections, as we are commanded by the Lord, etc.</p></blockquote>

</figure><figure class="quote" id="q-6fb58ae13f" data-kw="">
<blockquote><p>Beware of separating new lights; to separate from, or gather Churches out of the true reformed or reforming Churches, has not the least warrant from the Word of God: When we see this or that amiss in a Church we are bidden exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwingli conferred amicably with the Anabaptists in Zurich as with dissenting brethren; and no course was taken to suppress or restrain them by the secular power, till they grew to gather Churches out of the true reformed Churches: But when it came to that, they could not be suffered or forborne, it was thought necessary to restrain them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

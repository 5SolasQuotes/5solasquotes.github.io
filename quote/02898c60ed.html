<main class="wrap"><figure class="quote" id="q-02898c60ed" data-kw="">
<blockquote><p>…we have not now the miraculous presence of God, his appearing as at the bush. God has not given us under the Gospel those symbols of his standing presence and residency, as by the ark, and mercy-seat, and altar of old He gave unto his people.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7c1e66dfa" data-kw="">
<blockquote><p>The papists and Lutherans do not have anything to argue for their images, except what we recently rejected in §IX, namely, that God quite often appeared in the Old Testament under certain forms, even human ones. The reply is easy: He never appeared for the purpose that He might be portrayed; indeed, that is what, throughout Scripture, he has forbidden as strictly as possible…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology. trans. Todd Rester &amp; Michael Spangler (RHB) | section 11</cite>, vol. 1, bk. 2, ch. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-0314faa90f" data-kw="">
<blockquote><p>why does Moses in this place [Dt. 33:16] set Him in the bush? It is because God had there showed Himself unto Him… God considers how it is for our benefit to have some familiarity with Him: and thereupon He yields to our rudeness, and takes upon Him as it were a new shape, howbeit not which is contrary (as I said afore), but to the intent that we should not be scared, nor take occasion to shrink from Him. Now then, He allures us gently, and therewithal He stops to us and makes Himself as it were mean [lowly] unto us…. But we see how He showed Himself to the fathers of old-time under certain shapes. As for example when He talked with Jacob in Bethel, it was because Jacob needed such confirmation (Gen. 28:13)… …as if he should say, ‘…he appeared to me in the bush, and there I knew his majesty…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 196</cite>, pp. 1215-16</span></figcaption>

</figure><figure class="quote" id="q-8ba66c0ba7" data-kw="">
<blockquote><p>In the abolishing of the monuments of idolatry, they [Independents and congregationalists] agree so far with the Brownists [separatists], that they will not name the days of the week, the months of the year, the places of meeting after the ordinary manner; Yet they make no scruple to use the churches builded in the time of Popery, nor of bells [for calling to public worship, etc.], though invented by a Pope and baptized with all the Popish superstitions. How this does stand with their principles, I do not well know…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (1645), ch. 6</cite>, pp. 116-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7e2cad740b" data-kw="">
<blockquote><p>They whose part it is to set up magistrates, may restrain them also from outrageous deeds, or pull them down; but all magistrates are set up either by parliament, or by electors, or by other magistrates; They therefore who exalted them, may lawfully degrade and punish them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-par-us.html">David Paræus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>on Rom. 13</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

— David Paræus, on Rom. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+whose+part+it+is+to+set+up+magistrates%2C+may+restrain+them+also+from+outrageous+deeds%2C+or+pull+them+down%3B+but+all+magistrates+are+set+up+either+by+parliament%2C+or+by+electors%2C+or+by+other+magistrates%3B+They+therefore+who+exalted+them%2C+may+lawfully+degrade+and+punish+them.%E2%80%9D%0A%0A%E2%80%94+David+Par%C3%A6us%2C+on+Rom.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e2cad740b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e2cad740b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/resistance-to-tyrrany/quotes-on-resistance-to-tyranny/#:~:text=They%20whose%20part%20it%20is%20to,may%20lawfully%20degrade%20and%20punish%20them&amp;text=They%20whose%20part%20it%20is%20to%20set%20up&amp;text=exalted%20them%2C%20may%20lawfully%20degrade%20and%20punish%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-21b0057632" data-kw="">
<blockquote><p>Assertion 1 — There is an oath betwixt the king and his people, laying on by reciprocation of bands mutual civil obligation upon the king to the people and the people to the king; 2 Sam. 5:3, “So all the elders of Israel came to the king to Hebron, and king David made a covenant with them in Hebron before the Lord, and they anointed David king over Israel.” 1 Chron. 11:3, “And David made a covenant with them before the Lord, and they anointed David king over Israel, according to the word of the Lord by Samuel.” 2 Chron. 23:2-3, ” And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem. And all the congregation made a covenant with the king [Joash] in the house of God.” 2 Kings 11:17, “Jehoiada made a covenant between the Lord and the king and the people, that they should be the Lord’s people; between the king also and the people.” Eccl. 8:2, “I counsel thee to keep the king’s commandment, and that in regard of the oath of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, pp. 54-55</span></figcaption>

<blockquote><p>…though those names [given us, Anglican ministers, such as “priest,” “parson,” “vicar” and “curate,” etc.] were of themselves of an Antichristian [Romanist] original and use, yet if they be imposed upon any such as take no pleasure in them, we see not how they can any way pollute them and their offices more than Joseph and Daniel were polluted by heathenish and idolatrous names that were given them (Gen. 41:45; Dan. 1:7), or than private Christians are made the worse by the odious terms (1 Cor. 1:12–13) of Precisians, Puritans and Martinists, or than our [Separatist] brethren themselves are by the names of Brownists and Barrowists, which they so usually are called by and so much dislike.</p></blockquote>

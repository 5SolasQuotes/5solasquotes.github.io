<main class="wrap"><figure class="quote" id="q-8f11c9c572" data-kw="">
<blockquote><p>The Reformed assert that there absolutely is a covenant of works, because: (1) it is expressly mentioned in Hosea 6:7, וְהֵמָּה כְּאָדָם עָבְרוּ בְרִית שָׁם בָּגְדוּ בִי, “And they, like Adam, have transgressed the covenant; there they have dealt faithlessly with me” (cf. Job 31:33). There the best translators—the Vulgate, the Zurich Bible, Pagnino, Castellio, the Dutch translators, and others—render כאדם not appellatively, but properly, although, I confess, there are not lacking those who prefer to render it appellatively.

(2) The apostle in Galatians mentions two covenants (4:24), the first of which is from the works of the law (2:16), demanding the most exact obedience (3:10), by aid of which no one has ever achieved life (2:16; 3:11), under which we all were, until the covenant of faith (3:23), and are, as long as we exist as children of the flesh (3:22, 29), a covenant which only produces slavery (3:24 with Heb. 2:14–15). And this is the very covenant that we call the covenant of works; the latter covenant is from the faith of the gospel. If you should say that the apostle is not speaking about the covenant in paradise, but about the covenant at Sinai, it may easily be responded that the apostle is speaking about the covenant in paradise insofar as it has been repeated and renewed at Sinai with Israel in the Decalogue, which had the content of the covenant of works.

(3) Synonyms for the covenant of works are evident in the New Testament (Rom. 3:27 and Gal. 2:16). Moreover, what is the “law of works” if not the covenant of works? What is “law” simply speaking, insofar as it is opposed to grace? (Rom. 8:3) What, I say, if not a legal covenant? For we are said to be not under law, but under grace (Rom. 6:14–15; 4:16), and what is this, if not that we are not under a legal covenant? At the least these are to us entirely synonymous.

(4) We have already demonstrated in the exegetical part that all the essentials of the covenant of works are contained in its first promulgation (Gen. 2:17).

(5) We can hardly secure very many heads of the Christian religion sufficiently—such as the propagation of original corruption, the satisfaction of Christ, and his subjection to the divine law (Rom. 8:3–4; Gal. 3:13; 4:4–5)—when the covenant of works is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man</cite>, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.12.23 (emphasis added).</span></figcaption>

<blockquote><p>If Adam by his great sin condemned all the human race in common, can an infant be born otherwise than condemned? And through whom except Christ is he freed from this condemnation? And if even in Lazarus he says that mortality, cast out from eternity, loved the world of the dead, who of mortals is not touched by this fault and mischance by which the first man fell from everlasting life, which he would have received if he had not sinned? If the Devil made mortal all who could have been immortal, why do even infants die if they are not subject to the sin of the first man? And even infants be saved from the power of death except through Him in whom all shall be made to live?</p></blockquote>

<blockquote><p>God graciously entered into a covenant with holy Adam, and with his posterity in him, to the effect, that if he obeyed the command not to eat of the forbidden fruit, he should receive as his reward indefectibility of holiness and blessedness.

This is proved by Gen. 2:17, “In the day thou eatest thereof thou shalt surely die;” which implies the converse, “If thou dost not eat thereof, thou shalt surely live.” The “life” here implied and promised is a good additional to what Adam already had; otherwise it would not be a reward.

Adam already had spiritual life, namely holiness and happiness; but it was mutable. The additional good, therefore, must have been immutable holiness and happiness. He was to have had spiritual life as indefectible. He was to have passed beyond all possibility of apostasy and misery.

The merit to be acquired under the covenant of works was pactional. Adam could claim the reward, in case he stood, only by virtue of the promise of God; not by virtue of the original relation of a creature to the creator. Upon the latter basis, he could claim nothing, as Christ teaches in Luke 17:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 2: 152-53.</span></figcaption>

<blockquote><p>Had we been only adopted in Adam, we should have had no inheritance but that terrestrial paradise which was granted to him, that he might lead an agreeable and delicious life on earth. Had we been adopted in Moses, we could have aspired to no better inheritance than the land of Canaan, which he promised to those who kept his law, but being adopted in Christ, to be his joint heirs and his brethren, we must have an inheritance the very same as that which this well beloved Son himself possesses; the high heaven to which he has gone to live and reign in immortal glory, in the midst of angels.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8e451e317f" data-kw="">
<blockquote><p>…We are to be distinguished from the common people and others by doctrine, not by garment–by conversation, not by habit [in clothing, etc.]–by the purity of mind, not by attire; for if we study to innovation, we tread under foot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not to lead the minds of the faithful into such things, for they are rather to be instructed than played withal; neither are we to blind and beguile their eyes, but to infuse instructions into their minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (Naphtali Press, 1993) | Part 2, Ch. 9, p. 122-23 | “Other of the ceremonies that are not evil in their own nature, yet were devised for evil; for example, the surplice. The replier (David Calderwood [sometimes attributed to William Ames], A Reply to Dr. Morton’s Particular Defense, ch. 1, sect. 3) to Dr. Morton’s Particular Defense observes, that this superstition about apparel in divine worship began first among the French bishops, whom Caelestinus [Pope Celestine I, d. 432] writes thus: —</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b75d1598ae" data-kw="">
<blockquote><p>To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Redemption, ch. 19, fol. 447, as quoted in John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’</cite>, pp. 177-79</span></figcaption>

</figure><figure class="quote" id="q-d2cc4b9b6c" data-kw="">
<blockquote><p>Thirdly, all pride and vanity of garments are to be shunned and all those ornaments which do rather beseem the profane theaters of the gentiles than the sacred temples of Christians and which rather tend to delight the flesh than to edify the spirit: but all things must be done in the churches with most high reverence and modesty, as in the very sight of God and his angels. And albeit concerning the fashion of garments which ministers ought publicly to wear, either in their ministery or out of it, we do not think it a matter to be so stood upon that for it the peace of the church ought to be troubled; yet where they come nearest to the simplicity of the apostles, there we judge the church rather to be approved.</p></blockquote>

</figure><figure class="quote" id="q-12ad2ed2ac" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply… ([Basel: Guarinus, 1577]), pt. 2, ch. 8</cite>, pp. 262-63</span></figcaption>

</figure><figure class="quote" id="q-7ae450d63b" data-kw="">
<blockquote><p>Liturgical vestments that distinguished the priest from the community are attested only from the fourth century onward. There are no guidelines or regulations given in the New Testament. Moreover, the early Christian communities did not place themselves in the tradition of the Old Testament priesthood and its cultic dress… As the customary everyday dress changed, the clergy held on to the old style of dress… This older form of dress… served to distinguish the clergy from the other members of the community. In Rome as early as the sixth century it seems that there existed blessings for liturgical vestments. From the ninth century onward prayers were said as the vestments were put on… Liturgical vestments were given ever new allegorical interpretations reflecting salvation history (Rabanus Maurus [780-856] and Amalar of Metz [775-850])… …In the adiaphorist [indifferent] controversy Zwingli, Calvin, the Anabaptists, and Matthias Flacius Illyricus [a Lutheran] and his followers among other things called for doing away with liturgical vestments. As early as the first Zurich Disputation of 1523 Zwingli rejected liturgical vestments; he allowed for them in his work De canone missae epicheiresis, which appeared that same year; finally, toward the end of the year, presumably under external pressure, he adopted a stance against vestments. In the Zurich regulations of 1535 he disapproved of external adornments such as silk, gold and silver in the churches on the grounds that the early church not only did not possess these things, but even rejected them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/excerpts.html">Excerpts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oxford Encyclopedia of the Reformation (1996) | ‘Clerical Vestments’ vol. 1</cite>, pp. 366-68</span></figcaption>

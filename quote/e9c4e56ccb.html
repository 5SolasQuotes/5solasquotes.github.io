<blockquote><p>He [Christ] it is Who is without mother according to His Godhead, for He was begotten of God the Father, of one substance with the Father; without a father according to His Incarnation, for He was born of a Virgin; having neither beginning nor end, for He is the beginning and end of all things, the first and the last.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f8578f96f6" data-kw="">
<blockquote><p>Again; this Son of God is Jesus: “Jesus the Son of God.” Jesus is the name of a man: “She shall bring forth a son, and thou shalt call his name Jesus,” Matt. i. 21. And this our high priest also was to be. “Every high priest,” saith our apostle, “is ordained to offer gifts and sacrifices unto God.” And “therefore of necessity’’ he who would be our high priest “must have somewhat to offer,” and that somewhat of his own.

And what had the Son of God, absolutely considered, of his own to offer? His divine nature or person is not to be offered. All things necessarily required in the matter and form of an offering are eternally incompatible with the infinite excellencies of the divine nature. God cannot be a sacrifice, though he who is God was so to be.

Shall he, then, take an offering out of the works of the creation? Shall he take the blood of bulls and goats for this purpose, as did Aaron? The offering, indeed, of these things might represent the sacrifice that should take away sin, but take away sin itself it could not do. For what wisdom, righteousness, or equity, is in this, that whereas man had sinned, other brute creatures, that were none of his own (for whatever right he had to any creatures of God, belonging to his original dominion over them, after his sin he had none at all), should be accepted a sacrifice in his stead?

Besides, what proportion did the blood of bulls and goats bear to the justice of God, that satisfaction for sin should be made unto it thereby? Should, then, the Son of God have taken and appointed any one man to be a sacrifice for himself and others? Every man being a sinner, the sacrifice of any one would have been a provocation unto God. In the typical sacrifices, he would not admit of a lamb or a kid that had the least blemish in it to be offered unto him. And shall we suppose that he would allow of a real expiatory sacrifice by that which was leprous all over? It would have been so far from yielding “a sweet savour to God,” from being an atonement for all men, for any one man, for the man himself that should have been offered, that it would have been the highest provocation unto the eyes of his glory.

Wherefore the Son of God himself became “Jesus;” that is, he took human nature, “the seed of Abraham,” into union with himself, that he might have of his own to offer unto God. This by its oneness with our nature, the nature that had sinned, being itself not touched with sin, was meet to be offered for us; and by its union with his person was meet and able to make atonement with God for us; and so “God redeemed his church with his own blood,” Acts xx. 28. Thus our high priest is “Jesus, the Son of God.”’ And in these things consists his greatness, which the apostle proposeth for our encouragement unto steadfastness in profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 4: 414-15.</span></figcaption>

<blockquote><p>We have seen that our Lord formerly contended with the fear of death; but as He now fights face to face with temptation, such an attack is called the beginning of grief and sorrow… Thus, though God had already tried his Son by certain preparatory exercises, He now wounds Him more sharply by a nearer prospect of death, and strikes his mind with a terror to which He had not been accustomed. But as it appears to be inconsistent with the divine glory of Christ, that he was seized with trembling and sadness, many commentators have labored with toil and anxiety to find some way of evading the difficulty. But their labor has been ill-judged and of no use; for if we are ashamed that Christ should experience fear and sorrow, our redemption will perish and be lost. Ambrose justly says: ‘I not only do not think that there is any need of excuse, but there is no instance in which I admire more his kindness and his majesty; for he would not have done so much for me, if he had not taken upon him my feelings. He grieved for me, who had no cause of grief for himself; and, laying aside the delights of the eternal Godhead, he experiences the affliction of my weakness. I boldly call it sorrow, because I preach the cross. For he took upon him not the appearance, but the reality, of incarnation. It was therefore necessary that he should experience grief, that he might overcome sorrow, and not shut it out; for the praise of fortitude is not bestowed on those who are rather stupefied than pained by wounds.’ Thus far Ambrose. Certainly those who imagine that the Son of God was exempt from human passions do not truly and sincerely acknowledge him to be a man. And when it is even said that the divine power of Christ rested and was concealed for a time, that by his sufferings He might discharge all that belonged to the Redeemer, this was so far from being absurd, that in no other way could the mystery of our salvation have been accomplished. For Cyril has properly said: ‘…For the same reason that the Word of God is God, (Jn. 1:1) and is naturally life itself, (Jn. 11:25) nobody doubts that he had no dread of death; but, having been made flesh (Jn. 1:14) He allows the flesh to feel what belongs to it, and, therefore, being truly a man, He trembles at death, when it is now at the door… You see how human nature, even in Christ Himself, has the sufferings and fears which belong to it, but that the Word, who is united to it, raises it to a fortitude which is worthy of God.’… Still the weakness which Christ took upon Himself must be distinguished from ours, for there is a great difference. In us there is no affection unaccompanied by sin, because they all exceed due bounds and proper restraint; but when Christ was distressed by grief and fear, He did not rise against God, but continued to be regulated by the true rule of moderation. We need not wonder that, since He was innocent, and pure from every stain, the affections which flowed from Him were pure and stainless; but that nothing proceeds from the corrupt nature of men which is not impure and filthy. Let us, therefore, attend to this distinction, that Christ, amidst fear and sadness, was weak without any taint of sin; but that all our affections are sinful, because they rise to an extravagant height. …And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>

<blockquote><p>Fifthly, the union of the two natures in Christ is an inseparable union. So that from the first moment thereof, there never was, nor to eternity shall be, any separation of them. If you ask how the union remained betwixt them when Christ’s human soul and body were separated from each other upon the cross? Is not death the dissolution of union betwixt soul and body? True, the natural union betwixt his soul and body was dissolved by death for a time, but this hypostatical union remained even then as entire and firm as ever. For though his soul and body were divided from each other, yet neither of them from the divine nature. Divines assist our conception of this mystery by an apt illustration. A man that holds in his hand a sword sheathed, when he pleases, draws forth the sword, but still holds that in one hand and the sheath in the other, and then sheaths it again, still holding it in his hand; so when Christ died his soul and body retained their union with the divine nature, though not (during that space) one with another.</p></blockquote>

<blockquote><p>It cannot be denied that there is in our nature a strong tendency to formalism in religion. Formalism is, indeed, a compromise between conscience and the love of the world. The mind does not readily rest in infidelity; and does not love God or holiness. The resultant of these two forces is often the adoption and strenuous advocacy of a form of religion, which is enough like the truth to appease the conscience, yet which has not life enough to conquer worldly-mindedness. And if this form of godliness can be decorated with a splendid and captivating drapery, which appeals to the imagination, and gratifies the taste, its reception is all the more welcome, and its power the more absolute.

This tendency to exalt and rest in whatever appeals to the senses, is manifested in every part of the world, and in all ages of time. It stands boldly forth in all those systems of religion which man has devised for himself And even a true religion has not unfrequently so degenerated, as to be given up to its sway. Thus it was that that system of truth given by God as the forerunner of Christianity had so yielded to this principle, that its most prominent advocates were chargeable with having a form of godliness, but denying the power of it.

And the Church of Christ, simple and spiritual as it is, has not escaped this malign influence. Her history tells too plainly that altars and crosses, vestments and genuflections, penances and pilgrimages, have usurped the place of, and driven into exile the humble and loving service of the heart. And thus men painfully earn a name to live while they are dead. And just in proportion as the spirit of Christianity has been suppressed the power of forms has augmented. The form of the cross is most frequently found where the doctrines of the cross are least known.

It is not strange, therefore, that our Lord so shaped his dispensation of truth as to come in violent conflict with this dangerous tendency of our nature. We are prepared to hear his declaration to the woman of Samaria, “Believe me, the hour cometh when ye shall neither in this mountain nor yet in Jerusalem worship the Father. But the hour Cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth.” And in precise accordance with the truest wisdom, philosophical as well as religious, our Saviour established a system, which above all others the world has ever seen, was simple in its form.

There must necessarily be a form of truth; for we are not purely spiritual beings. There must be an organized manifestation of our faith. Hence religion must have its sacred times and places, its ordinances and decent observances. But while this demand of our nature is fully met in the promulgation of the truth as it is in Jesus, care is taken that it shall not have unlimited sway. We have a visible organization of the Church, with its ordinations; baptism and the supper; and its government by bishops and elders.

But lest these few and simple ordinances should assume too high a place in our esteem and confidence, we are reminded, both by precept and example, that they are but channels of grace, and not its authors—that to the worthy receiver alone, they become means of salvation. In short, that they have no inherent efficacy, and no indispensable connection with spiritual life, and that if need be, we can worship God acceptably without any or all of them. The external and the internal are combined, but each is kept in its proper place. “He that believeth and is baptised shall be saved.” “If thou shalt believe in thy heart, and confess with thy mouth, the Lord Jesus, thou shalt be saved.” “For with the heart, man believeth unto righteousness, and with the mouth, confession is made unto salvation.”

In the Christian system form is the handmaid of spirit, and ministers to its ends, and is only valuable as it does so. When, therefore, the form assumes the prominent place, and becomes the end when the majestic temple with its heaven-piercing pinnacles, and cloudlike dome, its splendid paraphernalia, and its imposing ritual, draw the eyes and the heart away from the truth to themselves, they become not only useless but prejudicial. They become at once usurpers of the place and rebels against the authority of the king of truth.</p></blockquote>

%E2%80%9CIf+thou+shalt+believe+in+thy+heart%2C+and+confess+with+thy+mouth%2C+the+Lord+Jesus%2C+thou+shalt+be+saved.%E2%80%9D+%E2%80%9CFor+with+the+heart%2C+man+believeth+unto+righteousness%2C+and+with+the+mouth%2C+confession+is+made+unto+salvation.%E2%80%9D%0A%0AIn+the+Christian+system+form+is+the+handmaid+of+spirit%2C+and+ministers+to+its+ends%2C+and+is+only+valuable+as+it+does+so.+When%2C+therefore%2C+the+form+assumes+the+prominent+place%2C+and+becomes+the+end+when+the+majestic+temple+with+its+heaven-piercing+pinnacles%2C+and+cloudlike+dome%2C+its+splendid+paraphernalia%2C+and+its+imposing+ritual%2C+draw+the+eyes+and+the+heart+away+from+the+truth+to+themselves%2C+they+become+not+only+useless+but+prejudicial.+They+become+at+once+usurpers+of+the+place+and+rebels+against+the+authority+of+the+king+of+truth.%E2%80%9D%0A%0A%E2%80%94+Samuel+James+Pierce+Anderson%2C+Article+III.+Form+and+Spirit.+An+Address%2C+Delivered+before+the+Alumni%2C+and+the+Society+of+Inquiry+of+Union+Theological+Seminary%2C+Prince+Edward%2C+Va.+June%2C+1850+in+Southern+Presbyterian+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27197b0274.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27197b0274.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/01/22/samuel-james-pierce-anderson-on-human-natures-tendency-to-formalism-in-opposition-to-vital-christianity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-0afca7c940" data-kw="">
<blockquote><p>The doctrine of middle knowledge, however, represents contingent future events as contingent and free also in relation to God. This is with reference not only to God’s predestination but also his foreknowledge, for just as in Origen, things do not happen because God knows them, but God foreknows them because they are going to happen. Hence, the sequence is not necessary knowledge, the knowledge of vision, the decree to create (etc.); instead, it is necessary knowledge, middle knowledge, decree to create (etc.), and the knowledge of vision. God does not derive his knowledge of the free actions of human beings from his own being, his own decrees, but from the will of creatures. God, accordingly, becomes dependent on the world, derives knowledge from the world that he did not have and could not obtain from himself, and hence, in his knowledge, ceases to be one, simple, and independent – that is, God. Conversely, the creature in large part becomes independent vis-a-vis God. It did indeed at one time receive “being” (esse) and “being able” (posse) from God but now it has the “volition” (velle) completely in its own hand. It sovereignly makes it own decisions and either accomplishes something or does not accomplish something apart from any preceding divine decree. Something can therefore come into being quite apart from God’s will. The creature is now creator, autonomous, sovereign; the entire history of the world is taken out of God’s controlling hands and placed into human hands. First, humans decide; then God responds with a plan that corresponds to that decision.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-75b8794a35" data-kw="">
<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect</cite>, [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

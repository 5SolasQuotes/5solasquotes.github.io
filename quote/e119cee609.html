<main class="wrap"><figure class="quote" id="q-e119cee609" data-kw="">
<blockquote><p>Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for ‘quod competit alicui qua tali competit omni tali.’ That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and settled ecclesiastical republic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 3. That the Jews had an ecclesiastical sanhedrim and government distinct from the civil 4, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e271a9cc48" data-kw="">
<blockquote><p>The third consideration is that there is some footsteps of this identity of bishop and presbyter in the most corrupt writtings of the most impure schoolmen: which may appear in these three: 1. In that, generally, episcopacy is holden to be no distinct order from presbytery; and that presbytery, or priesthood (as they speak) is the highest order in all their hierarchy. And this is current as the doctrine of Lombardus the Master of Sentences, Hugo, Aquinas, Thomas Waldensis, and generally of all the Thomists at least. And though they seem to make bishops to be of a more eminent degree, yet by Estius and some others alleged by him, this is not thought sufficient to distinguish one office from another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation, (Edinburgh, 1658), pp. 223-33, p. 227</span></figcaption>

</figure><figure class="quote" id="q-69b5376adb" data-kw="">
<blockquote><p>[It is superstition] that all the pastors of the protestant Churches abroad, who had only the election of the people and the ordination of parochial pastors, and not of diocesan bishops, are no true ministers of Christ, but laymen. That therefore those Churches are no true Churches (in a political sense and as organized). That therefore their baptism is unlawful and a nullity, and all those nations are no baptized Christians (though the Papists who hold the validity of laymen’s baptizing do here censure [these protestant episcopal men] more easily). That it is not lawful to communicate in such Churches and receive the sacrament of the Lords supper from such ministers. That those countries which are baptized by such should be rebaptized. That those ministers who are ordained by such should be re-ordained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, p. 292</span></figcaption>

</figure><figure class="quote" id="q-50e7148f16" data-kw="">
<blockquote><p>Again I conceive that there be two sort of positives in the externals of [Church] government or worship:

1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: and when the Church forms a directory for worship and government, the directory itself is in the form not simply divine….

2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal; in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture as was the [Anglican] Service-Book [which was sought to be imposed on Scotland in 1637]; and the pastor or people in these are not properly moral agents [working things in themselves moral or religious], nor do we press that Scripture should regulate men in these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro | Section 5, pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-7d052a5e1d" data-kw="">
<blockquote><p>These peculiar and distinctive principles of modern Independents or Congregationalists were not explicitly professed, and, of course, were neither formally defended nor assailed in the early church. As a subject of controversial discussion, they are wholly of modern origin. They seem to have been first publicly and distinctly broached, as exhibiting the scriptural views of the constitution and government of the church, by J.B. Morellius or Morely, who was connected with the Reformed Church of France, and whose work on the subject, entitled, ‘Traicte de la Discipline et Police Chretienne,’ was published at Lyons in 1561, and was soon thereafter condemned by the National Synod at Orleans in 1562, and again at Nismes in 1572. They were embraced also by [Peter] Ramus, the celebrated philosopher, who was killed in the massacre of St. Bartholomew; but they made no permanent impression upon the French Protestants. It was not till about twenty or thirty years later, near the end of the sixteenth century, that these views were brought out and practically acted upon in this country, by some persons… who were known for a time under the name of Brownists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, 2.548</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<main class="wrap"><figure class="quote" id="q-574bb6ee1e" data-kw="">
<blockquote><p>A disposition to good works is necessary to justification, being the qualification of an active and lively faith… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 20-21</span></figcaption>

<blockquote><p>3. He [the Arminian Conrad Vorstius] first says that ‘Scripture does not call God infinite.’ This is false. For Scripture thus says in Psalm 144:3: “Great is the Lord, exceedingly praiseworthy, whose magnitude has no end.” And Baruch 3:25: “It is great and has no bounds, immeasurable and highly-exalted.” These witnesses are not able to be interpreted as about magnitude of mass or quantity, which is not in God. But [it must be interpreted] as respecting his magnitude of perfection or virtue. Therefore, this is the sense: God is so great in virtue and perfection that he does not have an end or terminus of his virtue and perfection. From this, I reason thus: just as the end in virtue and perfection is that which has an end or terminus of its virtue and perfection, so on the opposite side, an infinite in virtue and perfection is that which does not have an end or terminus of its virtue and perfection. But God does not have an end or terminus of his virtue and perfection. Therefore, he is infinite in virtue and perfection. What shall Vorstius say at this point? The major premise is per se known by implication. The minor premise is openly expressed in Scripture. The conclusion is legitimately inferred.</p></blockquote>

<blockquote><p>Fourthly, they [Justification and Sanctification] are both equally imputed unto us through the righteousness of Christ. Therefore says St. Paul to the Corinthians, ‘To them that are sanctified in Christ Jesus,’ (1 Cor. 1:2) and to the Hebrews, it is said we are ‘sanctified by the blood of the Covenant.’ (Heb. 10:29) So that no less are we sanctified than justified by Christ’s death and merits, and the imputation of them. But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2)… For not only is a sinner by the Spirit of regeneration and sanctification purged from the old leaven of sin and malice, but he becomes a new lump, and unleavened (1 Cor. 5:7); and whereas he has ‘yielded his members as instruments of unrighteousness unto sin, he does yield himself unto God,’ (Rom. 6:13) as those that are alive from the dead. And old things are done away in him, and all things become new.’ (2 Cor. 5:17) And ‘whosoever is (thus) born of God; does not commit sin, for his seed remains in him, and he cannot sin because he is born of God.’ (1 Jn. 3:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17, pp. 62-63</span></figcaption>

<blockquote><p>§VIII. The external means are the Word (James 1:18, “Of his own will begat he us with the word of truth.” v. 21, “receive with meekness the engrafted word, which is able to save your souls.” 1 Pet. 1:23, “Being born again… by the word of God, which liveth.” Lk. 8:15; Gal. 3:2) and the sacraments (Jn. 3:5; Tit. 3:5; Gal. 3:27; Rom. 6:4; Lk. 22:20). The internal is faith (Gal. 5:6), hence in Acts 15:9, hearts are said to be purified by faith.</p></blockquote>

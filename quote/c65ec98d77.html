<blockquote><p>It’s demanded, What fruit was it, which brought the Axe to the Root of the tree?

1. It was prophanation of the Sabbath, Jerem. 17. 24, 25. 27. If they made conscience of God’s Sabbath, he would take care of their City: If they would hollow that day with pious duties, he would honour them with choice Princes; but if they would defile his day, he would fire their City, and that with unquenchable fire.

This made Nehemiah so zealous for the Sabbath, after the return from Babylon, Neh. 13. 17, 10. he contended with the Nobles, and said, What evil thing is this that ye do, and prophane the Sabbath day? did not your Father’s thus, and did not our God bring all his evils upon us, and upon this City? yet ye bring more wrath upon Israel, by prophaning the Sabbath day. He knew that sin had formerly laid them waste, and would therefore stand for the Sabbath, that the Lord of Sabbaths might stand for and by them. England is not innocent in this thing. The Book of Sports (a Monster that Heathen and Idolatrous Kingdoms never produced) that opened a wide door to prophane the Lord’s day, hath kindled a fire in our Land, which is not like to be extinct till that Book be burnt by publique Authority.

2. Idolatry, that is a Kingdom destroying sin. Jeroboam’s two Calves eat up the 10. Tribes, and Manasses’ Idols devoured Juda, Hos. 13 1. When Ephraim sinned in Baal then he died. Idolatry is the death of a Land, it divides between God and Kingdoms, it breaks the Covenant, and causes God to give a Bill of Divorce, and that is not all, it calls forth Gods fury upon a Land, Ezek. 36. 18. 19. and that is a destructive thing.</p></blockquote>

<blockquote><p>This is a wonderful story to tell about very great men and pillars of the churches. Paul is the only one who has his eyes open and sees the sin of Peter, Barnabas, and the other Jews, who were acting insincerely along with Peter. At the same time they do not see their own sin; in fact, they think they are doing well and are charitably deferring to the Jews who were weak in faith. And Paul does not cover up their sin; but he accuses Peter, Barnabas, and the others in no uncertain terms of failing to walk the proper way according to the truth of the Gospel, that is, of having swerved from the truth of the Gospel. It was a serious matter for Peter to be accused by Paul of falling and of swerving from the truth of the Gospel; there could be no graver reproach. Yet he bears it patiently and undoubtedly accepted it with real gratitude. I warned earlier that many have the Gospel but not the truth of the Gospel. Thus Paul says here that Peter, Barnabas, and the rest of the Jews did not walk properly according to the truth of the Gospel; that is, they had had the Gospel but had not walked in it properly. For although they were preaching the Gospel, still by their pretense, which could not stand with the truth of the Gospel, they were establishing the Law. But the establishment of the Law is the abrogation and overthrow of the Gospel. Therefore whoever knows well how to distinguish the Gospel from the Law should give thanks to God and know that he is a real theologian. I admit that in the time of temptation I myself do not know how to do this as I should. The way to distinguish the one from the other is to locate the Gospel in heaven and the Law on earth, to call the righteousness of the Gospel heavenly and divine and the righteousness of the Law earthly and human, and to distinguish as sharply between the righteousness of the Gospel and that of the Law as God distinguishes between heaven and earth or between light and darkness or between day and night. Let the one be like the light and the day, and the other like the darkness and the night. If we could only put an even greater distance between them! Therefore if the issue is faith, heavenly righteousness, or conscience, let us leave the Law out of consideration altogether and let it remain on the earth. But if the issue is works, then let us light the lamp of works and of the righteousness of the Law in the night. So let the sun and the immense light of the Gospel and of grace shine in the day, and let the lamp of the Law shine in the night. These two must be distinguished in your mind in such a way that when your conscience is completely terrified by a sense of sin, you will think of yourself. “At the moment you are busy on earth. Here let the ass work, let him serve and carry the burden that has been laid upon him; that is, let the body and its members be subject to the Law.34 But when you ascend into heaven, leave the ass with his burdens on earth; for the conscience has no relation to the Law or to works or to earthly righteousness. Thus the ass remains in the valley; but the conscience ascends the mountain with Isaac, knowing absolutely nothing about the Law or its works but looking only to the forgiveness of sins and the pure righteousness offered and given in Christ.” …Peter had confused this distinction between the Law and the Gospel, and thus he had persuaded the believers that they had to be justified by the Gospel and the Law together. This Paul refused to tolerate. Therefore he rebuked Peter. He did not want to put him to shame, but he wanted to separate these two very sharply again, namely, that the Law justifies on earth and the Gospel in heaven. But the pope has not only confused the Law with the Gospel; but he has changed the Gospel into mere laws, and ceremonial laws at that. He has also confused secular matters and church matters, which is really a satanic and infernal confusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 115–17.</span></figcaption>

<blockquote><p>The instances he gives from the church of the Jews, or that may be given, are either civil observances, as the feast of purim; or moral conveniencies directed by general rules, as the building of synagogues; or customary signs suited to the nature of things, as wearing of sackcloth; or such as have no proof their being approved, as the feast of dedication, and some monthly fasts taken up in the captivity;—from none of which any objection can be taken against the position before laid down. Those from the church of the New Testament had either a perpetual binding institution from the authority of Christ, as the Lord’s-day Sabbath; or contain only a direction to use civil customs and observances in a holy and sanctified manner, as the love feasts and kiss of charity; or such as were never heard of in the New Testament at all, as the observation of Lent and Easter. He that out of these instances can draw a warranty for the power of the civil magistrate over religion and the consciences of men, to institute new duties in religion when he pleaseth, so these “do not countenance vice nor disgrace the Deity,” which all his Christian subjects shall be bound in conscience to observe, or otherwise make good any of those particular conclusions, that therefore Christ is not the only lawgiver to his church, or that divine revelation is not the adequate rule of divine worship, or that men may add any thing to the worship of God, to be observed in it constantly and indispensably by the whole church, will manifest himself to have an excellency in argumentation beyond what I have ever yet met withal.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The instances he gives from the church of the Jews, or that may be given, are either civil observances, as the feast of purim; or moral conveniencies directed by general rules, as the building of synagogues; or customary signs suited to the nature of things, as wearing of sackcloth; or such as have no proof their being approved, as the feast of dedication, and some monthly fasts taken up in the captivity;—from none of which any objection can be taken against the position before laid down. Those from the church of the New Testament had either a perpetual binding institution from the authority of Christ, as the Lord’s-day Sabbath; or contain only a direction to use civil customs and observances in a holy and sanctified manner, as the love feasts and kiss of charity; or such as were never heard of in the New Testament at all, as the observation of Lent and Easter. He that out of these instances can draw a warranty for the power of the civil magistrate over religion and the consciences of men, to institute new duties in religion when he pleaseth, so these “do not countenance vice nor disgrace the Deity,” which all his Christian subjects shall be bound in conscience to observe, or otherwise make good any of those particular conclusions, that therefore Christ is not the only lawgiver to his church, or that divine revelation is not the adequate rule of divine worship, or that men may add any thing to the worship of God, to be observed in it constantly and indispensably by the whole church, will manifest himself to have an excellency in argumentation beyond what I have ever yet met withal.”

— John Owen, Truth and Innocence Vindicated in A Survey of a Discourse Concerning Ecclesiastical Polity, and the Authority of the Civil Magistrate Over the Consciences of Subjects in Matters of Religion in The Works of John Owen, ed. William H. Goold, vol. 13 (Edinburgh: T&amp;T Clark, n.d.), 479.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+instances+he+gives+from+the+church+of+the+Jews%2C+or+that+may+be+given%2C+are+either+civil+observances%2C+as+the+feast+of+purim%3B+or+moral+conveniencies+directed+by+general+rules%2C+as+the+building+of+synagogues%3B+or+customary+signs+suited+to+the+nature+of+things%2C+as+wearing+of+sackcloth%3B+or+such+as+have+no+proof+their+being+approved%2C+as+the+feast+of+dedication%2C+and+some+monthly+fasts+taken+up+in+the+captivity%3B%E2%80%94from+none+of+which+any+objection+can+be+taken+against+the+position+before+laid+down.+Those+from+the+church+of+the+New+Testament+had+either+a+perpetual+binding+institution+from+the+authority+of+Christ%2C+as+the+Lord%E2%80%99s-day+Sabbath%3B+or+contain+only+a+direction+to+use+civil+customs+and+observances+in+a+holy+and+sanctified+manner%2C+as+the+love+feasts+and+kiss+of+charity%3B+or+such+as+were+never+heard+of+in+the+New+Testament+at+all%2C+as+the+observation+of+Lent+and+Easter.+He+that+out+of+these+instances+can+draw+a+warranty+for+the+power+of+the+civil+magistrate+over+religion+and+the+consciences+of+men%2C+to+institute+new+duties+in+religion+when+he+pleaseth%2C+so+these+%E2%80%9Cdo+not+countenance+vice+nor+disgrace+the+Deity%2C%E2%80%9D+which+all+his+Christian+subjects+shall+be+bound+in+conscience+to+observe%2C+or+otherwise+make+good+any+of+those+particular+conclusions%2C+that+therefore+Christ+is+not+the+only+lawgiver+to+his+church%2C+or+that+divine+revelation+is+not+the+adequate+rule+of+divine+worship%2C+or+that+men+may+add+any+thing+to+the+worship+of+God%2C+to+be+observed+in+it+constantly+and+indispensably+by+the+whole+church%2C+will+manifest+himself+to+have+an+excellency+in+argumentation+beyond+what+I+have+ever+yet+met+withal.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Truth+and+Innocence+Vindicated+in+A+Survey+of+a+Discourse+Concerning+Ecclesiastical+Polity%2C+and+the+Authority+of+the+Civil+Magistrate+Over+the+Consciences+of+Subjects+in+Matters+of+Religion+in+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+13+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+479.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf4b2061c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af4b2061c2.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/02/owen-contra-lent-easter-and-the-normative-principle-of-worship/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>14. God has by nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances or accidents of this universal religion which are not themselves meet for an universal and unchangeable obligation, but [for] local, temporary and mutable [circumstances and obligations]: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin. I have often named many particulars, as: The translation of the Scripture, which to choose: the version of the Psalms in rhyme or meter, the common use of new made hymns,¹ the dividing the Scripture into chapter and verse, the words of sermons, their method, the particular text to be chosen, what chapters to read, at what hour to begin, how long to preach, in what words to pray, whether the same oft or changed, whether forestudied or not, whether written or unwritten, whether studied and written by ourselves or by others, where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? ¹ [Elsewhere Baxter speaks of, “the choice of psalms and hymns: the use of David’s are lawful and so are others: but no institution ties us to one, but leaves us to choose.” Schism Detected in Both Extremes (1684), pt. 2, pp. 5-6. This is plainly false: Ex. 15:20-21; 2 Sam. 23:1; 1 Chron. 25:1-7; 2 Chron. 29:25-30; Neh. 12:45-46; Ps. 95:2; etc. See ‘Singing of Psalms’.] Whether we be bareheaded or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit or be prostrate at prayer, etc. What distinctive garments pastors shall use, by what signs of consent and obligation men vow and swear, whether by putting the hand under the thigh [Gen. 24:2, 9; 47:29], lifting it up [Gen. 14:22; Dt. 32:40], subscribing, laying it on the Book,² kissing the Book,³ etc. What catechisms to use, with many more such. ² [See ‘On Laying One’s Hand on the Bible to Swear’.] ³ [See ‘On Trembling at the Word, Weeping before the Bible, Kissing the Stake, etc.’] God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.

15. These [things] may be called ‘worship’ in a sense subservient to God’s ordinances of worship¹ (as we worship men by putting off the hat, kneeling, bowing [Mt. 18:26; Lk. 14:10; Rev. 3:9], etc.). But if any will not call it ‘worship’, they must [then] not call it ‘false worship’, nor pretend that the controversy is any more than about the bare name. ¹ [For an explanation of this, see pp. 73-84 of Travis Fentiman, 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022).]

16. They that feign such things as these to be sinful additions and an invading of Christ’s office and denying his faithfulness, etc. condemn the Scripture that commands such determinations, and contradict the Law of Nature and the practice of all Churches on earth, and would exterminate all God’s worship, which cannot be performed without some such determinations.</p></blockquote>

<blockquote><p>Eighthly, God under the New Testament has appointed all his worship in a plain, simple way, not to please the eye, or affect the heart, but only to draw out the spiritual exercise of the soul. Insomuch that it is the most difficult thing that can be: not to be offended at the simplicity of Gods worship now appointed; ‘I am afraid,’ says Paul, ‘as the serpent beguiled Eve, so your minds should be corrupted from the simplicity of the Gospel of Christ.’ [2 cor. 11:3] Paul was afraid of this: the Devil is to be feared more as a glittering subtle serpent than a raging roaring lion: and in nothing does his serpentine art appear more then in introducing worship that is pompous and ceremonious. As children love to play with babies; so do ignorant, carnal people with an external sensible worship. And the more spiritual any ordinance, or the administration of it is, the less glorious it is unto a corrupt heart; whereas a gracious heart [full of God’s grace] sees glorious majesty in spirituality. Christ’s presence in the temple, expounding, informing and reforming, made the second temple more glorious than the former, which did exceed in gold and other magnificence. As the painting of a precious jewel hinders the native and proper luster of it, so does human pomp added to the pure institutions of Christ take off from the innate beauty and glory of them. God indeed in the Old Testament appointed a solemn external worship, full of sensible glory and pomp, but it was because they were infants, and children had rather have a baby than a rich inheritance. Expect therefore in the worship of God, that which may exercise thy faith, heavenly-mindedness, and dependency upon God, which may make a divine impression and stamp upon thy soul, not that which may ravish thy eyes and thy ears.</p></blockquote>

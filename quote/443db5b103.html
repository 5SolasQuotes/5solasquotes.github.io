<main class="wrap"><figure class="quote" id="q-443db5b103" data-kw="">
<blockquote><p>How have we used the mercies which are taken from us? Yea God Himself will judge us according to our works! He will not justify us, if we have been unfaithful in our little, and have been such as Satan and his instruments, the accusers of the brethren, do report us. But if we have been faithful we may expect his double justification: 1 By pardon He will justify us from our sins. 2. By plea and righteous sentence He will justify us against the false accusations of our enemies. And that’s enough. How small a thing should it seem to us, to be judged of man, who must stand or fall to the final sentence of the Almighty God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Farewell Sermon prepared to have been preached to his hearers at Kidderminster at his Departure, but Forbidden (1660; London: 1683)</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

fied." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-60465e26a0" data-kw="">
<blockquote><p>The applying work of Christ’s merit is that solemn part of his mediation, for the sake whereof He forsook the earth, and was exalted… and sits at the right hand of God his Father, that by his intercession always made for his Church, He might apply to all the members the power of this satisfaction, that it might work faith in those that want it, and confirm it in those that have it. Therefore He is called advocate, that the Church may enjoy the fruit of his death continually. And as the ends hereof are many, to wit… keep them in his love, to cover their daily offences, and continue their justification and acceptance…</p></blockquote>

</figure><figure class="quote" id="q-4041cf2e7b" data-kw="">
<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<main class="wrap"><figure class="quote" id="q-90ca2723c8" data-kw="">
<blockquote><p>Another question arises about the reality of real relation, namely whether there is a real distinction between the relation itself and its absolute foundation, on which see chapter 8 below. Quantity too gives some difficulty, namely whether it is merely a mode or modal accident of substance or not. For Scholastics, in order to explain how the sensible species of the Eucharist can be sustained miraculously in the absence of the substance of bread and wine, seem to have changed, and perhaps not a little, the original Aristotelian opinion. But this question seems rather to belong to theology than to philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 1, p. 66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.18.1</span></figcaption>

</figure><figure class="quote" id="q-04ea9ba944" data-kw="">
<blockquote><p>I do not know of any satisfactory answer to this problem,” Kenny continued. “If I did, I would give it. Since I do not, I must leave it, as the writers of textbooks say, as an exercise for the reader” (A Path from Rome, 1986, 167–168). These questions may seem abstruse… But the question of Christ’s presence now on the altar is… central to the consecration and adoration of the Eucharist [in Romanism]. It is a question that many others besides Thomas Aquinas sought to answer, and a seriously inquiring intellect might rightly be disturbed, even scandalized, if forbidden to ask it. But for a long time Thomas’s answer was accepted just because it was his… Thomas’s answer to Kenny’s question can, in fact, be found in other Scholastics who variously adopt the principle that “that into which something is converted is where the converted thing was before.” This principle is dubious and was not universally accepted. Since transubstantiation converts only the substance of the bread into Christ’s body and not also the accidents, why should any of the accidents of the bread be kept by Christ’s body if, according to the doctrine, the accidents are not part of the transubstantiation? [Simpson goes on to describe Scotus’s proposed answer to the issue.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-l-p-simpson.html">Peter L.P. Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Have you Tried Scotus? Aquinas Didn’t Know Everything’ in Commonweal</cite>, (June 14, 2019), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

</figure><figure class="quote" id="q-c204f63b4a" data-kw="">
<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper (the Mass)</span></figcaption>

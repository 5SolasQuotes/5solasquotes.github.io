<main class="wrap"><figure class="quote" id="q-8c73e599e1" data-kw="">
<blockquote><p>With respect to merit, we must remove the difficulty by which many are perplexed; for Scripture so frequently promises a reward to our works, that they think it allows them some merit. The reply is easy. A reward is promised, not as a debt, but from the mere good pleasure of God. It is a great mistake to suppose that there is a mutual relation between Reward and Merit; for it is by his own undeserved favor, and not by the value of our works, that God is induced to reward them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 17:7-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef42b50dce" data-kw="">
<blockquote><p>This mode of expression, they tell us, is employed, because God bestows the first grace. It is really foolish to imagine that they can succeed in this way, since Paul excludes man and his utmost ability, -- not only from the commencement, but throughout, -- from the whole work of obtaining salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:9</span></figcaption>

<blockquote><p>Just as we say there is a certain merit ex congruo, so we shall say there is a certain reward ex congruo, which is owed rather of grace than of justice.</p></blockquote>

</figure><figure class="quote" id="q-552f034c8c" data-kw="">
<blockquote><p>The term &quot;merit&quot; refers in general to the recompense owed by a community or a society for the action of one of its members, experienced either as beneficial or harmful, deserving reward or punishment. Merit is relative to the virtue of justice, in conformity with the principle of equality which governs it. … With regard to God, there is no strict right to any merit on the part of man. Between God and us there is an immeasurable inequality, for we have received everything from him, our Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §§2006–2007</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-14a3722262" data-kw="">
<blockquote><p>Filial adoption, in making us partakers by grace in the divine nature, can bestow true merit on us as a result of God&#x27;s gratuitous justice. This is our right by grace, the full right of love, making us &quot;co-heirs&quot; with Christ and worthy of obtaining &quot;the promised inheritance of eternal life.&quot; The merits of our good works are gifts of the divine goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2009</span></figcaption>

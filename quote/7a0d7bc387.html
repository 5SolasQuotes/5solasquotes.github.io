<main class="wrap"><figure class="quote" id="q-7a0d7bc387" data-kw="">
<blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebe0ac0578" data-kw="">
<blockquote><p>There is no necessity for any other proof of native depravity, than the aversion, which children early manifest to religious instruction and to spiritual exercises. From this cause it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>

<blockquote><p>The case of human freedom, as a species of contingency, is quite different: it references a genuine alternativity in human choice that is ontically [the order of being, not just in the order of knowledge] grounded in the divine decree, maintained in the providential concursus, and rooted in the potencies belonging to the will and the free determinations of the intellect.</p></blockquote>

</figure><figure class="quote" id="q-dfeff076c1" data-kw="">
<blockquote><p>Parishioner: Although I admit, sir, that man is depraved, yet I have been inclined to believe that he was not entirely disabled to do good. I have supposed that his moral and not his natural faculties were affected by the fall, and hence that his inability referred merely to the will, and was manifested in his indisposition to receive the gospel. And the reference of Scripture appears to be to this kind of inability, when it is said, “we are made willing in the day of God’s power,” [Ps. 110] and in that other passage “ye will not come unto Me that ye may have life.” [John 5] Do not these passages imply that a sinner possess a natural, but not a moral ability to believe, and that he can if he will repent? Pastor: If the distinction between natural and moral ability contemplates no more than this, that in our natural condition, we possess all the faculties of mind, which a regenerated man employs in the service of God, I am ready to admit it. The same natural faculties characterize both the regenerate and the unregenerate, and the work of the Spirit on the mind does not increase the number of these faculties. But if the distinction implies that these natural faculties are not disabled by the fall, this I deny, as being contrary to fact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-engles.html">William Engles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Caution Against Prevailing Errors, Being a Conversation Between a Presbyterian and his Parishoner’</cite>, p. 23, being p. 25 of Presbyterian Tracts, vol. 2. The fuller title of the book this tract is contained in is: A Series of Tracts on the Doctrines, Order and Polity of the Presbyterian Church in the United States of America Embracing Several on Practical Subjects, vol. 2. This series of tracts was printed by the Presbyterian Board of Publication and includes tracts in it by Archibald Alexander, William Symington, Samuel Miller, Jonathan Edwards, Samuel Davies and others.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-e7d5eaa632" data-kw="">
<blockquote><p>What makes it the case that I do in fact act or refrain from acting on the reasons in question? Doesn’t a choice to act require a cause, and if the act is to be a free and thus self-determined one, doesn’t that entail that the cause must be some further choice on my part? If that is the case, doesn’t that further choice itself require yet another choice as a cause, and so on ad infinitum? The answer is that this does not follow. Just as the will’s ultimate ends in the order of final causes are simply given rather than pursued for the sake of yet further ends, so too its ultimate acts in the order of efficient causes can bring about effects (such as bodily movements) without themselves being caused. The will is in this sense an uncaused cause or unmoved mover.† † …as Cuypers goes on to note, this is consistent with holding that the will is ultimately moved by God, just as, for the Thomist, everything other than God ultimately exists and acts at any moment only insofar as God conserves it in being and concurs with its causal activity. If we acccept this theological picture (as I happen to), the will would count as an unmoved mover only in a relative sense, with God alone being an unmoved mover in an absolute sense… In my view, how divine causality related to the will is in any event more a question about the nature of divine causality than it is a question about the nature of the will. This does not entail that its operation is random, either in the snese of being an exception to the principle of causality or in the sense of being unintelligible or devoid of explanation. It is not an exception to the principle of causality, because events require causes insofar as they contain some passive potentiality that requires actualization… The exertion of the will by contrast, is entirely active rather than passive. It is a bringing about that is not itself brought about by anything else. Yet it is not unintelligible or devoid of explanation, because it is done for a reason–in particular, for the sake of the end grasped by the intellect–and something done for a reason is the opposite of unintelligible. Hence the defender of agent-causal free will [which Aquinas’s view more or less fits into] is not stuck with the dilemma of having to posit either ‘an infinite regress or a nonrational flip-flop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, (Editiones Scholastica, 2024), ch. 4, ‘The Will’ Feser is an Anyltical Thomist, writing in the Thomist tradition. What is said below is consistent with divine, physical predetermination., pp. 169-70</span></figcaption>

unintelligible+or+devoid+of+explanation.+It+is+not+an+exception+to+the+principle+of+causality%2C+because+events+require+causes+insofar+as+they+contain+some+passive+potentiality+that+requires+actualization%E2%80%A6+The+exertion+of+the+will+by+contrast%2C+is+entirely+active+rather+than+passive.+It+is+a+bringing+about+that+is+not+itself+brought+about+by+anything+else.+Yet+it+is+not+unintelligible+or+devoid+of+explanation%2C+because+it+is+done+for+a+reason%E2%80%93in+particular%2C+for+the+sake+of+the+end+grasped+by+the+intellect%E2%80%93and+something+done+for+a+reason+is+the+opposite+of+unintelligible.+Hence+the+defender+of+agent-causal+free+will+%5Bwhich+Aquinas%E2%80%99s+view+more+or+less+fits+into%5D+is+not+stuck+with+the+dilemma+of+having+to+posit+either+%E2%80%98an+infinite+regress+or+a+nonrational+flip-flop.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Immortality+of+Souls%3A+a+Treatise+on+Human+Nature+%28Editiones+Scholastica%2C+2024%29%2C+ch.+4%2C+%E2%80%98The+Will%E2%80%99+Feser+is+an+Anyltical+Thomist%2C+writing+in+the+Thomist+tradition.+What+is+said+below+is+consistent+with+divine%2C+physical+predetermination.%2C+pp.+169-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe7d5eaa632.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e7d5eaa632.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=What%20makes%20it%20the%20case%20that,infinite%20regress%20or%20a%20nonrational%20flip%2Dflop&amp;text=What%20makes%20it%20the%20case%20that%20I%20do&amp;text=either%20%E2%80%98an%20infinite%20regress%20or%20a%20nonrational%20flip%2Dflop" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

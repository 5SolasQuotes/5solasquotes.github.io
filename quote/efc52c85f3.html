<main class="wrap"><figure class="quote" id="q-efc52c85f3" data-kw="">
<blockquote><p>The second matter to be considered in reference to this sacrament is the external signs. We must here take note of the signs and the ceremonies associated with them. The signs are identical to those used in meals in order to nourish and refresh the body: bread and wine. One is to be neither superstitious nor concerned regarding the kind of bread and wine. The bread and wine which Christ used were such as were available and in common use. It is credible that in light of the Passover Christ used unleavened bread; but that was incidental, for leavened bread was neither permitted to be used nor was it available in Jerusalem at that time. It is therefore not necessary to follow suit in this respect. It must be bread which one commonly uses for nourishment, thus to typify the spiritual nourishment of the soul. The wafers of the Papists and the Lutherans consist more of foam than of bread, and are not suitable for nourishment and strengthening. This is contrary to the institution of the Lord’s Supper; Christ had no wafers, but took bread, broke off fragments, and gave them to the disciples. He did not give a wafer to anyone. … Common substances must be used without superstition.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bfdd296a71" data-kw="">
<blockquote><p>But I come back to your interrogatories. You say, “The bread which our Savior brake, was surely unleavened. No other was in existence among the Jews on the Passover day. How do you justify the use of leavened bread at our sacramental table?</p></blockquote>

</figure><figure class="quote" id="q-e063738240" data-kw="">
<blockquote><p>1. In all three Gospels what Jesus gave the disciples is [in Greek] “artos,” meaning simply “bread.” It is striking that He is not said to have given them “azumos” or “azuma” which are the proper words for unleavened bread, AND which are clearly available since they are used in each of the Gospels in the context to refer to the Passover. In other words, the use of “artos” by Matthew, Mark and Luke to tell us what Jesus gave the disciples makes the fact that this may have been unleavened bread of NO importance. At the same time we also must recognize that because the Scripture NOWHERE calls it “unleavened bread,” we cannot at all be sure that it was (throughout the NT “artos” is used for common or leavened bread). We simply may not base our teaching on the silence of Scripture because then we are really basing our teaching on a human conjecture. So, the fundamental argument, “Jesus used unleavened bread, therefore we should too,” is in fundamental error. This should close the case, but there is more.

2. To use unleavened bread in the Lord’s Supper is to commemorate the wrong thing. The purpose of unleavened bread in the Passover is to commemorate the haste with which Israel left Egypt; there was not even enough time to put yeast into the bread dough. In the Lord’s Supper we are NOT commemorating the Exodus from Egypt where unleavened bread makes sense. In the Lord’s Supper we are commemorating the sacrifice of Christ for our sins. In the Supper the bread is broken to recall Christ’s suffering and death, the breaking of His body. Other things could be said, but there is nothing in unleavening the bread of the Supper that would commemorate anything in the death of Christ that is taught in Scripture (unless we really let our imaginations run loose here – and then we are back to conjecture).

3. Thus using unleavened bread in the Supper is an unwarranted return to Old Testament shadows (commemorating the Passover instead of Christ’s death) and therefore ought to be resisted. The historic Reformed characterization of the Mass as a return to OT shadows of pictorial ceremonialism is common and fits here.

4. “The kingdom of heaven is not food and drink, but righteousness and joy and peace in the Holy Spirit” (Romans 10). This teaches us that an emphasis on a detail of food is not characteristic of the New Testament, quite in contrast with the Old. Thus the insistence on unleavened bread in the Supper is more typical of an OT ceremony than an NT one. Ah, you say, this also applies to the wine. Indeed it does. None, I hope, would claim that those who use grape juice are celebrating something else than the Lord’s Supper. Nevertheless there is a positive argument to use wine in Christ’s words found in all three Gospels, “I will not eat of this fruit of the vine from now on, until I eat it new with you in the Kingdom of God.” The proper understanding of this “fruit of the vine” is wine. So we drink wine, looking forward to the heavenly supper in Christ’s presence where He will drink it with us.

5. Another old Reformed argument is that if Christ used unleavened bread, He was using the bread at hand in the Passover not out of symbolism but out of convenience. He did not go out of the way to obtain leavened bread. In the same way, runs the argument, we too should use our common bread (which IS leavened) and not go out of our way to obtain something special. This argument stands alongside one that says that in order to preserve the meaning of the Supper that we are nourished spiritually by Christ’s body, we should use the bread that we ordinarily use to nourish our bodies, and that would, of course, be leavened bread. These are theological arguments, not directly biblical, but I do think that they do carry the analogy of Scripture, especially in light of the very biblical fact that the kingdom of God is NOT details of food, as we noted above. 6. 1 Cor. 5:8 is not talking about WHAT we eat, but HOW we eat the Lord’s supper. It speaks of unleavened people, not about going back to replaying the Passover with its use of unleavened bread. The unleavened bread in the Passover reflects the haste with which Israel left Egypt, without time to even put yeast into their bread. The Lord’s supper reflects not on a hasty exit from Egypt, but on the death of Christ for our sins, which makes HIM “our passover.” The bread represents the body of Christ in the Lord’s Supper, unleavening the bread in the Supper has no significance with respect to Christ’s sacrifice. Thus using unleavened bread would, as mentioned above, be going back to the OT Passover as though we were still celebrating the Exodus from Egypt in the Supper, rather than Christ’s sacrifice for our sins. 7. In the rest of the New Testament the Lord’s Supper is often called “breaking bread,” the same language that is used for ordinary meals (Acts 2:42 for example is most likely speaking of fellowship in a meal rather than the Lord’s Supper because in the immediate context they “ate their bread from house to house.”) In any case, the word “artos” is used for what is broken. There is never a description of the Supper in the NT in which that which is broken or eaten is called anything but “artos.” This argues quite strongly against requiring unleavened bread in the Supper because “artos” in a general use would simply mean ordinary bread.</p></blockquote>

itually+by+Christ%E2%80%99s+body%2C+we+should+use+the+bread+that+we+ordinarily+use+to+nourish+our+bodies%2C+and+that+would%2C+of+course%2C+be+leavened+bread.+These+are+theological+arguments%2C+not+directly+biblical%2C+but+I+do+think+that+they+do+carry+the+analogy+of+Scripture%2C+especially+in+light+of+the+very+biblical+fact+that+the+kingdom+of+God+is+NOT+details+of+food%2C+as+we+noted+above.+6.+1+Cor.+5%3A8+is+not+talking+about+WHAT+we+eat%2C+but+HOW+we+eat+the+Lord%E2%80%99s+supper.+It+speaks+of+unleavened+people%2C+not+about+going+back+to+replaying+the+Passover+with+its+use+of+unleavened+bread.+The+unleavened+bread+in+the+Passover+reflects+the+haste+with+which+Israel+left+Egypt%2C+without+time+to+even+put+yeast+into+their+bread.+The+Lord%E2%80%99s+supper+reflects+not+on+a+hasty+exit+from+Egypt%2C+but+on+the+death+of+Christ+for+our+sins%2C+which+makes+HIM+%E2%80%9Cour+passover.%E2%80%9D+The+bread+represents+the+body+of+Christ+in+the+Lord%E2%80%99s+Supper%2C+unleavening+the+bread+in+the+Supper+has+no+significance+with+respect+to+Christ%E2%80%99s+sacrifice.+Thus+using+unleavened+bread+would%2C+as+mentioned+above%2C+be+going+back+to+the+OT+Passover+as+though+we+were+still+celebrating+the+Exodus+from+Egypt+in+the+Supper%2C+rather+than+Christ%E2%80%99s+sacrifice+for+our+sins.+7.+In+the+rest+of+the+New+Testament+the+Lord%E2%80%99s+Supper+is+often+called+%E2%80%9Cbreaking+bread%2C%E2%80%9D+the+same+language+that+is+used+for+ordinary+meals+%28Acts+2%3A42+for+example+is+most+likely+speaking+of+fellowship+in+a+meal+rather+than+the+Lord%E2%80%99s+Supper+because+in+the+immediate+context+they+%E2%80%9Cate+their+bread+from+house+to+house.%E2%80%9D%29+In+any+case%2C+the+word+%E2%80%9Cartos%E2%80%9D+is+used+for+what+is+broken.+There+is+never+a+description+of+the+Supper+in+the+NT+in+which+that+which+is+broken+or+eaten+is+called+anything+but+%E2%80%9Cartos.%E2%80%9D+This+argues+quite+strongly+against+requiring+unleavened+bread+in+the+Supper+because+%E2%80%9Cartos%E2%80%9D+in+a+general+use+would+simply+mean+ordinary+bread.%E2%80%9D%0A%0A%E2%80%94+Robert+Grossman%2C+See+here+for+a+bio.+This+quote+was+compiled+by+Andy+Webb&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe063738240.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e063738240.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=1.%20In%20all%20three%20Gospels%20what,use%20would%20simply%20mean%20ordinary%20bread&amp;text=1.%20In%20all%20three%20Gospels%20what%20Jesus%20gave&amp;text=a%20general%20use%20would%20simply%20mean%20ordinary%20bread" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Were it that we had no precept of Christ to [‘Do this’] but only the example of his doing it in the first institution, this should be a rule for us to observe it punctually, excepting in such circumstances which only occasionally and accidentally happened therein… Which doctrine we are now to try by the judgement of antiquity… In the days of Pope Julius, anno 337, there arose many giddy spirits which violated the holy institution of Christ in this sacrament when as some consecrated milk instead of wine, others sopped the bread in the cup, a third sort squeezed grapes there-into. These, and the like, that holy Pope did condemn, but how? By pretense of custom only? No, but by the obligation of Christ, his example, and institution of this sacrament, in these words following: Because these are contrary (says he) to evangelical and apostolical doctrine and ecclesiastical custom, as is easily proved from the fountain of truth, from whence the sacraments had their first ordinance; for when our Master of Truth commended this to his disciples, He gave to none milk, but bread only, and the cup. Nor does the Gospel mention the sopping of bread, but of giving bread apart, and the cup also apart, etc. So Pope Julius [see the original latin]. Long after this, the Council of Braccara (about the year of our Lord, 675) [footnote] withstood the complemental custom of receiving both kinds [of bread and wine] in dipped sops, but wot [know] you why? Hearken, even because it is not revealed in the Gospel of Christ’s institution. Ponder the Testimony in the margin [of the book] and you shall find it point-blank contradictory to your opinion and practice. Which reasoning of the bishops of that council had been very loose and lavish, except they had believed that the form of institution of Christ, concerning the participation of both kinds, was as commandatory as well for the people as the priest.</p></blockquote>

<blockquote><p>An act of Christ alone is not sufficient to form a command; for although He consecrated in white wine, or at night, for example, He did not on that account command us to consecrate” (3. Thom. De Sacra. +). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, ed. James Dennison Jr., 1997, p. 430 | 19th Topic: The Sacraments | 22nd Question: Why was the holy Supper instituted by our Lord and of how many parts does it consist? | The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever He did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks:</span></figcaption>

<main class="wrap"><figure class="quote" id="q-935e3e47e2" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water, which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears, and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now; There is sometimes an inevitable necessity by God’s providence, and sometimes a contracted necessity through want of care and foresight: in this case the work may sometimes be done, provided that our neglect beforehand be repented of:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath in The Works of Thomas Shepard… (Boston, 1853), vol. 3, Theses Sabbaticae</cite>, pp. 258-59</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641)</cite>, p. 241</span></figcaption>

</figure><figure class="quote" id="q-87ad15d57f" data-kw="">
<blockquote><p>I do highly approve the distinction following of things commanded, and things permitted on the Lord’s Day, and the explication of each member; the object of the one, all actions advancing God’s service; the object of the other, such things as are no hindrance thereunto; As in the first place works of necessity; then works of charity; yet the permitting of these, is rightly to be understood; not so as if the works of necessity here mentioned, were in such sort permitted as left to a man’s liberty, whether he will perform them or no. For undoubtedly we are bound as much as lies in our power, to quench a dangerous fire kindled in a town, on the Sabbath day, it being a work of mercy, necessarily required. For if to return a pledge ere the poor pawner of it went to his bed, in case it were his covering, were a work of mercy, how much more to save a man’s house from burning, how much more to save a whole town from being consumed, whereby many might be driven to lie without doors, void of all comfort to the body? So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641)</cite>, p. 241</span></figcaption>

</figure><figure class="quote" id="q-5a32ebb715" data-kw="">
<blockquote><p>Yea there are among you now many things of a lower [superstitious] nature, which some dare scarce plainly say God commands or forbids, and yet they are censorious enough about them: As heretofore many were… against dressing meat or feasting at least, on the Lord’s Day (which is a day of thanksgiving of divine institution)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 58</cite>, p. 293</span></figcaption>

</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 19, Creation</cite>, p. 344</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

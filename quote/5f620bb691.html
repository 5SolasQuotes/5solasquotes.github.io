<main class="wrap"><figure class="quote" id="q-5f620bb691" data-kw="">
<blockquote><p>…the assignment of precise labels (favorable to the doctrine/against the doctrine) in the history of the doctrine of the imputation of Christ’s active obedience becomes possible only after Piscator raised his voice against Beza. In short, there was no early consensus against which Piscator argued. Doctrinal consensus, limited as it was, arose only after the debates of the early seventeenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/de-campos-jr-heber-carlos.html">de Campos, Jr., Heber Carlos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Piscator</cite>, (1546-1625) &amp; the Consequent Development of the Doctrine of the Imputation of Christ’s Active Obedience PhD diss. (Calvin Theological Seminary, 2009) 370 pp., p. 287</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“…the assignment of precise labels (favorable to the doctrine/against the doctrine) in the history of the doctrine of the imputation of Christ’s active obedience becomes possible only after Piscator raised his voice against Beza. In short, there was no early consensus against which Piscator argued. Doctrinal consensus, limited as it was, arose only after the debates of the early seventeenth century.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c764db3f2" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668) | But the Jesuit himself in the same place, arg. 4, responds for us:, ch. 9, On Universal Redemption, on 1 Pet. 2:24, pp. 259-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-345b4817ae" data-kw="">
<blockquote><p>2. In accepting us as righteous in Christ, who died for our sins to reconcile us unto God; and therefore sometimes he is said to be made righteousness to us, 1 Cor. 1:30, and we are said to be made the righteousness of God in Him, 2 Cor. 5:21, that is, we have the effect of his sufferings, as if we had suffered in person; for they were undergone in our stead and for our sakes, and the fruit of it given to us by God Himself.</p></blockquote>

</figure><figure class="quote" id="q-766b45942f" data-kw="">
<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.”

— Robert Rollock, ‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+the+imputation+of+righteousness%2C+a+meritorious+claim+upon+life+and+the+reward+of+life+itself+equally+follow.+For+just+as+the+sentence+of+sin%E2%80%99s+remission+has+regard+to+three+things%E2%80%94sin%2C+liability+to+punishment%2C+and+punishment+itself%E2%80%94so+the+sentence+of+justification+has+regard+to+three+things%E2%80%94Christ%E2%80%99s+righteousness+or+satisfaction%2C+that+merit+which+belongs+to+Christ%E2%80%99s+righteousness+or+satisfaction+%28for+his+satisfaction+is+meritorious+of+eternal+life%29%2C+and+life+itself.%E2%80%9D%0A%0A%E2%80%94+Robert+Rollock%2C+%E2%80%98Treatise+on+Justification%E2%80%99+tr.+Aaron+Denlinger+%26+Noah+Phillips+MAJT+27+%282016%29%2C+1.4.2.+%E2%80%98The+Imputation+of+Righteousness%E2%80%99%2C+pp.+107-8+Rollock+%28c.+1555-1599%29+was+a+Scottish+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F766b45942f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/766b45942f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=From%20the%20imputation%20of%20righteousness%2C%20a,of%20eternal%20life%29%2C%20and%20life%20itself&amp;text=From%20the%20imputation%20of%20righteousness%2C%20a%20meritorious%20claim&amp;text=is%20meritorious%20of%20eternal%20life%29%2C%20and%20life%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-86ce0050dd" data-kw="">
<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.3</span></figcaption>

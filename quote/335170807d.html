<main class="wrap"><figure class="quote" id="q-335170807d" data-kw="">
<blockquote><p>Reply to Objection 3: …Yet we must bear in mind that not every individual in the genus of substance, even in rational nature, is a person, but that alone which exists by itself, and not that which exists in some more perfect thing. Hence the hand of Socrates, although it is a kind of individual, is not a person, because it does not exist by itself, but in something more perfect, viz. in the whole [of Socates, who has a suppositum]. And hence, too, this is signified by a ‘person’ being defined as ‘an individual substance,’ for the hand is not a complete substance, but part of a substance. Therefore, although this human nature is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 2, ‘Whether the union of the Incarnate Word took place in the Person?’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f929e5d996" data-kw="">
<blockquote><p>45. The personality of the divine nature of Christ is by or in itself; the personality of his human nature is by assumption. The reason is that the divine and human nature of Christ do not equally constitute the person of Christ, because this would be opposed to the eternity and immutability of the divine nature. For it is impossible that something that happened in time, constitutes the existence of something that exists from eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy (1644), ch. 11, ‘On the Person &amp; Office of Christ’</cite>, pp. 221-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-a469aee8d1" data-kw="Faith">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</span></figcaption>

</figure><figure class="quote" id="q-1e78844179" data-kw="Sanctification Original Sin">
<blockquote><p>As our natural corruption was produced originally in the first Adam, and propagated from him to us, so our new nature and holiness is first produced in Christ, and derived from Him to us, or as it were propagated. So that we are not at all to work together with Christ, in making or producing that holy frame in us, but only to take it to ourselves, and use it in our holy practice, as made ready to our hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, Direction III (ch. 3), “One great mystery”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a> › <a href="../topics/union-with-christ/nature-of-union/federal-union.html">Federal union</a></span></div>

</figure><figure class="quote" id="q-10f0cad08d" data-kw="">
<blockquote><p>The fifth and last, is of the branch and tree into which it is engraffed; as suppose a vine-branch and an olive-tree: now as this olive-tree is but one, but has two different natures in it, and so it beareth two kinds of fruit: and yet between the tree and the branch there is a composition, not hujus ex his, but hujus ad hoc (i.e.) not of a third thing out of the two things united, but of one of the two things united or adjoyned to the other: Even so Christ is one, but He has two different natures, and in them He performs the different actions pertaining to either of them: and yet between the different natures (the divine and human nature) there is a composition, not hujus ex his but hujus ad hoc, not of a third nature arising out of these, but of the humane nature added or united to the divine, in unity of the same person: so that now we may say, as this vine is an olive-tree, and this olive-tree is a vine: or as this vine bears olives, and this olive-tree bears grapes, so the Son of man is the Son of God, and the Son of God is the Son of Man: or this Son of Man laid the foundation of the earth, and this Son of God was born of Mary, and crucified by the Jews. This similitude (I take it) is the aptest and fullest of all the other, though in some things also it does fail; for the branch has first a separate subsistence in itself, and losing it after, then it is drawn into the unity of the subsistence of that tree into which it is implanted; but it is otherwise with the human nature of Christ; it never had any subsistence of its own, until it was united to the person or subsistence of the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking unto Jesus... (London, 1680), bk. 4, ch. 1, section 5</cite>, p. 129</span></figcaption>

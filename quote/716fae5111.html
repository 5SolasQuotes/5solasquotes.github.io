<main class="wrap"><figure class="quote" id="q-716fae5111" data-kw="">
<blockquote><p>These things cannot occur until we have been justified by faith, and, regenerated, we receive the Holy Ghost: first, because the Law cannot be kept without [the knowledge of] Christ; and likewise the Law cannot be kept without the Holy Ghost. But the Holy Ghost is received by faith, according to the declaration of Paul, Gal. 3:14, ‘That we might receive the promise of the Spirit through faith.’ … Wherefore, when Paul says, Rom. 3:31, ‘We establish the Law through faith,’ by this we ought to understand, not only that those regenerated by faith receive the Holy Ghost, and have movements agreeing with God’s Law, but it is by far of the greatest importance that we add also this, that we ought to perceive that we are far distant from the perfection of the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession</cite>, Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004) | pt. 6, Article 3, Of Love and the Fulfilling of the Law</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b2f84960d" data-kw="seed of God habitual actual">
<blockquote><p>From which results an active power of converting himself (such as the Scriptures mean by the “new heart,” the “seed of God,” “eyes,” “ears,” “mind” and the like denoting something inherent and permanent). But because this first degree would be of no avail without the second, habitual is followed by actual conversion (by which man puts forth acts, God drawing forth from the healed and changed will itself the very act of believing and conversion and the soul itself thus moved freely eliciting its own act). In this sense, God is said to give not only the power of believing, but the belief itself (Phil. 1:29) and “to will and to do” (Phil. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.4.13–14</span></figcaption>

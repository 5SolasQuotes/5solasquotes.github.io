<main class="wrap"><figure class="quote" id="q-886a61bd3d" data-kw="">
<blockquote><p>38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.”

t=the%20convenient%20subordination%20of%20them%20inverted%20through%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d29fc826aa" data-kw="">
<blockquote><p>Let every one of you, brethren, give thanks to God in his own order, living in all good conscience, with becoming gravity, and not going beyond the rule of the ministry prescribed to him. Not in every place, brethren, are the daily sacrifices offered, or the peace-offerings, or the sin-offerings and the trespass-offerings, but in Jerusalem only. And even there they are not offered in any place, but only at the altar before the temple, that which is offered being first carefully examined by the high priest and the ministers already mentioned. Those, therefore, who do anything beyond that which is agreeable to His will, are punished with death [Lev. 10]. You see, brethren, that the greater the knowledge that has been vouchsafed to us, the greater also is the danger to which we are exposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to the Corinthians</cite>, ch. 41</span></figcaption>

</figure><figure class="quote" id="q-99c07b0501" data-kw="">
<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship in Guides to the Reformed Tradition</cite>, (John Knox Press, 1984), p. 153</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-8de93cabef" data-kw="">
<blockquote><p>Whether will these [Separatist] men allow one Christian to sing a psalm alone by himself, methinks the texts and examples mentioned, together with Jam. 5:13… are so plain as no rational man can deny it; But if one may, then the Church may. There is no act of worship which any member of the Church is bound to perform, but the Church is bound to perform; but on the contrary it is not true that what worship the Church does perform, a member of Church can, or may; For instance for the first part, meditation needs no organ of the body, and therefore I leave that. But does a member of the Church pray, so does the whole Church: does he read the Scriptures? so they are read in the Church; does he fast and pray? so does the Church; does he sing a psalm? so does the Church; But it is not true on the contrary, as appears in the sacraments, preaching, discipline, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined</cite>, … (London: 1652), pp. 35-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c832054943" data-kw="">
<blockquote><p>For the receiving of the sacrament being a mediate worship of God, wherein the elements come between God and us, in such sort that they belong to the substance of the worship (for without the elements, the sacrament is not a sacrament)… for as much as in the act of receiving, both our minds, and our external senses are and should be fastened upon them… For in every mediate worship, wherein some creature is purposely set between God and us to have state in the same, it is idolatry to kneel before such a creature, whiles both our minds and senses are fastened upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4; pp. 68-69</span></figcaption>

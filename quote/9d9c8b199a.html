<main class="wrap"><figure class="quote" id="q-9d9c8b199a" data-kw="">
<blockquote><p>IV. …This must be opposed to the Lutherans who hold that heaven to be uncreated and feign that it is illocal (illocale) and incorporeal and everywhere (in order to weaken the argument drawn from the ascension of Christ to Heaven against the ubiquity [everywhere-ness] of his body).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, 5th Topic, ‘Creation’, 6th Question, p. 447</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80e7476069" data-kw="">
<blockquote><p>The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, 3. ‘Was Christ during the three days of his death and burial a true man?’ in Theoretical Practical Theology (RHB), vol. 4, bk. 5, ch. 13, Polemical Part, §XIII, pp. 466-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.”

</figure><figure class="quote" id="q-4f7ee19965" data-kw="">
<blockquote><p>Thomas Aquinas’s Commentary on the Sentences is, alas, rarely read. Thanks to Krause’s English translation of the gigantic q. 2 of book 4, distinction 49 (on the beatific vision), however, Aquinas’s early thought on this important theological and philosophical puzzle is now accessible to a wider readership.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thomas Aquinas’s Commentary on the Sentences is, alas, rarely read. Thanks to Krause’s English translation of the gigantic q. 2 of book 4, distinction 49 (on the beatific vision), however, Aquinas’s early thought on this important theological and philosophical puzzle is now accessible to a wider readership.”

</figure><figure class="quote" id="q-b22aa1c0a9" data-kw="">
<blockquote><p>I. There are three kinds or differences of life: there is a life of nature, which the apostle calls Natural. There is a life of Grace, which the sons of God alone do enjoy in this world: there is a life of Glory, which consists in the vision of God.

II. Life eternal is two ways taken: Metonymically, both for the way to life, and for Christ Himself: Properly, for the state of the blessed after this life.

III. There is one vision of God natural, in the things created; another specular, or symbolical, by resemblances and signs; another of faith, by the doctrine and doings of Christ; another of present sight, or of glory to come, when we shall see God face to face.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confuting, of Life Eternal, pp. 594-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-e7a46e733c" data-kw="">
<blockquote><p>Controversy XVI: Is it lawful to do good for the sake of the eternal reward? [Romanist] Position of Bellarmine: It is lawful and useful to do good for the sake of the eternal reward as a meritorious work. The saints were moved to true piety in this way, like Moses (Hebrews 11), David (Psalm 119), and Paul (Philippians 3). And the apostles use this argument to exhort to piety (1 Corinthians 9; Galatians 6; Colossians 3). Orthodox Position: In doing good, we should primarily seek God and His glory as the ultimate end (Colossians 3) and secondarily our salvation. Subordinate ends are not incompatible. And our salvation is closely linked to God’s glory. Moreover, this is done to stir our zeal. And this is what is proved by the cited passages. Care must always be taken to love God for Himself, not for our own benefit, with the love of friendship, not of concupiscence, so that it is not a mercenary friendship. Therefore, Bernard says: ‘God is not loved without reward, though He should be loved without the intention of reward.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy XVI: Is it lawful to do good for the sake of the eternal reward? [Romanist] Position of Bellarmine: It is lawful and useful to do good for the sake of the eternal reward as a meritorious work. The saints were moved to true piety in this way, like Moses (Hebrews 11), David (Psalm 119), and Paul (Philippians 3). And the apostles use this argument to exhort to piety (1 Corinthians 9; Galatians 6; Colossians 3). Orthodox Position: In doing good, we should primarily seek God and His glory as the ultimate end (Colossians 3) and secondarily our salvation. Subordinate ends are not incompatible. And our salvation is closely linked to God’s glory. Moreover, this is done to stir our zeal. And this is what is proved by the cited passages. Care must always be taken to love God for Himself, not for our own benefit, with the love of friendship, not of concupiscence, so that it is not a mercenary friendship. Therefore, Bernard says: ‘God is not loved without reward, though He should be loved without the intention of reward.&#x27;”

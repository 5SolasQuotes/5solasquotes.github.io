<main class="wrap"><figure class="quote" id="q-469b4fbcfa" data-kw="">
<blockquote><p>The word Jehovah in the Hebrew, which is here translated [Lord] signifies (as Divines observe) three things, which are proper only to the Divine Essence.

First, God’s eternal, immutable, and independent being.

Secondly, his giving of being to the creature, and therefore the name (Jehovah) is not mentioned till the Creation was perfect, and then we read Jehovah Elohim, Gen. 2.4.

Thirdly, this name (Jehovah) signifieth God’s faithful giving of being unto his word and promises; and in this sense God saith, that his name Jehovah was not known to Abraham, Isaac, and Jacob, Exod. 6.3. that is, they found not the experimental significancy of it in the performance of the promise. If Jehovah be God, follow him, i. e. serve him, worship him. But if Baal, then follow him. Baal signifies a Lord or Patron; the Heathens called the Sun by that name, which is the King or chief of the Planets.

The Phoenicians worshipped the Sun under the name of Baal-samen, the same with Jupiter Olympicus, which they called the Lord of heaven; as they termed the Moon the Queen of heaven, which was the Diana so much magnified by the Ephesian Idolaters. Some take Moloch, and Baal to be one, and the same Idol, comparing Jer. 9.5. with Jer. 32.35. The Prophet Hosea in detestation of this Idol calleth him Shame: They went to Baal-Peor and separated themselves to that Shame, Hose. 9.10. and the Greek Interpreters translate Baal, Shame, 1 King. 18.35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-salwey.html">Arthur Salwey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Halting stigmatized in a sermon preached to the Honorable House of Commons on the monthly fast day, Octob. 25. 1643. at Margaret’s Westminster</cite>, (London: Christopher Meredith, 1644), pp 4-5.</span></figcaption>

<blockquote><p>(2) There is dignitas convenientiae [worthiness of fitness], which consists, though not in a perfect and exact proportion, yet in some fitness and meetness unto that which is required. Thus, in scripture, are we commanded ‘to walk worthy of the Lord,’ worthy of our profession, worthy of the gospel… And thus must we come worthily: that is, so fitted and prepared as may bear some resemblance and agreement to the solemnity of the work that we go about. And in this sense, this worthiness follows that worthiness which is called by divines dignitas dignationis — ‘a worth of acceptance’, or a desiring of God to take our actions in good part for Christ’s sake, and to pardon the many failings that accompany them.</p></blockquote>

<blockquote><p>Q. 2. Why will God have a Sabbath on earth?

</figure><figure class="quote" id="q-d5fc83548e" data-kw="">
<blockquote><p>Thirdly, as man is a creature endued with reason, the Law of Nature teacheth him, 1. Something concerning God. 2. Something concerning his Neighbour. 3. Something concerning himself. I mean some general notions concerning good and evil, in respect of Each of these. Whereof the Apostle meaneth, whiles he saith, that the Gentiles shew the work of the Law written in their hearts. First then, the Law of Nature teacheth man, to know that there is a God, and that this God is to be worshipped. Whereupon it followeth, that man should seek to know God, and the manner of his worship. Now that which may be known of God, is shewed even unto the Gentiles. The Apostle saith signanter [distinctly] τὸ γνωστὸν τοῦ θεοῦ [what is known about God], meaning those few and small sparkles of the knowledge of God, which natures imbred light discovered unto the Gentiles, for making them inexcusable, namely, that there is a[n] eternal power and Godhead, which men ought to reverence and to worship.

2. The Law of Nature teacheth man to hold fast friendship and amity with his Neighbours, for as much as he is Animal sociale [a social animal]. Violare alterum saith Cicero, naturae lege prohibemur. [We are forbidden to do dishonour to another by the law of nature.] For the Law of Nature biddeth us do to others as we would have them to do unto us. And from these precepts it followeth, that we should not offend other men, that we should keep promises, stand to bargains, give to every man his own, &amp;c.

3. As touching a man’s self, the Law of Nature teacheth him, that he should not live as a reasonless creature, but that all his actions should be such, as may be congruous and beseeming for a creature endued with reason. Whereupon it followeth, that he should live honestly and virtuously, that he should observe order &amp; decency in all his actions, &amp;c. Hence the Apostle saith, that nature itself teacheth, that it is a shame for a man to have long hair, because it is repugnant to that decency and comeliness which the Law of Nature requireth. For among other differences which Nature hath put betwixt men and women, this is one, that it hath given to women thicker and longer hair, then to men, that it might be as a vail to adorn and cover them. The reason whereof, Nature hath hid in the complexion of a woman, which is more humid then the complexion of a man. So that if a man should take him to this womanish ornament, he should but against Nature transform himself (in so far) into a woman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), Part III, pp 199-200.</span></figcaption>

eature%2C+but+that+all+his+actions+should+be+such%2C+as+may+be+congruous+and+beseeming+for+a+creature+endued+with+reason.+Whereupon+it+followeth%2C+that+he+should+live+honestly+and+virtuously%2C+that+he+should+observe+order+%26+decency+in+all+his+actions%2C+%26c.+Hence+the+Apostle+saith%2C+that+nature+itself+teacheth%2C+that+it+is+a+shame+for+a+man+to+have+long+hair%2C+because+it+is+repugnant+to+that+decency+and+comeliness+which+the+Law+of+Nature+requireth.+For+among+other+differences+which+Nature+hath+put+betwixt+men+and+women%2C+this+is+one%2C+that+it+hath+given+to+women+thicker+and+longer+hair%2C+then+to+men%2C+that+it+might+be+as+a+vail+to+adorn+and+cover+them.+The+reason+whereof%2C+Nature+hath+hid+in+the+complexion+of+a+woman%2C+which+is+more+humid+then+the+complexion+of+a+man.+So+that+if+a+man+should+take+him+to+this+womanish+ornament%2C+he+should+but+against+Nature+transform+himself+%28in+so+far%29+into+a+woman.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+dispute+against+the+English-popish+ceremonies%2C+obtruded+upon+the+Church+of+Scotland%2C+%28n.p.%2C+1637%29%2C+Part+III%2C+pp+199-200.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd5fc83548e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d5fc83548e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/22/george-gillespie-on-what-we-can-learn-from-the-law-of-nature/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-f2c4758b95" data-kw="">
<blockquote><p>And those things which are commanded [in the Book of Common Prayer respecting a Communion for the sick, with a minister and three or four Christians] in this behalf do well enough agree with the Holy Scriptures: for to receive the Communion of the Lord, and to be partaker of his Table, does not a little avail unto the comfort of afflicted consciences, if it be received according to the Lord’s institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Censures upon the Communion Book as trans. and quoted by John Whitgift, The Defense of the Answer to the Admonition Against the Reply of T.C., by John Whitgift... (London, 1574), ‘Of Private Communion…’</cite>, p. 528</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“And those things which are commanded [in the Book of Common Prayer respecting a Communion for the sick, with a minister and three or four Christians] in this behalf do well enough agree with the Holy Scriptures: for to receive the Communion of the Lord, and to be partaker of his Table, does not a little avail unto the comfort of afflicted consciences, if it be received according to the Lord’s institution.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-467f7d5ce5" data-kw="">
<blockquote><p>Pastors cannot excommunicate those of another congregation, or heathen; Therefore, [according to a congregationalist] they cannot teach them as pastors. It follows not, ex negatione speciei, non sequitur negatio generis [out of the negation of a species the negation of a genus does not follow]: This is not a man, therefore this is not a living creature. So: 1. A single pastor, he alone cannot excommunicate an offender of his own congregation; for one man is not a Church, therefore he cannot preach as a pastor to this offender. The consequence is most false… 2. Paul and Barnabas preach as sent pastors authorized both by God, and the laying on of hands, and praying of the prophets at Antioch, Acts 13; but they have no power to excommunicate the gentiles, who are yet no members of the Church, nor baptized. Paul, Acts 16:15, is sent to preach to Macedonia, without their choosing him to be their pastor; and yet Paul could not cast out those that were no members until they should be member.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline… (London, 1658), bk. 4, ch. 10</cite>, p. 470</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-79407cc701" data-kw="">
<blockquote><p>Which shows (by the way) that your private mass and Communion under one kind was against the tradition and order of the apostles, by the judgment of the Church of Rome and Popes themselves above a thousand years after Christ (For Hildebrand was Pope in the year of Christ, 1,084).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds [a puritan] &amp; John Hart [a Romanist] touching the Head &amp; the Faith of the Church… (London, 1584) Rainolds (1549–1607)</cite>, p. 583</span></figcaption>

</figure><figure class="quote" id="q-1b02549668" data-kw="">
<blockquote><p>No baptism shall be administred but in Church assemblies or where there is a formed public Church. But where there is no public Church and the parents through infirmity are afraid to carry them unto public baptism in the congregation, ministers shall consult how far in prudence they ought to yield unto them. Yet nevertheless there shall be some face of a Church and both exhortation and prayer; but if there be no Church, and a congregation cannot be assembled, the minister shall not make any difficulty to baptize the infants of believing parents tendered to him, with exhortation and prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/qualifications.html">Qualifications</a></span><span class="wk"><span class="lbl">Work:</span> <cite>French Reformed Churches | John Quick, Synodicon (London, 1692) | The Discipline of the Reformed Churches of France (1559), ch. 11, Canon 6</cite>, p. xlv</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-1dc5a90de5" data-kw="">
<blockquote><p>But dost thou think that nothing ought to be determined concerning the place [for baptism]? Answer: Yea, seeing all things must be done in the Church comely and in order: and forasmuch as baptism is a part of the ministry of the Gospel, I think that one and the same place is to be used both for the Word and sacraments, so as baptism be ministered in the public congregation of the Church and with common prayer [mid-week], neither will I rashly admit those, I cannot tell what, cases of necessity, that some allege to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Other Part of Christian Questions &amp; Answers, which is concerning the Sacraments… (London, 1580), 151st Question</cite></span></figcaption>

<blockquote><p>At the union of the Seceders with the Synod of Ulster in 1840, the sixth question in the formula used at the ordination of ministers belonging to the new Presbyterian Church in Ireland asked:

Do you acknowledge the moral obligation of public religious covenanting, and do you hold it your duty to maintain and prosecute the reformation work of our covenanted fathers of the Church of Scotland?</p></blockquote>

<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as:

1. Unwritten traditions—not necessary, not written.

2. Human mystical, symbolical signs and ceremonies—not necessary, not written.

3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written.

4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, p. 87</span></figcaption>

</figure><figure class="quote" id="q-56c9eecbf0" data-kw="">
<blockquote><p>They [Brownists] except against our ministers because they receive their ordination from bishops. To which I answer: We have our ordination from Christ by bishops and clergymen; and for this kind of ordination by bishops and presbyters we have the universal consent of the primitive Church; by St. Paul, Timothy, and Titus were ordained. And this has been the practice of all the Christian Churches of the universe until the time that Anabaptists crept into the world. But they will allege that we have been ordained by Antichristian bishops, and therefore they conclude every action done by our ministers to be Antichristian. To which I answer: Why is not the ordination that our forefathers had from Antichristian bishops as effectual as the baptism that was administered by them to our forefathers? Did ever any Reformed Church rebaptize them that were baptized by them? And why should our ministers be reordained more than rebaptized? Indeed our ministers being ordained by bishops and that by Protestant bishops, such as Cranmer, Latimer and Ridley, who were holy martyrs, who renounced all superstition; what exceptions can be taken against them? Neither can they find any shelter under that noted text, ‘neglect not the gift that is in thee by the imposition of the hands of the presbytery,’ which learned Mr. [John] Calvin expounds not of the men, but of the office, following herein Jerome, Anselm, Haimo, Lyra, referring it to the gift given him and to the bishops and presbyters, which has been the practice of the Church of England and all Christian Churches in the world until the Anabaptists. To conclude, let the Brownists confess our bishops to be but Christians, which they cannot deny, and the ordination of our ministers will be lawful by their own rules: for if the ordination of their ministers by plebeian artificers be lawful, how much more is the ordination of our ministers by bishops and learned ministers, qualified with learning and wisdom and set apart to do the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times</cite>, (London: Wilson, 1645), ‘Of the Brownists’, 15. ‘Except against our Ordination’, p. 60</span></figcaption>

</figure><figure class="quote" id="q-e271a9cc48" data-kw="">
<blockquote><p>The third consideration is that there is some footsteps of this identity of bishop and presbyter in the most corrupt writtings of the most impure schoolmen: which may appear in these three: 1. In that, generally, episcopacy is holden to be no distinct order from presbytery; and that presbytery, or priesthood (as they speak) is the highest order in all their hierarchy. And this is current as the doctrine of Lombardus the Master of Sentences, Hugo, Aquinas, Thomas Waldensis, and generally of all the Thomists at least. And though they seem to make bishops to be of a more eminent degree, yet by Estius and some others alleged by him, this is not thought sufficient to distinguish one office from another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation, (Edinburgh, 1658), pp. 223-33, p. 227</span></figcaption>

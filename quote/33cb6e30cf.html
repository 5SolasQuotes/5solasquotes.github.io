<main class="wrap"><figure class="quote" id="q-33cb6e30cf" data-kw="">
<blockquote><p>[T]here is no Error nor Evil so fatal, as that which wears the fairest Mask of Truth and Good; as an Enemy is most fatal in his nearest Approaches: Thus it is, that when Satan gets Men carried off unto the Noticing of that Error and Evil, only, which is coarse and rough, he lulls them asleep, and ruins them, by Refinements.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-gib.html">Adam Gib</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning Against Countenancing the Ministrations of Mr. George Whitefield, Published in the New Church at Bristow, upon Sabbath, June 6. 1742. Together with an Appendix upon the Subject, Wherein are shewn, that Mr. Whitefield is no Minister of Jesus Christ; that his Call and Coming to Scotland are </cite>, (Edinburgh: David Duncan, 1742), iv.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-722c3c783d" data-kw="">
<blockquote><p>Dr. Girardeau has defended the old usage of our church with a moral courage, loyalty to truth, clearness of reasoning and wealth of learning which should make every true Presbyterian proud of him, whether he adopts his conclusions or not. The framework of his arguments is this: it begins with that vital truth which no Presbyterian can discard without a square desertion of our principles. The man who contests this first premise had better set out at once for Rome: God is to be worshipped only in the ways appointed in his word. Every act of public cultus not positively enjoined by him is thereby forbidden. Christ and his apostles ordained the musical worship of the New Dispensation without any sort of musical instrument, enjoining only the singing with the voice of psalms, hymns, and spiritual songs. Hence such instruments are excluded from Christian worship. Such has been the creed of all churches, and in all ages, except of the Popish communion after it had reached the nadir of its corruption at the end of the thirteenth century, and of its prelatic imitators.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Girardeau on Musical Instruments</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-024bd578e7" data-kw="">
<blockquote><p>What is meant by our forgiving them [Mt. 6:12]? It is our hearty forgiving them the injury done to us (to forgive the injury against God is not in our power), entertaining no hatred or malice against them, but loving them with a love of goodwill, heartily wishing their good, and being ready to do them good, Mt. 5:44-45: ‘But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, pray for them that despitefully use you, and persecute you; that ye may be the children of your Father which is in heaven, for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.’ But it does not extend to a love of complacency or delight in them in whom there appears no ground for that, either as men or as Christians. Ps. 26:4, ‘I have not sat with vain persons,’ says David, ‘neither will I go in with dissemblers.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity in Works</cite>, vol. 2, pp. 617-18</span></figcaption>

</figure><figure class="quote" id="q-fcf7558c44" data-kw="">
<blockquote><p>…where both [both things to be preserved] cannot be jointly put out of danger: but all this amounts not to a disobligement from the endeavor of preserving them all; nor to a liberty upon any emergency of active, direct and purposed making away or removing of any of them, though under pretense of securing the other. I have read of one Alcon, who finding his son fast on sleep upon the grass, and a serpent creeping upon his breast, he not apprehending how otherwise it was possible to save his son, took his bow and shot at the serpent upon the boys breast, which (though to the manifest endangering of his life) yet he chose rather to take that course than by suffering the serpent to leave his life to a more certain destruction; And either his art or good hap was such as that he prevented and slew the serpent and preserved his son: those whom we are bound and most solicitous to preserve, we may upon an extreme exigence put in some hazard that we may preserve them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers</cite>, … (London, 1650), ch. 4, pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>…the duels which have been fought between princes, which have determined their quarrels by the monomachy of man to man. The crown of England was sometimes in that sort disputed, between Edmund Iron-side, and Canute the Dane: Edward III offered as much to the king of France; the French king to the Emperor Charles V; and Henry the Great, father of our most illustrious queen, made offer to the Duke of Guise his competitor to put a period to their difference by point of spear, his person against his, six against six, or hundred against hundred. I will not say that it is lawful to a prince so to hazard the head of the commonwealth, and in his person, all the body of his estate, but when this way is permitted them, it is, because sovereign princes have not any judge above them who can do them right, so that to obtain reason from their hands who are elevated to as high a pitch of dignity as themselves, there is not any other way but by arms; and these their doings have an outward show of charity: for a prince will say, that he likes better to expose his own person to danger than to see a bloody war that should swallow up many thousands of men and give occasion of an infinite slaughter. And it may be that some people desirous to avoid a general conflict of nation against nation, have sometimes remitted their quarrel to a certain number of men, to be chosen by either side by them to be decided by combat. So three hundred Lacedemonians fought against a like number of the Argiens; three Romans against three Latins; and when David and Ishboseth stood competitors for the royalty, the two generals Joab and Abner caused a combat between twelve soldiers of the tribe of Judah against twelve of the tribe of Beniamin [2 Sam. 2:12-17]. This kind of duel is as it were an abridgement of the war, and yet not very justifiable. There is more appearance in this case than in any of the cases aforementioned: Two armies are ready to fight, he that has the right on his side finds himself inferior in forces, so that if they come to handy-strokes we must all die of necessity: The enemy makes an offer of a single fight, one to one, and offers to stand to the event of this duel; why should we all perish and not rather make legal of this way and expedient, which perchance may give us the victory, or at least will save six thousand men’s lives, and there can but one be slain? But this example has no correspondence with the [private] duel, whereof we now treat, and one may not draw into consequence particular actions which are exploited in war or in the consequence of war, especially in heat of battle…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-duello. The Anatomy of Duels</cite>, … (London: Harper, 1632), pp. 11-14 D’Espagne (1591-1659) was a French protestant pastor and theologian who lived in London for a significant time.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

ers+of+the+tribe+of+Judah+against+twelve+of+the+tribe+of+Beniamin+%5B2+Sam.+2%3A12-17%5D.+This+kind+of+duel+is+as+it+were+an+abridgement+of+the+war%2C+and+yet+not+very+justifiable.+There+is+more+appearance+in+this+case+than+in+any+of+the+cases+aforementioned%3A+Two+armies+are+ready+to+fight%2C+he+that+has+the+right+on+his+side+finds+himself+inferior+in+forces%2C+so+that+if+they+come+to+handy-strokes+we+must+all+die+of+necessity%3A+The+enemy+makes+an+offer+of+a+single+fight%2C+one+to+one%2C+and+offers+to+stand+to+the+event+of+this+duel%3B+why+should+we+all+perish+and+not+rather+make+legal+of+this+way+and+expedient%2C+which+perchance+may+give+us+the+victory%2C+or+at+least+will+save+six+thousand+men%E2%80%99s+lives%2C+and+there+can+but+one+be+slain%3F+But+this+example+has+no+correspondence+with+the+%5Bprivate%5D+duel%2C+whereof+we+now+treat%2C+and+one+may+not+draw+into+consequence+particular+actions+which+are+exploited+in+war+or+in+the+consequence+of+war%2C+especially+in+heat+of+battle%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Jean+D%E2%80%99Espagne%2C+Anti-duello.+The+Anatomy+of+Duels%2C+%E2%80%A6+%28London%3A+Harper%2C+1632%29%2C+pp.+11-14+D%E2%80%99Espagne+%281591-1659%29+was+a+French+protestant+pastor+and+theologian+who+lived+in+London+for+a+significant+time.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8f38e5524.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8f38e5524.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-6th-commandment/#:~:text=the%20duels%20which%20have%20been%20fought,war%2C%20especially%20in%20heat%20of%20battle&amp;text=the%20duels%20which%20have%20been%20fought%20between%20princes&amp;text=consequence%20of%20war%2C%20especially%20in%20heat%20of%20battle" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-3b863572e3" data-kw="">
<blockquote><p>We know so much of divine truth, my reader, as we have in a measure a personal experience of it in our souls. The mere speculatist and notionalist in religion is as unsatisfactory and unprofitable as the mere theorist and declaimer in science. For all practical purposes both are but ciphers. The character and the degree of our spiritual knowledge begins and terminates in our knowledge of Christ. Christ is the test of its reality, the measure of its depth, and the source of its growth. If you are advancing in an experimental, sanctifying acquaintance with the Lord Jesus, you are advancing in that knowledge which Paul thus estimates: “I count all things but loss for the excellency of the knowledge of Christ Jesus, my Lord.”

Dear reader, let the chief object of your study be to know the Lord Jesus. It may be in the region of your sinfulness, emptiness, weakness, and foolishness that you learn Him — nevertheless, however humiliating the school, slow the progress, and limited the attainment, count every fresh step you make in a personal acquaintance with the Lord Jesus as a nobler triumph, and as bringing you into the possession of more real wealth than were the whole chests of human knowledge and science mastered, and its untold treasures poured at your feet.

When adversity comes — when death approaches — when eternity unveils — oh! — how indescribably valuable, how inconceivably precious will then be one faith’s touch, one faith’s glimpse of a crucified and risen Saviour! All other attainments then vanish, and the only knowledge that abides, soothes, and comforts, is a heartfelt acquaintance with the sublimest fact of the Gospel, that “Christ Jesus came into the world to save sinners.” Oh! Whatever other studies may engage your thoughts, forget not, as you value your eternal destiny, to study the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Go and Tell Jesus</cite>, (75th edn, New York: A. D. F. Randolph &amp; Co., 1869), pp 8-10.</span></figcaption>

<blockquote><p>O wretched Man! where shall I begin to describe thine endless misery, who art condemned as soon as conceived; and adjudged to eternal death, before thou wast born to a temporal life? A beginning indeed, I find, but no end of thy miseries. For when Adam and Eve, being created after God’s own image, and placed in Paradise, that they and their posterity might live in a blessed state of life immortal, having dominion over all earthly creatures, and only restrained from the fruit of one tree, as a sign of their subjection to the almighty Creator; though God forbade them this one small thing, under the penalty of eternal death; yet they believed the devil’s word before the word of God, making God, as much as in them lay, a liar.

And so being unthankful for all the benefits which God bestowed on them, they became malcontent with their present state, as if God had dealt enviously or niggardly with them; and believed that the devil would make them partakers of far more glorious things than ever God had bestowed upon them; and in their pride they fell into high-treason against the Most High; and disdaining to be God’s subjects, they affected blasphemously to be gods themselves, equals to God. Hence, till they repented (losing God’s image) they became like the devil; and so all their posterity, as a traitorous brood (whilst they remain impenitent, like thee) are subject in this life to all cursed miseries, and, in the life to come, to the everlasting fire prepared for the devil and his angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), p. 28.</span></figcaption>

</figure><figure class="quote" id="q-cc2047aed6" data-kw="">
<blockquote><p>First, it will be expedient that all the ministers, for conserving purity and concord of doctrine among themselves, meet together one certain day each week, for discussion of the Scriptures; and none are to be exempt from this without legitimate excuse. If anyone be negligent, let him be admonished. As for those who preach in the villages, throughout the Seigneury [feudal lordship], they are to be exhorted to come as often as they are able. For the rest, if they default an entire month, it is to be held to be very great negligence, unless it is a case of illness or other legitimate hindrance. If there appear difference of doctrine, let the ministers come together to discuss the matter. Afterwards, if need be, let them call the elders to assist in com posing the contention.</p></blockquote>

edbooksonline.com/topics/topics-by-subject/personal-godliness/spiritual-conferencing/the-church-of-scotland-on-the-spiritual-conferencing-of-elders/#:~:text=First%2C%20it%20will%20be%20expedient%20that,assist%20in%20com%20posing%20the%20contention&amp;text=First%2C%20it%20will%20be%20expedient%20that%20all%20the&amp;text=elders%20to%20assist%20in%20com%20posing%20the%20contention" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2451e0e4fa" data-kw="">
<blockquote><p>The principal design of preaching the Gospel is, that men may be reconciled to God, and this is accomplished by the unconditional pardon of sins; as Paul also informs us, when he calls the Gospel, on this account, the ministry of reconciliation, (2 Cor. 5:18.) Many other things, undoubtedly, are contained in the Gospel, but the principal object which God intends to accomplish by it is, to receive men into favour by not imputing their sins. If, therefore, we wish to show that we are faithful ministers of the Gospel, we must give our most earnest attention to this subject; for the chief point of difference between the Gospel and heathen philosophy lies in this, that the Gospel makes the salvation of men to consist in the forgiveness of sins through free grace. This is the source of the other blessings which God bestows, such as, that God enlightens and regenerates us by his Spirit, that he forms us anew to his image, that he arms us with unshaken firmness against the world and Satan. Thus the whole doctrine of godliness, and the spiritual building of the Church, rests on this foundation, that God, having acquitted us from all sins, adopts us to be his children by free grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, trans. William Pringle (Bellingham, WA: Logos Bible Software, 2010), 2.271.</span></figcaption>

<blockquote><p>To the desponding and the bereaved, these words of sympathy and cheer are lovingly inscribed.</p></blockquote>

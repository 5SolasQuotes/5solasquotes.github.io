<main class="wrap"><figure class="quote" id="q-154a97e3ba" data-kw="">
<blockquote><p>How pleasant will that day be to the sons of peace, when the Lord shall make good that word which by the mouth of two of his ancient witnesses he has established, when according to the Testimony of Isaiah, syllabically repeated by Michah [sic], we shall beat our swords into plow-shares, and our spears into pruning hooks, that we may walk together in the light of the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), epistle dedicatory.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b2548c8c6" data-kw="">
<blockquote><p>You have also to account for the fact, that the Bible presents a higher standard of moral purity than is any where else to be found; that all its doctrines and precepts, all its promises and threatenings, are worthy of an infinitely holy God. Tell us, if this be imposture, how it has come to pass that wicked men — the enemies of holiness — have produced the holiest book that the world has ever seen. If they could have done this, where was the motive to influence them to it, so long as it was directly opposed to their corrupt views and purposes? If they had desired to do it, would it not still, being conceived in sin, necessarily have borne, in a greater or less degree, the moral likeness of its authors?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sprague.html">William Sprague</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Young People (3rd edn, New York: D. Appleton &amp; Co., 1835), p. 67.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-0d33407f36" data-kw="">
<blockquote><p>Let us take heed that our rest be not turned into idleness and vanity; but being sequestered from all rural works, and from all business, let us wholly attend upon the worship of God.” (Augustine, ibid. [PL 39, col. 2274–2275.]) The principal end then of rest, is that we might in soul and body, without all let and interruption, wholly attend upon the worship of God. . Upon the Lord’s Day we ought to rest from all honest recreations &amp; lawful delights. But to proceed in this matter according to my purpose; it is most certain that we are not only commanded to rest from these that we have spoken of, but from all other things which might hinder us from the sanctifying of the Sabbath, as well as these: of which sort are all honest recreations, and lawful pleasures, which are permitted unto us upon the other days, to further us in the works of our calling, which we do also stand in need of sometimes, even as of meat, and drink, and sleep. For if those worldly duties (which we are commanded to walk in, and be of necessity required, and without the which the commonwealth cannot stand at all) are then forbidden, when we should attend upon the Lord’s work, because we cannot be wholly occupied in both; much more those things must be given over which serve but for pleasure, without the which mankind may continue, though not so well continue. Because we cannot have the present delight in the use of them, and yet at the same time be occupied in the hearing of the Word, and such other parts of God’s holy worship and service, as He requires of us upon the Sabbath day. Nay, because men cannot be both at church serving God with the rest of the people, and in their houses sporting themselves with their companions together; nor in the great congregation (Ps. 35:18) praising God with their brethren, and in the open fields playing with their fellows at one time (and God upon the Sabbath requires these of them). Therefore, the other must give place to them, and we must not think it sufficient that we do no work upon the Sabbath, and in the mean season |263| be occupied about all manner of delights, but we must cease as well from the one as from the other. … And we must rest from these things so much the more, by how much the works of our recreation are less needful, than the works of our vocation, and yet do more hinder us from the sanctifying of the Sabbath than they. For experience (which is the mistress of very fools) may teach us (and our nature is such that it must needs be so), how much we are moved with delectable things everyone in his kind, some this way, another that; how marvelously they do affect us, how all our senses are taken up with them, and all the parts of soul and body wholly possessed with them, that for the present time none of them can be occupied about the Lord’s work immediately, at least wise as they should be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath</cite>, (Naphtali Press &amp; Reformation Heritage Books, 2015), pp. 152-53, 167, 267-68 | But the end of rest was that they might attend upon other things, whereupon St. Augustine thus concludes, in one of his sermons which we noted before: Videamus, ne otium nostrum vanum sit.</span></figcaption>

</figure><figure class="quote" id="q-ad8d7e9e1d" data-kw="">
<blockquote><p>There is a twofold worship:

1. A civil reverence we give to persons of honour, Gen. 23:7, ‘Abraham stood up and bowed himself to the children of Heth.’ Piety is no enemy to courtesy.

2. A divine worship, which we give to God, is his prerogative-royal, Neh. 8:6, ‘They bowed their heads, and worshipped the Lord with their faces towards the ground.’ This divine worship God is very jealous of; this is the apple of his eye, this is the pearl of his crown which He guards as he did the Tree of Life, with cherubims and a flaming sword, that no man may come near to violate it: Divine worship must be such as God Himself has appointed, else it is offering strange fire, Lev. 10:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, … (London: Parkhurst, 1692), Q. 1, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-e408f5506f" data-kw="">
<blockquote><p>‘Yea but’ (say they) ‘our significant ceremonies were taken from idolaters and limbs of [the Roman] Antichrist who have abused them.’ Were this true, yet take the dross from the silver and make a vessel for the finer (Prov. 25:4); but it is false. Though they have had such as ours and have still, yet ours are our own and were never theirs in special. Fire and water are contrary, yet they agree in their kind: they are both elements. So ours are ceremonies and so are theirs, but otherwise they differ as fire and water; they scorn therefore ours and we deride theirs. We read of sacrifices offered to devils, yet some of this was sold in shambles and some the heathens made feasts of [such]. It was all the same flesh in kind, but not in use. The Christians did damnably if they went to it when it was sacrificed, yea and if they went to their idol feasts when they blessed an idol, it was idolatry; but if they bought part of that flesh in the shambles and ate it, or went to their private feasts when they ate of it (for aught they knew) without reference to the idol, then, says Paul, ‘Eat, making no question for conscience sake.’ So say we of our cross, surplice, kneeling: they were ordinances before idolaters abused them. If they take them and bless an idol with them, be it upon their own pates; but if we be invited to them in a better use (and not know, nor have just cause to suspect any lurking idolatry), why should we make so many needless questions about the use of them? Put [the] case, such as they are pertained to idolaters. So did Goliath’s sword, yet David laid it up in a holy place for better use. So did bowing belong to Baal, prostrating the whole body to idols, kissing to the calves, kissing the hand to the host of heaven, lifting up the eyes, stretching forth both hands, shouting for joy, sitting or lying along upon the ground or on a carpet to idols; yet all these we may use in the worship of the true God. So for our ceremonies, such as they are pertained to idolaters, but were not idolatrous of themselves. The cross was used as a sign of profession before idolatry prevailed. The white garment was ordained as a cover-sloven in the poverty of the Church; kneeling was used as an act of reverence before the breaden god was hatched. And may not we lawfully use them now, to show that we are in communion and fellowship with that blessed and persecuted Church, without such noises and schisms?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘Yea but’ (say they) ‘our significant ceremonies were taken from idolaters and limbs of [the Roman] Antichrist who have abused them.’ Were this true, yet take the dross from the silver and make a vessel for the finer (Prov. 25:4); but it is false. Though they have had such as ours and have still, yet ours are our own and were never theirs in special. Fire and water are contrary, yet they agree in their kind: they are both elements. So ours are ceremonies and so are theirs, but otherwise they differ as fire and water; they scorn therefore ours and we deride theirs. We read of sacrifices offered to devils, yet some of this was sold in shambles and some the heathens made feasts of [such]. It was all the same flesh in kind, but not in use. The Christians did damnably if they went to it when it was sacrificed, yea and if they went to their idol feasts when they blessed an idol, it was idolatry; but if they bought part of that flesh in the shambles and ate it, or went to their private feasts when they ate of it (for aught they knew) without reference to the idol, then, says Paul, ‘Eat, making no question for conscience sake.’ So say we of our cross, surplice, kneeling: they were ordinances before idolaters abused them. If they take them and bless an idol with them, be it upon their own pates; but if we be invited to them in a better use (and not know, nor have just cause to suspect any lurking idolatry), why should we make so many needless questions about the use of them? Put [the] case, such as they are pertained to idolaters. So did Goliath’s sword, yet David laid it up in a holy place for better use. So did bowing belong to Baal, prostrating the whole body to idols, kissing to the calves, kissing the hand to the host of heaven, lifting up the eyes, stretching forth both hands, shouting for joy, sitting or lying along upon the ground or on a carpet to idols; yet all these we may use in the worship of the true God. So for our ceremonies, such as they are pertained to idolaters, but were not idolatrous of themselves. The cross was used as a sign of profession before idolatry prevailed. The white garment was ordained as a cover-sloven in the poverty of the Church; kneeling was used as an act of reverence before the breaden god was hatched. And may not we lawfully use them now, to show that we are in communion and fellowship with that blessed and persecuted Church, without such noises and schisms?”

— Robert Abbot, A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25, ... (London: Payne, 1639), sect. 15 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., pp. 207-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Yea+but%E2%80%99+%28say+they%29+%E2%80%98our+significant+ceremonies+were+taken+from+idolaters+and+limbs+of+%5Bthe+Roman%5D+Antichrist+who+have+abused+them.%E2%80%99+Were+this+true%2C+yet+take+the+dross+from+the+silver+and+make+a+vessel+for+the+finer+%28Prov.+25%3A4%29%3B+but+it+is+false.+Though+they+have+had+such+as+ours+and+have+still%2C+yet+ours+are+our+own+and+were+never+theirs+in+special.+Fire+and+water+are+contrary%2C+yet+they+agree+in+their+kind%3A+they+are+both+elements.+So+ours+are+ceremonies+and+so+are+theirs%2C+but+otherwise+they+differ+as+fire+and+water%3B+they+scorn+therefore+ours+and+we+deride+theirs.+We+read+of+sacrifices+offered+to+devils%2C+yet+some+of+this+was+sold+in+shambles+and+some+the+heathens+made+feasts+of+%5Bsuch%5D.+It+was+all+the+same+flesh+in+kind%2C+but+not+in+use.+The+Christians+did+damnably+if+they+went+to+it+when+it+was+sacrificed%2C+yea+and+if+they+went+to+their+idol+feasts+when+they+blessed+an+idol%2C+it+was+idolatry%3B+but+if+they+bought+part+of+that+flesh+in+the+shambles+and+ate+it%2C+or+went+to+their+private+feasts+when+they+ate+of+it+%28for+aught+they+knew%29+without+reference+to+the+idol%2C+then%2C+says+Paul%2C+%E2%80%98Eat%2C+making+no+question+for+conscience+sake.%E2%80%99+So+say+we+of+our+cross%2C+surplice%2C+kneeling%3A+they+were+ordinances+before+idolaters+abused+them.+If+they+take+them+and+bless+an+idol+with+them%2C+be+it+upon+their+own+pates%3B+but+if+we+be+invited+to+them+in+a+better+use+%28and+not+know%2C+nor+have+just+cause+to+suspect+any+lurking+idolatry%29%2C+why+should+we+make+so+many+needless+questions+about+the+use+of+them%3F+Put+%5Bthe%5D+case%2C+such+as+they+are+pertained+to+idolaters.+So+did+Goliath%E2%80%99s+sword%2C+yet+David+laid+it+up+in+a+holy+place+for+better+use.+So+did+bowing+belong+to+Baal%2C+prostrating+the+whole+body+to+idols%2C+kissing+to+the+calves%2C+kissing+the+hand+to+the+host+of+heaven%2C+lifting+up+the+eyes%2C+stretching+forth+both+hands%2C+shouting+for+joy%2C+sitting+or+lying+along+upon+the+ground+or+on+a+carpet+to+idols%3B+yet+all+these+we+may+use+in+the+worship+of+the+true+God.+So+for+our+ceremonies%2C+such+as+they+are+pertained+to+idolaters%2C+but+were+not+idolatrous+of+themselves.+The+cross+was+used+as+a+sign+of+profession+before+idolatry+prevailed.+The+white+garment+was+ordained+as+a+cover-sloven+in+the+poverty+of+the+Church%3B+kneeling+was+used+as+an+act+of+reverence+before+the+breaden+god+was+hatched.+And+may+not+we+lawfully+use+them+now%2C+to+show+that+we+are+in+communion+and+fellowship+with+that+blessed+and+persecuted+Church%2C+without+such+noises+and+schisms%3F%E2%80%9D%0A%0A%E2%80%94+Robert+Abbot%2C+A+Trial+of+our+Church-Forsakers.+Or+A+Meditation+Tending+to+still+the+Passions+of+Unquiet+Brownists%2C+upon+Heb.+10%3A25%2C+...+%28London%3A+Payne%2C+1639%29%2C+sect.+15+Abbot+%28c.+1588+%E2%80%93+c.+1662%29+was+a+partially+conforming+English%2C+puritan+divine.%2C+pp.+207-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe408f5506f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e408f5506f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Yea%20but%E2%80%99%20%28say%20they%29%20%E2%80%98our%20significant,Church%2C%20without%20such%20noises%20and%20schisms&amp;text=Yea%20but%E2%80%99%20%28say%20they%29%20%E2%80%98our%20significant%20ceremonies%20were&amp;text=and%20persecuted%20Church%2C%20without%20such%20noises%20and%20schisms" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

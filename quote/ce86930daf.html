<main class="wrap"><figure class="quote" id="q-ce86930daf" data-kw="">
<blockquote><p>If Christ has suffered as a Substitute for every man and thus has rendered for all a complete satisfaction to Divine justice, how comes it about that all are not saved? Surely if He died for all He died with the intention of saving all, else why die for those whom He did not design to save. If this then were His intention, how comes it that His intention was not realised? It is difficult to see how one is to escape the conclusion upon this theory that Christ must have failed somewhere — which for the Divine One is unthinkable.

Further, if He rendered a complete satisfaction to Divine justice on behalf of all, how can some be punished for sin over again? Those who are not saved must suffer the punishment of their sins, for that is what being lost means; but how can they justly be punished if their Substitute has already borne their punishment? This theory, therefore, directly reflects upon the integrity of the justice of God. Again, if Christ offered up Himself as a ransom for all, i.e., everyone, why did He not see to it that He would secure all?

What was worth dying for — although we measure it not in the worth of the creature — was surely worth saving. What conceivable answer can be given to the question — Why did He not go on to save all those for whom He had laid down His life? To suffer for them was the hard and difficult part. As compared with this, to save was easy. Why then did He stop short? The redeemed in glory praise the Lamb as those who were bought by His blood.

Can it possibly be and yet by the Arminian theory it must needs be that the lost in hell can cry: “But we were blood bought, too, and it has availed us nothing. The price was paid for our deliverance, but Christ never came to save us. He bought us, indeed, by His blood, but either He omitted to claim us or the Devil made it impossible for Him to save us?” One has only to dwell for a little upon the conclusions, which, of necessity, arise from the Arminian view of the extent of the atonement to be convinced that it is a conception which is most dishonouring and derogatory to Him who has wrought out an all sufficient salvation for His people.</p></blockquote>

<blockquote><p>The idea from which the reference to “the many” arises, however, is a very different one: Christ did not die for a few but for many, for a large multitude. He gives his life as a ransom for many; he sheds his blood for many; he will make many righteous. It is not a handful but many who by one man’s obedience will be made righteous [Rom. 5:19]. Scripture is not afraid that too many people will be saved. Therefore, based on that same consideration, it says that God has no pleasure in the death of the wicked and that he wants all humans to repent and be saved, that Christ is the expiation of and has given his life for the world, and that the gospel must be preached to all creatures. But when universalists deduce from this that the atonement is completely universal, they run afoul of both Scripture and reality, for the two seem to vie with each other in teaching that not all but only many learn of the gospel and attain genuine repentance. In all these passages, therefore, we are encountering not “the will of God’s good pleasure,” which is unknown to us and neither can nor may be the rule for our conduct, nor an “antecedent will,” which is anterior to the decision of our will and oriented to it, but the “revealed will,” which tells us by what standard we are to conduct ourselves in the new covenant. It gives us the right and lays on us the duty to bring the gospel to all people without exception. For the universal offer of grace we need no other ground than this clearly revealed will of God. We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed—in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice—also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election. In the second place, Scripture implies that the sacrifice and intercession of Christ, hence also the acquisition and application of salvation, are inseparably connected. The sacrifice is the basis for Christ’s intercession; the scope of the latter, accordingly, is as extensive as that of the former. Limborch therefore recognizes that “the intercession is not an act distinct from the sacrifice in and of itself insofar as it [the intercession] is accomplished in heaven.” If then the intercession is particular, as it is (John 17:9, 24; Rom. 8:34; Heb. 7:25; 1 John 2:1–2), so is the sacrifice. Limborch, opposing this position, indeed cites Luke 23:34, but Jesus prays here not for the salvation of his enemies but only for the nonimputation of the appalling crime that they, in their ignorance, were committing when they crucified the Messiah. There is similarly an inseparable connection between the acquisition and the application of salvation. All the benefits of the covenant of grace are linked (Rom. 8:28–34) and find their ground in the death of Christ (Rom. 5:8–11). Atonement in Christ carries with it salvation and blessedness. For Christ is the head and believers are his body, a body that receives its growth from him (Eph. 4:16; Col. 2:19). He is the cornerstone, and we are the building (Eph. 2:20–21). He is the firstborn, and we are his brothers (Rom. 8:29). Believers, accordingly, have objectively died, been crucified, buried, raised, and seated in the heavens with and in him. That is, the church is not an accidental and arbitrary aggregate of individuals that can just as easily be smaller or larger, but forms with him an organic whole that is included in him as the second Adam, just as the whole of humankind arises from the first Adam. The application of salvation must therefore extend just as far as its acquisition. The application is comprehended in it and is its necessary development. This, for that matter, is true in the nature of the case. If Jesus is truly the Savior, he must also really save his people, not potentially but really and in fact, completely and eternally. And this, actually, constitutes the core of the difference between the proponents and the opponents of particular satisfaction (atonement).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is the office of Christ to pray for thee in heaven, when thou dost not pray upon earth. … Although thou hast not importunity in thy self, yet consider, O believing soul, that Christ is in heaven importuning the Father for thee.”

</figure><figure class="quote" id="q-c9372df389" data-kw="">
<blockquote><p>[Socinians and Photinians object:] (2) God is able to pardon sins without satisfaction. Therefore, it is probable, that He exacts no satisfaction. The antecedent is proven: Because He is able to remit of His own right as much as He pleases: since He is the absolute judge: but to each one one may remit as much as He pleases of his own right. Responses:

1. I deny the consequence; it is not valid to argue from the possible to the actual.

2. I also deny the antecedent. The proof is inconsequent: God is indeed able to remit of His own right as much as He pleases; but by His truth and righteousness He is not willing to remit so much, that without satisfaction He might forgive sins: because by His just judgment He once dictated to man the punishment of death: in the day that thou eatest therefore thou shalt surely die. Whence Scripture comments the righteousness of God in exacting satisfaction, Rom. 3:25. (3.) God wills to forgive us our sins without satisfaction. Therefore, He exacts no satisfaction. The antecedent is proven: because God does not exact anything from us except faith and repentance. Response: I deny the antecedent. The proof is inconsequent. For, even if from us He does not require and exact satisfaction: nevertheless, He exacts it from His Son, our Mediator, and imputes and grants the same to us freely. Faith itself implies this satisfaction: which is born toward Christ as the one redeeming and making satisfaction.</p></blockquote>

89.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=Socinians%20and%20Photinians%20object%3A%5D%20%282%29%20God,the%20one%20redeeming%20and%20making%20satisfaction&amp;text=Socinians%20and%20Photinians%20object%3A%5D%20%282%29%20God%20is%20able&amp;text=Christ%20as%20the%20one%20redeeming%20and%20making%20satisfaction" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1d54e976df" data-kw="against Socinian denial">
<blockquote><p>Concerning the necessity of a satisfaction, there are three principal opinions of theologians. The first of those simply denying it (as the Socinians, who not only deny that Christ made a real satisfaction, but that there was any need of it). The satisfaction here discussed is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>

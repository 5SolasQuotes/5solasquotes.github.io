<main class="wrap"><figure class="quote" id="q-db2a0ad54e" data-kw="">
<blockquote><p>Vers. 3. Let nothing be done through strife, or vain-glory, but in lowliness of mind, let each esteem other better than themselves.

He subjoins four Helps which will make the obedience to his Exhortation more facile and easy, and which may be reckoned as members of the Exhortation, and may serve also as Arguments to prove the Position.

(1.) That they would shun contention and vain-glory, to which if any one give way, he will presently discontinue peace. Hence Arg. 3. If ye will shun contention and vain-glory, you will preserve peace: Therefore unless ye will profess these vices, you must maintain peace.

But in] (2.) That they would study in lowliness of mind from their heart to prefer others before themselves, as better than themselves; which thought may consist with truth, and be without deceit, because this our opinion of other our brethren, doth not require an absolute judgement, but is contented partly with a suspended, partly with a negative judgement, by which we may say, that happily one thing being compared with another, he is better than I, or for as much as I know of him, and my self, I will not prefer my self before him; but him before me, because I am ignorant of the secrets of his heart, but I know the perverseness of my own heart. Hence Arg. 4. If from the humbleness of your mind, you judge others to excel you, you may preserve concord: Therefore unless you will manifest your pride, you must preserve concord: For the excellency of a man is not valued according to the measure of his gifts, but according to the measure of his faithfulness, sincerity and honesty.

Vers. 4. Look not every man on his own things, but every man also on the things of others.

(3.) The next Help for the maintaining of humility and concord, That every one should consider not his own virtues only, and what makes for his own advantage only, but the virtues of others also, and those things which conduce to the profit of all; thus we shall esteem others more, and our selves less, and be less offensive in all things. Hence Argum. 5. If ye will respect the virtues and good of others, you will easily preserve unity: Therefore unless you will be envious, and bee accounted so, Follow peace.

Vers. 5. Let this mind be in you, which was also in Jesus Christ:

(4.) The example of Christ which he proposeth for imitation, that they would learn humility, and exercise a true love unto concord: Here he first generally requires that they would have the same mind which was in Christ. Hence Argum. 6. Ye ought to be like-minded towards one another, as Christ was minded towards us, imitating his modesty and sweetness of behaviour:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 127.</span></figcaption>

<blockquote><p>Doctrine: Whatsoever company or congregation of men do openly profess the saving truth of God, the same congregation and company is to be held and reputed a true visible Church. The truth of this doctrine holds generally in all congregations whatsoever of that quality from the greatest to the least, and from the best to the worst…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church… (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 1</cite>, Lecture 9, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb1b6b0eac" data-kw="">
<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>

<blockquote><p>7. A particular Church of any one denomination, may fail in some points of doctrine and manners, and yet continue a living member of the true Church, if it fail not in fundamentals, and things simply necessary to salvation: for the light of truth has its degrees with men, and so has saving grace its intentions and remissions. The moon in the wane is the same which we sometimes see in the full. The Church of Ephesus, lost her first love, Rev: 2:4. The Church of Galatia was transported by false apostles into some dangerous opinions, Gal. 1, etc. The Church of Israel in Elijah’s time had in a great part forsaken the very covenants of God, 1 Kings 19:14, yet were there some names left, 7000 knees which had not bent to Baal. Now though no particular Church is exempt from the censure of the catholic, yet a Church is not presently to be forsaken by particular members thereof for some foul blemishes, nor many wicked men therein, though we must know that God sometimes for such things removes the candlestick from certain places, as from those seven famous Churches of Asia. ‘Tis not the place, but the saints which make the Church.</p></blockquote>

</figure><figure class="quote" id="q-0dc4279b47" data-kw="">
<blockquote><p>Behold then the inordinate dealing and arrogant presumption of you Brownists… professing to set up discipline, and glorying that you suffer for it, do break and utterly abolish the rules thereof given by Christ, by your utter forsaking and abandoning all the assemblies in England: for let it be confessed that the errors, the sins, the imperfections, the spots, and deformities of our Church be many, so that she is not in her general estate so fair as the fairest of her sisters: yet has she heretofore had, and now has, many noble children, richly adorned with heavenly jewels, and precious gifts of learning knowledge, faith, and godliness. And howsoever the Papists one way, and the Brownists another way, do aggravate her crimes with pestilent slanders, yet shall they never prove that either in doctrine or manners she is guilty of any fundamental crime which separates from Christ and destroys the life and being of a true Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists… (London, 1590)</cite>, p. 6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Behold then the inordinate dealing and arrogant presumption of you Brownists… professing to set up discipline, and glorying that you suffer for it, do break and utterly abolish the rules thereof given by Christ, by your utter forsaking and abandoning all the assemblies in England: for let it be confessed that the errors, the sins, the imperfections, the spots, and deformities of our Church be many, so that she is not in her general estate so fair as the fairest of her sisters: yet has she heretofore had, and now has, many noble children, richly adorned with heavenly jewels, and precious gifts of learning knowledge, faith, and godliness. And howsoever the Papists one way, and the Brownists another way, do aggravate her crimes with pestilent slanders, yet shall they never prove that either in doctrine or manners she is guilty of any fundamental crime which separates from Christ and destroys the life and being of a true Church.”

</figure><figure class="quote" id="q-9fae10ed87" data-kw="">
<blockquote><p>The God of truth and of peace (which two titles are the most resplendent gems in the crown of God’s glorious attributes) has commanded us to embrace and maintain with equal love and zeal the truth and peace (Zech. 8:19). Since also both these are the legacies of our blessed Saviour, bequeathed to his Church by his Testament, sealed with his blood; certainly every sincere Christian is concerned in both (2 Cor. 4:1); but the stewards of the mysteries of God are yet more deeply engaged in the preservation or restoration of both, to their utmost ability. At present, our amazing and distressing thoughts are great for the divisions of Reuben (to use the words of Deborah, Jud. 5:15) and the spiritual flames of dissension which (like the late dreadful fire in the city) devour the strength and beauty of our Church, call for the assistance of all hands to quench them. But as in a conflagration, while some labor to repress the violence, or stop the course of the spreading fire, others are employed to guard the goods, and, while they stand with aching hearts for the calamity, do good service in perserving their neighbours as well as their own goods from perishing or plunder: so while my brethren, the blessed sons of peace, are hard at work, in drawing water out of the ever-living spring, the Scripture, which plentifully affords the Word of truth and peace, and applying the same for the allaying of these consuming flames (whose endeavours for the peace of Jerusalem I pray God to prosper) I have undertaken to preserve and rescue an important truth concerning justification, from the attempts made by same to corrupt or obscure this heavenly doctrine.</p></blockquote>

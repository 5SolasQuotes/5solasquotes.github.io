<main class="wrap"><figure class="quote" id="q-b8961fb64f" data-kw="">
<blockquote><p>Before the rise of Luther, the Albigenses and others acted rightly in making a negative separation (for they did not communicate with the idolatry of the Papists), although before condemnation, persecution, and expulsion, they did not make a positive separation by forming another new visible Church. Where there are some fundamental errors in the Church, it is not immediately permissible to make a positive separation. Christ commanded to hear those who sit in Moses’ seat [Mt. 23:1-3], although they taught some things that overturned the foundation and rejected Christ. Nor does separation from an Orthodox Church due to some errors within it separate from Christ; for only separation from Orthodox faith separates from Christ, which opposes internal communion with Christ and the Church. But external separation alone is not internal separation; indeed, he who is thus separated retains internal communion with the Church in Orthodox faith, and therefore with Christ. We deem weak and feeble the argument of the Remonstrants [Arminians], who refuse to separate from Arians, Socinians, Anti-Trinitarians, Anabaptists, for they do not dare to consign all such to hell or ban them from heaven; as though it were not the Word of God, but our judgment concerning the salvation and damnation of men, that is the rule of our communion with the Church! If, however, we are compelled, in external communion, to communicate with errors,¹ even non-fundamental ones, in a Church not erring in fundamentals, then it is permissible to make a partial separation, not a total one; a negative, not a positive one.² The reason is that it is never lawful to communicate with the unfruitful works of darkness: Eph. 5:11. ¹ [Note this phrase is ambiguous. It may mean being present amidst secondary errors, or being compelled to personally sin.] ² [Yet denominationalism, “by forming another new visible Church,” is a positive separation.] … the Papists do not possess true faith; they err in the fundamental truths. They do not have the Holy Scripture with us as the sufficient canon of faith and morals… They nullify the mediatorial office of Christ by adding other mediators and saviors to Him. They deny the satisfaction of Christ, provided by His bloody death and the obedience rendered on our behalf, as they attempt to satisfy God for sins by themselves and others… Thus, there can be no union in faith with them, for they subvert that faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI (1639-1642; 1668; Monergism, 2024), ch. 1, ‘Of the Holy Scripture’, pp. 83-85</span></figcaption>

<blockquote><p>My mind being thus many years immersed in studies of this nature, and I having also long wearied myself in searching what fathers and schoolmen have said of such things before us, and my genius abhorring confusion and equivocals, I came by many years longer study to perceive that most of the doctrinal controversies among Protestants (that I say not in the Christian world) are far more about equivocal words than matter; and it wounded my soul to perceive what work both tyrannical and unskillful, disputing clergymen had made these thirteen hundred years in the world! And experience since the year 1643 till this year, 1675, has loudly called to me to repent of my own prejudices, sidings and censurings of causes and persons not understood, and of all the miscarriages of my ministry and life, which have been thereby caused; and to make it my chief work to call men that are within my hearing to more peaceable thoughts, affections and practices: And my endeavours have not been in vain, in that the ministers of the country where I lived, were very many of such a peaceable temper (though since cast out [at the Great Ejection, 1662]), (and a great number more through the land by God’s grace (rather than any endeavors of mine) are so minded). But the sons of the coal were exasperated the more against me, and accounted him to be against every man that called all men to love and peace, and was for no man as in a contrary way. And now looking daily in this posture, when God calls me hence (summoned by an incurable disease to hasten all that ever I will do in this world) being uncapable of prevailing with the present Church disturbers, I do apply myself to posterity, leaving them the sad warning of their ancestors’ distractions, as a pillar of salt, and acquainting them what I have found to be the cause of our calamities, and therein they will find the cure themselves.

II. I Have oft taken the boldness (constrainedly) to say that I doubt not but the contentions of the clergy have done far more hurt to the Christian world than the most bloody wars of princes. …

      13. No man is sufficiently apprehensive of the greatness of the curse in the confusion of tongues [Gen. 10]: whereby as we can preach but to few nations in the world, so we cannot intelligibly converse with one another. All words (being arbitrary signs) are ambiguous; And few disputers have the jealousy and skill which is necessary to discuss equivocations, and to agree of the meaning of all their terms before they use them in disputing: And so taking verbal differences for material, does keep up most of the wretched academical and theological wars of the world.

      14. And nothing here undoes all the world in point of wisdom, so much as over-hasty judging or prefidence: It is natural to almost all to fasten presently upon the first appearances and to be confident before they have half tried: In cases where seven and seven years serious study is necessary to a thorough digested knowledge, every novice will presently conclude as if he were sure. And then as everyone is apt to be confident, so to be tenacious; every error leading on more, and the reputation of the person being concerned in it, mutability being a shame: And so it becomes a very difficult thing to unlearn the errors once learned; as white paper is easier [to be] written on than that which is written on before.

      15. And then no man knows his own error (else it were no error), nor knows what another man’s perceptions are, nor what any other man knows more than he. 16…. And by all these means almost all are of the opinion of the country where they live, or of those that they most reverence, or which are most for their interest; and boldly condemn the rest not understood.</p></blockquote>

<blockquote><p>…they with whom they had to do were impostors… The first mark: that they separated themselves from the true Church of Christ, and from the sound doctrine of the apostles, not out of any necessity, nor from any divine warrant, but only upon their own pleasure, that they might not abide under the Lord’s yoke or his discipline.</p></blockquote>

<blockquote><p>Use 2: It may teach us what to judge of the Seperatists, or Brownists…

1. Because they seperate where Christ keeps fellowship, Rev. 1:18, and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? …

2. But they say that our Church consists of a mixed multitude, so was that 2 Chron. 20:13, when Jehoshaphat assembled all Judah before the Lord, there was a mixed multitude (Num. 11:4), and they did it out of fear, and yet it was a true Church, and so is ours, though there be a mixed multitude. And yet this falling off, because it is not from the main doctrine, but from the skirts, and some circumstantials, therefore they do not fall utterly from Christ, but yet it is not possible but they weaken their faith.</p></blockquote>

<blockquote><p>Yet it is the verdict of some (Sarav., N. Fratri &amp; Amico, Art. 17) that the blame lies not upon the ceremonies, but upon ministers themselves, who leave their places and draw all this evil upon themselves. This is even as Nabal blamed David for breaking away from his master, when he was chased away against his will (1 Sam. 23:10); and as Julian, when he had impoverished the Christians, laughed them to scorn, as if they had impoverished themselves to get that blessing which Christ had promised to the poor. (Socrates, bk. 3, ch. 12) The Canon Law speaks for the lord’s bishops, which are persecuted from citty to city. ‘Nec ipsi in hoc peccant, quoniam non sponte sed coacte hoc agunt: sed illi qui eos persecuuntur: nec ipsis Episcopis hoc imputari potest, sed illis qui eos hoc agere cogunt.’ (Decr., pt. 2, causa. 7, q. 1, ch. 36) How is it that they are not ashamed, who say that ministers leave their own places and callings, when they would faine abide in them, and with heavy hearts are thrust from them. Neither is this all the injury which is occasioned by the ceremonies: they make godly and zealous Christians to be mocked and nicknamed puritans, except they can swallow the camel of conformity.</p></blockquote>

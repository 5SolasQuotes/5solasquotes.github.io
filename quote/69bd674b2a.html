<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity</cite>, … (Boston, 1726), Sermon 172, Q. 60, pp. 584-88</span></figcaption>

<blockquote><p>…therefore if men do, nay ought to loose the ox to the water, much more might He loose the daughter of God from her infirmity of soul and body. And He does not so much dispute what He might do, as show what everyone ought to do: For if it were a breach of the Sabbath to neglect any duty to the other creatures, than much more to withdraw our hand from our brethren, when they do stand in need of our help.</p></blockquote>

</figure><figure class="quote" id="q-8ecc087c02" data-kw="">
<blockquote><p>…whatsoever recreations and exercises of body and mind are necessar[il]y required for the bettering of our sanctification of the Lord’s day and the enabling of us to perform with more cheerfulness, strength and courage the holy worship of God, and the work and service of his holy Sabbath, and which are also intended by us only to that end and use, them we may use, and so far as they serve to further and in no wise to hinder God’s holy worship and the immediate works and duties thereof. This is manifest by God’s allowing to his people in the Law dressing of meat and cheerful feasting on his Sabbath and holy days: which are needfull to cheer up men, and to provoke them to worship Him with all thankfulness of heart, also to put on our best apparel that we may come decently to God’s house. As these are lawful, being directed to holy use, so undoubtedly honest refreshing with recreations which cheer up the heart and refresh the spirits are lawful when they are helpful to holy exercises and are directed to that end, as stirring of the body, walking into gardens or fields to take fresh air, being found very helpful to preachers to revive their spirits, strengthen their loins, clear their voices, sharpen and quicken their wits and memories; and being done only to that end are lawful. So also walking into the corn fields in summer or harvest, or into meadows or pastures in the spring, both to refresh our bodies and spirits, and to give us occasion to admire God’s bounty in clothing the bodies, and his Fatherly providence in making the earth so fruitful, and to laud and praise Him, is lawful for us. And if after public and private exercise we do so walk about, diverse together, conferring of heavenly things and taking occasion by sight of earthly blessings to provoke one another to thankfulness and acknowledgment of God’s love, this no doubt is a recreation fit for the Lord’s day, and helps much our devotion; and this seems to have been practiced by our Savior, who went through the corn fields on the Sabbath day, Mt. 12:1, and his disciples with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (1638), ch. 21 Westminster divine, pp. 158-59</span></figcaption>

</figure><figure class="quote" id="q-8d5fdcb5fd" data-kw="">
<blockquote><p>…we conceive therefore these to be permitted. 1. All duties of piety, as was sacrificing under the Old Testament, or preaching, hearing or going about the sacraments under the New Testament: In which sense, Mt. 12, our Lord says the priests profaned the Sabbath and were blameless, not that formally they prophaned the Sabbath, or did indeed break that command, but materially they wrought in killing beasts, etc. which had been unlawful, had it not been in the exercises of piety. 2. All things that have a tendency, as necessary helps and means to the performance of the former works of piety, are lawful, as going to the congregation to hear the Law, calling the assembly for worship by trumpets, or bells, or by a voice, journeying, going or riding to Church, etc. because the duties of the Sabbath cannot well be done without some of these, nor at all without others of them. If it should be asked here, what that, which is called a Sabbaths day journey, Acts 1:12, was among the Jews? and whence it came, and what way may it be stinted or limited among Christians? Answer: It was to them 2000 cubits… It arose to be reckoned so from these grounds: 1. From their expounding Ex. 16:29, ‘Let none go out of his place;’ thus, Let none go without the bounds of the city, which with its suburbs was 2000 cubits, or a mile about. 2. That the Tabernacle of the congregation was so far from the tents of these who pitched about it in the wilderness, Num. 2, as they supposed; and that the priests kept that distance from the people in entering with the ark into Jordan, Josh. 3:4, whence they gathered that a man might still go to the ark or place of worship, as it was then in these cases at a distance from them, and no further on the Sabbath day. But we say whatever superstitiously or on custom they took up (for that is but their tradition) we cannot stint a Sabbath day’s journey to so many miles, fewer or more, but it must be as the man is in providence cast to reside further from, or nearer to the place where the ordinances are dispensed; for one may go many miles and not profane the Sabbath, if he cannot have the public ordinances nearer, whereas another may break the Sabbath by going but to his neighbor’s door, yea by walking in his own house, or to his door, if either it be done idly, or with respect to another civil or worldly end, which agrees not to that day; it is not here remoteness or nearness, but what sways us, and what is our end, that we are to try by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (d. 1658; London: 1675), 4th Commandment, Sanctification of the Sabbath, p. 277</span></figcaption>

<blockquote><p>8. Of the beginning and ending of the Sabbath — The first rule about time. 8. It may seem to some necessary that something should be premised concerning the measure or continuance of the day to be set apart to a holy rest to the Lord; but it being a matter of controversy, and to me, on the reasons to be mentioned afterwards, of no great importance, I shall not insist upon the examination of it, but only give my judgment in a word concerning it. Some contend that it is a natural day, consisting of twenty-four hours, beginning with the evening of the preceding day, and ending with the same of its own. And accordingly so was the church of Israel directed, Lev. 23:32, “From even unto even shall ye celebrate your Sabbath;” although that does not seem to be a general direction for the observation of the weekly Sabbath, but to regard only that particular extraordinary Sabbath which was then instituted, namely, the day of atonement, on the tenth day of the seventh month, verse 27. However, suppose it to belong also to the weekly Sabbath, it is evidently an addition to the command, particularly suited to the Mosaical pedagogy, that the day might comprise the sacrifice of the preceding evening in the services of it; from an obedience whereunto we are freed by the gospel. Neither can I subscribe to this opinion; and that because, — (1.) In the description and limitation of the first original seven days, it is said of each of the six that it was constituted of an evening and a morning, but of the day of rest there is no such description; it is only called “the seventh day,” without any assignation of the preceding evening unto it. (2.) A day of rest, according to rules of natural equity, ought to be proportioned to a day of work or labor, which God has granted to us for our own use. Now, this is to be reckoned from morning to evening: Psalm 104:20-23: “Thou makest darkness, and it is night: wherein all the beasts of the forest do creep” (from whose yelling the night has its name in the Hebrew tongue.) “The young lions roar after their prey, and seek their meat from God. The sun arises, they gather themselves together, and lay them down in their dens. Man goes forth unto his work and to his labor until the evening.</p></blockquote>

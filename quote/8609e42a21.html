<main class="wrap"><figure class="quote" id="q-8609e42a21" data-kw="">
<blockquote><p>Evolution, like its cousin atheism, is an idea so absurd that it should be dismissed as ludicrous by anyone with an ounce of common sense. Although B. B. Warfield has often been criticised for his compromise with unbelieving science, he did at least recognise the link between Darwinism and atheism:

The doctrine of Evolution, which was given scientific standing by Darwin’s Origin of the Species (1859), became almost at once the prime support and stay of the atheistic propaganda. In every department of thought “evolution” is supposed to account for everything, while itself needing no accounting for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Atheism (1908) in Selected Shorter Writings of Benjamin B. Warfield</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-246d1243ea" data-kw="existence revelation incomprehensible">
<blockquote><p>Although the Deity is unbounded and incomprehensible, yet because God has condescended to reveal himself to us both in nature and in the Scriptures (and it is incumbent upon the one who approaches God to believe that he is and is a rewarder of those who seek him, Heb. 11:6), the discussion concerning God holds the first place in theology and embraces the sum of all saving knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.1.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a> › <a href="../topics/existence-and-knowledge-of-god/existence-of-god/proofs.html">Proofs</a></span><span class="t"><a href="../topics/existence-and-knowledge-of-god/knowledge-of-god.html">Knowledge of God</a> › <a href="../topics/existence-and-knowledge-of-god/knowledge-of-god/incomprehensibility.html">Incomprehensibility</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 3.1.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough%20the%20Deity%20is%20unbounded%20and%20incomprehensible%2C%20yet%20because%20God%20has%20condescended%20to%20reveal%20himself%20to%20us%20both%20in%20nature%20and%20in%20the%20Scriptures%20%28and%20it%20is%20incumbent%20upon%20the%20one%20who%20approaches%20God%20to%20believe%20that%20he%20is%20and%20is%20a%20rewarder%20of%20those%20who%20seek%20him%2C%20Heb.%2011%3A6%29%2C%20the%20discussion%20concerning%20God%20holds%20the%20first%20place%20in%20theology%20and%20embraces%20the%20sum%20of%20all%20saving%20knowledge.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.1.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F246d1243ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/246d1243ea.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-5c43472dd8" data-kw="">
<blockquote><p>Whether the existence of God may be proved by disputation… (1) Where there is danger form the frenzies of atheists, this must be done sparingly, cautiously, compendiously and clearly. Where there is none it may be avoided, especially before the ruder and weaker and in catechetical institutions. There is will as a rule be sufficient to assume and adopt the principle [that God exists]. (2) The treatment must be taught kataskeuastikos rather than anaskeustikos, i.e., proofs must rather be brought forward for the truth than adversaries’ objections refuted… lest such things be taught by the very mention of them, and the devil take occassion of corrupt flesh to confuse men’s minds with horrible thoughts of the kind. (3) But the way with books that are published differs from that of instructions given by word of mouth. In the former, especially if dogmatic or argumentative, this proof can scarcely be passed over. In the latter it may, according to the matter under discussion. (4) One method is that of academic instructions and disputations, another that of the ecclesiastical. In the former theologians should be armed against antagonists of every kind. But this should be done with such care and circumspection, that it does not appear to be an airing of a dialectical problem. These distinctions being applied, we agree that (since the importunity of the ungodly does not create the necessity for us) there should be no dispute among Christians as to ‘whether there be a God’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (1648), pt. 1, p. 167 as translated by H. Heppe, Reformed Dogmatics (Wipf &amp; Stock, 2007), ch. 4, ‘The Existence &amp; Notion of God’, pp. 47-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-976da217e1" data-kw="atheism speculative practical">
<blockquote><p>While we admit there are many practical atheists, we deny that there are any speculative. A speculative atheist is either direct and express or indirect and interpretative. The direct is one who shakes off all knowledge and sense of deity; but such, properly speaking, there are none, because the sense of deity can never be wholly erased from the mind of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.2.2–3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a> › <a href="../topics/existence-and-knowledge-of-god/existence-of-god/atheism.html">Atheism</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 3.2.2–3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile%20we%20admit%20there%20are%20many%20practical%20atheists%2C%20we%20deny%20that%20there%20are%20any%20speculative.%20A%20speculative%20atheist%20is%20either%20direct%20and%20express%20or%20indirect%20and%20interpretative.%20The%20direct%20is%20one%20who%20shakes%20off%20all%20knowledge%20and%20sense%20of%20deity%3B%20but%20such%2C%20properly%20speaking%2C%20there%20are%20none%2C%20because%20the%20sense%20of%20deity%20can%20never%20be%20wholly%20erased%20from%20the%20mind%20of%20man.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.2.2%E2%80%933&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F976da217e1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/976da217e1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-2a7fd9e9d1" data-kw="">
<blockquote><p>Now whereas there is no Nation so projectedly Savage, as to be aliens to the belief of existence of some Deity, which mankind ought to adore; no people, who do not essay by some kind of performances to express the sentiments of Devotion and Honour they bear towards him; it is difficult to imagine there should be any persons found of minds so immensely distant from the common conceptions of reason, as to be able resolvedly to deny it. And the reason of the difficulty is this that Notices which are so Universal, having a necessary foundation and firm root in Nature, it must needs be that such as stifle the same in themselves, have in the first place violated and defaced that.

Hence it is that I would not formally accuse them who maintain that the Deity does not intermeddle in the affairs of this lower World, and conceive we ought to venerate the same only upon the account of its excellence, although there is not to be attended from it either Punishment for Wickedness or Compensation for Virtue; to have absolutely banished the knowledge of it from amongst them, and to make profession of believing there is a God only to escape the infamous title of Atheist.

Cicero indeed reproaches Epicurus with this artifice, and raises the suspicion upon his Followers; which nevertheless shall not engage me to believe that the corruption of our Age could possibly afford birth to such monsters. But howsoever that particular be, certain it is beyond contradiction, that the Opinions of this Philosopher lead directly to Impiety; and that if they who have embraced them believe the existence of God, tis Nature which prevails in them, and which is never conquerable by all the attempts and outrages they employ to conquer and suppress her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise concerning religions, in refutation of the opinion which accounts all indifferent. Wherein is also evinced the necessity of a particular revelation, and the verity and preeminence of the Christian religion above the pagan, Mahometan, and Jewish rationally demonstrated</cite>, (London: Will. Nealand, 1660), Part 1.1, pp 2-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-025c2fa808" data-kw="">
<blockquote><p>It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Scarecrows for Extremism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3801e70079" data-kw="">
<blockquote><p>Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude, verse 19 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’</cite>, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.”

%20who%20will%20forbear,and%20imperfections%20of%20worshippers%20and%20worship." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ebd8e798d0" data-kw="">
<blockquote><p>For excepting imperfections, wants, spots, blemishes and faults, which destroy not the true worship of God, our Church does worship the Lord aright, without heresy, blasphemy or idolatry… He that will have it to be no true worship of God in which there be errors and spots holds the heresy of perfection, which is very foul and detestable: for it is as far beyond our power to be perfect in God’s worship as to perform perfect obedience in the Second Table of the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists... (London, 1590), ‘Brownist Position’, pp. 9-10 Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

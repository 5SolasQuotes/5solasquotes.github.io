<blockquote><p>We still need some bold and outrageous men proclaiming justification by faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dustin-benge.html">Dustin Benge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post on X</cite>, (@DustinBenge), Oct 26, 2021</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span></div>
<div class="actions"><button class="copy" data-copy="“We still need some bold and outrageous men proclaiming justification by faith alone.”

— Dustin Benge, Post on X (@DustinBenge), Oct 26, 2021">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+still+need+some+bold+and+outrageous+men+proclaiming+justification+by+faith+alone.%E2%80%9D%0A%0A%E2%80%94+Dustin+Benge%2C+Post+on+X+%28%40DustinBenge%29%2C+Oct+26%2C+2021&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3835564ec8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3835564ec8.html">Permalink</a><a class="src" href="https://x.com/DustinBenge/status/1453106464113967111" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-07466e7fed" data-kw="">
<blockquote><p>Faith in Christ crucified is not commanded in the Law. For the apostle in Rom. 4:4–5 and 10:5–6, 11 sets faith in opposition to the Law; and in Gal. 3:12 he says that ‘The Law is not of faith,’ because the Law promises life to those who do the things contained in it. Therefore, faith is not comprehended under the Law. Nor indeed can there be any commerce between the Law and Christ as Mediator: “You are severed from Christ, you who are justified by the Law; you have fallen from grace” (Gal. 5:4). Faith in Christ crucified is a certain kind of righteousness: for it is obedience, and as it were a conformity to the command of God, as in 1 Jn. 3:23, “This is his commandment, that we should believe on the name of his Son,” and Jn. 3:36, “He who believes in the Son has eternal life; but he who does not obey the Son shall not see life, but the wrath of God abides on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Reconciliation of a Sinner… in which the Doctrine of the Anglican Church on the Justification of the Ungodly is explicated and defended (Basil, 1624), bk. 1, ch. 6, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Faith in Christ crucified is not commanded in the Law. For the apostle in Rom. 4:4–5 and 10:5–6, 11 sets faith in opposition to the Law; and in Gal. 3:12 he says that ‘The Law is not of faith,’ because the Law promises life to those who do the things contained in it. Therefore, faith is not comprehended under the Law. Nor indeed can there be any commerce between the Law and Christ as Mediator: “You are severed from Christ, you who are justified by the Law; you have fallen from grace” (Gal. 5:4). Faith in Christ crucified is a certain kind of righteousness: for it is obedience, and as it were a conformity to the command of God, as in 1 Jn. 3:23, “This is his commandment, that we should believe on the name of his Son,” and Jn. 3:36, “He who believes in the Son has eternal life; but he who does not obey the Son shall not see life, but the wrath of God abides on him.”

</figure><figure class="quote" id="q-8322df7240" data-kw="">
<blockquote><p>In respect to this confidence, faith is called saving and justifying. For God justifies no one except those who place their confidence in Christ and firmly believe their sins to be forgiven because of His merit. Thus, to attain salvation, it is not enough to have knowledge of divine mysteries or even general assent, but confidence is also necessarily required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | And in his Explanation, he adds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“In respect to this confidence, faith is called saving and justifying. For God justifies no one except those who place their confidence in Christ and firmly believe their sins to be forgiven because of His merit. Thus, to attain salvation, it is not enough to have knowledge of divine mysteries or even general assent, but confidence is also necessarily required.”

— Louis Le Blanc, Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | And in his Explanation, he adds:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+respect+to+this+confidence%2C+faith+is+called+saving+and+justifying.+For+God+justifies+no+one+except+those+who+place+their+confidence+in+Christ+and+firmly+believe+their+sins+to+be+forgiven+because+of+His+merit.+Thus%2C+to+attain+salvation%2C+it+is+not+enough+to+have+knowledge+of+divine+mysteries+or+even+general+assent%2C+but+confidence+is+also+necessarily+required.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+put+forth+at+Various+Times+at+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+AI+by+Colloquia+Scholastica+%281645%3B+London%3A+Moses+Pitt%2C+1683%29+Le+Blanc+%281614-1675%29+was+a+reformed+professor+of+theology+at+Sedan%2C+France.+%7C+%E2%80%98On+Justifying+Faith%E2%80%99%2C+pt.+1%2C+pp.+141+%26+146-56%2C+162+%7C+And+in+his+Explanation%2C+he+adds%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8322df7240.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8322df7240.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=In%20respect%20to%20this%20confidence%2C%20faith,but%20confidence%20is%20also%20necessarily%20required&amp;text=In%20respect%20to%20this%20confidence%2C%20faith%20is%20called&amp;text=general%20assent%2C%20but%20confidence%20is%20also%20necessarily%20required" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2490110f54" data-kw="">
<blockquote><p>The conception embodied in the terms, ‘belief’, ‘faith’, is not that of an arbitrary act of the subject, it is that of a mental state or act which is determined by sufficient reasons.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

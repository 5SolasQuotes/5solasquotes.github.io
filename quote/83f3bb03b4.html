<main class="wrap"><figure class="quote" id="q-83f3bb03b4" data-kw="">
<blockquote><p>By negative infidelity understand the mere lack of faith in one to whom the catholic Faith has either not been announced, or certainly not sufficiently. Such is the infidelity of those who have either heard nothing of the Faith, like the pagans; or have indeed heard, but so cursorily that the mysteries of the faith have not yet been shown to them to be evidently credible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 54-59, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“By negative infidelity understand the mere lack of faith in one to whom the catholic Faith has either not been announced, or certainly not sufficiently. Such is the infidelity of those who have either heard nothing of the Faith, like the pagans; or have indeed heard, but so cursorily that the mysteries of the faith have not yet been shown to them to be evidently credible.”

— Samuel Ward, ‘Negative Infidelity [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 54-59, p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+negative+infidelity+understand+the+mere+lack+of+faith+in+one+to+whom+the+catholic+Faith+has+either+not+been+announced%2C+or+certainly+not+sufficiently.+Such+is+the+infidelity+of+those+who+have+either+heard+nothing+of+the+Faith%2C+like+the+pagans%3B+or+have+indeed+heard%2C+but+so+cursorily+that+the+mysteries+of+the+faith+have+not+yet+been+shown+to+them+to+be+evidently+credible.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98Negative+Infidelity+%5Bof+the+Gospel%5D+Condemns+No+One+%5Bdue+to+Invincible+Ignorance%5D%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%2C+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+54-59%2C+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83f3bb03b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83f3bb03b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/arminianism/#:~:text=By%20negative%20infidelity%20understand%20the%20mere,to%20them%20to%20be%20evidently%20credible&amp;text=By%20negative%20infidelity%20understand%20the%20mere%20lack%20of&amp;text=been%20shown%20to%20them%20to%20be%20evidently%20credible" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-78f2548b78" data-kw="">
<blockquote><p>Wherefore I say then, that on supposition that a man lives in this world, perseverance unto the end is a necessary condition of his justification. And if so, no man can be justified whilst he is in this world; for a condition does suspend that whereof it is a condition from existence until it be accomplished. It is, then, to no purpose to dispute any longer about justification, if indeed no man is, nor can be, justified in this life. But how contrary this is to Scripture and experience is known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-a52597727f" data-kw="">
<blockquote><p>For my part I cannot understand that the continuation of our justification has any other dependencies than has our justification itself. As faith alone is required unto the one, so faith alone is required unto the other, although its operations and effects in the discharge of its duty and office in justification, and the continuation of it, are diverse; nor can it otherwise be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-094fd40078" data-kw="">
<blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Rejection of Errors, ¶5</span></figcaption>

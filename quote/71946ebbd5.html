<blockquote><p>(2) We have found that God Himself expresses an ardent desire for the fulfilment of certain things which He has not decreed in his inscrutable counsel to come to pass. This means that there is a will to the realization of what He has not decretively willed, a pleasure towards that which He has not been pleased to decree. This is indeed mysterious, and why He has not brought to pass, in the exercise of his omnipotent power and grace, what is his ardent pleasure lies hid in the sovereign counsel of his will. We should not entertain, however, any prejudice against the notion that God desires or has pleasure in the accomplishment of what he does not decretively will. (3) Our Lord Himself in the exercise of his messianic prerogative provides us with an example of the foregoing as it applies to the matter of salvation. He says expressly [in Mt. 23:37] that He willed the bestowal of his saving and protecting grace upon those whom neither the Father nor he decreed thus to save and protect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church, ‘The Report’, Conclusions 2-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6255e86111" data-kw="">
<blockquote><p>God’s call sometimes is ineffectual, and sometimes effectual. So the same apostle plainly declares in 1 Thess. 2:13: “For this cause also thank we God, which effectually works also in you that believe.” Observe that it is the work of God’s Spirit in the heart, superadded to the Word of the Gospel, as spoken by men, that makes any call effectual. Without this inward work, God may call, and the soul will never answer… It is this effectual work of God’s Spirit, in regenerating the soul by infusing of habits of grace, which distinguishes an internal effectual call of God form a mere external and ineffectual one… The text makes sure that it might be known whether or not God has so called you by His Word, as that also He has worked in you by His Spirit; whether God has illuminated your understanding, and inclined your will, so that you have complied with God’s will, and have answered His call. Whether, when God drew you, you ran after Him (Cant. 1:4); whether, when God entreated and persuaded you to be reconciled to Him you consented (2 Cor. 5:20); whether, when He wooed you, He also won you; whether, when He invited you to the wedding supper of His Son, you made no excuse or delay, but accepted, and welcomed the offer of the Gospel with faith and love (Luke 14:18). All which if you did do, it arose from the power of an inward call, being superadded to the outward call of the Word…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-fairclough.html">Richard Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Puritan Sermons</cite>, vol. 6, ‘The Papal Doctrine In Denying The Possibility Of Assurance Is False, And Has A Dangerous Tendency To Destroy The True Place And Comfort Of Souls In The Certain Hopes Of Everlasting Happiness. – 2 Peter 1:10’, p. 377-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-b26fb3dc36" data-kw="">
<blockquote><p>From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercise 2, ‘Of Notions of the Divine Will’</cite>, ch. 1, ‘Of God’s Revealed Will [Signi] and His Will of Good-pleasure’ in Apologetic Exercises for Divine Grace (Amsterdam, 1636; 1651), pp. 213-238, p. 232-233</span></figcaption>

<blockquote><p>For the less perfect is always for the sake of the more perfect:</p></blockquote>

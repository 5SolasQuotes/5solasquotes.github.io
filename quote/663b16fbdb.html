<blockquote><p>The sabbath is approaching; and on the sabbath day night this [letter] will come to your hand. I hope we shall find it a precious day of rest to our souls. It commemorates the accomplishment of that stupendous work which brings deliverance to guilty sinners, by the resurrection of Christ from the dead. It is an emblem of that rest which sinners find in Christ for their weary souls, in consequence of his having finished the glorious work he had undertaken. This is also a pledge of that rest that yet remaineth for the people of God. As sure as we are now enjoying the one, we shall soon enjoy the other, if indeed we are pilgrims and sojourners here on earth.

The Jewish sabbath, being the seventh day, was to them a commemoration of their glorious deliverance from their Egyptian bondage, a sign between God and them, and a pledge of the promised inheritance. It looked backward and forward, it reminded them of their slavery and deliverance from it, whilst by faith they were looking forward to the land of promise, where they should rest from their wanderings in a barren and dangerous wilderness. Our Sabbath also speaks the same language, – it reminds us of a bondage infinitely dreadful, and of a deliverance infinitely complete and glorious, and also of a rest eternal in the heavens.

It directly looks to Christ as the glorious author of this deliverance, and in whom only we can find rest to our souls. This rest is his purchase and gift— “I will give you rest.” When we consider what this rest cost him, can we help admiring his love and his kindness? “The travail of his soul” is our rest. “With his stripes are healed” – “He hath borne our sorrows and carried our griefs,” — What words are these. His sorrow is our joy, his travail is our rest, his stripes are our medicine, and his death is our life. How strange the mystery!

You see, my dear, where we are to go for rest, when weary and burdened – Jesus gives it. And if we have it not, the reason is, because we go not to him for it. The sabbath reminds us both of a duty and of a privilege in this view. It preaches to us, whilst our bodies rest from worldly toil, that we should seek rest also for our weary souls in Jesus. Christ hath “ceased from his work,” having gloriously finished it. God the Father looks upon every thing which Christ has done in our behalf, and says, “Behold it is very good,” that is, comely, glorious, satisfactory and sufficient, bringing glory to God in the highest, and peace and happiness on earth. May the Lord open our eyes to behold also the glory of the stupendous work. In the light of the Spirit it will appear to us to be very good. We shall with astonishment admire and rejoice in it, as the means of our present and eternal rest.

There is rest now in Christ; but the apostle saith, “There remaineth a rest to the people of God.” They have rest to their souls now by faith in Christ; but there remaineth a rest, both for body and soul, eternal in the heavens. Our rest now in Christ is the first fruits; the harvest will soon follow. The sabbath is a sign of the one, and a pledge of the other. Let us not therefore be weary in well-doing, but be stedfast and unmoveable, always abounding in the work of the Lord.

Let us with cheerfulness bear the cross. It is but for a little while. If the road is rough, let us not complain, for it leads to a glorious rest which nothing shall ever disturb. Let every returning sabbath revive our drooping spirits with this glorious hope, and assure our faith with increasing confidence, that whilst now we are by faith resting in Jesus, all our toils, crosses, and troubles will soon be for ever at an end.</p></blockquote>

<blockquote><p>I come now to say somewhat of the antiquity of musical instruments. But that these were not used in the Christian church in the primitive times, is attested by all the ancient writers with one consent. Hence they figuratively explain all the places of the Old Testament, which speak of musical Instruments; as I might easily show by a 1000 testimonies, out of Clement of Alexandria, Basil, Ambrose, Jerome, Augustine, Chrysostom, and many others. I can hardly forbear laughing, when I meet with some of their allegorical interpretations. An instrument with 10 strings, according to them signifies the 10 Commandments, as the unknown author of the commentary upon the Psalms among Jerome’s works, often explains it, in Psalm 32:2, 43:4, etc. But the pleasantest fancy is the explanation of these words: praise him with stringed instruments and organs. Psalm 150:4 “That the guts being twisted by reason of abstinence from food and so all carnal desires being subdued, men are found fit for the kingdom of god to sing his praises.” But Chrysostom talks more handsomely.” As the Jews praised God with all kind of instruments; so we are commanded to praise him with all the members of our bodies, our eyes etc.” In Psalm 150. And Clement of Alexandria talks much to the same purpose (Paedagog. lib. 2.c. 4). Besides the ancients thought it unlawful to use those instruments in God’s worship. Thus the unknown author of a treatise among Justin Martyr’s works. “Q: If songs were invented by unbelievers with a design of deceiving, and were appointed for those under the law, because of the childishness of their minds, why do they who have received the perfect instructions of grace, which are most contrary to the aforesaid customs, nevertheless sing in the churches just as they did who were children under the law? A: Plain singing is not childish, but only the singing with lifeless organs, with dancing and cymbals, etc. Whence the use of such instruments and other things fit for children is laid aside, and plain singing only retained.” Chrysostom seems to have been of the same mind, and to have thought the use of such instruments was rather allowed the Jews in consideration of their weakness, than prescribed and commanded. In Psalm 150. But that he was mistaken, and that musical instruments were not only allowed the Jews, as he thought, and Isidorius of Pelusium (whose testimony I shall mention presently) but were prescribed by God, may appear from the texts of scripture I have before referred to. Clement, as I have mentioned already, thought these things fitter for beasts, than for men. And though Basil commends, and stiffly defends the way of singing by turns; yet he thought musical instruments unprofitable and hurtful. He calls them, “the inventions of Jubal of the race of Cain.” And a little after he thus expresses himself: “Laban was a lover of the harp, and of music, with which he would have sent away Jacob: if thou hast told me, said he, I would have sent the away with murder, And musical instruments, and an harp. But the patriarch avoided that music, as being a thing that would hinder his regarding the works of the Lord, and his considering the works of his hands.” (Comment in Is. c.v. p. 956, 957). And a little before, he says thus: “In such mean arts, as playing upon the harp or pipe, or dancing, as soon as the action ceases, the work itself finishes. So that really, according to the Apostle’s expression, the end of these things is destruction.” (Page 955). Isidore of Pelusium, who lived since Basil, held, music was allowed the Jews by God, in a way of condescension to their childishness: “if God,” says he, “or with bloody sacrifices, because of men’s childishness at that time; why should you wonder, he bore with the music of an harp and a psaltery?” (Epist. lib. 2. ep. 176). Nay, there are some ecclesiastical officers in the Church of England, who, for their very profession and employment, would have been kept from the communion of the church, except they desisted from it. So we are informed by the Apostolical Constitutions: “if any come to the mystery of godliness, being a player upon a pipe, a lute, or an harp; Let him leave it off, or be rejected.” (Lib. 8. c. 32). From what has been said, it appears that no musical instruments were used in the pure times of the church. It became Antichristian, before they were received. Bellarmine himself does not deny, they were late brought into the church.”The second ceremony,” says he, “Are the musical instruments, which began to be used in the service of the church, in the time of Pope Vitallian, about the year 660, as Platina relates out of the Pontifical as Aimonius rather thinks (lib. iv. De gest. Francorum, c. 114). After the year 820, in the time of Lewis the Pius.” (De Missa, lib. ii. c. 15. Item, De bon. oper. lib. 1. c. 17). Dr. N. would hardly have denied, the church of Rome was become Antichristian when they were first brought in; even though we should allow Bellarmine’s first date of them to be the true one. But a Reformed divine may well be ashamed of that antiquity, that does not exceed the rise of Antichrist. But I am fully satisfied both Bellarmine’s dates are false, and that instrumental music in the worship of God, is much later than either of those accounts allow. For as to Platina, he seems to suspect that the truth of what he wrote: “Vitalian,” says he, “being careful about the worship of God, made an ecclesiastical rule, and ordered the singing, with the addition(as something) of organs.” (In Vital). Again, Bellarmine’s Aimonius is not the true Aimonius…. Farther, that these instruments were not used in God’s worship, in Thomas Aquinas’s time, that is about the year 1250, he himself his witness.”In the old law,” says he, “God was praised both with musical instruments and human voices, and according to that Psalm 33. ‘Praise the Lord with harp, Sing on to him with the psaltery, and an instrument of ten strings.’ But the church does not use musical instruments to praise God, lest she should seem to Judaize. Therefore by parody of reason, she should not use singing.” (2a2ae 91, art. 4 and conclus. 4). The like objection is used by our author. But Thomas answers: “as to this objection, we must say, as The philosopher (Lib. 8, Polit). ‘The pipes are not to be used for teaching, nor any artificial instruments, as the harp, or the like: But whatever will make the hearers good men. For these musical instruments rather delight the mind, then form it to any good disposition.’ But under the Old Testament such instruments were used, partly because the people were harder and more carnal; upon which account they were to be stirred up by these instruments, as likewise by earthly promises; and partly because bodily instruments were typical of something.” Upon which place Cardinal Cajetan gives us this comment: “It Is to be observed, the church did not use organs in Thomas’s time. When’s, even to this day, the church of Rome does not use them in the pope’s presence. And truly it will appear, that musical instruments are not to be suffered in the ecclesiastical offices we meet together to perform, for the sake of receiving internal instruction from God; and so much the rather are they to be excluded, because God’s internal discipline exceeds all human disciplines, which rejected these kinds of instruments.” (Cit. Hoffa. Lex. voce. Musica). If anyone objects the practice of some foreign churches, I answer with Mr. Hickman: “They are laid aside by most of the Reformed Churches; no would they they be retained among the Lutherans, unless they have forsaken their own Luther; Who, by the confession of Eckhard, reckoned organs among the “ensigns of Baal.” That they still continue in some of the Dutch churches, is against the minds of the pastors. For in the National Synod at Middleburg, in the year 1581, and in the Synod of Holland and Zeeland, in the year 1594, it was resolved, that they would endeavor to obtain of the magistrate laying inside of organs, and the singing with them in the churches, even out of the time of worship, either before or after sermons: so far are those synods from bearing with them in the worship itself.” (Apol. p. 139). The church of England herself had formerly no good opinion of these musical instruments; as may appear by her homilies: “lastly, God’s vengeance hath been, and is daily provoked, because much wicked people pass nothing to resort unto the church; either for that they are so sore blinded, that they understand nothing of God or godliness, and care not with devilish malice to offend their neighbors; or else for that they see the church altogether scoured of such gay gazing sights, as their gross fantasy was so greatly delighted with; because they see the false religion abandoned, and the true restored which seemed an unsavory thing to their savory taste, as may appear by this that a woman said to her neighbor: ‘Alas! gossip, what shall we do now at church, since all the saints are taken away; since all the goodly sites we were wont to have are gone; since we cannot hear the like piping, singing, chanting, and playing upon the organs that we could before?’ But dearly beloved, we are greatly to rejoice and give God thanks, that our churches are delivered out of all those things, which displeased God so sore, and filthily defiled his holy house, and his place of prayer.” (Hom. of the place and time of prayer part 2. p. 131). A great number also of the clergy in the first convocation of Queen Elizabeth in 1562, earnestly labored to have organs, and that pompous theatrical way of singing laid aside, and missed the carrying it but by one vote, as I observe elsewhere. And in this Archbishop Parker concurred with them, or at least did not oppose them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I come now to say somewhat of the antiquity of musical instruments. But that these were not used in the Christian church in the primitive times, is attested by all the ancient writers with one consent. Hence they figuratively explain all the places of the Old Testament, which speak of musical Instruments; as I might easily show by a 1000 testimonies, out of Clement of Alexandria, Basil, Ambrose, Jerome, Augustine, Chrysostom, and many others. I can hardly forbear laughing, when I meet with some of their allegorical interpretations. An instrument with 10 strings, according to them signifies the 10 Commandments, as the unknown author of the commentary upon the Psalms among Jerome’s works, often explains it, in Psalm 32:2, 43:4, etc. But the pleasantest fancy is the explanation of these words: praise him with stringed instruments and organs. Psalm 150:4 “That the guts being twisted by reason of abstinence from food and so all carnal desires being subdued, men are found fit for the kingdom of god to sing his praises.” But Chrysostom talks more handsomely.” As the Jews praised God with all kind of instruments; so we are commanded to praise him with all the members of our bodies, our eyes etc.” In Psalm 150. And Clement of Alexandria talks much to the same purpose (Paedagog. lib. 2.c. 4). Besides the ancients thought it unlawful to use those instruments in God’s worship. Thus the unknown author of a treatise among Justin Martyr’s works. “Q: If songs were invented by unbelievers with a design of deceiving, and were appointed for those under the law, because of the childishness of their minds, why do they who have received the perfect instructions of grace, which are most contrary to the aforesaid customs, nevertheless sing in the churches just as they did who were children under the law? A: Plain singing is not childish, but only the singing with lifeless organs, with dancing and cymbals, etc. Whence the use of such instruments and other things fit for children is laid aside, and plain singing only retained.” Chrysostom seems to have been of the same mind, and to have thought the use of such instruments was rather allowed the Jews in consideration of their weakness, than prescribed and commanded. In Psalm 150. But that he was mistaken, and that musical instruments were not only allowed the Jews, as he thought, and Isidorius of Pelusium (whose testimony I shall mention presently) but were prescribed by God, may appear from the texts of scripture I have before referred to. Clement, as I have mentioned already, thought these things fitter for beasts, than for men. And though Basil commends, and stiffly defends the way of singing by turns; yet he thought musical instruments unprofitable and hurtful. He calls them, “the inventions of Jubal of the race of Cain.” And a little after he thus expresses himself: “Laban was a lover of the harp, and of music, with which he would have sent away Jacob: if thou hast told me, said he, I would have sent the away with murder, And musical instruments, and an harp. But the patriarch avoided that music, as being a thing that would hinder his regarding the works of the Lord, and his considering the works of his hands.” (Comment in Is. c.v. p. 956, 957). And a little before, he says thus: “In such mean arts, as playing upon the harp or pipe, or dancing, as soon as the action ceases, the work itself finishes. So that really, according to the Apostle’s expression, the end of these things is destruction.” (Page 955). Isidore of Pelusium, who lived since Basil, held, music was allowed the Jews by God, in a way of condescension to their childishness: “if God,” says he, “or with bloody sacrifices, because of men’s childishness at that time; why should you wonder, he bore with the music of an harp and a psaltery?” (Epist. lib. 2. ep. 176). Nay, there are some ecclesiastical officers in the Church of England, who, for their very profession and employment, would have been kept from the communion of the church, except they desisted from it. So we are informed by the Apostolical Constitutions: “if any come to the mystery of godliness, being a player upon a pipe, a lute, or an harp; Let him leave it off, or be rejected.” (Lib. 8. c. 32). From what has been said, it appears that no musical instruments were used in the pure times of the church. It became Antichristian, before they were received. Bellarmine himself does not deny, they were late brought into the church.”The second ceremony,” says he, “Are the musical instruments, which began to be used in the service of the church, in the time of Pope Vitallian, about the year 660, as Platina relates out of the Pontifical as Aimonius rather thinks (lib. iv. De gest. Francorum, c. 114). After the year 820, in the time of Lewis the Pius.” (De Missa, lib. ii. c. 15. Item, De bon. oper. lib. 1. c. 17). Dr. N. would hardly have denied, the church of Rome was become Antichristian when they were first brought in; even though we should allow Bellarmine’s first date of them to be the true one. But a Reformed divine may well be ashamed of that antiquity, that does not exceed the rise of Antichrist. But I am fully satisfied both Bellarmine’s dates are false, and that instrumental music in the worship of God, is much later than either of those accounts allow. For as to Platina, he seems to suspect that the truth of what he wrote: “Vitalian,” says he, “being careful about the worship of God, made an ecclesiastical rule, and ordered the singing, with the addition(as something) of organs.” (In Vital). Again, Bellarmine’s Aimonius is not the true Aimonius…. Farther, that these instruments were not used in God’s worship, in Thomas Aquinas’s time, that is about the year 1250, he himself his witness.”In the old law,” says he, “God was praised both with musical instruments and human voices, and according to that Psalm 33. ‘Praise the Lord with harp, Sing on to him with the psaltery, and an instrument of ten strings.’ But the church does not use musical instruments to praise God, lest she should seem to Judaize. Therefore by parody of reason, she should not use singing.” (2a2ae 91, art. 4 and conclus. 4). The like objection is used by our author. But Thomas answers: “as to this objection, we must say, as The philosopher (Lib. 8, Polit). ‘The pipes are not to be used for teaching, nor any artificial instruments, as the harp, or the like: But whatever will make the hearers good men. For these musical instruments rather delight the mind, then form it to any good disposition.’ But under the Old Testament such instruments were used, partly because the people were harder and more carnal; upon which account they were to be stirred up by these instruments, as likewise by earthly promises; and partly because bodily instruments were typical of something.” Upon which place Cardinal Cajetan gives us this comment: “It Is to be observed, the church did not use organs in Thomas’s time. When’s, even to this day, the church of Rome does not use them in the pope’s presence. And truly it will appear, that musical instruments are not to be suffered in the ecclesiastical offices we meet together to perform, for the sake of receiving internal instruction from God; and so much the rather are they to be excluded, because God’s internal discipline exceeds all human disciplines, which rejected these kinds of instruments.” (Cit. Hoffa. Lex. voce. Musica). If anyone objects the practice of some foreign churches, I answer with Mr. Hickman: “They are laid aside by most of the Reformed Churches; no would they they be retained among the Lutherans, unless they have forsaken their own Luther; Who, by the confession of Eckhard, reckoned organs among the “ensigns of Baal.” That they still continue in some of the Dutch churches, is against the minds of the pastors. For in the National Synod at Middleburg, in the year 1581, and in the Synod of Holland and Zeeland, in the year 1594, it was resolved, that they would endeavor to obtain of the magistrate laying inside of organs, and the singing with them in the churches, even out of the time of worship, either before or after sermons: so far are those synods from bearing with them in the worship itself.” (Apol. p. 139). The church of England herself had formerly no good opinion of these musical instruments; as may appear by her homilies: “lastly, God’s vengeance hath been, and is daily provoked, because much wicked people pass nothing to resort unto the church; either for that they are so sore blinded, that they understand nothing of God or godliness, and care not with devilish malice to offend their neighbors; or else for that they see the church altogether scoured of such gay gazing sights, as their gross fantasy was so greatly delighted with; because they see the false religion abandoned, and the true restored which seemed an unsavory thing to their savory taste, as may appear by this that a woman said to her neighbor: ‘Alas! gossip, what shall we do now at church, since all the saints are taken away; since all the goodly sites we were wont to have are gone; since we cannot hear the like piping, singing, chanting, and playing upon the organs that we could before?’ But dearly beloved, we are greatly to rejoice and give God thanks, that our churches are delivered out of all those things, which displeased God so sore, and filthily defiled his holy house, and his place of prayer.” (Hom. of the place and time of prayer part 2. p. 131). A great number also of the clergy in the first convocation of Queen Elizabeth in 1562, earnestly labored to have organs, and that pompous theatrical way of singing laid aside, and missed the carrying it but by one vote, as I observe elsewhere. And in this Archbishop Parker concurred with them, or at least did not oppose them.”

— James P Wilson, Notes on Thomas Ridgley, A Body of Divinity, 4 vol. (Philadelphia, 1815), 4.85–88. Some spelling and punctuation modernized.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+come+now+to+say+somewhat+of+the+antiquity+of+musical+instruments.+But+that+these+were+not+used+in+the+Christian+church+in+the+primitive+times%2C+is+attested+by+all+the+ancient+writers+with+one+consent.+Hence+they+figuratively+explain+all+the+places+of+the+Old+Testament%2C+which+speak+of+musical+Instruments%3B+as+I+might+easily+show+by+a+1000+testimonies%2C+out+of+Clement+of+Alexandria%2C+Basil%2C+Ambrose%2C+Jerome%2C+Augustine%2C+Chrysostom%2C+and+many+others.+I+can+hardly+forbear+laughing%2C+when+I+meet+with+some+of+their+allegorical+interpretations.+An+instrument+with+10+strings%2C+according+to+them+signifies+the+10+Commandments%2C+as+the+unknown+author+of+the+commentary+upon+the+Psalms+among+Jerome%E2%80%99s+works%2C+often+explains+it%2C+in+Psalm+32%3A2%2C+43%3A4%2C+etc.+But+the+pleasantest+fancy+is+the+explanation+of+these+words%3A+praise+him+with+stringed+instruments+and+organs.+Psalm+150%3A4+%E2%80%9CThat+the+guts+being+twisted+by+reason+of+abstinence+from+food+and+so+all+carnal+desires+being+subdued%2C+men+are+found+fit+for+the+kingdom+of+god+to+sing+his+praises.%E2%80%9D+But+Chrysostom+talks+more+handsomely.%E2%80%9D+As+the+Jews+praised+God+with+all+kind+of+instruments%3B+so+we+are+commanded+to+praise+him+with+all+the+members+of+our+bodies%2C+our+eyes+etc.%E2%80%9D+In+Psalm+150.+And+Clement+of+Alexandria+talks+much+to+the+same+purpose+%28Paedagog.+lib.+2.c.+4%29.+Besides+the+ancients+thought+it+unlawful+to+use+those+instruments+in+God%E2%80%99s+worship.+Thus+the+unknown+author+of+a+treatise+among+Justin+Martyr%E2%80%99s+works.+%E2%80%9CQ%3A+If+songs+were+invented+by+unbelievers+with+a+design+of+deceiving%2C+and+were+appointed+for+those+under+the+law%2C+because+of+the+childishness+of+their+minds%2C+why+do+they+who+have+received+the+perfect+instructions+of+grace%2C+which+are+most+contrary+to+the+aforesaid+customs%2C+nevertheless+sing+in+the+churches+just+as+they+did+who+were+children+under+the+law%3F+A%3A+Plain+singing+is+not+childish%2C+but+only+the+singing+with+lifeless+organs%2C+with+dancing+and+cymbals%2C+etc.+Whence+the+use+of+such+instruments+and+other+things+fit+for+children+is+laid+aside%2C+and+plain+singing+only+retained.%E2%80%9D+Chrysostom+seems+to+have+been+of+the+same+mind%2C+and+to+have+thought+the+use+of+such+instruments+was+rather+allowed+the+Jews+in+consideration+of+their+weakness%2C+than+prescribed+and+commanded.+In+Psalm+150.+But+that+he+was+mistaken%2C+and+that+musical+instruments+were+not+only+allowed+the+Jews%2C+as+he+thought%2C+and+Isidorius+of+Pelusium+%28whose+testimony+I+shall+mention+presently%29+but+were+prescribed+by+God%2C+may+appear+from+the+texts+of+scripture+I+have+before+referred+to.+Clement%2C+as+I+have+mentioned+already%2C+thought+these+things+fitter+for+beasts%2C+than+for+men.+And+though+Basil+commends%2C+and+stiffly+defends+the+way+of+singing+by+turns%3B+yet+he+thought+musical+instruments+unprofitable+and+hurtful.+He+calls+them%2C+%E2%80%9Cthe+inventions+of+Jubal+of+the+race+of+Cain.%E2%80%9D+And+a+little+after+he+thus+expresses+himself%3A+%E2%80%9CLaban+was+a+lover+of+the+harp%2C+and+of+music%2C+with+which+he+would+have+sent+away+Jacob%3A+if+thou+hast+told+me%2C+said+he%2C+I+would+have+sent+the+away+with+murder%2C+And+musical+instruments%2C+and+an+harp.+But+the+patriarch+avoided+that+music%2C+as+being+a+thing+that+would+hinder+his+regarding+the+works+of+the+Lord%2C+and+his+considering+the+works+of+his+hands.%E2%80%9D+%28Comment+in+Is.+c.v.+p.+956%2C+957%29.+And+a+little+before%2C+he+says+thus%3A+%E2%80%9CIn+such+mean+arts%2C+as+playing+upon+the+harp+or+pipe%2C+or+dancing%2C+as+soon+as+the+action+ceases%2C+the+work+itself+finishes.+So+that+really%2C+according+to+the+Apostle%E2%80%99s+expression%2C+the+end+of+these+things+is+destruction.%E2%80%9D+%28Page+955%29.+Isidore+of+Pelusium%2C+who+lived+since+Basil%2C+held%2C+music+was+allowed+the+Jews+by+God%2C+in+a+way+of+condescension+to+their+childishness%3A+%E2%80%9Cif+God%2C%E2%80%9D+says+he%2C+%E2%80%9Cor+with+bloody+sacrifices%2C+because+of+men%E2%80%99s+childishness+at+that+time%3B+why+should+you+wonder%2C+he+bore+with+the+music+of+an+harp+and+a+psaltery%3F%E2%80%9D+%28Epist.+lib.+2.+ep.+176%29.+Nay%2C+there+are+some+ecclesiastical+officers+in+the+Church+of+England%2C+who%2C+for+their+very+profession+and+employment%2C+would+have+been+kept+from+the+communion+of+the+church%2C+except+they+desisted+from+it.+So+we+are+informed+by+the+Apostolical+Constitutions%3A+%E2%80%9Cif+any+come+to+the+mystery+of+godliness%2C+being+a+player+upon+a+pipe%2C+a+lute%2C+or+an+harp%3B+Let+him+leave+it+off%2C+or+be+rejected.%E2%80%9D+%28Lib.+8.+c.+32%29.+From+what+has+been+said%2C+it+appears+that+no+musical+instruments+were+used+in+the+pure+times+of+the+church.+It+became+Antichristian%2C+before+they+were+received.+Bellarmine+himself+does+not+deny%2C+they+were+late+brought+into+the+church.%E2%80%9DThe+second+ceremony%2C%E2%80%9D+says+he%2C+%E2%80%9CAre+the+musical+instruments%2C+which+began+to+be+used+in+the+service+of+the+church%2C+in+the+time+of+Pope+Vitallian%2C+about+the+year+660%2C+as+Platina+relates+out+of+the+Pontifical+as+Aimonius+rather+thinks+%28lib.+iv.+De+gest.+Francorum%2C+c.+114%29.+After+the+year+820%2C+in+the+time+of+Lewis+the+Pius.%E2%80%9D+%28De+Missa%2C+lib.+ii.+c.+15.+Item%2C+De+bon.+oper.+lib.+1.+c.+17%29.+Dr.+N.+would+hardly+have+denied%2C+the+church+of+Rome+was+become+Antichristian+when+they+were+first+brought+in%3B+even+though+we+should+allow+Bellarmine%E2%80%99s+first+date+of+them+to+be+the+true+one.+But+a+Reformed+divine+may+well+be+ashamed+of+that+antiquity%2C+that+does+not+exceed+the+rise+of+Antichrist.+But+I+am+fully+satisfied+both+Bellarmine%E2%80%99s+dates+are+false%2C+and+that+instrumental+music+in+the+worship+of+God%2C+is+much+later+than+either+of+those+accounts+allow.+For+as+to+Platina%2C+he+seems+to+suspect+that+the+truth+of+what+he+wrote%3A+%E2%80%9CVitalian%2C%E2%80%9D+says+he%2C+%E2%80%9Cbeing+careful+about+the+worship+of+God%2C+made+an+ecclesiastical+rule%2C+and+ordered+the+singing%2C+with+the+addition%28as+something%29+of+organs.%E2%80%9D+%28In+Vital%29.+Again%2C+Bellarmine%E2%80%99s+Aimonius+is+not+the+true+Aimonius%E2%80%A6.+Farther%2C+that+these+instruments+were+not+used+in+God%E2%80%99s+worship%2C+in+Thomas+Aquinas%E2%80%99s+time%2C+that+is+about+the+year+1250%2C+he+himself+his+witness.%E2%80%9DIn+the+old+law%2C%E2%80%9D+says+he%2C+%E2%80%9CGod+was+praised+both+with+musical+instruments+and+human+voices%2C+and+according+to+that+Psalm+33.+%E2%80%98Praise+the+Lord+with+harp%2C+Sing+on+to+him+with+the+psaltery%2C+and+an+instrument+of+ten+strings.%E2%80%99+But+the+church+does+not+use+musical+instruments+to+praise+God%2C+lest+she+should+seem+to+Judaize.+Therefore+by+parody+of+reason%2C+she+should+not+use+singing.%E2%80%9D+%282a2ae+91%2C+art.+4+and+conclus.+4%29.+The+like+objection+is+used+by+our+author.+But+Thomas+answers%3A+%E2%80%9Cas+to+this+objection%2C+we+must+say%2C+as+The+philosopher+%28Lib.+8%2C+Polit%29.+%E2%80%98The+pipes+are+not+to+be+used+for+teaching%2C+nor+any+artificial+instruments%2C+as+the+harp%2C+or+the+like%3A+But+whatever+will+make+the+hearers+good+men.+For+these+musical+instruments+rather+delight+the+mind%2C+then+form+it+to+any+good+disposition.%E2%80%99+But+under+the+Old+Testament+such+instruments+were+used%2C+partly+because+the+people+were+harder+and+more+carnal%3B+upon+which+account+they+were+to+be+stirred+up+by+these+instruments%2C+as+likewise+by+earthly+promises%3B+and+partly+because+bodily+instruments+were+typical+of+something.%E2%80%9D+Upon+which+place+Cardinal+Cajetan+gives+us+this+comment%3A+%E2%80%9CIt+Is+to+be+observed%2C+the+church+did+not+use+organs+in+Thomas%E2%80%99s+time.+When%E2%80%99s%2C+even+to+this+day%2C+the+church+of+Rome+does+not+use+them+in+the+pope%E2%80%99s+presence.+And+truly+it+will+appear%2C+that+musical+instruments+are+not+to+be+suffered+in+the+ecclesiastical+offices+we+meet+together+to+perform%2C+for+the+sake+of+receiving+internal+instruction+from+God%3B+and+so+much+the+rather+are+they+to+be+excluded%2C+because+God%E2%80%99s+internal+discipline+exceeds+all+human+disciplines%2C+which+rejected+these+kinds+of+instruments.%E2%80%9D+%28Cit.+Hoffa.+Lex.+voce.+Musica%29.+If+anyone+objects+the+practice+of+some+foreign+churches%2C+I+answer+with+Mr.+Hickman%3A+%E2%80%9CThey+are+laid+aside+by+most+of+the+Reformed+Churches%3B+no+would+they+they+be+retained+among+the+Lutherans%2C+unless+they+have+forsaken+their+own+Luther%3B+Who%2C+by+the+confession+of+Eckhard%2C+reckoned+organs+among+the+%E2%80%9Censigns+of+Baal.%E2%80%9D+That+they+still+continue+in+some+of+the+Dutch+churches%2C+is+against+the+minds+of+the+pastors.+For+in+the+National+Synod+at+Middleburg%2C+in+the+year+1581%2C+and+in+the+Synod+of+Holland+and+Zeeland%2C+in+the+year+1594%2C+it+was+resolved%2C+that+they+would+endeavor+to+obtain+of+the+magistrate+laying+inside+of+organs%2C+and+the+singing+with+them+in+the+churches%2C+even+out+of+the+time+of+worship%2C+either+before+or+after+sermons%3A+so+far+are+those+synods+from+bearing+with+them+in+the+worship+itself.%E2%80%9D+%28Apol.+p.+139%29.+The+church+of+England+herself+had+formerly+no+good+opinion+of+these+musical+instruments%3B+as+may+appear+by+her+homilies%3A+%E2%80%9Clastly%2C+God%E2%80%99s+vengeance+hath+been%2C+and+is+daily+provoked%2C+because+much+wicked+people+pass+nothing+to+resort+unto+the+church%3B+either+for+that+they+are+so+sore+blinded%2C+that+they+understand+nothing+of+God+or+godliness%2C+and+care+not+with+devilish+malice+to+offend+their+neighbors%3B+or+else+for+that+they+see+the+church+altogether+scoured+of+such+gay+gazing+sights%2C+as+their+gross+fantasy+was+so+greatly+delighted+with%3B+because+they+see+the+false+religion+abandoned%2C+and+the+true+restored+which+seemed+an+unsavory+thing+to+their+savory+taste%2C+as+may+appear+by+this+that+a+woman+said+to+her+neighbor%3A+%E2%80%98Alas%21+gossip%2C+what+shall+we+do+now+at+church%2C+since+all+the+saints+are+taken+away%3B+since+all+the+goodly+sites+we+were+wont+to+have+are+gone%3B+since+we+cannot+hear+the+like+piping%2C+singing%2C+chanting%2C+and+playing+upon+the+organs+that+we+could+before%3F%E2%80%99+But+dearly+beloved%2C+we+are+greatly+to+rejoice+and+give+God+thanks%2C+that+our+churches+are+delivered+out+of+all+those+things%2C+which+displeased+God+so+sore%2C+and+filthily+defiled+his+holy+house%2C+and+his+place+of+prayer.%E2%80%9D+%28Hom.+of+the+place+and+time+of+prayer+part+2.+p.+131%29.+A+great+number+also+of+the+clergy+in+the+first+convocation+of+Queen+Elizabeth+in+1562%2C+earnestly+labored+to+have+organs%2C+and+that+pompous+theatrical+way+of+singing+laid+aside%2C+and+missed+the+carrying+it+but+by+one+vote%2C+as+I+observe+elsewhere.+And+in+this+Archbishop+Parker+concurred+with+them%2C+or+at+least+did+not+oppose+them.%E2%80%9D%0A%0A%E2%80%94+James+P+Wilson%2C+Notes+on+Thomas+Ridgley%2C+A+Body+of+Divinity%2C+4+vol.+%28Philadelphia%2C+1815%29%2C+4.85%E2%80%9388.+Some+spelling+and+punctuation+modernized.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2defd5bb6a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2defd5bb6a.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/05/from-1815-a-brief-history-of-instruments-in-worship/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>For principally and properly God is worshipped in our spirit: Jn. 4:24, ‘The true worshippers shall worship the Father in spirit.’ Rom. 1:9, ‘Whom I serve in my spirit.’ 1 Pet. 3:15, ‘Sanctify God in your hearts.’ By the ‘spirit’ I understand the thought of the mind, the consience and the affections of the heart. For in these is the first and principal seat of divine and spiritual worship. As for the body, it is but a secondary instrument of the service of God… the true religion of the New Testament has but few prescribed ceremonies and for the most part is divine and spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 700</span></figcaption>

<blockquote><p>§44. 4. And though the taking of an oath be a sort of worship, yet not the natural worship of the First Commandment, nor the instituted of the Second, but the reverent use of his name in the third; so that it is not primarily an act of worship, but reductively and consequentially: It being the principal use of an oath to confirm the truth and end strife, by appealing to God, which appellation is indeed an acknowledgment of his government and justice. And the laying the hand upon the book, or kissing it, is but a professing sign of my own intentions, such as my words themselves are: and therefore is left to human choice, and a lawful thing. And I have met but with very few [non-conformists], among all our ceremonies, that questioned this.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-806ab667ba" data-kw="">
<blockquote><p>They who are impelled by fear to relinquish a course they love — they who yield a constrained obedience to the duties they are averse to perform —find that the command of Christ is a burden too grievous to be borne. But let me once hear with the ear of faith the voice of Christ saying, “Come unto me,” and a new era in my spiritual existence is begun. I have received the willing mind, which is the moral power to obey. It is easy to serve a master whom we love.

When my eye, therefore, is opened to see the King in his beauty, to behold the combination of every rare and Divine quality in Him, who is the sum and centre of all excellence, the source and completion of all good, then shall the knee be bowed before him, not in an unwilling or formal homage, but as expressive of the loyalty of the heart.

It is easy to serve a generous benefactor, and when I have been brought to feel my obligation to redeeming love—to know that Christ became poor, that I might be made rich; that he endured the curse, that I might obtain the blessing; that He died, that I might live; that He was crowned with thorns, that I might be crowned with glory—then, no service, no devotedness shall be deemed too complete, to give utterance to the gratitude that warms my bosom. It is easy to do what we love to do, and the renewed heart loves dearly to follow Christ, loves to be like Him, loves to be fitted to be with Him, to see and to share his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macfarlane.html">John MacFarlane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ s Yoke Easy to the Subjects of His Kingdom’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>

— Ezekiel Hopkins, The Doctrine of the Two Covenants, (London: Richard Smith, 1712), p. 401.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+certain+it+is%2C+that+Women+were+not+to+Pray+or+to+Prophesy+in+the+Church+as+Teachers%2C+for+it+was+not+permitted+them+to+speak.+They+prayed+therefore+as+joining+in+Prayer%3B+and+prophesy%E2%80%99d+as+attending+upon+Prophesying%2C+that+is%2C+upon+Preaching+the+Word.%E2%80%9D%0A%0A%E2%80%94+Ezekiel+Hopkins%2C+The+Doctrine+of+the+Two+Covenants%2C+%28London%3A+Richard+Smith%2C+1712%29%2C+p.+401.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F65b651acb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/65b651acb9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/13/ezekiel-hopkins-on-women-leading-public-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-816c143814" data-kw="">
<blockquote><p>But the problem is that many people today do not read books with a desire to learn, whatever they may be about, but rather seek to find something to attack. And if they are able to quibble over a single word, it acts as a stumbling block that prevents them from benefiting in any way at all. Then ignoring all the good in the book, they pride themselves in a way that causes their downfall. Even worse, the most ignorant are the most outspoken and critical. Others are so finicky that a single detail can put them right off, so much so that a single sentence that is not to their taste turns them away from the book as a whole, even though it may contain a great deal that they would be well advised to dwell upon.

It is no doubt a trick of the devil to turn them aside and stop them from receiving sound doctrine presented them. So those who would reap any profit from this book should cultivate a teachable spirit, putting aside anything that is an obstacle to progress, so that they might advance on the straight path that leads towards the pure truth of God, the only thing we are called to hold to, using those human means to help us reach that goal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the French translation of Philip Melancthon, Loci Communes (1546), trans. Alison Wells, ed. Paul Wells, available from: https://uniocc.com/archive/download_article/107</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

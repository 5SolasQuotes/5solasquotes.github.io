<main class="wrap"><figure class="quote" id="q-76a8f6ea15" data-kw="">
<blockquote><p>The second distinction is, between congregations ‘which have a competent and well-qualified eldership, and small congregations, who have but few office-bearers, and those, it may be, not sufficiently able for church government. In this case of insufficiency, a congregation may not independently, by itself, exercise jurisdiction, and not in re propis,” says Parker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (Edinburgh, 1846), Part 2, Concerning the Assemblies of the Church of Scotland, and the Authority Thereof | Ch. 2, ‘Of the Independency of the Elderships of Particular Congregations’, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“The second distinction is, between congregations ‘which have a competent and well-qualified eldership, and small congregations, who have but few office-bearers, and those, it may be, not sufficiently able for church government. In this case of insufficiency, a congregation may not independently, by itself, exercise jurisdiction, and not in re propis,” says Parker.”

— George Gillespie, Assertion of the Government of the Church of Scotland (Edinburgh, 1846), Part 2, Concerning the Assemblies of the Church of Scotland, and the Authority Thereof | Ch. 2, ‘Of the Independency of the Elderships of Particular Congregations’, p. 43">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+distinction+is%2C+between+congregations+%E2%80%98which+have+a+competent+and+well-qualified+eldership%2C+and+small+congregations%2C+who+have+but+few+office-bearers%2C+and+those%2C+it+may+be%2C+not+sufficiently+able+for+church+government.+In+this+case+of+insufficiency%2C+a+congregation+may+not+independently%2C+by+itself%2C+exercise+jurisdiction%2C+and+not+in+re+propis%2C%E2%80%9D+says+Parker.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Assertion+of+the+Government+of+the+Church+of+Scotland+%28Edinburgh%2C+1846%29%2C+Part+2%2C+Concerning+the+Assemblies+of+the+Church+of+Scotland%2C+and+the+Authority+Thereof+%7C+Ch.+2%2C+%E2%80%98Of+the+Independency+of+the+Elderships+of+Particular+Congregations%E2%80%99%2C+p.+43&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76a8f6ea15.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76a8f6ea15.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church/independent-churches-do-not-have-the-authority-for-greater-excommunication/#:~:text=The%20second%20distinction%20is%2C%20between%20congregations,not%20in%20re%20propis%2C%E2%80%9D%20says%20Parker&amp;text=The%20second%20distinction%20is%2C%20between%20congregations%20%E2%80%98which%20have&amp;text=jurisdiction%2C%20and%20not%20in%20re%20propis%2C%E2%80%9D%20says%20Parker" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-d9df8860b7" data-kw="">
<blockquote><p>Divisions and contendings have been the undoing of this Church first and last, but I think more of late, and more shamefully than ever, the matter being so small (if wisely considered) about which all this noise has been made. I take not upon me to justify the indulged ministers, neither will I rigidly condemn them: But, if the separating from their ministry and pressing the matter with such heat and violence shall be found to be good service done to Christ, I have read the Scriptures wrong; and the sad consequences of it are convincing enough, if people were humble and convincible. It was this contention which expelled that profitable and most edifying exercise of mutual prayer and Christian conference (that I may say nothing how it drove from the shepherds’ tents) upon which followed a sensible decay in the exercise of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-38d43ec2b4" data-kw="">
<blockquote><p>But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690</cite>, … (1706; Edinburgh: Gray, 1747), pp. 29-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

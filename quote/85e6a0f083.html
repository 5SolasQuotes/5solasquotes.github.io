<blockquote><p>…in the Revelation that Ecce venio [‘Behold, I come’] (Rev. 16:15) tells us the King of Glory is not far off. O then (as it is in the Psalm) ‘Lift up yourselves ye everlasting gates, that the King of Glory may enter in.’ (Ps. 24:7) The heart is the gate at which Christ must enter, ’tis the fort, the citadel which He would have yielded into his possession, ‘My son give me thy heart (Prov. 23:26); Let us therefore prepare our hearts for the entertainment of so great a guest, that so our souls may hold the same course hereafter which our prayers here do.</p></blockquote>

<blockquote><p>(2) Believing is the soul’s receiving Christ. St. Paul says, “Ye have received Christ Jesus the Lord.” (Col. 2:6) Christ offers to come into man’s heart with pardon, mercy, and grace, and to dwell there as its Peace-maker and King. He says, ‘I stand at the door and knock.’ (Rev. 3:20) The believer hears his voice, opens the door and admits Christ as his Master, Priest and King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, (London: Charles J. Thynne, 1898), pp. 376–402</span></figcaption>

<blockquote><p>With what different emotions of heart may we suppose Zaccheus received this invitation? Think you not that he was surprised to hear Jesus Christ call him by name, and not only so, but invite Himself to his house? Surely, thinks Zaccheus, I dream: it cannot be; how should He know me? I never saw Him before: besides, I shall undergo much contempt, if I receive Him under my roof. Thus, I say, we may suppose Zaccheus thought within himself. But what says the Scripture? “I will make a willing people in the day of my power.” [Ps. 110:3] With this outward call, there went an efficacious power from God, which sweetly over-ruled his natural will: and therefore, verse 6, “He made haste, and came down, and received him joyfully;” not only into his house, but also into his heart. … And thus it is with all, that, like Zaccheus, receive Jesus Christ by faith into their hearts: the very moment they find rest in Him, they are freely justified from all things from which they could not be justified by the law of Moses; “for by grace are we saved, through faith, and that not of ourselves, it is the gift of God. … You say you have faith; but how do you prove it? Did you ever hear the Lord Jesus call you by name? Were you ever made to obey the call? Did you ever, like Zaccheus, receive Jesus Christ joyfully into your hearts? Are you influenced by the faith you say you have, to stand up and confess the Lord Jesus before men? Were you ever made willing to own, and humble yourselves for, your past offenses? … He came not only to save, but to seek and to save that which was lost. He came to Jericho to seek and save Zaccheus; for otherwise Zaccheus would never have been saved by Him. But from whence came He? Even from Heaven, his dwelling-place, to this lower earth, this vale of tears, to seek and save that which was lost; or all that feel themselves lost, and are willing, like Zaccheus, to receive Him into their hearts to save them; with how great a salvation? … The power of his death and resurrection is as great now as formerly. Make haste therefore, make haste, O ye publicans and sinners, and give the dear Lord Jesus your hearts, your whole hearts. If you refuse to hearken to this call of the Lord, remember your damnation will be just: I am free from the blood of you all… Let all that love the Lord Jesus Christ in sincerity say, Amen.</p></blockquote>

</figure><figure class="quote" id="q-f01cfd4d79" data-kw="">
<blockquote><p>Yet does he exhort the people that they should not only regard the outward building, and the outward rites and sacrifices: but that they should chiefly give their hearts unto Him that promised to dwell in the Temple. And this same doctrine does even now at this day declare the true use of the sacraments, and does much more appertain unto us, unto whom the truth is plainly revealed, all the shadows of the law being abolished, than it did to the old fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David Truly Opened &amp; Explained by Paraphrasis</cite>, ... (London: Denham, 1581), on Ps. 24, p. 39</span></figcaption>

<blockquote><p>3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 12, Sermons Upon Romans 8, Sermon 8, p. 288</span></figcaption>

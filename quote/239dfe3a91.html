<main class="wrap"><figure class="quote" id="q-239dfe3a91" data-kw="">
<blockquote><p>Now, to be justified is to be freed from the guilt of sin, or to have all our sins pardoned, and to have a righteousness wherewith to appear before God, so as to be accepted with him, and a right to the heavenly inheritance. Every believer hath other designs also, wherein he is equally concerned with this,—as, namely, the renovation of his nature, the sanctification of his person, and ability to live unto God in all holy obedience; but the things before mentioned are all that he aimeth at or designeth in his applications unto Christ, or his receiving of him unto justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, The Works of John Owen, 5:115.</span></figcaption>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical.

37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense.

38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-488385444a" data-kw="">
<blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-08f2c04b0b" data-kw="">
<blockquote><p>But I fear the sense of this [said by antinomians], that ‘Christ repents for us, and obeys for us, He being the end of the Law to overy one that believes,’ be far otherwise, to wit, that Christ’s obedience of the Law, He being the end of the Law, as also his passive obedience is ours. If this be the intended sense, then: [1.] All our sanctification is nothing but the sanctification and holy active obedience of Christ. I yield this to be a broad, a fair and easy way to heaven. Christ does all for us [according to antinomians:], Christ weeped for my sins, and that is all the repentance required in me, if I believe that Christ was mortified and dead to the world for me, that is my mortification; and if I believe that the change of the whole man was truly in Christ, this is my true holiness: then my walking in holiness cannot be rewarded with life eternal, nor have any influence as a way or means leading to the kingdom.

2. Christ’s active obedience imputed to the sinner can be no evidence of justification, because it is in Christ, not in me; any evidence or mark of justification must be inherent in the believer, not in Christ.

3. And one and the same thing cannot be a mark and a sign of itself. Now the active obedience of Christ imputed to the sinner is holden [by antinomians] to be a part of justification [and therefore it cannot be a sign of justification].</p></blockquote>

oksonline.com/the-active-obedience-of-christ#:~:text=But%20I%20fear%20the%20sense%20of,cannot%20be%20a%20sign%20of%20justification&amp;text=But%20I%20fear%20the%20sense%20of%20this%20%5Bsaid&amp;text=therefore%20it%20cannot%20be%20a%20sign%20of%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thus, before the act of justification, I mean by nature, not by time, our faith or confidence has this proposition about the future as its object, ‘to me believing, sins will be forgiven.’ In the act of justification, this is about the present, ‘sins are being forgiven to me;’ after the act of justification, this is about the past, ‘sins have been forgiven to me.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | And he concludes:</span></figcaption>

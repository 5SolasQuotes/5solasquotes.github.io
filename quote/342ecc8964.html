<blockquote><p>28. The special manner of the worship of God is to be determined as the individual nature of each religious act requires.

29. So must be determined the right manner of hearing the word of God, calling upon his name, sharing the sacraments, exercising ecclesiastical discipline, and performing all those things which belong either to the natural or instituted worship of God, Ezek. 33:31; Matt. 13:19; 1 Cor. 11:27, 29; Isa. 66:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John Eusden (1639; Baker, 1997), bk. 2, ch. 14, ‘The Manner of Divine Worship’, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-968ee9543b" data-kw="">
<blockquote><p>Any positives not warranted by some special word of God shall be additions to the Word of God: But these are expressly forbidden, Dt. 4:2; 12:32; Prov. 30:6; Rev. 22:18-19. To this Formalists [Anglicans, etc.] answer: 1. They have a general commandment of God, though not a special. Answer: So have all the unwritten traditions of Papists; hear the Church, she is Magistra fidei [Teacher of the Faith]; so does the Papist Horantius answer Calvin, that the Spirit of God has given a general and universal knowledge of mysteries of Faith and ceremonies belonging to religion, but many particulars are to be received by tradition from the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) Westminster divine | Introduction, section 4, pp. 51-2</span></figcaption>

</figure><figure class="quote" id="q-3750c533ad" data-kw="">
<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

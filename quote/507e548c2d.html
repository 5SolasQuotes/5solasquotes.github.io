<main class="wrap"><figure class="quote" id="q-507e548c2d" data-kw="">
<blockquote><p>2. Here you say ‘matters of worship,’ before it was ‘in worship’. And even the word ‘worship’ is taken so variously as calls for explication before we determine whether man may appoint matters of worship: For if you will call putting off the hat and reverent gestures in particular and meters, and tunes, and the method and words of the particular prayer or sermon by the name of worship, then man may appoint it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw (London: Simmons, 1671)</cite>, sect. 45, pp. 115-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0921f67297" data-kw="">
<blockquote><p>There is one God, whom we do not otherwise acknowledge, brethren, but out of the holy Scriptures. For as he that would profess the wisdom of this world cannot otherwise attain hereunto, unless he read the doctrine of the philosophers; so whosoever of us will exercise piety toward God, cannot learn this elsewhere but out of the holy Scriptures. Whatsoever therefore the Holy Scriptures preach, let us know; and whatsoever they teach, let us understand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus.html">Hippolytus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>tome 3, Bibliotheca. Pat.</cite>, pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Begin with the law, but end not with traditions. If God by Himself prescribed the essentials of piety and worship, the other part of your distinction is, that God, not by Himself, but by his prelates, appointed the whole Romish rites, as accidentals of piety. This is the Jesuits’ doctrine.</p></blockquote>

</figure><figure class="quote" id="q-72d522d913" data-kw="">
<blockquote><p>Concerning worshipping or honoring (which two terms are both one)… Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like… God has created us and made us unto his own likeness; and our Saviour Christ has bought us with his blood. And therefore are we God’s possession, of duty and right; and Christ’s servants only, to wait on his will and pleasure, and ought therefore to move neither hand nor foot, nor any other member, either heart or mind, otherwise than He has appointed. God is honoured in his own person, when we receive all things, both good and bad, at his hand; and love his law with all our hearts; and believe, hope, and long for all that He promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord… (d. c. 1536; Cambridge: Parker Society, 1850)</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-328d0959ae" data-kw="">

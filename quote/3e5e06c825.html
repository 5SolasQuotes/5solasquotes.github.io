<blockquote><p>Men may deny that there is a God, or that they have souls, or that there is a world external to themselves. The zeal and persistency with which they endeavour to prove that there is no hell is no argument against the reality of it; rather the contrary. …

There are many methods of assault upon the doctrine. One is to admit that the Bible teaches it clearly, and then to make this fact a proof against the Bible’s inspiration and authority, the doctrine itself being too absurd and monstrous to be believed. Another is to admit the inspiration and authority of the Bible, and upon this ground to argue that it cannot teach the doctrine, and that the places which seem to teach it must receive some other interpretation.

These two methods are the same in principle. In both the reason of man is made the judge as to what a revelation from God ought to contain. A third method, near akin to the last, if it can be called a method, feeling rather than logic being judge, is simply to take one’s stand on the goodness of God, and say it cannot be. …

A very striking confirmation of this is seen in the effect of the pagan and papal doctrine of purgatory. Purgatory, according to the Roman doctors, is not a place of discipline, but of true and proper punishment, to all intents and purposes a temporary hell. Yet how many thousands and millions prefer the prospect of it to the pains and self-denials of a life of repentance and holiness here!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Probation after Death (1889) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f920b348b6" data-kw="">
<blockquote><p>Secondly, by the doctrine of faith we are bound to acknowledge and confess that Christ Jesus by his eternal priesthood is not only the sole meritorious cause of all grace or righteousness inherent, requisite to final absolution; but these presupposed in the party to be absolved, He is likewise the sole immediate cause of final absolution or justification. Without observation in some measure to all the commandments of God, we cannot enter into the kingdom of heaven: but we enter not for the obedience we have performed. To what use then does our inherent righteousness or observance of God’s commandments serve us? If it has been sincere and unfeigned, though imperfect, yet the faith that brought it forth will make a sincere and faithful plea for mercy in the day of trial, in which he that has been a hearer only, and no doer of the law, or has done in part what God would have done, but not sincerely nor faithfully, shall not be heard. Our imperfect obedience then is not the immediate cause of our absolution, but the obedience and righteousness of Christ. By the immediate and next cause we understand such a cause as is necessarily accompanied by the effect, and without whose participation the effect never does, nor can befall any: such a cause as whosoever is partaker of, is by participation of it forthwith absolved; such a cause as whoso can probably hope to be partaker of, he may upon the same degrees of probability hope for final absolution; such a cause as whoso doubts or fears lest he shall never be partaker of in this life, must upon the same terms doubt or despair of his absolution or salvation. But if works be accounted for the exact righteousness of the law unto us, not the obedience of Christ received by faith, but the works of holiness in us are the absolute cause of remission of sins and acceptance unto life. And what else do the words sound, as they are interpreted, but that as exact obedience to the law should have been the matter or cause of justification from justice, so sincere obedience by the estimation of grace is the matter of justification by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 69-70</span></figcaption>

<blockquote><p>The good that springs forth from this peace [of the gospel] means blessedness. Philosophers have tried in different ways to find this good, though they have never been able to, because they, being devoid of the light of the gospel and the eyes of faith, have neither been able to recognize in themselves the supreme good of the eternal inheritance obtained through Christ’s blood, nor their original leprosy, nor the guilt of eternal death, two distinct evil diseases in contrast with this supreme good, nor have been able to find the right remedy for both diseases outside of themselves in the atoning offering of Christ for our sins.</p></blockquote>

<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e05a0dba4c" data-kw="">
<blockquote><p>If there is any head of Christian doctrine about which it is absolutely necessary to agree to obtain eternal life, it is that in which it is taught not only concerning the righteousness which is required of us before the judgment-seat of God, but also about the sure way of obtaining it, by the pure, unadulterated Word of God. Therefore, we owe great thanks to the Most High God, because in our times that jewel, so deeply buried in the extraordinary cunning of Satan and the sophists, I have dug up again, and it could not be brought back into the bright light even now without very great difficulties. And it has most uniformly wanted to be acknowledged in the greatest consensus of all the restored churches and asserted against all the attempts of the adversaries. But they make the faith of all theologians in this matter, that to which we owe the Christianity asserted by the tyranny of the Antichrist. The opinion in this head [of doctrine] is held in harmony, held publicly so many times not only in Germany, but also in Switzerland, and confirmed elsewhere in gatherings, and finally, clearly expressed in the published confessions of all nations. It could therefore rightly appear astonishing that several people dwelling in the very heart of the church are blind in such clear light, that not only do they not rejoice at the sight of it, but they also do not allow others to rejoice with peaceful consciences, if the Holy Spirit Himself long ago and the perpetual history of the church had not taught us about the false prophets to come, even at the last time. Such men appeared who had set out from the very school of Dr. Luther and of the great Philip Melanchthon, just as Cerinthus and Hebrion once did from the very company of the apostles. Wicelius, Staphylus, Osiander, Islebius, men whose memory must be contested, went out from us, since they were not from us. Such also is that anonymous man, a certain follower or perhaps a leader himself. Whichever of these he may be, there is blindness in these matters and audacity in asserting his allurements. I hope that all the learned and godly will come to know this from this response of ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of JustificationThrough The Righteousness of Christ Alone Freely Imputed, Obtained by Living Faith in R. Scott Clark and Casey Carmichael, eds., Justification By Faith Alone: Selected Writings From Theodore Beza, Amandus Polanus, and Francis Turretin, trans. Casey Carmichael (Grand Rapids:</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-448ef2b40c" data-kw="">
<blockquote><p>If the inheritance of life eternal be by the law, it is no more by the promise. But it is by the promise because God gave it unto Abraham freely by promise. Therefore it comes not by the law. The opposition between the law and the promise shows that Paul in this epistle speaks not only of the ceremonial, but also of the moral. For the greatest opposition is between the moral law and the free promise of God….For if life come by the law, it comes not by the promise,” says Paul. And, ‘If they which are of the law are heirs, the promise is of none effect’ (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians, in Works, 2:192–93 (on Gal 3:15–18; HT: Inwoo Lee).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-41fa5bb1e6" data-kw="">
<blockquote><p>How can a man be just with God? The answer given to this question decides the character of our religion and, if practically adopted, our future destiny. To give a wrong answer is to mistake the way to heaven. It is to err where error is fatal, because it cannot be corrected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification, the Law, and the Righteousness of Christ</cite>, I.A, “Introduction”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

— Charles Hodge, Justification, the Law, and the Righteousness of Christ, I.A, “Introduction”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+can+a+man+be+just+with+God%3F+The+answer+given+to+this+question+decides+the+character+of+our+religion+and%2C+if+practically+adopted%2C+our+future+destiny.+To+give+a+wrong+answer+is+to+mistake+the+way+to+heaven.+It+is+to+err+where+error+is+fatal%2C+because+it+cannot+be+corrected.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Justification%2C+the+Law%2C+and+the+Righteousness+of+Christ%2C+I.A%2C+%E2%80%9CIntroduction%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41fa5bb1e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41fa5bb1e6.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7d4de1144d" data-kw="">
<blockquote><p>…I shall manifest: (1) That they have not the same scope, design or end in their discourses; That they do not consider the same question, nor state the same case, nor determine on the same inquiry, and therefore not speaking ad idem, ‘unto the same thing,’ do not contradict one another. (2) That as faith is a word of various signification in the Scripture… they speak not of the same faith, or faith of the same kind… (3) That they do not speak of justification in the same sense, nor with respect unto the same ends. (4) That as unto works they both intend the same, namely, the works of obedience unto the moral Law. …As to the scope and design of the apostle Paul… is to declare how a guilty, convinced sinner comes through faith in the blood of Christ to have all his sins pardoned, to be accepted with God and obtain a right unto the heavenly inheritance, that is, be acquitted and justified in the sight of God… The apostle James on the other hand had no such scope or design… But he had in hand a business quite of another nature… there were many in those days who professed the Christian religion or faith in the Gospel, whereon they presumed that as they were already justified, so that there was nothing more needful unto them that they might be saved. A desirable estate they thought they had attained, suited unto all the interest of the flesh, whereby they might live in sin and neglect of all duty of obedience, and yet be eternally saved… Against this sort of persons, or for their conviction, he designs two things: (1) In general to prove the necessity of works unto all that profess the gospel or faith in Christ thereby; (2) To evidence the vanity and folly of their pretense unto justification, or that they were justified and should be saved by that faith that was indeed so far from being fruitful in good works, as that it was pretended by them only to countenance themselves in sin. Unto these ends are all his arguings designed and no other. He proves effectually that the faith which is wholly barren and fruitless as unto obedience, and which men pretended to countenance themselves in their sins, is not that faith whereby we are justified and whereby we may be saved, but a dead carcass, of no use nor benefit, as he declares by the conclusion of his whole dispute in the last verse of the chapter. He does not direct any how they may be justified before God, but convinces some that they are not justified by trusting unto such a dead faith, and declares the only way whereby any man may really evidence and manifest that he is so justified indeed. This design of his is so plain, as nothing can be more evident…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 20, ‘The Doctrine of the Apostle James concerning Faith &amp; Works, its Agreement with that of St. Paul’ in The Doctrine of Justification by Faith in Works (†1683; Johnstone &amp; Hunter, 1850), 5.384-400</cite>, pp. 387-89</span></figcaption>

81%29+In+general+to+prove+the+necessity+of+works+unto+all+that+profess+the+gospel+or+faith+in+Christ+thereby%3B+%282%29+To+evidence+the+vanity+and+folly+of+their+pretense+unto+justification%2C+or+that+they+were+justified+and+should+be+saved+by+that+faith+that+was+indeed+so+far+from+being+fruitful+in+good+works%2C+as+that+it+was+pretended+by+them+only+to+countenance+themselves+in+sin.+Unto+these+ends+are+all+his+arguings+designed+and+no+other.+He+proves+effectually+that+the+faith+which+is+wholly+barren+and+fruitless+as+unto+obedience%2C+and+which+men+pretended+to+countenance+themselves+in+their+sins%2C+is+not+that+faith+whereby+we+are+justified+and+whereby+we+may+be+saved%2C+but+a+dead+carcass%2C+of+no+use+nor+benefit%2C+as+he+declares+by+the+conclusion+of+his+whole+dispute+in+the+last+verse+of+the+chapter.+He+does+not+direct+any+how+they+may+be+justified+before+God%2C+but+convinces+some+that+they+are+not+justified+by+trusting+unto+such+a+dead+faith%2C+and+declares+the+only+way+whereby+any+man+may+really+evidence+and+manifest+that+he+is+so+justified+indeed.+This+design+of+his+is+so+plain%2C+as+nothing+can+be+more+evident%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+ch.+20%2C+%E2%80%98The+Doctrine+of+the+Apostle+James+concerning+Faith+%26+Works%2C+its+Agreement+with+that+of+St.+Paul%E2%80%99+in+The+Doctrine+of+Justification+by+Faith+in+Works+%28%E2%80%A01683%3B+Johnstone+%26+Hunter%2C+1850%29%2C+5.384-400%2C+pp.+387-89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7d4de1144d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7d4de1144d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=I%20shall%20manifest%3A%20%281%29%20That%20they,as%20nothing%20can%20be%20more%20evident&amp;text=I%20shall%20manifest%3A%20%281%29%20That%20they%20have%20not&amp;text=so%20plain%2C%20as%20nothing%20can%20be%20more%20evident" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>That they indeed quote Paul in the same sense does them very little good: “The doers of the law, not the hearers, are justified” [Rom. 2:13 p.]. I do not intend to evade the question through Ambrose’s solution: that this was said because fulfillment of the law is faith in Christ.15 For I see this as a mere evasion, quite needless where the way lies open. Here the apostle is casting down the foolish confidence of the Jews, who claimed for themselves the sole knowledge of the law, even while they were its greatest despisers. Lest, then, mere skill in the law should please them so much, he warns that if righteousness be sought from the law, not knowledge but observance of it is sought. We assuredly do not question that the righteousness of the law consists in works, and not even that righteousness consists in the worth and merits of works. But it has not yet been proved that we are justified by works unless they produce some one man who has fulfilled the law. That Paul meant precisely this is sufficiently attested by the context of his utterance. After having condemned Gentiles and Jews together for their unrighteousness, he then gets down to details and says: “Those who have sinned without law will perish without law,” which has reference to the Gentiles; and “those who have sinned in the law will be judged by the law” [Rom. 2:12], which concerns the Jews. Now, since they, winking at their own shortcomings, plumed themselves on the law alone, Paul adds something especially fitting: the law was not laid down merely that men might be made righteous by hearing its voice; but only if and when they obeyed it. It is as if he said: “Do you seek righteousness in the law? Do not claim to have heard it, something of little weight in itself, but bring works whereby you may declare that the law was not laid down for you in vain.” Since they were all lacking in these works, it followed that they were bereft of boasting about the law. Paul’s meaning, then, requires us, rather, to frame the opposite argument: the righteousness of the law lies in perfection of works; no one can boast that he has fulfilled the law through works; consequently, there is no righteousness arising from the law.</p></blockquote>

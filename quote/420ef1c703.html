<main class="wrap"><figure class="quote" id="q-420ef1c703" data-kw="">
<blockquote><p>This question is proposed on account of those who glory in the name of Jesus, and yet, at the same time, seek their salvation, either wholly or in part, in some other place without him, in the merits of the saints, in the indulgences of the Pope, in their own offerings, works, fastings, prayers, alms, etc., as do the Papists, the Jesuits, and other hypocrites of a cast. We must therefore enquire, whether these persons believe in Jesus as the only Saviour, or not. It is answered, that they do not believe in him, but that in very deed they deny him, however much they may boast of him in words. The substance of this answer is included in this syllogism, drawn from the description of an only and perfect Saviour: Whosoever is a perfect, and only Saviour, he does not confer salvation with others, nor in part only. Jesus is a complete and only Saviour, as we have shown in the exposition of the former question. Therefore he does not confer salvation in connection with others, nor in part only; but he alone confers it entire, and in the most perfect manner. Hence we justly conclude that all those who seek their salvation wholly or in part somewhere else, in reality deny him to be an only and perfect Saviour. Or, we may put it in this form: Those who seek salvation elsewhere than in Christ, whether in the saints, or in themselves, &amp;c., do not believe in Jesus as an only Saviour. The Papists and Jesuits, who look upon their works as meritorious, do this. Therefore they do not believe in Jesus as their only Saviour. The minor proposition is acknowledged by them; and as to the major, it is clearly evident from the description which we have given of a perfect Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus Doctrinae Orthodoxae on Heidelberg Catechism Q. 30</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>

</figure><figure class="quote" id="q-c73ac8b118" data-kw="">
<blockquote><p>At an earlier moment during the [Hague] Conference [1611], the attending Counter-Remonstrants—Ruard Acronius (d. 1611), Joannes Bogardus (d. 1614), Petrus Plancius (1552–1622), Joannes Becius (1558– 1626), Libertus Fraxinus (c.1547–c.1621), and Festus Hommius (1576– 1642)—had noted that the word “irresistible” was ambiguous and that even Jesuits were able to accommodate it within their theory of grace and human free choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Defending Grace</cite></span></figcaption>

<blockquote><p>…a thing is ineffectual which is ordained towards an end to which it does not attain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 25, art. 2, reply to obj. 2</cite></span></figcaption>

— Thomas Aquinas, Summa, pt. 1, quest. 25, art. 2, reply to obj. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6a+thing+is+ineffectual+which+is+ordained+towards+an+end+to+which+it+does+not+attain.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+pt.+1%2C+quest.+25%2C+art.+2%2C+reply+to+obj.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff7807c32c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff7807c32c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=a%20thing%20is%20ineffectual%20which%20is,to%20which%20it%20does%20not%20attain&amp;text=a%20thing%20is%20ineffectual%20which%20is%20ordained%20towards&amp;text=an%20end%20to%20which%20it%20does%20not%20attain" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96d3fc64b3" data-kw="">
<blockquote><p>The words of the apostle, ‘God will have all men to be saved,’ etc. can be understood in three ways. First, by a restricted application, in which case they would mean, as Augustine says (De praed. sanct. i, 8: Enchiridion 103), God wills all men to be saved that are saved, not because there is no man whom He does not wish saved, but because there is no man saved whose salvation He does not will. Second, they can be understood as applying to every class of individuals, not to every individual of each class; in which case they mean that God wills some men of every class and condition to be saved, males and females, Jews and Gentiles, great and small, but not all of every condition. Third, according to Damascene (De Fide Orth. ii, 29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 19, article 6, reply to obj. 1</cite></span></figcaption>

</figure><figure class="quote" id="q-0c2f5df2d3" data-kw="">
<blockquote><p>If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, p. 44</span></figcaption>

</figure><figure class="quote" id="q-13b047c2a0" data-kw="">
<blockquote><p>Further, there are some which interpret these words of the apostle [1 Tim. 4:2, “God will have all men to be saved”], of the will of the sign or of the antecedent, that all men are invited, for that preaching is indifferently set forth to all men. Neither is there any, in a manner, which inwardly feels not some prick whereby he is oftimes stirred up to live well. So that if we respect this will of God, we easily grant that He will have all men to be saved. But they will not have it to be understood of the hidden and effectual will, which they call consequent: and after this manner may those kinds of speech be understood: ‘God lightens every man which comes into this world;’ (Jn. 1:9) ‘Come unto Me all ye which labor, and are laden.’ (Mt. 11:21) For all men are provoked by the oracles of God, and all men are inwardly moved by some provoking. All these interpretations are doubtless very likely, and also apt… 46. They object also a sentence of Christ, ‘How often would I have gathered together thy children, as a hen gathers together her chickens, and thou wouldest not?’ (Mt. 23:37) But here also is meant of the antecedent will of the sign, whereby God by his prophets, preachers, apostles and scriptures, many times invited the Jews to fly unto Him by repentance: which yet they refused to do. But yet God, by his effectual will, which they call consequent, perpetually drew to Him those that were his: neither was there ever any age wherein He gathered not together as many of the Hebrews as He had predestinated. Therefore Augustine said, ‘Those which I would, I have gathered together, although thou wouldest not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places (d. 1562; London, 1583), pt. 3, ch. 1, Of Predestination upon the 9th Chapter to the Romans</cite>, pp. 31-33</span></figcaption>

<blockquote><p>It must be known that the will of sign (voluntas signi) relates to the will of good-pleasure (voluntas beneplaciti) in three ways: For there is a will of sign which never coincides with the will of good pleasure, such as permission, by which He permits evils to occur, since He never wills evils to occur; Some always coincide, such as operation; But some sometimes coincide and sometimes not, such as precept, prohibition, and counsel.</p></blockquote>

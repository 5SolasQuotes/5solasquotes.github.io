<main class="wrap"><figure class="quote" id="q-95a4a94b1c" data-kw="">
<blockquote><p>Therefore although these [sacramental] signs neither convey grace, nor confirm any thing to them for good who keep not the Covenant (for God made no promise to them) yet are they means to convey the graces of God to those that do. To conclude, we affirm not that baptism conveyeth God’s grace to all that are baptized, but to the elect only, as that whereof he hath made a peculiar promise to them …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anabaptism Routed: Or, A Survey of the Controverted Points</cite>, (London: Thomas Johnson, 1655), p. 43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4183cc29c4" data-kw="">
<blockquote><p>Lastly we say again, that the reason why Christ gave his Disciples no express or peculiar command concerning baptizing infants, but included them in the general, was because the Apostles were so well acquainted with children’s reception into the Church-privileges, and sealing into the same, that they could not reasonably make any question of baptizing infants, having a general command to baptize all Nations, infants being under the Law circumcised; and knowing moreover that the grace of God was not more strict or restrained in the new Testament then in the old; but contrarywise, more diffused or large; and therefore a greater and more difficult question might have been concerning the baptism of women, there being neither analogy from circumcision, nor particular precept to induce them to baptize them; but that they knew that the general precept was authority sufficient, without specifying particulars in terminis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anabaptism Routed: Or, A Survey of the Controverted Points</cite>, (London: Thomas Johnson, 1655), p. 72.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

</figure><figure class="quote" id="q-fea8c552e5" data-kw="">
<blockquote><p>But if your meaning be, (as I strongly suspect it is) that we must not expect to be owned by Christ, except we give up infants baptism; then, I say, it is the most uncharitable, as well as unwarrantable, and dangerous censure that ever dropt from the pen of a sober Christian. It is certainly your great evil to lay salvation itself on such a point as the proper subject of baptism, and to make it articulus stantis vel cadentis religionis [the article of the standing or falling of the church], the very basis on which the whole Christian religion, audits professors salvation must stand. I hope the rest of your brethren are more charitable than yourself; but however it be, I do openly profess, that I ever have, and still do own you, and many more of your persuasion, for my brethren in Christ, and am persuaded Christ will own you too, notwithstanding your many errors and mistakes about the lesser and lower matters of religion. Nor need your censure much to affect us, as long as we are satisfied you have neither a faculty nor commission thus solemnly to pronounce it upon us. But what is the condition upon which this dreadful sentence depends? why, it is our attendance or non-attendance to the primitive purity of the gospel-doctrine. Sir, I hope we do attend it, and, in some respects, better than some great pretenders to primitive purity, who have cast off not only the initiating sign of God’s covenant, (this did not Abraham) but also that most comfortable and ancient ordinance of singing Psalms: and what other primitive ordinance of God may be cashiered next, who can tell? We have a witness in our bosom, that the defence of Christ’s pure worship and institution hath cost us something; and as for me, were I convinced by all that you have here said, or any of your friends, that in baptizing the infants of believers, we did really depart from the primitive purity, I would renounce it, and turn Anabaptist the same day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Reverend John Flavel</cite>, vol. 6 (London; Edinburgh; Dublin: W. Baynes and Son; Waugh and Innes; M. Keene, 1820), 328.</span></figcaption>

</figure><figure class="quote" id="q-e36ba5a74f" data-kw="">
<blockquote><p>But since our infants also ought to be baptized according to the promise of the Lord, “I will be your God, and the God of your seed” (Gen. 17:7), both the parents of the baptized infants and the ministers of the Church must take the responsibility that, as soon as they have matured, they will be diligently catechized and instructed in the doctrine of Christ, so that they may make for themselves publicly in church the profession of their faith which they were unable to do when they were baptized, confessing their sins, and embracing with a most grateful heart the grace of Baptism conferred on them in infancy, renouncing the world and Satan, and pledging themselves to the obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), pp 228-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

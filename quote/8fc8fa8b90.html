<main class="wrap"><figure class="quote" id="q-8fc8fa8b90" data-kw="">
<blockquote><p>First of all, the reason for His coming to judge is a comfort to believers. The main purpose of Christ’s coming to judge is the glorification of the church. That means that when sin and death have been fully abolished, and the enemies of the kingdom of Christ have been assigned to eternal punishment by a just judgment, and thus all the offenses and obstacles that held back the glory of the sons of God have been removed, God can appear in His saints fully and perfectly glorious, without any hindrance (Eph. 5[:27]; 1 Cor. 15[:20–58]). Christ makes this reason and purpose clear to us when He calls that day the “day of redemption” [Eph. 4:30]. Second, the very person of the Judge removes all our fear. For the Father handed over all judgment to the Son as the Son of Man so that He might calm our consciences and remove all terror of condemnation (John 5:22, 27). This is because we believe now that He will be the Judge, and also because with our eyes we will gaze on Him in whose body our sins have been atoned for and the entire curse removed (Heb. 9:28; Titus 2:12–14). Finally, Christ’s commandment and promise deliver us from all dread. The commandment is found in Luke 21[:28], “When these things begin to happen, look up and lift up your heads,” and Matthew 24[:6]: “And it will be that you will hear of wars and rumors of wars. See that you are not troubled; for all these things must come to pass.” The promise is found in John 3[:18]: “He who believes in the Son is not judged or condemned.” See also John 5:24; 1 Thessalonians 4:14, 17; 5:9–10; John 17:22, 24. Indeed, let us also consider that promise in 1 Corinthians 6[:2]: “Do you not know that the saints will judge the world?” And a short while later [v. 3]: “Do you not know that we shall judge angels?” Surely, since all the Articles of the Faith have been handed down to us for our comfort, this article on the judgment, too, has been handed down not to shake our faith but to build it up and establish it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Of The Apostles’ Creed, trans. Lyle Bierma, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books, 2010).</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40785982bc" data-kw="">
<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>

</figure><figure class="quote" id="q-3472fb0e3b" data-kw="">
<blockquote><p>When Thomas Cranmer drew up his Articles of Religion in 1553, there were Forty-Two of them, not the eventual Thirty-Nine, and its final two articles condemned those who sought to restore the doctrines of millennialism and universal restoration. However, when the Articles were revised, they were omitted for reasons not entirely clear. As a result, there is nothing in the Articles of Religion that requires a belief in eternal conscious torment without the hope of repentance, which is something that later universalists would come to point out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

</figure><figure class="quote" id="q-7ec1f22716" data-kw="hell sense loss">
<blockquote><p>Is there a hell? And what are its punishments—whether only of loss or also of sense? We affirm the latter. The execution of the sentence of the Judge will follow its promulgation. This will be carried out with respect to the wicked by casting them down into hell, where they must be tormented for ever with the devils; but with respect to the pious, by their introduction into heaven, to the joys of eternal life.</p></blockquote>

<blockquote><p>(3) From the providence of God perpetually keeping watch for the safety of the church (which cannot be conceived to have allowed her to suffer so great a loss). Otherwise what would become of the wisdom and goodness and power of God if he had willed that such a precious treasure should be shown to his church and then taken away; and that the body of Scripture should exist at this day mutilated and defective? (4) From the duty of the church which is religiously to preserve the oracles of God committed to her and to search them diligently. That she has not been careless to her charge is evident even from this—that neither Christ nor his apostles ever charged the Jews with this crime. This sacrilege they (who did not omit lesser things) would not have passed over in silence, if they had been really guilty. Yea, Paul commends this privilege of the Jews because unto them were committed the oracles of God (logia tou Theou, Rom. 3:2; 9:4). (5) From the purpose of the Scripture which was committed to writing as a canon of faith and practice even to the consummation of ages which could not be</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ac7680810" data-kw="vowels">
<blockquote><p>Again, the authority of an authentic writing is twofold: the one is founded upon the things themselves of which it treats and has relation to the men to whom the writing is directed; the other is occupied with the treatise itself and the writing and refers to the copies and translations made from it. Over all these this law obtains—that they ought to be referred to the authentic writing and if they vary from it, to be corrected and emended. The former authority may be either greater or lesser according to the authority of him from whom the writing comes and in proportion to the power which he has over the persons to whom he directs his writing. But in the sacred Scriptures this authority is the very highest, such as can be in no other writing, since we are bound straightway to believe God for that supreme power which he has over men as over all other things, and for that highest truth and wisdom distinguishing him, and to obey in all things which his most sacred word (contained in the authentic Scripture) enjoins for belief or practice. But the latter consists in this, that the autog</p></blockquote>

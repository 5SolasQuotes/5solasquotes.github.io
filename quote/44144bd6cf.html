<blockquote><p>For that, I shall desire you to consider that Jesus Christ is the only Head and King of his Church, that the government of his Church is a part of his Kingly office; that the government is committed into his hand, and the key of the house of David is laid upon his shoulders (Isa. 22:21-22); that the Father has set him as King upon his holy hill of Zion (Ps. 2:6), to reign over the house of Jacob for ever, and of his kingdom there shall be no end (Luke 1:33). As therefore he has fully and faithfully exercised his Priestly office in making atonement for our sins by the sacrifice of himself, and still making intercession in heaven for us; and his Prophetical office in revealing the whole counsel of God, and teaching his people by his word and Spirit, what he would have them to do; so he has no less fully and faithfully executed his Kingly office and legislative power, in providing statutes and ordinances for all the necessities of his Church; and appointing by whom and after what manner he will have his house governed, what spiritual courts and judicatories he would have erected, how he would have them constituted, by what rules to proceed, how to censure offenses. It is an old observation – they are the best laws, which leave the least to the power of the judge to do as he list [will]. It were a bad administration of the supreme power in any kingdom, if no certain kinds of subordinate officers, nor no certain kind of government were appointed, but all this left to the liberty of every country and city. Now Jesus Christ is more wise, and provident, and faithful, in the government of his whole Church, than ever King or Parliament was in the government of an earthly kingdom; and has therefore appointed officers, courts, censures, and laws, for the right ordering thereof; and has not left these things to be determined by this or that state at their pleasure. I should wish you and all that are of your mind, to study better the Kingly office and royal prerogative of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 117-18.</span></figcaption>

<blockquote><p>A third property of true zeal is, that it beginneth in our selves, and after proceedeth unto others: for never can that man be truly zealous to others, which never knew to be zealous to himself. Those are the most skilful Physicians and best able to deal with others, that have first wrought a cure upon their own souls. Therefore our Saviour’s advice is, Cast out the beam out of thine own eye first, and then shalt thou see perfectly to pull out the moat that is in thy brothers eye.

We must then first of all judge our selves, and cast the first stone at our selves, that so finding how ugly and noisome a thing sin is, and that by experience in our selves, we may be at defiance with it, wheresoever we find it, and neither flatter others in their evil courses, nor yet too rigorously and unmercifully rebuke them for the same. Those that have been pinched with sickness and are recovered, can by the smart which they have felt, pity others in the like case: even so they which have been stung with sin themselves, can more easily be moved to shew compassion towards poor sinners like themselves, because by the feeling of misery, men learn the practise of mercy, in that Christ suffered and was tempted, he is able to pity and to succour those that are tempted.

Against this rule doe all hypocrites offend, who will wade very deeply into other men’s souls, and very bloodily gore other men’s consciences, who yet never once purged their own unclean sinks at home, nor drew one drop of blood out of their own corrupt hearts. Such were the Pharisees, who pleased themselves much in judging and censuring our Saviour and his Disciples; but were so far from condemning themselves as faulty in any thing, that they justified themselves before God and men. Such also are the Brownists, which are ready to burst their bowels with crying out against disorders abroad, and yet never reform their own souls at home: for if they did, they would also reform their lives and their families.

But what kind of zeal these men’s is, wosull [sic] and late experience still crieth in our ears: for many of them being so zealous to others, but only through some secret love of the world, when they had that which they sought for, made known their hollow &amp; their rotten zeal, in that without grief of conscience, they could suddenly rush into a profound worldliness: and without all godly sorrow, could (after they had satisfied their greedy and fleshly zeal) not only more hardly sear up their own consciences, but also be so changed, that they could sow up their lips, and spare their words from speaking in like manner again to others, and so are neither zealous to themselves nor others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 87-89.</span></figcaption>

836515.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/19/robert-cleaver-on-hypocritical-zeal-and-the-brownists/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4e8ed2d62a" data-kw="">
<blockquote><p>Things that are false will accomplish a great many useful things in the world. If I take a counterfeit coin and buy a dinner with it, the dinner is every bit as good as if the coin were a product of the mint. And what a very useful thing a dinner is! But just as I am on my way downtown to buy a dinner for a poor man, an expert tells me that my coin is a counterfeit. The miserable, heartless theorizer! While he is going into uninteresting, learned details about the primitive history of that coin, a poor man is dying for want of bread. So it is with faith. Faith is so very useful, they tell us, that we must not scrutinize its basis in truth. But, the great trouble is, such an avoidance of scrutiny itself involves the destruction of faith. For faith is essentially dogmatic. Despite all you can do, you cannot remove the element of intellectual assent from it. Faith is the opinion that some person will do something for you. If that person really will do that thing for you, then the faith is true. If he will not do it, then the faith is false. In the latter case, not all the benefits in the world will make the faith true. Though it has transformed the world from darkness to light, though it has produced thousands of glorious healthy lives, it remains a pathological phenomenon. It is false, and sooner or later it is sure to be found out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (1923), pp. 142-43</span></figcaption>

<blockquote><p>Though sin be forgiven, yet there may be the sense of God’s displeasure still; for, as though God doth forgive, there are many calamities and pressures upon the godly: so though Christ hath born the agonies that do belong unto sin, yet some scalding drops of them do fall upon the godly; not that the godly is by these to satisfy the justice of God, but that hereby we might feel the bitterness of sin, what wormwood and gall is in it, that so we may take heed for the future, and that we may by some proportion think on, and admire the great love of Christ to us, in undergoing such wrath.

Didst thou not judge the least of his anger falling upon thee more terrible, then all the pains and miseries that ever thou wast plunged into? And by this then, thou mayest stand amazed, and wondering at this infinite love of Christ to stand under this burden for thee. David is a pregnant instance for the truth of this. As when Saul was angry with Jonathan, and run a Javelin at him, he escaped, and that run into the wall; so the wrath of God, which was violently to fall upon thee, missed thee, and ran into Christ. But the sense of God’s displeasure for sin, may be retained in us two ways;

1. Servilely and slavishly whereby we run from the promise and Christ, and have secret grudgings and repinings against God: this is sinful for us to do.

2. There is a filial apprehending of God’s displeasure, though we are persuaded of the pardon; this is good and necessary, as we see in David, who made that Psalm of Repentance, Psal. 51. though he had his absolution from his sin. Tears in the soul by the former way, are like the water of the Sea, salt and brackish; but those in the latter are sweet, like the rain of the Clouds falling down on the earth.</p></blockquote>

</figure><figure class="quote" id="q-6291ea70cd" data-kw="">
<blockquote><p>And thus beauty, which is indeed God’s handiwork, but only a temporal, carnal, and lower kind of good, is not fitly loved in preference to God, the eternal, spiritual, and unchangeable good. When the miser prefers his gold to justice, it is through no fault of the gold, but of the man; and so with every created thing. For though it be good, it may be loved with an evil as well as with a good love: it is loved rightly when it is loved ordinately; evilly, when inordinately. It is this which some one has briefly said in these verses in praise of the Creator: “These are Thine, they are good, because Thou art good who didst create them. There is in them nothing of ours, unless the sin we commit when we forget the order of things, and instead of Thee love that which Thou hast made.” But if the Creator is truly loved, that is, if He Himself is loved and not another thing in His stead, He cannot be evilly loved; for love itself is to be ordinately loved, because we do well to love that which, when we love it, makes us live well and virtuously. So that it seems to me that it is a brief but true definition of virtue to say, it is the order of love; and on this account, in the Canticles, the bride of Christ, the city of God, sings, “Order love within me.</p></blockquote>

<blockquote><p>Thus contentions were hot in the primitive times for meats and such things which were neither of themselves destructive to the foundation of Faith on either side, at least in that time, and so were not heretical; nor did they break off communion in Church-ordinances, and so were not schismatical;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-891dbcdb70" data-kw="">
<blockquote><p>XI. (4) Disagreements are a prejudice under whichthe evangelical churches labor. But they cannot hinder them from retaining the name of [a] true church, because they agree as to the foundation. And if any differences exist (which God wished to permit in order to prove our faith), they are about articles less necessary, in which there can be a disagreement without touching the essence of saving religion: as the apostolic churches formerly had their differences and stains, as is evident from the Acts of the Apostles and the Pauline epistles; nor were the eastern and western churches, the Latin and the Greek, the African and Italian churches free from them, which did not on that account cease to be true churches. Again, the contentions and differences of the evangelicals are far less than those which are agitated among the Romanists, who, as was seen before, frequently charge each other with heresy. Nor do we notice here the more rigid judgments of some of those who take their name from the great Luther, who, carried away by sinister prejudices, are accustomed to attack us. For however harshly they may have treated us, we do not cease to honor them with brotherly affection. And if, their prejudices and private affections being laid aside, they would seriously examine the thing itself by the law of love, truth and Christian prudence, they would not be so much averse to a pious syncretism and reconciliation with us, or at least a mutual toleration, to which not a few of the more moderate among them are not indisposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 18th Topic, question 15, “Are the evangelical and Reformed churches true churches of Christ?”</cite>, p. 143</span></figcaption>

</figure><figure class="quote" id="q-68909e59b0" data-kw="">
<blockquote><p>Reason 3. Ministers that were studious of the good of the flock did (very many of them) heretofore discern the need of an express consent [by laypesons for church-membership], that they might have more certainty of the extent of their charge than the bounds of a parish can give them. Only they (truly) maintained that our churches were true churches without a more express consent than we then had; and that it tended but to the well-being of a church, and not to the being, that the consent be more express than formerly…</p></blockquote>

<blockquote><p>The second question. But what if there be errors in the Church, or things amiss; may we not then separate ourselves? Answer: Things that may be amiss in the Church must be distinguished: for some faults concern the matter of religion: some the manner: the former respects doctrine principally: the latter the manners of men. First, for things amiss in the manners of men we may not separate; but with Lot have our righteous hearts vexed, and grieved with the wicked conuersation of those among whom we live. The Scribes and Pharisees sitting in Moses’s chair, teaching Moses’s doctrine must be heard; howsoever, the corruptions of their manners be such as they may not be imitated, Mt. 23:1. Yet here obserue further, that although we may not separate ourselves from such corrupt persons in the public assemblies, yet in private conversation we may abstain from them, 1. Cor. 5:11, ‘If any that is called a brother be a fornicator, or covetous, or an idolater, or a railer, or a drunkard, or an extortioner, with such a one eat not.’ That is, eat not privately. Secondly, if the Church err in matter of religion, then must we consider whether the error be in a more weighty and substantial point, or in matter of less importance. If it be in smaller points (the foundation being kept) we may not separate ourselves. 1 Cor. 3:15, ‘If any man’s work burn, he shall lose, but himself shall be safe, yet as if it were by fire.’ Now if the error of the Church be in substance of doctrine, or in the foundation, then we must consider whether it err of human frailty, or of obstinacy: if of frailty we may not separate. The Church of Galatia was through frailty quickly turned to another Gospel, and erred in the foundation, holding justification by works: yet Paul writes unto it as unto a Church of God. So likewise the Church of Corinth erred grievously, and overthrew the article of the Resurrection: and yet Paul behaved himself accordingly unto it. But if the Church err in the substance of religion obstinately, then with good conscience separation may be made. 1 Tim. 4:5, ‘If any man teach otherwise, and consent not to the wholesome doctrine, from such separate thyself.’ An example hereof we have in Acts 19:9, when Paul had preached in the synagogue of the Jews, and could not prevail with them, but they began to blaspheme and speak evil of the ways of God, then he withdrew himself and separated from them. 1 Chron. 11:14-16, when Jeroboam had set up the two calves to be worshipped, many of the best disposed Jews departed from him and came to Rehoboam, and joined themselves with Judah and Jerusalem in the true worship of the God of their fathers. Whence we see that no man may with good conscience separate himself from the Church of England; seeing it teaches, believes, and obeys the doctrine of the prophets and apostles. Further, consider the manner of the separation of these wicked men: there be three sorts of separation: First, by apostasy, when a man falls wholly from his religion, from the Church, and from common grace. Heb. 6:4, ‘It is impossible that they which were once enlightened, if they fall away,’ etc. Secondly, by heresy, when men err in the substance of doctrine and religion, and that of obstinacy. Thirdly, by schism; and that is when men hold the same faith and foundation, and yet disagree and separate in regard of order and ceremony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition upon the Whole Epistle of Jude... (d. 1602; London: Kyngston, 1606), on v. 19</cite>, pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

. But if the Church err in the substance of religion obstinately, then with good conscience separation may be made. 1 Tim. 4:5, ‘If any man teach otherwise, and consent not to the wholesome doctrine, from such separate thyself.’ An example hereof we have in Acts 19:9, when Paul had preached in the synagogue of the Jews, and could not prevail with them, but they began to blaspheme and speak evil of the ways of God, then he withdrew himself and separated from them. 1 Chron. 11:14-16, when Jeroboam had set up the two calves to be worshipped, many of the best disposed Jews departed from him and came to Rehoboam, and joined themselves with Judah and Jerusalem in the true worship of the God of their fathers. Whence we see that no man may with good conscience separate himself from the Church of England; seeing it teaches, believes, and obeys the doctrine of the prophets and apostles. Further, consider the manner of the separation of these wicked men: there be three sorts of separation: First, by apostasy, when a man falls wholly from his religion, from the Church, and from common grace. Heb. 6:4, ‘It is impossible that they which were once enlightened, if they fall away,’ etc. Secondly, by heresy, when men err in the substance of doctrine and religion, and that of obstinacy. Thirdly, by schism; and that is when men hold the same faith and foundation, and yet disagree and separate in regard of order and ceremony.”

rough+frailty+quickly+turned+to+another+Gospel%2C+and+erred+in+the+foundation%2C+holding+justification+by+works%3A+yet+Paul+writes+unto+it+as+unto+a+Church+of+God.+So+likewise+the+Church+of+Corinth+erred+grievously%2C+and+overthrew+the+article+of+the+Resurrection%3A+and+yet+Paul+behaved+himself+accordingly+unto+it.+But+if+the+Church+err+in+the+substance+of+religion+obstinately%2C+then+with+good+conscience+separation+may+be+made.+1+Tim.+4%3A5%2C+%E2%80%98If+any+man+teach+otherwise%2C+and+consent+not+to+the+wholesome+doctrine%2C+from+such+separate+thyself.%E2%80%99+An+example+hereof+we+have+in+Acts+19%3A9%2C+when+Paul+had+preached+in+the+synagogue+of+the+Jews%2C+and+could+not+prevail+with+them%2C+but+they+began+to+blaspheme+and+speak+evil+of+the+ways+of+God%2C+then+he+withdrew+himself+and+separated+from+them.+1+Chron.+11%3A14-16%2C+when+Jeroboam+had+set+up+the+two+calves+to+be+worshipped%2C+many+of+the+best+disposed+Jews+departed+from+him+and+came+to+Rehoboam%2C+and+joined+themselves+with+Judah+and+Jerusalem+in+the+true+worship+of+the+God+of+their+fathers.+Whence+we+see+that+no+man+may+with+good+conscience+separate+himself+from+the+Church+of+England%3B+seeing+it+teaches%2C+believes%2C+and+obeys+the+doctrine+of+the+prophets+and+apostles.+Further%2C+consider+the+manner+of+the+separation+of+these+wicked+men%3A+there+be+three+sorts+of+separation%3A+First%2C+by+apostasy%2C+when+a+man+falls+wholly+from+his+religion%2C+from+the+Church%2C+and+from+common+grace.+Heb.+6%3A4%2C+%E2%80%98It+is+impossible+that+they+which+were+once+enlightened%2C+if+they+fall+away%2C%E2%80%99+etc.+Secondly%2C+by+heresy%2C+when+men+err+in+the+substance+of+doctrine+and+religion%2C+and+that+of+obstinacy.+Thirdly%2C+by+schism%3B+and+that+is+when+men+hold+the+same+faith+and+foundation%2C+and+yet+disagree+and+separate+in+regard+of+order+and+ceremony.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Godly+%26+Learned+Exposition+upon+the+Whole+Epistle+of+Jude...+%28d.+1602%3B+London%3A+Kyngston%2C+1606%29%2C+o

<blockquote><p>God’s covenant, is his contract with man, concerning the obtaining of life eternal, upon a certain condition. This covenant consists of two parts: God’s promise to man, Man’s promise to God. God’s promise to man, is that, whereby he binds himself to man to be his God, if he perform the condition. Man’s promise to God, is that, whereby he vows his allegiance unto his Lord, and to perform the condition between them. Again, there are two kinds of this covenant. The covenant of works, and the covenant of grace. Jer. 31:31, 32, 33. “Behold the days come, says the Lord, that I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant, I made with their fathers, when I took them by the hand to bring them out of the land of Egypt; the which my covenant they brake, although I was an husband to them, saith the Lord. But this shall be the covenant, that I will make with the house of Israel: after those days, says the Lord, I will put my law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people.” The covenant of works, is Gods covenant, made with condition of perfect obedience, and is expressed in the moral law. The Moral Law, is that part of God’s word, which commands perfect obedience unto man, as well in his nature, as in his actions, and forbids the contrary. Romans 10. 5. “Moses thus describes the righteousness which is of the law, that the man which doth these things, shall live thereby.” 1. Timothy 1. 5. “The end of the commandment, is love out of a pure heart, and of a good conscience, and faith unfeigned.” Luke 16. 27. “You shalt love the Lord your God, with all your heart, with all your soul, and with all your strength.” Rom. 7. 14. “We know that the law is spiritual.” The Law has two parts. The Edict, commanding obedience, and the condition binding to obedience. The condition is eternal life to such as fulfill the law, but to transgressors, everlasting death. The Decalogue, or ten commandments, is an abridgement of the whole law, and the covenant of works. Exod. 34:27. And the Lord said unto Moses, Write these words, for after the tenor of these words, I have made a covenant with thee, and with Israel. And be was there with the Lord forty days and forty nights, and did neither eat bread, nor drink water, and he wrote in the tables the words of the covenant, even the ten commandments. 1. King. 8. 9. Nothing was in the Ark, save the two tables of stone, which Moses had put there at Horeb, where the Lord made a covenant with the children of Israel, when he brought them out of the land of Egypt. Mat. 22:40. “On these two commandments hangs the whole law and the prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine</cite>, (Cambridge, 1616), 32. [spelling and punctuation updated</span></figcaption>

<blockquote><p>Once more, are true believers delivered from the commanding, condemning, and irritating power of the law as a covenant? Let them then, amid all their trials and all their conflicts with spiritual enemies, be of good comfort. Oh, let them rejoice exceedingly in that almighty, compassionate, dear Redeemer who, in His love and pity, has redeemed them from the dominion and curse of the broken law (Gal. 3:13). You, O believer, have become dead to the law by the body of Christ and are married to another husband, even to Him who is raised from the dead, that you may bring forth fruit unto God (Rom. 7:4). You are dead to the law of works; nevertheless, you live. You live to God as your own God, your covenant God, and you serve Him in newness of spirit. In union with your living Redeemer, who loved you and gave Himself for you, you live a life of justification, and consequently, it is your privilege as well as your duty to live a life of sanctification and consolation. Being justified by faith, you have peace with God through our Lord Jesus Christ and, in some measure, peace of conscience. If then the law as a covenant of works should at any time enter your conscience again and require perfect obedience from you as the ground of your title to eternal life, saying, “This do, and thou shalt live” (Luke 10:28), present to it, in the hand of faith, the perfect obedience of your divine Surety in answer to that demand. And as often as the law in your conscience repeats the high demand, renew your application of His consummate obedience and trust firmly that it was performed for you in order to entitle you to eternal life. The righteous law, magnified and made honorable by that meritorious obedience, will, in proportion as you do so, cease to disturb the peace of your conscience. The spotless obedience of the second Adam is, as was observed above, the only obedience that you should present to the law as a covenant of works; and your own personal obedience is the only obedience that you ought to exhibit to it as a rule of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 223–24.</span></figcaption>

<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>

h we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.”

— William Whitaker, A Treatise on Original Sin… (d. 1595; Legat, 1600), bk. 1, ch. 7, pp. 25-26 trans. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+you+%5Ba+Romanist%5D+say+that+that+privation+which+Adam+contracted+by+sinning%2C+we%2C+by+being+born%2C+although+it+is+a+sin%2C+is+yet+not+our+sin+nor+proper+to+us%2C+unless+because+what+Adam+did+when+he+sinned%2C+we+also+did%2C+the+apostle+saying%2C+%E2%80%9CIn+him+all+have+sinned.%E2%80%9D+%5BRom.+5%3A12%5D+And+this+also+I+acknowledge.+For+his+will+was+ours%3B+and+therefore+his+transgression+is+ours%2C+because+he+is+not+considered+as+one+man%2C+but+as+the+root+of+the+human+race%2C+in+whom+we+were+all+included+by+virtue+%5Bin+potency+or+in+power%5D%2C+as+Augustine+says%2C+%E2%80%9Cwe+were+all+that+one+man%E2%80%9D+%28De+pecc.+merit.+%26+remiss.%2C+bk.+1%2C+ch.+10%29.+But+now+original+sin+does+not+consist+only+in+the+deformity+which+the+fault+of+Adam+brought+forth%2C+but+it+also+comprehends+the+act+of+that+sin+itself%2C+if+we+did+the+same+as+Adam+did%2C+if+we+truly+sinned+with+Adam%2C+and+what+he+willed%2C+we+willed.+Original+sin+will+therefore+not+be+so+involuntary+as+you+think%2C+so+that+it+is+therefore+the+least+of+all+sins+because+it+has+the+least+of+that+which+is+voluntary.+For+if+Adam%E2%80%99s+will+was+ours%2C+as+much+as+Adam+willed%2C+so+much+are+we+also+to+be+thought+to+have+willed.+But+Adam+sinned+knowingly+and+willingly%3B+we+therefore+in+him%2C+and+by+that+his+will%2C+both+have+sinned+and+willed+to+sin.+But+unless+you+admit+imputation+here+%28a+word+from+which+you+abhor+and+carefully+guard+yourself%29%2C+you+will+fall+into+the+greatest+absurdity%2C+and+you+will+fight+with+yourself%2C+you+who+a+little+before+said+that+the+sin+which+entered+into+the+world%2C+and+by+which+we+are+all+made+sinners%2C+is+not+the+actual+sin+of+Adam%2C+but+a+certain+iniquity+contracted+from+it+and+transmitted+into+us.+Now+you+attribute+to+us+the+same+will+of+sinning+which+was+in+Adam%3B+otherwise%2C+you+affirm%2C+this+privation+left+in+nature+by+sin+could+not+make+us+sinners.+Therefore%2C+we+are+not+only+bound+by+a+habitual+iniquity%2C+but+we+have+sinned+with+an+actual+will+in+Adam%3B+and+this+will+is+primarily+to+be+considered+in+original+sin%2C+without+which+we+could+neither+be+nor+be+held+as+sinners.+What+you+%5BBellarmine%5D+interpose+concerning+a+pact+or+precept+pertains+nothing+to+the+matter%3B+for+whether+Adam+received+this+justice+on+this+law+and+condition%2C+that+he+should+either+preserve+or+lose+it+for+himself+and+his+own%2C+or+whether+no+such+convention+intervened+between+God+and+Adam%2C+since+he+was+the+parent+and+origin+of+the+nature+and+of+the+human+race%2C+it+was+necessary+that+in+him+we+either+stand+or+fall.+Although%2C+that+God+threatened+him+with+death+if+he+should+move+his+hand+to+the+forbidden+tree%2C+from+this+it+sufficiently+appears+that+he+had+been+forewarned+of+the+danger+into+which+he+would+cast+himself+headlong+if+he+should+sin%2C+of+which+nothing+was+to+be+feared+if+he+should+remain+in+his+duty.+And+hither+is+wont+to+be+brought+what+we+read+in+the+prophet%3A+%E2%80%9CBut+they+like+Adam+have+transgressed+the+covenant%E2%80%9D+%28Hos.+6%3A7%29.+Nor+is+it+to+be+thought+that+Adam+was+ignorant+either+of+the+reward%2C+if+he+should+not+sin%2C+or+of+the+punishment%2C+if+he+should+dare+to+sin.+Unless+this+had+been+foretold+to+him%2C+he+would+have+had+some+excuse%2C+although+not+a+sufficient+one%3B+now%2C+having+been+taught+before+of+the+event%2C+since+he+did+not+have+faith+nor+take+care+for+himself%2C+he+is+to+be+thought+to+have+deservedly+fallen+into+this+calamity.+Although%2C+however%2C+there+had+been+no+word+on+this+matter%2C+yet+what+unhappiness+he+willingly+brings+upon+himself%2C+God+has+justly+inflicted+upon+all+his+posterity.+But+in+what+way%3F+Because+His+will+is+the+norm+of+right+and+of+justice.+You+will+never+otherwise+understand+it+to+have+been+just+that+we+are+all+born+miserable+on+account+of+the+temerity%2C+or+infidelity%2C+or+ambition%2C+or+whatever+fault+of+the+first+man.+For+that+you+say+his+will+was+ours%2C+and+we+willed+in+him%2C+I+confess+to+be+true%2C+but+the+reason+for+this+truth+is+none+other+than+the+will+of+the+creator.+For+what+cause+will+you+bring+%5Bon+your+view%5D+why+all+children+do+not+in+the+same+way+atone+for+the+faults+of+their+parents%3F+You+will+say+that+Adam+is+to+be+considered+as+the+seed+and+principle+of+nature%2C+and+his+sin+was+the+sin+of+nature+itself%3B+the+sins+of+others+are+personal%3B+therefore+his+is+transfused+with+nature%2C+not+those+of+others.+I+hear%2C+and+I+do+not+object.+But+why+Adam+by+sinning+destroyed+not+only+his+person+but+nature%2C+when+other+men+harm+their+own+persons+but+do+not+make+nature+worse%2C+assign+a+cause%2C+if+you+can%2C+other+than+the+most+just+will+of+God.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Treatise+on+Original+Sin%E2%80%A6+%28d.+1595%3B+Legat%2C+1600%29%2C+bk.+1%2C+ch.+7%2C+pp.+25-26+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc3c1fb98.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc3c1fb98.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=For%20you%20%5Ba%20Romanist%5D%20say%20that,the%20most%20just%20will%20of%20God&amp;text=For%20you%20%5Ba%20Romanist%5D%20say%20that%20that%20privation&amp;text=other%20than%20the%20most%20just%20will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9fe258b73e" data-kw="">
<blockquote><p>Man, on the other hand, whose nature was to be a mean between the angelic and bestial, [God] created in such sort, that if he remained in subjection to His Creator as his rightful Lord, and piously kept His commandments, he should pass into the company of the angels; and obtain, without the intervention of death, a blessed and endless immortality.</p></blockquote>

</figure><figure class="quote" id="q-34d705c256" data-kw="">
<blockquote><p>Acquaintance with this covenant is of the greatest importance, for whoever errs here or denies the existence of the covenant of works will not understand the covenant of grace, and will readily err concerning the mediatorship of the Lord Jesus. Such a person will very readily deny that Christ by His active obedience has merited a right to eternal life for the elect. This is to be observed with several parties who, because they err concerning the covenant of grace, also deny the covenant of works. Conversely, whoever denies the covenant of works, must rightly be suspected to be in error concerning the covenant of grace as well.</p></blockquote>

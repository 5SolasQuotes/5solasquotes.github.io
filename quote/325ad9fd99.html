<blockquote><p>Question [Objection] 4: But the ancients knew no lay-elders. Answer: Nor do we de jure [by right] know them [as a standing and universal law in all cases], they are Church-men, and should be for all their lifetime entertained upon the Church’s charges; what our Church de facto [in actual fact] does tolerate by reason of our Church’s poverty, is another question.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience</cite>, … (London, 1647), 17th thesis, p. 76</span></figcaption>

</figure><figure class="quote" id="q-1c0ebd7729" data-kw="">
<blockquote><p>Also, though it be true that one and the same man may both teach and exhort, and the comparison of the natural body [Rom. 12:4] does not in all things hold, for one member cannot both be the eye to see and the ear to hear [in the human body], but both are here a sort of eye to the Church; yet has Christ made the pastor and the doctor different. It is needless to dispute if they differ in nature, and if it be a confounding of Christ’s order that one be both, when Christ has given gifts for both to one man, for first, the Word of God does difference them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 158</span></figcaption>

</figure><figure class="quote" id="q-bde90d2692" data-kw="">
<blockquote><p>In the Roman, yea in prelatical Churches there are scarce any footsteps at all of the offices of preaching presbyters and deacons as they were instituted by the apostles. The apostles ordained presbyters to preach the Word, to minister the sacraments, to govern the Church and to make use of the keyes. But the Popish and prelatical presbyters have not the power of the keys, nor the power of Church government, for it is proper to their prelates; as for the other two, they are common to their deacons, for they also do preach and baptize… As touching deacons, they were ordained by the apostles for collecting receiving, keeping and distributing of ecclesiastical goods, for maintaining of ministers, schools, churches, the sick, stranger, and poor. The Popish and prelatical deacons have no such office, but an office which the apostles never appointed to them, for they had no preaching nor baptizing deacons. Philip preached [Acts 8:5, 12] and baptized [Acts 8:12-13, 38], not as a deacon [Acts 6:5], but as an evangelist, Acts 21:8. Besides, at the time of his preaching and baptizing, he could not have exercised the office of his deaconship by reason of the persecution, which scattered rich and poore and all, Acts 8:1. That which Stephen [a deacon, Acts 6:5] did, Acts 7, was no more then every believer was bound to do when he is called to give a testimony to the truth and to give a reason of his faith and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, …. (Edinburgh: Bryson, 1641), ch. 11, pp. 79-80</span></figcaption>

</figure><figure class="quote" id="q-8db5789f55" data-kw="">
<blockquote><p>17. It having been the custom of the Church in the apostles’ days, to have orindarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts, n.p.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“17. It having been the custom of the Church in the apostles’ days, to have orindarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) | The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C17.+It+having+been+the+custom+of+the+Church+in+the+apostles%E2%80%99+days%2C+to+have+orindarily+many+officers+in+a+Church%2C+and+the+private+part+of+the+ministerial+duty+being+so+exceeding+great+and+of+indispensible+necessity+where+it+can+be+performed%2C+and+also+because+it+is+less+satisfactory+and+convenient+for+one+minister+alone+to+try+cases+where+more+may+be+had%2C+we+therefore+judge+it+needful+to+use+all+lawful+means+to+procure+more+ministers+or+elders+than+one+in+each+church%2C+even+proportionable+to+the+number+of+souls+and+greatness+of+the+Word%3B+And+if+for+want+%5Black%5D+of+men+or+maintenance%2C+there+cannot+learned+men+be+obtained%2C+we+judge+it+fit+to+take+the+assistance+of+sober%2C+orthodox%2C+judicious+persons+of+competent+ability+for+private+instruction+and+oversight%2C+and+ordained+to+this+work%2C+though+defective+in+learning+and+less+able+to+publicly+teach%2C+and+who+may+leave+public+speaking+to+him+that+is+more+able+and+do+the+more+of+the+less+public+work%2C+and+that+such+if+other+maintenance+be+wanting%2C+may+lawfully+and+fitly+labor+with+their+hands%3A+And+as+long+as+we+agree+that+these+elders+are+ordained+church+officers%2C+and+what+shall+be+their+work%2C+there+needs+to+be+no+breach+among+us%2C+though+we+determined+not+of+their+power+in+sacraments+and+whether+their+office+be+the+same+with+the+teaching+elders%3A+Whilst+we+agree+in+practice%2C+we+may+leave+men%E2%80%99s+several+principles+in+such+a+difficult+controverted+point+to+their+own+judgments%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the

<blockquote><p>…therefore in respect of this, men had need to rest so much the more, that by the rest of the seventh day they, being refreshed, might be more enabled even in the strength of their bodies, to do the works of their calling cheerfully. For as Daneau says, ‘Not only the mind of man is to be refreshed, but the body also….’ (Daneau, Ethic. Christian., lib. 2, cap. 10. [(1577) 168v; (1582) 161v.])</p></blockquote>

<blockquote><p>1. Some things are necessary by divine ordination, as magistracy; ‘Whosoever resists the power,’ says the apostle, ‘resists the ordinance of God;’ and ‘the powers that be, are ordained of God,’ Rom. 13:1-2, etc. And as magistracy, so ministry is the ordinance of God, 1 Cor. 12:28, ‘And God hath set some in the Church, first Apostles, etc.’ 2. Some things are necessary by divine precept; as for example, the exercise of the power of the magistrate is not only necessary by virtue of God’s instituting and ordaining magistracy, but also by the command of God, which obliges magistrates to punish vice, to execute wrath upon them who do evil, to promove, encourage and praise that which is good; to protect their subjects in well-doing, and to preserve peace. And so ministers are under a necessity of preaching the Gospel by the command of God. 3. Some things are necessary because God has made them useful and convenient for man, and has given them to man for his use; they are in their nature convenient for man, given and designed of God for the good of man; thus meat and clothing, and houses, peace and the protection of lawful authority are necessary. 4. Some things are necessary means in order to a necessary end; and these again are necessary, either simply for attaining the end, or necessary for the better or more easy and convenient attaining of the end; as a house is necessary, not simply for hearing of the Word, but for the more convenient hearing of the Word, because it shelters the minister and people from storms, winds and scorching heat, etc. Thus the protection of lawful authority is necessary for the peaceable hearing of the Word without disturbance. 5. Some things are necessary for preventing of evil; the evil either of sin, or of affliction and calamity. 6. Some things become necessary, or the more necessary to be done, because of those who urge the forbearance of them out of some erroneous principle, or for establishing of some error. And thus Mr. Rutherford shows in the forecited treatise [the Appendix on Scandal to The Divine Right of Church Government], that to forbear the eating of swine’s-flesh before a Jew, who alleges that it is a sin, or breach of the commandment of God to do so; to forbear it now when we are fully possessed in that liberty wherewith Christ has made us free, were to harden the Jew in his Judaism, and the way to bring us again under the yoke of the Ceremonial Law.</p></blockquote>

</figure><figure class="quote" id="q-129532c924" data-kw="">
<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>

%20necessities" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsetled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures</cite>, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</span></figcaption>

— John White, A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+reasons+by+which+it+appears+that+this+restraint+of+kindling+a+fire+%5Bby+the+Israelites+in+the+wilderness%5D+on+the+Sabbath+day+was+only+temporary%2C+are+these%3A+%E2%80%A6+Secondly%2C+this+seems+to+cross+our+Savior%E2%80%99s+general+rule%2C+Mk.+2%3A27%2C+that+the+Sabbath+was+made+for+man%2C+and+not+man+for+the+Sabbath%3B+He+means+for+man%E2%80%99s+comfort+and+refreshing%2C+for+which+kindling+of+fire+and+dressing+of+meat+may+be%2C+and+are+in+a+sort+necessary.+Thirdly%2C+our+Savior+allows+the+loosing+of+a+beast+from+the+stall%2C+and+leading+of+him+to+the+water+on+the+Sabbath+day%3A+now+we+know%2C+the+beast+might+be+provided+for+by+setting+water+in+the+stall+overnight%2C+which+would+refresh+it+sufficiently%2C+and+better+than+meat+dressed+overnight+could+comfort+many+men.+Fourthly%2C+we+find+our+Savior+present+at+a+great+feast%2C+Lk.+14%3A1%2C+where+many%2C+and+it+seems+persons+of+quality%2C+verses+7%2C+12%2C+were+bidden%3A+now+it+is+very+unlikely+that+the+provisions+for+that+feast+were+dressed+over+night%3B+and+if+it+were+dressed+on+that+day%2C+neither+would+the+Pharisee+have+permitted%2C+nor+our+Savior+have+countenanced+the+dinner+with+his+presence%2C+if+dressing+of+meat%2C+kindling+of+fires+on+the+Sabbath+day%2C+had+been+forbidden+by+the+law.+Now+why+the+dressing+of+manna%2C+while+the+Israelites+were+in+their+peregrination+in+the+wilderness+was+forbidden%2C+though+the+dressing+of+other+meats+might+be+allowed+afterwards%2C+there+may+be+some+reason+given.+For+manna+it+may+be%E2%80%A6+as+good+and+comfortable+eaten+cold+as+hot%2C+and+the+preparing+overnight%2C+might+be+no+inconvenience+at+all%3B+howsoever+it+is+out+of+question+that+in+that+unsetled+condition+of+the+Israelites+wandering+in+the+wilderness%2C+when+they+were+enforced+to+pick+up+fuel%2C+where+they+could+get+it%2C+baking+and+boiling+must+needs+be+more+troublesome+and+laborious+than+it+was+afterwards+in+Canaan%2C+where+being+settled+in+their+dwellings%2C+they+had+all+things+whereof+they+were+to+make+use+for+such+works+provided+and+ready+at+hand.%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Way+to+the+Tree+of+Life+Discovered+in+Sundry+Directions+for+the+Profitable+Reading+of+the+Scriptures...+%281647%29%2C+A+Digression+concerning+the+Morality+of+the+Fourth+Commandement%2C+Section+III%2C+%E2%80%98The+Morality+%26+Perpetuity+of+the+Sabbath+Proved+out+of+the+Fourth+Commandement%E2%80%99%2C+pp.+294-95+White+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5fe307e2c4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5fe307e2c4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=The%20reasons%20by%20which%20it%20appears,works%20provided%20and%20ready%20at%20hand&amp;text=The%20reasons%20by%20which%20it%20appears%20that%20this&amp;text=for%20such%20works%20provided%20and%20ready%20at%20hand" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>8. Of the beginning and ending of the Sabbath — The first rule about time. 8. It may seem to some necessary that something should be premised concerning the measure or continuance of the day to be set apart to a holy rest to the Lord; but it being a matter of controversy, and to me, on the reasons to be mentioned afterwards, of no great importance, I shall not insist upon the examination of it, but only give my judgment in a word concerning it. Some contend that it is a natural day, consisting of twenty-four hours, beginning with the evening of the preceding day, and ending with the same of its own. And accordingly so was the church of Israel directed, Lev. 23:32, “From even unto even shall ye celebrate your Sabbath;” although that does not seem to be a general direction for the observation of the weekly Sabbath, but to regard only that particular extraordinary Sabbath which was then instituted, namely, the day of atonement, on the tenth day of the seventh month, verse 27. However, suppose it to belong also to the weekly Sabbath, it is evidently an addition to the command, particularly suited to the Mosaical pedagogy, that the day might comprise the sacrifice of the preceding evening in the services of it; from an obedience whereunto we are freed by the gospel. Neither can I subscribe to this opinion; and that because, — (1.) In the description and limitation of the first original seven days, it is said of each of the six that it was constituted of an evening and a morning, but of the day of rest there is no such description; it is only called “the seventh day,” without any assignation of the preceding evening unto it. (2.) A day of rest, according to rules of natural equity, ought to be proportioned to a day of work or labor, which God has granted to us for our own use. Now, this is to be reckoned from morning to evening: Psalm 104:20-23: “Thou makest darkness, and it is night: wherein all the beasts of the forest do creep” (from whose yelling the night has its name in the Hebrew tongue.) “The young lions roar after their prey, and seek their meat from God. The sun arises, they gather themselves together, and lay them down in their dens. Man goes forth unto his work and to his labor until the evening.</p></blockquote>

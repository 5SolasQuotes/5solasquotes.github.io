<main class="wrap"><figure class="quote" id="q-fa459e7ca9" data-kw="">
<blockquote><p>But their [the Independents’] main difference from all the Reformed, and greatest consonancy with the Brownists [separatist Independents], is in this, that as they teach all outward signs of worship in the time of the celebration to be idolatry [such as the societal customs the Scots practiced], and hereupon declare the necessity of all men who will follow the example of the first communicants, to keep on their hats all the time of this holy action; so likewise the Independents begin to teach their disciples; For however at Amsterdam this day the named doctrine be not fully practiced, the men there covering their heads in the time of the celebration, but every one uncovering, during the time of their own personal participation of the elements, yet we are now taught at London that covering is most requisite at the time of participation. That this act is a rite significant to the communicants of their table-honor and fellowship with Christ, also that the minister in all his celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, [who are] sitting covered when they eat of their Father’s meat.† † I have heard some of their chief men discourse publicly enough to this purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (London, 1645) | ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122 &amp; 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdb471fcca" data-kw="">
<blockquote><p>Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-richardson.html">John Richardson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Choice Observations &amp; Explanations upon the Old Testament</cite>, … which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.”

sonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Many%20signs%20of%20lamentations%20are%20expressed,the%20flesh%2C%20tearing%20it%2C%20cutting%20it&amp;text=Many%20signs%20of%20lamentations%20are%20expressed%20here.%20Which&amp;text=marks%20upon%20the%20flesh%2C%20tearing%20it%2C%20cutting%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4e1d6a9df0" data-kw="">
<blockquote><p>1 Cor. 11:16, ‘We have no such custom, nor the churches of Christ’… the apostle is there speaking of things wherein custom is indeed the rule, as having the head bare, or covered, wearing long or short hair: it does not thence follow (if the apostle did there make it the rule) that it must also be the rule in other things… he [the episcopalian opponent] pretends to convince us further, that Augustine distinguished the custom of the universal Church from the custom of particular places, and he makes the one mutable, the other not so. He needed not be at pains to convince us of that distinction. I know nobody that doubts of it, nor that reject the customs that are truly universal, unless they clash with Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … wherein the Divine Right of the Government of the Church by Presbyters acting in Parity, is Asserted… (Edinburgh, 1697) Rule was a leading father of the Revolution Church of Scotland who wrote numerous works at that time for the divine right of presbyterianism. | section 6, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-0bb30d911a" data-kw="">
<blockquote><p>Sundry religious ordinances are appointed in the New Testament: that there should be every Lord’s Day a collection for the poor: that the man being after a more excellent manner the image of God should pray bare-headed, not being ashamed to show his head, but having a kind of headship over the woman; and the woman should cover her head, when she prays… no Christian Church can consist without some external rites and ceremonies, which if they be not repugnant to the Word of God, are to be observed by us, as these ordinances of religion were by the Jews. …In these indifferent things which in their own nature are neither good, nor evil, we must not contend, breaking the peace and unity of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Philemon and Hebrews</cite>, (London, 1635), on Heb. 9:1, pp. 327-28</span></figcaption>

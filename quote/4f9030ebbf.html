<main class="wrap"><figure class="quote" id="q-4f9030ebbf" data-kw="">
<blockquote><p>Whoever, therefore, is anxious to observe the obligations to which man is liable, and to maintain a regard for his nature, let him raise himself from the ground, and, with mind lifted up, let him direct his eyes to heaven: let him not seek God under his feet, nor dig up from his footprints an object of veneration, for whatever lies beneath man must necessarily be inferior to man; but let him seek it aloft, let him seek it in the highest place: for nothing can be greater than man, except that which is above man. But God is greater than man: therefore He is above, and not below; nor is He to be sought in the lowest, but rather in the highest region. Wherefore it is undoubted that there is no religion wherever there is an image.1 For if religion consists of divine things, and there is nothing divine except in heavenly things; it follows that images are without religion, because there can be nothing heavenly in that which is made from the earth. And this, indeed, may be plain to a wise man from the very name.2 For whatever is an imitation, that must of necessity be false; nor can anything receive the name of a true object which counterfeits the truth by deception and imitation. But if all imitation is not particularly a serious matter, but as it were a sport and jest, then there is no religion in images, but a mimicry of religion. That which is true is therefore to be preferred to all things which are false; earthly things are to be trampled upon, that we may obtain heavenly things. For this is the state of the case, that whosoever shall prostrate his soul, which has its origin from heaven, to the shades beneath, and the lowest things,3 must fall to that place to which he has cast himself. Therefore he ought to be mindful of his nature and condition, and always to strive and aim at things above. And whoever shall do this, he will be judged altogether wise, he just, he a man: he, in short, will be judged worthy of heaven whom his Parent will recognise not as abject, nor cast down to the earth after the manner of the beasts,4 but rather standing and upright as He made him. NOTES 1. Quare non est dubium quin religio nulla sit ubicunque simulacrum est. Such is the uniform Ante-Nicene testimony.

2. Simulacrum, “an image,” from simulo, “to imitate.”

3. The infernal regions.

4. Quadrupeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lactantius.html">Lactantius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Divine Institutes,” in Fathers of the Third and Fourth Centuries: Lactantius, Venantius, Asterius, Victorinus, Dionysius, Apostolic Teaching and Constitutions, Homily, and Liturgies</cite>, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. William Fletcher, vol. 7, The Ante-Nicene</span></figcaption>

<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>

<blockquote><p>Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.</p></blockquote>

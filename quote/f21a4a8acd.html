<main class="wrap"><figure class="quote" id="q-f21a4a8acd" data-kw="">
<blockquote><p>When officers gather taxes for the [usurping] State, they have no commission to demand our declarations of the State’s authority first, but only to receive the money taxed, which this author knows is a truth known to every one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or, A Vindication of our Lawful Submission to the Present Government, or to a Government Supposed Unlawful, but Commanding Lawful Things, Likewise how such an Obedience is Consistent with our Solemn League &amp; Covenant</cite>, … (London, 1649), p. 33 This was more than likely written by Ascham despite it being attributed to Rouse.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-035047e7f3" data-kw="">
<blockquote><p>Though the children of Ammon did a high injury to David, yet no injury can be recompensed in justice with the pressure of the constrained subjection of loyalty to a violent lord. If David had not had an higher warrant from God than an injury done to his messengers, he could not have conquered them. But the Ammonites were the declared enemies of the church of God, and raised forces against David when they themselves were the injurers and offenders. And if David’s conquest will prove a lawful title by the sword to all conquerors, then may all conquerors lawfully do to the conquered people as David did; that is, they may ‘put them under saws, and under harrows of iron, and under axes of iron, and cause them pass through the brick-kilne.’ But, I beseech you, will royalists say, that conquerors, who make themselves kings by their sword, and so make themselves fathers, heads, defenders, and feeders of the people, may use the most extreme tyranny in the world, such as David used against the children of Ammon, which he could not have done by the naked title of sword-conquest, if God had not laid a commandment of an higher nature on him to serve God’s enemies so? I shall then say, if a conquering king be a lawful king, because a conqueror, then has God made such a lawful king both a father, because a king, and a tyrant, and cruel and lionhearted oppressor of those whom he has conquered; for God has given him royal power by this example (2 Sam. 12:30-31) to put these, to whom he is a father and defender by office, to torment, and also to be a torturer of them by office, by bringing their backs under such instruments of cruelty as ‘saws, and harrows of iron, and axes of iron.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), p. 47 McWard was a protege of Rutherford and leader of the Scottish covenanters.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-709c62ee8d" data-kw="">
<blockquote><p>The most holy and heavenly man that ever breathed, durst not adventure the salvation of his soul upon the most heavenly thought that ever he conceived. Our impressions of this will help to keep your hearts right in point of righteousness; so as not to build your acceptation before God upon your good works, but only on the works of the Son of God. Study always to keep up the lively impression of this awful truth upon your hearts, that God could find matter of condemnation against you, not only for your worst sins, but from the best of your duties….[A]ll this will not make a righteousness by which I may expect to be justified or accepted of God. No, he [Apostle Paul] accounted all as dung and loss, in the point of justification, that he might be found in Christ, not having his own righteousness. So that you see, even in the presence of your best graces, works, and duties of obedience, free grace through imputed righteousness is to be your only sanctuary and city of refuge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Late Rev. Ebenezer Erskine</cite>, 1:145.</span></figcaption>

</figure><figure class="quote" id="q-84a6e98317" data-kw="">
<blockquote><p>Such works (that obtain a reward) are not only those of condign merit, but also: (1) the execution of a donation or almsgiving that is entirely gratuitous, which a poor man, humbly and faithfully waiting for it, does not render void by contempt or ingratitude; (2) the execution of a promise which is made not only under the condition of accepting and not despising the gift (a condition which no donation is so free as not to include), but also of a certain work besides—on which account it is in some sense meritorious, even though there may perhaps be no equality or commutation between this work and the promised reward; as, for example, if a father promises a jewel to his son who takes bitter medicine. Yet this is not a purely gratuitous donation, since the thing does not begin to be owed as soon as the promise is accepted, but when the condition has been fulfilled; nor is it properly merit of condignity, since the one acting benefits himself rather than gives something to another for which he ought to receive an equal price. But it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children to whom God has promised rewards, we admit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-crocius.html">Ludovicus Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, bk. 4, ch. 18, pp. 1130-31, as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 369-70, trans. ChatGPT-5 Crocius (1586 – 1653 or 1655) was a German reformed minister, a delegate at the Synod of Dort and a professor of theology and philosophy in Bremen.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>Does it belong to the perfection of the soul that we comprehend God’s essence? Response: certainly this does not appear to be the case, and the reason is that what is incomprehensible cannot be comprehended. But, they say, even if what is infinite cannot be comprehended distinctly, nevertheless, it can be comprehended confusedly, and they called this ‘comprehension.’ Thus, that famous phrase: ‘All God is known, but not totally.’ [totum sed non totaliter; this phrase summarizes Thomas, Summa, pt. 1, q. 12, art. 7, replies to objections 2-3] And they bring up the example of an eye, which contemplates the whole man; namely, confusedly, but not totally. Response: There is no comparison between things which come within reach of eyesight and the divine nature… the divine nature is most simple; certainly the soul cannot confusedly comprehend those things which are most simple, let alone the senses, unless it comprehends them in another way than by essence; that is, by laying hold of their very essence. And thus, if God is known by us by essence, it is necessary for him to be known by us distinctly; and if he is known by us distinctly, he is indeed comprehended, which those who state that God will be seen by essence in the life to come do not wish to concede. the axiom common in the schools, “All that is received is received according to the manner of the recipient.” Now, if God’s essence will be seen, it will be seen in a finite way, for the recipient is finite: and thus, the infinite will be seen by essence in a finite way, which implies a contradiction. For finite knowledge is an image of a thing in the mind, and thus, if knowledge is finite, but the thing comprehended is infinite, on the other hand, it follows that the thing is known and not known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Johannes Hoornbeek, ch. 13, §§19-20 of Institutes of Theology, tr. Charles Johnson</span></figcaption>

+finite%2C+but+the+thing+comprehended+is+infinite%2C+on+the+other+hand%2C+it+follows+that+the+thing+is+known+and+not+known.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+in+Johannes+Hoornbeek%2C+ch.+13%2C+%C2%A7%C2%A719-20+of+Institutes+of+Theology%2C+tr.+Charles+Johnson&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F971cc0d92f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/971cc0d92f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Does%20it%20belong%20to%20the%20perfection,thing%20is%20known%20and%20not%20known&amp;text=Does%20it%20belong%20to%20the%20perfection%20of%20the&amp;text=that%20the%20thing%20is%20known%20and%20not%20known" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

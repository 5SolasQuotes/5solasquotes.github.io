<main class="wrap"><figure class="quote" id="q-157c138df0" data-kw="">
<blockquote><p>The more common and truer opinion recognizes three acts in faith: knowledge, assent, trust (notitiam, assensum, fiduciam). Although all the others can be referred to these, still that we may understand the whole subject more easily, we must treat more distinctly of them.</p></blockquote>

</figure><figure class="quote" id="q-7581bd9f56" data-kw="">
<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-platt.html">David Platt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Follow Me</cite>, p. 60</span></figcaption>

</figure><figure class="quote" id="q-f4b62f779a" data-kw="">
<blockquote><p>Justifying faith is properly that which is defined in the catechism; according to which definition, the general nature of saving faith consists in knowledge and an assured confidence; for there can be no faith in a doctrine that is wholly unknown. … The difference, or formal character of saving faith, is the confidence and application which every one makes to himself, of the free remission of sins by and for the sake of Christ.</p></blockquote>

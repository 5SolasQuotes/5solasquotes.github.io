<main class="wrap"><figure class="quote" id="q-d61a5d9892" data-kw="">
<blockquote><p>That which we in Latin read, cultum, that is, ‘worshipping,’ is in Greek, [Greek], which word, as the Latin fathers write, and especially Augustine in his 10th book, Of the City of God, the 1st chapter, properly signifies the worshipping of God. For although (says he) many other things are worshipped, yet this worship called [Greek] belongs not unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 12, pp. 410-11, 413</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72d522d913" data-kw="">
<blockquote><p>Concerning worshipping or honoring (which two terms are both one)… Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like… God has created us and made us unto his own likeness; and our Saviour Christ has bought us with his blood. And therefore are we God’s possession, of duty and right; and Christ’s servants only, to wait on his will and pleasure, and ought therefore to move neither hand nor foot, nor any other member, either heart or mind, otherwise than He has appointed. God is honoured in his own person, when we receive all things, both good and bad, at his hand; and love his law with all our hearts; and believe, hope, and long for all that He promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

v>
</figure><figure class="quote" id="q-9163853589" data-kw="">

</figure><figure class="quote" id="q-d9f8a76d35" data-kw="">
<blockquote><p>7th Problem. Whether therefore out of the natural law, as contradistinguished from supernatural, the rule and way of worshipping God is able to be deduced or subsumed under it? Response: I deny. Indeed, in general and indefinitely in what way God is to be worshipped, and negatively, in what way He is not to be worshipped, in many things it is able to be shown from there; but the natural worship of God, positively and in the species, now as modified after the Fall, is not able to be explicitly and definitively subsumed under it or deduced from it, much less instituted worship. This is to be expected, therefore, from supernatural revelation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (Utrecht, 1648 ff.), | vol. 1, 21. ‘Appendices to… on the Authority &amp; Righteousness of God, pt. 2’, p. 398, 7th Problem</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

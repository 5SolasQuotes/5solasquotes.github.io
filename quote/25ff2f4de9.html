<main class="wrap"><figure class="quote" id="q-25ff2f4de9" data-kw="">
<blockquote><p>And if there be yet one day in seven holier than others,—if the Sabbath, and that alone, is a time sacred to God, that ordinance of holiness had neither its birth nor its kindred with the ceremonial holy days of an outward economy. It had a higher origin and a loftier character; it was the resting time of God, when He finished His mighty work of creation, long before the Jewish dispensation was appointed; and, holier still, it was the resting time of Christ when He rose from His work of toil and blood, and entered into His rest when that dispensation was abrogated.

There is something mysteriously sublime in that peculiar holiness which distinguishes the Sabbath as the only holy day known under the Gospel dispensation, marked out as it is from all time, since time itself began to be numbered; and connecting, as it seems intended to do, the narrow section of time which belongs to the history of this world with that eternity into which it is about to be merged. For the ordinance of the Lord’s Day shall bear witness to His resurrection, as the ordinance of the Lord’s Table speaks of His death, “till He come again.”

It was the Sabbath of God the Father at the creation,—a day of His eternal subsistence let down from heaven, and inserted among the days that then began to be counted on the unfallen earth. It was the Sabbath of God the Son at the redemption,—another day of heavenly rest let down from on high, and inserted amid the days of evil and sorrow which this fallen world had so long numbered,—a day on which the Redeemer rested and was refreshed, when His work was done.

And now the Sabbath day both of creation and redemption awaits the development of the Divine dispensations, and points forward to a higher, so surely coming, when the earthly day shall be taken up into the heavenly, and become the Sabbath of God the Holy Ghost,—when He too shall rest from His special work, as the Father and the Son rested before, and shall repose and be refreshed in the contemplation and enjoyment, throughout eternity, of His finished work of grace and spiritual renovation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 419-20.</span></figcaption>

<blockquote><p>[T]he name of God doth signify whatsoever proprieties of perfection, attributes or virtues, God hath revealed and declared in his word concerning his essence, his will, and his works: as that he is wise, just, great, terrible, good, gentle, merciful, patient, penitent, jealous, visiting iniquity, and such like.

The Jews because they will not pronounce the name Jehovah, in stead thereof use Shem. Thence the Caldie paraphrase for God himself, putteth Shem and Hashem, a name, Gen. 10.9. for the virtues or perfections of God, are the very essence of God. Now that name of God cannot be hallowed by any addition, infusion, access, or increase of holiness: as it is written of us, He that is holy, let him be more holy, Apoc. 22.11. for it is holy in it self, that is, severed and exempt from, excelling and exceeding all other common and profane things in purity and holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), p. 49.</span></figcaption>

</figure><figure class="quote" id="q-be5edc98fb" data-kw="">
<blockquote><p>The Christian Reformed Church holds it as one of its distinctive principles that the psalms are to be used in public worship as the chief manual of praise. There is divine authority for this use of the psalms, as shown by 1 Chron. 16:4, 7; II Chron. 29:30; Ps. 105:2; 95:1, 2 and Neh. 12:24. Our Lord and his apostles used them to praise God. The “hymn” of Matt. 26:30 and Mark 14;26 refers to Psalms 113 to 118, the great “Hallel” of the Passover celebration. The hymns, songs, and psalms of Eph. 15:19 and Col. 3:16 evidently to not refer to N. T. compositions but to the O.T. Psalms which in the Greek version bear the titles given above. The psalms meet the great requirements of praise, exalting God in His being and work and continuing confessions of our unworthiness, our faith, our gratitude, our needs. In depth of spirituality the psalms excel the hymns. “In the psalms we hear the abiding, eternal fundamental note of the pious heart resounding.” [G. M. Ophoff, Church Right—ed.]….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-beets.html">Henry Beets</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Historical and Explanatory Introduction,” in The Psalter, Doctrinal Standards, Liturgy, And Church Order of the Christian Reformed Church in America</cite>, (Grand Rapids: William B. Eerdmans Publishing Co., 1926).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-fac1d9e67d" data-kw="">
<blockquote><p>I have arranged the book into fifty-two Meditations, adapted for each Lord’s Day, not merely because it is not intended to read them continuously through, but because the subject is, so to speak, specially identified with the risen Saviour. For the truth lying at the foundation of the Psalms, and which makes them the Hymnal of the Church, is the identification of Christ with the Church.

All the sorrows of the believer run up into the sorrow of Christ; and all the joys of the believer flow from the joy of Christ. And around these three truths — helpless misery, glorious salvation, and faith, with its exponent, prayer — move all the Psalms. Any seeming repetitions may therefore in part perhaps be due to the constant recurrence of these three elements throughout the Psalms.

Had the volume been suitable for it, I would fain have inscribed it, such as it is, to those loved friends to whom it is my privilege to minister in the gospel of His Son. Any mark of affection, however slender, to those who are themselves so earnest and loving, would have been peculiarly grateful.

And now I would send it forth with the earnest prayer that the Lord the Spirit who indited the Psalms, would give us all increasingly, the spiritual understanding and the spiritual joy of them in Christ; and so bless the effort to open this alabaster-box, that the savour of His name may be as ointment poured forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alfred-edersheim.html">Alfred Edersheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Golden Diary of Heart Converse with Jesus in the Book of Psalms. Arranged for every Sunday in the Year</cite>, (London: James Nisbet &amp; Co., 1866), vi-vii.</span></figcaption>

<blockquote><p>…as I will show in more detail, the Anglican formularies do indeed prohibit all icon veneration… His [Dr. Hoskin’s] most important point is the “distinction between worship and veneration.”… The Reformation position cannot be easily sidestepped by the use of distinctions which the Reformers themselves understood and rejected… The rest of this essay will highlight confessional statements from various Reformation churches, including the Anglicans and the Lutherans, to show that there is no place for the veneration of images… Indeed, the rejection of image veneration is a truly pan-Protestant position… Still, the historical record is clear. The Protestant confessions give no allowance for the veneration of icons.</p></blockquote>

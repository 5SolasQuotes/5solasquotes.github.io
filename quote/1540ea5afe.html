<main class="wrap"><figure class="quote" id="q-1540ea5afe" data-kw="">
<blockquote><p>The universal offer made of Christ in the Gospel, has been urged as another objection [to limited atonement]. The fact on which this objection is founded we admit without reservation. We contend for the unlimited extent of the Gospel call, and regard every attempt to restrict it as hostile alike to the letter and the spirit of the Gospel. Here we take the phrases “every creature” — “all the world” — “every one” — “whosoever will,” &amp;c., in the fullest extent of acceptation of which they will admit. …

The principles of human obligation are not affected by the secret will of God. What man ought to do, is one thing; what God will do, is another thing. Now, the Gospel call may be regarded as expressive of man’s duty, rather than of the divine intention. God may, and does command many things, which he knows the persons commanded will never fulfil. These things it is the duty of man to do, but it is not the secret will of God to accomplish. By the warnings, and remonstrances, and solemn admonitions of Noah, he called the antediluvians to repent, and be saved from the waters of the deluge; and that it was their duty to do so, is not surely disproved by what we now know, from the fact, that it was not the secret design of God to save them.

By means of his servant Moses, God commanded Pharaoh to let Israel go, as a means of saving his own life and those of his people; it was his duty certainly to obey this command; but it was not the secret intention of God that the Egyptians and their king should escape the destruction of the Red Sea. The Jews and Roman soldiers were under obligation, from the command “Thou shalt not kill,” not to put Jesus of Nazareth to death; yet it was in consequence of being delivered by the determinate counsel and foreknowledge of God, that he was taken, and by wicked hands crucified and slain.

In like manner, may we not say, that the unlimited offer of the Gospel proves only that it is the duty of all men to believe in Christ for salvation, and not that it is the design or intention of God that all should be saved by him, or that he should obtain salvation for all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement and Intercession of Jesus Christ</cite>, (New York: Robert Carter &amp; Brothers, 1863), pp 209, 211.</span></figcaption>

<blockquote><p>Now although the nature of God be marvellously one and simple, so it is that according to our manner of conception, we distinguish his virtues and properties from his essence. Concerning his properties, we conceive them under very different respects, and pretend not when we say that he is merciful, to beget an apprehension in the minds of those that hear us, that He is just, or when we say that He is wise, to give occasion to think of his power and might, as his attributes have very different objects, so we comprehend them in our understandings under very different ideas: But then when we speak of his essence, we make a kind of abstraction of it from his properties, and represent it as a single and simple thing, in which all his attributes exist as in a common subject. As to what concerns his attributes, we see them in some sort in this life, in that we understand at least in some degree what is the nature of those operations by which they display themselves upon their objects. For we are not perfectly ignorant what may be that inclination in God of pardoning sins to the penitent, and punishing the obstinate and impenitent and things of like nature. But as to his essence, there is no man that does not acknowledge that we understand it not at all in this life; that is to say, we are not able to form any conception in our minds which has any respect to the nature of his essence, only some think that when we shall be received into the heavens, our supreme happiness will consist in the vision of this essence, which certainly seems extremely difficult to be imagined…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evidence of Things Not Seen</cite>, ... (d. 1664; London: Cockerill, 1700), 4th Discourse, Concerning the Happiness of Believers after the Resurrection, pp. 172-74</span></figcaption>

<blockquote><p>The first, that it is not the will of God that all men should be saved. …

Of the first S. Augustine disputeth in this manner, That God will not have all men to be saved, it is manifest, forasmuch as our Saviour wrought many works in the unthankful cities, Corazin, Bethsaida, &amp; Capernaum, which he knew would not repent, but he refrained from shewing any such examples in Tire and Sidon, and Gomorrah and Sodom, which if he had done there, Tire and Sidon had repented in sackcloth &amp; ashes, &amp; Sodom had remained until this day. Moreover, saith he, I give thee thanks, o father, lord of heaven &amp; earth, because thou hast hid these things (meaning the mysteries of salvation) from̄ the wise &amp; understanding, &amp; hast opened them to babes, it is so, o father, because thy good will was such. But how then, saith he, shall we answer the objection of S. Paul? …

If God will have all men to be saved, as the apostle writeth, how is it that the greatest part are damned? … his power is greater thē his will, and his will extendeth not it self so far as his power: his will is not to do all that he can, but he can do whatsoever is his will, as the prophet speaketh. Our god is in heaven, and he doth what he listeth. If it be his will to save all, and his power is omnipotent to do what he will, why then are but a remnant saved? Some, saith August. do answer, that the cause is in themselves, as if God will, but they will not, as it is in the gospel, Jerusalem, Jerusalem, which killest the prophets, and stonest thē which are sent to thee, how often would I have gathered thy children together, as the hen gathereth her chickens, but thou wouldst not? … As though the will of God could be crossed by the will of men, and the almighty could be hindered of his purpose by the weakest vessels. how thē was he omnipotent, if he were willing to gather the children of Jerusalem, but did it not?

That text being not understood, would at the first sight seem to import so much, as if the will of God were made frustrate, and of none effect by the will of men, where then were his omnipotency? … Nay, rather Jerusalem in deed, forasmuch as lay in her, would not have her children gathered together, but his will was not frustrate, for as much as he against her will gathered together as many of them as seemed good to his own will and pleasure. And in another place he doeth answer it more fully, where he saith. … For their parts, &amp; as much in as them lay, they did that which God would not have to be done, but if ye consider the omnipotency of God, they could not doo otherways then was his will.

For, in as much as they did contrary to the will of God, in them so doing was fulfilled the will of God. And it is a wonderful mystery to see, that which is against his will, is not otherwise then he hath willed; for but by his sufferance it could not be, neither doth he suffer it against his will, but with his will: neither would God which is good suffer any thing to be done which is evil, unless his omnipotency were such that he could make good of that which is evil. Finally, to this objection out of Saint Paul, (having first disputed antagonisticò) he maketh his own answer dogmatic, and that two manner of ways.

The first is this: … Where it is written, that God willeth all men to be saved, and yet the greatest part of men are not saved, it is so to be understood. God willeth all men to be saved, that is, no man is saved against his will, but whosoever is saved, it is by his will, not as though there were none whom he would not have saved, but that none are saved, unless he will, and they only whom he will, and therefore he is to be prayed unto that he would, because it cannot otherwise be, but they shall be saved if he will, for the Apostle allegeth this as an argument, that we should pray to him for the salvation of all men, because it is by his will that they are saved. … Not as if he would have every one in particular, of all sorts of people to be saved, but of all sorts some to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dove.html">John Dove</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at Paul’s Cross, the sixth of February. 1596 In which are discussed these three conclusions. 1 It is not the will of God that all men should be saved. 2 The absolute will of God, and his secret decree from all eternity is the cause why some are predestined to salvation, others to d</cite>, (London: R. Dexter, 1597), pp 14-19.</span></figcaption>

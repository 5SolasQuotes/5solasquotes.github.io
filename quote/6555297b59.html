<main class="wrap"><figure class="quote" id="q-6555297b59" data-kw="">
<blockquote><p>Although our justification will be fully declared on the last day (our good works also being brought forward as the sign and proof its truth, Matt 25:34–40), still falsely would anyone maintain from this a twofold gospel justification—one from faith in this life (which is the first); the other (and second) from works on the day of judgment (as some hold, agreeing too much with the Romanists on this point) . . . Thus it is nothing else than an adjudicatory sentence of the possession of the kingdom of heaven from the right given before through justification. And if works are then brought forward, they are not adduced as the foundation of a new justification to be obtained then, but as signs, marks, and effects of our true faith and of our justification solely by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, 3 vol. (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 2:687.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e78e51003" data-kw="">
<blockquote><p>…in my judgment the usual solution of this appearing difficulty… in the discourse of St. James, ch. 2, v. 14 to the end, has not been in the least impeached, nor has had any new difficulty put upon it in some late discourses to that purpose… …It is taken for granted on all hands that there is no real repugnancy or contradiction between what is delivered by these two apostles… …It is taken also for granted on all other occasions that when there is an appearance of repugnancy or contradiction in any places of Scripture, if some or any of them do treat directly, designedly and largely about the matter concerning which there is a seeming repugnancy or contradiction, and others, or any other speak of the same things only obiter, occasionally, transiently, in order unto other ends, the truth is to be learned, stated and fixed from the former places… According unto this rule, it is unquestionable that the doctrine of justification before God is to be learned from the writings of the apostle Paul, and from them is light to be taken into all other places of Scripture where it is occasionally mentioned… For it must be acknowledged that he wrote of this subject of our justification before God on purpose to declare it for its own sake, and its use in the Church, and that he does it fully, largely and frequently in a constant harmony of expressions… As unto what is delivered by the apostle James, so far as our justification is included therein, things are quite otherwise. He does not undertake to declare the doctrine of our justification before God, but having another design in hand as we shall see…</p></blockquote>

</figure><figure class="quote" id="q-08d6a514fe" data-kw="Faith alone">
<blockquote><p>Man is justified by faith without works; therefore by faith alone. The reason of the consequence is manifest because there are not more modes of justifying than these two—by faith and by works. Thus, one being removed, the other must not only necessarily be left, but also left alone. Otherwise the enumeration would not be legitimate. … Now why would the apostle so often and so expressly institute an antithesis between faith and works in this matter, if works could concur with faith in any way to the act of justification? Would he not in this particular have occasioned believers to err by removing works absolutely and simply from it, if they contribute anything towards it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.8</span></figcaption>

<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>

</figure><figure class="quote" id="q-246cf2ebb2" data-kw="">
<blockquote><p>As I have said, therefore, the statement of Moses, “Cursed be everyone who does not abide by all things, etc.,” is not contrary to Paul’s declaration that all who rely on works of the Law are under a curse. For Moses demands a doer who keeps the Law perfectly. But where are we to find such a one? Nowhere. Paul admits that he is not such a one, because he says in Rom. 7:15: “I do not do what I want”; and David says: “Enter not into judgment with Thy servant” (Ps. 143:2). Therefore Moses, together with Paul, necessarily drives us to Christ, through whom we become doers of the Law and are accounted guilty of no transgression. How? First, through the forgiveness of sins and the imputation of righteousness, on account of faith in Christ; secondly, through the gift and the Holy Spirit, who creates a new life and new impulses in us, so that we may keep the Law also in a formal sense. Whatever is not kept is forgiven for the sake of Christ. Besides, whatever sin is left is not imputed to us. Thus Moses agrees with Paul and means the same thing when he says: “Cursed be everyone, etc.,” because he denies that they are keeping the Law when they want to justify themselves on the basis of works; and with Paul he concludes that they are under a curse. Therefore Moses requires true doers, who are men of faith, just as Paul condemns those who are not true doers, that is, who are not men of faith. There is no problem here. Moses was speaking negatively and Paul affirmatively, provided that you define correctly what “doing” means. Thus both are true, namely, that all are under a curse who do not abide by all things, etc., and that those who rely on works of the Law are under a curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260–261.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As I have said, therefore, the statement of Moses, “Cursed be everyone who does not abide by all things, etc.,” is not contrary to Paul’s declaration that all who rely on works of the Law are under a curse. For Moses demands a doer who keeps the Law perfectly. But where are we to find such a one? Nowhere. Paul admits that he is not such a one, because he says in Rom. 7:15: “I do not do what I want”; and David says: “Enter not into judgment with Thy servant” (Ps. 143:2). Therefore Moses, together with Paul, necessarily drives us to Christ, through whom we become doers of the Law and are accounted guilty of no transgression. How? First, through the forgiveness of sins and the imputation of righteousness, on account of faith in Christ; secondly, through the gift and the Holy Spirit, who creates a new life and new impulses in us, so that we may keep the Law also in a formal sense. Whatever is not kept is forgiven for the sake of Christ. Besides, whatever sin is left is not imputed to us. Thus Moses agrees with Paul and means the same thing when he says: “Cursed be everyone, etc.,” because he denies that they are keeping the Law when they want to justify themselves on the basis of works; and with Paul he concludes that they are under a curse. Therefore Moses requires true doers, who are men of faith, just as Paul condemns those who are not true doers, that is, who are not men of faith. There is no problem here. Moses was speaking negatively and Paul affirmatively, provided that you define correctly what “doing” means. Thus both are true, namely, that all are under a curse who do not abide by all things, etc., and that those who rely on works of the Law are under a curse.”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260–261.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+I+have+said%2C+therefore%2C+the+statement+of+Moses%2C+%E2%80%9CCursed+be+everyone+who+does+not+abide+by+all+things%2C+etc.%2C%E2%80%9D+is+not+contrary+to+Paul%E2%80%99s+declaration+that+all+who+rely+on+works+of+the+Law+are+under+a+curse.+For+Moses+demands+a+doer+who+keeps+the+Law+perfectly.+But+where+are+we+to+find+such+a+one%3F+Nowhere.+Paul+admits+that+he+is+not+such+a+one%2C+because+he+says+in+Rom.+7%3A15%3A+%E2%80%9CI+do+not+do+what+I+want%E2%80%9D%3B+and+David+says%3A+%E2%80%9CEnter+not+into+judgment+with+Thy+servant%E2%80%9D+%28Ps.+143%3A2%29.+Therefore+Moses%2C+together+with+Paul%2C+necessarily+drives+us+to+Christ%2C+through+whom+we+become+doers+of+the+Law+and+are+accounted+guilty+of+no+transgression.+How%3F+First%2C+through+the+forgiveness+of+sins+and+the+imputation+of+righteousness%2C+on+account+of+faith+in+Christ%3B+secondly%2C+through+the+gift+and+the+Holy+Spirit%2C+who+creates+a+new+life+and+new+impulses+in+us%2C+so+that+we+may+keep+the+Law+also+in+a+formal+sense.+Whatever+is+not+kept+is+forgiven+for+the+sake+of+Christ.+Besides%2C+whatever+sin+is+left+is+not+imputed+to+us.+Thus+Moses+agrees+with+Paul+and+means+the+same+thing+when+he+says%3A+%E2%80%9CCursed+be+everyone%2C+etc.%2C%E2%80%9D+because+he+denies+that+they+are+keeping+the+Law+when+they+want+to+justify+themselves+on+the+basis+of+works%3B+and+with+Paul+he+concludes+that+they+are+under+a+curse.+Therefore+Moses+requires+true+doers%2C+who+are+men+of+faith%2C+just+as+Paul+condemns+those+who+are+not+true+doers%2C+that+is%2C+who+are+not+men+of+faith.+There+is+no+problem+here.+Moses+was+speaking+negatively+and+Paul+affirmatively%2C+provided+that+you+define+correctly+what+%E2%80%9Cdoing%E2%80%9D+means.+Thus+both+are+true%2C+namely%2C+that+all+are+under+a+curse+who+do+not+abide+by+all+things%2C+etc.%2C+and+that+those+who+rely+on+works+of+the+Law+are+under+a+curse.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1%E2%80%934%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+260%E2%80%93261.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F246cf2ebb2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/246cf2ebb2.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/09/the-reformed-agree-with-luther/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

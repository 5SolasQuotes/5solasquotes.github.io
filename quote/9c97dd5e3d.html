<main class="wrap"><figure class="quote" id="q-9c97dd5e3d" data-kw="">
<blockquote><p>1. That the [term] division which is intended here [in this chapter] is not every contest and alienation of mind, and difference of practice incident to men, but that which is proper to the church concerning church affairs, and so is to be distinguished from civil debates and contentions. We would advert also that there may be church differences that fall not under the charge of scandal, as when in some things men of conscience are of different judgments, yet carry it without any offense or breach of charity, or when in some practices there is diversity with forbearance, as was in Polycarp’s days, and the time of Irenaeus (about Easter matters)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Scandal</cite>, (Naphtali Press, 1990), pt. 4, ch. 1, ‘How Heresy, Schism &amp; Division Differ’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6a1d5eb81" data-kw="">

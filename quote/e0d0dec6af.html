<blockquote><p>Progressive evolution within the Divine nature, would imply a career for the Deity in which He was passing from less to more perfect stages of existence, and would bring Him within the realm of the relative and conditioned.

Latency is necessarily excluded from the Eternal One, by virtue of that absolute perfection and metaphysical self-completeness whereby his being is “without variableness or shadow of turning.” …

For the Deity, though self-complete and incapable of development himself, has yet made that which is potential and destined to an unfolding. He has created a universe that is full of latent powers and agencies.</p></blockquote>

<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not.

25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<blockquote><p>41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]

42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible.

43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not.

44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable.

45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause.

46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency.

47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).]</p></blockquote>

</figure><figure class="quote" id="q-20c3a53900" data-kw="">
<blockquote><p>For suppose we agree that its [God’s] existence involved no actualization of potential. Might not we still say that its activity involved the actualization of potential? Might not we thus say that while it had no potentialities with respect to its existence, it does have potentialities with respect to its activity (such as its activity of actualizing the existence of other things)? There are several problems with this suggestion, however, one of which might be obvious now that we have set out the principle agere sequitur esse [action follows being], according to which what a thing does reflects what it is. If the first cause of things exists in a purely actual way, how could it act in a less than purely actual way? How could its acting involve potentiality any more than its existence does? A thing’s existence is, after all, what is metaphysically most fundamental about it; everything else follows from that. In this case we are talking about something whose very existence is purely actual and devoid of potentiality. So, from where in its nature are the (metaphysically less fundamental) potentialities for activity that the critic suggests it has supposed to derive? Another problem with the suggestion in question is that to say of God that he has potentiality with respect to his activity, though not with respect to his existence, entails that God has parts—a purely actual part, and a part that is a potentiality. Now, as we saw in chapter 2, whatever has parts requires a cause. The reason is that the whole of which the parts are constituents is merely potential until actualized by some principle which combines the parts. This principle cannot be something intrinsic to the thing, for in that case it would be the cause of itself, which is incoherent. So, it must be something extrinsic to the thing. Keep in mind that this is true even if we think of the thing in question as having always existed, since we still need some explanation of why the parts are combined at all regardless of how long they have been combined. Even if the thing had no temporally prior cause, it would still require an ontologically prior cause. But to say of the first cause of things that it has a cause of its own is also incoherent, since if it has a cause of its own, it just isn’t really the first cause at all, and it isn’t what terminates the regress of a hierarchical series of the causes of the existence of things. For this reason too, then, there isn’t any sense to be made of the idea that God qua [as] first cause has potentialities with respect to his activity. So, again, God is purely actual, with no potentiality at all.</p></blockquote>

<blockquote><p>God is unchangeable in his essence, nature, and perfections. Immutability and eternity are linked together; and indeed true eternity is true immutability, whence eternity is defined the possession of an immutable life. It is the essential property of God, not to have any change in his being, or any alteration by any thing without him or within him.</p></blockquote>

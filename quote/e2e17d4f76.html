<main class="wrap"><figure class="quote" id="q-e2e17d4f76" data-kw="">
<blockquote><p>The divine attributes are certain essential properties, which God is pleased in Scripture to ascribe or attribute unto Himself; they are also called the perfections of God, or divine predications or titles. They are not distinguished from the essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving. All the attributes in God are one and the same perfection. It is better said of God that He is his attributes than that He has attributes: The attributes are not distinguished in God, but in our manner of understanding, who, being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. (Est inadequatus conceptus sed non falsus [It is an inadequate concept, but not false]. See Weems, Of the Image of God in Man, ch. 13) The sun, when it is perpendicular, had it an eye, would behold all that at once which we, by reason of the inadequateness and unproportionableness of our sight, are necessitated to view by parts. In God all things are one and the same, according to the nature of God; though out of God [they appear] many and diverse, according to their own proper and created nature. The same heat in the sun produces diverse effects according to the various disposition of the objects: hardness in clay, softness in wax, life in insects and plants, etc. The same lines are one in the center, but distinguished and multiplied in the circumference. Water that is the same in the sea, out of the sea is variously and diversely qualified: sweet, bitter, sulfureous, etc. The matter in the liver is the same but the four humors of blood, choller, melancholy and phlegm that proceed from thence are very diverse. The soul which is one and the same produces very differing effects, as appears in the operations of the understanding, will, and affections. The sum is: The attributes, as was said before, are not distinguished in God, that is, from the divine essence or one from another really, but only notionally or virtually in our conception and in their objects in respect of the various effects thereupon: For every and all the attributes are the divine essence itself, according to that received proposition, ‘Whatsoever is in God, is God.’ (Fenner, Theol., bk. 1, ch. 3; Alsted, Theol., sect. 3, locus 2; Zanchi, Of the Nature of God, bk. 2, ch. 5, quest. 2) And this is the reason why some well describe the attributes from the essence of God: which manner of description, besides many useful notions clearly intimated thereby, does in the describing of the relative attributes, principle and fortify the understanding against that perilous tenet of Arminianism concerning the decree passing upon good or bad foreseen, with the evil consequences following thereupon. The divine attributes, though they can neither exactly be numbered or distributed, yet for our better understanding we may consider of them as Negative, Relative, Positive. … That God is a pure and simple act without all composition, is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9441992a73" data-kw="">
<blockquote><p>For it is commonly conceded today that a composition in concepts does not argue to a real composition in the thing. For if the formal notion of one perfection (for example knowing, even if the knowing is omniscient) does not include the formal notion of another perfection (for example loving, even if the loving is altogether perfect), then to be sure this fact does not necessarily imply that both perfections have, in respect of the thing (e.g. God), the idea of parts and so the idea of being mutually perfectible. But this condition would be required for having composition on the part of the thing. If we were able to conclude anything from the conceptual separability of one perfection from another, then some non-identity on the part of the thing would be proved (as a virtual or so-called formal non-identity, which we will deal with in the treatment of the formal distinction). But such a non-identity implies neither composition nor imperfection in the being that has those perfections. At most, indeed, a reason is to be sought why one such perfection is found in the same thing along with another perfection not included in the formal concept of the first, but I do not know why the only adequate assignable reason for explaining it must be found in a mutual perfectability (a perfectibility after the manner of parts) that those perfections have on the side of the thing. But if anyone wishes to dispute this question, let him do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 1, article 2, pp. 17-18 Wolter was a Scotus scholar and writes from that perspective.</span></figcaption>

<blockquote><p>…engages the recent critics and addresses one of their major concerns: that the doctrine of divine simplicity is not a biblical teaching. By analyzing the use of Scripture by key theologians from the early church to Karl Barth, Barrett finds that divine simplicity developed in order to respond to theological errors (e.g., Eunomianism) and to avoid misreading Scripture. Through close attention to Scripture, the work also argues that divine simplicity has two biblical roots: the names of God and the indivisible operations of the Trinity ad extra [outside of Himself]… divine simplicity can be rearticulated by following a formal analogy from the doctrine of the Trinity–the analogia diversitatis (analogy of diversity)–in which the divine attributes are identical to the divine essence but are not identical to each other.</p></blockquote>

<blockquote><p>This thesis offers a constructive account of the doctrine of divine simplicity in Christian theology. In its methodology, the thesis aims to present this divine perfection as an implicate of the scriptural portrayal of God, to draw upon the insights and conceptual resources of Thomas Aquinas and various Reformed orthodox theologians, and to respond to some objections to divine simplicity…. The case for God’s simplicity is made by examining God’s singularity, aseity, immutability, infinity, and act of creation in Holy Scripture and then tracing the ways in which these descriptions of God imply that he is (negatively) not composed of parts. Rather, he is (positively) actus purus and really identical with his own essence, existence, and attributes, each of which is identical with the whole being of the triune God considered under some aspect. In light of the constructive work, this study then addresses the three most pressing objections to divine simplicity: (1) that it denigrates God’s revelation of his many attributes in the economy; (2) that it eliminates God’s freedom in creating the world and acting in history; and (3) that it does not cohere with the doctrine of the Trinity.</p></blockquote>

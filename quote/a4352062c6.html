<blockquote><p>3. Therefore let the Church of Christ, the city of the great King, full of grace, prolific offspring, let her say what the prophecy uttered about her so long before by the mouth of this pious mother confesses, “My heart is made strong in the Lord, and my horn is exalted in my God.” Her heart is truly made strong, and her horn is truly exalted, because not in herself, but in the Lord her God. “My mouth is enlarged over mine enemies;” because even in pressing straits the word of God is not bound, not even in preachers who are bound. “I am made glad,” she says, “in Thy salvation.” This is Christ Jesus Himself, whom old Simeon, as we read in the Gospel, embracing as a little one, yet recognizing as great, said, “Lord, now lettest Thou Thy servant depart in peace, for mine eyes have seen Thy salvation.” Therefore may the Church say, “I am made glad in Thy salvation. For there is none holy as the Lord, and none is righteous as our God;” as holy and sanctifying, just and justifying. “There is none holy beside Thee;” because no one becomes so except by reason of Thee. And then it follows, “Do not glory so proudly, and do not speak lofty things, neither let vaunting talk come out of your mouth. For a God of knowledge is the Lord.” He knows you even when no one knows; for “he who thinketh himself to be something when he is nothing deceiveth himself.” These things are said to the adversaries of the city of God who belong to Babylon, who presume in their own strength, and glory in themselves, not in the Lord; of whom are also the carnal Israelites, the earth-born inhabitants of the earthly Jerusalem, who, as saith the apostle, “being ignorant of the righteousness of God,” that is, which God, who alone is just, and the justifier, gives to man, “and wishing to establish their own,” that is, which is as it were procured by their own selves, not bestowed by Him, “are not subject to the righteousness of God,” just because they are proud, and think they are able to please God with their own, not with that which is of God, who is the God of knowledge, and therefore also takes the oversight of consciences, there beholding the thoughts of men that they are vain, if they are of men, and are not from Him. “And preparing,” she says, “His curious designs.” What curious designs do we think these are, save that the proud must fall, and the humble rise? These curious designs she recounts, saying, “The bow of the mighty is made weak, and the weak are girded with strength.” The bow is made weak, that is, the intention of those who think themselves so powerful, that without the gift and help of God they are able by human sufficiency to fulfill the divine commandments; and those are girded with strength whose inward cry is, “Have mercy upon me, O Lord, for I am weak.” …5. “The Lord killeth and maketh alive:” He has killed her who had many children, and made this barren one alive, so that she has born seven. Although it may be more suitably understood that He has made those same alive whom He has killed. For she, as it were, repeats that by adding, “He bringeth down to hell, and bringeth up.” To whom truly the apostle says, “If ye be dead with Christ, seek those things which are above, where Christ sitteth on the right hand of God.” Therefore they are killed by the Lord in a salutary way, so that he adds, “Savor things which are above, not things on the earth;” so that these are they who, hungering, have passed beyond the earth. “For ye are dead,” he says: behold how God savingly kills! Then there follows, “And your life is hid with Christ in God:” behold how God makes the same alive! But does He bring them down to hell and bring them up again? It is without controversy among believers that we best see both parts of this work fulfilled in Him, to wit our Head, with whom the apostle has said our life is hid in God. “For when He spared not His own Son, but delivered Him up for us all,” in that way, certainly, He has killed Him. And forasmuch as He raised Him up again from the dead, He has made Him alive again. And since His voice is acknowledged in the prophecy, “Thou wilt not leave my soul in hell,” He has brought Him down to hell and brought Him up again. By this poverty of His we are made rich; for “the Lord maketh poor and maketh rich.” But that we may know what this is, let us hear what follows: “He bringeth low and lifteth up;” and truly He humbles the proud and exalts the humble. Which we also read elsewhere, “God resisteth the proud, but giveth grace to the humble.” This is the burden of the entire song of this woman whose name is interpreted “His grace.</p></blockquote>

o+belong+to+Babylon%2C+who+presume+in+their+own+strength%2C+and+glory+in+themselves%2C+not+in+the+Lord%3B+of+whom+are+also+the+carnal+Israelites%2C+the+earth-born+inhabitants+of+the+earthly+Jerusalem%2C+who%2C+as+saith+the+apostle%2C+%E2%80%9Cbeing+ignorant+of+the+righteousness+of+God%2C%E2%80%9D+that+is%2C+which+God%2C+who+alone+is+just%2C+and+the+justifier%2C+gives+to+man%2C+%E2%80%9Cand+wishing+to+establish+their+own%2C%E2%80%9D+that+is%2C+which+is+as+it+were+procured+by+their+own+selves%2C+not+bestowed+by+Him%2C+%E2%80%9Care+not+subject+to+the+righteousness+of+God%2C%E2%80%9D+just+because+they+are+proud%2C+and+think+they+are+able+to+please+God+with+their+own%2C+not+with+that+which+is+of+God%2C+who+is+the+God+of+knowledge%2C+and+therefore+also+takes+the+oversight+of+consciences%2C+there+beholding+the+thoughts+of+men+that+they+are+vain%2C+if+they+are+of+men%2C+and+are+not+from+Him.+%E2%80%9CAnd+preparing%2C%E2%80%9D+she+says%2C+%E2%80%9CHis+curious+designs.%E2%80%9D+What+curious+designs+do+we+think+these+are%2C+save+that+the+proud+must+fall%2C+and+the+humble+rise%3F+These+curious+designs+she+recounts%2C+saying%2C+%E2%80%9CThe+bow+of+the+mighty+is+made+weak%2C+and+the+weak+are+girded+with+strength.%E2%80%9D+The+bow+is+made+weak%2C+that+is%2C+the+intention+of+those+who+think+themselves+so+powerful%2C+that+without+the+gift+and+help+of+God+they+are+able+by+human+sufficiency+to+fulfill+the+divine+commandments%3B+and+those+are+girded+with+strength+whose+inward+cry+is%2C+%E2%80%9CHave+mercy+upon+me%2C+O+Lord%2C+for+I+am+weak.%E2%80%9D+%E2%80%A65.+%E2%80%9CThe+Lord+killeth+and+maketh+alive%3A%E2%80%9D+He+has+killed+her+who+had+many+children%2C+and+made+this+barren+one+alive%2C+so+that+she+has+born+seven.+Although+it+may+be+more+suitably+understood+that+He+has+made+those+same+alive+whom+He+has+killed.+For+she%2C+as+it+were%2C+repeats+that+by+adding%2C+%E2%80%9CHe+bringeth+down+to+hell%2C+and+bringeth+up.%E2%80%9D+To+whom+truly+the+apostle+says%2C+%E2%80%9CIf+ye+be+dead+with+Christ%2C+seek+those+things+which+are+above%2C+where+Christ+sitteth+on+the+right+hand+of+God.%E2%80%9D+Therefore+they+are+killed+by+the+Lord+in+a+salutary+way%2C+so+that+he+adds%2C+%E2%80%9CSavor+things+which+are+above%2C+not+things+on+the+earth%3B%E2%80%9D+so+that+these+are+they+who%2C+hungering%2C+have+passed+beyond+the+earth.+%E2%80%9CFor+ye+are+dead%2C%E2%80%9D+he+says%3A+behold+how+God+savingly+kills%21+Then+there+follows%2C+%E2%80%9CAnd+your+life+is+hid+with+Christ+in+God%3A%E2%80%9D+behold+how+God+makes+the+same+alive%21+But+does+He+bring+them+down+to+hell+and+bring+them+up+again%3F+It+is+without+controversy+among+believers+that+we+best+see+both+parts+of+this+work+fulfilled+in+Him%2C+to+wit+our+Head%2C+with+whom+the+apostle+has+said+our+life+is+hid+in+God.+%E2%80%9CFor+when+He+spared+not+His+own+Son%2C+but+delivered+Him+up+for+us+all%2C%E2%80%9D+in+that+way%2C+certainly%2C+He+has+killed+Him.+And+forasmuch+as+He+raised+Him+up+again+from+the+dead%2C+He+has+made+Him+alive+again.+And+since+His+voice+is+acknowledged+in+the+prophecy%2C+%E2%80%9CThou+wilt+not+leave+my+soul+in+hell%2C%E2%80%9D+He+has+brought+Him+down+to+hell+and+brought+Him+up+again.+By+this+poverty+of+His+we+are+made+rich%3B+for+%E2%80%9Cthe+Lord+maketh+poor+and+maketh+rich.%E2%80%9D+But+that+we+may+know+what+this+is%2C+let+us+hear+what+follows%3A+%E2%80%9CHe+bringeth+low+and+lifteth+up%3B%E2%80%9D+and+truly+He+humbles+the+proud+and+exalts+the+humble.+Which+we+also+read+elsewhere%2C+%E2%80%9CGod+resisteth+the+proud%2C+but+giveth+grace+to+the+humble.%E2%80%9D+This+is+the+burden+of+the+entire+song+of+this+woman+whose+name+is+interpreted+%E2%80%9CHis+grace.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+%E2%80%9CThe+City+of+God%2C%E2%80%9D+in+St.+Augustin%E2%80%99s+City+of+God+and+Christian+Doctrine%2C+ed.+Philip+Schaff%2C+trans.+Marcus+Dods%2C+vol.+2%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+First+Series+%28Buffalo%2C+NY%3A+Christian+Literature+Company%2C+18 <blockquote><p>‘Substantial subscription’ is closer to the kind of ‘system subscription’ known as ‘Good Faith Subscription,’ which has been officially adopted by the PCA and which reflects the ‘Old School Presbyterian’ version of system subscription. This mode of subscription requires that the subscriber affirm the system of doctrine contained in the Confession, which ‘system’ is presumably ‘Reformed theology.’ Moreover, it requires the ordaining entity to query the candidate concerning any scruples and requires the candidate in ‘good faith’ to be open and honest about any and all scruples he may have with respect to the confessional standards. The ordaining authority must then determine whether any of the candidate’s reservations or exceptions are ‘out of accord with any fundamentals of the system of doctrine’ and ensure that his exception is ‘neither hostile to the system nor strikes at the vitals of religion.’ Though similar to system subscription, I prefer the modifier ‘substantial.’ The primary usage of ‘substantial’ is ‘of ample or considerable amount, quantity, size, etc.’ Thus, unlike ‘substance’ or ‘system’ forms of subscription, substantial conveys the message that the subscriber is in agreement with a significant proportion of the Confession… But substantial subscription goes farther than system subscription in that it formally conveys a high level of agreement not merely with the system in the Confession but with the Confession as a whole. Indeed, since substantial subscription takes the whole Confession as its starting point and since by its nature only allows for a limited amount of non-substantive exceptions, it may be viewed as a version of ‘full subscription’ that formally allows for a limited number of non-substantial caveats or exceptions.</p></blockquote>

llows+for+a+limited+amount+of+non-substantive+exceptions%2C+it+may+be+viewed+as+a+version+of+%E2%80%98full+subscription%E2%80%99+that+formally+allows+for+a+limited+number+of+non-substantial+caveats+or+exceptions.%E2%80%9D%0A%0A%E2%80%94+Gonzales%2C+Jr.%2C+Robert%2C+%E2%80%98Confessional+Subscription%3A+Strict+vs.+Substantial%E2%80%99+%282016%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc489c4f375.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c489c4f375.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Substantial%20subscription%E2%80%99%20is%20closer%20to%20the,number%20of%20non%2Dsubstantial%20caveats%20or%20exceptions&amp;text=Substantial%20subscription%E2%80%99%20is%20closer%20to%20the%20kind%20of&amp;text=a%20limited%20number%20of%20non%2Dsubstantial%20caveats%20or%20exceptions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We, all and every one of us underwritten, protest, that after long and due examination of our own consciences in matters of true and false religion, are now thoroughly resolved in the truth, by the Word and Spirit of God. And, therefore, we believe with our hearts, confess with our mouths, subscribe with our hands, and constantly affirm, before God and the whole world, that this only is the true Christian faith and religion, pleasing God and bringing salvation to man, which is now, by the mercy of God, revealed to the world by the preaching of the blessed Evangel, and is received, believed, and defended by many and sundry notable kirks and realms, but chiefely by the Kirk of Scotland, the king’s Majesty, and three Estates of this realm, as God’s eternal truth, and only ground of our salvation; as more particularly is expressed in the confession of our faith, stablished, and publicly confirmed, by sundry acts of Parliaments and now, of a long time has been openly professed by the king’s Majesty, and whole body of his realm, both in burgh and land. To the which Confession and form of religion we willingly agree in our consciences, in all points, as unto God’s undoubted truth and verity, grounded only upon his written Word. And, therefore, we abhor and detest all contrary religion and doctrine, but chiefly, all kind of Papistry, in general and particular heads, even as they are now damned and confuted by the Word of God, and Kirk of Scotland… We, therefore, willing to take away all suspicion of hypocrisy, and of such double dealing with God and his Kirk, protest, and call the Searcher of all hearts to witness, that our minds and hearts do fully agree with this our confession, promise, oath, and subscription, so that we are not moved for any worldly respect, but are persuaded only in our consciences, through the knowledge and love of God’s true religion, printed in our hearts by the Holy Spirit, as we shall answer to Him in the day when the secrets of all hearts shall be disclosed…</p></blockquote>

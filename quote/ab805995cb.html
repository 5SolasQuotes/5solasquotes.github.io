<main class="wrap"><figure class="quote" id="q-ab805995cb" data-kw="">
<blockquote><p>7. Because the opponents deny predetermining grace to good acts, and subject habitual grace to the nod and motion of the created will, so that the will by nature influences the good work prior to divine grace. Hence, if God is moved to give grace on account of previous dispositions, then conversion will begin from the endeavor, influence and natural motion of free will. But on the contrary, God begins the good work in us, Phil. 1:6. Neither man, nor angel, first gives something to God, Rom. 11:33-34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 7, State of Fallen Man, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-858e5287fa" data-kw="Author of sin">
<blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 27 (on providence)</span></figcaption>

</figure><figure class="quote" id="q-bc0effdd91" data-kw="">
<blockquote><p>And so that immediate and per se motion of the first cause upon the secondary cause is, so to speak, the secondary cause’s own and natural motion, absorbed into its very being and operation — so that in the common and accepted view, both causes operate through one single and individual action, and nothing is done by one that is not done by the other. Therefore it is not to be thought that the contingent and free mode of acting of the secondary cause is overturned or destroyed by the pure concurrence of the first cause antecedent in nature to the concurrence and determination of the secondary cause — since this is intimately absorbed into the very nature of the secondary cause itself. I speak plainly. To be determined by God is as much as to be determined by itself, since that determination pertains to the natural mode of operating of the secondary cause. This is urged and explained: because that antecedence of nature, since it is not a real priority, nor one of time, nor of a temporal instant, posits and imprints nothing antecedently in the secondary cause before it operates. Rather, it is a priority altogether conjoined with the action of the secondary cause, such that they exist simultaneously and operate in the same instant of time. The priority of nature is only on the side of the first cause, by reason of the subordination and dependence of the secondary cause upon the first — which all call consequential subsistence — so that just as the secondary cause depends upon the first in being, so also it depends upon it in operating. Thus it is true to say: the secondary cause operates because God operates, and not the converse…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, p. 409</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

+the+first+in+being%2C+so+also+it+depends+upon+it+in+operating.+Thus+it+is+true+to+say%3A+the+secondary+cause+operates+because+God+operates%2C+and+not+the+converse%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Macedo+%26+Scotus%E2%80%99s+View%2C+p.+409&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbc0effdd91.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bc0effdd91.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=And%20so%20that%20immediate%20and%20per,God%20operates%2C%20and%20not%20the%20converse&amp;text=And%20so%20that%20immediate%20and%20per%20se%20motion&amp;text=operates%20because%20God%20operates%2C%20and%20not%20the%20converse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3e0f2f5954" data-kw="">
<blockquote><p>We must therefore decide the question while preserving the proper natural subordination of the secondary cause to God, yet removing from God the moral causality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Intro, p. 417</span></figcaption>

</figure><figure class="quote" id="q-d361f92310" data-kw="">
<blockquote><p>Having examined the mind of Scotus, whom I expound and follow, I establish this: the principle determining the free and contingent secondary cause toward its free and contingent act is the first cause, concurring with it antecedently by a certain priority of nature toward the action and effect, in such a way that the divine action is prior in nature — not only by dignity and perfection, but also by causality. This I affirm to be wholly the mind of Scotus, and fitted to remove all the difficulties we have mentioned above… And since he fully knows its nature and mode of operating, he adapts and accommodates to it the concurrence which, although antecedent and leading, will move and lead the will freely and contingently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, pp. 407-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>
<div class="actions"><button class="copy" data-copy="“Having examined the mind of Scotus, whom I expound and follow, I establish this: the principle determining the free and contingent secondary cause toward its free and contingent act is the first cause, concurring with it antecedently by a certain priority of nature toward the action and effect, in such a way that the divine action is prior in nature — not only by dignity and perfection, but also by causality. This I affirm to be wholly the mind of Scotus, and fitted to remove all the difficulties we have mentioned above… And since he fully knows its nature and mode of operating, he adapts and accommodates to it the concurrence which, although antecedent and leading, will move and lead the will freely and contingently.”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, pp. 407-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHaving+examined+the+mind+of+Scotus%2C+whom+I+expound+and+follow%2C+I+establish+this%3A+the+principle+determining+the+free+and+contingent+secondary+cause+toward+its+free+and+contingent+act+is+the+first+cause%2C+concurring+with+it+antecedently+by+a+certain+priority+of+nature+toward+the+action+and+effect%2C+in+such+a+way+that+the+divine+action+is+prior+in+nature+%E2%80%94+not+only+by+dignity+and+perfection%2C+but+also+by+causality.+This+I+affirm+to+be+wholly+the+mind+of+Scotus%2C+and+fitted+to+remove+all+the+difficulties+we+have+mentioned+above%E2%80%A6+And+since+he+fully+knows+its+nature+and+mode+of+operating%2C+he+adapts+and+accommodates+to+it+the+concurrence+which%2C+although+antecedent+and+leading%2C+will+move+and+lead+the+will+freely+and+contingently.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Macedo+%26+Scotus%E2%80%99s+View%2C+pp.+407-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd361f92310.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d361f92310.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=Having%20examined%20the%20mind%20of%20Scotus,lead%20the%20will%20f

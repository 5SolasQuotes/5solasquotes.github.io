<main class="wrap"><figure class="quote" id="q-da05b58175" data-kw="">
<blockquote><p>[Thomas] CHALMERS was not a widely-read divine, but as a practical thinker and teacher of the heart he was unrivalled. We have lost much of him for want of a Boswell. Many of his best sayings are gone for ever. As a man of erudition he might have been better. As a heaven-taught man, he needed little. Though not well read, all his reading passed through the alembic of his own mind. What he took in from without never came forth undigested. ….

But Chalmers never could understand the real difficulty of the Edwardean controversy. It was very poor insight in him to imagine that he had settled the controversy. He and I often talked of Edwards and Philosophical Necessity. He never could see that there was a third thing between Necessity and Contingency —viz. Liberty. Chalmers was not a speculative thinker; but he was especially great in all questions where the heart aids the intellect.

A minister once told me of the fine rebuke he got from him. He had visited a man on his death-bed who was delirious, and returning home met Chalmers. “Well,” said he, “did you pray with him?” “No; he was delirious; but I prayed with the family.” “Ah! you did very wrong, sir. Who knows but that some old train of thought might have been stirred up by the tones of a familiar voice? You did very wrong, sir?” In that region Chalmers was one of the greatest men of our century.

I DISSENT from J[onathan]. Edwards’ doctrine, because he hazards a speculation on will qua will, and therefore in reference to all will, divine and human. It is fatal to establish a necessary chain throughout every will in the universe. The Divine acts are free. They are necessary, I maintain, qua moral, though free qua will. But I am a determinist as much as Edwards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duncan.html">John Duncan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Colloquia Peripatetica</cite>, ed. William Knight (Edinburgh: Edmonston &amp; Douglas, 1870), pp 26-27, 28.</span></figcaption>

<blockquote><p>WHEN man fell from God, great was his fall indeed; for he fell from the Creator to the creature; he fell from heaven to earth; he fell from the height of happiness to the depth of misery, for he fell from holiness into sin. And ever since man first fell from holiness to sin, he hath been unable to rise again from sin to holiness.

Ever since he first chose the evil before the good, he hath been unable to choose the good before the evil. I know that as he was created at the first with freedom of will, he had power so to choose the good as to refuse the evil, and so to refuse the evil as to choose the good. And I know also, that when he fell from God he did not quite lose that freedom of his will, for he is still a reasonable creature, and wheresoever there is reason in the understanding there is freedom in the will. But I know withal, that this freedom of will is much corrupted and degenerated now since the fall, from what it was before the fall.

Then it was free to choose the good as well as the evil; now it is free to choose the evil but not the good: then it was free from sin to holiness; now it is free from holiness to sin: then it could so refuse the evil as to choose the good, and so choose the good as to refuse the evil; but now it can only so refuse the good as to choose the evil, and so choose the evil as to refuse the good. So that though the fall did not destroy it, yet it corrupted it; though the will be still free, yet not to God, not to grace, not to piety, but only to the world, to sin, and to iniquity.

And therefore it is, that as man willingly fell into sin at first, so he willingly lies in it still; and the only reason why he doth not rise again to holiness is, because he will not: nay, he so will not, that of himself he cannot will it. For his will being itself corrupted, it cannot but choose and delight in corruption; and so it must necessarily refuse what is good and honest: which necessity doth not excuse the will, as the will doth not exclude the necessity; for indeed it is a willing necessity. As the angels necessarily love God, and yet they love him willingly; so man willingly loves sin, and yet he loves it necessarily, not from any external but an internal necessity, not forced by others, but allured by himself; his own will being so taken with sin that he cannot but take delight in it, and so averse from holiness that he cannot turn to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 274-76.</span></figcaption>

<blockquote><p>The language of synchronic contingency [something can be contingent in different ways at the same time, and that alternatives can be contingent possibilities at the same time]… What makes the language interesting is its application to the particular case of the concurrent willing of two rational beings [God and a human person] involved in the actualization of one effect–a case in which both of the beings could will otherwise, but given that both wills taken together are the necessary and sufficient conditions for the actualization of the effect, both must be understood as freely concurrring to a single effect. That is interesting.</p></blockquote>

<blockquote><p>Some writers, as has been already observed, have allowed that sinners are the subjects of an inability which arises from the depravity; but they still contend that this is not all, but that they are both naturally and morally unable to believe in Christ; and this they think agreeable to the Scriptures, which represent them as both unable and unwilling to come to Him for life. But these two kinds of inability cannot consist with each other, so as both to exist in the same subject and towards the same thing. A moral inability supposes a natural ability. He who never, in any state, was possessed of the power of seeing, cannot be said to shut his eyes against the light. If the Jews had not been possessed of natural powers equal to the knowledge of Christ’s doctrine, there had been no justice in that cutting question and answer, “Why do ye not understand my speech? Because ye cannot hear my word.” [Jn. 8:41] A total physical inability must, of necessity, supersede a moral one. To suppose, therefore, that the phrase, “No man can come to Me,” [Jn. 6:44] is meant to describe the former; and, “Ye will not come to Me that ye may have life,” [Jn. 5:40] the latter; is to suppose that our Savior taught what is self contradictory. Some have supposed that, in attributing physical or natural power to men, we deny their natural depravity. Through the poverty of language, words are obliged to be used in different senses. When we speak of men as by nature depraved, we do not mean to convey the idea of sin being an essential part of human nature, or of the constitution of man: our meaning is that it is not a mere effect of education and example; but is, from his very birth, so interwoven through all his powers, so ingrained, as it were, in his very soul, as to grow up with him, and become natural to him. On the other hand, when the term natural is used as opposed to moral, and applied to the powers of the soul, it is designed to express those faculties which are strictly a part of our nature as men, and which are necessary to our being accountable creatures. By confounding these ideas we may be always disputing, and bring nothing to an issue. … Some have alleged that ‘natural power is only sufficient to perform natural things, and that spiritual power is required to the performance of spiritual things.’ But this statement is far from accurate. Natural power is as necessary to the performance of spiritual as of natural things; we must possess the powers of men in order to perform the duties of good men. And as to spiritual power, or, which is the same thing, a right state of mind, it is not properly a faculty of the soul, but a quality which it possesses; and which, though it be essential to the actual performance of spiritual obedience, yet is not necessary to our being under obligation to perform it.</p></blockquote>

ress those faculties which are strictly a part of our nature as men, and which are necessary to our being accountable creatures. By confounding these ideas we may be always disputing, and bring nothing to an issue. … Some have alleged that ‘natural power is only sufficient to perform natural things, and that spiritual power is required to the performance of spiritual things.’ But this statement is far from accurate. Natural power is as necessary to the performance of spiritual as of natural things; we must possess the powers of men in order to perform the duties of good men. And as to spiritual power, or, which is the same thing, a right state of mind, it is not properly a faculty of the soul, but a quality which it possesses; and which, though it be essential to the actual performance of spiritual obedience, yet is not necessary to our being under obligation to perform it.”

— Andrew Fuller, The Gospel Worthy of All Acceptation, ‘On the Inability of Sinners to Believe in Christ &amp; do Things Spiritually Good’ (1781), pt. 3, ‘Objections Answered’, in Works, pp. 172-73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+writers%2C+as+has+been+already+observed%2C+have+allowed+that+sinners+are+the+subjects+of+an+inability+which+arises+from+the+depravity%3B+but+they+still+contend+that+this+is+not+all%2C+but+that+they+are+both+naturally+and+morally+unable+to+believe+in+Christ%3B+and+this+they+think+agreeable+to+the+Scriptures%2C+which+represent+them+as+both+unable+and+unwilling+to+come+to+Him+for+life.+But+these+two+kinds+of+inability+cannot+consist+with+each+other%2C+so+as+both+to+exist+in+the+same+subject+and+towards+the+same+thing.+A+moral+inability+supposes+a+natural+ability.+He+who+never%2C+in+any+state%2C+was+possessed+of+the+power+of+seeing%2C+cannot+be+said+to+shut+his+eyes+against+the+light.+If+the+Jews+had+not+been+possessed+of+natural+powers+equal+to+the+knowledge+of+Christ%E2%80%99s+doctrine%2C+there+had+been+no+justice+in+that+cutting+question+and+answer%2C+%E2%80%9CWhy+do+ye+not+understand+my+speech%3F+Because+ye+cannot+hear+my+word.%E2%80%9D+%5BJn.+8%3A41%5D+A+total+physical+inability+must%2C+of+necessity%2C+supersede+a+moral+one.+To+suppose%2C+therefore%2C+that+the+phrase%2C+%E2%80%9CNo+man+can+come+to+Me%2C%E2%80%9D+%5BJn.+6%3A44%5D+is+meant+to+describe+the+former%3B+and%2C+%E2%80%9CYe+will+not+come+to+Me+that+ye+may+have+life%2C%E2%80%9D+%5BJn.+5%3A40%5D+the+latter%3B+is+to+suppose+that+our+Savior+taught+what+is+self+contradictory.+Some+have+supposed+that%2C+in+attributing+physical+or+natural+power+to+men%2C+we+deny+their+natural+depravity.+Through+the+poverty+of+language%2C+words+are+obliged+to+be+used+in+different+senses.+When+we+speak+of+men+as+by+nature+depraved%2C+we+do+not+mean+to+convey+the+idea+of+sin+being+an+essential+part+of+human+nature%2C+or+of+the+constitution+of+man%3A+our+meaning+is+that+it+is+not+a+mere+effect+of+education+and+example%3B+but+is%2C+from+his+very+birth%2C+so+interwoven+through+all+his+powers%2C+so+ingrained%2C+as+it+were%2C+in+his+very+soul%2C+as+to+grow+up+with+him%2C+and+become+natural+to+him.+On+the+other+hand%2C+when+the+term+natural+is+used+as+opposed+to+moral%2C+and+applied+to+the+powers+of+the+soul%2C+it+is+designed+to+express+those+faculties+which+are+strictly+a+part+of+our+nature+as+men%2C+and+which+are+necessary+to+our+being+accountable+creatures.+By+confounding+these+ideas+we+may+be+always+disputing%2C+and+bring+nothing+to+an+issue.+%E2%80%A6+Some+have+alleged+that+%E2%80%98natural+power+is+only+sufficient+to+perform+natural+things%2C+and+that+spiritual+power+is+required+to+the+performance+of+spiritual+things.%E2%80%99+But+this+statement+is+far+from+accurate.+Natural+power+is+as+necessary+to+the+performance+of+spiritual+as+of+natural+things%3B+we+must+possess+the+powers+of+men+in+order+to+perform+the+duties+of+good+men.+And+as+to+spiritual+power%2C+or%2C+which+is+the+same+thing%2C+a+right+state+of+mind%2C+it+is+not+properly+a+faculty+of+the+soul%2C+but+a+quality+which+it+possesses%3B+and+which%2C+though+it+be+essential+to+the+actual+performance+of+spiritual+obedience%2C+yet+is+not+necessary+to+our+being+under+obligation+to+perform+it.%E2%80%9D%0A%0A%E2%80%94+Andrew+Fuller%2C+The+Gospel+Worthy+of+All+Acceptation%2C+%E2%80%98On+the+Inability+of+Sinners+to+Believe+in+Christ+%26+do+Things+Spiritually+Good%E2%80%99+%281781%29%2C+pt.+3%2C+%E2%80%98Objections+Answered%E2%80%99%2C+in+Works%2C+pp.+172-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b88a5fd30.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b88a5fd30.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=Some%20writers%2C%20as%20has%20been%20already,being%20under%20obligation%20to%20perform%20it&amp;text=Some%20writers%2C%20as%20has%20been%20already%20observed%2C%20have&amp;text=to%20our%20being%20under%20obligation%20to%20perform%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a88ab6465b" data-kw="">
<blockquote><p>The words: ‘No man can come to Me, except the Father which has sent Me draw him,’ [John 6:44] present only the converse aspect of those [words spoken] to the disciples: ‘All that which the Father gives Me shall come to Me, and him that comes to Me I will in no wise cast out.’ For, far from being a judgment on, it would have been an excuse of, Jewish unbelief, and, indeed, entirely discordant with all Christ’s teaching, if the inability to come were regarded as other than personal and moral, springing from man’s ignorance and opposition to spiritual things. No man can come to the Christ—such is the condition of the human mind and heart, that coming to Christ as a disciple is, not an outward, but an inward, not a physical, but a moral impossibility—except the Father ‘draw him’. And this, again, not in the sense of any constraint, but in that of the personal, moral, loving influence and revelation, to which Christ afterwards refers when He says: ‘And I, if I be lifted up from the earth, will draw all men unto Myself’ (John 12:32).</p></blockquote>

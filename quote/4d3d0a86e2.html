<main class="wrap"><figure class="quote" id="q-4d3d0a86e2" data-kw="">
<blockquote><p>In reference to the Saints of God yet living. You are now scorned and persecuted, the ungodly world doth now judge you, and condemn you: the Psalmist observed it in his time; they gather themselves together against the Souls of the Righteous, and condemn the Innocent blood. Innocence is no security against cruelty and oppression; yea, it seems, no wine so sweet to wicked men as Innocent blood; ye have condemned and killed the just:

And yet, that open violence may not want a pretence of Justice, they act in the form of a legal process, before they kill, they do condemn; but alas! those Fig-leaves will not cover their nakedness. It is the just, whom they do unjustly Condemn and Murder; so it was in David’s time, and so it was in St. James his time, and so it is now; the Reprobate world holds on its course to this day; and so it will be to the end of the World. God’s Righteous Abels must expect no better justice at the Tribunals of these unrighteous Cains.</p></blockquote>

</figure><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>

</figure><figure class="quote" id="q-4a048d1f58" data-kw="">
<blockquote><p>Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or an Account of the Ancient Free State of France and most other Parts of Europe before the Loss of their Liberties</cite>, 1573 | From the Translator’s Preface:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.”

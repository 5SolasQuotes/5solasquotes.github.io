<main class="wrap"><figure class="quote" id="q-813dbd0f21" data-kw="">
<blockquote><p>But why is faith the means of justification? Simply because it is the action of union with Jesus Christ. Faith is our coming to Him, our trusting Him, our resting in Him. The moment we are united to Him, we are immediately endowed with all that He has secured for us. We are immediately justified before we have done a single good deed, because we are His and He is God’s. Just as a very poor woman is a very poor woman until the very moment that she marries a wealthy man. But at the moment that she becomes his wife, she becomes a wealthy woman. It is by means of her acceptance that she becomes a wealthy woman, but her acceptance does not make her a wealthy woman; it is her husband’s wealth that makes her so. So faith does not justify; Christ justifies. But faith is the act of union with Christ.</p></blockquote>
<figcaption>— <a href="../authors/john-gerstner.html">John Gerstner</a>, <cite>Theology for Everyman</cite>, ch. 6</figcaption>

<figcaption>— <a href="../authors/william-ames.html">William Ames</a>, <cite>The Marrow of Theology</cite>, Book II, ch. V (Of Faith), thesis 29</figcaption>

</figure><figure class="quote" id="q-a0c02fe67f" data-kw="Communion Faith Submission">

</figure><figure class="quote" id="q-a469aee8d1" data-kw="Faith">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a> › <a href="../topics/union-with-christ/nature-of-union/mystical-union.html">Mystical union</a></span></div>

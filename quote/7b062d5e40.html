<main class="wrap"><figure class="quote" id="q-7b062d5e40" data-kw="">
<blockquote><p>From baptism, you [Gilbert Burnet] pass to plead for the private administration of the Communion to persons on death-bed, and this you think the seasonableness of its use and the propriety of its ends to such a case do abundantly persuade: To which I answer: 1. That though at no time faith and love need more to be quickened, the death of Christ more to be remembered, nor communion with the Church to be declared, than in the approach of the last pangs, it will not thence follow that therefore the Communion may then be privately administrat[ed]: for, since not the seasonableness of the fruits, but the warrant and rule given unto us is first to be heeded in the going about of holy administrations; nay, since that without this regard duly adhibit the blessing and fruits are but in vain expected, it is evident that barely from the exigence of the fruits to conclude, in any case, the lawfulness of the celebration, is preposterous religion and worse reason: Now 2. That the rule set down to us in this sacrament does reprobate this your observance is evident not only from that connection that there is and ought to be observed betwixt the word and Sacraments: But, 1. From our Lord’s own pattern in the institution, keeping this solemnity with the company of his disciples, making as it were a little Christian Church: 2. Because the apostle in his regulation of this sacrament, according and with respect to his Master’s pattern, does suppose the Church’s coming together into one place, and consequently the ordinary Church assemblies, as a necessary requisite in the free and peaceable times of the Church: 3. Because the very mystery of the Lord’s Supper, representing the union of believers with and their communion in Jesus Christ their Head and the name that it has thence obtained, 1 Cor. 10:16-17, is not well consistent with this private administration: ‘Tis true, the authors of your [Perth] Articles, not being able to decline the convincing evidence of this reason, do, among other preparations, require that there be three or four, free of lawful impediments, present with the sick person to communicate with him; but as such a packed conventicle, beside other inconveniences, has no just resemblance of the Church her ordinary assemblies, much less can communicating with hand-wealed companions be a sign of that free, equable and comprehensive communion signified by this sacrament; so, it is manifest, that the forementioned requisite is only a colorable evasion, manifestly acknowledging the force of our argument, andin fraudem Legis, salvis verbis sententiam ejus circumveniens: But 3. This your private Communion is to be reprobate because, as the decumbent’s faith, love, and other graces in that hour of his need are only best excited by the means at that time allowed and competent, and the sanctified remembrance and improvement of other privileges and ordinances formerly enjoyed, so, it is certain, that this observance has not only been abused by the Papists unto the abomination of their private mass, but is also rejected by the Reformed Churches, not Lutheran, as found to be inductive of vain superstition wherever it is used; and for this I need not go far in search of confirmations, for you yourself in telling us that your practice was very early in the Church, subjoin that Justin Martyr says they sent of the Eucharist to them that were absent, and that the story of Serapion shows how necessary Christians then thought it to be guarded by this holyviaticum[journey], which two instances, whether true or false, being generally held to be an excess, both inclining to and introductive of vain superstition, and therefore, reckoned among the first Naevi [novelties] appearing in the face of the primitive Church, and now generally disused by all the Churches of Christ, as they are by you adduced, do to evidently demonstrate how much both your spirit and customs do bend to a relapse in these evils.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7b089573c" data-kw="">
<blockquote><p>…when I preached at court before the [English] Queen’s majesty, and was speaking about the antiquity of the popish religion, I remember that I said this among other things, that our enemies, when they accuse our cause of novelty, both wrong us and deceive the people; for that they approved new things as if they were old and condemned as new things of the greatest antiquity; that their private masses and their mutilated communions, and the natural and real presence and transubstantiation, etc. (in which things the whole of their religion is contained) have no certain and express testimony either of holy scripture or ancient councils, or fathers, or of anything that could be called antiquity.</p></blockquote>

<blockquote><p>10. On the 6th Article of the 11th Chapter [of The Discipline of the Reformed Chuches of France, 1559], a question was propounded by the Province of Higher Languedoc, Whether in case of grievous sickness, and the child being in apparent danger of death, he might be baptized on lecture-days, before sermon began, and whether baptism might be administred at such times when as there is no sermon preached, but only public common-prayers? It was answered that if the consistory, or any of the elders did attest the malady of the infant, the pastor might do it [the baptism]. And if the observation of this article should beget new difficulties, the provinces were intreated to come prepared unto the next national synod, for their assoiling of them.</p></blockquote>

<blockquote><p>And those things which are commanded [in the Book of Common Prayer respecting a Communion for the sick, with a minister and three or four Christians] in this behalf do well enough agree with the Holy Scriptures: for to receive the Communion of the Lord, and to be partaker of his Table, does not a little avail unto the comfort of afflicted consciences, if it be received according to the Lord’s institution.</p></blockquote>

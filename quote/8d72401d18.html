<main class="wrap"><figure class="quote" id="q-8d72401d18" data-kw="">
<blockquote><p>Baxter (1615–1691) was… [an] English Puritan of the seventeenth century. He is well known for his ministerial manual “The Reformed Pastor”, in which he expressed the unusual conviction that parish ministers were better off unmarried. And yet, Baxter seemed to contradict himself by marrying one of his parishioners, Margaret Charlton. Though Baxter claimed to be happily married, he continued to champion celibacy for the rest of his life. This book explores Baxter’s argument for clerical celibacy by placing it in the context of his life and the turbulent events of seventeenth-century England. His viewpoint was shaped by several factors, including the Puritan literature he read, the context of his parish ministry, his burdensome model of soul care, and the formative life experiences shaping his theology and perspective. These factors not only explain why Baxter became the only Puritan to champion clerical celibacy but also why he continued to do so even after marrying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed &amp; Celibate Pastor Richard Baxter’s Argument for Clerical Celibacy Ref (V&amp;R, 2021) 417 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

<blockquote><p>We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.</p></blockquote>

</figure><figure class="quote" id="q-1e0d602464" data-kw="">
<blockquote><p>It is this fact which makes the doctrine of the deposing power so great a stumbling-block in the way not only of the theory of the personal infallibility of the Popes but of every theory of infallibility whatsoever. Take the theory most opposed to the Ultramontane, the Gallican, and I say that the theory that the Pope possesses by divine right the power of deposing kings, satisfies all the Gallican tests whether a doctrine is infallibly true. It was solemnly propounded by the Pope as ‘de fide,’ and acquiesced in generally by the Western Christian world. Particular exercises of the power were objected to by the parties whom they affected, as transgressing the just limits of the power; but the general existence of the power was not denied. If, therefore, we now do not admit that Christ gave the Popes that power in temporal things which they claim, it follows inevitably that what Romanists count the Catholic Church may err; for, setting aside the Eastern nations which they do not include in it, all the West agreed in accepting the Pope&#x27;s account of his power as true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XXIII</span></figcaption>

ch01salmgoog" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-beae44752c" data-kw="">
<blockquote><p>A List of the Seven Periods of the Roman Church: I. The history of the Roman Church, in more pure doctrine and government, even from the beginning of that Church to the time of Constantine the Great, or until about the year 314. II. The history of the same in relatively retaining more pure doctrine, as far as principal matters, yet in government, aspiring for domination, from Constantine the Great, or the year 314, up to [Flavius?] Phocas and Boniface III, or 607. III. The history of the same in attaining, more or less, despotism in spiritual matters, Phocas permitting, and relatively degenerating in doctrine and rites, from Boniface III up to Gregory VII, or 1073. IV. The history of the same striving for despotism even in temporal things, and turning worse with time in doctrine and rites, from Gregory VII, or around 1073 up to Boniface VIII, or 1294. V. The history of the same attaining to a greater degree of despotism in temporal things, even unto an Imperial-Papacy, and the same shamefully driving harder an overthrow of all pure doctrine, from Boniface VIII, or 1294, to Leo X, or 1517. VI. The history of the same through the Reformation, or the separation of the faithful, suffering a most heavy injury in their despotism in spiritual and temporal things, from Leo X, or 1517, up to the end of the Council of Trent, or 1563. VII. The history of the same being hardened in error through the decrees of a false faith and Tridentine anathemas, while continually fighting the true Church of Christ through deceit and force, from the end of the Council of Trent, or 1563, up to our time [late-1600’s].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joahnn-h-heidegger.html">Joahnn H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Papacy… (Amsterdam, 1698), Preface trans. Paul Barth &amp; Travis Fentiman</cite></span></figcaption>

</figure><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

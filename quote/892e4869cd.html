<main class="wrap"><figure class="quote" id="q-892e4869cd" data-kw="">
<blockquote><p>Question: How is the public worship of God to be ordered and administered in the Church? Answer: All the members of the Church, being met together as one man in the sight of God are to join together in holy duties with one accord, the men with their heads uncovered, the women covered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Constitution of a Particular Visible Church, Proved by Scripture</cite>, … (London, 1642), p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-9c5e101014" data-kw="">
<blockquote><p>In 1 Corinthians 11:3-15, Paul writes that if a woman is to be so immodest as to wear her hair uncovered while praying or prophesying in a Christian assembly she might as well shave her head. Paul instructs the Corinthians that it is “one and the same” for a woman to have her head shaved and for her to unveil her hair. There is a large body of works cataloging the modesty standards in Hellenistic Greece but Paul’s reference to head-shaving remains obscure. This thesis looks to find the best explanation of Paul’s instructions. …a popular modern view… that women in ancient Greece with their head shaved were prostitutes… probably temple prostitutes. The evidence does not bear this out as there is no artwork depicting prostitutes, or indeed any women, with their heads shaved. Instead prostitutes are shown in Greek erotic art with both long and short hair, some with and some without head coverings. Literary sources do offer several different examples of women who had their hair cut off… the most probable impetus behind Paul’s writing [that the uncovered woman be shaved] relates to punishments for adultery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/curtis-e-montier.html">Curtis E. Montier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Let Her Be Shorn: 1 Corinthians 11 &amp; Female Head Shaving in Antiquity MA thesis</cite>, (Univ. of North Texas, 2015) 67 pp. Images (involving orgies) are on, pp. 13-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

ip/#:~:text=In%201%20Corinthians%2011%3A3%2D15%2C%20Paul%20writes,shaved%5D%20relates%20to%20punishments%20for%20adultery&amp;text=In%201%20Corinthians%2011%3A3%2D15%2C%20Paul%20writes%20that%20if&amp;text=woman%20be%20shaved%5D%20relates%20to%20punishments%20for%20adultery" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7eca285d24" data-kw="">
<blockquote><p>All adult women would have had long hair, the only exceptions being women who habitually wore wigs, slaves who had had their own hair cut off to provide the hair for such wigs and possibly some priestesses, as well as women who had been ill… Women would not have appeared in public with short hair from choice. The hair was always worn pinned up, unless the woman wanted to show distress by not taking care of her appearance, such as at funerals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexandra-t-croom.html">Alexandra T. Croom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre</cite>, (Stroud: Tempus, 2000), pp. 139-55, p. 141</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

— Alexandra T. Croom, ‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre (Stroud: Tempus, 2000), pp. 139-55, p. 141">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+adult+women+would+have+had+long+hair%2C+the+only+exceptions+being+women+who+habitually+wore+wigs%2C+slaves+who+had+had+their+own+hair+cut+off+to+provide+the+hair+for+such+wigs+and+possibly+some+priestesses%2C+as+well+as+women+who+had+been+ill%E2%80%A6+Women+would+not+have+appeared+in+public+with+short+hair+from+choice.+The+hair+was+always+worn+pinned+up%2C+unless+the+woman+wanted+to+show+distress+by+not+taking+care+of+her+appearance%2C+such+as+at+funerals.%E2%80%9D%0A%0A%E2%80%94+Alexandra+T.+Croom%2C+%E2%80%98Hairstyles+%26+Hats%E2%80%99+%26+%E2%80%98Hairnets+%26+Coverings%E2%80%99+in+Roman+Clothing+%26+Fashion+Pre+%28Stroud%3A+Tempus%2C+2000%29%2C+pp.+139-55%2C+p.+141&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7eca285d24.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7eca285d24.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/#:~:text=All%20adult%20women%20would%20have%20had,her%20appearance%2C%20such%20as%20at%20funerals&amp;text=All%20adult%20women%20would%20have%20had%20long%20hair&amp;text=care%20of%20her%20appearance%2C%20such%20as%20at%20funerals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3feea598b2" data-kw="">
<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing…

3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative (London: Maxwell, 1682) Stoddon was an English, congregationalist minister., pp. 40-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

bjection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?”

+it+be+the+duty+of+the+man+to+have+his+head+uncovered%2C+while+the+word+of+God+is+read+or+preached+in+the+congregation+of+his+people%3F%E2%80%A6+Objection+1%3A+I+hear+some+allege+thus%2C+That+it+is+in+itself+a+matter+of+indifferency%2C+and+to+be+determined+by+the+custom+of+those+particular+churches+or+people%2C+where+any+one+has+his+conversation%2C+and+not+to+be+positively+asserted+for+a+general+duty%E2%80%A6+Objection+2%3A+Others+object%2C+That+the+Reformed+Churches+in+other+countries+observe+no+such+thing%2C+but+generally+practice+the+contrary+in+their+assemblies%3B+but+if+it+were+a+duty%2C+why+should+not+they+practice+it+as+well+as+we%3F%E2%80%A6+Objection+4%3A+Others+there+be+that+will+allow+it+to+be+necessary%2C+by+the+rules+of+decency+and+reverence%2C+to+be+uncovered+in+prayer%2C+and+in+singing+and+perhaps+in+reading+of+the+Scriptures+too%2C+but+not+in+preaching%3A+And+their+reason+is+because+in+preaching+we+have+not+the+pure+word+of+God%2C+but+mixed+with+men%E2%80%99s+own+private+opinions+and+improvements%E2%80%A6+Objection+5%3A+Others%2C+it+seems%2C+argue+after+this+fashion%3A+This+uncovering+of+the+head+in+divine+worship%2C+is+a+thing+that+has+been+so+abused%2C+and+rested+in+by+a+company+of+dead+formalists%2C+and+so+zealously+affected+by+such+as+dote+on+foolish+and+superstitious+ceremonies%2C+that+to+show+our+dislike+of+their+ways%2C+we+think+it+expedient+to+act+contrary+to+them+in+this+thing+also%2C+and+not+to+symbolize+with+their+superstitions.+Answer%3A+Had+I+not+heard+it+from+some+that+pretended+to+sobriety%E2%80%A6+Objection+6%3A+But+there+are+yet+others+that+think+they+have+more+to+say+than+all+this.+Their+bodily+infirmities+are+such+as+that+they+cannot+bear+it+to+be+so+long+uncovered%2C+without+hazard+of+their+health%3A+But+God+will+have+mercy%2C+and+not+sacrifice%E2%80%A6+Objection+7%3A+Others+think+to+say+something+in+this%2C+if+this+had+been+such+a+duty%3B+wherefore+have+our+teachers+been+so+long+silent%2C+Why+had+we+not+heard+of+this+sooner%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Stoddon%2C+An+Essay+on+a+Question+Relating+to+Divine+Worship+viz.+Whether+it+be+Contrary+to+the+Apostolical+Laws+of+Decency+%26+Reverence+for+a+Man+to+have+his+Head+Covered+in+the+Time+%26+Place+of+God%E2%80%99s+Solemn+Public+Worship%3F%3A+Affirmative%2C+An+Essay+on+a+Question+Relating+to+Divine+Worship+viz.+Whether+it+be+Contrary+to+the+Apostolical+Laws+of+Decency+%26+Reverence+for+a+Man+to+have+his+Head+Covered+in+the+Time+%26+Place+of+God%E2%80%99s+Solemn+Public+Worship%3F%3A+Affirmative+%28London%3A+Maxwell%2C+1682%29+Stoddon+was+an+English%2C+congregationalist+minister.%2C+pp.+40-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3feea598b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3feea598b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=2.%20I%20hope%20it%20will%20be,we%20not%20heard%20of%20this%20sooner&amp;text=2.%20I%20hope%20it%20will%20be%20granted%20me&amp;text=Why%20had%20we%20not%20heard%20of%20this%20sooner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

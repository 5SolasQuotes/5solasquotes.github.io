<main class="wrap"><figure class="quote" id="q-50e43ab677" data-kw="">
<blockquote><p>For holiness in saints is a participation of the divine nature, but it is a temporary and a created participation; it is not the same very holiness that is in God, but [rather is] the created effect thereof…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5617e90de" data-kw="">
<blockquote><p>The Scriptures deliver a twofold righteousness, by which the elect, being freely endowed, are said to be righteous and justified: One most perfect and in all points absolute: the other imperfect and begun in us, and to be perfected in another world: One, which as it depends not on our works, so can it not be perfected by our works: The other, which though it be given of grace and not for works, yet is it increased and perfected by works: One, with which we being endowed, are so justified before God that in the sight and judgment of God Himself we are reputed for altogether blameless and most just: Another, which does not only make us righteous before men, but also makes us more and more acceptable to God, and has the promise of the life that now is and that which is to come. To conclude, one without us, really placed in Christ Himself only our head, and imputed to us, and so made ours by imputation: The other really existing and inherent in ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as given and trans. in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 360-62</cite>, vol. 3, p. 207</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

inherent%20in%20ourselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f2cd2fb423" data-kw="">
<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation (Naphtali Press) vol. 3</cite>, p. 198</span></figcaption>

</figure><figure class="quote" id="q-d0d214f616" data-kw="">
<blockquote><p>Synonyms [of regeneration] more properly signifying are: I. Sanctification, because it produces holiness, that is, conformity of man with the law, Jn. 17:17, 19; 1 Cor. 1:2; Eph. 5:26. It is also called sanctification of the Spirit, 2 Thess. 2:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-a1b0a92aaf" data-kw="">
<blockquote><p>Whether sanctification precede justification. Bishop [George] Downame in his appendix to the Covenant of Grace, does oppose my worthy tutor Mr. [William] Pemble for holding this opinion, but perhaps a distinction may solve all. As sanctification is taken for the act of the Holy Ghost working holiness into us, so it goes before faith and justification, so the apostle puts it before justifying, saying 1 Cor. 6:11, ‘But ye are sanctified, justified;’ but as it is taken for the exercise of holiness in regard of amendment of heart and life, so it follows justification in nature, but it is joined with it in time. The apostle Rom. 8:30, places vocation before justification, which vocation is the same thing with the first sanctification or regeneration. See Acts 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’</cite>, p. 530</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

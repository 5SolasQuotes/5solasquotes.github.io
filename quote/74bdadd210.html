<main class="wrap"><figure class="quote" id="q-74bdadd210" data-kw="">
<blockquote><p>Q. When shall a Christian heart come to this full assurance?

A. Not at the first, but in some continuance of time, when he hath been well practised in repentance, and hath had divers experiences of God’s love unto him in Christ: Then after them will appear in his heart the fullness of persuasion: which is the ripeness and strength of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The fundation of Christian religion, gathered into six principles</cite>, (n.p., 1690), pp 34-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope; but an infallible assurance of faith founded upon the divine truth of the promises of salvation, the inward evidence of those graces unto which these promises are made, the testimony of the Spirit of adoption witnessing with our spirits that we are the children of God, which Spirit is the earnest of our inheritance, whereby we are sealed to the day of redemption.</p></blockquote>

</figure><figure class="quote" id="q-bca1995867" data-kw="">
<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>

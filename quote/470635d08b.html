<main class="wrap"><figure class="quote" id="q-470635d08b" data-kw="">
<blockquote><p>The work of the Incarnation of the Son of God, and the Redemption of the World by him, was such, that one main end of making this goodly frame of Heaven and Earth was, that it might be the stage upon which that Work should be acted. A work wherein not only all man’s happiness lies, and whence it flows; but wherein all God’s Attributes are glorified to the highest; and for which the Church Triumphant shall think Eternity short enough to praise God. Of this Work (I say) the sum is given in one word, Immanuel, God is with us.

And plain Reason may demonstrate that it must needs be so. What is glory, but the shining out of excellency? What is happiness but the fruition of the greatest good? Now there is no Excellency that shines out in anything, like to that which beams out from God in the Covenant of grace to his people. There is no good that any people can enjoy like the fruition of God in that Covenant. It is true, God manifests himself to all the Nations in the World (in him they live, and move, and have their being:) yet it is as in a dark Cloud, they grope after him, and cannot feel him, but in the covenant of grace men behold him with open face, like the Sun shining in his strength, as through a Mirror: Such a Mirror as the Prince of Orange had, that would shew the Sun in his full bigness and beauty. Thus God shines in the Covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Honourable House of Commons, now assembled in Parliament, at their public fast, November 17. 1640</cite>, (London: Samuel Man, 1641), pp 9-10.</span></figcaption>

</figure><figure class="quote" id="q-d08b3058d9" data-kw="">
<blockquote><p>Our Lord Jesus is the actual and eventual Saviour of the elect only, in whose room and stead only he died upon the cross, according to the eternal compact passed between him and the Father, in the covenant of grace, otherwise called the covenant of redemption; for these are not two, but one and the same covenant. Thus the apostle calls him “the Saviour of the body,” Eph. v. 23. that is, of the elect, who make up the body whereof he was appointed the head from eternity, and in whose name he contracted with the Father in the eternal covenant.

And he is their Saviour eventually, as actually saving them, Matth. i. 21. “And she shall bring forth a son, and thou shalt call his name Jesus; for he shall save his people from their sins.” None but these will ever truly employ him as a Saviour, or put their case in his hand: and there are none of them but will certainly employ him sooner or later, Acts xiii. 48. “As many as were ordained to eternal life, believed.” John vi. 37. “All that the Father giveth me, shall come to me; and him that cometh to me, I will in no wise cast out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Saviour of the World. A Sermon Preached Immediately before the Celebration of the Lord’s Supper, at Ettrick, June 7, 1724</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 297.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-f9eaa7a495" data-kw="">
<blockquote><p>Grace is not born in us. … Even the children of saints are born in sin. Grace doth not run in the blood. Inherent holiness is not propagated, which yet doth not impede the propagation of federal holiness. Though the seed of believers are born polluted it doth not therefore follow that they are not born privileged. David who acknowledgeth the corruption his mother bore him in (Ps. 51:5) yet pleads the privilege his mother bore him to (Ps. 116:16, the son of thy handmaiden; so Ps. 86:16). Though a wise man do not beget a wise man, yet a freeman begets a freeman. I was born free, saith Paul.

We are all born diseased and impotent, but being born of believers we are born by the pool-side, not always under the internal but always under the external administration of the covenant. Israel as the seed of Abraham were transgressors from the womb, but as the seed of Abraham, to them pertained the adoption (Rom. 9:4). Those who will not admit this blessing of Abraham to come upon the Gentiles must expunge it out of their Bibles (Gal. 3:7, 14; Acts 2:39).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), pp 139-40.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

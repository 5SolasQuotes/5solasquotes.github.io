<blockquote><p>It is clear that a mediator and deliverer who will satisfy the claims of God’s holy justice on behalf of the impotent sinner must necessarily have a truly human soul and must possess a human body—and he must thus be very man. The nature of the satisfaction to be made to God’s justice on behalf of sinful man absolutely requires it, and therefore, as far as God is concerned, none but He who is very man can be our surety, mediator, and deliverer. …

God therefore caused this truth regarding the human nature of the mediator to be proclaimed to believers from the foundation of the world. He introduced Him to our first parents as the Seed of the woman (Gen. 3:15). Subsequently, God made this truth known to believers much more clearly and powerfully by shadows and types, as well as by prophecy. Consider especially this clear prophecy: “Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel” (Isa. 7:14). The name Immanuel means “God with us”; that is, God and man in one person.

All this makes it very clear that He who is to be the mediator and deliverer of impotent and guilty sinners in order to satisfy God’s holy justice and thereby reconcile and unite them to God must necessarily be very man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 74, 75.</span></figcaption>

<blockquote><p>Regarding the first , the Arminians think that the death of Christ was not necessary for procuring salvation for men, and they believe that God could have pardoned sins without any satisfaction. The Orthodox [Reformed], indeed, believe that that way of saving the human race was the most fitting of all, since God was pleased to use it; yet most of them readily concede to the Arminians that it was not absolutely necessary, and they do not contend that God’s justice was to that extent inexorable. Amyraut believes that God’s justice is so inflexible, and the majesty of his laws so holy and inviolable, that it could not suffer sins to be pardoned without satisfaction. In this matter, he has surrounded the orthodox doctrine with a defense by which it is stripped by many others. He has, moreover, proved his opinion on this matter with arguments in his Theses on the Necessity of Satisfaction for Grace.</p></blockquote>

<blockquote><p>I. Proofs of this truth, That Christ’s heart is set on the bliss and eternal salvation of his people, are these five:—

1. Christ’s covenanting for them proves this. In that day, (if a day may be talked of in eternity; but we are time-creatures, and have no fit words for eternity) when this blessed company were given by the Father to the Son, the Son did undertake to do all things needful to be one, to bring them to eternal glory. He undertook and promised to take on him their nature; and in that nature to bear their sins, and, by the sacrifice of that nature for their sins, to make an expiation of their sins. In a word, he promised to do all he was required to do, and he did all he promised to the Father, for the salvation of his people. Whenever we look to this treaty, we must gather, Surely the Son of God had a great mind to the happiness of his people.

2. Christ’s cheerful laying down his life for their redemption, proves how his heart was set on their salvation. It was his errand in coming into the world: John x. 10. I am come that they might have life, and that they might have it more abundantly. Believers get a greater, higher, and more noble life by the second Adam, than they lost by the first Adam. This is the meaning of that much more twice mentioned by the apostle when comparing these two heads, Rom. v. 15, 17. But how doth Christ give, and his people receive this life? Even by his death. He laid down his life for his sheep, John x. 11, 15. Therefore his Father loved him, ver. 17. And thereby he proved his love to the salvation of his people, John xv. 13.

3. He proves his love to their salvation, by his sealing and confirming the covenant, the charter of their salvation, with his own blood. Compare Gal. iii. 15,16, 17. with Heb. ix. 15, 16, 17. It is called the blood of the everlasting covenant, Heb. xiii. 20. Christ’s blood was not only redeeming and purchasing blood, a just and full price both for the heirs and. for the inheritance; but it was sealing blood, and confirming of that covenant, in and by which the inheritance was secured to the heirs, and the heirs secured for the inheritance. Alas many have the Bible, and use it but little; and many use it amiss, because they know not its right name. It is well and, warrantably, from its contents, called, in its title paged in all languages, and translations, The Old and New Testament of our Lord and Saviour Jesus Christ.

But how few, in reading this title, mind the use and virtue of the blood of Jesus, which turned the covenant of God’s grace into the testament of Christ, and thereby sealed and confirmed all the good words and good things in that covenant? It was a happy word we find in the Book of Martyrs, that some in the dawning of the light of the gospel in this land, near two hundred years ago, used, in calling the New Testament (a great rarity in those days) The blood of Christ.

You never rightly read the gospel, nor do you understand the design of it, nor rightly believe one promise in it, till in heart you can say, “This gospel is the only charter of my salvation, sealed with the blood of my only Saviour.” If any be for another Saviour than Christ, and for another security and charter for salvation than his thus sealed testament, on their eternal peril be it. Let them try, and perish. For, as God is true, perish they shall, even all that take that course, Acts iv. 12.

4. Christ proves his love to his people’s salvation by his intercession for them. Of which this chapter is a great instance. And whereof we have so much spoke in Rom. viii. 34. Heb. vii. 25.and ix. 24. and 1 John ii. 1. This is his business in heaven. By this he prepares their place for them, John xiv. 2, 3.; and on it assures them of their possessing of it.

5. Christ gives his Spirit to his people, to prove his concern about their salvation. And we may allude to Isa. v. 4, What could have been done more? He covenanted with the Father from eternity about their salvation. He bought it for them, and them for it, in the fulness of time. The day of Christ’s redeeming his people, was the flower of time, the greatest and noblest thing done since God set the clock of time a-going; for his glorious return is to be at the end of time.

He turned the covenant of their salvation into a testament by his blood; and did in that testament leave all the grace and glory bought by his blood as a legacy to his people. He, when he had done this, Went to heaven with his blood, Heb. ix. 12. that it might speak before God, Heb. xii. 24. for all blessings to his people. And till they get full possession of glory, he gives to them his Spirit. All that are his have his Spirit, as surely as it is, that if any man have not the Spirit of Christ, he is none of his, Rom. viii. 9, 15. Gal. iv.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sixteen Sermons on the Lord’s Prayer, in John xvii. 24</cite>, (1705) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 2: 41-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

— Robert Traill, Sixteen Sermons on the Lord’s Prayer, in John xvii. 24, (1705) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 2: 41-43.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Proofs+of+this+truth%2C+That+Christ%E2%80%99s+heart+is+set+on+the+bliss+and+eternal+salvation+of+his+people%2C+are+these+five%3A%E2%80%94%0A%0A1.+Christ%E2%80%99s+covenanting+for+them+proves+this.+In+that+day%2C+%28if+a+day+may+be+talked+of+in+eternity%3B+but+we+are+time-creatures%2C+and+have+no+fit+words+for+eternity%29+when+this+blessed+company+were+given+by+the+Father+to+the+Son%2C+the+Son+did+undertake+to+do+all+things+needful+to+be+one%2C+to+bring+them+to+eternal+glory.+He+undertook+and+promised+to+take+on+him+their+nature%3B+and+in+that+nature+to+bear+their+sins%2C+and%2C+by+the+sacrifice+of+that+nature+for+their+sins%2C+to+make+an+expiation+of+their+sins.+In+a+word%2C+he+promised+to+do+all+he+was+required+to+do%2C+and+he+did+all+he+promised+to+the+Father%2C+for+the+salvation+of+his+people.+Whenever+we+look+to+this+treaty%2C+we+must+gather%2C+Surely+the+Son+of+God+had+a+great+mind+to+the+happiness+of+his+people.%0A%0A2.+Christ%E2%80%99s+cheerful+laying+down+his+life+for+their+redemption%2C+proves+how+his+heart+was+set+on+their+salvation.+It+was+his+errand+in+coming+into+the+world%3A+John+x.+10.+I+am+come+that+they+might+have+life%2C+and+that+they+might+have+it+more+abundantly.+Believers+get+a+greater%2C+higher%2C+and+more+noble+life+by+the+second+Adam%2C+than+they+lost+by+the+first+Adam.+This+is+the+meaning+of+that+much+more+twice+mentioned+by+the+apostle+when+comparing+these+two+heads%2C+Rom.+v.+15%2C+17.+But+how+doth+Christ+give%2C+and+his+people+receive+this+life%3F+Even+by+his+death.+He+laid+down+his+life+for+his+sheep%2C+John+x.+11%2C+15.+Therefore+his+Father+loved+him%2C+ver.+17.+And+thereby+he+proved+his+love+to+the+salvation+of+his+people%2C+John+xv.+13.%0A%0A3.+He+proves+his+love+to+their+salvation%2C+by+his+sealing+and+confirming+the+covenant%2C+the+charter+of+their+salvation%2C+with+his+own+blood.+Compare+Gal.+iii.+15%2C16%2C+17.+with+Heb.+ix.+15%2C+16%2C+17.+It+is+called+the+blood+of+the+everlasting+covenant%2C+Heb.+xiii.+20.+Christ%E2%80%99s+blood+was+not+only+redeeming+and+purchasing+blood%2C+a+just+and+full+price+both+for+the+heirs+and.+for+the+inheritance%3B+but+it+was+sealing+blood%2C+and+confirming+of+that+covenant%2C+in+and+by+which+the+inheritance+was+secured+to+the+heirs%2C+and+the+heirs+secured+for+the+inheritance.+Alas+many+have+the+Bible%2C+and+use+it+but+little%3B+and+many+use+it+amiss%2C+because+they+know+not+its+right+name.+It+is+well+and%2C+warrantably%2C+from+its+contents%2C+called%2C+in+its+title+paged+in+all+languages%2C+and+translations%2C+The+Old+and+New+Testament+of+our+Lord+and+Saviour+Jesus+Christ.%0A%0ABut+how+few%2C+in+reading+this+title%2C+mind+the+use+and+virtue+of+the+blood+of+Jesus%2C+which+turned+the+covenant+of+God%E2%80%99s+grace+into+the+testament+of+Christ%2C+and+thereby+sealed+and+confirmed+all+the+good+words+and+good+things+in+that+covenant%3F+It+was+a+happy+word+we+find+in+the+Book+of+Martyrs%2C+that+some+in+the+dawning+of+the+light+of+the+gospel+in+this+land%2C+near+two+hundred+years+ago%2C+used%2C+in+calling+the+New+Testament+%28a+great+rarity+in+those+days%29+The+blood+of+Christ.%0A%0AYou+never+rightly+read+the+gospel%2C+nor+do+you+understand+the+design+of+it%2C+nor+rightly+believe+one+promise+in+it%2C+till+in+heart+you+can+say%2C+%E2%80%9CThis+gospel+is+the+only+charter+of+my+salvation%2C+sealed+with+the+blood+of+my+only+Saviour.%E2%80%9D+If+any+be+for+another+Saviour+than+Christ%2C+and+for+another+security+and+charter+for+salvation+than+his+thus+sealed+testament%2C+on+their+eternal+peril+be+it.+Let+them+try%2C+and+perish.+For%2C+as+God+is+true%2C+perish+they+shall%2C+even+all+that+take+that+course%2C+Acts+iv.+12.%0A%0A4.+Christ+proves+his+love+to+his+people%E2%80%99s+salvation+by+his+intercession+for+them.+Of+which+this+chapter+is+a+great+instance.+And+whereof+we+have+so+much+spoke+in+Rom.+viii.+34.+Heb.+vii.+25.and+ix.+24.+and+1+John+ii.+1.+This+is+his+business+in+heaven.+By+this+he+prepares+their+place+for+them%2C+John+xiv.+2%2C+3.%3B+and+on+it+assures+them+of+their+possessing+of+it.%0A%0A5.+Christ+gives+his+Spirit+to+his+people%2C+to+prove+his+concern+about+their+salvation.+And+we+may+allude+to+Isa.+v.+4%2C+What+could+have+been+done+more%3F+He+covenanted+with+the+Father+from+eternity+about+their+salvation.+He+bought+it+for+them%2C+and+them+for+it%2C+in+the+fulness+of+time.+The+day+of+Christ%E2%80%99s+redeeming+his+people%2C+was+the+flower+of+time%2C+the+greatest+and+noblest+thing+done+since+God+set+the+clock+of+time+a-going%3B+for+his+glorious+return+is+to+be+at+the+end+of+time.%0A%0AHe+turned+the+covenant+of+their+salvation+into+a+testament+by+his+blood%3B+and+did+in+that+testament+leave+all+the+grace+and+glory+bought+by+his+blood+as+a+legacy+to+his+people.+He%2C+when+he+had+done+this%2C+Went+to+heaven+with+his+blood%2C+Heb.+ix.+12.+that+it+might+speak+before+God%2C+Heb.+xii.+24.+for+all+blessings+to+his+people.+And+till+they+get+full+possession+of+glory%2C+he+gives+to+them+his+Spirit.+All+that+are+his+have+his+Spirit%2C+as+surely+as+it+is%2C+that+if+any+man+have+not+the+Spirit+of+Christ%2C+he+is+none+of+his%2C+Rom.+viii.+9%2C+15.+Gal.+iv.%E2%80%9D%0A%0A%E2%80%94+Robert+Traill%2C+Sixteen+Sermons+on+the+Lord%E2%80%99s+Prayer%2C+in+John+xvii.+24%2C+%281705%29+in+The+Works+of+Robert+Traill%2C+A.M.+Minister+of+the+Gospel+in+London+%284+vols%2C+Edinburgh%3A+J.+Ogle%2C+1810%29%2C+2%3A+41-43.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43164fba67.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/43164fba67.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/01/31/robert-traill-on-the-testament-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>In this [fallen] condition the holy Scriptures help us, teaching that the heavenly Father is at peace with humankind by no other means than by the sacrifice of his only begotten Son. Through this sacrifice God has made an everlasting covenant with his people, has forgiven our sins, has adopted those who believe as his children, has committed them to his first begotten Son for salvation, and had incorporated them and made them heirs of his heavenly kingdom.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c6f5c835f2" data-kw="">
<blockquote><p>Here the Lord Jesus Christ stands knocking at the Laodicean’s door; He would fain have them to sup with Him, and that He might sup with them; that is, that they might have intimate communion and fellowship one with another. Now, pray tell me, what preparations or qualifications had these Laodiceans to entertain Christ? Surely none; for they were lukewarm, they were ‘neither hot nor cold,’ they were ‘wretched, and miserable, and poor, and blind, and naked’; yet Christ to show his free grace and his condescending love, invites the very worst of sinners to open to Him, though they were no ways so prepared or qualified to entertain Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices in Works</cite>, vol. 1, Appendix, pp. 147-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e980bf0599" data-kw="">
<blockquote><p>And then for what He suffers in his minister? There He knocks, and says, ‘Open in them.’ And how was He used in the apostles that were after Him, and in the ministers of the Church ever since. What have they endured? for He put a spirit of patience upon them. And what indignities endured they in the primitive Church, that were the publishers of the Gospel, those sweet publishers thereof, drawing men to open to Christ, were killed for preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened, or a Discovery of the Near &amp; Dear Love, Union &amp; Communion betwixt Christ &amp; the Church</cite>, (London: G.M., 1639) | 6th Sermon, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-b77f7d56f4" data-kw="">
<blockquote><p>And he says, though He be a king, yea, the King of Kings, yet He stands at the door and knocks, that is, calls them to repentance and promises if they will let Him in, that is, turn from their sin and yield to his will, He will come unto them and sup with them, signifying what exceeding joy and comfort they should receive by Him; yea, they should be made partakers of the joys of Heaven: where he alludes to the comfort that friends have one of another when they meet together at their dinners, suppers and feasts, which thing, if it be comfortable to men, much more comfort shall it minister unto us, to be partakers of the company of Christ Jesus Himself in his heavenly banquet. A second benefit he notes in that those that do thus receive Him and overcome shall not only receive comfort, but glory also and honor in his Kingdom…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Explanation of the Whole Revelation of St. John</cite>, … (d. 1603; London: 1622), ch. 3, p. 22</span></figcaption>

<blockquote><p>…but take these for marks of deluded men: … 2. Profession [of Christianity] looks like paradise and the rainbow; its big in its own eyes and the fairest for variety of coulors, but its a self-plague and does carry millions of souls to hell without din and noise of feet, it’s Christ acting judicially on the hypocrite within pistol shot of a besieged soul, making fire-works under the earth; and when all within are sleeping, Christ springs a powder-mine, and burns up all forward: Gospel-fire-works makes more than ordinary fury in the soul; Open, open to Christ;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pt. 3, ‘All Men’, pp. 461-62</span></figcaption>

</figure><figure class="quote" id="q-1aa5655632" data-kw="">
<blockquote><p>He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his Word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, Sermon 1, pp. 463-79</span></figcaption>

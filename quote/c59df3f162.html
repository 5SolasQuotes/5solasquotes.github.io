<blockquote><p>This Text may fitly be called a Looking glass for England and Ireland, or for any other Kingdom whatsoever; wherein God Almighty declares what he can do with Nations and Kingdoms, and what he will do.

1. What he can do. He can build and plant a Nation. and he can pluck up, pull down, and destroy a Nation. And when a Kingdom is in the depth of misery, he can in an instant, if he but speak the word, raise it up to the top of happiness; and when it is in the height and Zenith of happiness, he can in another instant speak a word, and throw it down again into an Abyss of misery.

2. What he will do. God will not always use his Prerogative, but he will first speak before he strikes, he will first pronounce judgement before he executeth judgement. And if that Nation against which he hath pronounced the evil of punishment turn from their evil of sin, then will God repent of the evil he intended to do unto them: And not only so, but he will build and plant that Nation, and of a barren wildernesses, make it a fruitful Paradise. But if that Nation do evil in God’s sight, and will not obey his voice, then will God repent of the good wherewith he would have benefited them, and pull down what he hath built, and pluck up what he hath planted, and of a fruitful Paradise, make it a barren wilderness.</p></blockquote>

<blockquote><p>II. The Scriptures plainly represent magistrates’ granting of men an unrestrained freedom to profess and practice a false religion as extremely sinful and hurtful.

1. It is in the name of God to give liberty to the flesh, of which heresies and idolatry are the manifest and damning works, Gal. v. 13, 19-21, with Rom. viii. 7, 8.

2. It is not merely to pity and spare, but to encourage such as seek to draw away their subjects from God, contrary to Deut. xiii. 9-10; Eph. iv. 14; 2 Tim. iii. 4, 5; 2 Pet. ii. 1-3.

3. In so doing, magistrates, as political shepherds, not only suffer the flock of God, the King of nations, under their charge, to wander or be driven from their fold and pasture, but encourage them in it, contrary to Ezek. xxxiv. 5-8; Acts xx. 30.

4. It marks a heavy judgement of God upon, and anarchy in a Commonwealth, when every man is left without restraint, and does that which is right in his own eyes, in matters of religion, Judges xvii. 6; Zech. xi. 9, 16; 2 Chron. xx. 33; Amos iv. 4, 5.

5. In granting such liberty, magistrates are not for Christ, by whom they rule, Prov. viii. 15, 16, but against him, in encouraging and protecting doctrines and works of the devil, which he came to destroy, John viii. 44; 1 Tim. iv. 2; Rev. xvi. 13, 14, with 1 John iii. 8 and Zech. xiii. 2.

6. False religion eats out the true doctrine of Christ, and the true piety and virtue which proceed from the faith of it, which are like joints and bands to connect and establish a nation, Isa. lix, lxv; 2 Tim. ii. 16, 17; Gal. v. 10-12.

7. Heresies produce divisions, 1 Cor. xi. 18, 19, make men wanton, filthy, dreamers, despisers and revilers of magistrates, Jude 4, 8; 2 Pet. ii. 10-17. They render times perilous, and make traitors, heady, high minded, truce breakers, false accusers, fierce, without natural affection, despisers of those that are good, 2 Tim. iii:1-13. They produce envy, strife, evil surmising, and perverse disputing, 1 Tim. vi. 3, 4; Gal. v. 19. 20. They spoil Christ’s vines, Song. ii. 15.

8. False religion deprives a nation of God’s protecting hedge of favourable providence, and opens an inlet to the floods of destructive judgements, Exod. xxxii. 25; Ezek. xiii. 4, 5; xxii. 30, 31.

9. Magistrates’ indulgence of a false religion is represented as a kicking at the true religion, and an honouring of the corrupters above God, and brings a charge of the wickedness upon the tolerators of it. Hence Eli the judge of Israel is represented as kicking at God’s sacrifice, honouring his profane sons above God, and making himself fat with God’s portion of the sacrifices, because he did not effectually restrain his sons, 1 Sam. ii. 12-16, 23-25, 29; Eph. v. 7, 11; and Nehemiah contended with the rulers of Judah for suffering the worship of God to be neglected, and the Sabbath profaned, Neh. xiii. 10-18.

10. Such indulgence of false or corrupt religion is represented as tending to make men abhor the true religion, and speak evil of it, 1 Sam. ii. 17; 2 Pet. ii. 1-3.</p></blockquote>

</figure><figure class="quote" id="q-6bea7646f2" data-kw="">
<blockquote><p>When, recently, you jumped into a well in order to die there, you certainly did this of your own free will, but how cruel the servants of God would have been had they abandoned you to your evil will and had not delivered you from that death! Yet you threw yourself into the water deliberately in order to die there, and they pulled you out of the water against your will so that you might not die there; you acted according to your own evil will to your own destruction; they acted against your will to save you. If, then, that bodily welfare is to be so safeguarded that it is preserved even in those who do not want it by those who love them, how much more is that spiritual welfare to be preserved since by its loss eternal death is feared! Yet, you would have remained in that death which you wanted to inflict on yourself, not for time but for eternity, because even if you were being forced to some evil deed instead of to salvation, to the peace of the Church, to the unity of the body of Christ, to holy and indivisible charity, you had no right to try to kill yourself.

Examine the divine Scriptures and scrutinize them as closely as you can, and see whether this was ever done by any of the good and faithful souls, even though they suffered great trials at the hands of those who were trying to drive them to eternal destruction, not to eternal life, to which you are being forced. I have heard that you said the Apostle Paul meant that this was lawful when he said: ‘If I should deliver my body to be burned.’ Probably because he was listing all kinds of good things which are worth nothing without charity, such as tongues of men and angels, and all mysteries, and all knowledge, and all prophecy, and all faith so as to move mountains, and distribution of his goods to the poor, you thought he included among good things the taking of one’s own life.

But notice carefully and understand in what sense Scripture says that anyone should deliver his body to be burned: not, certainly, that he should jump into the fire when harassed by a pursuing enemy, but that, when a choice is offered him of either doing wrong or suffering wrong, he chooses not to do wrong rather than not to suffer wrong. In this case he delivers his body into the power of the slayer, as those three men did who were being forced to adore the golden statue, and who were threatened by the one who was forcing them with the furnace of burning fire if they did not do it. They refused to adore the idol, but they did not cast themselves into the fire, yet it is written of them: ‘They delivered up their bodies that they might not serve nor adore any god but their own God.’ This is what the Apostle means by ‘If I deliver my body to be burned.’</p></blockquote>

Examine the divine Scriptures and scrutinize them as closely as you can, and see whether this was ever done by any of the good and faithful souls, even though they suffered great trials at the hands of those who were trying to drive them to eternal destruction, not to eternal life, to which you are being forced. I have heard that you said the Apostle Paul meant that this was lawful when he said: ‘If I should deliver my body to be burned.’ Probably because he was listing all kinds of good things which are worth nothing without charity, such as tongues of men and angels, and all mysteries, and all knowledge, and all prophecy, and all faith so as to move mountains, and distribution of his goods to the poor, you thought he included among good things the taking of one’s own life.

But notice carefully and understand in what sense Scripture says that anyone should deliver his body to be burned: not, certainly, that he should jump into the fire when harassed by a pursuing enemy, but that, when a choice is offered him of either doing wrong or suffering wrong, he chooses not to do wrong rather than not to suffer wrong. In this case he delivers his body into the power of the slayer, as those three men did who were being forced to adore the golden statue, and who were threatened by the one who was forcing them with the furnace of burning fire if they did not do it. They refused to adore the idol, but they did not cast themselves into the fire, yet it is written of them: ‘They delivered up their bodies that they might not serve nor adore any god but their own God.’ This is what the Apostle means by ‘If I deliver my body to be burned.’”

— Augustine of Hippo, Letter to Donatus, c. 416 (no. 173) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), pp 76-77.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen%2C+recently%2C+you+jumped+into+a+well+in+order+to+die+there%2C+you+certainly+did+this+of+your+own+free+will%2C+but+how+cruel+the+servants+of+God+would+have+been+had+they+abandoned+you+to+your+evil+will+and+had+not+delivered+you+from+that+death%21+Yet+you+threw+yourself+into+the+water+deliberately+in+order+to+die+there%2C+and+they+pulled+you+out+of+the+water+against+your+will+so+that+you+might+not+die+there%3B+you+acted+according+to+your+own+evil+will+to+your+own+destruction%3B+they+acted+against+your+will+to+save+you.+If%2C+then%2C+that+bodily+welfare+is+to+be+so+safeguarded+that+it+is+preserved+even+in+those+who+do+not+want+it+by+those+who+love+them%2C+how+much+more+is+that+spiritual+welfare+to+be+preserved+since+by+its+loss+eternal+death+is+feared%21+Yet%2C+you+would+have+remained+in+that+death+which+you+wanted+to+inflict+on+yourself%2C+not+for+time+but+for+eternity%2C+because+even+if+you+were+being+forced+to+some+evil+deed+instead+of+to+salvation%2C+to+the+peace+of+the+Church%2C+to+the+unity+of+the+body+of+Christ%2C+to+holy+and+indivisible+charity%2C+you+had+no+right+to+try+to+kill+yourself.%0A%0AExamine+the+divine+Scriptures+and+scrutinize+them+as+closely+as+you+can%2C+and+see+whether+this+was+ever+done+by+any+of+the+good+and+faithful+souls%2C+even+though+they+suffered+great+trials+at+the+hands+of+those+who+were+trying+to+drive+them+to+eternal+destruction%2C+not+to+eternal+life%2C+to+which+you+are+being+forced.+I+have+heard+that+you+said+the+Apostle+Paul+meant+that+this+was+lawful+when+he+said%3A+%E2%80%98If+I+should+deliver+my+body+to+be+burned.%E2%80%99+Probably+because+he+was+listing+all+kinds+of+good+things+which+are+worth+nothing+without+charity%2C+such+as+tongues+of+men+and+angels%2C+and+all+mysteries%2C+and+all+knowledge%2C+and+all+prophecy%2C+and+all+faith+so+as+to+move+mountains%2C+and+distribution+of+his+goods+to+the+poor%2C+you+thought+he+included+among+good+things+the+taking+of+one%E2%80%99s+own+life.%0A%0ABut+notice+carefully+and+understand+in+what+sense+Scripture+says+that+anyone+should+deliver+his+body+to+be+burned%3A+not%2C+certainly%2C+that+he+should+jump+into+the+fire+when+harassed+by+a+pursuing+enemy%2C+but+that%2C+when+a+choice+is+offered+him+of+either+doing+wrong+or+suffering+wrong%2C+he+chooses+not+to+do+wrong+rather+than+not+to+suffer+wrong.+In+this+case+he+delivers+his+body+into+the+power+of+the+slayer%2C+as+those+three+men+did+who+were+being+forced+to+adore+the+golden+statue%2C+and+who+were+threatened+by+the+one+who+was+forcing+them+with+the+furnace+of+burning+fire+if+they+did+not+do+it.+They+refused+to+adore+the+idol%2C+but+they+did+not+cast+themselves+into+the+fire%2C+yet+it+is+written+of+them%3A+%E2%80%98They+delivered+up+their+bodies+that+they+might+not+serve+nor+adore+any+god+but+their+own+God.%E2%80%99+This+is+what+the+Apostle+means+by+%E2%80%98If+I+deliver+my+body+to+be+burned.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Letter+to+Donatus%2C+c.+416+%28no.+173%29+in+Saint+Augustine+Letters%3A+Volume+IV+%28c.+420-30%29%2C+trans.+Wilfred+Parsons%2C+The+Fathers+of+the+Church%3A+A+New+Translation%2C+vol.+30+%28Washington+D.C.%3A+The+Catholic+University+of+America+Press%2C+1955%29%2C+pp+76-77.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bea7646f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bea7646f2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/27/augustine-of-hippo-on-the-folly-of-suicide-examined-in-the-light-of-scripture/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d778a67570" data-kw="">
<blockquote><p>I conceive, though the State make a positive law, for order’s cause, that the king ordinarily convene parliaments; yet, if we dispute the matter in the court of conscience, the [parliamentary] estates have intrinsically (because they are the estates, and essentially judges of the land) ordinary power to convene themselves.</p></blockquote>

</figure><figure class="quote" id="q-53eb46797f" data-kw="">
<blockquote><p>I take for granted that every Reformed Presbyterian will cheerfully admit the obligation to receive the Bible as the universal rule of action in things civil as well as religious. “Be wise now, therefore, O ye kings, be instructed, ye judges of the earth; serve the Lord with fear.”

Kings and judges are here addressed in their official capacity; and in this capacity they are commanded to “serve the Lord.” The nation as a moral person acts by its rulers; the doings of the latter become the responsibilities of the former, and the obligations due by the nation are to be fulfilled by its rulers.

There is nothing in Scripture that warrants the limitation of the obligation to “serve God” to one part of the divine law, to the exclusion of another. Yet it has been assumed, that rulers in the administration of government have nothing to do with the first table of the moral law. And on this unwarranted limitation of the magistrate’s authority, is opposition made to a public provision for the religious instruction of the community.

On the other hand, we hold that the civil magistrate is “custos et vindex utriusque tabulae,” the [keeper] and avenger of both tables of the law.[1] This was adopted as a maxim on the subject, by the Protestant writers of the Reformation, and finds a place in the testimony of the Reformed Presbyterian Church, as it had also been recognized by the Covenanted Church of Scotland in her purest times!

David Scott, ‘The Public Support of Religion’, Reformed Presbyterian and Covenanter, 8, no. 9 (September 1870), pp 271-72.</p></blockquote>

<blockquote><p>VIII. If any man should say that God is obnoxious, or subject to no laws, and therefore his actions are not rightly examined, according to the rule of justice, seeing he is tied to no rules: I will answer, that the nature of God, is more mighty than any law: That natural perfection, by which it is impossible that God should lie, or that he should sin; is also the cause, why he could not hate his guiltless creature, or appoint man to eternal torments, for no fault of his …</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2fb4ad2f69" data-kw="">
<blockquote><p>Herein it is not amiss to be noted that not only some small church truly so called, though in some points imperfect, but many churches may go astray, whole populous churches may be seduced. For truly people, whether sole and single or assembled and making a church or churches, are but people, and therefore prone to sin and soon deceived; and as the moon does often eclipse, so churches may sometimes err.

And yet another good observation it is, that if anyone therefore will needs be willful and unwilling to contend to perfection because all people necessarily have imperfections, verily that person is unwise and wants grace and can be no child of the church of God, which is a house of such people as invoke and call on the holy name of God. And whosoever so does, of duty must evermore more and more depart as far as possible from all iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-prime.html">John Prime</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition and Observations upon Saint Paul to the Galatians. Together with Incident Questions Debated and Motives Removed</cite>, (Oxford, 1587). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 16.</span></figcaption>

<blockquote><p>…there is a double beginning or cause of every gracious action in a man regenerate:

1. The Spirit of God by his exciting and cooperating grace.

2. Man himself renewed and sanctified in all his faculties. The former is termed principium a quo [the principle from which], the latter principium quod [the principle that]: man works, but he must be moved thereto and assisted by the Spirit of Grace: both together concur to the producing of every holy action. I say both together: for although man in his first conversion was merely passive, God’s Spirit working all without man’s help: yet man in performance of any holy act is not merely active, able to do all of himself without God’s help. No, he is partly passive, partly active: passive as he stands in need of God’s grace to stir up, guide, and strengthen the endeavor of each faculty in the doing of good: Active in as much as being thus helped by grace, himself willingly moves himself to every godly work. Now by reason of this concurrence of man with God, these operations of grace are properly called man’s work, not God’s work in man. So that when a regenerate man believes, this act though it be caused by Gods Spirit, yet it is done and exercised by Man voluntarily moving himself in that action, and therefore we say it is man that believes, not God’s Spirit that believes: as if the act of believing were wrought in man’s will by the Spirit of God in the same sort as jugglers work strange motions in their puppets, which seem to do wondrous feats, but tis an unseen hand that’s the cause of all. Such gross conceits should not have been devised by ingenuous minds and put upon so plain and clear doctrine as that is touching the concurrence of God’s grace with our strength in all holy actions whatsoever. The point is easy to him that will understand: Every good desire and good work is partly from man, because he wills it: he works it; but principally from God’s Spirit, because He makes man to will and to work it. Without which cooperating grace man by habitual inherent grace could do no good work at all, according to that of Christ, Jn. 15:5, ‘Without Me ye can do nothing,’ and of the apostle, Phil. 1:6, ‘He that hath begun the good work will also perform it;’ and again, Phil. 2:13, ‘It is God that worketh in you both the will and the deed, even of his good pleasure:’ and again, 1 Cor. 15:10, ‘I have labored more abundantly than they all, yet not I but the grace of God which is in me.’</p></blockquote>

<blockquote><p>Since, however, it [concupiscence] is diffused through all the parts of our soul, not even the will can be excepted from being infected by it. Since, however, its movements tickle, allure, and entice, this cannot happen without some will, which happens with delight. One and the same man in us is both old and new, in different respects. From this it comes that an inordinate movement is both voluntary and involuntary. Voluntary in that the will of the remaining old man inclines to it; involuntary, in that the new man resists. Although it is one and the same will, since however there are in it two qualities fighting against each other, as long as the Spirit and the flesh remain in us, it is not surprising if concerning one and the same object there is both willing and not willing. When, therefore, a regenerate person does the evil that he does not want [Rom. 7], it is not to be understood that he in no way wants it, but insofar as he is regenerate. Therefore, even the first movements are sins, because they proceed from the corruption of our will.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Since, however, it [concupiscence] is diffused through all the parts of our soul, not even the will can be excepted from being infected by it. Since, however, its movements tickle, allure, and entice, this cannot happen without some will, which happens with delight. One and the same man in us is both old and new, in different respects. From this it comes that an inordinate movement is both voluntary and involuntary. Voluntary in that the will of the remaining old man inclines to it; involuntary, in that the new man resists. Although it is one and the same will, since however there are in it two qualities fighting against each other, as long as the Spirit and the flesh remain in us, it is not surprising if concerning one and the same object there is both willing and not willing. When, therefore, a regenerate person does the evil that he does not want [Rom. 7], it is not to be understood that he in no way wants it, but insofar as he is regenerate. Therefore, even the first movements are sins, because they proceed from the corruption of our will.”

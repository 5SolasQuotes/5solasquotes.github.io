<main class="wrap"><figure class="quote" id="q-ecee29aff3" data-kw="">
<blockquote><p>It will be necessary, however, to return to the west country [of Scotland], where the invasion of the Highland host [in 1679] was succeeded by oppressions which at length exasperated the country people to resistance. Among these we may notice the imposition of the cess, as it was termed, a tax raised expressly for maintaining the army intended to put down field-conventicles. A more odious tax can hardly be conceived. That they should not only be severely fined and punished for attending these meetings, but compelled to pay for the means of suppressing them, was such an outrage on the feelings of the people, that we might be prepared to hear it would be almost universally resisted. Yet the greater part submitted to the tax, contenting themselves with a protest against its use; thus declaring their readiness to suffer for religion if they should be called to account, and at the same time avoiding even the appearance of evil by refusing the magistrate’s just right to levy cess and custom on the subjects. This, however, proved another “bone of contention;” the stricter and more rigid of the Presbyterians considering that by paying the cess they shared in the guilt of the purpose to which it was avowedly applied. The ministers who were banished to Holland loudly inveighed against the practice; and it was no doubt very easy for them, placed at a distance from the scene of oppression, as it may be for us who are free from all such exactions, to protest against those who yielded to them. But much may be said in behalf of those who submitted against their will to an imposition which they could not resist, and which, had they resisted, would have been wrested from them with the loss of all they possessed. On the other hand, the principles upon which some of the Presbyterians afterwards resisted the impost, and which are vindicated at great length in the Hind let Loose [by the Cameronian Alexander Shields], were founded on the tyrannical character of the governors, and necessarily led to the casting off all allegiance or submission to the civil government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875)</cite>, p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

<blockquote><p>Argument 5— When Paul commands us to pay tribute to princes (Rom. 13:6) because they are the ministers of God, he lays this ground, that the king has not all, but that the subjects are to give to him of their goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 68 rt col top</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 68 rt col top">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CArgument+5%E2%80%94+When+Paul+commands+us+to+pay+tribute+to+princes+%28Rom.+13%3A6%29+because+they+are+the+ministers+of+God%2C+he+lays+this+ground%2C+that+the+king+has+not+all%2C+but+that+the+subjects+are+to+give+to+him+of+their+goods.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+68+rt+col+top&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64b47022e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64b47022e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-paying-taxes/#:~:text=Argument%205%E2%80%94%20When%20Paul%20commands%20us,give%20to%20him%20of%20their%20goods&amp;text=Argument%205%E2%80%94%20When%20Paul%20commands%20us%20to%20pay&amp;text=are%20to%20give%20to%20him%20of%20their%20goods" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6c56e7c541" data-kw="">
<blockquote><p>Now there was brought forth in Scotland, anno 1610, a certain amphibian brood, sprung out of the stem of Neronian tyranny and in manners like to his nearest kinsman, the Spanish Inquisition. It is armed with a transcendent power and called by the dreadful name of the High Commission. Among other things, it arrogates to itself the power of deposing ministers. But how unjustly, thus it appears: 1. If those commissioners have any power at all to depose ministers, they have it from the king whose commissioners they are. But from him they have it not. Therefore they have none at all. The proposition is most certain: For they sit not in that commission to judge in their own name, nor by their own authority quum nihil exerceat delegatus nomine proprio, as Panormitan says (apud Forb. Iren, bk. 2, ch. 11, p. 177), but by virtue only of the commission and delegation which they have of the king. Yea, bishops themselves exerce not any jurisdiction in the High Commission as bishops, but only as the king’s commissioners, as Dr. Downame aknowledges (Defens., bk. 1, p. 8). The assumption is grounded upon this reason: The king has not power to depose ministers. Therefore he cannot give this power to others. For Nemo potest plus juris transferre in alium quam sibi competere dignoscatur (Boniface, 8, De Regul. Juris Reg., 79). The king may sometimes inflict such a civil punishment upon ministers, whereupon secondarily and accidentally will follow their falling away from their ecclesiastical office and function, (in which sense it is said that Solomon deposed Abiathar, as we heard before), but to depose them directly and formally (which the High Commission usurps to do), he has no power, and that because this deposition is an act of ecclesiastical jurisdiction: Whereas the power of Ecclesiastical jurisdiction does no more agree to the king than the power of ecclesiastical order: his power is civil and temporal, not spiritual and ecclesiastical. Dr. Field also confesses that none may judicially degrade or put anyone lawfully admitted from his degree and order but the spiritual guides of the Church alone (Of the Church, bk. 5, ch. 53, p. 682). 2. The deposing of ministers pertains to classical presbyteries, or (if the matter be doubtful and difficille) to synods, as has been showed. And who then can give the High Commission such authority as to take this power from them, and to assume it unto itself. These Commissioners profess that they have authority to discharge other ecclesiastical judicatories within the kingdom from meddling with the judging of anything which they shall think impertinent for them, and which they shall think good to judge and decide by themselves in their commission. Which, if it be so, then (when it pleases them) they may make other ecclesiastical judicatories to be altogether useless and of no effect in the Church. 3. In this commission, ecclesiastical and temporal men are joined together, and both armed with the same power. Therefore it is not right nor regular, nor in any wise allowable. For even as when a minister has offended in a civil matter, his fault is to be judged by civil judges according to the civil laws, and by no other: so when he offends in an ecclesiastical matter, his fault is to be judged only by ecclesiastical persons according to ecclesiastical laws: and in such a case Justinian forbids civil men to be joined with ecclesiastical men in judgment (Novell., 83, ch. 1). They are ecclesiastical things or causes which are handled and examined by the High Commission in the process of deposing ministers: and a shame it is to ecclesiastical men if they can, without the help and joining of temporal men, judge and decide things of this quality. 4. As in the matters to be judged, so in the censures and punishments to be inflicted; ecclesiastical and civil men have in this Commission alike power and authority: for ecclesiastical men therein have power of fining, confining, warding, etc. common to them with the temporal men: and again, the temporal men have power of excommunication, suspension, deprivation, etc. common to them with the ecclesiastical men. For they all sit there as the king’s commissioners, and so nomine [by name] they exerce this jurisdiction: which Commission being alike discharged by them all, it is manifest that both temporal men take hold of the keys and ecclesiastical men take hold of the civil sword. And this monstruous confusion and mixture gives sufficient demonstration that such a form of judgement is not from the God of order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 3, bk. 8, Digression 4</cite>, pp. 195-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

+ecclesiastical+jurisdiction%3A+Whereas+the+power+of+Ecclesiastical+jurisdiction+does+no+more+agree+to+the+king+than+the+power+of+ecclesiastical+order%3A+his+power+is+civil+and+temporal%2C+not+spiritual+and+ecclesiastical.+Dr.+Field+also+confesses+that+none+may+judicially+degrade+or+put+anyone+lawfully+admitted+from+his+degree+and+order+but+the+spiritual+guides+of+the+Church+alone+%28Of+the+Church%2C+bk.+5%2C+ch.+53%2C+p.+682%29.+2.+The+deposing+of+ministers+pertains+to+classical+presbyteries%2C+or+%28if+the+matter+be+doubtful+and+difficille%29+to+synods%2C+as+has+been+showed.+And+who+then+can+give+the+High+Commission+such+authority+as+to+take+this+power+from+them%2C+and+to+assume+it+unto+itself.+These+Commissioners+profess+that+they+have+authority+to+discharge+other+ecclesiastical+judicatories+within+the+kingdom+from+meddling+with+the+judging+of+anything+which+they+shall+think+impertinent+for+them%2C+and+which+they+shall+think+good+to+judge+and+decide+by+themselves+in+their+commission.+Which%2C+if+it+be+so%2C+then+%28when+it+pleases+them%29+they+may+make+other+ecclesiastical+judicatories+to+be+altogether+useless+and+of+no+effect+in+the+Church.+3.+In+this+commission%2C+ecclesiastical+and+temporal+men+are+joined+together%2C+and+both+armed+with+the+same+power.+Therefore+it+is+not+right+nor+regular%2C+nor+in+any+wise+allowable.+For+even+as+when+a+minister+has+offended+in+a+civil+matter%2C+his+fault+is+to+be+judged+by+civil+judges+according+to+the+civil+laws%2C+and+by+no+other%3A+so+when+he+offends+in+an+ecclesiastical+matter%2C+his+fault+is+to+be+judged+only+by+ecclesiastical+persons+according+to+ecclesiastical+laws%3A+and+in+such+a+case+Justinian+forbids+civil+men+to+be+joined+with+ecclesiastical+men+in+judgment+%28Novell.%2C+83%2C+ch.+1%29.+They+are+ecclesiastical+things+or+causes+which+are+handled+and+examined+by+the+High+Commission+in+the+process+of+deposing+ministers%3A+and+a+shame+it+is+to+ecclesiastical+men+if+they+can%2C+without+the+help+and+joining+of+temporal+men%2C+judge+and+decide+things+of+this+quality.+4.+As+in+the+matters+to+be+judged%2C+so+in+the+censures+and+punishments+to+be+inflicted%3B+ecclesiastical+and+civil+men+have+in+this+Commission+alike+power+and+authority%3A+for+ecclesiastical+men+therein+have+power+of+fining%2C+confining%2C+warding%2C+etc.+common+to+them+with+the+temporal+men%3A+and+again%2C+the+temporal+men+have+power+of+excommunication%2C+suspension%2C+deprivation%2C+etc.+common+to+them+with+the+ecclesiastical+men.+For+they+all+sit+there+as+the+king%E2%80%99s+commissioners%2C+and+so+nomine+%5Bby+name%5D+they+exerce+this+jurisdiction%3A+which+Commission+being+alike+discharged+by+them+all%2C+it+is+manifest+that+both+temporal+men+take+hold+of+the+keys+and+ecclesiastical+men+take+hold+of+the+civil+sword.+And+this+monstruous+confusion+and+mixture+gives+sufficient+demonstration+that+such+a+form+of+judgement+is+not+from+the+God+of+order.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+3%2C+bk.+8%2C+Digression+4%2C+pp.+195-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c56e7c541.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6c56e7c541.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=Now%20there%20was%20brought%20forth%20in,not%20from%20the%20God%20of%20order&amp;text=Now%20there%20was%20brought%20forth%20in%20Scotland%2C%20anno&amp;text=judgement%20is%20not%20from%20the%20God%20of%20order" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9bb81ef7f7" data-kw="">
<blockquote><p>To these appertains the doing and execution of civil and temporal affairs, so as their subiects may live in peace. By reason whereof the taxes and subsidies are due unto them and to them appertain to use the sword which God has given them, for the preservation as well of the countries which be committed to them, as also for the defence and maintenance of good laws, and punishment of the evil and wicked doers. Secondly, the duty and office of the magistrates is not to regard simply the peace and concord of subiects, but principally for this end, that the peace and concord may tend to the honor and glory of God, that all men may live not only in a certain civil honesty, but also with piety and true worship of God, as witnesses saint Paul. For this cause especially it appertains to the magistrate that the laws which he uses and executes may be conformable to the will of God: and principally to give order that the religion be perfect and holy, and that all the Church be ordered according to the Word of God, forbidding and punishing, as the case requires, all those which trouble the Church or concerning the discipline thereof [Beza’s larger context makes clear he is speaking in the context of a Christian nation].</p></blockquote>

ernment/#:~:text=To%20these%20appertains%20the%20doing%20and,the%20context%20of%20a%20Christian%20nation&amp;text=To%20these%20appertains%20the%20doing%20and%20execution%20of&amp;text=speaking%20in%20the%20context%20of%20a%20Christian%20nation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>21. ‘Moreover, thou shalt provide out of all the people.’… meaning, thou shalt choose out and take the most worthy, so that such an office be not entrusted rashly to any one that offers. But this was most reasonable, among a free people, that the judges should not be chosen for their wealth or rank, but for their superiority in virtue. Yet although it be right that regard should be chiefly had to virtue, so that if any one of the lower orders be found more suitable than others, he should be preferred to the noble or the rich; still should any one choose to, lay this down as a perpetual and necessary rule, he will be justly accounted contentious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ex. 18, v. 21</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-894e025b26" data-kw="">
<blockquote><p>An act of Christ alone is not sufficient to form a command; for although He consecrated in white wine, or at night, for example, He did not on that account command us to consecrate” (3. Thom. De Sacra. +). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, vol. 3, ed. James Dennison Jr., 1997, p. 430 | 19th Topic: The Sacraments | 22nd Question: Why was the holy Supper instituted by our Lord and of how many parts does it consist? | The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever He did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

m%20heaven&amp;text=It%20is%20evident%2C%20however%2C%20from%20the%20apostolic%20history&amp;text=the%20true%20bread%20which%20came%20down%20from%20heaven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-efc52c85f3" data-kw="">
<blockquote><p>The second matter to be considered in reference to this sacrament is the external signs. We must here take note of the signs and the ceremonies associated with them. The signs are identical to those used in meals in order to nourish and refresh the body: bread and wine. One is to be neither superstitious nor concerned regarding the kind of bread and wine. The bread and wine which Christ used were such as were available and in common use. It is credible that in light of the Passover Christ used unleavened bread; but that was incidental, for leavened bread was neither permitted to be used nor was it available in Jerusalem at that time. It is therefore not necessary to follow suit in this respect. It must be bread which one commonly uses for nourishment, thus to typify the spiritual nourishment of the soul. The wafers of the Papists and the Lutherans consist more of foam than of bread, and are not suitable for nourishment and strengthening. This is contrary to the institution of the Lord’s Supper; Christ had no wafers, but took bread, broke off fragments, and gave them to the disciples. He did not give a wafer to anyone. … Common substances must be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><figure class="quote" id="q-a019d5253b" data-kw="">
<blockquote><p>In the mean while Satan, using every exertion to subvert entirely the church erected at Geneva, which had been shaken to its very foundation, found in a short time some idle characters, who, for the purpose of concealing the great iniquity of the decree under the pretext of religion, determined that unleavened bread should be substituted for common, formerly used at the Lord’s table, with a view to afford an opportunity for fomenting new dissensions. And the great enemy of the Church would have succeeded in this plan, had not Calvin seriously admonished some good men, so displeased with the change as to consider it their duty to refrain from taking the Lord’s Supper, not to contend about a subject in itself indifferent. The use of unleavened bread commenced in the manner now stated, nor did Calvin on his future restoration think it worth while to make any opposition to the practice, though he [Calvin] did not attempt to conceal his approval of the use of common bread.</p></blockquote>

<blockquote><p>His argument is undone in distinguishes between cleansing efficiently and meritoriously; the blood of Christ truly cleanses us meritoriously, not efficiently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Maccovius Revived, or Manuscripts of his</cite>, … ed. Nicolaas Arnoldi (Amsterdam, 1659) | ‘Anti-Eckhardus’ [Heinrich Eckhardi 1580-1624] | 19. On Baptism | VII. ‘Whether Calvinists may speak from of the soul when they so fashion the favorite sacramental analogy that as water washes away the filth of the body, so the blood of Christ washes the filth of the soul and cleanses sins? Piscator, vol. 2, place 15, thesis 12; Polanus, p. 248; Sohnius, vol. 1, p. 246; Bucanus, p. 666; Beza, vol. 3, fols. 332, 342.’</span></figcaption>

k">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af725b8991" data-kw="">
<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession, the former, known specifically as the Reformed, have always tried to reconcile with those of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups. II. Although these latter ones [the Lutherans] have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues. III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book “Northern Olive Branch,” and George Calixtus, professor of theology at the University of Helmstedt, in his book “Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-e48f1cbba8" data-kw="">
<blockquote><p>Of the first sort is God’s immensity ; it is an absolute property of his nature and being. For God to be immense, infinite, unbounded, unlimited, is as necessary to him as to be God ; that is, it is of his essential perfection so to be. The ubiquity of God, or his presence to all things and persons, is a relative property of God ; for to say that God is present in and to all things supposes those things to be. Indeed, the ubiquity of God is the habitude of his immensity to the creation. Supposing the creatures, the world that is, God is by reason of his immensity indistant to them all;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, ch. 2, ‘Of the Nature of God’, p. 93 in Works, vol. 12</span></figcaption>

</figure><figure class="quote" id="q-eb27eb3ed6" data-kw="">
<blockquote><p>Till far on in the second half of the century of the Reformation there were, properly speaking, only Evangelicals or Protestants; and the names Lutherans, Zwinglians, Calvinists were by all authorities of that time entirely repudiated. (Zanchius in a letter complains of people applying to themselves such names.)… in Frankfort [Germany] those who held the views of the Swiss, by the advice of Dathen, let their children be baptized by the city clergy who held Lutheran opinions; and when Calvin in September, 1556, was called as arbitrator to Frankfort, the wine of honor was poured out to him. Moreover, the states of the empire that were inclined to the Swiss doctrine were not excluded, in the year 1555, in the compact entitled ‘the Religious Peace;’ and there was then in Germany only one Protestant Church which in that Peace received on the basis of the Augsburg Confession toleration, or rather equal authorization… The doctrine of predestination was nto then matter of dispute. (…Calvin writes in 1560 to Zerkint of Bern, that up to this year no one had taken exception to the doctrine of predestination (v. Op. Omnia, Strassburg edition, Vol. xvii, 238)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed in the Sixteenth Century” in Presbyterian &amp; Reformed Review</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 416</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

ine.com/on-lutheranism/#:~:text=Till%20far%20on%20in%20the%20second,Omnia%2C%20Strassburg%20edition%2C%20Vol.%20xvii%2C%20238&amp;text=Till%20far%20on%20in%20the%20second%20half%20of&amp;text=v.%20Op.%20Omnia%2C%20Strassburg%20edition%2C%20Vol.%20xvii%2C%20238" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Eckhardi says:] This we accept of infants, who are so in the covenant due to the faith of the parents, that they are justified by the faith of the parents. …I respond 1. not all infants of pious parents are received in the Covenant of God: so it was said of Ishmael which was the son of Abraham; and of Esau which was the son of Isaac. 2. Of the impious, or such as the Turks and other heathens, and their infants passing away in infancy, they all are certainly condemned, as is evident from 1 Cor. 7:14, indeed they are such as are unclean. If, however, it is understood that the impious are in the Covenant as far as the external society, I say even that God may not only look to this, but to the grandfather and the grandfather’s grandfather, so that it may be indeed such children frequently are in the Covenant with God, and the Covenant has been taken hold of for them by previous parents. …but where they are already adolescents, they having their own faith, then this faith [of others] is the more not necessary for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Maccovius Revived, or Manuscripts of his</cite>, … ed. Nicolaas Arnoldi (Amsterdam, 1659) | ‘Anti-Eckhardus’ [Heinrich Eckhardi 1580-1624] | 17. On Justification 671 | III. ‘Whether anyone is able to be justified by the faith of another, being destitute of their own?’ 672</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[Eckhardi says:] This we accept of infants, who are so in the covenant due to the faith of the parents, that they are justified by the faith of the parents. …I respond 1. not all infants of pious parents are received in the Covenant of God: so it was said of Ishmael which was the son of Abraham; and of Esau which was the son of Isaac. 2. Of the impious, or such as the Turks and other heathens, and their infants passing away in infancy, they all are certainly condemned, as is evident from 1 Cor. 7:14, indeed they are such as are unclean. If, however, it is understood that the impious are in the Covenant as far as the external society, I say even that God may not only look to this, but to the grandfather and the grandfather’s grandfather, so that it may be indeed such children frequently are in the Covenant with God, and the Covenant has been taken hold of for them by previous parents. …but where they are already adolescents, they having their own faith, then this faith [of others] is the more not necessary for them.”

— Johannes Maccovius, Johannes Maccovius Revived, or Manuscripts of his… ed. Nicolaas Arnoldi (Amsterdam, 1659) | ‘Anti-Eckhardus’ [Heinrich Eckhardi 1580-1624] | 17. On Justification 671 | III. ‘Whether anyone is able to be justified by the faith of another, being destitute of their own?’ 672">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BEckhardi+says%3A%5D+This+we+accept+of+infants%2C+who+are+so+in+the+covenant+due+to+the+faith+of+the+parents%2C+that+they+are+justified+by+the+faith+of+the+parents.+%E2%80%A6I+respond+1.+not+all+infants+of+pious+parents+are+received+in+the+Covenant+of+God%3A+so+it+was+said+of+Ishmael+which+was+the+son+of+Abraham%3B+and+of+Esau+which+was+the+son+of+Isaac.+2.+Of+the+impious%2C+or+such+as+the+Turks+and+other+heathens%2C+and+their+infants+passing+away+in+infancy%2C+they+all+are+certainly+condemned%2C+as+is+evident+from+1+Cor.+7%3A14%2C+indeed+they+are+such+as+are+unclean.+If%2C+however%2C+it+is+understood+that+the+impious+are+in+the+Covenant+as+far+as+the+external+society%2C+I+say+even+that+God+may+not+only+look+to+this%2C+but+to+the+grandfather+and+the+grandfather%E2%80%99s+grandfather%2C+so+that+it+may+be+indeed+such+children+frequently+are+in+the+Covenant+with+God%2C+and+the+Covenant+has+been+taken+hold+of+for+them+by+previous+parents.+%E2%80%A6but+where+they+are+already+adolescents%2C+they+having+their+own+faith%2C+then+this+faith+%5Bof+others%5D+is+the+more+not+necessary+for+them.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+Johannes+Maccovius+Revived%2C+or+Manuscripts+of+his%E2%80%A6+ed.+Nicolaas+Arnoldi+%28Amsterdam%2C+1659%29+%7C+%E2%80%98Anti-Eckhardus%E2%80%99+%5BHeinrich+Eckhardi+1580-1624%5D+%7C+17.+On+Justification+671+%7C+III.+%E2%80%98Whether+anyone+is+able+to+be+justified+by+the+faith+of+another%2C+being+destitute+of+their+own%3F%E2%80%99+672&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe6ee3afac0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perm

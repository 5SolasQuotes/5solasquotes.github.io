<main class="wrap"><figure class="quote" id="q-8b64e3f106" data-kw="">
<blockquote><p>In a word, the Confessional doctrine of the sufficiency or completeness of Scripture is the charter of liberty of conscience; God’s prescriptions for faith and conscience are required to be received with humility of heart, and none but God’s.

It must be observed, however, that the teachings and prescriptions of Scripture are not confined by the Confession to what is “expressly set down in Scripture.” Men are required to believe and to obey not only what is “expressly set down in Scripture,” but also what “by good and necessary consequence may be deduced from Scripture.”

This is the strenuous and universal contention of the Reformed theology against Socinians and Arminians, who desired to confine the authority of Scripture to its literal asseverations; and it involves a characteristic honouring of reason as the instrument for the ascertainment of truth. We must depend upon our human faculties to ascertain what Scripture says; we cannot suddenly abnegate them and refuse their guidance in determining what Scripture means.

This is not, of course, to make reason the ground of the authority of inferred doctrines and duties. Reason is the instrument of discovery of all doctrines and duties, whether “expressly set down in Scripture ” or “by good and necessary consequence deduced from Scripture:” but their authority, when once discovered, is derived from God, who reveals and prescribes them in Scripture, either by literal assertion or by necessary implication.

The Confession is only zealous, as it declares that only Scripture is the authoritative rule of faith and practice, so to declare that the whole of Scripture is authoritative, in the whole stretch of its involved meaning. It is the Reformed contention, reflected here by the Confession, that the sense of Scripture is Scripture, and that men are bound by its whole sense in all its implications.

The re-emergence in recent controversies of the plea that the authority of Scripture is to be confined to its expressed declarations, and that human logic is not to be trusted in divine things, is, therefore, a direct denial of a fundamental position of Reformed theology, explicitly affirmed in the Confession, as well as an abnegation of fundamental reason, which would not only render thinking in a system impossible, but would discredit at a stroke many of the fundamentals of the faith, such, e. g., as the doctrine of the Trinity, and would logically involve the denial of the authority of all doctrine whatsoever, since no single doctrine of whatever simplicity can be ascertained from Scripture except by the use of the processes of the understanding.

It is, therefore, an unimportant incident that the recent plea against the use of human logic in determining doctrine has been most sharply put forward in order to justify the rejection of a doctrine which is explicitly taught, and that repeatedly, in the very letter of Scripture; if the plea is valid at all, it destroys at once our confidence in all doctrines, no one of which is ascertained or formulated without the aid of human logic.</p></blockquote>

ovenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c5719e6b4" data-kw="Private spirit">
<blockquote><p>I answer, first, that we do not send any one who is in doubt on any matter to his private spirit, neglecting all means of finding truth, as the Jesuit falsely objects to us; but to scripture itself, and the Holy Spirit speaking publicly in the scripture, who, we say, ought to be heard, and by whose authority we maintain that all controversies should be decided: which also was the very thing done in this council.</p></blockquote>

<blockquote><p>The Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>

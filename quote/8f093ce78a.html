<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 13, n.p.</span></figcaption>

<blockquote><p>…we maintain this, that properly and truly, by faith itself, we are for Christ’s sake accounted righteous, or are acceptable to God. And because ‘to be justified’ means that out of unjust men, just men are made, or born again, it means also that they are pronounced or accounted just. For Scripture speaks in both ways. [Margin note:] (The term ‘to be justified’ is used in two ways: to denote being converted or regenerated; again, being accounted righteous.]) Accordingly we wish first to show this, that faith alone makes of an unjust, a just man, i.e., receives remission of sins.</p></blockquote>

<blockquote><p>20. Justification does not free from sin and death directly by taking away the blame or stain or all the effects of sin; rather it removes the guilty obligation to undergo eternal death. Rom. 8:1, 33-34, ‘There is no condemnation… Who shall lay anything to their charge?… who shall condemn? 21. Nor does it take away guilt so that the deserving of punishment is removed from sin. This cannot be taken away as long sin itself remains. But justification does take away guilt so that its haunting or deadly effects vanish. … 23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning. 25. Yet those who are justified need daily the forgiveness of sins. This is true because the continuance of grace is necessary to them; the consciousness and manifestation of forgiveness increases more and more as individual sins require it; and the execution of the sentence which is pronounced in justification may thus be carried out and completed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (Baker, 1997), ch. 27, ‘Justification’, pp. 163-64</span></figcaption>

<blockquote><p>‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.</p></blockquote>

ms+herein+to+be+declared+in+that+we+begin+a+new+life%2C+therefore+is+it+referred+unto+the+resurrection+of+Christ%3A+for+that+he+then+seemed+to+have+begun+a+celestial+and+happy+life.+Paul+used+in+a+maner+the+self-same+form+of+words+in+this+same+epistle%2C+when+he+says+%5BRom.+10%5D%3A+%E2%80%98with+the+heart+we+believe+unto+righteousness%3A+and+with+the+mouth+is+confession+made+to+salvation.%E2%80%99+For+the+faith+of+the+heart+both+works+righteousness+and+also+brings+salvation%3A+but+because+salvation+and+instauration+are+chiefly+declared+in+action%2C+therefore+he+ascribed+it+to+confession.+But+whither+of+these+expositions+is+the+truer%2C+neither+will+I+contend%2C+nor+also+now+declare.+Of+those+things+which+have+now+been+spoken%2C+we+gather+a+most+sweet+consolation%3A+for+thereby+we+do+not+only+know+the+weight+of+sin%2C+but+also+we+understand+that+God+bare+a+singular+good+love+towards+us%3A+as+one+which+gave+his+only+begotten+Son%2C+and+that+unto+the+death+to+deliver+us+from+sins.+Farther%2C+seeing+Christ+is+said+to+have+risen+from+the+dead+for+our+justification%2C+we+easily+see+that+we+are+by+Him+called+back+to+a+new+life%3A+unto+which+yet+we+cannot+aspire%2C+except+we+be+of+Him+elected.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Most+Learned+%26+Fruitful+Commentary+upon+the+Epistle+of+St.+Paul+to+the+Romans...+%28d.+1562%3B+London%3A+1568%29%2C+on+ch.+4%2C+verse+25%2C+p.+97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac48967e05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac48967e05.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Which%20believe%20in%20Him%20that%20raised,except%20we%20be%20of%20Him%20elected&amp;text=Which%20believe%20in%20Him%20that%20raised%20up%20Jesus&amp;text=cannot%20aspire%2C%20except%20we%20be%20of%20Him%20elected" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is therefore a twofold justification. One whereby, in ourselves being sinners, we are justified before God, from without us: The other whereby being now justified before God from without us, we are justified before Him within ourselves. The first of these is the cause of the second. The second is the effect and demonstration of the first. The first is done by faith, the other by works. Both must concur that the righteousness of the Law may be fulfilled in us… Let us speak fullier of the second sort of justification. It is that whereby God, by regeneration given us, and the works of sincere faith which we performed, absolves us from the charge of hypocrisy, profaness and impiety, and no longer takes us for men dead in sin, servants of the Devil and children of the world, but for true believers, his sons restored to his image, endued with his life and translated into his Kingdom: which judgment of God, the Law also approves. Not that it [the Law] takes it self-satisfied by our works, but because being bereaved of its dominion and subjected to Christ our Lord, it cannot choose but [to] commend the works which come from faith in Christ and from his Spirit, and account them for true righteousness, though they are imperfect; and them that perform them, for truly righteous and sons pleasing to God. Let it be here enquired, seeing Scripture does often and expressly ascribe to us both these righteousnesses we speak of, and therefore we are in respect of them both to be judged righteous, not only with men, but with God, whether in the same sense as we are said to be justified by works, Jam. 2, and to be justified by words, Mt. 12, works may not be said to be imputed to us for righteousness? Not indeed as faith is imputed to righteousness: but as the fact of Phineas is said to be imputed to him for righteousness, Ps. 106:31.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, ch. 10, sect. 3, pp. 342-52 in Richard Baxter’s Confession of his Faith… (London: 1655) The page numbering is misnumbered. The whole of sect. 3 has more on this topic, as Baxter quotes 80 authors in support of his views on the necessity of works for believers in salvation., pp. 344-47</span></figcaption>

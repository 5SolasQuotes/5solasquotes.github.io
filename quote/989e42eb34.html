<main class="wrap"><figure class="quote" id="q-989e42eb34" data-kw="">
<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal… (Edinburgh, 1659), pt. 4, ch. 7, ‘General Grounds leading to Unity’</cite>, pp. 320-24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30eda1a183" data-kw="">
<blockquote><p>A man may administer sacraments where he preaches not, as the apostles baptized, but Christ only preached there. And he that baptized Cornelius and his company, did not preach unto them, but Peter only preached. We read not that the [Greek] or minister, which Paul and Barnabas carried about with them, did preach. A minister may both preach and administer sacraments where he rules not, as Philip to the eunuch, the apostles and the 70 in Christ’s time: and ministers that preach abroad in a journey, or at a lecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it… (London, 1650), Question 1, ch. 7</cite>, p. 175</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

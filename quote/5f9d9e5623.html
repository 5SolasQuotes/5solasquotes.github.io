<main class="wrap"><figure class="quote" id="q-5f9d9e5623" data-kw="">
<blockquote><p>For the Kind, we must beware how we put the New Creature in the room of Christ: it is not so available as our blessed Lord Jesus is, who is the only Foundation, on which the Church is built, 1 Cor. 3.10. And able to save to the uttermost, Heb. 7.25. No Creature must be set up in competition with him, for there’s no Salvation in any other, Acts 4.12.

And herein I am afraid the Quakers are guilty of a gross Heresy, who call us from a Christ without us, to a Christ within us: yea, it hath been a dispute in the Plantation, called Pennsylvania, whether we must believe only in a Christ within us, or a Christ both within and without us, and it was carried mostly in the former Sense: But let no man be drawn from placing his entire confidence in Christ the Son of God, both God and Man in one Person, who suffered Death on the Cross, to make atonement for Sinners, and now sits on the right hand of God to make intercession for us.

2. If by a Christ within, they mean that called Light within, either Free will or Natural Conscience, or a power to help our selves without special Grace, its an exploded Error, and it’s to be feared, the Jesuits deliver their Popish stuff out of these men’s Mouths with refined Language. 3. If by Christ within, be meant Christ’s Person in the Believer, that he is Christed or Goded, ’tis blasphemy. 4. If by this expression, Christ within us, the hope of glory, Col. 1.27. or Christ dwelling in our hearts by faith, Eph. 3.17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), p. 44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd1fec55c9" data-kw="">
<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Predestination &amp; Justification</cite>, tr. Frank A. James (Kirksville, Missouri: Sixteenth Century Essays &amp; Studies, 2003), vol. 8, p. 62</span></figcaption>

</figure><figure class="quote" id="q-685533d1c4" data-kw="necessity satisfaction debt">
<blockquote><p>The satisfaction here discussed is not taken widely for a simple and indiscriminate reparation of injury (as when one purges and excuses himself to him who has suffered injury). Rather it is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.3</span></figcaption>

</figure><figure class="quote" id="q-15279c9495" data-kw="">
<blockquote><p>Yet surely as ministers derive their power from the Mediator Christ, so magistrates derive theirs from God Almighty, and both by vertue of their office, commission and capacity are unavoidably obliged to join their power and policy together for the suppression and punishment of vice and wickedness and the promoval and encouragement of virtue and piety, for no less will God call civil magistrates to an account for their negligence and maladministrations than Church pastors and ministers; therefore both should amicably correspond and cordially concur for advancing the peace and purity of the Church, for which purpose it is our hearty vote that God would pour forth a spirit of wisdom, zeal and holiness upon magistrates, ministers and all ranks and degrees of persons, Amen.</p></blockquote>

</figure><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, I-II, q. 114, a. 6</span></figcaption>

</figure><figure class="quote" id="q-3292520bce" data-kw="one God Deuteronomy Trinity">
<blockquote><p>The first thing which we affirm to be delivered unto us by divine revelation as the object of our faith, is, that God is one. Deut. 6:4, “Hear, O Israel; The Lord our God is one Lord.” A most pregnant testimony; and yet, notwithstanding, as I shall elsewhere manifest, the Trinity itself, in that one divine essence, is here asserted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, I</span></figcaption>

</figure><figure class="quote" id="q-0e37a7d645" data-kw="one God unity">
<blockquote><p>The Scriptures recognize a single omnipotent, infinite, eternal, and supremely perfect God, and this is supported by reason. Since the creation, maintenance, and governance of the world require infinite power, if there were two or more gods, none of them would be infinite. One would limit the other and set boundaries to its power. Hence, it is necessary for the supreme and greatest being to be singular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis I</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/one-essence.html">One Essence</a> › <a href="../topics/the-trinity/one-essence/unity-of-nature.html">Unity of nature</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Scriptures recognize a single omnipotent, infinite, eternal, and supremely perfect God, and this is supported by reason. Since the creation, maintenance, and governance of the world require infinite power, if there were two or more gods, none of them would be infinite. One would limit the other and set boundaries to its power. Hence, it is necessary for the supreme and greatest being to be singular.”

— Pierre Du Moulin, On the Trinity, Thesis I">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20Scriptures%20recognize%20a%20single%20omnipotent%2C%20infinite%2C%20eternal%2C%20and%20supremely%20perfect%20God%2C%20and%20this%20is%20supported%20by%20reason.%20Since%20the%20creation%2C%20maintenance%2C%20and%20governance%20of%20the%20world%20require%20infinite%20power%2C%20if%20there%20were%20two%20or%20more%20gods%2C%20none%20of%20them%20would%20be%20infinite.%20One%20would%20limit%20the%20other%20and%20set%20boundaries%20to%20its%20power.%20Hence%2C%20it%20is%20necessary%20for%20the%20supreme%20and%20greatest%20being%20to%20be%20singular.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20On%20the%20Trinity%2C%20Thesis%20I&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0e37a7d645.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0e37a7d645.html">Permalink</a><a class="src" href="https://drive.google.com/file/d/1VgXo-o-kRg2EBQQExW4YaPjWkp15MuHn/view?usp=drivesdk" rel="noopener" target="_blank">Read it online · Drive (Nick&#x27;s copy)</a></div>
</figure><figure class="quote" id="q-74c3572d0d" data-kw="unity three persons">
<blockquote><p>While he proclaims his unity, he distinctly sets it before us as existing in three persons. These we must hold, unless the bare and empty name of Deity merely is to flutter in our brain without any genuine knowledge. Moreover, lest any one should dream of a threefold God, or think that the simple essence is divided by the three Persons, we must here seek a brief and easy definition which may effectually guard us from error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>

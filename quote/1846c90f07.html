<blockquote><p>But here Austin moves this objection: if we must not use many words in prayer for that our heavenly father knows our want by the same reason, and for the same cause, we should not use few words, no not those which are here appointed by our Saviour Christ.

The answer is: that in regard of God, and for his cause, we need, neither many nor few, nor any words at all in prayer, neither doth the form of prayer consist in the repetition of words. For to pray is to lift up the mind unto God, to pour out the heart before God, &amp; to ask something of him: but no man doth truly ask any thing, which desireth not the same, and desire is an affection of the mind.

And therefore though he utter with his mouth the best words that can be, unless there be also a lifting up of the mind, with attention and devotion, so as the heart may truly desire that which he asketh, that man prayeth not indeed. But he that lifteth up his mind, and with a devout inward affection of heart, doth entirely ask any thing of God, that man doth truly pray, although he express not in words his desire.

One man cannot intreat another unless he use words or gesture: but the inward and most secret corners of the mind and heart are plainly seen of God, and therefore David saith, my groaning is not hid from thee, Psal. 38. v. 10. &amp; Psal. 10. v. 17. The Lord heareth the desire of the poor: thine ear harkeneth to the preparation of their heart. And Psal. 38.10. My whole desire is before thee. Rom. 8. v. 26. When we know not what to ask, the spirit it self maketh request for us, with sighs which cannot be expressed.

And it were a foolish thing, therefore to utter our prayer in words, as though God could not understand the desire of our heart. And yet the Saints of God in the old testament, and the Apostles in the new are said, to have used words in praying. Neither doth Christ without cause say thus, in Luke, [when ye pray, say] but it was for our sakes and for our prayers. Which is carefully to be considered, that we may learn to use vocal prayer well and profitably: for our mind doth not thoroughly consider and regard those things which we want, or are to aske, especially if they be spiritual, and pertain to the glory of God. And therefore the words which we use in praying, do by a kind of advertisement lead us to that consideration, that so the desire of our heart may be rightly informed.

Now the heart in prayer ought to be penitent and humble. But because we do for the most part rush upon this exercise of prayer, without due consideration of our sins and unworthiness: therefore the rehearsing of words is profitable, whereunto if the mind give heed, that we may pray with the Spirit and with the understanding also, 1. Cor. 1.15. then will the meditation thereof prepare the heart to serious repentance and to true humility. The desires of our heart are commonly out of order, so as oftentimes men neither think upon the order, nor on the end of those things they are to require: but the words which we use in prayer doe advertise us of those things we are to think upon when we pray.

And doubtless the rehearsing and meditation of God’s promises doth stir up, kindle, and increase our faith. We are often slow to prayer, and in praying cold and drowsy, neither do we come unto God with the devotion of mind we ought to do. But when as in praying we repeat the words, by diligent meditation thereon, and by due consideration of the promise and commandment, our mind is moved to lift up it self unto God, our devotion is kindled, and being once kindled is continued and increased.

Also the diligent marking of those things we are to ask, whereof we are put in mind by the words of our prayer, doth excite and kindle in our benumbed and frozen heart a good affection unto prayer. For those words, because they are the words of Christ, be the tool or instrument of the Spirit, whereby the Spirit of prayer will be powerful and effectual in us. And therefore that which Christ here delivereth [When we pray, SAY:] doth bind us so far forth as the rehearsal of words in praying is hereunto available, to excite, and kindle, to continue and increase our devotion, least it should wax cold and benumbed and be quenched altogether. And hereunto sometime longer prayers serve best, otherwise those which are shorter.</p></blockquote>

<blockquote><p>The Covenanters in the United States realised that chattel slavery was a sin that would provoke the wrath of God. Hence, they made it a cause for fasting that such evil existed in their nation:

That abominable species of murder, even enslaving thousands of fellow creatures for life and their posterity without end, and degrading them below the brutes, is now reduced to a regular system, and seems, by a long prescription to a brave remedy. There is, for the present, power on the side of the oppressors, but no power on the side of the oppressed.

What humane man but will mingle his tears with those of his fellow mortals, when he sees them shut out from every source of rational happiness, far banished from their native homes, torn from their dear relations, and wallowing in the most abominable uncleanness, while every means of ameliorating their condition is artfully kept from their view by their insolent and murderous masters. Oh! America, what hast thou to account for, but to God and man, on the head of slavery alone? Alas! when shall God arise for the cries of the oppressed?</p></blockquote>

<blockquote><p>Q. Hitherto of the sorts of Prayer: what principal rule are we to follow for our direction in the matter and manner of our prayers?

A. We are herein (for help of our weakness) to look unto the prayers of the holy men of God set down in Scripture, according as the estate wherein they were at the time of those prayers, may best sort with the special cases and conditions that we are in when we pray. But especially and above any other, yea above all of them, we are to look unto that most absolute prayer, which our Saviour Christ hath taught us in the Gospel.

Q. Do you call that a prayer, which of some is thought only a for me to direct our prayers by?

A. It is both a prayer, which we may and ought to use; and also a form of prayer, whereunto we are to conform, and by which we ought to square all our prayers by; and therefore as Christ biddeth us pray after this sort; so in Luke he biddeth us say, Our Father; &amp;c.

Q. May there not, besides this prayer of the Lord, be now under the Gospel a set form of prayer in the Church?

A. Yes verily; and it is convenient it should be so, so that it be left to the liberty of the Church to alter it.

Q. Wherefore is it convenient that there be a set form of prayer?

A. First, for testifying the consent of all true Churches, in the things that concern the worship and service of God, which may appear by such books. Secondly, for direction of the Ministers to keep in their administration (for substance) like soundness in doctrine and prayer. Thirdly, to help the weaker and ruder sort of people especially; and yet so, as the set form make not men sluggish in stirring up the gift of prayer in themselves, according to divers occurrents; it being incident to the children of God to have some gift of prayer in some measure.</p></blockquote>

— Thomas Cartwright, A treatise of Christian religion. Or, the whole body and substance of divinity, (2nd edn, London: Thomas Man, 1616), pp 255-56.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+Hitherto+of+the+sorts+of+Prayer%3A+what+principal+rule+are+we+to+follow+for+our+direction+in+the+matter+and+manner+of+our+prayers%3F%0A%0AA.+We+are+herein+%28for+help+of+our+weakness%29+to+look+unto+the+prayers+of+the+holy+men+of+God+set+down+in+Scripture%2C+according+as+the+estate+wherein+they+were+at+the+time+of+those+prayers%2C+may+best+sort+with+the+special+cases+and+conditions+that+we+are+in+when+we+pray.+But+especially+and+above+any+other%2C+yea+above+all+of+them%2C+we+are+to+look+unto+that+most+absolute+prayer%2C+which+our+Saviour+Christ+hath+taught+us+in+the+Gospel.%0A%0AQ.+Do+you+call+that+a+prayer%2C+which+of+some+is+thought+only+a+for+me+to+direct+our+prayers+by%3F%0A%0AA.+It+is+both+a+prayer%2C+which+we+may+and+ought+to+use%3B+and+also+a+form+of+prayer%2C+whereunto+we+are+to+conform%2C+and+by+which+we+ought+to+square+all+our+prayers+by%3B+and+therefore+as+Christ+biddeth+us+pray+after+this+sort%3B+so+in+Luke+he+biddeth+us+say%2C+Our+Father%3B+%26c.%0A%0AQ.+May+there+not%2C+besides+this+prayer+of+the+Lord%2C+be+now+under+the+Gospel+a+set+form+of+prayer+in+the+Church%3F%0A%0AA.+Yes+verily%3B+and+it+is+convenient+it+should+be+so%2C+so+that+it+be+left+to+the+liberty+of+the+Church+to+alter+it.%0A%0AQ.+Wherefore+is+it+convenient+that+there+be+a+set+form+of+prayer%3F%0A%0AA.+First%2C+for+testifying+the+consent+of+all+true+Churches%2C+in+the+things+that+concern+the+worship+and+service+of+God%2C+which+may+appear+by+such+books.+Secondly%2C+for+direction+of+the+Ministers+to+keep+in+their+administration+%28for+substance%29+like+soundness+in+doctrine+and+prayer.+Thirdly%2C+to+help+the+weaker+and+ruder+sort+of+people+especially%3B+and+yet+so%2C+as+the+set+form+make+not+men+sluggish+in+stirring+up+the+gift+of+prayer+in+themselves%2C+according+to+divers+occurrents%3B+it+being+incident+to+the+children+of+God+to+have+some+gift+of+prayer+in+some+measure.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+treatise+of+Christian+religion.+Or%2C+the+whole+body+and+substance+of+divinity%2C+%282nd+edn%2C+London%3A+Thomas+Man%2C+1616%29%2C+pp+255-56.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf4fefa239.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf4fefa239.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/22/thomas-cartwright-on-the-use-of-the-lords-prayer-and-set-forms-of-prayer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1e7e9d5d74" data-kw="">
<blockquote><p>Wherefore, our Heavenly Master also says: “Watch and pray, that ye enter not into temptation.” Let every man, therefore, when fighting against his own concupiscence, pray that he enter not into temptation; that is, that he be not drawn aside and enticed by it. But he does not enter into temptation if he conquers his evil concupiscence by good will. And yet the determination of the human will is insufficient, unless the Lord grant it victory in answer to prayer that it enter not into temptation. What, indeed, affords clearer evidence of the grace of God than the acceptance of prayer in any petition?

If our Saviour had only said, “Watch that ye enter not into temptation,” He would appear to have done nothing further than admonish man’s will; but since He added the words, “and pray,” He showed that God helps us not to enter into temptation. It is to the free will of man that the words are addressed: “My son, remove not thyself from the chastening of the Lord.” And the Lord said: “I have prayed for thee, Peter, that thy faith fail not.” So that a man is assisted by grace, in order that his will may not be uselessly commanded.</p></blockquote>

<blockquote><p>Lord, though all this be come upon me, yet I will not depart from thee, or deal falsely in thy covenant. I know thou art still the same Jehovah, true, holy, gracious, faithful, all-sufficient; and therefore behold me prostrate before thee, and resolving still to love thee, still to fear thee, still to trust thee; thou art my God still and my portion forever. Though I had nothing left in the world that I could call mine, yet thou Lord alone art enough, yet thou alone art All.</p></blockquote>

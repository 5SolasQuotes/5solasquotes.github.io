<main class="wrap"><figure class="quote" id="q-40e1ed74af" data-kw="">
<blockquote><p>For neither is a will confirmed in good, nor hardened in evil, so determined to all and every one of its free acts that it cannot not exercise each one; which is manifest in the state of Integrity and Innocence of the first men, in the state of Sin, in the state of Grace, and in the state of Glory. The same is to be judged of the will of the angels, and many things God does willingly which he could have not done, and the contraries of which he could have done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-wendelin.html">Marcus Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>System of Theology, bk. 1, ch. 5, thesis 18, expl. 3-4, p. 182-83 in Barthold Holtzfus, Theological Dissertation on the Free Will of Man’</cite>, p. 12 trans. AI by Nosferatu (Frankfurt: Zeitler, 1707)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews, on ch. 1, verse 10, section 131</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>On the Lord’s day] He calleth the first day of the week on which Christ rose again, the Lord’s day. He saw the revelation, on this day, which Christians kept holy to God, being by the authority of the Apostles set apart for Church meetings, instead of the Jewish Sabbaths: as we may gather from I Cor. 16.I: where the Apostle commandeth, that on the first day of the week, gathering be made in the Church, for the brethren in Judea. So Acts 20.7. In one of the Sabbaths, that is, the first day of the week the Christians are said to come together to break bread. So then the observation of the Lord’s day is warranted, by an Apostolical tradition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Divine Revelation of the Apostle and Evangelist John</cite>, trans. Elias Arnold (Amsterdam, 1644), p. 20.</span></figcaption>

</figure><figure class="quote" id="q-4ddd8a979e" data-kw="">
<blockquote><p>Indeed, the bond of a lawful covenant is so sacred a tie, that, without contempt of the holy majesty of God, it cannot be violated, nor without great sin; no creature can absolve us from it, nor dispense with it; nor are we to break it for any temporal advantage, terror or trouble. Yet, (supposing the covenant to be lawful…) it is sure:

1. That a lawful oath may cease to bind us, so that though we do not that which was under oath promised to be done; yet, there is no perjury: Semper perjurus est, qui non intendit quod promittit; non semper perjurus est, qui non perficit quod promisit sub Juramento, say the casuists.

2. It is certain that a lawful, although in the interpretation of it, it be stricti juris, and is to be understood according to the intention of the givers of it, and as the plain words bear; yet, it binds not in the sense which any ignorant mind or overscrupulous conscience may put upon it, or that some persons, upon partial designs, may put upon it, Videndum est (say Casuists) ne stricta interpretatio abeat in nimis strictam et rigidam.

3. It is certain, an unlawful oath did never, nor does bind any conscience to do according to it, though it binds to repentance for making of it and adhering to it. In considering and applying these things: as to the first, it would be remembered that an oath, howsoever in itself lawful, yet the case may be such that by something following after it, the oath may cease to bind us to the performing of what was sworn; yea, the case may be that an oath lawfully made yet cannot be lawfully kept; it were sin to keep it in some cases: then, and in that case, it is not we that loose ourselves, but God looses us, when an oath, lawful at the making, cannot be kept without sin against Him. Amongst other cases, wherein the ceasing of an obligation of a lawful oath may be seen, these three cases are worthy to be considered and seriously is it to be pondered whether they be applicable to the present question anent a discharge from the bond of the [Solemn League and] Covenant, as to the second Article of it, which is now under question: 1. If the matter of an oath be such as a superior has it in his power to determine of it, the oath of the inferior or subject person ceases to oblige him and is loosed when the superior consents not to what he has sworn: This is both agreeable to reason, because no deed of a person inferior or subject to others should prejudge the right of the superior nor take from him any power allowed to him by God in any thing: And also, all sound divines do acknowledge this upon the common equity of that law, Num. 30:4. If it be said that the matter of the second article of the Covenant, being not of indifferent nature, but determined by the Word of God, and so not under the power of a superior on earth to determine in it, it would be remembered that in all this part of the discourse, where the ceasing of the obligation of the Covenant is spoken of (as to the second article), they are dealt with who plead the obligation of the Covenant only [in distinction from God’s moral law], and upon that account do scruple. … If it be said again, that the consent of our superior has been obtained to that to which we have determined ourselves by our oath in the second article, and therefore our oath, before God, is confirmed, and he has not power to revoke his consent, according to that law, Num. 30:14: It would be considered whether it was the Lord’s mind in that law, that if children or wives, having vowed, should by some means drive their parents or husbands out of the house, deprive them of all their worldly comforts, and then, when they had put them thus undutifully under sad tentations, bargain with them either to ratify their vows, or never to enjoy these comforts they had deprived them of, whether it was the Lord’s mind that consent, so obtained, should be an irrevocable confirmation of their vows who had carried themselves so undutifully? There is no evidence for that. And the application is easy, since it is known that the Covenant was contrived and carried on as if the design had been laid to extirpate episcopacy whether the king would consent or not, or whatever course should be taken to force his consent, vi et armis [by force and arms], or by suspending him from the exercise of his royal power: an unparalleled way of usage from subjects to their sovereign. Again it would be considered whether this be, De jure naturali [of the natural law], that a consent of a superior once given to the vow of an inferior, he has no power to revoke his consent upon reasonable causes, and to make void the vow, albeit, if he do it rashly and unreasonably, he sins. Great scholars are of the mind, he may revoke his consent: Lessius, Tract on a Vow, doubt 13. It is thought by him and others, that the precept eatenus [so far] is judicial, as it makes an irrevocable confirmation of the vow once consented to. If it be further said, if the superior, under oath, give his consent to the inferior’s oath, or if he himself swear the same thing, then there is no power left of revoking his consent, or doing or putting his inferiors to do contrary to the oath: This is granted, unless upon some other ground there be a clear loosing of the superior’s oath and a ceasing of the obligation of it. Leaving these things to be applied, let us look upon the second case, wherein the obligation and binding-power of an oath ceases and the oath is loosed. It is this, when the matter concerning which the oath is continues not in the same state it was in at the making of the oath, when something in providence before the accomplishment of the oath occurs that makes the performance of the oath either sinful or importing some turpitude and something against moral honesty, or when the case comes to be that, that the plain end and expectation of the oath upon which it was founded appears frustrated: according to the language of divines, Res non permanet in eodem statu, ideo cessat juramenti obligatio. For example: If a man swear that at such a certain time he shall deliver to such a man his sword, if in the meantime that man turn mad, and, in probability, might kill himself or others with the sword, had he it in his hand, there lies no obligation upon the swearer to deliver it to him; Nay, it were a sin and against charity to perform what he had promised. Again, if a man swear to marry such a woman at such a time, if before that time he is made certain she is with child to his own brother, it were a grievous sin of incest to marry her (under pretense of keeping his promise). Or, if she should, before the marriage day, be found with child to another man (not so related to him) yet, to marry her, as it could not but have something against moral common honesty in it; so the plain end and expectation of his oath, on which it was founded, being frustrated by the woman’s whoredom, (viz. the having of a loyal honest and comfortable yoke-fellow), albeit he had made twenty oaths to her, they bind him not; God has loosed the man, Res non permanet in eodem statu. Now, as to the present case of the covenanters, let it be considered whether the matter abides in that same state, i.e. whether there do not something now occur that puts us in that condition that without sin we cannot perform what we did promise in that second article of the Covenant. It will be said: ‘What is the sin?’ For answer, it must be still supposed (as before we admonished) that in this part of the discourse concerning these who plead the bond of the Covenant merely, that the matter of the second article of the Covenant (about which the debate is) is in itself indifferent; and that episcopacy in itself, or by any law of God, is not unlawful, or prohibited. If it were this way unlawful there needed little question be made about the bond of the Covenant (for, what is unlawful must never be allowed, be it sworn against or not), but, supposing the indifferency and lawfulness of episcopacy in itself, I say the covenant cannot now oblige against it, there being so notable an alteration of the case and state of matters that whoever now do think themselves bound to stand to the Covenant, as to that second article (for there are other matters in that Covenant from which we can never be disobliged or loosed, they being necessary by divine and moral Law) do think themselves bound to a perpetual disobedience to the magistrate, in a matter wherein he has power to command them; and this is a perpetual sin. Perkins, Of Oaths, says well, ‘No oath can bind against the wholesome laws of the commonwealth: because every soul is subject to superior powers, Rom. 13.’ Neither is it material whether the laws be made before or after the oath; both ways the matter of the oath becomes impossible, de jure, as casuists speak: And now we are to think, the matter remains not in the same state, when the doing of what we did swear, imports sin. I know Timorcus (p. 19) pleads that even upon supposition that it is in the power of the magistrate to set up the episcopal form of government, that yet we cannot own it but must suffer under it: because (says he) upon that supposition, that the matter of the oath [in this point], was res indifferens et libera in itself, yet it is no more free to us, Juramentum (says he) tell it libertatem: But, by his favor, albeit in indifferent things of private concernment wherein private persons bind themselves, and wherewith the magistrate meddles not, an oath may take away our liberty; yet, a subject’s oath cannot take away the power of the magistrate in commanding things which he sees for public good, and the matters not being in themselves unlawful: Neither can it take away or hinder the liberty, or rather duty of subjects in obeying what is lawfully commanded; otherwise, subjects, by their oaths might find a way to plead themselves free from obedience to magistrates in all things indifferent which they should command them; which is absurd. But 3., it would be remembered that when the keeping of an oath is certainly a hindrance of some greater good (especially if other circumstances concur, that render the oath non-obliging), the obligation of it, in some cases, may cease. This anent the loosing of oaths, because of the obstacle put to some greater good, which might be attained by not doing what is sworn, is indeed a very ticklish and tender question and all had need to look to it, lest under pretense that the keeping of an oath is an obstacle to a greater good attainable, by not keeping the oath there be a wide gap opened to all perjury; and the popish casuists are herein too lax for laying that ground that it is de jure naturali, that every one should do that which is best; they conclude, that where the performance of what is sworn is likely to hinder a greater good that might be attained by not keeping the oath, that in that case an oath binds not at all. Protestant casuists, as Bishop Sanderson, do deny this principle without limitation, thus expressed; yet do grant, that it is true when there concurs some other thing (as usually there does) which may render the oath void, or the keeping of it unlawful, or looses from it the impeditiveness of greater good, there has weight. But, we may say, albeit other things did not concur to the nulling or voiding of an oath, yet if the standing to it be found impeditive of a greater good, to which we are bound by a prior obligation, then the oath, being an obstacle of such a greater good, ceases to bind the swearer. If a man should swear never to go near such a river or water, having once been in hazard there, yet where he sees at some distance from it his brother likely to perish in the water, and it is probable to him that he could be able to save his life, the prior and greater bond of charity and of God’s Law commanding, that binds him to go help his brother and looses him from his oath. And as to our case, besides what has been said for the clearing, upon other grounds, of the non-obligation of the Covenant in that second article (the matter thereof still supposed as indifferent and episcopacy not forbidden by any divine Law), may we not clearly see that there is (by adhering to that oath as still binding) an obstacle put to the attainment of a greater good and of greater necessity, and to the seeking after that greater good [to] which we are pre-obliged by former bonds to labor after? Is not that great duty of preaching the Gospel of peace lying upon ministers (woe to us if we preach not) and lying upon many ministers antecedently to the making of this Covenant, and upon adhering to that Covenant in the second article, proves a hindrance to that greater duty whereto we are pre-obliged; shall it still be thought to bind so, that rather than we will acknowledge God’s loosing us by a former obligation to a greater duty, we will, by adhering to it, put ourselves in incapacity (according to law) to serve any longer in the ministry? Do there not also lie upon us all pre-obligations to obey the magistrate in things not against God’s Law (such as now episcopacy is supposed to be) to procure the public peace and good of Church and State, and prevent horrid confusions, which (as matters go) cannot be avoided by sticking at that article in the Covenant? Shall not the peace of conscience that shall arise from tendering these great interests be as much, and more than any peace of conscience pretended to be in keeping the oath, which (though we should not be ready to judge any) may perhaps, upon examination, be found rather a piece of satisfaction to the will, than peace of the conscience, God having loosed and set free conscience from that bond, in hoc rerum statu [in this state of things]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom</cite>, (Edinburgh: Tyler, 1662), pp. 22-26</span></figcaption>

3. It is certain, an unlawful oath did never, nor does bind any conscience to do according to it, though it binds to repentance for making of it and adhering to it. In considering and applying these things: as to the first, it would be remembered that an oath, howsoever in itself lawful, yet the case may be such that by something following after it, the oath may cease to bind us to the performing of what was sworn; yea, the case may be that an oath lawfully made yet cannot be lawfully kept; it were sin to keep it in some cases: then, and in that case, it is not we that loose ourselves, but God looses us, when an oath, lawful at the making, cannot be kept without sin against Him. Amongst other cases, wherein the ceasing of an obligation of a lawful oath may be seen, these three cases are worthy to be considered and seriously is it to be pondered whether they be applicable to the present question anent a discharge from the bond of the [Solemn League and] Covenant, as to the second Article of it, which is now under question: 1. If the matter of an oath be such as a superior has it in his power to determine of it, the oath of the inferior or subject person ceases to oblige him and is loosed when the superior consents not to what he has sworn: This is both agreeable to reason, because no deed of a person inferior or subject to others should prejudge the right of the superior nor take from him any power allowed to him by God in any thing: And also, all sound divines do acknowledge this upon the common equity of that law, Num. 30:4. If it be said that the matter of the second article of the Covenant, being not of indifferent nature, but determined by the Word of God, and so not under the power of a superior on earth to determine in it, it would be remembered that in all this part of the discourse, where the ceasing of the obligation of the Covenant is spoken of (as to the second article), they are dealt with who plead the obligation of the Covenant only [in distinction from God’s moral law], and upon that account do scruple. … If it be said again, that the consent of our superior has been obtained to that to which we have determined ourselves by our oath in the second article, and therefore our oath, before God, is confirmed, and he has not power to revoke his consent, according to that law, Num. 30:14: It would be considered whether it was the Lord’s mind in that law, that if children or wives, having vowed, should by some means drive their parents or husbands out of the house, deprive them of all their worldly comforts, and then, when they had put them thus undutifully under sad tentations, bargain with them either to ratify their vows, or never to enjoy these comforts they had deprived them of, whether it was the Lord’s mind that consent, so obtained, should be an irrevocable confirmation of their vows who had carried themselves so undutifully? There is no evidence for that. And the application is easy, since it is known that the Covenant was contrived and carried on as if the design had been laid to extirpate episcopacy whether the king would consent or not, or whatever course should be taken to force his consent, vi et armis [by force and arms], or by suspending him from the exercise of his royal power: an unparalleled way of usage from subjects to their sovereign. Again it would be considered whether this be, De jure naturali [of the natural law], that a consent of a superior once given to the vow of an inferior, he has no power to revoke his consent upon reasonable causes, and to make void the vow, albeit, if he do it rashly and unreasonably, he sins. Great scholars are of the mind, he may revoke his consent: Lessius, Tract on a Vow, doubt 13. It is thought by him and others, that the precept eatenus [so far] is judicial, as it makes an irrevocable confirmation of the vow once consented to. If it be further said, if the superior, under oath, give his consent to the inferior’s oath, or if he himself swear the same thing, then there is no power left of revoking his consent, or doing or putting his inferiors to do contrary to the oath: This is granted, unless upon some other ground there be a clear loosing of the superior’s oath and a ceasing of the obligation of it. Leaving these things to be applied, let us look upon the second case, wherein the obligation and binding-power of an oath ceases and the oath is loosed. It is this, when the matter concerning which the oath is continues not in the same state it was in at the making of the oath, when something in providence before the accomplishment of the oath occurs that makes the performance of the oath either sinful or importing some turpitude and something against moral honesty, or when the case comes to be that, that the plain end and expectation of the oath upon which it was founded appears frustrated: according to the language of divines, Res non permanet in eodem statu, ideo cessat juramenti obligatio. For example: If a man swear that at such a certain time he shall deliver to such a man his sword, if in the meantime that man turn mad, and, in probability, might kill himself or others with the sword, had he it in his hand, there lies no obligation upon the swearer to deliver it to him; Nay, it were a sin and against charity to perform what he had promised. Again, if a man swear to marry such a woman at such a time, if before that time he is made certain she is with child to his own brother, it were a grievous sin of incest to marry her (under pretense of keeping his promise). Or, if she should, before the marriage day, be found with child to another man (not so related to him) yet, to marry her, as it could not but have something against moral common honesty in it; so the plain end and expectation of his oath, on which it was founded, being frustrated by the woman’s whoredom, (viz. the having of a loyal honest and comfortable yoke-fellow), albeit he had made twenty oaths to her, they bind him not; God has loosed the man, Res non permanet in eodem statu. Now, as to the present case of the covenanters, let it be considered whether the matter abides in that same state, i.e. whether there do not something now occur that puts us in that condition that without sin we cannot perform what we did promise in that second article of the Covenant. It will be said: ‘What is the sin?’ For answer, it must be still supposed (as before we admonished) that in this part of the discourse concerning these who plead the bond of the Covenant merely, that the matter of the second article of the Covenant (about which the debate is) is in itself indifferent; and that episcopacy in itself, or by any law of God, is not unlawful, or prohibited. If it were this way unlawful there needed little question be made about the bond of the Covenant (for, what is unlawful must never be allowed, be it sworn against or not), but, supposing the indifferency and lawfulness of episcopacy in itself, I say the covenant cannot now oblige against it, there being so notable an alteration of the case and state of matters that whoever now do think themselves bound to stand to the Covenant, as to that second article (for there are other matters in that Covenant from which we can never be disobliged or loosed, they being necessary by divine and moral Law) do think themselves bound to a perpetual disobedience to the magistrate, in a matter wherein he has power to command them; and this is a perpetual sin. Perkins, Of Oaths, says well, ‘No oath can bind against the wholesome laws of the commonwealth: because every soul is subject to superior powers, Rom. 13.’ Neither is it material whether the laws be made before or after the oath; both ways the matter of the oath becomes impossible, de jure, as casuists speak: And now we are to think, the matter remains not in the same state, when the doing of what we did swear, imports sin. I know Timorcus (p. 19) pleads that even upon supposition that it is in the power of the magistrate to set up the episcopal form of government, that yet we cannot own it but must suffer under it: because (says he) upon that supposition, that the matter of the oath [in this point], was res indifferens et libera in itself, yet it is no more free to us, Juramentum (says he) tell it libertatem: But, by his favor, albeit in indifferent things of private concernment wherein private persons bind themselves, and wherewith the magistrate meddles not, an oath may take away our liberty; yet, a subject’s oath cannot take away the power of the magistrate in commanding things which he sees for public good, and the matters not being in themselves unlawful: Neither can it take away or hinder the liberty, or rather duty of subjects in obeying what is lawfully commanded; otherwise, subjects, by their oaths might find a way to plead themselves free from obedience to magistrates in all things indifferent which they should command them; which is absurd. But 3., it would be remembered that when the keeping of an oath is certainly a hindrance of some greater good (especially if other circumstances concur, that render the oath non-obliging), the obligation of it, in some cases, may cease. This anent the loosing of oaths, because of the obstacle put to some greater good, which might be attained by not doing what is sworn, is indeed a very ticklish and tender question and all had need to look to it, lest under pretense that the keeping of an oath is an obstacle to a greater good attainable, by not keeping the oath there be a wide gap opened to all perjury; and the popish casuists are herein too lax for laying that ground that it is de jure naturali, that every one should do that which is best; they conclude, that where the performance of what is sworn is likely to hinder a greater good that might be attained by not keeping the oath, that in that case an oath binds not at all. Protestant casuists, as Bishop Sanderson, do deny this principle without limitation, thus expressed; yet do grant, that it is true when there concurs some other thing (as usually there does) which may render the oath void, or the keeping of it unlawful, or looses from it the impeditiveness of greater good, there has weight. But, we may say, albeit other things did not concur to the nulling or voiding of an oath, yet if the standing to it be found impeditive of a greater good, to which we are bound by a prior obligation, then the oath, being an obstacle of such a greater good, ceases to bind the swearer. If a man should swear never to go near such a river or water, having once been in hazard there, yet where he sees at some distance from it his brother likely to perish in the water, and it is probable to him that he could be able to save his life, the prior and greater bond of charity and of God’s Law commanding, that binds him to go help his brother and looses him from his oath. And as to our case, besides what has been said for the clearing, upon other grounds, of the non-obligation of the Covenant in that second article (the matter thereof still supposed as indifferent and episcopacy not forbidden by any divine Law), may we not clearly see that there is (by adhering to that oath as still binding) an obstacle put to the attainment of a greater good and of greater necessity, and to the seeking after that greater good [to] which we are pre-obliged by former bonds to labor after? Is not that great duty of preaching the Gospel of peace lying upon ministers (woe to us if we preach not) and lying upon many ministers antecedently to the making of this Covenant, and upon adhering to that Covenant in the second article, proves a hindrance to that greater duty whereto we are pre-obliged; shall it still be thought to bind so, that rather than we will acknowledge God’s loosing us by a former obligation to a greater duty, we will, by adhering to it, put ourselves in incapacity (according to law) to serve any longer in the ministry? Do there not also lie upon us all pre-obligations to obey the magistrate in things not against God’s Law (such as now episcopacy is supposed to be) to procure the public peace and good of Church and State, and prevent horrid confusions, which (as matters go) cannot be avoided by sticking at that article in the Covenant? Shall not the peace of conscience that shall arise from tendering these great interests be as much, and more than any peace of conscience pretended to be in keeping the oath, which (though we should not be ready to judge any) may perhaps, upon examination, be found rather a piece of satisfaction to the will, than peace of the conscience, God having loosed and set free conscience from that bond, in hoc rerum statu [in this state of things]?”

— Andrew Honyman, The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom, (Edinburgh: Tyler, 1662), pp. 22-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIndeed%2C+the+bond+of+a+lawful+covenant+is+so+sacred+a+tie%2C+that%2C+without+contempt+of+the+holy+majesty+of+God%2C+it+cannot+be+violated%2C+nor+without+great+sin%3B+no+creature+can+absolve+us+from+it%2C+nor+dispense+with+it%3B+nor+are+we+to+break+it+for+any+temporal+advantage%2C+terror+or+trouble.+Yet%2C+%28supposing+the+covenant+to+be+lawful%E2%80%A6%29+it+is+sure%3A+1.+That+a+lawful+oath+may+cease+to+bind+us%2C+so+that+though+we+do+not+that+which+was+under+oath+promised+to+be+done%3B+yet%2C+there+is+no+perjury%3A+Semper+perjurus+est%2C+qui+non+intendit+quod+promittit%3B+non+semper+perjurus+est%2C+qui+non+perficit+quod+promisit+sub+Juramento%2C+say+the+casuists.+2.+It+is+certain+that+a+lawful%2C+although+in+the+interpretation+of+it%2C+it+be+stricti+juris%2C+and+is+to+be+understood+according+to+the+intention+of+the+givers+of+it%2C+and+as+the+plain+words+bear%3B+yet%2C+it+binds+not+in+the+sense+which+any+ignorant+mind+or+overscrupulous+conscience+may+put+upon+it%2C+or+that+some+persons%2C+upon+partial+designs%2C+may+put+upon+it%2C+Videndum+est+%28say+Casuists%29+ne+stricta+interpretatio+abeat+in+nimis+strictam+et+rigidam.+3.+It+is+certain%2C+an+unlawful+oath+did+never%2C+nor+does+bind+any+conscience+to+do+according+to+it%2C+though+it+binds+to+repentance+for+making+of+it+and+adhering+to+it.+In+considering+and+applying+these+things%3A+as+to+the+first%2C+it+would+be+remembered+that+an+oath%2C+howsoever+in+itself+lawful%2C+yet+the+case+may+be+such+that+by+something+following+after+it%2C+the+oath+may+cease+to+bind+us+to+the+performing+of+what+was+sworn%3B+yea%2C+the+case+may+be+that+an+oath+lawfully+made+yet+cannot+be+lawfully+kept%3B+it+were+sin+to+keep+it+in+some+cases%3A+then%2C+and+in+that+case%2C+it+is+not+we+that+loose+ourselves%2C+but+God+looses+us%2C+when+an+oath%2C+lawful+at+the+making%2C+cannot+be+kept+without+sin+against+Him.+Amongst+other+cases%2C+wherein+the+ceasing+of+an+obligation+of+a+lawful+oath+may+be+seen%2C+these+three+cases+are+worthy+to+be+considered+and+seriously+is+it+to+be+pondered+whether+they+be+applicable+to+the+present+question+anent+a+discharge+from+the+bond+of+the+%5BSolemn+League+and%5D+Covenant%2C+as+to+the+second+Article+of+it%2C+which+is+now+under+question%3A+1.+If+the+matter+of+an+oath+be+such+as+a+superior+has+it+in+his+power+to+determine+of+it%2C+the+oath+of+the+inferior+or+subject+person+ceases+to+oblige+him+and+is+loosed+when+the+superior+consents+not+to+what+he+has+sworn%3A+This+is+both+agreeable+to+reason%2C+because+no+deed+of+a+person+inferior+or+subject+to+others+should+prejudge+the+right+of+the+superior+nor+take+from+him+any+power+allowed+to+him+by+God+in+any+thing%3A+And+also%2C+all+sound+divines+do+acknowledge+this+upon+the+common+equity+of+that+law%2C+Num.+30%3A4.+If+it+be+said+that+the+matter+of+the+second+article+of+the+Covenant%2C+being+not+of+indifferent+nature%2C+but+determined+by+the+Word+of+God%2C+and+so+not+under+the+power+of+a+superior+on+earth+to+determine+in+it%2C+it+would+be+remembered+that+in+all+this+part+of+the+discourse%2C+where+the+ceasing+of+the+obligation+of+the+Covenant+is+spoken+of+%28as+to+the+second+article%29%2C+they+are+dealt+with+who+plead+the+obligation+of+the+Covenant+only+%5Bin+distinction+from+God%E2%80%99s+moral+law%5D%2C+and+upon+that+account+do+scruple.+%E2%80%A6+If+it+be+said+again%2C+that+the+consent+of+our+superior+has+been+obtained+to+that+to+which+we+have+determined+ourselves+by+our+oath+in+the+second+article%2C+and+therefore+our+oath%2C+before+God%2C+is+confirmed%2C+and+he+has+not+power+to+revoke+his+consent%2C+according+to+that+law%2C+Num.+30%3A14%3A+It+would+be+considered+whether+it+was+the+Lord%E2%80%99s+mind+in+that+law%2C+that+if+children+or+wives%2C+having+vowed%2C+should+by+some+means+drive+their+parents+or+husbands+out+of+the+house%2C+deprive+them+of+all+their+worldly+comforts%2C+and+then%2C+when+they+had+put+them+thus+undutifully+under+sad+tentations%2C+bargain+with+them+either+to+ratify+their+vows%2C+or+never+to+enjoy+these+comforts+they+had+deprived+them+of%2C+whether+it+was+the+Lord%E2%80%99s+mind+that+consent%2C+so+obtained%2C+should+be+an+irrevocable+confirmation+of+their+vows+who+had+carried+themselves+so+undutifully%3F+There+is+no+evidence+for+that.+And+the+application+is+easy%2C+since+it+is+known+that+the+Covenant+was+contrived+and+carried+on+as+if+the+design+had+been+laid+to+extirpate+episcopacy+whether+the+king+would+consent+or+not%2C+or+whatever+course+should+be+taken+to+force+his+consent%2C+vi+et+armis+%5Bby+force+and+arms%5D%2C+or+by+suspending+him+from+the+exercise+of+his+royal+power%3A+an+unparalleled+way+of+usage+from+subjects+to+their+sovereign.+Again+it+would+be+considered+whether+this+be%2C+De+jure+naturali+%5Bof+the+natural+law%5D%2C+that+a+consent+of+a+superior+once+given+to+the+vow+of+an+inferior%2C+he+has+no+power+to+revoke+his+consent+upon+reasonable+causes%2C+and+to+make+void+the+vow%2C+albeit%2C+if+he+do+it+rashly+and+unreasonably%2C+he+sins.+Great+scholars+are+of+the+mind%2C+he+may+revoke+his+consent%3A+Lessius%2C+Tract+on+a+Vow%2C+doubt+13.+It+is+thought+by+him+and+others%2C+that+the+precept+eatenus+%5Bso+far%5D+is+judicial%2C+as+it+makes+an+irrevocable+confirmation+of+the+vow+once+consented+to.+If+it+be+further+said%2C+if+the+superior%2C+under+oath%2C+give+his+consent+to+the+inferior%E2%80%99s+oath%2C+or+if+he+himself+swear+the+same+thing%2C+then+there+is+no+power+left+of+revoking+his+consent%2C+or+doing+or+putting+his+inferiors+to+do+contrary+to+the+oath%3A+This+is+granted%2C+unless+upon+some+other+ground+there+be+a+clear+loosing+of+the+superior%E2%80%99s+oath+and+a+ceasing+of+the+obligation+of+it.+Leaving+these+things+to+be+applied%2C+let+us+look+upon+the+second+case%2C+wherein+the+obligation+and+binding-power+of+an+oath+ceases+and+the+oath+is+loosed.+It+is+this%2C+when+the+matter+concerning+which+the+oath+is+continues+not+in+the+same+state+it+was+in+at+the+making+of+the+oath%2C+when+something+in+providence+before+the+accomplishment+of+the+oath+occurs+that+makes+the+performance+of+the+oath+either+sinful+or+importing+some+turpitude+and+something+against+moral+honesty%2C+or+when+the+case+comes+to+be+that%2C+that+the+plain+end+and+expectation+of+the+oath+upon+which+it+was+founded+appears+frustrated%3A+according+to+the+language+of+divines%2C+Res+non+permanet+in+eodem+statu%2C+ideo+cessat+juramenti+obligatio.+For+example%3A+If+a+man+swear+that+at+such+a+certain+time+he+shall+deliver+to+such+a+man+his+sword%2C+if+in+the+meantime+that+man+turn+mad%2C+and%2C+in+probability%2C+might+kill+himself+or+others+with+the+sword%2C+had+he+it+in+his+hand%2C+there+lies+no+obligation+upon+the+swearer+to+deliver+it+to+him%3B+Nay%2C+it+were+a+sin+and+against+charity+to+perform+what+he+had+promised.+Again%2C+if+a+man+swear+to+marry+such+a+woman+at+such+a+time%2C+if+before+that+time+he+is+made+certain+she+is+with+child+to+his+own+brother%2C+it+were+a+grievous+sin+of+incest+to+marry+her+%28under+pretense+of+keeping+his+promise%29.+Or%2C+if+she+should%2C+before+the+marriage+day%2C+be+found+with+child+to+another+man+%28not+so+related+to+him%29+yet%2C+to+marry+her%2C+as+it+could+not+but+have+something+against+moral+common+honesty+in+it%3B+so+the+plain+end+and+expectation+of+his+oath%2C+on+which+it+was+founded%2C+being+frustrated+by+the+woman%E2%80%99s+whoredom%2C+%28viz.+the+having+of+a+loyal+honest+and+comfortable+yoke-fellow%29%2C+albeit+he+had+made+twenty+oaths+to+her%2C+they+bind+him+not%3B+God+has+loosed+the+man%2C+Res+non+permanet+in+eodem+statu.+Now%2C+as+to+the+present+case+of+the+covenanters%2C+let+it+be+considered+whether+the+matter+abides+in+that+same+state%2C+i.e.+whether+there+do+not+something+now+occur+that+puts+us+in+that+condition+that+without+sin+we+cannot+perform+what+we+did+promise+in+that+second+article+of+the+Covenant.+It+will+be+said%3A+%E2%80%98What+is+the+sin%3F%E2%80%99+For+answer%2C+it+must+be+still+supposed+%28as+before+we+admonished%29+that+in+this+part+of+the+discourse+concerning+these+who+plead+the+bond+of+the+Covenant+merely%2C+that+the+matter+of+the+second+article+of+the+Covenant+%28about+which+the+debate+is%29+is+in+itself+indifferent%3B+and+that+episcopacy+in+itself%2C+or+by+any+law+of+God%2C+is+not+unlawful%2C+or+prohibited.+If+it+were+this+way+unlawful+there+needed+little+question+be+made+about+the+bond+of+the+Covenant+%28for%2C+what+is+unlawful+must+never+be+allowed%2C+be+it+sworn+against+or+not%29%2C+but%2C+supposing+the+indifferency+and+lawfulness+of+episcopacy+in+itself%2C+I+say+the+covenant+cannot+now+oblige+against+it%2C+there+being+so+notable+an+alteration+of+the+case+and+state+of+matters+that+whoever+now+do+think+themselves+bound+to+stand+to+the+Covenant%2C+as+to+that+second+article+%28for+there+are+other+matters+in+that+Covenant+from+which+we+can+never+be+disobliged+or+loosed%2C+they+being+necessary+by+divine+and+moral+Law%29+do+think+themselves+bound+to+a+perpetual+disobedience+to+the+magistrate%2C+in+a+matter+wherein+he+has+power+to+command+them%3B+and+this+is+a+perpetual+sin.+Perkins%2C+Of+Oaths%2C+says+well%2C+%E2%80%98No+oath+can+bind+against+the+wholesome+laws+of+the+commonwealth%3A+because+every+soul+is+subject+to+superior+powers%2C+Rom.+13.%E2%80%99+Neither+is+it+material+whether+the+laws+be+made+before+or+after+the+oath%3B+both+ways+the+matter+of+the+oath+becomes+impossible%2C+de+jure%2C+as+casuists+speak%3A+And+now+we+are+to+think%2C+the+matter+remains+not+in+the+same+state%2C+when+the+doing+of+what+we+did+swear%2C+imports+sin.+I+know+Timorcus+%28p.+19%29+pleads+that+even+upon+supposition+that+it+is+in+the+power+of+the+magistrate+to+set+up+the+episcopal+form+of+government%2C+that+yet+we+cannot+own+it+but+must+suffer+under+it%3A+because+%28says+he%29+upon+that+supposition%2C+that+the+matter+of+the+oath+%5Bin+this+point%5D%2C+was+res+indifferens+et+libera+in+itself%2C+yet+it+is+no+more+free+to+us%2C+Juramentum+%28says+he%29+tell+it+libertatem%3A+But%2C+by+his+favor%2C+albeit+in+indifferent+things+of+private+concernment+wherein+private+persons+bind+themselves%2C+and+wherewith+the+magistrate+meddles+not%2C+an+oath+may+take+away+our+liberty%3B+yet%2C+a+subject%E2%80%99s+oath+cannot+take+away+the+power+of+the+magistrate+in+commanding+things+which+he+sees+for+public+good%2C+and+the+matters+not+being+in+themselves+unlawful%3A+Neither+can+it+take+away+or+hinder+the+liberty%2C+or+rather+duty+of+subjects+in+obeying+what+is+lawfully+commanded%3B+otherwise%2C+subjects%2C+by+their+oaths+might+find+a+way+to+plead+themselves+free+from+obedience+to+magistrates+in+all+things+indifferent+which+they+should+command+them%3B+which+is+absurd.+But+3.%2C+it+would+be+remembered+that+when+the+keeping+of+an+oath+is+certainly+a+hindrance+of+some+greater+good+%28especially+if+other+circumstances+concur%2C+that+render+the+oath+non-obliging%29%2C+the+obligation+of+it%2C+in+some+cases%2C+may+cease.+This+anent+the+loosing+of+oaths%2C+because+of+the+obstacle+put+to+some+greater+good%2C+which+might+be+attained+by+not+doing+what+is+sworn%2C+is+indeed+a+very+ticklish+and+tender+question+and+all+had+need+to+look+to+it%2C+lest+under+pretense+that+the+keeping+of+an+oath+is+an+obstacle+to+a+greater+good+attainable%2C+by+not+keeping+the+oath+there+be+a+wide+gap+opened+to+all+perjury%3B+and+the+popish+casuists+are+herein+too+lax+for+laying+that+ground+that+it+is+de+jure+naturali%2C+that+every+one+should+do+that+which+is+best%3B+they+conclude%2C+that+where+the+performance+of+what+is+sworn+is+likely+to+hinder+a+greater+good+that+might+be+attained+by+not+keeping+the+oath%2C+that+in+that+case+an+oath+binds+not+at+all.+Protestant+casuists%2C+as+Bishop+Sanderson%2C+do+deny+this+principle+without+limitation%2C+thus+expressed%3B+yet+do+grant%2C+that+it+is+true+when+there+concurs+some+other+thing+%28as+usually+there+does%29+which+may+render+the+oath+void%2C+or+the+keeping+of+it+unlawful%2C+or+looses+from+it+the+impeditiveness+of+greater+good%2C+there+has+weight.+But%2C+we+may+say%2C+albeit+other+things+did+not+concur+to+the+nulling+or+voiding+of+an+oath%2C+yet+if+the+standing+to+it+be+found+impeditive+of+a+greater+good%2C+to+which+we+are+bound+by+a+prior+obligation%2C+then+the+oath%2C+being+an+obstacle+of+such+a+greater+good%2C+ceases+to+bind+the+swearer.+If+a+man+should+swear+never+to+go+near+such+a+river+or+water%2C+having+once+been+in+hazard+there%2C+yet+where+he+sees+at+some+distance+from+it+his+brother+likely+to+perish+in+the+water%2C+and+it+is+probable+to+him+that+he+could+be+able+to+save+his+life%2C+the+prior+and+greater+bond+of+charity+and+of+God%E2%80%99s+Law+commanding%2C+that+binds+him+to+go+help+his+brother+and+looses+him+from+his+oath.+And+as+to+our+case%2C+besides+what+has+been+said+for+the+clearing%2C+upon+other+grounds%2C+of+the+non-obligation+of+the+Covenant+in+that+second+article+%28the+matter+thereof+still+supposed+as+indifferent+and+episcopacy+not+forbidden+by+any+divine+Law%29%2C+may+we+not+clearly+see+that+there+is+%28by+adhering+to+that+oath+as+still+binding%29+an+obstacle+put+to+the+attainment+of+a+greater+good+and+of+greater+necessity%2C+and+to+the+seeking+after+that+greater+good+%5Bto%5D+which+we+are+pre-obliged+by+former+bonds+to+labor+after%3F+Is+not+that+great+duty+of+preaching+the+Gospel+of+peace+lying+upon+ministers+%28woe+to+us+if+we+preach+not%29+and+lying+upon+many+ministers+antecedently+to+the+making+of+this+Covenant%2C+and+upon+adhering+to+that+Covenant+in+the+second+article%2C+proves+a+hindrance+to+that+greater+duty+whereto+we+are+pre-obliged%3B+shall+it+still+be+thought+to+bind+so%2C+that+rather+than+we+will+acknowledge+God%E2%80%99s+loosing+us+by+a+former+obligation+to+a+greater+duty%2C+we+will%2C+by+adhering+to+it%2C+put+ourselves+in+incapacity+%28according+to+law%29+to+serve+any+longer+in+the+ministry%3F+Do+there+not+also+lie+upon+us+all+pre-obligations+to+obey+the+magistrate+in+things+not+against+God%E2%80%99s+Law+%28such+as+now+episcopacy+is+supposed+to+be%29+to+procure+the+public+peace+and+good+of+Church+and+State%2C+and+prevent+horrid+confusions%2C+which+%28as+matters+go%29+cannot+be+avoided+by+sticking+at+that+article+in+the+Covenant%3F+Shall+not+the+peace+of+conscience+that+shall+arise+from+tendering+these+great+interests+be+as+much%2C+and+more+than+any+peace+of+conscience+pretended+to+be+in+keeping+the+oath%2C+which+%28though+we+should+not+be+ready+to+judge+any%29+may+perhaps%2C+upon+examination%2C+be+found+rather+a+piece+of+satisfaction+to+the+will%2C+than+peace+of+the+conscience%2C+God+having+loosed+and+set+free+conscience+from+that+bond%2C+in+hoc+rerum+statu+%5Bin+this+state+of+things%5D%3F%E2%80%9D%0A%0A%E2%80%94+Andrew+Honyman%2C+The+Seasonable+Case+of+Submission+to+the+Church-Government+as+now+Re-established+by+Law%2C+briefly+stated+and+determined+by+a+Lover+of+the+Peace+of+this+Church+%26+Kingdom%2C+%28Edinburgh%3A+Tyler%2C+1662%29%2C+pp.+22-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ddd8a979e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ddd8a979e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=Indeed%2C%20the%20bond%20of%20a%20lawful,statu%20%5Bin%20this%20state%20of%20things&amp;text=Indeed%2C%20the%20bond%20of%20a%20lawful%20covenant%20is&amp;text=hoc%20rerum%20statu%20%5Bin%20this%20state%20of%20things" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As, therefore, our communion is termed the Lord’s Supper, because it was instituted of the Lord, for the remembrance of his death; so the Christian Sabbath is called the Lord’s day (Rev. i. 10), because it was ordained of the Lord, for the memorial of his resurrection.

And as the name of the Lord (1 Cor. xi. 10) honours the one, so does it the other; and as the Lord of the Sabbath, by his royal prerogative, and transcendent authority, could, so he had also reason to change the holy Sabbath from the seventh day to this, on which we keep it; for as concerning the seventh day, which followed the six days in which God finished the creation, there was no such precise institution, or necessity of sanctifying it perpetually, but such as by the same authority, or upon greater reason and occasion, it might very well be changed and altered to some other seventh day; for the commandment does not say, Remember to keep holy the seventh day next following the sixth day of the creation, or this or that seventh day; but indefinitely, Remember that thou keep holy a seventh day.

And to speak properly, as we take a day for the distinction of time, called either a day natural, consisting of twenty-four hours, or a day artificial, consisting of twelve hours, from sun rising to sun setting; and withal consider the sun standing still at noon, in Joshua’s time (Josh. x. 12, 43) the space of a whole day; and the sun going back ten degrees (2 Kings xx. 11), viz. five hours, almost half an artificial day, in Ezechiah’s time; the Jews themselves could not keep their Sabbath upon that precise and just distinction of time, called at the first the seventh day from the creation.

Add to this, that in respect of the diversity of meridians, and the unequal rising and setting of the sun, every day varies in some places a quarter, in some half, in others a whole day. Therefore the Jewish seventh day cannot precisely be kept at the same instant of time every where in the world.

Now our Lord Jesus having authority as Lord over the Sabbath (Matt. xii. 8), had likewise now far greater reason and occasion to translate the Sabbath from the Jewish seventh day to the first day on which Christians keep the Sabbath.

1. Because that by his resurrection from the dead, there is wrought a new spiritual creation of the world, without which all the sons of Adam had been turned to everlasting destruction, and all the works of the first creation had ministered no consolation to us (Isa. lxv. 17, &amp;c.; lxvi. 22; Psal. xc. 2.)

2. And in respect of this new spiritual creation, the Scripture saith, “That old things are passed away, and all things are become new,” (2 Cor. v. 17)—new creatures (Gal. vi. 15), new people (1 Pet. ii. 10), new men (Eph. iv. 24), new knowledge (Col. iii. 10), new testament (Matt. xxvi. 28), new commandment (John xii. 13), new names (Rev. ii. 17), new way (Heb. x. 10), new song (Rev. iii. 9), new garment (Luke v. 36, 37), new wine, new vessels (Rev. xxi. 2), new Jerusalem (2 Pet. iii. 13), new heaven, and a new earth (Isa. lxvi. 22) And therefore of necessity there must be, instead of the old, a new Sabbath-day (Heb. iv. 9), to honour and praise our Redeemer, and to meditate upon the work of our redemption, and to shew the new change of the Old Testament.

3. Because that on this day Christ rested from all the sufferings of his passion, and finished the glorious work of our redemption. If, therefore, the finishing of the work of the first creation, by which God mightily manifested himself to his creatures, deserved a sabbath to solemnize the memorial of so great a work, to the honour of the worker, and therefore calls it “mine holy day,” (Isa. lviii. 13;) much more does the new creation of the world, effected by the resurrection of Christ, whereby he mightily declared himself to be the Son of God (Rom. i. 4), deserve a sabbath, for the perpetual commemoration of it, to the honour of Christ, and therefore worthily called the Lord’s day (Rev. i. 10.)

For, as the deliverance out of the captivity of Babylon, being greater, took away the name from the deliverance out of the bondage of Egypt (Jer. xxiii. 7, 8;) so the day on which Christ finished the redemption of the world did more justly deserve to have the Sabbath kept on it, than on that day on which God ceased from creating the world. As, therefore, in the creation, the first day wherein it was finished, was consecrated for a sabbath; so in the time of redemption, the first day wherein it was perfected must be dedicated to a holy rest; but still a seventh day kept according to God’s moral commandment.

The Jews kept the last day of the week, beginning their Sabbath with the night (Gen. ii. 2; Lev. xxiii. 32; Neh. xiii. 19), when God rested; but Christians honour the Lord better, on the first day of the week (Matt. xxviii. 1), beginning the Sabbath with the day when the Lord arose (Acts xx. 7, 11.) They kept their Sabbath in remembrance, of the world’s creation; but Christians celebrate it in memorial of the world’s redemption; yea, the Lord’s day being the first of the creation and redemption, puts us in mind, both of the making of the old, and redeeming of the new world.

As, therefore, under the Old Testament, God, by the glory consisting of seven lamps, seven branches, &amp;c. (Exod. xxv. 31), put them in remembrance of the creation, light, and Sabbath’s rest; so, under the New Testament, Christ, the true light of the world, appears in the midst of the seven lamps, and seven golden candlesticks (Rev. i. 13), to put us in mind to honour our Redeemer in the light of the gospel of the Lord’s seventh day of rest. And seeing the redemption, both for might and mercy, so far exceeds the creation, it stood with great reason that the greater work should carry the honour of the day. Neither does the honourable title of the Lord’s day diminish the glory of the Sabbath; but rather, being added, augments the dignity of it; as the name Israel, added to Jacob, made the patriarch the more renowned (Gen. xxxii. 28.)

The reason taken from the example of God’s resting from the work of the creation of the world continued in force till the Son of God ceased from the work of the redemption of the world, and then the former gave place to the latter.</p></blockquote>

— Lewis Bayly, The Practice of Piety: Directing a Christian to walk, that he may please God, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 161-64.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs%2C+therefore%2C+our+communion+is+termed+the+Lord%E2%80%99s+Supper%2C+because+it+was+instituted+of+the+Lord%2C+for+the+remembrance+of+his+death%3B+so+the+Christian+Sabbath+is+called+the+Lord%E2%80%99s+day+%28Rev.+i.+10%29%2C+because+it+was+ordained+of+the+Lord%2C+for+the+memorial+of+his+resurrection.%0A%0AAnd+as+the+name+of+the+Lord+%281+Cor.+xi.+10%29+honours+the+one%2C+so+does+it+the+other%3B+and+as+the+Lord+of+the+Sabbath%2C+by+his+royal+prerogative%2C+and+transcendent+authority%2C+could%2C+so+he+had+also+reason+to+change+the+holy+Sabbath+from+the+seventh+day+to+this%2C+on+which+we+keep+it%3B+for+as+concerning+the+seventh+day%2C+which+followed+the+six+days+in+which+God+finished+the+creation%2C+there+was+no+such+precise+institution%2C+or+necessity+of+sanctifying+it+perpetually%2C+but+such+as+by+the+same+authority%2C+or+upon+greater+reason+and+occasion%2C+it+might+very+well+be+changed+and+altered+to+some+other+seventh+day%3B+for+the+commandment+does+not+say%2C+Remember+to+keep+holy+the+seventh+day+next+following+the+sixth+day+of+the+creation%2C+or+this+or+that+seventh+day%3B+but+indefinitely%2C+Remember+that+thou+keep+holy+a+seventh+day.%0A%0AAnd+to+speak+properly%2C+as+we+take+a+day+for+the+distinction+of+time%2C+called+either+a+day+natural%2C+consisting+of+twenty-four+hours%2C+or+a+day+artificial%2C+consisting+of+twelve+hours%2C+from+sun+rising+to+sun+setting%3B+and+withal+consider+the+sun+standing+still+at+noon%2C+in+Joshua%E2%80%99s+time+%28Josh.+x.+12%2C+43%29+the+space+of+a+whole+day%3B+and+the+sun+going+back+ten+degrees+%282+Kings+xx.+11%29%2C+viz.+five+hours%2C+almost+half+an+artificial+day%2C+in+Ezechiah%E2%80%99s+time%3B+the+Jews+themselves+could+not+keep+their+Sabbath+upon+that+precise+and+just+distinction+of+time%2C+called+at+the+first+the+seventh+day+from+the+creation.%0A%0AAdd+to+this%2C+that+in+respect+of+the+diversity+of+meridians%2C+and+the+unequal+rising+and+setting+of+the+sun%2C+every+day+varies+in+some+places+a+quarter%2C+in+some+half%2C+in+others+a+whole+day.+Therefore+the+Jewish+seventh+day+cannot+precisely+be+kept+at+the+same+instant+of+time+every+where+in+the+world.%0A%0ANow+our+Lord+Jesus+having+authority+as+Lord+over+the+Sabbath+%28Matt.+xii.+8%29%2C+had+likewise+now+far+greater+reason+and+occasion+to+translate+the+Sabbath+from+the+Jewish+seventh+day+to+the+first+day+on+which+Christians+keep+the+Sabbath.%0A%0A1.+Because+that+by+his+resurrection+from+the+dead%2C+there+is+wrought+a+new+spiritual+creation+of+the+world%2C+without+which+all+the+sons+of+Adam+had+been+turned+to+everlasting+destruction%2C+and+all+the+works+of+the+first+creation+had+ministered+no+consolation+to+us+%28Isa.+lxv.+17%2C+%26c.%3B+lxvi.+22%3B+Psal.+xc.+2.%29%0A%0A2.+And+in+respect+of+this+new+spiritual+creation%2C+the+Scripture+saith%2C+%E2%80%9CThat+old+things+are+passed+away%2C+and+all+things+are+become+new%2C%E2%80%9D+%282+Cor.+v.+17%29%E2%80%94new+creatures+%28Gal.+vi.+15%29%2C+new+people+%281+Pet.+ii.+10%29%2C+new+men+%28Eph.+iv.+24%29%2C+new+knowledge+%28Col.+iii.+10%29%2C+new+testament+%28Matt.+xxvi.+28%29%2C+new+commandment+%28John+xii.+13%29%2C+new+names+%28Rev.+ii.+17%29%2C+new+way+%28Heb.+x.+10%29%2C+new+song+%28Rev.+iii.+9%29%2C+new+garment+%28Luke+v.+36%2C+37%29%2C+new+wine%2C+new+vessels+%28Rev.+xxi.+2%29%2C+new+Jerusalem+%282+Pet.+iii.+13%29%2C+new+heaven%2C+and+a+new+earth+%28Isa.+lxvi.+22%29+And+therefore+of+necessity+there+must+be%2C+instead+of+the+old%2C+a+new+Sabbath-day+%28Heb.+iv.+9%29%2C+to+honour+and+praise+our+Redeemer%2C+and+to+meditate+upon+the+work+of+our+redemption%2C+and+to+shew+the+new+change+of+the+Old+Testament.%0A%0A3.+Because+that+on+this+day+Christ+rested+from+all+the+sufferings+of+his+passion%2C+and+finished+the+glorious+work+of+our+redemption.+If%2C+therefore%2C+the+finishing+of+the+work+of+the+first+creation%2C+by+which+God+mightily+manifested+himself+to+his+creatures%2C+deserved+a+sabbath+to+solemnize+the+memorial+of+so+great+a+work%2C+to+the+honour+of+the+worker%2C+and+therefore+calls+it+%E2%80%9Cmine+holy+day%2C%E2%80%9D+%28Isa.+lviii.+13%3B%29+much+more+does+the+new+creation+of+the+world%2C+effected+by+the+resurrection+of+Christ%2C+whereby+he+mightily+declared+himself+to+be+the+Son+of+God+%28Rom.+i.+4%29%2C+deserve+a+sabbath%2C+for+the+perpetual+commemoration+of+it%2C+to+the+honour+of+Christ%2C+and+therefore+worthily+called+the+Lord%E2%80%99s+day+%28Rev.+i.+10.%29%0A%0AFor%2C+as+the+deliverance+out+of+the+captivity+of+Babylon%2C+being+greater%2C+took+away+the+name+from+the+deliverance+out+of+the+bondage+of+Egypt+%28Jer.+xxiii.+7%2C+8%3B%29+so+the+day+on+which+Christ+finished+the+redemption+of+the+world+did+more+justly+deserve+to+have+the+Sabbath+kept+on+it%2C+than+on+that+day+on+which+God+ceased+from+creating+the+world.+As%2C+therefore%2C+in+the+creation%2C+the+first+day+wherein+it+was+finished%2C+was+consecrated+for+a+sabbath%3B+so+in+the+time+of+redemption%2C+the+first+day+wherein+it+was+perfected+must+be+dedicated+to+a+holy+rest%3B+but+still+a+seventh+day+kept+according+to+God%E2%80%99s+moral+commandment.%0A%0AThe+Jews+kept+the+last+day+of+the+week%2C+beginning+their+Sabbath+with+the+night+%28Gen.+ii.+2%3B+Lev.+xxiii.+32%3B+Neh.+xiii.+19%29%2C+when+God+rested%3B+but+Christians+honour+the+Lord+better%2C+on+the+first+day+of+the+week+%28Matt.+xxviii.+1%29%2C+beginning+the+Sabbath+with+the+day+when+the+Lord+arose+%28Acts+xx.+7%2C+11.%29+They+kept+their+Sabbath+in+remembrance%2C+of+the+world%E2%80%99s+creation%3B+but+Christians+celebrate+it+in+memorial+of+the+world%E2%80%99s+redemption%3B+yea%2C+the+Lord%E2%80%99s+day+being+the+first+of+the+creation+and+redemption%2C+puts+us+in+mind%2C+both+of+the+making+of+the+old%2C+and+redeeming+of+the+new+world.%0A%0AAs%2C+therefore%2C+under+the+Old+Testament%2C+God%2C+by+the+glory+consisting+of+seven+lamps%2C+seven+branches%2C+%26c.+%28Exod.+xxv.+31%29%2C+put+them+in+remembrance+of+the+creation%2C+light%2C+and+Sabbath%E2%80%99s+rest%3B+so%2C+under+the+New+Testament%2C+Christ%2C+the+true+light+of+the+world%2C+appears+in+the+midst+of+the+seven+lamps%2C+and+seven+golden+candlesticks+%28Rev.+i.+13%29%2C+to+put+us+in+mind+to+honour+our+Redeemer+in+the+light+of+the+gospel+of+the+Lord%E2%80%99s+seventh+day+of+rest.+And+seeing+the+redemption%2C+both+for+might+and+mercy%2C+so+far+exceeds+the+creation%2C+it+stood+with+great+reason+that+the+greater+work+should+carry+the+honour+of+the+day.+Neither+does+the+honourable+title+of+the+Lord%E2%80%99s+day+diminish+the+glory+of+the+Sabbath%3B+but+rather%2C+being+added%2C+augments+the+dignity+of+it%3B+as+the+name+Israel%2C+added+to+Jacob%2C+made+the+patriarch+the+more+renowned+%28Gen.+xxxii.+28.%29%0A%0AThe+reason+taken+from+the+example+of+God%E2%80%99s+resting+from+the+work+of+the+creation+of+the+world+continued+in+force+till+the+Son+of+God+ceased+from+the+work+of+the+redemption+of+the+world%2C+and+then+the+former+gave+place+to+the+latter.%E2%80%9D%0A%0A%E2%80%94+Lewis+Bayly%2C+The+Practice+of+Piety%3A+Directing+a+Christian+to+walk%2C+that+he+may+please+God%2C+%281612%3B+Grand+Rapids+MI%3A+Soli+Deo+Gloria%2C+2019%29%2C+pp+161-64.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b45180629.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6b45180629.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/15/lewis-bayly-on-the-christian-sabbath-as-the-lords-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

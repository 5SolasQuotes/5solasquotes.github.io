<blockquote><p>if this Christian prince do err in some matters of doctrine, or touching the rules of discipline, yet holding and maintaining all the fundamental points of the Christian faith, so that there be abuses and corruptions in the Church, every private godly man is to keep a good conscience, not breaking the unity and peace of the faithful, but not to take public authority to reform.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e29428bd19" data-kw="">
<blockquote><p>Concerning the communion of charity or love, which consists in suffering and bearing the evils one of another, and in not lightly condemning one another: we hold all them for the true members of Christ which worship one God in spirit and in truth, and hope for their salvation in one Jesus Christ alone, the Son of God come in the flesh, and crucified for the sins of the world, which is the foundation of salvation to all men. We desire all union and agreement with them, in whatsoeuer countries and regions they are, and whatsoever corruptions may be yet remaining amongst them, not only in manner, but also in certain points of doctrine, bewailing the bodily servitude which they endure, and praying the Father of light, that it will please Him to enlighten them more and more by his Holy Spirit.</p></blockquote>

ine</a></div>
</figure><figure class="quote" id="q-8c90bef990" data-kw="">
<blockquote><p>V. To make this clear, it must be observed that for the Reformed to seek peace and unity with other Protestants, it suffices if, after weighing and accurately judging everything according to God’s word, it appears that the remaining controversies between them are not such as to undermine the foundations of the Christian religion and true piety toward God. Thus, they can tolerate each other and recognize each other as brothers in Christ.

VI. This was the basis of the concord established a few years ago at Kassel between the theologians of Marburg and Rinteln. After both sides clearly and distinctly explained their doctrines and views to each other, and saw to what extent they agreed and what real differences remained, it was mutually acknowledged in good faith that what remained was not so significant as to prevent them from maintaining Christian and religious communion. Thus, they agreed on mutual tolerance and decided not to attack or insult each other but to maintain their own views until God revealed the truth to all while still communicating when the occasion arose, which has since been the practice.

VII. This was also the principle by which Paul attempted to reconcile believers of his time who contended among themselves over the observance of legal rites. He wanted those better instructed in Christian liberty, who had learned from the gospel that Mosaic ceremonies were abolished by Christ, to tolerate and bear with those still scrupulous about this matter and thought themselves bound to keep Mosaic ceremonies. He instructed them to admit such weak-in-faith individuals to their communion and not trouble their consciences by urging them to renounce their beliefs. This is reflected in Paul’s words to the Romans, “Accept the one whose faith is weak, without quarreling over disputable matters” (Romans 14:1), and to the Philippians, “If on some point you think differently, that too God will make clear to you. Only let us live up to what we have already attained” (Philippians 3:15-16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-6a2af103e9" data-kw="">
<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-e10e4d6844" data-kw="">
<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh: Higgins, 1659) | pt. 4, ch. 21, p. 426</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3dea9d2390" data-kw="">
<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification… (Hague, 1655), thesis 5</cite>, pp. 12-13</span></figcaption>

h%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>III. …But what can man do for this? His demerit is infinite (by the previous thesis). But the moral value of human actions is only finite, for the act cannot exceed the dignity of its principle. Moreover, in personal offenses, such as this one, there ought to be order and proportion between the one making satisfaction and the one to whom it is made, but this is far less between God and man than between a king and the vilest slave. IV. …Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here. Hence fall: 1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.). 2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)? 3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God. 4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…</p></blockquote>

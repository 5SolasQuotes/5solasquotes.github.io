<main class="wrap"><figure class="quote" id="q-4f2cfd9477" data-kw="">
<blockquote><p>…we are unworthy to lift up our eyes unto heaven and appear in thy presence, and that we ought not to presume to hope that thou wilt listen to our prayers if thou takest account of the things which we lay before thee; for we are accused by our own consciences, and our sins bear witness against us, while we know thee to be a just Judge, who justifiest not sinners and wicked men, but inflictest punishment on those who have broken thy commands. Hence it is, Lord, that when we reflect on the state of our whole life, we are ashamed of ourselves, and can do nothing but despond, just as if we were plunged into the abyss of death. And yet, Lord, since thou hast deigned, of thy boundless mercy, to command us to call upon thee, and that from the lowest hell, and the more devoid of strength we see ourselves to be to flee the more to thy supreme goodness ; since, moreover, thou hast promised that thou wilt listen to our prayers in the name of the Lord Jesus Christ, (whom thou hast appointed to be our advocate and intercessor,) and for his merit, without looking to what we have deserved, we here, renouncing all human confidence, and trusting solely to thy goodness, hesitate not to come into thy sight, and call upon thy holy name, in order to obtain mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, ‘Almighty God, heavenly Father, we acknowledge and humbly confess…’ in Forms of Prayer for the Church in ‘Forms of Prayer’ in Tracts, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36c2bc95f2" data-kw="">
<blockquote><p>If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether one may Flee from a Deadly Plague’</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.”

— Martin Luther, “Whether One May Flee From a Deadly Plague”, pp. 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+in+the+Old+Testament+God+himself+ordered+lepers+to+be+banished+from+the+community+and+compelled+to+live+outside+the+city+to+prevent+contamination+%5BLeviticus+13%E2%80%9314%5D%2C+we+must+do+the+same+with+this+dangerous+pestilence+so+that+anyone+who+becomes+infected+will+stay+away+from+other+persons%2C+or+allow+himself+to+be+taken+away+and+given+speedy+help+with+medicine.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+%E2%80%9CWhether+One+May+Flee+From+a+Deadly+Plague%E2%80%9D%2C+pp.+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36c2bc95f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36c2bc95f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=If%20in%20the%20Old%20Testament%20God,and%20given%20speedy%20help%20with%20medicine&amp;text=If%20in%20the%20Old%20Testament%20God%20himself%20ordered&amp;text=taken%20away%20and%20given%20speedy%20help%20with%20medicine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-678f7064e9" data-kw="">
<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 1, ch. 7</span></figcaption>

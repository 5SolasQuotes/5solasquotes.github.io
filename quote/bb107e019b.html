<blockquote><p>VI. Magistrates should not think they have sufficiently discharged their duty, when they have promoted the civil good of the subjects, by keeping them in peace, by ruling them according to the laws of the land; but they should also see to their spiritual good, and labour for the advancement of religion and piety within their dominions, by encouraging the faithful servants of God, and such as are truly pious; by restraining vice and impiety, and punishing such as are heretics and erroneous seducers of the people; for they are the ministers of God for good, among whom heretics and seducers are to be ranked, Phil. iii. 2. 2 John 10. 11. as being such as should be shunned, 2 Cor. vii. 11. Tit. iii. 10. 2 Tim. iii. 5. 6. Rom. xvi. 17. 18. See Gen. xxxv 2. 3. 4. 18. 2 Chron. xxxiii. 15.16. 34. and xix. 4. Ezra vi. 11. and vii. 26. Dan. iii. and vi. Exod. xxxii. 26. 27. 28. Deut. xiii. and xvii. 2. Zech. xiii. 1 to 7. For the apostle is here speaking of the magistrate as he ought to be, be he Heathen or Christian; He beareth not the sword in vain, but is to execute wrath upon such as do evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Paul the Apostle to the Romans, with Large Practical Observations; Delivered in Several Lectures</cite>, (Edinburgh: David Paterson, 1746), pp 506-07.</span></figcaption>

<blockquote><p>III. The union of pastor and flock in relation makes that which is a form-aptitudinal (as the soul to the body) to be the form in act (as the union of soul and body)…

IV. Union is in order to communion, which is primary by the exercise of the formal powers on the matter, and secondary by the action of all the parts according to their several capacities and offices. …

VI. These several degrees of union are found in bodies natural and politic:

      1. The union of soul and body makes a man, and an embryo before it be organized.

      2. The union of the body makes it capable of the soul’s further operation.

      3. The union of the organical, chief parts (as heart, lungs, etc.) to the rest make it a true human body completed to the nutriment and action of life.

      4. That it have hands and fingers, feet and toes, and all integral parts, makes it an entire body.

      5. The due site, temperament and qualities of each part make it a sound body.

      6. Comely color, hair, action, going, speech, etc. make it a comely body.

      7. To have all parts of equal quantity and office would make it uncomely: and to have the same hair, color, etc. is unnecessary at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, pp. 20-21</span></figcaption>

<blockquote><p>October 31, 1798… I have just passed through the most awful scene of epidemic sickness and mortality that I ever witnessed. The Yellow Fever has been raging in the city for more than two months past. From the middle to the 25th of this month was the most mortal time. Though the city was deserted by, perhaps, two-thirds of its regular inhabitants, more than two thousand persons fell victim to the disease. I remained with a brother — a beloved brother — a practitioner of medicine — a bachelor as well as myself. We were both mercifully borne through the raging epidemic without any serious attack. Our housekeeper died of it, and I attended her funeral between midnight and day. To attempt to describe the scenes of mourning and horror which this epidemic presented — I dare it. The task transcends my power of expression. I preached every Sabbath; but only a few attended public worship; and I know not that any sensible — certainly no conspicuous — good was done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Samuel Miller, Jr., The Life of Samuel Miller, D.D. LL.D</cite>, Vol. 1, p. 118</span></figcaption>

<blockquote><p>Nor is it of importance to inquire curiously at what time the soul was united to the body, the Logos (Logos) to the flesh. It is enough for us to believe that the human nature from the time it began to be never existed apart from the Logos (Logo), but was assumed by and hypostatically united to him. And if the soul could not be poured into the body unless already organized and completely formed (a point on which physicians are not agreed among themselves), it does not follow that the Logos (Logon) could not at once unite the flesh to himself, since his work could not be constrained either with the soul present or absent. Nor is it more absurd for the body of Christ (not as yet animated) to be united to the Logos (Logo), then for the same (when lifeless in the sepulcher) to remain conjoined with the same (as theologians acknowledge was done in the death of Christ).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-86f281856c" data-kw="">
<blockquote><p>Rest not in baptismal privileges: all are not Israel which are of Israel; what is a man the better to have Christ’s Name upon him, and Satan’s image? What is the advantage to have the Oracles of God, and want the Spirit of God? Think not that an empty profession will save; millions will be sent to hell in Christ’s livery, Matth. 8.12. Oh labour to know the grace of God in truth. The Lord hath been at much cost and charges with you to bring you near to himself; let not God be a loser by you. Pindar saith, it was an opinion of the people in ancient times, that Jupiter rained down gold upon the City of Rhodes:

Give me leave to apply it to you, God hath rained down golden showers upon you. What mercies hath he enriched you with? what talents hath he entrusted you with? your estate is a talent, your health (in these sickly times especially) is a talent, your Sanctuary-blessings are talents, every motion of the Spirit, every opportunity for heaven is a talent, and nothing more sure than that you will be called to an account shortly; now if you have let your talents lie rusting, and done no good with them, the hiding your talents will not hide your sin, expect an heavy doom.

Think not these things impertinences. Be not so evil, as to be too good to be advised. I confess myself with Ignatius, the least of all that labour in God’s vineyard, but though I am with you in weakness, yet as the Apostle saith, in much trembling. I tremble to think how sad it will be, if any of you shall perish in these days of the Gospel, though you have been placed under a trumpet, less shrill and powerful. It shall be my prayer for you all, that you may be fruit-bearing trees, that when the great Vinedresser shall remove you hence by death, he may transplant you into the celestial Paradise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To his loving friends in The saint’s delight. To which is annexed a treatise of meditation</cite></span></figcaption>

<blockquote><p>4. It is from the unsuitableness that is betwixt the things of Christ and the temper of a sinner. Christ’s yoke does no way fit a carnal heart… It is the base love of this present world that makes the call of the Gospel so unsuccessful and ineffectual; you may see it in that parable, Mt. 22:5: They make light of the tenders of Christ, and what is the reason? why the farm and the oxen, and the merchandise were in the case; these must not be left for Christ where lust has the casting voice. O how sad is this! if Christ should offer you riches and honors, you would come; and yet for heaven and glory you will not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good of Early Obedience</cite>, ... (London: Ponder, 1683), ch. 10, pp. 264-65</span></figcaption>

</figure><figure class="quote" id="q-eac67bac82" data-kw="">
<blockquote><p>And here is the instrument which Christ makes use of for the drawing of his elect to Himself: the preaching, plain and simple preaching of the Gospel, seemingly a weak and unlikely instrument; thence called the foolishness of preaching (1 Cor. 1:21); Yet by this weak means does Christ effect this great work: Hereby drawing men out of darkness from under the power of Satan. Paul was sent to the gentiles (Acts 26:18) to turn them from darkness to light, and from the power of Satan to God: But how was he to do it? Why, by preaching of the Gospel, by bearing the name of Christ before them (Acts 9:15), hereby drawing them out of the world as fishes out of the sea; hereby drawing them out of themselves, convincing them of their insufficiency and Christs all sufficiency; and so drawing them to Himself; first as to a Savior to believe on Him, working faith in them by this means, ‘Faith comes by hearing, hearing the Word, the word of the Gospel (Rom. 10): Then as to a Lord, to be governed by Him, which is also wrought by the same instrument. (2 Cor. 12:4-5) Here is the outward means, but this often proves ineffectual. Many there are who hear the Word, and hear it powerfully dispensed, who yet are never the better for it; so says the apostle of the Jews: The Word preached did not profit them, not being mixed with faith in them that heard it, Heb. 4:2. And so ineffectual it often proves to many that sit under the sound of it: They are not thereby brought home to Christ. Even as many of the Jews saw Christ lift up, beheld Him crucified, who yet believed not on Him, nay thereby they were hardened-against Him. Even so it is now in the preaching of the Gospel: Many there are before whose eyes Christ is lift up, crucified in the Word and sacraments, who yet are not brought to believe on Him or submit unto Him. 2. To this therefore (in the second place) is joined the Spirit, the Spirit of Christ which He sends forth to accompany his Word and to make it effectual in the hearts of his elect; and by this means He draws men effectually;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley.html">John Brinsley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystical Brasen Serpent</cite>, ... (London: Maxey, 1653), ‘The Magnetic Virtue of the Cross of Jesus Christ’, pp. 174-75</span></figcaption>

<blockquote><p>2. Touching the second difference, which is their vocation or calling, we must note that there is a twofold calling, vel [either]

1. Inefficaciter, formally, or effectually[?]. 2. efficaciter, formally, or effectually. The 1. is outwardly: the 2. is inwardly. The 1. general: the 2. special. Of the first, our Savior says ‘Many are called, but few are chosen.’ (Mt.) Of the second, the apostle says, ‘whom He has predestinated, them He calls,’ (Rom. 8) i.e. effectually. Now touching the outward calling, we must note that as many are called, so He calls them many ways, especially:

1. By the painful preaching of his Word.

2. By the manifold benefits of his grace.

3. By the manifest judgments of his anger. De [concerning]

1. God gave his Word, and great were the number of the preachers (God calls us diverse ways. Ps. 68:11), and He commanded them to preach unto all nations; and so their sound went unto all lands, to all countries, to all places, but especially to this place, where there are painful men, learned men that do often preach and continually call; and yet I fear their preaching is unrespected, I am sure themselves are unregarded… … …

2. God seeks to draw men unto Him in the chains of love, when He gives unto them, beneficia nimis copiosa multa, et magna, et privata, et positiva, many and great blessings, thereby to allure them unto his service.

3. If men will not turn, nor answer to the first and second call, then will He whet his glittering sword and his hand shall take hold of vengeance, He will pour out the vial of his wrath, thereby to convert them or confound them: and no marvel, for debet amor laesus irasci, love too much provoked must wax angry. All these ways has God called us: the preachers cried, and do cry and call continually, his blessings have been manifold and his judgments have been manifested in some measure upon our nation. O then let us take heed unto ourselves and not harden our hearts any longer, but let us hearken unto his voice, lest He swear in his wrath that we shall not enter into his rest. But indeed all these kinds of outward callings are but in vain, and bring no benefit unless the Lord calls us inwardly by his Spirit, for:

1. Nisi spiritus adsit cordi audientis, inanis est labor docentis (‘In vain is all outward calling, unless we be inwardly called by God’s Spirit.’ Gregory, Homily 30, Super Evangel.): In vain do we preach unto your ears, unless the Spirit of God does open your hearts, as He did the heart of Lydia, that you may believe our preaching, as she did the preaching of Paul.

2. All the blessings of the world will but puff us up with pride (as they did the Israelites, as Moses shows, dilectus meus impinguatus calcitrauit, my beloved, fatted and enlarged, spurned with his heels) unless God does give us the grace to use those blessings to the glory of his name.

3. All punishments and all judgments will sooner work desperation than conversion in a sinful soul, unless the grace of God work true humility in us, to make a right use of his fatherly chastisements. And this experience daily shows: First, the Word is preached, the one believes, the other refuses it. Secondly, God bestows his blessings upon men, the one is puffed up with pride, the other is truly thankful. Thirdly, God sends his judgments, the one grows desperate with Saul, the other is humbled with David. And what is the cause of this? to the one sort, He sends his messengers only to call them outwardly, to the other sort He sends his Spirit and gives his grace to make them yield unto his calling: and this effectual calling of the saints to believe the Gospel and to obey the voice of God is the effect and fruit of the love of God. Whensoever therefore we be outwardly called by what way or means soever it be, let us presently pray to God that He would inwardly work in our hearts to incline them to yield unto his calling, else will the outward calling bring no benefit, but only make us without excuse. And so much of their vocation.</p></blockquote>

2. God seeks to draw men unto Him in the chains of love, when He gives unto them, beneficia nimis copiosa multa, et magna, et privata, et positiva, many and great blessings, thereby to allure them unto his service.

<main class="wrap"><figure class="quote" id="q-dab9c937fe" data-kw="">
<blockquote><p>4. What the apostles do as apostles agrees only to apostles, and can be done by none but apostles, or by evangelists having their power by special warrantable commission from them, as what a man does as a man, what a pastor does as a pastor, a deacon as a deacon, a prophet as a prophet, can be done by none but by a man only, a pastor only, a deacon only… 5. …and what any one apostle does as an apostle by the amplitude of a transcendent power, every apostle does it completely, and wholly his alone as without help of another apostle; Peter works a miracle, especially any one apostle, as Paul, his alone might ordain Timothy an evangelist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644) | Part 1</cite>, p. 452</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-20014c7035" data-kw="">

<main class="wrap"><figure class="quote" id="q-ef6a2601b3" data-kw="">
<blockquote><p>Because there is in this respect an extreme difference between faults in doctrine and in life; the first drawing after them a consequence far differing from that of the latter, because that the Church propounds unto us not Her life but Her doctrine, to be the rule of our faith and manners. Yet (which we Protestants confess) all errors in doctrine do not give a man a just and sufficient cause to make a division from those that hold them. For the Apostle commands us, to receive him that is weak in the faith, Rom. xiv. 1. and not to trouble him with disputes, and to afford him our selves for an example, in bearing gently with those who are not of our mind in every thing. Let us all who are perfect, saith he, be of the same mind; and if any of you think otherwise, God shall reveal even this unto him. Phil. iii. 15.

‘Tis evident, that this weakness in faith and this diversity in opinion, whereof S[aint] Paul speaketh, are errors; but such as he would have us bear with. Yet since he elsewhere pronounceth anathema against those, that preach any other Gospel then that which he preached, we must of necessity conclude, that there are two sorts of errors in religion: the one such, as a man may bear with without dividing from them who hold them; and the other such, for which he is bound to avoid their communion: and this difference dependeth upon the nature of errors themselves.

For as the truths which we are to believe are not all of equal importance, some being esteemed fundamental and so absolutely requisite, that a man cannot come to the kingdom of heaven if he be ignorant of them; others being profitable, yet not so necessary but that a man may without the knowledge of them serve God and enjoy salvation: so it is with errors, Some are pernicious and no way consistent with a true piety; others are less hurtful and do not necessarily draw in men to perdition.

S[aint] Paul doth clearly enough discover to us this distinction, 1 Cor. iii. 13, 15. where, after he had said, That none could lay any other foundation but that which he had laid, to wit, Jesus Christ, he addeth, That they who builded upon this foundation wood, hay, stubble, should have loss in their work, when it comes to be tried; nevertheless they should be saved, yet so as by fire; that is to say, with difficulty, their person only, or that wherein their chief good consisted, escaping a burning. An evident sign that there be errors, which do not deprive the Authors thereof of salvation, much less exclude such from happiness as believe them after Them, and take them up (when they are dead or gone) merely upon their trust and credit. And to conclude, who doth not see plainly, That there be errors which utterly overthrow the foundations of Christianity, engaging us unavoidably in such things as are inconsistent with salvation? and that there be others which do not so?

As for example, if one should think that he were bound to worship the Sun. (For seeing the Sun is a creature, and those who worship creatures have no portion in the kingdom of heaven.) ‘Tis evident that he who hath such an opinion cannot attain eternal happiness. And ’tis so with all other errours which overthrow any of the first, necessary, and fundamental articles of Christian religion. But the error of those, who believed of old, That the Church shall continue a thousand years (or some long time) with J[esus] Christ upon earth after the resurrection, is no way repugnant to piety towards God, or charity towards our Neighbour, nor doth it directly overthrow any of the foundations of the Gospel; Though it be in my opinion contrary to divers passages of S[aint] Paul and scarce consonant to the nature of Christ’s Kingdom.

A man would scarce believe how necessary it is, to mark this difference among the errors of men in matters of religion, for preventing that vain scrupulosity and importunate pensiveness, which many melancholy spirits are troubled with, who condemn all errors alike, and thunder out one and the same anathema against what ever differs (though never so little) from their apprehensions: yet for keeping them from falling on the other side, into the indifferency of profane persons, who conform to any thing, and swallow a camel as well as a gnat. Indeed the true pious person will endeavour to keep himself from all error; and will purge his neighbour too, as well as himself, so far as he is able.

For any deviation from truth though it may be a light and small error, yet ’tis an errour (that is to say an ignorance, and contradiction to the truth) and by consequence an evil. But a man must be very diligent and circumspect in observing this distinction among errors, and acknowledge that one is much more dangerous then another, and he should more or less abhor them all, according as he shall judge them to be more or less dangerous. If they be of the first rank, viz. those which overthrow the foundations of Christianity, he will bestir himself with all possible prudence and dexterity, according to his vocation and gifts, to free his neighbour from them; and if he cannot gain upon him, he will yet be sure to save and deliver his own soul from the communion of such as hold them.</p></blockquote>

<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>

</figure><figure class="quote" id="q-2a0e5d748a" data-kw="">
<blockquote><p>Our brethren of Scotland writing against the tyranny of Prelates, when they were under it, in that book entitled, English and Popish Ceremonies [by Gillespie], have this passage: ‘If the error of conscience be about things unnecessary, then it is tutior pars, ‘the surest and safest way’ not to urge men to do that which in their consciences they condemn.’ And the ministers of the protestant Churches in France, giving their judgments, De pace inter Evangelicos procuranda, How Peace amongst the Protestants in Germany may be had, set forth by [John] Duraeus, say thus: ‘Let all matters controversal be brought into such a certain model as may give satisfaction to both parties; and that if it be possible, framed out of the very words of Scripture: and let no man require anything else of his brother.’ [Jerome] Zanchi, on the 4th Commandment, has this notable speech, ‘That which I say,’ says he: ‘is diligently to be observed, that those who would stir up princes to have all people, kingdoms, commonwealths which (not overthrowing the fundamentals of religion), differ from them in anything, condemned of heresy, excluded from friendship, driven out of their territories: these are no friends,’ says he, ‘either to their princes or to the Church of Christ.’ Many think they do great service to Christ, the Church and State, if they can stir up magistrates to suppress whatsoever they conceive are errors; it may be their hearts are upright in the main, they aim at peace, but certainly they cause much disturbance in Church and State. Bishop [John] Davenant in a little book entitled his, Exhortation to Brotherly Love amongst Churches, the ninth chapter, has this title: ‘That brotherly communion between Churches evangelical is not to be cut asunder because of diverse opinions about questions controversial.’ And in the beginning of the 10th chapter: ‘This is to be premised: The bonds of the brotherly communion of Christian Churches ought not to be dissolved upon every difference of opinions, but only for the denying or opposing fundamentals.’ Here see the moderation of a prelate. Thus Cyprian of old delivered his opinion and practised it accordingly, differing from many of his brethren, but withal professes: That he meant not to prescribe or give laws to any, that he would not contend with any of his colleagues so as to break divine concord and the peace of our Lord; that he was far from judging or censuring any of his brethren or cutting off from his communion any that were of a different mind; and that in such case none ought to constrain his colleague by tyrannical violence (therein glancing at the violent proceeding of Stephen to whom he wrote) to a necessity of believing or following what he thinks meet. (Epistle 72, to Stephen; Epistle 73, to Jubajanum) This modesty and charity of Cyprian is very often and very deservedly commended by St. Augustine (Contra Donatists, bk. 1, ch. 18; bk. •, chs. 1-2), says Dr. Potter, an episcopal man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London: Robert Davvlman, 1653), ch. 9; pp. 55-56</span></figcaption>

<blockquote><p>XXVII. Although we believe that the presbyterian order and parity (isotimian) or equality of pastors received among us approaches nearer to the institution of Christ and the apostles and the practice of the apostolic church, still we are unwilling to disturb anyone on this subject or to condemn the usage of the evangelical and Reformed churches, who retain the episcopal government so far, as more suitable to the genius and morals and political form of government of their people and more useful for good order (eutaxian) and the exercise of discipline. Provided there be always absent Babylonian pride and papal tyranny and this order be acknowledged as of ecclesiastical, not of divine right. But in turn we expect that equity and moderation from our brethren who differ from us here, so that they do not presume to condemn by a decretory sentence as schismatics and destitute of a lawful calling other churches differing from them and (in accordance with the liberty granted to them by Christ) using the presbyterian form of government as better adapted to their state and to the wishes and customs of their people; but should not cease to embrace them with brotherly affection that the bond of unity and fraternity may always remain unbroken and so with heart and strength joined together the work of God may be carried on to the increase of the kingdom of Christ and the destruction of Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.21.27</span></figcaption>

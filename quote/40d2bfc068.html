<main class="wrap"><figure class="quote" id="q-40d2bfc068" data-kw="">
<blockquote><p>Man, by making bad use of free will, destroyed both himself and it. For just as he who kills himself, does not live by killing himself, nor can he resuscitate himself when he has killed himself: so, when sin was committed by a free will, with sin being the victor, free will also was lost. For by whom a man is overcome, to this one also is he addicted as a servant: whence he will not be free for doing justly, unless, being freed from sin, he has begun to be a servant of justice. But from where will this liberty be for a man who is addicted and sold, unless He redeem him, whose is that voice: ‘If the Son shall make you free, you shall be free indeed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Barthold Holtzfus, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, sect. 9, pp. 23-24 Latin | Enchiridion to Laurentius, ch. 30</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-81d80d519f" data-kw="spontaneity indifference">
<blockquote><p>Whether the formal reason of free will consists in indifference or in rational spontaneity. The former we deny; the latter we affirm against papists, Socinians and Remonstrants. We must oppose the error of the adversaries who place its formal reason in indifference, and establish the orthodox truth which asserts that it is placed in rational willingness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.3.2</span></figcaption>

</figure><figure class="quote" id="q-ff4234ad2b" data-kw="">
<blockquote><p>The Disposition of Man to Grace l. Since the necessary conditions for salvation are impossible for the reprobates, God does not intend to give them salvation, conditionally if they believe and repent, unless one supposes that there is in God some vain, frustrated, and useless intention and will. 2. A good use of natural light, either subjective or objective, cannot lead man to salvation, nor obtain from God any other degree of light destined to salvation. Rejection of the error of those: 1. Who teach a universal and common call to all men to salvation and to the author of salvation, and that each and every man can believe and be saved if he wants. 2. Who teach that God, by his revealed will, wants the salvation of each and everyone.</p></blockquote>

ormed Books Online</a></div>
</figure><figure class="quote" id="q-1670871fbd" data-kw="">
<blockquote><p>Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Jonathan Edwards &amp; the Absence of Free Choice: A Parting of Ways in the Reformed Tradition” 71 min., Sept. 29th, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.”

— Richard Muller, “Jonathan Edwards &amp; the Absence of Free Choice: A Parting of Ways in the Reformed Tradition” 71 min., Sept. 29th, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJonathan+Edwards+is+often+regarded+as+an+epitome+of+Calvinism+for+his+teaching+on+the+freedom+of+will%2C+though+he+was%2C+in+his+own+time+and+for+a+century+after+his+death%2C+a+much-debated+thinker+whose+views+polarized+Reformed+circles.+This+lecture+will+concentrate+on+Edwards%E2%80%99s+reception+in+Britain%2C+which+has+received+little+attention+despite+its+significance+in+the+Reformed+tradition.+Concentrating+on+two+historical+contexts%2C+Dr.+Muller+will+consider+the+mixed+reception+of+Edwards%E2%80%99+thought%2C+note+differences+between+Edwards+and+the+older+Reformed+orthodoxy%2C+and+point+to+a+parting+of+the+ways+in+the+Reformed+tradition+that+took+place+largely+in+the+eighteenth+century.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+%E2%80%9CJonathan+Edwards+%26+the+Absence+of+Free+Choice%3A+A+Parting+of+Ways+in+the+Reformed+Tradition%E2%80%9D+71+min.%2C+Sept.+29th%2C+2010%2C+at+Trinity+Evangelical+Divinity+School%2C+being+the+Inaugural+Lecture+for+the+Jonathan+Edwards+Center.+This+lecture+is+in+article+form+above.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1670871fbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1670871fbd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=Jonathan%20Edwards%20is%20often%20regarded%20as,place%20largely%20in%20the%20eighteenth%20century." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin (1678) 217 pp.</cite>, pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

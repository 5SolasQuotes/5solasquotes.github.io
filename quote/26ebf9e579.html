<main class="wrap"><figure class="quote" id="q-26ebf9e579" data-kw="">
<blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 18-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span><span class="t"><a href="../topics/attributes-of-god/immutability.html">Immutability</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c563cf8a32" data-kw="">
<blockquote><p>But if any one alleges that the human mind which is finite cannot possibly comprehend divine things which are infinite, we must here properly distinguish–For if by the word ‘comprehend’ be meant to comprehend perfectly, we are quite agreed. For we are entirely of the opinion that a perfect and adequate knowledge of divine matters is quite inconsistent with the imperfection of the human understanding. But if by ‘comprehending’ be understood a clear and convincing knowledge, to a certain degree, the greatness of the objects in such enquiries is by no means inconsistent with this kind of knowledge. For what can the mind conceive greater than eternity? when we attempt to have a full and adequate conception of it, our understanding is quite aborbed by the idea: and yet that there is such a thing as eternity is one of the clearest and most evident truths, as we shall demonstrate in its proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-4240a8fc24" data-kw="">
<blockquote><p>Briefly, the concept of double justice posits a higher hidden justice in God which transcends the Law and could condemn even the angels. This idea appears in Calvin’s works before the sermons on Job but always grows out of his fascination with Job 4:18, namely that even the angels are not clean in God’s sight… which proved that creaturely justice cannot satisfy the justice of God… But when he tried to develop double justice as a hermeneutical key to the book of Job as a whole, the text led him in a direction he did not want to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/susan-schreiner.html">Susan Schreiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Exegesis &amp; Double Justice in Calvin’s Sermons on Job’ in Church History</cite>, 58, no. 3 (Sep., 1989), pp. 322-38, p. 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-eae69fdcb9" data-kw="">
<blockquote><p>On page 174, I also address the issue of the senses—whether and how they can be considered the source (as they are commonly called by philosophers and theologians, specifically by Alting as cited above) of our natural knowledge of God. The role of sense knowledge needs to be clarified, both against the skeptics on one side, and against Vorstius and the anthropomorphites who make God an object of physical vision on the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>
<div class="actions"><button class="copy" data-copy="“On page 174, I also address the issue of the senses—whether and how they can be considered the source (as they are commonly called by philosophers and theologians, specifically by Alting as cited above) of our natural knowledge of God. The role of sense knowledge needs to be clarified, both against the skeptics on one side, and against Vorstius and the anthropomorphites who make God an object of physical vision on the other.”

— Gisbertus Voetius, Disputation on the Ways of Knowing God, pt. 1 tr. Michael Lynch (1665)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+page+174%2C+I+also+address+the+issue+of+the+senses%E2%80%94whether+and+how+they+can+be+considered+the+source+%28as+they+are+commonly+called+by+philosophers+and+theologians%2C+specifically+by+Alting+as+cited+above%29+of+our+natural+knowledge+of+God.+The+role+of+sense+knowledge+needs+to+be+clarified%2C+both+against+the+skeptics+on+one+side%2C+and+against+Vorstius+and+the+anthropomorphites+who+make+God+an+object+of+physical+vision+on+the+other.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+on+the+Ways+of+Knowing+God%2C+pt.+1+tr.+Michael+Lynch+%281665%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feae69fdcb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eae69fdcb9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/god#:~:text=On%20page%20174%2C%20I%20also%20address,of%20physical%20vision%20on%20the%20other&amp;text=On%20page%20174%2C%20I%20also%20address%20the%20issue&amp;text=an%20object%20of%20physical%20vision%20on%20the%20other" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c67815140b" data-kw="">
<blockquote><p>But as in recognizing the authority of revelation, so in investigating the sense of it, and settling controversies, we must perpetually have recourse to natural theology. Nor can we possibly give our assent to any thing, as a divine revelation which contradicts the light of nature. Wherefore if any doctrine is attempted to be imposed on us as a revealed truth, which is inconsistent with natural theology, we are on that very account to be absolutely certain that it is an imposture, or at least to try if the passages which seem to contain such a doctrine will bear a construction which will remove the inconsistence, for it is impossible that God can contradict Himself. Thus when the Anthropomorphite asserts that the Deity is possessed of a human form, because the Scripture speaks of his face, his eyes, his ears and arms; natural theology at once convinces us of the delusion, teaching us that God is a being absolutely perfect, and therefore must of consequence be immaterial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, p. 13</span></figcaption>

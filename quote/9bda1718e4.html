<main class="wrap"><figure class="quote" id="q-9bda1718e4" data-kw="">
<blockquote><p>You may yet object, [to be born again] is (saith our Saviour) [to be born of water and of the Spirit:] now water is the outward Baptism, and the Spirit is the inward grace (thus all Ancients have construed this text, saith [Richard] Hooker) but children not born (howsoever they are sanctified by the Spirit) they cannot be baptized with water, and therefore they cannot see the Kingdom of God.

I answer: In cases of extremity, or impossibility, if actual Baptism be wanting, vocal is enough, and thus far some of our adversaries grant us; Though it be wanting indeed (saith Aquinas) yet Baptism in desire is sufficient to salvation: And to this end he cites Austin [Augustine], saying, Sanctification may be without Baptism, and Baptism without Sanctification; if Sanctification be, though Baptism be not, it avails to salvation; but if Baptism be, and Sanctification be not, it avails nothing at all. Our conclusion is this, All men (or all mankind) young men and maidens, old men and children, all must be regenerated, or they can never see the Kingdom of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prima, the first things, in reference to the middle and last things: or, the doctrine of regeneration, the new birth, the very beginning of a godly life</cite>, (London: Nathanael Webb and William Grantham, 1640), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

/01/14/isaac-ambrose-baptism-is-not-absolutely-essential-for-salvation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c57d32764" data-kw="">
<blockquote><p>The third point is, how baptism confers grace? Answer. It confers grace because it is a means to give and exhibit to the believing mind Christ with His benefits, and this it does by His signification. For it serves as a particular and infallible certificate to assure the party baptized of the forgiveness of his sins and of His eternal salvation. And whereas the minister in the name of God applies the promise of mercy to him that is baptized, it is indeed as much as if God should have made a particular promise to him. In this regard, baptism may well be said to confer grace, as the king’s letters are said to save the life of the malefactor when they do but signify to him and others that the king’s pleasure is to show favor. Again, baptism may be said to confer grace because the outward washing of the body is a token or pledge of the grace of God. And by this pledge faith is confirmed, which is an instrument to apprehend or receive the grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 224–25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-9d306f79c2" data-kw="">
<blockquote><p>What Mr. [Thomas] Bedford [d. 1653] has produced for the efficacy of baptism has been answered by Mr. [Richard] Baxter in his Appendix to his Plain Scripture, etc. [1651-1656]… Dr. [Cornelius] Burges, his Treatise of Baptismal Regeneration [1629], has been freely censured by many… And therefore I deny baptism to be the remedy of original sin, or the cause of regeneration, or that Christ intended to assign the use to baptism to heal original sin, or to testify the freedom from it without actual [sin]. These things have been delivered by Augustine and taught by the Romanists and Lutherans, but by many other Protestants disclaimed and refuted; and therefore Mr. Stephens, Mr. [James?] Cranford [d. 1657], Mr. Bedford, etc. in using this argument do but symbolize with the Papists, and revive what many Protestants of best note have exploded. ([Errata, p. 341:] What Dr. [Samuel] Ward and Dr. [John] Davenant have said for regeneration and justification of infants by baptism has been accurately examined and enervated by Mr. Gataker in Latin.)</p></blockquote>

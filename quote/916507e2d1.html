<main class="wrap"><figure class="quote" id="q-916507e2d1" data-kw="">
<blockquote><p>VIII. Third, as to moral necessity arising from habits. For as the will can be called “free” if it is devoid of habit, so it can rightly be called “slavish” if by habit it has been determined to a certain manner of acting. Still this servitude by no means overthrows the true and essential nature of liberty. Otherwise it would follow that habits destroy the will (which they rather perfect and facilitate to operation). Hence moral habits are twofold: good and evil. A twofold servitude also is thence born: the one of righteousness in good; the other of sin in evil and misery. This belongs to man in a state of sin, of which John says, “Whosoever committeth sin is the servant of sin” (8:34); and “Ye were the servants of sin” (Rom. 6:17)… IX. Hence it is evident that the adversaries falsely charge our men with saying the will is a slave in the state of sin, as if its liberty were destroyed by that very thing. Scripture beforehand so calls it and indeed with a twofold limitation: (1) that “servant” should be understood not absolutely and physically, but relatively, after the fall in a state of sin; (2) not simply about every natural, civil, or externally moral object, but especially about a spiritual object good per se (in which manner inability to good is more strongly asserted, but the essence of liberty is not destroyed). Although the sinner is so enslaved by evil that he cannot but sin, still he does not cease to sin most freely and with the highest liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, Tenth Topic, ‘The Free Will of Man in a State of Sin’, Question 2. The reader is encouraged to see Turretin’s numerous discussions relating to the related issues throughout his Institutes, as he has a lot more to say.</cite>, p. 663</span></figcaption>

<blockquote><p>(c) Nor is a thing necessary properly speaking unless it is produced from a necessary proximate cause, that is, such a cause that is determined by its own nature to such an effect; however, the decree of reprobation does not imply such a cause, although it does imply a certain and indeclinable futurity, which is as different from necessity as heaven from earth. [It is objected] (2) That this reprobation makes God the author of all sin, inasmuch as it predestined and necessitates the sinner to sinning. I respond: (a) It does not make it that the sinner sins necessarily, or that he does so determined by his own nature to sinning.</p></blockquote>

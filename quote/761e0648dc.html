<blockquote><p>I respond: the Papists affirm the prior in the Council of Trent, session 13… We deny, with Calvin [Institutes], bk. 4, ch. 18, Chamier in Panstratia, ‘On the Sacraments in General’, chs. 15 &amp; 16.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5825e88ff5" data-kw="">
<blockquote><p>Promulgation of a truth and Christian reproof are duties commanded by God; and yet are sometimes to be abstained from for scandals taken, by not only the weak, but also malicious. ‘Reprove not a scorner, least he hate thee,’ Prov. 9:8; ‘speak not in the ears of a fool; for he will despise the wisdom of thy words,’ Prov. 23:9. ‘Give not that which is holy unto dogs, neither cast ye your pearls before swine, lest they trample them under their feet and turn again and rent you,’ Mt. 7:6. Pro vitando scandalo cessat rigor disciplinae. ‘To avoid scandal the rigor of discipline ceases.’ To explain this, farther recourse must be had unto that old and golden rule, Affirmativa praecepta semper obligant, non ad semper. Affirmative precepts do always bind, but not to always; so that we are not bound to perform always what they enjoin but only Loco &amp; tempore debitis, when we have due time and place. Now as by the intercurrency of other circumstances, so especially by intercurrence of scandal, there may not be opportunity and seasonableness of doing what we are urged unto by some affirmative precepts; so these precepts may pro hic &amp; nunc, cease to be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian., p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Promulgation of a truth and Christian reproof are duties commanded by God; and yet are sometimes to be abstained from for scandals taken, by not only the weak, but also malicious. ‘Reprove not a scorner, least he hate thee,’ Prov. 9:8; ‘speak not in the ears of a fool; for he will despise the wisdom of thy words,’ Prov. 23:9. ‘Give not that which is holy unto dogs, neither cast ye your pearls before swine, lest they trample them under their feet and turn again and rent you,’ Mt. 7:6. Pro vitando scandalo cessat rigor disciplinae. ‘To avoid scandal the rigor of discipline ceases.’ To explain this, farther recourse must be had unto that old and golden rule, Affirmativa praecepta semper obligant, non ad semper. Affirmative precepts do always bind, but not to always; so that we are not bound to perform always what they enjoin but only Loco &amp; tempore debitis, when we have due time and place. Now as by the intercurrency of other circumstances, so especially by intercurrence of scandal, there may not be opportunity and seasonableness of doing what we are urged unto by some affirmative precepts; so these precepts may pro hic &amp; nunc, cease to be obligatory.”

t+for+a+Total+Omission+of+the+Lord%E2%80%99s+Supper.+Or+a+Brief+%26+Scholastical+Debate+of+that+Question+which+has+so+Wonderfully+Perplexed+Many%2C+Both+Ministers+%26+People%3A+Whether+or+No+the+Sacrament+of+the+Lord%E2%80%99s+Supper+may+%28according+to+Presbyterial+Principles%29+be+Lawfully+Administered+%5Bby+a+Minister%5D+in+an+un-presbyterated+church%2C+that+is%2C+a+church+destitute+of+ruling+elders.+Wherein+the+affirmative+is+confirmed%E2%80%A6+%28London%2C+1650%29+Jeanes+was+an+English+presbyterian.%2C+p.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5825e88ff5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5825e88ff5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relations-between-the-1st-2nd-tables-of-the-law/#:~:text=Promulgation%20of%20a%20truth%20and%20Christian,nunc%2C%20cease%20to%20be%20obligatory&amp;text=Promulgation%20of%20a%20truth%20and%20Christian%20reproof%20are&amp;text=pro%20hic%20%26%20nunc%2C%20cease%20to%20be%20obligatory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-517674f604" data-kw="">
<blockquote><p>Now indeed it would be most pleasing to us that the Supper be celebrated every month, provided that the more frequent use does not produce negligence. For while the greater part abstain from communion, the Church is in some measure scattered. Nevertheless, we would rather that the Church be invited monthly than only four times in the year, as is our custom. When I first came here [to Geneva], it was distributed only three times a year—and that so that between the Supper at Pentecost and that at the Nativity of Christ, seven whole months intervened. I preferred a monthly celebration; but since I could by no means persuade them, it seemed better to pardon the weakness of the people than to contend too stubbornly. Yet I took care that it should be entered in the public records that our custom was a faulty one, in order that a correction might be easier and freer for posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’</cite>, (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213 tr. ChatGPT-5</span></figcaption>

</figure><figure class="quote" id="q-a8fdbfcf15" data-kw="">
<blockquote><p>The apostle says, ‘If meat make my brother to offend, I will eat no flesh while the world standeth.’ (1 Cor. 8:13) Now put the case the apostle had been hindered from preaching the Gospel for his precise abstaining from those meats whereat his brother would be offended, would he in that case have eaten? Nay, he says peremptorily that whiles the world stands, he would not eat.</p></blockquote>

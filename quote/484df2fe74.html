<blockquote><p>The impelling cause [of the gospel call], whereby God is moved internally by Himself, is God’s grace, his good pleasure and favorably-inclined will to offer, in Christ, his salvation to wretched sinners.</p></blockquote>

</figure><figure class="quote" id="q-2d1bafe9b6" data-kw="">
<blockquote><p>Thirdly, God has expressed Himself in Scripture, as much, yea more, for his willingness, than for his power to help; therefore we need not make our uncertainty of his will the reason of our unbelief, when we say, we are assured of his power: God has said, He is Almighty, etc., but there are not only words importing that God is willing to help his people, but promises and oaths that He will (Ps. 50:15) ‘Call upon me, and I will deliver thee’; Eze. 33:11, ‘As I live, saith the Lord God, I have no pleasure in the death of the wicked (that place is meant primarily of a civil death, a death in trouble) but that the wicked turn from his way and live.’ Yea, God has manifested a willingness to help a people, which his power has not seconded; but He never manifested his power, when his will did not concur: that most passionate exclamation, ‘O Jerusalem, Jerusalem, How often would I have gathered thee! etc.’ [Mt. 23:37] implies a general willingness in Christ to gather Jerusalem, yet Christ did not act his divine power effectually for their gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Unbelief</cite>, (London, 1645), p. 40</span></figcaption>

r" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b28314cab9" data-kw="">
<blockquote><p>Hence it is commonly called a will of sign and opposed to the will of good pleasure, which is always fulfilled — as several weighty Thomists here expound: Cajetan, Bañez, Zumel, cited by González (disp. 56, sect.1)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 2. ‘General will of God concerning the salvation of all men, 1 Tim. 2:4’ in Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two… vol. 1 tr. AI by Vertias (Padua: Frambotti, 1671), bk. 1, Collation 12, pp. 841-73 A more detailed ToC is given at the beginning of the volume. | Thomas, while allowing for other interpretations, preferred taking 1 Tim. 2:4, about God willing all men to be saved, to refer to an antecedent will of God, in contrast to a consequent will of God. He also speaks of it as a conditional and imperfect will, and a velleity (disposition or willingness) in contrast to the absolute will of God. (Summa, pt. 1, q. 19, art. 6, ‘Whether the will of God is always fulfilled’ [Aquinas distinguishes]) Macedo adds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-c387c9c582" data-kw="">
<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jonah</cite>, ch. 4, verse 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

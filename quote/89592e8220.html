<main class="wrap"><figure class="quote" id="q-89592e8220" data-kw="">
<blockquote><p>They [Romanists] disannul the last Commandment [of the Ten Commandments] by holding concupiscence before consent to be no sin, when as we know by God’s Word that the first evil motions in us are sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works (RHB), vol. 4</cite>, pp. 484-485</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27a39a0ec1" data-kw="">
<blockquote><p>Protestants also believe that lust or concupiscence in the regenerate, as including a remaining tendency towards what is sinful, and the first or earliest motions of this tendency in the heart, though not deliberately consented to and followed out, is itself truly and properly sinful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, ch. 19 (The Doctrine of the Fall)</span></figcaption>

— William Cunningham, Historical Theology, ch. 19 (The Doctrine of the Fall)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProtestants+also+believe+that+lust+or+concupiscence+in+the+regenerate%2C+as+including+a+remaining+tendency+towards+what+is+sinful%2C+and+the+first+or+earliest+motions+of+this+tendency+in+the+heart%2C+though+not+deliberately+consented+to+and+followed+out%2C+is+itself+truly+and+properly+sinful.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Historical+Theology%2C+ch.+19+%28The+Doctrine+of+the+Fall%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27a39a0ec1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27a39a0ec1.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28historical+theology%29+AND+creator%3A%28cunningham%2C+william%29" rel="noopener" target="_blank">Read it online · Internet Archive (2 vols.)</a></div>
</figure><figure class="quote" id="q-dafdeaa83f" data-kw="Depravity">
<blockquote><p>We again regard it as sin whenever man is influenced in any degree by any desire contrary to the law of God; nay, we maintain that the very pravity which begets in us such desires is sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“We again regard it as sin whenever man is influenced in any degree by any desire contrary to the law of God; nay, we maintain that the very pravity which begets in us such desires is sin.”

— John Calvin, Institutes of the Christian Religion, 3.3.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+again+regard+it+as+sin+whenever+man+is+influenced+in+any+degree+by+any+desire+contrary+to+the+law+of+God%3B+nay%2C+we+maintain+that+the+very+pravity+which+begets+in+us+such+desires+is+sin.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.3.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdafdeaa83f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dafdeaa83f.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-a706c93de0" data-kw="">
<blockquote><p>And this also lies in it as it is enmity, that every part and parcel of it, if we may so speak, the least degree of it that can possibly remain in any one, whilst and where there is any thing of its nature, is enmity still. It may not be so effectual and powerful in operation as where it has more life and vigor, but it is enmity still. As every drop of poison is poison, and will infect, and every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, — it is enmity, it will poison, it will burn. That which is any thing in the abstract is still so whilst it has any being at all. Our apostle, who may well be supposed to have made as great a progress in the subduing of it as any one on the earth, yet after all cries out for deliverance, as from an irreconcilable enemy, Rom. 7:24. The meanest acting, the meanest and most imperceptible working of it, is the acting and working of enmity. Mortification abates of its force, but does not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nature, Power, Deceit &amp; Prevelancy of the Remainders of Indwelling Sin in Believers, ch. 4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-56cfa7cd20" data-kw="Holiness">
<blockquote><p>Since the precept about not coveting is general, it ought to be extended to all depraved and inordinate concupiscence, original and habitual as well as actual—whether this is determinate and voluntary or still indeterminate and only titillating. This is true in order that the perfect purity and holiness of the lawgiver may be noted (which will suffer not even the smallest taint of depraved concupiscence in man, but demands righteousness and holiness of every kind).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.21.3</span></figcaption>

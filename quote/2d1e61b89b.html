</figure><figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>

<blockquote><p>Fourthly, it is objected, that what concerns all, ought to be done with the consent of all. Answer: We hold the same, but the consent of all is one thing, the exercise of jurisdiction by all, another thing. Ainsworth, in one of his epistles to Paget, condemns the elderships sitting and judging matters apart from the congregation. Paget answers, that though the eldership sit apart to judge, yet before any sentence be given for the cutting off of any offender, or for any other thing which concerneth all, matters are first propounded to the whole church, and their prayers and consent required. And surely this form of proceeding shines forth to us in that apostolical synod at Jerusalem…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (Edinburgh, 1846), Part 2, Concerning the Assemblies of the Church of Scotland, and the Authority Thereof, Ch. 1, ‘Of Popular Government in the Church’; p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

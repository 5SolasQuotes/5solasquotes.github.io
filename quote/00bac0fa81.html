<main class="wrap"><figure class="quote" id="q-00bac0fa81" data-kw="">
<blockquote><p>Forget not to mark here also the great care that GOD hath of his Sabbath, that it be kept holy according to his appointment, when he will not suffer these Israelites to gather so much as his Manna for their food upon the Sabbath day, but appointeth them to do it the day before. May not a good soul thus reason then with himself, or her self? Good Lord, what do I upon the Sabbath day? This people of his, might not gather Manna, and may I safely gad to Fairs and Markets, to dancings and drinkings, to wakes and wantonness, to Bearbaitings, and Bull-baitings, with such like wicked prophanations of the Lord’s day?

May I be absent from the Church, where God’s people are gathered together in his Name, &amp; he in the midst of them, walking about my Closes and grounds, sending my Servants and Cattle to Towns with corn which I have sold before, because I will not spare them on the week days, and so forth? Are these works for the Sabbath? Is this to keep holy the Sabbath day? Can I answer this to my God that giveth me six days for my self, and taketh but one day to himself of which I rob him also? No, no, assuredly I shall not be able to endure his wrath for these things one day; and therefore I will leave them, and regard hereafter his holy Sabbath better than I have done. Yes assuredly this is a sound and a blessed Reason: and therefore I pray God to set it in our hearts, since now a-days there is so much offending this way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), pp 269-70.</span></figcaption>

<blockquote><p>How should involuntary mental portraits of Christ be treated by those who experience them?… Erskine’s comparison of mental idolatry with mental adultery suggests some important clues. A man cannot always avoid seeing a beautiful woman or being attracted to her. Mental adultery does not consist in physical sight, but in cultivating the mental image of that woman for the purpose of sexual stimulation… When a mental image comes into the mind without a deliberate volition, its content must be evaluated. If it is symbolic of God’s attributes or if it represents an event in the life of the Lord Jesus, it may be entertained with caution. If it consists of a virtual portrait of the Savior, it ought to be rejected rather than fondled.</p></blockquote>

<blockquote><p>”28. So great is the peace and comfort of many parishes where the public ministers and all the religious people live together in love and amity that it loudly tells us how much better that is than to study to render each other odious, or vile and excommunicable. …

37. To hold that any congregations are such whose worship is faulty, but such as God forgives and accepts, but that it is unlawful for us to join with them, lest it make us guilty of their sin, this (though it should be erroneous, and uncharitable and sinful) yet is not to excommunicate that congregation as no Church or no Christians. But to say of any congregation that they want [lack] anything essential to Christianity or to make them capable to be loved as Christians, or that their worship of God is idolatry, or so bad as that God accepts it not, the evil of it being greater than the good (as poison in our food), and on this reason to declare that no good Christian should communicate with them, this is to excommunicate such [a] congregation, as far as one Church may excommunicate another, which is but by such renouncing their communion.² ² [An equivalent example of this is in 1 Kings 13:1-10.]

38. There is no history that I have seen or heard that tells us of any Churches on earth that for many hundred years together did worship God without a liturgy as faulty as ours: To make them all idolaters, and such whose worship God cursed and accepted not, is to make them no true Churches… and if Christ had no Church, He was no Head and King of it, and so no Christ.</p></blockquote>

<blockquote><p>Undoubtedly, in my opinion, no man endued with sound judgment will deny that lights, crosses and trifles of that sort flowed from superstition. Whence I hold, that those who retain them, while they possess liberty of choice, draw too eagerly from dregs. Nor do I see what purpose can be answered by burdening the Church with frivolous and useless (not to call them by their proper name, noxious) ceremonies, where we enjoy the liberty of establishing a pure and simple order.</p></blockquote>

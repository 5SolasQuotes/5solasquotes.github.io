<main class="wrap"><figure class="quote" id="q-42caf17fa2" data-kw="">
<blockquote><p>But in these games, pastimes, sports and plays at cards and dice, there is a certain distinction to be used. For, some of them are after such a sort played and passed over, that to the winning and obtaining of the victory, honest industry of the mind helps more than any blind casualty or chanceable hazard: insomuch that the awkward luck which falls out contrary to desire is supplied, amended and reformed by art and cunning. These kinds of play may not properly be termed ‘alea’ [chance] or hazardry, neither are they absolutely to be forbidden: only let measurable mean therein be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 6, ‘What the meaning of this word ‘Alea’ [Chance] properly is: and what Games &amp; Plays are contained and comprehended under the name thereof’ in A Discourse of Gaming, and Specially of Dice-Play in True &amp; Christian Friendship… Together also with a right excellent Invective… against the wicked exercise of diceplay, and other profane gaming (London: Veale, 1586) no page numbers</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19bd646c65" data-kw="">

</figure><figure class="quote" id="q-23cdf30f01" data-kw="">
<blockquote><p>Consequently, Church government, by the Word, which defines it, can never arise higher than bearing secondary weight or ever override more fundamental obligations, no matter what is enacted in Church or civil constitutions, oaths, covenants, etc., lest we go beyond the Word (1 Cor. 4:6) and become sectarian (all in the name of reforming). Ideal, external Church government is a goal to be worked towards, but it does not necessitate or warrant of itself separation…</p></blockquote>

</figure><figure class="quote" id="q-e8fa0f8041" data-kw="">
<blockquote><p>…wager: ‘Tis called contractus sponsionis, a contract of promising, and is commonly used when there is some contest about the truth of a proposition, concerning something that is or is not in being already, or will or will not be hereafter, both parties agreeing that he who holds the truth shall have a reward and the other that asserted the falsehood shall be mulcted [fined]. The thing in itself is not absolutely unlawful or unjust, and may sometimes be of use to repress a foolish confidence. Also, where the engagement is only on one hand, whereby a man obliges himself to do a thing under a penalty; for here it may be of use, to stir up a laudable industry, provided such obligation, wager, or agreement be not to any matter that is sinful (as who shall drink most, who shall play a lascivious prank or offer an injurious abuse, etc.) provided also that it be not to the notable loss or hazard of any man, unless it does conduce to a greater public good (which cautions are seldom observed in common wagers), for in such cases the wager becomes sinful and is to be altogether avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-morton.html">Charles Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gaming-Humor Considered &amp; Reproved… (London: Cockerill, 1684), pp. 25-26 Morton (1627-1698) was an English, puritan, nonconformist minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<blockquote><p>and that the Engagement whereinto we are entered [to the English republican government, 1648], to be ‘true and faithful to this commonwealth, as it now is (viz.) established without a king and House of Lords,’ has nothing at all inconsistent with the former engagements [such as the SL&amp;C, 1643], or does give us the least cause to carry about with us a conscience (as to these things) trembling and doubtful, because we find ourselves free from all guilt of the least intention of violating any former promises, in things which are possible and lawful to be done by us in our places, which were unalterable conditions of all human promises, at all times presupposed and implied therein.</p></blockquote>

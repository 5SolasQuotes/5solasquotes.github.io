</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af4b12fc42" data-kw="">
<blockquote><p>…creation is instantaneous, unpreceded by a process of becoming… St. Thomas excels in explaining this distinction, just now noted, between passive potency and active potency. Real passive potency is not simple possibility. Simple possibility is prerequired and suffices for creation ex nihilo. But it does not suffice as prerequisite for motion, change, mutation. Mutation presupposes a real subject, determinable, transformable, mutable, whereas creation is the production of the entire created being, without any presupposed real potency. Now, since active potency, active power, must be greater in proportion to its passive correlative, it follows that when passive potency is reduced to zero, the active potency must be infinite. In other words, the most universal of effects, the being of all [created] things, cannot be produced except by the most universal of all causes, that is, by the Supreme Being. (Summa, pt. 1, q. 45, art. 1, 2, 5; pt. 3, q. 75, art. 8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: A Synthesis of Thomistic Thought (n.p., 1946), ch. 5, ‘Act &amp; Potency’, pp. 29-30 Lagrange is a Romanist, neo-Thomist theologian.</cite></span></figcaption>

</figure><figure class="quote" id="q-57a97c89f5" data-kw="">
<blockquote><p>Secondly, that which is the only foundation of a scruple in this case, is a principle most unreasonable in itself, that we are to embrace nothing for truth, though divinely revealed, but what our reason is able to comprehend, as to the nature of the thing, and the manner of its existence; on which account the doctrine of the Trinity, Incarnation, Satisfaction, and consequently the whole mystery of the Gospel of Christ must be rejected as incredible, and that on this bare pretense, because although many expressions in Scripture seem to import all these things, yet we are bound to interpret them to another sense, because this is incongruous to our reason. But although Christianity be a religion which comes in the highest way of credibility to the minds of men, although we are not bound to believe anything but what we have sufficient reason to make it appear that it is revealed by God, yet that anything should be questioned whether it be of divine revelation, merely because our reason is to seek, as to the full and adaequate conception of it, is a most absurd and unreasonable pretence: And the assertors of it must run themselves on these unavoidable absurdities: First, of believing nothing either in nature or religion to be true, but what they can give a full and satisfactory account of, as to every mode and circumstance of it. Therefore let such persons first try themselves in all the appearances of nature: And then we may suppose they will not believe that the sun shines, till they have by demonstrative arguments proved the undoubted truth of the Ptolomaic or Copernican hypothesis, that they will never give credit to the flux and reflux of the Sea, till they clearly resolve the doubts which attend the several opinions of it. That there is no such thing as matter in the world, till they can satisfactorily tell us how the parts of it are united; nor that there are any material beings, till they have resolved all the perplexing difficulties about the several affections of them; and that themselves have not so much as a rational soul, till they are bound to satisfy us of the manner of the union of the soul and body together. And if they can expedite all these, and many more difficulties about the most obvious things…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Origines Sacræ, or, A Rational Account of the Grounds of Christian Faith... (London, 1662), bk. 2, ch. 8</cite>, pp. 233-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-216a1ae61b" data-kw="">
<blockquote><p>Therefore the aforesaid names signify the divine substance, but in an imperfect manner, even as creatures represent it imperfectly. So when we say, God is good, the meaning is not, God is the cause of goodness, or God is not evil; but the meaning is, Whatever good we attribute to creatures, pre-exists in God, and in a more excellent and higher way. Hence it does not follow that God is good, because He causes goodness; but rather, on the contrary, He causes goodness in things because He is good; according to what Augustine says (De Doctr. Christ. i, 32), Because He is good, we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 13 | art. 2, I answer that</cite></span></figcaption>

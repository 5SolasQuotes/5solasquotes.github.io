<main class="wrap"><figure class="quote" id="q-5fb64f8045" data-kw="">
<blockquote><p>This disposition [in Eze. 18:33] proves that God is ready to pardon, to forbear, and to forgive sins if only people were willing to come to their senses. But because they continue to be stubborn and to reject every remedy, He is tortured, as it were, by their wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, vol. 2: Lectures on Genesis: Chapters 6–14, eds. Pelikan, Hilton &amp; Lehmann (Concordia, 1999)</cite>, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies: He labors to overcome their evil with his good.</p></blockquote>

</figure><figure class="quote" id="q-bc5b6209af" data-kw="">
<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-johnson.html">Charles Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Thomas &amp; TULIP’ (2020) 20 paragraphs at Reformed Theology Delatinized</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is a Six-fold Commentary upon… Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-32484f2f45" data-kw="">
<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, pp. 564-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

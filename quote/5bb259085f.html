<blockquote><p>And as Christ is the priest, as he is also the victim and the price of our reconciliation. He offered himself on the altar of the cross not to the devil, but to the triune God, and he did so for all with regard to the sufficiency of the price, but only for the elect with regard to the efficacy, because he brought about salvation only for the predestined.</p></blockquote>

<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology.

7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Method of Christian Theology</cite>, (London: White &amp; Snowden, 1681), pt. 1, ch. 1, pp. 31-32 tr. AI Stiven Peter Latin</span></figcaption>

<blockquote><p>S. What is natural Philosophy?

M. It is the true knowledge or discourse concerning the Creation and distinction of all this whole world with the parts thereof, of the causes by which it was so wrought, and likewise of the effects which follow thereon, appertaining to the praise of God the Creator.

S. From whence do you gather this your definition?

M. Specially out of two places of holy scripture, whereof the first is the. 30. chapt. and 4. verse of the Proverbs. The other the first chapter of Genesis, in which those four points are briefly recited, unto which also that place may bee added which is in the 7. Chapter and 17. and 18. verses, where it is evidently declared, that such things be handled in this Science.

S. Is this knowledge termed by this name only, or is it called by some other also?

M. Yea truly. For out of S. Paul it may be called The knowledge of God’s works, Rom. the 1. chap. and 20. verse. Out of the Epistle to the Hebrews, The knowledge of secular things. And finally we may as fitly and conveniently call it The knowledge of things created, as natural Philosophy was so called Of the searching of Nature, if so be that the use of that name had been familiar, and received by the Greeks and Latins.

S. Why then, do you call it natural Philosophy, which is a word used by the Heathen Philosophers?

M. For two causes. The first is, for that Christians ought not to be so scrupulous, or rather superstitious, that they should be afeard to use such common words and names as the Heathen do, for so much as with them we do use and enjoy the self same Sun, air, earth, water, light, meats, and Cities. Neither doth the Scripture it self refuse that word as unseemly or monstrous, as appeareth in the 2. chapter and 3. verse to the Ephesians, and the 1. Chapter and 5. verse of the second Epistle of S. Peter.

Also the ancient and Catholic fathers in every place, do term this knowledge of things by the name of Natural Philosophy, as did Basil, Chrysostom, Ambrose, Augustine in his Enchiridion to Laurence: Natural Philosophers, saith he, are they that search the nature of things. Secondly, that for as much as this word, Nature, in the common use of the Greek tongue, is, for the most part, applied to such things as do consist, not of essence only, of which sort GOD is, but are compounded with certain accidents adjoined, such as are all the things that we behold with our eyes, and whereof this visible world consisteth: that knowledge seemeth most properly to be termed natural Philosophy, which is busied in the handling of the mixt, compounded, and material things, that it may bee distinguished from Divinity. Wherefore, Natural Philosophy, say they, is the knowledge of Material and Instrumental beginnings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture</cite>, trans. Thomas Twyne (London: Andrew Maunsell, 1578), unpaginated.</span></figcaption>

<blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.”

— Jean-Alphonse Turretin, Dissertations on Natural Theology, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 4-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CShould+anyone+attempt+to+weaken+the+truth+of+natural+theology+by+this+argument%2C+that+nothing+of+certainty+can+be+discovered+in+human+affairs%2C+or+that+what+is+certain+cannot+possibly+be+distinguished+from+that+which+is+doubtful%2C+a+confutation+of+the+first+of+these+puerilities+does+not+belong+to+this+part+of+the+subject%3B+for+it+is+not+our+business+here+to+demonstrate+the+principles+of+human+knowledge%2C+but+to+take+them+for+granted%E2%80%93Let+these+who+are+so+thoroughly+possessed+of+such+skeptical+opinions+in+order+to+be+cured+of+their+folly+apply+to+the+metaphysicians%2C+I+had+almost+said+to+the+physicians%E2%80%93all+that+our+subject+requires+of+us+is+to+show+that+there+is+as+great+certainty+to+be+found+in+matters+of+a+divine+nature+as+can+possibly+be+met+with+in+human+affairs.+For+to+add+only+this+one+remark%2C+what+end+can+it+serve+to+confute+those+by+argument+who+attempt+to+destroy+all+reasoning%2C+nay+the+very+foundations+of+it%2C+and+who%2C+on+their+own+principles%2C+are+equally+refuted%2C+whether+they+prove+their+own+opinion+to+be+true%2C+or+do+not+prove+it%2C+whether+they+overcome+in+their+disputations%2C+or+are+defeated%3F+But+that+certainty+is+often+confounded+with+doubt%2C+and+truth+with+falsehood%2C+in+every+subject+of+our+enquiry%2C+more+particularly+such+enquiries+as+have+divine+things+for+their+object%2C+cannot+be+denied.+For+this+reason+in+particular%2C+the+candid+enquirer+after+truth+should+determine+nothing+without+caution%2C+nothing+precipitately%2C+nothing+from+prejudice%2C+from+anger%2C+from+hatred%2C+or+any+improper+disposition.+But+to+assert+that+nothing%2C+in+any+of+our+enquiries%2C+can+be+known+with+certainty%2C+even+when+the+utmost+caution%2C+sincereity+and+attention+guide+our+researches%2C+is+perfectly+absurd+and+quite+inconsistent+with+the+first+principles+of+reason.%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+Dissertations+on+Natural+Theology%2C+tr.+William+Crawford+%28d.+1737%3B+Belfast%3A+Magee%2C+1777%29%2C+Theses+concerning+Natural+Theology+in+General%2C+pp.+4-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6ac70eebd0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6ac70eebd0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-epistemology/#:~:text=Should%20anyone%20attempt%20to%20weaken%20the,with%20the%20first%20principles%20of%20reason&amp;text=Should%20anyone%20attempt%20to%20weaken%20the%20truth%20of&amp;text=quite%20inconsistent%20with%20the%20first%20principles%20of%20reason" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

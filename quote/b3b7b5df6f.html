<main class="wrap"><figure class="quote" id="q-b3b7b5df6f" data-kw="">
<blockquote><p>The qualities in general requisite in all them, who should bear charge in the Kirk, consist in soundness of religion, and godliness of life, according as they are sufficiently set forth in the Word. … Ordination is the separation and sanctifying of the person appointed to God and his Kirk, after he be well tried and found qualified. … All thir [these], as they must be raised up by God, and by him made able for the work whereto they are called; so ought they know their message to be limited within God’s word, without the bounds of which they ought not to pass. … And generally thir [these] two things ought they all to respect: the glory of God, and edifying of his Kirk, in discharging their duties in their calling.</p></blockquote>

<blockquote><p>The Reformers held to sola Scriptura, not solo Scriptura.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jason-helopoulos.html">Jason Helopoulos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @Tabletalk</cite>, Oct 23, 2017</span></figcaption>

— Jason Helopoulos, Quoted on X by @Tabletalk, Oct 23, 2017">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformers+held+to+sola+Scriptura%2C+not+solo+Scriptura.%E2%80%9D%0A%0A%E2%80%94+Jason+Helopoulos%2C+Quoted+on+X+by+%40Tabletalk%2C+Oct+23%2C+2017&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33055e412b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33055e412b.html">Permalink</a><a class="src" href="https://x.com/Tabletalk/status/922403256650919936" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-0616ec9e74" data-kw="">
<blockquote><p>I have said elsewhere that the Westminster Divines, from their earnest desire to form one comprehensive Church, did not require subscription to their Directories for Public Worship and for Church Government, nor exact conformity to their minute details, as [Archbishop] Laud had done to those of the Prayer-Book and Canons. It may be doubted if the English section of them meant to require more for their Confession of Faith than that it should be (like the Irish Articles) the norm of public teaching. They felt with Baxter that ‘there is a singular use for a full body of theology or a profession concluded on by such reverend assemblies, that the younger ministers may be taught by it, and the reverence of it may restrain them from rash contradicting it; and there is a necessity of exercising power in ministerial assemblies for the actual restraint of such as shall teach things intolerably unsound, and all ministers should be there accountable for their doctrine.’ Such a full body of theology in a non-liturgical Church was essential as a guide in prayer as well as in preaching, and its authority as the norm of both was the least restriction that could be imposed if reasonable soundness was to be maintained, and due security given to the congregations that the liberty allowed in the devotional services should not degenerate into licence. Probably this was all that the majority of the English divines were disposed to insist on. At any rate a sentence of Tuckney often quoted, seems to point in that direction. ‘In the Assembly I gave my vote with others that the Confession of Faith, put out by authority, should not be either required to be sworn or subscribed to… but only so as not to be publicly preached or written against.’ I have not come on any clear trace of this vote in the Minutes of the Assembly, but possibly it occurred on or soon after 26th November 1646, when the Confession was completed, and about to be sent up to the Houses, and when it is recorded that ‘Mr. Nye, Mr. Carter junior, and Mr. Greenhill enter their dissent to the sending up of the Confession of Faith in order to the Preface,’ and is ordered that ‘before the Confession of Faith be sent up the Preface shall be debated and prepared to be sent up with it, if any be made.’ But so far as appears from the Minutes none was debated or sent up. The Church of Scotland, while agreeing with the English Divines as to the Directory of Public Worship, and Form of Church Government, has always required her ministers to regard the Confession of Faith as something more than the norm of teaching to which in their public ministrations they were to conform [this is not actually true, as the WCF was not enacted to be subscribed till 1693], and by the Act of the Scottish Parliament in 1693 she was sufficiently authorised to require more than this, including at least personal acceptance of its main doctrines, and of the sum and substance of the Reformed faith, as set forth in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-mitchell.html">Alexander Mitchell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix: “Subscription to the Confession” in The Westminster Assembly: its History &amp; Standards</cite>, (1884), pp. 511-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

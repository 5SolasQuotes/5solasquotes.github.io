<blockquote><p>The religion of [the Church of Rome], at this day, is nothing but a dead image of the gospel, erected in the loss of an experience of its spiritual power, overthrowing its use, with all its ends, being suited to the taste of men, carnal, ignorant, and superstitious.</p></blockquote>

</figure><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>

</figure><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1b8f76400d" data-kw="">
<blockquote><p>And we begin with tile Ruling Elders’ place, for that carries a kind of simplicity with it: there be more ingredients required to make up the Office of Pastor and Doctor, and therefore we shall take leave to trade in the first. …

That there is such an Office and Officer appointed by Christ, as the Scriptures are plain to him, whose spirit and apprehension is not possessed and forestalled with prejudice: So this cause hath been maintained by mand of Christ’s Worthies of former, and now of latter times; and now at last, by those two famous and eminent Champions, Mr. Rutterfort [Samuel Rutherford], and Mr. Gilespy [George Gillespie].

So that we have no controversy here but with Hierarchical Persons, the force and power of whose Arguments, lies especially in a Pursuvant and a Prison, armed with Authority of an High-Commission. And therefore we shall content our selves to settle the Scriptures shortly upon their basis and bottom, according to the sense of the Spirit of God, in the several places, and dispute briefly, there-from, and so finish this Head of Discipline.

The first Argument we have from Rom. 12.7. which gives in witness to this truth, where all these officers are numbered and named expressly; if the meaning of the words be once manifested, which will be made clear in the particulars following. …

The second Argument is taken from 1 Cor. 12.28. God hath set some in his Church; as first, Apostles; then Prophets; thirdly, Teachers; after that Powers, then gifts of healing, helps, Governments. The scope of the place, and the Apostle his intendment is, to lay open the several Offices and Officers that the Lord hath set in his Church, and so many chief members, out of which the Church is constituted as an entire body. …

From which premises, the dispute issues thus: As Apostles, Prophets, and Teachers are distinct, so are Helps and Governments distinct; for the Spirit puts them in the same rank, as having a parity of reason, which appertains to them all. But they were distinct Offices, and found in persons as distinct Officers, as vers. 30. Are all Apostles? Are all Teachers? Therefore, the same is true of Governors. …

A third argument is taken from the famous place, 1 Tim. 5.17. which is full to our purpose in hand, and intended by the Holy Spirit of the Lord, to make evident the station and office of Ruling Elders, unto the end of the world; and it is admirable to observe, how the factors and followers of the Pope and Prelates, who labour to prop up their place and pre-eminency, have used all the wiliness of their wits, and unwearable wrestlings of their carnal reason, to darken the evidence of the truth, and to defeat the power of the proof in this place, as fearing, it should seem, lest by this means their way to promote and maintain the pride of Prelacy, would be utterly prejudiced and overthrown; whereas, do but suffer the Deacon to lay aside the care of the poor, make him but half a Priest, give him the allowance that he may baptize, and not give the Sacrament of the Supper; raise the Ruling-Elder one stair higher, that he may be a Teaching-Presbyter:

By this time, the Bishop is beyond the bound of an ordinary Elder, and with a little help, he will be handed up into a Diocesan Palace, and one lift more will make him a Primate; and if the Kings of the earth favour him, he will make himself a Pope presently; for they differ but in degrees, not in kind. So that you must not wonder to see the contention grow so hot touching a Ruling Elder, because if he be confined with his compass, the wings of Pope and Prelate will be exceedingly clipped, and their power impeached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the sum of church-discipline. Wherein the way of the churches of New-England is warranted out of the word, and all exceptions of weight, which are made against it, answered</cite>, (London: John Bellamy, 1648), Part 2.1, pp 8, 10, 11-12.</span></figcaption>

<blockquote><p>The sense is, not that judgment shall not pass against him but by such a number of witnesses, or that the evidence upon his trial shall consist of such a number; for this is no other than what ought to be in the case of a private member, and of every man, according to Deuteronomy 19:15. But the sense is, that the affair of an elder shall not be put upon a trial, much less sentence pass, until it has been privately proved against him, by proper testimonies, beyond all exception; only in such a case, should a church admit a charge against its elder. The reason of this rule is, because of his high office and the honour of the church, which is concerned in his, as well as of religion; for it carries in it some degree of scandal for such a person to be charged, even though he may be cleared.</p></blockquote>

<blockquote><p>In Scripture the term bishop signifies exactly the same thing as elder, whether he is only an elder or even a pastor. I will strive to confirm this from several testimonies of sacred Scripture brought forth into our midst. Titus 1:5 says, “For the sake of this matter, remain in Crete, so that you may proceed to set in order what remains there, and establish elders town-by-town.” Then, describing what sort of men they should be, he says, “it is necessary that an elder be blameless,” et cetera. In Acts 20:17ff. Paul is said to have summoned to Miletus Ephesian elders, whom he then addresses in this way: “Attend to yourselves and to the whole flock, for which the Holy Spirit has established you as elders.” Note there in passing that it is not said that they are elders because they preside over the presbytery, but because they preside over their flock.

Philippians 1:1 says, “Paul and Timothy, servants of Jesus Christ to all the saints in Christ Jesus who are at Philippi, together with the elders and deacons.” He calls bishops elders. Indeed, Chrysostom, writing on this passage, says, “What belongs to the matter of whether there were bishops of the same city? It is not,” he says, “but that those who were then elders, the same were bishops.” In 1 Peter 5:2 Peter, compelling elders, says, “Feed the flock which is in your possession, elders [ἐπισκοποῦντες].” Finally, in this passage Paul, recounting all the orders of the ministers of the Word, says nothing about bishops as different from pastors. And Ambrose observed that when he wrote on this passage. He says, “the writings of the apostle do not agree in all ways with the ordering of the church which exists now.”

What is more, no Scripture speaks or means otherwise about bishops. And daily experience teaches that this kind of men, who are ambitious and enslaved to their stomach, make shipwreck of their conscience. The antichrist introduced the origin from this foundation and human invention, as it were, which God never blessed in His Word. They appoint the bishop as overseer over the presbytery for the sake of removing schism. But is it the case that I may say nothing from contrary experience, which Gregory of Nazianzus says to this response in Oratio in Maxim? He says, “Would that there may be no prerogative of a throne! But now this right side and left and middle, superior and inferior seats and that imported custom of going before or of coming over the same rank have broken us into many parts.</p></blockquote>

— Robert Rollock, Commentary on Ephesians, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 2901-2919.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Scripture+the+term+bishop+signifies+exactly+the+same+thing+as+elder%2C+whether+he+is+only+an+elder+or+even+a+pastor.+I+will+strive+to+confirm+this+from+several+testimonies+of+sacred+Scripture+brought+forth+into+our+midst.+Titus+1%3A5+says%2C+%E2%80%9CFor+the+sake+of+this+matter%2C+remain+in+Crete%2C+so+that+you+may+proceed+to+set+in+order+what+remains+there%2C+and+establish+elders+town-by-town.%E2%80%9D+Then%2C+describing+what+sort+of+men+they+should+be%2C+he+says%2C+%E2%80%9Cit+is+necessary+that+an+elder+be+blameless%2C%E2%80%9D+et+cetera.+In+Acts+20%3A17ff.+Paul+is+said+to+have+summoned+to+Miletus+Ephesian+elders%2C+whom+he+then+addresses+in+this+way%3A+%E2%80%9CAttend+to+yourselves+and+to+the+whole+flock%2C+for+which+the+Holy+Spirit+has+established+you+as+elders.%E2%80%9D+Note+there+in+passing+that+it+is+not+said+that+they+are+elders+because+they+preside+over+the+presbytery%2C+but+because+they+preside+over+their+flock.%0A%0APhilippians+1%3A1+says%2C+%E2%80%9CPaul+and+Timothy%2C+servants+of+Jesus+Christ+to+all+the+saints+in+Christ+Jesus+who+are+at+Philippi%2C+together+with+the+elders+and+deacons.%E2%80%9D+He+calls+bishops+elders.+Indeed%2C+Chrysostom%2C+writing+on+this+passage%2C+says%2C+%E2%80%9CWhat+belongs+to+the+matter+of+whether+there+were+bishops+of+the+same+city%3F+It+is+not%2C%E2%80%9D+he+says%2C+%E2%80%9Cbut+that+those+who+were+then+elders%2C+the+same+were+bishops.%E2%80%9D+In+1+Peter+5%3A2+Peter%2C+compelling+elders%2C+says%2C+%E2%80%9CFeed+the+flock+which+is+in+your+possession%2C+elders+%5B%E1%BC%90%CF%80%CE%B9%CF%83%CE%BA%CE%BF%CF%80%CE%BF%E1%BF%A6%CE%BD%CF%84%CE%B5%CF%82%5D.%E2%80%9D+Finally%2C+in+this+passage+Paul%2C+recounting+all+the+orders+of+the+ministers+of+the+Word% <blockquote><p>This question we have handled above, [vol. 2,] part 1, bk. 3, tract 1, section 3, ch. 3, [‘Of Repudiations &amp; Divorces, by which things the Bond of Matrimony itself is Loosed’, Question 11, ‘Whether it may be allowed in marriage, or convenient, to chastise the wife with strikes?’, pp. 185-6] nor are we repeating it here.</p></blockquote>

<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>

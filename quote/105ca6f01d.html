<main class="wrap"><figure class="quote" id="q-105ca6f01d" data-kw="">
<blockquote><p>The fourth commandment enjoins the sanctification of the sabbath, which is done both by the pastors and by the flock. The pastors sanctify it by the preaching of sound doctrine — by the due administration of the sacraments — by the offering up of public prayers — by the pure and affectionate visitation of the flock committed to them. The people sanctify it by the attentive hearing of the word by public and private prayer — by reading and meditating on the sacred scriptures — by works of love by mutual exhortations — by ceasing from their ordinary and worldly occupations.

Those works are excepted, which have an immediate reference to the worship and glory of God; also works of charity and mercy, and therefore the Pharisees falsely accused Christ for healing the sick on this day; also works of necessity, imposed on us by Providence, such as preparing food, kindling fire, or defending ourselves against the attack of enemies.. We must observe further, that in this fourth commandment there is something ceremonial and something moral; the ceremonial part is the consecration of the seventh day to God, the moral is the consecration of some part of time to God; for it is a part of divine worship, to worship God in the public assemblies or congregations, which cannot be done, unless the time of meeting be agreed upon by the worshippers.

The Jews, on the sabbath day did not dare to gather the manna, to cut wood, to kindle a fire, to bake, or to seethe, &amp;c. &amp;,c. (Exod. xvi. 29. Numb. xv. 32. Exod. xxxv. 8; xvi. 23;) nay, some of the Pharisees carried their scruples so far, as not to dare even to roast an apple, to peel garlick, or to kill a gnat. Observe also, that the sabbath was a sign of the covenant between God and the Israelites, (Exod. xxxi, 13. Ezek. xx.12,) and that it shadowed forth that twofold rest of believers which they obtain in Christ; viz. their spiritual rest, which consists both in peace of conscience, and ceasing from evil works, and their heavenly rest, in which they shall be free from all their troubles, and from all sin.

Lastly, let it be observed that the [Jewish] sabbath was abolished, with other ceremonies of the law, and in the place of it succeeded the Lord’s day; which the apostles did not expressly command, but which they observed; whose example therefore the church is bound to imitate, although one day is not in itself holier than another. A more suitable day could not have been selected, than the Lord’s day, on which Christ the Redeemer of the world arose from the dead, having completed the work of our redemption; and on which the Holy Spirit was poured out upon the apostles.</p></blockquote>

<blockquote><p>8. Of the beginning and ending of the Sabbath — The first rule about time. 8. It may seem to some necessary that something should be premised concerning the measure or continuance of the day to be set apart to a holy rest to the Lord; but it being a matter of controversy, and to me, on the reasons to be mentioned afterwards, of no great importance, I shall not insist upon the examination of it, but only give my judgment in a word concerning it. Some contend that it is a natural day, consisting of twenty-four hours, beginning with the evening of the preceding day, and ending with the same of its own. And accordingly so was the church of Israel directed, Lev. 23:32, “From even unto even shall ye celebrate your Sabbath;” although that does not seem to be a general direction for the observation of the weekly Sabbath, but to regard only that particular extraordinary Sabbath which was then instituted, namely, the day of atonement, on the tenth day of the seventh month, verse 27. However, suppose it to belong also to the weekly Sabbath, it is evidently an addition to the command, particularly suited to the Mosaical pedagogy, that the day might comprise the sacrifice of the preceding evening in the services of it; from an obedience whereunto we are freed by the gospel. Neither can I subscribe to this opinion; and that because, — (1.) In the description and limitation of the first original seven days, it is said of each of the six that it was constituted of an evening and a morning, but of the day of rest there is no such description; it is only called “the seventh day,” without any assignation of the preceding evening unto it. (2.) A day of rest, according to rules of natural equity, ought to be proportioned to a day of work or labor, which God has granted to us for our own use. Now, this is to be reckoned from morning to evening: Psalm 104:20-23: “Thou makest darkness, and it is night: wherein all the beasts of the forest do creep” (from whose yelling the night has its name in the Hebrew tongue.) “The young lions roar after their prey, and seek their meat from God. The sun arises, they gather themselves together, and lay them down in their dens. Man goes forth unto his work and to his labor until the evening.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“8. Of the beginning and ending of the Sabbath — The first rule about time. 8. It may seem to some necessary that something should be premised concerning the measure or continuance of the day to be set apart to a holy rest to the Lord; but it being a matter of controversy, and to me, on the reasons to be mentioned afterwards, of no great importance, I shall not insist upon the examination of it, but only give my judgment in a word concerning it. Some contend that it is a natural day, consisting of twenty-four hours, beginning with the evening of the preceding day, and ending with the same of its own. And accordingly so was the church of Israel directed, Lev. 23:32, “From even unto even shall ye celebrate your Sabbath;” although that does not seem to be a general direction for the observation of the weekly Sabbath, but to regard only that particular extraordinary Sabbath which was then instituted, namely, the day of atonement, on the tenth day of the seventh month, verse 27. However, suppose it to belong also to the weekly Sabbath, it is evidently an addition to the command, particularly suited to the Mosaical pedagogy, that the day might comprise the sacrifice of the preceding evening in the services of it; from an obedience whereunto we are freed by the gospel. Neither can I subscribe to this opinion; and that because, — (1.) In the description and limitation of the first original seven days, it is said of each of the six that it was constituted of an evening and a morning, but of the day of rest there is no such description; it is only called “the seventh day,” without any assignation of the preceding evening unto it. (2.) A day of rest, according to rules of natural equity, ought to be proportioned to a day of work or labor, which God has granted to us for our own use. Now, this is to be reckoned from morning to evening: Psalm 104:20-23: “Thou makest darkness, and it is night: wherein all the beasts of the fore — John Owen, An Exposition of the Epistle to the Hebrews, 4 vols. (London: Tegg, 1840), vol. 1, Exercitation 40, Practical Observance of the Lord’s Day, pp. 736-37">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C8.+Of+the+beginning+and+ending+of+the+Sabbath+%E2%80%94+The+first+rule+about+time.+8.+It+may+seem+to+some+necessary+that+something+should+be+premised+concerning+the+measure+or+continuance+of+the+day+to+be+set+apart+to+a+holy+rest+to+the+Lord%3B+but+it+being+a+matter+of+controversy%2C+and+to+me%2C+on+the+reasons+to+be+mentioned+afterwards%2C+of+no+great+importance%2C+I+shall+not+insist+upon+the+examination+of+it%2C+but+only+give+my+judgment+in+a+word+concerning+it.+Some+contend+that+it+is+a+natural+day%2C+consisting+of+twenty-four+hours%2C+beginning+with+the+evening+of+the+preceding+day%2C+and+ending+with+the+same+of+its+own.+And+accordingly+so+was+the+church+of+Israel+directed%2C+Lev.+23%3A32%2C+%E2%80%9CFrom+even+unto+even+shall+ye+celebrate+your+Sabbath%3B%E2%80%9D+although+that+does+not+seem+to+be+a+general+direction+for+the+observation+of+the+weekly+Sabbath%2C+but+to+regard+only+that+particular+extraordinary+Sabbath+which+was+then+instituted%2C+namely%2C+the+day+of+atonement%2C+on+the+tenth+day+of+the+seventh+month%2C+verse+27.+However%2C+suppose+it+to+belong+also+to+the+weekly+Sabbath%2C+it+is+evidently+an+addition+to+the+command%2C+particularly+suited+to+the+Mosaical+pedagogy%2C+that+the+day+might+comprise+the+sacrifice+of+the+preceding+evening+in+the+services+of+it%3B+from+an+obedience+whereunto+we+are+freed+by+the+gospel.+Neither+can+I+subscribe+to+this+opinion%3B+and+that+because%2C+%E2%80%94+%281.%29+In+the+description+and+limitation+of+the+first+original+seven+days%2C+it+is+said+of+each+of+the+six+that+it+was+constituted+of+an+evening+and+a+morning%2C+but+of+the+day+of+rest+there+is+no+such+description%3B+it+is+only+called+%E2%80%9Cthe+seventh+day%2C%E2%80%9D+without+any+assignation+of+the+preceding+evening+unto+it.+%282.%29+A+day+of+rest%2C+according+to+rules+of+natural+equity%2C+ought+to+be+proportioned+to+a+day+of+work+or+labor%2C+which+God+has+granted+to+us+for+our+own+use.+Now%2C+this+is+to+be+reckoned+from+morning+to+evening%3A+Psalm+104%3A20-23%3A+%E2%80%9CThou+makest+darkness%2C+and+it+is+night%3A+wherein+all+the+beasts+of+the+forest+do+creep%E2%80%9D+%28from+whose+yelling+the+night+has+its+name+in+the+Hebrew+tongue.%29+%E2%80%9CThe+young+lions+roar+after+their+prey%2C+and+seek+their+meat+from+God.+The+sun+arises%2C+they+gather+themselves+together%2C+and+lay+them+down+in+their+dens.+Man+goes+forth+unto+his+work+and+to+his+labor+until+the+evening.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+4+vols.+%28London%3A+Tegg%2C+1840%29%2C+vol.+1%2C+Exercitation+40%2C+Practical+Observance+of+the+Lord%E2%80%99s+Day%2C+pp.+736-37&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44716ae32d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44716ae32d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-day/the-whole-lords-day-is-sanctified/#:~:text=8.%20Of%20the%20beginning%20and%20ending,to%20his%20labor%20until%20the%20evening&amp;text=8.%20Of%20the%20beginning%20and%20ending%20of%20the&amp;text=work%20and%20to%20his%20labor%20until%20the%20evening" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)</p></blockquote>

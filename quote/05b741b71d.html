<main class="wrap"><figure class="quote" id="q-05b741b71d" data-kw="">
<blockquote><p>Concerning this preservation of the elect to salvation and the true perseverance of faith in the faithful, they can be certain according to the measure of faith, which they believe makes them true and enduring members of the Church, having forgiveness of sins and eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, pp. 142-45, 171-75 Latin | CXXXIX. From the doctrine of these British theologians, whose views influenced the drafting of the Canons of the Synod of Dort and whose judgment was included in the Synod’s Acts, one can infer how justified the learned man is who critiques my theses for presenting the Synod’s words as if it had determined that the assurance believers have of their grace and personal salvation is of the same nature, firmness, and necessity as the divine faith with which we assent to the immediately revealed articles of faith. The learned man draws this conclusion from the words found in the fifth chapter on doctrine, article nine, which states:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-bc95880ead" data-kw="">
<blockquote><p>XXXVI. As the certainty of perseverance is the consolation of the laboring, not the mother of security… since it can be granted only to those walking in the path of holiness… This is properly the fruit of the soul confirmed in the Lord and of the exercised senses. Therefore those who are not as yet confirmed must press forward by degrees and perceptibly in the ways of the Lord… XXXVII… Such is the holy security of the pious, which not only does not exclude watchfulness and the desire for piety, but necessarily supposes them as the certain means of their own preservation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, ed. James Dennison, Jr. (Presbyterian &amp; Reformed, 1994), vol. 2, 15th Topic, question 17, ‘Whether the believer can and ought to be certain of his faith and justification by a divine and not merely conjectural certainty. We affirm…’ | sections 36-37</cite>, pp. 630-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-7e99baf610" data-kw="">

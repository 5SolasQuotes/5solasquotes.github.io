<main class="wrap"><figure class="quote" id="q-70355f7689" data-kw="">
<blockquote><p>The scope of the apostle is to illustrate the doctrine of justification he had before treated of. The substance of which consisted in this, that Christ, in virtue of the covenant of grace, accomplished all righteousness for his chosen covenant people, so that the obedience of Christ is placed to their charge, and they, on account thereof, are no less absolved from the guilt and dominion of sin, than if they themselves had done and suffered in their own person, what Christ did and suffered for them.

He declares that in this respect, Adam was the type of Christ, namely, as answering to him. It is therefore necessary, that the sin of Adam, in virtue of the covenant of works, be so laid to the charge of his posterity, who were comprised with him in the same covenant that, on account of the demerit of his sin, they are born destitute of original righteousness, and obnoxious to every kind of death, as much as if they themselves, in their own persons, had done what Adam did. Unless we suppose this to be Paul’s doctrine, his words are nothing but mere empty sound.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank (1677; 2 vols, London: R. Baynes, 1822), i, p. 147, 1.8.31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

He declares that in this respect, Adam was the type of Christ, namely, as answering to him. It is therefore necessary, that the sin of Adam, in virtue of the covenant of works, be so laid to the charge of his posterity, who were comprised with him in the same covenant that, on account of the demerit of his sin, they are born destitute of original righteousness, and obnoxious to every kind of death, as much as if they themselves, in their own persons, had done what Adam did. Unless we suppose this to be Paul’s doctrine, his words are nothing but mere empty sound.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eae9c4d386" data-kw="">

</figure><figure class="quote" id="q-d46ead5565" data-kw="">
<blockquote><p>When the world was lost by the one sin of Adam, the grace of Christ has not only abolished this sin and the death which it introduced, but also has at the same time taken away those endless sins… and brought as many as are of Christ into full justification; so that God has now not only forgiven them the sins both of Adam and of themselves, etc., but has at the same time given his Spirit of solid and perfect justice, to conform us to the image of the First-begotten. ‘Justification’ here occurs, which, as it is opposed to ‘condemnation,’ so it signifies properly that justification by which God absolves from all sins those that are Christ’s… and because he means a full justification, the perfect bestowal of justice is also contained in this justification; for it [justification] will then at length be consummated when along with sin, the last enemy, death, shall also have been destroyed, and the saints shall have been filled with every fruit of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 | On Rom. 5:16, Observation 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>It is entirely by the intervention of Christ’s righteousness that we obtain justification before God. This is equivalent to saying that man is not just in himself, but that the righteousness of Christ is communicated to him by imputation, while he is strictly deserving of punishment.</p></blockquote>

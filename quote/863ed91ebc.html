<main class="wrap"><figure class="quote" id="q-863ed91ebc" data-kw="family">
<blockquote><p>Just as one who truly and deeply loves any father of a family at the same time embraces his whole household with love and good will, so it becomes us in like measure to show to his people, to his family, and lastly, to his inheritance, the same zeal and affection that we have toward this Heavenly Father. For he so honored these as to call them the fullness of his only-begotten Son [Eph. 1:23]. Let the Christian man, then, conform his prayers to this rule in order that they may be in common and embrace all who are his brothers in Christ, not only those whom he at present sees and recognizes as such but all men who dwell on earth. For what God has determined concerning them is beyond our knowing except that it is no less godly than humane to wish and hope the best for them. Yet we ought to be drawn with a special affection to those, above others, of the household of faith, whom the apostle has particularly commended to us in everything [Gal. 6:10].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>

</figure><figure class="quote" id="q-38c81dd10b" data-kw="">
<blockquote><p>The first petition is that God&#x27;s name be hallowed [Matt. 6:9]; the need for it is associated with our great shame. For what is more unworthy than for God&#x27;s glory to be obscured partly by our ungratefulness, partly by our ill will, and so far as lies in our power, destroyed by our presumption and insane impudence? Though all ungodly men should break out with their sacrilegious license, the holiness of God&#x27;s name still shines. The prophet justifiably proclaims: &quot;As thy name, O God, so thy praise unto all the ends of the earth&quot; [Ps. 48:10]. For wherever God becomes known, his powers cannot fail to be manifested; might, goodness, wisdom, righteousness, mercy, truth—these should captivate us with wonderment for him, and impel us to celebrate his praise. Because, therefore, God&#x27;s holiness is so unworthily snatched from him on earth, if it is not in our power to assert it, at least we are bidden to be concerned for it in our prayers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.41</span></figcaption>

</figure><figure class="quote" id="q-4aa74a5e2c" data-kw="Spirit of grace and of supplications">
<blockquote><p>The Spirit promised here is the Spirit of God, &#x27;the Holy Spirit,&#x27; with respect to the special end for which he is promised. And the manner of his administration, in the accomplishment of the promise, is expressed by, &#x27;I will pour out.&#x27; The same word is used for the same purpose in Eze 39.29, and Joel 2.28, as other words of the same importance are also, which we render &#x27;pouring out,&#x27; such as Pro 1.23; Isa 32.15, 44.3, 52.15. … What is intended in this, is a plentiful dispensation of him to the end for which he is promised, with respect to a singular and eminent degree in his operations. The apostle expresses this word, or the accomplishment of what is promised in it, by Tit 3.6, &#x27;he has richly&#x27; or abundantly &#x27;poured out his Spirit.&#x27; Therefore, what is intended is not a mere grant and communication of the Spirit, but a plentiful effusion of him; which must have some eminent effects as pledges and tokens of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Work of the Holy Spirit in Prayer</cite></span></figcaption>

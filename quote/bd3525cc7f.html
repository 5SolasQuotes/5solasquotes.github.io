<main class="wrap"><figure class="quote" id="q-bd3525cc7f" data-kw="">
<blockquote><p>It is customary to consider this repentance in two ways: either as a spiritual disposition poured into our hearts by the Holy Spirit, or as an action from us that proceeds from that disposition. In the first way, it is properly speaking and in its strict sense called regeneration; in the second way, it is called repentance, taken in a more restricted sense, or penitence. And when the two are taken together it is called the circumcision of the heart, the conversion to God, the renewal of the Spirit, the sanctification of man, the new creation, and the first resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, tr. Reimer Faber, ed. Henk van den Belt (Brill, 2016), Disputation 32, ‘On Repentance’, section 2, p. 277</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e1c22f3fc" data-kw="">
<blockquote><p>So this acceptance or reception of Christ tendered is called ‘regeneration’ (Jn. 1:13 &amp; 3:3, 5-6; 1 Pet 1:23 &amp; 2:2; 1 Jn. 3:9) and ‘renovation’ (Tit. 3:5) as it is a beginning of new life, and ‘conversion’ (Acts 26:17-18; 1 Pet. 2:8-9) inasmuch as they that obey the divine call are turned from darkness to light and from the power of Satan unto God. This reception of Christ tendered is twofold: viz. passive and active. (1) Passive, when God apprehends the sinner, infusing into his soul habits, principles, seeds of faith, repentance, grace, etc. whereby the dark mind is enlightened, the dead heart is quickened, the unwilling will is made willing, etc. Phil. 3:11; Eph. 1:17; 2 Cor. 4:6; Jn. 6:44; Eph. 2:1, 5; Phil. 2:13. This is properly, regeneration, renovation, new-creation, habitual sanctification, Tit. 3:5; 2 Cor. 5:17; 1 Cor. 6:11; 1 Pet. 1:2; Eph. 2:10. This mighty work of grace upon the heart and will of the sinner is not upon the will or heart either as a free agent or as a natural patient, but in regard of that obediential disposition wherein it stands to God’s Almighty power, which it cannot but obey and yield unto, coming to anything whereunto He will bring it, powerfully and efficaciously, Phil. 2:13; Jn. 6:44; Eph. 2:8. (2) Active, when the mind, will and heart of a sinner thus apprehended, qualified and principled by God, through his assistant and co-operating grace does accept Jesus Christ by faith, fiducially resting and relying upon Christ alone, and upon God in Him for life and salvation, Jn. 6:37, 44 &amp; 3:15-16; 1 Pet. 1:21. And as the soul by faith turns to Christ as his chief good: so by repentance it also turns from sin as the chief evil, inconsistent with that good. Hence, faith and repentance are linked together in Scripture as two inseparable twin graces, Mk. 1:15; Acts 19:4. And as faith, so true repentance is the mere gift of God, Acts 11:18; 2 Tim. 2:25. But of the nature both of faith and repentance, I have spoken heretofore: there see (in bk. 3, ch. 3, aphorism 5, quest. 1-7; in bk. 3, ch. 4, aphorism 4, §2, p. 896, etc. and in my Communicant Instructed, p. 127, etc.). And thus the sinner is savingly brought by Christ into his New Covenant.</p></blockquote>

_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a55cb0496e" data-kw="">
<blockquote><p>That other [term] of ‘regeneration’, I take to be all one with spiritual life, taken in the largest sense; which life, according to the Scriptures, I distinguish into initial and actual. For as in the natural, sometimes the soul, which is usually called ‘the form by which’, and sometimes the esse, the ‘being’ itself of such or such a creature animated by his soul, is put for life, as that learned [Jerome] Zanchi well observes (Of the Nature of God, bk. 2, ch. 5, question 1): so is it in the spiritual life whereof we are now to treat. And upon this foundation it is that we rightly build our present distinction, which has clear footing also in the sacred volumes of eternal truth.

1. Initial (which we may also term seminal or potential life), I call that which consists in participation of the Spirit of Christ, as the form of this spiritual life: the Spirit being the first principle of regeneration, by whom the first seed and foundation thereof is laid in a Christian. And this is life as it were in the root, like unto the first principles of reason laid up in the rational soul, before it has actually enabled the body to move and act rationally. And of this, says acute [Francis] Junius (Of Paedobaptism, thesis 7), our Savior spake in Jn. 3; more clearly to our purpose is that of the apostle, Rom. 8:10, “The Spirit is life, because of righteousness,” where the Spirit, which is the cause of life, is put for life itself: and by ‘the Spirit’ is meant not the reasonable soul, but the Holy Ghost; if Calvin (and before him Chrysostom and Ambrose, and after him Peter Martyr) hit right in the exposition of it,¹ whereof for my part (after serious pensitation of all that any have said to carry it to another sense) I make no question. ¹ Galatians, in location: Vocabulo spiritus ne animam nostram intelligas, sed regenerationis spiritum quem vitam appellat Paulus. [By the term ‘spirit’, understand not our soul, but the Spirit of regeneration, which Paul calls life.]

2. Actual, I call that which consists properly in the very spiritual being itself actually produced in a Christian, by the Spirit bringing him forth a new man in Christ, in the ordinary course of regeneration of such as live to years, whereby he is enabled actually to believe, repent, etc. Rom. 6:11, “Likewise ye, reckon yourselves to be dead indeed unto sin: but alive unto God through Jesus Christ our Lord.” So Gal. 2:20 and elsewhere.</p></blockquote>

in+the+exposition+of+it%2C%C2%B9+whereof+for+my+part+%28after+serious+pensitation+of+all+that+any+have+said+to+carry+it+to+another+sense%29+I+make+no+question.+%C2%B9+Galatians%2C+in+location%3A+Vocabulo+spiritus+ne+animam+nostram+intelligas%2C+sed+regenerationis+spiritum+quem+vitam+appellat+Paulus.+%5BBy+the+term+%E2%80%98spirit%E2%80%99%2C+understand+not+our+soul%2C+but+the+Spirit+of+regeneration%2C+which+Paul+calls+life.%5D+2.+Actual%2C+I+call+that+which+consists+properly+in+the+very+spiritual+being+itself+actually+produced+in+a+Christian%2C+by+the+Spirit+bringing+him+forth+a+new+man+in+Christ%2C+in+the+ordinary+course+of+regeneration+of+such+as+live+to+years%2C+whereby+he+is+enabled+actually+to+believe%2C+repent%2C+etc.+Rom.+6%3A11%2C+%E2%80%9CLikewise+ye%2C+reckon+yourselves+to+be+dead+indeed+unto+sin%3A+but+alive+unto+God+through+Jesus+Christ+our+Lord.%E2%80%9D+So+Gal.+2%3A20+and+elsewhere.%E2%80%9D%0A%0A%E2%80%94+Cornelius+Burges%2C+Baptismal+Regeneration+of+Elect+Infants+Professed+by+the+Church+of+England%2C+...+%28Oxford%3A+Curteyn%2C+1629%29%2C+ch.+2%2C+pp.+14-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa55cb0496e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a55cb0496e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/regeneration#:~:text=That%20other%20%5Bterm%5D%20of%20%E2%80%98regeneration%E2%80%99%2C%20I,Lord.%E2%80%9D%20So%20Gal.%202%3A20%20and%20elsewhere&amp;text=That%20other%20%5Bterm%5D%20of%20%E2%80%98regeneration%E2%80%99%2C%20I%20take%20to&amp;text=Christ%20our%20Lord.%E2%80%9D%20So%20Gal.%202%3A20%20and%20elsewhere" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assertion 1: In the first moment of our conversion, called actus primus conversionis, we are mere patients.

1. Because the infusion of the new heart, Eze. 36:26, the pouring of the Spirit of Grace and supplication on the family of David, Zech. 12:10, and of the Spirit on the thirsty ground, Isa. 44:3, is a work of creation, Eph. 2:10; Ps. 51:10, a quickening of the dead, Eph. 2:1-4; Jn. 5:25; 2 Cor. 4:6, and the wilderness is not here a co-agent for the causing roses to blossom out of the earth.

2. The effect is not wholly denied of the collateral cause and ascribed wholly to another. If Peter and John draw a ship between them, with joint strength, you cannot say the one drew the ship, not the other: But Christ said flesh and blood makes no revelations of Christ, but his Father only, Mt. 16:17; 11:25-27; Jm. 1:18; Jn. 1:18. Then neither blood, nor the will of man contribute any active influence to the first framing of the new birth; nor can clay divide the glory of regeneration with the God of grace who makes all things new. … Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the Person is said to come to the saints and to dwell with them, and to be in them, Jn. 14:16-17; and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father’; not that the Holy Ghost, in proper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwells in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will and affections. I prove the former part: 1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinful omission of the acts of faith, love, praying, rejoicing, could not be more imputed to saints as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willful pilot who of purpose dashed the vessel on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernatural acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop. …

3. The third [erroneous] way is that free-will is said to believe, repent, love God, by a mere extrinsical denomination, because it carries that grace which formally and only does perform all these supernatural actions; so grace does all and free-will is a mere patient that confers no vital subordinate and active influence in these acts; as we say, the apothecaries’ glass heals the wound, because the oil in the glass works the cure, when the glass does actively contribute nothing to the cure; or the ass makes rich, when it carries the gold that enriches only; this sense Antinomians hold forth and make us mere patients and blocks in the way to heaven, and this sense Jesuits, especially Martinez de Ripald, falsely charges upon Luther and Calvin; and the Council of Trent, inspired with the same lying spirit, says the same.

4. The fourth [and correct] sense is that grace and free-will does work so as grace is the principal, first inspiring and fountain cause: 1. It being a new supernatural disposition and habit in the soul, Jn. 14:23; 1 Jn. 2:27; 3:9; Jn. 4:14; Isa. 44:3-4; Eze. 36:26-27; Dt. 30.6; a good treasure or stock of grace, Mt. 12:35; Lk. 6:45. And also actually it determines, sweetly inclines and stirs the will to these acts; yet so as free-will moves actively, freely, and confers a radical, vital and subordinate influence and is not a mere patient in all these, as Antinomians dream, Ps. 119:32. ‘I will run the way of thy commandments, when thou shall enlarge my heart,’ Jn. 14:12, ‘he that believeth in Me, the works that I do, he shall do, and greater than these,’ Mt. 12:50, ‘He that does the will of my heavenly Father, the same is my brother,’ etc. 1 Cor. 9:24, ‘So run that ye may obtain,’ Rev. 2:2, ‘I know thy works and thy labour,’ 1 Thess. 1:3, ‘Remembering without ceasing your work of faith and labor of love, and patience of hope:’ 1. We are not dead in supernatural works, and mere blocks, Rom. 6:11, ‘We are alive unto God in Jesus Christ,’ Eph. 2:1, ‘He hath quickened us,’ Rev. 2:3, ‘For my name’s sake thou hast laboured, and had not fainted,’ 1 Cor. 15:58, ‘Be ye steadfast, unmoveable, always abundant in the work of the Lord.’ There is activity in the Spirit to lust against the flesh, Gal. 5:17; Rom. 7:15. Nor is the blessedness of the saints only passive in receiving: though to be justified and receive Christ’s righteousness be the fountain blessedness, Ps. 32:1; Rom. 4:6-7; Gal. 3:13. But the Scripture speaks of a true and solid blessedness in action, Ps. 119:1, ‘Blessed are the undefiled in the way,’ Isa. 56:2, ‘Blessed is the man that doth this,’ Jm. 1:12, ‘Blessed is the man that endureth temptation,’ Ps. 119:2, ‘Blessed are they that keep his testimonies,’ Ps. 106:3, ‘Blessed are they that keep judgment, Rev. 22:14, ‘Blessed are they that do his commandments, Mt. 5, ‘Blessed are they that mourn, that hunger and thirst;‘ Then there must be a part of blessedness in sanctification, as in justification; though the one be the cause, the other the effect.</p></blockquote>

ts+and+saving+graces%2C+and+supernatural+qualities+created+in+us+by+the+Holy+Spirit+and+acted%2C+excited+and+moved+as+supernatural+and+heavenly+habits+to+act+with+the+vital+influence+of+our+understanding%2C+will+and+affections.+I+prove+the+former+part%3A+1.+Because+such+a+union+of+the+Person+of+the+Holy+Ghost+in+us%2C+believing%2C+loving%2C+joying%2C+praying+and+immediately+in+us%2C+were+that+blasphemous+deifying+and+Goding+of+the+saints%2C+so+as+believing%2C+loving%2C+praying+were+not+our+works%2C+but+the+immediate+acts+of+the+Holy+Ghost%2C+and+either+the+faint+manner+of+believing%2C+or+the+cold+slacked+loving%2C+and+praying+of+saints%2C+or+their+not+believing%2C+and+sinful+omission+of+the+acts+of+faith%2C+love%2C+praying%2C+rejoicing%2C+could+not+be+more+imputed+to+saints+as+their+sinful+defects+and+transgressions+%28but+must+be+laid+on+the+Holy+Ghost%E2%80%99s+score%29+than+we+can+impute+the+splitting+of+a+ship+to+the+ship+itself+and+not+to+the+negligent+and+willful+pilot+who+of+purpose+dashed+the+vessel+on+a+rock%3B+but+we+must+not+in+reason+blame+the+ship%2C+but+the+pilot%3B+for+the+loss+of+the+ship+is+the+only+and+proper+fault+of+the+man+that+stirred+the+ship%2C+and+the+ship+is+innocent+and+harmless+timber%3A+Now+what+sin+can+be+in+the+saints+in+these+supernatural+acts%2C+if+the+Holy+Ghost+immediately+in+his+own+Person+stir+the+helm%2C+and+only%2C+without+us%2C+act+these+in+us%3F+We+might+with+as+good+reason+say+the+shop+that+a+man+works+in+does+make+the+portrait%2C+which+is+a+great+untruth%2C+since+the+artificer+in+the+shop+does+it%E2%96%AA+as+say+that+the+saints+do+pray%2C+believe%2C+rejoice%2C+if+the+Holy+Ghost+immediately+do+all+these+in+them%2C+as+in+a+shop.+%E2%80%A6+3.+The+third+%5Berroneous%5D+way+is+that+free-will+is+said+to+believe%2C+repent%2C+love+God%2C+by+a+mere+extrinsical+denomination%2C+because+it+carries+that+grace+which+formally+and+only+does+perform+all+these+supernatural+actions%3B+so+grace+does+all+and+free-will+is+a+mere+patient+that+confers+no+vital+subordinate+and+active+influence+in+these+acts%3B+as+we+say%2C+the+apothecaries%E2%80%99+glass+heals+the+wound%2C+because+the+oil+in+the+glass+works+the+cure%2C+when+the+glass+does+actively+contribute+nothing+to+the+cure%3B+or+the+ass+makes+rich%2C+when+it+carries+the+gold+that+enriches+only%3B+this+sense+Antinomians+hold+forth+and+make+us+mere+patients+and+blocks+in+the+way+to+heaven%2C+and+this+sense+Jesuits%2C+especially+Martinez+de+Ripald%2C+falsely+charges+upon+Luther+and+Calvin%3B+and+the+Council+of+Trent%2C+inspired+with+the+same+lying+spirit%2C+says+the+same.+4.+The+fourth+%5Band+correct%5D+sense+is+that+grace+and+free-will+does+work+so+as+grace+is+the+principal%2C+first+inspiring+and+fountain+cause%3A+1.+It+being+a+new+supernatural+disposition+and+habit+in+the+soul%2C+Jn.+14%3A23%3B+1+Jn.+2%3A27%3B+3%3A9%3B+Jn.+4%3A14%3B+Isa.+44%3A3-4%3B+Eze.+36%3A26-27%3B+Dt.+30.6%3B+a+good+treasure+or+stock+of+grace%2C+Mt.+12%3A35%3B+Lk.+6%3A45.+And+also+actually+it+determines%2C+sweetly+inclines+and+stirs+the+will+to+these+acts%3B+yet+so+as+free-will+moves+actively%2C+freely%2C+and+confers+a+radical%2C+vital+and+subordinate+influence+and+is+not+a+mere+patient+in+all+these%2C+as+Antinomians+dream%2C+Ps.+119%3A32.+%E2%80%98I+will+run+the+way+of+thy+commandments%2C+when+thou+shall+enlarge+my+heart%2C%E2%80%99+Jn.+14%3A12%2C+%E2%80%98he+that+believeth+in+Me%2C+the+works+that+I+do%2C+he+shall+do%2C+and+greater+than+these%2C%E2%80%99+Mt.+12%3A50%2C+%E2%80%98He+that+does+the+will+of+my+heavenly+Father%2C+the+same+is+my+brother%2C%E2%80%99+etc.+1+Cor.+9%3A24%2C+%E2%80%98So+run+that+ye+may+obtain%2C%E2%80%99+Rev.+2%3A2%2C+%E2%80%98I+know+thy+works+and+thy+labour%2C%E2%80%99+1+Thess.+1%3A3%2C+%E2%80%98Remembering+without+ceasing+your+work+of+faith+and+labor+of+love%2C+and+patience+of+hope%3A%E2%80%99+1.+We+are+not+dead+in+supernatural+works%2C+and+mere+blocks%2C+Rom.+6%3A11%2C+%E2%80%98We+are+alive+unto+God+in+Jesus+Christ%2C%E2%80%99+Eph.+2%3A1%2C+%E2%80%98He+hath+quickened+us%2C%E2%80%99+Rev.+2%3A3%2C+%E2%80%98For+my+name%E2%80%99s+sake+thou+hast+laboured%2C+and+had+not+fainted%2C%E2%80%99+1+Cor.+15%3A58%2C+%E2%80%98Be+ye+steadfast%2C+unmoveable%2C+always+abundant+in+the+work+of+the+Lord.%E2%80%99+There+is+activity+in+the+Spirit+to+lust+against+the+flesh%2C+Gal.+5%3A17%3B+Rom.+7%3A15.+Nor+is+the+blessedness+of+the+saints+only+passive+in+receiving%3A+though+to+be+justified+and+receive+Christ%E2%80%99s+righteousness+be+the+fountain+blessedness%2C+Ps.+32%3A1%3B+Rom.+4%3A6-7%3B+Gal.+3%3A13.+But+the+Scripture+speaks+of+a+true+and+solid+blessedness+in+action%2C+Ps.+119%3A1%2C+%E2%80%98Blessed+are+the+undefiled+in+the+way%2C%E2%80%99+Isa.+56%3A2%2C+%E2%80%98Blessed+is+the+man+that+doth+this%2C%E2%80%99+Jm.+1%3A12%2C+%E2%80%98Blessed+is+the+man+that+endureth+temptation%2C%E2%80%99+Ps.+119%3A2%2C+%E2%80%98Blessed+are+they+that+keep+his+testimonies%2C%E2%80%99+Ps.+106%3A3%2C+%E2%80%98Blessed+are+they+that+keep+judgment%2C+Rev.+22%3A14%2C+%E2%80%98Blessed+are+they+that+do+his+commandments%2C+Mt.+5%2C+%E2%80%98Blessed+are+they+that+mourn%2C+that+hunger+and+thirst%3B%E2%80%98+Then+there+must+be+a+part+of+blessedness+in+sanctification%2C+as+in+justification%3B+though+the+one+be+the+cause%2C+the+other+the+effect.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%E2%80%A6+%28London%2C+1647%29%2C+pp.+464-65+%26+470-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec223b0914.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ec223b0914.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Assertion%201%3A%20In%20the%20first%20moment,the%20cause%2C%20the%20other%20the%20effect&amp;text=Assertion%201%3A%20In%20the%20first%20moment%20of%20our&amp;text=one%20be%20the%20cause%2C%20the%20other%20the%20effect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8d7e9a9d55" data-kw="">
<blockquote><p>Question: ‘Who are they who are to believe God shall give them a new heart?’ Answer: No man is positively to believe it while God work it in Him, for no man is to believe that he is predestinated to glory while he first have the effects thereof in him, ‘the hid Manna’, ‘the white Stone’, ‘the new Name’. But no man is to despair or to create fatal inferences that he is reprobate, since God begins kindly with him with a Gospel call.</p></blockquote>

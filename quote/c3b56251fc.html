<blockquote><p>Reply Obj. 2: The end, insofar as it pre-exists in the intention, pertains to the will, as stated above (A1, ad1). And it is thus that it gives the species to the human or moral act. Reply Obj. 3: One and the same act, insofar as it proceeds once from the agent, is ordained to but one proximate end, from which it has its species: but it can be ordained to several remote ends, of which one is the end of the other. It is possible, however, that an act which is one in respect of its natural species, be ordained to several ends of the will: thus this act to kill a man, which is but one act in respect of its natural species, can be ordained, as to an end, to the safeguarding of justice, and to the satisfying of anger: the result being that there would be several acts in different species of morality: since in one way there will be an act of virtue, in another, an act of vice. For a movement does not receive its species from that which is its terminus accidentally, but only from that which is its per se terminus. Now moral ends are accidental to a natural thing, and conversely the relation to a natural end is accidental to morality. Consequently there is no reason why acts which are the same considered in their natural species, should not be diverse, considered in their moral species, and conversely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 of 2, quest. 100</cite>, quest. 1, art. 3, ‘Whether human acts are specified by their end? [Yes]’</span></figcaption>

</figure><figure class="quote" id="q-79a16d5352" data-kw="">
<blockquote><p>Also this power is given to certain ends: and if it be used against those ends, so that either the ends or that means must be forsaken, it is easy to see that it is means and not the ends. For the means are not always the same, God having [a] store [of means] if any one fail. Especially the means is of positive morality and the ends [are] of natural morality: For when two duties come together, and both cannot be chosen, the choosing of the less (which must give place to the greater) is a sin: and positives are less (caeteris paribus [all things being equal]) than naturals: And the substantials of positives [are] more necessary than the circumstantials:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 83-84</span></figcaption>

</figure><figure class="quote" id="q-5e0e2b277e" data-kw="">
<blockquote><p>Study moderation in all things: Let not Christian prudence pass with you for wisdom of the flesh, nor Christian moderation for Laodicean lukewarmness. ‘Let your moderation be known to all men;’ let it be visible and apparent, both in your passions, opinions and discourses. 1st. Moderate your affections, let not wildfire take the place of zeal, nor zeal turn passionate, pickish, peevish and bitter… Nor does the wrath of man work the righteousness of God. 2ly. Be moderate in your opinions: This moral idol of the mind (opinion) is too apt to be adored and oversway. Put a temper to it and hang a balance upon it, to keep it in poise and course; for true is that in common experience, though a fallacy indeed, that opinio est veritate major. And for moderation in opinion, study well: (1) Your fallibility and aptness to mistake, and consequently to dwell in a constant self-jealousy and suspicion. We like not to allow of fluctuating and Pyrronian doubting about necessary and vital points, nor to hang all opinions either (like Mahomed’s tomb between the two loadstones) in an aequilibrio. Yet too much confidence in matters of mere opinion is oft a vanity, refuted sufficiently by the new discoveries time and industry produces, compelling us to alter. But what one thing does contribute more to beget and continue ruptures than conceit and idolizing of self-wisdom and self-opinion, with an undervaluing of all that differ from us, while yet (perhaps) they may hit nearer the mark of truth than we, and have better advantages to discover it than we? (2) Study self-reflection, to consider how oft ye have found in time your (once confident) opinions to have failed you, that you have been necessitated to change and take up new measures. And this will help you to much moderation, experience being the schoolmaster of very fools. (3) Be moderate in your discourses; how are some’s tongues dipped in gall and set on fire of Hell! and instead of edifying communication that may minister grace to the hearers, little other than rigid censuring and bitter backbiting of one another! O when shall our tongue be our glory, not our shame! but to bridle the intemperacy of the tongue, study to speak nothing but what God may hear, and as in his hearing; speak of others as of yourselves; and this will make you speak sparingly, charitably and with due moderation. And were tongues once well governed, and that unruly evil tamed, no doubt but differences would soon diminish. Let your moderation then in all things be known to all men, the Lord is at hand. Moderation in our way is like the symmetry in the humors of the body, which keeps all in health and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 154-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>

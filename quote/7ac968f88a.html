<main class="wrap"><figure class="quote" id="q-7ac968f88a" data-kw="">
<blockquote><p>But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London: Cockerill, 1681), p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-22b749b35a" data-kw="">
<blockquote><p>All friends, brothers, and equals that are endowed with greater grace, experience and knowledge – to the extent that they provide us with good and just counsel from God’s Word – must be acknowledged as our superiors. If David had rejected Abigail’s advice and suggestion in pushing him away from disproportionate vengeance, he would have also rejected God’s counsel and sinned against the fifth commandment of the Decalogue no less than if the supreme priest or prophet of God had commanded that same thing, according to his prophetic authority, which Abigail had only urged privately.</p></blockquote>

</figure><figure class="quote" id="q-322c200def" data-kw="">
<blockquote><p>Controversy 3 – Did the first reformers, Luther, Calvin and others, have a legitimate calling? We affirm against the Papists. Arguments 1. They were qualified, called by the Church, approved by the magistrate, and, originally, appointed by the Roman Church itself to teach. Objections 1. Then the Roman Church is a true Church. Reply: Originally, it was, and later it became impure, however, it did perform this according to the Word of God, that it called ministers. 2. They were not confirmed by bishops following the ordinary rituals. Reply: It was not necessary. But their calling can be called extraordinary: a. Insofar as God gave them extraordinary gifts. b. From an extraordinary impulse of the Holy Spirit. c. Insofar as God used them for an extraordinary work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 16, ‘The Church’, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy 3 – Did the first reformers, Luther, Calvin and others, have a legitimate calling? We affirm against the Papists. Arguments 1. They were qualified, called by the Church, approved by the magistrate, and, originally, appointed by the Roman Church itself to teach. Objections 1. Then the Roman Church is a true Church. Reply: Originally, it was, and later it became impure, however, it did perform this according to the Word of God, that it called ministers. 2. They were not confirmed by bishops following the ordinary rituals. Reply: It was not necessary. But their calling can be called extraordinary: a. Insofar as God gave them extraordinary gifts. b. From an extraordinary impulse of the Holy Spirit. c. Insofar as God used them for an extraordinary work.”

</figure><figure class="quote" id="q-edae9b0d42" data-kw="">
<blockquote><p>But a woman in no case is capable of administrating baptism or the Lord’s Supper, except she were extraordinarily and immediately inspired to be a prophetess… 2. There is no such moral necessity of the sacraments as there is of the ministry of the Word, and consequently of some use of the keys where a scandalous person may infect the Lord’s flock. For where vision ceases the people perish, but it is never said, where baptism ceases the people perish; and therefore uncalled ministers in case of necessity, without ordination or calling from a presbytery, may preach and take on them the holy ministry and exercise power of jurisdiction, because the necessity of the souls of a congregation in a remote island requires so, but I hope no necessity in any [of] the most extraordinary case requires that a midwife may baptize, or that a private man remaining a private man may celebrate the Lord’s Supper to the Church without any calling from the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 454-455</span></figcaption>

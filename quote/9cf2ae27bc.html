<main class="wrap"><figure class="quote" id="q-9cf2ae27bc" data-kw="">
<blockquote><p>Paul’s example reminds ministers of churches that they have to gear what they say to the capacity of their audience and use every means possible to win them over and call them back from their errors. Human minds come in many different shapes and sizes. Therefore, just as good teachers adapt themselves to the minds of their children, and just as trustworthy and skilled doctors (a simile that Jerome uses) pay close attention to the way their patients respond when they are trying to cure the more difficult diseases, so ministers of the Word must understand the thought pattern of their hearers in order to reach each one of them, and they should not hesitate to shout at them if they see that they are rude and uneducated. But they must be careful when doing this not to compromise the truth, because doing that is no service to anyone.

Those who are full of themselves could not be farther away from the spirit of Paul. They order people about, avoid any kind of discussion and refuse to have anything to do with those who disagree with them. At the same time, they attack people who are fine representatives of the cause of religion with sharp, or rather poisoned tracts written against them, condemn whole churches and cause trouble wherever they go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 155.</span></figcaption>

</figure><figure class="quote" id="q-6cfc349ce3" data-kw="">
<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>

<blockquote><p>§4. So if a pastor call the assembly at an inconvenient hour, or to an inconvenient place, though it be his sin to do so, yet is it their duty to obey. If in the manner of prayer he (tolerably) miscarry, they may not therefore refuse to join with him. If of two translations of Scripture, or two versions of the Psalms, he use the worser (so it be tolerable), they must obey. §5. Yet if the miscarriage be so great in the ordering even of these circumstances, or in the manner of duties, as shall overthrow the duty itself, and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey the pastors (in those cases) can do; then (as I have before showed) we are not bound to follow him in such a case: But otherwise we are. §6… If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied… §7. And the things in which the pastor is now supposed to err, are not of themselves unlawful, but only by such an accident, as being overweighed by another accident, shall cease to make them unlawful. For instance: If the pastor appoint a more imperfect version of the Psalms to be sung in the Church (as is commonly done in England), the obeying of him in the use of this will not bring so much hurt to the Church as the disobeying on that account would do: For besides the sin of disobedience itself, the Church would be in a confusion if they forsake his conduct that preserves the union; and some will be for this and some for that, and so the worship itself will be overthrown. But if the pastor would command a version so corrupt as would overthrow the duty itself, or be as bad as non-performance, the Church is then to seek redress and not obey him. So if he command a time inconvenient, but tolerable (as to meet at sun rising or sun setting) it were better [to] obey than dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.</p></blockquote>

is+and+some+for+that%2C+and+so+the+worship+itself+will+be+overthrown.+But+if+the+pastor+would+command+a+version+so+corrupt+as+would+overthrow+the+duty+itself%2C+or+be+as+bad+as+non-performance%2C+the+Church+is+then+to+seek+redress+and+not+obey+him.+So+if+he+command+a+time+inconvenient%2C+but+tolerable+%28as+to+meet+at+sun+rising+or+sun+setting%29+it+were+better+%5Bto%5D+obey+than+dissolve+the+Church+%28if+we+cannot+be+otherwise+relieved%29.+But+if+he+appoint+a+time+that%E2%80%99s+intolerably+unfit+%28as+at+midnight%29%2C+I+would+not+obey+%28except+in+such+necessity+as+leaves+%5Bpublic+worship%5D+to+that+time+or+none%29%E2%80%A6+%C2%A79.+If+I+be+bound+to+obey+a+governor+if+he+set+me+to+pick+straws%2C+or+to+hunt+a+feather%2C+it+follows+not+that+he+may+lawfully+command+it.+I+have+heard+many+pleading+for+ceremonies+say+that+if+the+magistrate+commanded+them%2C+and+would+not+otherwise+permit+them+to+preach+the+Gospel%2C+they+would+preach+in+a+fool%E2%80%99s+coat+and+a+fool%E2%80%99s+cap+with+a+feather+rather+than+forbear.+But+I+do+not+think+that+any+of+them+would+justify+that+ruler+that+would+make+such+a+law+that+no+man+should+preach+or+celebrate+the+sacraments+but+in+a+fool%E2%80%99s+coat+and+cap%3A+such+might+expect+to+be+judged+by+Christ%2C+as+the+scorners+of+Him+and+his+ordinances.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship%2C+%28London%2C+1659%29+%7C+ch.+12%2C+%E2%80%98It+may+be+very+sinful+to+command+some+ceremonies%2C+when+yet+it+may+be+the+subjects%E2%80%99+duty+to+use+them+when+they+are+commanded%E2%80%99%2C+pp.+461-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb967e823a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b967e823a2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=4.%20So%20if%20a%20pastor%20call,scorners%20of%20Him%20and%20his%20ordinances&amp;text=4.%20So%20if%20a%20pastor%20call%20the%20assembly&amp;text=as%20the%20scorners%20of%20Him%20and%20his%20ordinances" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Reason 2. Because nothing is required of them unfitting or burdensome, but that once every week, in convenient time and place, every one would contribute according to that measure wherewith God had blessed him: And the manner is plain, whereby the collection might be made publicly every Lord’s Day, and yet every one should lay it by himself, i. e. no man knowing the sum: We may imagine that they imitated the example of the ancient Church, a bored Chest being placed in the entrance to the house where they met for the Worship of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8ee492e453" data-kw="">
<blockquote><p>The Westminster Confession itself is a monument of the willingness of the Scottish Church to set aside a good old confession in favour of a better new one. The old Scottish Confession of the first Reformation time was a noble confession: at this hour some of its utterances are referred to by continental writers on symbolism as rarely noble.

Yet the Scottish Church of the second Reformation set aside that grand old Scottish Confession in favour of the West minster Confession of Faith. It thus appears that willingness to abandon a good old confession in favour of a better new one is with us Scottish Presbyterians a tradition of loyalty to the faith confessed. …

The seventeenth century was the golden age of systematic theology. We may vehemently admire the Westminster Confession as a representative of the most advanced attainments of that glorious golden age. But, I repeat, we have no moral right to retain it as the confession of our faith, unless at this hour we hold the faith it represents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Revision of the Westminster Confession in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>IV. As to the people’s case, it needs no other answer:

</figure><figure class="quote" id="q-07a2916b3b" data-kw="">
<blockquote><p>In the sacrament of baptism the Independents lay a pathway to Anabaptism, for first they come close up to the most rigid Brownists, denying baptism to the most part of Christian infants; yea they will grant it to a very few: to these alone whose immediate parents are members of their congregation, who are a wonderful poor handful: all other infants they will have unbaptized till they come to the years of understanding and declare not only their actual faith and holiness, but their subjection to the Kingdom of Christ, that is to their Independency: they will have no stipulation made for the infants’ education… … Secondly, they esteem not baptized infants to be members of their church before they have entered into their [church] covenant; till then they hold them from the Lord’s Table and all the acts of discipline, as people without the Church and not members of it: If it be so, their baptism was of so small use that well they might have wanted it to the time of their admission to be members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, pp. 119-20</span></figcaption>

</figure><figure class="quote" id="q-af896d21ff" data-kw="">
<blockquote><p>What say ye of this salvation? Is it not a most glorious salvation? is it not a most excellent salvation that is in your offer? I intreat you speak your minds, tell Christ ye are content to take the great salvation; otherwise, whoever he be that will not partake of this gospel salvation, I in the name and authority of Christ our Master, denounce eternal and irrevocable war against him; put on your harness, ye shall not boast when ye put it off again; the wrath and fury of God shall come upon you to the uttermost if ye embrace not this great salvation:

Other wars are but for a time; the greatest Captains that ever the earth did carry, are now laid down in the sides of the Pit, and their swords broken under their head. Armies of ten hundred thousand, a hundred years’ time have laid them all in their graves, and ended all their contests; but there is no discharge of this war that shall be concluded betwixt Christ and you: it shall become an eternal and most terrible war, which shall be but beginning when time is ended. Now peace or war, which of them will ye choose? Dare ye send a charge to Christ, and say ye will defy him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great salvation offered and tendered first, by Christ himself, and then by his holy apostles, with the inevitable destruction of all that neglect it: in the sermons, reprinted by that eminent servant of Christ, Mr. Andrew Gray, formerly Minister of the Gospel in Glasgow</cite>, (London: H. Barnard, 1694), p. 46.</span></figcaption>

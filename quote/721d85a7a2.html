<main class="wrap"><figure class="quote" id="q-721d85a7a2" data-kw="">
<blockquote><p>The manner of conversion is to us unsearchable, both because we are ignorant of the nature of the immortal soul, and because much more are we ignorant of the manner of God’s working upon that immortal spirit. As for the resistibility or irresistibility of grace, we know that the power of God is almighty, and cannot be resisted by any created strength, if He please to exercise it to the full, or in some high measure: But if God give power to the creature, or work by that created power given, it may be resisted by a contrary created power: And so grace or the power of conversion, as a created thing in man, may be so given as to be resisted by the will of man. And both the understanding of man, will and does, either deny or doubt of divine truths represented to the soul; and the will will wrangle, oppose and reject or not sincerely affect and submit unto the divine commands, and promises. And hence, the many conflicts not only in conversion, but after we are converted. As for necessitation of the will in this work of divine calling, it’s certain and granted of all that the illumination of the understanding may be necessary so far as the soul in respect of the same is only passive, though in the apprehension and judgement concerning the truths represented by the Word it be active. Besides, God may give an active power to the will, and it may be passive in receiving of it, and also necessitated to an act of complacency in general, so that it necessarily may approve by a general approbation of the justice and equity of the command, and the excellency of the good promised… Yet notwithstanding this necessary and natural act of complacency, that act of the will, which Buridan calls acceptatio ad prosecutionem may be, and is free. I pass by the philosophical speculations concerning the nature of the will, which few know, concerning the natural and necessary acts thereof, and also concerning those that are free; and what the natural liberty of the will is, and in what acts, and in respect of what acts, it is free. Concerning the positive acts velle and nolle, and the negative, non velle, non nolle, and concerning the liberty of contradiction and specification; It’s far more profitable for all such as are so blessed as to live in the Church and enjoy the means of conversion diligently to use the means and exercise that power which God has given them, and also earnestly and constantly pray for the regenerating Spirit, which God has promised to them that seek Him in an orderly way. For upon this done, regeneration will follow; and by the divine and spiritual power given them, together with God’s special assistance, and concurrence, after all necessary preparations, they shall freely determine and the will shall wholly and most willingly submit to God-Redeemer, which is the ultimate product of divine vocation, the parts whereof are the outward Word, and the inward power of the Spirit which go together, according to the promise of the Gospel, and make up the essence of it… And we cannot find in Scripture that God denies his Spirit to such as hear his Word till they give God cause either by their neglect or perversness, or apostasy from that degree of grace they have received to withdraw the same. By all this we understand that Christ finds his subjects, to whom God has given Him a right, to be enemies, and He enlarges as He begins his Kingdom by a kind of spiritual conquest, dashing in pieces all such as will not submit, and are bound to submit, with his iron rod and irresistible strength, reducing the rest unto subjection, after some time of standing out… And this publication of his laws is accompanied with a wonderful power of his Spirit whereby together with the Word of the Kingdom, He pierces the minds of men and breaks their stony hearts in sunder, as an hammer does a rock: In this respect the Lord says, ‘Is not my Word like as a fire, and like an hammer that breaks the rock asunder, Jer. 23:29.</p></blockquote>

<blockquote><p>2. They resisted the Holy Ghost striving with them by their own consciences, and would not comply with the convictions and dictates of them. God’s Spirit strove with them as with the old world, but in vain; they resisted Him, took part with their corruptions against their convictions, and rebelled against the light. There is that in our sinful hearts that always resists the Holy Ghost, a flesh that lusts against the Spirit, and wars against his motions; but in the hearts of God’s elect, when the fullness of time comes, this resistance is overcome and overpowered, and after a struggle the throne of Christ is set up in the soul, and every thought that had exalted itself against it is brought into captivity to it, 2 Co. 10:4, 2 Co. 10:5. That grace therefore which effects this change might more fitly be called victorious grace than irresistible.</p></blockquote>

<blockquote><p>Now to shut up all touching this point of man’s liberty in resisting the grace of God, the sum of all is this: Before true conversion all unregenerate persons do resist the gracious means and preparations to their conversion, the reprobate finally, the elect for a time, till grace become victorious in their perfect sanctification. In this their first conversion or regeneration the elect are no way active either to work it or to hinder it. After their conversion in the doing of all good works, immanent or transient, they resist not so far as they are spiritual; they cannot but resist so far as they are carnal. And though in time of temptation and spiritual desertion the flesh do not only resist but also prevail, to the hinderance of many particular gracious actions, yet for those main and principal acts of faith, repentance, love of God, hatred of evil, etc. the Spirit is infallibly victorious both to do them after the first conversion and also finally to persevere in doing of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627)</cite>, pp. 154-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now to shut up all touching this point of man’s liberty in resisting the grace of God, the sum of all is this: Before true conversion all unregenerate persons do resist the gracious means and preparations to their conversion, the reprobate finally, the elect for a time, till grace become victorious in their perfect sanctification. In this their first conversion or regeneration the elect are no way active either to work it or to hinder it. After their conversion in the doing of all good works, immanent or transient, they resist not so far as they are spiritual; they cannot but resist so far as they are carnal. And though in time of temptation and spiritual desertion the flesh do not only resist but also prevail, to the hinderance of many particular gracious actions, yet for those main and principal acts of faith, repentance, love of God, hatred of evil, etc. the Spirit is infallibly victorious both to do them after the first conversion and also finally to persevere in doing of them.”

— William Pemble, Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 154-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+to+shut+up+all+touching+this+point+of+man%E2%80%99s+liberty+in+resisting+the+grace+of+God%2C+the+sum+of+all+is+this%3A+Before+true+conversion+all+unregenerate+persons+do+resist+the+gracious+means+and+preparations+to+their+conversion%2C+the+reprobate+finally%2C+the+elect+for+a+time%2C+till+grace+become+victorious+in+their+perfect+sanctification.+In+this+their+first+conversion+or+regeneration+the+elect+are+no+way+active+either+to+work+it+or+to+hinder+it.+After+their+conversion+in+the+doing+of+all+good+works%2C+immanent+or+transient%2C+they+resist+not+so+far+as+they+are+spiritual%3B+they+cannot+but+resist+so+far+as+they+are+carnal.+And+though+in+time+of+temptation+and+spiritual+desertion+the+flesh+do+not+only+resist+but+also+prevail%2C+to+the+hinderance+of+many+particular+gracious+actions%2C+yet+for+those+main+and+principal+acts+of+faith%2C+repentance%2C+love+of+God%2C+hatred+of+evil%2C+etc.+the+Spirit+is+infallibly+victorious+both+to+do+them+after+the+first+conversion+and+also+finally+to+persevere+in+doing+of+them.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+pp.+154-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ad5600263.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ad5600263.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=Now%20to%20shut%20up%20all%20touching,to%20persevere%20in%20doing%20of%20them&amp;text=Now%20to%20shut%20up%20all%20touching%20this%20point&amp;text=also%20finally%20to%20persevere%20in%20doing%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. I do not speak against men’s seeking a reconciliation with Rome on just and honest terms. I think it one of the happiest works in the world, could it be accomplished: And I think the French are the only people to be first dealt with to that end. And I long to see providence so turn things about as that there might be a council first of these two nations for the attempting of such a work. And I am past doubt that it would be the happiest way to pull down Antichrist (if the Pope be he) that has been yet of late undertaken. But if ever such a thing be accomplished, it must be by uniting in one creed, as containing all things sufficient to salvation, which must be wholly taken out of Scripture and not such as the Trent Confession is: Upon which agreement they may openly acknowledge each other for brethren and true Churches, without compelling each other to uniformity in the lesser matters, but bearing with each others’ differences. I wish England such rulers as will faithfully prosecute such a pacific enterprise, without sinful compliance and betraying of the truth. Though I confess when I consider their principles and practices, I am afraid bishop Hall is in the right, that There’s no peace with Rome. Yet no fears must hinder men from any just and necessary enterprise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | ‘Objections Answered’, pp. 94-95</span></figcaption>

</figure><figure class="quote" id="q-712ea4b3b6" data-kw="">
<blockquote><p>Thesis 1… Therefore, I was on the point of bidding farewell to this subject, casting away my pen, and choosing another equal to my powers and more suitable, had not the authority of those who hold the helm of my studies constrained me and prescribed this subject for me to bring, as it were, under the hammer. Wherefore, to prove my obedience to them, I shall approach the matter itself with God (σύν θεῷ). Thesis 2. Lest, however, our disputation be forced to wander and err, I will do that which I think ought to be done at the beginning, middle, and end of all disputations: that first, what it is that is being disputed should be defined; then, the common affections should be subjected to the definition; and finally, a division into parts and species should follow. And so our disputation on original sin will present: 1. its Definition, 2. its common Affections, 3. its Distribution.</p></blockquote>

t="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Again corruptions in doctrine must further be distinguished: some of them are errors indeed, but beside the foundation; and some errors directly against the foundation: and these overturn all religion, whereas the former do not. Now it cannot be showed that in our [English] Churches is taught any one error that razes the foundation, and consequently annihillates the truth of God’s Church. Indeed, there is controversy among us touching the point of ecclesiastical regiment: but mark in what manner: We all jointly agree in the substance of the regiment, confessing freely that there must be preaching of the Word, administration of the sacraments according to the institution, and the use of the power of the keys in admonitions, suspensions, excommunications: The difference between us is only touching the persons and the manner of putting this government in execution: and therfore men on both parts, though both hold not the truth in this point; yet because both hold Christ the foundation, they still remain brethren and true members of Christ. As for corruptions in manners, they make not a Church to be no church, but a bad Church. When as the wicked scribes and Pharisees sitting in Moses’s chair taught the things which he had written, the people are commanded to hear them, and to do the things which they say, not doing the things which they do. And whereas it is said that we hold Christ in Word, and deny Him in deed; that is answered thus: denial of Christ is double: either in judgement, or in fact: Denial in judgment joined with obstinacy, makes a Christian to be no Christian; denial in fact, the judgment still remaining sound, makes not a man to be no Christian, but a bad Christian. When the Jews had crucified the Lord of life, they still remained a Church, if any upon earth: and notwithstanding this their fact, the apostles acknowledged that the covenant and promises still belonged unto them: and they never made any separation from their synagogues till such time as they had been sufficiently convicted by the apostolical ministry that Jesus Christ was the true Messiah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed, on the Church in A Golden Chain</cite>, (Cambridge, 1600), p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-7c5cf246e6" data-kw="">
<blockquote><p>But (if I mistake you not) you yourself and many others in these times… pretend to acknowledge the Church of England and her assemblies to be true Churches, and yet separate yourselves from them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lazarus-seaman.html">Lazarus Seaman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Diatribe Proved to be Paradiatribe, or a Vindication of the Judgment of the Reformed Churches, and Protestant Divines, from misrepresentations concerning ordination and laying on of hands</cite>, ... (London: T.R., 1647), ‘Answer to the Tract bearing title, The Judgment of the Reformed Churches’, p. 54 Seaman (d. 1675) was a Westminster divine.</span></figcaption>

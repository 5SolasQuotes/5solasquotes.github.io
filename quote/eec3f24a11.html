<blockquote><p>We did not believe that any man of the least acquaintance with these controversies had been ignorant of that common and trivial homonomy of the word ‘presbyter’ and ‘elder’, sometimes taken for a preaching elder, sometimes for a ruling elder, and sometimes for both.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aca6ea0189" data-kw="">
<blockquote><p>Yea in favor of lay-elders he [Hugo Grotius] asserts (having argued them not to be of divine institution, yet):

1. That they may be lawfully instituted by sovereigns, or by the Church on their permission.

2. That it may be proved by Scripture that this institution is not displeasing to God.

3. That there are examples in pious antiquity, either of this same way, or one very near it.

4. That it is no contemptible benefit that by these elders may be received. But these [are] to exercise their office with several cautions:

1. Not claiming institution by divine precept.

2. Not usurping any of the power of the keys, nor of excommunication, further than excommunication belongs to the people (executively).

3. That the men be not unmeet.

4. Exercising no external jurisdiction but by public law.

5. Standing as mutable. Thus far Grotius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-10d875f233" data-kw="">
<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>II. ‘The Biblical Evidence’</cite>, pp. 57-62 in A Historical &amp; Biblical Examination of Women Deacons, pp. 60-61</span></figcaption>

</figure><figure class="quote" id="q-b37e71ce3b" data-kw="">
<blockquote><p>To the deacon you [the congregationalists] added the church-widow as a distinct officer, and as necessary for the perpetual government of the Church.</p></blockquote>

</figure><figure class="quote" id="q-642ac3d8fe" data-kw="">
<blockquote><p>4. The Church is not made ministerial by us, without the body exclusively wholly (for Christ’s government is voluntary), nor ought any new thing to be concluded in our assemblies while the people hear of it: for if the Romans used rogare et suadere legem [to ask and persuade the law], and obtain the consent of the people thereunto, far more are they not to be acknowledged as Church-laws that are to be obtruded upon the godly against their will and knowledge; and much more if they be against the Word of God, and former godly acts with consent agreed unto by the Church; that is, whether the people consent or not, but yet without the body, whether they exercise acts of jurisdiction or not, for no act of jurisdiction is due to them; and to exclude the consent of women, no less interessed [interested] in practice of conscience than men, is to be Lord’s of their faith.</p></blockquote>

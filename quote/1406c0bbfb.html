<main class="wrap"><figure class="quote" id="q-1406c0bbfb" data-kw="">
<blockquote><p>Spiritual life is infused into no one dead in sin except on the ground of the merit of Christ’s death. The life that Christ has merited by his death is everlasting, for it corresponds to that life that Adam should have obtained had he continued in his integrity.

And it flows from the Spirit of life in Christ risen from the dead, for as Christ himself having once died, dies no more, so neither shall the second death reign over anyone who, by the Spirit of life in Christ, is raised from the first. For these reasons, we admit no regeneration through the blood of Christ that, although sufficient for everlasting life, may possibly end in eternal death. Whoever is born of the Spirit immediately enters into the kingdom of heaven—first, as a state of grace; afterwards, as a state of glory. The Holy Spirit knows nothing of any other regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 136.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-c0f1742eae" data-kw="">
<blockquote><p>Though, in the Law, God formerly promised to the Jews the hire of works, (Leviticus 18:5,) yet we know that this was without effect, because no man ever obtained salvation by his merits. … For strictly speaking, he owes no man any thing, and from us, who are devoted to his service, he demands, as a matter of right, all the duties which are incumbent on us. But as he freely offers to us a reward, he is said to hire the labors which, on other grounds, were due to him. This is also the reason why he gives the name of a hire to the crown which he bestows freely.</p></blockquote>

</figure><figure class="quote" id="q-fd85c6ad04" data-kw="">
<blockquote><p>As to the relation of good works to rewards, it may be observed—(1.) The word merit, in the strict sense of the term, means that common quality of all actions or services to which a reward is due in strict justice on account of their intrinsic value or worthiness. It is evident that, in this strict sense, no work of any creature can in itself merit any reward from God, because (a) all the faculties he possesses were originally granted and are continuously sustained by God, so that he is already so far in debt to God that he can never bring God in debt to him. (b.) Nothing the creature can do can be a just equivalent for the incomparable favour of God and its consequences. There is another sense of the word, however, in which it may be affirmed that if Adam had in his original probation yielded the obedience required, he would have “merited” the reward conditioned upon it, not because of the intrinsic value of that obedience, but because of the terms of the covenant which God had graciously condescended to form with him. By nature, the creature owed the Creator obedience, while the Creator owed the creature nothing. But by covenant the Creator voluntarily bound himself to owe the creature eternal life, upon the condition of perfect obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publication and Sabbath-School Work, 1869), 307–08.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

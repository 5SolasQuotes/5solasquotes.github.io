<main class="wrap"><figure class="quote" id="q-1646c835f7" data-kw="">
<blockquote><p>14. Since they are not mere thoughts but substantial beings they exist spatially, but in such wise that space is not for them an obstructive barrier. In the same way angels exist temporally as beings created for a definite time, but in such wise that for them time never ends. … Thomas is more correct in denying that they are in a place without operating, because they are everywhere and operate by knowledge and will, even ad extra [to themselves], by glorifying God, and serving Him among men and all other creatures. So that they may be said to be in a place not because they are bounded by a place but because they themselves rather bound the place by their operation, as Thomas rightly says, 22: Therefore angels whom no medium resists must move very swiftly; much more, assuredly, than a corporeal thunderbolt, which is borne from east to west in a most destructive moment. Nor does it follow from this that angels move in a moment or by deserting their localisation acquire a new one in a moment. Although the medium is not resistant, succession is and so is a fresh act succeeding a former one, as well as the distance between the termini, which involves some measure of delay. For it is impossible that in the same nuni and present it should have a locus and when it leaves it should acquire a new one. Nor may we accept outright without a grain of salt Tertullian’s words: ‘As spirit has wings, in a moment it is everywhere.’ Heidegger (VIII, 23): ‘The duration of angels is neither eternity, which befits God alone as existing necessarily and through his nature; nor time or a continuance consisting of material things measurable by movement; or something separate (discretum), which suits things that succeed each other without continuity, not permanent things; nor a permanent instant which is defectible. Therefore what is usually attributed to them is aion, aevum, as it were aei on, always (at least a posteriori) existing, because of their prolonged duration, the origin of which man does not attain to by living, and of which there shall be no end at all.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Ernst Bizer, tr. G.T. Thomson (1861; Wipf &amp; Stock, 2007), ch. 10, ‘Angels Good &amp; Bad’, pp. 209-10 Heppe (1820–1879) was a German reformed theologian.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-636b608490" data-kw="">
<blockquote><p>The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>

0%28Ex.%2025%3A17%2D18%2C%2021%29%20where%2C%20under&amp;text=which%20such%20rudiments%20were%20adapted%2C%20has%20passed%20away" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-041822af0e" data-kw="angels spirits">
<blockquote><p>Are angels spiritual and incorporeal substances? We affirm. Scripture expressly calls them spirits; now for what purpose would they be called “spirits” if they are corporeal? Spirit is diametrically opposed to body: “A spirit hath not flesh and bones,” says Christ, “as ye see me have” (Lk. 24:39). For the same reason they are classed among things “invisible” (Col. 1:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.2.2</span></figcaption>

</figure><figure class="quote" id="q-53a221fedf" data-kw="">
<blockquote><p>5. Duration XVII. Fifth, the duration of their existing, and its measure, through which they are not under time, by which such things are measured which by their nature admit of a beginning and end; nor under eternity, which belongs only to him who by nature can experience neither beginning nor end; but under aevum, ‘forever,’20 by which those things are measured which include a beginning by nature, but exclude an end. This aevum is congruent with time, tempus, in this, that not only does it imply a beginning of duration, but also flux or succession; this aevum is congruent with eternity in that it excludes an end of its duration. It differs from time in that it excludes an end, and from eternity in that it includes a beginning and flux. 23 The three measures of duration are tempus, aeternitas, and aevum, also called “aeviternity” or “improper eternity.” Cf. 1.2.11 §VIII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. Joel Beeke, tr. Todd Rester (RHB, 2021), vol. 3, bk. 3, ch. 7, The Good Angels, p. 184</span></figcaption>

ank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cdea257cab" data-kw="">
<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXL.+Our+%5BReformed%5D+theologians+also+inquire+whether+angels+are+part+of+the+Church.+Tilenus%2C+Polanus+and+others+who+want+the+Church+to+be+taken+broadly+enough+to+include+even+the+angels+affirm+this.+However%2C+the+illustrious+Amyraldus%2C+in+his+Theses+on+the+Parts+of+the+Church%2C+denies+it+along+with+many+others.+I+think+briefly+that+there+is+great+communion+between+angels+and+pious+and+faithful+men%2C+and+that+Christ%E2%80%99s+death+reconciled+angels+to+men+and+closely+united+them%2C+making+angels+protectors+and+guardians+of+the+faithful+and+promoting+their+salvation.+But+pious+men+form+a+certain+society+among+themselves+to+which+angels+do+not+belong.+The+name+%E2%80%98Church%E2%80%99+in+Scripture+is+only+attributed+to+the+society+of+men+and+never+includes+angels.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+Nature+%26+Definition+of+the+Church%2C+p.+429+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdea257cab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdea257cab.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-angels/#:~:text=XL.%20Our%20%5BReformed%5D%20theologians%20also%20inquire,of%20men%20and%20never%20includes%20angels&amp;text=XL.%20Our%20%5BReformed%5D%20theologians%20also%20inquire%20whether%20angels&amp;text=the%20society%20of%20men%20and%20never%20includes%20angels" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

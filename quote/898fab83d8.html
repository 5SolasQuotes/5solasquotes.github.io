<main class="wrap"><figure class="quote" id="q-898fab83d8" data-kw="">
<blockquote><p>All creatures for their continuance, have a kind of dependence upon one another. As the grass and plants upon the earth, the bruites upon the fruits of the earth, and our nutriment is from inferior creatures. But our Jehovah dependeth upon none, he is of, and from himself, he needeth no servant, no service. In him we all live, move and have our being, but his Majesty is beholding to none, either men or Angels, either for being or well-being.

Thus much God intended to teach by his speech to Moses, and God said unto Moses, I am that I am. We think verily that we shall be utterly undone if the Parliament break up, or if our King divide himself from this his body representative. Beloved, my soul maketh out to God for the prevention of this sad fraction. Yet I beseech you remember this, whatsoever falls out, that whereas all men, and all ordinances, Kings and Parliaments depend on God, yet our God Jehovah is an independent Majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simeon-ashe.html">Simeon Ashe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A support for the sinking heart in times of distress, or, A sermon preached in London to uphold hope and allay fear January 4th which was a day of great trouble and deep danger in the city</cite>, (London: Thomas Underhill, 1642), p. 31.</span></figcaption>

</figure><figure class="quote" id="q-1cac9130be" data-kw="">
<blockquote><p>Now it appears, that it was the will of our Lord and Saviour Christ, that we should, since his resurrection, keep for our Sabbath that first day of the week; forasmuch as he arose on that day, John xx. 1-19, and appeared divers times on this our Lord’s day to his disciples before his ascension; and did on this day, being the day of Pentecost, Acts ii. 1-4, fill his disciples with the gifts of the Holy Ghost, they being assembled together; all which gives a pre-eminence to this day, and a probability to the point.</p></blockquote>

</figure><figure class="quote" id="q-4df4feb072" data-kw="">
<blockquote><p>Lastly, Sanctification of the Sabbath, by the whole family, in all or most of the duties aforesaid, publicly and privately, is the care of the chief householder; as in the fourth Commandment: Remember thou keep holy the Sabbath day: Thou Master, and thy son and daughter, manservant and maidservant. What need so particular enumeration, if there were not a great weight in the performance thereof?

But where shall we find the family that doth all this? when the Householders themselves neglect or profane it by their own example; and employ their children and servants in businesses, to keep them from the public Congregation, or leave them to come or go at their own pleasure; or to spend the day in Idleness or Sports &amp; pastimes, that day; How can these men say truly, I and my house, we will serve the Lord? I shall only say more truly, what once was falsely applied to our Saviour; This man is not of God, because he keepeth not the Sabbath day: because he takes no care, that his family with him, do keep the Sabbath day. And thus much of the third Use.</p></blockquote>

</figure><figure class="quote" id="q-632ea4b5ed" data-kw="">
<blockquote><p>There may be a partial separation when one ordinance is so corrupted that we cannot join in it and yet can join with the Church in all other acts of communion: and a total separation when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religious. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account;</p></blockquote>

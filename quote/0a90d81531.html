<blockquote><p>It were too long for me to touch their infinite errors they are infected withal. They deny the old testament to be of any authority: David’s psalms be not to be used as prayers and praises to God: and they are almost as bold with the new; for they find fault with the Lord’s Prayer, and affirm that they need not say for themselves, Let “thy kingdom come,” for it is already come upon them: and what need we pray, say they, for that we have already? And we have no sin; wherefore then should we say, “Forgive us our trespasses?” O impudency of all impudencies the greatest! O infidelity more than ever was among the brutish heathen!

Was there ever any that went about to set God to school before? He hath taught us how to pray, and they say, we need not so to pray. The godly men (saith St Peter) which 2 Pet, did write the scriptures, spake not of themselves, but by the instruction of the Holy Ghost. And these frantic heretics and antichrists will both correct and teach the Holy Ghost to speak. Who having any spit in his body may not think it well bestowed upon such wicked blasphemers of God and his word?

I would I had a fountain of spittle to spattle on them: I would my spittle might be of so great virtue against them as the words of St Paul were against Bar-jesus, whom, resisting the belief of Christ, he called “the son of the devil,” and therewith struck him blind. Better it were for a man to lose his outward sight, whereby corruptible things be only seen, than to want the inward, whereby God is perceived. And more precious is the glory of my Christ in my sight than all the men of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-philpot.html">John Philpot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for Spitting upon an Arian</cite>, (n.d.) in Robert Eden (ed.), The Examinations and Writings of John Philpot, B.C.L., Archdeacon of Winchester: Martyr, 1555 (Cambridge: The University Press, 1842), pp 312-13.</span></figcaption>

<blockquote><p>There is one department of this subject which is usually discussed under the head of the history of the text, and with which you ought to possess some acquaintance. It may be said to be occupied practically with the investigation of these questions, what is the origin and what is the value of that text of the Greek Testament which has been in most general use since the invention of printing, and from which most of the translations of the New Testament into modern languages have been made, and whether there be any other text which is upon the whole preferable to it.

The investigation of this subject has produced much interesting information as to the sources from which the first printed editions of the Greek Testament were derived, the number and value of the MSS. so far as they can be ascertained, which were employed by the original editors, the different editions professing to rest upon critical foundations, which have since been published, the additional light that has been cast upon the state of the text, and the decision of the litigated questions about particular various readings applied, with the view of settling as the practical result of all, what is upon the whole the best and purest text of the Greek Testament that is now accessible.

The text that long prevailed in Europe, and from which most of the existing translations were made, commonly known as the textus receptus, is based chiefly upon editions published by Stephens [Robert Estienne] and [Theodore] Beza from MSS., and very closely resembling each other. This continued to be in general use, though the correctness of some of its readings had been doubted and questioned, till the publication of [Johann Jakob] Griesbach’s New Testament, of which, in the second or complete edition of it, the first volume was published in 1796 and the second in 1806. Griesbach laboured to shew that the textus receptus had been derived from a very small number of MSS., and these of no great antiquity or value, and that now there were materials for producing a decidedly purer and more correct text.

Most of the editions of the Greek Testament which have since been published in this country or upon the Continent have been based mainly upon Griesbach’s, or at least have in some form or other exhibited the principal of his various readings. Most of those who have examined this subject with attention have been of opinion that, upon the whole, Griesbach’s text is more pure and correct, approaches nearer to the original text of the inspired authors than the textus receptus, and I am disposed to think that this opinion is correct. At the same time I do not know anything which is better fitted to give a distinct and vivid impression of the substantial identity of all MSS. of the New Testament, of the extremely narrow range within which the investigation of the various readings from the application of all existing materials lies, and of the insignificance of the results which have been derived from the researches of critics as distinguished from interpreters, than just to run the eye over the inner margin of Griesbach’s New Testament.

There you have at one view all the words and phrases which he has removed from the textus receptus to make room for his own emendations, and you cannot fail to be struck with their utter insignificance, both in number and importance. And you will thus be very decidedly confirmed in your convictions of the purity and integrity of the text of the New Testament. And while it may be admitted that upon the whole and in general Griesbach’s text is preferable to the textus receptus, this does not hold in the case of each particular reading with respect to which they differ. There are several cases, and these of considerable comparative importance, as for example, the two passages to which we referred in the preceding part of this lecture, in which Scholz, the author of the latest critical edition of the New Testament, prefers, and apparently upon satisfactory grounds, the reading of the textus receptus, and of our common version, to that which Griesbach has substituted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XLIV, pp 548-49 (emphasis added).</span></figcaption>

<blockquote><p>It is granted by all sober Protestants that the Church has power of making canons and constitutions for decency and order in the public worship of God; and not only to prescribe the necessary circumstances of time and place, but also to continue and establish those ancient rites of the Christian Church which were practiced in the primitive times and are in themselves of an indifferent nature; which authority of the Church was asserted in the Augustan [Augsburg] Confession [art. 7, 15, 21, 24, Conclusion], and particularly by Mr. Calvin (Institutes, bk. 4, ch. 10, sect. 27. See Thomas Cartwright, [A Reply to an Answer,] bk. 1, [Answer to pp. 20-22,] p. 27), and other worthy persons in the Reformation. Which our [Anglican] reformers also did assume to themselves, as is declared in the 20th Article [of the 39 Articles]; and has been practised and defended against all Dissenters, as well by Scripture (Acts 15:28; 1 Cor. 11:16), as by antiquity and right reason… And the Royal Martyr [King Charles I] was so tender of their reputation that in his answer to the Parliament’s remonstrance, he promises to reform the ceremonies with these cautions:

1. That the reformation were pursued with such modesty and submission that the quiet of the kingdom were not disturbed;

2. Nor the decency and comeliness of God’s service discountenanced;

3. Nor the pious, sober and devout actions of those reverend persons who were the first laborers in the blessed Reformation be scandalized and defamed.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is granted by all sober Protestants that the Church has power of making canons and constitutions for decency and order in the public worship of God; and not only to prescribe the necessary circumstances of time and place, but also to continue and establish those ancient rites of the Christian Church which were practiced in the primitive times and are in themselves of an indifferent nature; which authority of the Church was asserted in the Augustan [Augsburg] Confession [art. 7, 15, 21, 24, Conclusion], and particularly by Mr. Calvin (Institutes, bk. 4, ch. 10, sect. 27. See Thomas Cartwright, [A Reply to an Answer,] bk. 1, [Answer to pp. 20-22,] p. 27), and other worthy persons in the Reformation. Which our [Anglican] reformers also did assume to themselves, as is declared in the 20th Article [of the 39 Articles]; and has been practised and defended against all Dissenters, as well by Scripture (Acts 15:28; 1 Cor. 11:16), as by antiquity and right reason… And the Royal Martyr [King Charles I] was so tender of their reputation that in his answer to the Parliament’s remonstrance, he promises to reform the ceremonies with these cautions:

1. That the reformation were pursued with such modesty and submission that the quiet of the kingdom were not disturbed;

2. Nor the decency and comeliness of God’s service discountenanced;

3. Nor the pious, sober and devout actions of those reverend persons who were the first laborers in the blessed Reformation be scandalized and defamed.”

<blockquote><p>Q. What are the works that we must decline, and leave undone on the Lord’s day?

A. Not only the works of sin, which we ought to leave undone every day; but also the works of our ordinary callings concerning this life, and all bodily exercises and labours, which upon other days are lawful and necessary to be done.

Q. Is it unlawful to do any bodily work, or worldly business on the Lord’s day?

A. Yea, excepting those works which belong to common honesty, and are necessary for the preservation of life, health, and goods; which otherwise would be in great danger to perish, if they were not saved on that day; or those, which are requisite for the performance of God’s service.

Q. Are we as strictly bound to forbear all worldly labour upon this day, as the Jews?

A. Yes verily, so far as the Commandment reacheth; and more then they, because of the greater measure of God’s graces upon us, above that which was upon them.

Q. What do you say to the making of a fire, and dressing of meat upon the Lord’s day? for neither of these were lawful to the Jews.

A. Not to make a fire, or dress meat on the Sabbath, were proper to the Pedagogy, or manner of government of the children under the Law; as may appear by this, that there was no such thing commanded, before the Law was given by Moses; and therefore it followeth that this was Ceremonial, and not Moral.</p></blockquote>

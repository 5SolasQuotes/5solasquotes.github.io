</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e503c8d926" data-kw="">
<blockquote><p>That the ceremonies are a great hindrance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about. The heathenish priests labored, per varietatem ceremoniarum, rem in pretio retinere [for a variety of ceremonies, a thing of great value to be retained]. The use for which Papists appoint their ceremonies is, ut externam quandam Majestatem sensibus obijciant [that they may cast a certain external majesty before the senses]: And so are the ceremonies urged upon us thought to conciliate reverence and due regard to divine worship, and to stir up devotion. In the meanwhile it is not considered that mentes humanae mirifice capiuntur &amp; fascinantur, ceremoniarum splendore &amp; pompa [human hearts are wonderfully captivated and fascinated by the splendor and pomp of ceremonies]. Videmus siquidem, says Bucer, vulgus delectari actionibus scanicis, &amp; multis uti signis. Chemnitius marks of the cumulating of ceremonies in the ancient Church, that it drew to this, ut tandem in theatricum ferme apparatum ceremonia illa abierint [that so at last by ceremonies they may go wholly prepared to the theater]. Musculus reprehends bishops for departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple. The policy, then, which is most simple and single, and least lustered with the pomp and bravery of ceremonies, cannot but be most expedient for edification. The king’s daughter is most like herselfe when she is all glorious within (Ps. 45:13), not without, and the Kingdom of God appears best what it is, when it comes not with observation (Lk. 17:20-21): But superstition (says [John] Cameron, Popish Prejudices, ch. 10), the mother of ceremonies, is lavish and prodigal; spiritual whoredom as it is, it has this common with the bodily: both of them must have their paintings, their trinkets, their invenglements. Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external. In the second commandment are forbidden omnes Ritus, qui a spirituali Dei cultu discrepant (Calvin, Commentary Ex. 20:5). ‘The Kingdom of God is within you’, says Christ. (Lk. 17:21)</p></blockquote>

<blockquote><p>If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [Aberdeen] Doctors); this is the doctrine of the Jesuits, Suarez, Thomas, Sanchez and Gregory de Valentia [all Romanists]… when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be… against God’s commandment, and know that human authority commands the contrary, and am persuaded it is indifferent, and a positive commandment of men, if the Church’s determination be here to sway my conscience, to practice is to me blind obedience, for human authority as it is such, gives no light.” Divine Right of Church Government (1646), Dispute Touching Scandal, Question 4, p. 43 When you seek reasons for what is going on and the only answers you get are of the kind, “The elders have determined…”, “This was the counsel of the presbytery,” “The principal clerk believes…” this is all directing you to trust persons without it being established in God-given reason. Take a cue from common life: persons that insist on you trusting them are the last persons you should trust. Trustworthy persons freely give their reasons precisely because they understand them as the grounds of the rightness of the action. Persons always (silently) trying to gain your confidence, are manipulators. . Unanimity The church leadership is geared towards being unanimous in their decisions and actions in order to give a united front (notice the disparity here with the people). They may do things unanimously or not at all. With time, of course, this puts pressure on all the elders to agree, even in situations that aren’t so cut and dry. And if they all do, you should too. “Look, all the elders are unanimous on this.” This is especially compelling under the (pressurized) lingo and mantra of Church unity, which really fits well with cultic characteristics. Cults thrive on the principle that the leadership’s will is God’s will, just like under the Papacy. In presbyterianism that may fly under the flag of a misinterpreting and mishandling of Mt. 18:18, “Whatsoever ye shall bind on earth shall be bound in heaven.</p></blockquote>

<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>

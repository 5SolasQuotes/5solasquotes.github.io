<main class="wrap"><figure class="quote" id="q-ffeea9e3e5" data-kw="undivided external works">
<blockquote><p>Although the external works are undivided and equally common to the single persons (both on the part of the principle and on the part of the accomplishment), yet they are distinguished by order and by terms. For the order of operating follows the order of subsisting. As therefore the Father is from himself, so he works from himself; as the Son is from the Father, so he works from the Father; as the Holy Spirit is from both, so he works from both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/one-essence.html">One Essence</a> › <a href="../topics/the-trinity/one-essence/unity-of-will-and-works.html">Unity of will and works</a></span><span class="t"><a href="../topics/the-trinity/the-father.html">The Father</a> › <a href="../topics/the-trinity/the-father/works-appropriated-to-the-father.html">Works appropriated to the Father</a></span></div>

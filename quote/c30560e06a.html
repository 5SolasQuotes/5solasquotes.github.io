<main class="wrap"><figure class="quote" id="q-c30560e06a" data-kw="">
<blockquote><p>5. Did you know before you wrote this, that all such as we persuade men to hear, have by oath renounced their Christian liberty? what oath is it that you mean? If you mean the Oath of Supremacy or Allegiance, unless Popery be Christian liberty, we know of none such which these renounce. And I know of no other oath, except that of canonical obedience in licitis et honestis [in things lawful and honest]. And for that:

1. I find not that the act or canons do impose it on those that come for ordination (nor am so well skilled in the law as to know by what law it is done).

2. I know that men have been ordinarily ordained without it. And to such your reason for separation is vain.

3. Mr. [William] Bradshaw and other old non-conformists were wont to say that they obeyed the diocesans and so did promise them obedience only as they are the king’s officers, deputed for the exercise of that civil or coercive power which magistrates have in causes called ecclesiastical [i.e. circa sacra]. And what liberty does that give away?

4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?

5. That indeed they are nothing else, as to the whole discharge and exercise of their office, but the servants of men, is another slander and untruth. He that is a servant of Christ, and a true pastor of a Christian Church, and a sound preacher of the Gospel, and a helper of believers’ faith, and a lover of the people’s souls, and a diligent upright laborer for men’s salvation, is something else than a servant of man (even in the discharge of their ministerial office). But such are many of the conformable ministers: Therefore prove if you can that Dr. Preston, Sibbes, Stoughton, Whittaker, Mr. Bolton, Whateley, Gataker, Fenner, and all the late [Westminster] Assembly save eight or nine at most (being all conformists) were nothing else but the servants of men, and not at all the servants of Christ. Your Father thought otherwise of Mr. Bolton, and perhaps they were both as wise as you. Prove now that Mr. [William] Gurnall, Mr. [John] Trapp, Dr. [John] Lightfoot, Dr. Walker, Mr. Langley, and many others that I can name that are worthy men in London and round about it, are nothing else but the servants of men? And will it not be as hard to prove one to be a servant of Christ who serves Satan by falsehood and malice, and calumniating Christ’s Churches and servants, as those that are thus the servants of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London, 1671), sect. 41, pp. 103-5</span></figcaption>

</figure><figure class="quote" id="q-ef2014537d" data-kw="">
<blockquote><p>And so the kingly power in general as given for the good of all human societies in general, is from God the Creator for the good of all societies whither heathen or Christian. So Nebuchadnezzar, Darius, Nero, and Julian were essentially kings, and yet had not their kingly power immediately from the Mediator Christ, except in this general sense that the kingly power is a lawful ordinance of God warranted by the Word of God and Testament of our Testator Jesus Christ, because these are essentially kings and lawful magistrates who either never heard of Christ, nor any thing of God; but only that He is Creator of the world, or then who persecute and hate the name of Jesus Christ… Now Formalists, denying such to be lawful kings, as either know not Christ, or believe not in Him, join hands with Papists, and make way for Anabaptistical anarchy, that a persecuting or an unbelieving king is no king, not to be obeyed, but to be turned out of his throne: And to this meaning, Calvin, Viret and Cartwright teach that the kingly power flows immediately from God the Creator, not from God in the Mediator Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 19, p. 295</span></figcaption>

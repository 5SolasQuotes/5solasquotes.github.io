<main class="wrap"><figure class="quote" id="q-b7b3b35434" data-kw="">
<blockquote><p>By ‘works’ here [Rev. 20:12-13] are we judged and justified, and not by faith only, as also James 2:24 testifies, meaning hereby that of lively faith and of the good works that follow thereupon man is justified, and not of that dead faith that is by itself alone, without any good works: otherwise were the words of Paul (Rom. 3:28) express contrary to this text, and to James; for, says Paul, ‘We are justified by faith, without the works of the Law,’ that is to say, not without good works whatsoever, but meaning that we are justified by lively faith with such small good works as our weak nature will suffer that faith to produce, although it be without the precise works that the Law requires: and for confirmation of this interpretation, and union of these texts, ye shall find both James and Paul agree in diverse places, that faith without works is a dead faith, and serves nothing to justification. And again, they agree both that all works (how good soever they seem) that proceed not from faith, are evil. And so it is all one to say with Saint Paul, We are justified by fruitful faith, or faith that produces good works, although not the works that the Law requires, or to say with James, and here with Saint John, we are justified by faithful works, seeing a working faith and faithful works are inseparable, and none can have the one without the other. So for conclusion, these works, by the which here we are judged, are to be esteemed good or evil, not in themselves, or insofar as they satisfy the Law (for so were all works evil and imperfect), but insofar forth as they have or want faith adjoined with them, they are accounted good or evil only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-napier.html">John Napier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Discovery of the Whole Revelation of St. John… (Edinburgh: Waldegrave, 1593), ch. 20, pp. 242-43 Napier (1550-1617) was a Scottish mathematician (who discovered logariths), physicist and astronomer in the reformed tradition.</cite></span></figcaption>

<blockquote><p>Justification therefore is properly a free judicial action of God, whereby He iudges the elect in themselves subject to the accusation and malediction of the Law, to be just by faith, through Christ by imputation of his righteousness, unto the praise of the glory of his grace, and their own salvation. That this definition might be rightly understood, it is needful that the causes, which are orderly noted in the same, be two ways considered, according as justification is taken, either actively, in respect of God, who justifies, or passively in respect of man, who is justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 9, ‘Of Man’s Justification before God’ in A Brief Institution of the Common Places of Sacred Divinity… (London: Francis Burton, 1610), pp. 222-76 The causes are succinctly stated on pp. 227-38, and then defended afterwards.</cite></span></figcaption>

</figure><figure class="quote" id="q-3f52c54f34" data-kw="">
<blockquote><p>The Papists, Socinians and Remonstrants all acknowledge faith to justify, but by it they mean obedience to God’s commandments, and so make it a work, and [do] not consider it as an instrument receiving Christ and his promise. A Papist, a Socinian, a Protestant says, ‘We are justified by faith,’ but dispositive [dispositionally, as an inherent disposition], says the Papist, conditionaliter [conditionally, as a condition only], says the Socinian, applicativè [applyingly], says the Protestant. Faith justifies not as a quality or habit [an inward abiding power] in us, as the Papists teach, Ipsa fides censetur esse justitia [faith itself is considered to be righteousness], for so it is a part of sanctification, but as it is the instrument and hand to receive Christ who is our righteousness, much less as it is an act, as Socinus and his followers teach, as though [Greek] ipsum credere [‘to believe itself’], did properly justify; if we should be justified by it as it is an act, then we should be justified by our works and we should be no longer justified actually then we do actually believe, and so there should be an intercision of justification so oft as there is an intermission of the act of faith; but justification is a continued act. … When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. … Objection: Faith is a work; therefore if we be justified by faith, then by works. Answer: With faith we must join the object of it, viz. Christ, Fides justificat non absolutè, sed relativè sc. cum objecto, non efficiendo sed afficiendo et applicando [‘Faith does not justify absolutely, but relatively, even with the object, not efficiently, but affectively and applyingly]. The Scripture says we are justified by faith, and through faith, but never for faith or because of our faith: per fidem, ex fide, non propter fidem. We can only be justified by that righteousness which is universal and complete; faith is a partial righteousness, Phil. 3:9, and as imperfect as other graces. … Only faith receives Christ and a promise. Faith justifies by the mere ordination of God, that on the receiving of Christ, or resting on Him we shall be justified. The proper act of faith which justifies is the relying on Christ for pardon of sin. To justify does not flow from any act of grace, because of the dignity and excellency of that act, but because of the peculiar nature, that it does receive and apply; therefore to receive Christ and to believe in Him is all one, and faith is always opposed to works. Bellarmine objects that to apply is a work or action. It is true, it is a grammatical action, but a predicamental passion [an Aristotelian category of disposition]. But says Bellarmine, ‘Love lays hold on Christ, and by love we are made one;’ but yet there is a difference: love makes us one with Christ extramittendo [sending out], faith intramittendo [bringing in], and besides love joins us to Christ after we are made one by faith, so that it cannot justify us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’</cite>, pp. 528-29</span></figcaption>

<blockquote><p>…I shall manifest: (1) That they have not the same scope, design or end in their discourses; That they do not consider the same question, nor state the same case, nor determine on the same inquiry, and therefore not speaking ad idem, ‘unto the same thing,’ do not contradict one another. (2) That as faith is a word of various signification in the Scripture… they speak not of the same faith, or faith of the same kind… (3) That they do not speak of justification in the same sense, nor with respect unto the same ends. (4) That as unto works they both intend the same, namely, the works of obedience unto the moral Law. …As to the scope and design of the apostle Paul… is to declare how a guilty, convinced sinner comes through faith in the blood of Christ to have all his sins pardoned, to be accepted with God and obtain a right unto the heavenly inheritance, that is, be acquitted and justified in the sight of God… The apostle James on the other hand had no such scope or design… But he had in hand a business quite of another nature… there were many in those days who professed the Christian religion or faith in the Gospel, whereon they presumed that as they were already justified, so that there was nothing more needful unto them that they might be saved. A desirable estate they thought they had attained, suited unto all the interest of the flesh, whereby they might live in sin and neglect of all duty of obedience, and yet be eternally saved… Against this sort of persons, or for their conviction, he designs two things: (1) In general to prove the necessity of works unto all that profess the gospel or faith in Christ thereby; (2) To evidence the vanity and folly of their pretense unto justification, or that they were justified and should be saved by that faith that was indeed so far from being fruitful in good works, as that it was pretended by them only to countenance themselves in sin. Unto these ends are all his arguings designed and no other. He proves effectually that the faith which is wholly barren and fruitless as unto obedience, and which men pretended to countenance themselves in their sins, is not that faith whereby we are justified and whereby we may be saved, but a dead carcass, of no use nor benefit, as he declares by the conclusion of his whole dispute in the last verse of the chapter. He does not direct any how they may be justified before God, but convinces some that they are not justified by trusting unto such a dead faith, and declares the only way whereby any man may really evidence and manifest that he is so justified indeed. This design of his is so plain, as nothing can be more evident…</p></blockquote>

</figure><figure class="quote" id="q-59df0fff9d" data-kw="">
<blockquote><p>Precisely because we are justified in Him – that is, in His justification – our justification is also final and irreversible. Indeed we can be so bold as to say that we are as fully justified before God as our Lord Jesus is. We are as finally justified as our Lord Jesus is. We are as irreversibly justified as our Lord Jesus is. The only justification we have – our only righteousness – is that of the Lord Jesus. We are justified with His justification.</p></blockquote>

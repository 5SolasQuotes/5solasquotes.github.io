<main class="wrap"><figure class="quote" id="q-6649fbe5e5" data-kw="">
<blockquote><p>walk worthy of the vocation wherewith ye are called, with all lowliness and meekness, with longsuffering, forbearing one another in love; endeavouring to keep the unity of the Spirit in the bond of peace. There is one body, and one Spirit, even as ye are called in one hope of your calling; One Lord, one faith, one baptism, One God and Father of all, who is above all, and through all, and in you all.” (Eph. 4:1-6)</p></blockquote>

</figure><figure class="quote" id="q-4f0ef1198d" data-kw="">
<blockquote><p>This is a very uncertain rule; for he may give his presence where he does not approve of the minister, and he may approve of the minister where he does not give his presence; and if he be absent, it is uncertain whether it be the minister’s fault or our own. And upon that ground the other party may be justified in dividing from us, because they may miss his presence among us and in our meetings; his presence in communion is the end of our meetings, and not the rule: The meeting is always lawful, and may have the expectation of his presence, that is gathered ‘in his name’; and none can say the meeting of presbyterian ministers in Scotland at this time, in these circumstances, are gathered in any other name. However, if we would expect a blessing, let us endeavor unity; for that is “as the dew of Hermon, and there the Lord commands the blessing,” Ps. 133 last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>as in the case of famous Mr. Alexander Henderson, who, at his first entry to the ministry at Leuchars, was prelatic, and by the bishop of St. Andrews brought in against the parish’s consent, so that, the day of his admission, the Church-doors being shut by the people, they were forced to break in by a window to get him entrance: But a little after, upon the report of a communion where Mr. Bruce was to help, he would needs, from a longing he had for to hear and see such a man, go secretly there, and placed himself in a dark place of the church where he might not be known. When Mr. Bruce was come to the pulpit, he did for a considerable time keep silence, as his manner was; which did some way astonish Mr. Henderson, but much more when he heard the first words wherewith he began, which were these, ‘He that comes not in by the door, but climbs up any other way, the same is a thief and a robber,’ which did, by the Lord’s blessing, at the very present take him by the heart, and had so great an impression on him, that it was the mean of his conversion.</p></blockquote>

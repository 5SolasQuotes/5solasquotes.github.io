<main class="wrap"><figure class="quote" id="q-bf78098637" data-kw="">
<blockquote><p>To conclude, three sorts of works may lawfully be done on the Sabbath day: 1. Works of piety, which either directly concern the service of God, though they be performed by bodily labor: as under the Law, the priests did labour in killing and dressing the sacrifices, and burning them on the altar. And Christians under the Gospel, when they travail far to the places of God’s Worship: it is but a Sabbath day’s journey, like to that of the Shunamite (2 Kings 4:22), who travailed from home to hear the prophet on the Sabbath day, because she had no teaching near her own dwelling. And the preacher, though he labors in the sweat of his brows, to the wearying of his body, yet he does but a Sabbath day’s work. For the holy end sanctifies the work, as the temple did the gold, or the altar the gift thereon. Or else such bodily labor whereby the people of God are assembled to his worship, as the sounding of trumpets under the Law, or the ringing of bells under the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety 3rd</cite>, … (London: Hodgets, 1613), ‘Now of the third sort of duties after the holy Assembly,’, pp. 609-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>6. The question concerning particular works, or permitted recreations, is wholly useless and trifling: for quod lege prohibitoriâ vetitum non est, permissum intelligitur, says the law: all that is permitted which in the negative precept is not forbidden: But as for some persons to give themselves great liberties of sport on that day is neither pious nor prudent; so to deny some to others is neither just nor charitable. The plowman sits still in the Church and the Priest labours; and the wearied man is permitted to his refreshment, and others not permitted because they need it not (Ordinary Gloss on Mt. 28); and there is no violation of any commandement of God, even when there is a profanation of the day indulged upon pious and worthy considerations.</p></blockquote>

olasquotes.github.io%2Fquote%2F81490dfea0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/81490dfea0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=6.%20The%20question%20concerning%20particular%20works,indulged%20upon%20pious%20and%20worthy%20considerations&amp;text=6.%20The%20question%20concerning%20particular%20works%2C%20or%20permitted&amp;text=the%20day%20indulged%20upon%20pious%20and%20worthy%20considerations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8ed6be2948" data-kw="">
<blockquote><p>The fourth precept is about sanctifying the sabbath in holy services through hearing, reading, and meditating upon the Word of God, and through use of the sacraments. Negatively, it is about not violating the sabbath through occupational employment, marketing, physical labors, games, jokes, frolics, feasts, or the mere form of piety.</p></blockquote>

</figure><figure class="quote" id="q-8a66e20ff8" data-kw="">
<blockquote><p>It being impossible for the mind of man to be always intent upon business and for the body to be exercised in continual labours, the wisdom of God has therefore adjudged some diversion and recreation (the better to fit both body and mind for the service of their Maker) to be both needful and expedient: such is the constitution of our bodies and the complexion of our minds that neither of them can endure a constant toil without some relaxation and delighting diversion. As a bow, if always bent, will prove sluggish and unserviceable, in like manner will a Christian’s mind if always intent upon the best things: the arrow of devotion will soon flag, and fly but slowly towards heaven. A wise and good man perhaps could wish that his body needed no such diversion, but finding his body tire and grow weary, he is forced to give way and choose such recreations as are healthful, short and proper to refresh both mind and body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help &amp; Guide to Christian Families</cite>, … (d. 1703; London: SPCK, 1840), ch. 6, ‘Of Glorifying God in our Recreations,’, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-c841efac0c" data-kw="">
<blockquote><p>Therefore we shall learn out of this Scripture what things may lawfully be done of us without the breach of the commandment of rest. First of all such bodily labors are permitted, as do immediately and directly concern the worship of God, and without the which He cannot be served of us according to his Word: For this cause it was permitted unto the priests, nay they were commanded to slay beasts, and to prepare them for sacrifices, and offer them up according to the law, about the which they took so much the more pains upon that day than upon any other [day] of the week by how much the sacrifices were increased: for besides the daily sacrifices, morning and evening, there was a special sacrifice for the Sabbath, and all this being commanded in the law, our Savior Christ says [that] they in doing of it were blameless; therefore, whereas He says that the priests in the Temple break the Sabbath, He does not mean that they did so indeed: (For He affirms that they are blameless), but speaking according to the meaning of the Pharisees, who would condemn the fact of his disciples in gathering the ears of corn to satisfy their hunger, says, if every bodily labor be a breach of the Sabbath, then the priests in the temple brake it, but they are blameless in so doing; therefore they brake it not. Thus we do grant that men may travail [put forth work] to the places of Gods worship, where the public assemblies and meetings of the Church be, because otherwise they cannot join with them in the communion of the Word, sacraments and prayer, and though they be far distant in situation of dwelling from the common place of meeting, yet it is permitted unto them to travail by land, or by water, on horseback, or on foot thereunto; nay they are commanded to do it, and they may not under the color of a long journey tarry at home idly taking their ease. For even as the slaying of beasts is merely in its own nature a worldly and bodily labor, yet the temple which was sanctified did change the nature of it, and made it holy: so to travail and to ride, or go to and fro upon the Sabbath is altogether painful, and laborsome to the body, but to take this pains, to preach or to hear the word, makes it an holy work, and is warranted by the Scripture: as in this very place [Mt. 12:1-9], we see how our Savior Christ and his disciples travail from town to town to preach the Gospel, and take such pains that they are hungry and faint in the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), pt. 1, pp. 104-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore we shall learn out of this Scripture what things may lawfully be done of us without the breach of the commandment of rest. First of all such bodily labors are permitted, as do immediately and directly concern the worship of God, and without the which He cannot be served of us according to his Word: For this cause it was permitted unto the priests, nay they were commanded to slay beasts, and to prepare them for sacrifices, and offer them up according to the law, about the which they took so much the more pains upon that day than upon any other [day] of the week by how much the sacrifices were increased: for besides the daily sacrifices, morning and evening, there was a special sacrifice for the Sabbath, and all this being commanded in the law, our Savior Christ says [that] they in doing of it were blameless; therefore, whereas He says that the priests in the Temple break the Sabbath, He does not mean that they did so indeed: (For He affirms that they are blameless), but speaking according to the meaning of the Pharisees, who would condemn the fact of his disciples in gathering the ears of corn to satisfy their hunger, says, if every bodily labor be a breach of the Sabbath, then the priests in the temple brake it, but they are blameless in so doing; therefore they brake it not. Thus we do grant that men may travail [put forth work] to the places of Gods worship, where the public assemblies and meetings of the Church be, because otherwise they cannot join with them in the communion of the Word, sacraments and prayer, and though they be far distant in situation of dwelling from the common place of meeting, yet it is permitted unto them to travail by land, or by water, on horseback, or on foot thereunto; nay they are commanded to do it, and they may not under the color of a long journey tarry at home idly taking their ease. For even as the slaying of beasts is merely in its own nature a worldly and bodily labor, yet the temple which was sanctified did change the nature of it, and made it holy: so to travail and to ride, or go to and fro upon the Sabbath is altogether painful, and laborsome to the body, but to take this pains, to preach or to hear the word, makes it an holy work, and is warranted by the Scripture: as in this very place [Mt. 12:1-9], we see how our Savior Christ and his disciples travail from town to town to preach the Gospel, and take such pains that they are hungry and faint in the way.”

— Nicholas Bownd, The Doctrine of the Sabbath Plainly Laid forth… (London, 1595), pt. 1, pp. 104-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+we+shall+learn+out+of+this+Scripture+what+things+may+lawfully+be+done+of+us+without+the+breach+of+the+commandment+of+rest.+First+of+all+such+bodily+labors+are+permitted%2C+as+do+immediately+and+directly+concern+the+worship+of+God%2C+and+without+the+which+He+cannot+be+served+of+us+according+to+his+Word%3A+For+this+cause+it+was+permitted+unto+the+priests%2C+nay+they+were+commanded+to+slay+beasts%2C+and+to+prepare+them+for+sacrifices%2C+and+offer+them+up+according+to+the+law%2C+about+the+which+they+took+so+much+the+more+pains+upon+that+day+than+upon+any+other+%5Bday%5D+of+the+week+by+how+much+the+sacrifices+were+increased%3A+for+besides+the+daily+sacrifices%2C+morning+and+evening%2C+there+was+a+special+sacrifice+for+the+Sabbath%2C+and+all+this+being+commanded+in+the+law%2C+our+Savior+Christ+says+%5Bthat%5D+they+in+doing+of+it+were+blameless%3B+therefore%2C+whereas+He+says+that+the+priests+in+the+Temple+break+the+Sabbath%2C+He+does+not+mean+that+they+did+so+indeed%3A+%28For+He+affirms+that+they+are+blameless%29%2C+but+speaking+according+to+the+meaning+of+the+Pharisees%2C+who+would+condemn+the+fact+of+his+disciples+in+gathering+the+ears+of+corn+to+satisfy+their+hunger%2C+says%2C+if+every+bodily+labor+be+a+breach+of+the+Sabbath%2C+then+the+priests+in+the+temple+brake+it%2C+but+they+are+blameless+in+so+doing%3B+therefore+they+brake+it+not.+Thus+we+do+grant+that+men+may+travail+%5Bput+forth+work%5D+to+the+places+of+Gods+worship%2C+where+the+public+assemblies+and+meetings+of+the+Church+be%2C+because+otherwise+they+cannot+join+with+them+in+the+communion+of+the+Word%2C+sacraments+and+prayer%2C+and+though+they+be+far+distant+in+situation+of+dwelling+from+the+common+place+of+meeting%2C+yet+it+is+permitted+unto+them+to+travail+by+land%2C+or+by+water%2C+on+horseback%2C+or+on+foot+thereunto%3B+nay+t

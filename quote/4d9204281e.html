<main class="wrap"><figure class="quote" id="q-4d9204281e" data-kw="">
<blockquote><p>We ought to take care, on the other hand, lest, by proving that it is not the lack of members, senses, or faculties that accounts for man’s inability to act in a spiritual manner, we should set forth that weakness as something small, and that man may remove it by some endeavor of his own…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-a1a48e9131" data-kw="">
<blockquote><p>Holding the distinction of natural and moral ability and inability, decides nothing in this behalf, because these terms are used by different men in different senses. Some mean by natural ability, plenary [complete] ability, in the full Pelagian sense; others mean, a partial, or gracious; an Arminian, or Semi-Pelagian ability. The orthodox, however, use it, if at all, simply to denote the natural faculties of understanding, desire, and will, which are essential to moral agency and responsibility, and belong to man, as such, whether unfallen, fallen, or renewed by grace. So, by moral inability, the former class [of Pelagians and Arminians] mean merely an aversion or unwillingness which the sinner can remove by his own will. The old Calvinists mean by moral inability, that indeed which characterizes fallen man; but still that which is real, which the subject of it cannot, while the Almighty power of God can, remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Witherspoon’s Theology’, The Biblical Repertory &amp; Princeton Review (1863)</cite>, pp. 598-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-26e61ab33a" data-kw="">
<blockquote><p>The moral inability is not less because there is no want [lack] of natural ability, members, senses, or faculties in man. The need of a nature, principle, and disposition to act in a holy manner is as great an inability to it as if there was a want [lack] of members or faculties to operate in a natural manner. As the body cannot act without the soul, so the soul cannot do anything that is holy without the divine nature. 2 Peter 1:4. As the eye cannot behold any thing without the humor [transparent fluid in the eye], so the soul cannot act in a holy manner, though possessed of all the faculties, without a holy principle and disposition to do so. A spiritual life is as necessary to act in a holy manner, as natural life is for its actions…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-elias.html">John Elias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Moral Inability of Man’, in John Elias: Life, Letters, and Essays, 1847, reprinted 1973, Banner of Truth</cite>, p. 365</span></figcaption>

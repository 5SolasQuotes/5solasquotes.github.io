<main class="wrap"><figure class="quote" id="q-2b0abe45b9" data-kw="">
<blockquote><p>Every cause is a principle of some sort. So one must first explain the notion of principle so that the notion of cause may be understood. A principle is defined as that from which something in some way proceeds. That which proceeds is called the ‘principiate’, or what has been ‘principled’. Between principle and principled there must be some connection. If this connection is merely external and without any inflowing of the principle to the principled, the principle is better referred to as a ‘beginning’. If, on the other hand, the connection is internal and consists in a positive inflowing of one to the other, the first is properly called a principle. Dawn is the principle of a day in the sense of beginning, and likewise the point in respect of a line. Parents with respect to their children, on the contrary, are properly called principles. The positive inflowing between principle and principled can be either logical or real. An inflowing is logical if the principle is the reason that the principled is known. In this way the premises of a syllogism are principles with respect to the conclusion (of science). The inflowing is real or ontological if the principle gives being to the principled.¹ ¹ Among philosophers an ontological principle is the same as a cause. Theologians however distinguish between a principle that is a cause and one that is not a cause. A principle that is not a cause communicates its own proper being such that the nature of the giver and of the receiver is numerically the same. Thus in the Sacred Trinity the Father is the principle of the Son but is not the cause of the Son. A principle is called a cause only if it communicates an existence or being-ness that is numerically distinct from itself. A cause is defined as a principle that, by its positive inflowing, determines the existence of something else…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 4, p. 38</span></figcaption>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

</figure><figure class="quote" id="q-1ac53f2eb7" data-kw="perichoresis coinherence">
<blockquote><p>Here belongs the word emperichōrēseōs which the fathers frequently used … to describe the intimate mutual union of the persons … when “the Son is said to be in the Father, and the Father in the Son” (Jn. 10:38; 14:11). … so as to designate thus that union by which the divine persons embrace each other and permeate each other. So that although always remaining distinct, yet they are never separated from each other, but always coexist; wherever one is, there the other also really is.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-68d1a7393c" data-kw="">
<blockquote><p>A single remark remains to be made respecting the extent and scope of hell. It is only a spot in the universe of God. Compared with heaven, hell is narrow and limited. The kingdom of Satan is insignificant in contrast with the kingdom of Christ. In the immense range of God’s dominion, good is the rule, and evil is the exception. Sin is a speck upon the infinite azure of eternity; a spot on the sun. Hell is only a corner of the universe. The Gothic etymon (Höhle, Hölle) denotes a covered-up hole. In Scripture, hell is a “pit,” a “lake”; not an ocean. It is “bottomless,” but not boundless. The Gnostic and Dualistic theories, which make God, and Satan, or the Demiurge, nearly equal in power and dominion, find no support in Revelation.

The Bible teaches that there will always be some sin, and some death, in the universe. Some angels and men will forever be the enemies of God. But their number, compared with that of unfallen angels and redeemed men, is small. They are not described in the glowing language and metaphors by which the immensity of the holy and blessed is delineated. “The chariots of God are twenty thousand, and thousands of angels” (Ps. 68:17). “The Lord came from Sinai, and shined forth from mount Paran, and he came with ten thousands of his saints” (Deut. 22:2). “The Lord hath prepared his throne in the heavens, and his kingdom ruleth over all” (Ps. 103:21). “Thine is the kingdom, and the power, and the glory” (Matt. 6:13). The Lord Christ “must reign till he hath put all enemies under his feet” (1 Cor. 15:25). St. John “heard a voice from heaven as the voice of many waters, and as the voice of a great thunder” (Rev. 14:1).

The New Jerusalem “lieth four square, the length is as large as the breadth; the gates of it shall not be shut at all by day; the kings of the earth do bring their honor into it” (Rev. 21:16, 24, 25). The number of the lost spirits is never thus emphasized, and enlarged upon. The brief, stern statement is, that “the fearful and unbelieving shall have their part in the lake that burneth with fire and brimstone” (Rev. 21:8). No metaphors and amplifications are added, to make the impression of an immense “multitude which no man can number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), pp 159-60.</span></figcaption>

<blockquote><p>…that which is called sentential justification, at the day of Judgment. For of what nature soever it be, the person concerning whom that sentence is pronounced, was: (1) actually and completely justified before God in this world; (2) made partaker of all the benefits of that justification, even unto a blessed resurrection in glory (‘it is raised in glory;’ 1 Cor. 15); (3) The souls of the most will long before have enjoyed a blessed rest with God, absolutely discharged and acquitted from all their labors, and all their sins; There remains nothing but an actual admission of the whole person into eternal glory. Wherefore this judgment can be no more but declaratory unto the glory of God, and the everlasting refreshment of them that have believed… … 1. It is no where said that we shall be judged at the last day, ex operibus [‘out of works’]; but, only that God will render unto men secundum opera [‘according to works’]. 2. …the Judgment at the last day is said to be according unto works, without any mention of faith. …

5. In our justification in this life by faith, Christ is considered as our propitiation and advocate… But at the last day, and in the last Judgment he is considered only as the Judge.

6. The end of God in our justification is the glory of his grace, Eph. 1:6. But the end of God in the last Judgment is the glory of his remunerative righteousness, 2 Tim. 4:8.

7. The representation that is made of the final Judgment, Mt. 7 and ch. 25, is only of the visible Church. And therein the plea of faith as to the profession of it is common unto all, and is equally made by all. Upon that plea of faith it is put unto the trial whether it were sincere, true faith or no, or only that which was dead and barren. And this trial is made solely by the fruits and effects of it; and otherwise in the public declaration of things unto all, it cannot be made.</p></blockquote>

<blockquote><p>[The saints] in heaven will behold an outward glory as they [behold] the human nature of Christ, which is united to the Godhead, as it is the body of that person that is God. And there will doubtless be appearances of a divine and inimitable glory and beauty in Christ’s glorified body, which it will indeed be a ravishing and blessed sight to see.

But the beauty of Christ’s body that will be beheld with bodily eyes will be ravishing and delighting chiefly as it will express his spiritual glories. The majesty that will appear in Christ’s body will express and show forth the spiritual greatness and majesty of the divine nature. The pureness and beauty of that light and glory will express the perfection of the divine holiness. The sweetness and ravishing mildness of his countenance will express his divine and spiritual love and grace.

Thus it was, when the three disciples beheld Christ at his transfiguration upon the mount. They beheld a wonderful, outward glory in Christ’s body, an inexpressible beauty in his countenance; but that outward glory and beauty delighted them principally as it was an expression or signification of the divine excellencies of his mind, as we may see by their manner of speaking of it.

It was the sweet mixture there was of majesty and grace in his countenance that ravished them; 2 Peter 1:16–18, “We were eyewitnesses of his majesty. For he received from God the Father honour and glory, when there came such a voice to him from the excellent glory, This is my beloved Son, in whom I am well pleased. And this voice we heard when we were with him in the holy mount.”

But especially by the account that John gives of it; John 1:14, “And the Word was made flesh and dwelt among us (and we beheld his glory, the glory as of the only begotten of the Father), full of grace and truth,” where John very probably had in his mind what he had seen in the mount at the Transfiguration. Grace and truth are not outward but spiritual glories.</p></blockquote>

<blockquote><p>The last day of judgement shall be on this manner:

I. Immediately before the coming of Christ, a the powers of heaven shall be shaken: the Sun and Moon shall be darkened, and the Stars shall seem to fall from heaven: at which sight the elect then living shall rejoice, but the reprobate shall shake every joint of them. a Matt. 24.29. Immediately after the tribulation of those days, shall the Sun be darkened, and the Moon shall not give her light, the Stars shall fall from heaven, and the powers of heaven shall be shaken:

      30. And then shall appear the sign of the Son of man in heaven: and then shall all the kindreds of the earth mourn, and they shall see the Son of man come in the clouds of heaven, with power and great glory. Lk. 21.26. Men’s hearts shall fail them for fear, and for looking after those things, which shall come on the world. 28. And when these things begin to come to pass, then look up, and lift up your heads, for your redemption draws near. 2 Tim. 4.8. Henceforth is laid up for me the crown of righteousness, which the Lord, the righteous judge shall give me at that day; and not to me only, but unto them that live his appearing.

II. Then the heavens, being all set on fire, shall with a noise like to that of chariot wheels, suddenly pass away, &amp; the elements, with the earth, and all therein shall be dissolved with fire. 2 Pet. 3.12. Looking for, and hasting unto the coming of the day of God, by which the heavens being set on fire, shall be dissolved, and the elements shall melt with heat. 13. But we look for new heavens, and a new earth, according to his promise, wherein dwells all righteousness. At the same time, when as all these things shall come to pass, a the sound of the last Trumpet shall be heard, sounded by the Archangel. And Christ shall come suddenly in the clouds, with power, &amp; glory, and a great train of Angels. a Matt. 24.

      31. And he shall send his Angels with a great sound of a Trumpet: 1 Thess. 4.16. The Lord himself shall descend from Heaven with a shout, even with the voice of the Archangel, and with the Trumpet of God: and the dead in Christ shall rise first. Math. 24.30. 1 Thess. 4.17. Then shall we which live and remain, be caught up with them also in the clouds to meet the Lord in the air, and so shall we ever be with the Lord.

III. Now at the sound of the Trumpet, the Elect which were dead, shall rise with those very bodies which were turned to dust, and one part rent from an other, shall by the omnipotent power of God, be restored, and the souls of them shall descend from heaven, and be brought againto those bodies. As for a them which then shall be alive, they shall be changed in the twinkling of an eye, and this mutation shall be instead of death. And at that time, the bodies shall receive their full redemption; b and all the bodies of the Elect shall be made like the glorious body of Christ Jesus, and therefore shall be spiritual, immortal, glorious, and free from all infirmity. 1. Cor. 15. 51, 52. We shall not all sleep; but we shall all be changed, in a moment, in the twinkling of an eye, at the last Trumpet.

      43. It is sown in dishonour, it is raised in honour: it is sown in weakness, it is raised in power.

      44. It is sown a natural body, it is raised a spiritual body.

IV. Last of all, when they are all convented [gathered] before the tribunal seat of Christ, he will forthwith place the Elect, severed from the reprobate, &amp; taken up into the air, at his right hand, and to them being written in the book of life, will he pronounce this sentence: Come ye blessed of my Father, possess the kingdom prepared for you from the foundations of the world. Matt. 25 33. He shall set the sheep on his right hand, and the goats on the left. 1 Thess. 4.17. Rev. 20.15. Whosoever was not found written in the book of life, was cast into the lake of fire.</p></blockquote>

<blockquote><p>VII. Christ will be the judge in that very visible nature in which he was condemned for us. For although judiciary Power is common to the whole Trinity, still it will be specially exercised by the incarnate son. Judgment is said to have been given him by the father… as being the king of his church, the avenger of his elect, the most strict punisher of the wicked and rebellious, the Lord of all. The former belong to grace, the latter to power and both pertain the office of Mediator. This he will do especially both for the greater consolation of the pious (who will look upon him as their defender and Advocate instead of their judge) and for the greater terror and confusion of the wicked, while they will see him reigning gloriously whom they barbarously and cruelly persecuted. …XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who, since he has been most fully satisfied for us and now intercedes for us in heaven, will then become as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works…. The pious will not hear the publication of their sins, but the reward of their love and beneficence. (3) The gratuitous mercy of God does not wish our sins to be remembered anymore, but casts them behind its back. Now what God has once wished to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious from which they are to be free. For Christ will return for this and–that he may be glorious in his saints and be admired in believers.</p></blockquote>

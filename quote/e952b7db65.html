</figure><figure class="quote" id="q-df862fb2e2" data-kw="">
<blockquote><p>There are but three senses of the word “prophesying,” which I can find anywhere else in the New Testament: 1. For such prophesying as is competent to all converted and gifted persons, when they are filled with a spirit of illumination and speak with other tongues as the Spirit gives them utterance: In which sense Joel foretold that daughters as well as sons, handmaids as well as men-servants, young and old should prophesy, Acts 2:17-18, which was accordingly fulfilled upon the day of Pentecost, for Acts 1:14 and 2:1, 4, this Spirit of prophesy was poured out upon all the disciples, men and women. 2. For such prophesying as is [materially] the preaching of ordinary ministers, although I know no text where without any controversy the word is used for the ordinary ministerial preaching; Yet I understand the word to be used in this sense (though by allusion only, whereof before), Rev. 11:3, ‘And I will give power unto my two witnesses and they shall prophesy a thousand two hundred and threescore days clothed in sackcloth.’ 3. For extraordinary prophesying from immediate and miraculous inspiration, in which sense it is often used in the New Testament, as I shall show anone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 5, “Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14 and 1 Cor. 12:28; Eph. 4:11, were extraordinary, and so not to continue: Or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry” in A Treatise of Miscellany Questions (Edinburgh, 1649), pp. 64-85, pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

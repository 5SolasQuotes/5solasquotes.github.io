<blockquote><p>VII. He calls both [kinds of people] in earnest [serio] and without any deceit. Concerning the elect there is no doubt. As to the reprobate, although they are not called ‘according to his purpose,’ or to salvation, nevertheless they are called in earnest, and salvation is offered them on condition of faith. Nor are they mocked because they have been deprived of the grace of believing. Rather, because they destroyed the original grace of their own accord, and also, by their evil passion, despised the means of grace, God therefore has the right to demand faith from them and uses it no less justly than do other creditors, so that their mouths are closed, they are without excuse, and the justice of God is upheld. Therefore, He does not call them to mock them, but in order to declare and reveal his justice.

VIII. Therefore, common calling is not the basis for any conclusion regarding election, both because common calling is extended to both the reprobate and the elect, and because it is subject to the condition of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in</cite>, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 20, sect. 7–8, pp. 116-17 Latin: conditione</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7091759340" data-kw="">
<blockquote><p>If it be said, that final perseverance, which is so express a condition of salvation in the new covenant, is not indeed the condition of our first justification, but it is the condition of the continuation of our justification; then they yield up their grand position, that whatever is a necessary condition of the new covenant is a necessary condition of justification: for it is that which they call the first justification alone which we treat about. And that the continuation of our justification depends solely on the same causes with our justification itself, shall be afterwards declared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-d7a8aa218c" data-kw="">
<blockquote><p>If you confess with your mouth the Lord Jesus and believe in your heart that God has raised Him from the dead, you will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 160-61 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | XCII. Nevertheless, when it is said that faith, as it justifies and saves, primarily deals with the Gospel promises, it should signify mainly and principally, not exclusively. For faith, as it saves and justifies, does not deal only with those promises. Faith is said to save and justify as it is the condition of the covenant of grace, where God no longer demands from us, under the penalty of eternal death and curse, the perfect and absolute observation of the law in all its details as the covenant of works required, but instead requires living faith, which works through love. While the Law of Moses says, “do and live,” the Gospel says, “believe and be saved.” However, the faith that the Gospel demands as the condition under which it offers us salvation, does not only regard the promises of the Gospel but also its commands and doctrines, such as the Resurrection of our Lord Jesus Christ, as is evident from the words of Paul:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-458e3f4f9d" data-kw="">
<blockquote><p>It is from eternity, part of the decree of election, although its awareness is given to the faithful at a certain time. In contrast, regeneration happens in time, starting with the first sparks of faith and the initial movements of repentance.</p></blockquote>

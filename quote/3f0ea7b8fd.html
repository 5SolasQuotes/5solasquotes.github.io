<blockquote><p>IV. Whether Acts 15:9 [“hearts purified by faith”] should be understood of the habit of faith, or indeed of the second act? Response: Of both; of the latter indeed proximately, of the former remotely as the principle by which or elicitive of actual faith.</p></blockquote>

<blockquote><p>That other [term] of ‘regeneration’, I take to be all one with spiritual life, taken in the largest sense; which life, according to the Scriptures, I distinguish into initial and actual. For as in the natural, sometimes the soul, which is usually called ‘the form by which’, and sometimes the esse, the ‘being’ itself of such or such a creature animated by his soul, is put for life, as that learned [Jerome] Zanchi well observes (Of the Nature of God, bk. 2, ch. 5, question 1): so is it in the spiritual life whereof we are now to treat. And upon this foundation it is that we rightly build our present distinction, which has clear footing also in the sacred volumes of eternal truth. 1. Initial (which we may also term seminal or potential life), I call that which consists in participation of the Spirit of Christ, as the form of this spiritual life: the Spirit being the first principle of regeneration, by whom the first seed and foundation thereof is laid in a Christian. And this is life as it were in the root, like unto the first principles of reason laid up in the rational soul, before it has actually enabled the body to move and act rationally. And of this, says acute [Francis] Junius (Of Paedobaptism, thesis 7), our Savior spake in Jn. 3; more clearly to our purpose is that of the apostle, Rom. 8:10, “The Spirit is life, because of righteousness,” where the Spirit, which is the cause of life, is put for life itself: and by ‘the Spirit’ is meant not the reasonable soul, but the Holy Ghost; if Calvin (and before him Chrysostom and Ambrose, and after him Peter Martyr) hit right in the exposition of it,¹ whereof for my part (after serious pensitation of all that any have said to carry it to another sense) I make no question. ¹ Galatians, in location: Vocabulo spiritus ne animam nostram intelligas, sed regenerationis spiritum quem vitam appellat Paulus. [By the term ‘spirit’, understand not our soul, but the Spirit of regeneration, which Paul calls life.] 2. Actual, I call that which consists properly in the very spiritual being itself actually produced in a Christian, by the Spirit bringing him forth a new man in Christ, in the ordinary course of regeneration of such as live to years, whereby he is enabled actually to believe, repent, etc. Rom. 6:11, “Likewise ye, reckon yourselves to be dead indeed unto sin: but alive unto God through Jesus Christ our Lord.” So Gal. 2:20 and elsewhere.</p></blockquote>

<blockquote><p>IV. Problem: Whether the will, both in the first and in the second moment of conversion, is determined by grace immediately, or indeed mediately through the ultimate judgment of the practical intellect? Response: See concerning this question the Appendix to the Disputations on Creation. V. Problem: Whether the affirmative opinion [that the will is determined in conversion only mediately] does not favor Pelagianism, and deny the necessity and efficacy of grace in the will? Response: Negative, because they can nevertheless defend special grace, and that efficaciously prevailing and conquering, which is never rejected or can be rejected by any hard heart, in the composite sense; moreover they attribute nothing of faculty or cooperation for spiritual life to man in the first moment of conversion—as can be seen in [John] Cameron’s disputation with Tilenus, and his apology against the epistle of the anonymous Remonstrant (entitled “The Epistle of a Learned Man,” etc.) afterwards published. VI. Problem: Whether the truth can be more easily, evidently, and solidly explained and defended against the Pelagians by this reasoning? Response: So indeed Cameron, just praised, seems to think, and with him Dr. Maccovius in his Academic Disputations recently published. Yet the ancient and received opinion is not obscurely preferred by Molinaeus in his Disputation on Free Will; Walaeus in his Disputation on the Conversion of the Will, in the year 1622, on the 17th day of March; Ames in his Medulla, and passim in his Anti-Remonstrant writings; and Spanheim, who appeared after the first edition of the present disputation, in his latest writing against Universal Grace. The Dominicans and other genuine Thomists, who today plead the cause of God in this matter against the Jesuits and other more recent Pelagians, do not think alike here—concerning which elsewhere. We touch on this question in the Disputations and Problems on Creation.</p></blockquote>

<blockquote><p>In the work of our regeneration three graces be required: the preventing grace, the working grace and the co-working grace. The preventing grace is when God of his mercy sets and imprints in the mind a new light, in the will a new quality or inclination, in the heart new affections. The working grace is when God gives to the will the act of well-willing, namely the will to believe, the will to repent, the will to obey God in his Word. (Velle credere, velle resipiscere, velle obedire.) The co-working grace is when God gives the deed to the will, that is, the exercise and practice of faith and repentance. The first gives the power of doing good, the second the will, the third the deed: and all three together make the work of regeneration. (Augustine, Of Grace &amp; Free Will, ch. 17) Now the will of man in respect of operation does not concur with God’s preventing grace, but is merely patient as a subject to receive grace. For it is the proper work of God to set or imprint a new faculty or inclination in the will, and that without any action of the said will. Nevertheless the will being once renewed and prevented, concurs by his operation with the working and co-working grace of God. For the will being moved by grace, wills and does indeed that whereunto it is moved. And the will to obey God, or to perform any like duty, proceeds jointly from two causes. From grace: in that it moves and causes the will to will to believe. From the will of man: in that being prevented and moved by God, it wills to believe, or to do any like duty. And therefore the ancient saying has his truth, ‘He that made thee without thee, does not regenerate or save thee without thee’ (Augustine, Sermon 15, Of the Words of the Apostles), because our conversion is not without the motion and consent of will, as our creation was. And that we do not mistake in this point, the order that is between man’s will and God’s grace must here again be remembered. In respect of time they are both together, and concur in the very first moment of our regeneration: in respect of the order of nature, the will does not first begin that which is good, and then after borrow aid from grace: but grace prevents, renews, and moves the will, and then the will moved or changed wills to be converted and to be healed in the first instant of conversion.</p></blockquote>

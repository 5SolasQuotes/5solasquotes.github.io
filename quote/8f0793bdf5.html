<blockquote><p>I answer, can the tithing man do his office, and the Constable, and petty Courts, and the presence of the King not be required for the execution of them; and shall the Supreme Court of the Kingdom have less power then Court-leet, or Court-Baron? Let reason and sense judge: So when it is asked who shall remove them? I say, Royall authority. This is that that Peter means, 2 Pet. 2.13, 14. Submit your selves to every Ordinance of man, for the Lord’s sake; whether it be to the King as Supreme, or unto Governors, as them that are sent of him for the punishment of evil doers, and for the praise of them that doe well. This Text is commonly perverted by our rotten Divines. Submit to every Ordinance of man for the Lord’s sake: the Ordinance is of man, the stamp of it is of God.

There be diverse Ordinances of man, of Monarchy, of Aristocracy, suppose of Democracy. Whatsoever the Ordinance of man be in the land thou livest in; if it be in the Low-Countries, submit to the Ordinance of Aristocracy for the Lord’s sake; if it be in England, submit to the Ordinance of Monarchy for the Lord’s sake; if in another place submit to that Ordinance for the Lord’s sake; still the Ordinance is of man, theirs is the mettle, and the stamp is of God.

For the Lord’s sake, whether it be to the King as the Supreme, or to Officers sent of him; why? for what? For the punishment of evil doers, and the praise of them that do well; so the Ordinance is to the praise of them that do well, and the punishment of them that do evil. Now the Ordinance in out Kingdom you know what it is, it is upon a pact or compact, and the greatest privilege of the Subject in that pact, is the great assembly of Parliament.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0a899d1746" data-kw="">
<blockquote><p>First, That whatsoever resistance is here forbidden and threatened [in Romans 13], relates to inferior Magistrates as far as their authority reaches according to laws, as well as supreme Magistrates.

I may no more resist a Constable commanding me, or arresting me, or distraining my goods according to Law, then I may do the King commanding me, &amp;c.

Yet the Doctor [Henry Fearne] takes no notice of this at all. But as if it were, not only the higher power, in the singular number, but the Highest in the Superlative degree; He restrains all to the King, which is a dangerous fallacy, not only in the present Question, but against all government.

To which I add, to refuse to be subject to the Parliament according to Laws, and to resist is much more (by this Scripture) undeniably a resisting the ordinance of God, and brings damnation.

And what then will he say to those that have done so too, and against the Parliament, and those sent by their authority unquestionable.</p></blockquote>

<blockquote><p>In an article on capital punishment in the Philadelphia Covenanter periodical (not to be confused with the Belfast Covenanter), edited by James M. Willson, the author contrasted the Gnostic or Marcionite view of the Old Testament’s penal laws held by John Paul, with the true Covenanter position adhered to by Thomas Houston:

Were the law which God gave to Moses admitted authority, there would be an end of this controversy [over capital punishment]; but the prevailing sentiment of the present day seems to be that of the Gnostics, who taught that the God of Israel was the devil, and that Jesus Christ came to destroy his power, and deliver men from his tyranny! The editor of the New York Tribune is wonderfully scandalized at being charged with infidelity; and yet he quotes, without remark, a passage from the Lynn Record, in which an “eye for an eye,” &amp;c., is termed infernal policy! Dr. Paul, of Ireland, (once a Covenanter,) calls the laws of the Old Testament Thomas Houston’s bloody laws! In this he offers a double insult to the Divine Majesty; first, in calling his laws bloody; secondly, by calling them Thomas Houston’s.</p></blockquote>

</figure><figure class="quote" id="q-fc9a48e5b2" data-kw="">
<blockquote><p>Does infidelity or difference of religion make void the magistrate’s just and legal authority? No. Does it free the people from their due obedience to him? No (1 Pet. 2:13-15; Rom. 13:1-4; Titus 3:1). Well then, do not the Papists, Anabaptists and others err who maintain that subjects ought not to suffer a king that’s an infidel, or obey that king in his just commands that differs from them in religion? Yes. By what reasons are they confuted?

1. Because we are commanded to submit ourselves to every ordinance of man (1 Pet. 2:13). Namely, in all that they command us, if it be not contrary to God and his command. Otherwise (according to Acts 4:19) it is better to obey God than man. And it is said ‘for the Lord’s sake’, that is, because it is God’s will to govern us by them.

2. Because the Christians which were at Rome were commanded by the apostle to subject themselves to the higher powers, and that without exception of religion and piety, and even to that heathen, the Roman emperor (Rom. 13:1).

3. Because the same apostle, writing to Titus, bids him exhort the Cretians, his hearers, to obey magistrates, what manner of ones soever they be, not only believing ones but also those that are unbelieving, as then they were yet, most of them (Titus 3:1).

4. Because when the apostle Paul was pursued for his life and charged with matters criminal, he appealed unto Caesar (Acts 25:10-11).

5. Because the Prophet Jeremiah did own the power of Zedekiah who had turned aside to a false worship and had despised the oath which he had made to the king of Babylon (Eze. 17:16-17). ‘Now hear I pray thee (says the prophet), O my lord the king: let my supplication, I pray thee, be accepted before thee’ (Jer. 37:20).

6. Because Christ Himself paid tribute to Caesar, though he was free, being both the Son of God by nature and son of David by birth (Matt 22:21; Rom. 13:7).

7. Because Paul did own and acknowledge the power of King Agrippa (Acts 26:2).</p></blockquote>

het%29%2C+O+my+lord+the+king%3A+let+my+supplication%2C+I+pray+thee%2C+be+accepted+before+thee%E2%80%99+%28Jer.+37%3A20%29.%0A%0A6.+Because+Christ+Himself+paid+tribute+to+Caesar%2C+though+he+was+free%2C+being+both+the+Son+of+God+by+nature+and+son+of+David+by+birth+%28Matt+22%3A21%3B+Rom.+13%3A7%29.%0A%0A7.+Because+Paul+did+own+and+acknowledge+the+power+of+King+Agrippa+%28Acts+26%3A2%29.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+Truth%E2%80%99s+Victory+Over+Error%2C+%28Banner+of+Truth%29%2C+pp.+175-76%2C+Ch.+23%2C+%E2%80%98Of+the+Civil+Magistrate%E2%80%99%2C+Question+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffc9a48e5b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fc9a48e5b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=Does%20infidelity%20or%20difference%20of%20religion,power%20of%20King%20Agrippa%20%28Acts%2026%3A2&amp;text=Does%20infidelity%20or%20difference%20of%20religion%20make%20void&amp;text=acknowledge%20the%20power%20of%20King%20Agrippa%20%28Acts%2026%3A2" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

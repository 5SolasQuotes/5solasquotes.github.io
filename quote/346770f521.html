<main class="wrap"><figure class="quote" id="q-346770f521" data-kw="">
<blockquote><p>The beginning of hungering and thirsting after righteousness lies in the birth of conviction of sin. In fact the presence of this element in it is what distinguishes true, deep repentance from every kind of superficial regret for the secondary consequences of sin. True repentance strips sin of all that is accidental.

It resembles an inner chamber where no one and nothing else is admitted except God and the sinner and his sin. Into that chamber all the great penitents like David and Paul and Augustine and Luther have entered, and each one in the bitter anguish of his soul has borrowed the words of the psalmist: ‘Against thee, thee only have I sinned, and done this evil in thy sight, that thou mightest be justified when thou speakest, and be clear when thou judgest.’ A repentant sinner acquits God and condemns himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Glory: Sermons Preached in the Chapel of Princeton Theological Seminary</cite>, (1922; Edinburgh: Banner of Truth, 1994), p. 37.</span></figcaption>

</figure><figure class="quote" id="q-f53ec8d01b" data-kw="">
<blockquote><p>Q. How is this Faith and Repentance confirmed and increased in us?

A. By three means especially.

Q. Which is the first?

A. A diligent and faithful reading of the holy Scriptures, and hearing of the same word preached, receiving it with all meekness and hearty obedience. …

Q. Which is the second?

Answ. Fervent and constant prayer unto God in the holy Ghost, both public and private according to his will. …

Q. Which is the third?

Answer. A right using and partaking of both the holy Sacraments. viz. Baptism, and the Supper of the Lord.</p></blockquote>

</figure><figure class="quote" id="q-4cdb14dafa" data-kw="">
<blockquote><p>For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), pt. 4, ch. 10, p. 481</span></figcaption>

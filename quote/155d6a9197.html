<main class="wrap"><figure class="quote" id="q-155d6a9197" data-kw="">
<blockquote><p>If any one saith, that the just ought not, for their good works done in God, to expect and hope for an eternal recompense from God, through His mercy and the merit of Jesus Christ, if so be that they persevere to the end in well doing and in keeping the divine commandments; let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, can. 26</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c9dddd0cc7" data-kw="merit obedience under law life the">
<blockquote><p>On this account, he is said to have been made under the law by an economical subjection that he might redeem us from the bondage of the law and confer upon us the adoption or the right of sons (Gal. 4:4, 5). On this, the right to life depends because “if children, then heirs” (Rom. 8:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.6.1c</span></figcaption>

</figure><figure class="quote" id="q-8f475c5af3" data-kw="">
<blockquote><p>Moreover, sure reason persuades that no one (Christ excepted), however just and holy, can merit grace de condigno for others. For there exists no pact, no promise concerning the merit of another&#x27;s salvation; and Christ alone, as head of the whole Church, had that grace by which he might merit grace and glory for all the members. … But just as it is certain that one cannot merit grace for another ex condigno, so there is no doubt that this can be done ex congruo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-5f83191034" data-kw="definite atonement elect">
<blockquote><p>The common opinion of the Reformed is that Christ (from the mere good-pleasure of the Father) was appointed and given as a Redeemer and head, not to all men, but to a certain number of men. By the election of God, these compose his mystical body. For these alone, Christ (perfectly acquainted with his call) in order to fulfill the decree of election and the counsel of the Father, was willing and determined to die; also to add to the infinite price of his death a most efficacious and special intention to substitute himself in their place and to acquire faith and salvation for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.8</span></figcaption>

</figure><figure class="quote" id="q-9eb8b9784d" data-kw="">
<blockquote><p>Seventhly, our merits depend on the merits of Christ, both because he merited for us the power of meriting, and because we merit as living members of Christ, and through the influence which we receive from him as from our head. Therefore it detracts from the glory of Christ if our merits are so imperfect that they are not merits ex condigno except by reason of God&#x27;s acceptance.</p></blockquote>

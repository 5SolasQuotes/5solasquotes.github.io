<main class="wrap"><figure class="quote" id="q-5eec83a32e" data-kw="">
<blockquote><p>The sanctification of the Sabbath belongs to all, chiefly to Magistrates &amp; Pastors.

The Magistrate, by the example of Nehemiah, must take care that the Sabbath be not wantonly abused, Neh. 13. 15, &amp;c. The same also must so moderate the strict observation of that day when need requires, that there be regard had to Charity by the example of the Macchabees, 1 Mac. 2. 41, and Constantine the Great who in extreme necessity permitted Husband-men to follow their Country work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), p. 370.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-e3edb3ec83" data-kw="">
<blockquote><p>The imposed use of Indifferencies has been (like the Canaanites to the Israelites) pricks in the eyes, and thorns (or goads) in the sides of, i. e. matter of much mischief and vexation to, the Church of God almost in all ages; Especially, in the Jewish Church, when it drew towards the dregs, much of this sediment appeared. How far the Papal, Antichristian Church is over-run with this ill humour, is notorious:

And it’s one great evil which our English Church now labours and groans under at this day. ‘Tis this, which has been the apple of contention, and bone of division; the stone of stumbling, and rock of offence among us, ever since the beginning of the Reformation, in the time of our Josiah, King Edward the 6th. And after many years freedom from this itch, it brake out again some years since, to our great disturbance, and scratching of one another.</p></blockquote>

</figure><figure class="quote" id="q-05f545afa1" data-kw="">
<blockquote><p>Previous to the time of Constantine, we find no trace of an image of Christ, properly speaking, except among the Gnostic Carpocratians, and in the case of the heathen emperor Alexander Severus, who adorned his domestic chapel, as a sort of syncretistic Pantheon, with representatives of all religions. The above-mentioned idea of the uncomely personal appearance of Jesus, the entire silence of the Gospels about it, and the Old Testament prohibition of images, restrained the church from making either pictures or statues of Christ, until in the Nicene age a great change took place, though not without energetic and long-continued opposition. Eusebius gives us, from his own observation, the oldest report of a statue of Christ, which was said to have been erected by the woman with the issue of blood, together with her own statue, in memory of her cure, before her dwelling at Cæsarea Philippi (Paneas). But the same historian, in a letter to the empress Constantia (the sister of Constantine and widow of Licinius), strongly protested against images of Christ, who had laid aside his earthly servant form, and whose heavenly glory transcends the conception and artistic skill of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Christian Church</cite>, (Charles Scribner’s Sons, 1910), 2.280–81.</span></figcaption>

<blockquote><p>That which pertains to the seventh day is expedient for the human being, tied up with various occupations, that God should choose one day for him in which he should exercise himself more greatly in prayer, and take delight in God more than on other days. We know Sabbath observation is perpetual among Christians, in order that they should abstain from sins and wickedness that offend God. But the time for working is fixed. God blessed the seventh day and without doubt set it apart for us, and he admonished us that if we would sanctify it to the Lord, then we would not be deprived of its blessing. It is true rest from external works, so that we might rejoice and take delight in the Lord. For all things have been made on our account, and, lest anyone should think that we Judaize, even the Sabbath was established for humankind.

We know what liberty of conscience is, but at the same time we should pay attention to the weakness of the people. If only the whole multitude would keep the Sabbath perpetually and no one would refuse. But since of course this is never achieved, we at least request that those whose concern it is would grant a certain day to the weak people, which they might consecrate to God. Not that we would intend other days for foolishness and those things which are opposed to God, but we seek that one day that we might reserve specially for God, and faith requires this. And if we do not do this we show that there is little of faith in us. Do we think that God cannot feed us unless we work every day? Some sin greatly in this matter, for they allow no rest or time off for servants or beasts of burden, as if God were not able to support them unless they work all the time. Paul in Hebrews 3 and 4 sweetly alludes to the Sabbath day and why it ought to be observed with the greatest diligence, and he says that we will be able to enter into that rest, and so on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Genesis</cite>, trans. Mickey Mattox, Reformation Texts with Translation, no. 13 (1531; Milwaukee WI: Marquette University Press, 2013), pp 113, 115.</span></figcaption>

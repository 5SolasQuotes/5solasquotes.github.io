<blockquote><p>That the Distinctive Principles may be maintained without compromise, the Reformed Presbyterian Church believes in and practices Close Communion. Both reason and revelation are in accord with this stand. Apart from Close Communion the discipline of the Church cannot be maintained. Common sense teaches that it is a glaring inconsistency to testify against anti-Christian doctrines and practices and at the same time admit to the highest privileges of the Church those who adhere to said doctrines and practices. For example, if a member of a Reformed Presbyterian congregation were to join an oath-bound secret society, it would be the duty of the Session to discipline him, and if he refused to retract, to exclude him from the Lord’s Table. The Lord’s Supper is the highest and holiest privilege which the Church has to offer. Would it be consistent for the Church to permit a non-member who belonged to an oath-bound secret society to partake of the Communion while at the same time it prohibited one of its own members on the ground that he belonged to the same society? The Communion is of value to the Church only to the extent to which her members are bound together by the common faith and a common life with one another and with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-tweed.html">J. B. Tweed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The communicants’ class</cite>, (2nd edn, Newton, 1960), p. 41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>43. But as for the outward ceremony of the action — whether or not the believers take it in their hands, or divide it among themselves, or severally eat what has been given to each; whether they hand the cup back to the deacon or give it to the next person; whether the bread is leavened or unleavened; the wine red or white — it makes no difference. These things are indifferent, and left at the church’s discretion. However, it is certain that the practice of the ancient church was for all to take it in their hands. And Christ said, “Divide it among yourselves” [Luke 22:17, Vg.]. The histories narrate that common leavened bread was used before the time of the Roman Bishop Alexander, who was the first who delighted in unleavened bread. But I see no reason for this, unless to draw the eyes of the common people to wonderment by a new spectacle, rather than to instruct their minds in sound religion. I ask all who are in the least affected by a zeal for piety whether they do not clearly see both how much more brightly God’s glory shines here, and how much richer: sweetness of spiritual consolation comes to believers, than in these lifeless and theatrical trifles, which serve no other purpose than to deceive the sense of a people stupefied. They call this the holding of the people by religion when they lead them at will — dulled and befooled with superstition. If anyone should like to defend such inventions by appealing to antiquity, I also am not ignorant of how ancient the use of chrism and exsuffiation is in baptism; how soon after the apostolic age the Lord’s Supper was corrupted by rust. But this, indeed, is the stubborn boldness of men, which cannot restrain itself from always trifling and wantoning in God’s mysteries. Let us, however, remember that God so esteems obedience to his Word that he would have us judge both his angels and the whole world in its light [1 Corinthians 6:2-3; Galatians 1:8]. Now, to get rid of this great pile of ceremonies, the Supper could have been administered most becomingly if it were set before the church very often, and at least once a week. First, then, it should begin with public prayers. After this a sermon should be given. Then, when bread and wine have been placed on the Table, the minister should repeat the words of institution of the Supper. Next, he should recite the promises which were left to us in it; at the same time, he should excommunicate all who are debarred from it by the Lord’s prohibition. Afterward, he should pray that the Lord, with the kindness wherewith he has bestowed this sacred food upon us, also teach and form us to receive it with faith and thankfulness of heart, and, inasmuch as we are not so of ourselves, by his mercy make us worthy of such a feast. But here either psalms should be sung, or something be read, and in becoming order the believers should partake of the most holy banquet, the ministers breaking the bread and giving the cup. When the Supper is finished, there should be an exhortation to sincere faith and confession of faith, to love and behavior worthy of Christians. At the last, thanks should be given, and praises sung to God. When these things are ended, the church should be dismissed in peace. 44. …Luke relates in The Acts that this was the practice of the apostolic church, when he says that believers “…continued in the apostles’ teaching and fellowship, in the breaking of bread and in prayers” [Acts 2:42, cf. Vg.]. Thus it became the unvarying rule that no meeting of the church should take place without the Word, prayers, partaking of the Supper, and almsgiving. That this was the established order among the Corinthians also, we can safely infer from Paul [cf. 1 Corinthians 11:20]. And it remained in use for many centuries after.</p></blockquote>

<blockquote><p>In this sacrament there are two things, a visible sign, and an invisible grace: there is a visible sacramental sign of bread and wine; and there is the thing and matter signified, namely the body and blood of Christ: there is an earthly matter, and an heavenly matter.

The outward sacramental sign is common to all; as well the bad, as the good. Judas received the Lord’s bread; but not that bread, which is the Lord to the faithful receiver. The spiritual part, that which feedeth the soul only the faithful do receive.

For he cannot be partaker of the body of Christ, which is no member of Christ’s body. This food offered us at the Lord’s table is to feed our souls withal; it is meat for the mind, and not for the belly. Our souls being spiritual can neither receive, nor digest that which is corporal, they feed only upon spiritual food. It is the spiritual eating that giveth life. The flesh saith Christ, doeth nothing profit. We must lift up our selves from these external and earthly signs, and like Eagles fly up and sore aloft; there to feed on Christ, which sitteth on the right hand of his father, whom the heavens shall keep until the latter day.

From thence and from no other Altar shall he come, in his natural body to judge both quick and dead. His natural body is local, for else it were not a natural body; his body is there, therefore not here: for a natural body doth not occupy sundry places at once. Here we have a sacrament, a sign, a memorial, a commemoration, a representation, a figure effectual of the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-7256bb65f0" data-kw="">
<blockquote><p>Besides, that which possesses all perfection, cannot be changed. If God changed, he would do so either for the better, or for the worse, or for something equal. Now he cannot change for the better, because he is the best: neither for the worse, for then he would not possess all perfections, for he would not have that by which he could preserve himself from becoming worse; nor can he receive any additional perfections equal to what he has already, otherwise he would not possess all.

Therefore, there is no changeableness in God; neither in his essence, his eternity, his understanding, nor his will; not in his essence, for being the first, he cannot be superseded by any prior being; being all-powerful, he cannot be injured by any; being most simple, he can be corrupted by none; being immense, he cannot be increased or lessened; being eternal, he cannot fail.

There is no change in his eternity, for where there is no succession, there is no mutation; neither in his understanding, for the knowledge of God is all-perfect; nor in his will, for the will of God is all-wise, to which nothing unforeseen can happen, so as to compel him to change his intentions for the better. Again, nothing can prevent and resist his will; he does, indeed, will the various changes of things, but his will itself remains unchangeable. This immutability of God is the foundation of our faith and hope.</p></blockquote>

</figure><figure class="quote" id="q-a019d5253b" data-kw="">
<blockquote><p>In the mean while Satan, using every exertion to subvert entirely the church erected at Geneva, which had been shaken to its very foundation, found in a short time some idle characters, who, for the purpose of concealing the great iniquity of the decree under the pretext of religion, determined that unleavened bread should be substituted for common, formerly used at the Lord’s table, with a view to afford an opportunity for fomenting new dissensions. And the great enemy of the Church would have succeeded in this plan, had not Calvin seriously admonished some good men, so displeased with the change as to consider it their duty to refrain from taking the Lord’s Supper, not to contend about a subject in itself indifferent. The use of unleavened bread commenced in the manner now stated, nor did Calvin on his future restoration think it worth while to make any opposition to the practice, though he [Calvin] did not attempt to conceal his approval of the use of common bread.</p></blockquote>

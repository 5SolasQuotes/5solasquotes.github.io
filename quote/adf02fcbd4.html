<main class="wrap"><figure class="quote" id="q-adf02fcbd4" data-kw="">
<blockquote><p>Were civil rulers seriously to consider their responsibility to God, and to discharge their duty in this manner, they would, indeed, be such as the Apostle represents them – ministers of God for good – bearing and employing the sword to some valuable purpose – revengers to execute wrath upon him that doeth evil.

As transgressors hate all restraints, and desire to perpetuate their evil deeds with impunity, should magistrates execute the laws faithfully, they would, no doubt, be represented as persecutors, and be told that, in their official capacity, they have nothing to do with religion, nor with the suppression of crimes in direct opposition to it, having no immediate warrant for such procedure in the New Testament.

They must not, however, desist from their duty, on account of the senseless clamour of the turbulent, licentious, or profane; they must not receive outcry and mere assertion for divine truth; and they must know, that men have no right whatever to suppose that the commands and examples of the Old Testament are merged in the more gracious doctrines and precepts of the New.

Indeed, there is not a single hint given, in all the New Testament, that the judicial laws and judicial decisions under the Mosaic dispensations were not to be referred to as examples for imitation in the Christian economy, when a similarity of circumstances might render such reference justifiable; nor that the laws against heresy, idolatry, blasphemy, sabbath-profanation, &amp;c., are repealed, any more than those concerning robbery or murder.

Innovators who assert that those laws are abrogated, or have lost their commanding influence, under the New Testament dispensation, must produced some plausible proof of this before their assertions are entitled to any credit. By setting up the New Testament in opposition to the Old, they throw manifest discredit on both.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf26fc11b4" data-kw="">
<blockquote><p>IF of holy letters we be not sleepy nor vain readers, but diligently mark what we read, we shall easily perceive that among other commandments of God this is not at the last nor the least, which he giveth concerning the bringing up of youth in the knowledge of his blessed will.

For the godly wisdom knoweth right well, that except younglings of a commonweal be virtuously brought up, and faithfully framed according the right rule of God’s holy appointment, it cannot come to pass, but that his glory (the good parents being once deceased) must needs be obscured in this world, the invocation of his name cease, and all godly religion decay: yea, the men themselves (if they be worthy of that name) must needs become brute-like, be carried about with every strange doctrine, contemn all laudable laws, break all good orders, follow their fleshly appetites, like unreasonable beasts, and so at last bring both themselves and their realms unto utter destruction.

Therefore as God in his holy law requireth of parents nothing more earnestly than to bring up their children virtuously and according to his word; so likewise all godly fathers and mothers have ever from the beginning done their uttermost endeavour to train up their younglings, even from the very cradles, in the nurture, fear, and doctrine of the Lord; supposing themselves then best to please God, and most to do the true office of godly and natural parents, when they study how to garnish, not their children’s bodies with gay and sumptuous vestures, but their minds with noble and precious virtues; not how to lift them up unto transitory dignities and worldly honours, which, as daily experience teacheth, are more brittle than glass and fade away like the grass, but how to make them honourable and praiseworthy in the sight of good men, and profitable to the commonweal, through virtue, learning, wisdom, and counsel.

And the more parents themselves did excel other in knowledge, wisdom, and learning, the greater desire had they to bring their children unto the like perfection, bearing heavily that theirs should in any point degenerate from their fathers’ virtues, and not orderly answer to the godly qualities of their noble parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 480-81.</cite></span></figcaption>

</figure><figure class="quote" id="q-dfdd2e9594" data-kw="">
<blockquote><p>It is hard to resist the conclusion that the inspired writers meant to convey the idea that the legislation at Sinai might be resolved into several codes. We believe that there were three, all differing in their predestined term of endurance. The ceremonial law is universally admitted to have fulfilled its function when Christ made his atoning sacrifice. The ordinary civil and criminal code of the Jews required to be adapted, like the corresponding laws in other countries, to the exact state of intellectual and moral development which the Hebrew nation had reached at the time of its promulgation, and necessarily became, in some particulars, antiquated whenever they rose above that position.

It is only in regard to the moral law, as summed up in the decalogue, that any dispute exists. It in several respects stood on a different footing from the remaining parts of the Mosaic law. While the other precepts were given to the people through the instrumentality of Moses, it was proclaimed from the top of Sinai by the voice of Jehovah himself, amid lightning, and thunder, and tempest, and every accompaniment fitted to inspire awe. While the other precepts were committed to whatever materials were then used for writing on, skins of animals perhaps, and were preserved, no one knows where, the decalogue was traced by the finger of God on two tables of stone, cut doubtless from the enduring granite of the mountain peak, and then laid up in the ark of the covenant in the holiest part of the tabernacle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-hunter.html">Robert Hunter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Literature of the Sabbath Question in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>Popery requires allegiance, in its highest degree, to the Roman Pontiff, thereby rendering undivided allegiance to the British Sovereign absolutely impossible. A Papist cannot be a true and trustworthy British citizen.

The peculiar constitution of the Romish system forms a distinction between it and all true Christian Churches; for since the Pope, its supreme head, is both ecclesiastically a priest and civilly a king, the allegiance which the members of that system are bound to render him is not, and cannot be merely ecclesiastical, but must be civil also, and consequently incompatible with supreme allegiance to any other sovereign.

To whatsoever extent the allegiance due to the Pope constrains a Papist to hold principles and be ready to perform acts contrary to British law, to that extent he is not and cannot become a British citizen. And since it is necessarily possible that the Papal claim may in any special emergency be so put forth as to constrain its adherents to engage in acts of direct hostility against the Government, it must be possible that he may at any moment, become not only not a true British citizen, but a direct enemy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Popery requires allegiance, in its highest degree, to the Roman Pontiff, thereby rendering undivided allegiance to the British Sovereign absolutely impossible. A Papist cannot be a true and trustworthy British citizen.

The peculiar constitution of the Romish system forms a distinction between it and all true Christian Churches; for since the Pope, its supreme head, is both ecclesiastically a priest and civilly a king, the allegiance which the members of that system are bound to render him is not, and cannot be merely ecclesiastical, but must be civil also, and consequently incompatible with supreme allegiance to any other sovereign.

<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate. 32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. … 9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ… 10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>

<blockquote><p>I. What was the will and intention of the Father and the Son in undergoing the death of the cross? Arminians: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that reconciliation and remission of sins might be obtained for all and every one, both those that perish and those that are to be saved, but applied only to believers. Therefore, although those things are obtained for all and every one, yet they are applied only to believers. Censure: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that the Son, through the ransom of his precious blood, might both obtain and apply remission of sins and eternal life to those whom the Father gave to him from eternity. Matthew 20:28; Hebrews 9:28; 1 Peter 2:24; Romans 3:25; 2 Corinthians 5:19; Colossians 1:21-22. To this pertain also those passages of Scripture, where Christ is said to have laid down his life for his sheep, to have given himself for his Church, to have redeemed the Church with his own blood. John 10:15; Ephesians 5:23, 25; Matthew 1:21; Acts 20:28. II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, he is the Savior of the elect only. John 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Matt. 20:28, John 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning he died efficaciously for all his sheep. John 10:15. And in these all and alone there is a certain special universality, as is in Ambrose lib. 1 de vocat. gent. c. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable. III. Whether the death of Christ and his resurrection, and also his intercession, are of equal extent? Arminians: Christ died adequately for all sinners, he rose again and intercedes with the intention of saving adequately for believers. Censure: As Christ died adequately for all and only the elect, so for them alone did he intercede in his state of humiliation, for them alone he rose again, and for them alone he now intercedes in heaven. Isaiah 53:17; John 10:15; 17:9; Hebrews 9:24.</p></blockquote>

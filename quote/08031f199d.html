<blockquote><p>Why do you say that through faith alone you are righteous? Not because I please God by the worthiness of my faith. It is because only Christ’s satisfaction, righteousness, and holiness make me righteous before God, and because I can accept this righteousness and make it mine in no other way than through faith (1 Cor. 1:30–31; Rom. 10:10; 1 John 5:10–12).</p></blockquote>
<figcaption>— <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a>, <cite>Heidelberg Catechism</cite>, Q. 61</figcaption>

</figure><figure class="quote" id="q-a8d5e74bd6" data-kw="">
<blockquote><p>However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers</p></blockquote>
<figcaption>— <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption>

<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span></div>

</figure><figure class="quote" id="q-f635f317d4" data-kw="">
<blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote>
<figcaption>— <a href="../authors/john-piper.html">John Piper</a>, <cite>This Momentary Marriage</cite>, p. 46</figcaption>

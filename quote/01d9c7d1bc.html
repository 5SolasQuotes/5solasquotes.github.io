<blockquote><p>4. They that distinguish between the key of order and the key of jurisdiction do without question allow the former to the presbyters. Now the key of order (as rightly understood, as Spalatensis has largely opened it) comprehends all that power whereby we do immediately work on the conscience, and so is exercised in foro interno, and not directly in externo. Now that which we have agreed on [in Baxter’s Association] is only so much as belongs to order, or to a presbyter as the ambassador of Christ and [as] his watchman over the souls of those people; and it is to be no further effectual than they conscientiously submit to it, voluntarily, without external force. It is but our preaching and applying God’s Word to the consciences of the hearers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>But we have yet more to do, for the consequence of our argument is also denied both by the prelatical faction and by others [congregationalists] (whom we are more sorry to contradict) holding that reasons fetched from the Jewish Church do better fat the prelates than the consistorians; howsoever now to fetch the form of government for the Church from the Church of the Jews, were, say they, to revive the Old Testament. To me it seems strange that both the one side and the other do when they please reason from the forms of the Jewish Church and yet they will not permit us to reason in like manner. The former go about to prove the prelacy by the high priesthood and the lawful use of organs in the Church from the like in the temple of Solomon. The latter do argue that a congregation has right not only to elect ministers, but to ordain them and lay hands on them because the people of Israel laid hands on the Levites. That the maintenance of the ministers of the Gospel ought to be voluntary, because under the Law God would not have the priests and Levites to have any part or inheritance in the land of Canaan, but to be sustained by the offerings and altars of the Lord. That the power of excommunication is in the body of the Church, because the Lord laid upon all Israel the duty of removing the unclean and of putting away leaven out of their houses at the feast of Passover. Is it right dealing now to forbid us to reason from the form of the Jews? I will not use any further expostulation, but let the reader judge. The truth is this, even as that which is in a child, as he is a child, agrees not to a man, yet that which is in a child, as he is animal rationale, agrees also to a man: so what we find in the Jewish Church, as it was Jewish or in infancy and under the pedagogy of the Law, agrees not indeed to the Christian Church. But whatsoever the Jewish Church had as it was a political Church, or ecclesiastical republic (of which sort of things, the diversity and subordination of ecclesiastical courts was one) does belong by the same reason to the Christian Church. I say further, though the commonwealth and civil policy of the Jews be not in all points a pattern to our civil policy, yet I am sure it is no error to imitate the civil policy of the Jews in such things as they had, not for any special reason proper to them, but are common to all well constituted commonwealths, and so we may argue from their commonwealth that it is a good policy to have diverse civil courts and the higher to receive appellations from the inferior, as it was among them. Shall we not by the very like reason fetch from their ecclesiastical republic, diversity of spiritual courts, and the supreme to receive appellations from the inferior, because so was the constitution of the Jewish Church and that under the common respect and account of a political Church, and not for any special reason which does not concern us.</p></blockquote>

s+this%2C+even+as+that+which+is+in+a+child%2C+as+he+is+a+child%2C+agrees+not+to+a+man%2C+yet+that+which+is+in+a+child%2C+as+he+is+animal+rationale%2C+agrees+also+to+a+man%3A+so+what+we+find+in+the+Jewish+Church%2C+as+it+was+Jewish+or+in+infancy+and+under+the+pedagogy+of+the+Law%2C+agrees+not+indeed+to+the+Christian+Church.+But+whatsoever+the+Jewish+Church+had+as+it+was+a+political+Church%2C+or+ecclesiastical+republic+%28of+which+sort+of+things%2C+the+diversity+and+subordination+of+ecclesiastical+courts+was+one%29+does+belong+by+the+same+reason+to+the+Christian+Church.+I+say+further%2C+though+the+commonwealth+and+civil+policy+of+the+Jews+be+not+in+all+points+a+pattern+to+our+civil+policy%2C+yet+I+am+sure+it+is+no+error+to+imitate+the+civil+policy+of+the+Jews+in+such+things+as+they+had%2C+not+for+any+special+reason+proper+to+them%2C+but+are+common+to+all+well+constituted+commonwealths%2C+and+so+we+may+argue+from+their+commonwealth+that+it+is+a+good+policy+to+have+diverse+civil+courts+and+the+higher+to+receive+appellations+from+the+inferior%2C+as+it+was+among+them.+Shall+we+not+by+the+very+like+reason+fetch+from+their+ecclesiastical+republic%2C+diversity+of+spiritual+courts%2C+and+the+supreme+to+receive+appellations+from+the+inferior%2C+because+so+was+the+constitution+of+the+Jewish+Church+and+that+under+the+common+respect+and+account+of+a+political+Church%2C+and+not+for+any+special+reason+which+does+not+concern+us.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+bk.+1+ToC+of+Aaron%E2%80%99s+Rod+Blossoming%2C+or+the+Divine+Ordinance+of+Church+Government+Vindicated%E2%80%A6+%28Edinburgh%3A+Ogle%2C+Oliver+%26+Boyd%2C+1844%29%2C+%7C+12.+Fourteen+arguments+to+prove+that+scandalous+and+presumptuous+offenders+against+the+moral+law+%28though+circumcised+and+not+being+legally+unclean%29+were+excluded+from+the+Passover+56%2C+p.+57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c7bcfc779.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href=

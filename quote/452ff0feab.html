<blockquote><p>Dort’s form of subscription [1619] remained in use in the Reformed churches of the Netherlands for almost two hundred years. In 1816, after the monarchy was restored following the Napoleonic wars, the Dutch Reformed church was reorganized, and a new form of subscription replaced that of Dort… the new version contained a weaker declaration of agreement with ‘the doctrine, which, in agreement with God’s Holy Word, is contained in the accepted forms of unity.&#x27;” p. 279 . Book Janssen, Roelf Christiaan – By this our Subscription: Confessional Subscription in the Dutch Reformed Tradition since 1816 PhD diss. (Theologische Universiteit, Gereformeerde Kerken, 2009) 480 pp. On the era before 1619, see pp. 22-33. On the era from 1619 to 1816, see pp. 33-45. . Lutheranism On the Post-Reformation to Today Cochrane, Arthur C. – ‘The Act of Confession-Confessing’ in Sixteenth Century Journal, vol. 8, no. 4, The Formula of Concord: Quadricentennial Essays (Dec., 1977), pp. 61-83 Cochrane is a confessional Lutheran professor at Wartburg Theological Seminary (ELCA, Iowa) that here gives helpful thoughts and observations about confessing in general and historically in the Post-Reformation up through to the (German) Barmen Declaration (1934). Preus, Robert – 6. ‘Confessional Subscription’ in eds. Kiehl &amp; Werning, Evangelical Directions for the Lutheran Church (1970), pp. 43-52 . On the 1800’s Lee II, James A. – ‘Theodosius Harnack &amp; Confessional Subscription’ in Concordia Theological Quarterly, vol. 89:1 (Jan. 2025), pp. 61-83 Harnack (1817–1889) was a Baltic, German, Neo-Lutheran theologian of the Erlangen school. Abstract: “This essay explores the significant contributions of Theodosius Harnack to the nineteenth-century discourse on subscription to the Lutheran Confessions, contextualized against the debate over Johannes von Hofmann‘s theory of the atonement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal</cite>, (July 2007), pp. 256-82</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a547140f2" data-kw="">
<blockquote><p>2. The person [candidate for being the pastor] is tried by Timothy and Titus, and so by the presbytery, his ability, that he be able to teach others (2 Tim. 2:3), that he be apt to teach (1 Tim. 3:2; Tit. 1:9), else the Timothies of the Church lay hands suddenly on him, contrary to 1 Tim. 5:22. So the presbytery tries according to these canons with us, his skill in the languages: Latin, Hebrew, and Greek; his ability of preaching popular sermons, and interpreting Scripture, in controversies, in chronology, and the history of the Church, and he must be proved and tried by the people, by preaching sundry sermons to them (1 Tim. 3:10), and let these first be proved, and let them use the office, whatever officers they shall be, Pastors, Doctors, Elders or Deacons. … 3. …and another day set for his ordination, at which day the edict is called, all who have anything to object against his life and doctrine are thrice publicly at the church door invited to come and object. And this we think is [in Greek] ‘episkepein andra,’ (Acts 6:3) and ‘dokimazein andra,’ (1 Tim. 3:10) ‘to find out’ and ‘to try the man’. The day of ordination… the pastor calls him up before the congregation, and demands if he be willing to accept the charge, and he must testify his consent as Isaiah (Isa. 6:8; Jer. 6:7,8; Acts 9:20). Then the pastor asks the peoples’ consent, which they testify by their [in Greek] ‘keiro onia’, ‘the lifting up of their hands’ (as Acts 14:23), and the man must please the whole multitude (as Acts 6:5; 1:26). This being done, the pastor… with the Presbytery lays their hands on his head, and prays that God would bless him, as the apostles did (Acts 6:6). The apostles prayed and laid their hands on them (Acts 13:3). They prayed and laid their hands on them (1 Tim. 4:14; 1 Tim. 5:22), all being done, the eldership of the congregation give him the right hand of fellowship (as Gal. 2:9)… And this order in substance is kept in ordaining doctors, elders, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 20, 3rd Article, ‘Calling of Officers, especially Pastors’</span></figcaption>

</figure><figure class="quote" id="q-942957c3d0" data-kw="">
<blockquote><p>Accordingly we see that the Councils to which this specious coloring is given, are no other than six or seven spurious Councils held after the light of sound doctrine was extinguished, and discipline had decayed, and when the merest dolts were present — Councils which exhibit no appearance of ancient dignity, but smack of the Gothic tyranny of the Roman See.</p></blockquote>

<blockquote><p>2…. Now, in order that true religion may shine upon us, we ought to hold that it must take its beginning from heavenly doctrine and that no one can get even the slightest taste of right and sound doctrine unless he be a pupil of Scripture. Hence, there also emerges the beginning of true understanding when we reverently embrace what it pleases God there to witness of Himself… 3… Then we may perceive how necessary was such written proof of the heavenly doctrine…</p></blockquote>

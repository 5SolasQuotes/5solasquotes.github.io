<main class="wrap"><figure class="quote" id="q-04a4146caa" data-kw="">
<blockquote><p>It is a clear case, that these three [belief, fear and love] are the only means, yea a perfectly sufficient means to make the solder and the union between God and man, and to bring a man to the possession and fruition of God (for this comprehends the whole man), so that the whole man is possessed of God, and inflamed by God, when his understanding knows Him, and sees the excellency that is in Him, and when the affections of his heart cleave to Him, and close with the most sovereign affections of fear and love, and then when all his whole man is at the command of this, etc.</p></blockquote>

</figure><figure class="quote" id="q-b7a08b602c" data-kw="">
<blockquote><p>18. That imputation of the righteousness of Christ is neither fictitious, nor ideal, nor absurd; nor does it overthrow the δικαιοκρισία [dikaiokrisia, righteous judgment] of God, nor does it clash with human reason or practice. Nay, it is established by the Pontificals themselves through the trafficking of papal indulgences and the market of satisfactions and pardons, where the λογισμός [logismos, reckoning/imputation] and communication of another’s righteousness — albeit fictitious — is manifestly taught. It is no wonder, however, that the imputation of the righteousness of Christ is denied and opposed in this matter by those who neither know nor feel the union of ourselves with Christ and the power and efficacy thereof, and who prefer the means of salvation to be profitable to themselves [as independent workers] rather than gratuitous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

on%20of%20the%20righteousness%20of%20Christ&amp;text=to%20themselves%20%5Bas%20independent%20workers%5D%20rather%20than%20gratuitous" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b26f83fb13" data-kw="">
<blockquote><p>Consent I. They [Romanists] grant that in justification sin is pardoned by the merits of Christ, and that none can be justified without remission of sins: and that is well. II. They grant that the righteousness whereby a man is made righteous before God, comes from Christ, and from Christ alone. III. The most learned among them say that Christ’s satisfaction, and the merit of his death is imputed to every sinner that does believe, for his satisfaction before God: and hitherto we agree. The very point of difference is this: We hold that the satisfaction made by Christ in his death, and obedience to the Law, is imputed to us and becomes our righteousness. They say, it is our satisfaction and not our righteousness whereby we stand righteous before God: because it is inherent in the person of Christ as in a subject. Now the answer of the Papist to the former question is on this manner: The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification, is an excellent gift of God, and has his reward of God; and is the matter of our justification before man: because it serves to declare us to be reconciled to God, and to be justified; yet we deny it to be the thing, which makes us of sinners to become righteous or just before God. And this is the first point of our disagreement in the matter of justification: which must be marked; because if there were no more points of difference between us, this one alone were sufficient to keep us from uniting of our religions: for hereby the Church of Rome does raze the very foundation.</p></blockquote>

</figure><figure class="quote" id="q-4ee5d0584b" data-kw="">
<blockquote><p>There is a twofold charge commenced against us, [1] as sinners, and breakers of the Law; [2] as hypocrites and unsound believers. To the first we have nothing but the merits of Christ to plead; to the second, a fruitful obedience; or else, Paul in the opposition between works and faith, means by works, legal observances; by faith true Christianity [inclusive of it working; see Manton’s larger context]. The Jews boasted of their legal observances, to the rejection of the faith of Christ; and James by faith, [meant] a dead faith; and by works, [he meant] Christian duties, or acts of obedience to God; not external observances of the law of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 336</span></figcaption>

<blockquote><p>The order of the divine eternal decrees, as to their priority one unto another in order of nature and reason, so as not the decrees themselves, which are all absolutely free and irrespective, but the things decreed, should be one for another, hath been at large discoursed of and discussed by many. But there are yet not a few who suppose those very discourses on all hands to have more of nicety and curious subtilty than of solid truth unto edification. And because this is a matter wherein the Scripture is utterly silent, though one opinion may be more agreeable to sound reason than another, yet none is built upon such certain foundations as to become a matter of faith, or the principle of any thing that is so.

That which explains this order most conveniently and suitably unto divine wisdom, will, and sovereignty, and which best answers the common apprehensions of rational natures and the rules of their actings, is to be preferred before any opinion that includes what is opposite unto or alien from any of these things, which that order hath respect unto. From any such order in the decrees of God no advantage can be drawn unto the opinion under consideration; but if men may be allowed to suppose what they will, they may easily infer thereon what they please. Let us, therefore, take a view of the several series of divine decrees, which have been confirmed with a considerable suffrage of learned men, setting aside particular conjectures, which never received entertainment beyond the minds of their authors. And these may be reduced unto three:-

All agree that the glory of God is the utmost and supreme end that he intendeth in all his decrees. Although they are free acts of his will and wisdom, yet, on the supposition of them, it is absolutely necessary, from the perfection of his being, that he himself or his glory be their utmost end. His absolute all-sufficiency will not allow that he can in them have any other end. Accordingly, in pursuit of them he makes all for himself, Prov. xvi. 4; and they serve to declare and make known the perfection of his nature, Ps. xix. 1; Rom. i. 19, 20. And it is his glory, in the way of justice and mercy, which he ultimately intends in his decrees concerning the salvation of man by Jesus Christ.

Whereas many things are ordered by him in a subserviency hereunto, the decrees of God concerning them are conceived by some in that order which answers the order of their accomplishment; as, first, they say, God decreed to make the world, and man therein upright in his image; secondly, to permit the fall and the consequents thereof, man being to that end left unto the liberty of his will; thirdly, he designed to send his Son to be incarnate, for the work of their redemption; fourthly, he decreed to give eternal life unto as many as should believe on him and obey him; and, lastly, he determined to bestow effectual grace on some persons in particular, to work faith and obedience in them infallibly, and thereby to bring them unto glory, unto the praise of his grace and mercy.

According unto this order of God’s decrees, it is plain that in the order of nature the predestination of Christ is antecedent unto the election of other particular or individual persons, but withal that it is consequential unto the decree concerning the permission of the fall of Adam; and, accordingly, his incarnation doth suppose it; which is inconsistent with the opinion under examination.

Others take a contrary course, and, by a misapplication of a common rule, that what is first in intention must be last in execution, they suppose the order of God’s decrees, being his intentions or purposes, to be best conceived in a direct retrogradation unto the order of their execution. Supposing, therefore, the decree of glorifying himself in the way before mentioned, they judge God’s first decree in order of nature to be for the eternal salvation and glory of some certain persons, who are actually at last brought thereunto; for this being the last thing executed must be first intended.

Secondly, In subserviency hereunto, he purposeth to give them grace, and faith, and obedience thereby, as the way to bring them unto the possession of glory. Thirdly, Unto these purposes of God they make the decrees concerning the creation and permission of the fall of man, with the incarnation and mediation of Christ, to be subservient, some in one method, some in another. But that all their conceptions must have an inconsistency with the predestination of Christ unto his incarnation antecedent unto a respect unto sin and grace, is plain and evident.

But whereas both these ways are exposed unto insuperable objections and difficulties, some have fixed on another method for the right conception of the order of God’s eternal decrees in these things, which hath a consistency in itself, and may be fairly brought off from all opposition, which is the utmost that with sobriety can be aimed at in these things, namely, that nothing be ascribed unto God in the least unsuited unto the infinite perfections of his nature, nor any thing proposed unto the minds of men inconsistent with the general principles and rules of reason. And those lay down the general rule before mentioned, namely, that what is first in intention is last in execution.

But, secondly, they say withal, that this rule concerns only such things as in their own nature, and in the will of him that designs them, have the relation of end and means unto one another; for it hath no place among such things as are not capable of that relation. And, moreover, it is required that this end be ultimate and supreme, and not subordinate, which hath also the nature of the means. The meaning of it, therefore, is no more but that in all rational purposes there are two things considered, first, the end aimed at, and then the means of its effecting or accomplishment; and that in order of nature, the end, which is the last thing effected, is the first designed, and then the means for it; which things are true, and obvious unto the understanding of all men.

According unto this rule, they ascribe unto God but two decrees that have any order of priority between them. The first is concerning his end, which is first intended and last executed; the other concerning all those means which, being in the second place intended for the production of the end, are first accomplished and wrought. The first of these, which is the supreme end of all the dispensations of God towards the things that outwardly are of him, is his own glory, or the declaration of himself in a way of justice and mercy, mixed with infinite wisdom and goodness, as he is the first Being, sovereign Lord and Ruler over all.

The second decree, of things subordinate and subservient hereunto, consisteth in an intention concerning all intermediate acts of divine wisdom, power, and goodness, which tend unto the production of this ultimate end. Such are the creation, the permission of the fall, the pre-ordination of Christ, and others in him, unto grace and glory, by the way and means thereunto appointed.

Now, although these things are evidently subordinate and subservient unto one another, and although there may be apprehended singular decrees concerning them, yet because none of them do lie in the order of the means and ultimate end, there is no priority of one decree before another to be allowed therein; only a decree is supposed of disposing them in their execution, or the things executed, into that order, both in nature and time, as may constitute them all one suitable means of attaining the supreme end intended. Now, it is evident that, according unto this order, there cannot be a priority in the pre-ordination of Christ unto the decree of the permission of the fall and entrance of sin.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffe185d668" data-kw="descent paradise not local hell">
<blockquote><p>Was the soul of Christ, after its separation from the body, translated to paradise immediately? Or did it descend locally to hell? The former we affirm; the latter we deny against the papists and Lutherans. The papists maintain that the soul of Christ really and by presence descended into hell and remained there just as long as his body was in the sepulchre, for the purpose of freeing the souls of the fathers of the Old Testament detained in limbo. We reject a local descent.</p></blockquote>

</figure><figure class="quote" id="q-c9dddd0cc7" data-kw="merit obedience under law life the">
<blockquote><p>On this account, he is said to have been made under the law by an economical subjection that he might redeem us from the bondage of the law and confer upon us the adoption or the right of sons (Gal. 4:4, 5). On this, the right to life depends because “if children, then heirs” (Rom. 8:17).</p></blockquote>

</figure><figure class="quote" id="q-158f4a70da" data-kw="">
<blockquote><p>Christ is represented in Scripture as looking forth on a world of immortal spirits — who had cast off their allegiance to their rightful sovereign — who had banded themselves together against his authority, and were therefore justly obnoxious to severest punishment. He looked and there were none to help — he wondered that there was none to uphold — and, in the greatness of his love, he determined to seek and to save. Leaving the bosom of the Father, and becoming incarnate, he dwelt amongst us, a man of sorrows and acquainted with grief. The malice and the ingratitude of men, the assaults of Satan, the treachery of his enemies, and the desertion and denial of his friends — the agony of the garden, the night of grief in Herod’s hall, the shame and pain of the accursed tree, and the hidings of his Father’s face, were all endured.

That which bore up his holy human soul during the terrible conflict in which he fought our battle with the adversary, was the joy set before him, even the joy of bringing many sons and daughters unto glory; and now that he has triumphed, and has ascended up on high, and has again taken unto himself the glory which he had with the Father before the world was, he is spoken of in the text and in all Scripture, as rejoicing over his people with joy. They are his by creation — they are his by purchase — they are his by adoption — they are his by a begun and progressive sanctification. In the counsels of eternity were they given unto him by the Father — he loved them with an everlasting love; when the fulness of time had come, he sought them and he found them.

The co-equal and co-eternal Spirit quickens and renews them. He dwells in them, and carries on towards perfection the holiness already begun. There is nought in the contemplation of the natural man to call forth the joy of the Saviour; but, if we are his, then are we washed in his blood, and clad in his righteousness. His likeness is impressed on our souls — the impress is becoming, day by day, more manifest, and He rejoices that it is so. There is joy among the angels of heaven, we are told, when a sinner turns from the error of his ways; but, from the test, we learn, that a joy more ineffable still rises in the heart of Him whose nature is infinite, and whose capacities are boundless, when he turns to behold his image and superscription in the souls of his people.

Oh, Brethren, if it be indeed true that the believer is the object of such love, and the cause of such joy, and if we are believers, what manner of persons ought we to be? — how wary, how watchful in our every-day life and conversation? — how willing to bear and forbear for Jesus’ sake? — how able to spend and be spent in his work? He loved his people, and he saved, and is saving them. His delights are with them. He rejoices to contemplate, in their increasing resemblance to himself, the results of his tabernacling among us in the days of his flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reid-ormond.html">John Reid Ormond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ s Joy in His People’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

nk">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-3477747fa7" data-kw="">
<blockquote><p>From the ancient counsels of eternity, let us come down to the fulness of time, when lo! in our world, and in our own nature, that Wonderful Person in whom God’s whole family was chosen. He came forth from the Father full of the designs of salvation. He walked on the earth in the greatness of his strength, and in his deep self-humiliation. Tokens of kindness, emblems, beginnings of salvation, he strewed around him. But no human or angelic being comprehended the extent and mysteries of that which was working within his heart. (Thou Lamb of God, permit me by faith to come near that most sacred shrine of the Divinity!) There the schemes of mercy were deposited: there the glowing flames of unquenchable love were ever burning.

The love which redeemed the world frequently laboured to pour itself forth in addresses to sinful men. The words of truth and grace proceeded from his lips in new and inimitable strains. O ye sons of men, why were your hearts so hard? He said, “I have laboured in vain, I have spent my strength for nought, and in vain!” But joy was set before him, when the Father spake to him thus: “It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob; I will also give thee for a light of the Gentiles, that thou mayest be my salvation to the ends of the earth.”

In the garden of Gethsemane, and upon the cross, the persons, work, and success, of true ministers were heavy upon him. Jesus suffered Divine wrath, and bowed his head in death, that the prosperity of this work might be secured, that the Gospel might be preached with the Holy Ghost sent down from heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Bishop: A Sermon, Preached, February 3. 1790, at the Ordination of the Rev. David Todd, co-Pastor with the Rev. John Patrick, in the Presbyterian Church, Peter Street, Soho in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, and A Serious Call Res</cite></span></figcaption>

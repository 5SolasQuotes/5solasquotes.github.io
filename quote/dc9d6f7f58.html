<main class="wrap"><figure class="quote" id="q-dc9d6f7f58" data-kw="">
<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jame-owen.html">Jame Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b792111be" data-kw="">
<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Lev. 10</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-97222af452" data-kw="">
<blockquote><p>This distinction the priests must carefully observe, and take heed of making any blunders… He enquires concerning one deviation from the appointment… Now observe here: 1. The gentle reproof Moses gives to Aaron and his sons for this irregularity… Yet observe how very mildly he deals with Aaron and his sons, considering their present affliction. He only tells them they should indeed have eaten it in the holy place, but is willing to hear what they have to say for themselves, being loth to speak to the grief of those whom God had wounded… 2. The plausible excuse which Aaron makes for this mistake. Moses charged the fault upon Eleazar and Ithamar (Lev. 10:16), but it is probable that what they did was by Aaron direction, and therefore he apologized for it… (2) How he makes this an excuse for his varying from the appointment about the sin-offering… He does not plead that his heart was so full of grief that he had no appetite for it, but that he feared it would not be accepted. Note: [1] Acceptance with God is the great thing we should desire and aim at in all our religious services… 3. The acquiescence of Moses in this excuse: He was content, Lev. 10:20. Perhaps he thought it justified what they had done. God had provided that what could not be eaten might be burnt. Our unfitness for duty, when it is natural and not sinful, will have great allowances made for it; and God will have mercy and not sacrifice. At least he thought it did very much extenuate the fault; the spirit indeed was willing, but the flesh was weak [Mt. 26:41]. God by Moses showed that he considered his frame. It appeared that Aaron sincerely aimed at God’s acceptance; and those that do so with an upright heart shall find He is not extreme to mark what they do amiss. Nor must we be severe in our animadversions upon every mistake, considering ourselves, lest we also be tempted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Lev. 10, vv. 12-20</cite></span></figcaption>

</figure><figure class="quote" id="q-f8bd697434" data-kw="">
<blockquote><p>For the benefit of Christian love and concord may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They [nonconfomrits] prefer their own manner of worshipping God as better than the [Anglican] Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

<blockquote><p>40. I have before proved how faulty the priests’ calling was in Christ’s time, and the Temple and synagogue worship, and the Pharisees’ long liturgies, on pretence whereof they devoured widows’ houses, and their corrupt doctrine, and how great the faults were in the Churches of Corinth, Galatia, Ephesus, Sardis, Laodicea, Thyatira, Pergamos [Rev. 2-3], and those that James wrote to, from which none were commanded to depart;¹ And to condemn Christ or his apostles as favoring or using sinful communion is worse in Christians than it was in the Pharisees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | No Command to Depart; Don’t Censure Christ</cite></span></figcaption>

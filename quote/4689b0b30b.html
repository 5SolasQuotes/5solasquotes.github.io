<main class="wrap"><figure class="quote" id="q-4689b0b30b" data-kw="">
<blockquote><p>So a holy person rejoiceth that the way of holiness is the appointed way to Heaven… he delights in the Gospel-constitution, because it requires universal holiness… This is solid rational religion, fit to be depended upon, in opposition to the antinomian licentiousness, the freaks of enthusiasm, and the irrational flights of passion and imagination on the one hand; and in opposition to formality, mere morality, and the self-sprung religion of nature on the other… Men are naturally averse to this Gospel method of salvation… they will endeavor to widen the way to Heaven, and persuade themselves they shall attain it, notwithstanding their continuance in some known iniquity, and though their hearts have never been thoroughly sanctified… How many give up their hopes of Heaven rather than part with sin… and must not such degenerate creatures be renewed ere they can be holy, or see the Lord!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons (Philadelphia, 1864), vol. 1, Sermon 9, ‘The Connection Between Present Holiness and Future Felicity’, on Heb. 12:14</cite>, pp. 277-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum, the Mysterie and Marrow of the Bible (London, 1657), book 3, ch. 4, aphorism 2</cite>, p. 788</span></figcaption>

</figure><figure class="quote" id="q-475892f890" data-kw="">
<blockquote><p>We are not enemies to good works (as our adversaries falsely charge us), nay we preach good works, we exhort to good works, we establish good works, teaching the right use of them out of the Word of God: which is not to concur, or be joined with faith in our justification, but to follow necessarily and issue out of faith, as lively testimonies thereof, to the glory of God, the example of others, and our comfort…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Papismi (London, 1592), The Five Other Popish Sacraments, The Benefits of our Redemption, Third Part: of Justification, 4th Question</cite>, p. 595</span></figcaption>

— Andrew Willet, Synopsis Papismi (London, 1592), The Five Other Popish Sacraments, The Benefits of our Redemption, Third Part: of Justification, 4th Question, p. 595">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+not+enemies+to+good+works+%28as+our+adversaries+falsely+charge+us%29%2C+nay+we+preach+good+works%2C+we+exhort+to+good+works%2C+we+establish+good+works%2C+teaching+the+right+use+of+them+out+of+the+Word+of+God%3A+which+is+not+to+concur%2C+or+be+joined+with+faith+in+our+justification%2C+but+to+follow+necessarily+and+issue+out+of+faith%2C+as+lively+testimonies+thereof%2C+to+the+glory+of+God%2C+the+example+of+others%2C+and+our+comfort%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+Synopsis+Papismi+%28London%2C+1592%29%2C+The+Five+Other+Popish+Sacraments%2C+The+Benefits+of+our+Redemption%2C+Third+Part%3A+of+Justification%2C+4th+Question%2C+p.+595&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F475892f890.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/475892f890.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20are%20not%20enemies%20to%20good,example%20of%20others%2C%20and%20our%20comfort&amp;text=We%20are%20not%20enemies%20to%20good%20works%20%28as&amp;text=God%2C%20the%20example%20of%20others%2C%20and%20our%20comfort" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6806e030aa" data-kw="">
<blockquote><p>On the one hand, it was stated that grace only serves to restore human willpower for good and to put humans themselves to work. Good works, in that case, were definitely necessary for salvation, whether by a necessity of merit (Rome) or by a necessity of causality and effectiveness (Remonstrants). And from the antinomian side it was said objectively that the righteousness and holiness of Christ remained completely external to a person, not only in justification but also in sanctification, so that repentance, conversion, prayer for forgiveness, and good works were totally unnecessary, bore a legalistic character, and failed to do justice to the perfect sacrifice of Christ. Lutherans tried to avoid both extremes and conducted a long-lasting and vehement debate on the appropriateness or inappropriateness of the proposition ‘Good works are necessary to salvation.’… The Reformed were more moderate in their judgment, regarded the Lutheran debate as a dispute over words, and could not see the big difference between the rejected formula ‘Good works are necessary to salvation’ and another that some Lutherans (like Quenstedt and Buddeus) had approved: ‘It is impossible to be saved without good works.’ They had no objection to calling good works necessary to salvation provided this did not imply a ‘necessity of causality or merit or effectiveness’ but implied a necessity of presence of the means and ways to obtain eternal salvation. Voetius even believed that in a sense good works can be called ‘the cause of eternal life,’ that is, not a ‘meritorious’ but a ‘preparatory’ and ‘dispositional’ cause. (G. Voetius, Select Disputations, vol 5, 675 ff.) Speaking along these lines, they undoubtedly had Scripture on their side… . Good Works Sanctification manifests itself in good works, which according to the Heidelberg Catechism arise from the principle of a true faith, conform to the law of God, and are done for his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics (Baker, 2008), vol. 4, Part 1, ch. 4, ‘Passive and Active Sanctification’, pp. 254-256 Some footnotes have been omitted.</cite></span></figcaption>

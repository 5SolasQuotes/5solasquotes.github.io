<main class="wrap"><figure class="quote" id="q-cdc29cae6a" data-kw="">
<blockquote><p>8th Practice. In some parish-churches where the sectaries are put in, they have put down all singing of psalms… and will not suffer the parishes to enjoy any singing of psalms; and in other places, they begin to put down all prayer in the public assemblies, and to say there must be only discoursing and preaching; and in places where they cannot prevail to shut out singing of psalms, they in a contemptuous manner clap on their hats in the time of singing of psalms, and having been pulled off, put them on again; yea in prayer also many of them keep on hats.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna</cite>, … (London, 1646), Catalogue, ‘Some Passages in the Prayers of the Sectaries’, pp. 56-57. See also the Third Part, New &amp; Further Discovery, ‘A Passage sent in a letter dated June 16, 1646…’, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“8th Practice. In some parish-churches where the sectaries are put in, they have put down all singing of psalms… and will not suffer the parishes to enjoy any singing of psalms; and in other places, they begin to put down all prayer in the public assemblies, and to say there must be only discoursing and preaching; and in places where they cannot prevail to shut out singing of psalms, they in a contemptuous manner clap on their hats in the time of singing of psalms, and having been pulled off, put them on again; yea in prayer also many of them keep on hats.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67d3f536c8" data-kw="">
<blockquote><p>Some of the interpreters refer these words [1 Cor. 11:16] to the question in hand, and think that the apostle is here opposing the custom of the Churches to these that contended for men covering their heads in public meetings: but the better sort take this to be spoken against the study of contention, and think the apostle his meaning here is only to show that it is not his fashion, nor the fashion of the Churches of God, to be contentious for matters of such indifferency as those were of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-lindsay.html">David Lindsay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ceremonies of the Church</cite>, … (London, 1625), p. 23 Lindsay was a prominent bishop and defender of the Articles of Perth (1618).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-e0af007caa" data-kw="">
<blockquote><p>Divine Apostolical Institutions (that we may draw to our purpose) were again of two sorts: First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15:1, for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the congregations, and some other the like. Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor [John Prideaux, d. 1650];</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Daniel Cawdrey &amp; Herbert Palmer</cite>, Sabbatum Redivivum: or, The Christian Sabbath Vindicated (London, 1645), fourth part, ch. 1, ‘The Lord’s Day is of Divine Institution’, p. 463 Irregular page numbering Westminster divines</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Divine Apostolical Institutions (that we may draw to our purpose) were again of two sorts: First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15:1, for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the congregations, and some other the like. Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor [John Prideaux, d. 1650];”

— Westminster Divines, Daniel Cawdrey &amp; Herbert Palmer | Sabbatum Redivivum: or, The Christian Sabbath Vindicated (London, 1645), fourth part, ch. 1, ‘The Lord’s Day is of Divine Institution’, p. 463 Irregular page numbering Westminster divines">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDivine+Apostolical+Institutions+%28that+we+may+draw+to+our+purpose%29+were+again+of+two+sorts%3A+First%2C+variable%2C+or+temporary%2C+which+were+such+injunctions+as+were+prescribed%2C+either+for+some+special+ends%2C+as+that+law+for+abstaining+from+blood%2C+and+things+strangled%2C+Acts+15%3A1%2C+for+avoiding+offence+to+the+Jews%2C+or+to+some+special+nations%2C+or+persons%2C+as+agreeable+to+the+customs+of+those+places+and+times%2C+as+that+of+women+being+vailed+in+the+congregations%2C+and+some+other+the+like.+Secondly%2C+invariable+and+perpetual%3A+such+as+concerned+the+whole+Church%3A+This+distinction+we+received+from+that+learned+and+Professor+%5BJohn+Prideaux%2C+d.+1650%5D%3B%E2%80%9D%0A%0A%E2%80%94+Westminster+Divines%2C+Daniel+Cawdrey+%26+Herbert+Palmer+%7C+Sabbatum+Redivivum%3A+or%2C+The+Christian+Sabbath+Vindicated+%28London%2C+1645%29%2C+fourth+part%2C+ch.+1%2C+%E2%80%98The+Lord%E2%80%99s+Day+is+of+Divine+Institution%E2%80%99%2C+p.+463+Irregular+page+numbering+Westminster+divines&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe0af007caa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e0af007caa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/westminster-on-head-coverings/#:~:text=Divine%20Apostolical%20Institutions%20%28that%20we%20may,and%20Professor%20%5BJohn%20Prideaux%2C%20d.%201650&amp;text=Divine%20Apostolical%20Institutions%20%28that%20we%20may%20draw%20to&amp;text=that%20learned%20and%20Professor%20%5BJohn%20Prideaux%2C%20d.%201650" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-fdb471fcca" data-kw="">
<blockquote><p>Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-richardson.html">John Richardson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Choice Observations &amp; Explanations upon the Old Testament</cite>, … which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.”

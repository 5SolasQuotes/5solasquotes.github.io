<main class="wrap"><figure class="quote" id="q-d8449ae2d1" data-kw="">
<blockquote><p>Is it not a received maxim, that no man ought to be condemned for consequences drawn from his doctrine, when he disclaims them? Is it not vastly more agreeable to the law of love and charity, which thinks no evil, to put as favorable a construction upon men’s words as they can possibly admit of?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Rash prejudices engaging men in opposition, they will not own the truth when represented to them; having hated it without knowledge, they hate it against knowledge, and so are hardened against the ways of God; which is the case of many, who, in a blind zeal, have appeared against the public ministry and ordinances, and, being engaged, are loth to strike sail and lay down their defiance, when sufficient conviction is offered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-895f6f5922" data-kw="">
<blockquote><p>Although a Church be defective in purging out of corrupt members, yet that does not pollute the ordinances to others, or necessitate them to separate from them. These Churches continue to be Churches, and the ordinances to be ordinances of Christ, although such were continued in communion with them; and, notwithstanding thereof, these who were free of those corruptions are approven and commended by Jesus Christ: And if it were not so, that a person’s endeavoring in his station to amend such a fault, and to have such scandals censured, did not exempt him from guiltiness so as to continue in Church communion, although the plurality of officers should be short of their duty in that respect; then there might be still separation after separation in infinitum [to infinity].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-50108d16de" data-kw="">
<blockquote><p>Paul says, ‘Godliness is our gain’, and the reason is, because ‘it has the promise of this life and the life to come.’ (1 Tim. 4:8) Upon this we must be admonished evermore to worship God, and that with all care and diligence, because the worship of God is not his benefit, but our benefit and salvation.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

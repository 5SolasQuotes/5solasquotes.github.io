<blockquote><p>Question: Whether it is permissible to migrate and transfer from one Church to a more perfect Church; or whether one must indeed remain perpetually in the Church whose communion one has entered. Answer: Conclusion 1. It is permissible to migrate from a Church laboring under errors (though they do not undermine the entire foundation) in doctrine; especially if scandals have arisen and errors are more firmly established, and there is no hope of correction. Thus migration from a Lutheran Church or from the original and Five-Article Remonstrant Church (for judgment about Socinian Remonstrants must be made differently) to a Reformed Church has never been disapproved by us. Conclusion 2. Even from a Church which in doctrine is indeed sound, but is schismatic and finally lapses into errors unless it maturesly[?] recedes and returns to where it was undone. Such I judge to have been the congregation of the Brownists, who some years ago in Leiden, under the guidance of [John] Robinson, a man otherwise known for his piety, erudition, and zealous devotion, used to be held. Conclusion 3. It is not to be disapproved that someone, in pursuit of better progress and tranquility of conscience, should pass over to a Church purer and more perfect in the simplicity of rites, governance, and discipline, adding also in effective ministry and preaching, in public and domestic exercises of piety, and in effective and more frequent examples of piety; provided it is done through migration from place to place. Indeed, change of habitation wards off the appearance of schism, scandals, contentions, and other inconveniences that might arise from there. Conclusion 4. But to transfer from one Church to another of the same confession or even of a different language known to oneself, without the conscience and consent of both Churches, indeed goes against the order established by Christ, and begets contentions, factions, schisms, scandals. Conclusion 5. It must not be denied, however, that prudently something should be allowed or even done in various cases. Such as, for example, where particular contentions arise between someone and a minister, or ministers, or presbytery, or some brothers in a certain Church: it is better after reconciliation has been initiated, either wholly or temporarily to dismiss the one demanding it, so that both his and the Church’s tranquility may be consulted, and all occasions for renewed exacerbations may be more effectively cut off, or so that impending schisms may be prevented. … 17th Question: Whether for the sake of greater purity and integrity, one should move from one Church to another even without the consent of the Church being left? Answer: 1st Conclusion: If the Churches into whose communion one moves were previously gathered or constituted in greater purity and integrity of doctrine and rites, either before corruption or even after corruption, whether initiated or established, in the same place, city, field, or district, I see no reason why explicit and external communion with the Church in which one has hitherto lived cannot be desired towards better and more perfect things. Thus in Belgium, Lutherans moving from their Churches to ours are welcomed with goodwill; although our people are not unaware that Lutherans do not approve of them leaving. 2nd Conclusion: The situation is different if someone had made a separation from Lutheran Churches and ours, especially ones not yet established, before the [Lutheran] Book of Concord [1580, which was separatistic] and devised new and separate Churches: then I would not wish anyone to be the author of a division, against the common consensus and protestation of the reforming theologians (about which see Sacramentary History of Hofmann).

1. Because at that time there was a distrust of doctrine, confined to one article concerning the presence of the body in the Supper… according to the declaration of both parties in the Marburg Colloquy of 1529.

2. Because the ubiquity [of Christ’s human nature] with appendices, and conditional predestination, along with the true, final apostasy of the faithful, were not commonly accepted then [by the Lutherans], let alone elevated into the doctrines of the Church and fundamental principles.

3. Because the Lutherans themselves had not yet formally resolved their previous schism, and as if they had ejected us from their Churches. 3rd Conclusion: Where there is agreement in doctrine, but rightly someone dissents in rituals and governance, he can nevertheless exercise communion in that Church without approval of these defects, whether directly or indirectly: I would not wish to be the author of a migration from his Church, except in cases where the Church of the same confession and doctrine without those defects, and without the burden or annoyance of tolerating them, can be had; he would be cast out, or by schism negatively, to live outside all ecclesiastical communion; or by positive schism, to establish another separate Church there in the same place, against the Church which should have been and whose liberty permits it. And I think this was the cause that was discussed among English theologians and Separatists or Brownists (as they are called) before. Leaving hypotheticals, we disapprove their theoretical and principal assertions against the Anglican Church, with Paget, Ames, and others alien to ceremonies and the episcopal government of the Anglicans. 4th Conclusion: Yet it is far from me to accuse orthodox and pious brothers of schism who, in recent years, have freely through the Anglican Churches and pulpits, the most frequently, with the ceremonies imposed by the new Papists, had secret and publicized committees separated from their conscience for their building; so that they did not send the rejection of the Anglican Churches, the better of reformationist times and the powers of truth from the lords, expecting in the meantime. The right to do so was suitable for themselves as well as for some Belgian Churches, the time for the contention in the course of the baptism: Read the apology for the fact in 26 &amp; 29.</p></blockquote>

<blockquote><p>Some of these excellent men [at Bothwell] now went the length of disowning the authority of the king and government altogether. They contended that, by overturning the true religion, by setting up Prelacy and Erastianism, by ruining the covenanted work of reformation, and by persecuting to the death its faithful adherents, Charles had perfidiously violated the conditions of his coronation oath, and forfeited all right to their allegiance. Another party, however, much more numerous though less conspicuous, because less violent and extreme, defended their appearance in arms on other grounds. While they condemned the proceedings of the government as arbitrary and tyrannical, they were not prepared to renounce their allegiance to it in civil matters; they held with the compilers of our [Westminster] Confession [ch. 23], that ‘infidelity or difference in religion doth not make void the magistrate’s just and legal authority, nor free the people from their due obedience to him;’ and though they lamented as much as their brethren the general defection of all classes from the engagements of the [Solemn League and] covenant [1643], they could not see how this denuded the sovereign of his authority, which they were ready to acknowledge so long as he was, by the common consent of the nation, recognized as its ruler. At the same time, they considered themselves warranted to assume the attitude of self-defence against the intolerable oppressions and illegal encroachments which had, ‘contrary to all law and humanity,’ been practiced on them; and the reasons on which they justified their appearing in arms were chiefly these — that all other modes of redress had been closed against them; and that they found it necessary for the defence of the Protestant religion and Presbyterian government, and for the preservation of his majesty’s person and throne from the projects of Popish adversaries. A declaration embodying these views was prepared and presented at the council of war, before the battle of Bothwell Bridge; but through the opposition of the more violent leaders it was unhappily rejected.‡ There is reason to believe that this paper contained the sentiments of the most judicious, as well as of the great majority of the suffering Presbyterians; and that, had it been adopted, it might have recommended their cause more to the country at large, procured greater accessions to their numbers, and perhaps have insured success at an earlier period of the contest. ‡ This declaration is given in Wodrow’s History, iii. 96. In venturing these remarks we are far, very far, from allowing that those of the Covenanters who openly cast off allegiance to Charles suffered justly.</p></blockquote>

<blockquote><p>6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good.

7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God.

8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times.

9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power.

10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.</p></blockquote>

<blockquote><p>And to complete the dismal scene of our misery, we have had for a long time among us one of the most scandalous, pernicious and most unaccountable schisms that perhaps ever was in any age of the Church; a schism carried on by three weak men, supported by a poor people, and both are equally ignorant of the nature of union with, and separation from, a Church, and of what will justify the one or other; they cannot, in a consistency with their principles, hold communion with any Church this day on earth. We confess to our shame there are many things wrong with us, and that there are errors in the administration, against which we are, with the help of grace, still struggling and contending; and we resolve ever to plead against such corruptions: But no man of common understanding will think this national Church should be cast off, and that we should separate from her; we have a good constitution; we have a standard of doctrine without error; Westminster Confession of Faith, which we own as the confession of our faith; we have subscribed and preach the doctrine therein contained; our worship is pure, without men’s additions; our discipline and government, in their constitution, are agreeable unto, founded on, and appointed in the Word of God; and there are no sinful terms of communion imposed. As we cannot, and hope never shall, justify the measures some take, and for which they shall answer to God; so we will not despise the dust of Zion: What of the covenanted work of reformation is remaining among us, we must favor that dust, and look on it as precious, and pray and wrestle, by the help of grace, that our Lord would return to build his own House (for men have not courage to do it) and take a new infeftment[?] thereof by a cloud of his glory. There are a set of faithful ministers in this Church who are troubled for the many offenses that are given, and for laying so many stumbling blocks before the blind: And as they mourn for these in secret, so they give frequent testimony against them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>But because he conceives the dissenting churches to be true churches also, their ministers generally men of real piety, good learning, and zealously active to save immortal souls… And… because he finds the discipline of the Established Church defective… on the other hand [he] finds the preaching of the dissenting ministers generally more close, methodical, and lively; their ministrations more pure, without those human mixtures… the power of practical religion is more visibly kept up among them… These, and other considerations of the like nature, determine him to hold stated communion with some dissenting congregation, where he thinks himself better edified than in the parochial assemblies. He judges himself obliged to get the best helps he can for his soul, and thinks he ought not to be more restrained in the choice of a spiritual guide for the benefit of his soul than he is in the choice of a lawyer or physician for the preserving of his estate and bodily health.</p></blockquote>

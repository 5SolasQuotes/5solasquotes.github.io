<main class="wrap"><figure class="quote" id="q-db1d403020" data-kw="">
<blockquote><p>I confess there is a double glory of God, manifested in Christ: The one is the glory of his pure grace in conferring the greatest good and honour that the creature is capable of, as namely in the hypostatical union of the manhood of Christ to the second person in the Trinity.

Secondly the glory of God’s remunerative justice in the highest degree possible, both in respect of the reward, the greatest that possibly could be deserved (for that hypostatical union could not be deserved) and that is the glorification of the human nature of Christ, both in respect of his glory absolute, and of his glory relative, as by whom salvation is procured to others: as also in respect of the desert, the greatest I think that possibly could be, to wit, the humiliation of the Son of God to the death of the cross in way of obedience to his Father’s will.

There is also a glory of God that appears in Christ, not in several, as a sole means thereof, but in common with other means jointly concurring thereunto: and that is the glory of God in the way of mercy mixt with justice, in saving sinners for the obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ.html">The Person of Christ</a></span></div>

</figure><figure class="quote" id="q-56ca4a6008" data-kw="">
<blockquote><p>Although he took on him those infirmities which belong unto our human nature as such, and are inseparable from it until it be glorified, yet he took none of our particular infirmities which cleave unto our persons, occasioned either by the vice of our constitutions or irregularity in the use of our bodies. Those natural passions of our minds which are capable of being the moans of affliction and trouble, as grief, sorrow, and the like, he took upon him; as also those infirmities of nature which are troublesome to the body, as hunger, thirst, weariness, and pain,—yea, the purity of his holy constitution made him more highly sensible of these things than any of the children of men;—but as to our bodily diseases and distempers, which personally adhere unto us, upon the disorder and vice of our constitutions, he was absolutely free from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, Pneumatologia, or a Discourse Concerning the Holy Spirit, bk. 2, ch. 3, p. 167</span></figcaption>

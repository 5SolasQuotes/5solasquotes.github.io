<main class="wrap"><figure class="quote" id="q-826a2502f3" data-kw="">
<blockquote><p>Q. 34. Seeing the Lord’s day is for the commemoration of Christ’s resurrection, must we cease the commemoration of the works of creation, for which the seventh-day sabbath was appointed?

A. No: the appointing of the Lord’s day is accumulative, and not diminutive, as to what we were to do on the sabbath. God did not cease to be our Creator and the God of nature, by becoming our Redeemer and the God of grace; we owe more praise to our Creator, and not less. The greater and the subsequent and more perfect work comprehendeth the lesser, antecedent, and imperfect. The Lord’s day is to be spent in praising God, both as our Creator and Redeemer; the creation itself being now delivered into the hands of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 131.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1285d36e5" data-kw="">
<blockquote><p>He shall see more largely of the travail of his soul when his people shall have sent forth his gospel into all nations, and it shall have been blessed for the conversion of the whole heathen—when the corn of wheat that has fallen into the ground and died, shall bring forth much fruit, and the handful of corn in the earth upon the top of the mountains shall shake with fruit like Lebanon for abundance.

Now, we anticipate the period when the entire world shall be recovered to an acknowledgment of the true God and Jesus Christ whom he has sent, and when the spiritual reign of truth and piety shall be unlimited. For the whole earth is to be filled with His glory. The little leaven is to leaven the whole lump. The kingdoms of this world are to become the kingdoms of our Lord, and he shall reign for ever. The stone cut out without hands is to become a great mountain and fill the whole earth.

The doom of every Pagan temple is pronounced. The debasing influence of idolatry shall everywhere yield to the renovating force of Christian truth, and the pollutions of heathenism disappear before the extended empire of Immanuel. When this time comes, as come it shall, it will be the fruit of the Redeemer’s sacrifice, and will add even to the sum of his felicity.

And what benevolent spirit, looking to the present debased state of the world, would not rejoice when every solitary place is gladdened with the voice of the gospel—and the earth yields her increase—and God, even our own God, doth bless us—and the Christian graces blossom like the rose of Sharon, where now the spiritual wilderness stretches out in dreary monotony—and “the wolf dwells with the lamb, and the leopard lies down with the kid, and the calf, and the young lion, and the fatling together; and a little child shall lead them. And there shall be nothing to hurt nor to destroy in all my holy mountain, saith the Lord; for the earth shall be full of the knowledge of the Lord, as the waters cover the sea.</p></blockquote>

<blockquote><p>48. Q. When begins the Lord’s day?

A. In the morning. Act. 20.7.

When Paul came to the Church at Troas, he had a mind to spend a Lord’s day with them, though he was in great haste to depart so soon as he could. He came therefore to their assembly at the time that they came together according to their custom: but he kept them till the end of that day: (for he would not travel on the Lord’s day) and having dismissed the assembly, he departed. Now it is said, that he continued his speech till midnight (Acts 20. 7) even till break of day (ver. 11.) and then departed: which departure of his is said to be on the morrow. By this punctual expression of the time it appears that the first day of the week, the Lord’s day, ended at midnight: and that then the morrow began. Now to make a natural day which consisteth of twenty four hours, it must begin and end at the same time: for the end of one day is the beginning of another. There is not a minute betwixt them. As therefore the Lord’s day ended at midnight, so it must begin at midnight: when we count the morning to begin. Which is yet more evident by this phrase (Mat. 28.1.) In the end of the Sabbath (namely of the week before, which was the former Sabbath) as it began to dawn (namely) on the next day, which was the Lord’s day) or (as Joh. 20.1.) when it was yet dark there came divers to anoint the body of Jesus, but they found him not in the grave: he was risen before: so as Christ rose before the Sun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 24-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The hurtful winds of Infidelity, or Deism, are blowing, which strike at the roots, and deny all supernatural revelation, or at least discard all the supernatural mysteries of the Christian religion, which depraved reason is not able to comprehend, such as the doctrine of the incarnation of the Son of God, and of his satisfaction to justice, of the necessity of regeneration, of justification by his imputed righteousness, of sanctification by his Spirit: these, and the like supernatural doctrines of our holy religion, I say, are exploded by many in our day, insomuch that through many places of Scotland, instead of the gospel of Christ, nothing is to be heard, but the dry sapless harangues of heathenish morality. And what must become of those poor souls that are daily entertained with such food? Why, Solomon answers the question, when he tell us, “Where no vision is, the people perish.” The hurtful wind of Arian heresy has been travelling through the land, and appeared before the bar of the Assembly without any becoming censure.

The doctrine of self-love also, whereby the creature is exalted above the glorious Creator. We have been long taught, that the chief end of man is, to glorify God, and that whether we eat or drink, or whatever we do, we ought to do all to the glory of God. And, to be sure, that which is the chief end of man, ought also to be the leading and chief motive of all his moral and religious actions. But now it is a doctrine sustained by the National Assembly, that our own delight, pleasure, and satisfaction in glorifying God, is the chief motive of all virtuous and religious actions; whereby the creature’s happiness is preferred unto the glory of God, who made all things for himself.

And I cannot shun to observe, that God, in a way of righteous judgment, is answering many according to this idol of jealousy set up in the temple of God, by letting them adopt, and embrace a religion that lies all in internal feelings, pleasure, and satisfaction to themselves; while the declarative glory of God, and the honour of the Redeemer’s crown and kingdom in the world, is none of their concern; yea, it torments them to hear of a testimony against the indignities done to him in the land wherein we live. I might here also insist on the injuries done to the doctrines of the grace of God, in the Acts of Assembly, 1720 and 1722, with relation to the Marrow of Modern Divinity whereby a bundle of precious truths are condemned, and lie under the rubbish ever since, which I hope shall yet be brought forth unto victory.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The hurtful winds of Infidelity, or Deism, are blowing, which strike at the roots, and deny all supernatural revelation, or at least discard all the supernatural mysteries of the Christian religion, which depraved reason is not able to comprehend, such as the doctrine of the incarnation of the Son of God, and of his satisfaction to justice, of the necessity of regeneration, of justification by his imputed righteousness, of sanctification by his Spirit: these, and the like supernatural doctrines of our holy religion, I say, are exploded by many in our day, insomuch that through many places of Scotland, instead of the gospel of Christ, nothing is to be heard, but the dry sapless harangues of heathenish morality. And what must become of those poor souls that are daily entertained with such food? Why, Solomon answers the question, when he tell us, “Where no vision is, the people perish.” The hurtful wind of Arian heresy has been travelling through the land, and appeared before the bar of the Assembly without any becoming censure.

The doctrine of self-love also, whereby the creature is exalted above the glorious Creator. We have been long taught, that the chief end of man is, to glorify God, and that whether we eat or drink, or whatever we do, we ought to do all to the glory of God. And, to be sure, that which is the chief end of man, ought also to be the leading and chief motive of all his moral and religious actions. But now it is a doctrine sustained by the National Assembly, that our own delight, pleasure, and satisfaction in glorifying God, is the chief motive of all virtuous and religious actions; whereby the creature’s happiness is preferred unto the glory of God, who made all things for himself.

And I cannot shun to observe, that God, in a way of righteous judgment, is answering many according to this idol of jealousy set up in the temple of God, by letting them adopt, and embrace a religion that lies all in internal feelings, pleasure, and satisfaction to themselves; while the declarative glory of God, and the honour of the Redeemer’s crown and kingdom in the world, is none of their concern; yea, it torments them to hear of a testimony against the indignities done to him in the land wherein we live. I might here also insist on the injuries done to the doctrines of the grace of God, in the Acts of Assembly, 1720 and 1722, with relation to the Marrow of Modern Divinity whereby a bundle of precious truths are condemned, and lie under the rubbish ever since, which I hope shall yet be brought forth unto victory.”

— Ebenezer Erskine, The angel s seal set upon God’s faithful servants, when hurtful winds are blowing in the church militant. Being the substance of three sermons preached in the new church of Bristo, at Edinburgh, at, and after the celebration of the sacrament of the Lord’s Supper there, October 10, 11, and 17, 1742’ ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+hurtful+winds+of+Infidelity%2C+or+Deism%2C+are+blowing%2C+which+strike+at+the+roots%2C+and+deny+all+supernatural+revelation%2C+or+at+least+discard+all+the+supernatural+mysteries+of+the+Christian+religion%2C+which+depraved+reason+is+not+able+to+comprehend%2C+such+as+the+doctrine+of+the+incarnation+of+the+Son+of+God%2C+and+of+his+satisfaction+to+justice%2C+of+the+necessity+of+regeneration%2C+of+justification+by+his+imputed+righteousness%2C+of+sanctification+by+his+Spirit%3A+these%2C+and+the+like+supernatural+doctrines+of+our+holy+religion%2C+I+say%2C+are+exploded+by+many+in+our+day%2C+insomuch+that+through+many+places+of+Scotland%2C+instead+of+the+gospel+of+Christ%2C+nothing+is+to+be+heard%2C+but+the+dry+sapless+harangues+of+heathenish+morality.+And+what+must+become+of+those+poor+souls+that+are+daily+entertained+with+such+food%3F+Why%2C+Solomon+answers+the+question%2C+when+he+tell+us%2C+%E2%80%9CWhere+no+vision+is%2C+the+people+perish.%E2%80%9D+The+hurtful+wind+of+Arian+heresy+has+been+travelling+through+the+land%2C+and+appeared+before+the+bar+of+the+Assembly+without+any+becoming+censure.%0A%0AThe+doctrine+of+self-love+also%2C+whereby+the+creature+is+exalted+above+the+glorious+Creator.+We+have+been+long+taught%2C+that+the+chief+end+of+man+is%2C+to+glorify+God%2C+and+that+whether+we+eat+or+drink%2C+or+whatever+we+do%2C+we+ought+to+do+all+to+the+glory+of+God.+And%2C+to+be+sure%2C+that+which+is+the+chief+end+of+man%2C+ought+also+to+be+the+leading+and+chief+motive+of+all+his+moral+and+religious+actions.+But+now+it+is+a+doctrine+sustained+by+the+National+Assembly%2C+that+our+own+delight%2C+pleasure%2C+and+satisfaction+in+glorifying+God%2C+is+the+chief+motive+of+all+virtuous+and+religious+actions%3B+whereby+the+creature%E2%80%99s+happiness+is+preferred+unto+the+glory+of+God%2C+who+made+all+things+for+himself.%0A%0AAnd+I+cannot+shun+to+observe%2C+that+God%2C+in+a+way+of+righteous+judgment%2C+is+answering+many+according+to+this+idol+of+jealousy+set+up+in+the+temple+of+God%2C+by+letting+them+adopt%2C+and+embrace+a+religion+that+lies+all+in+internal+feelings%2C+pleasure%2C+and+satisfaction+to+themselves%3B+while+the+declarative+glory+of+God%2C+and+the+honour+of+the+Redeemer%E2%80%99s+crown+and+kingdom+in+the+world%2C+is+none+of+their+concern%3B+yea%2C+it+torments+them+to+hear+of+a+testimony+against+the+indignities+done+to+him+in+the+land+wherein+we+live.+I+might+here+also+insist+on+the+injuries+done+to+the+doctrines+of+the+grace+of+God%2C+in+the+Acts+of+Assembly%2C+1720+and+1722%2C+with+relation+to+the+Marrow+of+Modern+Divinity+whereby+a+bundle+of+precious+truths+are+condemned%2C+and+lie+under+the+rubbish+ever+since%2C+which+I+hope+shall+yet+be+brought+forth+unto+victory.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+The+angel+s+seal+set+upon+God%E2%80%99s+faithful+servants%2C+when+hurtful+winds+are+blowing+in+the+church+militant.+Being+the+substance+of+three+sermons+preached+in+the+new+church+of+Bristo%2C+at+Edinburgh%2C+at%2C+and+after+the+celebration+of+the+sacrament+of+the+Lord%E2%80%99s+Supper+there%2C+October+10%2C+11%2C+and+17%2C+1742%E2%80%99+&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8e748bdf96.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8e748bdf96.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/17/ebenezer-erskine-on-the-toleration-of-heresy-moralism-and-false-philosophy-by-the-church-of-scotland/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

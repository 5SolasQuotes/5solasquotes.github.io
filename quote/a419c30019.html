<main class="wrap"><figure class="quote" id="q-a419c30019" data-kw="">
<blockquote><p>[Thomas:] ‘God moves all things according to the mode of each… But man, according to his proper nature, has it that he is of free choice; and therefore in one who has the use of free choice, there is no motion from God toward justice without the motion of free choice.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Thomas’s Position</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74e6c84dda" data-kw="">
<blockquote><p>Because God works in them both to will and to do, according to his good pleasure, Phil. 2:12,13, not only by some moral persuasion, as those Pelagianizing here attribute an equal operation in man to the Devil with God; but also by the real and hyper-physical power of his Spirit, and the concourse of grace determining; indeed also predetermining, and thus also leading the gifts granted to us into act. But will not the eternal and such great grace, condescension, love, and mercy of God towards us miserable sinners excite us in turn to love, revere, worship and observe him, in whose communion all our happiness consists?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthias-nethenus.html">Matthias Nethenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface in Samuel Rutherford, Examination of Arminianism tr. by AI by Onku (1639-1642; 1668)</cite>, p. 33</span></figcaption>

</figure><figure class="quote" id="q-f87d7ae16e" data-kw="Permission Author of sin">
<blockquote><p>As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</span></figcaption>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

</figure><figure class="quote" id="q-6af5fa0590" data-kw="">
<blockquote><p>In the religion of the Mahumetans I find much good, viz. a confession of one only God, and most of the natural parts of religion; a vehement opposition to all idolatry; a testimony to the veracity of Moses, and of Christ; that Christ is the Word of God, and a great prophet, and the writings of the apostles true: All this therefore where Christianity is approved, must be embraced. And there is no doubt but God has made use of Mahumet as a great scourge to the idolaters of the world; as well as to the Christians who had abused their sacred privileges and blessings: Wherever his religion does prevail, he casts down images, and fills men’s minds with a hatred of idols, and all conceit of multitude of Gods, and brings men to worship one God alone, and does that by the sword in this, which the preaching of the Gospel had not done in many obstinate nations of idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons of the Christian Religion</cite>, pp. 202-3</span></figcaption>

</figure><figure class="quote" id="q-3720e0934f" data-kw="">
<blockquote><p>I piously and gladly believe the perpetual virginity of Mary unto death (hear, impostor); yet this pertains nothing to our mystery of salvation. It suffices for us to believe what is, and is narrated by the evangelists, that our Savior was conceived by the Holy Spirit and born of the Virgin Mary.” ‘Preface’ to the New Testament to the most illustrious Prince of Condé, etc. If one who speaks thus dared to thrust his most unclean snout into Mary’s virginity, what shall I say of the great Basil, who in the homily on the Nativity of the Lord says, whether after the mystery of the incarnation the Virgin bore children or not, παρὰ ταῦτα δὲ οὐδὲν δοξάζομεν πᾶσι, it in no wise injures the business of piety. For so long as it was necessary to serve the dispensation, virginity was necessary. “But what afterwards followed,” he says, “σιωπῇ παραδοτέον τοῖς λόγῳ οὐ μυστήρια καταλείψομεν [we shall leave in silence to those who speak the mysteries which cannot be expressed in words], nor is it necessary to inquire anxiously into what pertains to the nature of this mystery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Works</cite>, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | The Jews did not so highly esteem virginity that we should therefore exterminate it; and therein you lie, as you are wont. We praise chaste virginity, but compel no one thereto who would rather marry than fall into the peril of incontinence. You accuse Beza that he dared to thrust his most unclean snout into the very virginity of Mary the mother of God, and to call into doubt whether, after childbirth, the Virgin persevered [in virginity]. You keep to the old way, that is, you calumniate. The words of Beza which you cite in the margin of the preface are these:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I piously and gladly believe the perpetual virginity of Mary unto death (hear, impostor); yet this pertains nothing to our mystery of salvation. It suffices for us to believe what is, and is narrated by the evangelists, that our Savior was conceived by the Holy Spirit and born of the Virgin Mary.” ‘Preface’ to the New Testament to the most illustrious Prince of Condé, etc. If one who speaks thus dared to thrust his most unclean snout into Mary’s virginity, what shall I say of the great Basil, who in the homily on the Nativity of the Lord says, whether after the mystery of the incarnation the Virgin bore children or not, παρὰ ταῦτα δὲ οὐδὲν δοξάζομεν πᾶσι, it in no wise injures the business of piety. For so long as it was necessary to serve the dispensation, virginity was necessary. “But what afterwards followed,” he says, “σιωπῇ παραδοτέον τοῖς λόγῳ οὐ μυστήρια καταλείψομεν [we shall leave in silence to those who speak the mysteries which cannot be expressed in words], nor is it necessary to inquire anxiously into what pertains to the nature of this mystery.”

— André Rivet, Theological Works, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | The Jews did not so highly esteem virginity that we should therefore exterminate it; and therein you lie, as you are wont. We praise chaste virginity, but compel no one thereto who would rather marry than fall into the peril of incontinence. You accuse Beza that he dared to thrust his most unclean snout into the very virginity of Mary the mother of God, and to call into doubt whether, after childbirth, the Virgin persevered [in virginity]. You keep to the old way, that is, you calumniate. The words of Beza which you cite in the margin of the preface are these:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+piously+and+gladly+believe+the+perpetual+virginity+of+Mary+unto+death+%28hear%2C+impostor%29%3B+yet+this+pertains+nothing+to+our+mystery+of+salvation.+It+suffices+for+us+to+believe+what+is%2C+and+is+narrated+by+the+evangelists%2C+that+our+Savior+was+conceived+by+the+Holy+Spirit+and+born+of+the+Virgin+Mary.%E2%80%9D+%E2%80%98Preface%E2%80%99+to+the+New+Testament+to+the+most+illustrious+Prince+of+Cond%C3%A9%2C+etc.+If+one+who+speaks+thus+dared+to+thrust+his+most+unclean+snout+into+Mary%E2%80%99s+virginity%2C+what+shall+I+say+of+the+great+Basil%2C+who+in+the+homily+on+the+Nativity+of+the+Lord+says%2C+whether+after+the+mystery+of+the+incarnation+the+Virgin+bore+children+or+not%2C+%CF%80%CE%B1%CF%81%E1%BD%B0+%CF%84%CE%B1%E1%BF%A6%CF%84%CE%B1+%CE%B4%E1%BD%B2+%CE%BF%E1%BD%90%CE%B4%E1%BD%B2%CE%BD+%CE%B4%CE%BF%CE%BE%CE%AC%CE%B6%CE%BF%CE%BC%CE%B5%CE%BD+%CF%80%E1%BE%B6%CF%83%CE%B9%2C+it+in+no+wise+injures+the+business+of+piety.+For+so+long+as+it+was+necessary+to+serve+the+dispensation%2C+virginity+was+necessary.+%E2%80%9CBut+what+afterwards+followed%2C%E2%80%9D+he+says%2C+%E2%80%9C%CF%83%CE%B9%CF%89%CF%80%E1%BF%87+%CF%80%CE%B1%CF%81%CE%B1%CE%B4%CE%BF%CF%84%CE%AD%CE%BF%CE%BD+%CF%84%CE%BF%E1%BF%96%CF%82+%CE%BB%CF%8C%CE%B3%E1%BF%B3+%CE%BF%E1%BD%90+%CE%BC%CF%85%CF%83%CF%84%CE%AE%CF%81%CE%B9%CE%B1+%CE%BA%CE%B1%CF%84%CE%B1%CE%BB%CE%B5%CE%AF%CF%88%CE%BF%CE%BC%CE%B5%CE%BD+%5Bwe+shall+leave+in+silence+to+those+who+speak+the+mysteries+which+cannot+be+expressed+in+words%5D%2C+nor+is+it+necessary+to+inquire+anxiously+into+what+pertains+to+the+nature+of+this+mystery.%E2%80%9D%0A%0A%E2%80%94+Andr%C3%A9+Rivet%2C+Theological+Works%2C+vol.+3%2C+Jesuita+Vapulans%2C+or+the+Castigation+of+the+Notes+of+Sylvester+Petrasancta+Loyola%E2%80%99s+Sectary%2C+On+the+Letter+of+Peter+Molinaeus+to+Balzac+%281535%29%2C+ch.+15+tr.+AI+by+The+Faith+Received+%7C+The+Jews+did+not+so+highly+esteem+virginity+that+we+should+therefore+exterminate+it%3B+and+therein+you+lie%2C+as+you+are+wont.+We+praise+chaste+virginity%2C+but+compel+no+one+thereto+who+would+rather+marry+than+fall+into+the+peril+of+incontinence.+You+accuse+Beza+that+he+dared+to+thrust+his+most+unclean+snout+into+the+very+virginity+of+Mary+the+mother+of+God%2C+and+to+call+into+doubt+whether%2C+after+childbirth%2C+the+Virgin+persevered+%5Bin+virginity%5D.+You+keep+to+the+old+way%2C+that+is%2C+you+calumniate.+The+words+of+Beza+which+you+cite+in+the+margin+of+the+preface+are+these%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3720e0934f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3720e0934f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=I%20piously%20and%20gladly%20believe%20the,to%20the%20nature%20of%20this%20mystery&amp;text=I%20piously%20and%20gladly%20believe%20the%20perpetual%20virginity&amp;text=what%20pertains%20to%20the%20nature%20of%20this%20mystery" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may doe who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165</span></figcaption>

</figure><figure class="quote" id="q-fdea1702b8" data-kw="">
<blockquote><p>Your next exception against the presbytery is for their expectants, these be the sons of the prophers, who in their preparations for the ministry, at their first exercises for assay and trial are heard in the presbytery; with this practise no reasonable man can find fault; it is naturally impossible for any, without a miracle, to attain the habit of preaching but by diverse initial and preparatory actions; where can these be so fitly performed as in the classes [presbyteries]? The expectants are present in the classes for their training, not as members, for they do not voice in any matters of discipline. The true mystery of this controversy is that the expectants [in Anglicanism] are permitted to preach before the holy hands of a bishop have conferred upon them the order of a deacon, and so [have] power to preach and baptize: The Church of Scotland did always reject this corruption as clearly contrary to Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Historical Vindication of the Government of the Church of Scotland</cite>, … (1646), ‘The Unloading of Issachar’s Burden’, p. 22</span></figcaption>

d it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f557d905bd" data-kw="">
<blockquote><p>These prophets [in 1 Cor. 14] were prophets by office, and so beside that they were gifted, they were sent with official authority to preach: 1. They are such as Paul speaks of, 1 Cor. 12:28, ‘God hath set some in the Church, first apostles, secondarily prophets,’ therefore, they were officers set in the body, as apostles were at that time, Eph. 4:11. 2. They are called prophets, 1 Cor. 14:29, 32. But in all the Old or New Testament, prophets signify over these that are in office, as the places in the margin clear, and a place cannot be brought where the word prophet signifies a man who publicly preaches, and yet is no prophet by office, but possibly a fashioner, a ploughman, a shoemaker. 3. The formal effects of public edifying, comforting, convincing, converting souls are ascribed to these prophets, vv. 1, 3-5, 12, 24-25, 31, which are ascribed to preaching pastors, Rom 10:14-15; 1 Cor. 14:1-3. 4. In this chapter, and in ch. 13, Paul does set down canons anent the right use of the offices that he spake of, 1 Cor. 12:28-29. 5. Paul must think them prophets by office, while as he compares himself who was an apostle and prophet with these prophets, v. 37, ‘If any man think himself to be a prophet, or spiritual, let him acknowledge that the things that I write to you are the commandments of the Lord.’ Also these prophets were extraordinary and temporary, as were the gifts of tongues and miracles; and therefore none out of office now are to prophesy publicly. Mr. Robinson says, they cannot be extraordinary, because extraordinary prophets are infallible, and cannot err, else the Scriptures should have been written by prophets who could err; but these prophets, 1 Cor. 14, could err and were not infallible because their doctrine was to be judged, v. 29. Answer: This is a silly reason, Pareus, Bulling, Calvin, Beza say all spirits are to be tried by the Word, and all prophets, even Samuel and Nathan may err, and look beside the book, and may speak of their own spirit. How then were the penmen of Scripture infallible, says Robinson? I answer, there are none simply infallible but God; every man is a liar: The penmen of the Scripture were infallible, because when they were actually inspired by the Holy-Ghost, they could not err: and the spirits of all prophets are to be tried by the Word, even of Paul preaching at Berea: But it follows not that Paul then could err. To this they answer that false prophets, as Balaam, could not err when they were actually inspired, no more than canonic writers. Answer: In the case of infallibility all are alike, none are infallible by any infused habit of a prophetical spirit; but false prophets were inspired with an habitual spirit of lying, which spirit is not in canonic writers. Robinson and others of his side think them not extraordinarily inspired: 1. Because these prophets might have been interrupted and put to silence, that another to whom choicer things were revealed, might prophesy, v. 3. 2. Because Paul exhorts to pray for the gift of interpretation, and to covet (say others) to prophesy. Now we cannot seek in faith from God an extraordinary and miraculous gift. 3. Others add, this prophesying was subject to the free-will of the prophets, for they might prophesy, or keep silence, as they pleased; but the acts of extraordinary prophesying are not subjected to the free-will of the prophets; therefore this was but ordinary prophesying, to the which all gifted professors even out of office are obliged for the edifying of the Church of Christ to the world’s end. Answer: All these three come to one, to wit, acts of extraordinary prophesying are under the determination of free-will. A little of this. 1st Conclusion: Pareus observes well that there be two kinds of prophets. 1. Some who foretold things to come, of these the text in hand speaks not. 2. Some extraordinarily inspired with an extraordinary grace of interpreting Scripture: The former were prophets in the Old Testament, the latter especially prophets of the New Testament; knowledge of both were given without study or pains. So there was a prophetical spirit in Paul, Gal. 1:12, ‘I received it not of man, neither was I taught it, but by the revelation of Jesus Christ.’ 2nd Conclusion: The act of foretelling things to come, especially things merely contingent, which are determined only in the free decree of God, is not so under our free-will, as the acts of preaching and interpreting Scripture out of a prophetical infused habit: For prophesying things to come seemed to have come on the prophets of old, as a fire-flash appears to a man’s eye in the dark air, he cannot choose but see it, Eze. 2:14, ‘So the spirit lifted me up, and took me away, and I went in bitterness, in the heat of my spirit, but the hand of the Lord was strong upon me,’ Jer. 20:9, ‘And I said, I will not make mention of him, nor speak any more in his name, but his word was in my heart, as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay,’ 2 Kings 3:15, ‘The hand of the Lord came upon Elisha, and he prophesied.’ See Jerome, Oecumenius, Gregory and Thomas. The prophetical spirit in the New Testament seems to be more swayed with free-will, and moral threatnings, 1 Cor. 9:16, ‘Woe unto me if I preach not the Gospel; yet the habit from whence he preached was a prophetical principle, Gal. 1:12; 1 Cor. 14:32. 3rd Conclusion: Hence prophesying is not a habit and it is a habit. It is not a habit: 1. Because no prophet can simply prophecy when he will, except the man Christ, especially of things to come by contingent causes (the presence of which things (says Suarez) is only connatural to God, and to no moral man) coming on men by a transient irradiation, while as the candle of God’s prophetical light glances upon the fancy, and from thence to the mind, that the man may see and read the species and images, and when this light shines not Nathan and Samuel read beside the Bible and are widely out. Prophecy also is a habit for: 1. something remains in Isaiah and Jeremiah while they sleep and prophesy not, from whence they are named prophets and really are prophets; for when God has once revealed himself to one as to his own prophet, even from by-past revelation: 1. There remains a disposition to prophecy, 1 Sam. 3:20, All Israel knew, even from Dan to Beersheba, that Samuel was established to be a prophet of the Lord. 2. Because there remains a prophetical light, whereby the man gave assent to the last prophetical revelation, and so the species and prophetical images must remain in the fantasy, and with these a prophetical memory of by past predictions, and so some experimental certainty, that what he foretells shall come to pass: See Thomas and Cajetan. … 4. Conclusion: Hence Separatists may see that extraordinary acts of prophecy may well be subjected to the determination of the Church, and yet be extraordinary inspirations, and that diverse ways: 1. Because they were prophets of the New Testament, and so grace being more abundant now nor under the Old Testament, it can bow and facilitate free-will to acts of prophesying, and Paul from more grace labored more abundantly than they all. 2. Prophesying at that time in Corinth might well be obtained by prayer upon the extraordinary impulsion of the spirit, as Daniel obtained by prayer the interpretation of a dream; neither can it be proved from 1 Cor. 14 that Paul wills them all without exception to covet to speak with tongues and to prophesy, but only these that were extraordinarily moved to pray, except these [words] (v. 31, ‘ye may all prophecy’) be contrary to these words (1 Cor. 12:29, ‘are all prophets?’) which we cannot say. 3. Because it was of old in the power of prophets to use some means to dispose themselves to prophecy, for when the passion of anger overclouded the fancy and the species therein, then Elisha calls for a minstrel to play, and dispose the mind better, as Cajetan says: Howbeit for all that the text says the hand of the Lord only actuated these species and caused him to prophesy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“These prophets [in 1 Cor. 14] were prophets by office, and so beside that they were gifted, they were sent with official authority to preach: 1. They are such as Paul speaks of, 1 Cor. 12:28, ‘God hath set some in the Church, first apostles, secondarily prophets,’ therefore, they were officers set in the body, as apostles were at that time, Eph. 4:11. 2. They are called prophets, 1 Cor. 14:29, 32. But in all the Old or New Testament, prophets signify over these that are in office, as the places in the margin clear, and a place cannot be brought where the word prophet signifies a man who publicly preaches, and yet is no prophet by office, but possibly a fashioner, a ploughman, a shoemaker. 3. The formal effects of public edifying, comforting, convincing, converting souls are ascribed to these prophets, vv. 1, 3-5, 12, 24-25, 31, which are ascribed to preaching pastors, Rom 10:14-15; 1 Cor. 14:1-3. 4. In this chapter, and in ch. 13, Paul does set down canons anent the right use of the offices that he spake of, 1 Cor. 12:28-29. 5. Paul must think them prophets by office, while as he compares himself who was an apostle and prophet with these prophets, v. 37, ‘If any man think himself to be a prophet, or spiritual, let him acknowledge that the things that I write to you are the commandments of the Lord.’ Also these prophets were extraordinary and temporary, as were the gifts of tongues and miracles; and therefore none out of office now are to prophesy publicly. Mr. Robinson says, they cannot be extraordinary, because extraordinary prophets are infallible, and cannot err, else the Scriptures should have been written by prophets who could err; but these prophets, 1 Cor. 14, could err and were not infallible because their doctrine was to be judged, v. 29. Answer: This is a silly reason, Pareus, Bulling, Calvin, Beza say all spirits are to be tried by the Word, and all prophets, even Samuel and Nathan may err, and look beside the book, and may speak of their own spirit. How then were the penmen of Scripture infallible, says Robinson? I answer, there are none simply infallible but God; every man is a liar: The penmen of the Scripture were infallible, because when they were actually inspired by the Holy-Ghost, they could not err: and the spirits of all prophets are to be tried by the Word, even of Paul preaching at Berea: But it follows not that Paul then could err. To this they answer that false prophets, as Balaam, could not err when they were actually inspired, no more than canonic writers. Answer: In the case of infallibility all are alike, none are infallible by any infused habit of a prophetical spirit; but false prophets were inspired with an habitual spirit of lying, which spirit is not in canonic writers. Robinson and others of his side think them not extraordinarily inspired: 1. Because these prophets might have been interrupted and put to silence, that another to whom choicer things were revealed, might prophesy, v. 3. 2. Because Paul exhorts to pray for the gift of interpretation, and to covet (say others) to prophesy. Now we cannot seek in faith from God an extraordinary and miraculous gift. 3. Others add, this prophesying was subject to the free-will of the prophets, for they might prophesy, or keep silence, as they pleased; but the acts of extraordinary prophesying are not subjected to the free-will of the prophets; therefore this was but ordinary prophesying, to the which all gifted professors even out of office are obliged for the edifying of the Church of Christ to the world’s end. Answer: All these three come to one, to wit, acts of extraordinary prophesying are under the determination of free-will. A little of this. 1st Conclusion: Pareus observes well that there be two kinds of prophets. 1. Some who foretold things to come, of these the text in hand speaks not. 2. Some extraordinarily inspired with an extraordinary grace of interpreting Scripture: The former were prophets in the Old Testament, the latter especially prophets of the New Testament; knowledge of both were given without study or pains. So there was a prophetical spirit in Paul, Gal. 1:12, ‘I received it not of man, neither was I taught it, but by the revelation of Jesus Christ.’ 2nd Conclusion: The act of foretelling things to come, especially things merely contingent, which are determined only in the free decree of God, is not so under our free-will, as the acts of preaching and interpreting Scripture out of a prophetical infused habit: For prophesying things to come seemed to have come on the prophets of old, as a fire-flash appears to a man’s eye in the dark air, he cannot choose but see it, Eze. 2:14, ‘So the spirit lifted me up, and took me away, and I went in bitterness, in the heat of my spirit, but the hand of the Lord was strong upon me,’ Jer. 20:9, ‘And I said, I will not make mention of him, nor speak any more in his name, but his word was in my heart, as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay,’ 2 Kings 3:15, ‘The hand of the Lord came upon Elisha, and he prophesied.’ See Jerome, Oecumenius, Gregory and Thomas. The prophetical spirit in the New Testament seems to be more swayed with free-will, and moral threatnings, 1 Cor. 9:16, ‘Woe unto me if I preach not the Gospel; yet the habit from whence he preached was a prophetical principle, Gal. 1:12; 1 Cor. 14:32. 3rd Conclusion: Hence prophesying is not a habit and it is a habit. It is not a habit: 1. Because no prophet can simply prophecy when he will, except the man Christ, especially of things to come by contingent causes (the presence of which things (says Suarez) is only connatural to God, and to no moral man) coming on men by a transient irradiation, while as the candle of God’s prophetical light glances upon the fancy, and from thence to the mind, that the man may see and read the species and images, and when this light shines not Nathan and Samuel read beside the Bible and are widely out. Prophecy also is a habit for: 1. something remains in Isaiah and Jeremiah while they sleep and prophesy not, from whence they are named prophets and really are prophets; for when God has once revealed himself to one as to his own prophet, even from by-past revelation: 1. There remains a disposition to prophecy, 1 Sam. 3:20, All Israel knew, even from Dan to Beersheba, that Samuel was established to be a prophet of the Lord. 2. Because there remains a prophetical light, whereby the man gave assent to the last prophetical revelation, and so the species and prophetical images must remain in the fantasy, and with these a prophetical memory of by past predictions, and so some experimental certainty, that what he foretells shall come to pass: See Thomas and Cajetan. … 4. Conclusion: Hence Separatists may see that extraordinary acts of prophecy may well be subjected to the determination of the Church, and yet be extraordinary inspirations, and that diverse ways: 1. Because they were prophets of the New Testament, and so grace being more abundant now nor under the Old Testament, it can bow and facilitate free-will to acts of prophesying, and Paul from more grace labored more abundantly than they all. 2. Prophesying at that time in Corinth might well be obtained by prayer upon the extraordinary impulsion of the spirit, as Daniel obtained by prayer the interpretation of a dream; neither can it be proved from 1 Cor. 14 that Paul wills them all without exception to covet to speak with tongues and to prophesy, but only these that were extraordinarily moved to pray, except these [words] (v. 31, ‘ye may all prophecy’) be contrary to these words (1 Cor. 12:29, ‘are all prophets?’) which we cannot say. 3. Because it was of old in the power of prophets to use some means to dispose themselves to prophecy, for when the passion of anger overclouded the fancy and the species therein, then Elisha calls for a minstrel to play, and dispose the mind better, as Cajetan says: Howbeit for all that the text says the hand of the Lord only actuated these species and caused him to prophesy.”

— Samuel Rutherford, pp. 249-57 in ch. 16 of A Peaceable &amp; Temperate Plea… (London, 1642), pp. 249-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThese+prophets+%5Bin+1+Cor.+14%5D+were+prophets+by+office%2C+and+so+beside+that+they+were+gifted%2C+they+were+sent+with+official+authority+to+preach%3A+1.+They+are+such+as+Paul+speaks+of%2C+1+Cor.+12%3A28%2C+%E2%80%98God+hath+set+some+in+the+Church%2C+first+apostles%2C+secondarily+prophets%2C%E2%80%99+therefore%2C+they+were+officers+set+in+the+body%2C+as+apostles+were+at+that+time%2C+Eph.+4%3A11.+2.+They+are+called+prophets%2C+1+Cor.+14%3A29%2C+32.+But+in+all+the+Old+or+New+Testament%2C+prophets+signify+over+these+that+are+in+office%2C+as+the+places+in+the+margin+clear%2C+and+a+place+cannot+be+brought+where+the+word+prophet+signifies+a+man+who+publicly+preaches%2C+and+yet+is+no+prophet+by+office%2C+but+possibly+a+fashioner%2C+a+ploughman%2C+a+shoemaker.+3.+The+formal+effects+of+public+edifying%2C+comforting%2C+convincing%2C+converting+souls+are+ascribed+to+these+prophets%2C+vv.+1%2C+3-5%2C+12%2C+24-25%2C+31%2C+which+are+ascribed+to+preaching+pastors%2C+Rom+10%3A14-15%3B+1+Cor.+14%3A1-3.+4.+In+this+chapter%2C+and+in+ch.+13%2C+Paul+does+set+down+canons+anent+the+right+use+of+the+offices+that+he+spake+of%2C+1+Cor.+12%3A28-29.+5.+Paul+must+think+them+prophets+by+office%2C+while+as+he+compares+himself+who+was+an+apostle+and+prophet+with+these+prophets%2C+v.+37%2C+%E2%80%98If+any+man+think+himself+to+be+a+prophet%2C+or+spiritual%2C+let+him+acknowledge+that+the+things+that+I+write+to+you+are+the+commandments+of+the+Lord.%E2%80%99+Also+these+prophets+were+extraordinary+and+temporary%2C+as+were+the+gifts+of+tongues+and+miracles%3B+and+therefore+none+out+of+office+now+are+to+prophesy+publicly.+Mr.+Robinson+says%2C+they+cannot+be+extraordinary%2C+because+extraordinary+prophets+are+infallible%2C+and+cannot+err%2C+else+the+Scriptures+should+have+been+written+by+prophets+who+could+err%3B+but+these+prophets%2C+1+Cor.+14%2C+could+err+and+were+not+infallible+because+their+doctrine+was+to+be+judged%2C+v.+29.+Answer%3A+This+is+a+silly+reason%2C+Pareus%2C+Bulling%2C+Calvin%2C+Beza+say+all+spirits+are+to+be+tried+by+the+Word%2C+and+all+prophets%2C+even+Samuel+and+Nathan+may+err%2C+and+look+beside+the+book%2C+and+may+speak+of+their+own+spirit.+How+then+were+the+penmen+of+Scripture+infallible%2C+says+Robinson%3F+I+answer%2C+there+are+none+simply+infallible+but+God%3B+every+man+is+a+liar%3A+The+penmen+of+the+Scripture+were+infallible%2C+because+when+they+were+actually+inspired+by+the+Holy-Ghost%2C+they+could+not+err%3A+and+the+spirits+of+all+prophets+are+to+be+tried+by+the+Word%2C+even+of+Paul+preaching+at+Berea%3A+But+it+follows+not+that+Paul+then+could+err.+To+this+they+answer+that+false+prophets%2C+as+Balaam%2C+could+not+err+when+they+were+actually+inspired%2C+no+more+than+canonic+writers.+Answer%3A+In+the+case+of+infallibility+all+are+alike%2C+none+are+infallible+by+any+infused+habit+of+a+prophetical+spirit%3B+but+false+prophets+were+inspired+with+an+habitual+spirit+of+lying%2C+which+spirit+is+not+in+canonic+writers.+Robinson+and+others+of+his+side+think+them+not+extraordinarily+inspired%3A+1.+Because+these+prophets+might+have+been+interrupted+and+put+to+silence%2C+that+another+to+whom+choicer+things+were+revealed%2C+might+prophesy%2C+v.+3.+2.+Because+Paul+exhorts+to+pray+for+the+gift+of+interpretation%2C+and+to+covet+%28say+others%29+to+prophesy.+Now+we+cannot+seek+in+faith+from+God+an+extraordinary+and+miraculous+gift.+3.+Others+add%2C+this+prophesying+was+subject+to+the+free-will+of+the+prophets%2C+for+they+might+prophesy%2C+or+keep+silence%2C+as+they+pleased%3B+but+the+acts+of+extraordinary+prophesying+are+not+subjected+to+the+free-will+of+the+prophets%3B+therefore+this+was+but+ordinary+prophesying%2C+to+the+which+all+gifted+professors+even+out+of+office+are+obliged+for+the+edifying+of+the+Church+of+Christ+to+the+world%E2%80%99s+end.+Answer%3A+All+these+three+come+to+one%2C+to+wit%2C+acts+of+extraordinary+prophesying+are+under+the+determination+of+free-will.+A+little+of+this.+1st+Conclusion%3A+Pareus+observes+well+that+there+be+two+kinds+of+prophets.+1.+Some+who+foretold+things+to+come%2C+of+these+the+text+in+hand+speaks+not.+2.+Some+extraordinarily+inspired+with+an+extraordinary+grace+of+interpreting+Scripture%3A+The+former+were+prophets+in+the+Old+Testament%2C+the+latter+especially+prophets+of+the+New+Testament%3B+knowledge+of+both+were+given+without+study+or+pains.+So+there+was+a+prophetical+spirit+in+Paul%2C+Gal.+1%3A12%2C+%E2%80%98I+received+it+not+of+man%2C+neither+was+I+taught+it%2C+but+by+the+revelation+of+Jesus+Christ.%E2%80%99+2nd+Conclusion%3A+The+act+of+foretelling+things+to+come%2C+especially+things+merely+contingent%2C+which+are+determined+only+in+the+free+decree+of+God%2C+is+not+so+under+our+free-will%2C+as+the+acts+of+preaching+and+interpreting+Scripture+out+of+a+prophetical+infused+habit%3A+For+prophesying+things+to+come+seemed+to+have+come+on+the+prophets+of+old%2C+as+a+fire-flash+appears+to+a+man%E2%80%99s+eye+in+the+dark+air%2C+he+cannot+choose+but+see+it%2C+Eze.+2%3A14%2C+%E2%80%98So+the+spirit+lifted+me+up%2C+and+took+me+away%2C+and+I+went+in+bitterness%2C+in+the+heat+of+my+spirit%2C+but+the+hand+of+the+Lord+was+strong+upon+me%2C%E2%80%99+Jer.+20%3A9%2C+%E2%80%98And+I+said%2C+I+will+not+make+mention+of+him%2C+nor+speak+any+more+in+his+name%2C+but+his+word+was+in+my+heart%2C+as+a+burning+fire+shut+up+in+my+bones%2C+and+I+was+weary+with+forbearing%2C+and+I+could+not+stay%2C%E2%80%99+2+Kings+3%3A15%2C+%E2%80%98The+hand+of+the+Lord+came+upon+Elisha%2C+and+he+prophesied.%E2%80%99+See+Jerome%2C+Oecumenius%2C+Gregory+and+Thomas.+The+prophetical+spirit+in+the+New+Testament+seems+to+be+more+swayed+with+free-will%2C+and+moral+threatnings%2C+1+Cor.+9%3A16%2C+%E2%80%98Woe+unto+me+if+I+preach+not+the+Gospel%3B+yet+the+habit+from+whence+he+preached+was+a+prophetical+principle%2C+Gal.+1%3A12%3B+1+Cor.+14%3A32.+3rd+Conclusion%3A+Hence+prophesying+is+not+a+habit+and+it+is+a+habit.+It+is+not+a+habit%3A+1.+Because+no+prophet+can+simply+prophecy+when+he+will%2C+except+the+man+Christ%2C+especially+of+things+to+come+by+contingent+causes+%28the+presence+of+which+things+%28says+Suarez%29+is+only+connatural+to+God%2C+and+to+no+moral+man%29+coming+on+men+by+a+transient+irradiation%2C+while+as+the+candle+of+God%E2%80%99s+prophetical+light+glances+upon+the+fancy%2C+and+from+thence+to+the+mind%2C+that+the+man+may+see+and+read+the+species+and+images%2C+and+when+this+light+shines+not+Nathan+and+Samuel+read+beside+the+Bible+and+are+widely+out.+Prophecy+also+is+a+habit+for%3A+1.+something+remains+in+Isaiah+and+Jeremiah+while+they+sleep+and+prophesy+not%2C+from+whence+they+are+named+prophets+and+really+are+prophets%3B+for+when+God+has+once+revealed+himself+to+one+as+to+his+own+prophet%2C+even+from+by-past+revelation%3A+1.+There+remains+a+disposition+to+prophecy%2C+1+Sam.+3%3A20%2C+All+Israel+knew%2C+even+from+Dan+to+Beersheba%2C+that+Samuel+was+established+to+be+a+prophet+of+the+Lord.+2.+Because+there+remains+a+prophetical+light%2C+whereby+the+man+gave+assent+to+the+last+prophetical+revelation%2C+and+so+the+species+and+prophetical+images+must+remain+in+the+fantasy%2C+and+with+these+a+prophetical+memory+of+by+past+predictions%2C+and+so+some+experimental+certainty%2C+that+what+he+foretells+shall+come+to+pass%3A+See+Thomas+and+Cajetan.+%E2%80%A6+4.+Conclusion%3A+Hence+Separatists+may+see+that+extraordinary+acts+of+prophecy+may+well+be+subjected+to+the+determination+of+the+Church%2C+and+yet+be+extraordinary+inspirations%2C+and+that+diverse+ways%3A+1.+Because+they+were+prophets+of+the+New+Testament%2C+and+so+grace+being+more+abundant+now+nor+under+the+Old+Testament%2C+it+can+bow+and+facilitate+free-will+to+acts+of+prophesying%2C+and+Paul+from+more+grace+labored+more+abundantly+than+they+all.+2.+Prophesying+at+that+time+in+Corinth+might+well+be+obtained+by+prayer+upon+the+extraordinary+impulsion+of+the+spirit%2C+as+Daniel+obtained+by+prayer+the+interpretation+of+a+dream%3B+neither+can+it+be+proved+from+1+Cor.+14+that+Paul+wills+them+all+without+exception+to+covet+to+speak+with+tongues+and+to+prophesy%2C+but+only+these+that+were+extraordinarily+moved+to+pray%2C+except+these+%5Bwords%5D+%28v.+31%2C+%E2%80%98ye+may+all+prophecy%E2%80%99%29+be+contrary+to+these+words+%281+Cor.+12%3A29%2C+%E2%80%98are+all+prophets%3F%E2%80%99%29+which+we+cannot+say.+3.+Because+it+was+of+old+in+the+power+of+prophets+to+use+some+means+to+dispose+themselves+to+prophecy%2C+for+when+the+passion+of+anger+overclouded+the+fancy+and+the+species+therein%2C+then+Elisha+calls+for+a+minstrel+to+play%2C+and+dispose+the+mind+better%2C+as+Cajetan+says%3A+Howbeit+for+all+that+the+text+says+the+hand+of+the+Lord+only+actuated+these+species+and+caused+him+to+prophesy.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+pp.+249-57+in+ch.+16+of+A+Peaceable+%26+Temperate+Plea%E2%80%A6+%28London%2C+1642%29%2C+pp.+249-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff557d905bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f557d905bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=These%20prophets%20%5Bin%201%20Cor.%2014,species%20and%20caused%20him%20to%20prophesy&amp;text=These%20prophets%20%5Bin%201%20Cor.%2014%5D%20were%20prophets&amp;text=actuated%20these%20species%20and%20caused%20him%20to%20prophesy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

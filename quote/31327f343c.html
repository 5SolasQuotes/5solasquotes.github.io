<main class="wrap"><figure class="quote" id="q-31327f343c" data-kw="">
<blockquote><p>And this is the firm tradition of the universal Church, in respect of the baptism of infants, who certainly are as yet unable “with the heart to believe unto righteousness, and with the mouth to make confession unto salvation,” as the thief could do; nay, who even, by crying and moaning when the mystery is performed upon them, raise their voices in opposition to the mysterious words, and yet no Christian will say that they are baptized to no purpose. 32. And if any one seek for divine authority in this matter, though what is held by the whole Church, and that not as instituted by Councils, but as a matter of invariable custom, is rightly held to have been handed down by apostolical authority, still we can form a true conjecture of the value of the sacrament of baptism in the case of infants, from the parallel of circumcision, which was received by God’s earlier people, and before receiving which Abraham was justified, as Cornelius also was enriched with the gift of the Holy Spirit before he was baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Baptism, Against the Donatists, 4.23.31–24.32 in St. Augustin: The Writings Against the Manichaeans and Against the Donatists, ed. Philip Schaff, trans. J. R. King, vol. 4, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, First Series (Buffalo: Christian Literature</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“And this is the firm tradition of the universal Church, in respect of the baptism of infants, who certainly are as yet unable “with the heart to believe unto righteousness, and with the mouth to make confession unto salvation,” as the thief could do; nay, who even, by crying and moaning when the mystery is performed upon them, raise their voices in opposition to the mysterious words, and yet no Christian will say that they are baptized to no purpose. 32. And if any one seek for divine authority in this matter, though what is held by the whole Church, and that not as instituted by Councils, but as a matter of invariable custom, is rightly held to have been handed down by apostolical authority, still we can form a true conjecture of the value of the sacrament of baptism in the case of infants, from the parallel of circumcision, which was received by God’s earlier people, and before receiving which Abraham was justified, as Cornelius also was enriched with the gift of the Holy Spirit before he was baptized.”

— Augustine of Hippo, On Baptism, Against the Donatists, 4.23.31–24.32 in St. Augustin: The Writings Against the Manichaeans and Against the Donatists, ed. Philip Schaff, trans. J. R. King, vol. 4, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, First Series (Buffalo: Christian Literature ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+this+is+the+firm+tradition+of+the+universal+Church%2C+in+respect+of+the+baptism+of+infants%2C+who+certainly+are+as+yet+unable+%E2%80%9Cwith+the+heart+to+believe+unto+righteousness%2C+and+with+the+mouth+to+make+confession+unto+salvation%2C%E2%80%9D+as+the+thief+could+do%3B+nay%2C+who+even%2C+by+crying+and+moaning+when+the+mystery+is+performed+upon+them%2C+raise+their+voices+in+opposition+to+the+mysterious+words%2C+and+yet+no+Christian+will+say+that+they+are+baptized+to+no+purpose.+32.+And+if+any+one+seek+for+divine+authority+in+this+matter%2C+though+what+is+held+by+the+whole+Church%2C+and+that+not+as+instituted+by+Councils%2C+but+as+a+matter+of+invariable+custom%2C+is+rightly+held+to+have+been+handed+down+by+apostolical+authority%2C+still+we+can+form+a+true+conjecture+of+the+value+of+the+sacrament+of+baptism+in+the+case+of+infants%2C+from+the+parallel+of+circumcision%2C+which+was+received+by+God%E2%80%99s+earlier+people%2C+and+before+receiving+which+Abraham+was+justified%2C+as+Cornelius+also+was+enriched+with+the+gift+of+the+Holy+Spirit+before+he+was+baptized.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+On+Baptism%2C+Against+the+Donatists%2C+4.23.31%E2%80%9324.32+in+St.+Augustin%3A+The+Writings+Against+the+Manichaeans+and+Against+the+Donatists%2C+ed.+Philip+Schaff%2C+trans.+J.+R.+King%2C+vol.+4%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+First+Series+%28Buffalo%3A+Christian+Literature+&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31327f343c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/31327f343c.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/07/augustine-infant-baptism-is-the-apostolic-and-universal-practice-of-the-church/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96dceccc32" data-kw="">
<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, 611.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-9d306f79c2" data-kw="">
<blockquote><p>What Mr. [Thomas] Bedford [d. 1653] has produced for the efficacy of baptism has been answered by Mr. [Richard] Baxter in his Appendix to his Plain Scripture, etc. [1651-1656]… Dr. [Cornelius] Burges, his Treatise of Baptismal Regeneration [1629], has been freely censured by many… And therefore I deny baptism to be the remedy of original sin, or the cause of regeneration, or that Christ intended to assign the use to baptism to heal original sin, or to testify the freedom from it without actual [sin]. These things have been delivered by Augustine and taught by the Romanists and Lutherans, but by many other Protestants disclaimed and refuted; and therefore Mr. Stephens, Mr. [James?] Cranford [d. 1657], Mr. Bedford, etc. in using this argument do but symbolize with the Papists, and revive what many Protestants of best note have exploded. ([Errata, p. 341:] What Dr. [Samuel] Ward and Dr. [John] Davenant have said for regeneration and justification of infants by baptism has been accurately examined and enervated by Mr. Gataker in Latin.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-Pædobaptism, or, The Second Part of the Full Review of the Dispute Concerning Infant-Baptism</cite>, ... (London, 1654), pp. 220-21. Tombes was an English baptist.</span></figcaption>

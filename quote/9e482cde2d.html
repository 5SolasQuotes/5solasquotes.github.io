<main class="wrap"><figure class="quote" id="q-9e482cde2d" data-kw="">
<blockquote><p>O Jerusalem, Jerusalem! thou that kills the prophets and stones them which are sent unto thee, how often would I have gathered thy children together, even as a hen gathers her chickens under her wings, and ye would not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Edward Polhill</cite>, (1622-1694) on Matthew 23:37’ in “The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill (Morgan, PA.: Soli Deo Gloria Publications, 1998), pp. 208-10 | the true end of his call is their conversion, and that that end is not attained, the only reason lies within themselves, in their own corrupt, unbelieving hearts. Moreover, it is worthy of our consideration that those scriptures (which the Remonstrants urge to prove that all the operations of grace, even those in the very elect who actually turn unto God, are resistible) do signally set forth this ordinative will of God. As first, they urge that (Mt. 23:37):</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8118efa58" data-kw="">
<blockquote><p>Divine decrees are of two kinds: one efficacious and absolute, the other inefficacious and conditional. The latter is concerned with the thing to be realized taken in itself, abstracting from all actual circumstance. Thus, for example, God wills the salvation of all men. But, in fact, God permits final impenitence in a sinner (e.g. Judas) as manifestation of infinite justice. Efficacious decrees on the contrary are concerned with the thing to be realized taken with all its concrete circumstances of place and time. Hence these decrees are immutable and infallible. (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (Herder Book Co., 1950) | pt. 5, Redemptive Incarnation, ch. 32, “Introduction”, pp. 204-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-394835e485" data-kw="">
<blockquote><p>1224. Rom. 9:18, ‘God has mercy on whom He will have mercy, and whom He will He hardens.’ Ch. 11:32, ‘God has concluded them all in unbelief, that He might have mercy upon all.’ The first place is concerning the most free will and power of God, who may have mercy on whom He please; his antecedent will reaches to all men, his consequent will is restrained to the believers and unbelievers, and so He will have mercy of the faithful, that they may be saved, but he justly punishes and hardens the unbelievers and wicked men who resist his grace freely offered unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible</cite>, … (London: Miller, 1662) | Romans</span></figcaption>

</figure><figure class="quote" id="q-1373a6a535" data-kw="">
<blockquote><p>Effective permission or willing permission; especially, the providential concursus (q.v.) underlying evil acts of human beings; a concept typical of Reformed theology, which will not allow a bare or ineffectual permission on the part of God and which will acknowledge no realm of activity outside of the will of God. God therefore is viewed as positively willing to permit the free agency of human beings and as supporting their acts with his providential concursus even when those acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | permissio efficax</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Effective permission or willing permission; especially, the providential concursus (q.v.) underlying evil acts of human beings; a concept typical of Reformed theology, which will not allow a bare or ineffectual permission on the part of God and which will acknowledge no realm of activity outside of the will of God. God therefore is viewed as positively willing to permit the free agency of human beings and as supporting their acts with his providential concursus even when those acts go against his revealed will.”

— Richard Muller, Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | permissio efficax">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEffective+permission+or+willing+permission%3B+especially%2C+the+providential+concursus+%28q.v.%29+underlying+evil+acts+of+human+beings%3B+a+concept+typical+of+Reformed+theology%2C+which+will+not+allow+a+bare+or+ineffectual+permission+on+the+part+of+God+and+which+will+acknowledge+no+realm+of+activity+outside+of+the+will+of+God.+God+therefore+is+viewed+as+positively+willing+to+permit+the+free+agency+of+human+beings+and+as+supporting+their+acts+with+his+providential+concursus+even+when+those+acts+go+against+his+revealed+will.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Dictionary+of+Latin+%26+Greek+Theological+Terms%3A+Drawn+Principally+from+Protestant+Scholastic+Theology+1st+ed.+%28Baker%2C+1985%29%2C+pp.+222%2C+329+%26+332-33+%7C+permissio+efficax&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1373a6a535.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1373a6a535.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=Effective%20permission%20or%20willing%20permission%3B%20especially,acts%20go%20against%20his%20revealed%20will&amp;text=Effective%20permission%20or%20willing%20permission%3B%20especially%2C%20the%20providential&amp;text=when%20those%20acts%20go%20against%20his%20revealed%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b0fff760f8" data-kw="">
<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

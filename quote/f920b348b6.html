<main class="wrap"><figure class="quote" id="q-f920b348b6" data-kw="">
<blockquote><p>Secondly, by the doctrine of faith we are bound to acknowledge and confess that Christ Jesus by his eternal priesthood is not only the sole meritorious cause of all grace or righteousness inherent, requisite to final absolution; but these presupposed in the party to be absolved, He is likewise the sole immediate cause of final absolution or justification. Without observation in some measure to all the commandments of God, we cannot enter into the kingdom of heaven: but we enter not for the obedience we have performed. To what use then does our inherent righteousness or observance of God’s commandments serve us? If it has been sincere and unfeigned, though imperfect, yet the faith that brought it forth will make a sincere and faithful plea for mercy in the day of trial, in which he that has been a hearer only, and no doer of the law, or has done in part what God would have done, but not sincerely nor faithfully, shall not be heard. Our imperfect obedience then is not the immediate cause of our absolution, but the obedience and righteousness of Christ. By the immediate and next cause we understand such a cause as is necessarily accompanied by the effect, and without whose participation the effect never does, nor can befall any: such a cause as whosoever is partaker of, is by participation of it forthwith absolved; such a cause as whoso can probably hope to be partaker of, he may upon the same degrees of probability hope for final absolution; such a cause as whoso doubts or fears lest he shall never be partaker of in this life, must upon the same terms doubt or despair of his absolution or salvation. But if works be accounted for the exact righteousness of the law unto us, not the obedience of Christ received by faith, but the works of holiness in us are the absolute cause of remission of sins and acceptance unto life. And what else do the words sound, as they are interpreted, but that as exact obedience to the law should have been the matter or cause of justification from justice, so sincere obedience by the estimation of grace is the matter of justification by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 69-70</span></figcaption>

<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways: I. As God. II. As Judge of the World. III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>

</figure><figure class="quote" id="q-9268bd4411" data-kw="">
<blockquote><p>The believers have not a full discharge till then: we are in this life continually subject to new sins, and so to new guilt, whereby arise new fears, so that the soul has not a full rest from all till that final absolution be pronounced at the Day of Judgment… the Scripture do also call the Day of Judgment a time when sins shall be blotted out, because then is the public absolution of the godly, and according to philosophy, motions receive their names from the term to which they tend… Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way, as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith, but this way shall then cease; for having perfect righteousness inherent in ourselves, we shall need no covering… This seems to be undoubted, that the way of justification by faith in Christ, arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae, a justification of us in our way, not when we come to our home. Fourthly, although pardon of sin be completed at that great day, yet this is not to be understood, as if God’s pardon of any sin were imperfect, and something of sin did still remain to be done away… But because we commit new sins daily, and so need pardon daily, Therefore it is that we are not completely pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publicly be declared to all the world. … Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished, and not so much as any scars remain, the wound will be so fully healed… Thirdly, then and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be.</p></blockquote>

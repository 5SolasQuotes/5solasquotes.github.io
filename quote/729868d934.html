<main class="wrap"><figure class="quote" id="q-729868d934" data-kw="">
<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synopsis of Purer Theology... (1625; Brill), vol. 3, Disputation 45, ‘On the Lord’s Supper’, pp. 183-85 &amp; 187</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f306b34f04" data-kw="">
<blockquote><p>Those very feasts [in the Early Church] made a composition or mixture of human institutions with divine, and therfore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-b3a3ffc529" data-kw="">
<blockquote><p>Youth could also perform comedies and tragedies, and by such means a useful form of entertainment, honorable and contributing toward an increase of piety, may be staged for the people; but it will be necessary that devout and wise men experienced in the Kingdom of Christ compose these comedies and tragedies, in which there may be presented on the stage the plans, actions and events of mankind, whether common and ordinary as it occurs in compedies or unique and eliciting admiration as it is characteristic of tragedies. All this will contribute toward a correction of morals and a pious orientation to life (Aristotle, Poetics II, 1448a). … It must be observed, however, that when in both kinds of poetic material, comic and tragic, the activities and sins of men are described and actively presented to be seen with the eyes, it should be done in such a way that although the crimes of reprobate men are related, yet a certain terror of divine judgment and horror of sin should appear in these things, and a shameless daring and an exultant delight in crimes should not be expressed. It is better here to take something away from poetic fitness rather than from the concern for edifying the piety of the spectators, which demands that in every representation of sin there be felt the condemnation of one’s conscience and the horrible fear of God’s judgment. But when pious and good actions are shown, they should express as clearly as possible a happy, secure and confident sense of the divine mercy, but moderate and diffident as regards the self, and a joyful trust in God and his promises, with holy and spiritual pleasure in doing good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 349-52 of ch. 54, ‘Honest Games’ in On the Reign of Christ, bk. 2 in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-ef42a8d959" data-kw="">
<blockquote><p>Is this rational, that where two commands of the magistrate are joined, the one undoubtedly lawful to be obeyed, the other doubted of, that subjects should disobey the magistrate in that which is clearly lawful, because they have a doubt or unclearness anent obeying him in the other command? Does it not become subjects to go as far on in obedience to lawful authority as they see they may without sin against God? Then it is time to stop when anything is put to them by virtue of the king’s command which they clearly see they cannot do without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom (Edinburgh: Tyler, 1662)</cite>, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience… (London, 1647), 17th thesis</cite>, p. 76</span></figcaption>

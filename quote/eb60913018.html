<main class="wrap"><figure class="quote" id="q-eb60913018" data-kw="Contentment" data-pol="">
<blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote>
<figcaption>— <a href="../authors/benjamin-keach.html">Benjamin Keach</a>, <cite>The Baptist Catechism (Keach&#x27;s Catechism)</cite>, Q. 86</figcaption>
<div class="meta"><a class="tag" href="../topics/fall-and-sin/concupiscence.html">Concupiscence</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../topics/covenant-and-law/moral-law.html">The Moral Law</a><a class="tag" href="../topics/christian-life/affliction.html">Affliction &amp; Suffering</a><a class="tag" href="../topics/christian-life/comfort.html">Comfort</a><a class="tag" href="../topics/christian-life/contentment.html">Contentment</a></div>

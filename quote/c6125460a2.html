<main class="wrap"><figure class="quote" id="q-c6125460a2" data-kw="">
<blockquote><p>What is the duty of Christian men at such at time? What is the duty, in particular, of Christian officers in the Church? In the first place, they should encourage those who are engaging in the intellectual and spiritual struggle. They should not say, in the sense in which some laymen say it, that more time should be devoted to the propagation of Christianity, and less to the defence of Christianity. Certainly there should be propagation of Christianity. Believers should certainly not content themselves with warding off attacks, but should also unfold in an orderly and positive way the full riches of the gospel. But far more is usually meant by those who call for less defence and more propagation. What they really intend is the discouragement of the whole intellectual defence of the faith. And their words come as a blow in the face of those who are fighting the great battle. As a matter of fact, not less time, but more time, should be devoted to the defence of the gospel. Indeed, truth cannot be stated clearly at all without being set over against error. Thus a large part of the New Testament is polemic; the enunciation of evangelical truth was occasioned by the errors which had arisen in the churches. So it will always be, on account of the fundamental laws of the human mind. Moreover, the present crisis must be taken into account. There may have been a day when there could be propagation of Christianity without defence. But such a day at any rate is past. At the present time, when the opponents of the gospel are almost in control of our churches, the slightest avoidance of the defence of the gospel is just sheer unfaithfulness to the Lord. There have been previous great crises in the history of the Church, crises almost comparable to this. One appeared in the second century, when the very life of Christendom was threatened by the Gnostics. Another came in the Middle Ages when the gospel of God’s grace seemed forgotten. In such times of crisis, God has always saved the Church. But He has always saved it not by theological pacifists, but by sturdy contenders for the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen-july-28.html">J. Gresham Machen (July 28</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1881—January 1, 1937), Christianity and Liberalism (New York: Macmillan, 1923), 147.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8eea88569" data-kw="">
<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4. 4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Answer of Mr. John Cotton of Boston in New-England, to the aforesaid Arguments Against Persecution for Cause of Conscience…’ in Roger Williams, The Blovdy Tenent of Persecution for Cause of Conscience, Discussed in a Conference… (London, 1644)</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-69f6a5ed1e" data-kw="">
<blockquote><p>But people evaluate things also according to the standard of beauty and ugliness… But the beautiful is nevertheless essentially distinct from the pleasant. People do not argue about what is pleasant. One person finds this food and that drink enjoyable, but another does not. People are comfortable with this and do not argue about these differences. However, in connection with what is beautiful, people tend not to be satisfied with the notion that something attracts one person but not another; people attempt to account for beauty to themselves and others and attempt, as it were, to demonstrate why something is attractive. People proceed from the notion that what is genuinely beautiful should be attractive to everyone, given sufficient enlightenment and education.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921)</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-f665082f5d" data-kw="">
<blockquote><p>Man is endowed with reason, and the human reason cannot rest satisfied with a mere collection of separate truths, but wants to see them in their mutual relationship, in order that it may have a clearer understanding of them… There seems to be a lurking fear that the more we systematize the truth, the farther we wander from the presentation of it that is found in the Word of God. But there is no danger of this, if the system is not based on the fundamental principles of some erring philosophy, but on the abiding principles of Scripture itself. God certainly sees the truth as a whole, and it is the duty of theologian to think the truths of God after Him. There should be a constant endeavor to see the truth as God sees it, even though it is perfectly evident that the ideal is beyond the grasp of man in his present condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to Systematic Theology (Grand Rapids: Baker, 1979), 15.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

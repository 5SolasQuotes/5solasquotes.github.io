</figure><figure class="quote" id="q-0910074023" data-kw="">
<blockquote><p>…the Romans were guilty of differences in God’s service and despising and judging each other for them; The Corinthians were carnal in making parties and divisions; they defrauded each other and went to law before heathens. They had fornicators, Judaizing envious slanderers of Paul, heretical deniers of the Resurrection, such as eat in idols’ temples, or of their sacrifices: were drunk at, or before the sacrament. The Galatians are yet sharplier charged: Almost all the seven Churches, Rev. 2 and 3, had Nicolatians, or Jezabel’s doctrine, which God hated: and no Christian is called to separate from the communion of any one of all these; but commanded to amend, and live in unity, without divison.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684) | pt. 2, p. 15</span></figcaption>

</figure><figure class="quote" id="q-fb363377bd" data-kw="">
<blockquote><p>…simply a question of law in our own church, ‘the Presbyterian Church in the United States,’ the question of whether the Assembly has the power ‘to make law for the church in the matter of ‘offences,’ or to give its deliverances in thesi the force the force of judicial decisions. It had been contended by some that the deliverances of the Assemblies of 1865, 1869, and 1877 obliged the courts of original jurisdiction to discipline for dancing, that is, to exclude every church member convicted of dancing from the privileges of the church; that these courts had no discretion; that they were not allowed to interpret the law of the church for themselves, but must accept the interpretation of the Assembly, albeit that interpretation had not been given in the investigation of a judicial case regularly brought up (that is, in hypothesi), but as an abstract and general proceeding (in thesi)… Before proceeding to vindicate the action of the Assembly [which later said that its theses were ‘only didactic, advisory and monitory’], we beg leave to remind our readers that the principle here involved is one of immense importance. It lies at the root of all the struggles between the advocates of a constitutional government and the advocates of an ‘absolutism’… the essence of the struggle has always been the same… the question has always been, whether the power of the whole is over every part, or only over the power of the part; whether the whole is simply a great wheel, of which the parts are only spokes, or whether it be a wheel of which the parts are also wheels, each having a sphere and movement of its own, yet moving in subordination to the movement of the great wheel…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Powers of the Several Church Courts: The Action of the Assembly of 1879 on Worldly Amusements, or the Powers of our Several Church Courts’ in Miscellanies of Rev. Thomas E. Peck</cite>, ... (Richmond, 1896), vol. 2, pp. 331-360. Originally published in The Southern Presbyterian Review (April, 1880). Also with an introduction in ed. Hall &amp; Hall, Paradigms in Polity… (Eerdmans, 1994), pp. 585-602. | Peck:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-c44925171f" data-kw="">
<blockquote><p>Rash prejudices engaging men in opposition, they will not own the truth when represented to them; having hated it without knowledge, they hate it against knowledge, and so are hardened against the ways of God; which is the case of many, who, in a blind zeal, have appeared against the public ministry and ordinances, and, being engaged, are loth to strike sail and lay down their defiance, when sufficient conviction is offered.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-81d80d519f" data-kw="spontaneity indifference">
<blockquote><p>Whether the formal reason of free will consists in indifference or in rational spontaneity. The former we deny; the latter we affirm against papists, Socinians and Remonstrants. We must oppose the error of the adversaries who place its formal reason in indifference, and establish the orthodox truth which asserts that it is placed in rational willingness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.3.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0814d7d572" data-kw="four states will">
<blockquote><p>Free will can be viewed either absolutely as belonging to a rational being in every state, or in relation to various states—in innocence, in the fall, in grace, and in glory. In every state the will remains free from compulsion, yet its moral powers differ: able to good in innocence; only to evil as to spiritual good in the fall; freed by grace; confirmed in glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.3.1; 10.4</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 10.3.1; 10.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFree%20will%20can%20be%20viewed%20either%20absolutely%20as%20belonging%20to%20a%20rational%20being%20in%20every%20state%2C%20or%20in%20relation%20to%20various%20states%E2%80%94in%20innocence%2C%20in%20the%20fall%2C%20in%20grace%2C%20and%20in%20glory.%20In%20every%20state%20the%20will%20remains%20free%20from%20compulsion%2C%20yet%20its%20moral%20powers%20differ%3A%20able%20to%20good%20in%20innocence%3B%20only%20to%20evil%20as%20to%20spiritual%20good%20in%20the%20fall%3B%20freed%20by%20grace%3B%20confirmed%20in%20glory.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2010.3.1%3B%2010.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0814d7d572.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0814d7d572.html">Permalink</a><a class="src" href="https://drive.google.com/file/d/1YcwwT0MNnEuPwYSOy3Gfw-0tA7Jvm9N8/view?usp=drivesdk" rel="noopener" target="_blank">Read it online · Drive (Nick&#x27;s copy)</a></div>
</figure><figure class="quote" id="q-cd46185b29" data-kw="necessity freedom">
<blockquote><p>Whether every necessity is repugnant to freedom of will. We deny against the papists and Remonstrants. The question is not about the essential freedom from coaction and physical necessity, which is always the same in every state of man, but about the accidental freedom from the slavery of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.2</span></figcaption>

</figure><figure class="quote" id="q-053a831724" data-kw="servant sin Satan">
<blockquote><p>Man, being a servant of sin and of Satan, can will nothing but that which its prince wills. And he will not permit it to will any thing good: though, even if Satan did not reign over it, sin itself, of which man is the slave, would sufficiently harden it to prevent it from willing good.</p></blockquote>

</figure><figure class="quote" id="q-0f47e564d7" data-kw="bondage enslaved">
<blockquote><p>Whether the free will in a state of sin is so a servant of and enslaved by sin that it can do nothing but sin; or whether it still has the power to incline itself to spiritual good answering accurately to the will of God. The former we affirm; the latter we deny, against the papists, Socinians and Remonstrants.</p></blockquote>

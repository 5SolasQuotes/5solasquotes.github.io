<main class="wrap"><figure class="quote" id="q-0e9b8e9327" data-kw="">
<blockquote><p>It [mediate imputation] was adopted by theologians like Wyttenbach, Endemann, Stapfer, Roell, Vitringa, Venema; and after a while it found its way through Britain to America, where it has had an interesting history — forming one of the stages through which the New England Theology (q.v.) passed on its way to its ultimate denial of the quality of sin involving guilt to anything but the voluntary acts of a free agent; and finally becoming one of the characteristic tenets of the so-called ‘New School Theology’ of the Presbyterian Churches [which were governed by the Westminster Confession and catechisms].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Imputation’, ‘6. La Place &amp; Later Theologians &amp; Schools’</cite></span></figcaption>

<blockquote><p>7. We are all so very much in the dark as to the clear and distinct apprehension of the true nature of original, inherent pravity or sin that we must needs be as much ignorant of the true nature of that inherent sanctity or righteousness which is its contrary, or cure. Learned [Matthew Flacius] Illiricus thought it was a substance, which he has in his Clavis pleaded for at large. Others call it a habit, others a nature, or natural inclination and a privation of a natural inclination to God: others call it an indisposition of the mind and will to holy truth and goodness, and an ill disposition of them to error and evil. Others call it only the inordinate lust of the sensitive faculties, with a debility of reason and will to resist it. And whilst the nature of the soul itself and its faculties are so much unknown to itself, the nature of original pravity and righteousness must needs be very much unknown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>

</figure><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin Regeneration Imputation">
<blockquote><p>Although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.11.21</span></figcaption>

</figure><figure class="quote" id="q-21e37df4ec" data-kw="">
<blockquote><p>…by reason of original sin it is, that a natural man cannot perform anything in a gracious manner, to wit, for want [lack] of the love of God: Original sin being an habitual aversion from God and conversion unto the creature, or more briefly an inordinate conversing with the creature, either in enjoying it, whereas he should only use it, God alone being to be enjoyed; or in using it, but not in a gracious manner, that is, not for God;s sake; to wit, through want of the love of God, which is brought upon us by the sin of Adam, as whereby our natures were bereaved of the Spirit of God. Thus in prosecuting mine answer unto a devised argument, I have made bold to open my mind concerning original sin: A point that has seemed unto me of such difficulty that I have been wont to range it amongst those three [things] whereabouts I could not expect to be satisfied whilst I lived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646), 3rd Doubt, p. 148</span></figcaption>

<blockquote><p>Those, then, who hold the Calvinistic view of the state of the case with respect to the moral character and condition of men, may not unreasonably be asked whether they can give any other account of the origin, or any explanation of the cause, of this fearful state of things. Now, in the history of the discussions which have taken place upon this subject, we can trace four pretty distinct courses which have been taken by theologians who all admitted the total native depravity of mankind: First, some have refused to attempt any explanation of the state of the case, beyond the general statement that Scripture represents it as in some way or other connected with, and resulting from, the fall of Adam, and have denied, expressly or by plain implication, the common Calvinistic doctrine of imputation. A second class, comprehending the great body of Calvinistic divines, have regarded it as, in some measure and to some extent, explained by the principle of its being a penal infliction upon men, resulting from the imputation to them of the guilt of Adam’s first sin. A third class, while refusing to admit in words the doctrine of imputation, as commonly stated by orthodox divines, have yet put forth such views of the connection between Adam and his posterity, and of the bearing of his first sin upon them, as embody the sum and substance of all, or almost all, that the avowed defenders of the doctrine of imputation intend by it. And, lastly, there is a fourth class, who, while professing in words to hold the doctrine of the imputation of Adam’s sin, yet practically and substantially neutralize it or explain it away, especially by means of a distinction they have devised between immediate or antecedent, and mediate or consequent imputation—denying the former, which is the only true and proper imputation, and admitting only the latter. It is quite plain that it is only the first two of these four divisions of theological opinion that can be regarded as important, or even real and substantial. For, on the one hand, those who belong to the third class… may yet be really ranked under the second class, because they admit the whole substance of what the doctrine of imputation is usually understood to include or involve; while, on the other hand, those who belong to the fourth class, admitting imputation in words, but denying it in reality and substance, belong properly to the first class.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology 2nd</cite>, ed. (Edinburgh: T&amp;T Clark, 1863), vol. 1, pp. 510-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

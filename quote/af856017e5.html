<main class="wrap"><figure class="quote" id="q-af856017e5" data-kw="">
<blockquote><p>Hath Jesus Christ our Mediator confirmed the Covenant by his death! Then O Christian, keep up thy faith, and draw out thy faith, and exceedingly rejoice in Christ; for thy estate is sure, and thy soul is sure, and thy salvation is sure, all is sure, because all is surely confirmed by the death of Christ:

The death of Christ was a ratification to the whole Testament, to the whole covenant, and to every part and tittle of it: and as sure as Christ hath died, so sure art thou to enjoy all that God hath Covenanted with thee for there shall not fail one word of all the good he which [sic] hath promised.

Object Not one word? Not one good thing?

Sol. No, not any one; why then Mercy shall be thine, and Grace shall be thine, and Peace shall be thine, and Joy shall be thine, and Glory, and Salvation shall be thine, for all these, and more than these are promises by God in his Covenant, and are sealed by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant</cite>, (London: Adoniram Byfield, 1660), p. 272.</span></figcaption>

<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>

</figure><figure class="quote" id="q-cef707d457" data-kw="">
<blockquote><p>The Lutherans, on the other side, insist on two arguments to prove, that not a twofold administration of the same covenant, but that two covenants substantially distinct, are intended in this discourse of the apostle.

1. Because in the Scripture they are often so called, and compared with one another, and sometimes opposed unto one another; the first and the last, the new and the old.

2. Because the covenant of grace in Christ is eternal, immutable, always the same, obnoxious unto no alteration, no change or abrogation; neither can these things be spoken of it with respect unto any administration of it, as they are spoken of the old covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 89</span></figcaption>

</figure><figure class="quote" id="q-bb11e456c3" data-kw="">
<blockquote><p>The Lord God said, or, had said, to wit, upon the sixth day, on which the woman was made, Genesis i. 27-28. Not good; not convenient either for my purpose of the increase of mankind, or for man’s personal comfort, or for the propagation of his kind. Meet for him; a most emphatical phrase, signifying thus much, one correspondent to him, suitable both to his nature and necessity, one altogether like to him in shape and constitution, disposition and affection; a second self; or one to be at hand and near to him, to stand continually before him, familiarly to converse with him, to be always ready to succour, serve, and comfort him; or one whose eye, respect, and care, as well as desire, Genesis iii. 16, should be to him, whose business it shall be to please and help him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 1: 7.</span></figcaption>

<blockquote><p>3dly. The gospel sets forth his willingness to save us. Faith has an aspect upon Christ as able and willing to save: for power without a will to save is unprofitable, and the will without power is fruitless and ineffectual. For the begetting of faith we are to consider the proposal and offer of grace in the Gospel, and the promise of it. 1. In the gospel there is a proposal of grace to all: the invitation is universal; ‘Whoever will, let him come to the waters of life freely.&#x27;</p></blockquote>

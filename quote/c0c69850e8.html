<main class="wrap"><figure class="quote" id="q-c0c69850e8" data-kw="">
<blockquote><p>Furthermore, the Churches of Helvetia, and Savoy, and the free cities of France, and the Low Countries, and Scotland, are to be reverenced as the true Churches of God, as their confession make manifest. And no less must we think of our own Churches in England and Ireland. For we hold, believe, and maintain, and preach the true Faith, that is, the ancient doctrine of salvation by Christ, taught and published by the prophets and apostles, as the book of the [39] Articles of Faith agreed upon in open parliament do fully show…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed, on the Church in A Golden Chain</cite>, (Cambridge, 1600), p. 496</span></figcaption>

<blockquote><p>…they were chosen to be faithful witnesses to the world of the doings, sufferings and doctrine of Christ: the Holy Ghost was sent to teach them in all truth. Here we may rest upon a sure foundation, against the which the gates of hell cannot prevail… To this antiquity of apostolic doctrine, let us firmly adhere. This is the clearest mirror whereinto the precepts of wholesome doctrine are contained. … those bishops and doctors following, who keep inviolably that form of wholesome doctrine which they received from the apostles, these, I say, alanerly are to be counted true successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-simson.html">Patrick Simson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Compend of the History of the First Ten Persecutions moved against Christians</cite>, (Edinburgh: Hart, 1613) Simson (1566-1618) was a Scottish presbyterian minister.</span></figcaption>

<blockquote><p>We must for the honor of all those of either persuasion, with whom we have confered, declare that the professions and desires of all for the advancement of piety and true godliness are the same, their professions of zeal for the peace of the Church the same, of affection and duty to us the same; they all approve episcopacy;¹ they all approve a set form of liturgy; and they all disapprove and dislike the sin of sacrilege, and the alienation of the revenue of the Church. And if upon these excellent foundations, in submission to which there is such an harmony of affections, any superstructure should be raised to the shaking of these foundations, and to the contracting and lessening of the blessed gift of charity, which is a vital part of Christian religion, we shall think ourself very unfortunate, and even suspect that we are defective in that administration of government with which God has entrusted us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Interest of England in the Matter of Religion, pt. 2</cite>, Nor will any defect in the State Ecclesiastical ensue upon the removal of these matters in controversy: for the points of doctrine, worship and discipline acknowledged by both parties are a sufficient and ample foundation for the edification and peace of the Church to rest upon; for which we cannot have a fuller testimony than what is given by his Majesty in his aforesaid declaration:</span></figcaption>

</figure><figure class="quote" id="q-8eeb831bbe" data-kw="">
<blockquote><p>For the three early centuries the Church was entirely without it. The members of the Church made a profession of their faith at baptism. But this was in the simplest form; it was not a precautionary assent to a variety of intellectual propositions, but a profession of service under a new Master, and of entrance into a new life. No deacon, no presbyter, no bishop, made any subsequent profession. The distinction between the requirements of belief from clergy and from laity was as yet wholly unknown. The first subscription to a series of dogmatical propositions as such, was that enforced by Constantine at the Council of Nicea. It was the natural but rude expedient of a half-educated soldier to enforce unanimity in the Church, as he had by the sword enforced it in the empire. It was accompanied then by the same casuistry, by the same ambiguity, by the same inoperative results as at present [in the Church of England]. At each [subsequent] council the same process was repeated by the bishops who were present. But the practice, as far as appears, never extended to the clergy generally or to the laity; and, as it was then in the Ancient Church, so on the whole has it been in those portions of Christendom which have clung most tenaciously to Catholic usages, and been most steadfast in the defence of Orthodoxy. The Roman Catholic clergy and the clergy of the Eastern Church neither formerly nor now are bound by any definite forms of subscription. The unity of the State is preserved everywhere, not by preliminary promises or oaths, but by the general laws of discipline and order, and by the general public sentiment of the whole community.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription in the Church of England and in the University of Oxford</cite>, (Oxford: Henry &amp; Parker, 1863), pp. 35-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-0238b6d385" data-kw="">
<blockquote><p>If the question, ‘What is the meaning of the words, ‘the system of doctrines taught in the Holy Scriptures,’ as they occur in the formula which makes a part of the ordination service?’ were submitted to any intelligent and impartial jury in the country–to twelve men of plain common sense, who had never head of the subterfuges and refinements of modern subscribers to creeds–I cannot doubt that they would be unanimous in their verdict without quitting their seats. They would naturally decide thus: ‘Since the primary object of subscribing an ecclesiastical creed is to express agreement in doctrinal belief; since the manifest design of the Confession of Faith of the Presbyterian Church is to maintain what is commonly called the Calvinistic system, in opposition to the Socinian, the Arian, the Pelagian, and the Arminian systems; since almost every point which distinguishes these several forms of error are specifically exposed, disproved and rejected, under one or another of its several articles; and since this has notoriously been the universal understanding, ever since that Confession was formed, we judge that no man who is not a sincere Calvinist, that is, who does not ex animo [from the heart; sincerely] receive all the distinguishing articles of the Calvinistic system, can honestly subscribe it. We do not suppose, indeed, that among those who subscribe that formulary, it is necessary, in order to a candid subscription, that there should be entire agreement as to ‘every jot and tittle’ in the mode of explaining every doctrine which the Confession contains. But we cannot resist the conclusion, as fair and honorable men, that unless a candidate for admission… sincerely believes all these [previously listed doctrines], and the essentially allied doctrines which have ever been considered as the distinguishing features of the Calvinistic system, and believes them in substance, as they are laid down in the Confession, our verdict is that he cannot honestly subscribe it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Adherence to our Doctrinal Standards’ ToC in Doctrinal Integrity</cite>, (Dallas: Presbyterian Heritage Publications, 1979), pp. 75–131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

r verdict is that he cannot honestly subscribe it.”

— Samuel Miller, ‘Adherence to our Doctrinal Standards’ ToC in Doctrinal Integrity (Dallas: Presbyterian Heritage Publications, 1979), pp. 75–131">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+the+question%2C+%E2%80%98What+is+the+meaning+of+the+words%2C+%E2%80%98the+system+of+doctrines+taught+in+the+Holy+Scriptures%2C%E2%80%99+as+they+occur+in+the+formula+which+makes+a+part+of+the+ordination+service%3F%E2%80%99+were+submitted+to+any+intelligent+and+impartial+jury+in+the+country%E2%80%93to+twelve+men+of+plain+common+sense%2C+who+had+never+head+of+the+subterfuges+and+refinements+of+modern+subscribers+to+creeds%E2%80%93I+cannot+doubt+that+they+would+be+unanimous+in+their+verdict+without+quitting+their+seats.+They+would+naturally+decide+thus%3A+%E2%80%98Since+the+primary+object+of+subscribing+an+ecclesiastical+creed+is+to+express+agreement+in+doctrinal+belief%3B+since+the+manifest+design+of+the+Confession+of+Faith+of+the+Presbyterian+Church+is+to+maintain+what+is+commonly+called+the+Calvinistic+system%2C+in+opposition+to+the+Socinian%2C+the+Arian%2C+the+Pelagian%2C+and+the+Arminian+systems%3B+since+almost+every+point+which+distinguishes+these+several+forms+of+error+are+specifically+exposed%2C+disproved+and+rejected%2C+under+one+or+another+of+its+several+articles%3B+and+since+this+has+notoriously+been+the+universal+understanding%2C+ever+since+that+Confession+was+formed%2C+we+judge+that+no+man+who+is+not+a+sincere+Calvinist%2C+that+is%2C+who+does+not+ex+animo+%5Bfrom+the+heart%3B+sincerely%5D+receive+all+the+distinguishing+articles+of+the+Calvinistic+system%2C+can+honestly+subscribe+it.+We+do+not+suppose%2C+indeed%2C+that+among+those+who+subscribe+that+formulary%2C+it+is+necessary%2C+in+order+to+a+candid+subscription%2C+that+there+should+be+entire+agreement+as+to+%E2%80%98every+jot+and+tittle%E2%80%99+in+the+mode+of+explaining+every+doctrine+which+the+Confession+contains.+But+we+cannot+resist+the+conclusion%2C+as+fair+and+honorable+men%2C+

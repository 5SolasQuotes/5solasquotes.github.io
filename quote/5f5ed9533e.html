<main class="wrap"><figure class="quote" id="q-5f5ed9533e" data-kw="">
<blockquote><p>Let us then sit down by the Scriptures, the Word of God written, as the only sure card, and rule to guide us in all matters of faith, and life: For if we leave this once, there is nothing but Sea and Air, no place for this poor Dove, this poor soul of ours to rest her foot; without which, when, and where to stay, none can tell.

That then we may not run from opinion to opinion, from Christ to Christ, from Church to church, till we have run our selves out of all, our only sure way is to fly to the Scriptures, to the written Word of God, as to an Anchor, that so we may have hope, if hope, then faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Capel’s remains being an useful appendix to his excellent Treatise of tentations, concerning the translations of the Holy Scriptures: left written with his own hand. By that incomparably learned and judicious divine, Mr. Richard Capel, sometimes fellow of Magdalen-College in Oxford; with a preface p</cite>, (London: John Bartlet, 1658), p. 6.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c7da9c85b" data-kw="">
<blockquote><p>Now I find that Mr. [Richard ]Hooker [an Anglican] says two things to this:

1. That Scripture does regulate all our moral actions, but not scripture only, for the Law of nature and the most concealed instincts of nature, and other principles may warrant our actions: We move (says he), we sleep, we take the cup at the hand of our friend; a number of things we often do only to satisfy some natural desire without present express and actual reference to any commandment of God, unto his glory; even these things are done which we naturally perform, and not only that which naturally and spiritually we do, for by every effect proceeding from the most concealed instincts of nature, his power is made manifest. But it does not therefore follow, that of necessity we shall sin unless we expressly intend the glory of God in every such particular. [Rutherford’s] Answer: …I answer that as: [1.] there be some actions in man purely and spiritually, but supernaturally, moral, as to believe in Christ for remission of sins, to love God in Christ: these the Gospel does regulate.

2. There be some actions naturally moral in the substance of the act, as many things commanded and forbidden in the Moral Law; and these are to be regulated by the Law of nature and the Moral Law:

3. There be some actions mixed, as such actions in which nature, or concealed instincts of nature are the chief principles, yet in and about these actions, as in their modification of time, place, and manner and measure, there is a special morality, in regard of which they are to be ruled by the Word; Such mixed actions as these that are mentioned by Hooker, as to move, sleep, take the cup at the hand of a friend, cannot be called simply moral, for to move may be purely natural, as if a man against his will fall off a high place or off a horse, to start in the sleep, are so natural that I know not any morality in them; but sure I am [that] for Nathaniel to come to Christ, which was also done by a natural motion, is not a mere natural action proceeding from the most concealed instincts of nature; so to sleep has somewhat natural in it, for beasts do sleep; beasts do move; I grant they cannot take a cup at the hand of a friend, they cannot salute one another: (It is Hooker’s instance) but fancy sometimes in men do these, whereas conscience should do them: What is natural in moving and sleeping, and what is common to men with beasts, I grant, Scripture does not direct or regulate these acts of moving and sleeping; we grant [that] actions natural and common to us with beasts need not the rule of the Word to regulate them: But this I must say (I speak it, my record is in Heaven, not to offend any) Formalists, as such, and as Prelatical, are irreligious and profane: One of them asked a godly man, ‘Will you have Scripture for giving your horse a peck of oats, and for breaking wind, and easing or obeying nature?’ And therefore they bring in these instances to make sport: But I conceive, sleeping moderately, to enable you to the service of God, as eating, drinking, that God may be glorified, 1 Cor. 10:31, are also in the measure and manner of doing moral, and so ruled by Scripture and Scripture only, and not regulated by natural instincts… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in Faith, and with a warrant from scripture, to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7. And truly Formalists give men in their morals to live at random and to walk without taking heed to their ways according to God’s Word. … Answer: 1. The Law of reason in morals (for of such we now speak) is nothing but the Moral Law and will of God, contained fully in the Scriptures of the Old and New Testament; and therefore is not to be divided from the Scriptures; if a man be ruled in that, he is ruled by Scripture: for a great part of the Bible, of the Decalogue, is printed in the reasonable soul of man: as when he loves his parents, obeys his superiors, saves his neighbor in extreme danger of death, because he does these according to the Law of Reason, shall it follow that these actions which are expressly called [in Greek] Rom. 2:14, the things or duties of the Law, are not warranted by express Scripture because they are done according to the Law of natural reason? I should think the contrary most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Intro, Section 4, pp. 72-74</span></figcaption>

<blockquote><p>Therefore we ought gratefully and reverently to embrace and kiss this blessing of the Holy Spirit, that He condescended to our infirmity and did not want to burden it too much but selected and assigned for writing that of the doctrine and miracles of Christ which He judged to be sufficient and necessary for true faith and eternal life.</p></blockquote>

<blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote>

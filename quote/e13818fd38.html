<blockquote><p>13… And thus far there is the highest consensus among the Orthodox, although a certain dissensus intervenes in the explication of the material cause — some urging both the ἐνεργητική [energētikē, active] and the παθητική [pathētikē, passive] obedience, and conjoining satisfaction through obedience and through suffering; others seeking the material cause of our justification in satisfaction through suffering alone. 14. The foundation is safe among both parties. For both not only admit but also require the obedience of Christ perfectly rendered to the law for our justification; but they differ in the manner of explicating the matter. For some hold it to be the meritorious cause of our justification; others hold it to be the condition of the person and the causa sine qua non [indispensable cause] of meriting justification — namely, that it behoved us to have such a High Priest who was holy and undefiled, Heb. VII.26–27. Concerning which there is a certain dissensus of opinions, the unity of faith and charity being preserved, since both parties apprehend the whole Christ and Christ alone, and in Him whole and alone seek righteousness and life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>

<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), p. 34</span></figcaption>

</figure><figure class="quote" id="q-31a784e770" data-kw="">
<blockquote><p>Whether we be justified by the passive obedience of Christ alone, or also by his active?¹ ¹ Bishop Carlton, Consens. Eccles. Cathol. contr. Trid. de Fide Justif., ch. 3; Daniel Featley in his Sacra nemesis, pp. 24, 29-30, 36-38; L’Emper. in his Theses, Article 1 and many others are for both Christ’s active and passive obedience. Etsi autem in negotio Iustificationis magno periculo erratur, prout ea de re controversia procedit inter nos et Pontificios, utrum scilicet gratiá Dei Iustificatio nobis contingat, an meritis nostris: Attamen prout inter nos &amp; Piscatorem controversia instituitur, passiváne tantum, an etiam activa Christi obedientia justificemur coram Deo, nullo prorsus erratur periculo. Utrobique enim Iustificationis causae gratiae et Christi meritis adscribuntur, non autem operibus nostris. Twisse, i• Corv. Defens. Arm. contra Tilenum Animadversio. Scriptura Christi passioni Iustificationem passim adscribit; idque eu i• locis, in quibus exprofesso argumentum istud pertractat: nulla tamen justitiae, quae in obedientia legi exhibita consistat, facti mentione vel levissima, Rom. 3:24-25 &amp; 4:24-25 &amp; 5:9-10; Gal. 3:11, 13. Gataker. Animadv. in Piscat. &amp; Lucii Scripta Adversaria, p. 2, Sect. 10. Vide plura in cjus Gomar, Disput. Elentic. de Iustif. Elench. In this controversy many learned divines of our own differ among themselves, and it does not seem to be of that importance that some others are about justification. We are justified in part by Christ’s active obedience, for by it we obtain the imputation of that perfect righteousness which gives us title to the Kingdom of Heaven. Seeing it was not possible for us to enter into life, till we had kept the commandments of God, Mt. 19:17, and we were not able to keep them ourselves, it was necessary our Surety should keep them for us, Dan. 9:24; Rom. 10:4; Rom. 3:21. (Mr. Hildersham on Ps. 51:7, Lecture 119) The Scripture seems to ascribe our redemption wholly to Christ’s bodily death, and the blood that He shed for us, Eph. 1:7; Rev. 5:9, but in these places the Holy Ghost uses a synecdoche, it puts one part of Christ’s passion for the whole:

1. Because the shedding of his blood was a sensible sign and evidence that He died for us.

2. This declared Him to be the true propitiatory sacrifice that was figured by all the sacrifices under the Law. (Idem, ibid.) Some urge this argument, By Christs active obedience imputed to them, the faithful be made perfectly righteous, what need is there then of his passive righteousness? need there anymore than to be made righteous? (See Mr. Bradshaw, Of Justification) Christ fulfilled the duty of the Law, and did undergo the penalty, that last was a satisfaction for the trespass which was as it were the forfeiture, and the fulfilling the Law was the principal, Ps. 40:4; Jer. 31:3; Gal. 4:4. Some, to avoid Christ’s active obedience, question whether Christ as man was not bound to fulfill the Law for Himself? All creatures are subject to God’s authority. Yet this detracts not from his active obedience, partly from his own free condescension, and partly because his whole person God and man obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’, pp. 518-19</span></figcaption>

1. Because the shedding of his blood was a sensible sign and evidence that He died for us.

2. This declared Him to be the true propitiatory sacrifice that was figured by all the sacrifices under the Law. (Idem, ibid.) Some urge this argument, By Christs active obedience imputed to them, the faithful be made perfectly righteous, what need is there then of his passive righteousness? need there anymore than to be made righteous? (See Mr. Bradshaw, Of Justification) Christ fulfilled the duty of the Law, and did undergo the penalty, that last was a satisfaction for the trespass which was as it were the forfeiture, and the fulfilling the Law was the principal, Ps. 40:4; Jer. 31:3; Gal. 4:4. Some, to avoid Christ’s active obedience, question whether Christ as man was not bound to fulfill the Law for Himself? All creatures are subject to God’s authority. Yet this detracts not from his active obedience, partly from his own free condescension, and partly because his whole person God and man obeyed.”

<blockquote><p>Which [Scriptural phrases] all signify one thing: that is, his suffering in the flesh. For nowhere in the Scriptures of God is our righteousness particularly attributed to any other action of Christ. Neither can it be collected to consist in any other action, except out of the general word of ‘obedience’. Neither is there any necessity (if the matter be well weighed) to add anything to the sufferings of Christ in the matter of our righteousness. Yea moreover, it would appear by diverse grounds of the truth of God that nothing can or may be added thereunto in the matter of our righteousness.</p></blockquote>

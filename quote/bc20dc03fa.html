<blockquote><p>If bishops would ordain presbyters by limiting words, restraining them from any essential or integral part of the office or power as instituted by Christ, and yet profess that they ordain them to the office which Christ has instituted, it is no schism for those presbyters afterward to claim (and execute in season) all the power which by Christ’s institution belongs to their office, though against the bishops’ wills: Because the bishops are not the authors or donors of the office power, but only the ministerial deliverers and investers; and therefore it is Christ and not they that must describe it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p. 54</span></figcaption>

<blockquote><p>III. …acts of divine worship are twofold, some which do not differ from the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded of God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the church has no control or power over them; the latter God has thus far left to the will of the church as means and indifferent, so that a regard be always paid to divine truth., Christian simplicity and public edification. … XIX. The object of this directive power is not the doctrine itself of faith and worship (which rests upon the Word of God alone), but other things concerning which the express Word of God is not given, which are either merely indifferent and free or ambiguous and doubtful, concerning which God has delivered nothing certain in particular, such as was the case about which the apostle speaks in 1 Cor. 7:10,12, or which refer to the mode of external worship, or the determination of the circumstances, without which the precepts of the first table and the public exercises of piety in ecclesiastical assemblies scarcely and not even scarcely can be rightly observed and performed. Here pertain the time, place, form and rule of prayers, addresses, of the administration of the sacraments, fasts, alms-giving: all of which ought to be established and exercised not with confusion, but rightly and decently (euschemonos) for the edification of the church. Since these in themselves are indifferent and do not directly touch the mystery of our salvation, they do not of themselves bind the conscience, nor yet are they so fixed and immovable that they may not be reformed and changed where the use of the church shall demand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, pp. 286 &amp; 290 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church</span></figcaption>

<blockquote><p>The analogy which I understand is to hold between the Jewish and Christian Church is this: As profane persons were forbidden to enter into the Temple because of the sacramental and typical holiness thereof (for the Temple was a type of Christ), so profane persons are now much more to be kept back from the sacrament of the Lord’s Supper, which has more of sacramental signification, mystery and holiness in it than the temple of Jerusalem had, and whereby more ample evangelical promises are set forth and sealed unto us. And as profane persons might of old come into the court of the gentiles, and there hear the Word preached in Solomon’s porch (where both Christ and his apostles did preach, Jn. 10:23; Acts 3:11; 5:12, which porch was in the utmost court, that is, the court of the gentiles: of which elsewhere out of Josephus), but might not come into the court of Israel, nor have communion in the sacrifices: so profane, obstinate sinners are to be excluded for their impiety from the Church-communion of saints, though they may hear the Word, as heathens also may do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 9. Whether in the Jewish Church there was any suspension or exclusion of profane, scandalous, notorious sinners, from partaking in the public ordinances with the rest of the children of Israel in the temple 41, pp. 46-47</span></figcaption>

<blockquote><p>Whether by ‘the sinful evil of those corruptions, in the public worship and government of this Church,’ you [Independent divines at Westminster] understand… the Book of Common Prayer, the entrance into our ministry by ordination of bishops and living under the episcopal government?… Now if you mean… [this], that which usually was called, Old conformity, in opposition to the New [under Archbishop Laud]: So I deny that all do now generally acknowledge and decry that as sinfully evil; which appears thus: Because that remonstrance presented to the House of Commons in the beginning of the Parliament, subscribed by many hundred godly ministers, conformists, and non-conformists for reformation in worship, doctrine, government and discipline: The government, worship and ceremonies were impleaded, in respect of many inconveniences and evil consequents; but petitioning against them as sinfully evil and absolutely unlawful was declined: And there are many parliament men and ministers who have a great zeal to the present reformation in casting out the hierarchy and ceremonies, who are not yet convinced that all their former practice in the way of old conformity was sinful: But as those times were, do judge they did lawfully continue their standing in their places and in this Church: much less are they satisfied that either Episcopal government, or the Liturgy were sufficient grounds of forsaking our public assemblies and erecting new. Amongst a cloud of learned and godly men, take the testimony of Gerson Bucerus in his learned answer to Doctor Downame (Dissert. de Guber. Eccl., p. 620), who for the point of Episcopacy allows not of schism in the Church, but vindicates himself and others who keep within the bounds of his opinion from being guilty in that kind. Which answer… is not here given by me in the least to plead for the hierarchy, ceremonies or present Liturgy (for I heartily desire their removal), but only to show the Apologists’ mistake in asserting that all do now so generally acknowledge and decry them as sinfully evil… We [be] as much abhorring bowing to altars, publishing the Declaration for Sports, etc. as you: and witnessing more frequently against them in our ministry than some of you.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Whether by ‘the sinful evil of those corruptions, in the public worship and government of this Church,’ you [Independent divines at Westminster] understand… the Book of Common Prayer, the entrance into our ministry by ordination of bishops and living under the episcopal government?… Now if you mean… [this], that which usually was called, Old conformity, in opposition to the New [under Archbishop Laud]: So I deny that all do now generally acknowledge and decry that as sinfully evil; which appears thus: Because that remonstrance presented to the House of Commons in the beginning of the Parliament, subscribed by many hundred godly ministers, conformists, and non-conformists for reformation in worship, doctrine, government and discipline: The government, worship and ceremonies were impleaded, in respect of many inconveniences and evil consequents; but petitioning against them as sinfully evil and absolutely unlawful was declined: And there are many parliament men and ministers who have a great zeal to the present reformation in casting out the hierarchy and ceremonies, who are not yet convinced that all their former practice in the way of old conformity was sinful: But as those times were, do judge they did lawfully continue their standing in their places and in this Church: much less are they satisfied that either Episcopal government, or the Liturgy were sufficient grounds of forsaking our public assemblies and erecting new. Amongst a cloud of learned and godly men, take the testimony of Gerson Bucerus in his learned answer to Doctor Downame (Dissert. de Guber. Eccl., p. 620), who for the point of Episcopacy allows not of schism in the Church, but vindicates himself and others who keep within the bounds of his opinion from being guilty in that kind. Which answer… is not here given by me in the least to plead for the hierarchy, ceremonies or present Liturgy (for I heartily desire their removal), but only to show the Apologists’ mistake in asserting that all do now so generally acknowledge and decry them as sinfully evil… We [be] as much abhorring bowing to altars, publishing the Declaration for Sports, etc. as you: and witnessing more frequently against them in our ministry than some of you.”

— Thomas Edwards, Antapologia, or a Full Answer to the Apologetical Narration (London: G.M., 1644), pp. 15-16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+by+%E2%80%98the+sinful+evil+of+those+corruptions%2C+in+the+public+worship+and+government+of+this+Church%2C%E2%80%99+you+%5BIndependent+divines+at+Westminster%5D+understand%E2%80%A6+the+Book+of+Common+Prayer%2C+the+entrance+into+our+ministry+by+ordination+of+bishops+and+living+under+the+episcopal+government%3F%E2%80%A6+Now+if+you+mean%E2%80%A6+%5Bthis%5D%2C+that+which+usually+was+called%2C+Old+conformity%2C+in+opposition+to+the+New+%5Bunder+Archbishop+Laud%5D%3A+So+I+deny+that+all+do+now+generally+acknowledge+and+decry+that+as+sinfully+evil%3B+which+appears+thus%3A+Because+that+remonstrance+presented+to+the+House+of+Commons+in+the+beginning+of+the+Parliament%2C+subscribed+by+many+hundred+godly+ministers%2C+conformists%2C+and+non-conformists+for+reformation+in+worship%2C+doctrine%2C+government+and+discipline%3A+The+government%2C+worship+and+ceremonies+were+impleaded%2C+in+respect+of+many+inconveniences+and+evil+consequents%3B+but+petitioning+against+them+as+sinfully+evil+and+absolutely+unlawful+was+declined%3A+And+there+are+many+parliament+men+and+ministers+who+have+a+great+zeal+to+the+present+reformation+in+casting+out+the+hierarchy+and+ceremonies%2C+who+are+not+yet+convinced+that+all+their+former+practice+in+the+way+of+old+conformity+was+sinful%3A+But+as+those+times+were%2C+do+judge+they+did+lawfully+continue+their+standing+in+their+places+and+in+this+Church%3A+much+less+are+they+satisfied+that+either+Episcopal+government%2C+or+the+Liturgy+were+sufficient+grounds+of+forsaking+our+public+assemblies+and+erecting+new.+Amongst+a+cloud+of+learned+and+godly+men%2C+take+the+testimony+of+Gerson+Bucerus+in+his+learned+answer+to+Doctor+Downame+%28Dissert.+de+Guber.+Eccl.%2C+p.+620%29%2C+who+for+the+point+of+Episcopacy+allows+not+of+schism+in+the+Church%2C+but+vindicates+himself+and+others+who+keep+within+the+bounds+of+his+opinion+from+being+guilty+in+that+kind.+Which+answer%E2%80%A6+is+not+here+given+by+me+in+the+least+to+plead+for+the+hierarchy%2C+ceremonies+or+present+Liturgy+%28for+I+heartily+desire+their+removal%29%2C+but+only+to+show+the+Apologists%E2%80%99+mistake+in+asserting+that+all+do+now+so+generally+acknowledge+and+decry+them+as+sinfully+evil%E2%80%A6+We+%5Bbe%5D+as+much+abhorring+bowing+to+altars%2C+publishing+the+Declaration+for+Sports%2C+etc.+as+you%3A+and+witnessing+more+frequently+against+them+in+our+ministry+than+some+of+you.%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or+a+Full+Answer+to+the+Apologetical+Narration+%28London%3A+G.M.%2C+1644%29%2C+pp.+15-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eb9fdb2ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eb9fdb2ac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of,our%20ministry%20than%20some%20of%20you&amp;text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of%20those%20corruptions&amp;text=them%20in%20our%20ministry%20than%20some%20of%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

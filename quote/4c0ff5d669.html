<main class="wrap"><figure class="quote" id="q-4c0ff5d669" data-kw="">
<blockquote><p>Hence the Scripture always attributes our justification to the free grace of God, diligently excluding any works we can do; and certainly if in the continuance of our justification, that be always retained by mere grace, so that no works of ours, though regenerated, and endowed with an heavenly principle within, are causal of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated… (London, 1654) | sermon 20</cite>, p. 191</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated… (London, 1654) | sermon 20, p. 191">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+the+Scripture+always+attributes+our+justification+to+the+free+grace+of+God%2C+diligently+excluding+any+works+we+can+do%3B+and+certainly+if+in+the+continuance+of+our+justification%2C+that+be+always+retained+by+mere+grace%2C+so+that+no+works+of+ours%2C+though+regenerated%2C+and+endowed+with+an+heavenly+principle+within%2C+are+causal+of+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%E2%80%A6+%28London%2C+1654%29+%7C+sermon+20%2C+p.+191&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c0ff5d669.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c0ff5d669.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=Hence%20the%20Scripture%20always%20attributes%20our,principle%20within%2C%20are%20causal%20of%20it&amp;text=Hence%20the%20Scripture%20always%20attributes%20our%20justification%20to&amp;text=an%20heavenly%20principle%20within%2C%20are%20causal%20of%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4041cf2e7b" data-kw="">
<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

— Thomas Manton, A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 336">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+We+are+justified+by+works%2C+and+not+by+faith+only%3B+by+which+are+meant+the+fruits+of+sanctification%3A+for+true+faith+and+true+holiness+will+show+itself+by+good+works%3B+faith+gives+us+the+first+right%2C+but+works+continue+it%2C+for+otherwise+a+course+of+sin+would+put+us+into+a+state+of+damnation+again%3A+therefore+at+the+Last+Judgment+these+are+considered%2C+Rev.+20%3A12%2C+%E2%80%98And+the+dead+were+judged+out+of+those+things+which+were+written+in+the+books%2C+according+to+their+works.%E2%80%99+Mt.+25%3A35-36%3A+%E2%80%98For+I+was+an+hungry%2C+and+ye+gave+me+meat%3B+I+was+thirsty%2C+and+ye+gave+me+drink%3B+I+was+a+stranger%2C+and+ye+took+me+in%3B+naked%2C+and+ye+cloathed+me%3B+I+was+sick%2C+and+ye+visited+me%3B+I+was+in+prison%2C+and+ye+came+unto+me.%E2%80%99+Faith+is+our+consent%2C+but+obedience+verifies+it%2C+or+is+our+performance+of+what+we+consented+unto%3B+the+one+as+covenant-making%2C+the+other+as+covenant-keeping%3B+we+are+admitted+by+covenant-making%2C+but+continued+in+our+privileges+by+covenant-keeping%2C+Ps.+25%3A10%2C+%E2%80%98All+the+paths+of+the+Lord+are+mercy+and+truth+unto+such+as+keep+his+Covenant.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+p.+336&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4041cf2e7b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4041cf2e7b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=4.%20We%20are%20justified%20by%20works,unto%20such%20as%20keep%20his%20Covenant&amp;text=4.%20We%20are%20justified%20by%20works%2C%20and%20not&amp;text=and%20truth%20unto%20such%20as%20keep%20his%20Covenant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-24b7213a9e" data-kw="">
<blockquote><p>Ye have heard, dearly beloved, that true faith is the justification of the church or faithful of God; that it is, I say, the forgiveness of all sins, a receiving into the grace of God, a taking by adoption into the number of the sons of God, an assured and blessed sanctification [beatificationem],¹ and finally, the well-spring of all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades (Cambridge: Parker Society, 1849), vol. 1, 1st Decade, Sermon 6</cite>, p. 121</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

— Heinrich Bullinger, The Decades (Cambridge: Parker Society, 1849), vol. 1, 1st Decade, Sermon 6, p. 121">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYe+have+heard%2C+dearly+beloved%2C+that+true+faith+is+the+justification+of+the+church+or+faithful+of+God%3B+that+it+is%2C+I+say%2C+the+forgiveness+of+all+sins%2C+a+receiving+into+the+grace+of+God%2C+a+taking+by+adoption+into+the+number+of+the+sons+of+God%2C+an+assured+and+blessed+sanctification+%5Bbeatificationem%5D%2C%C2%B9+and+finally%2C+the+well-spring+of+all+good+works.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Decades+%28Cambridge%3A+Parker+Society%2C+1849%29%2C+vol.+1%2C+1st+Decade%2C+Sermon+6%2C+p.+121&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F24b7213a9e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/24b7213a9e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Ye%20have%20heard%2C%20dearly%20beloved%2C%20that,the%20well%2Dspring%20of%20all%20good%20works&amp;text=Ye%20have%20heard%2C%20dearly%20beloved%2C%20that%20true%20faith&amp;text=and%20finally%2C%20the%20well%2Dspring%20of%20all%20good%20works" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5d48a72dfc" data-kw="">
<blockquote><p>A living faith justifies, not in its active state, but in its act of apprehending and laying hold upon Christ. On the other hand, faith’s second notable act is to purify and cleanse the heart and stir up other graces. In this sense, some learned individuals argue that good works are necessary to preserve a person in the state of justification, though they do not immediately contribute to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>𝑉𝑖𝑛𝑑𝑖𝑐𝑖𝑎𝑒 𝐿𝑒𝑔𝑖𝑠, Lecture 4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-c5cb3f9194" data-kw="">
<blockquote><p>Two things are seen in Christ which are necessary to our justification: the one is death; the other, resurrection from the dead, etc. [Rom. 4:25] It was fitting that by his death the sins of the world should be expiated, etc. while by his resurrection from the dead, it pleased the same goodness of God to grant the Holy Ghost, through whom the gospel might be believed, and the justice that was lost by the sin of the first Adam might be restored. The apostle has expressed both parts in these words, ‘Who was delivered on account of our sins, etc. [and was raised again for our justification]’ [Rom. 4:25] In his death therefore is found satisfaction for sin; in his resurrection the gift of the Holy Ghost, by which our justification to life is effected…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4</cite>, pp. 161-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

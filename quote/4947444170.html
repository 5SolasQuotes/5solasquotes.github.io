<main class="wrap"><figure class="quote" id="q-4947444170" data-kw="">
<blockquote><p>In this discussion I labour under several disadvantages, and among other things unfavourable to a fair hearing, I have the unpopular side of this controversy. No proof, however, that I am not on the right side. The world will wonder after my antagonist, and swallow his arguments with avidity, while, with many persons, mine will nauseate at sight — will stir up prejudice and passion, and awaken that mortal antipathy which is very generally cherished against the exclusive use of David’s Psalms in the praise of God.

The subject of Psalmody seems to be exciting a good deal of attention at the present time, in different sections of our country, and recently to some extent, in the Emerald Isle. God is about to have a controversy with the churches on this subject, and blessed will he be, who will be found on God’s side. If, as some suppose, there is a time of distress and calamity coming on the Church, and on the world, of an unprecedented character, then there is a time coming when no Psalms and Hymns will suit the Church and people of God, but the Psalms of David.

Away with all human hymns, human promises, and contrivances, while we draw nigh to God in the hour of adversity. In such an hour it is only the Word of God that can sustain the soul. And when the “battle of that great day of God Almighty” commences, which from the “signs of the times” appears to be approximating, God’s people will fly to him for succour and for safety, and they will find nothing more consoling than the simple, energetic language of the “sweet Psalmist of Israel,”

“Yea in the shadow of thy wings,

My refuge I will place,

Until these sad calamities

Do wholly overpass.”

Many of these divine songs are admirably adapted to the state of the Church while in distress, and from the history of the Church we learn that her condition, as a general thing, has been one of suffering and sorrow, from some cause or other, ever since her subjection to the galling yoke of Egyptian bondage.

We have still to pass through much tribulation in order to reach the heavenly kingdom; and where shall we find a collection of sacred songs prepared for, and adapted to the state of the Church in this “vale of tears?” Where? In the Psalms of David, and no where else. How sweet to the believer were these heavenly hymns, while they were pursued over the hills and dales of Scotland by the blood thirsty Claverhouse? And when the Church, in the middle ages, fled into the wilderness from the face of the Dragon, and found a resting place in the vallies of Piedmont, how did the solemn sound of these songs of the Lord rise, and swell, and roll along the vale, cheering the hearts of the pious and persecuted Waldenses, and rising as sweet incense up to the throne of God!

They have ever been found adapted to the condition of holy martyrs in the dungeon and at the stake; and Christ himself, “the man of sorrows,” while in this world, found the language of the Psalmist applicable to his distressed condition, and expired repeating a portion of the 31st Psalm—”into thy hands I commit my spirit.” Shall we cast aside these sacred songs, so well adapted to God’s people, not only in affliction, but also in prosperity? Have those Christian denominations acted properly who have entirely excluded these Divine songs from the praise of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Psalmody in Evangelical Guardian</cite></span></figcaption>

</figure><figure class="quote" id="q-ac4d4d3d72" data-kw="">
<blockquote><p>Secondly; a mournful sense of Afflictions sent from God is consistent with a dutiful resignation of our selves to his Will. ‘Twas the vain boast of the Philosophers, that their Instructions would fortify Men with such magnanimous Principles, and generous Spirits, as with an equal calm tranquillity of Mind to encounter all the fierce and sorrowful Accidents to which they might be exposed here: They speak high against Fortune and Fate, and resolve stubbornly, that no misery, whether Poverty or Disgrace, Torments or Death, should extort from them a confession that it was Misery. ‘Twas one of their Axioms, That a Wise Man is not subject to the vicissitudes and instability of things here below; That he suffers no conflict of contrary Passions in his Breast; that he is always above in the Serene, where no Tempests can disturb, no Eclipse can darken his Mind: But these proud pretensions were empty of reality.

Indeed such a perfect exemption from all afflicting Passions is neither possible nor regular in our present state: not possible, for the best Men are not all Spirit, but united to Flesh; and when the Body is under strong pains, the Soul suffers in its sufferings; and while we are thus compounded, the loss of those Comforts that support and sweeten the present Life, must cause Grief. ‘Tis easy to utter brave Expressions, and lay down severe Precepts in contempt of Evils when they are at a distance, but hard to sustain the Spirit under the actual feeling of them; ’tis one thing to discourse of a Battle, and another to be engaged in the heat of it. But supposing by a Philosophical Charm the Heart were so hardened as to be proof against the most piercing afflictions, such a forced insensibility is not regular, but proceeds from the extinction of Humanity and Piety, and that will appear by considering Afflictions in a natural or moral respect.

First, in a natural respect, for so they are destructive or oppressive Evils, and a pensive feeling of them is suitable to the Law of our Creation: for the Human Nature is framed with such Senses and Passions, as according to God’s intention should be affected suitably to the quality of their objects; and if the Soul acts rationally, ’tis moved accordingly. A Saint on Earth is not a Saint in Heaven, raised above all Disasters and Troubles, freed from all hurtful impressions from without, and sorrowful impressions within, but is liable to afflicting evils: And it is becoming his Duty to have his passions pliable to his condition, but without excess; the Eyes must not be drowned, nor dry, but tenderly affected.

Secondly; Considered in a moral respect, as they are sent from the high and just Providence of God, it is absolutely necessary there should be an humble resentment of his Displeasure. This is a consequent of the former; for if our affections are seared up, that we do not feel the stroke, how shall we regard the hand that smites us? If we are not sensible of Affliction, we are secure in our Sins. Natural Sorrow is introductive of Godly Sorrow. There are two extremes to be avoided by the afflicted, according to the direction of Solomon in the person of Wisdom, and repeated by the Apostle: My Son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him.

Some are discouraged and over-born by Afflictions as insupportable: others are stubborn and careless, and never lay them to heart: they never look upward to the original efficient Cause, an Offended God; nor inward to the impulsive deserving Cause, their Sins; but esteem them fortuitous Events that happen in this mutable state, without a design to correct and reform Sinners; or to proceed from a blind necessity, things of course; or merely regard the second Causes and Instruments of their Troubles: accordingly, when they meet with Calamities, all their care is by a perverse shift to seek for relief only in Temporal Comforts; without serious applying themselves to God, whose end in sending Troubles, is to reclaim us from Sin to Holiness, from Earth to Heavens, from the Creatures to himself.

This secret Atheism, like a benumbing Opium, stupefies the Conscience; and the insensibility of God’s hand inflicting Evils, is as different from Christian Patience and Constancy, as a mortal Lethargy is from the quiet, soft Sleep of Health: Nothing kindles his Anger more than neglecting it; ’tis equally provoking with the despising of his Love: It is a symptom of a wretched state of Soul; if there proceed no sighs and groans, no signs of grief from the sense of God’s displeasure, it is a sad evidence there is no Spiritual Life. Indolence under the effects of God’s Anger, is like the stillness of the Dead Sea, whose Calm is a Curse. The Jews, though intitled the People of God, are deeply charged for this prodigious Madness; O Lord, thou hast struck them, but they have not grieved; thou hast consumed them, but they refused to receive correction: they have made their faces harder than a Rock, they have refused to return. Jer. 5. 3.

We have whole Quarries of such obdurate Wretches amongst us; this impenitent disregard of God’s hand is a dreadful presage of future and more heavy Judgments. Who ever hardened himself against the Lord, and prospered? Do we provoke the Lord to Jealousy, are we stronger than he? The most refractory Sinner he can compel to acknowledge with bitter lamentations his Wickedness, and weakness, how unable he is to contend with his Judge. But supposing a respite from Punishment here, there is an Hell prepared for stubborn Sinners, where is Weeping and Wailing for ever. Whom the Rods do not awaken, the Scorpions shall.</p></blockquote>

We have whole Quarries of such obdurate Wretches amongst us; this impenitent disregard of God’s hand is a dreadful presage of future and more heavy Judgments. Who ever hardened himself against the Lord, and prospered? Do we provoke the Lord to Jealousy, are we stronger than he? The most refractory Sinner he can compel to acknowledge with bitter lamentations his Wickedness, and weakness, how unable he is to contend with his Judge. But supposing a respite from Punishment here, there is an Hell prepared for stubborn Sinners, where is Weeping and Wailing for ever. Whom the Rods do not awaken, the Scorpions shall.”

<blockquote><p>When the affliction is of long continuance. Some afflictions are like a summer-shower, heavy in their time, but soon over, and it grows fair again: but the most trying are the continuing afflictions, that are like a stormy winter, that blows hard day after day. Many times deliverance is looked for, but it comes not. Any promising signs that appear at any time do misgive: and the storm is renewed, and grows ever the longer the more hopeless. Here is a sore shock to abide, which requires to fight in faith,

1st, Believing that this is a part of the discipline of God’s house, whereby he exercises his own children. Hence says the prophet, Jer. viii. 20, “The harvest is past, the summer is ended, and we are not saved.” David complains, Psal. Ixix. 3. of his being weary of his crying, of his throat’s being dried; of his eyes failing while he waited for his God. The church was so long continued in affliction, that she forgot prosperity, Lam. iii. 17. Many of the Lord’s people have been kept so long under the hatches, that they have hung up their harps on the willows, so as to have no more use for them; and yet have been delivered.

2dly, Believing that the longest and blackest night will have a morning; and that though the affliction continue long, it will not continue always. Hence says the Psalmist, Psal. ciii. 9, “The Lord will not always chide: neither will he keep his anger for ever.” If the question be, “Watchman, what of the night? watch man, what of the night?” Is. xxi. 11. the answer is, ver. 12, “The morning cometh, and also the night: if ye will inquire, inquire ye: return, come.” The sky that has long lowered, may clear ere night: the wound may be looked on as incurable, that yet will be fairly healed, Jer. xv. 18, 20. And if it should not be removed in time, yet the faith of a blessed eternity may keep up the heart, when “God shall wipe away all tears from the eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away,” Rev. xxi. 4.

3dly, Believing that God knows the fittest season for removing the affliction, and not we. Hence said our Lord to his brethren, in another case, John vii. 6, “My time is not yet come: but your time is always ready.” He keeps times and seasons in his own hand, and at the fit time he will remove it, Hab. ii. 3. but not before, if it is to be removed in mercy. Men’s hearts must abide much hewing, and God may have much ado with an affliction that is not soon done. The affliction is too soon over, that is removed ere the design of it be answered, Psal. x. 17. None blames the husbandman, that he sows not his seed, before the ground be fit to receive it.

Lastly, Believing that the more we are resigned to the Lord as to the time and method of deliverance, the nearer we are to it, the fairer we lie for it. Hence says the Psalmist, Psal. x. 17, “Lord, thou hast heard the desire of the humble: thou wilt prepare their heart, thou wilt cause thine ear to hear.” Man’s extremity is God’s opportunity, Dent. xxxii. 36. Witness Abraham on the mount, the disciples at sea, the Israelites at the Red sea. Happy should they be, who leaving the deliverance on the Lord, should make it their main care to answer the calls of providence by the affliction while it is continued.</p></blockquote>

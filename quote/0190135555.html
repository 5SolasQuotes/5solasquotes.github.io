<main class="wrap"><figure class="quote" id="q-0190135555" data-kw="">
<blockquote><p>5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter. 6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 9, pp. 205-6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb44c0729d" data-kw="">
<blockquote><p>This one thing, however, we can scarcely refrain from mentioning, with regard to what is written in the 24th chapter of the aforesaid [Second Helvetic] Confession [of 1566] concerning the ‘festival of our Lord’s nativity, circumcision, passion, resurrection, ascension, and sending of the Holy Ghost upon his disciples,’ that these festivals at the present time obtain no place among us; for we dare not religiously celebrate any other feast-day than what the divine oracles have prescribed. Everything else, as we have said, we teach, approve, and most willingly embrace [in the Second Helvetic Confession].</p></blockquote>

</figure><figure class="quote" id="q-9714cc21b3" data-kw="">
<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 12-13</span></figcaption>

<blockquote><p>…consider, that this [second] command [of the 10 Commandments] is… broken… When something is added to his service, which He has not commanded; and this is superstition and will-worship largely so taken. Of this kind are… [6] More holy days than God has instituted… Again, this command is practically broken… When worship or service under the gospel… is without a divine warrant tied to such a time only; as Christmas (commonly called Yule), Easter, Pasch [Passover], etc. which is an observing of times that God has not appointed. [Gal. 4:9-11]</p></blockquote>

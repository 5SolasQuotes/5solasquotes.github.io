<main class="wrap"><figure class="quote" id="q-4605ce51f3" data-kw="">
<blockquote><p>It is eternal. Christ as mediator was loved before the foundation of the world in God’s purpose: John xvii. 24, ‘Father, I will that they also whom thou hast given me may be with me where I am, that they may behold my glory that thou hast given me; for thou hast loved me before the foundation of the world.’

And in loving Christ he loved us; and in choosing Christ as head of the church, the members were included in that election, for head and body cannot be severed. This grace was given us in Christ before the world began: 2 Tim. i. 9, ‘Who hath saved us, and called us with an holy calling; not according to our works, but according to his own purpose and grace, which was given us in Christ Jesus before the world began.’

Some are not called as soon as others, but all are loved as soon as others, even from eternity. God’s love is as ancient as himself, there was no time when God did not think of us, and love us. We are wont to prize an ancient friend; the ancientest friend we have is God, who loved us not only before we were lovely, but before we were at all. He thought of us before ever we could have a thought of him; after we had a being in infancy, we could not so much as know that he loved us; and when we came to years of discretion, we knew how to offend before we knew how to love and serve him; we cared not for his love, but prostituted our hearts to other things.

Let us measure the short scantling of our lives with eternity, wherein God showed love to us. As to our beings, we are but of yesterday; as to the constitution of our souls, we are sinners from the womb; and when we are convinced of it, we adjourn and put off the love of God to old decrepit age, when we have spent our strength in the world, and wasted ourselves in deceitful and flesh-pleasing vanities.

Now it should shame us when we remember God’s love is as ancient as his being. Some look after God sooner than others; but if you look after God never so soon, God was at work before us; those that began earliest, as Josiah, John Baptist, find God more early providing for their eternal welfare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several</cite>, Sermons upon the Seventeenth Chapter of St. John in Thomas Smith (ed.), The Works of Thomas Manton (22 vols, London: James Nisbet &amp; Co., 1873), 11: 80.</span></figcaption>

</figure><figure class="quote" id="q-bff9339c07" data-kw="">
<blockquote><p>To the spouse he is ‘altogether lovely,’ Cant. 5:16. Well, then, you see here is the true differencing note between us and the men of the world, whether we see anything in Christ why we should desire him. And it is both an inclusive and an exclusive mark. Some marks are inclusive; that is, if a man find them in him, he may be sure he is in Christ; but if not, he is not to determine he is out of Christ.

As the eminent and vigorous workings of holy graces, they do not take in every state of Christianity, they do not take in the infancy of grace. Other marks are exclusive; that is thus, they knock off the fingers of pretenders, and serve to show a man out of grace, but not in. As frequenting of the ordinances, a care of duty; if a man doth not these things, he may be sure he is none of God’s, though he cannot be sure he is of God because he doth them.

But now this is a mark that is inclusive and exclusive too. It is inclusive, for if your desires be to Christ, no doubt he is yours. It is a true mark, and a mark that is compatible to the weakness of grace. It is a true mark, for God looketh to the heart more than to the duty: Prov. 23:26, ‘My son, give me thy heart.’ And desires are the chiefest part of that. Desires are most genuine and suitable to the judgment and determination of the soul. They are a mark in which God’s weakest servants may comfort themselves. Those that fail in other things are not wanting in desires. However they may have many defects in their carriage and in their duties, yet they are sure their desires are towards him. If they cannot be much in duty, they will be much in their desires and valuations of him.

Peter, that durst not appeal to his own conscience for other things, dareth appeal to God’s omnisciency for this: John 21:17, ‘Lord, thou knowest all things; thou knowest that I love thee.’ And the people of God often vouch this: Isa. 26:8, ‘The desire of our soul is to thy name;’ Neh. 1:11, ‘Thy servants who desire to fear thy name.’ Therefore it is comfortable; and it is convincing too, and exclusive. Wicked men feel no desires; they have some slight wishes, carnal and weak velleities, but they have no serious desires, nor true volitions. Balaam may wish to die the death of the righteous, Num. 23:10. So they may desire Christ out of some general conceit of happiness; but they do not desire Christ for holiness. So there is no beauty in him why we should desire him. They do not desire him as seeing any beauty in his ways John 6:34, ‘Lord, evermore give us this bread.’ When Christ said he was the bread of life, those that would not come to Christ would fain have the bread of life.

Nay, heaven itself is not really desired by wicked men; it is true, they may desire it in a carnal way, as a Turkish paradise, and such a place of ease and delight as the Koran sets forth; but not as it is in itself, to enjoy God, and Christ, and more grace, and to be more free and undisturbed in respect of the prevailing of sin and corruptions. Those that desire Christ truly, desire him not for ease (the spirit of the world may do that), but from the beauty and excellency they find in him, and in his ways. His service is of a high and honourable nature, and therefore they desire it. So that you see here is the note of trial, and the main difference, viz., a desiring of Christ for the rare beauty and perfections that are found in him. Do you, then, try yourselves by this note.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 235-36.</span></figcaption>

<blockquote><p>Thus [in God’s blessing Ishmael] we see God’s great mercy—yes even to the evil and the ungrateful (Matt 5:45). If, however, we involve ourselves in that subject matter, we would never exhaust it…</p></blockquote>

</figure><figure class="quote" id="q-5e22185c10" data-kw="">
<blockquote><p>1. When the Lord Jesus comes and stands knocking at the door of your heart with the hammer of his Word, and with the hand of his Spirit, then bow yourself with all your might (as Sampson did, Judg. 16:30) to pull back every bolt and to draw in every bar that would keep the door shut against this blessed and bleeding Redeemer. The duty indeed is yours, but the ability is his: as much as in you lies, cause every lust of your heart to make room for your dear Jesus.

2. Welcome Christ into your heart with joy. Say to Him as Laban did to Abraham’s servant, ‘Come in thou blessed of the Lord, thou art welcome; wherefore standest thou without?’ Gen. 24:31. Christ will come to you with a blessing in his hand to bestow on you, as he did to Jacob, Gen. 32:26, etc. David-literal says to his son (that invited him to his house), ‘Why should we be chargeable to thee, my son?’ 2 Sam. 13:25. But this David-spiritual will not be chargeable: wheresoever He comes, where He comes to sup with any soul, He brings his supper with Him, Rev. 3:20, and eats but of his own honeycomb, and of his own honey, Cant. 5:1. This blessed guest brings his blessing with Him, as the ark did to the house of Obed-Edom.

3. When Christ is come into your house to dwell in your heart by faith, Eph. 3:17, be careful to keep his habitation quiet and comfortable; to this end you must adjure your corruptions by the roes and by the hinds of the field that they stir not up nor awake your beloved until He please, Cant. 2:7. ‘Tis pity such a blessed guest should meet with any disturbance; lay God’s charge upon your lusts…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown &amp; Glory of a Christian, consisting in a Sound Conversion</cite>, … (London: Newman, 1676), bk. 2, pp. 10-13</span></figcaption>

<blockquote><p>Earth’s Rulers must be told that Christ shall cut off the spirit of princes, and that He shall be terrible to the stubborn and rebellious kings of the earth (Ps. lxxvi. 12); they must be taught that Christ shall strike through kings in the day of His wrath (Ps. cx. 5); yea, they must be plainly reminded of that throne of inquity-shaking passage – “For the nation and kingdom that will not serve Thee shall perish; yea, those nations shall be utterly wasted” (Is. lx. 12).</p></blockquote>

<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>

</figure><figure class="quote" id="q-afff67acea" data-kw="">
<blockquote><p>Then Thirdly, In the third Article of our Solemn League and Covenant, we are bound to stand fast in the Defence, and to maintain the Liberties of the Church, and Privileges of the Kingdom, as We are Men and Christians. We have observed this, that some will plead on this Article of the Covenant for owning a Popish King: But O! is there not an express Condition and Qualification there, that we shall own no Magistrates over us, but in subordination to the Law of GOD, and those who will give us security for our Religion and Liberty: And have we not the Laws of GOD against Tyranny, and also the Laws of the Land, which we are bound to maintain every Soul of us; and now we do subscribe ourselves Breakers of it, when we own a Papist. Now have we performed this? Ay, ay, it may be some Ministers and Professors will say they have; but if we have done it, then what meaneth the bleating of the sheep, and lowing of the oxen? What meaneth the lowing of the Bulls of Bashan? What meant the Wicked walking on every side? And what means the Bloodshed?

All these things do Witness against us, if We have keeped this Article in refusing to set up Magistrates over us without security given for our Religion and Liberty: Neither was it Required of him, now when he is set up, and hath Arrogate to himself an absolute power; by virtue whereof he hath stopped and disabled all our Penal statutes made against Idolaters: and is intending to [Rob] us of all Privileges and Liberties, as we are Men and Christians. And if we have maintained and Defended our Privileges as we are Men and Christians, then what meaneth the great Oppression both of Bodies and Consciences in the Land? What meaneth the [Crushing] of many poor people under heavy Burdens and great Bondage. Nay, we are obliged to cut off Idolaters: The Idolater should be put to Death, according to the Law of GOD; and those Penal statutes in the Old Testament are not abrogated yet, for they are Moral.

Fourthly, In the Fourth Article of the solemn League and Covenant, we are bound to bring the Malignant Enemies of GOD to Condign punishment. By the Law of GOD Idolaters should die the Death; and Murderers should Die the Death; that the Land should not be defiled with Blood: Well have we done this? ay, ay, Ministers and Professors will say they have done it: But if we have performed this, then what meaneth the bleating of the sheep, and lowing of the Oxen? if we have Endeavoured to bring the Enemies of GOD to condign Punishment: Then what means the setting them up in places of Power and Trust, and instead of bringing Idolaters and Murderers to punishment, We have set them up Confederate with them, and taken Protection from them, and instead of bringing them to punishment, we have maintained them:

For what’s your Cess but a Grassing of Antichrist’s Bulls to push and destroy the LORDs people. The Devil has so many Oxen to Feed, and he Requires you to Feed them, that they may tread down the Work of GOD: and where is there any that stands up and justifies themselves? O is that a keeping of the Covenant, to maintain its Destroyers? And is that a bringing of these Enemies, Idolaters and Murderers to punishment, to Feed them, and Confederate with them? O ye have made thereby an unhappy Conjunction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some notes or heads of a preface preached at Distinckorn- Hill, in the Parish of Gaastoun, by Mr. Alexander Shields, preacher of the gospel, 25 April, 1688</cite>, (n.p., 1688), p. 19.</span></figcaption>

</figure><figure class="quote" id="q-d778a67570" data-kw="">
<blockquote><p>I conceive, though the State make a positive law, for order’s cause, that the king ordinarily convene parliaments; yet, if we dispute the matter in the court of conscience, the [parliamentary] estates have intrinsically (because they are the estates, and essentially judges of the land) ordinary power to convene themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644; Edinburgh: Ogle, 1843), p. 96</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c8af063fb1" data-kw="">
<blockquote><p>43. Potential being considered in itself is not simply real, that is, does not really exist save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason; for the idea of a possible quiddity involves the relation of non-repugnance to existence, while the others do not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-f1d631ae1a" data-kw="">
<blockquote><p>To the eternal decree corresponds temporal execution. For since God neither changes His counsel nor can be hindered by anyone, whatever He decreed with Himself from eternity, He executes outside Himself in time. From the variety of this execution arises the distinction of God’s works. … Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b7fc69887b" data-kw="">
<blockquote><p>4th Problem. Whether creatures can be similar to God? Answer: Of an accidental similitude, and by participation, Affirmed—as is manifestly proved from Gen. 1, where it treats of the creation of man to the image and likeness of God. But of an essential similitude, or one by essence, Denied. And under this distinction is to be explained, against the enthusiastic distortions, the passage 2 Pet. 1:4, where the participation of θείας φύσεως [the divine nature] is to be understood accidentally, by imitation and similitude—but not essentially according to substance, whether the same in number or in species. Hence, too, the passage Isa. 46 receives light, where God denies Himself to be similar to any thing—much less that any external image can be a picture of Him, or a formal sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations | ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin</cite>, vol. 5 (1669)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-fc058432b2" data-kw="">

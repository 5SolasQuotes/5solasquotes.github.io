<main class="wrap"><figure class="quote" id="q-2fa1212585" data-kw="">
<blockquote><p>But the cause why our adversaries are so loathe to allow of this opinion is for that they attribute unto the Sacraments more than they ought to do. For they think that by the power and efficacy of the work of baptism, sin is forgiven. Neither do they acknowledge [that] by the Sacraments, forgiveness is rather sealed, which they of perfect age obtain by believing, and the young children of the faithful, which belong unto election, have it already by the Holy Ghost and by grace. … And that it may the better appear that young children which are baptized (and not only they which have been baptized) do pertain unto the Church, we will declare it evidently enough by the epistle to the Ephesians where it is said (5:25), ‘Ye men love your wives, even as Christ loved the Church and gave Himself for it, that He might sanctify it, being cleansed by the washing of water through the Word, etc.’ By this place thou seest, that it is the Church which is washed and baptized. So then, so long as young children be baptized, it is manifest that they belong unto the Church, and they cannot truly be parts of the Church unless they be adorned with the Spirit of Christ. Wherefore young children which verily belong unto the election of God, before they can be baptized are instructed by the Spirit of the Lord…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, Book 4, ch. 8, ‘Of baptism, baptizing of infants and the holiness of them’</cite>, p. 120</span></figcaption>

<blockquote><p>If they are truly slaves, as slaves formerly were, I would not deny it; for we read that it was commanded to Abraham that he should circumcise all his servants. But such as we have as servants today—since for the most part they are truly free—I do not think they should be treated in that way. Nor indeed those who by right of war become subjects to princes; for this kind of subject nevertheless remains free. Therefore, with respect to those born of unbelieving parents yet free, if the parents consent, I think a distinction should be made. For they consent either after they themselves have become believers, and then there is no difficulty, etc.; or they persist in unbelief, and then I do not think they are to be baptized, etc.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Panstratiae, vol. 4, bk. 5, ch. 11, section 2, as quoted in Latin by Giles Firmin, A Sober Reply to the Sober Answer of Reverend Mr. Cawdrey… (London, 1653)</cite>, p. 42, trans. by ChatGPT4</span></figcaption>

<blockquote><p>11. ‘Then Zipporah tooke a sharpe knife and cut away the foreskin of her son.’ The two things that here might be considered (namely, that doctrine of Popery concerning the danger of children dying unbaptized, and secondly of such an absolute necessity of baptism, as that women must administer it in time of supposed need) I forbear to stand upon now: I have sufficiently touched them in my Notes upon Genesis. Therefore do but remember with yourself (touching the first) that we make a great difference betwixt want [lack] of the sacrament and contempt of the same; contempt, damning; and want, not, through the strength of God’s promise; meaning, by want, when God so prevents by death, that it cannot be had, according to the manner allowed in the Word. And, touching the second, observe, that this act of Zipporah, here, in circumcizing her child, was merely extraordinary, and does no way warrant women to baptize now-a-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable Notes upon the Books of Exodus &amp; Leviticus… (London, 1604), on Exodus, ch. 4</cite>, p. 60</span></figcaption>

<blockquote><p>The Law of Nature dictates that all who are admitted into this [Chuch] Society, must consent to be governed by the laws and rules of that society, according to its constitution. For none can be looked upon as a member of a society, but such a one as submits to the rules and laws of the society, as constituted at the time of his entrance into it. That all civil societies are founded upon voluntary consent and agreement of parties, and do depend upon contracts and covenants made between them, is evident to any that consider that men are not bound by the Law of Nature to associate themselves with any but whom they shall judge fit; that dominion and propriety was introduced by free consent of men: and so there must be laws and bonds fit, agreement made, and submission acknowledged to those laws, else men might plead their natural right and freedom still, which would be destructive to the very nature of these societies. When men then did first part with their natural Liberties, two things were necessary in the most express terms to be declared: First, a free and voluntary consent to part with so much of their natural rights as was not consistent with the well-being of the society; Secondly, a free submission to all laws, which should be agreed upon at their entrance into society, or afterwards as they see cause. But when societies were already entered, and children born under them, no such express consent was required in them, being bound by virtue of the protection they find from authority to submit to it, and an implicit consent is supposed in all such as are born under that authority. But for their more full understanding of this obligation of theirs, and to lay the greater tie of obedience upon them, when they come to understanding, it has been conceived very requisite by most states to have an explicit declaration of their consent, either by some formal oath of allegiance, or some other way sufficiently expressing their fidelity, in standing to the covenants long since supposed to be made. To apply this now to the Church. … Our Savior has determined how this consent should be expressed, viz. by receiving baptism from those who have the power to dispense it: which is the federal rite whereby our consent is expressed to own all the laws and submit to them, whereby this society is governed: Which at the first entering of men into this society of the Church was requisite to be done by the express and explicit consent of the parties themselves, being of sufficient capacity to declare it, but the Covenant being once entered into by themselves, not only in their own name, but in the name of their posterity (a thing implied in all covenants wherein benefits do redound to posterity, that the obligation should reach them to; but more particular in this, it having been always the tenor of God’s Covenants with men, to enter the seed as well as the persons themselves, as to outward privileges, Dt. 29:15; Acts 2:38), an implicit consent as to the children in Covenant is sufficient to enter them upon the privileges of it by baptism, although withal it be highly rational for their better understanding the engagement they entered into, that when they come to age, they should explicitly declare their own voluntary consent to submit to the laws of Christ, and to conform their lives to the profession of Christianity… …but in religious societies [in contrast to natural societies], though the act of consent be free, yet there is an antecedent obligation upon men, binding them to this voluntary consent… It is granted, Church-power does suppose consent, but then all Christians are under an obligation from the nature of Christianity to express this consent, and to submit to all censures legally inflicted. … …yet I no ways deny the lawfulness or expediency, in many cases, of having a personal profession from all baptized in infancy when they come to age (which we may, if we please, call Confirmation) and the necessity of desiring admission, in order to participation of all ordinances: which desire of admission, does necessarily imply men’s consenting to the laws of that society, and walking according to the duties of it; and so they are consequentially and virtually, though not expressly and formally, bound to all the duties required from them in that relation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 7 in Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined... (London: Mortlock, 1662), pt. 1</cite>, pp. 132-40</span></figcaption>

bligation+of+theirs%2C+and+to+lay+the+greater+tie+of+obedience+upon+them%2C+when+they+come+to+understanding%2C+it+has+been+conceived+very+requisite+by+most+states+to+have+an+explicit+declaration+of+their+consent%2C+either+by+some+formal+oath+of+allegiance%2C+or+some+other+way+sufficiently+expressing+their+fidelity%2C+in+standing+to+the+covenants+long+since+supposed+to+be+made.+To+apply+this+now+to+the+Church.+%E2%80%A6+Our+Savior+has+determined+how+this+consent+should+be+expressed%2C+viz.+by+receiving+baptism+from+those+who+have+the+power+to+dispense+it%3A+which+is+the+federal+rite+whereby+our+consent+is+expressed+to+own+all+the+laws+and+submit+to+them%2C+whereby+this+society+is+governed%3A+Which+at+the+first+entering+of+men+into+this+society+of+the+Church+was+requisite+to+be+done+by+the+express+and+explicit+consent+of+the+parties+themselves%2C+being+of+sufficient+capacity+to+declare+it%2C+but+the+Covenant+being+once+entered+into+by+themselves%2C+not+only+in+their+own+name%2C+but+in+the+name+of+their+posterity+%28a+thing+implied+in+all+covenants+wherein+benefits+do+redound+to+posterity%2C+that+the+obligation+should+reach+them+to%3B+but+more+particular+in+this%2C+it+having+been+always+the+tenor+of+God%E2%80%99s+Covenants+with+men%2C+to+enter+the+seed+as+well+as+the+persons+themselves%2C+as+to+outward+privileges%2C+Dt.+29%3A15%3B+Acts+2%3A38%29%2C+an+implicit+consent+as+to+the+children+in+Covenant+is+sufficient+to+enter+them+upon+the+privileges+of+it+by+baptism%2C+although+withal+it+be+highly+rational+for+their+better+understanding+the+engagement+they+entered+into%2C+that+when+they+come+to+age%2C+they+should+explicitly+declare+their+own+voluntary+consent+to+submit+to+the+laws+of+Christ%2C+and+to+conform+their+lives+to+the+profession+of+Christianity%E2%80%A6+%E2%80%A6but+in+religious+societies+%5Bin+contrast+to+natural+societies%5D%2C+though+the+act+of+consent+be+free%2C+yet+there+is+an+antecedent+obligation+upon+men%2C+binding+them+to+this+voluntary+consent%E2%80%A6+It+is+granted%2C+Church-power+does+suppose+consent%2C+but+then+all+Christians+are+under+an+obligation+from+the+nature+of+Christianity+to+express+this+consent%2C+and+to+submit+to+all+censures+legally+inflicted.+%E2%80%A6+%E2%80%A6yet+I+no+ways+deny+the+lawfulness+or+expediency%2C+in+many+cases%2C+of+having+a+personal+profession+from+all+baptized+in+infancy+when+they+come+to+age+%28which+we+may%2C+if+we+please%2C+call+Confirmation%29+and+the+necessity+of+desiring+admission%2C+in+order+to+participation+of+all+ordinances%3A+which+desire+of+admission%2C+does+necessarily+imply+men%E2%80%99s+consenting+to+the+laws+of+that+society%2C+and+walking+according+to+the+duties+of+it%3B+and+so+they+are+consequentially+and+virtually%2C+though+not+expressly+and+formally%2C+bound+to+all+the+duties+required+from+them+in+that+relation.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+ch.+7+in+Irenicum%2C+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine+Right+of+Particular+Forms+of+Church-Government+Discussed+%26+Examined...+%28London%3A+Mortlock%2C+1662%29%2C+pt.+1%2C+pp.+132-40&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7cdb80497d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7cdb80497d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=The%20Law%20of%20Nature%20dictates%20that,required%20from%20them%20in%20that%20relation&amp;text=The%20Law%20of%20Nature%20dictates%20that%20all%20who&amp;text=the%20duties%20required%20from%20them%20in%20that%20relation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I. Children of pagans, of whatever age and however they have come into the power of Christians, whether legitimately or illegitimately, if they are taken into Christian families as their slaves or servants, who can be manumitted [released] again at their masters’ pleasure and ejected from Christian families, should not be baptized, but should first be taught the Christian religion, and a confession of the same should be required from them before they are admitted to baptism. For such children of pagans are not and should not be considered members of the visible church either by right of birth or by right of adoption into Christian families. Not by right of birth, for they are born outside the church from unbelieving and polluted parents, and therefore they themselves are also rightly considered unbelieving and polluted, according to 1 Corinthians 7:14. Not by right of adoption into Christian families, for this, if it is done only for the sake of servitude and with reserved liberty of expulsion, makes no one a member of the church. For thus in the Old Testament, in the families of faithful patriarchs, and in the time of the primitive apostolic church in Christian families, many children were born from pagan servants, who nevertheless were outside the church no less than their parents, and were not considered its members, until their parents, having abandoned paganism, transferred to the Jewish or Christian religion and brought their children with them to the church. Nor does the example of Abraham in Genesis 17 stand opposed [to our position], who also circumcised those bought with money and foreigners. For Abraham did not force such unwilling ones to circumcision, nor did he admit them while still unbelieving, for otherwise God’s covenant would have been profaned. Instead, he first instructed them in the doctrine of the covenant and circumcised those who embraced that doctrine along with their infants.</p></blockquote>

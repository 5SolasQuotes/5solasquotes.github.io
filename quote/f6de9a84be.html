<blockquote><p>David’s Psalms are so full of praises, that they are called Tehillim, praises. Therefore the Apostles in that, Eph. 5, Col. 3, and Matt 26:30, use a Greek word of the same signification; namely, humnos, a hymn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Musick, or, The Singing of David’s Psalms</cite>, (London: Printed for Henry Overton, 1644), p. 16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1c0d1278e" data-kw="">
<blockquote><p>But the practice of this devotion [a psalmody] I derived from a higher precedent [and not just the Early Church], even of Christ and his apostles: for before the passion, immediately they sung a Psalm, saith the Scripture, hymno dicto, saith the vulgar Latin, ‘having recited or said a Psalm’. But however, it was part of David’s Psalter that was sung, it was the great Allelujah, as the Jews called it, beginning at the 113 psalm, to the 119 exclusively, part of that was sung… Against the example of Christ, if we confront the practice of Antichrist, nothing can be said greater in commendation of this manner of devotion: for B. Hippolytus, in his oration of the end of the world, saith that in the days of Antichrist, Psalmorum decantatio cessabit, they shall then no more use the singing or saying of the Psalms; which when I had observed. without any further deliberation I fixed upon the Psalter as the best weapon against him whose coming we have great reason to believe is not far off, so great preparation is making for him. From the example of Christ this grew to be a practice apostolical, and their devotion came exactly home to the likeness of the design of this very Book: they turned the Psalms into prayers. Thus it was said of Paul and Silas, Acts 16, ‘they prayed a Psalm’, so it is in the Greek… I only add this, that since according to the instruction of our blessed Savior, God is to be worshipped in Spirit and in truth, no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in Psalms and Hymns, and spiritual Songs, and the spirit of truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-vaughan.html">Robert Vaughan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects According to the Matter of Each Psalm</cite>, (Oxford, 1644), The Preface, no page number. This psalter only contains the 150 psalms.</span></figcaption>

</figure><figure class="quote" id="q-10bee237fb" data-kw="">
<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath</cite>, (1595/1606; Naphtali &amp; RHB, 2015) Emphasis in the original. See also pp. 402-3. | Book 2, ch. 11, ‘Private Worship: Singing of Psalms’, pp. 396-8</span></figcaption>

<blockquote><p>The worship of God is commanded by our assemblies to be in private families, as catechizing by the master of the family (or some other better gifted in every family; Deut. 6:6-8; Gen. 18:19; Eph. 6:1-3; 2 Tim. 3:15), and praying (Zech. 12:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 20, 13th Article, ‘Private Worship’, p. 326</span></figcaption>

<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>

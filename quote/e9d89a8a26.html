<main class="wrap"><figure class="quote" id="q-e9d89a8a26" data-kw="">
<blockquote><p>Now concerning the collection for the saints, upon the first day of the week let every one of you lay by him in store, as God has prospered him. 1 Corinthians 16:1–2. We find in the New Testament often mentioned a certain collection that was made by the Grecian churches for their brethren in Judea, who were reduced to pinching want by a dearth that then prevailed, which was the heavier upon them by reason of the circumstances of the Christians, who were from the beginning greatly oppressed and persecuted by unbelieving Jews.

We have this contribution twice mentioned in Acts, as in Acts 11:28–30, Acts 24:17. So it is taken notice of in several of the epistles: in the Epistle to the Romans (Romans 15:26); and again in the Epistle to the Galatians (Galatians 2:10). But ’tis most largely insisted on in these two epistles to the Corinthians: in this First Epistle in this sixteenth chapter, and in the Second Epistle in the eighth and ninth chapters. The Apostle begins his directions in this place with the words of our text, wherein we may observe,

1. What is the thing to be done about which the Apostle gives them direction: and that is the making a collection for the saints. The exercising and manifesting their charity towards their brethren by communicating to them for the supply of their wants, which was by Christ and his apostles often spoken of and insisted on, [is] one main duty of the Christian religion, and is expressly so declared to be by the apostle James; James 1:27, “Pure religion and undefiled before God and the Father is this, to visit the fatherless and widows in their affliction, and to keep himself unspotted from the world.”

2. We may observe the time in which the Apostle directed that this should be done, viz. on the first day of the week. The Apostle by the inspiration of the Holy Ghost insists upon it, that it be done on such a particular day of the week, as if no other day would do so well as that or were proper and fit a time for such work. Thus, although the inspired Apostle was not for making that distinction of days in gospel times as the Jews did—Galatians 4:10–11, “Ye observe days, and months, and times, and years. I am afraid of you, lest I have bestowed upon you my labour in vain”—yet here the Apostle gives the preference to one day of the week before any other for the performance of a certain great duty of Christianity.

3. It may be observed that this is the direction that the Apostle had given to other churches that were concerned in the same duty upon this occasion. He had given direction to them also to do it on the first day of the week: “as I have given order to the churches of Galatia, even so do ye.” Whence we may learn that it was not anything peculiar in the circumstances of the Christians at Corinth that was the reason why the Holy Ghost insisted on its being done on this day of the week by them. The Apostle had given the like order to the churches of Galatia. Now, Galatia was far distant from Corinth; there was the sea that parted ’em, and besides that there were several other countries between ’em.

Therefore it cannot be thought that the Holy Ghost directs ’em to this time upon any secular account, having respect to some particular circumstances of the people in that city, but upon a religious account, something he has respect to that reached all Christians throughout the wide world, upon the account of which he gives a preference to this day, for such work, before any other day.

And we learn by other passages of the New Testament that the case was the same with respect to other exercises of religion, that the first day of the week was the day preferred before any other amongst the primitive Christians in the age of the apostles in the churches immediately under the apostles’ care; Acts 20:7, “Upon the first day of the week, when the disciples came together to break bread, Paul preached unto them.”

It seems by those things to have been amongst the primitive Christians in the apostles’ days with respect to the first day of the week as it was amongst the Jews with respect to the seventh. The doing of alms, showing mercy, we are taught by Christ, is proper work for a sabbath day. When the Pharisees found fault with Christ suffering the disciples to pluck the ears of corn and eat on the sabbath day, Christ corrects them with that: “I will have mercy, and not sacrifice” (Matthew 12:7). And Christ teaches that works of mercy are proper on the sabbath in Luke 13:15–16, Luke 14:5. ‘Tis work that used to be done on sacred festivals and days of rejoicing under the old testament, as it was in Nehemiah’s and Esther’s time (Nehemiah 8:10; Esther 9:19, Esther 9:22). And Josephus and Philo, two very learned and noted Jews that wrote not long after Christ’s time, give that account, that it was the manner amongst the Jews on the sabbath to make collections for sacred and pious uses on the sabbath day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 220-22.</span></figcaption>

<blockquote><p>It is very much abused, if it be offered to any such thing as that we must come out from among the ministers, and be separated from them, for:

1. This separation here commanded is from infidels, unrighteousness, darkness, Belial, idols. The Corinthians did very ill in eating and sitting at the idols’ tables of the gentiles, which gave great offense to the weak, 1 Cor. 10:17, 20.

2. This was not a separation from the Church of Corinth, nor from the ministers thereof; though there were many corruptions entertained among them, yet they were to have communion in public ordinances, as is proved above: Only it is a separation from the idolatry in it. There may be a separation from the corruptions of a Church, very well consistent with abiding in the communion of that Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

1. This separation here commanded is from infidels, unrighteousness, darkness, Belial, idols. The Corinthians did very ill in eating and sitting at the idols’ tables of the gentiles, which gave great offense to the weak, 1 Cor. 10:17, 20.

2. This was not a separation from the Church of Corinth, nor from the ministers thereof; though there were many corruptions entertained among them, yet they were to have communion in public ordinances, as is proved above: Only it is a separation from the idolatry in it. There may be a separation from the corruptions of a Church, very well consistent with abiding in the communion of that Church.”

<blockquote><p>245. Therefore, the confessions of particular Churches and the decrees and canons of particular synods, and the catecheses of particular Churches and the liturgies or ecclesiastical agendas and similar formulas, their doctrines or declarations are not the immutable and universal norm of faith and truth, according to which it ought to be judged or pronounced what is to be believed and conceded, what is to be repudiated and condemned, what is true or false, orthodox or heretical. For it is not always necessary that what agrees with the confession of some particular Church, synodical decrees, catechesis, liturgy or ecclesiastical agenda, formula of doctrine or some other declaration, is true; nor is it always false what disagrees with it. Therefore, it should not be demanded that all Churches subscribe to the declaration and formula of one particular Church: but indeed those formulas do not even bind one Church or any private person to approve them and to contain themselves within them, except with this condition, insofar as they agree with divine Scripture and universal Symbols.</p></blockquote>

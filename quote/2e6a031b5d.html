<main class="wrap"><figure class="quote" id="q-2e6a031b5d" data-kw="eternal immutable unconditional decree">
<blockquote><p>Every decree of God is eternal; therefore it cannot depend upon a condition which takes place only in time. (2) God’s decrees depend on his good pleasure (eudokia) (Mt. 11:26; Eph. 1:5; Rom. 9:11). Therefore they are not suspended upon any condition outside of God. (3) Every decree of God is immutable (Is. 46:10; Rom. 9:11). Now a conditional decree is mutable because every condition is mutable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/nature-of-the-decree.html">Nature of the Decree</a> › <a href="../topics/the-decrees-of-god/nature-of-the-decree/eternal-wise-free-immutable-unconditional.html">Eternal, wise, free, immutable, unconditional</a></span><span class="t"><a href="../topics/election/conditional-election.html">Conditional Election</a> › <a href="../topics/election/conditional-election/election-on-foreseen-faith.html">Election on foreseen faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36908052ff" data-kw="eternal decrees election">
<blockquote><p>We believe that all the decrees are absolutely eternal. … Scripture ascribes eternity to them (as when a kingdom is said to have been prepared for the pious “from the foundation of the world” [Mt. 25:34]; when we are said to have been chosen “before the foundation of the world” [Eph. 1:4]; and grace is said to have been given in Christ “before the world began” [2 Tim. 1:9]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.1–2</span></figcaption>

</figure><figure class="quote" id="q-e44b964dae" data-kw="decrees of God">
<blockquote><p>That there are decrees in God both Scripture testifies (which repeatedly attributes to him foreknowledge, purpose, determinate counsel, good pleasure) and manifold reason evinces. This is true both from the highest perfection of God (to which it pertains that nothing shall take place without his will) and from his omniscience (by which he knows from eternity all his works, not only possible but also future—which he could not behold otherwise than in his decree).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1.2</span></figcaption>

</figure><figure class="quote" id="q-285e6e7ed1" data-kw="foreknowledge decree">
<blockquote><p>If the foreknowledge of God is eternal, it is necessary that the decree upon which it is founded should also be eternal (since he does not know things as future except in the decree, through which they pass from a state of possibility to a state of futurition).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“If the foreknowledge of God is eternal, it is necessary that the decree upon which it is founded should also be eternal (since he does not know things as future except in the decree, through which they pass from a state of possibility to a state of futurition).”

</figure><figure class="quote" id="q-4abeab1df8" data-kw="liberty decree free">
<blockquote><p>The eternity of God’s decrees does not take away his liberty in decreeing. Although no moment can be assigned in which God was actually indifferent to decreeing this or that thing, still it is certain that the nature of God was in itself indifferent to decreeing this or that thing. For there was no necessary connection between God and creatures as exists between the Father and the Son (whom he could not but beget). On the other hand, he might (if he had willed) have abstained from any production of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.13</span></figcaption>

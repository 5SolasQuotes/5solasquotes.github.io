<main class="wrap"><figure class="quote" id="q-1b3792411e" data-kw="">
<blockquote><p>…but this especially must be agreed upon, that as our sins are the chief and true cause of the plague, so that this is the only proper remedy against the same; if the ministers dispute not of the infection (which belongs to physicians) but by their life and doctrine stir up the people to earnest repentance, and love, and charity one towards another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (1580; London, 1665), p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59f824cb51" data-kw="">
<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maxwell.html">John Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacro-Sancta Regum Majestas</cite>, (1644; London: Dring, 1680) 304 pp. ToC, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

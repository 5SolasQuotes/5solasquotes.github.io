<main class="wrap"><figure class="quote" id="q-dc170c2e95" data-kw="">
<blockquote><p>An article in Moses Roney’s Reformed Presbyterian periodical highlights the absurdity of Old and New School Presbyterians tolerating man-stealers in their communion (which also reminds us that the Old-New School split was not merely about slavery):

Add to all this, the exciting subject of slavery creates division in both the Old and New School ranks, and hastens on a subdivision into separate bodies. The anti-slavery men maintain, teach and prove that the holding of unoffending men in bondage as goods and chattels, like beasts of burden, is theft and robbery; while many distinguished pro-slavery men teach, that it is a natural relation, and sanctioned by the gospel of Christ. They farther assert that the doctrine of immediate emancipation is fanatical, incendiary, and seditious; and acting on their principles, they encourage mobs to prevent by violence the discussion of the right of the slave to freedom. We should like to know certainly the ecclesiastical standing of the man that lately murdered the Rev. Mr. Lovejoy, at Alton, Illinois, for his attempt to plead the cause of the trampled down slave. We do know that a clerical brother of the martyr to the cause, of liberty, encouraged the mob that committed the murder; and we know that an elder of the Presbyterian body was in the mob that committed violence on the person of Amos Dresser. Now, how is it possible for men to continue long together in the same communion, when their sentiments are so adverse as that what one party holds to be theft and robbery, the other strenuously maintains to be righteous, and practices accordingly? How can they long continue to meet at the same communion table, whose adverse doctrines and practices have already issued in deeds of violence and blood?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-roney.html">Moses Roney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divisions in the churches in Reformed Presbyterian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>The subordinate public judgment, which is extraordinary, is the judgement of a council, assembled for the more public and effectual establishment and declaration of one or more points of faith and heads of Christian doctrine, and that in opposition to all contrary heresy, or error, which is broached and set a foot in the Church. (M. Ant. De Dom. de Rep. Eccl., bk. 7, ch. 3, n. 32) From which council, no Christian man who is learned in the Scriptures may be excluded, but ought to be admitted to utter his judgement in the same. For in the indagation [investigation] or searching out of a matter of faith, they are not the persons of men which give authority to their sayings, but the reasons and documents which every one brings for his judgment.</p></blockquote>

</figure><figure class="quote" id="q-897cf9c1de" data-kw="">
<blockquote><p>I must confess that I can see no way to prevent the growing effects of our fatal distempers, except God so bless the Government by law established, with that spirit of Discretion, of Moderation, of Equity, and of Lowliness in all things which it doth act, that none shall be able to find any just grievance at it.

And to this effect, the less the Classical Presbyteries shall resemble the Civil Courts of Judicature, or the Bishop’s Courts in former time, the more they will be suitable to the end for which they are instituted, which is, to entertain Brotherly conferences and consultations about spiritual matters for mutual assistance and support in the ways of God; and not at all to intermeddle with the Congregations in any of their particular affairs, which are not voluntarily brought unto them as a Case wherein their Judgement is sought unto; for no particular Church, by its subordination to a Classis, is to be deprived of any right which it hath within it self, but is rather thereby to be maintained therein.

The Maxims then of spiritual Communion to be observed in the Classical Presbyteries, that all misconstructions of their ways which occasion jealousies and clamours, may be prevented, ought to be published, to wipe away the fears which ensuare us into distractions against the duties of Love. And it will be necessary not only to publish those Maxims for this end; but three other things more must be satisfactorily, and from the grounds of Scripture cleared, if ever the Government shall prosper, to settle us in Peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t</cite>, (London: John Bellamy, 1647), preface to the reader.</span></figcaption>

</figure><figure class="quote" id="q-2d68b0f711" data-kw="">
<blockquote><p>Here it must be noted that Church history has constrained all that understand it to confess (both Papists, Greeks and Protestants) that: [1.] The ordination of bishops and presbyters was in the power of the bishops, and the election in the power of the people, not only the first 300 years under heathen emperors, but for many hundred years after under Christian emperors and princes.

2. That this was taken for their right given them by God. To cite more proofs, for this would expose us to the reader’s censure as unnecessary tediousness: Many Papists largely prove it, as does David Blondel beyond exception, De jure plebis in regimine Ecclesiastico, with more.

3. That yet we here plead not for the necessity of so much as the people’s election as it signifies the first nomination of the person, but only for the necessity of consent, either explicitly or implicitly expressed. If the senior pastors have the first nomination, or, if it be the magistrate, or patrons, as with us, we quarrel not against it if the flock do but consent. Parents may choose husbands and wives for their children; but they are not such at all till mutual consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, pp. 80-81</span></figcaption>

2. That this was taken for their right given them by God. To cite more proofs, for this would expose us to the reader’s censure as unnecessary tediousness: Many Papists largely prove it, as does David Blondel beyond exception, De jure plebis in regimine Ecclesiastico, with more.

3. That yet we here plead not for the necessity of so much as the people’s election as it signifies the first nomination of the person, but only for the necessity of consent, either explicitly or implicitly expressed. If the senior pastors have the first nomination, or, if it be the magistrate, or patrons, as with us, we quarrel not against it if the flock do but consent. Parents may choose husbands and wives for their children; but they are not such at all till mutual consent.”

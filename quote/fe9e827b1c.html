<main class="wrap"><figure class="quote" id="q-fe9e827b1c" data-kw="">
<blockquote><p>The short [of your inquiring letter] whereof is: The receiving without public repentance of those which come from the Churches of England [to separate assemblies in England]: where because in the outward profession, that the laws of the land do justify the dumb [non-preaching] ministry, there appear unto you no lawful assemblies of the Church of Christ; your fear is, lest in uniting yourselves with such [by allowing them into the good graces of the separate assemblies], you should be unequally yoked [with them], and made fellow members of some other than of that whereof Christ Jesus is the Head. First therefore, if it be showed that the ordinary assemblies of those that profess the Gospel in England be the Churches of Christ, it seems that the way will be paved and planed for mutual intercourse between us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’ 15 pp. (1584) in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-11fa616f61" data-kw="">
<blockquote><p>I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton [was 39-40 years old], who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world; but it is straight before me, and I firmly resolve, if the Lord will, to give a more distinct account of the rise, steps, and unheard-of heights of all the right-hand extremes that have been in Scotland these 49 years, past and present; and set them up as beacons to the following ages, to beware of splitting upon such dangerous rocks. … But it is plain that these formed, divided parties of Dissenters are so puffed up with a frothy conceit of themselves and their actings, that they speak and write with, as if religion, zeal and faithfulness, wit and sense, would live and die with them; and none [other are held] to know anything of the times, nor what Israel ought to do, disdaining, disesteeming, disregarding, rash and harsh constructing of all who differ from, or oppose, them or their way of managing of a testimony; the very reverse of a gospel spirit. And I am sadly confirmed, by the many, long, melancholly debates these 48 years, of the truth of this spiritual pride rampant amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols., ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript</cite>, pp. 138-40</span></figcaption>

</figure><figure class="quote" id="q-d9df8860b7" data-kw="">
<blockquote><p>Divisions and contendings have been the undoing of this Church first and last, but I think more of late, and more shamefully than ever, the matter being so small (if wisely considered) about which all this noise has been made. I take not upon me to justify the indulged ministers, neither will I rigidly condemn them: But, if the separating from their ministry and pressing the matter with such heat and violence shall be found to be good service done to Christ, I have read the Scriptures wrong; and the sad consequences of it are convincing enough, if people were humble and convincible. It was this contention which expelled that profitable and most edifying exercise of mutual prayer and Christian conference (that I may say nothing how it drove from the shepherds’ tents) upon which followed a sensible decay in the exercise of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

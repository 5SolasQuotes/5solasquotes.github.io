<blockquote><p>It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-m-williams.html">Scott M. Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Person’ in Patristic &amp; Medieval Christian Theology’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1a3b26882" data-kw="">
<blockquote><p>First, you cannot deny but that in these words of Christ, ‘Father if it be possible, or if it be thy will, let this cup pass from Me,’ Christ prayed not as a Mediator for his elect, for so He was engaged to drink of this cup, but as a man naturally declining and abhorring death and the ignominy of the cross as they are in themselves evil: and yet all your arguments, mutatis mutandis, ‘with due change’ may be applied unto this interpretation, as well as unto Dr. Twisse’s notion (as you call it) upon Lk. 23:34. Secondly, in answer unto your objections, we may make use of a distinction of prayer brought by Suarez in the 3rd Part, Summa, Aquinas, quest. 21, art. 4, ‘Prayer is nothing else but an unfolding of the will unto God.’ Now in Christ’s manhood there was a twofold will, one absolute and effectual, another conditional and uneffectual, which may otherwise be termed a velleity, a will of simple complacency, a will of a thing only secundum quid, in some particular respect, ‘according to some particular consideration’. Of such a will of his we read, Mk. 7:24, ‘He entered into an house, and would have no man know it, but He could not be hid.’ Answerable unto these two acts of the will in Christ, there may be attributed unto Christ two sorts or kinds of prayer: one proceeding from an absolute and effectual will, and this was always heard: the other from a conditional and uneffectual will, and this was not always heard; such was his prayer in his agony, ‘Let this cup pass from Me’; and of this sort or kind of prayer is that passage, Ps. 22:2, in reference unto Christ, understood, ‘O my God, I cry in the day time, but Thou hearest not, and in the night season and am not silent.’ Now to apply this distinction: Christ could not pray as a private man for those of his persecutors for whom He did not pray as a Mediator, if we speak of that kind of prayer, which comes from an absolute and effectual will, which is styled by Gregory de Valentia, Voluntas rationis undequaque deliberatae [the will of the rule which has deliberated in every respect], because it proceeds upon regard had to all circumstances. And the reason is, because with this kind of prayer, He never prayed for any thing, but what He knew would be granted; for He never absolutely and effectually willed any thing, but what was agreeable unto God’s absolute will, the will of his decree or good pleasure; and this is all that your [John Goodwin’s] arguments can prove. But yet notwithstanding this, He might pray (taking prayer for a representation of a conditional or uneffectual will) for the pardon of even those of his persecutors, who He knew should be condemned and for whom therefore He prayed not as Mediator: or more plainly, He might express a velleity, a gracious, merciful, and charitable desire, to have all his crucifiers pardoned, so as it were not contrary unto God’s decree, unto which He did submit, and in which He did acquiesce, as He did in his prayer for the removal of his passion, ‘not my will but thy will be done.’ An answer very like unto, if not coincident with this, may be easily gathered out of Dr. Twisse; and it is that Christ, as a private man, prayed for the pardon of all his persecutors, taking prayer for an expression of Christ’s antecedent will, not as prayer is a representation of his consequent will. An antecedent will, as Alvarez explains it, is the willing of a thing considered absolutely, as it is in itself, abstracting from all other considerations of it. A consequent will is the willing of a thing considered with all circumstances wherewith it is clothed. Thus a merchant wills the preservation of his wares with an antecedent will, as the preservation of his wares is considered in itself; but he does not will it with a consequent will as it is considered with this circumstance, as ’tis accompanied with hazard and danger of his life. Thus also a judge with an antecedent will, wills the life of a prisoner, because his life is in itself a thing good and desireable: but he does not will it with a consequent will, as he is guilty of murder, incest or any the like capital crime. Now Dr. Twisse, though he reject the application of this distinction to God, with whose simplicity and infinite knowledge several successive considerations of one and the same thing are utterly incompatible, yet he denies not but it may have place in the manhood of Christ: Ratione diversarum considerationum non nego (says he) distinctionem istam competere posse in hominem; quippe cui variae considerationes occurrere possunt invicem succedentes: sic Christus naturali sui conservandi desiderio ferebatur, cum a patre peteret, ut calix transiret; at considerata voluntate et decreto patris de calice isto ad bibendum ipsi propinato, eidem se submittere consultum duxit. [With respect to different considerations, I do not deny that this distinction can apply to man; for various considerations may occur to him, succeeding one another. Thus Christ was moved by His natural desire for self-preservation when He asked the Father that the cup might pass from Him; but, having considered the Father’s will and decree concerning that cup which had been appointed for Him to drink, He judged it expedient to submit Himself to the same.] This distinction in regard of diverse considerations of one and the same thing, may be ascribed unto man, in whom are found several considerations of the same thing succeeding one another: So Christ as man, out of a natural desire of self-preservation, prayed that the cup of his passion might pass from Him; but the will or decree, the command of his Father, his own office, and man’s salvation being considered, He submitted himself to the drinking up of this cup, even to the very dregs; nevertheless not my will but thy will be done. Lk. 22:42. If this cup may not passe away from me except I drinke it, thy will be done. Mt. 26:42. He did not will his passion with an antecedent will, but he willed it (you see) with a consequent will. Jn. 4:34. And so he prayed against it, as a prayer is a proposal of an antecedent, not consequent will. Now that Dr. Twisse resembles this prayer of Christ, for the forgiveness of all his crucifiers, unto Christ’s deprecation of his death and passion, and makes it to be as that, an expression only of an antecedent will, a desire of their pardon, considered absolutely in itself, abstracting from God’s decree unto the contrary, I shall evidence by giving you Dr. Twisse’s own words. Vindication of the Grace, Power &amp; Providence of God, bk. 1, pt. 2, page 188: Non dicit Molinaeus istam voluntatem Christi hominis, secundum quam oravit pro crucifigentibus ipsum, contrariam fuisse voluntati divinae; potuit enim fieri cum submissione voluntati Dei tacite facta, licet non expressa, ad formulam precationis illius: pater transeat a me calix iste; Sed non mea voluntas fiat, sedtua. [“Molina does not say that this will of Christ as man, according to which He prayed for those who crucified Him, was contrary to the divine will; for it could have been made with a tacit submission to the will of God, although not expressly stated, in accordance with the form of that prayer: ‘Father, let this cup pass from Me; nevertheless, not My will, but Yours, be done.’] And again afterwards in the same page: Annon homini sanctissimo convenit, privatam offensam remittere, et palam protestari, se (nisi Deus aliter statuisset) percupere ut ipsis ignosceret; de quibus tamen Deus aliter forsitan constituerit, quod et ipsi forsitan innotescit? Annon petiit salvator, et ardenter obsecravit, ut si possibile esset, calix transiret, cum tamen Deum aliter constituisse, ne scilicet eum transiret calix, ipsi satis constaret? etc. Denique, Christum illis bene voluisse, ut homo erat, quos antecedaneo decreto ab omnis boni spe ac possessione absolute exclusit Deus; hoc enim addendum fuit (licet illud fraudulenter nimiùm dissimulet Corvinus) etiam haec sententia quid horrendi, quaeso te inculcat? Praesertim cum non sic voluisse dicamus, considerata ista, de eorum a salute exclusione, voluntate divina; sed duntaxat, si per voluntatem Dei aliter constitutum non fuisset, et si penes ipsum esset, ut eligeret, utrum in persecutores ipsius vindictam exerceret, aut suspenderet; pro ea quam ut homo in omnes (etiam in injuriis remittendis) charitatem exercere debuit, vindictam suspensam mallet quam exercitam. [Does it not befit a most holy man to forgive a private offense, and openly to profess that he would greatly desire to forgive them (unless God had otherwise determined); concerning whom, nevertheless, God perhaps had otherwise ordained, a fact which perhaps was also known to Him? Did not the Savior ask, and earnestly beseech, that, if it were possible, the cup might pass from Him, although it was sufficiently clear to Him that God had otherwise determined—that is, that the cup should not pass from Him? etc. Finally, that Christ, insofar as He was man, wished well to those whom God, by a prior decree, had absolutely excluded from all hope and possession of good: for this too had to be added (although Corvinus most deceitfully conceals it)—what, I ask you, of anything horrible does this doctrine inculcate? Especially since we do not say that He willed thus when that divine will concerning their exclusion from salvation is taken into consideration; but only that, if God’s will had not otherwise determined the matter, and if it had been within His power to choose whether to exercise vengeance upon His persecutors or to suspend it, then, in accordance with that charity which, as man, He ought to exercise toward all (even in the forgiving of injuries), He would have preferred that vengeance be suspended rather than exercised.]</p></blockquote>

— Henry Jeanes, A Vindication of Dr. Twisse from the Exceptions of Mr. John Goodwin in his Redemption Redeemed (Oxford: Robinson, 1653), pp. 254-55 appended to William Twisse, The Riches of God’s Love… (Oxford: L.L., 1653)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+you+cannot+deny+but+that+in+these+words+of+Christ%2C+%E2%80%98Father+if+it+be+possible%2C+or+if+it+be+thy+will%2C+let+this+cup+pass+from+Me%2C%E2%80%99+Christ+prayed+not+as+a+Mediator+for+his+elect%2C+for+so+He+was+engaged+to+drink+of+this+cup%2C+but+as+a+man+naturally+declining+and+abhorring+death+and+the+ignominy+of+the+cross+as+they+are+in+themselves+evil%3A+and+yet+all+your+arguments%2C+mutatis+mutandis%2C+%E2%80%98with+due+change%E2%80%99+may+be+applied+unto+this+interpretation%2C+as+well+as+unto+Dr.+Twisse%E2%80%99s+notion+%28as+you+call+it%29+upon+Lk.+23%3A34.+Secondly%2C+in+answer+unto+your+objections%2C+we+may+make+use+of+a+distinction+of+prayer+brought+by+Suarez+in+the+3rd+Part%2C+Summa%2C+Aquinas%2C+quest.+21%2C+art.+4%2C+%E2%80%98Prayer+is+nothing+else+but+an+unfolding+of+the+will+unto+God.%E2%80%99+Now+in+Christ%E2%80%99s+manhood+there+was+a+twofold+will%2C+one+absolute+and+effectual%2C+another+conditional+and+uneffectual%2C+which+may+otherwise+be+termed+a+velleity%2C+a+will+of+simple+complacency%2C+a+will+of+a+thing+only+secundum+quid%2C+in+some+particular+respect%2C+%E2%80%98according+to+some+particular+consideration%E2%80%99.+Of+such+a+will+of+his+we+read%2C+Mk.+7%3A24%2C+%E2%80%98He+entered+into+an+house%2C+and+would+have+no+man+know+it%2C+but+He+could+not+be+hid.%E2%80%99+Answerable+unto+these+two+acts+of+the+will+in+Christ%2C+there+may+be+attributed+unto+Christ+two+sorts+or+kinds+of+prayer%3A+one+proceeding+from+an+absolute+and+effectual+will%2C+and+this+was+always+heard%3A+the+other+from+a+conditional+and+uneffectual+will%2C+and+this+was+not+always+heard%3B+such+was+his+prayer+in+his+agony%2C+%E2%80%98Let+this+cup+pass+from+Me%E2%80%99%3B+and+of+this+sort+or+kind+of+prayer+is+that+passage%2C+Ps.+22%3A2%2C+in+reference+unto+Christ%2C+understood%2C+%E2%80%98O+my+God%2C+I+cry+in+the+day+time%2C+but+Thou+hearest+not%2C+and+in+the+night+season+and+am+not+silent.%E2%80%99+Now+to+apply+this+distinction%3A+Christ+could+not+pray+as+a+private+man+for+those+of+his+persecutors+for+whom+He+did+not+pray+as+a+Mediator%2C+if+we+speak+of+that+kind+of+prayer%2C+which+comes+from+an+absolute+and+effectual+will%2C+which+is+styled+by+Gregory+de+Valentia%2C+Voluntas+rationis+undequaque+deliberatae+%5Bthe+will+of+the+rule+which+has+deliberated+in+every+respect%5D%2C+because+it+proceeds+upon+regard+had+to+all+circumstances.+And+the+reason+is%2C+because+with+this+kind+of+prayer%2C+He+never+prayed+for+any+thing%2C+but+what+He+knew+would+be+granted%3B+for+He+never+absolutely+and+effectually+willed+any+thing%2C+but+what+was+agreeable+unto+God%E2%80%99s+absolute+will%2C+the+will+of+his+decree+or+good+pleasure%3B+and+this+is+all+that+your+%5BJohn+Goodwin%E2%80%99s%5D+arguments+can+prove.+But+yet+notwithstanding+this%2C+He+might+pray+%28taking+prayer+for+a+representation+of+a+conditional+or+uneffectual+will%29+for+the+pardon+of+even+those+of+his+persecutors%2C+who+He+knew+should+be+condemned+and+for+whom+therefore+He+prayed+not+as+Mediator%3A+or+more+plainly%2C+He+might+express+a+velleity%2C+a+gracious%2C+merciful%2C+and+charitable+desire%2C+to+have+all+his+crucifiers+pardoned%2C+so+as+it+were+not+contrary+unto+God%E2%80%99s+decree%2C+unto+which+He+did+submit%2C+and+in+which+He+did+acquiesce%2C+as+He+did+in+his+prayer+for+the+removal+of+his+passion%2C+%E2%80%98not+my+will+but+thy+will+be+done.%E2%80%99+An+answer+very+like+unto%2C+if+not+coincident+with+this%2C+may+be+easily+gathered+out+of+Dr.+Twisse%3B+and+it+is+that+Christ%2C+as+a+private+man%2C+prayed+for+the+pardon+of+all+his+persecutors%2C+taking+prayer+for+an+expression+of+Christ%E2%80%99s+antecedent+will%2C+not+as+prayer+is+a+representation+of+his+consequent+will.+An+antecedent+will%2C+as+Alvarez+explains+it%2C+is+the+willing+of+a+thing+considered+absolutely%2C+as+it+is+in+itself%2C+abstracting+from+all+other+considerations+of+it.+A+consequent+will+is+the+willing+of+a+thing+considered+with+all+circumstances+wherewith+it+is+clothed.+Thus+a+merchant+wills+the+preservation+of+his+wares+with+an+antecedent+will%2C+as+the+preservation+of+his+wares+is+considered+in+itself%3B+but+he+does+not+will+it+with+a+consequent+will+as+it+is+considered+with+this+circumstance%2C+as+%E2%80%99tis+accompanied+with+hazard+and+danger+of+his+life.+Thus+also+a+judge+with+an+antecedent+will%2C+wills+the+life+of+a+prisoner%2C+because+his+life+is+in+itself+a+thing+good+and+desireable%3A+but+he+does+not+will+it+with+a+consequent+will%2C+as+he+is+guilty+of+murder%2C+incest+or+any+the+like+capital+crime.+Now+Dr.+Twisse%2C+though+he+reject+the+application+of+this+distinction+to+God%2C+with+whose+simplicity+and+infinite+knowledge+several+successive+considerations+of+one+and+the+same+thing+are+utterly+incompatible%2C+yet+he+denies+not+but+it+may+have+place+in+the+manhood+of+Christ%3A+Ratione+diversarum+considerationum+non+nego+%28says+he%29+distinctionem+istam+competere+posse+in+hominem%3B+quippe+cui+variae+considerationes+occurrere+possunt+invicem+succedentes%3A+sic+Christus+naturali+sui+conservandi+desiderio+ferebatur%2C+cum+a+patre+peteret%2C+ut+calix+transiret%3B+at+considerata+voluntate+et+decreto+patris+de+calice+isto+ad+bibendum+ipsi+propinato%2C+eidem+se+submittere+consultum+duxit.+%5BWith+respect+to+different+considerations%2C+I+do+not+deny+that+this+distinction+can+apply+to+man%3B+for+various+considerations+may+occur+to+him%2C+succeeding+one+another.+Thus+Christ+was+moved+by+His+natural+desire+for+self-preservation+when+He+asked+the+Father+that+the+cup+might+pass+from+Him%3B+but%2C+having+considered+the+Father%E2%80%99s+will+and+decree+concerning+that+cup+which+had+been+appointed+for+Him+to+drink%2C+He+judged+it+expedient+to+submit+Himself+to+the+same.%5D+This+distinction+in+regard+of+diverse+considerations+of+one+and+the+same+thing%2C+may+be+ascribed+unto+man%2C+in+whom+are+found+several+considerations+of+the+same+thing+succeeding+one+another%3A+So+Christ+as+man%2C+out+of+a+natural+desire+of+self-preservation%2C+prayed+that+the+cup+of+his+passion+might+pass+from+Him%3B+but+the+will+or+decree%2C+the+command+of+his+Father%2C+his+own+office%2C+and+man%E2%80%99s+salvation+being+considered%2C+He+submitted+himself+to+the+drinking+up+of+this+cup%2C+even+to+the+very+dregs%3B+nevertheless+not+my+will+but+thy+will+be+done.+Lk.+22%3A42.+If+this+cup+may+not+passe+away+from+me+except+I+drinke+it%2C+thy+will+be+done.+Mt.+26%3A42.+He+did+not+will+his+passion+with+an+antecedent+will%2C+but+he+willed+it+%28you+see%29+with+a+consequent+will.+Jn.+4%3A34.+And+so+he+prayed+against+it%2C+as+a+prayer+is+a+proposal+of+an+antecedent%2C+not+consequent+will.+Now+that+Dr.+Twisse+resembles+this+prayer+of+Christ%2C+for+the+forgiveness+of+all+his+crucifiers%2C+unto+Christ%E2%80%99s+deprecation+of+his+death+and+passion%2C+and+makes+it+to+be+as+that%2C+an+expression+only+of+an+antecedent+will%2C+a+desire+of+their+pardon%2C+considered+absolutely+in+itself%2C+abstracting+from+God%E2%80%99s+decree+unto+the+contrary%2C+I+shall+evidence+by+giving+you+Dr.+Twisse%E2%80%99s+own+words.+Vindication+of+the+Grace%2C+Power+%26+Providence+of+God%2C+bk.+1%2C+pt.+2%2C+page+188%3A+Non+dicit+Molinaeus+istam+voluntatem+Christi+hominis%2C+secundum+quam+oravit+pro+crucifigentibus+ipsum%2C+contrariam+fuisse+voluntati+divinae%3B+potuit+enim+fieri+cum+submissione+voluntati+Dei+tacite+facta%2C+licet+non+expressa%2C+ad+formulam+precationis+illius%3A+pater+transeat+a+me+calix+iste%3B+Sed+non+mea+voluntas+fiat%2C+sedtua.+%5B%E2%80%9CMolina+does+not+say+that+this+will+of+Christ+as+man%2C+according+to+which+He+prayed+for+those+who+crucified+Him%2C+was+contrary+to+the+divine+will%3B+for+it+could+have+been+made+with+a+tacit+submission+to+the+will+of+God%2C+although+not+expressly+stated%2C+in+accordance+with+the+form+of+that+prayer%3A+%E2%80%98Father%2C+let+this+cup+pass+from+Me%3B+nevertheless%2C+not+My+will%2C+but+Yours%2C+be+done.%E2%80%99%5D+And+again+afterwards+in+the+same+page%3A+Annon+homini+sanctissimo+convenit%2C+privatam+offensam+remittere%2C+et+palam+protestari%2C+se+%28nisi+Deus+aliter+statuisset%29+percupere+ut+ipsis+ignosceret%3B+de+quibus+tamen+Deus+aliter+forsitan+constituerit%2C+quod+et+ipsi+forsitan+innotescit%3F+Annon+petiit+salvator%2C+et+ardenter+obsecravit%2C+ut+si+possibile+esset%2C+calix+transiret%2C+cum+tamen+Deum+aliter+constituisse%2C+ne+scilicet+eum+transiret+calix%2C+ipsi+satis+constaret%3F+etc.+Denique%2C+Christum+illis+bene+voluisse%2C+ut+homo+erat%2C+quos+antecedaneo+decreto+ab+omnis+boni+spe+ac+possessione+absolute+exclusit+Deus%3B+hoc+enim+addendum+fuit+%28licet+illud+fraudulenter+nimi%C3%B9m+dissimulet+Corvinus%29+etiam+haec+sententia+quid+horrendi%2C+quaeso+te+inculcat%3F+Praesertim+cum+non+sic+voluisse+dicamus%2C+considerata+ista%2C+de+eorum+a+salute+exclusione%2C+voluntate+divina%3B+sed+duntaxat%2C+si+per+voluntatem+Dei+aliter+constitutum+non+fuisset%2C+et+si+penes+ipsum+esset%2C+ut+eligeret%2C+utrum+in+persecutores+ipsius+vindictam+exerceret%2C+aut+suspenderet%3B+pro+ea+quam+ut+homo+in+omnes+%28etiam+in+injuriis+remittendis%29+charitatem+exercere+debuit%2C+vindictam+suspensam+mallet+quam+exercitam.+%5BDoes+it+not+befit+a+most+holy+man+to+forgive+a+private+offense%2C+and+openly+to+profess+that+he+would+greatly+desire+to+forgive+them+%28unless+God+had+otherwise+determined%29%3B+concerning+whom%2C+nevertheless%2C+God+perhaps+had+otherwise+ordained%2C+a+fact+which+perhaps+was+also+known+to+Him%3F+Did+not+the+Savior+ask%2C+and+earnestly+beseech%2C+that%2C+if+it+were+possible%2C+the+cup+might+pass+from+Him%2C+although+it+was+sufficiently+clear+to+Him+that+God+had+otherwise+determined%E2%80%94that+is%2C+that+the+cup+should+not+pass+from+Him%3F+etc.+Finally%2C+that+Christ%2C+insofar+as+He+was+man%2C+wished+well+to+those+whom+God%2C+by+a+prior+decree%2C+had+absolutely+excluded+from+all+hope+and+possession+of+good%3A+for+this+too+had+to+be+added+%28although+Corvinus+most+deceitfully+conceals+it%29%E2%80%94what%2C+I+ask+you%2C+of+anything+horrible+does+this+doctrine+inculcate%3F+Especially+since+we+do+not+say+that+He+willed+thus+when+that+divine+will+concerning+their+exclusion+from+salvation+is+taken+into+consideration%3B+but+only+that%2C+if+God%E2%80%99s+will+had+not+otherwise+determined+the+matter%2C+and+if+it+had+been+within+His+power+to+choose+whether+to+exercise+vengeance+upon+His+persecutors+or+to+suspend+it%2C+then%2C+in+accordance+with+that+charity+which%2C+as+man%2C+He+ought+to+exercise+toward+all+%28even+in+the+forgiving+of+injuries%29%2C+He+would+have+preferred+that+vengeance+be+suspended+rather+than+exercised.%5D%E2%80%9D%0A%0A%E2%80%94+Henry+Jeanes%2C+A+Vindication+of+Dr.+Twisse+from+the+Exceptions+of+Mr.+John+Goodwin+in+his+Redemption+Redeemed+%28Oxford%3A+Robinson%2C+1653%29%2C+pp.+254-55+appended+to+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love%E2%80%A6+%28Oxford%3A+L.L.%2C+1653%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff1a3b26882.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f1a3b26882.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/christ-has-two-harmonious-wills-divine-human/#:~:text=First%2C%20you%20cannot%20deny%20but%20that,vengeance%20be%20suspended%20rather%20than%20exercised&amp;text=First%2C%20you%20cannot%20deny%20but%20that%20in%20these&amp;text=preferred%20that%20vengeance%20be%20suspended%20rather%20than%20exercised" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Touching the first, the soul-trouble of Christ, we are to consider: 1st Position. This holy soul thus troubled, was like the earth before the Fall, out of which grew roses without thorns, or thistles, before it was cursed. Christ’s anger, his sorrow, were flowers that smelled of heaven, and not of sin: All his affections of fear, sorrow, sadness, hope, joy, love, desire, were like a fountain of liquid and melted silver; of which the banks, the head-spring, are all as clear from dross as pure crystal: such a fountain can cast out no clay, no mud, no dirt. When his affections did rise and swell in their acts, every drop of the fountain was sinless, perfumed and adorned with grace; so as the more you stir or trouble a well of rose-water, or some precious liquor, the more sweet a smell it casts out: Or, as when a summer soft wind blows on a field of sweet roses, it diffuses precious and delicious smells through the air. There is such mud and dregs in the bottom and banks of our affections, that when our anger, sorrow, sadness, fear, does arise in their acts, our fountain casts out sin. We cannot love, but we lust; nor fear, but we despair; nor rejoice, but we are wanton and vain and gaudy; nor believe… O that Christ would plant some of his flowers in our soul, and bless the soil, that they might grow kindly there, being warmed and nourished with his grace: If grace be within, in sad pressures it comes out… … 3rd Position. Undeniably, grace did so accompany nature, that he could not fear more than the object required. Had all the strength of men and angels been massed and contemperated in one, they should have been in a higher measure troubled than Christ was: So how much trouble was in Christ’s affections, as much there was of reason, perfumed and lustered with grace… So neither were his affections above banks; he saw the blackest and darkest hour that ever any saw; suppose all the sufferings of the damned, for eternity, were before them in one sight, or came on them at once, it should annihilate all that are now, or shall be in hell. Christ now saw, or foresaw as great sufferings, and yet: 1. believed, 2. prayed, 3. hoped, 4. was encouraged under it, 5. suffered them to the bottom with all patience, 6. rejoiced in hope, Ps. 16:9. Now our affections rise and swell before reason: 1. They are often imaginary, and are on horse-back and in arms at the stirring of a straw. 2. They want that clearness and serenity of grace that Christ had, through habituall grace following nature from the womb. 3. We can raise our affections, but cannot allay them: as some magicians can raise the Devil, but cannot conjure, or command him: or, some can make war, and cannot create peace… And this extremity of soul-trouble was most rational, coming from the infallible apprehension of the most pressing cause of soul-trouble, that ever living man was under.</p></blockquote>

<blockquote><p>4. The gospel holds forth the greatest example of self-denial that ever was in the world, and by all ways that ever God has made known his mind, He never has revealed his will in an example of self-denial so as He has done in the Gospel, and that is in the example of the Lord Jesus Christ: God evidences there such a work of self-denial as never was: and ’tis impossible to apprehend a greater example of self-denial than that is: though Christ thought it no robbery to be equal with God; read but the second of the Philippians, vv. 7-8, and there you may see what Christ was, and yet how He emptied Himself, how He denied Himself in his honor, how vile He was made in the world, though He was the brightness of his father’s glory, yet He was made of no reputation; how He denied Himself in riches. Christ that was the heir of all things, though He were rich, yet He was made poor for us; how He denied Himself in his pleasures, He was the delight of the Father from all eternity, and yet he was made a man of sorrows; He denied Himself in his life, for He was the Lord of life, and yet He subjected Himself to death, to a cursed death for us: Oh the example of Christ in self-denial is the greatest that ever was: and this seems to be one great end of the humiliation of Jesus Christ to hold forth a preaching pattern of self-denial to the world: And there’s a great deal more power in the pattern and example of self-denial, then in the commands of self-denial. I only present this to show you that it is the most unbeseeming the gospel for anyone that professes the gospel to be selfish, altogether scraping for themselves; and whatsoever service they are put upon, except self may have an oar in it, they have no mind to it; Oh ’tis becoming the gospel of Jesus Christ for men and women to be emptied of themselves, no matter what becomes of ourselves, but be willing to give up ourselves for public good, to venture your estates and lives, and all your comforts, yea to be swallowed up in the glory of God, to be nothing, that Christ may be all. In the gospel of Christ, we find that Christ, He was swallowed up with the glory of his Father; and He came not to do his own will, but the will of his father that sent Him; and though He was one that had infinitely more excellency than all men and angels in heaven and earth, yet He was content for the honor of his Father to be made as a worm and no man, to be trampled under foot, to endure the greatest extremities of all sorts; this holds out an example to us, that while we live in this world we should be taken off from ourselves: Oh this self-love sticks much in the hearts of men and women: now upon the example of Christ’s self-denial, we are required to deny ourselves, and it is the proper lesson of the Gospel, ‘He that will follow me, let him deny himself,’ you never read of such a precept in all the Old Testament;(though no question the people of God did deny themselves then), but in expresse terms so fully you have not such a thing there: and there’s no such rules among the heathens for a man to deny himself. ‘Let him deny himself;’ those that know the original, know that the word is, not only to deny, but there is that joined to it that does increase the signification, let them deny themselves, thoroughly, there is a preposition put to the word, to show that those that will come to Christ must deny themselves, and that thoroughly, it is a proper lesson of the gospel, and the first lesson. Oh when our Lord and Master has thus denied Himself, and emptied Himself for good to us, what is beseeming this gospel, but that all that are professors of it should deny themselves? It is very unbeseeming the glorious gospel, for a Christian to be selfish, to have his self-ends, and self-ways, and interests in everything, as generally almost all men in the world they are acted by self, some self-ends, or self-excellency carries them on in their actions, or else they have no heart to do anything; this is unbecoming the gospel. But now I say, one that would live as becomes the Gospel, must be wholly emptied of himself, whatsoever parts, estate, credit, or honor he has in the world, must be melted into the glory of God; Jesus Christ for the glory of His Father, was content infinitly to deny Himself more than we can; For what have we to deny ourselves of? Do you or I live as becomes the gospel? when (I say) all that we apprehend to have any excellency in, we have it all swallowed up in the glory of God, when we can dedicate and consecrate our lives, honors, liberties, estates, comforts, and all to the glory of God, and be as nothing to ourselves, and let God be all in all to us. Ministers may bring many reasons why we should deny ourselves, but all these reasons comes to nothing, till the soul comes to behold the clear light of the gospel, and there beholds the Son of God by faith, how He did empty Himself; nay then, says a believing soul, if the Son of God did deny Himself, was emptied thus for me, Oh then let me be wholly taken off from myself, and venture wholly upon God, I must not live in myself, nor live for myself, nor live to myself; but wholly live in God, and for God, and to God, and upon God: Oh this is that which becomes the gospel of Jesus Christ.</p></blockquote>

t+that+all+that+are+professors+of+it+should+deny+themselves%3F+It+is+very+unbeseeming+the+glorious+gospel%2C+for+a+Christian+to+be+selfish%2C+to+have+his+self-ends%2C+and+self-ways%2C+and+interests+in+everything%2C+as+generally+almost+all+men+in+the+world+they+are+acted+by+self%2C+some+self-ends%2C+or+self-excellency+carries+them+on+in+their+actions%2C+or+else+they+have+no+heart+to+do+anything%3B+this+is+unbecoming+the+gospel.+But+now+I+say%2C+one+that+would+live+as+becomes+the+Gospel%2C+must+be+wholly+emptied+of+himself%2C+whatsoever+parts%2C+estate%2C+credit%2C+or+honor+he+has+in+the+world%2C+must+be+melted+into+the+glory+of+God%3B+Jesus+Christ+for+the+glory+of+His+Father%2C+was+content+infinitly+to+deny+Himself+more+than+we+can%3B+For+what+have+we+to+deny+ourselves+of%3F+Do+you+or+I+live+as+becomes+the+gospel%3F+when+%28I+say%29+all+that+we+apprehend+to+have+any+excellency+in%2C+we+have+it+all+swallowed+up+in+the+glory+of+God%2C+when+we+can+dedicate+and+consecrate+our+lives%2C+honors%2C+liberties%2C+estates%2C+comforts%2C+and+all+to+the+glory+of+God%2C+and+be+as+nothing+to+ourselves%2C+and+let+God+be+all+in+all+to+us.+Ministers+may+bring+many+reasons+why+we+should+deny+ourselves%2C+but+all+these+reasons+comes+to+nothing%2C+till+the+soul+comes+to+behold+the+clear+light+of+the+gospel%2C+and+there+beholds+the+Son+of+God+by+faith%2C+how+He+did+empty+Himself%3B+nay+then%2C+says+a+believing+soul%2C+if+the+Son+of+God+did+deny+Himself%2C+was+emptied+thus+for+me%2C+Oh+then+let+me+be+wholly+taken+off+from+myself%2C+and+venture+wholly+upon+God%2C+I+must+not+live+in+myself%2C+nor+live+for+myself%2C+nor+live+to+myself%3B+but+wholly+live+in+God%2C+and+for+God%2C+and+to+God%2C+and+upon+God%3A+Oh+this+is+that+which+becomes+the+gospel+of+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Conversation+%28London%3A+Cole%2C+1650%29%2C+sermon+5%2C+on+Phil.+1%3A27%2C+pp.+93-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd8ea214094.html&amp;via=5Solas" target=

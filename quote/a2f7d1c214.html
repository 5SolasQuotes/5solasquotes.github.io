<main class="wrap"><figure class="quote" id="q-a2f7d1c214" data-kw="">
<blockquote><p>The Image of God, is that dignity, and excellency, in which the reasonable creatures, being created like unto God, do excel other creatures.

Of this Image of God there are two parts, perfect reason, and perfect blessedness. Perfect reason, is a part of God’s Image, by which the reasonable creature, doth more expressly carry the Image of God his creator, whilst by a certain divine force it knoweth plainly things, without error, as they are, and doth will and choose no other thing, then that which doth please God. And that perfect reason consisteth, both in the mind and in the will.

Perfect reason in the mind, is an excellent understanding, rightly knowing all simple, particular, and general things, which a created nature can know, and joining them together, or dividing them, or reasoning by compared things, it having also by nature, some ingraffed &amp; natural knowledge, such as are the principles of arts, and rule of life, and a respective motion judging of the proper acts thereof.

In the will there is both the conformity of the will with God, and also free will. The conformity of the will with God, is that obedience, which the will doth uprightly perform to God, so that all inclinations, desires, and actions do agree with God’s will. The free will of a reasonable creature, is the power of the will, choosing or refusing freely and of it own proper motion, without compulsion, that which understanding sheweth to be chosen or refused.

Thus far concerning perfect reason: now concerning perfect blessedness.

Perfect blessedness is that other part of the image of God, by which a natural creature, through an excellent joy, taking pleasure in God alone, doth enjoy perfect felicity.

The creatures made according to the image of God, are Angels, and men. Angels, are created, understanding, and invisible spirits, neither sustained in any other (excepting in God alone) neither part of another. And Angels are either good or evil. Good Angels, are Angels which have stood in their integrity in which they were made.

Their free will, is to good things only, because they are already so confirmed in goodness, that their mind cannot be deceived, nor err in judging, that is to say, in approving, &amp; misliking the object, neither can the will desire any other thing, then that which the mind judgeth, but choose that which it approveth, refuse and reject that which it misliketh. Job. 4.18. Mat. 22.30. 1. Tim. 5.21. Ephes. 1.10. Col. 1.20.

The duty of good Angels is two fold: either towards God, or men. Their duty towards God is of two sorts: the first to do God’s will. Psal. 103.20. The second to set forth God by continual praises. Psal. 103.20. and 148.2.

The duty of Angels towards men, is also two fold. The one, to be a defence to the elect against all dangers, and against the subtleties and assaults of the enemies, and to carry the souls of the elect being dead, into the place of the blessed. Or else to minister to those that fear God in all their ways. Heb. 1.14. Psal. 34.8. &amp; 103.21. Mat. 18.10. Psal. 91.11. Dan. 10. and 12. Luke. 16.22. Their other duty is, to punish the evil. For the good Angels, are not only the disposers of the goodness of God, but also sometime executors of punishment. 2. King. 29.35.</p></blockquote>

</figure><figure class="quote" id="q-6ea1dd5eff" data-kw="">
<blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause. It pertains to the intellect and will in such a way that the intellect judges and shows what should be done, but the will commands what is shown and judged, and thus at root it has reference to the intellect, but formally it has reference to the will. This certainly implies some indifference, in a divided sense, as they say, by which, with the consideration of the divine decree and predetermination set aside, man is indifferent at least by nature to acting or not acting; yet he is not indifferent in a composite sense, with regard to the divine decree and its predetermining providence, but is already determined virtually to one or the other; much less does choice consist in indifference itself. For in this way neither God, nor angel, nor any man, regenerate or unregenerate, would possess free choice, and consequently free choice would be a non-entity. For God is determined to good… And so arbitrium, choice, is more correctly said to consist in the power of acting from counsel and προαίρεσις, free choosing, or what is the same thing, in rational complacency.</p></blockquote>

<blockquote><p>Now who can be so insensible to the words of the apostle, who so foolishly, nay, so insanely ignorant of the purport of his statement, as to venture to affirm that the law is grace, when he who knew very well what he was saying emphatically declares, “Ye who are justified by the law are fallen from grace”? Well, but if the law is not grace, seeing that in order that the law itself may be kept, it is not the law, but only grace which can give help, will not nature at any rate be grace?

For this, too, the Pelagians have been bold enough to aver, that grace is the nature in which we were created, so as to possess a rational mind, by which we are enabled to understand,—formed as we are in the image of God, so as to have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that creepeth upon the earth.

This, however, is not the grace which the apostle commends to us through the faith of Jesus Christ. For it is certain that we possess this nature in common with ungodly men and unbelievers; whereas the grace which comes through the faith of Jesus Christ belongs only to them to whom the faith itself appertains. “For all men have not faith.” Now, as the apostle, with perfect truth, says to those who by wishing to be justified by the law have fallen from grace, “If righteousness come by the law, then Christ is dead in vain;” so likewise, to those who think that the grace which he commends and faith in Christ receives, is nature, the same language is with the same degree of truth applicable: if righteousness come from nature, then Christ is dead in vain.

But the law was in existence up to that time, and it did not justify; and nature existed too, but it did not justify. It was not, then, in vain that Christ died, in order that the law might be fulfilled through Him who said, “I am come not to destroy the law, but to fulfil it;” and that our nature, which was lost through Adam, might through Him be recovered, who said that “He was come to seek and to save that which was lost;” in whose coming the old fathers likewise who loved God believed.</p></blockquote>

<blockquote><p>XXIV. As for the Protestants, and those who among them are called Reformed by a special name, they also, by common consent, teach that God created man in true righteousness and holiness: according to Ecclesiastes, God made man upright. For that rectitude could consist in nothing else but conformity with the will and law of God, in which man’s righteousness consists. They also think that Paul alludes to this when he exhorts the faithful to put on the new man, who was created according to God in justice and holiness of truth. Where it is manifest that he alludes to the first creation, in which man is said to be created in the image and likeness of God; to which, in his view, belongs that holiness and justice which Christ works in the faithful by His Spirit. XXV. However, they do not place that holiness and justice in which the first man was created by God solely in the fact that he acknowledged God as his Creator, as was fitting, and adhered to Him with pure and sincere love, but also in the fact that all his faculties were so well constituted and ordered that the lower faculties obeyed the higher, and the higher obeyed God without difficulty and resistance; nor was there any inclination to evil or difficulty and resistance in doing good, such as is now found in all and each individual. Therefore, according to their opinion, in the newly created man, there was nothing disordered or immoderate. Nor did any struggle or conflict of his faculties among themselves have a place in him: but all his faculties, in the highest concord and order among themselves, conspired to the same end, namely that to which he was created by God, the author of nature. XXVI. Moreover, they contend that this righteousness was natural to the first man before the fall and should be called so. Not because it constituted part of the essence of human nature, or because it necessarily flowed from the principles of human nature: but because it was something created with nature and belonging to the innate endowments of human nature not yet fallen… Therefore, according to their doctrine, that original righteousness was a natural gift, not a supernatural one. And it related to the soul of integral man in the same way that the just proportion and beauty of the members, vigor, and decor related to his body, which were found in him then and which regarded a certain natural, not supernatural, perfection of man: although they were not of the essence of man, nor did they necessarily flow from the principles of human nature. … XLV. Furthermore, as can be inferred from what has been said, many in the Roman Church concede to the Reformed that original justice, whatever it should be called, whether natural or supernatural, was a perfection so owed to innocent man that, consistent with divine wisdom and goodness, he could not have been created without it: and therefore the state of man in pure natural things, as described by the common view of the Roman School, and in which it is supposed that man was not a sinner but devoid of justice, prone to vice, and struggling with concupiscence against right reason, is something merely fictitious; and which the goodness, justice, and wisdom of God in the nature of things never allowed to exist. XLVI. Conversely, the Protestant Doctors concede to the Roman School that original justice was not natural to the first man, in the sense that natural signifies what constitutes nature or what necessarily, or in a physical manner, flows from the principles of human nature. Moreover, many Doctors of the Reformed School do not deny that the first man had certain supernatural gifts: and that some grace was necessary for man, even when innocent, to act rightly and justly. Indeed, some of them acknowledge that original righteousness did not flow from the powers of nature [in some respect]. … LVII. However, this does not contradict what many Reformed distinctly teach, namely that there were some supernatural gifts in the first man. For God could add whatever He pleased above nature’s original endowments and the aids necessary for it; but what and how much that was, we do not dare, in the absence of Scripture, to define. However, it is certain from Scripture that there was some supernatural knowledge in the first man: since God revealed Himself to him above nature and taught him His will by express word.</p></blockquote>

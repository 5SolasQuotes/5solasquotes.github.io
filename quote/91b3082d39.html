<blockquote><p>2. He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle[-dove]; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?”… Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God in Christ, A God of Love’, a sermon on 1 Jn. 4:16, in The Whole Works of the late Rev. Ebenezer Erskine</cite>, (d. 1754), vol. 1, pp. 280-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6858a106bb" data-kw="">
<blockquote><p>He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you… ‘My son, my child, give me your heart.’ Open to Me, your God, your Savior; for my head has been ‘filled with the dew’ of divine wrath, ‘and my locks with the drops’ of fearful affronts ‘for thy sake:’…</p></blockquote>

</figure><figure class="quote" id="q-5e22185c10" data-kw="">
<blockquote><p>1. When the Lord Jesus comes and stands knocking at the door of your heart with the hammer of his Word, and with the hand of his Spirit, then bow yourself with all your might (as Sampson did, Judg. 16:30) to pull back every bolt and to draw in every bar that would keep the door shut against this blessed and bleeding Redeemer. The duty indeed is yours, but the ability is his: as much as in you lies, cause every lust of your heart to make room for your dear Jesus.

2. Welcome Christ into your heart with joy. Say to Him as Laban did to Abraham’s servant, ‘Come in thou blessed of the Lord, thou art welcome; wherefore standest thou without?’ Gen. 24:31. Christ will come to you with a blessing in his hand to bestow on you, as he did to Jacob, Gen. 32:26, etc. David-literal says to his son (that invited him to his house), ‘Why should we be chargeable to thee, my son?’ 2 Sam. 13:25. But this David-spiritual will not be chargeable: wheresoever He comes, where He comes to sup with any soul, He brings his supper with Him, Rev. 3:20, and eats but of his own honeycomb, and of his own honey, Cant. 5:1. This blessed guest brings his blessing with Him, as the ark did to the house of Obed-Edom.

3. When Christ is come into your house to dwell in your heart by faith, Eph. 3:17, be careful to keep his habitation quiet and comfortable; to this end you must adjure your corruptions by the roes and by the hinds of the field that they stir not up nor awake your beloved until He please, Cant. 2:7. ‘Tis pity such a blessed guest should meet with any disturbance; lay God’s charge upon your lusts…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown &amp; Glory of a Christian, consisting in a Sound Conversion</cite>, … (London: Newman, 1676), bk. 2, pp. 10-13</span></figcaption>

</figure><figure class="quote" id="q-3845f27f7c" data-kw="">
<blockquote><p>‘Behold, I stand at the door’ of your heart and ‘knock: Open to Me, my sister, my love, my undefiled; for my head is filled with the dew, and my locks with the drops of the night.’… ‘When He waits to be gracious, and exalts Himself to show mercy.’ why tire out his patience till He ‘shut up all his tender mercies in his wrath?’ ‘Is it a small thing for you to weary men,’ weary parents, and ministers? ‘But will ye weary my God also?‘</p></blockquote>

<blockquote><p>There is a double interpretation of this text, each of them claiming under very valuable interpreters; some making it a declaration of Christ’s readiness to come in to souls, and to give them a spiritual fellowship and communion with Himself; others interpreting it of Christ’s readiness to come to the Last Judgment, and to take his saints into an eternal joyful fellowship and communion with Himself: hence there is a different interpretation of every sentence in the text. I stand at the door; either, in my gospel dispensations, I stand at the door of sinners’ hearts; or, I am ready to come to judge the world. And knock, by the inward monitions and impressions of my Spirit, or my ministers more externally; or, I am about to knock, that is, I am ready to have the last trump sounded. If any man hear my voice, and open the door; that is, if any man will hearken to the counsels and exhortations of my ministers, and to the monitions of my Spirit, and not resist my Holy Spirit; or, if any man has heard my voice, and opened his heart to Me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole’s English Annotations on the Holy Bible. Collinges was one of the men who finished Poole’s Commentary after he died, having gotten to Isa. 58</cite>, Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There is a double interpretation of this text, each of them claiming under very valuable interpreters; some making it a declaration of Christ’s readiness to come in to souls, and to give them a spiritual fellowship and communion with Himself; others interpreting it of Christ’s readiness to come to the Last Judgment, and to take his saints into an eternal joyful fellowship and communion with Himself: hence there is a different interpretation of every sentence in the text. I stand at the door; either, in my gospel dispensations, I stand at the door of sinners’ hearts; or, I am ready to come to judge the world. And knock, by the inward monitions and impressions of my Spirit, or my ministers more externally; or, I am about to knock, that is, I am ready to have the last trump sounded. If any man hear my voice, and open the door; that is, if any man will hearken to the counsels and exhortations of my ministers, and to the monitions of my Spirit, and not resist my Holy Spirit; or, if any man has heard my voice, and opened his heart to Me.”

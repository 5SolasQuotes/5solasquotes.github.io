<main class="wrap"><figure class="quote" id="q-5fd58c05e0" data-kw="">
<blockquote><p>After dinner [lunch] Eliza Jane and Alice did the dishes, but Father and Mother and Royal and Almanzo did nothing at all. The whole afternoon they sat in the drowsy warm dining-room. Mother read the Bible and Eliza Jane read a book, and Father’s head nodded till he woke with a jerk, and then it began to nod again. Royal fingered the wooden chain that he could not whittle, and Alice looked for a long time out of the window. But Almanzo just sat. He had to. He was not allowed to do anything else, for Sunday was not a day for working or playing. It was a day for going to church and for sitting still. Almanzo was glad when it was time to do the chores.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/laura-ingalls-wilder.html">Laura Ingalls Wilder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Farmer Boy in Little House on the Prairie (1933), ch. 8, ‘Sunday’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>…[by] the abrogation of these ceremonies [of preparing manna the day before and not kindling a fire in the wilderness on the Sabbath by the Israelites] ought not Christians to turn into surquedry [arrogance] and excess of feasting (as too many do) so abusing their christian liberty: but to be used with all sobriety, such as may not hinder, but help the holy spiritual duties of this day by a due refreshing of the body, for necessity, not for superfluity. … So that the whole worship and service of God, and his saving knowledge for man’s salvation (to speak nothing of bodily refreshing and works of charity for the relief of the poor) having a necessary dependance, as touching the external means, upon the due observation of the Fourth Commandment in the morality of it…</p></blockquote>

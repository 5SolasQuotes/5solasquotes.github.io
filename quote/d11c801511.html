<main class="wrap"><figure class="quote" id="q-d11c801511" data-kw="">
<blockquote><p>If thou wouldst be sure to go to heaven when thou diest, labour whilst thou livest to lead an unblameable, a godly and fruitful life; even to do all the good that God gives thee power and opportunity to do. As we have opportunity (saith the Apostle Gal. 6. 10. which none of us can tell how soon it may be taken from us) let us do good unto all men, especially unto them that are of the household of faith. See what comfort Hezechia found in this when he was to die. Remember now O Lord I beseech thee (saith he, Esa. 38. 3.) how I have walked before thee in truth and with a perfect heart, &amp; have done that which is good in thy sight.

Now (on his death-bed) his conscience gave this comfortable testimony unto him, that he had lead a holy life; and now doth he (even before the Lord) comfort himself in that against the fear of death. See also what a testimony the holy Apostle gives unto good works, even to the works of charity and mercy in this case. Charge them that are rich in this world (saith he, 1 Tim. 6. 17,—19.) that they do good, that they be rich in good works, ready to distribute, willing to communicate; laying up in store for themselves a good foundation against the time to come, that they may lay hold on eternal life.

Works of charity (not as a meritorious cause of salvation, but) as a sure evidence that by a lively faith we have interest and title to the merits of Christ, shall be rewarded with stable and durable riches in time to come, and will make a man able with confidence of hope to lay hold on eternal life. And that which the Apostle saith of certain bad men, 2 Cor. 11. 15. that their end shall be according to their works, may be said of all good men also, their end shall be according to their works. A good life will certainly end in a blessed and comfortable death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached in Ashby-Chappell, Oct. 4. 1629</cite>, (London: George Miller, 1633), pp 18-19.</span></figcaption>

<blockquote><p>‘Who hath anointed us, and sealed us.’ Anointing and sealing go together. The same God anoints us doth also seal us. Both are to secure us of our happy condition. Now Christ is the first sealed: John 6:27, ‘Him hath the father sealed.’ God hath set Christ apart from others, hath distinguished him, and set a stamp upon him to be the Messiah by the graces of the Spirit, whereof he was richly beautified, and by many miracles, whereby he shewed that he was the Son of God; by his resurrection from the dead, by his calling of the Gentiles, and many other things. Christ being sealed himself, he sealed all that he did for our redemption with his blood, and hath added for the strengthening of our faith outward seals, the sacraments, to secure his love more firmly to us. But in this place another manner of sealing is to be understood. For here is not meant the sealing of Christ, but the sealing of us that have communion with him. The same Spirit that seals the Redeemer seals the redeemed. Quest. What is the manner of our sealing by the Spirit? Ans. (1.) Sealing we know hath divers uses. First of all, it doth imprint a likeness of him that doth seal. When the king’s image is stamped upon the wax, everything in the wax answers to that in the seal, face to face, eye to eye, body to body. So we are said to be sealed when we carry in our souls the image of the Lord Jesus; for the Spirit sets the stamp of Christ upon every true convert. There is the likeness of Christ in all things to be found in him. As the child answers the father, foot for foot, finger for finger in proportion, but not in quantity, so it is in the sealing of a believer. There is a likeness in the soul that is sealed by the Spirit to the Lord Jesus. There is understanding of the same heavenly supernatural truths; there is a judging of things as Christ judgeth, a loving of that which he loves, and a hating of that which he hates; a rejoicing to do that which he delights in, and a grief to commit anything that displeaseth his majesty. Every affection of the soul is carried that way that the affections of our blessed Saviour are carried, in proportion; everything in the soul is answerable to him in its degree. There is no grace in Christ, but there is the like in every Christian in some measure. The obedience of Christ to his Father, even to the death, is to be found in every true Christian. The humility whereby Christ abased himself, it is in every renewed heart. Christ works in the soul that receives him a conformity to himself. The soul that believes that Christ hath loved him, and done such great things for him, is ambitious to express Christ in all his ways. Being once in Christ, we shall delight to be transformed more and more unto him. To bear the image of the ‘second Adam’ upon our breasts, to make it appear that Jesus Christ lives in us, and that we ‘live not to ourselves, but to him that died for us,’ 2 Cor. 5:15; to be meek and heavenly-minded as he was, talking and discoursing of spiritual things, going about doing good everywhere; active for God, fruitful in holiness, doing and receiving all the good we are able, drawing others from this world to meditate of a better estate, labouring for the advancement of God’s kingdom, and approving ourselves to him. This is one use of sealing, to imprint a likeness. (2.) A second use of the seal is distinction. Sealing is a stamp upon one thing among many. It distinguisheth Christians from others, as we shall see after. (3.) Again, it serves for appropriation. Men seal those things that are their own. Merchants, we see, set their stamp on those wares which they have or mean to have a right unto. It pleaseth God thus to condescend unto us, by applying himself to human contracts. He appropriates his own to shew that he hath chosen and singled them out for himself to delight in. (4.) Sealing further serves to make things authentical, to give authority and excellency. The seal of the prince is the authority of the prince. This gives validity to things, answerable to the dignity and esteem of him that seals. These are the four principal uses of sealing; and God by his Spirit doth all these to his. He stamps his own image upon us; he distinguisheth us from others, even from the great refuse of the world. God by his Spirit appropriates us to himself; he makes us to be his, and shews that we are his. He likewise authoriseth us, and puts an excellency upon us, to secure us against all temptations. When we have God’s seal on us, we stand firm in the greatest trial. ‘Who shall separate us from the love of God?’ Rom. 8:35. We dare defy all objections of Satan, and accusations of conscience whatsoever. A man that hath God’s seal stands impregnable in the most tempestuous season; for it is given for our assurance, and not for God’s. The Lord knows who are his. He seals not because he is ignorant, but for our comfort and establishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, ed. Alexander Balloch Grosart, vol. 4 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1863), 132–33.</span></figcaption>

of the prince is the authority of the prince. This gives validity to things, answerable to the dignity and esteem of him that seals. These are the four principal uses of sealing; and God by his Spirit doth all these to his. He stamps his own image upon us; he distinguisheth us from others, even from the great refuse of the world. God by his Spirit appropriates us to himself; he makes us to be his, and shews that we are his. He likewise authoriseth us, and puts an excellency upon us, to secure us against all temptations. When we have God’s seal on us, we stand firm in the greatest trial. ‘Who shall separate us from the love of God?’ Rom. 8:35. We dare defy all objections of Satan, and accusations of conscience whatsoever. A man that hath God’s seal stands impregnable in the most tempestuous season; for it is given for our assurance, and not for God’s. The Lord knows who are his. He seals not because he is ignorant, but for our comfort and establishment.”

— Richard Sibbes, The Complete Works of Richard Sibbes, ed. Alexander Balloch Grosart, vol. 4 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1863), 132–33.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Who+hath+anointed+us%2C+and+sealed+us.%E2%80%99+Anointing+and+sealing+go+together.+The+same+God+anoints+us+doth+also+seal+us.+Both+are+to+secure+us+of+our+happy+condition.+Now+Christ+is+the+first+sealed%3A+John+6%3A27%2C+%E2%80%98Him+hath+the+father+sealed.%E2%80%99+God+hath+set+Christ+apart+from+others%2C+hath+distinguished+him%2C+and+set+a+stamp+upon+him+to+be+the+Messiah+by+the+graces+of+the+Spirit%2C+whereof+he+was+richly+beautified%2C+and+by+many+miracles%2C+whereby+he+shewed+that+he+was+the+Son+of+God%3B+by+his+resurrection+from+the+dead%2C+by+his+calling+of+the+Gentiles%2C+and+many+other+things.+Christ+being+sealed+himself%2C+he+sealed+all+that+he+did+for+our+redemption+with+his+blood%2C+and+hath+added+for+the+strengthening+of+our+faith+outward+seals%2C+the+sacraments%2C+to+secure+his+love+more+firmly+to+us.+But+in+this+place+another+manner+of+sealing+is+to+be+understood.+For+here+is+not+meant+the+sealing+of+Christ%2C+but+the+sealing+of+us+that+have+communion+with+him.+The+same+Spirit+that+seals+the+Redeemer+seals+the+redeemed.+Quest.+What+is+the+manner+of+our+sealing+by+the+Spirit%3F+Ans.+%281.%29+Sealing+we+know+hath+divers+uses.+First+of+all%2C+it+doth+imprint+a+likeness+of+him+that+doth+seal.+When+the+king%E2%80%99s+image+is+stamped+upon+the+wax%2C+everything+in+the+wax+answers+to+that+in+the+seal%2C+face+to+face%2C+eye+to+eye%2C+body+to+body.+So+we+are+said+to+be+sealed+when+we+carry+in+our+souls+the+image+of+the+Lord+Jesus%3B+for+the+Spirit+sets+the+stamp+of+Christ+upon+every+true+convert.+There+is+the+likeness+of+Christ+in+all+things+to+be+found+in+him.+As+the+child+answers+the+father%2C+foot+for+foot%2C+finger+for+finger+in+proportion%2C+but+not+in+quantity%2C+so+it+is+in+the+sealing+of+a+believer.+There+is+a+likeness+in+the+soul+that+is+sealed+by+the+Spirit+to+the+Lord+Jesus.+There+is+understanding+of+the+same+heavenly+supernatural+truths%3B+there+is+a+judging+of+things+as+Christ+judgeth%2C+a+loving+of+that+which+he+loves%2C+and+a+hating+of+that+which+he+hates%3B+a+rejoicing+to+do+that+which+he+delights+in%2C+and+a+grief+to+commit+anything+that+displeaseth+his+majesty.+Every+affection+of+the+soul+is+carried+that+way+that+the+affections+of+our+blessed+Saviour+are+carried%2C+in+proportion%3B+everything+in+the+soul+is+answerable+to+him+in+its+degree.+There+is+no+grace+in+Christ%2C+but+there+is+the+like+in+every+Christian+in+some+measure.+The+obedience+of+Christ+to+his+Father%2C+even+to+the+death%2C+is+to+be+found+in+every+true+Christian.+The+humility+whereby+Christ+abased+himself%2C+it+is+in+every+renewed+heart.+Christ+works+in+the+soul+that+receives+him+a+conformity+to+himself.+The+soul+that+believes+that+Christ+hath+loved+him%2C+and+done+such+great+things+for+him%2C+is+ambitious+to+express+Christ+in+all+his+ways.+Being+once+in+Christ%2C+we+shall+delight+to+be+transformed+more+and+more+unto+him.+To+bear+the+image+of+the+%E2%80%98second+Adam%E2%80%99+upon+our+breasts%2C+to+make+it+appear+that+Jesus+Christ+lives+in+us%2C+and+that+we+%E2%80%98live+not+to+ourselves%2C+but+to+him+that+died+for+us%2C%E2%80%99+2+Cor.+5%3A15%3B+to+be+meek+and+heavenly-minded+as+he+was%2C+talking+and+discoursing+of+spiritual+things%2C+going+about+doing+good+everywhere%3B+active+for+God%2C+fruitful+in+holiness%2C+doing+and+receiving+all+the+good+we+are+able%2C+drawing+others+from+this+world+to+meditate+of+a+better+estate%2C+labouring+for+the+advancement+of+God%E2%80%99s+kingdom%2C+and+approving+ourselves+to+him.+This+is+one+use+of+sealing%2C+to+imprint+a+likeness.+%282.%29+A+second+use+of+the+seal+is+distinction.+Sealing+is+a+stamp+upon+one+thing+among+many.+It+distinguisheth+Christians+from+others%2C+as+we+shall+see+after.+%283.%29+Again%2C+it+serves+for+appropriation.+Men+seal+those+things+that+are+their+own.+Merchants%2C+we+see%2C+set+their+stamp+on+those+wares+which+they+have+or+mean+to+have+a+right+unto.+It+pleaseth+God+thus+to+condescend+unto+us%2C+by+applying+himself+to+human+contracts.+He+appropriates+his+own+to+shew+that+he+hath+chosen+and+singled+them+out+for+himself+to+delight+in.+%284.%29+Sealing+further+serves+to+make+things+authentical%2C+to+give+authority+and+excellency.+The+seal+of+the+prince+is+the+authority+of+the+prince.+This+gives+validity+to+things%2C+answerable+to+the+dignity+and+esteem+of+him+that+seals.+These+are+the+four+principal+uses+of+sealing%3B+and+God+by+his+Spirit+doth+all+these+to+his.+He+stamps+his+own+image+upon+us%3B+he+distinguisheth+us+from+others%2C+even+from+the+great+refuse+of+the+world.+God+by+his+Spirit+appropriates+us+to+himself%3B+he+makes+us+to+be+his%2C+and+shews+that+we+are+his.+He+likewise+authoriseth+us%2C+and+puts+an+excellency+upon+us%2C+to+secure+us+against+all+temptations.+When+we+have+God%E2%80%99s+seal+on+us%2C+we+stand+firm+in+the+greatest+trial.+%E2%80%98Who+shall+separate+us+from+the+love+of+God%3F%E2%80%99+Rom.+8%3A35.+We+dare+defy+all+objections+of+Satan%2C+and+accusations+of+conscience+whatsoever.+A+man+that+hath+God%E2%80%99s+seal+stands+impregnable+in+the+most+tempestuous+season%3B+for+it+is+given+for+our+assurance%2C+and+not+for+God%E2%80%99s.+The+Lord+knows+who+are+his.+He+seals+not+because+he+is+ignorant%2C+but+for+our+comfort+and+establishment.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+The+Complete+Works+of+Richard+Sibbes%2C+ed.+Alexander+Balloch+Grosart%2C+vol.+4+%28Edinburgh%3B+London%3B+Dublin%3A+James+Nichol%3B+James+Nisbet+and+Co.%3B+W.+Robertson%2C+1863%29%2C+132%E2%80%9333.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7ac9282b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b7ac9282b1.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/12/sibbes-on-the-sealing-of-the-spirit/" rel="n

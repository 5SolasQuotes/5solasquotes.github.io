<main class="wrap"><figure class="quote" id="q-411d5086bd" data-kw="">
<blockquote><p>And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begot the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved. 11. And thus there appeared another beside Himself. But when I say another, I do not mean that there are two Gods, but that it is only as light of light, or as water from a fountain, or as a ray from the sun. For there is but one power, which is from the All; and the Father is the All, from whom comes this Power, the Word. And this is the mind which came forth into the world, and was manifested as the Son of God. All things, then, are by Him, and He alone is of the Father. Who then adduces a multitude of gods brought in, time after time? For all are shut up, however unwillingly, to admit this fact, that the All runs up into one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus-of-rome.html">Hippolytus of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>c. 235) | Against Noetus</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab7a2fd88e" data-kw="">

</figure><figure class="quote" id="q-2c3189cb1c" data-kw="person subsistence Sabellians">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis XI</span></figcaption>

</figure><figure class="quote" id="q-54393b61ac" data-kw="unity works">
<blockquote><p>Indeed, there are three persons, who, though they share the same essence, differ in the manner of their existence. The Son is distinct from the Father, but not different in essence. The same applies to the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XIII</span></figcaption>

</figure><figure class="quote" id="q-ee137d1657" data-kw="">
<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews… vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’</cite>, pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span><span class="t"><a href="../topics/covenant-of-redemption/counsel-of-peace.html">Counsel of Peace</a></span></div>

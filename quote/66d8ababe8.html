<main class="wrap"><figure class="quote" id="q-66d8ababe8" data-kw="">
<blockquote><p>The worship of God is either natural or instituted. Natural worship is that which in specie, and immediately, is founded in the nature of God and the nature of man, and God’s relation to man, and man’s relation to God. And it is twofold, either that which is naturally necessary, or that which is naturally laudable. That which is naturally necessary, is indispensable and unchangeable. That which is naturally laudable must be used whensoever conveniently it may. There is natural worship due to God, both as the Creator of man and as the Redeemer of fallen man. As God is our Creator, He is our absolute Owner and Ruler, and Benefactor; and as such, He is to be acknowledged by us with all due observance. And whatsoever acts of observance towards God we are upon this ground immediately obliged unto, they are natural worship due to God as our Creator. All natural worship due to God as Creator is discernable by natural revelation, or the Book of Nature. In Nature entire it was clearly and completely thereby discernible; but in Nature fallen, more dimly and defectively; yet not for want of objective evidence, but for the indisposition of our faculty. Likewise to God our Redeemer, there is a worship due from us, naturally and immediately arising from our redemption, and our relation to God therein founded. And it is (our redemption being supposed) no more of God’s arbitrary institution than that worship which is founded in the Law of our Creation and primitive State. To the knowledge of this sort of natural worship, we come by means of that divine revelation by which we come to the knowledge of our redeemed state. But the knowledge of our redeemed state being supposed, natural reason will show that such and such acts of observance in specie are naturally and indispensably due to God our Redeemer.</p></blockquote>

<blockquote><p>The second point is that the outward worship does not please God of itself, but by means of the inward before described. Again, it is spiritual, not by itself, because it stands in bodily actions; but by reason of the inward worship, whence it proceeds and whereof it is a sign. Moreover, being severed from inward worship, it is worship in show, and not worship in truth. If they eye be evil, the whole body is dark. (Mt. 6:13) Christ bids the Pharisees to wash the inside of the cup and platter, and then all shall be clean (Mt. 23:25-26).</p></blockquote>

</figure><figure class="quote" id="q-d6fbf690f8" data-kw="">
<blockquote><p>Worship, generally, is the tender of our homage to God, and giving Him immediate honor. Accordingly, a part of worship, is whatsoever is presented to God, (whether thing or action) as a special homage, and as an immediate honor to Him. Or at least ought to be so, if it be not. …

1. As worship comprehends under the term both true worship and false worship, or right worship and will-worship; So the cause of it is our intention to present it as a special homage (as was said) and an immediate honor to God. Such intention, we say, is the formal cause, that such an action is worship in him that presents it, or such a thing, in him that tenders it. And without such intention, no action is formally worship in any man, however it be in the nature of the action, or in any other person that presents it. As for instance: The repeating of any sentence of Scripture, or the Lord’s prayer, intending thereby to honor God, is a part of worship: But to repeat it, to teach a child to spell or read, or to understand a language, or to use it as a charm or the like, is certainly no worship, because it wants an intention of immediate honoring God by it. So to kneel down before an image or crucifix with intention to honor God by that action is worship (though false and idolatrous), but to kneel down before it, not seeing it, nor thinking of it, or to pull out a thorn out of one’s foot or the like, is no worship: because, again, here wants an intention of honoring God by such an action.

2. But now, as worship denotes only true and right worship, so the proper efficient cause, and that which both legitimates and necessitates such intention, is the command of God. What He commands to be presented to Him, whether seeming substance or circumstance, has the nature of a special homage and immediate honor to Him, and ought to be presented (as often as it is presented) with such intention. From which command also flows an answerable acceptation of such a commanded thing or action, when accordingly performed with that intention: And with that intention there may and should also be an expectation of such acceptation, whereby the intention is proved in a man’s conscience, whether the matter be commanded or not. For will-worshippers expect an acceptation, though without warrant. And profane hypocrites, though they pretend to worship God, yet when they intend it not, they expect no acceptation. We say then, our expectation of acceptation declares whether we tender such a thing as a part of worship, or use it as a mere circumstance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/definitions-of-worship.html">Herbert Palmer &amp; Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbatum redivivum, or the Christian Sabbath Vindicated</cite>, (London: White, 1645), ch. 12</span></figcaption>

</figure><figure class="quote" id="q-2ef8a55396" data-kw="">
<blockquote><p>Your [John Owen’s] wrong exposition of all the texts of Scripture here cited by you is more than one mistake. Dt. 4:2 and 12:32; Prov. 30:6, forbid adding to God’s worship, which is broken by all that either say that that is in God’s Word which is not there (as you here do), or that devise any worship-ordinances coordinate, or of the same sort, with his own, as if they were imperfect. But there is not a word forbidding subordinate, secondary acts of worship, such as kneeling, putting off the hat, using written notes in preaching or forms of singing, praying, catechizing, laying the hand on the Book, or putting it under the thigh, or lifting it up in swearing, the formal words of vows, oaths, covenants, confessions, professions and many such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 34</span></figcaption>

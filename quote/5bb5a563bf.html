<main class="wrap"><figure class="quote" id="q-5bb5a563bf" data-kw="">
<blockquote><p>There is but one God essentially considered: and in this the Scripture is clear, and so in this Book [Revelation], chap. 1. and last; although there be a plurality of Persons mentioned, yet it is ever God spoken of as One, in the singular number; and thus He is still opposed as the One living God, to the plurality of Idols.

And indeed, there can be no plurality in this: for, if that One God have in Him all perfections, There can be no perfection beside Him; and so no God beside this One true God. And, if we supposed any perfection to be beside Him, then were not He God, because not infinite in perfection; and, if infinite, then that which is infinite, in that respect, cannot be multiplied. There is no question of this, seeing the most wise Heathens have been necessitated to acknowledge it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

And indeed, there can be no plurality in this: for, if that One God have in Him all perfections, There can be no perfection beside Him; and so no God beside this One true God. And, if we supposed any perfection to be beside Him, then were not He God, because not infinite in perfection; and, if infinite, then that which is infinite, in that respect, cannot be multiplied. There is no question of this, seeing the most wise Heathens have been necessitated to acknowledge it.”

nite-perfection-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72af1225e4" data-kw="">
<blockquote><p>3. He [the Arminian Conrad Vorstius] first says that ‘Scripture does not call God infinite.’ This is false. For Scripture thus says in Psalm 144:3: “Great is the Lord, exceedingly praiseworthy, whose magnitude has no end.” And Baruch 3:25: “It is great and has no bounds, immeasurable and highly-exalted.” These witnesses are not able to be interpreted as about magnitude of mass or quantity, which is not in God. But [it must be interpreted] as respecting his magnitude of perfection or virtue. Therefore, this is the sense: God is so great in virtue and perfection that he does not have an end or terminus of his virtue and perfection. From this, I reason thus: just as the end in virtue and perfection is that which has an end or terminus of its virtue and perfection, so on the opposite side, an infinite in virtue and perfection is that which does not have an end or terminus of its virtue and perfection. But God does not have an end or terminus of his virtue and perfection. Therefore, he is infinite in virtue and perfection. What shall Vorstius say at this point? The major premise is per se known by implication. The minor premise is openly expressed in Scripture. The conclusion is legitimately inferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae Scolasticae</cite>, (d. 1624; Leiden, 1683), First Tract on God &amp; the Divine Attributes, ch. 5, ‘Infinity of God’, pt. 1 tr. Michael Lynch Becanus is a Romanist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>32. In the next place page 138, he [Brown’s opponent] cites with Bellarmine, Rom. 8:30, and says that [in the verse] either sanctification must be excluded, or ‘justification’ must be taken in its proper sense [as including sanctification]. Answer: (1) There is no necessity for either: for sanctification is comprehended [in the verse] under ‘vocation,’ which is saving and effectual; otherwise the links of this chain could be broken; for a common and ineffectual call is not attended with justification and glorification: and effectual vocation is by infusion of grace, and the Spirit of holiness and a real change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism: the Pathway to Paganism, or a View of the Quakers’ Religion, being an Examination of the Theses &amp; Apology of Robert Barclay, one of their Number</cite>, ... (Edinburgh: Cairns, 1678), ch. 13, Of Justification, pp. 316-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-0b09759d86" data-kw="">

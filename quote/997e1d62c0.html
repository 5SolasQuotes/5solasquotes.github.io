<main class="wrap"><figure class="quote" id="q-997e1d62c0" data-kw="">
<blockquote><p>Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Private Communion’ in The Second &amp; Last Part of the Answer to the Reasons for Refusal of Subscription, pp. 65-78 in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 66</span></figcaption>

<blockquote><p>10. On the 6th Article of the 11th Chapter [of The Discipline of the Reformed Chuches of France, 1559], a question was propounded by the Province of Higher Languedoc, Whether in case of grievous sickness, and the child being in apparent danger of death, he might be baptized on lecture-days, before sermon began, and whether baptism might be administred at such times when as there is no sermon preached, but only public common-prayers? It was answered that if the consistory, or any of the elders did attest the malady of the infant, the pastor might do it [the baptism]. And if the observation of this article should beget new difficulties, the provinces were intreated to come prepared unto the next national synod, for their assoiling of them.</p></blockquote>

</figure><figure class="quote" id="q-b72f941944" data-kw="">
<blockquote><p>Lastly, the names given to this sacrament, noting the nature thereof, do afford us a good consideration to strike through the heart of this private mass, being called sometimes the Supper of the Lord, and sometimes a Communion among ourselves. If it be an holy supper and spiritual banquet, why are none bidden and called thereunto? If it be a communion, why does the priest uncharitably swallow all alone? whereby they make it a communion, but without company: a supper, but without guests: meat, but without eating: drink, but without drinking: a table, but without sitting down: a participation, but without any that are partakers: a banquet, but without seeding thereat, the people departing as hungry and thirsty as they came. Wherefore, as no man celebrated the Passover aright, or received profit thereby, but such as did eat the flesh thereof: so can none come to the supper of the Lord as he ought, though he look upon others, except he eat of the bread and drink of the cup, according to the commandment of Christ, the author thereof. And thus much of the sole communions and private masses brought into the church against the example of Christ against the use of the apostles, and against the name and nature of the sacrament itself.</p></blockquote>

<blockquote><p>In what place is (the H. Supper) to be administered? In public assembly, not to individuals privately or to those ill in bed at home or about to die without the congregation of the faithful and their participation. Communication should be ecclesiastical and public, not an idion deipnon [a private supper]. And the Supper is a symbol of the communion of saints…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-d1233e8e1e" data-kw="">
<blockquote><p>Furthermore, did Christ deliver his Last Supper to all his disciples that were present? Did none stand by, and gaze on while other received? Then hereby fall to the ground the private communions of the popish Church, where all is devoured by the priest, nothing delivered to the people. For whereas the ordinance of Christ and ancient order of the church was for the minister and people to receive the sacrament together: among them the priest accompanied with his boy to make answer, receives the sacrament himself alone, without distribution made to others, yea although the whole congregation be present and look upon him, whereby God is dishonored, the communion is abolished, the people of God are there by deprived and robbed of all comfort. How is this a feast which the priest prepares for himself, not for others: receives by himself, not with his brethren: he speaks to himself, and not to the assembly: he uses a strange tongue, and no man knows what he means: the people is taught nothing, they understand nothing, they hear nothing, they receive nothing; and a few childish, apish, foolish, and unseemly gestures excepted, they see nothing: they taste nothing, they partake nothing, neither comfort of heart, nor memory of Christ, nor benefit of his passion. But Christ in his Last Supper, did not eat up all alone, but after the disciples had supped as Mathew sets it down, He took bread and blessed He brake and gave it to them, saying, ‘Take ye, eat ye:’ neither did He drink alone of the fruit of the vine, but taking the cup He gave thanks, and gave to them all, saying, ‘Drink ye all of this.’ So then, albeit a certain number of communicants are not limited and determined: yet Christ in these words appoints a company to be present, as appears by the number, ‘take ye, eat ye,’ ‘drink ye all,’ ‘divide ye it among yourselves,’ ‘do ye this in my remembrance,’ ‘ye set forth the Lord’s death,’ ‘when ye come together to eat,’ ‘tarry ye one for another,’ ‘as often as ye shall eat this bread.’ These words cannot be understood of one particular man, but necessarily import a greater number of men: nay, the Philosopher teaches that the word ‘all’ must be verified at the least of the number of three, which is the least and lowest number that would be admitted to this supper. Neither do we read that so soon as one was gained to the faith, that the apostles administered this sacrament to him, much less would they minister to themselves alone, when none were converted in a nation or city.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), bk. 3, ‘Of the Lord’s Supper’, pp. 276-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“Furthermore, did Christ deliver his Last Supper to all his disciples that were present? Did none stand by, and gaze on while other received? Then hereby fall to the ground the private communions of the popish Church, where all is devoured by the priest, nothing delivered to the people. For whereas the ordinance of Christ and ancient order of the church was for the minister and people to receive the sacrament together: among them the priest accompanied with his boy to make answer, receives the sacrament himself alone, without distribution made to others, yea although the whole congregation be present and look upon him, whereby God is dishonored, the communion is abolished, the people of God are there by deprived and robbed of all comfort. How is this a feast which the priest prepares for himself, not for others: receives by himself, not with his brethren: he speaks to himself, and not to the assembly: he uses a strange tongue, and no man knows what he means: the people is taught nothing, they understand nothing, they hear nothing, they receive nothing; and a few childish, apish, foolish, and unseemly gestures excepted, they see nothing: they taste nothing, they partake nothing, neither comfort of heart, nor memory of Christ, nor benefit of his passion. But Christ in his Last Supper, did not eat up all alone, but after the disciples had supped as Mathew sets it down, He took bread and blessed He brake and gave it to them, saying, ‘Take ye, eat ye:’ neither did He drink alone of the fruit of the vine, but taking the cup He gave thanks, and gave to them all, saying, ‘Drink ye all of this.’ So then, albeit a certain number of communicants are not limited and determined: yet Christ in these words appoints a company to be present, as appears by the number, ‘take ye, eat ye,’ ‘drink ye all,’ ‘divide ye it among yourselves,’ ‘do ye this in my remembrance,’ ‘ye set forth the Lord’s death,’ ‘when ye come together to eat,’ ‘tarry ye one for another,’ ‘as often as ye shall eat this bread.’ These words cannot be understood of one particular man, but necessarily import a greater number of men: nay, the Philosopher teaches that the word ‘all’ must be verified at the least of the number of three, which is the least and lowest number that would be admitted to this supper. Neither do we read that so soon as one was gained to the faith, that the apostles administered this sacrament to him, much less would they minister to themselves alone, when none were converted in a nation or city.”

ts+are+not+limited+and+determined%3A+yet+Christ+in+these+words+appoints+a+company+to+be+present%2C+as+appears+by+the+number%2C+%E2%80%98take+ye%2C+eat+ye%2C%E2%80%99+%E2%80%98drink+ye+all%2C%E2%80%99+%E2%80%98divide+ye+it+among+yourselves%2C%E2%80%99+%E2%80%98do+ye+this+in+my+remembrance%2C%E2%80%99+%E2%80%98ye+set+forth+the+Lord%E2%80%99s+death%2C%E2%80%99+%E2%80%98when+ye+come+together+to+eat%2C%E2%80%99+%E2%80%98tarry+ye+one+for+another%2C%E2%80%99+%E2%80%98as+often+as+ye+shall+eat+this+bread.%E2%80%99+These+words+cannot+be+understood+of+one+particular+man%2C+but+necessarily+import+a+greater+number+of+men%3A+nay%2C+the+Philosopher+teaches+that+the+word+%E2%80%98all%E2%80%99+must+be+verified+at+the+least+of+the+number+of+three%2C+which+is+the+least+and+lowest+number+that+would+be+admitted+to+this+supper.+Neither+do+we+read+that+so+soon+as+one+was+gained+to+the+faith%2C+that+the+apostles+administered+this+sacrament+to+him%2C+much+less+would+they+minister+to+themselves+alone%2C+when+none+were+converted+in+a+nation+or+city.%E2%80%9D%0A%0A%E2%80%94+William+Attersoll%2C+The+Badges+of+Christianity%2C+or+a+Treatise+of+the+Sacraments%E2%80%A6+%28London%2C+1606%29%2C+bk.+3%2C+%E2%80%98Of+the+Lord%E2%80%99s+Supper%E2%80%99%2C+pp.+276-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd1233e8e1e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d1233e8e1e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Furthermore%2C%20did%20Christ%20deliver%20his%20Last,converted%20in%20a%20nation%20or%20city&amp;text=Furthermore%2C%20did%20Christ%20deliver%20his%20Last%20Supper%20to&amp;text=none%20were%20converted%20in%20a%20nation%20or%20city" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

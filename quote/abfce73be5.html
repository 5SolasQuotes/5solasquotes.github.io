<main class="wrap"><figure class="quote" id="q-abfce73be5" data-kw="">
<blockquote><p>True it is, that without faith and repentance, there is no salvation; and a man dying impenitent, is damned. But, we must know that as faith and repentance are conditions, which God has ordained, and so requires on our part, though Himself give them, and work them in us; so they are a part of those means which God has appointed to attain the end of our salvation. And the meanes are such, so fixed and established of God, as they shall always attend upon his purpose and pleasure in our election to grace and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea to an Appeal traversed Dialogue-wise (London: W. Jones, 1626)</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47764201aa" data-kw="">
<blockquote><p>II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy Names of Antinomians &amp; Neonomians (1696; Glasgow, 1807), ch. 11, ‘Whether repentance precedes the remission of sins? [Yes]’</cite>, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-3eaa37cff6" data-kw="">
<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’</cite>, pp. 121</span></figcaption>

</figure><figure class="quote" id="q-fbb0deff39" data-kw="">
<blockquote><p>I. Repentance unto life is an evangelical gracea… a. Zec 12:10; Acts 11:18 II. By it a sinner… upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins as to turn from them all unto God,a purposing and endeavoring to walk with him in all the ways of his commandments.b a. Ps 51:4; 119:128; Isa 30:22; Jer 31:18-19; Ezek 18:30-31; 36:31; Joel 2:12-13; Amos 5:15; 2 Cor 7:11 b. 2 Kings 23:25; Psa 119:6, 59, 106; Luke 1:6 III. Although repentance be not to be rested in as any satisfaction for sin, or any cause of the pardon thereof,a which is the act of God’s free grace in Christ;b yet is it of such necessity to all sinners that none may expect pardon without it.c a. Eze 16:61-63; 36:31-32 b. Hos 14:2, 4; Rom 3:24; Eph 1:7 c. Luke 13:3, 5; Acts 17:30-31“ . . Articles 1600’s Davenant, John – section 5 in ch. 31, ‘Of the Necessity of Works to Salvation, or Justification’ in A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), pp. 299-300 Note that what Davenant says here is substantially the same as what Owen says below, with a bit of difference of some terminology. Davenant would have done better to, instead of using the term “good works” in this context, to use “a certain inherent righteousness,” similar to Goodwin below. Davenant here denies that works are efficient or meritorious causes of justification. Yet he affirms that certain inward works, or a certain inherent righteousness, is necessary as concurrent or preliminary conditions to justification, which accompany it, by way of order, not of causality; and these things “He Himself effects in us.</p></blockquote>

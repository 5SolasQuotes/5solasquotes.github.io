<blockquote><p>Behold what can be desired more to make commutations of parties in public contracts authentic in courts of justice than consent of all parties, the allowance of the judge and public record? And if this self-same commutation of pennance must be allowed of by those who are for justification by way of satisfaction only,¹ why should it seem incongruous in this other branch of justification, sc. by imputed righteousness? Surely, God would have the active as well as the passive obedience, as near the same, required by the Law, as might be, that He might dispense with as little of the Law as was possible. ¹ Bellarmine, Of Justification, bk. 2, ch. 7, sect. 4; Stapleton, etc. Their own argument will serve to prove the necessity of imputation of Christ’s active obedience to the Law for justification, because, ‘Nothing,’ say they, ‘can satisfy for sin (which is an infinite wrong to God) but that only which is infinite in value.’ By the same reason nothing can give us right and title to eternal life (which is an infinite reward) but that which is of infinite worth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mount Pisgah, or a Prospect of Heaven, being an Exposition on the Fourth Chapter of the First Epistle of St. Paul to the Thessalonians... (London: Milbourn, 1670), pt. 2, 2nd Use</cite>, p. 152 with margin note</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c4489d22d" data-kw="">
<blockquote><p>For remission of sins does not only deliver from pain, to wit, eternal death; but also brings glory or eternal life. The reason of which thing is this, that remission of sins, wherein man’s justification consists, is remission of all sins: and therefore not only of sins of committing, but also of sins of omitting: whereby it comes that he to whom God forgives sins, is so accounted of, as if he had not only committed nothing which God has forbidden in his law: but also, omitted nothing of that which he has commanded: and therefore, as if he had perfectly fulfilled the law of God. Now where the perfect fulfilling of the law is, there also is life, according to that, ‘The man that doeth these things shall live in them.’ Moreover, the example of civil judgment which Bellarmine brings, proves not his assumption: because that absolution is unlike to the absolution of God. For this is universal, to wit from all sins against the law of God: but that is particular or special; to wit, from some certain crime or crimes, against the politic laws. Notwithstanding, the civil judge gives unto him whom he has quitted from certain crimes those rewards which he has promised to the innocent, namely, preservation in life and defence; although he give him no new and singular rewards which he has promised only to certain virtuous exploits. And so God gives eternal life as a reward to those unto whom He has promised it, to wit, unto those that keep his law: such as He accounts all those whose sins He has forgiven.</p></blockquote>

<blockquote><p>[Margin Note:] It’s false that Christ so died for us, that is, in our stead, as that in our stead He fulfilled the Law and performed all active obedience and passive by doing and dying that God can require of us. 2. Christ may be said to die for us, as if we had substituted Him in our place, in so rigid a sense as if He had been made our surety to fulfill both the preceptive and active, and also the satisfying and suffering part of the Law in our room. This may please Antinomians, but a doubt it is, if it stand with the truth: For then whatever we, yea all mortal men be (for Christ died for them all, as many teach) most wicked, yet Christ’s active and surety, and cautionary righteousness should be ours; and though we should never believe, yet Christ who fulfilled the Law, and preceptive as well as the threatening part, must have believed for all that He died for, and what need we then in our persons either [to] believe or repent? It’s true, we need not perform any active obedience, as a part of active fulfilling of that Covenant of Works, which either must have all or no obedience. If it be said that alio titulo, ‘upon another account’ of thankfulness to our ransom-payer we owe active obedience: Yet all [persons] that Christ died for, both actively and passively, must be perfectly righteous and justified, [He] having paid the most perfect active and passive obedience that the Law required, though we never believe, and Christ must have paid the active part of justifying faith for us. And why, but we should be formally justified in Him without faith also? As also, God, not we, laid our sins upon Christ, Isa. 53:6; 2 Cor. 5:21, and therefore we did commissionate and substitute Christ to die in our room.</p></blockquote>

<blockquote><p>Q. 23. Is it correct to say that the righteousness of the Mediator is imputed to us in justification and infused in sanctification? …it is not the same righteousness of Christ that occurs in its two parts. When I speak of an imputed righteousness of the Mediator, then I mean that righteousness that He obtained by means of his suffering and dying and obedience in the state of humiliation–not, however, the righteousness of life of the human nature of Christ, that is, that Christ in his human nature now possesses. The latter is not imputed to me. And, conversely, the former cannot be infused into me; it can only be reckoned to me. Really, one cannot even say that the righteousness in which Christ now lives is infused into me. This always rests on a more or less unclear mystical conception. It is not the personal righteousness of Christ that is infused into the believer, for, as an inherent quality, righteousness cannot be detached from the person. Q. 24 Is then no ‘holiness’ of Christ imputed to us? Yes; by that term, if one wishes, one can designate his active obedience, imputed to us in justification. As our [Heidelberg] Catechism states in the answer to question 60, ‘How are you righteous before God?… God grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ,’ etc. In this sense, one may thus then say that Christ is not only our sanctification but also our holiness before God.</p></blockquote>

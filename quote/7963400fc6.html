<main class="wrap"><figure class="quote" id="q-7963400fc6" data-kw="">
<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John</cite>, (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4, pp. 224-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-28d430f201" data-kw="">
<blockquote><p>Use 1. In that God did choose to make the world in this space of time, who could as easily have made it, as well in one moment, as in six days; this should teach us to take time for meditation on his works. He that could in one instant, at one word have brought forth heaven full of stars, the air full of fowls, the water full of fishes, the earth full of beasts, creeping things, trees, etc. was pleased to make several days works of this wonderful creation, and to proceed distinctly and orderly in his work: teaching us by the manner of his working only by his Word without instruments, that he could have done all at once, which now He did at several times… …few of us could say that of all the time we have spent, ever sith-hence we had the use of our understandings, in a serious meditation on God’s works, to this end that we might glorify the Maker, would not make up one week, not one six days, not so long as the Lord was in bringing them forth. Is not this a shame for man, who was made of purpose to glorify God in his works, that he should not in all his life spend so much time in meditating on the works of God, notwithstanding his dulness and sloth of apprehension, as the Lord was pleased to take in making of them, notwithstanding his omnipotency, which could have made them all in less than one minute, as easily as in a thousand years!… And what if I should say, it were expedient herein to follow the same order in considering of the Lord’s works, as the Lord Himself did in their creation; that is, to bind ourselves to do the work of the Day in its day, namely on the same day wherein each work was done, to meditate on the work of that Day?… …the Lord has been pleased, not only to let us know how many days He spent in the creation of all the whole, but also particularly and distinctly to acquaint us with his several days’ works; telling us what He did the first Day, what he did the second Day, etc. I dare boldly say, it is expedient even to tie ourselves to set apart some time in those several days for a more special view of those several works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maynard.html">John Maynard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty &amp; Order of the Creation Together with Natural &amp; Allegorical Meditations on the Six Days Works of the Creation</cite>, … (d. 1665; London: T.M., 1668), ch. 2, pp. 36-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-570a6de3b9" data-kw="">
<blockquote><p>An act of the cognitive faculty is according as the thing known is in the knower; while an act of the appetite faculty is directed to things as they exist in themselves. But all that can have the nature of being and truth virtually exists in God, though it does not all exist in created things. Therefore God knows all truth; but does not will all good, except in so far as He wills Himself, in Whom all good virtually exists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 19 | art. 6, reply to obj. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>

</figure><figure class="quote" id="q-3fa18d27c5" data-kw="">
<blockquote><p>The first [way] argues that the existence, even for an instant, of composites of act and potency presupposes the simultaneous existence of that which is pure act; the second argues that the existence, even for an instant, of composites of essence and existence presupposes the simultaneous existence of that which is being or existence itself; the third argues that the existence, even for an instant, of composites of form and matter presupposes the simultaneous existence of an absolutely necessary being; the fourth argues that the existence, even for an instant, of things which are many and come in degrees of perfection presupposes the simultaneous existence of something one and absolutely perfect; and the fifth argues that the existence, even for an instant, of finality or directedness toward an end presupposes the simultaneous existence of a supreme ordering intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 5, ‘Existential Inertia &amp; the Five Ways’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

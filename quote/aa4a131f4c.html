<main class="wrap"><figure class="quote" id="q-aa4a131f4c" data-kw="">
<blockquote><p>How is the religion and morality of a city or district to be maintained? Only by the godly teaching and example of godly teaching and ruling ecclesiastical officers. How is the religion and morality of a nation to be promoted and sustained? Only by the godly example and godly laws of godly civil rulers. What a terrible farce it is, as regards national morality, when the voice of the gospel minister is actually drowned by the fearful hell-filling screech of the whistle and the luggage train; and when, as soon as the congregation is dismissed – just after the minister has prayed, “Thy kingdom come. Thy will be done in earth, as it is in heaven” – their attention is attracted by the Sabbath-breaking pleasure-seekers who glide along on the tramway car. There may be exceptions, and there have been exceptions, as in the case of Scotland; yet, I think it will hold true, as a rule, that we may not look for the general Christianizing of the people but through the medium of a government themselves Christian.

This truth is taught two ways in the Bible; first, historically, by what we read of the influence which the personal character of the Jewish monarchs had on the moral and religious state of their subjects; and it is taught prophetically in the Book of Revelation, where we are taught that the kingdoms of this world shall become the kingdoms of our Lord Jesus Christ, chiefly through the conversion of Kings and Rulers – for it cannot be disputed that the Greek word Basileiai, denotes the “governing powers.” Suppose there were a John Knox in every pulpit of the land, what great good could be done nationally, so long as rulers resisted and thwarted all their teaching, by their unholy lives and their wicked legislation?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), pp 21-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>9th Assertion…. 1. As the object of that high [civil] office is merely and purely civil and positive, relating only to a civil end, of peace: as in importing or exporting of goods, of wool, wax, moneys for the good of the commonwealth, the crying up or crying down of the value of coined gold or silver, the making of laws merely civil; as not to carry armor in the night [which is threatening] in such a city: so in war, commanders, captains and colonels are magistrates to order the battle, lay stratagems… the parliaments’ power in disposing of fowling, fishing, hunting, eating of flesh, or not eating at such a time: all these, as the Word of God does not particularly warrant the one side more than the other, are merely civil and positive. It is sure the magistrate has a supremacy, and an independency above the Church or ministers of the Gospel in all these; and as these prescind [are detached] from all morality of the First and Second Table [in that they are not inherently moral or immoral of themselves]… In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the [civil] rulers have a supremacy.</p></blockquote>

<blockquote><p>[G]amblers not only work their undoing, they also drag to ruin multitudes of others over whom they have influence, or with whom they are connected. How many families have been thus destroyed! How many parents and wives have, by their children and husbands becoming gamblers had all their fond hopes blighted, and been brought with shame and sorrow to the grave! How many children, that might have been respectable, and lived in comfort in the world, have inherited from their parents, ruined by gambling, a name of infamy, and an inheritance of poverty and wretchedness!

Gamblers that have tempted and ruined others, or that have inflicted such injuries upon those tender relations, that naturally looked to them for protection, support, and comfort, should be regarded as less men than demons in human shape; and only the retributions of the judgment-seat, and of a lost eternity, can adequately declare the magnitude of their crimes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 382.</span></figcaption>

line · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f18afe3f69" data-kw="">
<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh, 1655), pp. 17-18</span></figcaption>

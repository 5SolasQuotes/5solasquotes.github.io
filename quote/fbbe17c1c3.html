<main class="wrap"><figure class="quote" id="q-fbbe17c1c3" data-kw="">
<blockquote><p>As was already said in the preceding, the distinction between the law and the gospel is not the same as that between the Old and the New Testament. Neither is it the same as that which present day Dispensationalists make between the dispensation of the law and the dispensation of the gospel. It is contrary to the plain facts of Scripture to say that there is no gospel in the Old Testament, or at least not in that part of the Old Testament that covers the dispensation of the law. There is gospel in the maternal promise, gospel in the ceremonial law, and gospel in many of the Prophets, as Isa. 53 and 54; 55:1–3, 6, 7; Jer. 31:33, 34; Ezek. 36:25–28. In fact, there is a gospel current running through the whole of the Old Testament, which reaches its highest point in the Messianic prophecies. And it is equally contrary to Scripture to say that there is no law in the New Testament, or that the law does not apply in the New Testament dispensation. Jesus taught the permanent validity of the law, Matt. 5:17–19. Paul says that God provided for it that the requirements of the law should be fulfilled in our lives, Rom. 8:4, and holds his readers responsible for keeping the law, Rom. 13:9. James assures his readers that he who transgresses a single commandment of the law (and he mentions some of these), is a transgressor of the law, Jas. 2:8–11. And John defines sin as “lawlessness,” and says that this is the love of God, that we keep His commandments, 1 John 3:4; 5:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Wm. B. Eerdmans publishing co., 1938), 613.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b56352fe0b" data-kw="">
<blockquote><p>Argument 7. That opinion is not to be held which lays ground that Christ-Mediator is a temporary king, has under Him magistrates, even heathenish, who have nothing to do with a mediator, to bear a temporal sword for a supernatural and spiritual end, as Christ under-heirs, He himself being the first-heir of all such and so makes heathens within the verge of the Mediatorial Kingdom; as if Christ were as Mediator, a King to heathen and all and everyone of mankind, who must have magistrates, and so [it] makes the Kingdom of men as men, and the Kingdom of Grace commensurable, and of alike latitude and extension, and makes nature and grace of equal comprehension: But such is the former opinion; the proposition cannot be denied, except by Arminians, Socinians, Papists, who do maintain an universal redemption, a grace universal, a catholic Kingdom of Grace comprehensive of all and every man, of Pharaoh, Evil Merodach, Belshazzar, all the kings of Romans, Persians, Assyrians, Chaldeans, and of Turk[s], India, and such as worship the sun and moon, the Devil, and the work of men’s hands…</p></blockquote>

<blockquote><p>9. Heaven and Hell and the Last Judgement are nowhere, but within a man, in a spiritual manner; Heaven is in this life. Antinomians, as Town and Saltmarsh hold that in this life we have as much of Heaven in full and complete possession as the glorified in Heaven. … 11. Under David George is the time of perfection, when all ordinances shall be useless, so Antinomians, ut supra. … 14. The Resurrection of the Dead, the blowing of the last trumpet, the shout of the archangel, the coming of Christ to judge all are to be taken in a spiritual sense of the doctrine and discipline of David George, as Hymenaeus and Phyletus said; see hereafter the parallel between Antinomians and Libertines; so said Libertines (Calvin Against the Libertines, ch. 22, p. 458). … 18. The body or flesh sinneth, but not the soul.</p></blockquote>

<blockquote><p>I. Whether regeneration of the intellect through illumination, both in the first and in the second act, whose terminus or formal effect is knowledge and assent to truth, theological wisdom, ecclesiastical prudence, etc., differs in species and form from that more common aid of illumination which also befalls certain reprobate, or the elect before actual conversion? Response: Affirmatively, from 1 Jn. 5:19–20; Phil. 1:9–10; Col. 1:9; Eph. 1:17–18; Jm. 3:13, 15, 17, where distinctly ἡ ἄνωθεν σοφία [hē anōthen sophia, the wisdom from above]; and Lk. 1:17, φρόνησις δικαίων [phronēsis dikaiōn, the prudence of the righteous]. Concerning which [see] in the Disputation on Simplicity and Hypocrisy. By equal reasoning we think a distinction should be made here, as concerning faith of miracles and other charisms in the regenerate, which are materially common, formally peculiar and proper in the regenerate and truly faithful, Mk. 16:16–17; Jn. 7:28[?]; Acts 19:4–6. Compare the Disputations on Miracles and on Charisms. But whether the habit of theological wisdom or ecclesiastical prudence in the unregenerate ought properly and specifically to be called infused, or indeed acquired, could be inquired. We incline to the latter affirmative, so that we regard such habits in the same estimation as their philosophical, medical, historical, poetic habits, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-de4c0b5201" data-kw="">
<blockquote><p>My assurances are not the Marvels of Merlin, nor yet the dark sentences of profane prophesies, but: 1. the plain truth of God’s Word; 2. the invincible justice of the everlasting God, and 3. the ordinary course of his punishments and plagues from the beginning are my assurance and grounds. God’s Word threatens destruction to all unobedient; his immutable justice must require the same. The ordinary punishments and plagues show examples.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b4bd1e65b6" data-kw="">
<blockquote><p>So what ensures then that his judgment is true, other than the fact that he is truly the Son? That, after all, is what he said, And if I do pass judgment, my judgment is true, because I am not alone, but it is I and the Father who sent me, as if to say, “My judgment is true, because I am the Son of God.”

How do you prove that you are the Son of God?

Because I am not alone, but it is I and the Father who sent me.

Blush for shame, Sabellian; you hear “Son,” you hear “Father.” The Son is Son, the Father is Father. He did not say, “I am the Father, and I am the same as the Son,” but I am not alone is what he said.

Why are you not alone?

“Because the Father is with me”

It is I and the Father who sent me is what you hear; “it is I and the one who sent me.” Do not jettison a person, distinguish persons. Distinguish intelligently; do not separate them perfidiously, lest, after steering clear of Charybdis, you crash on Scylla. The whirlpool of Sabellian impiety, you see, was about to suck you into saying the Father is the same as the Son; just now you have learned that I am not alone, but it is I and the Father who sent me. You acknowledge that the Father is Father and the Son is Son. You do well to acknowledge this; but do not go on to say, “The Father is greater, the Son is less.” Do not say, “The Father is gold, the Son is silver.” There is one substance, one godhead, one coeternity, perfect equality, not the least unlikeness. I mean, if you only believe that Christ is another, and that he is not the Father, yet you still think that he differs in nature, you have indeed avoided Charybdis but have wrecked yourself on Scylla’s rocks.

Navigate down the middle, avoid each dangerous shore. The Father is Father, the Son is Son. You are now saying, “The Father is Father, the Son is Son”; you have truly avoided the danger of being sucked into the whirlpool. Why do you want to go to the other side, and say, “The Father is one thing, the Son another”? One person, another person, yes, that is right; one thing and another thing, that is wrong. The Son, after all, is another person, because he is not who the Father is; and the Father is another person, because he is not who the Son is; not, however, another thing, but both Father and Son are the very same. What does that mean, the very same? It is one God.

You have heard, I am not alone, but it is I and the Father who sent me; now hear what you must believe about Father and Son; listen to the Son: I and the Father are one (Jn 10:30). He did not say, “I am the Father,” or, “I and the Father are one person;” but when he said, I and the Father are one, you must hear and listen to both one and we are, and you will deliver yourself from both Scylla and Charybdis. Of these two words that he used, one delivers you from Arius; we are delivers you from Sabellius. If one, then not different things; if we are, then both Father and Son. After all, he would not say we are of one person; but neither would he say one of different things.

So then, he says in a word, My judgment is true, so that you may hear, “I am God’s Son.” “But I am persuading you,” he goes on, “that I am God’s Son in such a way that you should understand that the Father is with me; I am not his Son in such a way that I have left him behind; I am not here in such a way that I am not also with him; he is not there in such a way that he is not also with me. I have taken on the form of a slave, but I have not lost the form of God (Phil 2:7).” So then, I am not alone, he says, but it is I and the Father who sent me.</p></blockquote>

<blockquote><p>The point of the Trinity it is a speculative point, and it tends to practice. First, to be a foundation of our worship, that we worship one God in three persons. And then it tends to shew the unity among Christians, that God will work among Christians at length, that they shall be all one in some sort, as the Father, Son, and Holy Ghost are one: which, though it be a point of high and deep speculation, yet it tends to practice.</p></blockquote>

<blockquote><p>The Son, indeed, is incarnate because He wills voluntarily to be made our sponsor, voluntarily subjecting Himself to the Father not according to nature, but according to the voluntary arrangement (oeconomia) or dispensation: a natural subjection is, surely, distinct from an economic or dispensatory subjection: He is made freely obedient to the Father, not according to the divine nature itself (in se), but according to will: obedience, indeed, is not the natural act of a nature (actus naturalis naturae), but of the will or free accord of the Person of Christ (voluntarius personae Christi).</p></blockquote>

<blockquote><p>What we believe, reduces it self to two Heads: First, That the Persons of the Trinity are really distinct from one another: the Father is not the Son, and the Holy Spirit is neither the Father nor the Son. The other, That neither of these Persons is really distinguished from the Divine Essence which they possess:

That the Father is God, the Son God, and the Holy Ghost God; and what is more, That the Father, Son and Holy Ghost are but one God, possessing only one Divinity; so that the Divinity of the Father is the same with that of the Son; and that of the Father and the Son is not different from that of the Holy Ghost. …</p></blockquote>

That the Father is God, the Son God, and the Holy Ghost God; and what is more, That the Father, Son and Holy Ghost are but one God, possessing only one Divinity; so that the Divinity of the Father is the same with that of the Son; and that of the Father and the Son is not different from that of the Holy Ghost. …”

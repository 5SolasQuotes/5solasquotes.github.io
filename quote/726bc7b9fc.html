<blockquote><p>The Reformed divines who addressed the subjects of lawful civil government and resistance to tyranny often argued that a just ruler governs in the interests of the people, while a tyrant governs in his own interests. We find this very same distinction in the medieval scholastic theologian, Thomas Aquinas:

Fourth, it is necessary that a king have equity, because otherwise he would be a tyrant: for the tyrant turns everything within the kingdom to his own use, but a king orders his kingdom to the common good. Thus Proverbs says: a just king sets up the land; a covetous man destroys it (Prov 29:4). But he [Christ] came not seeking his own use, but yours, because the Son of Man did not come to be ministered to, but to minister (Matt 20:28). And who comes to minister? Surely the one who comes to give his soul for the redemption of many (Matt 20:28), and so that he might lead the redeemed to eternal glory, to which may he lead us, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermo Ecce Rex tuus</cite>, n2.1.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>On the Existence of Secondary Efficient Causes … Against the rigid occasionalists we can urge the testimony of conscience, for we at least experience our will being a true cause of other actions, namely willing, attending, trying etc. The certitude we have of these acts is of the highest degree. Of lesser degree is the certitude we have of our causality as to our commanded bodily acts, but even this certitude, namely moral certitude, is so persuasive as to make it impossible to doubt of such causality. The resistance we experience in attaining our aims can only rationally be interpreted as evidence not just of the existence of the external world but also for its causality with respect to us. The other things that we precisely experience as obstacles to our action are certainly caused, because they are transient, changeable, and temporal; but that such things are caused by secondary efficient causes is a conclusion so very probable indeed that it cannot prudently be doubted of, although it is not indubitably evident… On the Existence of Finality That some final causality exists can be proved from our experience, for we certainly act for the sake of some end, and once the existence of a true order in the world has been admitted we can also conclude to the existence of some finality even beyond ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 46 Wolter was a Scotist.</span></figcaption>

<blockquote><p>Since, therefore, ignorant theology has so many ills, it is easy to judge that the Church has need of many great arts. For in order to judge and to explain correctly and distinctly complicated and obscure things, it is not sufficient to know the common precepts of grammar and dialectic, but varied knowledge is needed; for many things are to be taken from natural philosophy, and many are to be contributed to Christian teaching from moral philosophy.

Furthermore, there are two things for the acquiring of which great and varied knowledge and long practice in many arts are necessary, namely method and style of discourse. For no one can become a master of method, unless he is well and rightly versed in philosophy – indeed in that one kind of philosophy that is alien to sophistry, searches for and discloses truth properly and by the right path. Those who are well versed in these studies, and have obtained for themselves the habit (hexin) of relating to method everything that they want to understand or teach to others, also know how to represent methods in religious discussions, how to clear up what is complicated, pull together what is scattered and shed light on what is obscure and ambiguous.

Great and abundant knowledge is also needed for another purpose, namely for the shaping of a discourse, as all know who have occupied themselves even slightly with literature. No less study is needed in order to acquire this habit (hexin) of shaping method. It cannot be achieved by those who are not versed in most parts of philosophy. Those who have no practice in these would obtain only the shadow of method, even if they acquired dialectic. None produces what is corrupt and sophistic more often than these men. Whereas they consider themselves masters of method, they nevertheless stray from the path, and they are, to use the Homeric word, blind watchmen (alaoskopoi).

Moreover, there is the need for philosophy not only because of method, or, as Plato calls it, inevitable rules for composition (anankēn logographikēn) [Phaedrus 264b7], but, as I said before, the theologian needs to adopt many things from natural philosophy, where the relation of the single parts is such that for those who strive for genuine knowledge it is not sufficient to choose a few aspects, but, as far as possible, the entire art needs to be known. The theologian who does not know of these most learned discussions on the soul, the senses, the causes of desires and emotions, on knowledge and on will, lacks a great tool. And he acts insolently who professes himself a dialectician if he is ignorant of those distinctions between causes that are only taught in natural philosophy and can only be understood by natural philosophers. Doubtless there is a cycle of arts by which they are all bound together and connected, so that in order to grasp individual ones many of the others have to be taken on. Therefore the Church has need of the entire cycle of sciences.

I do not believe that anyone is so foolish as not to notice that those who are versed in moral philosophy can practise more easily many parts of Christian doctrine. For if many things are similar, concerning laws, political morals, contracts and many of life’s affairs, we are helped, not only by the order and method in philosophy, but also by understanding the things themselves carefully. If some things are dissimilar, then a comparison brings much light. Moreover, one who lacks a knowledge of natural philosophy practises moral philosophy like a lame man holding a ball. Again, history and the exact computation of time periods require mathematics, but that part also needs to be joined to natural philosophy, for from the former, as from a source, many things in natural philosophy take their origin. And it is a form of barbarity, to say nothing else, to spurn the most beautiful arts concerned with the motions of the constellations that bring about for us the distinction between the years and seasons, announce many great things that are to come, and warn us in a useful way.

I am not ignorant of the fact that philosophy is one kind of teaching and theology another, nor do I want to mingle them in such a way as a cook mixes together many sauces [Plautus, Ghosts 1.3.120], but I want to help the theologian in the management of method. For he will need to borrow many things from philosophy. If anyone does not trust this oration, let him consider the theology of the ignorant, and let him ponder with himself if he wants to let loose on the world such miscellaneous sophistry, and wants doubtful theology to be brought upon the Church. By ignorant I mean not only those who are unskilled in letters, such as the Anabaptists, but also those impertinent men who, although they may declaim magnificently, nevertheless say nothing true, both because they are not used to the method, and because they do not grasp the origins of things sufficiently. Therefore, because they are not trained in philosophy, they do not understand sufficiently what theology professes, or to what extent it agrees with philosophy.

There is no need to recount here the ancients, who thoroughly overwhelmed Christian doctrine by the most foolish subtleties. I am searching for erudite philosophy, not the sophistries where there is nothing underneath. Therefore I said that one kind of philosophy has to be chosen which has as little as possible of sophistry and which preserves the true method; the teaching of Aristotle is of that kind. Nevertheless it still needs the addition, from elsewhere, of that most excellent part of philosophy that is concerned with the heavenly movements.

For the other philosophical sects are full of sophistry and of absurd and false opinions, which are also harmful to the character. For the exaggerations of the Stoics, namely that good health, riches and similar things are not good, are altogether sophistic. Apatheia, too, a false and dangerous opinion on fate, is imaginary. Epicurus is not philosophising but being facetious when he asserts that everything exists by chance; he takes away the first cause, and disagrees in everything with the true teaching of the physicists. The Academy [of Plato], too, is to be shunned, which does not preserve method, and takes an excessive licence to overturn everything; those who strive to do this must by necessity conclude many things in a sophistic way. However, he who follows mainly Aristotle as a guide, and aspires to one, simple and the least sophistic teaching, can now and then take on something from other authors, too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Philosophy (1536) in Orations on Philosophy and Education</cite></span></figcaption>

r+from+the+former%2C+as+from+a+source%2C+many+things+in+natural+philosophy+take+their+origin.+And+it+is+a+form+of+barbarity%2C+to+say+nothing+else%2C+to+spurn+the+most+beautiful+arts+concerned+with+the+motions+of+the+constellations+that+bring+about+for+us+the+distinction+between+the+years+and+seasons%2C+announce+many+great+things+that+are+to+come%2C+and+warn+us+in+a+useful+way.%0A%0AI+am+not+ignorant+of+the+fact+that+philosophy+is+one+kind+of+teaching+and+theology+another%2C+nor+do+I+want+to+mingle+them+in+such+a+way+as+a+cook+mixes+together+many+sauces+%5BPlautus%2C+Ghosts+1.3.120%5D%2C+but+I+want+to+help+the+theologian+in+the+management+of+method.+For+he+will+need+to+borrow+many+things+from+philosophy.+If+anyone+does+not+trust+this+oration%2C+let+him+consider+the+theology+of+the+ignorant%2C+and+let+him+ponder+with+himself+if+he+wants+to+let+loose+on+the+world+such+miscellaneous+sophistry%2C+and+wants+doubtful+theology+to+be+brought+upon+the+Church.+By+ignorant+I+mean+not+only+those+who+are+unskilled+in+letters%2C+such+as+the+Anabaptists%2C+but+also+those+impertinent+men+who%2C+although+they+may+declaim+magnificently%2C+nevertheless+say+nothing+true%2C+both+because+they+are+not+used+to+the+method%2C+and+because+they+do+not+grasp+the+origins+of+things+sufficiently.+Therefore%2C+because+they+are+not+trained+in+philosophy%2C+they+do+not+understand+sufficiently+what+theology+professes%2C+or+to+what+extent+it+agrees+with+philosophy.%0A%0AThere+is+no+need+to+recount+here+the+ancients%2C+who+thoroughly+overwhelmed+Christian+doctrine+by+the+most+foolish+subtleties.+I+am+searching+for+erudite+philosophy%2C+not+the+sophistries+where+there+is+nothing+underneath.+Therefore+I+said+that+one+kind+of+philosophy+has+to+be+chosen+which+has+as+little+as+possible+of+sophistry+and+which+preserves+the+true+method%3B+the+teaching+of+Aristotle+is+of+that+kind.+Nevertheless+it+still+needs+the+addition%2C+from+elsewhere%2C+of+that+most+excellent+part+of+philosophy+that+is+concerned+with+the <blockquote><p>On the Natures of Things &amp; Substantial Forms 1. We do not introduce these things to the students so that they will all now immediately necessarily believe in forms with their appendices, or contend tooth and nail for them, but so that they may at least for a time abstain from a peremptory judgment and its execution, by which the miserable and innocent beings are cast down from their ancient possession, until they have learned thoroughly, if not most accurately, at least moderately the philosophy of the schools, specifically logic, metaphysics, physics and these few notes which we subjoin, having been solidly determined, and they see that they are satisfied in them. However they will finally judge, we will not have wasted our labor if in the meantime we will have recalled them from a fierce contempt and flight of the philosophical study, moreover from an idiotic rustic and proud ignorance, so that at least it could sometime be said concerning those dissenting elsewhere what is boasted among the Arabs: A wise man when he errs, errs with learned error. Moreover our notes are threefold:

1. Certain prejudgments which I [approvingly] suggest to the disputants.

2. Reasons for forms, which are to be clearly solved.

3. Reasons against forms and for those vicarious accidents which certain more recent [mechanical] authors wish to be substituted for forms, which forms and their doubts, with their principles and consequences, are fittingly to be defended.

2. The notes of the first kind are:

I. Let them consider whether they satisfy themselves in the reconciliation of this opinion [of forms] with sacred scripture. For it indeed harmonizes with truth: and Christian philosophers will profess learned ignorance a thousand times rather than that they bring even the least appearance of prejudice to divine truth. See Gen. 1:11, 21-22, 24-25; Prov. 30:24-27, where we think permanent natures, faculties and distinct species of things are implied.

II. It is to be seen whether from the denying opinion there would be at least an easier lapse than from the affirming into doubt. [Put the question forth:] Whether there are any substantial forms which actuate the body of man and constitute one composite with it? But if someone denies this, and substitutes the krasin of Galen, or a particle of divine breath or soul of the world, or the universal intellect of Averroes, or the mind of Plato, thrust into the workshop of the body as a genial pipor and bound to it, as Prometheus the Caucasian, if someone I say substitutes such a thing, by what reasons would you more successfully and safely rebut him than [those by which] the assertors of forms [do].

III. It is to be seen how with this opinion standing the distinction between the being of substance and of accident can be conveniently explained and defended. For there would be, according to them, no substantial difference between a wolf, a sheep, a whale, an elephant, a serpent, a stone, a monk’s hood, aconite, wheat, the sun, the moon, the earth; add also a clock, the wooden Trojan horse, the bronze bull of Phalaris, the flying dove of Archytas, the bronze head of Pope Sylvester, the speaking statue of Albertus Magnus, a house, a chair, a garment etc. But perhaps they would retort that those substances differ essentially through those five accidents motion, rest, position, figure and quantity. I respond: Granting this to be so (about which we do not now dispute), the difficulty is nevertheless not removed by this escape. It nevertheless remains [on this view] that substances are distinguished from substances in no other way than accidents from substances and accidents among themselves, for both the former and the latter are distinguished by accidents.

IV. It is to be seen whether from here there is not an easier lapse, when someone is pressed by reasons and consequences into this absurd [occasionalist] opinion: ‘Secondary causes endowed with their own causality are not given, but only the first and universal cause acts in the presence and disposition of secondary causes.’ See the absurdity of this opinion shown by the Scholastics and more recent metaphysicians and theologians in the topic on Providence, on the concourse of God with creatures. Let the consequences [of their position], by which they could be pressed, be these:

      1. That the concourse of God is not given, nor the motion of the first mover accommodated to the natures and properties of secondary causes, whether they are necessary or contingent.

      2. That there is not in created substances an intrinsic mover and a substantial principle of internal and proper motion: for the disposition of the mobile thing to motion from quantity, figure, position is not the activity or causality of the efficient cause, but only a required condition, and a cause sine qua non (‘without which nothing’).

      3. Consequently, since no mobile thing can move itself in potency to act or determine itself to motion, it remains that some external mover is to be sought which may lead the potency into act. But what will they give here? The Platonic-Virgilian soul of the world, or intelligences, or God, or atoms, or celestial globules. Here something will have to be said [by them].

V. It is to be seen lest the negation of proper qualities, which internally emanate from the form and substance of a thing (the negation of which follows the negation of forms, just as one error drags another), drive us into these absurdities:

      1. That created substances are the immediate principle of their own operation, since there are no active qualities by which substances operate as a means: which see shaken out by the metaphysicians and theologians when they treat of the simplicity of God and of the distinction of the divine attributes.

      2. That there are no qualities altogether, as neither of the second, or third, so also not of the first species; that is, there are no habits, against the common school of philosophers and theologians. I would like to see how those who deny natural faculties or powers will vindicate habits against the atheists, skeptics and infidels (the necessity of which Scripture and reason persuades), lest they be likewise shut up in that pentagon-workshop of motion, rest, quantity, position and figure.

VI. From this opinion it follows that no definitions of substances are given, since there are no forms or proper first and internal essentials from which the difference can be taken. How this may savor to the sons of the logicians of whatever sect, and to all acroamatic minds, and to the professors of whatever disciplines, they themselves will see.

VII. This absurdity also follows: That all created substances, even man himself (and why not angels and separate souls?), are beings per accidens [through accident], collective and aggregate: but not essences or natures, one per se [through itself]. So that no essence seems to be per se, except perhaps atoms, or ethereal globules, or insensible particles, or Platonic ideas (which he called αυτοάνθρωπον, αυτοίππον, etc.) or chimeras buzzing in the void, etc. But that man ought to be called a being and one per se, we will teach below.

VIII. It would follow that there are no proper and intrinsic faculties, nor are their principles in animals of another kind than in automata or Daedalean statues; and consequently the works of God and nature produced through creation or generation are essentially and univocally the same with works of art: which how it may agree well enough with Ps. 104:29; 7:14-15; Num. 16:22; 27:16; Heb. 11:9-10; Hab. 2:19, I confess I do not see the knot.

IX. It would follow that there is no generation or corruption of natural things. But more on this in Thesis 4 [below].

X. Since efficiency and motion, which is usually attributed to forms and their active qualities, is attributed to quantity and figure, it is to be seen lest young men at some time imprudently admit through consequence that magical axiom rejected by all Christian theology and philosophy: “There is some efficacy of quantity and figure, and it either per se or with others things concurs as an active principle of transmutation.</p></blockquote>

izes+with+truth%3A+and+Christian+philosophers+will+profess+learned+ignorance+a+thousand+times+rather+than+that+they+bring+even+the+least+appearance+of+prejudice+to+divine+truth.+See+Gen.+1%3A11%2C+21-22%2C+24-25%3B+Prov.+30%3A24-27%2C+where+we+think+permanent+natures%2C+faculties+and+distinct+species+of+things+are+implied.+II.+It+is+to+be+seen+whether+from+the+denying+opinion+there+would+be+at+least+an+easier+lapse+than+from+the+affirming+into+doubt.+%5BPut+the+question+forth%3A%5D+Whether+there+are+any+substantial+forms+which+actuate+the+body+of+man+and+constitute+one+composite+with+it%3F+But+if+someone+denies+this%2C+and+substitutes+the+krasin+of+Galen%2C+or+a+particle+of+divine+breath+or+soul+of+the+world%2C+or+the+universal+intellect+of+Averroes%2C+or+the+mind+of+Plato%2C+thrust+into+the+workshop+of+the+body+as+a+genial+pipor+and+bound+to+it%2C+as+Prometheus+the+Caucasian%2C+if+someone+I+say+substitutes+such+a+thing%2C+by+what+reasons+would+you+more+successfully+and+safely+rebut+him+than+%5Bthose+by+which%5D+the+assertors+of+forms+%5Bdo%5D.+III.+It+is+to+be+seen+how+with+this+opinion+standing+the+distinction+between+the+being+of+substance+and+of+accident+can+be+conveniently+explained+and+defended.+For+there+would+be%2C+according+to+them%2C+no+substantial+difference+between+a+wolf%2C+a+sheep%2C+a+whale%2C+an+elephant%2C+a+serpent%2C+a+stone%2C+a+monk%E2%80%99s+hood%2C+aconite%2C+wheat%2C+the+sun%2C+the+moon%2C+the+earth%3B+add+also+a+clock%2C+the+wooden+Trojan+horse%2C+the+bronze+bull+of+Phalaris%2C+the+flying+dove+of+Archytas%2C+the+bronze+head+of+Pope+Sylvester%2C+the+speaking+statue+of+Albertus+Magnus%2C+a+house%2C+a+chair%2C+a+garment+etc.+But+perhaps+they+would+retort+that+those+substances+differ+essentially+through+those+five+accidents+motion%2C+rest%2C+position%2C+figure+and+quantity.+I+respond%3A+Granting+this+to+be+so+%28about+which+we+do+not+now+dispute%29%2C+the+difficulty+is+nevertheless+not+removed+by+this+escape.+It+nevertheless+remains+%5Bon+this+view%5D+that+substances+are+distinguished+from+substances+in+no+other+way+than+accidents+from+substances+and+accidents+among+themselves%2C+for+both+the+former+and+the+latter+are+distinguished+by+accidents.+IV.+It+is+to+be+seen+whether+from+here+there+is+not+an+easier+lapse%2C+when+someone+is+pressed+by+reasons+and+consequences+into+this+absurd+%5Boccasionalist%5D+opinion%3A+%E2%80%98Secondary+causes+endowed+with+their+own+causality+are+not+given%2C+but+only+the+first+and+universal+cause+acts+in+the+presence+and+disposition+of+secondary+causes.%E2%80%99+See+the+absurdity+of+this+opinion+shown+by+the+Scholastics+and+more+recent+metaphysicians+and+theologians+in+the+topic+on+Providence%2C+on+the+concourse+of+God+with+creatures.+Let+the+consequences+%5Bof+their+position%5D%2C+by+which+they+could+be+pressed%2C+be+these%3A+1.+That+the+concourse+of+God+is+not+given%2C+nor+the+motion+of+the+first+mover+accommodated+to+the+natures+and+properties+of+secondary+causes%2C+whether+they+are+necessary+or+contingent.+2.+That+there+is+not+in+created+substances+an+intrinsic+mover+and+a+substantial+principle+of+internal+and+proper+motion%3A+for+the+disposition+of+the+mobile+thing+to+motion+from+quantity%2C+figure%2C+position+is+not+the+activity+or+causality+of+the+efficient+cause%2C+but+only+a+required+condition%2C+and+a+cause+sine+qua+non+%28%E2%80%98without+which+nothing%E2%80%99%29.+3.+Consequently%2C+since+no+mobile+thing+can+move+itself+in+potency+to+act+or+determine+itself+to+motion%2C+it+remains+that+some+external+mover+is+to+be+sought+which+may+lead+the+potency+into+act.+But+what+will+they+give+here%3F+The+Platonic-Virgilian+soul+of+the+world%2C+or+intelligences%2C+or+God%2C+or+atoms%2C+or+celestial+globules.+Here+something+will+have+to+be+said+%5Bby+them%5D.+V.+It+is+to+be+seen+lest+the+negation+of+proper+qualities%2C+which+internally+emanate+from+the+form+and+substance+of+a+thing+%28the+negation+of+which+follows+the+negation+of+forms%2C+just+as+one+error+drags+another%29%2C+drive+us+into+these+absurdities%3A+1.+That+created+substances+are+the+immediate+principle+of+their+own+operation%2C+since+there+are+no+active+qualities+by+which+substances+operate+as+a+means%3A+which+see+shaken+out+by+the+metaphysicians+and+theologians+when+they+treat+of+the+simplicity+of+God+and+of+the+distinction+of+the+divine+attributes.+2.+That+there+are+no+qualities+altogether%2C+as+neither+of+the+second%2C+or+third%2C+so+also+not+of+the+first+species%3B+that+is%2C+there+are+no+habits%2C+against+the+common+school+of+philosophers+and+theologians.+I+would+like+to+see+how+those+who+deny+natural+faculties+or+powers+will+vindicate+habits+against+the+atheists%2C+skeptics+and+infidels+%28the+necessity+of+which+Scripture+and+reason+persuades%29%2C+lest+they+be+likewise+shut+up+in+that+pentagon-workshop+of+motion%2C+rest%2C+quantity%2C+position+and+figure.+VI.+From+this+opinion+it+follows+that+no+definitions+of+substances+are+given%2C+since+there+are+no+forms+or+proper+first+and+internal+essentials+from+which+the+difference+can+be+taken.+How+this+may+savor+to+the+sons+of+the+logicians+of+whatever+sect%2C+and+to+all+acroamatic+minds%2C+and+to+the+professors+of+whatever+disciplines%2C+they+themselves+will+see.+VII.+This+absurdity+also+follows%3A+That+all+created+substances%2C+even+man+himself+%28and+why+not+angels+and+separate+souls%3F%29%2C+are+beings+per+accidens+%5Bthrough+accident%5D%2C+collective+and+aggregate%3A+but+not+essences+or+natures%2C+one+per+se+%5Bthrough+itself%5D.+So+that+no+essence+seems+to+be+per+se%2C+except+perhaps+atoms%2C+or+ethereal+globules%2C+or+insensible+particles%2C+or+Platonic+ideas+%28which+he+called+%CE%B1%CF%85%CF%84%CE%BF%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CE%BD%2C+%CE%B1%CF%85%CF%84%CE%BF%CE%AF%CF%80%CF%80%CE%BF%CE%BD%2C+etc.%29+or+chimeras+buzzing+in+the+void%2C+etc.+But+that+man+ought+to+be+called+a+being+and+one+per+se%2C+we+will+teach+below.+VIII.+It+would+follow+that+there+are+no+proper+and+intrinsic+faculties%2C+nor+are+their+principles+in+animals+of+another+kind+than+in+automata+or+Daedalean+statues%3B+and+consequently+the+works+of+God+and+nature+produced+through+creation+or+generation+are+essentially+and+univocally+the+same+with+works+of+art%3A+which+how+it+may+agree+well+enough+with+Ps.+104%3A29%3B+7%3A14-15%3B+Num.+16%3A22%3B+27%3A16%3B+Heb.+11%3A9-10%3B+Hab.+2%3A19%2C+I+confess+I+do+not+see+the+knot.+IX.+It+would+follow+that+there+is+no+generation+or+corruption+of+natural+things.+But+more+on+this+in+Thesis+4+%5Bbelow%5D.+X.+Since+efficiency+and+motion%2C+which+is+usually+attributed+to+forms+and+their+active+qualities%2C+is+attributed+to+quantity+and+figure%2C+it+is+to+be+seen+lest+young+men+at+some+time+imprudently+admit+through+consequence+that+magical+axiom+rejected+by+all+Christian+theology+and+philosophy%3A+%E2%80%9CThere+is+some+efficacy+of+quantity+and+figure%2C+and+it+either+per+se+or+with+others+things+concurs+as+an+active+principle+of+transmutation.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+%E2%80%98On+the+Natures+of+Things+%26+Substantial+Forms%E2%80%99%2C+pp.+369-76+in+Select+Theological+Disputations%2C+vol.+1%2C+pt.+2+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+%E2%80%98On+Creation%E2%80%99%2C+pt.+8+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17509e63f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17509e63f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=On%20the%20Natures%20of%20Things,as%20an%20active%20principle%20of%20transmutation&amp;text=On%20the%20Natures%20of%20Things%20%26%20Substantial%20Forms&amp;text=things%20concurs%20as%20an%20active%20principle%20of%20transmutation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…focuses on the relationship of theology and philosophy as formulated in the thought of three key Dutch Reformed theologians… All three were at the forefront of the philosophical debates that swirled in the Dutch Republic in the seventeenth and eighteenth centuries, especially instigated by the arrival of Renee Descartes (1596–1650) in the Netherlands in 1628… By studying these three theologians, Goudriaan “seeks to understand better how Dutch Reformed theology integrated and responded to philosophical views in the period from 1625 through 1750. Voetius, professor of theology at the University of Utrecht, was initially the premier defender against the Cartesian encroachment upon the Dutch Reformed Church that sought to undermine both her theology and piety. This mantle would be taken up by his successor at the university, Petrus van Mastricht. As might be expected, Goudriaan demonstrates that Voetius and Mastricht were in essential agreement with one another in their theology and polemic against Cartesianism as they engaged it from distinctly Reformed premises and commitments. Goudriaan deals successively with specific loci where the relationship between theology and philosophy was acutely tried and tested, including: reason and revelation; creation and the physical world; the providential rule of God over the world; anthropological issues of the relationship between the soul and the body; and divine and natural law. He notes that both Voetius and Mastricht had aligned themselves with the older Aristotelian philosophy against the newer Enlightenment philosophy, yet the debate was not waged over whose philosophical system was correct. This in itself would have been a losing concession, for it was precisely their aim that Reformed theology not be corrupted by alien philosophical concepts or categories that ultimately undermined Scriptural authority and teaching. Philosophy was instead viewed by them as an instrument or servant of the most basic Reformed principle, namely, the authority of Scripture as their principium cognoscendi. For them Scripture was not subordinated to philosophy, but philosophy to Scripture. This starting point alone accounted for the full-orbed nature of creation with its rich diversity, including spirits and bodies, heaven and earth, which Cartesian dualism could not account for or bring into any real, dynamic relation. Because of this common commitment to the Reformed principle of Scripture’s authority, Goudriaan observes, “the theological development from Voetius to Driessen supports the broader claim that biblical Christianity outlives the philosophical and conceptual apparatus with whose help it is explained.” To put it another way, philosophy was not the indispensable lord of theology, but its disposable handmaiden—it would, therefore, continue even when philosophies changed or failed.” – Daniel Ragusa Ariew, Roger – Descartes Among the Scholastics in History of Science &amp; Medicine Library, vol. 20 Pre (Brill, 2011) Schlebusch, J.A. – Cartesianism &amp; Reformed Scholastic Theology: A Comparative Study of the Controversy a Master’s thesis (Univ. of the Free State, South Africa, 2013) 160 pp. Includes a translation of two chapters of Christopher Wittich’s Two Dissertations in ch. 3, and of two chapters of Peter van Mastricht’s Vindication of the Truth, which reply to Wittich, in ch. 4. . . Cartesianism in Scotland in the Post-Reformation Articles Raffe, Alasdair – ‘Intellectual Change Before the Enlightenment: Scotland, the Netherlands &amp; the Reception of Cartesian Thought, 1650-1700’ The Scottish Historical Review, vol. 94; no. 238, pt. 1 (April 2015), pp. 24-47 Gellera, Giovanni ‘Descartes in Scotland &amp; Pre-Enlightenment Scottish Philosophy’ ‘The Scottish Faculties of Arts &amp; Cartesianism (1650-1700)’ History of Universities XXIX (2), pp. 166-187 ‘English Philosophers &amp; Scottish Academic Philosophy (1660–1700)’ (2017) ‘Robertson’s Philosophical Theses (1596): between Late Renaissance &amp; Early Modern Scholasticism’ eds. Alexander Broadie &amp; J.S. Reid, Philosophical Discourse in Seventeenth-Century Scotland: Key Texts (Scottish History Society) ‘The Philosophy of Robert Forbes: A Scottish Scholastic Response to Cartesianism’ Journal of Scottish Philosophy 11(2) (Sept., 2013), pp. 191-211 Abstract: “In the second half of the seventeenth century, philosophy teaching in the Scottish universities gradually moved from scholasticism to Cartesianism. Robert Forbes, regent at Marischal College and King’s College, Aberdeen, was a strenuous opponent of Descartes. The analysis of the philosophy of Forbes and of his teacher Patrick Gordon sheds light on the relationship between Scottish Reformed scholasticism and the reception of Descartes in Scotland.</p></blockquote>

as+precisely+their+aim+that+Reformed+theology+not+be+corrupted+by+alien+philosophical+concepts+or+categories+that+ultimately+undermined+Scriptural+authority+and+teaching.+Philosophy+was+instead+viewed+by+them+as+an+instrument+or+servant+of+the+most+basic+Reformed+principle%2C+namely%2C+the+authority+of+Scripture+as+their+principium+cognoscendi.+For+them+Scripture+was+not+subordinated+to+philosophy%2C+but+philosophy+to+Scripture.+This+starting+point+alone+accounted+for+the+full-orbed+nature+of+creation+with+its+rich+diversity%2C+including+spirits+and+bodies%2C+heaven+and+earth%2C+which+Cartesian+dualism+could+not+account+for+or+bring+into+any+real%2C+dynamic+relation.+Because+of+this+common+commitment+to+the+Reformed+principle+of+Scripture%E2%80%99s+authority%2C+Goudriaan+observes%2C+%E2%80%9Cthe+theological+development+from+Voetius+to+Driessen+supports+the+broader+claim+that+biblical+Christianity+outlives+the+philosophical+and+conceptual+apparatus+with+whose+help+it+is+explained.%E2%80%9D+To+put+it+another+way%2C+philosophy+was+not+the+indispensable+lord+of+theology%2C+but+its+disposable+handmaiden%E2%80%94it+would%2C+therefore%2C+continue+even+when+philosophies+changed+or+failed.%E2%80%9D+%E2%80%93+Daniel+Ragusa+Ariew%2C+Roger+%E2%80%93+Descartes+Among+the+Scholastics+in+History+of+Science+%26+Medicine+Library%2C+vol.+20+Pre+%28Brill%2C+2011%29+Schlebusch%2C+J.A.+%E2%80%93+Cartesianism+%26+Reformed+Scholastic+Theology%3A+A+Comparative+Study+of+the+Controversy+a+Master%E2%80%99s+thesis+%28Univ.+of+the+Free+State%2C+South+Africa%2C+2013%29+160+pp.+Includes+a+translation+of+two+chapters+of+Christopher+Wittich%E2%80%99s+Two+Dissertations+in+ch.+3%2C+and+of+two+chapters+of+Peter+van+Mastricht%E2%80%99s+Vindication+of+the+Truth%2C+which+reply+to+Wittich%2C+in+ch.+4.+.+.+Cartesianism+in+Scotland+in+the+Post-Reformation+Articles+Raffe%2C+Alasdair+%E2%80%93+%E2%80%98Intellectual+Change+Before+the+Enlightenment%3A+Scotland%2C+the+Netherlands+%26+the+Reception+of+Cartesian+Th

<blockquote><p>Besides, consider this, that the covenant [of grace] is made in Jesus Christ. There are two Adams, he made a covenant with both: with the first Adam, he made a covenant, as with the common root of all mankind; but Adam brake the covenant, and so did all his members. But there is a second Adam, and all that are saved, are members of him as truly as we are of the first Adam: and he kept the covenant, and therefore if he stand, they shall stand also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life Eternal or, A Treatise of the Knowledge of the Divine Essence and Attributes</cite>, (2nd edn, London: Nicholas Bourne, 1631), Part II, p. 87.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94621b57e0" data-kw="">
<blockquote><p>Now also, God’s kindness is that he would want to summon the creature, who by default has been subordinated to him and owes him everything by natural obligation, to special communion with him by entering into a covenant, and would want to temper his completely absolute rule with that self-indulgence of love and mutual obligation.

The result was that the man, who had been made with a fixed means to the supreme blessedness, was firmly able to expect that blessedness, not only because of God’s sheer goodness and natural love for the creatures, in each manner promised to him, but certainly also because of the covenant, and thus on account of God’s truthfulness and faithfulness. Now also, this agreement of the covenant impels reward and certain great and abundant gift, which the man would have been able to hold out to God because of God’s law that he knew by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-burman.html">Francis Burman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis theologiae et speciatim oeconomiae Foederum Dei, ab initiosaeculorum usque ad consummationem eorum</cite>, (2 vols, Utrecht, 1671–72), 2.2.4. Quoted in Harrison Perkins, ‘Meritum ex Pacto in the Reformed Tradition: Covenantal Merit in Theological Polemics’, Mid-America Journal of Theology, 31 (2020), p. 77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-5dd4f05610" data-kw="">
<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sacred Doctrine of Divinitie</cite>, (London, 1599, repr. 1613), 9. [Spelling modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-b5f34f3a5e" data-kw="">
<blockquote><p>§124. XII. Man, therefore, by the very fact that he was made according to God’s image, has been constituted as in a covenant with God. I call this covenant or pact a firm agreement in mutual obligation because God bound Adam by oath unto loving and seeking him as his God, that is being examined also in an ardent attachment to God together with obedience throughout the examination period, performed to God’s eternal glory in him who will be revealed in beatific life. And in turn he offered to Adam the assurance of what must be expected for standing in uprightness and rectitude, and for observing the law of examination, and from him, as his God, for striving after that revelation of God’s glory in himself, and the blessing in the multiplication of his posterity with God’s image. This is already clearly evident from what has been said.

§125. XIII. In this pact, heavenly life is considered as the reward that must be reckoned according to what is owed. This is usually called merit. But what the nature of this merit would be must be considered. It is not condign. Man is able to pay nothing to God, God accepts nothing from his hands, it is not profitable or beautiful according to man’s work. Man owes everything to God. See Luke 17:10. It, therefore, remains that merit is by the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Pentateuchum, Josuam, et Librum Judicum</cite>, (Amsterdam, 1669), p. 38. Quoted in Harrison Perkins, ‘Meritum ex Pacto in the Reformed Tradition: Covenantal Merit in Theological Polemics’, Mid-American Journal of Theology, 31 (2020), p. 71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

mics%E2%80%99%2C+Mid-American+Journal+of+Theology%2C+31+%282020%29%2C+p.+71.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5f34f3a5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5f34f3a5e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/11/johannes-cocceius-on-pactional-merit-and-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-15e919d249" data-kw="">
<blockquote><p>1. Christ is a doer and fulfiller of the covenant of works most exactly in all points, both the command, and the curse and penalty of the Covenant, is satisfied by him; this is works, and this was the condition required upon his part, Heb. 10. 7, “Then said I, lo I come, in the volume of the book it is written of me, to do your will, O God.” Gal. 3. 13, “Christ has redeemed us from the curse of the Law, being made a curse for us.”

2. Christ as a doer and obedient fulfiller of the Law, has a reward in justice by the promise of this covenant: For (I humbly conceive) he had his reward of debt, and merit, having paid a condign price to the justice of God; therefore his reward is due to him, by commutative Justice, Phil. 2. 7, 8, “But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of man; And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the Cross; wherefore God also hath highly exalted him,” and is craved by him, Joh. 17. 4, 5, “I have glorified you on earth, I have finished the work which you gaves me to do. And now, O Father, glorify me with your own self.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-gillespie.html">Patrick Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ark of the Covenant Opened</cite>, (London, 1677), 61 [spelling and punctuation modernized].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<main class="wrap"><figure class="quote" id="q-27d9c0a649" data-kw="">
<blockquote><p>If the Gospel propound and promise pardon of sin and salvation without any condition at all required on our part, and on all such conditions and qualifications, of belief, repentance and new obedience, destroy the freeness of grace, then neither Christ, nor John Baptist, nor the apostles preached Gospel or free grace; for they thus preached and propounded pardon of sin and salvation upon such terms from the first to the last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646)</cite>, p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“If the Gospel propound and promise pardon of sin and salvation without any condition at all required on our part, and on all such conditions and qualifications, of belief, repentance and new obedience, destroy the freeness of grace, then neither Christ, nor John Baptist, nor the apostles preached Gospel or free grace; for they thus preached and propounded pardon of sin and salvation upon such terms from the first to the last.”

— Thomas Gataker, Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646), p. 58">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+the+Gospel+propound+and+promise+pardon+of+sin+and+salvation+without+any+condition+at+all+required+on+our+part%2C+and+on+all+such+conditions+and+qualifications%2C+of+belief%2C+repentance+and+new+obedience%2C+destroy+the+freeness+of+grace%2C+then+neither+Christ%2C+nor+John+Baptist%2C+nor+the+apostles+preached+Gospel+or+free+grace%3B+for+they+thus+preached+and+propounded+pardon+of+sin+and+salvation+upon+such+terms+from+the+first+to+the+last.%E2%80%9D%0A%0A%E2%80%94+Thomas+Gataker%2C+Shadows+without+Substance%2C+or+Pretended+New+Lights%3A+together+with+the+impieties+and+blasphemies+that+lurk+under+them%2C+further+discovered+and+drawn+forth+into+the+light%3A+in+way+of+rejoinder+unto+Mr.+John+Saltmarsh%E2%80%99s+Reply+entitled+Shadows+Flying+Away%E2%80%A6+%28London%3A+Bostock%2C+1646%29%2C+p.+58&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27d9c0a649.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27d9c0a649.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=If%20the%20Gospel%20propound%20and%20promise,from%20the%20first%20to%20the%20last&amp;text=If%20the%20Gospel%20propound%20and%20promise%20pardon%20of&amp;text=such%20terms%20from%20the%20first%20to%20the%20last" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3df19304a" data-kw="">
<blockquote><p>It still continues equally true, upon the Protestant as upon the Romish doctrine of justification, that God requires of us faith and repentance, and requires them of us as indispensably necessary to our escaping His wrath and curse due to us for our sins, though not as exerting any causality or efficiency in procuring or obtaining for us pardon and acceptance, except instrumentally in the case of faith;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology (Edinburgh: T&amp;T Clark, 1863), vol. 2, ch. 21, ‘Justification’, section 1, ‘Popish &amp; Protestant Views’</cite>, p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-a4ee6cd852" data-kw="">
<blockquote><p>Faith sanctifies not as a cause, but as a part of infused grace: and such a part as goes not alone, but accompanied with all other graces of love, fear, zeal, hope, repentance, etc., inasmuch as man’s regeneration is not the infusion of one, but of the habit of all graces. Again, tis not the virtue of faith that justifies us; The grace of justification is from God; He works it: but tis our faith applies it and makes it ours. The act of justification is God’s mere work; but our faith only brings us the benefit and assurance of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith… (Oxford, 1625) | section 2, ch. 3</cite>, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-7a9e037902" data-kw="">
<blockquote><p>(6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification, and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith… (London: Boulter, 1677), | General Considerations</cite>, p. 34</span></figcaption>

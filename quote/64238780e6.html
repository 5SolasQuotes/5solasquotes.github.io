<main class="wrap"><figure class="quote" id="q-64238780e6" data-kw="">
<blockquote><p>XX. But, you might say, the apostle himself implies that some are perfect, and includes himself among them. For he adds, “All of us, then, who are mature should take such a view of things” (Phil. 3:15). And in 1 Cor. 2, he says, “We do, however, speak a message of wisdom among the mature.” Many holy men in Scripture are also testified to be perfect. Thus, it is said of Noah, “Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God” (Gen. 6:9). And God Himself, speaking to Satan about Job, says, “Have you considered my servant Job? There is no one on earth like him; he is blameless and upright, a man who fears God and shuns evil” (Job 1:8). Indeed, David in Ps. 18 does not hesitate to attribute such perfection to himself. He says, “I have been blameless before him and have kept myself from sin. The Lord has rewarded me according to my righteousness, according to the cleanness of my hands in his sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses in which the Doctrine of the Roman School concerning the Division of Grace into Sufficient &amp; Efficent, and the Harmony of Human Freedom with the Efficacy of Grace are set forth</cite>, tr. AI by Inquisitor (@WesternCatholik on Twitter) (d. 1675), pp. 76-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>751. Faith, which is implanted in man in regeneration and calling by the powerful working of the Holy Spirit, is the means of justification, the foundation of sanctification, and the symbol and down payment of glorification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamentals of Sacred Theology Pre</cite>, (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 181</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“751. Faith, which is implanted in man in regeneration and calling by the powerful working of the Holy Spirit, is the means of justification, the foundation of sanctification, and the symbol and down payment of glorification.”

— Campegius Vitringa, The Fundamentals of Sacred Theology Pre (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 181">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C751.+Faith%2C+which+is+implanted+in+man+in+regeneration+and+calling+by+the+powerful+working+of+the+Holy+Spirit%2C+is+the+means+of+justification%2C+the+foundation+of+sanctification%2C+and+the+symbol+and+down+payment+of+glorification.%E2%80%9D%0A%0A%E2%80%94+Campegius+Vitringa%2C+The+Fundamentals+of+Sacred+Theology+Pre+%28d.+1722%3B+RHB%2C+2024%29%2C+ch.+21%2C+%E2%80%98Justification%E2%80%A6%E2%80%99%2C+p.+181&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F168aa179d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/168aa179d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=751.%20Faith%2C%20which%20is%20implanted%20in,symbol%20and%20down%20payment%20of%20glorification&amp;text=751.%20Faith%2C%20which%20is%20implanted%20in%20man%20in&amp;text=and%20the%20symbol%20and%20down%20payment%20of%20glorification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a1b0a92aaf" data-kw="">
<blockquote><p>Whether sanctification precede justification. Bishop [George] Downame in his appendix to the Covenant of Grace, does oppose my worthy tutor Mr. [William] Pemble for holding this opinion, but perhaps a distinction may solve all. As sanctification is taken for the act of the Holy Ghost working holiness into us, so it goes before faith and justification, so the apostle puts it before justifying, saying 1 Cor. 6:11, ‘But ye are sanctified, justified;’ but as it is taken for the exercise of holiness in regard of amendment of heart and life, so it follows justification in nature, but it is joined with it in time. The apostle Rom. 8:30, places vocation before justification, which vocation is the same thing with the first sanctification or regeneration. See Acts 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’, p. 530</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-d0d214f616" data-kw="">
<blockquote><p>Synonyms [of regeneration] more properly signifying are: I. Sanctification, because it produces holiness, that is, conformity of man with the law, Jn. 17:17, 19; 1 Cor. 1:2; Eph. 5:26. It is also called sanctification of the Spirit, 2 Thess. 2:13.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-e3288340cc" data-kw="">
<blockquote><p>Note also that by being ‘sanctified to Christ as a peculiar people,’ we intend first the real change, commonly called sanctification, and also the relation that thence follows, of being a separated, sanctified, dedicated, peculiar people.</p></blockquote>

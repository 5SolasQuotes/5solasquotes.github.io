<main class="wrap"><figure class="quote" id="q-294cf7d1da" data-kw="">
<blockquote><p>Don’t make the mistake of thinking that Christians are people who never sin or feel sinful. Rather, because of their faith in Christ, God simply doesn’t attribute their sin to them. This teaching is comforting to those who have terrified consciences. For good reason, we often try to impress on people that sins are forgiven and that righteousness is attributed to believers for the sake of Christ. Similarly, Christians should not have anything to do with the law or with sin. To the extent we are Christians, we stand above the law and sin. Christ is the Lord of the law. He is present and locked in our hearts, just as a precious stone is firmly mounted in a ring. When the law accuses us and sin terrifies us, all we need to do is look to Christ. When we have taken hold of him in faith, we have the victor over the law, sin, death, and the devil with us. Because Christ rules over all of these, we won’t be harmed. That’s why a Christian, correctly defined, is free from all laws and subject to no one, either inwardly or outwardly. But notice that I said, “to the extent we are Christians,” not just to the extent we are human and have consciences. We are free to the extent we have consciences that are transformed and made rich through faith. This faith is a great and immeasurable treasure—as Paul says, an “indescribable gift” (2 Corinthians 9:15), a gift that cannot be raised high enough or praised enough. It makes us children and heirs of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone. Zondervan. Kindle Edition. 201</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-773bd4c750" data-kw="sixth commandment homicide">
<blockquote><p>Because various cases can occur in which homicide can either be lawful or unlawful and to be condemned, hence arises the question—What is prohibited in the sixth precept, “Thou shalt not kill,” and what is not? First negatively, judicial homicide is not prohibited. Are the rights of war and punishment contained under this commandment? Are suicide and duelling prohibited? The former we deny; the latter we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.16.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/second-table-commandments-5-10.html">Second Table (Commandments 5-10)</a> › <a href="../topics/the-law-of-god/second-table-commandments-5-10/murder.html">Murder</a></span></div>

</figure><figure class="quote" id="q-61e1b01320" data-kw="">
<blockquote><p>We, on the other hand, declare with Paul that no law, whether it is human or divine, justifies or makes alive. Therefore we distinguish the Law from righteousness as sharply as death from life or hell from heaven. We are prompted to declare this by the clear statement of Paul: “The Law was not given in order to justify, make live, or save, but merely in order to condemn, kill, and destroy, contrary to the opinion of all men, who naturally suppose that the Law was given in order to obtain righteousness, life, and salvation.” Such a proper distinction between the function of the Law and that of the Gospel keeps all genuine theology in its correct use. It also establishes us believers in a position as judges over all styles of life and over all the laws and dogmas of men. Finally it provides us with a faculty for testing all the spirits (1 John 4:1). By contrast, because the papists have completely intermingled and confused the doctrine of the Law and that of the Gospel, they have been unable to teach anything certain either about faith or about works or about styles of life or about judging the spirits. And the same thing is happening to the sectarians today. After these refutations and arguments, therefore, Paul teaches, at some length and with considerable beauty, that if you consider the true and best use of the Law, it is nothing but some sort of discipline toward righteousness. It humbles men and makes them ready for the righteousness of Christ, if it performs its proper function, that is, if it makes them guilty, terrifies them, makes them conscious of sin, wrath, death, and hell. When this has happened, the presumption of their own righteousness and holiness disappears, and Christ, with His blessings, begins to become sweet. Therefore the Law is not against the promises of God; it is for them. Although it does not fulfill the promise and does not grant righteousness, still, in its use and function, it humbles us and thus makes us ready for the grace and blessing of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 331.</span></figcaption>

</figure><figure class="quote" id="q-da6a422848" data-kw="sabbath partly moral ceremonial">
<blockquote><p>Whether the first institution of the Sabbath was in the fourth commandment; and whether the commandment is partly moral, partly ceremonial. The former we deny; the latter we affirm. The true derivation of the word is from the verb shbhth (i.e., “to cease” or “to rest”), which relates either to the existence of a thing, when it ceases to be and fails, or to the operation of an agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.13.1</span></figcaption>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>

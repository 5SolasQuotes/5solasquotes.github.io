<main class="wrap"><figure class="quote" id="q-2e0d54db80" data-kw="">
<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653), on 2 Samuel, ch. 7, p. 390</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aabf01b0f3" data-kw="">
<blockquote><p>Assertion Two. Yet in other things there ought to be great respect had to offense, and men ought to be swayed accordingly in their practice, as the former reasons clear. As (1), if the matter is of light concernment in itself, as how men’s gestures are in their walking (suppose in walking softly, or quickly, with cloak or without) men ought to do, or abstain, as may prevent the construction of pride, lightness, etc., or give occasion to others in any of these. Of such sort was womens’ praying with their heads uncovered amongst the Corinthians, it being then taken for an evil sign. Yet if it is necessary, there is nothing little, as Moses will not leave a hoof (Ex. 10)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, (Edinburgh, 1659), pt. 1, ch. 6, pp. 25-26</span></figcaption>

</figure><figure class="quote" id="q-b2ae6493e6" data-kw="">
<blockquote><p>But, good friend, if really Christ and Scripture be your guide, I desire no more; tell me, and lay by partiality: Did not Christ and his apostles use both in the synagogues, Church, meetings and writings a faulty translation of the Old Testament, and as bad as ours. Deny it if you can for shame. Though sometimes they varied, they mostly used the Septuagint, according to which our faulty translation of the Old Testament is made, as it differs from the Hebrew. Is this no confutation of you? [(1)] Yea, Christ and the apostles used it the rather because it was in common use… I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not… How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ See also the whole of this article.</span></figcaption>

</figure><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 88</span></figcaption>

</figure><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ad1e725bd4" data-kw="">
<blockquote><p>For there are some who deny that a commonwealth is daily framed which, neglecting the political system of Moses, is ruled by the common laws of nations. Let other men consider our perilous and seditious this notion is.; it will be enough for me to have proved it false and foolish. We must bear in mind that common division of the whole law of God, administered by Moses, into moral, ceremonial, and judicial laws. And we must consider each of these parts, that we may understand what there is in them that pertains to us, and what does not. In the meantime, let no one be concerned over the small point that ceremonial and judicial laws also pertain to morals. For the ancient writers who taught this division, although they were not ignorant that these two latter parts had some bearing upon morals, still, because these could be changed or abrogated while morals remained untouched, did not call the, moral laws. They applied this name especially to the first part, without which the true holiness of morals cannot stand. The moral law (to begin first with it) is contained under two heads, one of which simply commands us to worship God with pure faith and piety; the other, to embrace men with sincere affection. Accordingly, it is the true and eternal rule of righteousness, prescribed for men of all nations and times, who wish to conform their lives to God’s will. For it is his eternal and unchangeable will that he himself indeed be worshipped by us all, and that we love one another. The ceremonial law was the tutelage of the Jews, with which it seemed good to the Lord to train this people, as it were, in their childhood, until the fullness of time should come…in order that he might fully manifest his wisdom to the nations, and show the truth of these things which then were foreshadowed in figures. The judicial law, given to them for civil government, imparted definite formulas of equity and justice, by which they might live together blamelessly and peaceably. Those ceremonial practices indeed properly belonged to the doctrine of piety (inasmuch as they kept the church of the Jews in service and reverence to God) and yet could be distinguished from piety itself. In like manner, the form of their judicial laws (although it had no other intent than how best to preserve that very love which is enjoined by God’s eternal law) had something distinct from the precept of love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1536 Edition, trans. F. L. Battles (Grand Rapids: Eerdmans, 1975), 6.48</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebdf5e31d2" data-kw="">
<blockquote><p>Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 150-51</span></figcaption>

</figure><figure class="quote" id="q-9e80044434" data-kw="">
<blockquote><p>And here comes in the way that general bond wherewith man is especially bound unto man, and that without taking away of humanity itself, cannot be broken; There is also another bond binding every citizen unto his country and city. But both these bonds I affirm to be natural and universal, that everyone must have regard of his estate, and calling; for some serve in public offices, either civil, or the ministry; the rest are private persons… …yet, lest in this case [of flight], any man by flattering of himself, might sin against his neighbour [in neglecting his duty towards him], it is the duty of a Christian magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0c98fff008" data-kw="">
<blockquote><p>For example, take the embryo; we affirm that this properly lives as soon as the heart partakes of life, although the other members of the body are not yet developed. Why, then, should we not say, that the spiritual embryo, from that very moment in which the heart is embued with spiritual life, is quickened or regenerated, although many parts of sanctification have not yet acquired their distinct, and, as it were, perfect development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge</cite>, p. 266 of Determination 9, ‘Free-will is not granted to the unregenerate for their spiritual good’ inThe Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridgetrans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“For example, take the embryo; we affirm that this properly lives as soon as the heart partakes of life, although the other members of the body are not yet developed. Why, then, should we not say, that the spiritual embryo, from that very moment in which the heart is embued with spiritual life, is quickened or regenerated, although many parts of sanctification have not yet acquired their distinct, and, as it were, perfect development.”

— John Davenant, p. 266 of Determination 9, ‘Free-will is not granted to the unregenerate for their spiritual good’ inThe Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridgetrans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+example%2C+take+the+embryo%3B+we+affirm+that+this+properly+lives+as+soon+as+the+heart+partakes+of+life%2C+although+the+other+members+of+the+body+are+not+yet+developed.+Why%2C+then%2C+should+we+not+say%2C+that+the+spiritual+embryo%2C+from+that+very+moment+in+which+the+heart+is+embued+with+spiritual+life%2C+is+quickened+or+regenerated%2C+although+many+parts+of+sanctification+have+not+yet+acquired+their+distinct%2C+and%2C+as+it+were%2C+perfect+development.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+p.+266+of+Determination+9%2C+%E2%80%98Free-will+is+not+granted+to+the+unregenerate+for+their+spiritual+good%E2%80%99+inThe+Determinations%2C+or+Resolutions+of+Certain+Theological+Questions%2C+Publicly+Discussed+in+the+University+of+Cambridgetrans.+Josiah+Allport+%281634%3B+1846%29+bound+at+the+end+of+John+Davenant%2C+A+Treatise+on+Justification%2C+or+the+Disputatio+de+Justitia...+trans.+Josiah+Allport+%281631%3B+London%2C+1846%29%2C+vol.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c98fff008.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c98fff008.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=For%20example%2C%20take%20the%20embryo%3B%20we,and%2C%20as%20it%20were%2C%20perfect%20development&amp;text=For%20example%2C%20take%20the%20embryo%3B%20we%20affirm%20that&amp;text=their%20distinct%2C%20and%2C%20as%20it%20were%2C%20perfect%20development" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59aa811627" data-kw="">
<blockquote><p>The human nature of Christ being thus formed in the womb by a creating act of the Holy Spirit, was in the instant of its conception sanctified, and filled with grace according to the measure of its receptivity… And this work of sanctification, or the original infusion of all grace into the human nature of Christ, was the immediate work of the Holy Spirit; which was necessary unto Him: for let the natural faculties of the soul, the mind, will, and affections, be created pure, innocent, undefiled,— as they cannot be otherwise immediately created of God,— yet there is not enough to enable any rational creature to live to God; much less was it all that was in Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3, ch. 4, p.168</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-987eca2792" data-kw="">
<blockquote><p>5. If there be nothing taken from the parents of which the soul is formed, then it is not traduced by natural generation: but there is nothing taken from the parents by which the soul is formed; for [otherwise] then in all abortions and miscarrying conceptions the seed of the soul would perish, and by consequence the soul itself would be corruptible, as having its original from corruptible seed. These and diverse other the like arguments are used to confirm the doctrine touching the creation of the reasonabl soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Passions &amp; Faculties of the Soul of Man</cite>, (London, 1640), ch. 32, p. 394</span></figcaption>

</figure><figure class="quote" id="q-0f4bb630d4" data-kw="">
<blockquote><p>What the period of embryonism is, and what the beginning of animation, neither Hippocrates, nor Galen, nor Aristotle know; but He knows who knows all things. For the precise definition of that matter is endured neither by the diversity of the seed itself from time to time, nor by the different disposition of the uterus or of the whole mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | But the foundation is slippery. For it is not certain to us from that passage that the reason for that law is a certain period of formation. From the same passage one could conclude that the fetus is animated on the seventh or fourteenth day, namely because the members are then conformed, although the perfect formation is extended to the fortieth or eightieth day, since even that is not simply necessary for the soul to be received. But he will prove it from the fact that the graver impurity is terminated on the eighth day, if she had borne a male, but on the fifteenth, if a female. Hurtado in the cited disputation, section 112, says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“What the period of embryonism is, and what the beginning of animation, neither Hippocrates, nor Galen, nor Aristotle know; but He knows who knows all things. For the precise definition of that matter is endured neither by the diversity of the seed itself from time to time, nor by the different disposition of the uterus or of the whole mother.”

t+is+therefore+expedient+to+know+when+it+is+animated.+%7C+But+the+foundation+is+slippery.+For+it+is+not+certain+to+us+from+that+passage+that+the+reason+for+that+law+is+a+certain+period+of+formation.+From+the+same+passage+one+could+conclude+that+the+fetus+is+animated+on+the+seventh+or+fourteenth+day%2C+namely+because+the+members+are+then+conformed%2C+although+the+perfect+formation+is+extended+to+the+fortieth+or+eightieth+day%2C+since+even+that+is+not+simply+necessary+for+the+soul+to+be+received.+But+he+will+prove+it+from+the+fact+that+the+graver+impurity+is+terminated+on+the+eighth+day%2C+if+she+had+borne+a+male%2C+but+on+the+fifteenth%2C+if+a+female.+Hurtado+in+the+cited+disputation%2C+section+112%2C+says%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0f4bb630d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0f4bb630d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=What%20the%20period%20of%20embryonism%20is,uterus%20or%20of%20the%20whole%20mother&amp;text=What%20the%20period%20of%20embryonism%20is%2C%20and%20what&amp;text=of%20the%20uterus%20or%20of%20the%20whole%20mother" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1c42a0f6ef" data-kw="">
<blockquote><p>Ver. 22. And yet no mischief follow,] i.e., No life be lost. There is a time, then, when the embryo is not alive; therefore the soul is not begotten, but infused after a time by God. Infundendo creatur, et creando infunditur, says Augustine, who at first doubted, till overcome by Jerome’s arguments.</p></blockquote>

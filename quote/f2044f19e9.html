<main class="wrap"><figure class="quote" id="q-f2044f19e9" data-kw="">
<blockquote><p>In this post, the Philadelphia Covenanter lands another blow against the New Perspective on Moses by pointing out that Christ upheld the true meaning of the so-called law of retaliation (Matthew 5:38-42) and the penal sanction against rebellious children (Matthew 15:4). Although advocates of the New Perspective on Moses are quick to accuse Judicial Calvinists with being legalists, the irony is that their position is actually that of the Pharisees rather than that of Jesus Christ:

The law of retaliation would seem to be taught by the light of nature […] It is evidently founded on the principles of immutable justice. It appears, however, to have been grossly abused by the Jews, for the purpose of private revenge. This the Redeemer forbids; but in no instance did he interfere with the province of the civil magistrate farther than to command his disciples to obey the laws which God had given to Moses. Matt. xxiii. 1. Could it be proved that Christ abrogated the law of retaliation, the same reasoning would prove that he had abrogated all law, and, consequently, all civil government. Moses commanded – “And he that curseth his father, or his mother, shall surely be put to death.” Exod. xxi. 17. This command the Scribes and Pharisees had set aside, probably under the pretence of its being a cruel law; but, for so doing, the Redeemer calls them hypocrites, and blind leaders of the blind. Matt. xx. 1-9, and 14. Mark vii. 6-13. Think of that ye advocated for the murderer – ye falsely merciful – ye vilifers of the law of Moses. Do ye pretend to be more compassionate than the Son of God? Do you understand, better than he, the demerit of crime, and the manner in which it should be punished? Do our pseudo-philanthropists know that there is such a passage in the gospel?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, pp 164-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-bae62eb49e" data-kw="">
<blockquote><p>Of this intellectual treasure house [the conscience], we are to know these: 1. That in the inner cabinet, the natural habit of moral principles lodges, the register of the common notions left in us by nature, the ancient records and chronicles which were in Adam’s time, the Law of Nature of two volumes: One of the first table, that there is a God, that He creates and governs all things, that there is but one God, infinitely good, more just rewarding the evil and the good; And of the second table, as to love our parents, obey superiors, to hurt no man, the acts of humanity; All these are written in the soul, in deep letters, yet the ink is dim and old, and therefore this light is like the moon swimming through watery clouds, often under a shadow, and yet still in the firmament. Caligula, and others, under a cloud, denied there was any God, yet when the cloud was over, the light broke out of prison, and granted, a God there must be; strong winds do blow out a torch in the night, and will blow in the same light again; and that there be other seeds, though come from a far land, and not growing out of the ground, as the former, is clear, for Christ scatters some Gospel-truths in this chalmer [chamber]; as John 7:28, ‘Then cried Jesus in the Temple; as He taught, saying, Ye both know Me, and whence I am.’ John 15:24, ‘But now they have both seen, and hated both Me and my Father.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 1, ‘Of Conscience &amp; its Nature’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-82acf8b81b" data-kw="">
<blockquote><p>Christ has not made pastors under-kings to create any laws morally obliging the conscience to obedience in the court of God, which God has not made to their hand; if the king and synods only declare and propound, by a power of jurisdiction, that which God in the Law of Nature or the written Word has commanded; they are not the Law-makers, nor creators of that morality in the Law, which lays bonds on the conscience; yea, they have no organical, nor inferior influence in creating that morality, God only by an immediate act as the only immediate king, made the morality, and if king, parliaments and synods be under kings and under Law-givers, they must have an under-action, and a ministerial, subservient, active influence under Christ in creating as second causes, that which is the formal reason, and essence of all laws binding the conscience, and that is the morality that obliges the soul to eternal wrath, though king, parliament, pastors or synods should never command such a moral thing: Now to propound, or declare, that God’s will is to be done in such an act, or synodical directory or canon, and to command it to be observed under civil and ecclesiastical pain, is not to make a law, it is indeed to act authoritatively under Christ as King: but it makes them neither kings, nor Law-givers, no more than heralds are little kings, or inferior law-givers, and parliaments, because in the name and authority of king and parliament they promulgate the laws of king and parliament: The heralds are mere servants, and do indeed represent king and parliament, and therefore to wrong them, in the promulgation of laws, is to wrong king and parliament; but the heralds had no action, no hand at all in making the laws; they may be made when all the heralds are sleeping, and so by no propriety of speech can heralds be called mediate kings, under-Lawgivers, just so here, as touching the morality of all human laws, whether civil or ecclesiastical, God Himself immediately, yea, from eternity by an act of his free-pleasure made that without advice of men or angels; for who instructed Him? Neither Moses, nor prophet, nor apostle; yea, all here are meri precones, only heralds; Yet are not all these heralds, who declare the morality of laws, [for] equals may declare them charitative[ly], by way of charity to equals; but these only are to be obeyed as heralds of laws, whom God has placed in authority, as kings, parliaments, synods, the Church, masters, fathers, captains; And it follows no ways that we disclaim the authority of all these because we will not enthrone them in the chair of the Supreme and only Lawgiver, and head of the Church; they are not under-Law-givers and little kings to create laws, the morality of which binds the conscience (for this God only can do); therefore, there be no parliaments, no kings, no rulers that have authority over men, it is a most unjust consequence; for all our divines, against Papists, deny that human laws, as human, do bind the conscience; but they deny not, but assert the power of jurisdiction in kings, parliaments, synods, pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

siastical, God Himself immediately, yea, from eternity by an act of his free-pleasure made that without advice of men or angels; for who instructed Him? Neither Moses, nor prophet, nor apostle; yea, all here are meri precones, only heralds; Yet are not all these heralds, who declare the morality of laws, [for] equals may declare them charitative[ly], by way of charity to equals; but these only are to be obeyed as heralds of laws, whom God has placed in authority, as kings, parliaments, synods, the Church, masters, fathers, captains; And it follows no ways that we disclaim the authority of all these because we will not enthrone them in the chair of the Supreme and only Lawgiver, and head of the Church; they are not under-Law-givers and little kings to create laws, the morality of which binds the conscience (for this God only can do); therefore, there be no parliaments, no kings, no rulers that have authority over men, it is a most unjust consequence; for all our divines, against Papists, deny that human laws, as human, do bind the conscience; but they deny not, but assert the power of jurisdiction in kings, parliaments, synods, pastors.”

<main class="wrap"><figure class="quote" id="q-8fb028cac0" data-kw="">
<blockquote><p>Thomas looks at providence and Scripture and explores three historic views of God’s sovereignty: 1. Classic or Augustinian-Calvinistic, 2. Arminian or ‘simple divine foreknowledge’, and 3. Molinism, which introduces the concept of ‘middle knowledge’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/booklet.html">Derek Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Is Providence?</cite>, 2008 booklet</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thomas looks at providence and Scripture and explores three historic views of God’s sovereignty: 1. Classic or Augustinian-Calvinistic, 2. Arminian or ‘simple divine foreknowledge’, and 3. Molinism, which introduces the concept of ‘middle knowledge’.”

— Booklet, What is Providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThomas+looks+at+providence+and+Scripture+and+explores+three+historic+views+of+God%E2%80%99s+sovereignty%3A+1.+Classic+or+Augustinian-Calvinistic%2C+2.+Arminian+or+%E2%80%98simple+divine+foreknowledge%E2%80%99%2C+and+3.+Molinism%2C+which+introduces+the+concept+of+%E2%80%98middle+knowledge%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Booklet%2C+What+is+Providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8fb028cac0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8fb028cac0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/middle-knowledge/#:~:text=Thomas%20looks%20at%20providence%20and%20Scripture,introduces%20the%20concept%20of%20%E2%80%98middle%20knowledge&amp;text=Thomas%20looks%20at%20providence%20and%20Scripture%20and%20explores&amp;text=Molinism%2C%20which%20introduces%20the%20concept%20of%20%E2%80%98middle%20knowledge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75b8794a35" data-kw="">
<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect</cite>, [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.”

— Johann F. Stapfer, ‘On the Attributes Dependent upon the Divine Intellect [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7CCCXXII.+God%2C+in+knowing+Himself%2C+also+knows+whatever+involves+no+contradiction%2C+that+is%2C+what+is+possible+in+itself%3B+for+that+is+called+possible+which+involves+no+contradiction.+%C2%A7CCCXXIII.+Things+are+therefore+possible+because+God+represents+to+Himself+in+His+intellect+that+they+involve+no+contradiction%3B+consequently%2C+something+is+possible+because+God+represents+it+to+Himself+in+His+intellect+as+such.+%C2%A7CCCXXIV.+Hence+it+is+evident+that+all+possibility+of+things+is+from+God%2C+and+that+His+intellect+is+the+fountain+or+root+of+all+possibility.%E2%80%9D%0A%0A%E2%80%94+Johann+F.+Stapfer%2C+%E2%80%98On+the+Attributes+Dependent+upon+the+Divine+Intellect+%5Bon+God+as+the+Source+of+Possibility%5D%E2%80%99+in+Universal+Institutes+of+Polemical+Theology%2C+vol.+1+4th+ed.+%281757%29%2C+section+3%2C+propositions+321-70%2C+pp.+78-90+trans.+AI+at+Reformed+Sources+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75b8794a35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75b8794a35.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-possibilities-hypotheticals/#:~:text=CCCXXII.%20God%2C%20in%20knowing%20Himself%2C%20also,fountain%20or%20root%20of%20all%20possibility&amp;text=CCCXXII.%20God%2C%20in%20knowing%20Himself%2C%20also%20knows%20whatever&amp;text=is%20the%20fountain%20or%20root%20of%20all%20possibility" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-121e5da622" data-kw="">
<blockquote><p>Indeed, God is the idea of all things, both created and to be created, as He manifests His simple and perfect essence in them, though not equally or in the same degree. Just as this essence shines more brightly in animate beings than in inanimate ones, so it is most perfectly reflected in man. While other creatures were given only a trace or shadow of His being, in which His eternal power and divine nature can be read (ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης), as Romans 1:20 states, man was endowed with His image, reflecting His most perfect nature, and with faculties and qualities that are somewhat shared with God but not with other creatures. This is why, concerning man’s creation, it is said that not merely a general notion of God was involved, but a deliberate consultation and agreement of the entire Holy Trinity, as Genesis 1:27 indicates. I. …the phrases “man created in the image of God” and “the image of God in man” essentially mean the same thing. The former suggests that the Divine Essence, which knows the nature of man as a species that can be expressed or imitated, serves as the model or objective image. The latter indicates something consequent to that model, which will be called the subjective image, in which the Creator willed His glory to be seen as in a mirror, as Calvin states in his Institutes (Book 2, Chapter 12, Sections 5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom">
<blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</span></figcaption>

</figure><figure class="quote" id="q-ff0bb50d01" data-kw="">
<blockquote><p>Furthermore, one ought to know that the Arminians have fabricated a third category in the divine knowledge; they call this knowledge middle or conditioned knowledge according to which God knows a certain event He has never decreed. But this is absurd. Because nothing happens what God did not decree, Thr 3,37 [Lam. 3:37].</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

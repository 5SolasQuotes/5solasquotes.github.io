<blockquote><p>for they [the Scots] plead not for deposing or dethroning of kings, but only for resisting and withstanding them, when they carry a hostile mind against them… and are seeking the ruin and destruction of their own subjects. They plead only, that, in that case the people may, and are bound before God, to defend themselves when their religion (which ought to be dearer to them than anything else) is sought to be taken away, or altered, and service-books, or mass books, and the like, tyrannically obstruded upon them.</p></blockquote>

</figure><figure class="quote" id="q-bf60db601c" data-kw="">
<blockquote><p>The State, considered in its corporate character, is a MORAL PERSON, with a moral standing and responsibility. It is not the creation of the so-called social compact or of the popular will, but a divine institution based on natural religion. It coheres by a moral and religious bond; and its rulers are the lieutenants of God. If the State is a moral person, capable of performing duty, of committing sin, and suffering punishment, which everyone must own who traces the fate of nations according to the divine word, it follows that a nation, acting by its rulers, can accept Christianity and make a public profession of it as the national rule and guide. It had been held together previous to the recognition of Christianity by some form of religion however impure, without which it could not have existed. And the first duty of the civil ruler when brought in contact with Christianity and persuaded of its divine origin is to RECEIVE THE BIBLE AS A REVELATION in a national way. The immediate effect of this is that it constitutes the State a Christian State, and pledges it to purge out its previous religion in the same way as Pagan and Mahommedan nations constituted themselves, according to their false religions, or as the atheistic state was constituted, or rather attempted to be constituted, by the French Convention. A nation must have a religion, and the only question is, which it will adopt. And when Christianity comes to the nation, or to the family, it does not frown on either of these institutions, which also are divine in origin, but enters into them with an elevating purifying power, and sweetly coalesces with all that is purely human in both. These ordinances of God now became vessels by which Christianity is diffused. The national recognition of the Bible as a revelation subjecting the nation to its authority, though a great step gained, does not exhaust the nation’s duty, as widely diverging views prevail upon the right interpretation of the Bible. The State must by the necessity of the case ADOPT A CREED which will commonly be prepared by the Church. The same duty that devolves upon an individual Christian confronts a Christian State, and it naturally appends the civil sanction to the Church’s creed. It must distinguish between scripture truth and its perversion. The State, by the adoption of a creed, gives utterance to the self-consciousness of a Christian community. It confesses the Christianity it has adopted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Theory of Ecclesiastical Establishments and How Far the Theory is Realised (1875)</cite>, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-87f1be735e" data-kw="">
<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On how Circa Sacra flows out of the 4th Commandment: | The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal… (1659), pt. 3, ch. 13</cite>, pp. 241-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<main class="wrap"><figure class="quote" id="q-65274d9d9b" data-kw="">
<blockquote><p>19. To prohibit the reading of Scripture is impious, to concede it by peculiar dispensation is ridiculous, for he who has the Lord’s command has no need of the dispensation of servants. 20. To accuse Scripture of obscurity and ambiguity, and imperfection, and other defects of this kind, is to confess that one’s religion is handed down in it only obscurely and imperfectly, and neither can be drawn entire from it nor resolved entire into it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Theological Disputations (Disputationum Theologicarum Miscellaneorum Pars Prima)</cite>, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’</span></figcaption>

<blockquote><p>[Prophecy] is taken most strictly and properly for that full and august revelation of the mysteries of salvation which Christ (as the highest teacher of the church) has exhibited to us. It is not comprehended under the priesthood or under the kingly office, but constitutes a distinct part of the mediatorial office—the prophetic. Public teachers and ministers of the church are prophets in a wider sense, in which sense “the spirits of the prophets are subject to the prophets” (1 Cor. 14:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.7.1b</span></figcaption>

</figure><figure class="quote" id="q-353437fd6b" data-kw="">
<blockquote><p>The light of nature, which is a spark of the will of God, has taught many useful rules even to pagans, anent the right way of making solemn speeches before others, the most of which are to be applied to preaching with due discretion; so that what is thought unseemly in the one is to be avoided in the other. But the best rules are taken from the preachings of Christ, of the apostles and prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’, in Scottish Puritans: Select Biographies</cite>, vol. 1, p. 288</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-af417d0dd5" data-kw="">
<blockquote><p>As a minister who has tolerable gifts for preaching may yet need the writings of other men before hand, and may bring both their matter and method into the pulpit, yea and oft times their words; so that though he have gifts, yet being weak, he may use the gifts of others. I have been counseled since I was silenced [in 1662] to compose sermons myself and give them in writing to some weak minister that has an excellent voice and utterance and to let him preach them. And really if I had not known that such have good books enough at hand for such a use, I think I should have done it: And who can prove that this had been his sin? And yet this was a using of another man’s gifts instead of his own. And I have heard men that are much against parish churches and liturgies wish that some unlearned men of good utterance might read some excellent sermon books to the people in ignorant places that can get no better: And who can prove the reading of a homily unlawful?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 32, p. 182</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

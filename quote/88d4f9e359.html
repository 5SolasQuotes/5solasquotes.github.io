<main class="wrap"><figure class="quote" id="q-88d4f9e359" data-kw="">
<blockquote><p>This is an advertisement very needful; because many are apt to skip over the lesson concerning the means (that will fill up this whole treatise) as superfluous and useless. When once they know the nature and excellency of the duties of the law, they account nothing wanting but diligent performances; and they rush blindly on immediate practice, making more haste than good speed. They are quick in promising, ‘All that the Lord has spoken, we will do,’ (Exod. 19:8), without sitting down and counting the cost. They look on holiness as only the means of an end, of eternal salvation: not as an end itself, requiring any great means for attaining the practice of it. The enquiry of most, when they begin to have a sense of religion, is ‘What good thing shall I do, that I may have eternal life?’ (Matt. 19:16); not, ‘How shall I be enabled to do anything that is good?’ Yea, many that are accounted powerful preachers spend all their zeal in the earnest pressing the immediate practice of the law, without any discovery of the effectual means of performance – as if the works of righteousness were like those servile employments that need no skill and artifice at all, but industry and activity. That you may not stumble at the threshold of a religious life by this common oversight, I shall endeavor to make you sensible that it is not enough for you to know the matter and reason of your duty, but that you are also to learn the powerful and effectual means of performance before you can successfully apply yourselves to immediate practice. And, for this end, I shall lay before you the considerations following. …Sanctification, by which our hearts and lives are conformed to the law, is a grace of God communicated to us by means, as well as justification, and by means of teaching, and learning something that we cannot see without the Word (Acts 26:17, 18). There are several things pertaining to life and godliness that are given through knowledge (2Peter 1:2, 3). There is a form of doctrine made use of by God to make people free from sin, and servants of righteousness (Rom. 6:17, 18). And there are several pieces of the whole armor of God necessary to be known and put on, that we may stand against sin and Satan in the evil day (Eph. 6:13). Shall we slight and overlook the way of sanctification, when the learning the way of justification has been accounted worth so many elaborate treatises?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (An interview on this work. More resources on sanctification)</span></figcaption>

<blockquote><p>…but [nonconformists] will keep all loving correspondence with them [parish churches], and seasonably sometimes communicate with them to show their principles by their practice. For the benefit of Christian love and concord, may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They prefer their own manner of worshipping God, as better than the Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

</figure><figure class="quote" id="q-dfe248856c" data-kw="">
<blockquote><p>I have also no difficulty in conceding to you that there is nothing more perilous to our salvation than a distorted and perverse worship of God. The primary rudiments by which we are wont to train to piety those whom we wish to win as disciples to Christ, are these: not to frame any new worship of God for themselves at random and their own pleasure, but to know that the only legitimate worship is that which he himself approved from the beginning. For we maintain, what the sacred oracle declared, that obedience is more excellent than any sacrifice (1 Sam. 15:22). In short, we train them by every means to keep within the one rule of worship which they have received from his mouth, and bid farewell to all fictitious worship.</p></blockquote>

<blockquote><p>I respond: It was a common rite, in species and form, from custom or practice then and there received; it was accustomed to be used as a sign of love, friendship, familiarity, even of subjection, etc. On this rite: the Philology &amp; Antiquary of [John de] Pineda [1558–1637, a Jesuit] on Job 31:27 has informed. Out of theologians other than Pineda: Aretius, pt. 3, [Jean de] Lorinus [1559-1634, a Jesuit] and [Andrew] Rivet on Ps. 2; and Lorinus in the same has cited Joseph Stephanus in the Tractate on Kissing the Feet of the Pontiff.”, p. 466 Gyongyosi, Paul – Kisses of Love &amp; Hate, on Song 1:2 &amp; 6:3 &amp; Prov. 27:6; a Dissertation on the Holy Kiss (Rom. 16:17) &amp; its Opposite, the Kiss of Jude (Lk. 22:48) &amp; of the Mysteries of them Illustrated by the Sacred Scriptures, by Christ the Lord of Love, Grace &amp; Eternal Wrath… (Frankfurt, 1738) 18 pp. Gyongyosi (1668-1743) was a German reformed professor of theology at Frankfurt, Germany. . Lutheran Willemer, Johann Helvicus – Out of the Words of Ps. 2:12, ‘Kiss the Son’, Against Some of the Borne Distortions of the Jews (Wittenburg, 1704) 35 pp. Mayer, Johann Friedrich – A Tract on Kissing the Feet of the Roman Pointiff 2nd ed. (Leipzig, 1714) Mayer (1650-1712) was a German, Lutheran professor of theology at Wittenberg, Kiel and Greifswald. . . On Foot Washing &amp; Shaking the Dust Off of One’s Feet Bible Verses Dust of the Feet Isa. 49:23 “And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their face toward the earth, and lick up the dust of thy feet;</p></blockquote>

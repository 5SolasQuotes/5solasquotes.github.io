<main class="wrap"><figure class="quote" id="q-aae76ef111" data-kw="">
<blockquote><p>Overconfidence follows when a man strives to fulfill the Law by works, by trying hard to do as the words of the Law command. He serves God, doesn’t swear, honors father and mother, doesn’t kill, doesn’t commit adultery, and the like. But meanwhile he does not look into his heart, does not realize with what motives he leads a good life, and conceals the old rogue in his heart with such a fine life. For if he would truly examine his heart, he would realize that he is doing everything with aversion and under compulsion, that he fears hell or seeks heaven, if he does not seek much less, namely, honor, property, health, and fear of disgrace, hurt, or afflictions. In short, he would have to confess that he would rather live differently if the consequences of such a life did not restrain him, for he does not act purely for the sake of the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Year in the Gospels with Martin Luther</cite>, (p. 62). Concordia Publishing. Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62ee9817dc" data-kw="">
<blockquote><p>‘My son, give me thy heart.’ Our love of God ought to be with all the heart. As the abounding of infidelity, justifies an attempt to show the reasonableness of christian doctrines ; so the neglect of vital and experimental practice, requires us to show the danger of a general declension in this respect, and that many, whose doctrines are right, are perishing through want of obedience in heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathan-strong.html">Nathan Strong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Various Subjects: Doctrinal, Experimental &amp; Practical</cite>, vol. 1, 2 (Hartford: Hudson, 1798 &amp; 1800) ToC 1, 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

</figure><figure class="quote" id="q-88a6de98b6" data-kw="">
<blockquote><p>Many appear to have an apprehension, that religion is something designed only for the benefit of another world. That if we can have it at the time of death, the whole which religion can give will be attained. Such an idea arises from an utter experimental ignorance what religion is. True religion is the most perfect blessedness of rational beings, in every possible state of existence ; in this world, at death and through eternity. By the present comforts of religion, a pious mind obtains the highest conviction, that it is impossible there should be a state of perfect blessedness, without a holy temper and practice.</p></blockquote>

</figure><figure class="quote" id="q-2451e0e4fa" data-kw="">
<blockquote><p>The principal design of preaching the Gospel is, that men may be reconciled to God, and this is accomplished by the unconditional pardon of sins; as Paul also informs us, when he calls the Gospel, on this account, the ministry of reconciliation, (2 Cor. 5:18.) Many other things, undoubtedly, are contained in the Gospel, but the principal object which God intends to accomplish by it is, to receive men into favour by not imputing their sins. If, therefore, we wish to show that we are faithful ministers of the Gospel, we must give our most earnest attention to this subject; for the chief point of difference between the Gospel and heathen philosophy lies in this, that the Gospel makes the salvation of men to consist in the forgiveness of sins through free grace. This is the source of the other blessings which God bestows, such as, that God enlightens and regenerates us by his Spirit, that he forms us anew to his image, that he arms us with unshaken firmness against the world and Satan. Thus the whole doctrine of godliness, and the spiritual building of the Church, rests on this foundation, that God, having acquitted us from all sins, adopts us to be his children by free grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, trans. William Pringle (Bellingham, WA: Logos Bible Software, 2010), 2.271.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

</figure><figure class="quote" id="q-6141bce93a" data-kw="">
<blockquote><p>Be often in the Scriptures. That&#x27;s an Heavenly Book, and will best cure an Earthly heart. To converse with the world, will make you worldly, but to converse with God, will make you heavenly.</p></blockquote>

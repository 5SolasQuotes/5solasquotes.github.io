<main class="wrap"><figure class="quote" id="q-4c98abbb44" data-kw="">
<blockquote><p>Some people have remained Covenanters just because of tradition. They attend services and follow the Covenanter manner of worship just because they are in the habit of doing so. They cannot give any real Bible reasons for their Covenanter faith and practice. If you ask them why they do not vote in political elections, they can only reply that voting is against the principles of the Covenanter Church. They are like the little girl who was asked why we do not have organs in our churches. She replied solemnly, ”We don’t because we’re Covenanters, and Covenanters don’t.” The person who is a Covenanter merely because of custom or tradition is not really a Covenanter at heart. His loyalty is not a conscientious loyalty to the truth of God; it is merely a blind loyalty to church tradition. This is a very poor reason for being a Covenanter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-g-vos.html">J. G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Why be a Covenanter? in Blue Banner Faith and Life</cite></span></figcaption>

<blockquote><p>2nd Proposition. There may be different sentiments without separation. And hence the apostle exhorts all to “forbear one another in love” (Eph. 4:1-6), and to “walk by the same rule whereunto we have already attained.” [Phil. 3:15-16] If the sentiments of all were the same, there had not been need for any such exhortation. As long as we see but in part, as we think others should allow us to differ from them, we ought to forbear such as differ from us, I mean in things not fundamental.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite>, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 2, In which sundry propositions anent separation are laid down</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ooks Online</a></div>
</figure><figure class="quote" id="q-f7e51e1ba8" data-kw="">
<blockquote><p>Like so many other efforts at reforming life in Protestant churches, Pietism and Methodism were right in their opposition to dead orthodoxy. Originally their intention was only to arouse a sleeping Christianity; they wished not to bring about a change in the confession of the Reformation but only to apply it in life. Yet, out of an understandable reaction, they frequently went too far in this endeavor and swung to another extreme. They, too, gradually shifted the center of gravity from the objective to the subjective work of salvation. In this connection it makes essentially no difference whether one makes salvation dependent on faith and obedience or on faith and experience. In both cases humanity itself steps into the foreground. Even though Pietism and Methodism did not deny the acquisition of salvation by Christ, they did not use this doctrine or relate it in any organic way to the application of salvation. It was, so to speak, dead capital. The official activity of the exalted Christ, the Lord from heaven, was overshadowed by the experiences of the subject. In Pietism, instead of being directed toward Christ, people were directed toward themselves. They had to travel a long road, meet all sorts of demands and conditions, and test themselves by numerous marks of genuineness before they might believe, appropriate Christ, and be assured of their salvation. Methodism indeed tried to bring all this—conversion, faith, assurance—together in one indivisible moment, but it systematized this method, in a most abbreviated way, in the same manner as Pietism. In both there is a failure to appreciate the activity of the Holy Spirit, the preparation of grace, and the connection between creation and re-creation. That is also the reason why in neither of them does the conversion experience lead to a truly developed Christian life. Whether in Pietistic fashion it withdraws from the world or in Methodist style acts aggressively in the world, it is always something separate, something that stands dualistically alongside the natural life, and therefore does not have an organic impact on the family, society, and the state, on science and art. With or without the Salvation Army uniform, Christians are a special sort of people who live not in but outside the world. The Reformation antithesis between sin and grace has more or less made way for the Catholic antithesis between the natural and the supernatural. Puritanism has been exchanged for asceticism. The essence of sanctification now consists in abstaining from ordinary things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, trans. H. Bolt, J. Vriend (Grand Rapids, MI: Baker Academic, 2006), 3.567–68.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-45698d906a" data-kw="">
<blockquote><p>The Papists repeat the Apostles’ Creed, but they do not believe it in the Apostles’ meaning. Now it is evident that a new sense doth make a new Creed. But they are not so modest as to content themselves with this grand corruption, though weak delusion, for they have added new Articles of faith to our old Creed, they have composed a Trent-Creed, and they will not admit any man into their Communion, who believes the Apostles’ Creed, unless he will believe this Trent-Creed.</p></blockquote>

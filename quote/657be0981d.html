<main class="wrap"><figure class="quote" id="q-657be0981d" data-kw="">
<blockquote><p>The name of the Lord is often put for the Lord himself; so that that who fear the Lord are in the habit of thinking upon his nature and his attributes—the dealings of his providence and the wonders of his grace. … But, while the power of thinking upon God is granted to man alone of his creatures here below, do all men avail themselves of the power which so honourably distinguishes them? Alas! alas! there is a numerous class of whom it is written, “God is not in all their thoughts.” The ungodly, the very term by which they are described, tell us that “they do not like to retain God in their knowledge;” that “they live without God in the world;” and “walk in the way of their own heart, and in the sight of their own eyes.”

But, blessed be God, there is another class who love God, and fear God, and think on his name. They remember that he is Jehovah, the uncreated, the self-existing God; that he is the Almighty—possessed of all power—and that his goodness and wisdom and mercy are equal to his power. They remember with thankfulness that not only has he made himself known as Jehovah-Nissi—, the Lord my banner, but as Jehovah-Tsidkenu—the Lord our Righteousness. Is it not delightful for a God-fearing people to think on the name of the Lord, when, through Christ, they can address this good, and wise, and all-powerful God as their heavenly Father?

They think on his works; and all his works praise Him: the earth, which he created out of nothing, by the word of his power—the heavens, which he stretched forth as a curtain, as a tabernacle in which he might dwell—the sun, which he made to rule the day, and the moon to rule the night. They think not only on his power and wisdom, manifested in the creation of man, and of the various living creatures which inhabit the earth, but they think also on the kindness of his providence in bountifully supplying the returning wants of the countless creatures he has formed. They remember that the kind care of Providence is not confined to man, nor even to the birds of the air, or the beasts of the field; but is extended to myriads of myriads of minute creatures, whether they creep on the earth, or fly in the air, or wanton in the watery element.

But, above all, they delight to think on the greatest of all his great works, the work of Redemption through Jesus Christ his Son. Here mercy—the loveliest attribute of his character—shines forth. Here mercy and truth have met together, and righteousness and peace have kissed each other. In this he has magnified his law and made it honourable. By this he can be just and yet the justifier of the ungodly. Their meditation on his glorious name and blessed attributes is sweet; and it is necessary for closer communion with him and with increasing conformity to him.

It would be altogether inconsistent with their character as the children of God, were they not to think on him. Would we think a son affectionate, were he never to think of his father in a foreign country, though from that distant land he were sending him many tokens of paternal kindness, and making the richest provision for his education, and for his comfortable support? And could we for a moment think of ranking him among the children of God, who never thought of him who watches over us with more than a father’s kindness, and who offers us a rich inheritance in the world to come?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-landsborough.html">David Landsborough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Benefits of Religious Converse, and the Blessings Promised to those who engage in it in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Now because lots may say to cards what Naomi said to Boaz, ‘They are near unto us, and of our affinity,’ something also of the use of them. It were no great harm if there were no other cards used than those of clothiers about wool and of mariners in the ship. But as for cards to play with, let us not wholly condemn them, lest lacing our consciences too straight we make them to grow awry on the wrong side. Such recreations are lawful if we use them as Jonathan tasted the honey, putting forth the end of his rod he touched a little of it, and his eyes were cleared. But let us take heed of a surfeit into which those do fall who either play out of covetousness, or for more than their estates can bear, or constantly and continually; all their meat is sauce, all the days in their almanac play-days, though few holy-days. The Creation lasted but a week, but these men’s recreations all the days of their lives; such using of lawful exercises is altogether unlawful.</p></blockquote>

<blockquote><p>What say you of that part, [Quest.] which is Typical and Ceremonial?

Though they cease and be abolished as to our practice, [Answ.] yet they are perpetual, and still a part of holy scripture, as for our teaching and learning, The Types and figures of the Law are a kind of Prophesies, for they do in certain Actions set forth Christ to come, and the benefits by him; as the Prophets did by their words and writings, they still teach and instruct, and we may fetch Arguments of faith and duty from them, as Paul doth in the Epistle to the Hebrews, and other places (as for example) if the Question be between us and the Socinians, whether Christ by dying did make Atonement for sin. We say, yea, and the Law and the daily Burnt offerings and sin offerings doe teach the same: if ye ask of the manner how? Answer, it is by sprinkling the sinner, (that is) by applying it to our own souls.

If the question be about Ministers and their maintenance, in the New Testament the Apostle proves it to be the peoples duty from the Law. 1 Cor. 9.7. Who goes a warfare at his own Charge? That’s Paul’s Argument; Ministers must be paid as well as soldiers, and he fortifies his reason by Testimony of old Testament ver. 8. Say I these things as a man? Or saith not the Law the same? For it is written in the Law of Moses, Thou shalt not muzzle the mouth of the Ox, that treadeth out the Corn; The same proof he uses upon another occasion. 1 Tim. 5.17.18.

But Paul’s proof is faulty, because it is a Ceremonial proof, [Obj.] and so denies Christ to be come in the flesh.

God intended in that Law, to teach us something, [Answ.] that is moral, (namely) that God doth take care for Ministers, and for his Labourers in his word, more than for Oxen; and if that Law be written for our sakes; then why may not other things written in the Ceremonial Law, teach a moral duty, as well as that? The Ceremonial law, as it doth set forth Christ, so also the duty of Christians in their holy administrations: Thus the Purging out of Leaven, did teach the putting away of filthy affections from our holy services, and polluted people from the society of the Church, 1 Cor. 5.7.13. So the sprinkling of the unclean, doth teach, that when we present any service to the Lord, we must renew our repentance, and not come with defiled hearts or hands, 1 Tim. 2.8. By the consecrating of the first fruits we are taught, that we ought to be consecrated as holy unto the Lord, as a kind of first fruits of his creatures, Jam. 1.18. Rev. 14.4.

We are not subject to those Ordinances to do them, we offer not the sacrifices, because Christ is come; yet look what they signify, they teach, and they serve for our learning, as is said.

But there is Heb. 7.18. [Obj.] A disannulling of the Commandment for the weakness and unprofitableness of it.

The meaning is this, [Answ. 1] that the blood of those sacrifices did not take away sin by any power or virtue, that was in them; they of themselves are weak and beggarly, if any body should rest in them, as the Carnal Jews did; and therefore, he says, those Ordinances were to cease, and give place, when the true Sacrifice, Jesus Christ was offered; which alone did and could take away sin; The law made nothing perfect, but in their relative use and end, they did lead unto Christ, that better hope, who made all perfect; For his blood served for the redemption of sins and transgressions, which were committed under the first Testament. So that the way of Salvation taught then in Types, and now without them; the substance of the Covenant is one and the same, only that former manner of Administering waxeth old, and is put into a new way, which is significantly expressed, Heb. 7.12.

There is … not an abolishing of the substance of the Covenant, but a Transposition of it into another way; As a Tenant, that holds by Copy, if he obtain to hold in Fee, the latter grant doth indeed actually null the former Tenure, yet not the former Benefit, his Tenure is mended, being changed into Fee simple: So the coming of the New Testament doth better our Tenure, but alters not the Promises, Commands, Counsels in the Old. For as the substance of the Priesthood was not to end, as having no more a being on the Earth, but only translated upon other persons. I will take of the Gentiles for Priests and Levites: So the matter of the Covenant was not destroyed, and taken quite away, but only changed into another Form, other Sacraments, and yet the same; other for the Sign, the same for Substance, the same spiritual meat and drink, the same Rock, Jesus Christ.

I answer, [Answ. 2] That when the Apostle there speaks of disannulling the Old Testament, he doth not mean the Books of the Old Testament, but that old manner of publishing, administering, and applying the Covenant.

The Books of the Old Testament had Christ for their principal scope and subject. Moses wrote of me, if ye believe Moses, you would believe me, if ye believe not Moses, ye cannot soundly believe the Apostles: Thus they reasoned and persuaded the things concerning Jesus out of the Law, and Prophets. Wherefore we conclude, that the Scriptures of the Old Testament, are to be retained still in force, as the good Word of God written for our learning, and a Word that still speaks unto us as unto Children, in Doctrines, in Exhortations, in Consolations.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“What say you of that part, [Quest.] which is Typical and Ceremonial?

Though they cease and be abolished as to our practice, [Answ.] yet they are perpetual, and still a part of holy scripture, as for our teaching and learning, The Types and figures of the Law are a kind of Prophesies, for they do in certain Actions set forth Christ to come, and the benefits by him; as the Prophets did by their words and writings, they still teach and instruct, and we may fetch Arguments of faith and duty from them, as Paul doth in the Epistle to the Hebrews, and other places (as for example) if the Question be between us and the Socinians, whether Christ by dying did make Atonement for sin. We say, yea, and the Law and the daily Burnt offerings and sin offerings doe teach the same: if ye ask of the manner how? Answer, it is by sprinkling the sinner, (that is) by applying it to our own souls.

If the question be about Ministers and their maintenance, in the New Testament the Apostle proves it to be the peoples duty from the Law. 1 Cor. 9.7. Who goes a warfare at his own Charge? That’s Paul’s Argument; Ministers must be paid as well as soldiers, and he fortifies his reason by Testimony of old Testament ver. 8. Say I these things as a man? Or saith not the Law the same? For it is written in the Law of Moses, Thou shalt not muzzle the mouth of the Ox, that treadeth out the Corn; The same proof he uses upon another occasion. 1 Tim. 5.17.18.

But Paul’s proof is faulty, because it is a Ceremonial proof, [Obj.] and so denies Christ to be come in the flesh.

God intended in that Law, to teach us something, [Answ.] that is moral, (namely) that God doth take care for Ministers, and for his Labourers in his word, more than for Oxen; and if that Law be written for our sakes; then why may not other things written in the Ceremonial Law, teach a moral duty, as well as that? The Ceremonial law, as it doth set forth Christ, so also the duty of Christians in their holy administrations: Thus the Purging out of Leaven, did teach the putting away of filthy affections from our holy services, and polluted people from the society of the Church, 1 Cor. 5.7.13. So the sprinkling of the unclean, doth teach, that when we present any service to the Lord, we must renew our repentance, and not come with defiled hearts or hands, 1 Tim. 2.8. By the consecrating of the first fruits we are taught, that we ought to be consecrated as holy unto the Lord, as a kind of first fruits of his creatures, Jam. 1.18. Rev. 14.4.

We are not subject to those Ordinances to do them, we offer not the sacrifices, because Christ is come; yet look what they signify, they teach, and they serve for our learning, as is said.

But there is Heb. 7.18. [Obj.] A disannulling of the Commandment for the weakness and unprofitableness of it.

The meaning is this, [Answ. 1] that the blood of those sacrifices did not take away sin by any power or virtue, that was in them; they of themselves are weak and beggarly, if any body should rest in them, as the Carnal Jews did; and therefore, he says, those Ordinances were to cease, and give place, when the true Sacrifice, Jesus Christ was offered; which alone did and could take away sin; The law made nothing perfect, but in their relative use and end, they did lead unto Christ, that better hope, who made all perfect; For his blood served for the redemption of sins and transgressions, which were committed under the first Testament. So that the way of Salvation taught then in Types, and now without them; the substance of the Covenant is one and the same, only that former manner of Administering waxeth old, and is put into a new way, which is significantly expressed, Heb. 7.12.

There is … not an abolishing of the substance of the Covenant, but a Transposition of it into another way; As a Tenant, that holds by Copy, if he obtain to hold in Fee, the latter grant doth indeed actually null the former Tenure, yet not the former Benefit, his Tenure is mended, being changed into Fee simple: So the coming of the New Testament doth better our Tenure, but alters not the Promises, Commands, Counsels in the Old. For as the substance of the Priesthood was not to end, as having no more a being on the Earth, but only translated upon other persons. I will take of the Gentiles for Priests and Levites: So the matter of the Covenant was not destroyed, and taken quite away, but only changed into another Form, other Sacraments, and yet the same; other for the Sign, the same for Substance, the same spiritual meat and drink, the same Rock, Jesus Christ.

I answer, [Answ. 2] That when the Apostle there speaks of disannulling the Old Testament, he doth not mean the Books of the Old Testament, but that old manner of publishing, administering, and applying the Covenant.

The Books of the Old Testament had Christ for their principal scope and subject. Moses wrote of me, if ye believe Moses, you would believe me, if ye believe not Moses, ye cannot soundly believe the Apostles: Thus they reasoned and persuaded the things concerning Jesus out of the Law, and Prophets. Wherefore we conclude, that the Scriptures of the Old Testament, are to be retained still in force, as the good Word of God written for our learning, and a Word that still speaks unto us as unto Children, in Doctrines, in Exhortations, in Consolations.”

— William Lyford, The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ, (London: Richard Royston, 1655), pp 43-45.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+say+you+of+that+part%2C+%5BQuest.%5D+which+is+Typical+and+Ceremonial%3F%0A%0AThough+they+cease+and+be+abolished+as+to+our+practice%2C+%5BAnsw.%5D+yet+they+are+perpetual%2C+and+still+a+part+of+holy+scripture%2C+as+for+our+teaching+and+learning%2C+The+Types+and+figures+of+the+Law+are+a+kind+of+Prophesies%2C+for+they+do+in+certain+Actions+set+forth+Christ+to+come%2C+and+the+benefits+by+him%3B+as+the+Prophets+did+by+their+words+and+writings%2C+they+still+teach+and+instruct%2C+and+we+may+fetch+Arguments+of+faith+and+duty+from+them%2C+as+Paul+doth+in+the+Epistle+to+the+Hebrews%2C+and+other+places+%28as+for+example%29+if+the+Question+be+between+us+and+the+Socinians%2C+whether+Christ+by+dying+did+make+Atonement+for+sin.+We+say%2C+yea%2C+and+the+Law+and+the+daily+Burnt+offerings+and+sin+offerings+doe+teach+the+same%3A+if+ye+ask+of+the+manner+how%3F+Answer%2C+it+is+by+sprinkling+the+sinner%2C+%28that+is%29+by+applying+it+to+our+own+souls.%0A%0AIf+the+question+be+about+Ministers+and+their+maintenance%2C+in+the+New+Testament+the+Apostle+proves+it+to+be+the+peoples+duty+from+the+Law.+1+Cor.+9.7.+Who+goes+a+warfare+at+his+own+Charge%3F+That%E2%80%99s+Paul%E2%80%99s+Argument%3B+Ministers+must+be+paid+as+well+as+soldiers%2C+and+he+fortifies+his+reason+by+Testimony+of+old+Testament+ver.+8.+Say+I+these+things+as+a+man%3F+Or+saith+not+the+Law+the+same%3F+For+it+is+written+in+the+Law+of+Moses%2C+Thou+shalt+not+muzzle+the+mouth+of+the+Ox%2C+that+treadeth+out+the+Corn%3B+The+same+proof+he+uses+upon+another+occasion.+1+Tim.+5.17.18.%0A%0ABut+Paul%E2%80%99s+proof+is+faulty%2C+because+it+is+a+Ceremonial+proof%2C+%5BObj.%5D+and+so+denies+Christ+to+be+come+in+the+flesh.%0A%0AGod+intended+in+that+Law%2C+to+teach+us+something%2C+%5BAnsw.%5D+that+is+moral%2C+%28namely%29+that+God+doth+take+care+for+Ministers%2C+and+for+his+Labourers+in+his+word%2C+more+than+for+Oxen%3B+and+if+that+Law+be+written+for+our+sakes%3B+then+why+may+not+other+things+written+in+the+Ceremonial+Law%2C+teach+a+moral+duty%2C+as+well+as+that%3F+The+Ceremonial+law%2C+as+it+doth+set+forth+Christ%2C+so+also+the+duty+of+Christians+in+their+holy+administrations%3A+Thus+the+Purging+out+of+Leaven%2C+did+teach+the+putting+away+of+filthy+affections+from+our+holy+services%2C+and+polluted+people+from+the+society+of+the+Church%2C+1+Cor.+5.7.13.+So+the+sprinkling+of+the+unclean%2C+doth+teach%2C+that+when+we+present+any+service+to+the+Lord%2C+we+must+renew+our+repentance%2C+and+not+come+with+defiled+hearts+or+hands%2C+1+Tim.+2.8.+By+the+consecrating+of+the+first+fruits+we+are+taught%2C+that+we+ought+to+be+consecrated+as+holy+unto+the+Lord%2C+as+a+kind+of+first+fruits+of+his+creatures%2C+Jam.+1.18.+Rev.+14.4.%0A%0AWe+are+not+subject+to+those+Ordinances+to+do+them%2C+we+offer+not+the+sacrifices%2C+because+Christ+is+come%3B+yet+look+what+they+signify%2C+they+teach%2C+and+they+serve+for+our+learning%2C+as+is+said.%0A%0ABut+there+is+Heb.+7.18.+%5BObj.%5D+A+disannulling+of+the+Commandment+for+the+weakness+and+unprofitableness+of+it.%0A%0AThe+meaning+is+this%2C+%5BAnsw.+1%5D+that+the+blood+of+those+sacrifices+did+not+take+away+sin+by+any+power+or+virtue%2C+that+was+in+them%3B+they+of+themselves+are+weak+and+beggarly%2C+if+any+body+should+rest+in+them%2C+as+the+Carnal+Jews+did%3B+and+therefore%2C+he+says%2C+those+Ordinances+were+to+cease%2C+and+give+place%2C+when+the+true+Sacrifice%2C+Jesus+Christ+was+offered%3B+which+alone+did+and+could+take+away+sin%3B+The+law+made+nothing+perfect%2C+but+in+their+relative+use+and+end%2C+they+did+lead+unto+Christ%2C+that+better+hope%2C+who+made+all+perfect%3B+For+his+blood+served+for+the+redemption+of+sins+and+transgressions%2C+which+were+committed+under+the+first+Testament.+So+that+the+way+of+Salvation+taught+then+in+Types%2C+and+now+without+them%3B+the+substance+of+the+Covenant+is+one+and+the+same%2C+only+that+former+manner+of+Administering+waxeth+old%2C+and+is+put+into+a+new+way%2C+which+is+significantly+expressed%2C+Heb.+7.12.%0A%0AThere+is+%E2%80%A6+not+an+abolishing+of+the+substance+of+the+Covenant%2C+but+a+Transposition+of+it+into+another+way%3B+As+a+Tenant%2C+that+holds+by+Copy%2C+if+he+obtain+to+hold+in+Fee%2C+the+latter+grant+doth+indeed+actually+null+the+former+Tenure%2C+yet+not+the+former+Benefit%2C+his+Tenure+is+mended%2C+being+changed+into+Fee+simple%3A+So+the+coming+of+the+New+Testament+doth+better+our+Tenure%2C+but+alters+not+the+Promises%2C+Commands%2C+Counsels+in+the+Old.+For+as+the+substance+of+the+Priesthood+was+not+to+end%2C+as+having+no+more+a+being+on+the+Earth%2C+but+only+translated+upon+other+persons.+I+will+take+of+the+Gentiles+for+Priests+and+Levites%3A+So+the+matter+of+the+Covenant+was+not+destroyed%2C+and+taken+quite+away%2C+but+only+changed+into+another+Form%2C+other+Sacraments%2C+and+yet+the+same%3B+other+for+the+Sign%2C+the+same+for+Substance%2C+the+same+spiritual+meat+and+drink%2C+the+same+Rock%2C+Jesus+Christ.%0A%0AI+answer%2C+%5BAnsw.+2%5D+That+when+the+Apostle+there+speaks+of+disannulling+the+Old+Testament%2C+he+doth+not+mean+the+Books+of+the+Old+Testament%2C+but+that+old+manner+of+publishing%2C+administering%2C+and+applying+the+Covenant.%0A%0AThe+Books+of+the+Old+Testament+had+Christ+for+their+principal+scope+and+subject.+Moses+wrote+of+me%2C+if+ye+believe+Moses%2C+you+would+believe+me%2C+if+ye+believe+not+Moses%2C+ye+cannot+soundly+believe+the+Apostles%3A+Thus+they+reasoned+and+persuaded+the+things+concerning+Jesus+out+of+the+Law%2C+and+Prophets.+Wherefore+we+conclude%2C+that+the+Scriptures+of+the+Old+Testament%2C+are+to+be+retained+still+in+force%2C+as+the+good+Word+of+God+written+for+our+learning%2C+and+a+Word+that+still+speaks+unto+us+as+unto+Children%2C+in+Doctrines%2C+in+Exhortations%2C+in+Consolations.%E2%80%9D%0A%0A%E2%80%94+William+Lyford%2C+The+plain+man%E2%80%99s+senses+exercised+to+discern+both+good+and+evil%2C+or%2C+A+discovery+of+the+errors%2C+heresies%2C+and+blasphemies+of+these+times+and+the+toleration+of+them%2C+as+they+are+collected+and+testified+against+by+the+ministers+of+London%2C+in+their+testimony+to+the+truth+of+Jesus+Christ%2C+%28London%3A+Richard+Royston%2C+1655%29%2C+pp+43-45.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe41bff2444.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e41bff2444.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/23/william-lyford-on-the-ceremonial-laws-setting-forth-moral-principles/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>

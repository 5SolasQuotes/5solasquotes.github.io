<blockquote><p>The end of creation is double: supreme and subaltern. The supreme is the glory of God the creator, Prov. 16:4; Ps. 8:1; 19:1; 145:10; Rom. 11:36. The subaltern is the communication and manifestation of the same. For in the works of creation God both communicated his goodness, because He made all things very good, Gen. 1:31…</p></blockquote>

</figure><figure class="quote" id="q-4027e08688" data-kw="">
<blockquote><p>When Moses writes that God created Heaven and Earth and whatever is in them in six days, then let this period continue to have been six days, and do not venture to devise any comment according to which six days were one day. But, if you cannot understand how this could have been done in six days, then grant the Holy Spirit the honor of being more learned than you are. For you are to deal with Scripture in such a way that you bear in mind that God Himself says what is written. But since God is speaking, it is not fitting for you wantonly to turn His word in the direction you wish to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Luther Says. A Practical In-Home Anthology for the Active Christian</cite>, ed. Ewald M. Plass (St. Louis: Concordia, 1959), p. 1523</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-fa789451f9" data-kw="">
<blockquote><p>As it is of the law of nature that, in general, a due proportion of time be set apart for the worship of God; so, in his Word, by a positive, moral, and perpetual commandment, binding all men in all ages, he hath particularly appointed one day in seven for a Sabbath, to be kept holy unto him:a which, from the beginning of the world to the resurrection of Christ, was the last day of the week; and, from the resurrection of Christ, was changed into the first day of the week,b which in Scripture is called the Lord’s day,c and is to be continued to the end of the world, as the Christian Sabbath.d a. Exod 20:8, 10-11; Isa 56:2, 4, 6-7. • b. Gen 2:2-3; Acts 20:7; 1 Cor 16:1-2. • c. Rev 1:10. • d. Exod 20:8, 10 with Mat 5:17-18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 21.7</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e82430356a" data-kw="">
<blockquote><p>That civil and religious society, and, where revelation is enjoyed, church and state, with their respective authorities, are distinct and mutually independent, in their proper line and employment, will readily be granted by all who have just notions of the subject. But societies and powers which are distinct and independent, may have common objects about which they are employed, and may act in these with harmony and co-operation. Religion is an object of common interest to mankind, and as it enters into, and deeply affects the various relations in which they stand connected with one another, becomes an object of attention and care to all. Magistrates, Ministers, Masters and Parents have all a distinct and peculiar concern with it; and the authority of each may be employed about it, without encroaching on the business, or usurping the powers of others. Inattention to this general view of religion, and the connection which it necessarily has with the various relations of life, lies at the foundation of many of the modern errors which prevail upon the subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-661fb6a393" data-kw="">
<blockquote><p>For the nation and kingdom that will not serve thee shall perish, yea, those nation shall be utterly wasted.” (Isaiah 60:12) …

If the expression does not ascribe to the Church any control over the State, it still more clearly forbids the idea that the State may exercise control over the Church. This, indeed, if it were at all permitted, would be to reverse the statement of the text, and to make out the line of duty to be, not that nations should serve the Church, but that the Church should serve the nations of the earth.

Whatever subjection the Church, both collectively and in her individual members, may give the State in civil things, she is not only free from this subjection in spiritual matters — that is, in all those things in which she is a church — in all those matters in which her being as a Church consists — but is warranted to expect and to claim the service of the State. Not only will the fulfilment of the prediction in the text “make an end of the Erastian controversy,” [George Gillespie] — the mere announcement should have prevented its rise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-lumsden.html">James Lumsden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Nations to the Church, and their Danger in Neglecting it in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>146. What is a COVENANT?

A Covenant is an agreement between two parties, on certain conditions.

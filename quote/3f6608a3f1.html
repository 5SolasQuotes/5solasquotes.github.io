<main class="wrap"><figure class="quote" id="q-3f6608a3f1" data-kw="">
<blockquote><p>OF all other parts of the holy Bible, this Book of the Psalms, (penned for the most part by David, the sweet Singer of Israel, and a man after God’s own heart) is stuffed and filled with greatest plenty and variety of precious Lessons and instructions unto eternal life. The choice and flower of all things profitable and comfortable for the right course of a Christian life, is therein briefly contained, and very movingly and feelingly expressed.

In them we may be acquainted with the Majesty and Mysteries of God, with the Sufferings of Christ, with unfeigned Repentance, unwearied Patience, spiritual Wisdom, and wonderful Courage of the godly man, and true Christian. In them we may behold the terrors of Wrath, and the anguishes of an afflicted Conscience, the comforts of Grace, and great Deliverances, the wonderful works of Providence over this World, and the promised joys of that World which is to come. In a word, all good necessarily to be either known or done, or had, is plentifully, as out of a rich Treasury, revealed and offered unto us in these heavenly Songs of David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A three-fold treatise containing the saints’ sure and perpetual guide. Self-enriching examination. Soul-fattening fasting. Or, meditations, concerning the word, the sacrament of the Lord’s Supper, and fasting</cite>, (London: E. Purslow, 1634), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b579acfb7d" data-kw="">
<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm</cite>, (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-43d87fcc7d" data-kw="">
<blockquote><p>I should be too tedious if I should stand to reckon up the manifold mercies that God hath bestowed on this our land, beyond all the world besides, our peace, and plenty, with the Gospel of Christ, our many, and great deliverances… God hath delivered us from the Spanish invasion, and the Gun-powder treason, and hath placed us in a wealthy land. ‘Be ye therefore filled with the Spirit’ (saith our prophet David) ‘speaking to yourselves in Psalms, and Hymns, and spiritual songs’: and here I might speak of the godly care of our Church, which hath ordained singing of Psalms, both before, and after sermon, and indeed are very fitting to be sung in order, for the better stirring up of our affections. And here I have a just cause to task them of the Separation, who will not admit of any set form of prayer, for that (as they say) is cursing of the Spirit; but why then should we have a set form of singing? For my part it shall ever have my allowance and I think that these their ex tempore prayers sounds as harshly in the ears of heaven, as diverse Psalms sung together in several tunes would in ours.</p></blockquote>

</figure><figure class="quote" id="q-a6e684dc8d" data-kw="">
<blockquote><p>But it can be proved by perfectly sufficient evidence that the terms “hymns” and “songs” are actually different names for the inspired Psalms, and must have been perfectly familiar as such to the Ephesians and Colossians. The terms “psalms, and hymns, and songs” are all employed as titles to different psalms in the inspired collection in the Septuagint translation of the Old Testament into the Greek language. Moreover, in Colossians iii. 16, the command to sing psalms and hymns and song is prefaced by the expression, “Let the word of Christ dwell in you richly;” and then there follow the participial clauses, “speaking to one another, and singing with grace,” as explanatory of the command about the word of Christ, and showing, we think, unmistakably that the psalms, hymns, and songs are all “the word of Christ,” or portions of his inspired psalmody. Besides, the word “spiritual” following all three terms, as it does in the Greek, may more rationally be regarded as qualifying all three than only the last one, and may without violence he translated “inspired.” The command would then be to sing the psalms, hymns, and songs given by the Spirit of God for that purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Our songs must be spiritual:

1. For matter, not profane.

2. They must proceed from God’s Spirit, as the Author of them (see v. 17 and Ps. 37:4).

3. Must be framed with honest and gracious words beseeming the Spirit…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-30672bf3d8" data-kw="">
<blockquote><p>Because it may be thought expedient that these things for a time be borne withal; for it may perhaps produce this effect, that these contentions may be avoided, by the which contentions there is great peril, lest greater and far more important benefits be hindered; and lest the minds of men be at the first beginning turned from the Gospel, as we see it come to pass; Martyr. ibid., fol. 1085 [p. 119]. Because, if the parity of doctrine and of faith do remain entire, the pastors may openly teach and press unto their flocks such doctrine as may serve to take away offenses arising by the use of these ceremonies; Beza, Epist. 12, fol. 99. … Because if some things in their nature indifferent be imposed it is not meet too eagerly to contend about such matters; especially when as we see those magistrates by whom the light of the Gospel is much furthered in England, and by whose authority it may much more be furthered, to oppose themselves against us; Peter Martyr, ibid., fol. 1085 [p. 120], to Hooper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, pp. 165-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

t%20expedient%20that%20these&amp;text=Martyr%2C%20ibid.%2C%20fol.%201085%20%5Bp.%20120%5D%2C%20to%20Hooper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cd7397674" data-kw="">
<blockquote><p>That which hinders the Church’s edification by the ruler’s fault, it may be the people’s duty to obey for a greater good. For instance, it is less edifying to use our old singing psalms than a better version. And yet for concord, if the ruler appoint them, the people must use them because concord with that imperfection is better than to sing everyone a several better version or diverse versions at once. So a faulty translation of Scripture, a weak sermon, an inconvenient hour and place, when concord is necessary and cannot be had in the more edifying circumstances, it must be had in the best way we can. If the sheriff appoint an unfit time and place to meet to choose parliament-men, it’s a duty to comply rather than not to meet at all. Every evil so far excludes good, and yet we must not renounce communion in all good where men mix any evil lest we also give over all good ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 68</span></figcaption>

</figure><figure class="quote" id="q-9175423189" data-kw="">
<blockquote><p>After Christ, I pray tell me, how long did the churches continue without superstitious mixtures? I doubt you will find the Church has not been long free; but we do not find separation presently and nulling of ministers. As now men should do well to give us a precept or example out of the Word where ordinances have been dispensed true for the substance, though some human mixtures have been joined to them, that therefore they were iterated [repeated].</p></blockquote>

</figure><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-eb61408690" data-kw="">
<blockquote><p>XXVIII… Gathering new churches by way of separation from others, or gathering assemblies without the consent of the lawful pastors who had the charge of the people of those assemblies, is a sin and schism in all these cases following: 1. In general, when the laws, practices or persons of the church which they separate from give them no sufficient cause of a departure. 2. In general, when in the judgment of true reason, according to the notable evidence of the case, the said assemblies are likely to do more hurt than good. 3. When such assemblies are gathered in opposition to some truth which the separaters would thereby disown (e.g. infant-baptism, the lawfulness of [some] set-forms of praise or prayer, or any sound doctrine) or [they are gathered] for the profession and propagation of some heresy or error (as Antinomianism, Popery, etc.). 4. When such churches are gathered by men that have no true fitness and calling for the sacred ministry or the work which they undertake. 5. When they are gathered by the pride of the ministers that would thereby unduly set up themselves and draw away disciples after them, or by their covetousness, seeking not the good of the flock, but the fleece, not them, but theirs, not serving the Lord Jesus, but their own bellies: or when gathered, by the pride of the people that unjustly think those that they separate from [are] men unworthy of their communion, and say to them, ‘Come not near to us; we are holier than you,’ Isa. 65:5. 6. When they are gathered by a quarrelsome passion, falling out with the pastors and people whom they separate from. The parting of Paul and Barnabas [Acts 15:36-40] had some evil in it. 7. When they are gathered to encourage and strengthen a sinful faction or party, or when men separate from others for fear of being censured by such a party, as Peter did withdraw from the gentile Christians lest he should displease the erroneous Jews, Gal. 2. 8. When it is done out of a proud overvaluing of men’s own opinions, or some odd singularity whereby men cannot bear those that are not of their mind, or whereby they would fain be more conspicuous as more orthodox and wise than others. 9. When it is done mistakingly to set up some wrong course of Church government or worship (as that the people may have the power of the keys or of examining and judging all admitted members, or that Papal government or the mass may be introduced, [or for] enthusiastical disorderly talking by pretended inspiration, by ignorant uncalled men, or to introduce such traditions and superstitions as the Papists use, etc.). 10. When it is done upon a false conceit that a man’s presence with any Church that has known error or faults in doctrines or worship is guilty [of] approving them; and therefore that they must separate from all such. 11. When they separate out of an unruliness of spirit, because they will not be governed by their lawful pastors in lawful things, as time, place, order, etc. or because a minor part in elections is over-voted by the major part and cannot have their wills. 12. When they separate out of a profaneness of mind, not enduring the power of the preacher’s doctrine or the holiness and discipline of the Church, but would be licentious, while they would be called religious. All these are unlawful separations and assemblings. 13. Yet that which is unlawful as to the principle, end and manner secundum quid [‘according to that’], is not always unlawful simply and in the thing itself, for a proud, covetous, turbulent person may sinfully do a lawful thing. XXIX… When pastors by concord or magistrates by laws have settled lawful circumstances or accidents of Church order or worship, or discipline, though they be in particular but human institutions, it is sinful disobedience to violate them without necessary reason, e.g. parochial order, associations, times, places, ministers, maintenance, Scripture-translations, etc. XXX… When able, faithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gathering of Separate Churches | The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6, pp. 47-49 &amp; 51-58, 85, 100-2, 118 | When Gathering of Separate Worship Assemblies or Churches is Schismatic</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXVIII… Gathering new churches by way of separation from others, or gathering assemblies without the consent of the lawful pastors who had the charge of the people of those assemblies, is a sin and schism in all these cases following: 1. In general, when the laws, practices or persons of the church which they separate from give them no sufficient cause of a departure. 2. In general, when in the judgment of true reason, according to the notable evidence of the case, the said assemblies are likely to do more hurt than good. 3. When such assemblies are gathered in opposition to some truth which the separaters would thereby disown (e.g. infant-baptism, the lawfulness of [some] set-forms of praise or prayer, or any sound doctrine) or [they are gathered] for the profession and propagation of some heresy or error (as Antinomianism, Popery, etc.). 4. When such churches are gathered by men that have no true fitness and calling for the sacred ministry or the work which they undertake. 5. When they are gathered by the pride of the ministers that would thereby unduly set up themselves and draw away disciples after them, or by their covetousness, seeking not the good of the flock, but the fleece, not them, but theirs, not serving the Lord Jesus, but their own bellies: or when gathered, by the pride of the people that unjustly think those that they separate from [are] men unworthy of their communion, and say to them, ‘Come not near to us; we are holier than you,’ Isa. 65:5. 6. When they are gathered by a quarrelsome passion, falling out with the pastors and people whom they separate from. The parting of Paul and Barnabas [Acts 15:36-40] had some evil in it. 7. When they are gathered to encourage and strengthen a sinful faction or party, or when men separate from others for fear of being censured by such a party, as Peter did withdraw from the gentile Christians lest he should displease the erroneous Jews, Gal. 2. 8. When it is done out of a proud overvaluing of men’s own opinions, or some odd singularity whereby men cannot bear those that are not of their mind, or whereby they would fain be more conspicuous as more orthodox and wise than others. 9. When it is done mistakingly to set up some wrong course of Church government or worship (as that the people may have the power of the keys or of examining and judging all admitted members, or that Papal government or the mass may be introduced, [or for] enthusiastical disorderly talking by pretended inspiration, by ignorant uncalled men, or to introduce such traditions and superstitions as the Papists use, etc.). 10. When it is done upon a false conceit that a man’s presence with any Church that has known error or faults in doctrines or worship is guilty [of] approving them; and therefore that they must separate from all such. 11. When they separate out of an unruliness of spirit, because they will not be governed by their lawful pastors in lawful things, as time, place, order, etc. or because a minor part in elections is over-voted by the major part and cannot have their wills. 12. When they separate out of a profaneness of mind, not enduring the power of the preacher’s doctrine or the holiness and discipline of the Church, but would be licentious, while they would be called religious. All these are unlawful separations and assemblings. 13. Yet that which is unlawful as to the principle, end and manner secundum quid [‘according to that’], is not always unlawful simply and in the thing itself, for a proud, covetous, turbulent person may sinfully do a lawful thing. XXIX… When pastors by concord or magistrates by laws have settled lawful circumstances or accidents of Church order or worship, or discipline, though they be in particular but human institutions, it is sinful disobedience to violate them without necessary reason, e.g. parochial order, associations, times, places, ministers, maintenance, Scripture-translations, etc. XXX… When able, faithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.”

— Richard Baxter, Gathering of Separate Churches | The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6, pp. 47-49 &amp; 51-58, 85, 100-2, 118 | When Gathering of Separate Worship Assemblies or Churches is Schismatic">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVIII%E2%80%A6+Gathering+new+churches+by+way+of+separation+from+others%2C+or+gathering+assemblies+without+the+consent+of+the+lawful+pastors+who+had+the+charge+of+the+people+of+those+assemblies%2C+is+a+sin+and+schism+in+all+these+cases+following%3A+1.+In+general%2C+when+the+laws%2C+practices+or+persons+of+the+church+which+they+separate+from+give+them+no+sufficient+cause+of+a+departure.+2.+In+general%2C+when+in+the+judgment+of+true+reason%2C+according+to+the+notable+evidence+of+the+case%2C+the+said+assemblies+are+likely+to+do+more+hurt+than+good.+3.+When+such+assemblies+are+gathered+in+opposition+to+some+truth+which+the+separaters+would+thereby+disown+%28e.g.+infant-baptism%2C+the+lawfulness+of+%5Bsome%5D+set-forms+of+praise+or+prayer%2C+or+any+sound+doctrine%29+or+%5Bthey+are+gathered%5D+for+the+profession+and+propagation+of+some+heresy+or+error+%28as+Antinomianism%2C+Popery%2C+etc.%29.+4.+When+such+churches+are+gathered+by+men+that+have+no+true+fitness+and+calling+for+the+sacred+ministry+or+the+work+which+they+undertake.+5.+When+they+are+gathered+by+the+pride+of+the+ministers+that+would+thereby+unduly+set+up+themselves+and+draw+away+disciples+after+them%2C+or+by+their+covetousness%2C+seeking+not+the+good+of+the+flock%2C+but+the+fleece%2C+not+them%2C+but+theirs%2C+not+serving+the+Lord+Jesus%2C+but+their+own+bellies%3A+or+when+gathered%2C+by+the+pride+of+the+people+that+unjustly+think+those+that+they+separate+from+%5Bare%5D+men+unworthy+of+their+communion%2C+and+say+to+them%2C+%E2%80%98Come+not+near+to+us%3B+we+are+holier+than+you%2C%E2%80%99+Isa.+65%3A5.+6.+When+they+are+gathered+by+a+quarrelsome+passion%2C+falling+out+with+the+pastors+and+people+whom+they+separate+from.+The+parting+of+Paul+and+Barnabas+%5BActs+15%3A36-40%5D+had+some+evil+in+it.+7.+When+they+are+gathered+to+encourage+and+strengthen+a+sinful+faction+or+party%2C+or+when+men+separate+from+others+for+fear+of+being+censured+by+such+a+party%2C+as+Peter+did+withdraw+from+the+gentile+Christians+lest+he+should+displease+the+erroneous+Jews%2C+Gal.+2.+8.+When+it+is+done+out+of+a+proud+overvaluing+of+men%E2%80%99s+own+opinions%2C+or+some+odd+singularity+whereby+men+cannot+bear+those+that+are+not+of+their+mind%2C+or+whereby+they+would+fain+be+more+conspicuous+as+more+orthodox+and+wise+than+others.+9.+When+it+is+done+mistakingly+to+set+up+some+wrong+course+of+Church+government+or+worship+%28as+that+the+people+may+have+the+power+of+the+keys+or+of+examining+and+judging+all+admitted+members%2C+or+that+Papal+government+or+the+mass+may+be+introduced%2C+%5Bor+for%5D+enthusiastical+disorderly+talking+by+pretended+inspiration%2C+by+ignorant+uncalled+men%2C+or+to+introduce+such+traditions+and+superstitions+as+the+Papists+use%2C+etc.%29.+10.+When+it+is+done+upon+a+false+conceit+that+a+man%E2%80%99s+presence+with+any+Church+that+has+known+error+or+faults+in+doctrines+or+worship+is+guilty+%5Bof%5D+approving+them%3B+and+therefore+that+they+must+separate+from+all+such.+11.+When+they+separate+out+of+an+unruliness+of+spirit%2C+because+they+will+not+be+governed+by+their+lawful+pastors+in+lawful+things%2C+as+time%2C+place%2C+order%2C+etc.+or+because+a+minor+part+in+elections+is+over-voted+by+the+major+part+and+cannot+have+their+wills.+12.+When+they+separate+out+of+a+profaneness+of+mind%2C+not+enduring+the+power+of+the+preacher%E2%80%99s+doctrine+or+the+holiness+and+discipline+of+the+Church%2C+but+would+be+licentious%2C+while+they+would+be+called+religious.+All+these+are+unlawful+separations+and+assemblings.+13.+Yet+that+which+is+unlawful+as+to+the+principle%2C+end+and+manner+secundum+quid+%5B%E2%80%98according+to+that%E2%80%99%5D%2C+is+not+always+unlawful+simply+and+in+the+thing+itself%2C+for+a+proud%2C+covetous%2C+turbulent+person+may+sinfully+do+a+lawful+thing.+XXIX%E2%80%A6+When+pastors+by+concord+or+magistrates+by+laws+have+settled+lawful+circumstances+or+accidents+of+Church+order+or+worship%2C+or+discipline%2C+though+they+be+in+particular+but+human+institutions%2C+it+is+sinful+disobedience+to+violate+them+without+necessary+reason%2C+e.g.+parochial+order%2C+associations%2C+times%2C+places%2C+ministers%2C+maintenance%2C+Scripture-translations%2C+etc.+XXX%E2%80%A6+When+able%2C+faithful+pastors+are+lawfully+set+over+the+assemblies+by+just+election+and+ordination%2C+if+any+will+causelesly+and+without+right+silence+them%2C+and+command+the+people+to+desert+them%2C+and+to+take+others+for+their+pastors+in+their+stead%2C+of+whom+they+have+no+such+knowledge+as+may+encourage+them+to+such+a+change%2C+we+cannot+defend+this+from+the+charge+of+schism%2C+which+puts+a+congregation+on+so+hard+a+means+of+concord+as+to+judge+whether+they+are+bound+to+that+pastor+that+was+set+over+them+as+Christ+appointed%2C+or+must+renounce+him+and+take+the+other+when+they+are+commanded.+So+Cyprian+in+the+case+of+Novatian+says+that+he+could+be+no+bishop+because+another+was+rightful+bishop+before.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Gathering+of+Separate+Churches+%7C+The+Nonconformists%E2%80%99+Plea+for+Peace%2C+or+an+Account+of+their+Judgment+in+Certain+Things+in+which+they+are+Misunderstood%E2%80%A6+%28London%2C+1679%29%2C+sect.+6%2C+pp.+47-49+%26+51-58%2C+85%2C+100-2%2C+118+%7C+When+Gathering+of+Separate+Worship+Assemblies+or+Churches+is+Schismatic&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb61408690.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb61408690.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Gathering%20new%20churches%20by%20way%20of,because%20another%20was%20rightful%20bishop%20before&amp;text=Gathering%20new%20churches%20by%20way%20of%20separation%20from&amp;text=no%20bishop%20because%20another%20was%20rightful%20bishop%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

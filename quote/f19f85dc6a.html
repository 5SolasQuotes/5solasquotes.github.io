<main class="wrap"><figure class="quote" id="q-f19f85dc6a" data-kw="">
<blockquote><p>It is asked whether a reward is promised to works as signs of faith. We judge that those say too much who think it is promised to works as a meritorious cause; nor do we think they say enough who suppose the promise is made only to them as signs of faith. For there are many passages of Scripture by which it is plainly established that our works, in the matter of salvation, are regarded as a cause without which not, or as a preceding condition, which has the reward of eternal life inseparably connected with it (Mt. 25:34; Rev. 7:14, etc.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam. | Thesis 10, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12ba2291d7" data-kw="">
<blockquote><p>…you must know therefore that righteousness is no proper real being, but a modus entis, ‘the modification of a being’. The subject of it is: 1. an action, 2. or a person. An action is the primary subject, and so the disposition; and the person secondary, as being therefore righteous, because his disposition and actions are so. Righteousness is the conformity of dispositions and actions, and consequently the person to the rule prescribed. It is not a being distinct therefore from the dispositions and actions, but their just and well being. This [de]finition is only of the creatures’ righteousness. God is the Primum Iustum, and so the rule of righteousness to the creature, and has no rule but Himself for the measuring of his actions. Yet his essence is too far above us, remote and unknown to be this rule to the creature, therefore has He given us his laws, which flow from his perfection, and they are the immediate rule of our dispositions and actions and so of our righteousness. Here carefully observe, that this law has two parts:

1. The precept and prohibition prescribing and requiring duty:

2. The promise and commination [threatening] determining of the reward of obedience, and penalty of disobedience. As the precept is the principal part, and the penalty annexed but for the precept’s sake; so the primary intent of the lawgiver is the obeying of his precepts, and our suffering of the penalty is but a secondary for the attaining of the former. So is there accordingly a two-fold Righteousness or fulfilling of this law, (which is the thing I would have observed): the primary, most excellent and most proper Righteousness lies in the conformity of our actions to the precept: The secondary, less excellent righteousness) yet fitly enough so called) (see Pemble, Of Justification, p. 2) is, when though we have broke the precepts, yet we have satisfied for our breach, either by our own suffering, or some other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 16, pp. 62-64</span></figcaption>

</figure><figure class="quote" id="q-07278ea79a" data-kw="">
<blockquote><p>This remission is not propounded or promised in the gospel, but on the condition of duty to be performed, so that he can never be partaker of it that neglects this. The same must be said of the illative ‘for’, Mt. 25:35.</p></blockquote>

</figure><figure class="quote" id="q-0820d8d034" data-kw="">
<blockquote><p>Upon believing, or with believing (I shall explain it by and by) the whole right of salvation is given us; but all the holiness and works we have do not serve for the right, but only we are led through them to the possession of it. You have it said in 2 Thess. 2:13 that we are saved through faith and sanctification. But the Apostle here [in Eph. 2:8-10] orders them, how through faith, and how through sanctification. He speaks in common of both there; here, so through faith as not through sanctification. ‘Not of works,’ saith he. How shall we solve that? This is the clear distinction of it. We are saved through faith, as that which gives us the present right, or that which God doth then give as a judge, when we believe, before faith hath done a whit of work else; but we are led through sanctification and good works to the possession of salvation. Distinguish the right and the possession, and you have clearly the Apostle’s meaning; for, saith he, ‘he hath ordained good works, that we should walk in them,’ as being already ‘saved through faith,’ which he speaks before that.</p></blockquote>

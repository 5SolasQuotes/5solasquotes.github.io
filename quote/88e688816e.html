<blockquote><p>…of order such as the middle has to the end, the antecedent to the consequent, the necessary condition to the effect, of which condition the presence indeed does not effect, but the absence can hinder, salvation;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af730605b1" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… and as the cause which is called a sine qua non [without which: none]… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes</cite>, (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on, p. 670</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… and as the cause which is called a sine qua non [without which: none]… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.”

— Jerome Zanchi, ‘Whether Good Works are the Cause of Eternal Salvation?’ in Of the Nature of God, or of the Divine Attributes (Neustadt, 1593), Book 5, ch. 2, after Of Predestination in General, Question 6, Other Part, Of the Predestination of the Saints, Question 3, after the Thesis, pp. 670-71, begins bottom of left column on, p. 670">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+absolutely+deny%2C+that+good+works+are+a+cause+of+salvation%2C+viz.%2C+an+instrumental+rather+than+an+efficient+one%E2%80%A6+and+as+the+cause+which+is+called+a+sine+qua+non+%5Bwithout+which%3A+none%5D%E2%80%A6+Good+works+are+an+instrumental+cause+of+the+possession+of+life+eternal%2C+for+by+these+as+by+media+and+by+the+legitimate+path+God+leads+us+into+the+possession+of+eternal+life%E2%80%A6+The+same+truly+are+rightly+able+to+be+said+to+be+an+instrumental+cause+of+eternal+life%2C+insofar+as+God+leads+us+by+them+into+eternal+life.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+%E2%80%98Whether+Good+Works+are+the+Cause+of+Eternal+Salvation%3F%E2%80%99+in+Of+the+Nature+of+God%2C+or+of+the+Divine+Attributes+%28Neustadt%2C+1593%29%2C+Book+5%2C+ch.+2%2C+after+Of+Predestination+in+General%2C+Question+6%2C+Other+Part%2C+Of+the+Predestination+of+the+Saints%2C+Question+3%2C+after+the+Thesis%2C+pp.+670-71%2C+begins+bottom+of+left+column+on%2C+p.+670&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf730605b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af730605b1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20do%20not%20absolutely%20deny%2C%20that,us%20by%20them%20into%20eternal%20life&amp;text=We%20do%20not%20absolutely%20deny%2C%20that%20good%20works&amp;text=God%20leads%20us%20by%20them%20into%20eternal%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9cc146db27" data-kw="">
<blockquote><p>We agree that good works are pleasing to God, that we may work with the thought of profit… that works have some relation of order and connection with eternal life, as between means and ends, the relation of way to goal, of competition to prize, of antecedent to consequent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rissen.html">Leonard Rissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As translated by Heppe, Reformed Dogmatics</cite>, (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580. Heppe gives as the reference in Rissen: XV, 8, 1, but we have not been able to find it there.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-d86b2083fc" data-kw="">
<blockquote><p>As to the causal ‘for’ [in Mt. 25:42], I say that it does indeed signify a cause, but not meritorious of the Kingdom, but declaratory of the righteous sentence passed by the Judge; that of right the Kingdom is adjudged to the sheep, because by works they declared themselves truly sheep, that is, believers. Some there be that grant (which I would not do) that works are an efficient cause of the Kingdom, but not by way of merit, but as a way and means, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 404 | On Mt., 25:42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-286f8950c6" data-kw="">
<blockquote><p>Hence it is plain, that a certain sure way is laid down to the kingdom of heaven by God himself, and that the same is a narrow way, namely, that of virtue and holiness: not the broad way of iniquity and lust. As therefore, if there is a certain, only, and prescribed way, which leads to any city, it is necessary to all who wish to enter that city, to take this way; so, since by the Divine appointment the way of good works leads to the goal of eternal glory, he must inevitably enter upon and hold this way, who desires to arrive thither,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification</cite>, 1:302-3, on Mt., 7:14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

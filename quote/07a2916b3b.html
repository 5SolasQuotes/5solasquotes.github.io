<main class="wrap"><figure class="quote" id="q-07a2916b3b" data-kw="">
<blockquote><p>In the sacrament of baptism the Independents lay a pathway to Anabaptism, for first they come close up to the most rigid Brownists, denying baptism to the most part of Christian infants; yea they will grant it to a very few: to these alone whose immediate parents are members of their congregation, who are a wonderful poor handful: all other infants they will have unbaptized till they come to the years of understanding and declare not only their actual faith and holiness, but their subjection to the Kingdom of Christ, that is to their Independency: they will have no stipulation made for the infants’ education… … Secondly, they esteem not baptized infants to be members of their church before they have entered into their [church] covenant; till then they hold them from the Lord’s Table and all the acts of discipline, as people without the Church and not members of it: If it be so, their baptism was of so small use that well they might have wanted it to the time of their admission to be members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), ch. 6, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

acrament%20of%20baptism%20the%20Independents%20lay&amp;text=the%20time%20of%20their%20admission%20to%20be%20members" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3cfb2c88ff" data-kw="">
<blockquote><p>…these… truths are most certainly evident out of the Scripture. All Christians in the Church of Jerusalem were admitted into Church-fellowship upon their repenting, believing and being baptized, without any other conditions, and that upon offering themselves… But it will farther more illustriously yet appear, if we consider the diverse other additions of believers, and that daily unto the Church of Jerusalem: for in the last verse of this chapter it is said that the Lord added daily unto the Church such as should be saved; here we find additions upon additions of believers, and that daily, indefinitely set down, as if they could not easily have been told, which adds no small emphasis unto the expression; and all these were admitted into Church-fellowship without any of those conditions the Independents require of all their members in these our times; for it is said the Lord added daily unto the Church such as should be saved; and therefore He did it only upon his own terms of repentance, faith and baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bastwick.html">John Bastwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Utter Routing of the Whole Army of All the Independents &amp; Sectaries</cite>, … (London, 1646), The Antiloquie, no page number</span></figcaption>

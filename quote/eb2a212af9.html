<main class="wrap"><figure class="quote" id="q-eb2a212af9" data-kw="">
<blockquote><p>Lastly, We must not confound Justification with the manifestation and declaration of it in our hearts and consciences. This is the rock at which the Antinomian doth so often split, he supposeth Justification to be from all eternity, and that therefore a man is Justified before he doth believe; Faith only justifying by evidence and declaration to our consciences: but this is to confound the decree of God, and its execution … .

Hence it is a dangerous thing, though some excellent men have done it, to make Faith a full persuasion of our Justification, for this supposeth Justification before Faith; It is one thing to be Justified, and another thing to be assured of it. It is true, we cannot have any peace and comfort, nor can we so rejoice in, and praise God, though we are justified, unless we know it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4200c6001" data-kw="">
<blockquote><p>It is evident that since the fall no man can be sanctified unless he has been previously justified upon some scheme. In the case of Adam, on the contrary, it was necessary he should be holy, or, what is the same thing, that he should have obeyed the law before he could be justified. His justification in the eye of the law depended on his perfect fulfilment of all its commands, both in the letter and in the spirit.

No less could have been required under the scheme of works upon which he relied for justification. And doubtless Adam was endued with strength sufficient to have enabled him to yield such an obedience, and had he remained in his integrity during the time appointed by God for his trial, he would have been pronounced legally righteous, and confirmed in holiness for eternity. But the moment he broke the law and failed to perform the conditions of the covenant into which he had entered with God, that instant it became absolutely impossible for him to be justified on the scheme under which he hitherto lived.

The order which had previously existed between justification and sanctification was completely reversed, and it became absolutely necessary for him to be justified before he could be sanctified. And since the sinner is now precisely in the same situation with Adam subsequent to the fall, the same necessity must still hold in every individual case. The impossibility of being sanctified before justification, consists in the fact that all are under the curse of God’s violated law, and consequently in a state of present condemnation. “Cursed is every one that continueth not in all things that are written in the law to do them.”

As the person and the works of the moral agent are strictly related, the one derives its complexion from the other. Now, under the first covenant, the person of the individual was accepted in consequence of the previous acceptance and justification of his works; under the last covenant, the order is directly inverted. The works of the sinner are accepted in consequence of the previous acceptance and justification of his person. Or, as has been pithily said under the covenant of works, the order was, do this and live. Under the covenant grace: live that you may do this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sanctification by Grace in George A. Blackburn (ed.), Sermons by Rev. John L. Girardeau, D.D., LL.D., Late Professor in the Theological Seminary, Columbia, S.C.</cite></span></figcaption>

</figure><figure class="quote" id="q-fd1c7f51b5" data-kw="">
<blockquote><p>According to the view of the Scotists and the Nominalists, the reason for the meritoriousness of good works lies exclusively in God’s free acceptance so that God could have accepted as merit and rewarded with everlasting life merely naturally good works. According to the better-founded Thomistic view, the ground of the meritoriousness lies also in the intrinsic value of good works performed in the state of grace. The state of grace effects an inner equivalence (meritum de condigno) between the good actions and the eternal reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §24, 3</span></figcaption>

</figure><figure class="quote" id="q-3b1cfb93cb" data-kw="">
<blockquote><p>Secondly, justification does connote a state and established condition of a man, and therefore is not frequently iterated, although it be continued. A man is not justified many times in a day, though sins be pardoned often in a day. It is true, God does continue to justify those that believe in Him, and if He should cease to do so, they would immediately fall into misery and guilt; but yet God does not renew or revive our justification, as if there were an interruption or intermission of it. That justification does denote an estate is plain by comparing it with all the other privileges God vouchsafes his people: regeneration and vocation denote a state the person is put into, so does glorification. As therefore sanctification is one thing, and those auxiliary actings of God’s grace are another thing, so that though we may say such a man has new quickening grace every day, yet we cannot say he has a new regeneration; so it is here: though we may say that every day the believer, begging the pardon of his daily infirmities, has a new pardon, yet he has not a new justification, because this denominates the state of a man. Neither can it be said that pardon of this sin or that sin puts a man into the state of God’s favor absolutely, but quoad hoc [so far as this]; the pardon of this or that sin does not make that universal righteousness of the person whereby he stands acquitted from all. It is true, some learned men call this daily remission of sin justificatio particularis [a particular justification]; but we are now treating of that universal justification whereby the person of a believer stands acquitted and disobliged from the guilt of all his sins he has committed. And great is the comfort of a Christian in that his justification is a state of favor with God; for hence flow many other inestimable benefits and advantages, which the believer is to study out and improve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’, p. 268</span></figcaption>

</figure><figure class="quote" id="q-1d3367e33f" data-kw="">

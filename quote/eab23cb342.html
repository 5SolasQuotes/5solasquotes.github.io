<main class="wrap"><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4 (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955)</cite>, 22:23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0c0438c65" data-kw="">
<blockquote><p>Jesus Christ, very God and very man (Matt. 1:21-23; Luke 1:35), i.e., having a true and human soul and a true human body formed of the same substance of the virgin Mary, daughter of David, by virtue of the Holy Ghost, was by this means conceived and born of the same virgin Mary—a virgin I say both after and before her deliverance; and all this was done for the accomplishment of our reconciliation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beza’s Confession (1560), Article 23 in Dennison, Reformed Confessions 2.249-50</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>The title ‘Ever Virgin’ (aeiparthenos, semper virgo) arose early in Christianity… It was a stock phrase in the Middle Ages and continued to be used in Protestant confessional writings (Luther, Calvin, Zwingli, Andrewes; Book of Concord [1580], Schmalkaldic Articles [1537]).</p></blockquote>

</figure><figure class="quote" id="q-7432244373" data-kw="">

<main class="wrap"><figure class="quote" id="q-bde6155957" data-kw="">
<blockquote><p>And to the angel of the church in Pergamos write… I know thy works, and where thou dwellest, even where Satan’s seat is: and thou holdest fast my name, and hast not denied my faith, even in those days wherein Antipas was my faithful martyr, who was slain among you, where Satan dwelleth. But I have a few things against thee, because thou hast there them that hold the doctrine of Balaam, who taught Balac to cast a stumblingblock before the children of Israel, to eat things sacrificed unto idols, and to commit fornication. So hast thou also them that hold the doctrine of the Nicolaitanes, which thing I hate. Repent; or else I will come unto thee quickly, and will fight against them with the sword of my mouth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev., 2:12-16</cite></span></figcaption>

</figure><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, (1672), ch. 5, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

t%20observing&amp;text=ought%20to%20have%20his%20warrant%20and%20authority%20for" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f251732d51" data-kw="">
<blockquote><p>17. As God has not tied us to words in prayer or preaching (though he have recorded many forms in Scripture), but left all to choose what words, time and circumstances make fit (by book, or without) so the conveniences and inconveniences both of set forms and of free speaking are on each part so great and undeniable that we have no cause to censure that Church which uses both; that is, which agrees on a set form to show what the Church professes to own, if the minister should blutter out any error or indecency, and yet not restrain ministers from the due use of free speech.

18. It is a great sin out of a fond conceit of the excellency of either way above its due value to think and speak with unjust vilifying of the other way when God has tied us to neither alone: It is contrary to knowledge, love, peace and concord out of a self-conceitedness, peevishness or false prejudice received from others to think and speak worse of other men’s words in prayer than they deserve and to frighten the ignorant from lawful communion by calling that sin or false worship that is not so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | On Free Prayer with Forms</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

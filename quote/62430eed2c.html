<main class="wrap"><figure class="quote" id="q-62430eed2c" data-kw="">
<blockquote><p>Be exhorted to keep holy this day. You can’t justly say that there is not sufficient evidence that ’tis the mind and will of God that you should sanctify this day. Seeing, therefore, God has sufficiently declared his mind in this, take heed that you do according to it.

God has given such evidences of this being his mind, that he will surely require it of you if you do not strictly and conscientiously observe it. And if you do so, you may have this comfort in the reflection upon [it], that you have not been superstitious in it, but have done as God has revealed it to be his mind and will in his Word that you should do, and that in so doing you are in the way of God’s acceptance and reward.

Motives

1. A strict keeping of the sabbath is a thing whereby the name of God is honoured. God looks upon himself as honoured hereby, and it is in such a way as is very acceptable to him; Isaiah 58:13, “if thou call the sabbath a delight, the holy of the Lord, honourable, and shalt honour him.”

God is honoured by it, as it is a visible showing of respect to God’s holy law and a reverencing that which has a peculiar relation to himself, and that, more in some respects than the observation of many other commandments. A man may be just, and may be generous, and yet not so plainly show respect to the revealed mind and will of God, as many of heathens have been so. But if a person with evident strictness and care observes the sabbath, it is a visible manifestation of a conscientious regard to God’s declaration of his mind and so is a visible honour done to his authority.

A strictly keeping the sabbath is that by which the face of religion is kept up in the world. If it were not for the sabbath, there would be but little public and visible appearance of serving, worshipping, and reverencing the supreme and invisible Being. The sabbath seems to have been appointed much for this end, viz. the upholding the visibility of religion in the public or amongst professing societies of men. And the greater strictness the sabbath is observed with, and the more solemnity the duties of it are attended with amongst a people, the more is there of the appearance and manifestation of respect to the divine Being amongst them.

This should be a powerful motive with us to the keeping the sabbath. It should be our study above all things to honour and glorify God. It should be the great thing with all that bear the name of Christians, how they shall do what shall be [to] the honour of their great God and king, and, I hope, is a great thing with many that hear me at this time. And if this be your inquiry, if this be your desire, hereby you are directed to one way whereby you may do much that way, viz. by honouring the sabbath, and by showing a careful and strict observance of that.

2. That which is the business of the sabbath is the greatest business of our lives, viz. the business of religion. A serving and worshipping God is that for which we were principally made, for which we had our beings given us. Other business that is of a secular nature, that we are wont to attend on weekdays, is but subordinate, to be subservient to the higher purposes and ends of religion. Therefore we surely should not think it much to devote one seventh part of our time to be wholly spent in this business, and set it apart to exercise ourselves in the immediate duties of religion.

3. Let it be considered that all our time is God’s; and therefore, when he challenges of us one day in seven, he challenges his own. He don’t exceed his right; he would not have exceeded his right if he had challenged a far greater proportion of our time to be spent in his immediate service. But he hath mercifully considered our state and our necessities here. And as he hath consulted the good of our souls in appointing a seventh day for immediate duties of religion, so he hath considered our outward necessities and hath allowed us six days for attendance on our temporal affairs. What unworthy treatment therefore will it be of God, if we refuse to allow him even the seventh day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 243-44.</span></figcaption>

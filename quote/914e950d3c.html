<main class="wrap"><figure class="quote" id="q-914e950d3c" data-kw="">
<blockquote><p>Is this difference [of personal properties] rational, essential, or real?

It is not essential, as in the creatures, where every one hath his proper essence or being, defined and circumscribed: for the essence of the Father is not one, and the essence of the son another, and of the holy Ghost another: but one and the same, which the Father doth wholly communicate to the Son; the Father and the Son to the holy Ghost. Not only in reason, because not in notion, or mind, or only in word is he called Father, Son, and holy Ghost: neither respectively or by relation: as one man may both be, and be called a father and a son. But it is real, yet altogether incomprehensible, because each person hath his own peculiar definition, or his essential and incommunicable propriety, and differs from another not in essence, but in the manner of subsisting.

What is the outward difference?

It is taken from the works of God that be without, as that the Father sends the Son, the Son is sent as the Redeemer: the holy Ghost is the sanctifier. As in the Creed, the Father is distinguished from the Son by the work of creation: the Son by his incarnation, the holy Ghost from them both, by the work of sanctification and regeneration as where he appeared like a Dove, (Mat. 3.) and in cloven tongues, Act. 2. although all these things be effected by one and the self same God. As we use to say, the works of the Trinity without are indivisible: therefore here let us remember the saying of Gregory Nazianzen: I cannot imagine one, but presently I am compassed about on every side with the brightnesses of three: neither can I distinguish three, but forthwith I am brought again to one. Further, in the persons of the Deity there is an order, but there is none inequality: there is a distinction, but no diversity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 11.</span></figcaption>

<blockquote><p>Prestige finds Christological perichoresis is no more than a“verbal formality,” adding nothing, and positively tending to monophysitism. My purpose hereis to propose the opposite view: Contra Prestige, Christology in the Damascene is actually anti-monophysite by design. Prestige on perichoresis is no longer tenable on three crucial points: 1) the meaning of perichoresis, 2) the philosophic background of perichoresis, and 3) the provenance of trinitarian perichoresis. None of these contentions is new, yet the implications of them taken together have not been fully realized in regards to the Damascene’s Christology. Contra Prestige, 1) the meaning “interpenetration” is early, not late, 2) the philosophic milieu is predominantly Stoic, not Aristotelian, and 3) the progenitor of trinitarian perichoresis is John of Damascus, not Pseudo-Cyril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-ables.html">Scott Ables</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Anti-Monophysite Trinitarian Christology of John of Damascus’ a paper read at NAPS, Annual Meeting, Chicago</cite>, (2010), pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-411d5086bd" data-kw="">
<blockquote><p>And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begot the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved. 11. And thus there appeared another beside Himself. But when I say another, I do not mean that there are two Gods, but that it is only as light of light, or as water from a fountain, or as a ray from the sun. For there is but one power, which is from the All; and the Father is the All, from whom comes this Power, the Word. And this is the mind which came forth into the world, and was manifested as the Son of God. All things, then, are by Him, and He alone is of the Father. Who then adduces a multitude of gods brought in, time after time? For all are shut up, however unwillingly, to admit this fact, that the All runs up into one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus-of-rome.html">Hippolytus of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>c. 235)</cite>, Against Noetus</span></figcaption>

<blockquote><p>In the unity of the Godhead there be three persons, of one substance, power, and eternity: God the Father, God the Son, and God the Holy Ghost: the Father is of none, neither begotten, nor proceeding; the Son is eternally begotten of the Father; the Holy Ghost eternally proceeding from the Father and the Son.</p></blockquote>

<blockquote><p>The words Father, Son, and Holy Spirit, certainly indicate a real distinction, not allowing us to suppose that they are merely epithets by which God is variously designated from his works. Still they indicate distinction only, not division. The passages we have already quoted show that the Son has a distinct subsistence from the Father, because the Word could not have been with God unless he were distinct from the Father; nor but for this could he have had his glory with the Father.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b9e35c2e61" data-kw="ignorance weakness">
<blockquote><p>Hence it is evident that guilt is not with sufficient accuracy called by the Scholastics the formal (formale) of sin; it is only its consequent, arising from its illegality (anomia). For as the law can be viewed in respect of the command or of the sanction or of the added threatening, sin has a twofold relation (schesin) to it. With regard to the former (inasmuch as it is referred to the sentence of the law commanding or prohibiting something), it is called anomia (“illegality”); inasmuch as it is referred to the threatening, it is called guilt. Hence it follows that guilt (at least actual guilt concerning which we especially treat) can be separated from sin. In the renewed, there is illegality (anomia) and not guilt (Rom. 8:1). In Christ, on the contrary, there is guilt (Is. 53:5; 2 Cor. 5:21) because he is our surety, but yet no illegality (anomia) (1 Pet. 2:22; 1 Jn. 3:5; Jn. 8:46). Therefore illegality (anomia) is one thing, but the condemnation (krima) attending it is another. The former constitutes the nature of sin; the latter, however, follows it and necessarily depends upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.3</span></figcaption>

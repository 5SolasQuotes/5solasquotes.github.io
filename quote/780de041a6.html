<main class="wrap"><figure class="quote" id="q-780de041a6" data-kw="">
<blockquote><p>But these outward shadows and ceremonies had their time and place long ago, and were not instituted to the end they should continue irrevocable, but for a season, to represent as it were a superficial view unto us of more excellent things. Even as the kingly Throne of David, and all that politique government of the Israelites did prefigure nothing else unto us, but the everlasting kingdom of Christ, and were as certain principles, wherewith the minds of the beholders might be raised up to a more deep consideration of far high mysteries: in so much that the very same, which was but figured in king David, we plainly perceive to have been expressly discovered in the king of the new Jerusalem, which is the Church of Christ. The same which was prefigured in Abel, in Noah, in Abraham, Melchisedech, Joseph, Moses, Aaron, Joshua, Sampson, David, Elias, Jonas, Jesus the great Priest, in the Paschall Lamb, in the brazen Serpent, in the Rock, in Manna, in the feast of Pentecost: briefly whatsoever exercises were practised in shadows, types &amp; figures, we do unfeignedly acknowledge to have met, concurred, &amp; been accomplished in one body.

And this body truly is Christ Jesus, who is also the end &amp; consummation of al the whole Law. In like manner the sacrifices and ceremonies, trimmings and deckings of the old Law, contained in them selves no sound nor permanent matter, but were shadows and forerunners of more excellent graces. For what is he so purblind in this our age, that knoweth not, that God doth not dwell in Temples made by men’s hands? that consciences are not cleansed from sins with the blood of goats &amp; of bulls? But these bloody offerings obtained a certain resemblance only of the true purging of sins. What doth the commandment of the prophet imply, when in your Passover he charged a lamb of a year old, clean &amp; undefiled to be slain by families &amp; tribes? Can your senses be so blockish to think, that so great &amp; effectual operation lurketh in the blood of beasts, as may avail to deliver you from cruel thraldom, &amp; translate you to the land of promise flowing with milk &amp; honey, if there were no cornel of deeper mystery enclosed within the outward shell of the letter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87ae79983b" data-kw="">
<blockquote><p>These [circumstances] are such close adjuncts of religious worship that in a secondary sense they partake of the meaning and nature of it. Observance of them promotes not only the honor of God which is found in both the natural and the instituted worship of God, but also a certain special honor to Him in that their observance is connected with natural and instituted worship by his command and in a direct and immediate way.</p></blockquote>

</figure><figure class="quote" id="q-873fd7b5f1" data-kw="">
<blockquote><p>The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Solution of Doctor Resolutus, his Resolutions for Kneeling</cite>, ([Amsterdam, 1619]), ch. 1, ‘A Table Gesture is Necessary’, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-8483e69a21" data-kw="">
<blockquote><p>First, the power claimed by the governors of the Christian Church is not an arbitrary or capricious authority, to be wielded at will by them, in disregard of the rights or consciences of the members. There are certain limitations of a most important nature affixed to that power, and certain principles of a definite kind laid down for the use and administration of it, which set bounds round about it, and bring it into harmony with the liberty of conscience, rightfully belonging to every private individual of the Christian society. … 3rd. Church power is limited by the rule prescribed for its exercise, or by the Word of God. This third limitation ties down the administration of Church power to certain fixed principles and a certain definite law, and excludes the possibility of its becoming a wayward and arbitrary authority, to be wielded at the will or caprice of man. It forbids the unauthorized addition or subtraction of anything in the constitution, doctrine, worship, or discipline of the Church, such as Christ has not sanctioned in His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1 (Edinburgh, 1868), pp. 241-2, 248</span></figcaption>

<div class="actions"><button class="copy" data-copy="“First, the power claimed by the governors of the Christian Church is not an arbitrary or capricious authority, to be wielded at will by them, in disregard of the rights or consciences of the members. There are certain limitations of a most important nature affixed to that power, and certain principles of a definite kind laid down for the use and administration of it, which set bounds round about it, and bring it into harmony with the liberty of conscience, rightfully belonging to every private individual of the Christian society. … 3rd. Church power is limited by the rule prescribed for its exercise, or by the Word of God. This third limitation ties down the administration of Church power to certain fixed principles and a certain definite law, and excludes the possibility of its becoming a wayward and arbitrary authority, to be wielded at the will or caprice of man. It forbids the unauthorized addition or subtraction of anything in the constitution, doctrine, worship, or discipline of the Church, such as Christ has not sanctioned in His Word.”

<main class="wrap"><figure class="quote" id="q-c78882c4a3" data-kw="">
<blockquote><p>If men abuse the Scriptures, this does not happen per se, but accidentally from the perversity of those who wrongfully wrest them to their own destruction. Otherwise (if on account of the abuse the use should be prohibited), the Scriptures ought to be taken away not only from the laity, but also from the teachers who abuse them far more. For heresies usually arise not from the common people and the unlearned, but from ecclesiastics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.18.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7de420a55c" data-kw="">

</figure><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-64ef925976" data-kw="infallibility of the church">
<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, Second Topic, Q. 20, §XI</span></figcaption>

</figure><figure class="quote" id="q-ea02d03b91" data-kw="">
<blockquote><p>The other, then, is the external judgment; by which, we judge, to the greatest certainty, of the spirits and doctrines of all men; not for ourselves only, but for others also, and for their salvation. This judgment is peculiar to the public ministry of the Word and the external office, and especially belongs to teachers and preachers of the Word. Of this we make use, when we strengthen the weak in faith, and when we refute adversaries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>

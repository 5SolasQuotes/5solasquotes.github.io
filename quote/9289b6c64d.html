<main class="wrap"><figure class="quote" id="q-9289b6c64d" data-kw="">
<blockquote><p>In a word, God has bound all his ministers to use all their gifts to the churches’ greatest edification: But to use a more defective form, with liberty to use my best gifts also, and to exercise my ministry publicly to all, is more to the churches’ edification than to use my own gifts only a few days in a corner and then to lie in prison and use them no more. Though no man must of choice prefer the less congruous before the more congruous, when he is free (which I confess is a sin), yet it is a duty to prefer a less congruous order before none, or before a better for a day with a restraint of that and all our ministry hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 32, p. 186</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cd7397674" data-kw="">
<blockquote><p>That which hinders the Church’s edification by the ruler’s fault, it may be the people’s duty to obey for a greater good. For instance, it is less edifying to use our old singing psalms than a better version. And yet for concord, if the ruler appoint them, the people must use them because concord with that imperfection is better than to sing everyone a several better version or diverse versions at once. So a faulty translation of Scripture, a weak sermon, an inconvenient hour and place, when concord is necessary and cannot be had in the more edifying circumstances, it must be had in the best way we can. If the sheriff appoint an unfit time and place to meet to choose parliament-men, it’s a duty to comply rather than not to meet at all. Every evil so far excludes good, and yet we must not renounce communion in all good where men mix any evil lest we also give over all good ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

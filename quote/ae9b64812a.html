<main class="wrap"><figure class="quote" id="q-ae9b64812a" data-kw="">
<blockquote><p>13. …There is all in God that is good, and perfect, and excellent in our desires and wishes for the conversion and salvation of wicked men. As, for instance, there is a love to holiness, absolutely considered, or an agreeableness of holiness to his nature and will; or, in other words, to his natural inclination. The holiness and happiness of the creature, absolutely considered, are things that he loves. These things are infinitely more agreeable to his nature than to ours. There is all in God that belongs to our desire of the holiness and happiness of unconverted men and reprobates, excepting what implies imperfection. All that is consistent with infinite knowledge, wisdom, power, self-sufficience, infinite happiness, and immutability. Therefore, there is no reason that his absolute prescience, or his wise determination and ordering what is future, should hinder his expressing this disposition of his nature, in like manner as we are wont to express such a disposition in ourselves, viz. by calls and invitations, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remarks on Important Theological Controversies</cite>, ch. 3, “Concerning the Divine Decrees in General, &amp; Election in Particular,” from paragraphs 9 &amp; 13, in The Works of Jonathan Edwards, ed. Edward Hickman (†1758), vol. 2, pp. 527-28 and in Select Works (Banner of Truth), 2:528</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>…why then did Christ here urge the testimony of John? Why, these things I say, that you may be saved. This He aimed at in all this discourse, to save not his own life, but the souls of others; He produced John’s testimony because, being one of themselves, it was to be hoped that they would hearken to it. Note, First, Christ desires and designs the salvation even of his enemies and persecutors. Secondly, the word of Christ is the ordinary means of salvation. Thirdly, Christ in his word considers our infirmities and condescends to our capacities, consulting not so much what it befits so great a prince to say as what we can bear, and what will be most likely to do us good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>

</figure><figure class="quote" id="q-2b785e7f49" data-kw="">
<blockquote><p>Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mk. 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Mt. 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatenings, 1 Jn. 5:23, Mt. 11:21; witness those pathetical lamentations, Mt. 23:37, Lk. 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, The Unsearchable Riches of Christ, p. 206</span></figcaption>

<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 566</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

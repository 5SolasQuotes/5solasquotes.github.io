<main class="wrap"><figure class="quote" id="q-8161c95a42" data-kw="">
<blockquote><p>Lawyer: But why go you to the parish-churches when you might have better? Minister:

1. All non-conformists preach not better than many of them; yea, the liturgy is better words of prayer than some weak or faulty non-conformists often use.

2. A brown loaf and a white one both may be better than a white one alone; I found both best; and I knew it sin to renounce communion with any Church for weakness because they are not as good as others.

3. That is best at one time and place that is not so at another; praying in itself is better than working, and eating, sleeping. And yet in their proper time your servant’s working and your eating and sleeping is better than praying at that time. One that is a son, a servant, a wife who is commanded by the master of the family to hear a tolerable parish-minister may then find it better than disorderly and disobediently to hear an abler man; that may by variety of conditions be one man’s duty which is another’s sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 232-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-49c7f784b9" data-kw="">
<blockquote><p>This was the constant judgment of the old non-conformists, which I shall transcribe from a grave author. ‘Those,’ says he: ‘that for many years together, during the reign of the three last princes [Edward VI, James I, Charles I], denied to come up to a full conformity to this [Anglican] Church, had a low oinion of the discipline then exercised (of which they have left behind them large evidences), yet how tender were they of the Church’s honour to keep Christians in communion? How zealous were they against separation? as may appear in the labours of Mr. [Robert] Parker, Mr. [John] Paget, Mr. [John] Ball. Mr. [Thomas] Brightman laid us low enough, when he [in his Commentary on Revelation] did not only parallel us with luke-warm Laodicea, but made that Church the type, and we the antitype, by reason of our discipline; yet how zealous is he against separation from these assemblers, and breaks out in these words: ‘Therefore their error is wicked and blasphemous, who so forsake the Church, as if Christ were altogether banished thence.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters</cite>, London Ministers, A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, pp. 62-63</span></figcaption>

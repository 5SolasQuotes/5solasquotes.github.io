<main class="wrap"><figure class="quote" id="q-ef2bf8a5c9" data-kw="">
<blockquote><p>That it be frequently remembered, how the finger and power of God, and the love and mercy of God, by many admirable evidences, hath been manifested in this great work of reformation; and how the Lord, either by blowing upon all the devices of our enemies, or by turning them back upon themselves, hath turned all their wisdom into foolishness, that we may have confidence for the time to come, believing and saying, with the prophet, Isa. xxvi. 12, ‘Lord, thou wilt ordain peace for us; for thou also hast wrought all our works for us.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instructions for Defensive Arms (1639) in Andrew Stevenson, The History of the Church and State of Scotland, from the Accession of King Charles I. to the year 1649. To which is prefixed, An Abstract of the State of Religion in Scotland, from the Earliest Ages of Christianity, to the year 1625</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 2 (Edinburgh, 1870), p. 580</span></figcaption>

</figure><figure class="quote" id="q-c459073e43" data-kw="">
<blockquote><p>If by birth control is meant that married couples should use their common sense in spacing births–that with pure and unselfish motives they should strive not to beget children when their physical, financial and other circumstances do not warrant it–we whole heartedly agree that it is permissible. Indeed it is an offence against God, against their offspring and against themselves, if a couple continue to bring forth children when their circumstances do not justify it. When, however, birth control is practiced for selfish reasons and with false motives, it is to be strongly opposed.</p></blockquote>

</figure><figure class="quote" id="q-3e6572aea2" data-kw="">
<blockquote><p>Now when Christ is burnt up with love, and sick of tender kindness; to cast water on this love by resisting it, is the highest Gospel-sin that can be, except despiting of the holy Ghost; and a third ground of aggravating to the full, this sin of resisting Christ’s drawing, I take from the judgement and the plague and Gospel-vengeance on such as Christ draweth, and they will not be drawn, and is the sin of the times;</p></blockquote>

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself, ... (London, 1647), p. 460">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+when+Christ+is+burnt+up+with+love%2C+and+sick+of+tender+kindness%3B+to+cast+water+on+this+love+by+resisting+it%2C+is+the+highest+Gospel-sin+that+can+be%2C+except+despiting+of+the+holy+Ghost%3B+and+a+third+ground+of+aggravating+to+the+full%2C+this+sin+of+resisting+Christ%E2%80%99s+drawing%2C+I+take+from+the+judgement+and+the+plague+and+Gospel-vengeance+on+such+as+Christ+draweth%2C+and+they+will+not+be+drawn%2C+and+is+the+sin+of+the+times%3B%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+...+%28London%2C+1647%29%2C+p.+460&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e6572aea2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e6572aea2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spreading-diseases-and-plagues/#:~:text=Now%20when%20Christ%20is%20burnt%20up,is%20the%20sin%20of%20the%20times&amp;text=Now%20when%20Christ%20is%20burnt%20up%20with%20love&amp;text=drawn%2C%20and%20is%20the%20sin%20of%20the%20times" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse</cite>, (1640), ch. 7. Prynne was a prominent Erastian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<main class="wrap"><figure class="quote" id="q-cc8d5a4c2c" data-kw="">
<blockquote><p>Usurp never to be teachers of your teachers or guides of guides. Take not like Korah and his company too much upon you; albeit ye are not to follow any man blindly in matters of religion but humbly and seriously to examine all things (like the noble Bereans) and hold fast that which is good, 1 Thess. 5, yet your teachers ye are to reverence and humbly learn from them, Heb. 13:7 &amp; 17, and have them so far in regard as not rashly to oppone your judgment to theirs, much less to dictate and prescribe unto them, and not let them have your peace unless they follow all your opinions. What intolerable arrogance is it for weak heads of men or women (whom God has set to learn, not to teach) to leave the place of disciples and presume unto the chair, to teach and give laws unto their governors and guides? Has He not said, Mal. 2:7, ‘The priests’ lips shall preserve knowledge, and men should seek the Law at his mouth; for he is the messenger of the Lord of hosts’? But where has He said that ministers are to be tutored and led by the people? Is it not an high degree of pride for persons of your station and understanding to arrogate to yourselves to be wiser and judiciouser than your best ministers, who make it their daily work to read, meditate, and pray, to stand by the Lord’s counsel and learn his mind, and like watchmen stand on their watchtower to know what of the night? With whom is this urim and thummim more than with his holy ones? If ye find them fail in anything, admonish them gravely and discreetly: Tell Archippus [Col. 4:17; Phile. 1:2] your thoughts humbly and seriously, yet presume not to impose your apprehensions on him nor to censure him shrewdly if he do not forthwith become of your opinion; for ye are fallible and may be in the mistake. ‘Brethren’ (says James, 3:1), ‘be not many masters.’ This spirit savors little of sober-mindedness or self-acquaintance; suffer 〈◊〉 to tell you, that as for your sincerity, zeal and affectionateness, many of you are your teachers ••y, and that it is not a little they have done and suffered for your sakes, and their bowels yern to have more and more of Christ formed in you; so for unfruitfulness in the Word of righteousness, for being such babes in knowledge, and inability to scan intricacies and discern between things that differ, not a few of you are their shame and grief; and yet will ye be their leaders? Ye know it is the blindest who usually are the boldest and most confident, Prov. 14:16. ‘Be not therefore high-minded, but fear,’ and be self-jealous: The Holy Ghost’s rule is, ‘Be swift to hear, slow to speak, slow to wrath,’ James 1. Think they do but flatter you who would puff you up with self-conceit, as if it were people who keep Ministers right, and not Ministers the people, and would teach you to usurp over your leaders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, pp. 167-68</span></figcaption>

<blockquote><p>VI. No more can the rite of the sacrament of confirmation than the name be shown from the Scriptures. The apostles indeed employed the imposition of hands (cheirothesian, Acts 8:17; 19:6), but since it is evident that that was done in a visible dispensation of the Holy Spirit in the nascent condition of the church and indeed from a special promise, it is clear that it was an extraordinary rite and for this reason only temporary (whose end ceased together with other miracles). That the sacerdotal chrism and anointing were altogether different from the apostolic laying on of hands (cheirothesia) and that this [chrism/anointing] referred to the bestowal of the extraordinary gifts of the Spirit is not obscurely gathered…</p></blockquote>

<blockquote><p>It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Cor. 5, v. 4</cite></span></figcaption>

<blockquote><p>Answer: 1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders. 2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.</p></blockquote>

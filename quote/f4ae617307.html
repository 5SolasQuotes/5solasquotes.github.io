<blockquote><p>VI. To no purpose is the reply: (1) “Hence it would follow that the Lord’s Supper should also be administered to infants because the thing signified belongs to them.” Although the same thing is signified in both, still there is a difference in the manner of signifying. In the Supper, the grace of Christ is sealed by way of solid food, which infants are not capable of receiving; but in baptism, it is signified by way of the washing of regeneration, which they are (Jn. 3:5). Again, the Supper demands a twofold condition: a preceding in examination; a concomitant in a commemoration of the death of Christ, both of which presuppose the use of reason. Neither is required in baptism; thus formerly the Passover was distinguished from circumcision—that the latter was administered to infants and the former to adults alone. (2) “It is added that infants are not capacious of the grace of regeneration, nor of the other blessings of the covenant which are accustomed to be conferred by the Spirit through the word.” But it is gratuitously supposed that they are not capacious of the blessing of the covenant. For who denies that they are capacious of the remission of sins and of Christ’s redemption, and of the other benefits which depend upon the covenant into which infants are received? Who can doubt that baptism (with respect to these) is able to be a distinctive sign (introducing into the visible church) and a seal both of the divine truth in the federal promises and of our obligation to mutual duty? For if they are not capable of obligation in the present, they can be in the future. As to regeneration, however, why should infants not be capable of regeneration as they are of sin (unless we say that guilt has more power than grace)? And as they are rational (although they do not put forth an act of reason), what hinders them from being called holy and believers by the Holy Spirit given to them, although they cannot as yet exert an act of faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 19.20.6 (p. 416).</span></figcaption>

</figure><figure class="quote" id="q-0ab17e83da" data-kw="">
<blockquote><p>…for no doubt God in his decree and secret intention may intend, by the ministry of his servants, the true and real conversion of many hypocrites, such as are no less unconverted, then [Simon] Magus and Demas; for He hath mercy, on whom He will, Rom. 9:17, but according to this way, ‘these who are converts in the judgment of charity’ (he [Hooker] should say only converts in that judgment) are not according to God’s revealed intention and approving will or command taken in by pastors, that they may be really converted: for God giveth, in no sort, this command to pastors in his revealed intention. [Hooker:] ‘See that ye admit no fools to wisdom’s table or within wisdom’s house, but such only as you believe in charity are real converts, and both called and chosen,’ contrary to Prov. 9:1-4; Mt. 22:8-9,14. Therefore [it would follow on Hooker’s terms], by my revealed intention and command you are not to intend their conversion, but to presuppose that they were already converted: otherwise, if the Lord by his revealed intention and command will have such hypocrites who are but nominal saints, brought in that they may be truly converted, there must follow two contradictory intentions revealed in God: for the Lord’s command to pastors is [would be] ‘I command you to preach to these who are converts in the judgment of charity, that upon my intention, they may be truly converted’; and also: ‘I command you, my pastors, preach to no Church members, that upon my intention, they may be converted, because you are not to preach to any as pastors, but to such as ye know are already converted, according to my revealed intention and will.’ M. Hooker seeing this addeth: ‘But if M. Rutherford mean that the Church doeth of purpose receive them into the Church to be converted, then it is cross to his own tenet, and a person may be received to the seals of the covenant, who doeth not notify that he hath faith, nay the Church may receive them to the seals, whom she knoweth hath no right to the seals, for she knoweth they are not invisible members, which in Mr. Rutherford’s judgment only giveth them right.’ [Rutherford’s] Answer: It is not cross to my tenet, that a person, such as Demas and Magus may be received to the seals, and yet they doe not notify [that] they have saving faith and internal conversion, for my tenet is that the Church can only judge of visible walking and profession in point of admission or not admission to seals, and in that point the Church hath nothing to do to judge whether they have faith-saving or not; none can partake savingly of the seals for their own personal salvation and without sin, but these only who have saving faith, but the Church may admit without sin multitudes, who eat and drink their own damnation, 1 Cor. 11:26-27, and yet pass no sentence of signs notifying faith or no faith, internal conversion or no internal conversion upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, Ch. 8, pp. 34-35</span></figcaption>

+are+already+converted%2C+according+to+my+revealed+intention+and+will.%E2%80%99+M.+Hooker+seeing+this+addeth%3A+%E2%80%98But+if+M.+Rutherford+mean+that+the+Church+doeth+of+purpose+receive+them+into+the+Church+to+be+converted%2C+then+it+is+cross+to+his+own+tenet%2C+and+a+person+may+be+received+to+the+seals+of+the+covenant%2C+who+doeth+not+notify+that+he+hath+faith%2C+nay+the+Church+may+receive+them+to+the+seals%2C+whom+she+knoweth+hath+no+right+to+the+seals%2C+for+she+knoweth+they+are+not+invisible+members%2C+which+in+Mr.+Rutherford%E2%80%99s+judgment+only+giveth+them+right.%E2%80%99+%5BRutherford%E2%80%99s%5D+Answer%3A+It+is+not+cross+to+my+tenet%2C+that+a+person%2C+such+as+Demas+and+Magus+may+be+received+to+the+seals%2C+and+yet+they+doe+not+notify+%5Bthat%5D+they+have+saving+faith+and+internal+conversion%2C+for+my+tenet+is+that+the+Church+can+only+judge+of+visible+walking+and+profession+in+point+of+admission+or+not+admission+to+seals%2C+and+in+that+point+the+Church+hath+nothing+to+do+to+judge+whether+they+have+faith-saving+or+not%3B+none+can+partake+savingly+of+the+seals+for+their+own+personal+salvation+and+without+sin%2C+but+these+only+who+have+saving+faith%2C+but+the+Church+may+admit+without+sin+multitudes%2C+who+eat+and+drink+their+own+damnation%2C+1+Cor.+11%3A26-27%2C+and+yet+pass+no+sentence+of+signs+notifying+faith+or+no+faith%2C+internal+conversion+or+no+internal+conversion+upon+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker+%281658%29%2C+Book+1%2C+Ch.+8%2C+pp.+34-35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ab17e83da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ab17e83da.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/baptismal-regeneration#:~:text=for%20no%20doubt%20God%20in%20his,or%20no%20internal%20conversion%20upon%20them&amp;text=for%20no%20doubt%20God%20in%20his%20decree%20and&amp;text=internal%20conversion%20or%20no%20internal%20conversion%20upon%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

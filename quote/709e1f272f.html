<main class="wrap"><figure class="quote" id="q-709e1f272f" data-kw="">
<blockquote><p>1. Consider many things are darkly laid down in the Scriptures, and the scope of God and Christ therein, is not to cause contention, difference, and censuring: but to unite us more strongly in those things are clear, and to cause a forbearance of one another in things are dark and doubtful: Phil. 3:15-16: ‘If in anything you be otherwise minded, God shall reveal even this unto you: Nevertheless whereto we have already attained, let us walke by the same rule, and let us minde the same thing.’ Says Paul: ‘I confide not in my own works or righteousness, but look at Christ alone; I labour to win Christ, and be found in Him; I press after Him and none but Him, and mind nothing else as a means of salvation; if any be otherwise minded through ignorance, or weakness of Faith (as many were, who affected Mosaical rites and ceremonies) God shall reveal even this unto you; he will make known the truth unto you; nevertheless, though there be differences, let us forbear one another therein, and whereto we have attained, let us walk harmoniously and peaceably together, minding the same things.’ What is clear held out unto us in the Gospel, let us consent in, and walk answerably; in what is dark, doubtful, let us forbear each other, and stay till God reveal more. If we cannot unite in all, let us unite in what is clear. Things fundamental, and absolutely necessary, are clearliest laid down in the Word; they are expressly commanded, or held forth in Scripture, whether they be matters of Faith or practice, they are not things drawn out by remote consequences, and strength of men’s parts, but immediatly from, or in, the Word, and in these most may, or do agree, not being many in number; so far as we have attained in these, let us walk; and as King James says, in other things, place may be given to Christian liberty; and let us take heed how we charge men to hold fundamental errors, when fundamentals are few, Rom. 10:9; 1 Jn. 4:2, and men’s errors are extra-fundamentals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition continued upon the Sixth, Seventh, Eighth, Ninth, Tenth, Eleventh, Twelfth &amp; Thirteenth Chapters of the prophet Ezekiel</cite>, (London: 1649), on 11:19, ‘Helps to Unite our Hearts, or Uniting Directions,’, pp. 411-12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-70d48ee907" data-kw="">
<blockquote><p>Conclusion 1. The appearing-holiness of those who hold an opinion is not enough to demonstrate it a truth. A man may be in a dangerous (I had like to have said, damning) error, and yet to the view of men appearingly-holy. Many men have put on a form of godliness, and shew of holiness, till they have gotten strength and power enough to back them in their opinions, and then they have discovered the venom of their spirits, and let loose their spirits to those corrupt ways which their erroneous understandings did lead them to.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 164</span></figcaption>

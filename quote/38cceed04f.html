<main class="wrap"><figure class="quote" id="q-38cceed04f" data-kw="">
<blockquote><p>Is it not a point worth our learning to know the constancy of God’s love, with whom we are in a gracious covenant? And then again, we learn much wisdom how to manage our life hereby, even in the intercourse of our changes, to be now rich, now poor, now high, now low in estate. Wisdom is gotten by experience in variety of estates. He that is carried on in one condition, ho hath no wisdom to judge of another’s estate, or to carry himself to a Christian in another condition, because he was never abased himself. He looks very big at him. He knows not how to tender another, that hath not been in another’s condition. And therefore to furnish us, that we may carry our selves as Christians, meekly, lovingly, and tenderly to others, God will have us go to heaven in variety, not in one uniform condition in regard of outward things.

Use. Learn hence not to quarrel with God’s government; for though he alters our conditions, yet he never alters his love. A Christian is unmoveable in regard of the favour of God to him, and in regard of sanctifying grace. …

[W]e must learn the doctrine of the covenant of grace, that God in Christ is become a Father to us, and carries a fatherly mind to us. In what condition soever we are, he is a father still, and intends us well, and will provide for us in the hardest condition. Having took the relation of a father upon him, do you think that he will fail in the carriage of a father towards us? He is pitiful to us, he respects us in the basest condition. He that knows God to be his father, cast him into what condition you will, knows he hath a good portion. …

What a blessed thing is it to be in the covenant of grace, to have God to be our father, to be in Christ, that let our condition outwardly be what it will be, we shall have grace to carry ourselves in it, God will go along with us by his Holy Spirit!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Contentment</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), 5: 179, 180, 181.</span></figcaption>

<blockquote><p>XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Satisfaction of Christ</cite>, … (Geneva, 1666), Disputation 1, sect. 28 tr. AI at The Received Faith</span></figcaption>

</figure><figure class="quote" id="q-08d63f5f4a" data-kw="">
<blockquote><p>Third, because every agent acts by its form; hence the manner in which it has its form is the manner in which it is an agent. Therefore whatever is primarily and essentially an agent must be primarily and essentially form. Now God is the first agent, since He is the first efficient cause. He is therefore of His essence a form; and not composed of matter and form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 3, Simplicity of God | art. 2, Whether God is composed of matter and form?, I answer that</span></figcaption>

</figure><figure class="quote" id="q-0892c62019" data-kw="">
<blockquote><p>This can be no other in general but that which we call “the covenant of grace.” And it is so called in opposition unto that of “works,” which was made with us in Adam; for these two, grace and works, do divide the ways of our relation unto God, being diametrically opposite, and every way inconsistent, Romans 11:6. Of this covenant the Lord Christ was the mediator from the foundation of the world, namely, from the giving of the first promise, Revelation 13:8; for it was given on his interposition, and all the benefits of it depended on his future actual mediation.</p></blockquote>

</figure><figure class="quote" id="q-a721c77241" data-kw="">
<blockquote><p>Those invitations, when considered as calls, to perform the duties of believing and repenting, belong to the law; but when viewed as expressions of the readiness, or willingness of God, to bestow salvation on sinners, and, as affording them an additional warrant to trust in the compassionate Savior for it, they form a part of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, p. 119</span></figcaption>

<blockquote><p>[i]t contains an excellent system of laws suited to the settlement of the Jews in Canaan, and many principles of equity that may be of great use to other legislators; but as the civil laws in general have only in view temporal property and convenience, they certainly are not unalterable, because they must be suited to the state of society—and other circumstances which may be very various.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Divinity in The Works of the Rev. John Witherspoon</cite>, (Philadelphia, 1802), 4:119–20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted?

1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21).

2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7).

3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed.

4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error</cite>, ch. 19, question 4 (the first commentary defending the Westminster Confession)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d3ee81f1a3" data-kw="">
<blockquote><p>Forasmuch as we have been freed from the teaching of Moses through Christ the Lord, so that it is no longer necessary for us to observe the civil decrees of the law of Moses, namely, in terms of the way and the circumstances in which they are described, nevertheless, insofar as the substance and proper end of these commandments are concerned, and especially those which enjoin the discipline that is necessary for the whole commonwealth, whoever does not reckon that such commandments are to be conscientiously observed is certainly not attributing to God either supreme wisdom or a righteous care for our salvation.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8571cbd103" data-kw="">
<blockquote><p>We commend also the more frequent reading of such scriptures as he that readeth shall think best for edification of his hearers, as the book of Psalms, and such like. When the minister who readeth shall judge it necessary to expound any part of what is read, let it not be done until the whole chapter or psalm be ended; and regard is always to be had unto the time, that neither preaching, nor other ordinances be straitened, or rendered tedious. Which rule is to be observed in all other publick performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Public Worship of God</cite>, Of Publick Reading of the Holy Scriptures</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b150bf6217" data-kw="">
<blockquote><p>While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments</cite>, (1614; London: 1868), bk. 6, Contemplation 2, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-c256e08276" data-kw="">
<blockquote><p>We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us.</p></blockquote>

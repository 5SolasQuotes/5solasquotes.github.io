<blockquote><p>That a right observance of the Lord’s day lies at the foundation of NATIONAL happiness and prosperity, is a truth which follows necessarily from the proofs already given, in other treatises of this series, of its hallowed influence on individuals, families, and churches. Let these be advancing in “whatsoever things are true, honest, and just — pure, lovely, and of good report,” and the community at large cannot fail to participate in this moral proficiency, and to be elevated in reputation and influence. A nation is but an aggregate of individuals. Its character is, sooner or later, determined by theirs; and oscillates towards good or evil just as an influential, though it may not be always an actual, majority of its people are rising or falling in the scale of moral excellence.

This connection is so obvious and immediate, that it is unnecessary to enlarge upon it. It is alluded to here, simply because on this connection rests one of the most direct and satisfactory proofs which can be adduced in favour of the national value of the Sabbath. The community at large is benefited in the same proportion and in the same respects in which individuals are profited by the Sabbath. What then are the blessings which it confers on those who “remember” its holy purposes, and who “keep” it in a right spirit and manner? and what connection have these blessings with national prosperity?

Let us enumerate a few of these. The Sabbath rests both the wearied and toilworn body, as well as the overwrought and overstrained mind; and it successively renovates and invigorates both, for their daily corporeal and intellectual labour. It brings together in the sanctuary employers and employed, masters and servants, for one day at least, under circumstances calculated to promote mutual respect and confidence, and to give each a deeper interest in the other’s welfare. It secures to all classes the opportunity of spending an unbroken day amid the dear domestic circle, and of promoting the highest and noblest interests of themselves and their families. It deepens their reverence for the sovereign authority of the Lord of the Sabbath, who every week appeals to them for the homage of this one day in seven.

It brings them into ennobling converse with the Word of God, and with the great and the good of past generations. It strengthens and expands the minds even of the best educated classes, and still more of those who have not been so favoured, by engaging them at stated periods in meditations on the elevating truths of revelation, and those sublime mysteries of godliness into which angels themselves desire to look. It controls and purifies the moral sensibilities, by exhibiting week after week, in the solemn assembly, a perfect standard of virtue in the divine law, and by urging its imperative obligations on conscience and life by the weightiest considerations which can be addressed to rational beings.

It counteracts the chilling selfishness which uninterrupted contact with the world never fails to engender, by breaking in at short and regular intervals upon its engagements, dissipating its anxieties, and giving room for all the generous sensibilities of the heart to be cherished and expanded in the delightful intercourse of children, friends, and fellow-worshippers. It reminds men of the inalienable right of God to their whole time, though in condescension and mercy he demands the special consecration of only a seventh portion of it. And it teaches them, that for the “six days” in which they are permitted to “labour,” and commanded to “do all their work,” they are as responsible to God as for the Sabbath itself; and that they are bound to live every day, not merely for themselves, but for others, for their country, their religion, the world — for Him “who died for them and on this day rose again.”

In a word, the direct and obvious tendency of the Sabbath, is to render those who “remember to keep it holy” diligent and industrious, enlightened and intelligent, upright and conscientious, disinterested and patriotic, pious and religious. And, by gradually augmenting the number and influence of such men in a community, it controls and modifies public opinion; it diffuses social order among all classes — the result of mutual respect and confidence; it purifies the legislation and policy of a nation; it expands and elevates its views, arms it against every species of oppression and injustice, and fills it with generous impulses towards the attainment of the highest good for itself, and the whole family of man.</p></blockquote>

<blockquote><p>6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good.

7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God.

8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times.

9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power.

10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.</p></blockquote>

<blockquote><p>Paul… his traditions were the Gospel of Christ and honest manners and living, and such a good order as becomes the doctrine of Christ. As that a woman obey her husband, have her head covered, keep silence, and go womanly and christianly apparelled: that children and servants be in subjection: and that the young obey their elders, that no man eat but he that labours and works, and that men make an earnest thing of God’s Word, and of his holy Sacraments: and to watch, fast, and pray, and such like, as the Scripture commands. Which things he that would break were no christian man… There were also certain customs alway which were not commanded in pain of hell or everlasting damnation, as to watch all night, and to kiss one another: which as soon as the people abused, then they brake them. For which cause the bishops might break many things now in like manner. Paul also in many things which God had made free, gave pure and faithful counsel without tangling of any man’s conscience, and without all manner commanding under pain of cursing, pain of excommunication, pain of heresy, pain of burning, pain of deadly sin, pain of hell, and pain of damnation. As thou mayst see. 1 Cor. 7.</p></blockquote>

— William Tyndale, The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together, The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together… (d. 1536; London, 1573), pp. 128-29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPaul%E2%80%A6+his+traditions+were+the+Gospel+of+Christ+and+honest+manners+and+living%2C+and+such+a+good+order+as+becomes+the+doctrine+of+Christ.+As+that+a+woman+obey+her+husband%2C+have+her+head+covered%2C+keep+silence%2C+and+go+womanly+and+christianly+apparelled%3A+that+children+and+servants+be+in+subjection%3A+and+that+the+young+obey+their+elders%2C+that+no+man+eat+but+he+that+labours+and+works%2C+and+that+men+make+an+earnest+thing+of+God%E2%80%99s+Word%2C+and+of+his+holy+Sacraments%3A+and+to+watch%2C+fast%2C+and+pray%2C+and+such+like%2C+as+the+Scripture+commands.+Which+things+he+that+would+break+were+no+christian+man%E2%80%A6+There+were+also+certain+customs+alway+which+were+not+commanded+in+pain+of+hell+or+everlasting+damnation%2C+as+to+watch+all+night%2C+and+to+kiss+one+another%3A+which+as+soon+as+the+people+abused%2C+then+they+brake+them.+For+which+cause+the+bishops+might+break+many+things+now+in+like+manner.+Paul+also+in+many+things+which+God+had+made+free%2C+gave+pure+and+faithful+counsel+without+tangling+of+any+man%E2%80%99s+conscience%2C+and+without+all+manner+commanding+under+pain+of+cursing%2C+pain+of+excommunication%2C+pain+of+heresy%2C+pain+of+burning%2C+pain+of+deadly+sin%2C+pain+of+hell%2C+and+pain+of+damnation.+As+thou+mayst+see.+1+Cor.+7.%E2%80%9D%0A%0A%E2%80%94+William+Tyndale%2C+The+Obedience+of+a+Christian+Man%2C+and+how+Christian+Rulers+ought+to+Govern+in+The+Whole+Works+of+W.+Tyndall%2C+John+Frith+%26+Doctor+Barnes%2C+Three+Worthy+Martyrs+%26+Principal+Teachers+of+this+Church+of+England%2C+Collected+%26+Compiled+in+One+Tome+Together%2C+The+Obedience+of+a+Christian+Man%2C+and+how+Christian+Rulers+ought+to+Govern+in+The+Whole+Works+of+W.+Tyndall%2C+John+Frith+%26+Doctor+Barnes%2C+Three+Worthy+Martyrs+%26+Principal+Teachers+of+this+Church+of+England%2C+Collected+%26+Compiled+in+One+Tome+Together%E2%80%A6+%28d.+1536%3B+London%2C+1573%29%2C+pp.+128-29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d5a0c0a0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d5a0c0a0c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=his%20traditions%20were%20the%20Gospel%20of,thou%20mayst%20see.%201%20Cor.%207&amp;text=his%20traditions%20were%20the%20Gospel%20of%20Christ%20and&amp;text=damnation.%20As%20thou%20mayst%20see.%201%20Cor.%207" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Solution of Doctor Resolutus, his Resolutions for Kneeling</cite>, ([Amsterdam, 1619]), ch. 1, ‘A Table Gesture is Necessary’, pp. 5-6</span></figcaption>

<blockquote><p>[N]ow lest any should mistake, there was three sorts of Laws published in writing at Mount Sinai which were not written before, first, that eternal Moral Law in the 20. chap. of Exodus, now this was not only written for them but for us also, Rom. 15:4. I Cor. 10:11. yea for Saints and Angels eternally, Psal. 119:89; 103:20. not one title of this Law shall fail, and the Apostles do not seek to make void this Law, but do establish it, Rom. 3:31. but then at Mount Sinai there was the Judicial Law given in the 21, 22, 23. chapters of Exodus, and that Law belongs no more to us then our Laws of the Land belong to them any farther then they are grounded on the moral Law.

3. There was the Ceremonial Law given in the 24, 25, 26, 27, 28, 29, 30, 31. now this ceremonial Law being in types and shadows of Christ to come were all ended when Christ was once offered to bear the sins of many, although the Priests stood daily ministering and offering oftentimes the same sacrifices, but when Christ had offered one sacrifice for sins, for ever sat down at the right hand of God, Heb. 9:28. 10, 11, 12.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5c43cb88d6" data-kw="">
<blockquote><p>The gospel, however, is the offer of salvation upon the conditions of the covenant of grace. In this sense, the covenant of grace is formed with all mankind… If this, therefore, were all that is meant by those who make the parties to the covenant of grace, God and mankind in general and all mankind equally, there would be no objection to the doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenant of Grace’ 25</cite>, pp. from his Systematic Theology | Hodge, while having some good things to say, is not recommended on this subject. He expressly makes the Covenant of Grace to be between God and mankind, in some respect, as a basis for the free offer of the Gospel:, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-1cd715af93" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: I. Real and passive, or received, union with Christ, and ingrafting into the new covenant, and thus communion of all goods in Christ. II. Passive reconciliation and justification (as they call it), or rather internal, in us—from which is distinguished external or active justification, which is concerning us. Furthermore, this necessary distinction [between active and passive justification] has been illustrated above all others, and clearly and solidly defended by Dr. [Johannes] Maccovius in his Theological Collection, pt. 4, Disputation 9, compared with pt. 3, Disputation 16, and his particular syllabus of disputations on Justification. And we in the Problems on Justification shall vindicate it ἐν παρόδῳ [en parodō, in passing] from certain objections. There is no reason therefore to pursue it here at greater length. Only I add these three things for the sake of younger students: 1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it. 2. That active justification is distinguished from the decree of justification, as the execution of a decree from the decree, and the emanating action of God from the immanent. Just as the decree of creation must necessarily be distinguished from creation itself. 3. That the same was accomplished fundamentally and κατ’ ἐπαγγελίαν [kat’ epangelian, according to promise] in the first institution, contracting, and promulgation of the new covenant, Gen. 3 [v. 15]; consummatively in the cross and resurrection of Christ, Rom. 8:32–33; 2 Cor. 5:18–19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-d29ae1160a" data-kw="">
<blockquote><p>The second thing to be gathered is that the fathers before Christ, ever since the Fall of Adam, and Christians in the times of the Gospel, did live under the same Covenant for substance, but not for manner of administration, which is most clear by evident testimonies of holy Scripture, and by the very form of the Covenant, which was one before and after the coming of Christ. The same God that calls us, called them to the hope of eternal life: they were endued with the same Spirit, and lived by the same faith. Their sacraments, for substance and signification, agree with ours; and they expected an inheritance everlasting and undefiled. Religion for substance was ever one and unchangeable, and such as were truly religious walked in the same way, and waited for the same heavenly inheritance and everlasting crown of glory. The Church before Christ may be considered as an heir, or as an infant, according to the substance of the covenant, or according to the manner of administration. In the first respect the Church is under the Covenant or promise, and her people are called a free and willing people, an heir of heavenly and spiritual blessings. In the latter respect she is under the Covenant, in respect of the different administration, and her people are called a servile people in comparison, an heir under tutors and governors, not differing from a servant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’; p. 27</span></figcaption>

</figure><figure class="quote" id="q-300543fdb6" data-kw="">
<blockquote><p>From all this it follows: First, that all the faithful are of the same faith with Abraham. The father and the sons-spiritual are of the same belief: as they do partake of the same spiritual privileges. It is one God that justifies the circumcision and the uncircumcision, and it is the same faith whereby the promises of mercy are embraced. Zaccheus is called the son of Abraham, and he believed in Christ as did Abraham. 2. Not only promises of temporal good things, but of spiritual and eternal were made to the patriarchs in the Covenant of Grace, and sought and obtained by them. They looked for a city whose builder and maker the Lord is. (Heb. 11:11-12) Remission of sins and life everlasting was preached in the Covenant, sealed in the sacrament, and typified by the land of Canaan. To conceive the fathers to be an assembly of brute beasts, which looked to be fed with earthly blessings alone, is highly to dishonor them, and lessen the grace and mercy of God towards them. 3. Sacramental phrases, wherein the name of the thing signified is given to the sign, are ancient and familiar; as circumcision is called the Covenant, and the rock Christ. Why then should our adversaries stumble at this, that in the sacrament of the Supper the bread is called the body of Christ? 4. In this expression of the Covenant, the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“From all this it follows: First, that all the faithful are of the same faith with Abraham. The father and the sons-spiritual are of the same belief: as they do partake of the same spiritual privileges. It is one God that justifies the circumcision and the uncircumcision, and it is the same faith whereby the promises of mercy are embraced. Zaccheus is called the son of Abraham, and he believed in Christ as did Abraham. 2. Not only promises of temporal good things, but of spiritual and eternal were made to the patriarchs in the Covenant of Grace, and sought and obtained by them. They looked for a city whose builder and maker the Lord is. (Heb. 11:11-12) Remission of sins and life everlasting was preached in the Covenant, sealed in the sacrament, and typified by the land of Canaan. To conceive the fathers to be an assembly of brute beasts, which looked to be fed with earthly blessings alone, is highly to dishonor them, and lessen the grace and mercy of God towards them. 3. Sacramental phrases, wherein the name of the thing signified is given to the sign, are ancient and familiar; as circumcision is called the Covenant, and the rock Christ. Why then should our adversaries stumble at this, that in the sacrament of the Supper the bread is called the body of Christ? 4. In this expression of the Covenant, the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.”

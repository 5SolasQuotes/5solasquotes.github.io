<main class="wrap"><figure class="quote" id="q-5048cbc324" data-kw="">
<blockquote><p>…they were chosen to be faithful witnesses to the world of the doings, sufferings and doctrine of Christ: the Holy Ghost was sent to teach them in all truth. Here we may rest upon a sure foundation, against the which the gates of hell cannot prevail… To this antiquity of apostolic doctrine, let us firmly adhere. This is the clearest mirror whereinto the precepts of wholesome doctrine are contained. … those bishops and doctors following, who keep inviolably that form of wholesome doctrine which they received from the apostles, these, I say, alanerly are to be counted true successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-simson.html">Patrick Simson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Compend of the History of the First Ten Persecutions moved against Christians</cite>, (Edinburgh: Hart, 1613) Simson (1566-1618) was a Scottish presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-068e7925f0" data-kw="">
<blockquote><p>The language here employed [in the Scottish subscription formula in 1694 &amp; 1711] is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-7b62193997" data-kw="">
<blockquote><p>For it is said [in Acts 8] that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning [of the Romanist opponent], would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-mestrezat-latin.html">Jean Mestrezat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Church</cite>, (1649), bk. 1, ch. 1 as quoted in J.A. Turretin, Discourse concerning Fundamental Articles (London: Darby, 1720), Appendix, “Testimonies from Church History” tr. ChatGPT-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“For it is said [in Acts 8] that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning [of the Romanist opponent], would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian…”

</figure><figure class="quote" id="q-9c67a990d8" data-kw="">
<blockquote><p>The requiring subscription to the 39 Articles is a great imposition: I believe them all myself, but as there are some which might be expressed more unexceptionably, so I think it a better way to let such matters continue to be still the standard of doctrine and to censure those who teach any contrary tenets, than to oblige all who serve in the Church to subscribe them. The greater part subscribe without ever examining them, and others do it because they must do it, though they can hardly satisfy their consciences about some things in them. Churches and societies are much better secured by laws than by subscriptions: it is a more reasonable as well as a more easy mode of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-burnet.html">Gilbert Burnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of his own Time</cite>, … new ed. (London: Orr, 1850), vol. 2, Conclusion, p. 904 Burnet (1643–1715) was a Scottish philosopher and historian, and Bishop of Salisbury.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-1fec5d9994" data-kw="">

<blockquote><p>In the first place, what is the great object for which the Christian Church was instituted, apart from those secondary and subordinate ones, which it may attain, but for which it was not primarily established? There can be no doubt that Scripture represents the one great object of the establishment of a Church in the world to be the glory of God, in the salvation of sinners, by means of the publication of the gospel. For this end the Church was instituted at first; for this end it continues to exist from one generation to another; and it is only in so far as it accomplishes this one grand object of its existence, that it serves the proper and primary purpose of a Church at all.

Judging, then, by this first test, we are warranted in saying, that to hold and to preach the true faith or doctrine of Christ is the only sure and infallible note or mark of a Christian Church, because this is the one thing for the sake of which a Church of Christ has been instituted on earth. A true faith makes a true Church, and a corrupt faith a corrupt Church; and should it at any time apostatize from the true faith altogether, it would, by the very act, cease to be a Church of Christ in any sense at all. The Church was established for the sake of the truth, and not the truth for the sake of the Church.

In the second place, what are those things which, unlike the truth, have been instituted for the sake of the Church, and not the Church for the sake of them? Such, unquestionably, are the ordinances, office-bearers, and discipline which have been established within the Christian society. These being instituted for the advantage and edification of the Church, are, from their very nature, subordinate and secondary to the truth, for the holding and publication of which both they and the Church itself exist.

They may be necessary, and are necessary, for the perfection of the Church, but they are not necessary for its existence. They cannot be accounted fundamental, in the sense that without them it would cease to exist as a Church at all. The single thing essential to the being of a Christian Church on earth is the faith or doctrine of Christ. According to the distinction already laid down, for this thing the Church was instituted, and not this thing for the Church.

Other things, such as sacraments and ordinances, the ministry, and the outward administration of the Church, are not essential to it, but only accidental; they are necessary for its wellbeing, but not for its being. According to the same distinction, these things were instituted for the Church, and not the Church for them. The only true and infallible note or mark of a Church of Christ is the profession of the faith of Christ. According to the well-known saying of Jerome, when speaking of the prevalence of Arianism in the Church of the fourth century: Ecclesia non in parietibus consistit, sed in dogmatum veritate; Ecclesia ibi est, ubi fides vera est.

The one note or mark, then, which is common to every true Church, and peculiar to every true Church, is the profession of the faith of Christ. Whatever be the differences in other respects, whatever be the distinction in outward form or administration, in ordinances, in government, in worship, these things are subordinate to the one criterion of the profession of the true faith, which marks by its presence a true Church, and declares by its absence an apostate one. It is not the succession of outward forms and ordinances, the hereditary derivation from primitive times of a ministry and sacraments, that constitute a Church of Christ, or lay the foundation for its character and privileges.

These things were made for the Church, and not the Church for them. These things may be good to provide for its wellbeing; they will not suffice to prove its existence. It is the succession of the truth alone that marks out a Christian Church; and the stamp of birth and lineage that belongs to it is not the outward apostolic pedigree of its ministers, but the heritage of that faith which apostles first taught and published. It is not the want of a spotless ecclesiastical genealogy, or of sacraments derived by regular succession from primitive times, that will unchurch a Christian society, but the want of that apostolic doctrine which alone marks out a Church of Christ.

At this point, and in the very definition of a Church, begins that error which is developed in the intolerant principles of many in the present day who would unchurch all denominations but their own; and which manifests itself also in that outward formalism — Popish or Tractarian — which ascribes to external ordinances a value and sacredness which belong only to the truth as it is in Jesus.

Admit that the possession of a true faith, and that alone, is of the essence of a Church, and you assign to the truth the place and importance that rightfully belong to it. But join to the possession of the true faith the administration of outward ordinances, as necessary to constitute a Christian Church, and you assign to outward ordinances a rank and value which are not justly theirs, and make them of primary, and not, as they truly are, of secondary importance.</p></blockquote>

<blockquote><p>In the midst of his critique of the Presbyterian Church in Ireland, the Revd James Kennedy, the Covenanter minister at Limavady (who later moved to America), pointed out that the PCI was inconsistent in professing adherence to the Westminster Standards while, at the same time, admitting those of erroneous sentiments into their pulpits:

Another step in reform we would endeavour to bring to our brethren to take would be the ceasing to employ to teach their congregations men whom in consistency they must consider to be erroneous in sentiment and principle. We have already referred to the fact, that members of the Assembly freely invite to their pulpits, to teach their people, Congregationalists and Baptists; and the time is not long past when even Methodists – known to be of Arminian sentiments – were to be found occasionally in the pulpits of Presbyterian ministers. […]

The Presbyterians of Ireland in the times of the Covenant acted not thus, for as [James Seaton] Reid well shews, when Arminians and Baptists attempted to shew their face in any locality, the most strenuous efforts were made to suppress their erroneous teachings. All this may be thought very uncharitable to Baptists, but really after all, men who deny that we are even baptized – hold us an unbaptized mass of unconverted professors, and must in consistency deny that we have a sacrament at all, and thus virtually unchurch us, deserve little charity at our hands, and we have no sympathy with the inconsistency of the men who by patronising such, pull Presbyterianism down with the one hand while they build it up with the other.</p></blockquote>

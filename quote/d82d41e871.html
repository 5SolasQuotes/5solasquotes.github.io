<main class="wrap"><figure class="quote" id="q-d82d41e871" data-kw="">
<blockquote><p>Wisdom is an architectonic system commanding and directing all others. Now this is most peculiar to theology, which is so far the arbiter and mistress of all sciences that it judges of them and cannot itself by judged by another. For all other systems must be referred to it as a standard, and whatever does not agree with theology must be rejected from them. So although it does not prescribe to other systems principles and objects, yet it so far rules over them (because it establishes their limits) that they neither dare hold to any object opposed to theology, nor to use their principles against it. And also with respect to the ultimate end (viz., the glory of God) which although they do not immediately attain, yet they are bound to have such a direction. […]

If theology takes some things from other systems, it is not as an inferior from superiors, but as a superior from inferiors (as a mistress freely using her handmaids). Theology does not so much take from others, as presupposes certain previously known things upon which it builds revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 20.</span></figcaption>

<blockquote><p>Arius, although he would say that Christ was before the blessed Virgin and that the person of the Father is other than the person of the Son, nevertheless made a three-fold attribution to Christ: first, that the Son of God was a creature; second, that he is not from eternity, but was formed the noblest of all creatures in time by God; third, that God the Son is not of one nature with God the Father, and therefore that he was not true God.

But this too is erroneous and contrary to the teaching of the Holy Scriptures. For it is written: I and the Father are one (John 10:30), that is, in nature; and therefore, just as the Father always existed, so also the Son; and just as the Father is true God, so also is the Son. That Christ is a creature, as said by Arius, is contradicted by the fathers in the Creed: true God of true God; and the assertion that Christ is not from eternity but in time is also contrary to the Creed: begotten not made; and finally, that Christ is not of the same substance as the Father is denied in the Creed: consubstantial with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositio in Symbolum Apostolorum</cite>, (1273), S2.7.</span></figcaption>

<blockquote><p>If the changeable [being] is taken strictly [see p. 11], there must be a subject of the change that is relatively permanent; therefore there is something else that is absolutely and independently permanent (from conclusion 2…); therefore there is something that is in itself unchangeable. If the changeable is taken in a broad sense then either it always existed thus or it did not; if it did not it is transient, and then too the unchangeable must exist. If the changeable always existed thus in fact, nevertheless it could not be altogether independent with respect to its persistence, for otherwise it would not be changeable in the broad sense. Therefore it would be dependent as to its persisting; therefore it would, like the relatively persistent, require a first independent thing existing simultaneously that is unchangeable also in the broad sense.” p. 37 12. An eternal being actually exists, or something actually existing is eternal.

13. An unchangeable being actually exists, or something actually existing is unchangeable.

14. Therefore being is divided into temporal and eternal (from conclusions 8, 9, and 10).

15. Therefore being is divided into unchangeable and changeable. If changeable is taken broadly [see p. 11], this conclusion follows from conclusions 8, 9, and 13. If it is taken strictly the existence of the unchangeable follows from what was said above about constant elements of our experience [see p. 33]. The existence of the unchangeable follows from conclusion 13.</p></blockquote>

<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

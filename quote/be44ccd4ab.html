<main class="wrap"><figure class="quote" id="q-be44ccd4ab" data-kw="">
<blockquote><p>(First,) God is an infinite Ocean of Sweetness, Perfection, and Glory; he has all Good and all Perfection in Him, as in its Fountain, Fulness, and Purity; as all the Lines in the Circumference do meet, and are united in the Center; so all Excellencies and Perfections do meet, and are united in God; and as God has all Excellencies and Perfections in him, so (Secondly) he perfectly understands his own infinite Perfections, contemplates them, and has an infinite delight, solace, and satisfaction in them; he is infinitely pleased and at rest in himself, and in the vision and fruition of his own Perfections, and this is his blessedness; hence he tells us, that he is God All-sufficient; that is to say, for and to himself, as well as for and to his people, Gen. 17.1. I am God All-sufficient, I am my own blessedness; and Abraham, I am thy blessedness, and I have enough for both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A beam of divine glory, or, The unchangeableness of God opened, vindicated, and improved: whereunto is added, The soul’s rest in God. By Edward Pearse. To which is prefixed the author’s last letter, written in the time of his sickness to some peculiar friends</cite>, (London: Jonathan Robinson, 1674), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“(First,) God is an infinite Ocean of Sweetness, Perfection, and Glory; he has all Good and all Perfection in Him, as in its Fountain, Fulness, and Purity; as all the Lines in the Circumference do meet, and are united in the Center; so all Excellencies and Perfections do meet, and are united in God; and as God has all Excellencies and Perfections in him, so (Secondly) he perfectly understands his own infinite Perfections, contemplates them, and has an infinite delight, solace, and satisfaction in them; he is infinitely pleased and at rest in himself, and in the vision and fruition of his own Perfections, and this is his blessedness; hence he tells us, that he is God All-sufficient; that is to say, for and to himself, as well as for and to his people, Gen. 17.1. I am God All-sufficient, I am my own blessedness; and Abraham, I am thy blessedness, and I have enough for both.”

1/08/17/edward-pearse-on-gods-infinite-satisfaction-in-himself/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d229d0aff" data-kw="">
<blockquote><p>There remains the seventh part of the sentence propounded, to wit, that man is justified by the iustice of God, whereby He accepts Christs satisfaction for the elect. Of this Paul testifies, Rom. 3:25-26, where he says, ‘Whom’ (to wit Christ) ‘God hath set forth to be are conciliation through faith in his blood to declare his justice, by the forgiveness of the sins that are past through the patience of God, to show at this time his iustice, that He might be just and a justifier of him which is of the faith of Jesus.’ By which words the apostle teaches that God declares his justice, in as much as he forgives sins to them for whom Christ has satisfied, namely the believers. For it is the part of justice, to be content, if satisfaction be made for the debt by a surety, and not to exact satisfaction of the debtor himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned and Profitable Treatise of Man&#x27;s Justification</cite>, (London, 1599), bk. 1, ch. 10, pp. 45-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-a4e79c9d9f" data-kw="">
<blockquote><p>The incarnation and vicarious satisfaction for sin by one of the persons of the Godhead, demonstrates the infinity of the evil. It is incredible that the Eternal Trinity should have submitted to such a stupendous self-sacrifice, to remove a merely finite and temporal evil.

The doctrine of Christ’s vicarious atonement, logically, stands or falls with that of endless punishment. Historically, it has stood or fallen with it. The incarnation of Almighty God, in order to make the remission of sin possible, is one of the strongest arguments for the eternity and infinity of penal suffering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), p. 153.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

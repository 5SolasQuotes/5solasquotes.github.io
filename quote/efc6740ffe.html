<main class="wrap"><figure class="quote" id="q-efc6740ffe" data-kw="">
<blockquote><p>This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Reconciliation</cite>, (d. 1646; 1657; Soli Deo Gloria, 1997), ch. 74, The Fourteenth Argument, pp. 316-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-c774472096" data-kw="">
<blockquote><p>[For He does not punish from his heart] it arises not from God’s voluntary desire, but from the sin of man that God punishes; [and makes sorrowful the children of men] gives them cause by afflicting them to be vexed and grieved. Doctrine. [for etc.] sin constrains the Lord to afflict his dearest children: for the reasons hereof, see verse 27. … Doctrine. [not punish from his heart] God takes no delight in afflicting his children, Ps. 81:13; Isa. 1:24. The use is to teach us, first, to abhor their profaneness that say God sports Himself in punishing man. Secondly, by his example, to censure others with all remorse and pity, not delighting to disgrace them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-udall.html">John Udall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, (London: Orwin, 1593), ch. 3, on v. 33, p. 127</span></figcaption>

</figure><figure class="quote" id="q-7271d37246" data-kw="">
<blockquote><p>5. That we must not dote upon sensible consolation. The merciful nature of God should be a support to us though we see nothing of the effects of it in the course of his dealings with us; and we should believe his love when we do not actually feel it. Job 10:13, ‘And these things hast Thou hid in thine heart; I know that this is with Thee.’ He speaks of his favorable inclination to show pity to his creatures. We are not able always to reconcile his present dispensations with his gracious nature, nor our former experience of his goodnessת yet faith must not quit its holdfast but we must see what is hid in God’s heart and comfort ourselves with concealed favor and mercy, when we cannot comfort ourselves with felt favor and mercy. Though mercies be not visible and obvious to sense, yet the disposition and inclination is ever in God unchangeable and sure. A withdrawn God is a merciful God still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture</cite>, … (London: J.D., 1693) | A Sermon on Isa. 50:10, p. 813</span></figcaption>

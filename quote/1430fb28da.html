<blockquote><p>It [Creation] is defined as an external act of God, whereby, by the command of His will alone, He made the whole world out of nothing in the beginning of time in the space of six days, for the praise of His glory to be demonstrated in it, and the salvation of the elect.</p></blockquote>

<blockquote><p>[Thomas, Summa, pt. 1, quest. 25, art. 2:] Reply to second objection. ‘Even if it were to produce no effect, the power of God would not be ineffectual: because a thing is ineffectual which is ordained to an end to which it does not attain. But the power of God is not ordered toward its effect as toward an end; rather it is the end of the effect produced but it.’ St. Thomas in this reply observes that ‘the power of a univocal agent is wholly manifested in its effect. The generative power of man is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect,’ just as the power of the sun is not wholly manifested, for instance, in the ripening of the fruits of the earth. But God evidently is not a univocal agent. ‘Hence his effect is always less than his power.’ Nevertheless His infinite power is manifested in the mode of producing things, inasmuch as He produces something out of nothing, or from no presupposed subject. Analogically we say that men of great genius are superior to the works they produce; but it is, nevertheless, in the way they produce these works that their superiority is seen. On the contrary, men of ordinary ability are, so to speak, univocal agents, and the whole of their power is manifested in the effect produced. They could not do more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The One God: a Commentary on the First Part of St. Thomas’ Theological Summa</cite>, (Herder Book Co., 1943), ch. 25, p. 721</span></figcaption>

<blockquote><p>9. Ninth [Objection to the simplicity of God]: God is in all things, and all things are in God. To which pertain those monstrous statements that God is prime matter, that man’s soul is a particle of divine breath and that God is the soul of the world; that God communicates Himself to us and we are so partakers of his divine nature that men, having been deified and transformed into God, are to be said to be essentially united with him – such as occur in the fanatics and Enthusiasts, the Henric-Nicolaitans, Weigelians, etc., about whom elsewhere. Meanwhile the treatise of the most noble Lord of Mont Saint-Aldegonde against the Libertines can be consulted, and Stegmann in the 2nd appendix of his Photianism, On True Christianity, with which compare Thomas, Summa Theologiae, pt. I, question 3, article 8, and Against the Gentiles, bk. 1, ch. 17, 20, 26-27. Response: Let those of that type briefly take these sources of solutions, thence let them apply them to those petty reasons or rather insanities.

1. God is in all things not as an essential or integral part in the whole, or as the contained in its containing, or as a subject under its accident, or as an accident in its subject, but as a cause is present to that on which it immediately acts. God is present, I say, to all things by essence, not because he is of the essence of things or something of their essence – whether as transient or constituent matter, or as informing form, or as perfecting accident. For he is most one, alone, divided, distinct from all – which also some think can not badly be intimated in Scripture by the attribute of holiness. In addition, if he came into composition with something, that would be more perfect than God, because every composite is more perfect than the compounding parts or principles. See the special reasons in Thomas and his commentator Ferrariensis in the cited place, and Summa Theologiae I, question 8, article 1.

2. All things are in God in three ways: in his power as in an efficient cause, in his idea as in an exemplar cause, in his knowledge as in one knowing. Whence the threefold being of creatures in God: eminent, ideal, intelligible. But this whole being is objective, without any composition or commingling, just as light is in air and air in light: Augustine, On the Literal Interpretation of Genesis, bk. 4, ch. 12, and On the Trinity, bk. 14, ch. 12; Cyril of Alexandria on John, bk. 9, ch. 40. See further the Scholastics on Summa Theologiae, pt. I, quest. 18, art. 4; Suárez, On God, bk. 2, ch. 2; and the commentators on Acts 17:28; 2 Pet. 1:4. And the philosophers explaining that axiom: ‘In a certain way, all things are four: God, heaven, prime matter, intellect.’

3. God communicates his essence, life, goodness outside Himself, or ad extra, in the genus of efficient, exemplar, final cause, and indeed not naturally but freely, not through essence but through grace, so that for example all things participate of his goodness and are good by it extrinsically and causally, but by their proper goodnesses formally: Thomas, Summa Theologiae, pt. I, quest. 7, art.

4. Meanwhile they remain most distinct in individual and in species or univocal genus: the essence or goodness of God, and the essence or goodness produced in creatures to the likeness or image of the divine. But that communication of the divine essence is fivefold: 1. through creation, 2. through the grace of adoption, 3. through glory and beatitude, 4. through love and desire, 5. through incarnation;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1, On the One &amp; Most Simple Essence of God, pp. 233-34 Latin</span></figcaption>

n%2C+if+he+came+into+composition+with+something%2C+that+would+be+more+perfect+than+God%2C+because+every+composite+is+more+perfect+than+the+compounding+parts+or+principles.+See+the+special+reasons+in+Thomas+and+his+commentator+Ferrariensis+in+the+cited+place%2C+and+Summa+Theologiae+I%2C+question+8%2C+article+1.+2.+All+things+are+in+God+in+three+ways%3A+in+his+power+as+in+an+efficient+cause%2C+in+his+idea+as+in+an+exemplar+cause%2C+in+his+knowledge+as+in+one+knowing.+Whence+the+threefold+being+of+creatures+in+God%3A+eminent%2C+ideal%2C+intelligible.+But+this+whole+being+is+objective%2C+without+any+composition+or+commingling%2C+just+as+light+is+in+air+and+air+in+light%3A+Augustine%2C+On+the+Literal+Interpretation+of+Genesis%2C+bk.+4%2C+ch.+12%2C+and+On+the+Trinity%2C+bk.+14%2C+ch.+12%3B+Cyril+of+Alexandria+on+John%2C+bk.+9%2C+ch.+40.+See+further+the+Scholastics+on+Summa+Theologiae%2C+pt.+I%2C+quest.+18%2C+art.+4%3B+Su%C3%A1rez%2C+On+God%2C+bk.+2%2C+ch.+2%3B+and+the+commentators+on+Acts+17%3A28%3B+2+Pet.+1%3A4.+And+the+philosophers+explaining+that+axiom%3A+%E2%80%98In+a+certain+way%2C+all+things+are+four%3A+God%2C+heaven%2C+prime+matter%2C+intellect.%E2%80%99+3.+God+communicates+his+essence%2C+life%2C+goodness+outside+Himself%2C+or+ad+extra%2C+in+the+genus+of+efficient%2C+exemplar%2C+final+cause%2C+and+indeed+not+naturally+but+freely%2C+not+through+essence+but+through+grace%2C+so+that+for+example+all+things+participate+of+his+goodness+and+are+good+by+it+extrinsically+and+causally%2C+but+by+their+proper+goodnesses+formally%3A+Thomas%2C+Summa+Theologiae%2C+pt.+I%2C+quest.+7%2C+art.+4.+Meanwhile+they+remain+most+distinct+in+individual+and+in+species+or+univocal+genus%3A+the+essence+or+goodness+of+God%2C+and+the+essence+or+goodness+produced+in+creatures+to+the+likeness+or+image+of+the+divine.+But+that+communication+of+the+divine+essence+is+fivefold%3A+1.+through+creation%2C+2.+through+the+grace+of+adoption%2C+3.+through+glory+and+beatitude%2C+4.+through+love+and+desire%2C+5.+through+incarnation%3B%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1%2C+On+the+One+%26+Most+Simple+Essence+of+God%2C+pp.+233-34+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe9632cbfd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e9632cbfd6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/creation#:~:text=9.%20Ninth%20%5BObjection%20to%20the%20simplicity,love%20and%20desire%2C%205.%20through%20incarnation&amp;text=9.%20Ninth%20%5BObjection%20to%20the%20simplicity%20of%20God&amp;text=4.%20through%20love%20and%20desire%2C%205.%20through%20incarnation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

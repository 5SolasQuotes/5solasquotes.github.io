<main class="wrap"><figure class="quote" id="q-f58d648fcf" data-kw="">
<blockquote><p>Question 1: If multitudes and people externally Covenanted with God, though not internally, whom the Lord calls his people and chosen by him, Deuteronomy 7:6; Deuteronomy 10:15 be rightly constitute the Visible Church, as Mr Thomas Hooker granteth, then Kingdoms must be his Visible Church.

Answer: No doubt, Egypt, Assyria, all Nations, all the ends of the world, all the Kingdoms of this world are Prophesied to be the Kingdoms and the Covenant people of God, and the Lord challengeth them as his (Isaiah 19:25, blessed by Egypt my people) Isaiah 2:1-3; Psalm 22:27; Revelation 11:15; Psalm 96-98; Isaiah 42:10; Isaiah 49:7-8, 20-21; Song of Solomon 8:8; Acts 13:46, 47; Romans 15:8-12, must be visible Covenanted Churches of God, to whom the seals of the Covenant are due; But that none in Egypt, Assyria, of all the called Gentiles, though visibly and professedly in Covenant, and affirmed by the mouth of the Lord to be his people, the Sifter of the Jewish Church, and his Kingdoms, are members of the Visible Church, or hath right to membership and seals, except men judge them to be real converts, sound believers, and so internally called and chosen, is to prefer the judgment of men, to the Word of God. […] [T]here be Prophecies under the Messiah, that all the Kingdoms of the world, Revelation 11:15, Egypt, Assyria, Isaiah 19:25, all Nations, Isaiah 2:2, all the Gentiles, Isaiah 60, shall be the confederate people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 199-201.</span></figcaption>

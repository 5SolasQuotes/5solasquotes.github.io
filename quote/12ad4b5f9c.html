<main class="wrap"><figure class="quote" id="q-12ad4b5f9c" data-kw="">
<blockquote><p>Neither Zwingli, nor Calvin, nor any one of us, places, without distinction in heaven with the saints, all infants who die without baptism, whether unborn or in birth, or while they are carried to baptism, but they pronounce this, by the law of charity, of the infants alone of the Church, born in the Covenant if they be prevented by death, nevertheless, without interference with the election of God, which as of old in the family of Abraham and Isaac, so in after time often hath made, and doth make a discrimination which we are neither to search into nor to scoff at, but to adore (Rom. 9:11). This is the constant judgment of ourselves, and of our divines concerning this question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism and Infant Salvation</cite>, As quoted in Krauth, … (Philadelphia: Lutheran Books Store, 1874), p. 20. Krauth gives as the reference: Pareus, Castigations in Bellarmine on the Loss of Grace (1613), Book 6, p. 871, though the page number does not exactly correspond to the Google Books edition (1613), though it appears to be close.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c603154c54" data-kw="">
<blockquote><p>Are all these benefits received by baptism, equally by all those which receive the same? No, for they are not alike: for the ingrafting into Christ, and the benefits which follow it, are not bestowed upon the reprobate, although they be offered them when they are baptised. For God calleth and justifieth, regenerateth, and glorifieth effectually them whom He hath elected and predestinated to these things, Rom. 8:3, but the elect, as well infants, as they of years are equally incorporated into Christ, either in, or before baptism, and are endowed with the imputation of his righteousness, forgiveness of sins, and the right of eternal life, for they are all alike the sons of God, but regeneration is not wrought alike in all, nor are the gifts of the spirit, faith, hope, and charity, given alike unto all, or received alike of all, but according to the pleasure of God, as the parable of the talents teaches, and Eph. 4:7. To everyone is given grace according to the measure of the gifts of Christ: and we do see that the effects of regeneration are more and greater in some, and in other some fewer and lesser.</p></blockquote>

<blockquote><p>8. [Baxter complains:] The [Anglican] rubric [post-1662] to which we [ministers] must declare our assent, approbation and consent [upon pain of defrocking], has this article of faith: ‘It is certain by God’s Word that children which are baptized, dying before they commit actual sin are undoubtedly saved.’ [1.] And the rubric at burial excepts all the unbaptized from Christian Burial, according to the office. …

12. There is no one Word of God cited in the rubric which tells us that it is certain by the Word of God.

13. Among Christian divines there are all these various opinions about the salvation of infants:

1. Some hold that the Covenant being to the faithful and their seed, and their children being holy, all the children of sincere Christians are certainly in a state of salvation, being by the parents intentionally dedicated to God, before or without baptism: And that baptism is but their solemn investiture in that state which was theirs by right before.

2. Others think that this right to salvation belongs to the children of all professed Christians godly and ungodly.

3. Others think that it belongs to all infants in the world.

4. Others think that it belongs only to sincere believers’ children that are baptized.

5. Others that it belongs to sound and unsound Christians’ baptized infants.

6. Others that it belongs to all baptized infants whose soever.

7. Others hold that it belongs also to the children of sincere adopters or proprieters.

8. Others that it belongs to such as even bad Christians adopt or own.

9. Others that they that have sincere godfathers, though not proprieters, are saved.

10. Others that even unsound or hypocritical Christian godfathers may suffice to their salvation.

11. Others that the ministers or the Church’s sincere (or professed) Faith is hereto sufficient.

12. And others think that only the elect are saved, of whom some are baptized and some unbaptized, but no man knows who they are. Out of all these opinions the Convocation has chosen one as an article of Faith of undoubted certainty by the Word of God.

13. The non-conformists know of no Word of God which ascertains salvation to any known determinate infants but the great Covenant of Grace, ‘I will be thy God, and the God of thy seed;’ which seed God uses as if they were parts of the parents, Ex. 34:6-7, and Second Commandment, and says to believers, ‘Else were your children unclean, but now, etc.’ [1 Cor. 7:14].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 9, pp. 169, 172-74</span></figcaption>

<blockquote><p>…or will you deny that any infants perish in original sin, as Pelagius did?</p></blockquote>

— William Twisse, A Discovery of Dr. Jackson’s Vanity… (London: Thorp, 1631), sect. 2, ch. 13, p. 482">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6or+will+you+deny+that+any+infants+perish+in+original+sin%2C+as+Pelagius+did%3F%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Discovery+of+Dr.+Jackson%E2%80%99s+Vanity%E2%80%A6+%28London%3A+Thorp%2C+1631%29%2C+sect.+2%2C+ch.+13%2C+p.+482&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ed3474beb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ed3474beb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-salvation-of-infants-in-without-the-church/#:~:text=or%20will%20you%20deny%20that%20any,in%20original%20sin%2C%20as%20Pelagius%20did&amp;text=or%20will%20you%20deny%20that%20any%20infants%20perish&amp;text=infants%20perish%20in%20original%20sin%2C%20as%20Pelagius%20did" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bd927a7639" data-kw="">
<blockquote><p>And, in the first place, I assume as admitted by all orthodox writers upon the subject, although it is not safe to pry too curiously into the secrets of the divine counsels or to draw too confident conclusions concerning the lot of those dying in infancy, that a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honored with the saving fellowship of his covenant. For it would be altogether wrong to suppose that the promise made to Abraham (“I will be thy God, and the God of thy seed after thee”) has been either revoked or brought within narrower limits by the introduction of the better dispensation, especially seeing that Peter, on the glorious day of Pentecost, impressed upon his hearers that the promise of the Spirit of grace was given not to themselves only but also to their children; and that the Lord Jesus took up in his arms the children of covenanted parents, blessed them, and, in a word, declared that of such is the kingdom of heaven (which Scripture testimonies I do not feel myself called to dwell upon at present, as I have expounded them at length in another place). … Indeed, the height and depth of eternal predestination forbids us to pry into its hidden things with more than a lawful curiosity. Yet, judging soberly, there can be nothing to prevent us from conferring the sign and seal of the covenant upon those whom it is proper to acknowledge as the covenanted people of God; meanwhile the secret things of predestination have been left to God according to his freedom. … XIV. From all this we infer that there is no such thing signified and sealed, much less conferred, upon all covenanted infants in baptism as a kind of common justification, regeneration, and sanctification, which shall place them in a state of salvation prior to the use of reason and become insufficient for their salvation after they have grown up, nor any remission of original sin, whether revocable or irrevocable; but that the whole efficacy of baptism, insofar as it implies a state of salvation even conformably with that period of life, belongs exclusively to infants who are elected. Hence, among orthodox theologians disputing about the efficacy of baptism, the question is chiefly, if not solely: What benefits does it confer upon elect infants, who alone in the estimation of God have, strictly speaking, a right to it?</p></blockquote>

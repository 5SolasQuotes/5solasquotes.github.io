<main class="wrap"><figure class="quote" id="q-4a00019d58" data-kw="">
<blockquote><p>1. It has been already declared (yea, adjudged) that, by that statute [the Act of Parliament in the 13th year of Elizabeth], there is no liberty for any man to subscribe the [39] Articles with any limitation, or explication, if any credit be given to Sir Edward Cook, who says (Institutes, 4.47, p. 324, ed. 1658), that he has heard Wray, chief Justice in the King’s Bench, Pasch. 23 Elizabeth (quoting Dier 23 Elizabeth, 377, bk. 6, fol. 69, Grene’s Case, Smith’s Case) report that where one Smith subscribed to the said 39 Articles of Religion with this addition, ‘so far forth as the same were agreeable to the Word of God,’ that it was resolved by him and all the judges of England that this subscription was not according to the Statute of 13th Elizabeth, because the statute required an absolute subscription, and this subscription made it conditional; and that this act was made for avoiding diversities of opinions, etc. And, by this addition the party might by his own private opinion take some of them to be against the Word of God: and by this means diversities of opinions should not be avoided, which was the scope of the statute; and the very act itself made touching subscription, hereby [be] of none effect. Thus, he. 2. This shows a necessity of repealing that branch of the act, so far as it concerns subscription, because: 1. If we may not subscribe with such an addition, ‘so far forth as the same Articles are agreeable to God’s Word,’ it must needs be granted that the composers of them are admitted to be infallible; and their Articles, of equal authority with canonical Scripture: or else that the statute intended to tyrannize over the consciences of men, which is not to be imagined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons showing the Necessity of Reformation… (London: Cotrel, 1660), I. ‘Of Doctrine,’</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-96dd2e7d44" data-kw="">
<blockquote><p>III. In our time in Germany, the Augsburg Confession [1530] is known to everyone as the first and oldest Protestant confession… since in the foundation and chief principles of the Christian religion it accords with the confessions publicly issued and approved by the other Protestant and Reformed churches beyond Germany, as indicated in the Harmony of Protestant Confessions. Therefore, next after the Word of God and the universal Apostolic, Nicene, Athanasian, Ephesian and Chalecedonian creeds, we hereby profess the aforesaid Augsburg Confession, understood in a legitimate and well-grounded sense so as it agrees and harmonizes with the true and infallible Word of God to which all must duly remain subject. In like manner, we hold the confessions of the other Protestant and Reformed churches as that which is not in opposition to the Word of God but derived from it and in accord with it…</p></blockquote>

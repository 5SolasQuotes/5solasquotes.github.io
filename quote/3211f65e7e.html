<main class="wrap"><figure class="quote" id="q-3211f65e7e" data-kw="">
<blockquote><p>Let us not abuse our selves, for it may seem to us that the things which we do to keep us in league with the children of this world, are not of great importance. Let us beware that Satan draw us not from obeying the commandment of GOD by the deceivableness of our flesh, as he withdrew Adam by the means of Eve, after that by his lie she was seduced, he thought with himself it was no great fault, to eat of the fruit of a Tree, but it was very great, sith GOD had forbidden it, as experience taught it afterward: for by this transgression all the lineage of man was destroyed and all creatures were made subject to Curse.

Let us never suffer therefore the word of God to be snatched out of our hands whatsoever reason, or whatsoever colour or cloak flesh can allege unto us: let us be as wary as we would be to fall into the fire, to draw back from this word, and to abandon it, one only step. For we need not go far aside to miss the way, to set us altogether out of the way, and when one is once fallen out of the way, the further he goeth on, the further he wandreth and multiplyeth error upon error: so that after it is very hard for him to find his right way, and to come thither, whether he purposed.

Wherefore to avoid the falling into the bottom of the depth of sin, let us get us away out of hand from the banks, least we plunge ourselves in deeper then we think for, and that there come not some wave which suddenly will set upon us, and in wray and plunge us in such sort among the waves, that we can never get out, but remain there all together drowned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the faithful necessary for all the children of God: especially in the so dangerous days</cite>, trans. F. H. (London: Tobie Smith, 1582), unpaginated.</span></figcaption>

<blockquote><p>The Scribes &amp; Pharisees that came from Jerusalem, picked a quarrel against him, because his disciples did eat with unwashed hands, whereby they transgressed the tradition of the Elders: our saviour Christ in defence of his disciples, chargeth the Scribes &amp; Pharisees which were so zealous to maintain their own ceremonies, then they were careless to break the commandment of God.

And so it cometh to pass always, that they which are most earnest in upholding &amp; defending traditions &amp; ceremonies invented by man, are most forgetful in keeping the commandments of God. But this is the just judgment of God against those that invent a new worship of their own brain: That first they lose their labour, that so seek to please God: &amp; secondly that they are deprived of all right understanding, because they have presumed to be wiser then God.</p></blockquote>

</figure><figure class="quote" id="q-12d3158c04" data-kw="">
<blockquote><p>Gilbert McMaster was an American Covenanter who originally hailed from Saintfield, County Down in what is now Northern Ireland. In 1818 he wrote a number of letters in defence of psalmody. In one of these letters, he pointed out that the excitements of so-called revivals were no excuse for the use of uninspired hymns:

It is most notorious, that those excitements called revivals of religion, which make the greatest noise, are effected where the most pernicious errors are habitually taught. That these, and modern hymns, have a great share in the production of those noisy but short-lived agitations, need not be doubted. Israel’s worship of the golden calf was marked by a greater excitement than the usual and approved worship of Jehovah.

A visit to those favoured districts of revival, a few months after a magazine description, or ecclesiastical report has been given of the multitudes converted, would cast a shade of doubt, generally, on those fine narratives. And the man who considers that the embracing of truth, turning to God through a crucified and exalted Saviour, and living a life of practical godliness, are the best proofs of real conversion, wishes, sincerely, that the things were published as they really are, and that our country furnished one journal, which would venture to tell all the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-mcmaster.html">Gilbert McMaster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the C</cite>, hurch of God (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), p. 190.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-0ca535bb87" data-kw="">
<blockquote><p>It deserves our attention that Christ says that he gave an example; for we are not at liberty to take all his actions, without reserve, as subjects of imitation. The Papists boast that, by Christ’s example, they observe the forty days’ fast, or Lent. But we ought first to see whether or not he intended to lay down his fast as an example, that the disciples might conform to it as a rule. We read nothing of this sort, and, therefore, the imitation of it is not less wicked than if they attempted to fly to heaven. Besides, when they ought to have followed Christ, they were not imitators, but apes. Every year they have a fashion of washing some people’s feet, as if it were a farce which they were playing on the stage; and so, when they have performed this idle and unmeaning ceremony, they think that they have fully discharged their duty, and reckon themselves at liberty to despise their brethren during the rest of the year. But—what is far worse—after having washed the feet of twelve men, they subject every member of Christ to cruel torture, and thus spit in Christ’s face. This display of buffoonery, therefore, is nothing else than a shameful mockery of Christ. At all events, Christ does not here enjoin an annual ceremony, but bids us be ready, throughout our whole life, to wash the feet of our brethren and neighbours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, trans. William Pringle, vol. 2 (Logos Bible Software, 2010), 61–62.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It deserves our attention that Christ says that he gave an example; for we are not at liberty to take all his actions, without reserve, as subjects of imitation. The Papists boast that, by Christ’s example, they observe the forty days’ fast, or Lent. But we ought first to see whether or not he intended to lay down his fast as an example, that the disciples might conform to it as a rule. We read nothing of this sort, and, therefore, the imitation of it is not less wicked than if they attempted to fly to heaven. Besides, when they ought to have followed Christ, they were not imitators, but apes. Every year they have a fashion of washing some people’s feet, as if it were a farce which they were playing on the stage; and so, when they have performed this idle and unmeaning ceremony, they think that they have fully discharged their duty, and reckon themselves at liberty to despise their brethren during the rest of the year. But—what is far worse—after having washed the feet of twelve men, they subject every member of Christ to cruel torture, and thus spit in Christ’s face. This display of buffoonery, therefore, is nothing else than a shameful mockery of Christ. At all events, Christ does not here enjoin an annual ceremony, but bids us be ready, throughout our whole life, to wash the feet of our brethren and neighbours.”

— John Calvin, Commentary on John, trans. William Pringle, vol. 2 (Logos Bible Software, 2010), 61–62.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+deserves+our+attention+that+Christ+says+that+he+gave+an+example%3B+for+we+are+not+at+liberty+to+take+all+his+actions%2C+without+reserve%2C+as+subjects+of+imitation.+The+Papists+boast+that%2C+by+Christ%E2%80%99s+example%2C+they+observe+the+forty+days%E2%80%99+fast%2C+or+Lent.+But+we+ought+first+to+see+whether+or+not+he+intended+to+lay+down+his+fast+as+an+example%2C+that+the+disciples+might+conform+to+it+as+a+rule.+We+read+nothing+of+this+sort%2C+and%2C+therefore%2C+the+imitation+of+it+is+not+less+wicked+than+if+they+attempted+to+fly+to+heaven.+Besides%2C+when+they+ought+to+have+followed+Christ%2C+they+were+not+imitators%2C+but+apes.+Every+year+they+have+a+fashion+of+washing+some+people%E2%80%99s+feet%2C+as+if+it+were+a+farce+which+they+were+playing+on+the+stage%3B+and+so%2C+when+they+have+performed+this+idle+and+unmeaning+ceremony%2C+they+think+that+they+have+fully+discharged+their+duty%2C+and+reckon+themselves+at+liberty+to+despise+their+brethren+during+the+rest+of+the+year.+But%E2%80%94what+is+far+worse%E2%80%94after+having+washed+the+feet+of+twelve+men%2C+they+subject+every+member+of+Christ+to+cruel+torture%2C+and+thus+spit+in+Christ%E2%80%99s+face.+This+display+of+buffoonery%2C+therefore%2C+is+nothing+else+than+a+shameful+mockery+of+Christ.+At+all+events%2C+Christ+does+not+here+enjoin+an+annual+ceremony%2C+but+bids+us+be+ready%2C+throughout+our+whole+life%2C+to+wash+the+feet+of+our+brethren+and+neighbours.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+John%2C+trans.+William+Pringle%2C+vol.+2+%28Logos+Bible+Software%2C+2010%29%2C+61%E2%80%9362.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ca535bb87.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ca535bb87.html">Permalink</a><a class="src" href="https://heidelblog.net

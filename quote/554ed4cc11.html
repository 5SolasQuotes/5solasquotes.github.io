<blockquote><p>If in a time of contagion, assemblies will need to be dissolved, it shall not be a work such that the Church be called back from: repentance, being confirmed in faith, being summoned to prayer, or in being prepared for death, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Section 37, p. 86, point 5 in Theoretical-Practical Dissertation 3, ‘On Pestilence’ in Biblical Exercitations (Zurich, 1700), Appendix</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc59e7e6ed" data-kw="">
<blockquote><p>…for they teach, that a man may publish that which by consequence destroys the faith of fundamentals, and so subvert the faith of others, which to do is a sin; but because the man follows the indictment [conviction] of his erroneous conscience, it is no sin to the man that so teaches; yea, he may innocently suffer persecution for his conscience, thus erroneous; yea, and die a martyr for it. Therefore, if the following of an erroneous conscience shall make a less sin to be no sin but innocency, it shall make a greater sin, to wit, killing of his son to his heavenly father [as an erroneous sacrifice, modeled off of Gen. 22], no sin, and so he may lawfully do it [though this is murder]. Nor will it suffice to say, to offer a man to God and kill him, is against the light of nature, and [in]vincibly a sin; what then? if the man believe he is commanded to kill him, his erroneous conscience must bind, as the offering of whole burnt offerings to God, to us is a sin, against the light of nature, in regard the law of nature can no more warrant it, than it can warrant Christ to offer up himself to God [Christ needed the positive command from his Father]. But upon the supposition of Libertines, its no murder; nor is it punishable at all, because the father may, yea, and lawfully, ought to worship God according to the indictment of his conscience, whither the conscience be right or bloody and erroneous, and yet he is not punishable for blood-shed, by their way for merely, and simply, without any malignancy or hatred to the child; he believes, he ought to prefer his Maker to his dearest child’s life as well as Abraham, and the conscience does naturally, and as under no Law, simply believe it is the like service, and worship that Abraham would have gratefully performed unto God, if God in reward of that love, had not forbidden him again to kill his Son. And this answer presupposes also, that it is impossible for a father to have such a conscience, as may stimulate, and command to kill his son, and that in the authority, and name of God, as he erroneously, yea, and as he invincibly holds, as Socinians, Familists, Papists, believe purgatory, merits, justification by works, who yet are not to be punished for their conscience, according to Libertines. Again, there is no intrinsic malignancy [in intention] in the act of naticide, or son-sacrificing, but what it has from the Lord’s Law forbidding to kill, now those that killed their sons to Molech, yea, to God, as they thought, strongly, yea, invincibly believed God commanded them, to do Him such bodily service, as is clear from Jer. 7:31; 15:5. And that this is invincible ignorance (I take the word invincible in the Libertines’ sense) Libertines grant, for in our condemning son-sacrificing, they will say we are not infallible. Yea, the understanding, being spiritual, cannot be restrained, says Dr. [Jeremy] Taylor, sect. 13, n. 6, and no man can change his opinion when he will, says he, ibid., n. 7, and so should not be punished for it, and n. 13, there is nothing under God Almighty that has power over the soul of man, so as to command a persuasion. If he be then persuaded, that he ought to kill his son, he ought unpunishably so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience... (London, 1649)</cite>, pp. 348-9</span></figcaption>

<blockquote><p>45. The second difference [between civil and church power] is in the object, or matter about which: The power politic or civil is occupied about the outward man and civil or earthly things, about war, peace, conservation of justice and good order in the commonwealth; also about the outward business or external things of the Church, which are indeed necessary to the Church, or profitable, as touching the outward man, yet not properly and purely spiritual, for they do not reach unto the soul, but only to the external state and condition of the ministers and members of the Church. 46. For the better understanding whereof, tis to be observed that so far as the ministers and members of the Church are citizens, subjects or members of the commonwealth, it is in the power of the Magistrate to judge, determine and give sentence concerning the disposing of their bodies or goods; As also concerning the maintenance of the poor, sick, the banished and of others in the Church which are afflicted; To regulate (so far as concerns the civil order) marriages, burials, and other circumstances which are common both to holy and also to honest civil societies; to afford places fit for holy assemblies and other external helps by which the sacred matters of the Lord may be more safely, commodiously and more easily in the Church performed: To remove the external impediments of divine worship or of ecclesiastical peace, and to repress those which exalt themselves against the true Church and her Ministers, and do raise up trouble against them. … 66. Fourthly, they [the Church and magistrate] differ in the[ir] end [design]: The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and counsel of judges; or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured, and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>

<blockquote><p>A multitude may be one Church, though they do not meet together into one place for the worship of God: for example, it may fall forth, that a congregation cannot meet together into one, but into diverse places, and this may continue so for some years together, either by reason of persecution, or by means of the plague, or because they have not such a large parish-Church as may contain them all, so that a part of them must meet in some other place: but a multitude cannot be one Church, unless they communicate in the same Church government, and under the same governors (by one Church I mean one Ecclesiastical Republic) even as the like union under civil government and governors maketh one corporation:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (Edinburgh, 1641), 2nd pt., ch. 3, p. 145. Gillespie is arguing against congregationalism.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“A multitude may be one Church, though they do not meet together into one place for the worship of God: for example, it may fall forth, that a congregation cannot meet together into one, but into diverse places, and this may continue so for some years together, either by reason of persecution, or by means of the plague, or because they have not such a large parish-Church as may contain them all, so that a part of them must meet in some other place: but a multitude cannot be one Church, unless they communicate in the same Church government, and under the same governors (by one Church I mean one Ecclesiastical Republic) even as the like union under civil government and governors maketh one corporation:”

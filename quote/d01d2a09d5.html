</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9372f182a4" data-kw="">
<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error (Edinburgh, 1684), ch. 28, ‘Of Baptism’, Question 3</cite>, pp. 179-180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-a35366c560" data-kw="">
<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures… (London, 1659), The 26-27th Lord’s Days</cite>, p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

>Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cfefc8c245" data-kw="">
<blockquote><p>This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ursinus.html">Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sudhoff, Olevianus und Ursinus, pp. 633 ff. as quoted in Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’, p. 264-5 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

e-baptized-because-they-are-in-the-covenant/#:~:text=This%20is%20sure%20and%20certain%2C%20that,open%20abuse%20and%20desecration%20of%20baptism&amp;text=This%20is%20sure%20and%20certain%2C%20that%20God%20instituted&amp;text=is%20an%20open%20abuse%20and%20desecration%20of%20baptism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-99709e246d" data-kw="">
<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are: 1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause. 2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism. 3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 2, ‘Whether or no children be received into the visible Church by Baptism’ in The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5</cite>, pp. 210-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

9e246d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99709e246d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Hence%20baptism%20is%20a%20seal%20of,working%20and%20operation%20of%20the%20Sacraments&amp;text=Hence%20baptism%20is%20a%20seal%20of%20our%20incorporation&amp;text=the%20efficiency%2C%20working%20and%20operation%20of%20the%20Sacraments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

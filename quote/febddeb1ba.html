<main class="wrap"><figure class="quote" id="q-febddeb1ba" data-kw="preacher">
<blockquote><p>The reasons are: (1) the Scriptures frequently enjoin this judgment (Mt. 7:15; 16:6; Col. 2:8; 1 Thess. 5:21; Heb. 5:14); (2) the examples of the saints confirm it, as the Bereans (Acts 17:11) and the Corinthians (1 Cor. 10:15); (3) the design of Scripture teaches it (which is the perfection of the man of God in the knowledge of the truth and the conviction of gainsayers [2* Tim. 3:16; Tit. 1:9], which cannot be accomplished without it); (4) the use of reason is a strong proof because as the knowledge of the affirmation and negation of propositions and the doctrine of contradiction belong to it, so also must such a judgment. And unless we allow this, the widest door will be thrown open to all kinds of heretics and fanatics for introducing their fictions and monstrous opinions and we can never use any true contradiction. Sources of explanation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/the-theologian.html">The Theologian</a> › <a href="../topics/theology/the-theologian/the-preachers-method.html">The preacher&#x27;s method</a></span><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a> › <a href="../topics/theology/natural-theology/conscience-and-the-law-written-on-the-heart.html">Conscience and the law written on the heart</a></span></div>
<div class="actions"><button class="copy" data-copy="“The reasons are: (1) the Scriptures frequently enjoin this judgment (Mt. 7:15; 16:6; Col. 2:8; 1 Thess. 5:21; Heb. 5:14); (2) the examples of the saints confirm it, as the Bereans (Acts 17:11) and the Corinthians (1 Cor. 10:15); (3) the design of Scripture teaches it (which is the perfection of the man of God in the knowledge of the truth and the conviction of gainsayers [2* Tim. 3:16; Tit. 1:9], which cannot be accomplished without it); (4) the use of reason is a strong proof because as the knowledge of the affirmation and negation of propositions and the doctrine of contradiction belong to it, so also must such a judgment. And unless we allow this, the widest door will be thrown open to all kinds of heretics and fanatics for introducing their fictions and monstrous opinions and we can never use any true contradiction. Sources of explanation.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8394b46f2c" data-kw="insufficient">
<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a> › <a href="../topics/theology/natural-theology/insufficient-to-save.html">Insufficient to save</a></span><span class="t"><a href="../topics/theology/revealed-theology.html">Revealed Theology</a> › <a href="../topics/theology/revealed-theology/necessity-of-revelation.html">Necessity of revelation</a></span></div>

</figure><figure class="quote" id="q-88c9aedd8b" data-kw="">
<blockquote><p>The Bible is to the theologian what nature is to the man of science. It is his store-house of facts; and his method of ascertaining what the Bible teaches, is the same as that which the natural philosopher adopts to ascertain what nature teaches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 1, § 5, “The Inductive Method”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/nature-of-theology.html">Nature of Theology</a> › <a href="../topics/theology/nature-of-theology/theology-as-science-and-as-wisdom.html">Theology as science and as wisdom</a></span><span class="t"><a href="../topics/theology/nature-of-theology.html">Nature of Theology</a> › <a href="../topics/theology/nature-of-theology/method-of-theology.html">Method of theology</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Bible is to the theologian what nature is to the man of science. It is his store-house of facts; and his method of ascertaining what the Bible teaches, is the same as that which the natural philosopher adopts to ascertain what nature teaches.”

— Charles Hodge, Systematic Theology, vol. 1, Introduction, ch. 1, § 5, “The Inductive Method”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Bible+is+to+the+theologian+what+nature+is+to+the+man+of+science.+It+is+his+store-house+of+facts%3B+and+his+method+of+ascertaining+what+the+Bible+teaches%2C+is+the+same+as+that+which+the+natural+philosopher+adopts+to+ascertain+what+nature+teaches.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+1%2C+Introduction%2C+ch.+1%2C+%C2%A7+5%2C+%E2%80%9CThe+Inductive+Method%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88c9aedd8b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88c9aedd8b.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology1" rel="noopener" target="_blank">Read it online · CCEL, vol. 1</a></div>
</figure><figure class="quote" id="q-63853b70b9" data-kw="theologian">
<blockquote><p>Although the human understanding is very dark, yet there still remains in it some rays of natural light and certain first principles, the truth of which is unquestionable: such as, the whole is greater than its part, an effect supposes a cause, to be and not to be at the same time are incompatible (asystatous), etc. If this were not the case, there could be no science, nor art, nor certainty in the nature of things. (2) These first principles are true not only in nature, but also in grace and the mysteries of faith. Faith, so far from destroying, on the contrary borrows them from reason and uses them to strengthen its own doctrines. (3) Although reason and faith are of different classes (the one natural, the other supernatural), they are not however opposed, but hold a certain relation and are subordinate to each other. Reason is perfected by faith and faith supposes reason, upon which to found the mysteries of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/the-theologian.html">The Theologian</a> › <a href="../topics/theology/the-theologian/the-regenerate-student.html">The regenerate student</a></span><span class="t"><a href="../topics/theology/the-theologian.html">The Theologian</a> › <a href="../topics/theology/the-theologian/study-and-prayer.html">Study and prayer</a></span></div>
<div class="actions"><button class="copy" data-copy="“Although the human understanding is very dark, yet there still remains in it some rays of natural light and certain first principles, the truth of which is unquestionable: such as, the whole is greater than its part, an effect supposes a cause, to be and not to be at the same time are incompatible (asystatous), etc. If this were not the case, there could be no science, nor art, nor certainty in the nature of things. (2) These first principles are true not only in nature, but also in grace and the mysteries of faith. Faith, so far from destroying, on the contrary borrows them from reason and uses them to strengthen its own doctrines. (3) Although reason and faith are of different classes (the one natural, the other supernatural), they are not however opposed, but hold a certain relation and are subordinate to each other. Reason is perfected by faith and faith supposes reason, upon which to found the mysteries of grace.”

— Francis Turretin, Institutes of Elenctic Theology, 1.9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough%20the%20human%20understanding%20is%20very%20dark%2C%20yet%20there%20still%20remains%20in%20it%20some%20rays%20of%20natural%20light%20and%20certain%20first%20principles%2C%20the%20truth%20of%20which%20is%20unquestionable%3A%20such%20as%2C%20the%20whole%20is%20greater%20than%20its%20part%2C%20an%20effect%20supposes%20a%20cause%2C%20to%20be%20and%20not%20to%20be%20at%20the%20same%20time%20are%20incompatible%20%28asystatous%29%2C%20etc.%20If%20this%20were%20not%20the%20case%2C%20there%20could%20be%20no%20science%2C%20nor%20art%2C%20nor%20certainty%20in%20the%20nature%20of%20things.%20%282%29%20These%20first%20principles%20are%20true%20not%20only%20in%20nature%2C%20but%20also%20in%20grace%20and%20the%20mysteries%20of%20faith.%20Faith%2C%20so%20far%20from%20destroying%2C%20on%20the%20contrary%20borrows%20them%20from%20reason%20and%20uses%20them%20to%20strengthen%20its%20own%20doctrines.%20%283%29%20Although%20reason%20and%20faith%20are%20of%20different%20classes%20%28the%20one%20natural%2C%20the%20other%20supernatural%29%2C%20they%20are%20not%20however%20opposed%2C%20but%20hold%20a%20certain%20relation%20and%20are%20subordinate%20to%20each%20other.%20Reason%20is%20perfected%20by%20faith%20and%20faith%20supposes%20reason%2C%20upon%20which%20to%20found%20the%20mysteries%20of%20grace.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%201.9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F63853b70b9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/63853b70b9.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-bd83c980d6" data-kw="necessity amp">
<blockquote><p>Although all the truths revealed in Scripture are necessary to be believed as divine and infallible, yet they are not all equally necessary and the amplitude and extension of faith must be accurately distinguished here from its necessity. Not everything which belongs to the amplitude of faith must therefore belong to its necessity. All truths are not of the same weight. Some have a greater, others a lesser degree of necessity. For example, some are necessary by the necessity of means; others only by the necessity of precept. Some relate to doctrines strictly so called, others only to rites and ceremonies. One relates to some article or doctrine as to substance (for instance that Christ suffered and died); another to the same considered only with reference to circumstances (for instance, that Christ suffered under Pontius Pilate and was crucified between two thieves). For we might be ignorant of the latter without peril to our salvation. Proof of this from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.14.5</span></figcaption>

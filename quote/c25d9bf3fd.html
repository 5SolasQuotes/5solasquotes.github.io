<main class="wrap"><figure class="quote" id="q-c25d9bf3fd" data-kw="">
<blockquote><p>The later church only preserves and transmits to posterity the witness of the first church, but it neither should nor can decree anything concerning those books for which it does not have sure proofs from the witness of the first church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on the Holy Scripture, Sec. VI</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c8360b1f1" data-kw="nt canon">
<blockquote><p>(3) From the providence of God perpetually keeping watch for the safety of the church (which cannot be conceived to have allowed her to suffer so great a loss). Otherwise what would become of the wisdom and goodness and power of God if he had willed that such a precious treasure should be shown to his church and then taken away; and that the body of Scripture should exist at this day mutilated and defective? (4) From the duty of the church which is religiously to preserve the oracles of God committed to her and to search them diligently. That she has not been careless to her charge is evident even from this—that neither Christ nor his apostles ever charged the Jews with this crime. This sacrilege they (who did not omit lesser things) would not have passed over in silence, if they had been really guilty. Yea, Paul commends this privilege of the Jews because unto them were committed the oracles of God (logia tou Theou, Rom. 3:2; 9:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a> › <a href="../topics/holy-scripture/canon/new-testament-canon.html">New Testament canon</a></span><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a> › <a href="../topics/holy-scripture/canon/disputed-books.html">Disputed books</a></span></div>

</figure><figure class="quote" id="q-4e6e6fd000" data-kw="apocrypha">
<blockquote><p>The Apocryphal books are so called not because the authors are unknown (for there are some canonical books whose authors are unknown and some apocryphal books whose authors are known); not because they could be read only in private and not in public (for some of them may be read even in public), but either because they were removed from the crypt (apo tēs kryptēs) (that sacred place in which the holy writings were laid up) as Epiphanius and Augustine think; or because their authority was hidden and suspected, and consequently their use also was secret since the church did not apply to them to confirm the authority of ecclesiastical doctrines (as Jerome says, ‘Praefatio in libros Salomonis’ from “Hieronymi Prologus Galeatus” in Biblia Sacra Vulgata Editionis Sixti V … et Celementis VIII [1865], p. lii); or, what is more probable, because they are of an uncertain and obscure origin (as Augustine says, CG 15.23* [FC 14:474]). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.1</span></figcaption>

</figure><figure class="quote" id="q-0018e6f6fd" data-kw="">
<blockquote><p>The reason why these books were separated from canonical authority is not a secret. Some of them were written after the time of the prophets, when the people of Israel no longer had prophets such as the old ones had been; and they were written by men who did not have divine testimonies like the prophets for the certainty and authority of their doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on the Holy Scripture, Sec. VI</span></figcaption>

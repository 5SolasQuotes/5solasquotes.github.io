<main class="wrap"><figure class="quote" id="q-7e7ef22353" data-kw="">
<blockquote><p>A Word of Advice to my own Heart and thine; thou professeth Baptism, Church-fellowship; thou dost well, they are glorious Ordinances; But if thou hast not the Blood of Christ at the Root of thy Profession, it will wither and prove but painted Pageantry to go to Hell in.

If thou retain Guilt, Self-righteousness under it, those Vipers will eat out all the Vitals of it at length. Try and examine with greatest strictness every day, what bottom thy Profession and Hope of Glory is built upon, whether it was laid by the hand of Christ; if not, it will never be able to endure the storm that must come against it. Satan will throw it all down and great shall be the fall thereof, Mat. 7.27.

Glorious Professor, thou shalt be winnowed: Every vein of thy Profession will be tried to purpose: Terrible, to have it all come tumbling down, and to find nothing but it to bottom upon.

Soaring Professor, see to thy waxen Wings betimes, which will melt with the heat of Temptations. What a misery to Trade much and break at length, and have no Stock, no Foundation laid for Eternity, in thy Soul?

Gifted Professor, look there be not a worm at the root that will spoil all thy sin Goard, and make it die about thee in a day of Scorchings. Look over thy Soul daily, and ask, where is the Blood of Christ to be seen upon my Soul? what Righteousness is it that I stand upon to be saved by? Have I got off all my Self-righteousness? Many eminent Professors, have come at length to cry out, in the sights of the ruin of all their duties, Undone, Undone to all Eternity.

The greatest sins may be hid under the greatest duties, and the greatest terrors: See the wound that sin hath made in thy soul, be perfectly cured by the blood of Christ, not skinned over with duties, humblings, enlargements, &amp;c. Apply what thou wilt besides the blood of Christ it will poison the sore. Thou wilt find that sin was never mortified truly; that thou hast not seen Christ bearing for thee upon the Cross: Nothing can kill it but the beholdings of Christ’s Righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-wilcox.html">Thomas Wilcox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A choice drop of honey from the rock Christ, or, A short word of advice to all Christians of what persuasion soever in order to a thorough reformation</cite>, (5th edn, London: B. Harris, 1699), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f01fded6d" data-kw="">
<blockquote><p>Matters of smaller weight, and so covertly discovered that no great offence to the Church was to be feared in them, I wholly passed by, as one that discerned nothing of them, or had been unfurnished of replies. For other of greater moment, and so openly delivered, as there was just cause of fear, least the truth and church of God should be prejudiced and periled by it, and such as the conscience of my duty &amp; calling would not suffer me altogether to pass over, this was my course, to deliver, when I should have just cause by my text, the truth of such doctrine as he had otherwise taught in general speeches, without touch of his person in any sort, and further at convenient opportunity to confer with him in such points.

According to which determination, whereas he had taught certain things concerning predestination otherwise then the word of God doth, as it is understood by all churches professing the gospel, and not unlike that wherewith Coranus some times troubled his church; I both delivered the truth of such points in a general doctrine, without any touch of him in particular, and conferred with him also privately upon such articles.

In which conference, I remember, when I urged the consent of all churches, and good writers against him that I knew, and desired if it were otherwise, what authors he had seen of such doctrine, he answered me that his best author was his own reason: which I wished him to take heed of, as a matter standing with Christian modesty &amp; wisdom in a doctrine not received by the church, not to trust to his own judgment so far, as to publish it before he had conferred with others of his profession, labouring by daily prayer, and study to know the will of God, as he did, to see how they understood such doctrine: notwithstanding he with wavering replying that he would some other time deal more largely in the matter, I wished him, &amp; prayed him not so to do, for the peace of the church, which by such meanes might be hazarded; seeing he could not but think, that men, who make any conscience of their ministry, will judge it a necessary duty in them, to teach the truth, and to convince the contrary.

Another time upon like occasion of this doctrine of his that the assurance of that we believe by the word, is not so certain, as of that we perceive by sense; I both taught the doctrine otherwise, namely the assurance of faith to be greater, which assureth both of things above, and contrary to all sense and human understanding, and dealt with him also privately upon that point.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-travers.html">Walter Travers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Supplication made to the Privy Counsel</cite>, (Oxford: John Barnes, 1612), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-4c98abbb44" data-kw="">
<blockquote><p>Some people have remained Covenanters just because of tradition. They attend services and follow the Covenanter manner of worship just because they are in the habit of doing so. They cannot give any real Bible reasons for their Covenanter faith and practice. If you ask them why they do not vote in political elections, they can only reply that voting is against the principles of the Covenanter Church. They are like the little girl who was asked why we do not have organs in our churches. She replied solemnly, ”We don’t because we’re Covenanters, and Covenanters don’t.” The person who is a Covenanter merely because of custom or tradition is not really a Covenanter at heart. His loyalty is not a conscientious loyalty to the truth of God; it is merely a blind loyalty to church tradition. This is a very poor reason for being a Covenanter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-g-vos.html">J. G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Why be a Covenanter? in Blue Banner Faith and Life</cite></span></figcaption>

</figure><figure class="quote" id="q-9d29908452" data-kw="">
<blockquote><p>Either you [a Romanist] mean that ‘there is no salvation to be had out of that universal Church, whose part (a minor corrupt part) acknowledges the Pope’s sovereignty’ or else ‘that there is no salvation to be had out of that universal Church which wholly acknowledges it’ or else ‘that there is no salvation to be had out of that part of the universal Church which acknowledges it’. In the first sense I grant your conclusion (if really you [Romanists] are part of the Church), There is no salvation to be had out of Christ’s universal Church, of which you are [a] small corrupted part.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f1c92274d4" data-kw="">
<blockquote><p>All this, it is obvious, must be implied in sanctifying or keeping holy the Sabbath of the Lord; and consequently, that this day is profaned if we neglect, or carelessly perform, its sacred duties; if we spend it in idleness, sloth, and sinful indulgence; or if we are occupied with “unnecessary thoughts, words, or works, about our worldly employments or recreations.”

And if so, then who can estimate the amount of guilt which is every Sabbath contracted, even in this professedly Christian community? — for who does not know, that besides the amusement and idleness to which countless multitudes systematically devote that day, it is with not a few a season of more gross and flagrant wickedness than any other day of the week?

It is appalling to think that a day which was mercifully designed to be a respite from the bodily toil and the mental anxieties inseparable from the ordinary avocations of men in this world of sin and sorrow, should be spent in the most debasing slavery — the service of sin and Satan; and that a season which was graciously intended to raise the soul to things holy and heavenly, and to prepare it for the joys of an eternal inheritance, should be employed in sinking it deeper in spiritual degradation and misery.

I fear, my friends, that even Christians, by being so familiar with the sight of Sabbath profanation, regard it with less horror and alarm than it is befitting they should; and that they are not always forward to use the influence which they might exercise in arresting or preventing a sin which, when it becomes so common as to be characteristic of a nation, will assuredly, as all past experience testifies, bring down the judgments of God in national calamities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1a228b3656" data-kw="">
<blockquote><p>Let us then drive away from our ears and minds those who say that we ought to accept the determination of our own free will and not pray God to help us not to sin. By such darkness as this even the Pharisee was not blinded; for although he erred in thinking that he needed no addition to his righteousness, and supposed himself to be saturated with abundance of it, he nevertheless gave thanks to God that he was not “like other men, unjust, extortioners, adulterers, or even as the publican; for he fasted twice in the week, he gave tithes of all that he possessed.”

He wished, indeed, for no addition to his own righteousness; but yet, by giving thanks to God, he confessed that all he had he had received from Him. Notwithstanding, he was not approved, both because he asked for no further food of righteousness, as if he were already filled, and because he arrogantly preferred himself to the publican, who was hungering and thirsting after righteousness.

What, then, is to be said of those who, whilst acknowledging that they have no righteousness, or no fulness thereof, yet imagine that it is to be had from themselves alone, not to be besought from their Creator, in whom is its store and its fountain? And yet this is not a question about prayers alone, as if the energy of our will also should not be strenuously added. God is said to be “our Helper;” but nobody can be helped who does not make some effort of his own accord.

For God does not work our salvation in us as if he were working in insensate stones, or in creatures in whom nature has placed neither reason nor will. Why, however, He helps one man, but not another; or why one man so much, and another so much; or why one man in one way, and another in another,—He reserves to Himself according to the method of His own most secret justice, and to the excellency of His power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.6 in NPNF1, 5: 46.</span></figcaption>

<blockquote><p>All the rich benefits which Christ gives to His believers on earth receive their fulfillment and their crown in the glorification which accrues to them in part upon death but only in its fulness after the day of judgment. But this benefit of glorification is one which we cannot yet discuss, because we have first to pay some attention to the way in which, or the route along which, Christ brings the benefits of calling and regeneration, faith and repentance, justification and adoption as children, renewal and sanctification, into being in His believers on earth, and sustains and reinforces them. We have already noted that He grants all those benefits by means of His Word and His Spirit, but have still to see that He also grants them also only in the fellowship which binds all the believers together. He does not distribute them to single individuals, nor to a small group of persons, but He gives them out to a great multitude, to the whole of the new humanity, which was chosen in Him by the Father from before the foundation of the world (Eph. 1:4).</p></blockquote>

<blockquote><p>But it is Christ as our Mediator-Head that is first given us in relative union: and then: 1. The Father loves us with complacency as in the Son, and for the sake of his first beloved. 2. And the Spirit which is given us in relation is first the Spirit of Christ our Head; and not first inherent in us: So that by union with our Head, that Spirit is next united to us, both relatively, and as radically inherent in the human nature of our Lord, to whom we are united. As the nerves and animal spirits which are to operate in all the body, are radically only in the head, from whence they flow into, and operate on the members as there is need (though there may be obstructions); So the Spirit dwells in the human nature of our Head; and there it can never be lost; And it is not necessary that it dwell in us by way of radication, but by way of influence and operation. These things are distinctly and clearly understood but by very few; and we are all much in the dark about them. But I think (however doctrinally we may speak better) that most Christians are habituated to this perilous misapprehension (which is partly against Christianity itself) that the Spirit flows immediately from the divine nature of the Father and the Son (as to the authoritative or potestative conveyance) unto our souls. And we forget that it is first given to Christ in his glorified humanity as our Head, and radicated in Him, and that it is the office of this glorified Head to send or communicate to all his members, from Himself, that Spirit which must operate in them as they have need. This is plain in many texts of Scripture: Rom. 8:32 ‘He that spared not his own Son, but gave Him up for us all, how shall He not also with Him freely give us all things?’ (when He gives Him particularly to us) 1 Jn. 5:11-12 ‘And this is the record that God hath given us eternal life, and this life is in his Son: He that hath the Son hath the life, and he that hath not the Son hath not the life.’ Rom. 8:9 ‘If any man have not the Spirit of Christ, the same is none of his.’ Eph. 1:22-23 ‘And gave Him to be the Head over all things to the Church, which is his body, the fulness of Him that filleth all in all.’ Jn. 15:26 ‘The Advocate or Comforter whom I will send unto you from the Father, etc.’ Jn. 16:7 ‘If I depart, I will send Him unto you.’ Jn. 14:26 ‘The Comforter whom the Father will send in my Name.’ Gal. 4:6 ‘And because ye are sons, God hath sent forth the Spirit of his Son into your hearts, crying Abba, Father.’ Gal. 2:20 ‘I live: yet not I, but Christ liveth in me’ (I know that is true of his living in us objectively and finally, but that seems not to be all) Col. 3:3-4 ‘For ye are dead, and your life is hid with Christ in God; when Christ who is our life shall appear, then shall ye also appear with Him in Glory.’ (I know that in verse 3 by ‘life’ is meant felicity or glory, but not only, as appears by verse 4, where Christ is called ‘our life’) Mt. 28:19 ‘All power is given unto Me in heaven and earth’; verse 20, ‘I am with you always…’ Jn. 13:3 ‘The Father hath given all things into his hands.’ Jn. 17:2-3 ‘Thou hast given Him power over all flesh, that He should give eternal life to as many as thou hast given him, and this is life eternal to know thee, etc.’ Jn. 5:21 ‘The Son quickeneth whom He will:’ v. 26, ‘For as the Father hath life in Himself, so hath He given to the Son to have life in Himself.’ Jn. 6:27 ‘Labor for that meat which endureth to everlasting life, which the Son of man shall give unto you, for him hath God the Father sealed.’ vv. 32-33 ‘He giveth life unto the world.’ vv. 53-56 ‘Whoso eateth my flesh and drinketh my blood hath eternal life—dwelleth in Me and I in him—my flesh is meat indeed—As the Living Father hath sent Me, and I live by the Father, so he that eateth Me, even he shall live by Me.’ v. 63 ‘It is the Spirit that quickeneth: the flesh profiteth nothing.’ Jn. 7:39 ‘This spake He of the Spirit which they that believe in Him should receive.’ Jn. 3:34 ‘God giveth not the Spirit to Him by measure.’ 1 Cor. 6:17 ‘He that is joined to the Lord is one spirit.’ 2 Cor. 3:17 ‘The Lord is the Spirit, and where the Spirit of the Lord is, there is liberty.’ Phil. 1:19 ‘Through the supply of the Spirit of Jesus Christ.’ Jn. 15:4 ‘Abide in Me and I in you: As the branch cannot bear fruit of itself, except it abide in the vine, no more can ye except ye abide in Me.’ v. 5 ‘I am the vine, ye are the branches: He that abideth in Me and I in him, the same bringeth forth much fruit: For without Me (or, out of Me, or, severed from Me) ye can do nothing.’ I will add no more: All this is proof enough that the Spirit is not given radically or immediately from God to any believer, but to Christ, and so derivatively from him to us. Not that the divine nature in the Third Person is subject to the human nature in Christ, but that God has made it the office of our Mediator’s glorified humanity to be the cistern that shall first receive the waters of life, and convey them by the pipes of his appointed means to all the offices of his house: or to be the head of the animal spirits, and by nerves to convey them to all the members.</p></blockquote>

C+how+shall+He+not+also+with+Him+freely+give+us+all+things%3F%E2%80%99+%28when+He+gives+Him+particularly+to+us%29+1+Jn.+5%3A11-12+%E2%80%98And+this+is+the+record+that+God+hath+given+us+eternal+life%2C+and+this+life+is+in+his+Son%3A+He+that+hath+the+Son+hath+the+life%2C+and+he+that+hath+not+the+Son+hath+not+the+life.%E2%80%99+Rom.+8%3A9+%E2%80%98If+any+man+have+not+the+Spirit+of+Christ%2C+the+same+is+none+of+his.%E2%80%99+Eph.+1%3A22-23+%E2%80%98And+gave+Him+to+be+the+Head+over+all+things+to+the+Church%2C+which+is+his+body%2C+the+fulness+of+Him+that+filleth+all+in+all.%E2%80%99+Jn.+15%3A26+%E2%80%98The+Advocate+or+Comforter+whom+I+will+send+unto+you+from+the+Father%2C+etc.%E2%80%99+Jn.+16%3A7+%E2%80%98If+I+depart%2C+I+will+send+Him+unto+you.%E2%80%99+Jn.+14%3A26+%E2%80%98The+Comforter+whom+the+Father+will+send+in+my+Name.%E2%80%99+Gal.+4%3A6+%E2%80%98And+because+ye+are+sons%2C+God+hath+sent+forth+the+Spirit+of+his+Son+into+your+hearts%2C+crying+Abba%2C+Father.%E2%80%99+Gal.+2%3A20+%E2%80%98I+live%3A+yet+not+I%2C+but+Christ+liveth+in+me%E2%80%99+%28I+know+that+is+true+of+his+living+in+us+objectively+and+finally%2C+but+that+seems+not+to+be+all%29+Col.+3%3A3-4+%E2%80%98For+ye+are+dead%2C+and+your+life+is+hid+with+Christ+in+God%3B+when+Christ+who+is+our+life+shall+appear%2C+then+shall+ye+also+appear+with+Him+in+Glory.%E2%80%99+%28I+know+that+in+verse+3+by+%E2%80%98life%E2%80%99+is+meant+felicity+or+glory%2C+but+not+only%2C+as+appears+by+verse+4%2C+where+Christ+is+called+%E2%80%98our+life%E2%80%99%29+Mt.+28%3A19+%E2%80%98All+power+is+given+unto+Me+in+heaven+and+earth%E2%80%99%3B+verse+20%2C+%E2%80%98I+am+with+you+always%E2%80%A6%E2%80%99+Jn.+13%3A3+%E2%80%98The+Father+hath+given+all+things+into+his+hands.%E2%80%99+Jn.+17%3A2-3+%E2%80%98Thou+hast+given+Him+power+over+all+flesh%2C+that+He+should+give+eternal+life+to+as+many+as+thou+hast+given+him%2C+and+this+is+life+eternal+to+know+thee%2C+etc.%E2%80%99+Jn.+5%3A21+%E2%80%98The+Son+quickeneth+whom+He+will%3A%E2%80%99+v.+26%2C+%E2%80%98For+as+the+Father+hath+life+in+Himself%2C+so+hath+He+given+to+the+Son+to+have+life+in+Himself.%E2%80%99+Jn.+6%3A27+%E2%80%98Labor+for+that+meat+which+endureth+to+everlasting+life%2C+which+the+Son+of+man+shall+give+unto+you%2C+for+him+hath+God+the+Father+sealed.%E2%80%99+vv.+32-33+%E2%80%98He+giveth+life+unto+the+world.%E2%80%99+vv.+53-56+%E2%80%98Whoso+eateth+my+flesh+and+drinketh+my+blood+hath+eternal+life%E2%80%94dwelleth+in+Me+and+I+in+him%E2%80%94my+flesh+is+meat+indeed%E2%80%94As+the+Living+Father+hath+sent+Me%2C+and+I+live+by+the+Father%2C+so+he+that+eateth+Me%2C+even+he+shall+live+by+Me.%E2%80%99+v.+63+%E2%80%98It+is+the+Spirit+that+quickeneth%3A+the+flesh+profiteth+nothing.%E2%80%99+Jn.+7%3A39+%E2%80%98This+spake+He+of+the+Spirit+which+they+that+believe+in+Him+should+receive.%E2%80%99+Jn.+3%3A34+%E2%80%98God+giveth+not+the+Spirit+to+Him+by+measure.%E2%80%99+1+Cor.+6%3A17+%E2%80%98He+that+is+joined+to+the+Lord+is+one+spirit.%E2%80%99+2+Cor.+3%3A17+%E2%80%98The+Lord+is+the+Spirit%2C+and+where+the+Spirit+of+the+Lord+is%2C+there+is+liberty.%E2%80%99+Phil.+1%3A19+%E2%80%98Through+the+supply+of+the+Spirit+of+Jesus+Christ.%E2%80%99+Jn.+15%3A4+%E2%80%98Abide+in+Me+and+I+in+you%3A+As+the+branch+cannot+bear+fruit+of+itself%2C+except+it+abide+in+the+vine%2C+no+more+can+ye+except+ye+abide+in+Me.%E2%80%99+v.+5+%E2%80%98I+am+the+vine%2C+ye+are+the+branches%3A+He+that+abideth+in+Me+and+I+in+him%2C+the+same+bringeth+forth+much+fruit%3A+For+without+Me+%28or%2C+out+of+Me%2C+or%2C+severed+from+Me%29+ye+can+do+nothing.%E2%80%99+I+will+add+no+more%3A+All+this+is+proof+enough+that+the+Spirit+is+not+given+radically+or+immediately+from+God+to+any+believer%2C+but+to+Christ%2C+and+so+derivatively+from+him+to+us.+Not+that+the+divine+nature+in+the+Third+Person+is+subject+to+the+human+nature+in+Christ%2C+but+that+God+has+made+it+the+office+of+our+Mediator%E2%80%99s+glorified+humanity+to+be+the+cistern+that+shall+first+receive+the+waters+of+life%2C+and+convey+them+by+the+pipes+of+his+appointed+means+to+all+the+offices+of+his+house%3A+or+to+be+the+head+of+the+animal+spirits%2C+and+by+nerves+to+convey+them+to+all+the+members.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%3A+1673%29%2C+Question+42%2C+%E2%80%98But+the+great+question+is%2C+How+the+Holy+Ghost+is+given+to+infants+in+baptism%3F%E2%80%A6%E2%80%99%2C+pp.+818-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F881f425c24.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/881f425c24.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-application-of-redemption/#:~:text=But%20it%20is%20Christ%20as%20our,convey%20them%20to%20all%20the%20members&amp;text=But%20it%20is%20Christ%20as%20our%20Mediator%2DHead%20that&amp;text=nerves%20to%20convey%20them%20to%20all%20the%20members" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8113be8b58" data-kw="">
<blockquote><p>The Covenant of Redemption is two ways considered: 1. As transacted in time between Jehovah and Christ, in his actual discharge of his office of King, Priest and Prophet; 2. As it is an eternal transaction and compact between Jehovah and the second Person the Son of God, who gave personal consent that He should be the Undertaker, and no other. And these three acts are considerable in the Persons in this latter consideration: 1. designation of one; 2. decree and destination; 3. delectation in the work.</p></blockquote>

</figure><figure class="quote" id="q-45d4a14433" data-kw="">
<blockquote><p>24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments. 26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. … 29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>

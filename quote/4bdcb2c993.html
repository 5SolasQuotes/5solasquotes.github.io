</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56d8cf8ee2" data-kw="">
<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(XI, 27) as quoted in Heinrich Heppe, Reformed Dogmatics, ch. 17, Person of Christ, section 12</cite>, pp. 425-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-7f7ce76c33" data-kw="">
<blockquote><p>In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-a937edf31a" data-kw="">
<blockquote><p>But we can hardly say the physical fact of the genetic uniqueness of human fetal tissue is the basis of all the anxious inquiry, for the same uniqueness prevails in the animal world…. …when the fetus becomes a human being… the “breath of life” and the “blood which is the life” are applicable to animals as well as men. The biblical description of man’s distinctive creation “in the divine image” refers to a quality of life that, though it depends upon breath and blood, is not equated with them… although Augustine and Thomas condemned deliberate interference with the life of the fetus, they considered it homicide only when the fetus was possessed of a human soul.</p></blockquote>

</figure><figure class="quote" id="q-906be42022" data-kw="">
<blockquote><p>In order of final causality God wills, first the soul, secondly the body for the sake of the soul. But in the order of material causality He wills first the body, as being the material cause to be perfected by the soul, and the soul is created only when the embryo is sufficiently disposed to receive the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950) Garrigou-Lagrange was a Romanist, Neo-Thomist theologian., ch. 32, Introduction, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<main class="wrap"><figure class="quote" id="q-13b85e0057" data-kw="">
<blockquote><p>The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22. This stands in two things. First, in yielding subjection of the conscience to the commandments, threatnings and promises of God, so as we are willing that it should become bound unto them. Secondly, when the rest of the powers of the soul, in their place and time, perform obedience unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Cambridge: Legat, 1606), bk. 2, ch. 5, question 2, “How God is to be Worshipped &amp; Served?”, p. 259</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>§65. The sum of all that I have said is this, that man may determine of modes and circumstances of worship, necessary and commanded in genere, but not determined by God in specie. But to make new worship-ordinances, or institute sacraments, or sacramental signs, or any thing else, for which in genere he has no commission, this is simply unlawful. §66. But this is not all: There is a second thing unlawful also; and that is the misdetermining of those same modes and circumstances, which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude:

1. That every misordering of such great affairs is the sin of them that do it.

2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-58aa8968f2" data-kw="">
<blockquote><p>The act of Perth [1618] about kneeling would draw some commendation to this ceremony [of kneeling before the sacrament], from those words of the Psalm, ‘O come let us worship and bow down. let us kneel before the Lord our maker.’ [Ps. 95:6] Which is as if one should argue thus: We may worship before the lord. Therefore, before a creature. We may kneel in an immediate worship of God, Therefore in a mediate. For who sees not, that the kneeling there spoken of is a kneeling in the action of solemn praise and joyful noise of singing unto the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-58884cf76a" data-kw="">
<blockquote><p>Now these things carry a show of humility, and so those thousands of superstitious ceremonies and ways of worship that have been brought into the Church, they come under the name of zeal and devotion; but observe the Scripture, you shall see: Baptism, the Lord’s Supper, when purely administered although in a grave and holy way, yet in such simplicity and plainness, that there is not the least mention of the least ceremony or traditional worship that afterwards was introduced; and this the apostle meant when he said [that] he was afraid lest the Serpent should beguile them from the simplicity of the Gospel of Christ, 2 Cor. 11:3, [‘But I fear, lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ.’]. Oh that is a worthy place! There is a simplicity in the doctrine, worship, and life of the Gospel, and your minds are easily corrupted from this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture Directory for Church-Officers &amp; People, or, A Practical Commentary upon 1 Cor. 3</cite>, … (London, 1659), on verse 4, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-968ee9543b" data-kw="">
<blockquote><p>Any positives not warranted by some special word of God shall be additions to the Word of God: But these are expressly forbidden, Dt. 4:2; 12:32; Prov. 30:6; Rev. 22:18-19. To this Formalists [Anglicans, etc.] answer: 1. They have a general commandment of God, though not a special. Answer: So have all the unwritten traditions of Papists; hear the Church, she is Magistra fidei [Teacher of the Faith]; so does the Papist Horantius answer Calvin, that the Spirit of God has given a general and universal knowledge of mysteries of Faith and ceremonies belonging to religion, but many particulars are to be received by tradition from the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) Westminster divine | Introduction, section 4, pp. 51-2</span></figcaption>

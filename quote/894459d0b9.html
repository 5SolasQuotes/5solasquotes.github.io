<main class="wrap"><figure class="quote" id="q-894459d0b9" data-kw="">
<blockquote><p>4. Certain innovators who measure all faith by the courts of kings and regard gain as godliness think they can compile a catholic catechism—a summary of fundamentals to which all may subscribe. Thus, Jews and Christians might subscribe to the sum of the Old Testament, which indeed implicitly contains the New Testament and all its fundamentals, and thereby constitute one true Church. For if we swear to the fundamental articles in a confused and implicit manner, understood according to the vague and indefinite sense that the Holy Spirit intends, even if we do not know it specifically, then surely the Jews and we could rightly and properly subscribe to the Old Testament. But if any sect has its contrary and mutually opposed meanings concerning these articles, then there cannot be one fundamental catechism to which we all assent; rather, there will be as many catechisms regarding meanings as there are diverse opinions among different sects. For doctrine must be received according to its sense, not according to letters and syllables; otherwise, it would be permissible to subscribe to any general doctrine, and thus the Arians might swear that Christ is God, but they would understand Him to be God only nominally, not essentially.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI (1639-1642; 1668; Monergism, 2024), ch. 1, ‘Of the Holy Scripture’; pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee70a06d5d" data-kw="">
<blockquote><p>In fact, if one focuses on the number of doctrines confessed, it could hardly be denied that Roman Catholicism represents classical creedal Christianity, while the Protestant Reformation would seem to be one of the first great steps toward the minimalism we are addressing. But this holds true only if this minimalism is characterized by the number of doctrines confessed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-73f3a162aa" data-kw="">
<blockquote><p>The principles that have been learned and our rebalancing of priorities ought to not only show us that the unifying of Christ’s Church is possible, but it is obligatory and this ought to cause us to endeavor after it… The civil allowance of the more sound protestant denominations in England [in 1690]… could only tend toward facilitating and cementing those denominations into remaining separate, entering us into modern denominationalism. To seek to reverse that trend, Phil. 3:15-16, “whereto we have already attained, let us walk by the same rule, let us mind the same thing,” will be expounded and cleared from the separatistic construction often put on it. Lastly, principles of Scripture, Westminster, the Scots and the London presbyterians for unifying the Church will be laid out and recommended, versus erecting denominational white towers. The fundamentals (at least) of Christianity will be seen to be sufficient and obligatory Scriptural doctrinal grounds for organic Church union (with all due care and prudence), as the post-apostolic early Church, many of the reformed (including the leading Scottish covenanter James Durham) and the London presbyterians taught, it being no sin, but a divine obligation for the stronger to help and be united to the weaker (though they must relinquish rights and privileges for the here now to do so). Consequently, secondary teachings and practices which do not tend to overturn the fundamentals or the power of godliness will be seen to be no grounds for division, or schism. Objections will be resolved and the reform of Christ’s one Church will be encouraged and set on its way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, 4. “White Towers &amp; Unifying Christ’s Church” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 160-89, p. 160</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

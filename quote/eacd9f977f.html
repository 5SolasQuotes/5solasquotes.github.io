<main class="wrap"><figure class="quote" id="q-eacd9f977f" data-kw="">
<blockquote><p>It is further to be observed that Paul says the fathers of the Old Testament “were in bondage under the law,” after the manner of servants, specially by reason of rites and ceremonies. And hence it follows that the observation of a religion in which are manifold bodily rites and figures is a kind of bondage and pertains to the church for the time of her infancy or minority. Let this be remembered against the Romish religion. For it is like to that of the Jews in the Old Testament, standing for the greatest part in bodily rites, in differences of meats and drinks, in differences of times, places, garments, in exercises and afflictions of the body, in local succession, in the collation of grace by the work done, and such like. This is manifest to them which know the Mass, which indeed is nothing but a mass of ceremonies. Therefore the Roman religion is a childish and babyish religion. And if it were of God, yet is it not fit for the church of the New Testament that is come forth of her minority. Religion that stands in the afflicting of the body is but a shadow and an appearance of humility (Col. 2:23). And “the true worshipers of God” in the New Testament “worship him in spirit and truth” (John 4:24).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 245.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bef7517da" data-kw="">
<blockquote><p>He commanded the lepers cleansed to go to the priests, and offer their due, and his disciples to hear the scribes and pharisees in moses’s chair, etc. And yet:

1. The high priests were not of Aaron‘s line according to institution.

2. They bought the office of heathen Romans.

3. They had it not for life, according to institution.

4. Doctrine, worship, discipline and manners were heinously corrupted, so that the hearers were to beware of the leaven of their doctrine and not to imitate their lives. 4. They were bitter enemies of Christ and persecutors: yet Christ never bid his disciples to separate from anything but their errors; but says, ‘They shall cast you out of the synagogues.’ And doubtless Christ committed no sin; nor can we be so holy as He.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), pt. 2, pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-c7997c10a9" data-kw="">
<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into by all the members of the visible Church of one nation or kingdom: when the Church in that kingdom or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not accrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn Covenant in the presence of God. 4. …it is lawful also expressely, publicly and solemnly to vow to God those things which are in the precepts of God enjoined to all believers: But that necessity of making this public, solemn and express covenant, in the presence of the whole Church, requiring it as a thing of absolute necessity to the essential constitution of a particular church, we do not acknowledge: But that union above mentioned, we conceive sufficient by the Word of God for the joining men professing the faith into one particular church. So that, by the Word of God, to the essence and entireness of a particular Church, this union is sufficient.</p></blockquote>

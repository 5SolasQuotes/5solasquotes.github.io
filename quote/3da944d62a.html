<main class="wrap"><figure class="quote" id="q-3da944d62a" data-kw="">
<blockquote><p>For by faith Abel offered unto God a greater sacrifice than Cain; by the which he obtained witness that he was righteous, God testifying of his gifts: by the which faith also he being dead, yet speaketh.” Hebrews 11:4 (Geneva Bible)

Hence we learn that the church militant is a mixed and compounded company of men – not of one sort, but true believers and hypocrites mingled together, as here in the very infancy of the church there was Cain worshipping in show as well as Abel that worshipped in truth. So it was in the infancy, so in her perpetual growth. And so it shall be in the last age of the church. The good shall never be quite separated from the bad, until Christ Himself do it at the last judgment. Goats shall always be mingled among the sheep, “till Christ the great shepherd do separate them himself” (Matt. 25:34). And he that imagines a perfect separation till then, imagines a fancy in his brain and such a church as cannot be found upon the earth.

This being so, let no man therefore be afraid to join himself to the visible church, neither let any that are in it go out of it, because the bad are mingled with the good; for so it has been always and ever will be. He then that will go out of a church because there be hypocrites in it must go out of the world, for such a church is not found but triumphant in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), pp 34-35.</span></figcaption>

</figure><figure class="quote" id="q-c396306b43" data-kw="">
<blockquote><p>I Might yet allege many other differences: but this little may suffice, to let you see, what are the main reasons which oblige us to separate from Rome. Whence it appears, how unjust a comparison it is (that I say not impertinent and silly) which some make of our Separation to that of the Donatists.

For they pretended not to find any thing in the doctrine of the Catholic Church from whence they separated, which was contrary to their belief. Both the one and the other taught the same faith, read the same books, exercised the same services. The Donatist entering with the Catholics found nothing either in their belief or discipline, which he had not seen and learned in his own.

But as for us, ’tis impossible that we should enter into the Communion of the Church of Rome, without swearing to many doctrines which we formerly never learned in the school of the Scriptures; without receiving Sacraments which are utterly unknown to us; without bowing our knees before images which is absolutely forbidden; without adoring a thing for God whose Deity we know not; without acknowledging him to be the Head and Husband of the Church whom we know to be but a mortal man; without subjecting those consciences to an human, which are taught and wont to submit unto none but a divine Authority. …

I would to God the case between the Roman Church and us had been the like! That we had seen nothing deplorable but only the faults of her Pastors, and the disorders of her manners! or That such of her doctrines which we cannot receive, had been the thoughts of some particular men only! Had there been nothing else we should have lived still together.

Our Fathers would never have separated from Her Communion; or if some strange passion, which we dream not of, had precipitated them into a rupture and schism like that of the Donatists; We do in our Consciences protest, that we would have been afraid to follow their error, and that we would have lost no time of uniting our selves with them, from whom we had been so imprudently separated.

For we cannot but confess, That ’tis a piece of very high injustice to impute the faults of men to their profession, and to accuse their Religion of those extravagancies which they commit, especially if against it. In such a case we should questionless practise the doctrine of our Saviour, speaking of them who sit in Moses chair; Matt. xxiii. 3. All those things which they bid you observe, those observe and do; but do not after their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 13, 15.</span></figcaption>

<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation…

3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty…

4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice…

5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful…

6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

<blockquote><p>My light carried me to join with them that protested against these Resolutions, and the Assemblies that followed thereafter; and I was present at the first meeting of some of the Protesters in the West at Kilmarnock, and thereafter at several of their meetings: But indeed I was not satisfied in my mind that the Protesters kept so many meetings, so numerous, and of so long continuance, which I thought made the division wider, and the more conspicuous than otherwise it would have been; and therefore I stayed from many meetings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

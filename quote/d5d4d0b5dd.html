<main class="wrap"><figure class="quote" id="q-d5d4d0b5dd" data-kw="">
<blockquote><p>Now since it appears that all the sound and orthodox writers have unanimously declared for the eternal generation and Sonship of Christ in all ages, and that those only of an unsound mind and judgment, and corrupt in other things as well as this, and many of them men of impure lives and vile principles, have declared against it, such must be guilty of great temerity and rashness to join in an opposition with the one against the other; and to oppose a doctrine the Church of God has always held, and especially being what the scriptures abundantly bear testimony unto, and is a matter of such moment and importance, being a fundamental doctrine of the Christian religion, and indeed what distinguishes it from all other religions, from those of Pagans, Jews and Mohammedans, who all believe in God, and generally in one God, but none of them believe in the Son of God: that is peculiar to the Christian religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation</cite>, Concerning the Eternal Sonship of Christ; Shewing by whom it has been denied and opposed, and by whom asserted and defended, in all ages of Christianity in A Collection of Sermons and Tracts: In Two Volumes (2 vols, London: George Keith, 1773), 2: 564.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/eastern-orthodox.html">Eastern Orthodox</a></span></div>

</figure><figure class="quote" id="q-282815b9ce" data-kw="">
<blockquote><p>For to take first a very recent and very plain case: what sort of trial, think we, was that which the Church had experience of the other day, when that unhappy Nestorius, all at once metamorphosed from a sheep into a wolf, began to make havoc of the flock of Christ, while as yet a large proportion of those whom he was devouring believed him to be a sheep, and consequently were the more exposed to his attacks?

For who would readily suppose him to be in error, who was known to have been elected by the high choice of the Emperor, and to be held in the greatest esteem by the priesthood? who would readily suppose him to be in error, who, greatly beloved by the holy brethren, and in high favour with the populace, expounded the Scriptures in public daily, and confuted the pestilent errors both of Jews and Heathens?

Who could choose but believe that his teaching was Orthodox, his preaching Orthodox, his belief Orthodox, who, that he might open the way to one heresy of his own, was zealously inveighing against the blasphemies of all heresies? But this was the very thing which Moses says: “The Lord your God doth try you that He may know whether you love Him or not.” …

Nestorius … while pretending that he holds two distinct substances in Christ, brings in of a sudden two Persons, and with unheard of wickedness would have two sons of God, two Christs,—one, God, the other, man, one, begotten of his Father, the other, born of his mother. For which reason he maintains that Saint Mary ought to be called, not Theotocos (the mother of God), but Christotocos (the mother of Christ), seeing that she gave birth not to the Christ who is God, but to the Christ who is man.

But if any one supposes that in his writings he speaks of one Christ, and preaches one Person of Christ, let him not lightly credit it. For either this is a crafty device, that by means of good he may the more easily persuade evil, according to that of the apostle, “That which is good was made death to me,”—either, I say, he craftily affects in some places in his writings to believe one Christ and one Person of Christ, or else he says that after the Virgin had brought forth, the two Persons were united into one Christ, though at the time of her conception or parturition, and for some short time afterwards, there were two Christs; so that forsooth, though Christ was born at first an ordinary man and nothing more, and not as yet associated in unity of Person with the Word of God, yet afterwards the Person of the Word assuming descended upon Him; and though now the Person assumed remains in the glory of God, yet once there would seem to have been no difference between Him and all other men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vincent-of-lerins.html">Vincent of Lérins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commonitory for the Antiquity and Universality of the Catholic Faith Against the Profane Novelties of all Heresies</cite>, (434), 11.29, 12.35 in Nicene and Post-Nicene Fathers 2, 11: 138, 140.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/eastern-orthodox.html">Eastern Orthodox</a></span></div>

</figure><figure class="quote" id="q-9ad73df3a9" data-kw="">
<blockquote><p>There are many who think that both the ancient and especially the more recent Greeks intend nothing other than that the Holy Spirit proceeds from the Father alone, through the Son. Thus their opinion would be more tolerable, since the Father works all things through the Son, and in this way the controversy would almost fade into a mere contest over words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 27, section 20, ‘4. Does the Holy Spirit proceed from the Father and the Son?’, p. 583</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/eastern-orthodox.html">Eastern Orthodox</a></span></div>

</figure><figure class="quote" id="q-ee2387690c" data-kw="">
<blockquote><p>To deny the procession of the Holy Ghost from the Son, is a grievous error in divinity, and would have grated the foundation, if the Greek Church had so denied the procession of the Holy Ghost from the Son, as that they had made an inequality between the Persons. But since their form of speech is, ‘That the Holy Ghost proceeds from the Father by the Son, and is the Spirit of the Son,’ without making any difference in the consubstantiality of the Persons, it is a true, though an erroneous Church in this particular. Diverse learned men think, that a filio [by the Son] &amp; per filium [through the Son] in the sense of the Greek Church, was but a question in modo loquendi, ‘in manner of speech,’ and not fundamental.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, II.xvi</cite>, p. 214</span></figcaption>

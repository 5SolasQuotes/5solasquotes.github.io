<blockquote><p>8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>

<blockquote><p>Concerning the nature of lesser excommunication, it is asked, Does it have a foundation in Scripture? Certainly it is without controversy that it was in common use in the early church, because the “abstenti” and the penitent were distinguished from those who were excommunicated, and they had a particular place in the Church, as is known. Also, the reason is obvious: because, even if some, after a grave sin and scandal committed against the Church, professes repentance, nevertheless, it must be proven to the Church whether that repentance is sincere, which must be gathered from its fruits. So that, in the meantime, the scandal is removed from the offended members of the Church, and just as he did with his sin, so also, in the meantime, he makes his repentance known to others. Nevertheless, we acknowledge that, in establishing the time for penitence, the ancients were more strict than the apostolic custom appears to require. But, beyond this, some foundations must also be given for this discipline of the Church. I. The first is sought from the abstenti in the Old Testament, who, on account of ceremonial or moral impurity, were compelled to abstain from the common sacrifices, and sacraments, until they were cleansed, and reconciled by particular signs and sacrifices of repentance. Yet, they were not therefore cast out of the Church, or uprooted from the people. II. The passages 1 Cor. 5 and 2 Cor. 2 and 7, compared to each other, evince it. For Paul judges that that incestuous man is to be excommunicated, but he repents in anticipation of this, and they ask the Apostle what is therefore to be done by them. And to this question, he responds, in the second epistle, that the sinner must not be afflicted with such great sorrow that he is consumed; but the ἐπιτίμησις, the rebuke, done by many is sufficient; and that, therefore, he wishes for him to be received again by the Church. Now, reasonably, in the meantime, he professed his repentance; and nevertheless, he was doubtlessly kept [from the sacrament], until they had received a response from the Apostle. III. From the passage 1 Cor. 11:28, “But let a man examine himself, and so let him eat of that bread, and drink of that cup.” If, therefore, it is the responsibility of individuals to examine themselves, so that they do not eat unworthily, therefore, it is also the responsibility of the rulers of the Churches, to prove others, so that they do not eat unworthily, and eat or drink judgment upon themselves, or with scandal to others, as is said in the same place, at the end of the chapter [1 Cor. 10:32]: “Give offense to none, neither to the Jews, nor to the gentiles.” IV. Some also think that lesser excommunication is indicated in the words of Christ, Mt. 18:17, when he says, “Let him be to you as a publican.” A publican could pray and be in the temple, Lk. 18:13, even though they could not share in sacrifices or sacraments. Nevertheless, Beza, against Erastus, judges the contrary, and that this phrase comes from the fact that a publican was more reviled than a Gentile. Moreover, they could not be shut out of the temple because they were public servants of the Romans, and Jews, who they did not dare to shut out. Or they were in the outermost part of the temple, where even Gentiles could appear, from 1 Kng. 8:41. Nevertheless, afterward, the Court of the Gentiles appears to have been distinguished under Herod from the Court of Israel. V. 1 Cor. 10:21, “You cannot be partakers of the Lord’s table, and of the table of devils.” Also 1 Cor. 5:11, “Do not eat with such a person.” Therefore, much less is it lawful to grant them the Supper. 1 Cor. 10, the Apostle addresses that which cannot be done rightly and with a good conscience, and therefore is wicked. What is objected, then, is that God immediately forgives the one who repents; and therefore, the Church must do the same. Resp. This is true, when it is clear to the church; and also, when it can be done with edification; for the Church is not a searcher of hearts, and it must also have regard for the scandal or edification of the weak. Rom. 14:13. 1. It is objected by Erastus that all who were circumcised were able to celebrate the Passover with others; and thus, it is enjoined upon every head of household, Ex. 12:4. Therefore, also the Supper. Resp. The antecedent is denied, because those who were impure were, according to the law, compelled to abstain for a whole month, in order to cleanse themselves in the meantime. Num. 9:10; 2 Chron. 30:17. 2. Obj. If it is not lawful for any Christian to separate himself from the Supper without the sin of schism, on account of the vices which rule over many in the Church, as long as the doctrine is pure; therefore, neither is it lawful for the Church to separate anyone from the Supper, as long as his confession is pure. Resp. The consequence is denied: for the nature of a private man is one thing, and that of the whole Church, or of the rulers of the Church, another. For they are commanded to watch that the sacraments are not profaned, and to make a distinction between what is pure and impure, with public authority, which it is not lawful for individuals to take upon themselves: for the former is a remedy against sins, but the latter violates charity. 3. Christ, 1 Cor. 11:28, commands for all to eat of that bread, and drink of this cup, as long as they have proven themselves. Resp. But if they do not prove themselves, and yet they wish to eat of this bread, and drink of this wine, nevertheless, it is not to be permitted them, if the matter is obvious, so that they do not eat harsher judgment upon themselves, as we heard concerning the impure in the Old Testament. 4. 1 Cor. 10:2-4 says that the fathers “all ate the same spiritual food, and they all drank the same spiritual drink,” which corresponds to the Supper. But many of them were ungodly. Therefore… Resp. The nature of these things is different, because here, the food and drink was not only sacramental, but also corporeal. Secondly, God punished them. Thirdly, their great number made them more negligent in this. 5. But there were many drunks, fornicators, and idolaters in the Corinthian Church, and yet he does not command them to abstain from the Supper. Resp. Even if he does not command it everywhere, nevertheless, he commanded it in 1 Cor. 5:4. For the one who commands what is greater also commands what is lesser. Secondly, he who forbids them from eating food with them much more forbids them from partaking of the Supper. Finally, he threatens in 2 Cor. 10:6 that he will come to them with a rod unless they do their duty. It is called greater excommunication, when one who is called a brother, on account of grave impurity of doctrine or life, having shown contempt for the private and public admonitions of the Church, is still obstinate in his sin, and he is pronounced to be shut out, not only from the Holy Supper, but also before the whole Church, in God’s name, from the fellowship of the Church, by a public sentence on earth, and consequently, in heaven, until such a time as he is reconciled to God and the Church by true and sincere repentance. This excommunication is also called “handing over to Satan” by the Apostle, 1 Cor. 5:5; 1 Tim. 1:20, because he who is cast out of the Church is cast into the kingdom of Satan, who reigns outside Christ’s Church. Even though Chrysostom and Augustine thought that, in the first Church, a man of this sort was also handed over to Satan to be tormented bodily. The Apostle, in the same place, calls it “the cleansing of leaven,” and “removal from the Church’s midst.” Christ, on the other hand, Mt. 18:17, says “let him be to you as a heathen and a publican;” namely, a man with whom one has no fellowship in sacred things; that is, respecting all the signs of grace which God gives his Church. In this definition, some of its parts are to be explained, besides those that were explained above, concerning its instrumental cause and subject; and that against the Mennonites, who excommunicate for any reason, and who split their Churches, so that they appear to follow the example of a house of buyers and sellers. And, I. it is certainly employed, not on account of the routine infirmities of men, but only with those who gravely sin against the doctrine or commandments of God, as is explained in 1 Cor. 5:5; sins on account of which men are shut out of the kingdom of God, and which are a great scandal to the Church, as in Gal. 5:12, “I would that they were even cut off which trouble you.” Also Rom. 16:17; 1 Tim. 1:20. It is asked, Should it be used on account of light matters? In this way, the bishops excommunicate on account of a debt of a small sum of money, and contracted without fraud, when, nevertheless, men of this sort can be godly. 2 Kg. 1:8. Therefore, we respond that routine sins do not appear to be punished this way in the Scriptures, unless they become grave sins, and liable to scandal, by the addition of obstinacy and contempt. They are purged by routine, ordinary repentance. But rather, it is used for those for which extraordinary, open repentance is necessary for their expiation. Nor is it even used for serious, hidden sins, as long as they remain hidden, as is clear from Mt. 18:15. Therefore, it is only used with sins that are serious, and open, and for which there is need of open, extraordinary means, in order to lead a man to repentance. II. Not even in serious or the most serious sins, unless lasting obstinacy and rebellion is added to it, contrary to all admonitions, private and public. And this is stated in opposition to the ancient Novatians, and the recent Mennonites, who in sins of this sort first excommunicate the man, and then admonish him. For they wish for him to repent outside of the church, not within the Church, because of 1 Cor. 5:1, where Paul does not precede with any admonition; but he simply wishes for the incestuous man to be excommunicated. But we respond, this passage is not to be considered alone; instead, it must be compared with others. For, in 2 Cor. 2:6 and 7:9, the Apostle wishes for him to be forgiven after an admonition, or a “rebuke by many.” Therefore, an admonition preceded, while he was not yet excommunicated. 2. Christ’s words in Mt. 18:17 are clear: “If he neglect to hear the church.” Also Tit. 3:10.</p></blockquote>

s man to be excommunicated. But we respond, this passage is not to be considered alone; instead, it must be compared with others. For, in 2 Cor. 2:6 and 7:9, the Apostle wishes for him to be forgiven after an admonition, or a “rebuke by many.” Therefore, an admonition preceded, while he was not yet excommunicated. 2. Christ’s words in Mt. 18:17 are clear: “If he neglect to hear the church.” Also Tit. 3:10.”

— Anthony Walaeus, Opera Omnia, vol. 1, p. 518 tr. Charles Johnson">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+the+nature+of+lesser+excommunication%2C+it+is+asked%2C+Does+it+have+a+foundation+in+Scripture%3F+Certainly+it+is+without+controversy+that+it+was+in+common+use+in+the+early+church%2C+because+the+%E2%80%9Cabstenti%E2%80%9D+and+the+penitent+were+distinguished+from+those+who+were+excommunicated%2C+and+they+had+a+particular+place+in+the+Church%2C+as+is+known.+Also%2C+the+reason+is+obvious%3A+because%2C+even+if+some%2C+after+a+grave+sin+and+scandal+committed+against+the+Church%2C+professes+repentance%2C+nevertheless%2C+it+must+be+proven+to+the+Church+whether+that+repentance+is+sincere%2C+which+must+be+gathered+from+its+fruits.+So+that%2C+in+the+meantime%2C+the+scandal+is+removed+from+the+offended+members+of+the+Church%2C+and+just+as+he+did+with+his+sin%2C+so+also%2C+in+the+meantime%2C+he+makes+his+repentance+known+to+others.+Nevertheless%2C+we+acknowledge+that%2C+in+establishing+the+time+for+penitence%2C+the+ancients+were+more+strict+than+the+apostolic+custom+appears+to+require.+But%2C+beyond+this%2C+some+foundations+must+also+be+given+for+this+discipline+of+the+Church.+I.+The+first+is+sought+from+the+abstenti+in+the+Old+Testament%2C+who%2C+on+account+of+ceremonial+or+moral+impurity%2C+were+compelled+to+abstain+from+the+common+sacrifices%2C+and+sacraments%2C+until+they+were+cleansed%2C+and+reconciled+by+particular+signs+and+sacrifices+of+repentance.+Yet%2C+they+were+not+therefore+cast+out+of+the+Church%2C+or+uprooted+from+the+people.+II.+The+passages+1+Cor.+5+and+2+Cor.+2+and+7%2C+compared+to+each+other%2C+evince+it.+For+Paul+judges+that+that+incestuous+man+is+to+be+excommunicated%2C+but+he+repents+in+anticipation+of+this%2C+and+they+ask+the+Apostle+what+is+therefore+to+be+done+by+them.+And+to+this+question%2C+he+responds%2C+in+the+second+epistle%2C+that+the+sinner+must+not+be+afflicted+with+such+great+sorrow+that+he+is+consumed%3B+but+the+%E1%BC%90%CF%80%CE%B9%CF%84%CE%AF%CE%BC%CE%B7%CF%83%CE%B9%CF%82%2C+the+rebuke%2C+done+by+many+is+sufficient%3B+and+that%2C+therefore%2C+he+wishes+for+him+to+be+received+again+by+the+Church.+Now%2C+reasonably%2C+in+the+meantime%2C+he+professed+his+repentance%3B+and+nevertheless%2C+he+was+doubtlessly+kept+%5Bfrom+the+sacrament%5D%2C+until+they+had+received+a+response+from+the+Apostle.+III.+From+the+passage+1+Cor.+11%3A28%2C+%E2%80%9CBut+let+a+man+examine+himself%2C+and+so+let+him+eat+of+that+bread%2C+and+drink+of+that+cup.%E2%80%9D+If%2C+therefore%2C+it+is+the+responsibility+of+individuals+to+examine+themselves%2C+so+that+they+do+not+eat+unworthily%2C+therefore%2C+it+is+also+the+responsibility+of+the+rulers+of+the+Churches%2C+to+prove+others%2C+so+that+they+do+not+eat+unworthily%2C+and+eat+or+drink+judgment+upon+themselves%2C+or+with+scandal+to+others%2C+as+is+said+in+the+same+place%2C+at+the+end+of+the+chapter+%5B1+Cor.+10%3A32%5D%3A+%E2%80%9CGive+offense+to+none%2C+neither+to+the+Jews%2C+nor+to+the+gentiles.%E2%80%9D+IV.+Some+also+think+that+lesser+excommunication+is+indicated+in+the+words+of+Christ%2C+Mt.+18%3A17%2C+when+he+says%2C+%E2%80%9CLet+him+be+to+you+as+a+publican.%E2%80%9D+A+publican+could+pray+and+be+in+the+temple%2C+Lk.+18%3A13%2C+even+though+they+could+not+share+in+sacrifices+or+sacraments.+Nevertheless%2C+Beza%2C+against+Erastus%2C+judges+the+contrary%2C+and+that+this+phrase+comes+from+the+fact+that+a+publican+was+more+reviled+than+a+Gentile.+Moreover%2C+they+could+not+be+shut+out+of+the+temple+because+they+were+public+servants+of+the+Romans%2C+and+Jews%2C+who+they+did+not+dare+to+shut+out.+Or+they+were+in+the+outermost+part+of+the+temple%2C+where+even+Gentiles+could+appear%2C+from+1+Kng.+8%3A41.+Nevertheless%2C+afterward%2C+the+Court+of+the+Gentiles+appears+to+have+been+distinguished+under+Herod+from+the+Court+of+Israel.+V.+1+Cor.+10%3A21%2C+%E2%80%9CYou+cannot+be+partakers+of+the+Lord%E2%80%99s+table%2C+and+of+the+table+of+devils.%E2%80%9D+Also+1+Cor.+5%3A11%2C+%E2%80%9CDo+not+eat+with+such+a+person.%E2%80%9D+Therefore%2C+much+less+is+it+lawful+to+grant+them+the+Supper.+1+Cor.+10%2C+the+Apostle+addresses+that+which+cannot+be+done+rightly+and+with+a+good+conscience%2C+and+therefore+is+wicked.+What+is+objected%2C+then%2C+is+that+God+immediately+forgives+the+one+who+repents%3B+and+therefore%2C+the+Church+must+do+the+same.+Resp.+This+is+true%2C+when+it+is+clear+to+the+church%3B+and+also%2C+when+it+can+be+done+with+edification%3B+for+the+Church+is+not+a+searcher+of+hearts%2C+and+it+must+also+have+regard+for+the+scandal+or+edification+of+the+weak.+Rom.+14%3A13.+1.+It+is+objected+by+Erastus+that+all+who+were+circumcised+were+able+to+celebrate+the+Passover+with+others%3B+and+thus%2C+it+is+enjoined+upon+every+head+of+household%2C+Ex.+12%3A4.+Therefore%2C+also+the+Supper.+Resp.+The+antecedent+is+denied%2C+because+those+who+were+impure+were%2C+according+to+the+law%2C+compelled+to+abstain+for+a+whole+month%2C+in+order+to+cleanse+themselves+in+the+meantime.+Num.+9%3A10%3B+2+Chron.+30%3A17.+2.+Obj.+If+it+is+not+lawful+for+any+Christian+to+separate+himself+from+the+Supper+without+the+sin+of+schism%2C+on+account+of+the+vices+which+rule+over+many+in+the+Church%2C+as+long+as+the+doctrine+is+pure%3B+therefore%2C+neither+is+it+lawful+for+the+Church+to+separate+anyone+from+the+Supper%2C+as+long+as+his+confession+is+pure.+Resp.+The+consequence+is+denied%3A+for+the+nature+of+a+private+man+is+one+thing%2C+and+that+of+the+whole+Church%2C+or+of+the+rulers+of+the+Church%2C+another.+For+they+are+commanded+to+watch+that+the+sacraments+are+not+profaned%2C+and+to+make+a+distinction+between+what+is+pure+and+impure%2C+with+public+authority%2C+which+it+is+not+lawful+for+individuals+to+take+upon+themselves%3A+for+the+former+is+a+remedy+against+sins%2C+but+the+latter+violates+charity.+3.+Christ%2C+1+Cor.+11%3A28%2C+commands+for+all+to+eat+of+that+bread%2C+and+drink+of+this+cup%2C+as+long+as+they+have+proven+themselves.+Resp.+But+if+they+do+not+prove+themselves%2C+and+yet+they+wish+to+eat+of+this+bread%2C+and+drink+of+this+wine%2C+nevertheless%2C+it+is+not+to+be+permitted+them%2C+if+the+matter+is+obvious%2C+so+that+they+do+not+eat+harsher+judgment+upon+themselves%2C+as+we+heard+concerning+the+impure+in+the+Old+Testament.+4.+1+Cor.+10%3A2-4+says+that+the+fathers+%E2%80%9Call+ate+the+same+spiritual+food%2C+and+they+all+drank+the+same+spiritual+drink%2C%E2%80%9D+which+corresponds+to+the+Supper.+But+many+of+them+were+ungodly.+Therefore%E2%80%A6+Resp.+The+nature+of+these+things+is+different%2C+because+here%2C+the+food+and+drink+was+not+only+sacramental%2C+but+also+corporeal.+Secondly%2C+God+punished+them.+Thirdly%2C+their+great+number+made+them+more+negligent+in+this.+5.+But+there+were+many+drunks%2C+fornicators%2C+and+idolaters+in+the+Corinthian+Church%2C+and+yet+he+does+not+command+them+to+abstain+from+the+Supper.+Resp.+Even+if+he+does+not+command+it+everywhere%2C+nevertheless%2C+he+commanded+it+in+1+Cor.+5%3A4.+For+the+one+who+commands+what+is+greater+also+commands+what+is+lesser.+Secondly%2C+he+who+forbids+them+from+eating+food+with+them+much+more+forbids+them+from+partaking+of+the+Supper.+Finally%2C+he+threatens+in+2+Cor.+10%3A6+that+he+will+come+to+them+with+a+rod+unless+they+do+their+duty.+It+is+called+greater+excommunication%2C+when+one+who+is+called+a+brother%2C+on+account+of+grave+impurity+of+doctrine+or+life%2C+having+shown+contempt+for+the+private+and+public+admonitions+of+the+Church%2C+is+still+obstinate+in+his+sin%2C+and+he+is+pronounced+to+be+shut+out%2C+not+only+from+the+Holy+Supper%2C+but+also+before+the+whole+Church%2C+in+God%E2%80%99s+name%2C+from+the+fellowship+of+the+Church%2C+by+a+public+sentence+on+earth%2C+and+consequently%2C+in+heaven%2C+until+such+a+time+as+he+is+reconciled+to+God+and+the+Church+by+true+and+sincere+repentance.+This+excommunication+is+also+called+%E2%80%9Chanding+over+to+Satan%E2%80%9D+by+the+Apostle%2C+1+Cor.+5%3A5%3B+1+Tim.+1%3A20%2C+because+he+who+is+cast+out+of+the+Church+is+cast+into+the+kingdom+of+Satan%2C+who+reigns+outside+Christ%E2%80%99s+Church.+Even+though+Chrysostom+and+Augustine+thought+that%2C+in+the+first+Church%2C+a+man+of+this+sort+was+also+handed+over+to+Satan+to+be+tormented+bodily.+The+Apostle%2C+in+the+same+place%2C+calls+it+%E2%80%9Cthe+cleansing+of+leaven%2C%E2%80%9D+and+%E2%80%9Cremoval+from+the+Church%E2%80%99s+midst.%E2%80%9D+Christ%2C+on+the+other+hand%2C+Mt.+18%3A17%2C+says+%E2%80%9Clet+him+be+to+you+as+a+heathen+and+a+publican%3B%E2%80%9D+namely%2C+a+man+with+whom+one+has+no+fellowship+in+sacred+things%3B+that+is%2C+respecting+all+the+signs+of+grace+which+God+gives+his+Church.+In+this+definition%2C+some+of+its+parts+are+to+be+explained%2C+besides+those+that+were+explained+above%2C+concerning+its+instrumental+cause+and+subject%3B+and+that+against+the+Mennonites%2C+who+excommunicate+for+any+reason%2C+and+who+split+their+Churches%2C+so+that+they+appear+to+follow+the+example+of+a+house+of+buyers+and+sellers.+And%2C+I.+it+is+certainly+employed%2C+not+on+account+of+the+routine+infirmities+of+men%2C+but+only+with+those+who+gravely+sin+against+the+doctrine+or+commandments+of+God%2C+as+is+explained+in+1+Cor.+5%3A5%3B+sins+on+account+of+which+men+are+shut+out+of+the+kingdom+of+God%2C+and+which+are+a+great+scandal+to+the+Church%2C+as+in+Gal.+5%3A12%2C+%E2%80%9CI+would+that+they+were+even+cut+off+which+trouble+you.%E2%80%9D+Also+Rom.+16%3A17%3B+1+Tim.+1%3A20.+It+is+asked%2C+Should+it+be+used+on+account+of+light+matters%3F+In+this+way%2C+the+bishops+excommunicate+on+account+of+a+debt+of+a+small+sum+of+money%2C+and+contracted+without+fraud%2C+when%2C+nevertheless%2C+men+of+this+sort+can+be+godly.+2+Kg.+1%3A8.+Therefore%2C+we+respond+that+routine+sins+do+not+appear+to+be+punished+this+way+in+the+Scriptures%2C+unless+they+become+grave+sins%2C+and+liable+to+scandal%2C+by+the+addition+of+obstinacy+and+contempt.+They+are+purged+by+routine%2C+ordinary+repentance.+But+rather%2C+it+is+used+for+those+for+which+extraordinary%2C+open+repentance+is+necessary+for+their+expiation.+Nor+is+it+even+used+for+serious%2C+hidden+sins%2C+as+long+as+they+remain+hidden%2C+as+is+clear+from+Mt.+18%3A15.+Therefore%2C+it+is+only+used+with+sins+that+are+serious%2C+and+open%2C+and+for+which+there+is+need+of+open%2C+extraordinary+means%2C+in+order+to+lead+a+man+to+repentance.+II.+Not+even+in+serious+or+the+most+serious+sins%2C+unless+lasting+obstinacy+and+rebellion+is+added+to+it%2C+contrary+to+all+admonitions%2C+private+and+public.+And+this+is+stated+in+opposition+to+the+ancient+Novatians%2C+and+the+recent+Mennonites%2C+who+in+sins+of+this+sort+first+excommunicate+the+man%2C+and+then+admonish+him.+For+they+wish+for+him+to+repent+outside+of+the+church%2C+not+within+the+Church%2C+because+of+1+Cor.+5%3A1%2C+where+Paul+does+not+precede+with+any+admonition%3B+but+he+simply+wishes+for+the+incestuous+man+to+be+excommunicated.+But+we+respond%2C+this+passage+is+not+to+be+considered+alone%3B+instead%2C+it+must+be+compared+with+others.+For%2C+in+2+Cor.+2%3A6+and+7%3A9%2C+the+Apostle+wishes+for+him+to+be+forgiven+after+an+admonition%2C+or+a+%E2%80%9Crebuke+by+many.%E2%80%9D+Therefore%2C+an+admonition+preceded%2C+while+he+was+not+yet+excommunicated.+2.+Christ%E2%80%99s+words+in+Mt.+18%3A17+are+clear%3A+%E2%80%9CIf+he+neglect+to+hear+the+church.%E2%80%9D+Also+Tit.+3%3A10.%E2%80%9D%0A%0A%E2%80%94+Anthony+Walaeus%2C+Opera+Omnia%2C+vol.+1%2C+p.+518+tr.+Charles+Johnson&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b93ec4bb4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b93ec4bb4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=Concerning%20the%20nature%20of%20lesser%20excommunication,hear%20the%20church.%E2%80%9D%20Also%20Tit.%203%3A10&amp;text=Concerning%20the%20nature%20of%20lesser%20excommunication%2C%20it%20is&amp;text=neglect%20to%20hear%20the%20church.%E2%80%9D%20Also%20Tit.%203%3A10" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…for an excommunicate[d] person may remain externally without the Covenant to the visible Church, when baptism remains a seal, and may be a seal of a grace or privilege, which is interrupted or removed in act, but remains in habit: as to be the eldest son of a king may be a seal of the son’s heirship, and yet he may for a fault be disherited and cast out of his place. The Church and Church-membership are relata secundum esse [related according to being], not secundum dici [according to speaking] only, or relata [Greek]: but baptism and Church-membership are not so perfect relatives, but baptism does remain and the Church-membership may be dissolved: as the burgess ticket whereby a man has right to all the city privileges may remain, when the man for some crime committed against the city has lost all his city privileges and is not now a free citizen, in which case his burgess ticket seals nothing to him: So baptism seals not actual membership in case of excommunication, yet remains baptism valid in the acts of sealing other things [such as the invisible promises of God to the elect and regenerate, the forgiveness of sins, etc.].</p></blockquote>

<blockquote><p>And that otherwise, if the tares grow so rank that they cannot be pulled up, and if the same evil disease take hold of so very many that the consent of the Church cannot be had to the excommunication of a wicked person, then good men must grieve and groan, and endure what they cannot help. Therefore, that excommunication may fruitfully succeed, the consent of the people is necessary… Howbeit, even in such cases when the consent of the Church cannot be had to the execution of this discipline, faithful pastors and professors [laymen] must, every one for his own part, take heed that he have no fellowship with the unfruitful works of darkeness, but even reprove them; yea they ought, in sensu negativo, excommunicate those who should be (but are not) excommunicate positively: which negative excommunication is not an ecclesiastical censure, but either a bare punishment, or a cautel and animadversion; And so says the Archbishop of Spalato [Marco Antonio de Dominis, d. 1624] (De Republica Ecclesiastica, vol. 2, bk. 6, ch. 9, num. 8, pp. 735-36), not only one brother may refuse to communicate with another, but a people also may refuse to communicate with their pastor, which he confirms by certain examples.</p></blockquote>

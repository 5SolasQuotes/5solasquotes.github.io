<main class="wrap"><figure class="quote" id="q-59d8e8b056" data-kw="">
<blockquote><p>For a memorial of this history, which had happened in the desert, that brazen serpent was preserved among the children of Israel for more than 700 years; and until the misuse of worship and adoration arose, they did not judge that they were sinning against the Law (Ex. 20:4) by preserving this image. However, when they began to burn incense to this image, Hezekiah judged that this militated against that law of God, and therefore he broke that serpent in pieces (2 Kings 18:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, Second Topic (Images), Sec. III</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/images.html">Images</a></span></div>

</figure><figure class="quote" id="q-2c8e3ea429" data-kw="">
<blockquote><p>I do not with the Tridentine fathers approve the necessity of having images in churches, nor do I place any part of piety in them, but with Luther I place images among the adiaphora if they are not set up or used for worship and adoration.</p></blockquote>

</figure><figure class="quote" id="q-c236909604" data-kw="monastic">
<blockquote><p>Although they are not agreed as to the number (some making more, others fewer), still there are three principal ones upon which they build up the monastic life, continence, obedience and poverty. To these the three vows imposed upon monks correspond: of perpetual continence, regular obedience and voluntary poverty. Of the orthodox. II. On the other hand, the orthodox do not deny that there are certain indifferent works left to each one’s own will in the Scriptures, and with respect to which counsels may be given in the word of God, not improperly distinguished from the precepts necessarily to be obeyed: such as Paul’s counsel concerning a virgin’s marrying or not marrying (1 Cor. 7:26, 36); concerning the use of wine with regard to Timothy (1 Tim. 5:23*). Still they are of such a nature that they are not of themselves pleasing to God and when neglected, deserve no punishment; nor when observed, any reward. But they deny that there are any such counsels about moral things, since these fall under commands properly so called, not under counsels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/monasticism.html">Monasticism</a></span></div>

</figure><figure class="quote" id="q-fa950a99bd" data-kw="Vernacular">
<blockquote><p>Because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read, and search them, therefore they are to be translated into the vulgar language of every nation unto which they come, that the Word of God dwelling plentifully in all, they may worship Him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.8</span></figcaption>

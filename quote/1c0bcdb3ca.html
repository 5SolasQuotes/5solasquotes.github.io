<main class="wrap"><figure class="quote" id="q-1c0bcdb3ca" data-kw="">
<blockquote><p>God graciously entered into a covenant with holy Adam, and with his posterity in him, to the effect, that if he obeyed the command not to eat of the forbidden fruit, he should receive as his reward indefectibility of holiness and blessedness.

This is proved by Gen. 2:17, “In the day thou eatest thereof thou shalt surely die;” which implies the converse, “If thou dost not eat thereof, thou shalt surely live.” The “life” here implied and promised is a good additional to what Adam already had; otherwise it would not be a reward.

Adam already had spiritual life, namely holiness and happiness; but it was mutable. The additional good, therefore, must have been immutable holiness and happiness. He was to have had spiritual life as indefectible. He was to have passed beyond all possibility of apostasy and misery.

The merit to be acquired under the covenant of works was pactional. Adam could claim the reward, in case he stood, only by virtue of the promise of God; not by virtue of the original relation of a creature to the creator. Upon the latter basis, he could claim nothing, as Christ teaches in Luke 17:10.</p></blockquote>

<blockquote><p>There is still another area in which the Reformed view of the law is influenced by the idea of the covenant. Even after the fall, the law retains something of its covenantal form. The law was not included in the federal relationship without having been affected by it. Even today the call of the law sounds in our ears: such a life I would give you, if only you could fulfil me! God could have wholly eradicated that relation and have taken away the last traces of it from our minds, after the covenant of works was broken. However, He kept its memory alive in us. He has repeated that promise hypothetically and consequently has held up before us constantly the ideal of eternal life to be obtained by keeping the law, a lost ideal though it be. Thus the essential content of the concept of covenant has been kept in our consciousness. When the work of the Spirit by means of the law and the gospel leads to true conversion, in this conversion the longing for this lost ideal of the covenant appears as an essential part. From the above we can also explain why the older theologians did not always clearly distinguish between the covenant of works and the Sinaitic covenant. At Sinai it was not the “bare” law that was given, but a reflection of the covenant of works revived, as it were, in the interests of the covenant of grace continued at Sinai</p></blockquote>

<blockquote><p>In the case of men and angels, God has been pleased to promise this transcendent benefit upon certain conditions; which conditional promise is called a covenant. There can be no doubt that this amazing gift of God’s personal love and life-giving society had been offered to angels, and at the beginning was offered to the first human pair, upon conditions. Some object that the conditional promise made to Adam in the garden is not explicitly called a covenant, and that it does not possess all the essential elements of a covenant, since it was a constitution sovereignly ordained by the Creator without consulting the will of the creature.

It is a sufficient answer to these objections, – (1) That although Adam’s will was not consulted, yet his will was unquestionably cordially consenting to this divine constitution and all the terms thereof, and hence the transaction did embrace all the elements of a covenant. (2) That instances of analogous transactions between God and men are expressly styled covenants in the Bible. If God’s transactions with Noah (Gen. 9:11,12) and with Abraham (Gen. 17:1-21) were covenants, then was his transaction with Adam in the garden a covenant.

The analysis of a covenant always gives the following elements: (a) Its parties. (b) Its promise. (c) Its conditions. (d) Its penalty. As to its parties, our Standards teach –

In the first covenant that concerned mankind God dealt with Adam as the representative of all his descendants. The parties, therefore, are God and Adam, the latter representing the human race. That Adam did so act as the representative of his descendants, in such a sense that they were equally interested with himself in all the merit or the demerit, the reward or the penalty, attaching to his action during the period of probation, has already been proved to be the doctrine both of our Standards and of Scripture. (Ch. 6., ss. 3, 4.) As to the further nature of this covenant, our Standards teach – The promise of it was life, the condition of it perfect obedience, and the penalty of it death. (L. Cat., q. 20; S. Cat., q. 12.)

This covenant is variously styled, from one or other of these several elements. Thus, it is called the “covenant of works,” because perfect obedience was its condition, and to distinguish it from the covenant of grace, which rests our salvation on a different basis altogether. It is also called the “covenant of life,” because life was promised on condition of the obedience. It is also called a “legal covenant,” because it demanded the literal fulfilment of the claims of the moral law as the condition of God’s favour. This covenant was also in its essence a covenant of grace, in that it graciously promised life in the society of God as the freely-granted reward of an obedience already unconditionally due. Nevertheless it was a covenant of works and of law with respect to its demands and conditions.

(1) That the promise of the covenant was life is proved – (a) From the nature of the penalty, which is recorded in terms. If disobedience was linked to death, obedience must have been linked to life. (b) It is taught expressly in many passages of Scripture. Paul says, Rom. 10:5, “Moses describes the righteousness which is of the law, That the man which does those things shall live by them.” (Matt. 19:16,17; Gal. 3:12; Lev. 18:5; Neh. 9:29.)

That the life promised was not mere continuance of existence is plain – (a) From the fact that the death threatened was not the mere extinction of existence. Adam experienced that death the very day he ate the forbidden fruit. The death threatened was exclusion from the communion of God. The life promised, therefore, must consist in the divine fellowship and the excellence and happiness thence resulting. (b) From the fact that mere existence was not in jeopardy. It is the character, not the fact, of continued existence which God suspended upon obedience. (c) Because the terms “life” and “death” are used in the Scriptures constantly to define two opposite spiritual conditions, which depend upon the relation of the soul to God. (John 5:24; 6:4; Rom. 6:23; 11:15; Eph. 2:1-3; 5:14; Rev. 3:1.)

(2) That the condition of the covenant was perfect obedience is plain from the fact – (a) That the divine law can demand no less. It is of the essence of all that is right that it is obligatory. James says, that “whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” James 2:10; Gal. 3:10; Deut. 27:26. (b) That the command not to eat of the fruit of the tree of the knowledge of good and evil, relating to a thing indifferent in itself, was plainly designed to be a naked test of obedience, absolute and without limit.

(3) That the penalty of this covenant was death is distinctly stated: “In the day thou eatest thereof, dying thou shalt die.” Gen. 3:17. This denoted a most lamentable state of existence, physical and moral, and not the cessation of existence or the dissolution of the union between soul and body, because-(a) It took effect in our first parents hundreds of years before the dissolution of that union. (b) Because the Scriptures constantly describe the moral and spiritual condition into which their descendants are born, and from which they are delivered by Christ, as a state of death. (Rev. 3:1; Eph. 2:1-5; 5:14; John 5:24.) This death is a condition of increasing sin and misery, resulting from excision from the only source of life. It involves the entire person, soul and body, and continues as long as the cause continues.</p></blockquote>

</figure><figure class="quote" id="q-6f6824abdd" data-kw="">
<blockquote><p>In calling him LORD, he regards him as the God of the covenant; not so much of a covenant of works; for believers are in truth not under the law, but under grace. Yea, as a God in the covenant of works, there is nothing to excite or attract unto confession, nor unto hope of forgiveness, for all the Lord’s virtues are armed against the sinner, so that He can keep no company with the workers of iniquity. But rather, a covenant of grace, which on account of its firmness and lasting immutability is called good, a covenant of salt, and the sure mercies of David. Herein God Himself, laying aside His wrath, letting mercy and peace go before His face, reveals the sceptre of mercy to sinful rebels, and assures all those who flee unto His mercy in the Mediator, of forgiveness of all sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), p. 52.</span></figcaption>

</figure><figure class="quote" id="q-7457ef94db" data-kw="">
<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.”

t%2C+and+he+can+challenge+the+sum+as+a+debt%2C+which+he+could+not+do+before.+For+proof+this%2C+consider%2C+1.+Here+is+a+concurrence+of+all+that+is+necessary+to+constitute+a+true+and+proper+covenant+of+works.+The+parties+contracting%2C+God+and+man%3B+God+requiring+obedience+as+the+condition+of+life%3B+a+penalty+fixed+in+case+of+breaking%3B+and+man+acquiescing+in+the+proposal.+The+force+of+this+cannot+be+evaded%2C+by+comparing+it+with+the+consent+of+subjects+to+the+laws+of+an+absolute+prince.+For+such+a+law+proposed+by+a+prince%2C+promising+a+reward+upon+obedience+to+it%2C+is+indeed+the+proposing+of+a+covenant%2C+the+which+the+subject+consenting+to+for+himself+and+his%2C+and+taking+on+him+to+obey%2C+does+indeed+enter+into+a+covenant+with+the+prince%2C+and+having+obeyed+the+law+may+claim+the+reward+by+virtue+of+paction.+And+so+the+covenant+of+works+is+ordinarily+in+scripture+called+%E2%80%9Cthe+law%2C%E2%80%9D+being+in+its+own+nature+a+pactional+law.+2.+It+is+expressly+called+a+covenant+in+scripture%2C+Gal.+4%3A2%2C+%E2%80%9CFor+these+are+the+two+covenants%2C+the+one+from+the+Mount+Sinai%2C%E2%80%9D+%26c.+This+covenant+from+Mount+Sinai+was+the+covenant+of+works+as+being+opposed+to+the+covenant+of+grace%2C+namely%2C+the+law+of+the+ten+commandments%2C+with+promise+and+sanction%2C+as+before+expressed.+At+Sinai+it+was+renewed+indeed%2C+but+that+was+not+its+first+appearance+in+the+world.+For+there+being+but+two+ways+of+life+to+be+found+in+scripture%2C+one+by+works%2C+the+other+by+grace%3B+the+latter+hath+no+place%2C+but+where+the+first+is+rendered+ineffectual%3B+therefore+the+covenant+of+works+was+before+the+covenant+of+grace+in+the+world%3B+yet+the+covenant+of+grace+was+promulgated+quickly+after+Adam%E2%80%99s+fall%3B+therefore+the+covenant+of+works+behoved+to+have+been+made+with+him+before.+And+how+can+one+imagine+a+covenant+of+works+set+before+poor+impotent+sinners%2C+if+there+had+not+been+such+a+covenant+with+man+in+his+state+of+integrity%3F+Hos.+6%3A7%2C+%E2%80%9CBut+as+for+them%3B+like+Adam%2C+they+have+transgressed+the+covenant.%E2%80%9D+Our+translators+set+the+word+Adam+on+the+margin.+But+in+Job+31%3A33%2C+they+translate+the+very+same+word%2C+%E2%80%9Cas+Adam.%E2%80%9D+This+word+occurs+but+three+times+in+scripture%2C+and+still+in+the+same+sense.+Job+31%3A33%2C+%E2%80%9CIf+I+covered+my+transgressions%2C+as+Adam%2C%E2%80%9D+Psalm+82%3A7%2C+%E2%80%9CBut+ye+shall+die+like+Adam.%E2%80%9D+Compare+ver.+6%2C+%E2%80%9CI+have+said%2C+Ye+are+gods%3B+and+all+of+you+are+children+of+the+Most+High%3B%E2%80%9D+compared+with+Luke+3%3A38%2C+%E2%80%9CAdam%2C+which+was+the+son+of+God.%E2%80%9D+And+also+here%2C+Hos.+6%3A7.+While+Adam%E2%80%99s+hiding+his+sin%2C+and+his+death+are+made+an+example%2C+how+natural+is+it+that+his+transgression%2C+that+led+the+way+to+all%2C+be+made+so+too%3F+This+is+the+proper+and+literal+sense+of+the+words%3B+it+is+so+read+by+several%2C+and+is+certainly+the+meaning+of+it.+3.+We+find+a+law+of+works+opposed+to+the+law+of+faith%2C+Rom.+3%3A27.+%E2%80%9CWhere+is+boasting+then%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay%3B+but+by+the+law+of+faith.%E2%80%9D+This+law+of+works+is+the+covenant+of+works%2C+requiring+works%2C+or+obedience%2C+as+the+condition+pleadable+for+life%3B+for+otherwise+the+law+as+a+rule+of+life+requires+works+too.+Again%2C+it+is+a+law+that+does+not+exclude+boasting%2C+which+is+the+very+nature+of+the+covenant+of+works%2C+that+makes+the+reward+to+be+of+debt.+And+further%2C+the+law+of+faith+is+the+covenant+of+grace%3B+therefore+the+law+of+works+is+the+covenant+of+works.+So+Rom.+6%3A14%2C+%E2%80%9CYe+are+not+under+the+law%2C+but+under+grace.%E2%80%9D+And+this+was+the+way+of+life+without+question%2C+which+was+given+to+Adam+at+first.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11.180%E2%80%9382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7457ef94db.html&amp;vi

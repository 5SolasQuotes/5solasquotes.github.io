<main class="wrap"><figure class="quote" id="q-76dea1a2e8" data-kw="">
<blockquote><p>Christ hath merited righteousness for as many as are found in him. In him God findeth us, if we be faithful, for by faith we are incorporated into Christ. Then although in our selves we be altogether sinful, and unrighteous, yet even the man which is impious in him self, full of iniquity, full of sin, him being found in Christ through faith, and having his sin remitted through repentance: him God upholdeth with a gracious eye; putteth away his sin by not imputing; taketh quite away the punishment due thereunto, by pardoning it; and accepteth him in Jesus Christ, as perfectly righteous, as if he had fulfilled all that was commanded him in the law: shall I say more perfectly righteous, then if him self had fulfilled the whole law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works, and how the Foundation of Faith is Overthrown</cite>, (Oxford: Joseph Barnes, 1612), p. 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>Two things are seen in Christ which are necessary to our justification: the one is death; the other, resurrection from the dead, etc. [Rom. 4:25] It was fitting that by his death the sins of the world should be expiated, etc. while by his resurrection from the dead, it pleased the same goodness of God to grant the Holy Ghost, through whom the gospel might be believed, and the justice that was lost by the sin of the first Adam might be restored. The apostle has expressed both parts in these words, ‘Who was delivered on account of our sins, etc. [and was raised again for our justification]’ [Rom. 4:25] In his death therefore is found satisfaction for sin; in his resurrection the gift of the Holy Ghost, by which our justification to life is effected…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4, pp. 161-62</span></figcaption>

<blockquote><p>Let them, if they will, expect eternal life for their good works; only let us on the authority of Paul hope for it from the grace of God. … Let the saying of Paul then stand fast — that “the inheritance is not of the law but of faith, that the promise according to grace may be sure to every one that believeth.” (Romans 4:14.)</p></blockquote>

</figure><figure class="quote" id="q-9cd11ee322" data-kw="">
<blockquote><p>4. Since all of both sides [Reformed and Romanist] allow that forgiveness of sins belongs to the formal cause of our justification, let us now discuss the imputation of the justice of Christ, and whether by that also we are formally justified. … 6. Christ merited for us by everything which He did or suffered on earth; for all infinitely pleased God the Father, and were of immeasureable and inexhaustible merit, because of the hypostatic union of the Divine Person, for He worked human works in a divine manner, as testify S. Dionysius the Areopagite and S. John Damascene. But amongst all that Christ did and suffered, undertaken for us, his death, with the passion immediately preceding it, has chiefly and most especially merited to us justification; for in it the obedience of Christ to the Father, and his love to the human race, shone forth in a wonderful manner, and his whole obedience was therein consummated, as the apostle clearly teaches. This is testified by innumerable passages of Scripture and the Fathers, and moreover, in this all Protestants and Romanists agree…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 2, pp. 101-103</span></figcaption>

<main class="wrap"><figure class="quote" id="q-07e8509ec9" data-kw="">
<blockquote><p>That the feasts and meetings at halls, taverns, or other places within this city or liberties, used to be made by the countrymen of any shire, or other place within this realm, wrestlings, and fencers’ prizes, shows, or the like, which has been a cause of gathering multitudes together, be now forborne, and not attempted to be made by any person or persons whatsoever, until the city and the places adjacent shall be clear of the present infection (which God of his mercy grant).</p></blockquote>

</figure><figure class="quote" id="q-c3281fdd53" data-kw="">
<blockquote><p>…it is the duty of a Christian Magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. But how they that serve in any public civil office may leave their charge in the time of the plague, I do not see; … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing; he shall doubtless do very well both for the sick and the whole, and shall take away many questions which in this argument are wont [accustomed] to be raised:</p></blockquote>

</figure><figure class="quote" id="q-e6b08d012f" data-kw="">
<blockquote><p>We have Paul’s general statement that in the churches all things are to be done decently and in order. Accordingly, civil observances, by which bonds, as it were, order and decorum are kept in the assembly of Christians, are by no means to be classed among human traditions, but are rather to be referred to that rule of the apostle, provided they are not believed to be necessary for salvation, or bind consciences by religion, or are related to the worship of God, or lodge piety in these things. But we are stoutly to resist those regulations which under the title of ‘spiritual laws’ are in force to bind consciences as if necessary for the worship of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin’s Catechism (1538) in ed. Dennison, Reformed Confessions 1.440-1 | 31. Human Traditions</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-129abc9c11" data-kw="">
<blockquote><p>Those who are engaged in a spiritual ministry such as preachers and pastors must likewise remain steadfast before the peril of death.¹ We have a plain command from Christ, “A good shepherd lays down his life for the sheep but the hireling sees the wolf coming and flees” [Jn. 10:11]. For when people are dying, they most need a spiritual ministry which strengthens and comforts their consciences by Word and sacrament and in faith overcomes death. ¹ Elector John wrote Luther and urged him and the professors at the university to leave on account of the plague and go to Jena. Luther, Bugenhagen, and two chaplains, however, stayed on at Wittenberg. However, where enough preachers are available in one locality and they agree to encourage the other clergy to leave in order not to expose themselves needlessly to danger, I do not consider such conduct sinful because spiritual services are provided for and because they would have been ready and willing to stay if it had been necessary. We read that St. Athanasius fled from his church that his life might be spared because many others were there to administer his office (Augustine, MPL 30.1017). Similarly, the brethren in Damascus lowered Paul in a basket over the wall to make it possible for him to escape, Acts 9 [:25]. And also in Acts 19[:30] Paul allowed himself to be kept from risking danger in the marketplace because it was not essential for him to do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether one may Flee from a Deadly Plague’ (c. 1527), p. 2 in Luther’s Works, Vol. 43: Devotional Writings II, ed. Jaroslav Jan Pelikan, Hilton C. Oswald &amp; Helmut T. Lehmann, vol. 43 (Philadelphia: Fortress Press, 1999), 119–38</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>The Presbyterian church, in her accredited standards, acknowledges Jesus as her divine Lord, and proclaims all the great doctrines of Christianity. If, by a church of Christ we understand a collection of his professing people who worship him according to his word, surely Presbyterians may have some claim to the designation. There are some Presbyterians who desire to walk in all the statutes and ordinances of the Lord blameless; and in times past, Presbyterians have often suffered unto death that they might maintain the honour of Christ’s crown and covenant. Jesus said — “Where two or three are gathered together in my name, there am I in the midst of them.” (Mat. xviii, 20.)

Presbyterian congregations meet together in the name of the Redeemer — they have often been blessed with seasons of refreshment and revival; and if their assemblies are honoured by the presence of the Great Shepherd and Bishop of souls — and if the Divine Master himself is pleased to acknowledge them as his followers — and if He condescends to make himself known unto them, not as he doth unto the world — they may well pity the folly and the presumption of those who will venture to affirm that they are not to be esteemed churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-d-killen.html">William D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse I in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d437824128" data-kw="">
<blockquote><p>The analogy which I understand is to hold between the Jewish and Christian Church is this: As profane persons were forbidden to enter into the Temple because of the sacramental and typical holiness thereof (for the Temple was a type of Christ), so profane persons are now much more to be kept back from the sacrament of the Lord’s Supper, which has more of sacramental signification, mystery and holiness in it than the temple of Jerusalem had, and whereby more ample evangelical promises are set forth and sealed unto us. And as profane persons might of old come into the court of the gentiles, and there hear the Word preached in Solomon’s porch (where both Christ and his apostles did preach, Jn. 10:23; Acts 3:11; 5:12, which porch was in the utmost court, that is, the court of the gentiles: of which elsewhere out of Josephus), but might not come into the court of Israel, nor have communion in the sacrifices: so profane, obstinate sinners are to be excluded for their impiety from the Church-communion of saints, though they may hear the Word, as heathens also may do.</p></blockquote>

<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholike</cite>, … ([Cambridge,] 1598), 7th Point, ‘Of Traditions’, pp. 136-7</span></figcaption>

<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinaris et operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving. … 11. The question, if such a pastor be called lawfully, is a question of fact, not a question of law; [it is] as this [case]: if such an one be baptized and there be an invincible ignorance in a question of fact which excuses. And therefore we may hear a gifted pastor taken and supposed by the Church to have the Church’s calling, though indeed he received no calling from the Church at his entry. … 3. We are nowhere forbidden in God’s Word to hear teachers sent and called, but only wolves in sheep skins, void of all calling, and intruders: for pastors may be antichristian in the manner of the entry, as Caiaphas… 3. Yea, and brook an antichristian calling, as prelates do and have done in Britain, and yet their ministry be valid. For that the calling of a minister be valid and his ministerial acts not null, it is sufficient that the governing Church give him a calling, either by themselves, their express call, their silence, or tacit consent, or their approbation communicating with him in his ministry, or by these to whom the Church resigned her power, or by these who stand in place of the Church, though prelates invade the place of the Church: yet: [1.] because first they themselves be pastors and have power to teach and baptize as pastors called of Christ. Mt. 18:19. 2. Because they stand for the Church, the Church approving or someway by silence consenting (as in the case of Caiaphas’s entry to the priesthood) thereunto. These who are baptized of them are not rebaptized, and these who are ordained pastors by them are not reordained, but have a calling to the ministry and do validly confer a calling upon others. Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized, not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 1, pp. 204-8, 229, 235 irregular numbering</span></figcaption>

— Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, … (London, 1644), pt. 1, pp. 204-8, 229, 235 irregular numbering">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4th+Distinction.+A+calling+may+be+expressly+and+formally+corrupt+in+respect+of+the+particular+intention+of+the+ordainers+and+of+the+particular+Church%2C+ex+intentione+ordinaris+et+operantis+%5Bout+of+the+intention+of+the+ordainers+and+of+the+one+working%5D.+Thus+Luther%E2%80%99s+calling+to+be+a+monk+was+a+corrupt+calling%2C+and+eatenus%2C+and+%E2%80%98in+that+respect%E2%80%99+he+could+not+give+a+calling+to+others.+But+that+some+calling+may+be+implicitly+and+virtually+good+and+lawful+in+respect+of+the+intention+of+the+Catholic+Church+and+ex+intentione+operis+%26+ipsius+ordinationis+%5Bout+of+the+intention+of+the+work+and+the+ordination+itself%5D%2C+he+was+called+to+preach+the+Word+of+God.+%E2%80%A6+7.+A+calling+to+the+ministry+is+either+such%3A+%5B1.%5D+as+wants+the+essentials%2C+as+gifts+in+any+messenger+and+the+Church%E2%80%99s+consent%2C+or+these+who+occupy+the+room+of+the+Church%2C+the+Church+consenting%3A+such+a+minister+is+to+be+reputed+for+no+minister%3B+or+2.+an+entry+to+a+calling%2C+or+a+calling+where+diverse+of+the+apostles%E2%80%99+requisites+are+wanting%2C+may+be+a+valid+calling%2C+as+if+one+enter+as+Caiphas%2C+who+entered+by+favor+and+money+and+contrary+to+the+Law%2C+was+High-Priest+but+for+a+year%3A+yet+was+a+true+High-Priest+and+prophesied+as+the+High-priest+%5BJn.+11%3A49-51%5D.+8.+If+the+Church+approve+by+silence%2C+or+countenance+the+ministry+of+a+man+who+opened+the+Church+door+to+himself+by+a+silver+key%2C+having+given+the+prelate+a+bud.+The+ordinance+of+God+is+conferred+upon+him%2C+and+his+calling+ceases+not+to+be+God%E2%80%99s+calling+because+of+the+sins+of+the+instruments+both+taking+and+giving.+%E2%80%A6+11.+The+question%2C+if+such+a+pastor+be+called+lawfully%2C+is+a+question+of+fact%2C+not+a+question+of+law%3B+%5Bit+is%5D+as+this+%5Bcase%5D%3A+if+such+an+one+be+baptized+and+there+be+an+invincible+ignorance+in+a+question+of+fact+which+excuses.+And+therefore+we+may+hear+a+gifted+pastor+taken+and+supposed+by+the+Church+to+have+the+Church%E2%80%99s+calling%2C+though+indeed+he+received+no+calling+from+the+Church+at+his+entry.+%E2%80%A6+3.+We+are+nowhere+forbidden+in+God%E2%80%99s+Word+to+hear+teachers+sent+and+called%2C+but+only+wolves+in+sheep+skins%2C+void+of+all+calling%2C+and+intruders%3A+for+pastors+may+be+antichristian+in+the+manner+of+the+entry%2C+as+Caiaphas%E2%80%A6+3.+Yea%2C+and+brook+an+antichristian+calling%2C+as+prelates+do+and+have+done+in+Britain%2C+and+yet+their+ministry+be+valid.+For+that+the+calling+of+a+minister+be+valid+and+his+ministerial+acts+not+null%2C+it+is+sufficient+that+the+governing+Church+give+him+a+calling%2C+either+by+themselves%2C+their+express+call%2C+their+silence%2C+or+tacit+consent%2C+or+their+approbation+communicating+with+him+in+his+ministry%2C+or+by+these+to+whom+the+Church+resigned+her+power%2C+or+by+these+who+stand+in+place+of+the+Church%2C+though+prelates+invade+the+place+of+the+Church%3A+yet%3A+%5B1.%5D+because+first+they+themselves+be+pastors+and+have+power+to+teach+and+baptize+as+pastors+called+of+Christ.+Mt.+18%3A19.+2.+Because+they+stand+for+the+Church%2C+the+Church+approving+or+someway+by+silence+consenting+%28as+in+the+case+of+Caiaphas%E2%80%99s+entry+to+the+priesthood%29+thereunto.+These+who+are+baptized+of+them+are+not+rebaptized%2C+and+these+who+are+ordained+pastors+by+them+are+not+reordained%2C+but+have+a+calling+to+the+ministry+and+do+validly+confer+a+calling+upon+others.+Yea%2C+many+of+great+learning+think+that+at+the+beginning+of+Reformation+thousands+being+under+popery+baptized+by+midwives+and+private+persons%2C+were+never+rebaptized%2C+not+that+they+think+such+baptism+valid%2C+but+where+the+sacrament+is+wanting%2C+ex+invincibili+ignorantia+facti%2C+%E2%80%98out+of+an+invincible+ignorance+of+a+fact%E2%80%99%2C+such+that+way+%5Bthe%5D+baptized+do+indeed+want+the+Lord%E2%80%99s+seal%3B+but+we+cannot+for+that+say+that+they+are+no+better+than+infidels+and+unbaptized+Turks+and+Jews%2C+because%3A+1.+Their+being+born+in+the+visible+Church+gives+a+federal+holiness%2C+as+all+of+Jewish+parents+had+a+federal+right+to+circumcision+and+were%2C+eatenus%2C+%E2%80%98insofar%E2%80%99%2C+separated+from+the+womb.+2.+Because+their+profession+of+that+Covenant+whereof+baptism+is+a+seal%2C+separates+them+sufficiently+from+infidels%2C+though+they+want+the+seal+external.+But+our+divines+esteem%2C+and+that+justly%2C+baptism+administrated+by+women+or+such+as+have+no+calling%2C+to+be+no+baptism+at+all%3B+for+which+let+the+reader+see+Calvin%2C+Institutes%2C+bk.+4%2C+ch.+15%2C+sect.+20%3B+Epistle+326%3B+Beza%2C+Libel.%2C+Questione+de+Baptism%3B+the+learned+Rivet%2C+in+Cathol.+Orthod.%2C+tome+2%2C+tract+2%2C+q.+7.+We+stand+not+for+what+Bellarmine%2C+Maldonatus%2C+Gretserus+and+other+papists+say+on+the+contrary.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%E2%80%A6+%28London%2C+1644%29%2C+pt.+1%2C+pp.+204-8%2C+229%2C+235+irregular+numbering&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce6f22c7a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce6f22c7a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=4th%20Distinction.%20A%20calling%20may%20be,other%20papists%20say%20on%20the%20contrary&amp;text=4th%20Distinction.%20A%20calling%20may%20be%20expressly%20and&amp;text=Gretserus%20and%20other%20papists%20say%20on%20the%20contrary" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3a1154a031" data-kw="">
<blockquote><p>Albeit we should most humbly subject ourselves to our governors, yet we may not submit our liberty to them, which God has graciously given us, because we are forbidden to be the servants of men (1 Cor. 7:23), or to be entangled with the yoke of bondage (Gal. 5:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies… (1637), pt. 1 | ch. 7, ‘That [Imposed] Festival Days take away our Liberty which God has given us, Proved: &amp; First out of the Law’, pp. 20-24</cite>, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“Albeit we should most humbly subject ourselves to our governors, yet we may not submit our liberty to them, which God has graciously given us, because we are forbidden to be the servants of men (1 Cor. 7:23), or to be entangled with the yoke of bondage (Gal. 5:1).”

</figure><figure class="quote" id="q-ea8cc5f65b" data-kw="">
<blockquote><p>It is not unlawful of itself to sell poison, or give a knife to another, or to bid another to do it [sell the goods]; but if it were foreseen that they will be used to poison or kill the buyer, it is unlawful; and I think the [civil] Law would make him believe it that were guilty. It is not of itself unlawful to light a candle, or set fire on a straw; but if it may be foreknown that by another’s negligence or willfulness [that] it is like[ly] to set fire on the city, or give fire to a train or store of gun-powder that is under the Parliament House, when the King and Parliament are there, I crave the Bishop’s [his opponent’s] pardon for believing that it were sinful to do it, or command it;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in George Morley, The Bishop of Worcester’s Letter to a Friend for Vindication of Himself from Mr. Baxter’s Calumny (London, 1662) no page numbers.</cite></span></figcaption>

</figure><figure class="quote" id="q-e5cee6e3e3" data-kw="">
<blockquote><p>We all know the intention of the end goes in the intention before the action, but not as an essential cause to make an evil action good, or [to] make an indifferent action necessary and honest: A good intention does make a good action good and better, but that a good intention (as idolators are full of good intentions) can never so season the means, as… that it can make evil to be good. Vasquez condemns the Fathers of ignorance, because they said, Propositum bonum excusat malum opus [A proposed good excuses a bad work]: so Cassianus said [that] it was lawful to lie for a good end, and Chrysostom and Ambrose said the same, as Vasquez says: see Aquinas for this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, p. 215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

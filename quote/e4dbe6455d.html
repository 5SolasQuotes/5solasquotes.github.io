</figure><figure class="quote" id="q-1737c351a3" data-kw="">
<blockquote><p>He adds, secondly, the extent of this subjection and obedience, even to all things: which is not to be understood of all things absolutely, and without exception, Acts 5:29, but all things lawful, godly, honest, and which are not forbidden in the word of God, even though they cross the humor of the wives, and argue little discretion in the husband who commands them. Numb. 5:1-15, etc.; for nothing is excepted here but what is contrary to that subjection which is due to Him who has commanded this subjection of wives to their husbands, as Paul comments upon an expression like to this, 1 Cor. 15:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians</cite>, … (London: T. Ward, 1841) | on Eph. 5:24, p. 243</span></figcaption>

</figure><figure class="quote" id="q-c888c44880" data-kw="">
<blockquote><p>The author with the Scriptures makes a pastor, a bishop, a preaching elder, to be altogether one and in nothing to differ, but as three synonymous names of one and the same officer, which by divine right is indeed superior to a ruling elder, or presbyter; this no man ever did question, but no way superior to a preaching elder [as presbyterians hold], of whom alone is all the present question [with episcopacy].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness &amp; Danger of Limited Episcopacy</cite>, (1641), p. 17</span></figcaption>

</figure><figure class="quote" id="q-682902fc1f" data-kw="">
<blockquote><p>We find, that in the ministry of the New Testament there is a comely, beautiful and divine order: one kind of ministers, both ordinary and extraordinary, being placed in degree and dignity before another, as the apostles before all other ministers, the pastor before the elder, and deacon: But we do not find in ministers of the same kind that one has majority of power over others, or priority of degree and dignity before others, except upon the moral respect of age, zeal, gifts, etc. No apostle is in degree above other apostles, no evangelist above other evangelists, nor elder above other elders, no deacon above other deacons: Upon what ground then from Scripture can we believe or conceive that one pastor is in degree superior to other pastors, or that, in all other sorts of ministers, ordinary and extraordinary, there’s all [to] be a parity in their own kind and only in the office of pastors an inequality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered</cite>, (1641), p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

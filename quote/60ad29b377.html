<main class="wrap"><figure class="quote" id="q-60ad29b377" data-kw="">
<blockquote><p>Does the new economy surpass the old, in regard to extent? Thou then who art a believer, and a partaker of the inestimable blessings of the gospel, shouldst be zealous in promoting missions to infidel and Heathen nations. By thy prayers, thy counsel, and thy substance, thou oughtest to exert thyself, for the diffusion of evangelical knowledge among benighted nations; in order that the spiritual kingdom of Christ, may be universally extended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 390.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-111a30126c" data-kw="">
<blockquote><p>These things being granted, the only way of life and salvation by Jesus Christ, under the old testament and the new, is secured; which is the substance of the truth wherein we are now concerned. On these grounds we may proceed with our inquiry. The judgment of most reformed divines is, that the church under the old testament had the same promise of Christ, the same interest in him by faith, remission of sins, reconciliation with God, justification and salvation by the same way and means, that believers have under the new. And whereas the essence and the substance of the covenant consists in these things, they are not to be said to be under another covenant, but only a different administration of it. But this was so different from that which is established in the gospel after the coming of Christ, that it hath the appearance and name of another covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 86</span></figcaption>

</figure><figure class="quote" id="q-1f897806ad" data-kw="">
<blockquote><p>7. The covenant is either a covenant of works or a covenant of faith. This distinction coincides with that between the legal and the evangelical covenant. The first included a stipulation of works: ‘Do this and you will live.’ The second included a stipulation of faith: ‘Believe and you will be saved.’ Indeed, in this covenant too works are required, but not primarily, as if man is justified through them; but they are required as a consequence, as a sign of gratitude, as a proof of an unfeigned faith which in this way also edifies the neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse</cite>, (1644), ch. 12, pp. 227-28</span></figcaption>

</figure><figure class="quote" id="q-286d36e6a5" data-kw="">
<blockquote><p>The thing promised, is the knowledge of God: “They shall all know me.” No duty is more frequently commanded than this is, nor any grace more frequently promised. ... for it is the foundation of all other duties of obedience, and of all communion with God in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:11; Works, vol. 22, p. 203</span></figcaption>

</figure><figure class="quote" id="q-ee48a721c6" data-kw="unity">
<blockquote><p>From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.5</span></figcaption>

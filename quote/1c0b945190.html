<main class="wrap"><figure class="quote" id="q-1c0b945190" data-kw="">
<blockquote><p>It appears certain that he is speaking of the manifestation, not of the imputation of righteousness, as if he had said, Those who are justified by true faith prove their justification by obedience and good works, not by a bare and imaginary semblance of faith. In one word, he is not discussing the mode of justification, but requiring that the justification of believers shall be operative. And as Paul contends that men are justified without the aid of works, so James will not allow any to be regarded as justified who are destitute of good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/justified-before-god-and-before-men.html">Justified before God and before men</a></span><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/romans-and-james-reconciled.html">Romans and James reconciled</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-70e502e80f" data-kw="">
<blockquote><p>Therefore, let them twist the words of James as they may, they will never extract out of them more than the two propositions: That an empty phantom of faith does not justify, and that the believer, not contented with such an imagination, manifests his justification by good works.</p></blockquote>

</figure><figure class="quote" id="q-4923d7cbe0" data-kw="">
<blockquote><p>Paul attributes justification to faith alone, but living and effective. But James removes justification from faith alone, but that dead and hypocritical.</p></blockquote>

</figure><figure class="quote" id="q-ec3c2e364e" data-kw="">
<blockquote><p>This is the same as though he had said, that we do not attain salvation by a frigid and bare knowledge of God, which all confess to be most true; for salvation comes to us by faith for this reason, because it joins us to God. And this comes not in any other way than by being united to the body of Christ, so that, living through his Spirit, we are also governed by him. There is no such thing as this in the dead image of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, James 2:14</span></figcaption>

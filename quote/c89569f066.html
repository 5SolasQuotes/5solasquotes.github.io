<main class="wrap"><figure class="quote" id="q-c89569f066" data-kw="councils can err">
<blockquote><p>The question does not simply concern the invisible church of the elect or the universality of believers, whether it can err in the foundation (which our doctrine concerning the perseverance of the saints sufficiently proves is slanderously charged upon us), but whether it is to be said to be so infallible as to be exposed to no error (which we deny). The question is not properly of the collective visible church of believers, but especially of the representative church in councils and of the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 54</span></figcaption>

</figure><figure class="quote" id="q-24bf54aa64" data-kw="">
<blockquote><p>We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Papists&#x27; Damnable Faith</cite>, p. 8, Third Conclusion</span></figcaption>

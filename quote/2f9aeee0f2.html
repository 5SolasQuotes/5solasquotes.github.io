<main class="wrap"><figure class="quote" id="q-2f9aeee0f2" data-kw="">
<blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7581bd9f56" data-kw="">
<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-platt.html">David Platt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Follow Me</cite>, p. 60</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ba5bedfcc9" data-kw="">
<blockquote><p>What is a Christian’s comfort, and where doth it chiefly lie, but in this, That the Lord hath made with him an everlasting Covenant, in all things stablished and sure? Which were the last breathings of the sweet Singer of Israel, and the last bubblings up of the joy of his heart, 2 Sam. 23.5. God the Father’s eternal purposes are sealed secrets, not immediately seen, and the full and blessed accomplishments of those purposes are not yet experimentally felt; the Covenant is the midst between both God’s purposes and performances, by which and in which we come to see the one, before the world began, and by a blessed Faith (which makes things absent, present) to enjoy the other, which shall be our glory, when this world shall be burnt up, and all things in it shall have an end.

For in God’s Covenant and promise we see with open face God’s secret purpose for time past. God’s purposes toward his people being as it were nothing else but promises concealed, and God’s promises in the Covenant being nothing else but his purposes revealed; as also in the same Covenant and promises we see performances for future, as if they were accomplishments at present. Where then is a Christian’s comfort, but in that Covenant wherein two Eternities (as it were) meet together, &amp; whereby he may see accomplishments (made sure to him) of eternal glory, arising from blessed purposes of eternal Grace? In a word, wherein he fastens upon God, and hath him from everlasting to everlasting, comprehended at hand near and obvious in his words of a gracious Covenant?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the reader in Peter Bulkeley, The gospel-covenant; or The covenant of grace opened</cite></span></figcaption>

</figure><figure class="quote" id="q-9abb3f2784" data-kw="">
<blockquote><p>Here’s an answer to all the objections of unbelief and diffidence, the chief whereof lies here; O, says unbelief, may I, sinful guilty I, lay hold on the promise of mercy and peace in the gospel, when I see the great ordnance of the divine threatening hard charged with the truth and righteousness of God, and ready to be discharged against me with thunder and lightning, saying, no mercy, no peace; He that made thee will not have mercy upon thee; and there is no peace, says my God, to the wicked?

Mercy and peace in the promise then, says unbelief, cannot take place with respect to me; for truth and righteousness in the threatening stand in the way, like a flaming sword, to keep the way of the tree of life. Nay, but, says faith, here the promise and the threatening have met together, and kissed each other in Christ; mercy in the promise, and justice in the threatening, have met and agreed in him, in whom all the promises are Yea and Amen, and in whom all the threatenings are fully executed, by drawing out his heart-blood. Thus then, we have boldness to enter into the holiest by the blood of Jesus, Heb. 10.19. By a new and living way, which he hath consecrated for us through the vail of his flesh: Therefore let us draw near with a true heart, in full assurance of saith.

O what ground for the boldness and assured confidence of faith, with particular application, notwithstanding the threatening! The threatening hath nothing to say to me, saith faith, for Christ hath spoken with it already, and spoken it out of breath; he hath left it speechless and breathless; not a breathing of wrath in it towards me. The believer may have a million of doubts, while his unbelief keeps the chair; but let gallant faith come in, and take the room, it will dispel them all. Let once unbelief break the harmony of this meeting of divine attributes in Christ, and then nothing but doubts of God’s favour and mercy must ensue; but let faith view the harmony, and see them meeting and kissing each other, and then, according to the measure of faith, such will be the measure of holy boldness, confidence and persuasion of the favour, mercy and good-will of God in Christ, with particular application to the person himself.

Take away unbelief from faith, and then not a single doubt will remain behind: Unbelief creates all the doubts that are in the believer, his faith hath no part in them. The general doubtful faith of the Papists is not faith, but unbelief; and therefore no wonder that our forefathers abjured it in our national covenant. Behold the sure ground and firm bottom that faith stands upon, even the mutual meeting and embracement among the divine perfections in Christ. If you break and separate the meeting by unbelief, then your confidence is broken, and your peace with God marred; but, if you keep them together in your view by faith in Christ, then you have boldness confidence and affiance on this ground: yea, then God in Christ and you meet together, and kiss each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper</cite>, (1723; Boston: S. Kneeland and T. Green, 1748), pp 48-49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Mastricht offers as a brief definition the statement that the divine will is God’s ‘propensity toward the good,’ (Theoretico-practica theol., II.xvii.4) and the somewhat longer definition that ‘will in God is nothing other than his most wise propensity toward himself as the highest goal and toward creatures as means, for the sake of himself,’ inasmuch as creatures attain the fulfilment of the good not in themselves but in God.’ (Theoretico-practica theol., II.xv.7; cf. Cocceius, Summa theol. III.x.23-24 and Van Asselt, Federal Theology, p. 166.)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cc95b40e74" data-kw="">
<blockquote><p>A second kind of abrogation of the Law, an outward one, is that the political laws of Moses do not apply to us at all. Therefore we should not restore them to the courthouse or chain ourselves to them in some superstitious way, as some men who were ignorant of this liberty did several years ago. Nevertheless, although the Gospel does not subject us to the civil laws of Moses, it does not completely set us free from obedience to all political laws; but in this bodily life it subjects us to the laws of the state in which we live, and it commands everyone to obey his magistrate and his laws, “not only to avoid God’s wrath but also for the sake of conscience” (1 Peter 2:13–14; Rom. 13:5). Nor would it be a sin if the emperor used some of the civil laws of Moses; in fact, it would be a good idea if he did. Therefore the sophists are in error when they imagine that after Christ the civil laws of Moses are fatal to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 448.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>But I pray you what do people get when wars for recoveries of dubious rights are long and calamitous? What are the people of France or the people of Spain better for the long and hereditary anger of their two kings? Or what was the world better for Alexander’s conquering it? The [English Parliament] Houses which are burnt and the millions of bodies left dead in the field are the peoples; and princes scorning to derive from them [the people] still trample them to dung.</p></blockquote>

<blockquote><p>…we cannot give an account of the whole process of generation, which consists of conception, formation or the delineation of the several parts, and animation by infusing the soul; but this we know, that it far surpasses all finite power. And without doubt Monsieur Descartes, who was so thinking a philosopher, would never have ascribed this great work to mere mechanism, but that he was unawares betrayed into it by his solving of other things by mechanic principles: So that it would be expected that he should make an uniform piece of philosophy. And thence he was, as it were, forced to go through with his work that he had begun, and to maintain that all is done mechanically, even in the production of man.</p></blockquote>

<blockquote><p>…and in obedience to the king all are to do their duty, and his care is universal over all, and his end [is] universal. That which is the end of pastors, doctors, elders, deacons, lawyers, judges, etc. is, in an universal intention, the king’s end, even God’s honor, by procuring in a regal way, that all do their duty in keeping the two Tables of the Law, and so is he the great politic-wheel moving by his royal motions all the under wheels toward that same end.</p></blockquote>

</figure><figure class="quote" id="q-59f824cb51" data-kw="">
<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maxwell.html">John Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacro-Sancta Regum Majestas, or the Sacred &amp; Royal Prerogative of Christian Kings</cite>, (1644; London: Dring, 1680) 304 pp. ToC, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

hoosing%2C+for+that+would+violate+free+will+%28that+is%2C+it+would+require+Calvinist+views+of+divine+sovereignty%29.+Nor+could+they+say+that+God+makes+a+man+king+subsequent+to+man%E2%80%99s+choosing%2C+for+that+would+deny+God%E2%80%99s+active+role+in+the+choosing.+Instead%2C+God+chooses+one+man+to+be+king%2C+and+that+man+is%2C+thereby%2C+king%2C+and+God+requires+the+people+to+obey+him+as+such.+God+is+active%2C+and+the+people+are+passive.+Indeed%2C+Rutherford%2C+in+Lex%2C+Rex%2C+blamed+John+Maxwell%E2%80%99s+divine+absolutism+on+his+Arminianism.+In+Reformed+political+doctrine%2C+on+the+contrary%2C+both+God+and+man+are+active+in+the+making+of+one+man+as+king%2C+and+even+in+determining+the+political+form+of+the+commonwealth.%E2%80%9D%0A%0A%E2%80%94+John+Maxwell%2C+Sacro-Sancta+Regum+Majestas%2C+or+the+Sacred+%26+Royal+Prerogative+of+Christian+Kings+%281644%3B+London%3A+Dring%2C+1680%29+304+pp.+ToC%2C+pp.+48-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F59f824cb51.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/59f824cb51.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/#:~:text=The%20immediate%20reason%20for%20the%20rewriting,the%20political%20form%20of%20the%20commonwealth&amp;text=The%20immediate%20reason%20for%20the%20rewriting%20of%20the&amp;text=in%20determining%20the%20political%20form%20of%20the%20commonwealth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

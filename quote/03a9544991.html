<main class="wrap"><figure class="quote" id="q-03a9544991" data-kw="">
<blockquote><p>…as Didoclavius [David Calderwood] observes (Altar of Damascus, ch. 10, p. 878), aliud est deputare, aliud dedicare, aliud sanctificare; Designation or deputation is when a man appoints a thing for such a use, still reserving power and right to put it to another use, if he please; so the Church appoints times and hours for preaching upon the week days, yet reserving power to employ those times otherwise when she shall think fit. Dedication is when a man so devotes a thing to some pious or civil use that he denudes himself of all right and title which thereafter he might claim unto it: as when a man dedicates a sum of money for the building of an exchange, a judgment-hall, etc. or a parcel of ground for a Church, a Church-yard, a glebe, a school, a hospital; he can claim no longer right to the dedicated thing. Sanctification is the setting apart of a thing for a holy or religious use in such sort that thereafter it may be put to no other use, Prov. 20:25. Now, whereas times set apart for ordinary and weekly preaching are only designed by the Church for this end and purpose, so that they are not holy, but only for the present they are applied to a holy use; neither is the worship appointed as convenient or beseeming for those times, but the times are appointed as convenient for the worship: festival days are holy both by dedication and consecration of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 6-7</span></figcaption>

ligious-holidays/#:~:text=as%20Didoclavius%20%5BDavid%20Calderwood%5D%20observes%20%28Altar,by%20dedication%20and%20consecration%20of%20them&amp;text=as%20Didoclavius%20%5BDavid%20Calderwood%5D%20observes%20%28Altar%20of%20Damascus&amp;text=holy%20both%20by%20dedication%20and%20consecration%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9714cc21b3" data-kw="">
<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>Yea there are among you now many things of a lower [superstitious] nature, which some dare scarce plainly say God commands or forbids, and yet they are censorious enough about them: …That it is not lawful to preach or hear a sermon upon a human holiday.</p></blockquote>

</figure><figure class="quote" id="q-7241c527d9" data-kw="">
<blockquote><p>Magistrates certainly have a power to appoint public days, yea, annual days of thanksgivings, for mercies never to be forgotten. Indeed they cannot make a day holy, so as it shall be a sin against God to labor in it, or to use any pleasures (as in the case of the sabbath); but they may command the public worship of God to be performed on particular days, and men ought to attend it when with convenience they can; only they ought to take care that such days be not spent in luxury and profaneness, and that they be for signal providences, and not so multiplied, and frequently renewing, as that the service of them degenerate into mere matter of form. Whether Christ went up in order to the feast [of dedication], or because of the great concourse of people he knew would be there at that time, cannot be determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on John 10</cite>, v. 22</span></figcaption>

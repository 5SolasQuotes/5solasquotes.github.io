<blockquote><p>There are various entities which, if they exist, would be candidates for necessary beings: God, propositions, relations, properties, states of affairs, possible worlds, and numbers, among others. Note that the first entity in this list is a concrete entity, while the rest are abstract entities. The main question we will address in this article is: Does God ground the existence of necessarily existing abstract objects?</p></blockquote>

<blockquote><p>… Whether God is imaginable? It is denied. … Whether we know God immediately, whether in this life or in the future? It is denied. Whether we may know him through intelligible species? It is affirmed. Whether through proper species or indeed through species of creatures? It is distinguished. From whence are those species? It is explained. Whether the created intellect is able clearly and intuitively to see the essence of God? It is denied. Whether the created intellect is able to comprehend the essence of God? It is denied. Whether the essence of God is seen by any created intellect according to any created species? It is denied. … Whether the created intellect needs an intelligible species to see God? It is affirmed. Whether the created intellect needs the light of glory to see God? It is distinguished. Whether God is able to supply the activity of the light of glory? A curious question Whether above natural cognition in the present life another cognition of God may hold through grace? It is affirmed. Whether all beatific visions are equally perfect essentially? It is affirmed. Whether all beatific visions are equally perfect accidentally? It is denied. Whether it may prove that one vision is more perfect than another? It is explained and the question is curious. …</p></blockquote>

Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e53347a13.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-incomprehensibility-of-god/#:~:text=Whether%20God%20is%20imaginable%3F%20It%20is,explained%20and%20the%20question%20is%20curious&amp;text=Whether%20God%20is%20imaginable%3F%20It%20is%20denied&amp;text=It%20is%20explained%20and%20the%20question%20is%20curious" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2625f706ef" data-kw="">
<blockquote><p>A fallacy of accident is also committed by those who claim that if God were immutable, then He could not be said to have life. For while the living things of our experience do indeed change in various ways (by growing, taking in nutrients, moving about, learning, and so forth), it doesn’t follow that any possible living thing must undergo change. What is essential to a thing’s being alive, at least on the traditional Aristotelian account of life, is that the thing operate in the basis of an internal principle, as opposed to being entirely dependent on external forces. Hence, an animal can be said to be alive insofar as at least much of what it does flows from its own nature, whereas a stone is not alive because it is entirely passive, and can do things (such as breaking a window) only insofar as other things act upon it… Now, as the uncaused cause of all things, God certainly acts in a way which does not require his being acted upon by anything else. Hence, He can certainly be said to have life. Indeed, unlike other living things (all of which to some extent, even if not entirely, require being acted upon by other things, insofar as they need to eat, breathe, and so forth), God acts in a way which is completely independent of anything else. Hence, He can be said to have life in the fullest way possible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’</cite></span></figcaption>

<blockquote><p>22. And so we must conceive of God by all these following inadequate conceptions, confessing the impropriety, but having no better: I. The essence of God, who in Scripture is called in two words “An Infinite Spirit,” is necessarily conceived of by these three conceptions: 1. [Greek], 2. Vita [life], 3. Perfectio [perfection]. The two first being the substantial conceptus of a spirit, and the third that which answers to all perfective degrees, properties, and accidents in creatures, and comprehends a multitude of perfective attributes; which I express in the abstract, being loath much to use concretes or adjectives of God. Of these, as the first answers to matter in materials and to the genus and substantia abstracte sumpta in spirits, so the second to the form and difference, when yet in God there is no composition or matter. 22. II. And the formal conceptus ‘Vita’ must itself be conceived of in this threefold inadequate conception: 1. Potentia-Actus [power-act], 2. Intellectus [understanding], 3. Voluntas [will]. I call the first Potentia-Actus to avoid concretes, and to signify that as God has no potentia passiva [passive power], so his potentia activa [active power] is not an idle, ceasing power, but in perpetual perfect act; and that act is a most powerful act: so that neither potentia alone, nor actus alone, but both together, are our best conception of this first principle in the Deity. And I take it for granted that even in man’s soul, the potentia vitalis activa [vital active power], the intellect, and the will, are not, as Thomas thought, accidents, but the formal essence of the soul, as the Scotists and Nominalists better say. And I have largely elsewhere proved this, and therefore stand not here upon it. … 25. IV. The essential immanent acts of God are three: 1. Sibi vivere [to live to Himself], or to be essential active life in Himself; 2. Se intelligere [to understand Himself], to know Himself; 3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), sect. 3, ‘The several inadequate conceptions which in order make up our knowledge of God’</cite>, pp. 4-5</span></figcaption>

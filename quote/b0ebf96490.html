<blockquote><p>I believe the catholic church etc. There is but one faith of all that ever have been, both prophets and Apostles, And this universal church is not contained in one place here, but in all places of the world Christ’s church is dispersed. Be you not deceived so to think Christ’s church only to be, which is governed under the wicked pope.

The Lord hath his people in every place. The true church is that which hath the word of God, the old and new testament, which hath here sacraments, baptism, and the Lord’s bread. If any thing be taught the against the right doctrine of the gospel by any man how holy so ever he be, be it to the accursed. If the papists do teach the true honour, worship, and dignity of Christ, follow and embrace that doctrine.

But else if they teach any other thing, that is their own dreams and traditions, a void it quickly, lest you be defiled with the leaven thereof. And be not quick in believing them that say. Our forefathers, the bishops with all the general counsels, gathered together in the Holy ghost, have appointed this (though it be directly against the word of God) therefore you must believe it under pain of eternal damnation. Let them vaunt with their baggage and phantasies, wherewith they have infected and deluded all the world so long. Let the youth learn the word of God exactly, so shall they easily judge of the faith and word of God, and shall not lightly swerve from God’s right doctrine. The sheep of Christ hear and perceive his voice and follow him whither so ever he goeth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon, of John Oecolampadius, to young men, and maidens</cite>, trans. John Foxe (London: Humfrey Powell, 1548), unpaginated.</span></figcaption>

<blockquote><p>§40.

II. It is greatly needful to the well-being of the ministry and the success that doctrine be kept sound: And therefore:

      1. That the Christian simplicity be retained, and many subtle and curious decisions be not made necessary: A few great, necessary certain truths are easilier preserved than multitudes of uncertain controverted niceties.

      2. It is needful that such as are ordained ministers, be tried men, of sound understanding in that which they must teach and do, and therefore that both the ordainers and the hearers try them. This account of their understanding is better than the imposing of human forms upon them for subscription: Not but that teachers should know more than the flock, that is, than the essentials; nor that I presume to condemn all the Churches that impose their confessions to be subscribed in their own and not in Scripture-words, while they keep only to necessary, certain things: But I shall afterward prove that this way, though tolerable, is not best, but unnecessary and dangerous: 1. The Scripture affording us apt words enough to form our confessions in, which are past controversy; 2. and there being no probability of bounding men’s impositions of this kind, when once they set upon this way; 3. and most confessions of that nature now extant, having some needless words which other Churches or good Christians do dissent from:

      4. And the ancient Creeds understood (which the ordainers must try) and the old catechistical verities being sufficient to this use.

      5. And there being means of restraining men from preaching and vending heresies which are more safe and congruous.

      3. I add therefore that a certain confession containing the certainest and needfulest integrals of religion should or may well be drawn up as a law, forbidding all upon meet penalties to preach or speak against them, without any subscribing, promising or professing.

      4. And upon proof of the violating of such a law, and preaching against such articles it is sufficient that both the Church and the Christian magistrate in their several ways may judge them and by just penalties correct them (of which more after in due place). For it is very hard so to form long confessions (beyond the old creeds, Lord’s Prayer, Decalogue, and the general belief of Scripture) and this not in Scripture-terms, which shall not have some words which sound and honest Ministers cannot assent to (without lying, which they will not do): But to silence many words which yet we conceive true, and forbear speaking against some things which yet he cannot profess assent to, there are very few sober men but will do. And an error never spoken or written hurts not others, nor is to be judged, being not known; Non apparere here is as non esse. And if it be vended, the person may be judged as well as if he had sworn, subscribed or promised. And they that will tell us yet what evil may befall secret whispering errors without such oaths, subscriptions or promises, do by this over-doing dangerously undo; and lest man should be man and the Church imperfect, on pretence of avoiding a possible unavoidable hurt, they will set up knaves that will say any thing, shut out honest men, and necessitate divisions, confusions and persecutions, where they can never stop on this side banishing or killing or continued imprisoning multitudes of faithful men, and never the more attain their ends. Sound doctrine may be kept up as far as is to be hoped by the aforesaid means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 222-23</span></figcaption>

+Baxter%2C+The+True+%26+only+Way+of+Concord+of+all+the+Christian+Churches%2C+the+Desirableness+of+it+%26+the+Detection+of+False+Dividing+Terms%2C+%28London%3A+Hancock%2C+1680%29%2C+pt.+2%2C+ch.+5%2C+%E2%80%98What+are+the+terms+necessary+to+the+office+and+exercise+of+the+sacred+ministry%3F%E2%80%99%2C+pp.+222-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff861c3603b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f861c3603b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=40.%20II.%20It%20is%20greatly%20needful,be%20hoped%20by%20the%20aforesaid%20means&amp;text=40.%20II.%20It%20is%20greatly%20needful%20to%20the&amp;text=is%20to%20be%20hoped%20by%20the%20aforesaid%20means" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

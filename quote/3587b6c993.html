<blockquote><p>And Kings shall be thy nursing fathers (Isaiah 49:23 Geneva Bible)

John Owen corrects the Erastian notion that the above text gives the civil magistrate power in sacris (in intrinsically sacred matters):

[…] It is true that this is promised, and God accomplish it more and more! but yet we do not desire such nurses as beget the children they nurse. The proposing, prescribing, commanding, binding religion on the consciences of men, is rather the begetting of it than its nursing. To take care of the church and religion, that it receive no detriment, by all the ways and means appointed by God and useful thereunto, is the duty of the magistrates: but it is so also, antecedently to their actings unto this purpose, to discern aright which is the church whereunto this promise is made; without which they cannot duly discharge their trust nor fulfil the promise itself. The very words, by the rules of the metaphor, do imply that the church and its religion, and the worship of God observed therein, are constituted, fixed, and regulated by God himself, antecedently unto the magistrate’s duty and power about it. They are to nurse that which is committed to them, and not what themselves have framed or begotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth and innocence vindicated; in a survey of a discourse concerning ecclesiastical polity, and the authority of the civil magistrate over the consciences of subjects in matters of religion</cite>, (London, 1669) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1967), xiii, 401-02.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Unlike many today, the Scottish Reformers saw no incongruency between church discipline and the state’s implementation of biblical penology:

Marriage once lawfully contracted, may not be dissolved at man’s pleasure, as our master Christ Jesus does witness, only [if] adultery be committed; which being sufficiently proven in presence of the Civil Magistrate, the innocent (if they so require) ought to be pronounced free, and the offender ought to suffer the death as God hath commanded. If the Civil sword foolishly spare the life of the offender, yet may not the Church be negligent in their office, which is to excommunicate the wicked, and to repute them as dead members, and to pronounce the innocent party to be at freedom, be they never so honourable before the world. If the life be spared (as it ought not to be) to the offenders, and if the fruits of repentance of long time appear the same, and if they earnestly desire to be reconciled with the Church, we judge that they may be received to participation of the Sacraments, and of the other benefits of the Church, (for we would not that the Church should hold those excommunicant whom God absolved, that is, the Penitent.)</p></blockquote>

<blockquote><p>MINISTERS should preserve a People from Corruption by good Government. God has given power of ruling to Ministers. Heb. 13.13. Obey them that rule you and submit to them. He has given a power of binding and losing. Mat. 16.19. What thou shalt bind on earth shall be bound in heaven. And he appoints that they rule well, 1 Tim 5.17. Ministers have a corrcive [corrective] power to execute censures on them that are obstinate.

Ministers must have a tender and compassionate spirit, but when Men are sturdy and rebellious, severity is compassion; executing Ecclesiastical censures is a terror to evil doers: this is a proper means that their spirits may be saved in the day of the Lord Jesus, 1 Cor. 5.5. Though private revenge is utterly forbidden, yet they are to revenge disobedience: 2 Cor. 10.6. Having in a readiness to revenge all disobedience. This is the way to purge out the old leaven, to bring Men to repentance, and to put a stop to growing iniquities, that the Land be not defiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of Gospel-ministers to preserve a people from corruption. Set forth, in a sermon preached at Brookfield, October 16. 1717. Being the day wherein the church was gathered, and Mr. Thomas Cheney, was ordained Pastor</cite>, (Boston: Samuel Phillips, 1718), p. 12.</span></figcaption>

<blockquote><p>In the midst of the debates within the Free Church of Scotland surrounding a potential union with the United Presbyterians (Voluntaries), Horatius Bonar argued against any compromise of the Free Kirk’s position on church-state relations:

EDINBURGH FREE CHURCH PRESBYTERY.

THE UNION QUESTION. …

Dr [Horatius] BONAR brought forward the following overture, of which he had given notice:-

Whereas the prosecution of the negotiations for union on their present footing threatens to issue in the compromise of the distinctive principles of this Church, and is already producing most serious internal dissensions, it is humbly overtured by the Free Presbytery of Edinburgh to the ensuing General Assembly that said negotiations be discontinued, the Assembly at the same time recommending the cultivation of brotherly intercourse and co-operation in every work of faith and labour of love in which the negotiating Churches can consistently with their principles unite.

Dr Bonar, in supporting the overture, maintained that, while union among Presbyterian Churches was eminently desirable, it was absolutely-essential that the Free Church should maintain her distinctive principles. He held that the United Presbyterian Church had not made the slightest concession of their principles, while the Free Church had done so, and this it was which had led to the present crisis. He proceeded at great length to expound the distinctive principles of the Free Church, dwelling mainly upon the relation of the Church and the State.

He contended that the question of the relation of the Civil Magistrate to the Church had not been an open question in the past history of the Church; and that, if they were to found a new Church leaving that an open question, they would stand alone in the face of the Churches in Christendom – they would be proclaiming, not merely that they had altered their creed, but that the Churches of the Reformation were wrong. … He protested against the proposal to leave any of the distinctive principles of the Church as open questions, maintaining that, if such a proposal were carried out, the questions would be open, but the mouths of the members of the Church would be shut, and their hands would be tied. …

Dr Bonar concluded, amidst loud applause, by expressing his desire for conciliation with the members of other Churches, though he could not agree to any proposal for union on a footing which would involve any compromise of the distinctive principles of the Free Church. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-scotsman.html">The Scotsman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scotsman</cite>, 27 February 1868.</span></figcaption>

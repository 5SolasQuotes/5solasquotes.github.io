<blockquote><p>8. Of the beginning and ending of the Sabbath — The first rule about time. 8. It may seem to some necessary that something should be premised concerning the measure or continuance of the day to be set apart to a holy rest to the Lord; but it being a matter of controversy, and to me, on the reasons to be mentioned afterwards, of no great importance, I shall not insist upon the examination of it, but only give my judgment in a word concerning it. Some contend that it is a natural day, consisting of twenty-four hours, beginning with the evening of the preceding day, and ending with the same of its own. And accordingly so was the church of Israel directed, Lev. 23:32, “From even unto even shall ye celebrate your Sabbath;” although that does not seem to be a general direction for the observation of the weekly Sabbath, but to regard only that particular extraordinary Sabbath which was then instituted, namely, the day of atonement, on the tenth day of the seventh month, verse 27. However, suppose it to belong also to the weekly Sabbath, it is evidently an addition to the command, particularly suited to the Mosaical pedagogy, that the day might comprise the sacrifice of the preceding evening in the services of it; from an obedience whereunto we are freed by the gospel. Neither can I subscribe to this opinion; and that because, — (1.) In the description and limitation of the first original seven days, it is said of each of the six that it was constituted of an evening and a morning, but of the day of rest there is no such description; it is only called “the seventh day,” without any assignation of the preceding evening unto it. (2.) A day of rest, according to rules of natural equity, ought to be proportioned to a day of work or labor, which God has granted to us for our own use. Now, this is to be reckoned from morning to evening: Psalm 104:20-23: “Thou makest darkness, and it is night: wherein all the beasts of the forest do creep” (from whose yelling the night has its name in the Hebrew tongue.) “The young lions roar after their prey, and seek their meat from God. The sun arises, they gather themselves together, and lay them down in their dens. Man goes forth unto his work and to his labor until the evening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews, with Preliminary Exercitations, 4 vols. (London: Tegg, 1840), vol. 1, Exercitation 40, Practical Observance of the Lord’s Day</cite>, pp. 736-37</span></figcaption>

<blockquote><p>Question. Wherein stands the eternity of the Covenant of Grace? And what other properties there be of the Covenant? Answer. The Law and Covenant of Works is a rule of everlasting righteousness, and so may be called an everlasting righteousness, containing precepts of the Law of nature intrinsically good, such as to know love, fear, trust in Him as the only true God: and in this sense it is an eternal Covenant. But 1. it is not eternal in the positives of the Second, and Fourth, and Fifth Commands, the way of worship, the means, as ceremonies, Sabbath, magistracy, and such like, which are not to continue in the life to come, and so neither faith nor hope in God through Christ, 1 Cor. 13:13; Rom. 8:24-25; 2 Cor. 5:7, nor a Temple, nor ordinances, nor the Kingdom of Christ as now dispensed are to be the binding rule for eternity to such as are confederates of the Covenant of Grace, Rev. 21:22,23; 1 Cor. 15:24.</p></blockquote>

<blockquote><p>As for the recreations, which are here said to serve lawfully to the refreshing of our spirits, this appellation [by an opponent] is very ambiguous; neither do I know any difference between the recreating of our spirits and the refreshing of our spirits: yet here the refreshing of our spirits is made the end of recreation. Again it were good to distinguish between recreation of the body, and recreation of the mind. I think the refreshing of spirits pertains to the recreation of the body; men’s spirits are natural and material things, and they are apt to be wasted first naturally… and spirits thus wasted are recreated, that is, repaired by eating and drinking. And thus provisions of victual are commonly called recreats. 2. Secondly they are wasted also by labour voluntarily undertaken, and these are repaired, as by the former way, so by rest also. And each way we are allowed to recreate our spirits on the Lord’s Day… But now adays many courses are called recreations, wherein there is found little rest; and the natural spirits of man are rather wasted, and his nature tired; far more than the one is repaired, or the other eased. And when all comes to all, I doubt the issue will be to style the pleasures of our senses by the cleanly name of recreations. Now the Jews were expressely forbidden to find their own pleasure on the Lord’s holy day, Isa. 58:13, yet were they not forbidden all pleasure, that belonged only to such a sabbath as was a fast; and therein indeed hypocrites are taxed for finding pleasure on that day, Isa. 58:3. But the weekly Sabbath was for pleasure and delight, but not for man’s own pleasure, nor for the doing of their own ways. But to delight in the Lord, which is spiritual pleasure, and the recreating of our souls in the Lord: this is a blessed rest, thus to rest unto Him; and the Word of God is the best food of the soul; No recreates like unto God’s holy ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment as still in Force to Bind Christians… (London, 1641) | The Doctrine of the Sabbath Considered, section 8</cite>, p. 242</span></figcaption>

<blockquote><p>Privately the Sabbath is sanctified by our preparation to God’s public service, which chiefly consists in meditation and prayer, and after the public service, by meditating on the Word heard, and applying it to our own use, and by holy conferences with others. Unto which duties respecting the public worship we are to add and use these other means of sanctifying the remainder of the Lord’s Day: Reading of the Scriptures or other religious and holy writings, meditation on God’s Word and works, especially of creation, preservation and redemption, invocation by prayer, thanksgiving and singing of psalms, and finally godly conferences upon some fit subiect, which best sorts to the present occasion and tends to the use of edification: Unto which means we must add the private works of sanctification, which are the works of mercy, and appertain chiefly either to the body, as the giving of alms, visiting the sick and prisoners, curing diseases, etc. or else to the soul, as, teaching the ignorant, reclaiming those who are seduced by error, admonishing those who fail of their duty by frailty and infirmity, rebuking the scandalous and wilfull offender, exhorting the backward and sluggish, comforting the distressed, counseling them for the good of their souls that need counsel, and reconciling those whom we know to be at variance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Privately the Sabbath is sanctified by our preparation to God’s public service, which chiefly consists in meditation and prayer, and after the public service, by meditating on the Word heard, and applying it to our own use, and by holy conferences with others. Unto which duties respecting the public worship we are to add and use these other means of sanctifying the remainder of the Lord’s Day: Reading of the Scriptures or other religious and holy writings, meditation on God’s Word and works, especially of creation, preservation and redemption, invocation by prayer, thanksgiving and singing of psalms, and finally godly conferences upon some fit subiect, which best sorts to the present occasion and tends to the use of edification: Unto which means we must add the private works of sanctification, which are the works of mercy, and appertain chiefly either to the body, as the giving of alms, visiting the sick and prisoners, curing diseases, etc. or else to the soul, as, teaching the ignorant, reclaiming those who are seduced by error, admonishing those who fail of their duty by frailty and infirmity, rebuking the scandalous and wilfull offender, exhorting the backward and sluggish, comforting the distressed, counseling them for the good of their souls that need counsel, and reconciling those whom we know to be at variance.”

<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>

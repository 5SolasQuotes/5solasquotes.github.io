<main class="wrap"><figure class="quote" id="q-7daab76c8c" data-kw="">
<blockquote><p>Yet it is the verdict of some (Sarav., N. Fratri &amp; Amico, Art. 17) that the blame lies not upon the ceremonies, but upon ministers themselves, who leave their places and draw all this evil upon themselves. This is even as Nabal blamed David for breaking away from his master, when he was chased away against his will (1 Sam. 23:10); and as Julian, when he had impoverished the Christians, laughed them to scorn, as if they had impoverished themselves to get that blessing which Christ had promised to the poor. (Socrates, bk. 3, ch. 12) The Canon Law speaks for the lord’s bishops, which are persecuted from citty to city. ‘Nec ipsi in hoc peccant, quoniam non sponte sed coacte hoc agunt: sed illi qui eos persecuuntur: nec ipsis Episcopis hoc imputari potest, sed illis qui eos hoc agere cogunt.’ (Decr., pt. 2, causa. 7, q. 1, ch. 36) How is it that they are not ashamed, who say that ministers leave their own places and callings, when they would faine abide in them, and with heavy hearts are thrust from them. Neither is this all the injury which is occasioned by the ceremonies: they make godly and zealous Christians to be mocked and nicknamed puritans, except they can swallow the camel of conformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 5, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

;text=except%20they%20can%20swallow%20the%20camel%20of%20conformity" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5add384d7" data-kw="">
<blockquote><p>If you ask, ‘Whom must we learn of?’ I answer: Of those that know, and have learned themselves. No name or title, or relation, or habit will enable any man to teach you that which he knows not himself.

1. Children must learn of their parents and tutors.

2. People must learn of their able, faithful pastors and catechizers.

3. All Christians must be teachers by charitable helps to one another…

4. Take nothing as necessary to the being of Christianity and to salvation which is not recorded in the Scripture and has not been held as necessary by all true Christians in every age and place…

5. Maintain the unity of the Spirit in the bond of peace with all true Christians as such, and live in love in the communion of saints…

6. Prefer not any odd or singular sect before the universal consent of the faithful in your learning or communion, so far as the judgment of men is to be regarded…

7. Never set a doubtful opinion against a certain truth or duty: reduce not things certain to things uncertain; but contrarily uncertain things to certain: for instance, It is certain that you ought to live in love and peace with all that are true Christians, and to do good to all and wrong to none: Let not any doubtful difference make you violate this rule, and hate, and slander and backbite, and hurt them for a doubtful, indifferent or unnecessary thing…

8. Faithfully serve Christ as far as you have attained, and be true to all the truth that you know; sin not by omission or practice against the knowledge which you have, lest God in justice give up your understanding to believe a lie.

9. Remember that all men on earth are ignorant, and know but as in a glass, and in part, and therefore the best have many errors: No man knows the smallest grass or worm with an adequate, perfect knowledge. And if God bear with multitudes of errors in us all, we must bear with such as are tolerable in each other… Divinity is not less mysterious than Law and Physic, etc. where controversies abound.

10. Yet stilt not yourselves in knowledge, nor say we have learned enough, but continue as Christ’s scholars in learning more and more to the death: the wisest know little, and may still increase. There is a great difference in excellency, usefulness and comfort between men of clear digested knowledge, and confused undigested apprehensions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 283-87 in Sermon 11, ‘The Cure of Melancholy &amp; Overmuch Sorrow by Faith &amp; Physic’ in A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved by Sundry Ministers in October, 1682 ed. Samuel Annesley (London: Dunton, 1683), pp. 285-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-0db6e1c5f3" data-kw="">
<blockquote><p>The knowledge of points fundamental is necessary:

1. To obtain salvation.

2. To keep communion with a true Church; for we are to separate from a Church subverting the foundation and laying another foundation… [John] Davenant says better, That such are fundamental, the knowledge whereof is simply necessary to salvation, if ignorance whereof does condemn. Doctor [Christopher] Potter calls them prime and capital doctrines of our religion, or of that faith which essentially constitutes a true Church and a true Christian; which is good…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: Griffin, 1644), pt. 2, ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?, p. 223</span></figcaption>

<blockquote><p>[Margin note:] Schism and actual gathering of churches out of churches cannot be tolerated. 3. Such opinions and practice as make an evident schism in a Church and set up two distinct Churches of different forms of government, and pretending to different institutions of Christ, of which the one must by the nature of their principles labor the destruction of the other, cannot be tolerated, etc. for each pretending their fellow Churches to be of man, and so of the devil, though they should both make one true invisible Church, agreeing in all fundamentals and many other truths, yet sure the whole should be a kingdom divided against itself, and this destroys peace and unity. And if Paul could not endure the divisions of one and the same Church of Corinth, though they pretended not to be different Churches, for those that said they were of Paul professed they could not be disciples of Peter, but he sharply rebuked them as carnal men and such as divided Christ, and by consequence must say Paul was crucified for them and was their redeemer, and so, if obstinately they had proceeded in that separation, Paul would have gone on to higher censures of the Church: far more could he not endure gathering of true Churches out of true Churches, which is the professed practice of Independents: And yet both sides pretending the spirit of discerning could say, ‘The Spirit testifies to my soul that Paul is the only called preacher,’ and the other, ‘Nay but to my discerning, Cephas or Peter is the only man that I can hear or follow.’ And a third, ‘Nay, not any on earth, nor any ministry will I acknowledge but Jesus Christ, whom the heavens must contain till the last day is my only, only preacher.’ Now if a Jezabel come in and say no ministry is to be heard but Christ and turn away all from hearing the Word, and not suffer Sergius Paulus or any other to hear Paul or any godly minister, sure Jezabel should be a perverter of the right ways of the Lord and so not suffered.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Margin note:] Schism and actual gathering of churches out of churches cannot be tolerated. 3. Such opinions and practice as make an evident schism in a Church and set up two distinct Churches of different forms of government, and pretending to different institutions of Christ, of which the one must by the nature of their principles labor the destruction of the other, cannot be tolerated, etc. for each pretending their fellow Churches to be of man, and so of the devil, though they should both make one true invisible Church, agreeing in all fundamentals and many other truths, yet sure the whole should be a kingdom divided against itself, and this destroys peace and unity. And if Paul could not endure the divisions of one and the same Church of Corinth, though they pretended not to be different Churches, for those that said they were of Paul professed they could not be disciples of Peter, but he sharply rebuked them as carnal men and such as divided Christ, and by consequence must say Paul was crucified for them and was their redeemer, and so, if obstinately they had proceeded in that separation, Paul would have gone on to higher censures of the Church: far more could he not endure gathering of true Churches out of true Churches, which is the professed practice of Independents: And yet both sides pretending the spirit of discerning could say, ‘The Spirit testifies to my soul that Paul is the only called preacher,’ and the other, ‘Nay but to my discerning, Cephas or Peter is the only man that I can hear or follow.’ And a third, ‘Nay, not any on earth, nor any ministry will I acknowledge but Jesus Christ, whom the heavens must contain till the last day is my only, only preacher.’ Now if a Jezabel come in and say no ministry is to be heard but Christ and turn away all from hearing the Word, and not suffer Sergius Paulus or any other to hear Paul or any godly minister, sure Jezabel should be a perverter of the right ways of the Lord and so not suffered.”

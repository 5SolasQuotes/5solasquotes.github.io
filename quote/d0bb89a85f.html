<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>Their former discord anent the state of their appearance, and their declaration, did a vast deal of hurt to the common cause, and to both sides. When the reports of it came abroad, multitudes who were coming to the army were discouraged, and great numbers, when they came to the camp, and saw how matters went, very soon left them. And I find both sides, in their papers, complaining of this; Mr. Hamilton’s party especially, towards the close of this rising, and when the moderate party overbalanced them, complained that many came to the camp, and finding that the cause was not clearly stated, and the indulgence not plainly opposed, they left the army: the other side complain, I imagine, with as much reason, that many quit the camp, and more who wished them well, came not up, by reason of the heights and extremities run into by many. As the time of the engagement approached, these differences run higher. The publishing the above-named declaration, June 13th, did very much ruffle those who opposed it; and they were not only broken in their affections, but the common soldiers were under no kind of discipline: their confusions increased, and numbers lessened much, before the king’s army came up; and, as has been hinted, they wanted skilled officers; their arms were out of case; they had very little ammunition, their rising being without any prior concert; and were in very melancholy circumstances… The officers met upon Saturday, June 21st, where the moderate party were supernumerary, by the accession of a good many gentlemen of some note, who joined them, and could not well be excluded [from] the meeting, which they named the council of war. At this meeting their debates run higher than ever, even when the enemy was within their view… …and Mr. Hamilton [a lay-leader in the army], who, as one of his own side acknowledges upon this occasion, “was often too forward, pretending to exercise a power which he had not, and that, his carriage at this time gave just occasion of offence to both sides,” opposed much the consulting with the ministers there, because, he said, none of the faithful ministers were present, but only such who owned the indulgence [which is false]; adding, that since the sword was drawn, he thought it duty to appear against all sin. It was reported he laid his hand upon his sword when he spoke what follows; but Mr. Hackston of Rathillet, in his relation of the divisions at Bothwell, denies this, but owns he added, “I have drawn my sword, and am equally ready against the indulged men and curates.” So high did the flame rise at a time when harmony was absolutely necessary. The moderate side continued to urge to have leaders chosen who were most capable of that trust, whether for or against the indulgence, whereupon Mr. Hamilton, and a good many with him, left the meeting, telling them as they went away, “That hitherto they had carried on this work, and now since they were setting up upon the foot of the indulgence, they had no freedom to venture their lives in that cause.”… Now the fatal nature of their divisions began to appear. When the commissioners came back, the officers fell a debating, and would come to no resolution. Mr. Hamilton, who assumed the general command, was against all accommodation, and others did not relish the proposal of laying down their arms; in short, they were quite disjointed and broken, and nothing was agreed upon, nor any answer returned to the general. So the lord Livingstone, upon the head of the foot-guards, came up with the cannon to force the bridge… Never was a good cause and gallant army, generally speaking, hearty and bold, worse managed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, pp. 102-6</span></figcaption>

</figure><figure class="quote" id="q-de3a7d083a" data-kw="">
<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and complaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, a. ‘Appeals in Cases Not Judicial’, pp. 470-72</span></figcaption>

<div class="actions"><button class="copy" data-copy="“That is, the General Assembly decided that appeals cannot lie except in judicial cases… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and complaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus — Charles Hodge, Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, a. ‘Appeals in Cases Not Judicial’, pp. 470-72">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+is%2C+the+General+Assembly+decided+that+appeals+cannot+lie+except+in+judicial+cases%E2%80%A6+We+have+had+a+superior+judicatory+in+our+Church+for+more+than+a+hundred+and+twenty+years.+During+about+seventy+years+of+this+period%2C+our+discipline+was+conducted+according+to+the+Westminster+Directory.+In+1789+our+present+constitution+went+into+operation%3B+which+was+submitted+to+an+extensive+revision+and+alteration%2C+as+to+matters+of+detail%2C+in+1821.+Under+these+several+systems%2C+appeals+and+complaints+were+allowed%2C+without+hindrance+or+contradiction%2C+from+any+kind+of+decision+in+an+inferior+judicatory+by+a+person+who+felt+himself+aggrieved%2C+until+1834.+Then%2C+for+the+first+time+in+our+history%2C+as+far+as+we+know%2C+the+idea+was+started+that+appeals+and+complaints+could+be+made+only+in+cases+strictly+judicial.+%E2%80%A6That+this+novel+doctrine+was+not+at+that+time+the+doctrine+of+the+synod%2C+which+the+Rev.+gentleman+defended%2C+is+plain%E2%80%A6+Though+the+synod+was+thus+free+from+this+new+doctrine+in+May+1834%2C+it+grew+in+such+sudden+favour%2C+that+when+that+body+met+the+following+autumn%2C+they+decided+not+merely+that+appeals+and+complaints+could+not+lie+except+in+judicial+cases%2C+but+even+that+protests+were+in+the+same+predicament.+This+is+an+instructive+illustration+of+the+fact+that+the+wisest+and+best+men+sometimes+allow+themselves+to+be+run+away+with+by+a+plausible+idea%2C+though+contrary+to+all+their+own+previous+professions+and+practice.+This%2C+however%2C+was+a+mere+temporary+delusion.+The+members+of+that+synod+who+had+signed+or+allowed+protests+in+all+kinds+of+cases+before%2C+still+continued+to+sign+or+allow+them%2C+with+equal+freedom%2C+their+own+decision+to+the+contrary+notwithstanding%E2%80%A6+We+found+its+very+authors+and+advocates+disregarding+it+the+very+next+year%3B+acting+as+though+no+such+doctrine+had+ever+been+broached.+If+they+practically+abandoned+it+as+untenable%E2%80%A6+The+Synod+of+Philadelphia+extended+the+%5Bnew%5D+doctrine+to+appeals%2C+complaints+and+protests.+Thus+putting+minorities+completely+under+the+feet+of+majorities%2C+not+allowing+them+even+the+right+of+recording+their+dissent+with+the+reasons+for+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+16%2C+%E2%80%98Discipline%E2%80%99%2C+section+3%2C+%E2%80%98Appeals+%26+Complaints%E2%80%99%2C+a.+%E2%80%98Appeals+in+Cases+Not+Judicial%E2%80%99%2C+pp.+470-72&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fde3a7d083a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/de3a7d083a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=That%20is%2C%20the%20General%20Assembly%20decided,dissent%20with%20the%20reasons%20for%20it&amp;text=That%20is%2C%20the%20General%20Assembly%20decided%20that%20appeals&amp;text=recording%20their%20dissent%20with%20the%20reasons%20for%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Their inference then from that text, 1 Sam. 2:17, 24 (if they speak to the purpose) must be this, viz. We ought to separate from a true Church, and set up a distinct Church within it, if but two scandalous ministers be not brought under due censure, though somewhat be done against them, and their wickedness be truly represented; as old Eli the high priest had reproved his sons pertinently and gravely, though I confess he ought to have done more. I shall yet be more liberal: What though not only two, but a great number of scandalous ministers in a true Church do escape condign censure? This affords no ground for relinquishing of them, and setting up a distinct Church: In such a case the scandals are not espoused, nor do even errors and heresies become the sentiments of a Church that professes the truths opposite to them, though erroneous or scandalous persons may have so much countenance as to prove too strong for the sounder part, as the sons of Zeruiah were too strong for David.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5d75c22e42" data-kw="natural law conscience">
<blockquote><p>Many arguments prove the existence of such a natural law. First, the voice of Scripture asserts that “the Gentiles which have not the law” (to wit, the written law of Moses) as the Jews “do by nature the things contained in the law, and are a law unto themselves: since they show the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the meanwhile accusing or else excusing one another” (Rom. 2:14, 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1.12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/law-in-general.html">Law in General</a> › <a href="../topics/the-law-of-god/law-in-general/natural-law.html">Natural law</a></span><span class="t"><a href="../topics/the-law-of-god/law-in-general.html">Law in General</a> › <a href="../topics/the-law-of-god/law-in-general/the-law-and-conscience.html">The law and conscience</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bcc86ec04" data-kw="condemnation wrath conscience">
<blockquote><p>(c) For condemnation, when it denounces upon the convicted sinner the divine malediction by the dreadful sentence which it thunders in his ears: “Cursed is he who continues not.” Hence the apostle calls it “the ministration of condemnation” (2 Cor. 3:9), and he says that “it worketh wrath” (Rom. 4:15) and then it is like a whip, tormenting and scourging the conscience guilty of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.9</span></figcaption>

</figure><figure class="quote" id="q-01aff859f5" data-kw="law uses schoolmaster">
<blockquote><p>As the doctrine concerning the law of God properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life—as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin (Rom. 3:20). (3) For preparation for grace—in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1.1</span></figcaption>

</figure><figure class="quote" id="q-72b7111168" data-kw="">
<blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>

e.com/on-the-beatific-vision/#:~:text=In%20fact%20we%20assert%20from%20Scripture,in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9&amp;text=In%20fact%20we%20assert%20from%20Scripture%20that%20the&amp;text=be%20seen%20in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0cd5d6e63" data-kw="">
<blockquote><p>For affections or passions in man, they are of two sorts: 1. Sensual belonging to the sensitive appetite and directed by the fantasy: these are common to brute beasts with us, and arise from one like temper and constitution in both. The object of these is all natural good or evil. 2. Rational, appertaining to the reasonable appetite or will, and guided by the understanding. These are proper to man, and they have their original from the substance of the reasonable soul, in which they always remain, not only when it is in the body, but even when tis severed from it. For fear, hope, love, hatred, joy, grief, etc. are in the damned and blessed spirits as well as living men. The object of these properly human passions is all moral and spiritual good or evil. I need not among so many learned, artists stand curiously upon the distinction of these two sorts of passions in man: the identity of names in both sorts has caused some confusion, but in reason the diversity of their nature is evident. Wherefore I go on to see what is meant by excitation or stirring up of the affections: whereby we can understand nothing else but their right and orderly motions about their proper objects. As in the particulars, sensual passions are then duly excited when they are moved about any natural good or evil, according to the instinct of nature in brute beasts and according to the same instinct of nature in man, but guided and moderated by right reason. Reasonable affections are then duly stirred up when their motions about all spiritual and moral good or evil are conformable to the quality of the object affected and to the rules of a rightly informed understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 125-26</span></figcaption>

</figure><figure class="quote" id="q-e7a46e733c" data-kw="">
<blockquote><p>Controversy XVI: Is it lawful to do good for the sake of the eternal reward? [Romanist] Position of Bellarmine: It is lawful and useful to do good for the sake of the eternal reward as a meritorious work. The saints were moved to true piety in this way, like Moses (Hebrews 11), David (Psalm 119), and Paul (Philippians 3). And the apostles use this argument to exhort to piety (1 Corinthians 9; Galatians 6; Colossians 3). Orthodox Position: In doing good, we should primarily seek God and His glory as the ultimate end (Colossians 3) and secondarily our salvation. Subordinate ends are not incompatible. And our salvation is closely linked to God’s glory. Moreover, this is done to stir our zeal. And this is what is proved by the cited passages. Care must always be taken to love God for Himself, not for our own benefit, with the love of friendship, not of concupiscence, so that it is not a mercenary friendship. Therefore, Bernard says: ‘God is not loved without reward, though He should be loved without the intention of reward.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

</figure><figure class="quote" id="q-e3c4b7bc33" data-kw="">
<blockquote><p>Life Eternal is the life of glory, wherein the soul, joined to our body, enjoys God forever, being advanced to the highest top and height of her felicity. The Cause of this life is God, to wit, the Father the efficient, the Son the meritorious, and the Holy Ghost the sealing and applying cause. The Matter, which has the respect of the subject, are those good things, which neither eye has seen, nor ear heard, nor can the mind of man comprehend. That which is of the Object, are all the blessed and elect. The Form is the most perfect knowledge, vision, and fruition of God Himself, and the exceeding felicity &amp; blessedness of man, which accompanies the same, which also consists both in the separation, and absence of all evil things, and in the participation, and presence of all good things; both are both perfect and eternal. The End is the glory of God’s grace, and the glorifying of the elect.</p></blockquote>

nk">Read it online · Reformed Books Online</a></div>

<blockquote><p>§VIII. The blessedness of heaven consists in the glorification of soul and body. This glorification consists in a perfect vision and love of God and a rejoicing in God who communicates Himself in the most perfect mode of communication to His creatures.</p></blockquote>

<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67b703ed0b" data-kw="">
<blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Delight</cite>, (London: T.R., 1657), “Christ’s Loveliness”, pp. 353-54</span></figcaption>

<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of the Reverend &amp; Learned John Lightfoot</cite>, … (London: Scot, 1684), ‘A Sermon preached at Hertford Assize, March 17, 1664’, on Jn. 8:9, pp. 1083-84</span></figcaption>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee.

4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost.

5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>

<blockquote><p>For if we give not entrance to Christ, all this will be a further aggravation of our damnation. How will this justify the sentence upon us hereafter, when Christ shall set us on the left hand (Mt. 25) and say: ‘Depart from Me [Mt. 7], for I invited you to come to Me, I knocked at the door of your hearts, and you would give Me no entrance. ‘Depart from us,’ said you; Therefore now depart you from Me.’ What do profane persons in the Church, but bid Christ depart from them, especially in the motions of his Spirit; they entertain Him in the outward room, the brain; they know a little of Christ, but in the heart, the secret room, He must not come there to rule. Is it not equal that He should bid us (Mt. 23:41), ‘Depart ye cursed I know you not? You would not give entrance to Me, I will not now to you.’ As to the foolish virgins He speaks and, Prov. 1:28, wisdom knocks and has no entrance, therefore in times of danger, they call upon her, but she rejoices at their destruction; Where God magnifies his mercy in this kind in sweet allurements and inviting by judgments, mercies, ministry and Spirit, He will magnify his judgment after. Those that have neglected Heaven with the prerogatives, and advantages in this kind, they shall be cast into Hell. ‘Woe to thee Chorazin,’ etc. as you know in the Gospel (Mt. 11:21). This is one thing that may humble us of this place and nation, that Christ has no further entrance, nor better entertainment after so long knocking? For the entertaining of his Word is the welcoming of Himself, as it is, Col. 3:16, ‘Let the word of God dwell plentifully in you,’ and ‘Let Christ dwell in your hearts by faith.’ Eph. 3:17. Compare those places, Let the Word dwell plenteously in you by wisdom, and let Christ dwell in your hearts by faith. For then does Christ dwell in the heart when the truth dwells in us. Therefore what entertainment we give to his truth, we give to Himself. Now what means of knocking has He not used among us a long time? For works of all sorts, He has drawn us by the cords of a man, by all kind of favors. For mercies, How many deliverances have we had (No nation the like; we are a miracle of the Christian world) from foreign invasion and domestical conspiracies at home? How many mercies do we enjoy? Abundance together with long peace, and plenty. Besides, if this would not do, God has added corrections with all these, in every element, in every manner, infection in the air, judgments in inundations; we have had rumors of wars, etc. threatenings, shakings of the rod only, but such as might have awaked us; And then He has knocked at our hearts by the example of other nations. By what He has done to them, He has showed us what He might justly have done to us; we are no better then they.</p></blockquote>

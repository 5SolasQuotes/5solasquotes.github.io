<main class="wrap"><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ambrose-of-milan.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition 9</cite>, trans. Erik Routley in The Church and Music (London: Duckworth, 1950), 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf8c0a17d5" data-kw="">

</figure><figure class="quote" id="q-ba0d0318fc" data-kw="">
<blockquote><p>…every pious person is bound in duty to his conscience to have privately his daily devotional exercises, still on this [Lord’s] day above others a holy convocation ought to take place (as was the custom on the Sabbath, Lev. 23:3) in which there may be leisure for devout attention to the reading and hearing of the Word (Heb. 10:25), the celebration of the sacraments (Acts 20:7), the psalms and prayer (Col. 3:16; Acts 1:14), to alms and helo to the poor (1 Cor. 16:2) and in general to all that sacred service pertaining to external and stated worship.</p></blockquote>

</figure><figure class="quote" id="q-b5fd610e77" data-kw="">
<blockquote><p>And when the Scripture assures us that it was their practice to use Psalms and Hymns, and spiritual songs, praising God and praying unto Him in the words of David… And when we all account it our duty to praise God in singing David’s Psalms, some of which, as we use them [in the psalters they had], are of a mean composure and carry expressions beneath the majesty of Scripture; others, such as concerned the Jewish Church only; why ought not the apostles, and we as necessarily, to use this form of prayer sanctified by our Savior’s own lips?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer in the public Worship of God and a view of what hath been said by Mr</cite>, [John] Owen concerning that subject (London, 1658), p. 42-3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1135cadf87" data-kw="">
<blockquote><p>Not but that a Christian ought prudentially to clear himself from slanders. When the apostle Paul was charged to be mad he vindicated himself. ‘I am not mad, most noble Festus’ (Acts 26:25). Though a Christian’s retorts must not be vulnerating [wounding], they may be vindicating. Though he may not scandalise another, yet he may apologise for himself.

There must be Christian prudence, as well as Christian meekness. It is not mildness but weakness to part with our integrity (Job 27:6). To be silent when we are slanderously traduced, is to make ourselves appear guilty. We must so affect meekness as not to lose the honour of innocence. It is lawful to be our own defenders. The fault lies only in this when we retort injuries with reproachful terms, which is to pay a man back in the devil’s coin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes: An Exposition of Matthew 5:1-12</cite>, (1660; Edinburgh: Banner of Truth, 1971), p. 110.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Whiggism is not circumscribed and confined to any one or two of the Religions now professed in the World, but diffuses it self among all. We have known Jews, Turks, nay, some Papists, (which I own to be a great Rarity) very great Lovers of the Constitution and Liberty; and were there rational Grounds to expect, that any Numbers of them could be so, I should be against using Severities and Distinctions upon Account of Religion.

For a Papist is not dangerous, nor ought to be ill used by any body, because he prays to Saints, believes Purgatory, or the real Presence in the Eucharist, and pays Divine Worship to an Image or Picture (which are the common Topics of our Writers of Controversy against the Papists;) but because Popery sets up a foreign Jurisdiction paramount to our Laws.

So that a real Papist can neither be a true Governor of a Protestant Country, nor a true Subject, and besides, is the most Priest-Ridden Creature in the World: and (when uppermost) can bear with no body that differs from him in Opinion; little considering, that whosoever is against Liberty of Mind, is, in effect, against Liberty of Body too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-molesworth.html">Robert Molesworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translator s Preface’ in François Hotman, Franco-Gallia: Or An Account of the Ancient Free State of France, and most other parts of Europe, before the loss of their Liberties</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-927239c2c7" data-kw="">
<blockquote><p>The third is the danger and mischief of force and violence; The taking away of the wicked from before the King, is a means to establish his Throne in Righteousness, because of the violence, and the force that a King is in danger of; when the wicked are about the Throne, his person is in danger to be mastered by their force, and power, and strength. 2 Sam. 3.38. See it in David. Malignants may be too hard for a King by force, and violence, as well as by flattery and Counsel. The King said to his servants, Know ye not that a Prince, and a great man is fallen in Israel? I this day am weak though anointed King, and these men the sons of Zerviah are too hard for me.

This was the case, Joab had killed Abner treacherously, David was King, Joab was the General of his Army and his kins-man, David was Uncle to Joab and his brother, they were his nephews; Joab had slain Abner basely, it was a murder, and a treacherous murder, and David was King and should have done justice, and he had protested it, yet these were too hard for him, not in point of seducing by flattery, or of evil Counsel, but by force and violence.

David could not make his party good against Joab, because he was Governor of the Army, and he was afraid that Joab might make more force then he, and so he mastered the King, and kept him from doing of justice, though he were a just King, and had vowed to do justice, and blood called upon him: Yet these sons of Zerviah (for there were three of them, but one was slain) these grand Cavaliers, when they had gotten the sword in their hand, though their pretence were to help David, yet afterward they over-mastered him, and would kill and slay, and David could not check them for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bond.html">John Bond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The state’s stability a sermon preached in Exon. Before the deputy-lieutenants, captains, and other military officers and soldiers of the county of Devon</cite>, (London, 1643), pp 21-22.</span></figcaption>

</figure><figure class="quote" id="q-f90d1e491e" data-kw="">
<blockquote><p>What meaneth that joy that the faithful find in their hearts, accompanying the benefits that cometh from Him, but that the Lord giveth His benefits cheerfully? for if the LORD gave thee them not cheerfully, but in anger and wrath, and threw them to thee as to a reprobate, thou wouldest never have joy in the receiving of them. There is not such a thing, as a reprobate can have joy in the giver, or ever have his mouth open with true thanksgiving to the Lord to say once, I thank thee: Why? Because the Lord giveth him not His benefits in love, but in anger.</p></blockquote>

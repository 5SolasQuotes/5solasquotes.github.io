<main class="wrap"><figure class="quote" id="q-2b807bfe23" data-kw="">
<blockquote><p>It is rebellion to break the law of the land, when it is not contrary to the word of God; but when the law commands to do what God has forbidden, to refuse obedience is not to infringe the rights of sovereigns, but to maintain the rights of God, to maintain his sole supremacy over the conscience, which can only be maintained, by obeying God rather than man, in all cases where their commands come into collision. This principle of obeying God rather than man, has been the guardian of freedom and religion in the days that are past; and woe to the land, to the church, to the human race, when it shall generally be accounted right to obey man rather than God. Allowing therefore, it could be shown, that the conduct of the Covenanters was in some respects contrary to the law of the land, this will not prove them to be guilty of rebellion, until all those laws to which their conduct was opposed, are proved to be agreeable to the word of God.

Had the Covenanters possessed no rights but such as belong to every individual, these statements would have vindicated them from the charge of rebellion. But it ought not to be forgotten that the Covenanters at this time were THE SCOTTISH Nation; they were the body politic in which all power is radically inherent, from which all authority emanates, – which is superior to kings and parliaments, and which in the proper sense of the word, never can be guilty of rebellion. And if all national power and authority be inherent in the nation, if rulers are merely the organs of the community, then, when they set aside the laws and constitutions of the kingdom, when they cease to answer the ends for which they have been raised to the thrones of justice, when they oppose and oppress not merely a minority of their subjects, but oppose and oppress the majority of the nation from whom all their authority is derived, in such circumstances a nation has the right, and it is its duty, to resume into its own hands that authority which is used against the public interests.

On these principles, the covenanting nation of Scotland would have been warranted in suspending their monarch, until he learned to respect the liberties of his subjects, and the laws of the kingdom, and therefore, they were more than justified in the comparatively mild course which they adopted. To maintain that a nation so unanimous as Scotland then was, is chargeable with rebellion for resisting a king who was undermining the constitutional freedom of the country, would be to lay down a doctrine sufficient to enslave the whole world, and which must be opposed by every one who respects her Majesty’s title to the British throne; her predecessors having been called to that exalted station, only in consequence of our fathers having deposed James the Seventh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s Crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), pp 14-15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2ed7eb824" data-kw="">
<blockquote><p>We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: … 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate [see others who are better on the issue of giving titles]). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Thomas Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me…</p></blockquote>

<blockquote><p>A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.”

— Samuel Rutherford, Lex Rex, ... (1644; Edinburgh: Ogle, 1843), p. 47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+people+may+be%2C+by+God%E2%80%99s+special+commandment%2C+subject+to+a+conquering+Nebuchadnezzar+and+a+Caesar%2C+as+to+their+king%2C+as+was+Judah+commanded+by+the+prophet+Jeremiah+to+submit+unto+the+yoke+of+the+king+of+Babylon%2C+and+to+pray+for+him%2C+and+the+people+of+the+Jews+were+to+give+to+Caesar+the+things+of+Caesar%3B+and+yet+both+those+were+unjust+conquerors%3A+for+those+tyrants+had+no+command+of+God+to+oppress+and+reign+over+the+Lord%E2%80%99s+people%2C+yet+were+they+to+obey+those+kings%3B+so+the+passive+subjection+was+just+and+commanded+of+God%2C+and+the+active+%5Bsubjection%5D%2C+unjust+and+tyrannous%2C+and+forbidden+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F643bfc56c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/643bfc56c0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-passive-obedience/#:~:text=A%20people%20may%20be%2C%20by%20God%E2%80%99s,and%20tyrannous%2C%20and%20forbidden%20of%20God&amp;text=A%20people%20may%20be%2C%20by%20God%E2%80%99s%20special%20commandment&amp;text=subjection%5D%2C%20unjust%20and%20tyrannous%2C%20and%20forbidden%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>

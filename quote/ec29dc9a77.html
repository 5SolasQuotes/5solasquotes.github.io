<main class="wrap"><figure class="quote" id="q-ec29dc9a77" data-kw="">
<blockquote><p>Under the humiliation of Christ are especially comprehended his sufferings, i. e. all those things which Christ endured for our sins, beyond the natural inclination of his will, although he voluntarily endured them; but especially those which he suffered at the end of his life, of which we must now speak. And in order that we may do it with precision, we observe that he not only suffered in body, but also in soul, as is evident, not only from the testimony of scripture, (Matt. xxvi. 38; John xii. 27,) but also because our salvation required that the surety of those sinners who had sinned in soul and body, and to whom the law threatened not only bodily, but also spiritual and internal sufferings, should also suffer both in soul and body. We observe, also, that these sufferings were very great and grievous, though not eternal; the sinner deserved eternal suffering, but the infinite dignity of Christ’s person was an equivalent to infinity of duration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.10, p. 295.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a53208e82e" data-kw="chastise">
<blockquote><p>&quot;You have chastised me, and I was chastised, as a bullock unaccustomed to the yoke; turn me and l shall be turned.&quot; &amp;c. And it is for the breaking down of the weight of one&#x27;s spirit that God lays it on: for which cause it is declared to be a good thing to bear it, that being the way to make one at length as a weaned child. Secondly, A strong desire to have the cross removed, and to have matters in that part going according to our inclinations. This is very natural, nature desiring to be freed from everything that is burdensome or cross to it; and if that desire is kept in a due subordination to the will of God, and it is not too pre-emptory, it is not sinful. &quot;If it is possible, let this cup pass from me; nevertheless, not as I will.&quot; &amp;c.</p></blockquote>

</figure><figure class="quote" id="q-18b435ee47" data-kw="">
<blockquote><p>Spiritual desertion is either by way of trial or by way of punishment. Someone is deserted in the first way in order to demonstrate and strengthen his virtues. In this way God deserted Adam when he was falling and, likewise, a master deserts his pupil in the arena of disputation. In the second way someone is deserted because of his sin, as God deserted Pharaoh and apostates. In this way a father disinherits his son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundredfold Most General Distinctions</cite>, in Scholastic Discourse: On Theological and Philosophical Distinctions and Rules, PIRef 4, trans. Willem J. van Asselt et al, ed. William den Boer (1656; Apeldoorn: Institute for Reformation Research, 2009), 2.10, p. 317.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>Q. What is God?

A. He is a Spirit, having his being of himself.

Expos. 9. God is a spiritual, invisible, and immaterial substance. 1. Tim. 1. 17. Luk. 24. 39.

10. God is without beginning, Psal. 90. 2. and 93. 2. Esa. 43. 10. and 44. 6. and without cause, Apoc. 1. 8. Esa. 41. 4. and 43. 10. and 48. 12. and so he is without composition, infinite, Psa. 147. 5. &amp; 145. 3. Exod. 3. 14. eternal, Prov. 8. 22, 23. Rom. 16. 26. incomprehensible, Exod. 33. 22. 23. 1. Tim. 6. 16. 1. Kin. 8. 27. Esa. 66. 1. and unchangeable, Jam. 1. 17. Mal. 3. 6.

Q. How many Gods be there?

A. Only one God and three Persons, the Father, Son, and Holy Ghost.

Expos. 11. There can be but one Omnipotent, Dan. 4. 35. infinite, eternal, most perfect first cause, and director of all things; all things are referred to one first, Rom. 11. 35. Apocal. 1. 8. and 4. 11.

12. A person generally taken, is one entire substance, not common to many, endued with life and understanding, will, and power. A person in the Godhead, is the Godhead restrained, or distinguished by his personal property. Joh. 14. 16. and 15. 1. The whole divine nature being indivisible, 1. Cor. 8. 6. is common to all three persons, Father, Son, and Holy Ghost. Act. 4. 24. 2. Cor. 1. 3. Joh. 1. 1. Rom. 9. 5. Heb. 1. 8. Numb. 12. 6. 7. with Act. 1. 16. 1. Pet. 1. 11. Heb. 1. 1. Act. 4. 25. with 2. Pet. 1. 21. and therefore whatsoever doth absolutely agree to the divine nature, or is spoken of the divine nature by relation unto the creatures, that doth agree likewise to every person in Trinity. Joh. 1. 1. Prov. 8. 22. Apoc. 1. 8. Matth. 18. 20. Joh. 3. 13. Job 26. 13. and 33. 4. Joh. 14. 26. Luk. 1. 35. Every person in Trinity, is equal in glory and eternity. Joh. 10. 30. Joh. 17. 5. Phil. 2. 6. Eph. 1. 17. with Joh. 12. 41. and there is a most near communion and union between them, by which each one is in the rest, and with the rest. Joh. 14. 10. 11. Io. 1. 1. and every one doth possess, love, and glorify each other. Prov. 8. 22. 30. v. Joh. 17. 5. working the same things. Joh. 5. 19. But the Godhead considered with the personal property of begetting, is the Father, &amp;c.

Q. What is the property of the Father?

A. To be of himself, and to beget his Son.

Expos. 13. The divine nature doth neither beget, nor is begotten: but the Father doth beget his Son by an eternal and necessary communication of his essence, wholly and indivisibly to his Son, which yet he wholly retaineth in himself. Joh. 1. 1. Pro. 8. 22, 23.

Q. What is the property of the Son?

A. To be begotten of the Father.

Q. What is the property of the Holy Ghost?

A. To proceed from the Father, and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise: containing all the principal grounds of Christian religion. By way of questions and answers: very profitable for all sorts of men, but especially for householders</cite>, (London: William Welby, 1617), pp 50-52.</span></figcaption>

<blockquote><p>For, if God granted to temporal and passible things to beget what they are, how much more did He who is eternal and impassible beget no other than He is Himself: one Father an only Son, to our unutterable wonder, since He begot Him with no suffering on His part, and with such complete equality to Himself that the Son does not excel Him either in power or in age!

All He has and can do He attributes to His Father, not to Himself, because He is not of Himself but of the Father. For, He is equal to the Father and this also He received from the Father, but He did not so receive His being equal as if He had previously been unequal and was born equal, but, as He is always born, so He is always equal. Therefore, He did not beget one unequal and add equality to Him at birth, but He gave it to Him in begetting Him because He begot Him equal, not unequal. Therefore, being in the form of God, it was not robbery in Him to be equal to God; since He assumed this at birth, He did not presume it by pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 170 from Alypius and Augustine to Maximus, c. 415 in Letters: Volume IV</cite></span></figcaption>

<blockquote><p>Our God is one, or rather He is Oneness itself, a unity which has nothing in itself but itself, not consisting of many things, as everything else does. In this essential Unity of God, a hypostatic Trinity subsists in a way that far exceeds the imagination of men. The external operations of God in time and history are such that, even though He is one, each hypostasis does something particular and appropriate.

For since they are Three and subsist in the essence of one Deity, it can truly be said that all things are from the Father, by the Son, and through the Holy Spirit. What the Son hears from the Father, and what the Spirit receives from the Father and the Son, we come to receive at the hands of the Spirit (John 16:13-15), and therefore He is the last and nearest to us in order, although in power He is equal to the Second and First.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our God is one, or rather He is Oneness itself, a unity which has nothing in itself but itself, not consisting of many things, as everything else does. In this essential Unity of God, a hypostatic Trinity subsists in a way that far exceeds the imagination of men. The external operations of God in time and history are such that, even though He is one, each hypostasis does something particular and appropriate.

For since they are Three and subsist in the essence of one Deity, it can truly be said that all things are from the Father, by the Son, and through the Holy Spirit. What the Son hears from the Father, and what the Spirit receives from the Father and the Son, we come to receive at the hands of the Spirit (John 16:13-15), and therefore He is the last and nearest to us in order, although in power He is equal to the Second and First.”

— Richard Hooker, Divine Law and Human Nature: Book I of Hooker’s Laws: A Modernization, ed. W. Bradford Littlejohn et al. (Lincoln NE: The Davenant Press, Kindle Edition, 2017), pp 5-6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+God+is+one%2C+or+rather+He+is+Oneness+itself%2C+a+unity+which+has+nothing+in+itself+but+itself%2C+not+consisting+of+many+things%2C+as+everything+else+does.+In+this+essential+Unity+of+God%2C+a+hypostatic+Trinity+subsists+in+a+way+that+far+exceeds+the+imagination+of+men.+The+external+operations+of+God+in+time+and+history+are+such+that%2C+even+though+He+is+one%2C+each+hypostasis+does+something+particular+and+appropriate.%0A%0AFor+since+they+are+Three+and+subsist+in+the+essence+of+one+Deity%2C+it+can+truly+be+said+that+all+things+are+from+the+Father%2C+by+the+Son%2C+and+through+the+Holy+Spirit.+What+the+Son+hears+from+the+Father%2C+and+what+the+Spirit+receives+from+the+Father+and+the+Son%2C+we+come+to+receive+at+the+hands+of+the+Spirit+%28John+16%3A13-15%29%2C+and+therefore+He+is+the+last+and+nearest+to+us+in+order%2C+although+in+power+He+is+equal+to+the+Second+and+First.%E2%80%9D%0A%0A%E2%80%94+Richard+Hooker%2C+Divine+Law+and+Human+Nature%3A+Book+I+of+Hooker%E2%80%99s+Laws%3A+A+Modernization%2C+ed.+W.+Bradford+Littlejohn+et+al.+%28Lincoln+NE%3A+The+Davenant+Press%2C+Kindle+Edition%2C+2017%29%2C+pp+5-6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f2ddee527.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5f2ddee527.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/07/richard-hooker-on-divine-unity-and-the-trinity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

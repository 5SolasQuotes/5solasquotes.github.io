<main class="wrap"><figure class="quote" id="q-9268fb1e60" data-kw="">
<blockquote><p>The mighty God who fills all space and reigns in majesty over all worlds, standing at the door of the sinner’s heart, humbling Himself to the language of entreaty, beseeching the sinner to come and be reconciled to Him, begging for admittance, and protesting that if you only come unto Him through Christ, He is willing to forgive all, and to forget all. Oh! my brethren, ought not this to encourage you? Yes! and if you refuse the encouragement, it ought also to fill you with terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Embassy of Reconciliation” in Sermons &amp; Discourses by Thomas Chalmers</cite>, (NY: Robert Carter &amp; Brothers, 1877), p. 549</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ec24cdd2c" data-kw="">
<blockquote><p>Others (Immanuel Tremellius &amp; Thomas Wilcox) interpret this of the doors of our heart, according to that Apoc. 3:20, ‘Behold I stand at the doors and knock, if any man hear my voice and open the door, I will come in unto him, etc.’ In the Gospel’s history we find that Christ had a fourfold entertainment among men. Some received Him into house, not into heart, as Simon the Pharisee (Lk. 7:44), who gave Him no kiss, nor water to his feet: some into heart, but not into house, as the faithful centurion, esteeming himself unworthy that Christ (Mt. 8:8) shouId come under his roof: some neither into soul nor heart, as the graceIess Gergesites, Mt. 8:54; some both into house and heart, as Lazarus (Jn. 11:11, 15), Mary (Lk. 10:38), Martha. Now that Christ may dwell in our hearts by faith (Eph. 3:17), and that our bodies may be temples of his Holy Spirit (1 Cor. 6:19); we must as our prophet exhorts here, ‘lift up our souls,’ that is, in the words of St. Paul, Col. 3:2, our affections must be set on things which are above, and not on things which are on earth, if we desire to lift up our heart unto Christ’s verity, we may not lift it up unto the world’s vanity (Augustine in location), that is, we must not fasten our love too much upon the things of this life, but on those pleasures at God’s right hand, which are evermore… O Lord, which art the God of my salvation (Ps. 18:47), I lift my heart to Thee (Ps. 25:1), desirous to seek Thee, both in the right ubi, ‘where’ Thou mayst be found, and in the right quando, ‘while’ Thou mayst be found: Open my dull ears and hard heart, that thy Son my Savior may come in and dwell with me: Grant me grace that I may still hear while He calls, open while He knocks, and hold Him also when I have Him, that I may both ascend thine hill, and stand in thine holy place, that I may not only sojourn in thy tabernacle, but also rest and dwell upon the mountain of thine holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical</cite>, [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | Ascension Day Evening Prayer, Psalm 24, p. 912</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-f0de67ec8a" data-kw="">
<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Words of Advice to Young Men delivered in Two Sermons</cite>, … (London: Parkhurst, 1668), sermon 1, sect. 5, pp. 25-26</span></figcaption>

</figure><figure class="quote" id="q-fccad8979c" data-kw="word and Spirit means">
<blockquote><p>Thus the Spirit is indeed rightly said not to work without the word, but not by the word only, but immediately and distinctly from the word. The movement of efficacious grace is properly to be called neither physical nor ethical, but supernatural and divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.4.17–18</span></figcaption>

</figure><figure class="quote" id="q-e19224ab05" data-kw="">
<blockquote><p>It will be seen, then, that the doctrine of the irresistibility, or insuperability, of divine grace in conversion is a necessary consequence of scriptural views of man’s entire depravity, and his inability by nature to will anything spiritually good; and that all that Calvinists intend to set forth in maintaining this doctrine, is declared when they assert that it is necessary that men’s will be renewed, and that, in the commencement of the process by which this renovation is effected, they are wholly passive,—incapable of co-operating with divine grace, or with the Holy Spirit operating upon them, until He has, by His own almighty power, effected an important change upon them. This change is sometimes called regeneration, when that word is taken in its most limited sense, as distinguished from conversion [the exercise of faith in Christ and repentance]; and, in that case, regeneration means the first implantation of spiritual life,—the process of vivification, or making alive,—while conversion describes the process by which men, now quickened and renewed,—no longer passive, but active,—do willingly turn to God, and embrace Jesus Christ as all their salvation and all their desire; and the whole is comprehended under the designation of effectual calling, which includes the whole work of the Spirit, in applying to men the blessings which Christ purchased, and in effecting that important change in their condition and character which is, in every instance, indispensable to salvation. An essential part of this process is the renovation of the will, or the giving it a new capacity or tendency,—a power of willing what is spiritually good,—whereas before it could will only what was spiritually evil. And it is important to have our attention directed to this feature in the process, as it is that right views of which most directly oppose and exclude Arminian errors upon this subject. In the description of effectual calling, given in the [Westminster] Shorter Catechism, it is said to be “a work of God’s Spirit, whereby, convincing us of sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 2, 1862, reprinted Banner of Truth, 1994, Ch. 25, The Arminian Controversy, Section 6, Efficacious &amp; Irresistible Grace, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“It will be seen, then, that the doctrine of the irresistibility, or insuperability, of divine grace in conversion is a necessary consequence of scriptural views of man’s entire depravity, and his inability by nature to will anything spiritually good; and that all that Calvinists intend to set forth in maintaining this doctrine, is declared when they assert that it is necessary that men’s will be renewed, and that, in the commencement of the process by which this renovation is effected, they are wholly passive,—incapable of co-operating with divine grace, or with the Holy Spirit operating upon them, until He has, by His own almighty power, effected an important change upon them. This change is sometimes called regeneration, when that word is taken in its most limited sense, as distinguished from conversion [the exercise of faith in Christ and repentance]; and, in that case, regeneration means the first implantation of spiritual life,—the process of vivification, or making alive,—while conversion describes the process by which men, now quickened and renewed,—no longer passive, but active,—do willingly turn to God, and embrace Jesus Christ as all their salvation and all their desire; and the whole is comprehended under the designation of effectual calling, which includes the whole work of the Spirit, in applying to men the blessings which Christ purchased, and in effecting that important change in their condition and character which is, in every instance, indispensable to salvation. An essential part of this process is the renovation of the will, or the giving it a new capacity or tendency,—a power of willing what is spiritually good,—whereas before it could will only what was spiritually evil. And it is important to have our attention directed to this feature in the process, as it is that right views of which most directly oppose and exclude Arminian errors upon this subject. In the description of effectual calling, given in the [Westminster] Shorter Catechism, it is said to be “a work of God’s Spirit, whereby, convincing us of sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.”

— William Cunningham, Historical Theology, vol. 2, 1862, reprinted Banner of Truth, 1994, Ch. 25, The Arminian Controversy, Section 6, Efficacious &amp; Irresistible Grace, pp. 411-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+will+be+seen%2C+then%2C+that+the+doctrine+of+the+irresistibility%2C+or+insuperability%2C+of+divine+grace+in+conversion+is+a+necessary+consequence+of+scriptural+views+of+man%E2%80%99s+entire+depravity%2C+and+his+inability+by+nature+to+will+anything+spiritually+good%3B+and+that+all+that+Calvinists+intend+to+set+forth+in+maintaining+this+doctrine%2C+is+declared+when+they+assert+that+it+is+necessary+that+men%E2%80%99s+will+be+renewed%2C+and+that%2C+in+the+commencement+of+the+process+by+which+this+renovation+is+effected%2C+they+are+wholly+passive%2C%E2%80%94incapable+of+co-operating+with+divine+grace%2C+or+with+the+Holy+Spirit+operating+upon+them%2C+until+He+has%2C+by+His+own+almighty+power%2C+effected+an+important+change+upon+them.+This+change+is+sometimes+called+regeneration%2C+when+that+word+is+taken+in+its+most+limited+sense%2C+as+distinguished+from+conversion+%5Bthe+exercise+of+faith+in+Christ+and+repentance%5D%3B+and%2C+in+that+case%2C+regeneration+means+the+first+implantation+of+spiritual+life%2C%E2%80%94the+process+of+vivification%2C+or+making+alive%2C%E2%80%94while+conversion+describes+the+process+by+which+men%2C+now+quickened+and+renewed%2C%E2%80%94no+longer+passive%2C+but+active%2C%E2%80%94do+willingly+turn+to+God%2C+and+embrace+Jesus+Christ+as+all+their+salvation+and+all+their+desire%3B+and+the+whole+is+comprehended+under+the+designation+of+effectual+calling%2C+which+includes+the+whole+work+of+the+Spirit%2C+in+applying+to+men+the+blessings+which+Christ+purchased%2C+and+in+effecting+that+important+change+in+their+condition+and+character+which+is%2C+in+every+instance%2C+indispensable+to+salvation.+An+essential+part+of+this+process+is+the+renovation+of+the+will%2C+or+the+giving+it+a+new+capacity+or+tendency%2C%E2%80%94a+power+of+willing+what+is+spiritually+good%2C%E2%80%94whereas+before+it+could+will+only+what+was+spiritually+evil.+And+it+is+important+to+have+our+attention+directed+to+this+feature+in+the+process%2C+as+it+is+that+right+views+of+which+most+directly+oppose+and+exclude+Arminian+errors+upon+this+subject.+In+the+description+of+effectual+calling%2C+given+in+the+%5BWestminster%5D+Shorter+Catechism%2C+it+is+said+to+be+%E2%80%9Ca+work+of+God%E2%80%99s+Spirit%2C+whereby%2C+convincing+us+of+sin+and+misery%2C+enlightening+our+minds+in+the+knowledge+of+Christ%2C+and+renewing+our+wills%2C+He+does+persuade+and+enable+us+to+embrace+Jesus+Christ+freely+offered+to+us+in+the+gospel.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Historical+Theology%2C+vol.+2%2C+1862%2C+reprinted+Banner+of+Truth%2C+1994%2C+Ch.+25%2C+The+Arminian+Controversy%2C+Section+6%2C+Efficacious+%26+Irresistible+Grace%2C+pp.+411-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe19224ab05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e19224ab05.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-sincere-free-offer-of-the-gospel/you-must-choose-christ-to-be-saved/#:~:text=It%20will%20be%20seen%2C%20then%2C%20that,offered%20to%20us%20in%20the%20gospel&amp;text=It%20will%20be%20seen%2C%20then%2C%20that%20the%20doctrine&amp;text=Christ%20freely%20offered%20to%20us%20in%20the%20gospel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

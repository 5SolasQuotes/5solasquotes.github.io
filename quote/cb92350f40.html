<main class="wrap"><figure class="quote" id="q-cb92350f40" data-kw="">
<blockquote><p>For the better understanding whereof, we are to consider the merits of Christ, and the benefits which we have thereby, according to his own intention expressed in the covenant of grace (the condition whereof is faith,) and are not to extend them to those, to whom they were not intended, CHRIST is the Saviour of the world, yet all are not saved, nor to be saved: for many still remain in the state of damnation. he is the redeemer of mankind, yet all are not actually redeemed; for many still remain in the servitude of sin &amp; satan. For they that commit sin, are the servants of sin. Whereas if the son had made them free, they should have been free indeed. Joh. 8.34.36. God was in Christ reconciling the world unto himself; and yet very many, as they continue in their rebellion against God; so the wrath of God abideth upon them. Joh. 3.36.

Neither ought this to seem strange, seeing the covenant of grace promiseth and assureth, neither salvation, nor remission of sins, nor other benefits of Christ to all, but only to those that believe. So God loved the world that he gave his only begotten son, that whosoever believeth in him should not perish but have life everlasting. John 3.16. Mark. 16.16. he that believeth and is baptized shall be saved, but he that believeth not shall be condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), p. 206.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c333ab4adf" data-kw="">
<blockquote><p>This may be a sad meditation to us, to stand and look back to our former estate, and compare it with that into which we are fallen. That image we spoke of, is defaced and blotted out, which was the glory of the creation; and now there is nothing so monstrous, so deformed in the world as man. The corruption of the best things is always worst; the ruins of the most noble creature are most ruinous; the spot of the soul most abominable.

We are nothing but a mass of darkness, ignorance, error, inordinate lust; nothing but confusion, disorder, and distempers in the soul, and in the conversation of men; and, in sum, that blessed bond of friendship with God broken, discord and enmity entered upon our side and separated us from God, and so we can expect nothing from that first covenant but the curse and wrath threatened. “By one man’s disobedience” sin entered upon all, ‘and death by sin;’ because in that agreement Adam was a common person representing us, and thus are all men once subject to God’s judgment, and come short of the glory of God, fallen from life into a state of death, and, for any thing that could be expected, irrecoverably.

But it hath pleased the Lord, in his infinite mercy, to make a better covenant in Christ his Son, that, what was impossible to the law, by reason of our weakness and wickedness, his Son, sent in the flesh, condemned for sin, might accomplish, Rom. 8.3. There is some comfort yet after this; that covenant was not the last, and that sentence was not irrevocable. He makes a new transaction, lays the iniquity of his elect upon Christ, and puts the curse upon his shoulders which was due to them. Justice cannot admit the abrogation of the law, but mercy pleads for a temperament of it. And thus the Lord dispenses with personal satisfaction, which in rigour he might have craved; and finds out a ransom, admits another satisfaction in their name.

And in the name of that Cautioner and Redeemer is salvation preached upon better terms: Believe and thou shalt be saved, Rom. 10.9. Thou lost and undone sinner, whoever thou art, that findest thyself guilty before God, and that thou canst not stand in judgment by the former covenant,—thou who hast no personal righteousness, and trustest in none,—come here, embrace the righteousness of thy Cautioner,—receive him, and rest on him, and thou shalt be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 234-35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-111a30126c" data-kw="">
<blockquote><p>These things being granted, the only way of life and salvation by Jesus Christ, under the old testament and the new, is secured; which is the substance of the truth wherein we are now concerned. On these grounds we may proceed with our inquiry. The judgment of most reformed divines is, that the church under the old testament had the same promise of Christ, the same interest in him by faith, remission of sins, reconciliation with God, justification and salvation by the same way and means, that believers have under the new. And whereas the essence and the substance of the covenant consists in these things, they are not to be said to be under another covenant, but only a different administration of it. But this was so different from that which is established in the gospel after the coming of Christ, that it hath the appearance and name of another covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 86</span></figcaption>

<blockquote><p>When God had caused his everlasting decree to fall in labour, and had delivered it by giving the world a being, and upon infinite consultation had formed man to be his viceroy over all the works of his hands, he embarked him, with all abilities needful for such a voyage, in the bottom of the covenant of works.

Adam set forth fully furnished with skill, and richly fraught with all the fortunes, hopes, and happiness of mankind; but he had scarce launched out of sight, before Satan, who knew very well the worth of the prize, envying man the haven of bliss to which he was sailing, and envying God, who was the owner, the honour of such a venture, raised a storm, whereby the vessel, through the unfaithfulness of Adam, the pilot, ran upon a rock and miscarried. Oh what a joyful spectacle was that to Satan!

What a doleful sight to Adam, to behold himself, and all his posterity, sinking into the boundless, bottomless ocean of destruction and misery, through his falseness and treachery! when, lo, on a sudden the glorious God, out of the superabundant riches of his mercy, resolving that the devil should never rob him of the honour of that manifold wisdom, unsearchable goodness, and almighty power, which had been manifested in the work of creation, did provide and cast out the covenant of grace, a plank sufficient for his poor shipwrecked creature to swim safe to shore on.

As all the rivers meet in the sea, and all the lines in the centre, so do all the comforts of mankind meet in this covenant. The whole Scripture is ‘sincere milk,’ but this covenant is the cream of it: all our mercies are contained in it, all our hopes are sustained by it, and our heaven is at last attained through it.

The blessed God doth not only enter into a covenant of mercy, but out of compassion to our infirmities, hath been pleased to confirm it by his hand and seal: by his hand in his word, by his seals, by the privy-seal of his Spirit, and by the broad seals of the sacraments, that by these ‘immutable things, in which it is impossible for God to lie, we might have strong consolation, who have fled for refuge, to lay hold upon the hope set before us,’ Heb. vi. 18.</p></blockquote>

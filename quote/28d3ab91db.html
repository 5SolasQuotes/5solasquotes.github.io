<main class="wrap"><figure class="quote" id="q-28d3ab91db" data-kw="">
<blockquote><p>Seventhly, all our expositions should accord with the analogy of faith, which we read of, Rom. xii. 6. Now the analogy of faith is nothing else but the constant sense of the general tenour of scripture in those clear passages of scripture, where the meaning labours under no obscurity; such as the articles of faith in the Creed, and the contents of the Lord&#x27;s Prayer, the Decalogue, and the whole Catechism: for every part of the Catechism may be confirmed by plain passages of scripture. Whatever exposition is repugnant to this analogy must be false.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 9 (p. 472)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40145f457d" data-kw="Authority of Scripture">

</figure><figure class="quote" id="q-e8b377bc63" data-kw="">
<blockquote><p>We hold the case thus:—that the spirits are to be tried and proved by a twofold judgment. The one, internal; by which, through the Holy Spirit, or a peculiar gift of God, any one may illustrate, and to a certainty, judge of, and determine on, the doctrines and sentiments of all men, for himself and his own personal salvation concerning which it is said. (1 Cor. ii. 15.) &quot;The spiritual man judgeth all things, but he himself is judged of no man.&quot; This belongs to faith, and is necessary for every, even private, Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>

</figure><figure class="quote" id="q-727be13c5c" data-kw="">
<blockquote><p>The supreme judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Scripture delivered by the Spirit, into which Scripture so delivered, our faith is finally resolved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.10</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The supreme judge, by which all controversies of religion are to be determined, and all decrees of councils, opinions of ancient writers, doctrines of men, and private spirits, are to be examined, and in whose sentence we are to rest, can be no other but the Holy Scripture delivered by the Spirit, into which Scripture so delivered, our faith is finally resolved.”

</figure><figure class="quote" id="q-76a5437c2b" data-kw="">
<blockquote><p>We do not deny that there can be in the church a ministerial and secondary judge, who can officially moderate controversies over the faith by the Word of God, but we hold that the Holy Spirit, as its source, teaches us the true interpretation of Scripture where inner assurance is concerned. We deny that any supreme and infallible judge except Scripture need be sought with regard to external proof of the object, much less that the pope, who assumes such a task, is to be accepted. We believe that Scripture alone, or God speaking in it, is enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span></div>

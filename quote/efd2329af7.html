<main class="wrap"><figure class="quote" id="q-efd2329af7" data-kw="">
<blockquote><p>5. If all mixed perfections are reducible to a plurality of pure perfections existing in limited degree, and if an infinite being possesses all pure perfections, the consequent is that God in some way possesses every positive perfection that is found or can be found in creatures, and indeed possesses it in unlimited degree. Accordingly God seems to differ from creatures by something positive not possessed by creatures. Creatures, by contrast, do not seem, in the ultimate analysis, to differ from God by any positive perfection precisely but rather because they lack some perfection that God has. This notion is also expressed in the theory of participation, according to which creatures are finite or imperfect likenesses of God insofar as any perfection possessed by them is found in God either formally or virtually or eminently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-be8b63b848" data-kw="">
<blockquote><p>Asking whether you should listen to God or to reason is like asking whether you should listen to Beethoven’s Fifth Symphony or to the recording you have of it. It’s like asking whether the earth is lit up by the sun or by sunlight. It’s like asking whether you should obey your commanding officer or his commands. The natural law of reason is a participation in the eternal law of God ([Thomas, Summa] I-I,91,2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-kreeft.html">Peter Kreeft</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Theology: Spiritual Direction from St. Thomas Aquinas… (Ignatius Press, 2014), ch. 82, ‘Listening to Reason is Listening to God’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-89e6a55744" data-kw="">
<blockquote><p>But the errors of philosophers are not the dictates of philosophy, any more than the mistakes of artificers are to be imputed to the art itself. ‘Philosophy,’ says Clement of Alexandria, ‘is not to be called Stoic, nor Platonic, nor Epicurean, nor Aristotelian, but whatever has been properly spoken by these sects–this, gathered into one whole, is to be called philosophy’ (Stromata 1.7 [ANF 2:308; PG 8.731]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’</cite>, pp. 45-56</span></figcaption>

</figure><figure class="quote" id="q-ea060bdf15" data-kw="">
<blockquote><p>Reason cannot and ought not to bring forth any mysteries, as it were, out of its own storehouse; for this is the prerogative of scripture only. Also, that reason is not to be heard when complaining of its incapacity to comprehend the mysteries of faith: for, being finite, it is no wonder that reason should not comprehend many things that relate to what is infinite; and to reject a mystery because it is incomprehensible to reason, is to offend against reason itself. Neither is reason to be listened to whenever, under cover of holding the mysteries of faith, it aims at setting up its own errors. On the very same grounds we can not call philosophy any rule of faith, although we again concede that it is of no little use, provided it assume not to itself the power of dictating in articles of faith. True philosophy indeed serves very much both to convince men and to prepare their minds; and there is a wonderful harmony between sound philosophy and divinity: for truth is not contrary to truth, nor light to light; only we must not imagine that the former is the rule by which the sense of scripture must be tried and examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-a4aa7a3398" data-kw="">
<blockquote><p>I constantly keep exactly the same order of books, treatises, disputations, chapters, and sections which the author, Father Suárez, observed, so that, if anyone should at times wish to inspect or weigh more fully some subject that has been proposed, he may at once be able to ﬁnd it in the very archetype without any diﬃculty or toil. Sometimes, however, for the sake of brevity, I have gathered into a single heading certain chapters of his which were divided, but have a great mutual connexion; yet not even thus is the ease of ﬁnding the matter desired taken away, since I always retain the original order of the subject-matter. Further, if sometimes from the title the sense of the question does not suﬃciently appear, I preﬁx a brief explanation of it, and, when needful, I set out the whole question for clearer understanding by a successive series of cardinal numbers, saying 1, 2, 3, etc., as Father Suárez himself also more frequently is wont to set things forth. Next, because he oﬅen preﬁxes to his own position the diverse opinions of authors or the heresies, I likewise indicate these at the outset along with his own, and at the end I resolve in a body their arguments or objections. Yet do not expect, dear reader, that all and each of the original’s proofs and refutations—especially those drawn from authority—could have been included in so narrow a compendium; I have excerpted only those more necessary, suitable, and eﬀective, for the most part merely indicating the rest in general. Moreover, I have always striven, as brieﬂy as I could, to embrace his whole line of argument and meaning.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c5e83ac39d" data-kw="">
<blockquote><p>The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member… Much more must the temporal commodity of single men give place to the churches’ welfare (which will not stand with disorder)… If you plead inconveniencies to them: Remember then it is no matter of conscience, but of worldly commodity: and may not I set the general good of the churches against any man’s commodity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, pp. 35-36</span></figcaption>

<blockquote><p>I have heard many pleading for ceremonies say that if the magistrate commanded them and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London, 1659), 5th Disputation</cite>, ch. 2; pp. 423–24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-c3b56251fc" data-kw="">
<blockquote><p>Reply Obj. 2: The end, insofar as it pre-exists in the intention, pertains to the will, as stated above (A1, ad1). And it is thus that it gives the species to the human or moral act. Reply Obj. 3: One and the same act, insofar as it proceeds once from the agent, is ordained to but one proximate end, from which it has its species: but it can be ordained to several remote ends, of which one is the end of the other. It is possible, however, that an act which is one in respect of its natural species, be ordained to several ends of the will: thus this act to kill a man, which is but one act in respect of its natural species, can be ordained, as to an end, to the safeguarding of justice, and to the satisfying of anger: the result being that there would be several acts in different species of morality: since in one way there will be an act of virtue, in another, an act of vice. For a movement does not receive its species from that which is its terminus accidentally, but only from that which is its per se terminus. Now moral ends are accidental to a natural thing, and conversely the relation to a natural end is accidental to morality. Consequently there is no reason why acts which are the same considered in their natural species, should not be diverse, considered in their moral species, and conversely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 of 2 | quest. 1, art. 3, ‘Whether human acts are specified by their end? [Yes]’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-559bf1690e" data-kw="">
<blockquote><p>6th Rule. There is a principal obligation, a less principal, a least principal. Hence these three degrees issue from love: 1. God, 2. ourselves, 3. our neighbor. The love of God is most principal, and is the measure of the love of ourselves: the love of ourself is less principal than the love of God, and so the obligation [is] less. I am to make away, life and all things, yea, eternal glory as divided from holiness, and as it includes only happiness, rather ere I sin against God. The obligation to care for my own salvation is more principal than my obligation to care for the salvation of my brother: for the love of myself is the measure and rule of the love of my neighbor. Now because the obligation of caring for the soul of my brother is only secondary, in compare[ison] of the obligation of caring for my own salvation, I am not to sin myself, or sinfully to omit anything that is commanded me in a positive precept, to prevent the sin of my brother. Yet hence it does not follow that a positive precept is more excellent than the law of Nature, which is, ‘Thou shalt not murder,’ nor ‘scandalize him for whom Christ died.’ Because though to care for the soul of my brother be of the law of nature simpliciter, yet [it] is a secondary obligation, and may cease and yield to a stronger obligation that ties me more principally to care for my own soul; for though the command be positive, yet knowingly to sin by a sinful omission, is no less a destroying of my own soul, and so of the law of nature, in a higher obligation, than the other is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Appendix</cite>, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-7349fce36d" data-kw="">
<blockquote><p>In Acts 16:3, about Paul using his liberty to circumcise Timothy due to the onlooking Jews, the necessity for this material action (albeit understood religiously and falsely by others, as Paul knew it would so be misunderstood beforehand) was for the sake of not unduly scandalizing others, even unbelievers, for the greater well-being of the Church, avoiding its disturbance and for the flourishing of the Gospel. Note that Gal. 5:1 calls circumcision “a yoke of bondage” when it is imposed out of religious necessity, and yet Paul was willing to occasionally submit to it for the higher good when he would not submit to it out of formal principle or always (Gal. 2:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-d353662d30" data-kw="">
<blockquote><p>…whereat Paybody [a Formalist] starts and replies that the gestures which the people of God used in circumcision and baptism, the renting of the garment used in humiliation and prayer, Ezra 9:5; 2 Kings 22:19; Jer. 36:24, lifting up the hands, kneeling with the knees, uncovering the head in the sacrament, standing and sitting at the sacrament, were and are significant in worshipping, yet are not forbidden by the 2nd Commandment. Answer: There are three sorts of signs here to be distinguished:

1. Natural signs: so smoke is a sign of fire, and the dawning of the day a sign of the rising of the sun.

2. Customable signs, and so the uncovering of the head, which of old [in the OT, exampled by the priests] was a sign of preeminence, has through custom become a sign of subjection [such as in 1 Cor. 11].

3. Voluntary signs, which are called signa instituta; these are either sacred or civil. To appoint sacred signs of heavenly mysteries or spiritual graces, is God’s own peculiar, and of this kind are the holy sacraments. Civil signes for civil and moral uses, may be and are commendably appointed by men, both in Church and commonwealth, and thus the tolling of a bell is a sign given for assembling, and has the same signification both in ecclesiastical and secular assemblings. Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For which of you, says our Master [Lk. 17:7], having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat. All these signs have their significations from nature. … Secondly, customable signs have likewise place in divine service, for so a man coming into one of our churches, in time of public worship, if he see the hearers covered, he knows by this customable sign that [the] sermon is begun. Thirdly, civil or moral signs instituted by men, for that common order and decency, which is respect both in civil and sacred actions, have also place in the acts of God’s worship. Thus a basen and a laver set before a pulpit are signs of baptism to be ministered: but common decency teaches us to make the same use of basin and a laver in civility which a minister makes of them in the action of baptizing. All our question [with the Formalists, on the other hand] is about sacred mystical signs. Every sign of this kind, which is not ordained of God, we refer to the imagery forbidden in the 2nd Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘5th Argument… taken from the mystical &amp; significant nature of them’, pp. 85-86</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1ad55b48c8" data-kw="">
<blockquote><p>Though there be many things in a Church to brangle and lessen the comfort of our communion with it, and the ministry thereof, yet we may keep fellowship with a true Church, though in many things faulty and corrupt, as all Churches are in some measure in this militant state. As the Church of Corinth had many corruptions in her practice, yet no separation is enjoined from it: And the Lord did not require separation from the Churches of Pergamos and Thyatira, though they had many corruptions and deficiencies in discipline, in a toleration of heretics; and would lay no other burden upon them, but to hold fast what they had, as Mr. Durham shows on the Revelation, ch. 2, lect. 6, as also ch. 13, lect. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-823f45241a" data-kw="">
<blockquote><p>18. And if the unsoundness, badness or weakness of the pastors and the faultiness of the worship, order or discipline be not so great as to make communion with the church simply unlawful, yet any free man whose edification is greatly hindered by it, and can elsewhere have far greater helps for his salvation and join with a church which walks more conformably to the Christian rule, may lawfully remove himself to such a ministry and church, when it is not to the greater hurt of others than his own good. Especially such whose ignorance, weakness and deadness makes a lively and convincing ministry more needful to their safety and welfare than it is to others: For it is a sin, caeteris paribus [other things being equal], to prefer the worse before the better, and a sin to neglect the best means for our souls which we can lawfully enjoy: And the soul is more precious than to be hazarded or left in sin and darkness for an unnecessary circumstance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing: I. a Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians</cite>, … (London: Parkhurst, 1691), pt. 2, Question 2, pp. 67-68</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e72ea9db60" data-kw="">
<blockquote><p>…I grant that persons grosly ignorant and notoriously scandalous and impenitent ought to be excluded from the Lord’s Supper, but it must be done by them only to whom God has given this power, and in such order and manner as the Lord has appointed. That is necessary (says Mr. [John] Ball in his Tryal of the Grounds Tending to Separation, p. 190) to them that have received commission from God, which is unlawful to them that want authority. In the commonwealth the execution of justice is necessary; but private persons must not challenge the sword of the magistrate. In a corporation no one must take that upon himself which belongs to the common-council. Holy things must not be given to prophane persons; but every one at his pleasure must not deny holy things to unholy persons, but unholy persons must be debarred from holy things in such order as God has prescribed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government… (London, 1650), p. 46 Jeanes was an English presbyterian.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30aacc52e1" data-kw="">
<blockquote><p>…asking the General Assembly to take such action in the case of members of the Church who remove, without certificate, or who fail, for a length of time, to attend upon the ordinances of the gospel, as will secure constitutional and uniform action throughout the Presbyterian churches… It [a session or presbyterial court] can do what it pleases, as a Church court, provided it infringes on no article of its contract with other courts, and on no principle of the Word of God. It has no need therefore to go to the General Assembly to ask power to do what from its very nature as a Church court it has the right to do. A session must have a right to say who are the members of the church over which it presides. It might as well ask for power to erase from its roll the names of the dead, as to seek authority to say that those who have left them and wandered off no one knows where, have left them, and are no longer under their watch and care… According to our view the sessions have all the power they need in this matter inherent in themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 12, section 1, ‘The Session says who are church members’ (1850)</cite>, pp. 190-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ba378cd46f" data-kw="">
<blockquote><p>4. Concerning the tenth Proposition (which will be most questioned), I desire it may be observed: 1. That we meddle not with the term ‘excommunication.’ 2. And therefore they that say we meddle with the thing, must define excommunication, and show that the work that we here agree on does reach that definition. 3. Which if they do, then they will make excommunication to be no more than this application of Christ’s doctrine to a particular person and case, which every minister of the Gospel may perform: For we mention in our Agreement no more. 4. I am sure that delivering up to Satan, and the great anathematizing excommunication is commonly taken to go much further and contain more than we here conclude on. 5. Yet observe that we here suppose the fact and faultiness proved beyond doubt: and when we speak of ministers applicatory requiring the avoidance of such persons, if any think we wrongfully authorize him to do this without the presbytery, congregation, or bishop; remember that we speak not here of examining witnesses, much less giving them their oaths, or the like preparation for discovery of the guilt. How far people or any others may have a hand in this we do not determine. 6. Nor do we determine whether it must needs be more ministers than one that must agree in this before the public application: yet afterward we have limited ourselves in this for unity, peace and avoiding of rash applications.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) | An Explication of Some Passages in the Propositions</cite>, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-36a84597f2" data-kw="">
<blockquote><p>5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member [in some way] of the visible Church and converted to God, who is excommunicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644)</cite>, p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-de92034391" data-kw="">
<blockquote><p>…for an excommunicate[d] person may remain externally without the Covenant to the visible Church, when baptism remains a seal, and may be a seal of a grace or privilege, which is interrupted or removed in act, but remains in habit: as to be the eldest son of a king may be a seal of the son’s heirship, and yet he may for a fault be disherited and cast out of his place. The Church and Church-membership are relata secundum esse [related according to being], not secundum dici [according to speaking] only, or relata [Greek]: but baptism and Church-membership are not so perfect relatives, but baptism does remain and the Church-membership may be dissolved: as the burgess ticket whereby a man has right to all the city privileges may remain, when the man for some crime committed against the city has lost all his city privileges and is not now a free citizen, in which case his burgess ticket seals nothing to him: So baptism seals not actual membership in case of excommunication, yet remains baptism valid in the acts of sealing other things [such as the invisible promises of God to the elect and regenerate, the forgiveness of sins, etc.].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5</cite>, p. 220</span></figcaption>

<main class="wrap"><figure class="quote" id="q-53c3a82b63" data-kw="">
<blockquote><p>Whether the infusion of grace is required for justification? It is distinguished. Whether some movement of free choice and faith is required? It is affirmed with a distinction. … Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>9. ‘Justification’, Of Justification in General in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 3 Abbr.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>21. The effects of justification, or its necessary consequences, are: 1. Actual adoption, Eph. I.5. 2. Peace of conscience, Rom. V.1. 3. Love, Luke VII.47; and other spiritual charismata [gifts] of that kind, which the Spirit of adoption works in the hearts of the justified. For justification is to be conjoined with sanctification by an inseparable and perpetual bond, yet not to be confounded with it; and to those for whom Christ has been made δικαιοσύνη [dikaiosynē, righteousness], to them He has also been made ἁγιασμός [hagiasmos, sanctification], 1 Cor. I.30. 4. Life and glory, Rom. VIII.30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-676307ae66" data-kw="">
<blockquote><p>38. The instruments of producing this faith are the Word and sacraments… 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>

</figure><figure class="quote" id="q-cb8ac2d81e" data-kw="">
<blockquote><p>The notion that the Spirit creates union with Christ and constitutes us definitively sanctified by this union/identification with Christ from which flows the rest of the ordo salutis (including justification and progressive sanctification) may be true, but it isn’t the obvious and overwhelming teaching of the Reformed theologians and confessions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What is Definitive Sanctification &amp; is it Reformed?’ (2009) 20 paragraphs</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“The notion that the Spirit creates union with Christ and constitutes us definitively sanctified by this union/identification with Christ from which flows the rest of the ordo salutis (including justification and progressive sanctification) may be true, but it isn’t the obvious and overwhelming teaching of the Reformed theologians and confessions.”

— R. Scott Clark, ‘What is Definitive Sanctification &amp; is it Reformed?’ (2009) 20 paragraphs">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+notion+that+the+Spirit+creates+union+with+Christ+and+constitutes+us+definitively+sanctified+by+this+union%2Fidentification+with+Christ+from+which+flows+the+rest+of+the+ordo+salutis+%28including+justification+and+progressive+sanctification%29+may+be+true%2C+but+it+isn%E2%80%99t+the+obvious+and+overwhelming+teaching+of+the+Reformed+theologians+and+confessions.%E2%80%9D%0A%0A%E2%80%94+R.+Scott+Clark%2C+%E2%80%98What+is+Definitive+Sanctification+%26+is+it+Reformed%3F%E2%80%99+%282009%29+20+paragraphs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb8ac2d81e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb8ac2d81e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=The%20notion%20that%20the%20Spirit%20creates,of%20the%20Reformed%20theologians%20and%20confessions&amp;text=The%20notion%20that%20the%20Spirit%20creates%20union%20with&amp;text=overwhelming%20teaching%20of%20the%20Reformed%20theologians%20and%20confessions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a4aa73838b" data-kw="">
<blockquote><p>For good works are fruitful not only in reference to an ample and manifold reward, but in reference to good works:¹ as the parable of our Savior in the twenty-fifth of Matthew plainly informs us, where it is said: ‘Then he that had received the five talents went and traded with the same and made them other five talents.’ (Mt. 25:16) ¹ Serva ergo mandata Dei-Sanctifica cor tuum ut Deus inhabitet in te. Et quotidie magis &amp; magis invenies Deum [Therefore keep the commandments of God—sanctify your heart so that God may dwell in you. And every day you will find God more and more]. [Ps. Chrysostom,] Imperfect Work on Matthew, Homily 4. These five talents acquired to the first five cannot be interpreted [as] the reward ultimate; for that is expressed afterward to be the joy of the Lord [vv. 21, 23]: but they were the intermediate effects of the stock of grace treasured up in the soul, and exhorting and improving itself by the continual supply of the Spirit of Christ, according to the doctrine of St. Paul to the Corinthians, saying: ‘Insomuch that we desired Titus, that as he had begun, so he would also finish in you the same grace also: Therefore as ye abound in everything, in faith, in utterance, in knowledge, and in all diligence, and in your love to us, see that ye abound in this grace also.’ [2 Cor. 8:6-7] Of this influence of Christ’s Spirit to the augmentation of grace in the hearts of the true believers, speaks the same apostle to the Colossians, thus: ‘The Head from which all the body by joints and bands having nourishment, ministered and knit together, encreases with the increase of God.’ (Col. 2:19) … That God therefore accepted their burnt-offering (Jud. 13:23), it is a sign He approved their persons, but the reason antecedent of God’s acceptation of their sacrifice, was because He first approved their persons. And yet, notwithstanding the goodness of the person is the original of the goodness of the work, nothing hinders but the goodness of the work may add value, favour, and estimation unto the person. As (to use Luther’s comparison and others after and before him) the tree bears the fruit, and not the fruit the tree: And the goodness of the tree is the cause of the goodness of the fruit, and not the goodness of the fruit the cause of the goodness of the tree: Yet the fruit does procure an esteem and valuation from the owner to the tree; and endears it to him, to the cultivating the ground and dressing it and conferring much more on that than others. In like manner, the person sanctified and justified produces good works, and not those good works, him: but some actions accompanied with God’s grace, antecedent and inferior to the fruit itself: Yet does the fruit of good works add much of esteem and honor from God to such a person; and render him capable of an excellent reward: for St. Paul to the Philippians assures them and us, when he says, ‘I desire fruit that may abound to your account.’ (Phil. 2:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17</cite>, pp. 62-63</span></figcaption>

, nothing hinders but the goodness of the work may add value, favour, and estimation unto the person. As (to use Luther’s comparison and others after and before him) the tree bears the fruit, and not the fruit the tree: And the goodness of the tree is the cause of the goodness of the fruit, and not the goodness of the fruit the cause of the goodness of the tree: Yet the fruit does procure an esteem and valuation from the owner to the tree; and endears it to him, to the cultivating the ground and dressing it and conferring much more on that than others. In like manner, the person sanctified and justified produces good works, and not those good works, him: but some actions accompanied with God’s grace, antecedent and inferior to the fruit itself: Yet does the fruit of good works add much of esteem and honor from God to such a person; and render him capable of an excellent reward: for St. Paul to the Philippians assures them and us, when he says, ‘I desire fruit that may abound to your account.’ (Phil. 2:7)”

re+accepted+their+burnt-offering+%28Jud.+13%3A23%29%2C+it+is+a+sign+He+approved+their+persons%2C+but+the+reason+antecedent+of+God%E2%80%99s+acceptation+of+their+sacrifice%2C+was+because+He+first+approved+their+persons.+And+yet%2C+notwithstanding+the+goodness+of+the+person+is+the+original+of+the+goodness+of+the+work%2C+nothing+hinders+but+the+goodness+of+the+work+may+add+value%2C+favour%2C+and+estimation+unto+the+person.+As+%28to+use+Luther%E2%80%99s+comparison+and+others+after+and+before+him%29+the+tree+bears+the+fruit%2C+and+not+the+fruit+the+tree%3A+And+the+goodness+of+the+tree+is+the+cause+of+the+goodness+of+the+fruit%2C+and+not+the+goodness+of+the+fruit+the+cause+of+the+goodness+of+the+tree%3A+Yet+the+fruit+does+procure+an+esteem+and+valuation+from+the+owner+to+the+tree%3B+and+endears+it+to+him%2C+to+the+cultivating+the+ground+and+dressing+it+and+conferring+much+more+on+that+than+others.+In+like+manner%2C+the+person+sanctified+and+justified+produces+good+works%2C+and+not+those+good+works%2C+him%3A+but+some+actions+accompanied+with+God%E2%80%99s+grace%2C+antecedent+and+inferior+to+the+fruit+itself%3A+Yet+does+the+fruit+of+good+works+add+much+of+esteem+and+honor+from+God+to+such+a+person%3B+and+render+him+capable+of+an+excellent+reward%3A+for+St.+Paul+to+the+Philippians+assures+them+and+us%2C+when+he+says%2C+%E2%80%98I+desire+fruit+that+may+abound+to+your+account.%E2%80%99+%28Phil.+2%3A7%29%E2%80%9D%0A%0A%E2%80%94+Matthew+Scrivener%2C+A+Course+of+Divinity...+%28London%3A+Roycroft%2C+1674%29%2C+pt.+1%2C+bk.+1%2C+ch.+17%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4aa73838b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4aa73838b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=For%20good%20works%20are%20fruitful%20not,abound%20to%20your%20account.%E2%80%99%20%28Phil.%202%3A7&amp;text=For%20good%20works%20are%20fruitful%2

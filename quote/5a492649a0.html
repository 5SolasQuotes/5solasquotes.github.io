<main class="wrap"><figure class="quote" id="q-5a492649a0" data-kw="">
<blockquote><p>The authority of the Word is derived from the Word itself. The church cannot be the foundation upon which one believes that the Scriptures are the Word of God, for: First, the church derives all its authority from the Word. … Thus, we do not believe the Word to be the Word of God because the church affirms it, but on the contrary, we believe the church to be the true church because the Word validates her as such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian&#x27;s Reasonable Service</cite>, vol. 1, ch. 2, p. 29</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01d018d5b8" data-kw="">
<blockquote><p>The Scripture we own as the only rule of our faith, as the only treasury of all sacred truths. … The sole inquiry is, whether this supreme teacher be the Spirit of God instructing us in and by the Scripture, or whether it be the authority of this or that, any or all of the churches in the world, which either are so or pretend to be so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 3</span></figcaption>

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Answer before the Diet of Worms</cite>, 18 April 1521</span></figcaption>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

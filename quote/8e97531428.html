<main class="wrap"><figure class="quote" id="q-8e97531428" data-kw="">
<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law:

1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people.

2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law.

3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, vol. 2, p. 108, section 40, ‘Of the law of paying tithes,’ on Heb. 7:5-7 Gouge (d. 1653) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?

2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively.

3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>

</figure><figure class="quote" id="q-7760eefc11" data-kw="">
<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>

<blockquote><p>XV…

1. As the holy blessing, whose formula is found in Numbers 6, is an invocation of God, from whom all good things are desired for those who receive the blessing, so too is the Christian salutation a prayer, a form of invocation, through which, by faith and charity, we earnestly pray for the best things for others.

2. It is also a support for fellowship and an indication of charity.

3. And it should be done especially for the Holy Church, devout families, and individual believers.</p></blockquote>

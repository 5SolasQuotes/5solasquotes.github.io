</figure><figure class="quote" id="q-d400a62bf4" data-kw="">
<blockquote><p>The first step towards what might be called the re-organisation of the [United] Societies appears to have been taken by Robert Hamilton, who had been on the Continent from 1679 to 1688, and who had constituted himself the leader in opposition to the movements proposed by the ‘ministers and majority of the people’ during the two years after the [Glorious] Revolution [of 1689]. All who did not approve his views were guilty of ‘gross defections.’ …when the first General Meeting was held after the issue of this paper [in 1691], it was found that there were tares among the wheat. “When gathered and searching into one another’s judgement as to the state of the testimony,” says the writer of the Informatory Vindication [of 1691(?)], ‘We found ourselves to be but a mix’d company,” and consequently, before anything was done, they had to ‘purge their meetings from all such as had sinfully joined with the courses of the times and were defending the same.’… How many were removed at the ‘purging’ is also unknown, but they must have formed a considerable proportion of the body… The Societies seem to have done very little without causing controversy in their own ranks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenanters after the Revolution of 1688’ (Scottish Church History Society, 1950)</cite>, pp. 144-45</span></figcaption>

</figure><figure class="quote" id="q-fde2a653f4" data-kw="">
<blockquote><p>When I speak of this divine ordinance of church government, my meaning is not to allow, much less to animate any in the too severe and over-strict exercise of ecclesiastical discipline and censures. It was observed by Jerome (Ad Marcellum), as one of the errors of the Montanists: Illi ad omne pene delictum ecclesiae obserant fores, They shut the church door (that is, they excommunicate and shut out of the church) almost at every offence. I confess the greater part are more apt to fail in the defect than in the excess, and are like to come too short rather than to go too far. Yet a failing there may be, and has been, both ways… My purpose and endeavor shall be… to own the thing, to disown the abuses of the thing, to point out the path of Christ’s ordinance without allowing either rigour against such as ought to be tenderly dealt with, or too much lenity towards such as must be saved with fear, and pulled out of the fire, or at all any aberration to the right or left hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming, ‘To the Reader’</cite>, p. xix</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

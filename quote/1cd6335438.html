<main class="wrap"><figure class="quote" id="q-1cd6335438" data-kw="">
<blockquote><p>With what show of reason can it be said that a symbol [creed] containing such declarations as these respecting the nature and attributes of God, his requirement that every man confess sin to Him, repent of it, pray for its forgiveness and trust in his mercy, contains no announcement of his infinite love and compassion [to all men]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-shedd.html">William Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (1893)</cite>, pp. 25-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

— William Shedd, Calvinism: Pure &amp; Mixed (1893), pp. 25-29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWith+what+show+of+reason+can+it+be+said+that+a+symbol+%5Bcreed%5D+containing+such+declarations+as+these+respecting+the+nature+and+attributes+of+God%2C+his+requirement+that+every+man+confess+sin+to+Him%2C+repent+of+it%2C+pray+for+its+forgiveness+and+trust+in+his+mercy%2C+contains+no+announcement+of+his+infinite+love+and+compassion+%5Bto+all+men%5D%3F%E2%80%9D%0A%0A%E2%80%94+William+Shedd%2C+Calvinism%3A+Pure+%26+Mixed+%281893%29%2C+pp.+25-29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1cd6335438.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1cd6335438.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/common-grace#:~:text=With%20what%20show%20of%20reason%20can,love%20and%20compassion%20%5Bto%20all%20men%5D%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ddd2ba5cf" data-kw="">
<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology, Part I, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

arget="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3064123999" data-kw="">
<blockquote><p>Wherefore, whosoever in the preaching of the Gospel, are charged and commanded to repent, to believe in Christ, or turn unto God, they are commanded also to use all these external means [“hear a Sermon preached, to read the Scripture, to be informed by Catechizing, and conference of Religion…”] whereby they may be informed of the duty required, and of the means leading thereunto; in the exercise of which external means, they may meet with sundry common operations and effects of God’s Spirit, before they be regenerate or converted, whereof the use may be sound not only in, but also after, conversion; And if any man shall refuse, slight or neglect to follow these preparatory exercises, which may prepare him for conversion, he is inexcusable before God and man, and guilty of rejecting of the offer of reconciliation, yea guilty of resisting of the Holy Ghost, of which sin and guiltiness the holy martyr Stephen charges the misbelieving Jews, 8. As for the regenerate man, he it is who in the acknowledgement of his sinfulness and deserved misery, and of his utter inability to help himself, does cast away all confidence in his own parts, and possible righteousness of his own works, and flees to Christ offered in the Gospel…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/therapeutica-sacra.html">Therapeutica Sacra</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, Chapter 3</cite></span></figcaption>

</figure><figure class="quote" id="q-67c096ad66" data-kw="">
<blockquote><p>In point of fact, the Old Testament has a great deal to teach on the benevolent side of God’s self-revelation to the world at large. The strongest of terms are used on occasion to emphasize this truth. Even the covenant conception is not deemed too sacred to be employed for the purpose of describing the solemn manner in which God pledged to the whole of creation, in the day of Noah, His abundant, ever-flowing kindness in the sphere of natural life, His longsuffering in the view of universal sin, His common grace working for the restraint of sin. It is attributed to His righteousness, universally revealed, that He keeps this covenant and preserves man and beast. As Jonah took pity on his gourd, so He pities and spares the Ninevites and their cattle. His mercy is wider and deeper than the ocean of human misery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Doctrine of the Love of God in The Presbyterian &amp; Reformed Review 13:1-37 (1902)</cite>, p. 11</span></figcaption>

</figure><figure class="quote" id="q-dca7db9516" data-kw="">
<blockquote><p>The Lord therefore did raise up his prophet Malachi (who was the last before Christ) sharply to rebuke, and plainly to convict this horrible ingratitude of that unthankful nation, who so shamefully had forgotten those so great benefits recently bestowed upon them. And thus begins he his prophecy: “I have loved you, sayeth the Lord,” in which words he speaks not of a common love, which in preserving and feeding all creatures is common to the reprobate, but of that love by the which he had sanctified and separated them from the rest of nations, to have his glory manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On Predestination” in The Works of John Knox, ed. David Laing (Edinburgh: J. Thin, 1895)</cite>, 5:150-51</span></figcaption>

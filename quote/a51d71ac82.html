<main class="wrap"><figure class="quote" id="q-a51d71ac82" data-kw="">
<blockquote><p>The second consideration which we would have the Christian to take along with him when he begins to study the mercy and love of God is this: know that it is natural and native for Him to love; justice is his strange act, Isa. 28:21, importing his great unwillingness to be much taken up in the exercise of that attribute of justice. If we would ask the question, What is God? we could have no answer so suitable and pertinent to it as that which He has given Himself, He is merciful and loving. It is his great design, and likewise his desire, to be taken up in his attribute of mercy… And we conceive, that which does eminently declare how much God delights in mercy, and how natural it is for Him to love, is this: that notwithstanding there was a strong and invincible impediment laid in the way of the exercise of the attribute of mercy (which if angels and men had attempted to have loosed, should eternally have crushed and depressed them into the lowest hell), yet love was not hindered in its exercise by this strong impediment. O blessed be that love, for it was strong; and that good will, for it was wonderful: that when there was such an impediment laid in the way, it did put wisdom in exercise to find out the way how it might exercise itself towards man without leaving an imputation on justice! It likewise put omnipotent power to exercise, that it might exercise the decrees of wisdom that were such a holy and divine restraint on the love of God; and before the curse was proclaimed towards man for the breach of his holy law, love did propose the way how that everlasting curse, which man by his own hand had wrapped about his own neck, might be taken away…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works… (d. 1656; Aberdeen: King, 1839)</cite>, pp. 455-56</span></figcaption>

</figure><figure class="quote" id="q-c8942359ec" data-kw="">
<blockquote><p>It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Reality and Efficacy of Divine Grace” (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988)</cite>, 2:554</span></figcaption>

<blockquote><p>The words of the apostle, ‘God will have all men to be saved, etc.’ [1 Tim. 2:4] can be understood in three ways: Third, according to [John] Damascene (Of the Orthodox Faith, 2.29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 19, article 6, Whether the will of God is always fulfilled?, reply to objection 1</cite></span></figcaption>

ive%2C+to+wit%2C+inasmuch+as+he+is+a+man.+Such+a+qualified+will+may+be+called+a+willingness+rather+than+an+absolute+will.+Thus+it+is+clear+that+whatever+God+simply+wills+takes+place%3B+although+what+He+wills+antecedently+may+not+take+place.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+pt.+1%2C+quest.+19%2C+article+6%2C+Whether+the+will+of+God+is+always+fulfilled%3F%2C+reply+to+objection+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5dc100afcf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5dc100afcf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20words%20of%20the%20apostle%2C%20%E2%80%98God,wills%20antecedently%20may%20not%20take%20place&amp;text=The%20words%20of%20the%20apostle%2C%20%E2%80%98God%20will%20have&amp;text=what%20He%20wills%20antecedently%20may%20not%20take%20place" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

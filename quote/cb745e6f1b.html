<main class="wrap"><figure class="quote" id="q-cb745e6f1b" data-kw="">
<blockquote><p>13. There is therefore some notable difference between that work of the Spirit by which we first repent and believe, and so have our title to the promise of the Spirit, and that gift of the Spirit which is promised to believers: which is not only the Spirit of miracles given in the first times, but some notable degree of love to our reconciled Father, suitable to the grace and Gospel of redemption and reconciliation, and is called the Spirit of Christ, and the Spirit of adoption (Rom. 8:9, 16, •5.), which the apostles themselves seem not to have received till Christ’s ascension: And this seems to be not only different from the gifts of the Spirit common to hypocrites and unbelievers, but also from the special gift of the Spirit which makes men believers: So that Mr. Thomas Hooker says truer than once I understood, that vocation is a special grace of the Spirit, distinct from common grace on one side, and from sanctification on the other side. Whether it be the same degree of the Spirit which the faithful had before Christ’s incarnation, which causes men first to believe, distinct from the higher following degree, I leave to enquiry: But the certainest distinction is from the different effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-8d1426d071" data-kw="">
<blockquote><p>And from our own [reformed] writers [on regeneration]: the treatise of William Whately on regeneration; the sermon of Obadiah Sedgwick on Rev. 3:1-3; Nicolas Byfield’s Principia Fidei [Principles of Faith], ch. 25; the various opuscula [small works] of Paul Baynes; Thomas Hooker on the humiliation of the soul, on the preparation of the soul for Christ, on the union of the soul with Christ, etc.; and writers on the practice of repentance: Perkins, Stock, Daniel Dyke, Arthur Dent… They are to be read, however, with this judgment: that one aim at the distinctions hitherto brought by us, and consider that the concepts of the practical writers—if not all, at least most—are to be referred to the second moment of regeneration and to actual conversion, whether first or renewed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

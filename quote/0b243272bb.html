<blockquote><p>The command to believe the Gospel is universal, but its promises are particular. This is a point of very great disagreement between the Lutherans and us. For they teach that those who receive the commandment to believe do also receive the promise. But this is not true, because the commandment pertained to all Israelites, but not so the promise, Rm 9.8. Only some of them are called the children of the promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: On Theological and Philosophical Distinctions and Rules</cite>, PIRef 4, trans. Willem J. van Asselt et al, ed. William den Boer (1656; Apeldoorn: Institute for Reformation Research, 2009), 3.7, p. 99.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d3d08eca5" data-kw="">
<blockquote><p>The third use is for reproof of those that hold outward government essentially necessary to the Church, as if the Church without this could have no being at all. I for my part desire, and would gladly go as far as I see Christ and his apostles have gone before me; and where they stay, there would I stay too. I find that the Church can never be long nor well without government, but yet it may be sometimes without it, and yet be a true Church. It is true of the inward government, for where that is not, it is not possible that the Church should have any being at all, but it is not so of the outward. Therefore we must rightly distinguish betwixt the inward and the outward government, otherwise we shall run into many absurdities: First, the inward is merely spiritual, the outward is for the most part bodily, that is, such as affects the ear, or the eye, or some other parts; only it is thus far spiritual, in regard of the end it aims at, that is, to make us spiritually minded. Secondly, the inward is proper to God, and reserued to Him only; the outward, though it be from God too, yet it is committed to the administration of men. Thirdly, the inward is peculiar to the faithful and elect alone, God rules in their hearts and consciences, justifying and sanctifying them, and none others; the outward is common to all that profess themselves to be members, though they be hypocrites. Fourthly, the inward is the highest and principal, the outward is but a serviceable dispensation fitted to the inward. Fifthly, the inward seconds the outward, and makes it effectual and fruitful; the outward does but lead vs by the hand (as it were) to the inward. I note this difference the rather, because many men do clamorously exclaim that Christ is robbed of the one half of his kingdom when that outward form which they pretend is not observed. And this is the Brownists’ exception: ‘You’ (say they) ‘deny Christ to be your King, because you own not his discipline which He has prescribed.’ I am with the apostle: God’s kingdom consists not of meats and drinks, and of outward rites, but of righteousnesse and peace, and joy in the Holy Ghost. [Rom. 14] The principal part of God’s kingdom is when He rules by his Spirit in the hearts of his children: and therefore if there were any such discipline prescribed by the Word as they pretend, yet we should not lose the one half of Christ’s kingdom, though it were not observed. Happily it is not known to them that do not observe it; and then it is no rebellion; if it be knowne by them, the sin is much the greater, if it be not observed. But yet Christ may still exercise his Kingdom in the hearts of many members of the Church by his Spirit, though this were wanting. The case may seem to be well paralleled by our outward and inward worship in prayer: The outward worship is but an appurtenance to the inward, for the inward may be true without the outward. And so discipline is rather an appurtenance to God’s kingdom, than the kingdom itself; so that we see that God’s Church may be without discipline, though it cannot be well nor long without it; where outward government is wanting, the Church may be defective and maimed, yea half-dead in outward show at least, and yet a true Church still. Yet, but are not the Word and the sacraments parts of the outward government, and they are necessary to the very being of the Church. Therefore some part of the outward government is essential to the Church. I answer: That they are not necessary to themselves, but by accident, because they 〈…〉to the inward, as that it cannot be without this. And besides, the Word and the sacraments are not so much of the outward government of themselves, but rather the carriage and manner of using of them is of the outward government. Lastly, I answer, they are simply necessary, as they are the causes and gathering of the Church, but not as they are parts of outward government. As Moses his message and gathering of the Israelites to the Lord was one thing, his governing of them another. So that the Word and sacraments must be considered in both these respects, and so in respect of gathering the Church, they are simply necessary, not in respect of governing of it. So that outward government is not simply necessary to the being of the Church, but to the well-being only.</p></blockquote>

<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

<blockquote><p>Justly may this reprove Scotland this day and darken all our faces before the Lord, for all the sins He hath written upon our judgments, as it were, in legible letters, and yet we never read our sins that we have wickedly and inhumanely committed against Christ and His interest; either our personal sins against the Lord, or our public defections and backslidings from our covenant engagements, and national obligations to him.</p></blockquote>

</figure><figure class="quote" id="q-1b00e652a0" data-kw="">
<blockquote><p>The similarity [of the determination of the synod in the morning] to the Irish [Pacific] Act [1720] is apparent [which expressly allowed for exceptions], and in the context, especially given [Thomas] Craighead’s involvement, it is certain that it served as the source for the Committee’s proposal… in light of the actual overture by [John] Thomson, which stipulated the two needs [of subscription and adopting a confession], it makes more sense to see the morning session establishing the requirement and terms of subscription and the afternoon session as the formal adoption by the Synod [of the Westminster Confession]. In other words, the Synod’s adopting of the Confession is distinguished from the requirement for subscription and later debates in the American Church has been the result of not recognizing the distinction. The ‘preliminary’ or morning session is the only one to explicitly require subscription. Moreover, allowing presbyteries to judge scruples would be nonsense had the Synod intended to decide what scruples would be allowed in the afternoon session.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-scott-sealy.html">Charles Scott Sealy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis</cite>, (Univ. of Glasgow, 2010), pp. 169-28 | ch. 5, ‘The Synod of Philadelphia &amp; the Adopting Act (1729)’, pp. 179-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

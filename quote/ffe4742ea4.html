<main class="wrap"><figure class="quote" id="q-ffe4742ea4" data-kw="">
<blockquote><p>The Divine One is himself the Good (in the primary and proper sense of the word), whose very nature is goodness. This he is and he is so named, and is known by this nature. Since, then, it has not been demonstrated that there is any limit to virtue except evil, and since the Divine does not admit of an opposite, we hold the divine nature to be unlimited and infinite.

Certainly whoever pursues true virtue participates in nothing other than God, because he is himself absolute virtue. Since, then, those who know what is good by nature desire participation in it, and since this good has no limit, the participant’s desire itself necessarily has no stopping place but stretches out with the limitless.</p></blockquote>

</figure><figure class="quote" id="q-ec775f75de" data-kw="">
<blockquote><p>Some people take shelter in a notion of universal love. They say, ‘God loves everyone, and therefore everything will turn out all right in the end for me.’ But there’s a very solemn verse in the Bible, ‘Jacob have I loved, but Esau have I hated’ (Romans 9:13). I’m not saying that there’s anyone in the room of mercy who should come to the conclusion that God has hated them. Satan may be saying to some anxious soul, ‘There’s no hope for you because God has hated you.’ No one in the room of mercy, no one under the sound of the gospel, no one anxious about their soul, has any reason to come to that conclusion. And may God give grace to resist coming to that conclusion in a way that would prevent a person from seeking the Lord and seeking his mercy.

But what we can say is that you have no reason to believe the Lord has loved you until you’re found embraced in that love in the person of Christ. We cannot take it for granted. We cannot say God loves everyone. ‘I have loved thee’ is something very particular, something very personal, and we cannot rest until it becomes particular and personal to ourselves. The love of God is a very particular, distinguishing, personal thing toward a sinner, so that a person has to make sure they have a reason for believing it with regard to themselves.

And one other thing about this love of God toward the sinner — he says it’s everlasting. It had no beginning. With God, everlasting things have no beginning. God is the everlasting God. ‘From everlasting to everlasting, thou art God’ (Psalm 90: 2). There was no beginning to God. We can’t really grasp that. That’s something beyond our understanding— someone who has no beginning. We can understand in a measure something having no end — we know that that’s true of us. People try to blot out the idea of eternity, the idea of living beyond this world. But anyone who’s heard the gospel — and even anyone who hasn’t — when they listen to the underground noises in their own consciences and souls, they have this feeling — this fear, perhaps, this anxiety — that there’s no end. Yes, there was a beginning, but there’s no end. We can grasp that. But we can’t grasp the concept of ‘no beginning’.

And yet, God had no beginning. And God’s love ‘for thee’ — for the child of God, for the sinner saved by grace — had no beginning either. It wasn’t that there came a time in the experience of God when he began to love — no, God has loved eternally. Everlasting love. And that love is never withdrawn. It has never been removed from its objects. Even when he chastens them, even when he hides himself from them, even when they fear that the Lord has forgotten to be gracious and that he has shut up his tender mercies in his wrath — even then, this love is everlasting, it doesn’t change. It’s never withdrawn from its objects. And it has no end. It’ll never come to an end. Its consequences, its effects, will never come to an end. ‘I have loved thee with an everlasting love.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-m-cartwright.html">Hugh M. Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>With An Everlasting Love: Selected Sermons of Rev Hugh M. Cartwright</cite>, ed. Robert Dickie (Stornoway: Reformation Press, Kindle edition, 2015), pp 16-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.”

— Horatius Bonar, Night of Weeping, ch. XIV, “The Consolation,”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAffliction+is+the+expression+of+paternal+love.+It+is+from+the+deepest+recess+of+the+fountain+of+love+that+sorrow+flows+down+to+us.+And+love+cannot+wrong+us.+It+blesses%2C+but+cannot+curse.+Its+utterances+and+actions+are+all+of+peace+and+gladness.+It+wants+a+larger+vessel+into+which+to+empty+itself%2C+and+a+deeper+channel+through+which+to+flow.+That+is+all.+It+seeks+to+make+us+more+susceptible+of+kindness%2C+and+then+to+pour+that+kindness+in.+Yes%2C+love+is+the+true%2C+the+one+origin+of+the+sharpest+stroke+that+ever+fell+upon+a+bleeding+heart.+The+truth+is%2C+there+is+no+other+way+of+accounting+for+affliction+but+this.+Anger+will+not+account+for+it%2C+forgetfulness+will+not+account+for+it%2C+chance+will+not+account+for+it.+No.+It+is+simply+impossible+to+trace+it+to+any+cause+but+love.+Admit+this+as+its+spring%2C+and+all+is+harmonious%2C+comely%2C+perfect.+Deny+it%2C+and+all+is+confusion%2C+cruelty%2C+and+darkness.%E2%80%9D%0A%0A%E2%80%94+Horatius+Bonar%2C+Night+of+Weeping%2C+ch.+XIV%2C+%E2%80%9CThe+Consolation%2C%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fba0d123cd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ba0d123cd8.html">Permalink</a><a class="src" href="https://archive.org/details/nightofweepingor00bonaiala" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>

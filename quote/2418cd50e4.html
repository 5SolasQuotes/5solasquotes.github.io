<main class="wrap"><figure class="quote" id="q-2418cd50e4" data-kw="">
<blockquote><p>Salvation we know is to be conferred on none of ripe years but such as believe and repent; and undoubtedly if all and every one should believe and repent, all and every one should be saved by Him: on the other side, if not one should believe and repent, not one should be saved by Him.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8911ffa2a" data-kw="">

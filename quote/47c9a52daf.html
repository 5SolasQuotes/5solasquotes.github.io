<main class="wrap"><figure class="quote" id="q-47c9a52daf" data-kw="">
<blockquote><p>…the nature of those eternal transactions… And these were carried on “per modum foederis,” “by way of covenant,” compact, and mutual agreement, between the Father and the Son; for although it should seem that because they are single acts of the same divine understanding and will, they cannot be properly federal [between different parties], yet because those properties of the divine nature are acted distinctly in the distinct persons, they have in them the nature of a covenant… And therefore are those counsels of the will of God, wherein lies the foundation of the priesthood of Christ, expressly declared as a covenant in the Scripture; for there is in them a respect unto various objects and various effects, disposed into a federal relation one to another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/covenant-of-redemption/counsel-of-peace.html">Counsel of Peace</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c8d993d61" data-kw="">
<blockquote><p>Assertion 3. There be two things in the Law:

1. The authority and power to command, direct, and regulate the creature to an end, in acts of righteousness and holiness.

2. A secondary authority, to punish eternally the breakers of the Law and to reward those that obey. These are two different things: suppose Adam had never sinned: the Law had been the Law; and suppose Adam had never obeyed: the Law also should have been the Law; and in the former case there should have been no punishment, in the latter no reward. … Crisp and his followers are far wide, for Christ died freely out of extreme love and yet He died out of a command laid on Him, to lay down his life for his sheep though no penal power was above Christ’s head to punish Him if He should not die, Jn. 10:18. Nor was there need of any power to force Him subpena [under penalty], or to awe Him if He should not obey; so do angels, with wings of most exact willingness, obey God, yet are they under the authority of a Law and command, but yet under no compelling punishment, Ps. 103:20-21; 104:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pp. 273-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/covenant-of-redemption/counsel-of-peace.html">Counsel of Peace</a></span></div>

3B%20104%3A4" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 87-88</span></figcaption>

<blockquote><p>4. I have perused the larger Catechism of the Assembly, and judge it a most excellent sum of divinity: and so much the more excellent, in that it is sparing in the difficult and more abstruse part, and most full in the practical part: And I find no word that I dissent from, so I may have leave but to interpret four words, as follows: 1. Where it is said, that the Covenant of Grace was made with Christ, as the second Adam, and in Him, with all the elect. I understand it of the genus of the Covenant, one species being made with Christ, and another with man, and not as if it were one and the same Covenant in specie that was made with Christ and with man: though I acknowledge that the promise made to Christ contained the salvation of his elect as the matter of it.</p></blockquote>

<blockquote><p>…in the good ol’ seventeenth century, Reformed theologians held to the principle of attributing ad extra works [all works directed externally outside of God to the creation] to all the persons of the Trinity. However, divines such as John Owen and Thomas Goodwin, to name just two of many, argued that certain outward works – depending on what they are – are more peculiarly attributed to one of the persons. This is also referred to as the doctrine of appropriations. Goodwin echoes this principle elsewhere: ‘In this will that common Axiome of Divines helps us, that what works all three Persons do towards us Ad extra, though they have all a joint hand in them, yet they are attributed more especially to one Person than to another; as Sanctification you know is attributed more especially to the Holy Ghost, Redemption to the Son, Creation to God the Father, though all Three Persons have a hand in it.’ That is to suggest that the persons all share a common prerogative, but often a certain work will be attributed to the Father, for example, in order to display his uniqueness. Both Goodwin and Owen wrestle with how this relates to the incarnation of the Son of God. So, for example, while some Divines attribute to the Spirit ‘the special Honour of tying that Marriage knot, or Union, between the Son of God, and that Man Jesus’, Goodwin believes that ‘that Action is more peculiarly to be Attributed to the Son Himself; as Second Person; who took up into one Person with Himself that Humane Nature’ (Heb. 2:16). Of course, Goodwin agrees that if they argue on the basis that the external works of the Trinity are undivided, there is no conflict. But, in Goodwin’s mind, it was ‘the Son’s Special Act … to assume [human nature]’. This is precisely what I say in the quote from Knowing Christ (p. 27). Owen argues that it was an outward act (ad extra) of the triune God, ‘As unto original efficiency’. However, ‘As unto authoritative designation, it was the act of the Father…. As unto the formation of the human nature, it was the peculiar act of the Spirit…. As unto the term of the assumption, or the taking of our nature unto himself, it was the peculiar act of the person of the Son.’ Essentially, Goodwin and Owen are claiming that the undivided works ad extra often manifest one of the persons as their terminus operationis [end of operation]. In the above example, the incarnation terminates on the Son though the act is (singularly) willed by the three persons of the Trinity. … If the Son did not decide to assume a human nature, then who did? God did, but, alas, dat old debbel [terminus operationis].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jones.html">Mark Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dat Old Debbel Tritheism?’</cite>, (2017) Jones’ context is not specifically about the Covenant of Redemption, but as may be seen, his discussion very much applies to it.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/covenant-of-redemption/counsel-of-peace.html">Counsel of Peace</a></span></div>
<div class="actions"><button class="copy" data-copy="“…in the good ol’ seventeenth century, Reformed theologians held to the principle of attributing ad extra works [all works directed externally outside of God to the creation] to all the persons of the Trinity. However, divines such as John Owen and Thomas Goodwin, to name just two of many, argued that certain outward works – depending on what they are – are more peculiarly attributed to one of the persons. This is also referred to as the doctrine of appropriations. Goodwin echoes this principle elsewhere: ‘In this will that common Axiome of Divines helps us, that what works all three Persons do towards us Ad extra, though they have all a joint hand in them, yet they are attributed more especially to one Person than to another; as Sanctification you know is attributed more especially to the Holy Ghost, Redemption to the Son, Creation to God the Father, though all Three Persons have a hand in it.’ That is to suggest that the persons all share a common prerogative, but often a certain work will be attributed to the Father, for example, in order to display his uniqueness. Both Goodwin and Owen wrestle with how this relates to the incarnation of the Son of God. So, for example, while some Divines attribute to the Spirit ‘the special Honour of tying that Marriage knot, or Union, between the Son of God, and that Man Jesus’, Goodwin believes that ‘that Action is more peculiarly to be Attributed to the Son Himself; as Second Person; who took up into one Person with Himself that Humane Nature’ (Heb. 2:16). Of course, Goodwin agrees that if they argue on the basis that the external works of the Trinity are undivided, there is no conflict. But, in Goodwin’s mind, it was ‘the Son’s Special Act … to assume [human nature]’. This is precisely what I say in the quote from Knowing Christ (p. 27). Owen argues that it was an outward act (ad extra) of the triune God, ‘As unto original efficiency’. However, ‘As unto authoritative designation, it was the act of the Father…. As unto the formation of the human nature, it was the peculiar act of the Spirit…. As unto the term of the assumption, or the taking of our nature unto himself, it was the peculiar act of the person of the Son.’ Essentially, Goodwin and Owen are claiming that the undivided works ad extra often manifest one of the persons as their terminus operationis [end of operation]. In the above example, the incarnation terminates on the Son though the act is (singularly) willed by the three persons of the Trinity. … If the Son did not decide to assume a human nature, then who did? God did, but, alas, dat old debbel [terminus operationis].”

— Mark Jones, ‘Dat Old Debbel Tritheism?’ (2017) Jones’ context is not specifically about the Covenant of Redemption, but as may be seen, his discussion very much applies to it.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6in+the+good+ol%E2%80%99+seventeenth+century%2C+Reformed+theologians+held+to+the+principle+of+attributing+ad+extra+works+%5Ball+works+directed+externally+outside+of+God+to+the+creation%5D+to+all+the+persons+of+the+Trinity.+However%2C+divines+such+as+John+Owen+and+Thomas+Goodwin%2C+to+name+just+two+of+many%2C+argued+that+certain+outward+works+%E2%80%93+depending+on+what+they+are+%E2%80%93+are+more+peculiarly+attributed+to+one+of+the+persons.+This+is+also+referred+to+as+the+doctrine+of+appropriations.+Goodwin+echoes+this+principle+elsewhere%3A+%E2%80%98In+this+will+that+common+Axiome+of+Divines+helps+us%2C+that+what+works+all+three+Persons+do+towards+us+Ad+extra%2C+though+they+have+all+a+joint+hand+in+them%2C+yet+they+are+attributed+more+especially+to+one+Person+than+to+another%3B+as+Sanctification+you+know+is+attributed+more+especially+to+the+Holy+Ghost%2C+Redemption+to+the+Son%2C+Creation+to+God+the+Father%2C+though+all+Three+Persons+have+a+hand+in+it.%E2%80%99+That+is+to+suggest+that+the+persons+all+share+a+common+prerogative%2C+but+often+a+certain+work+will+be+attributed+to+the+Father%2C+for+example%2C+in+order+to+display+his+uniqueness.+Both+Goodwin+and+Owen+wrestle+with+how+this+relates+to+the+incarnation+of+the+Son+of+God.+So%2C+for+example%2C+while+some+Divines+attribute+to+the+Spirit+%E2%80%98the+special+Honour+of+tying+that+Marriage+knot%2C+or+Union%2C+between+the+Son+of+God%2C+and+that+Man+Jesus%E2%80%99%2C+Goodwin+believes+that+%E2%80%98that+Action+is+more+peculiarly+to+be+Attributed+to+the+Son+Himself%3B+as+Second+Person%3B+who+took+up+into+one+Person+with+Himself+that+Humane+Nature%E2%80%99+%28Heb.+2%3A16%29.+Of+course%2C+Goodwin+agrees+that+if+they+argue+on+the+basis+that+the+external+works+of+the+Trinity+are+undivided%2C+there+is+no+conflict.+But%2C+in+Goodwin%E2%80%99s+mind%2C+it+was+%E2%80%98the+Son%E2%80%99s+Special+Act+%E2%80%A6+to+assume+%5Bhuman+nature%5D%E2%80%99.+This+is+precisely+what+I+say+in+the+quote+from+Knowing+Christ+%28p.+27%29.+Owen+argues+that+it+was+an+outward+act+%28ad+extra%29+of+the+triune+God%2C+%E2%80%98As+unto+original+efficiency%E2%80%99.+However%2C+%E2%80%98As+unto+authoritative+designation%2C+it+was+the+act+of+the+Father%E2%80%A6.+As+unto+the+formation+of+the+human+nature%2C+it+was+the+peculiar+act+of+the+Spirit%E2%80%A6.+As+unto+the+term+of+the+assumption%2C+or+the+taking+of+our+nature+unto+himself%2C+it+was+the+peculiar+act+of+the+person+of+the+Son.%E2%80%99+Essentially%2C+Goodwin+and+Owen+are+claiming+that+the+undivided+works+ad+extra+often+manifest+one+of+the+persons+as+their+terminus+operationis+%5Bend+of+operation%5D.+In+the+above+example%2C+the+incarnation+terminates+on+the+Son+though+the+act+is+%28singularly%29+willed+by+the+three+persons+of+the+Trinity.+%E2%80%A6+If+the+Son+did+not+decide+to+assume+a+human+nature%2C+then+who+did%3F+God+did%2C+but%2C+alas%2C+dat+old+debbel+%5Bterminus+operationis%5D.%E2%80%9D%0A%0A%E2%80%94+Mark+Jones%2C+%E2%80%98Dat+Old+Debbel+Tritheism%3F%E2%80%99+%282017%29+Jones%E2%80%99+context+is+not+specifically+about+the+Covenant+of+Redemption%2C+but+as+may+be+seen%2C+his+discussion+very+much+applies+to+it.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1a901aecd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1a901aecd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-covenant-of-redemption/#:~:text=in%20the%20good%20ol%E2%80%99%20seventeenth%20century,alas%2C%20dat%20old%20debbel%20%5Bterminus%20operationis&amp;text=in%20the%20good%20ol%E2%80%99%20seventeenth%20century%2C%20Reformed%20theologians&amp;text=did%2C%20but%2C%20alas%2C%20dat%20old%20debbel%20%5Bterminus%20operationis" rel=

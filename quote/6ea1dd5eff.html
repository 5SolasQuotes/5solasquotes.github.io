<main class="wrap"><figure class="quote" id="q-6ea1dd5eff" data-kw="">
<blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause. It pertains to the intellect and will in such a way that the intellect judges and shows what should be done, but the will commands what is shown and judged, and thus at root it has reference to the intellect, but formally it has reference to the will. This certainly implies some indifference, in a divided sense, as they say, by which, with the consideration of the divine decree and predetermination set aside, man is indifferent at least by nature to acting or not acting; yet he is not indifferent in a composite sense, with regard to the divine decree and its predetermining providence, but is already determined virtually to one or the other; much less does choice consist in indifference itself. For in this way neither God, nor angel, nor any man, regenerate or unregenerate, would possess free choice, and consequently free choice would be a non-entity. For God is determined to good… And so arbitrium, choice, is more correctly said to consist in the power of acting from counsel and προαίρεσις, free choosing, or what is the same thing, in rational complacency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3, bk. 4, ch. 4, ‘The Penalty &amp; State of Sin’, section 10</cite>, p. 526</span></figcaption>

</figure><figure class="quote" id="q-3a7a08b9ad" data-kw="">
<blockquote><p>Farther this Pigghius reasons and says that this desire which Augustine calls concupisence is a work of nature and of God: and therefore it cannot be counted sin. But we have before answered that it comes not from the grounds of nature as it was instituted by God, but of nature corrupted. For man, when he was created, was made right and (and as the scripture says) to the image of God. Wherefore that desire of things pleasant and preservative in Adam, when he was first created, was not outrageous or vehement, to be against right reason and the word of God: for, that followed afterward. Wherefore we ought not to call it the work of God (as Pigghius says) but the wickedness of sin and corruption of affections.</p></blockquote>

<blockquote><p>XXIII. However, they insist that the immortality which befitted man in his original integrity should rather be called natural than supernatural, and indeed that the first man was in some sense naturally immortal… … XXVII. Nor do the theologians of the Roman School, as we have shown above, deny that the immortality which belonged to the first man before sin can in some respect and sense be called natural, namely, in so far as natural signifies what is inherent from the first origin and not adventitious and superadded. Also, in so far as natural is opposed to what is contrary to nature and signifies what adorns and perfects the same nature. XXVIII. The only remaining question is whether this immortality should be called natural or supernatural with respect to integral man, speaking simply. Protestants affirm this, while the Doctors of the Roman School deny it.</p></blockquote>

Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f28dcd04b0" data-kw="">
<blockquote><p>The nature of a thing: not how it is, but how it is meant to be… It is as though a physician who saw only broken arms assumed that if arms have no fractures there must be something wrong with them. How could we correct such a misguided physician? By calling his attention to the purpose or function of the arms, to their proper work. Broken arms cannot do their work as well as intact ones; therefore, brokenness is not their natural state. The nature of a thing is not determined by how something happens to be, but by what it is for — by what it is designed to do and to become, if everything goes well… What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. …potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. Another reason why the expression ‘potentiality for fatherhood’ requires explanation is that although siring children is the most characteristic expression of fatherhood, it is far from its only expression… We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them… although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ I am saying that for men, the reality is parallel. Not every man is called to marry and bear physical children, but every man, whether married or unmarried, is called upon to be a biological, psychological or spiritual father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-budziszewski.html">J. Budziszewski</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What makes Men Men?’, pt. 1 (2019)</cite></span></figcaption>

— J. Budziszewski, ‘What makes Men Men?’, pt. 1 (2019)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+nature+of+a+thing%3A+not+how+it+is%2C+but+how+it+is+meant+to+be%E2%80%A6+It+is+as+though+a+physician+who+saw+only+broken+arms+assumed+that+if+arms+have+no+fractures+there+must+be+something+wrong+with+them.+How+could+we+correct+such+a+misguided+physician%3F+By+calling+his+attention+to+the+purpose+or+function+of+the+arms%2C+to+their+proper+work.+Broken+arms+cannot+do+their+work+as+well+as+intact+ones%3B+therefore%2C+brokenness+is+not+their+natural+state.+The+nature+of+a+thing+is+not+determined+by+how+something+happens+to+be%2C+but+by+what+it+is+for+%E2%80%94+by+what+it+is+designed+to+do+and+to+become%2C+if+everything+goes+well%E2%80%A6+What+are+men+and+women+for%3F+In+one+respect+they+are+for+the+same+thing%3A+Being+rational%2C+they+are+for+the+knowledge+of+the+truth%2C+especially+the+truth+about+God.+But+there+is+a+difference.+A+man+is+a+rational+being+of+that+sex+whose+members+are+potentially+fathers%2C+and+a+woman+is+a+rational+being+of+that+sex+whose+members+are+potentiality+mothers.+%E2%80%A6potentiality+is+not+the+same+thing+as+physical+possibility.+Consider+a+man+who+is+infertile+because+of+some+disease.+Although+it+is+not+physically+possible+for+him+to+be+a+father%2C+we+should+not+say+that+he+lacks+the+potentiality+for+fatherhood%3B+as+a+man%2C+he+has+the+potentiality%2C+but+the+disease+has+blocked+its+realization.+It+is+just+because+he+is+a+man%2C+just+because+he+is+endowed+with+the+potentiality+for+fatherhood%2C+that+the+block+to+its+physical+realization+is+such+an+occasion+for+sorrow.+Another+reason+why+the+expression+%E2%80%98potentiality+for+fatherhood%E2%80%99+requires+explanation+is+that+although+siring+children+is+the+most+characteristic+expression+of+fatherhood%2C+it+is+far+from+its+only+expression%E2%80%A6+We+can+carry+this+line+of+reasoning+still+further.+A+potentiality+is+something+like+a+calling.+It+wants%2C+so+to

<blockquote><p>As we do not deny to the magistrate anything which the Word of God does allow him, so we dare not approve his going beyond the bounds and limits which God has set him. And I pray God that this be not found to be the bottom of the controversy [as it is too unqualified, even for Gillespie’s adversaries], Whether magistracy shall be an arbitrary government; if not in civil, yet in ecclesiastical things?</p></blockquote>

<blockquote><p>Consecrating of churches is taken two ways:

1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches:

1. That the end being sacred, to wit, the habitual worshipping of God in that place.

2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple.

2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place.

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 90-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin.

1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful.

2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer.

1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God.

2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</span></figcaption>

1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God.

2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.”

— Samuel Rutherford, Lex Rex, … (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnswer%E2%80%A6+It+is+blasphemy+to+seek+this+distinction+of+person+and+office+in+the+King+of+kings%2C+because+by+person+in+a+mortal+king%2C+we+understand+a+man+that+can+sin.+1.+I+am+not+obliged+to+obey+his+%5Bthe+king%E2%80%99s%5D+personal+commandment%2C+except+I+were+his+domestic+%5Bservant%5D%2C+nor+his+unlawful+personal+commandments%2C+because+they+are+sinful.+2.+It+is+false+that+you+obey+the+king%E2%80%99s+law+because+you+obey+the+king%3B+for+then+you+say+but+this%3A+%E2%80%98I+obey+the+king+because+I+obey+the+king.%E2%80%99+The+truth+is%2C+obedience+is+not+formally+terminated+on+the+person+of+the+king.+Obedience+is+relative+to+a+precept%2C+and+it+is+men-service+to+obey+a+law%2C+not+because+it+is+good+and+just%2C+but+upon+this+formal+motive%2C+because+it+is+the+will+of+a+mortal+man+to+command+it.+And+reverence%2C+love%2C+fear%2C+being+acts+of+the+affection%2C+are+not+terminated+on+a+law%2C+but+properly+on+the+person+of+the+judge%3B+and+they+are+modifications%2C+or+laudable+qualifications+of+acts+of+obedience%2C+not+motives%2C+not+the+formal+reason+why+I+obey%2C+but+the+manner+how+I+obey.+And+the+apostle+makes+expressly+fear+of+punishment+a+motive+of+obedience+%28Rom.+13%3A4%29%2C+while+he+says%2C+%E2%80%9CHe+beareth+not+the+sword+in+vain%2C%E2%80%9D+therefore+be+subject+to+the+king%3B+and+this+hinders+not+personal+resistance+to+unjust+commandments.+%E2%80%A6+Answer.+1.+To+obey+the+king%E2%80%99s+personal+will+when+it+is+sinful+%28as+we+now+suppose%29%2C+against+his+legal+will%2C+is+a+sin+and+a+disobedience+to+God+and+the+king+also%2C+seeing+the+law+is+the+king%E2%80%99s+will+as+king%3B+but+to+obey+his+legal+will+against+his+sinful+personal+will+%28as+it+must+be+sinful+if+contrary+to+a+just+law%29+is+obedience+to+the+king+as+king%2C+and+so+obedience+to+God.+2.+You+take+the+king%E2%80%99s+person+to+be+himself%2C+but+you+take+quid+pro+quo+%5Bthis+for+that%5D%3B+for+his+%E2%80%98person%E2%80%99+here%2C+you+must+not+take+physically+for+his+suppost+%5Bagent%5D+of+soul+and+body%2C+but+morally%3A+it+is+the+king+as+a+sinful+man%2C+doing+his+worst+will+against+the+law%2C+which+is+his+just+and+best+will+and+the+rule+of+the+subjects.+And+the+king%E2%80%99s+personal+will+is+so+far+just+and+to+regulate+the+subjects+insofar+as+it+agrees+with+his+legal+will+or+his+law%2C+and+this+%5Bpersonal%5D+will+can+sin%2C+and+therefore+may+be+crossed+without+breach+of+the+Fifth+Commandment%3B+but+his+legal+will+cannot+be+crossed+without+disobedience+both+to+God+and+the+king.+%E2%80%A6+Answer%E2%80%A6+We+are+to+obey+the+king%E2%80%99s+personal+will+when+the+thing+commanded+is+not+sin%3B+but+his+subjects%2C+as+subjects%2C+have+little+to+do+with+his+personal+will+in+that+notion.+It+concerns+his+domestic+servant%2C+and+is+the+king%E2%80%99s+will+as+he+is+the+master+of+servants%2C+not+as+he+is+king+in+relation+to+subjects%3B+But+we+speak+of+the+king%E2%80%99s+personal+will+as+repugnant+to+law+and+contrary+to+the+king%E2%80%99s+will+as+king%2C+and+so+contrary+to+the+Fifth+Commandment%3B+and+this+%5Bpersonal+will%5D+is+attended+often+not+only+with+passion%2C+but+also+with+prejudice%3B+and+we+owe+no+subjection+to+prejudice+and+passions%2C+or+to+actions+commanded+by+these+disordered+powers%2C+because+they+are+not+from+God%2C+nor+his+ordinances%2C+but+from+men+and+the+flesh%2C+and+we+owe+no+subjection+to+the+flesh.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+%E2%80%A6+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+150.+Rutherford+is+responding+to+the+royalist%2C+Symmons.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd9b8b3b09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd9b8b3b09.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=It%20

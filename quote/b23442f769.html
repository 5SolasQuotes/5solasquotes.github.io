<main class="wrap"><figure class="quote" id="q-b23442f769" data-kw="">
<blockquote><p>…in the opinion of Scotus… For since God, as we have said, concurs toward the substrate of the evil act without causing its defect or intending it, He concurs only with the material of the act, with formal malice entirely removed. This is clear. God does not concur with that act in time except insofar as He decreed and foresaw from eternity that he would concur. But He decreed and foresaw from an antecedent permission, which is not a positive intention concerning that sinful act. Therefore, also when He concurs in time, He does not exhibit concurrence toward the sinful act; but only, given that there is a positive entity in it, did He decree from eternity to concur and does He actually concur in time with it. And this pertains to the first cause in the physical genus, not the moral. Hence, since malice is something moral and wholly proper to the secondary cause, it falls back upon that cause as upon its moral cause — which God cannot be with respect to that evil act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Detailed Answer</cite>, pp. 423-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b23442f769.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=%E2%80%A6in%20the%20opinion%20of%20Scotus%E2%80%A6%20For,with%20respect%20to%20that%20evil%20act." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-858e5287fa" data-kw="Author of sin">
<blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote>

</figure><figure class="quote" id="q-445062f1f3" data-kw="">
<blockquote><p>[Scotus:] ‘To the willing of the created will, two wills concur — namely, the created and the divine. There can be a defect in that willing from the defect of one of the causes, because one could give rectitude to the act, which it is bound to give yet does not give” — this is the created will — “while the other, though not bound to give it, would on its own part give it if the created will cooperated.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-74e6c84dda" data-kw="">
<blockquote><p>Because God works in them both to will and to do, according to his good pleasure, Phil. 2:12,13, not only by some moral persuasion, as those Pelagianizing here attribute an equal operation in man to the Devil with God; but also by the real and hyper-physical power of his Spirit, and the concourse of grace determining; indeed also predetermining, and thus also leading the gifts granted to us into act. But will not the eternal and such great grace, condescension, love, and mercy of God towards us miserable sinners excite us in turn to love, revere, worship and observe him, in whose communion all our happiness consists?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthias-nethenus.html">Matthias Nethenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface in Samuel Rutherford, Examination of Arminianism tr. by AI by Onku (1639-1642; 1668)</cite>, p. 33</span></figcaption>

</figure><figure class="quote" id="q-7df9615162" data-kw="Permission Author of sin">
<blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

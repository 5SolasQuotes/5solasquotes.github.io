<main class="wrap"><figure class="quote" id="q-744bc248cd" data-kw="">
<blockquote><p>The truth is, we deny that Christ died for all, in as much as he died not to procure the grace of faith and regeneration for all, but only for Gods elect; and consequently neither shall any but God’s elect have any such interest in Christ’s death, as to obtain thereby pardon of sin and salvation, for Arminians themselves confess that this is the portion only of believers. But seeing pardon of sin and salvation are benefits merited by Christ, not to be conferred absolutely but conditionally, to wit, upon condition of faith; we may be bold to say that Christ in some sense died for all and every one, that is, he died to procure remission of sins and salvation unto all and every one in case they believe; and as this is true, so may we well say, and the Council of Dort might well say, that every one who hears the Gospel is bound to believe that Christ died for him in this sense, namely, to obtain salvation for him in case he believe. But what think Arminians; are we bound to believe that Christ died for us in such a sense, as to purchase faith and regeneration for us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice… (Amsterdam, 1631), 3rd Part | 3rd Section</cite>, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19e85ccd5a" data-kw="">
<blockquote><p>…that I might clear the truth, that is (as they call it) the Calvinists’ doctrine, of those reproaches which are cast upon it: and that I might mitigate and appease the minds of some of our brethren, which have been more offended at it then was fit. For I do willingly acknowledge and teach universal redemption and grace, so far as it is possible by the word. My mind is to pursue after peace, which is departing from us: and I would have all men so interpret my fact. I allege the testimonies of the ancient everywhere… I hold it necessary, that there should be had an example of consent and concord in that doctrine which is expounded in holy books, and is propagated to all posterity.</p></blockquote>

</figure><figure class="quote" id="q-a225b91a4d" data-kw="">
<blockquote><p>For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60</cite>, pp. 554-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-81bd11dc55" data-kw="">
<blockquote><p>…our Saviour has obtained at the hands of his Father reconciliation, and forgiveness of sins, not for the reprobate, but elect only, and not for them neither, before they be truly regenerated, and implanted into Himself… That impetration, whereof the Arminians speak, I hold to be a fruit, not of his satisfaction, but intercession; and seeing I have learned from Christ’s own mouth, ‘I pray not for the reprobate world’: I must needs esteem it a great folly to imagine that He has impetrated [obtained] reconciliation and remission of sins for that world. I agree therefore thus far with Mr. [William] Ames in his dispute against Grevinchovius, that application and impetration, in this matter we have in hand, are of equal extent; and, that forgiveness of sins is not by our Saviour impetrated for any unto whom the merit of his death is not applied in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71</cite>, p. 564</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

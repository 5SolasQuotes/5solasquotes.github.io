<blockquote><p>Nothing can be plainer than the language of the fourth commandment, “Remember the Sabbath – day to keep it holy; on it thou shalt not do any work.” Should not this command of God dispel every murmur against the observance of Sabbath? Does it not bind our consciences with an obligation that cannot be thrown off, without exposing ourselves to the most inexpressible danger?

It has been said, that to interdict pleasure vehicles from running upon Sabbath, is an infringement of the rights of the poor. It will be afterwards seen, that this, instead of infringing the privileges of the poor, is preserving them. Here it is sufficient to say, that though men have rights independent of earthly kings, they have no rights independent of God; – and since he has said, “REMEMBER the Sabbath – day to keep it holy, on it thou shalt not do any work,” neither rich nor poor ever can possess a right to disobey Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-153252dd43" data-kw="">
<blockquote><p>These [formerly mentioned] separations are duty, and unto duty, but for a Corinthian to separate from God’s Church and God’s ordinance because some come unworthily to the Lord’s Table is no duty; because there is no command, it is no duty; and therefore we read not this word, ‘Come forth,’ in any of those epistles written to the seven Churches, Rev. 2-3, against which Christ says He ‘hath such and such things;’ they that lived in the impurer [church] are not called forth into the purer [church], but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part, for we may not make these churches and Babylon all one, nor make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s presence because Satan came also amongst them? Job 1:6. Must Shem and Japhet leap out of Noah’s Ark, because there is a Ham there? Would not our Savior rather have sent for John Baptist to have baptized Him rather than Himself have come from Nazareth to Bethabara, which some compute fourteen Dutch miles, that’s of ours fifty six? If that generation of vipers that came also to John’s baptism had either polluted the water, or the ordinance unto Christ? Mt. 3:7, 14. The abuses reproved were such as depraved the ordinance, and the corruptions [were] such as put themselves forth in the communicants at the very time of their participation. The Lord’s Supper was so intermeddled with their festival cheer as the difference between the Lord’s body and their own repast [meal] was not truly made. They discerned not the Lord’s body.</p></blockquote>

<blockquote><p>11. We thought it meet to subjoin the full proof of every word [of our agreed upon articles] from the Scripture, that it might be past controversy with all believers. Concerning the texts cited, I must desire you to observe that every text does not express the very words that we have put down, but all express the sense and sum of the words; so that I think scarce two syllables can be found that are not expressly in the words of Scripture, which contain any matter that is liable to controversy. If you find ten texts cited for one thing, if the words be not in nine of them, it is sufficient if they be in the tenth; and therefore I must intreat you, if you doubt, to peruse them all. And let not the number offend you: If you need them not, they are no trouble to you: Few of them, I think, or none, are impertinent: A consent of many texts may convince more than one single text: at least it will be useful to have so many texts at hand for the convincing any others of any article of the Faith, though you doubt not yourselves. Only the particular application of some parts of the last branch, viz. ‘our consent that such a man shall be our pastor,’ and that ‘we will be members of this or that particular church:’ cannot be proved in terms from Scripture, but by consequence: For who can expect that Scripture should name the persons of our pastors or the places of our habitation?</p></blockquote>

<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gaskin.html">John Gaskin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Just Defence &amp; Vindication of Gospel Ministers &amp; Gospel Ordinances Against the Quakers’ many False Accusations, Slanders &amp; Reproaches. In answer to John Horwood, his Letter, &amp; E.B. his Book</cite>, … (London, 1660), pp. 86-87</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.”

— John Gaskin, A Just Defence &amp; Vindication of Gospel Ministers &amp; Gospel Ordinances Against the Quakers’ many False Accusations, Slanders &amp; Reproaches. In answer to John Horwood, his Letter, &amp; E.B. his Book, … (London, 1660), pp. 86-87">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BThe+Objection+of+Quakers%3A%5D+But+our+Psalms+are+not+the+same+in+meter%2C+nor+the+same+tunes+which+the+Jews+had.+%5BAnswer%3A%5D+That+seeing+the+singing+of+Psalms+is+a+duty+commanded%2C+and+amongst+others%2C+those+of+David%2C+and+has+hid+from+us+the+Hebrew+tunes%2C+wherewith+the+Psalms+of+David+were+wont+to+be+sung%2C+it+must+needs+follow+that+the+Lord+has+left+it+to+the+liberty+of+the+Church+to+sing+them+in+such+plain%2C+grave+tunes+as+may+fit+the+solemnity+of+God%E2%80%99s+worship%2C+and+that+because+that+tunes+are+but+circumstantial+and+not+the+substance%3B+and+the+Church+now+in+the+days+of+the+Gospel+is+not+in+her+minority+or+young+age%2C+but+in+her+man-age%2C+or+full+grown+age%2C+as+the+apostle+speaketh+%28Gal.+4%3A1-6%29%2C+and+therefore+fitter+to+appoint+circumstantial+things+in+God%E2%80%99s+worship+than+the+Jews%2C+being+in+their+non-age.%E2%80%9D%0A%0A%E2%80%94+John+Gaskin%2C+A+Just+Defence+%26+Vindication+of+Gospel+Ministers+%26+Gospel+Ordinances+Against+the+Quakers%E2%80%99+many+False+Accusations%2C+Slanders+%26+Reproaches.+In+answer+to+John+Horwood%2C+his+Letter%2C+%26+E.B.+his+Book%2C+%E2%80%A6+%28London%2C+1660%29%2C+pp.+86-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff81fff8cf4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f81fff8cf4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=The%20Objection%20of%20Quakers%3A%5D%20But%20our,the%20Jews%2C%20being%20in%20their%20non%2Dage&amp;text=The%20Objection%20of%20Quakers%3A%5D%20But%20our%20Psalms%20are&amp;text=worship%20than%20the%20Jews%2C%20being%20in%20their%20no

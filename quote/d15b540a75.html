<blockquote><p>Hieronymus Zanchius (Operum, Tom. iv. lib. i. c. 11), Maintains at large, and by several arguments, that we Christians have nothing to do with the moral precepts, as they were given to the Israelites by Moses; but only in so far as they agree with the law of nature, common to all nations, and confirmed by Christ, whom we acknowledge to be our king.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, 2.179.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

— Herman Witsius, Economy of the Covenants, 2.179.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHieronymus+Zanchius+%28Operum%2C+Tom.+iv.+lib.+i.+c.+11%29%2C+Maintains+at+large%2C+and+by+several+arguments%2C+that+we+Christians+have+nothing+to+do+with+the+moral+precepts%2C+as+they+were+given+to+the+Israelites+by+Moses%3B+but+only+in+so+far+as+they+agree+with+the+law+of+nature%2C+common+to+all+nations%2C+and+confirmed+by+Christ%2C+whom+we+acknowledge+to+be+our+king.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Economy+of+the+Covenants%2C+2.179.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd15b540a75.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d15b540a75.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/09/zanchi-the-decalogue-binds-christians-insofar-as-it-agrees-with-natural-law/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab91f47669" data-kw="">
<blockquote><p>There be some which divide the holy Scriptures into four parts, and describe some books as well of the Old Testament as of the New to laws, some to histories, some to prophecies, and other some again to wisdom. But it is not meet to divide the books of the holy Scriptures from one another, because that in the books of Exodus, Leviticus, Numbers, and Deuteronomy, in which they appoint laws to be contained, are found almost as many histories as laws. Besides that in the books which they assign to prophets, laws of living uprightly are sometimes written and clearly expounded. Neither can we properly separate the books of Solomon and other of the kind (which they will have proper to wisdom) from laws and prophecies. For there are in them sentences here and there written, which serving for the instruction of life, have also without controversy the nature of laws. Further for the that in them are very many secrets opened unto the church by the inspiration of the Spirit of God, they pour undoubtedly into the attentive hearers, oracles of things to come, It may easily be granted, that all these things which they make mention of, are found in the holy books: I mean the precepts of living, notable histories, prophecies of things to come, and also most wise sentences and sayings: but in such […], that in manner in every book they are set forth unto us dispersedly, neither yet would I that these holy books should be divided from one another by these ends and limits. I would rather think as the learned […] do also judge, that whatsoever things are contained in the holy scriptures should be referred unto to principal heads, the law I mean and the gospel. For everywhere are declared unto us either the precepts of God of upright living, as when we are reproved to have strayed from them by reason of weakness or else of malice, gospel is lay forth before us, wherein by Christ that thing wherein we have offended is pardoned and the strength and power of the Holy Spirit promises us, to restore us again to the image of God, which we had lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Master Peter Martyr Vermigli upon the Book of Judges, in Most fruitful and learned commentaries of Dr. Peter Martyr Vermigli Florentine</cite>, ….(London, 1564), fol. 1.. Spelling modernized.</span></figcaption>

<blockquote><p>We are not to find life in the Gospel and then nourish it by the Law.</p></blockquote>

</figure><figure class="quote" id="q-c2ea72c458" data-kw="">
<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (covetousness as idolatry)</span></figcaption>

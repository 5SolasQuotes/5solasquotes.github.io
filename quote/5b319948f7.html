<main class="wrap"><figure class="quote" id="q-5b319948f7" data-kw="">
<blockquote><p>But that gift of healing, like the rest of the miracles, which the Lord willed to be brought forth for a time, has vanished away in order to make the new preaching of the gospel marvelous forever. Therefore, even if we grant to the full that anointing was a sacrament of those powers which were then administered by the hands of the apostles, it now has nothing to do with us, to whom the administering of such powers has not been committed. … Therefore, they make themselves ridiculous when they boast that they are endowed with the gift of healing. The Lord is indeed present with his people in every age; and He heals their weaknesses as often as necessary, no less than of old; still He does not put forth these manifest powers, nor dispense miracles through the apostles’ hands. For that was a temporary gift, and also quickly perished partly on account of men’s ungratefulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4, ch. 19, sections 18-19, p. 1467</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02cd0b801c" data-kw="">
<blockquote><p>But the disciples, being dispersed through the provinces, everywhere laid the foundations of the Church, themselves also in the name of their divine Master doing many and almost incredible miracles; for at His departure He had endowed them with power and strength, by which the system of their new announcement might be founded and confirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lactantius.html">Lactantius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>c. 325)</cite>, The Divine Institutes, bk. 4, ch. 21 in ANF, 7:123</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-b429bc8ea1" data-kw="">
<blockquote><p>Secondly, every office necessarily supposes the corresponding gift. No man could be an apostle without the gift of infalibility; nor a prophet without the gift of inspiration; nor a healer of diseases without the gift of healing. Man may appoint men to offices for which they have not the necessary gifts, but God never does, any more than he ordains the foot to see or the hand to hear. If any man, therefore, claims to be an apostle, or prophet, or worker of miracles, without the corresponding gift, he is a false pretender. In the early church, as now, there were many false apostles, i.e. those who claimed the honor and authority of the office without its gifts. Thirdly, the fact that any office existed in the apostolic church is no evidence that it was intended to be permanent. In that age there was a plenitude of spiritual manifestations and endowments demanded for the organization and propagation of the church, which is no longer required. We have no longer prophets, nor workers of miracles, nor gifts of tongues. The only evidence that an office was intended to be permanent is the continuance of the gift of which it was the organ, and the command to appoint to the office those who are found to possess the gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, (NY: Robert Carter, 1860), on 1 Cor. 12:28, p. 263</span></figcaption>

p;text=Secondly%2C%20every%20office%20necessarily%20supposes%20the%20corresponding%20gift&amp;text=those%20who%20are%20found%20to%20possess%20the%20gift" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d2c06fc13a" data-kw="">
<blockquote><p>The extraordinary gifts of the Spirit, such as the gift of tongues, of miracles, of prophecy, etc., are called extraordinary, because cause they are such as are not given in the ordinary course of God’s providence. They are not bestowed in the way of God’s ordinary providential dealing with his children, but only on extraordinary occasions, as they were bestowed on the prophets and apostles to enable them to reveal the mind and will of God before the canon of Scripture was complete, and so on the primitive Church, in order to the founding and establishing of it in the world. But since the canon of the Scripture has been completed, and the Christian Church fully founded and established, these extraordinary gifts have ceased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Love More Excellent than the Extraordinary Gifts of the Spirit’ on 1 Cor</cite>, 13:1-2</span></figcaption>

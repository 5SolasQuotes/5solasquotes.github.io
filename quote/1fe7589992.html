<main class="wrap"><figure class="quote" id="q-1fe7589992" data-kw="">
<blockquote><p>In general I remark that you would gladly have people believe that the sentences of the Church of Scotland against you are upon account of your adhering to the covenanted work of reformation, and testifying against all sins of the time. But this is the ordinary practice of all schismatics, “by good words and fair speeches, to deceive the hearts of the simple,” Rom. 16:17-18, which portion of Scripture, I earnestly commend to your consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0ae01f86f" data-kw="">
<blockquote><p>There is a fire that comes from the altar, which has right terrible effects. Contention and strife about spiritual things amongst Churchmen, and flowing from them to others, is a very sad judgment, and has very terrible effects; it most mars the beauty of the Church; it obstructs the spiritual growth of God’s people, and burns up all their spiritual life. Lord save us from this judgment, and make all his servants and people warry of kindling it, and make us more earnest in prayer that God would quench what of it is begun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

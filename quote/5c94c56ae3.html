<main class="wrap"><figure class="quote" id="q-5c94c56ae3" data-kw="">
<blockquote><p>For like as by one man sin hath entered into the world (as the Apostle saith to the Rom. cap. 5.) and by sin death, and so death hath passed upon all men, in as much as all have sinned: and as by the disobedience of one man many are made sinners: so by the obedience of one many are made righteous. Also, if by the sin of that one many are dead, much more the grace of God, and the gift through grace, which is of one man Jesus Christ, hath abounded towards many.

Wherefore Christ must be very man both in soul &amp; body, who by obedience even to death, and to the death of the cross, might satisfy the unchangeable righteousness of God, who would not punish that in Angels, because men had sinned, but in the very nature of man, therefore the son of God took not Angels, but the seed of Abraham, that is, the very nature of man of the seed of the Abraham. Heb. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), p. 141.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55b3c85c6b" data-kw="">
<blockquote><p>XIII. A second rock to be avoided here is Eutychianism… who… confounded the two natures into one… one nature is neither changed nor converted by the hypostatical union into the other. Nor are the natures so confounded or mixed with each other that each of them does not retain its own properties and conditions.

XIV. The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6-7, 11); (2) two wills are ascribed to Him (‘not my will, but thine, be done,’ Lk. 22:42). Nor does it follow that there are two [persons] willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will. (3) Contraries are ascribed to Christ, which could not be if there were not two natures in Him (as that He would depart from the world and remain with us forever; that a child was born, who is the Father of eternity; that He suffered death and was made alive; in the form of God and in the form of a servant, etc.).

XV. Although the efficient cause of the operations of Christ is one alone, still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.</p></blockquote>

</figure><figure class="quote" id="q-b402491f0d" data-kw="">
<blockquote><p>I will speak distinctly… how to understand his being forsaken of God, which is not to be understood: 1. As if the union of the Godhead with the human nature had been dissolved, but so as it might still be compatible, and rightly stand with it. For it was not a forsaking in respect of the essence of the Godhead, but of his presence, and so in a way of sense. The Godhead was not separated, though the operation of comfort from the Godhead were sequestered. The union hypostatical continued still with his soul, now filled with the sorrows of death, as well as it did with his body when He lay in the grave. And so as although his body was united to the fountain of life, yet it might die in respect of a natural life: so his soul, although the hypostatical union continued, might yet want [lack] comfort, which is life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Mediator</cite>, bk. 5, ch. 13, p. 279 in Works, vol. 5</span></figcaption>

</figure><figure class="quote" id="q-1195304235" data-kw="">
<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>

<blockquote><p>Position 6. Grace is not educed or extracted out of the potency of any created nature. Grace is born in heaven and came from the inmost of the heart of Christ; it has neither seed nor parent on earth; therefore the Lord challenges it as his own, 2 Cor. 12.9, ‘The Lord said unto me, My grace is sufficient for thee.’ 2 Tim. 2:1, ‘The grace that is in Christ Jesus.’ 1 Cor. 15:10, ‘The grace of God.’ 2 Cor. 13:14, ‘The grace of the Lord Jesus Christ.’ Gal. 1:15, ‘He called me by his grace.’ If we could engage the grace of God, or prevent it [come before it], then should grace be our birth; but grace is not essential to angels. It’s a doubt if any creature can be capable by nature of any possibility-natural not to sin; it is much to know the just owner of grace who begot it? It came out of the eternal womb and bowels of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 239</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Position 6. Grace is not educed or extracted out of the potency of any created nature. Grace is born in heaven and came from the inmost of the heart of Christ; it has neither seed nor parent on earth; therefore the Lord challenges it as his own, 2 Cor. 12.9, ‘The Lord said unto me, My grace is sufficient for thee.’ 2 Tim. 2:1, ‘The grace that is in Christ Jesus.’ 1 Cor. 15:10, ‘The grace of God.’ 2 Cor. 13:14, ‘The grace of the Lord Jesus Christ.’ Gal. 1:15, ‘He called me by his grace.’ If we could engage the grace of God, or prevent it [come before it], then should grace be our birth; but grace is not essential to angels. It’s a doubt if any creature can be capable by nature of any possibility-natural not to sin; it is much to know the just owner of grace who begot it? It came out of the eternal womb and bowels of Jesus Christ.”

<main class="wrap"><figure class="quote" id="q-3efdb00557" data-kw="">
<blockquote><p>§11. Of the Cross in Baptism Some nonconformists say that they deny not the civil use of the cross in coins and banners. Others of them say they dare not reprove the ancient Christians that used the sign of the cross merely as a professing, signal action to show to the heathen that they did believe in Christ crucified. Indeed that usage thereof was not an act of worship, but an informing of men touching their faith. It seems lawful to signify, as by words so by other signs, that we are Christ’s and his devoted servants, for words are but a kind of signs. The grounds of scrupling the sign of the cross in baptism are these: 1. That it is not a mere circumstance, but an ordinance of worship, as important as an external rite can be. 2. That being a solemn and stated, symbolic sign of a divine mystery and devised of men, it is of that classis or rank of things which are not necessary in genere, and so not allowed to be determined and imposed by men as things necessary in genere are allowed. 3. That either the whole nature of a sacrament, or at least a part thereof, is in it. That it is a sacrament is thus proved: It is an outward and visible sign of inward and spiritual grace. The outward sign is the representation of the cross, the instrument of Christ’s sufferings, and the inward spiritual grace is fortitude in the Christian warfare, according to the words of the Liturgy. Here is a signification of grace to be given us of God and of our duty according to that grace. Likewise this sign has assigned unto it the moral efficacy of a sacrament for working grace, by teaching and exciting us to the spiritual warfare and minding us of Christ crucified. Also it signifies and seals our relation to Christ, or the grace of being a Christian. And the Liturgy so speaks, “We receive this child into the Congregation of Christ’s Flock, and sign him, etc. in token, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 11 in Remains (London: Parkhurst, 1684), pp. 220-21</span></figcaption>

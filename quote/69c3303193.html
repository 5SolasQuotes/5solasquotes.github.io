<main class="wrap"><figure class="quote" id="q-69c3303193" data-kw="">
<blockquote><p>But as this peace among Protestant Churches is very much to be wished and prayed for, so I despair to see so glorious a work take effect, except the differing parties would resolve to stand to the rules following: 1. That the respective parties which agree in the chief points of religion do not make any of those points they differ in, fundamental, as if the fortune of religion depended upon it, or as if those different points were so many different religions. 2. That the differing parties do not damn one another for those differences, there being nothing that has done religion more hurt than men’s damning one another for things which Christ and his apostles have affixed no damnation to. 3. That notwithstanding the little differences that are among them, they make one Church and endeavour after the welfare and prosperity of it, and join together in public prayer and in the sacrament of the eucharist, which is the badge and symbol of fraternity and amity. 4. That one party be not presently jealous and suspicious of the other, as if the opinion which one party espouses were embraced or maintained in a humor or for worldly ends, but that they charitably believe it’s conscience that puts them upon it, at least till either the party espousing that opinion confesses that conscience is not at the bottom of it or that it appear by undeniable evidences that a worldly or sinister design is the foundation of it. 5. That the differing parties do not multiply the controversies which are amongst them, make them neither more numerous nor greater than really they are, and that they do not interpret an accidental unwary expression that may drop from the pen or mouth of one party as a new controversy. 6. That one party do not charge the other with consequences which they do not own, nor with doctrines and positions which they detest from their hearts. 7. That each party defending or proving their opinion do it with great modesty, without provoking or exasperating or approbrious language and revilings or bitter reflections on the other. 8. That of these differing parties none do vie with the other except it be in living up to the precepts of the Gospel, particularly those of patience, long-suffering and charity. These rules I apprehend to be the foundation of peace and concord of Protestant Churches that differ in points of no great concernment; and were these maxims once put in practice, the particular controversies might soon be compromised. To this purpose is that saying of the apostle: ‘Nevertheless, whereto we have already attained, let’s walk by the same rule, let’s mind the same things; and if any be otherwise minded, God will even reveal that unto you,’ Phil. 3:15-16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew</cite>, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 34-37</span></figcaption>

 it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-096963ca8c" data-kw="">
<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irene-dingel.html">Irene Dingel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 19, ‘Christian Ecumenical Efforts’ in eds. Appold &amp; Minnich, The Cambridge History of Reformation Era Theology (Cambridge University Press, 2023), pp. 372-84, p. 373</span></figcaption>

r%20premises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-60c11e0a20" data-kw="">
<blockquote><p>This other thing also is to be ranked among the chief evils of our time, viz., that the Churches are so divided, that human fellowship is scarcely now in any repute amongst us, far less that Christian intercourse which all make a profession of, but few sincerely practice. If men of learning conduct themselves with more reserve than is seemly, the very heaviest blame attaches to the leaders themselves, who, either engrossed in their own sinful pursuits, are indifferent to the safety and entire piety of the Church, or who, individually satisfied with their own private peace, have no regard for others. Thus it is that the members of the Church being severed, the body lies bleeding. So much does this concern me, that, could I be of any service, I would not grudge to cross even ten seas, if need were, on account of it.</p></blockquote>

<blockquote><p>There is no doctrine objectively of absolute necessity to salvation, but the doctrine of the Baptismal Covenant which is expounded in the [Apostles’] Creed, Lord’s prayer and Decalogue. But there is much doctrinal and active means necessary to make men uUnderstand, Believe, Love and Practice this necessary Covenant doctrine. And the doctrine or articles of faith, will save none that do not understand, believe, love, and practise it, and that sincerely preferring the things revealed before all the pleasures, riches and honors of this world. A parrot shall not be a saint for saying the Creed.</p></blockquote>

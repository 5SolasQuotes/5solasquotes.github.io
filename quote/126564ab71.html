<blockquote><p>We respond: Our corollary in the disputation of 1634 set forth that this holds: Good works from the use of Scripture are in some way able to be called the cause of life eternal (2 Cor. 4:17; Phil. 2:12) and nonetheless they are certainly not hence an appearance or a shade of argument for the merit of papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, 43rd Categorical, ‘Of Good Works being Causes of Life Eternal’ in Of Some Select Problems, Part 10 in Select Theological Disputations (Utrecht, 1669), vol. 5, pp. 675-86, pp. 675-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We respond: Our corollary in the disputation of 1634 set forth that this holds: Good works from the use of Scripture are in some way able to be called the cause of life eternal (2 Cor. 4:17; Phil. 2:12) and nonetheless they are certainly not hence an appearance or a shade of argument for the merit of papists.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-757e8a0bda" data-kw="">
<blockquote><p>The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.</p></blockquote>

<blockquote><p>(7.) Sanctification fits for heaven: ‘Who hath called us to glory and virtue.’ 2 Pet i 3. Glory is the throne, and sanctification is the step by which we ascend to it. As you first cleanse the vessel, and then pour in the wine; so God first cleanses us by sanctification, and then pours in the wine of glory. Solomon was first anointed with oil, and then was a king. 1 Kings i 39. First God anoints us with the holy oil of his Spirit, and then sets the crown of happiness upon our head. Pureness of heart and seeing God are linked together. Matt v 8.</p></blockquote>

</figure><figure class="quote" id="q-996d64bd75" data-kw="">
<blockquote><p>A few theologians [of the Augsburg Confession] also maintained that good works are not necessary but spontaneous, since they are not extorted by fear and punishment of the law but flow from a spontaneous spirit and joyful heart. Another party took the contrary view that good works are necessary. At first this latter controversy arose about the words ‘necessary’ and ‘free’, especially the word ‘necessary’. This word may refer to the immutable order which obligates and binds all men to be obedient to God, but at times it implies the coercion with which the law forces men to do good works. In the course of time, however, the issue ceased to be only a semantic problem and became a vehemently argued theological controversy when some contended that, because of the divine order referred to above, new obedience is not necessary in the regenerated.¹ ¹ The so-called Second Antinomian Controversy, chiefly between Andrew Musculus [who denied the ‘necessity’ of good works] and Obadiah Praetorius [who upheld the ‘necessity’ of good works]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abdias-praetorius.html">Abdias Praetorius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Necessity of Good Works &amp; New Obedience, out of the Sacred Letters, Luther, Melancthon, Confessions, Fathers, Recent Writings, &amp; some other Recent Items (Frankfurt, German, 1562) | Solid Declaration, Article 4, ‘Good Works’ (tr. Theodore Tappert, 1959)</span></figcaption>

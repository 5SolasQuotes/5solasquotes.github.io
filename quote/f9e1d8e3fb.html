<main class="wrap"><figure class="quote" id="q-f9e1d8e3fb" data-kw="">
<blockquote><p>First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-is-by-grace.html">Justification is by grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b54395096" data-kw="">
<blockquote><p>Let them, if they will, expect eternal life for their good works; only let us on the authority of Paul hope for it from the grace of God. … Let the saying of Paul then stand fast — that “the inheritance is not of the law but of faith, that the promise according to grace may be sure to every one that believeth.” (Romans 4:14.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on canon 26</span></figcaption>

</figure><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</span></figcaption>

</figure><figure class="quote" id="q-ac98fbbe65" data-kw="">
<blockquote><p>But whenever the true cause is to be assigned, he enjoins us not to take refuge in works, but to keep our thoughts entirely fixed on the mercy of God; &quot;The wages of sin is death; but the gift of God is eternal life,&quot; (Rom. 6:23). … the Apostle employed the comparison to express the fact, that death is due to the deserts of men, but that life was treasured up solely in the mercy of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.21</span></figcaption>

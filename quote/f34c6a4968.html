<main class="wrap"><figure class="quote" id="q-f34c6a4968" data-kw="">
<blockquote><p>XXIII. While Christ’s passion is minimized by the foregoing errors, those who teach that he died for all human beings (pro omnibus et singulis) broaden the object of his passion more than is allowable. Of course, if we take into consideration the magnitude and worthiness of the merit, we admit that it would suffice for the redemption of ten worlds; but if we take the plan of God and the intention of Christ into consideration, then it is false to say that Christ died for every person. For this reason others say that his death was sufficient for all, but not effective for all; that is, the merit of Christ, because of his worthiness, is sufficient for all, but it is not effective for all in its application, because Christ did not die with the intention that his death be applied to all. Why should He die for those for whom He would not pray?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ed. John Beardslee, Reformed Dogmatics (Grand Rapids: Baker, 1977), pp. 105-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d44b6da67" data-kw="">
<blockquote><p>Second, He did not offer Himself for angels, because He is not the epilēptōr (ἐπιλήπτωρ), the undertaker and redeemer of angels (Heb. 2:16). Therefore, we think it imprudently said that Christ’s blood suffices to redeem demons (Cornelius Jansen, Augustinus, tome 3, p. 382). Third, Christ sanctified and offered Himself for the seed of Abraham, whose epilēptōr He is (Heb. 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 61, ‘On the Satisfaction of Christ’ in Sum of Theology (Geneva, 1665), trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-6337527b5a" data-kw="">
<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, (London, 1631), vol. 1, pp. 495–98 on 1 Tim. 2:4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

ency-of-the-atonement/#:~:text=It%20is%20enough%20to%20show%20it,not%20withstanding%20through%20their%20own%20default&amp;text=It%20is%20enough%20to%20show%20it%20to%20be&amp;text=shall%20perish%20not%20withstanding%20through%20their%20own%20default" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-656fe32bd6" data-kw="">
<blockquote><p>Concerning the story and benefit of our Lord’s resurrection… directing our course as it were by the loadstar of scripture we pronounce by virtue and authority thereof that so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… The answer hereunto is twofold, either of which is true and sound. First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Howbeit there is another answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit, and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving, or to be generally promised or given in the〈…〉; and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all ???? and reprobate… For what slander is there, if this be none. When we distinguish the worth of the merue from the efficacy and participating of the benefits, and restrain according to Scripture and the judgement of the soundest Fathers this participation to the whole number of the faithful alone gathered from amongst the Jews and Gentiles; do we then deny that Christ died for all?… They [opponents] run on still, and say He died for all and every of these not only in respect of the sufficiency of his sacrifice and satisfaction, but also in regard of the efficacy of the same. What means this new device I pray? That forsooth Christ by his death and bloodshedding has truly and effectually delivered from death, purged from sin, sanctified, reconciled unto God, and restored unto his grace and favor by his death and bloodshedding all and every single man, yea even those who are not saved, but have been ever since Caine, etc. are at this day, and shall be hereafter damned… they neither perished, nay perish, nor shall perish, for their sins (whereas they are washed away by the blood of Christ Jesus) but for unbelief alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preface of an Oration</cite>, … by a certain student of divinity in the famous University of Heidelberg…: To whom the benefit of the Death &amp; Resurrection of Christ appertains: and how Christ died for all men [by way of sufficiency] in A Collection of Certain Learned Discourses… (Oxford, 1600), pp. 132 &amp; 134, 142</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

respect+Christ+died+alike+for+all+%3F%3F%3F%3F+and+reprobate%E2%80%A6+For+what+slander+is+there%2C+if+this+be+none.+When+we+distinguish+the+worth+of+the+merue+from+the+efficacy+and+participating+of+the+benefits%2C+and+restrain+according+to+Scripture+and+the+judgement+of+the+soundest+Fathers+this+participation+to+the+whole+number+of+the+faithful+alone+gathered+from+amongst+the+Jews+and+Gentiles%3B+do+we+then+deny+that+Christ+died+for+all%3F%E2%80%A6+They+%5Bopponents%5D+run+on+still%2C+and+say+He+died+for+all+and+every+of+these+not+only+in+respect+of+the+sufficiency+of+his+sacrifice+and+satisfaction%2C+but+also+in+regard+of+the+efficacy+of+the+same.+What+means+this+new+device+I+pray%3F+That+forsooth+Christ+by+his+death+and+bloodshedding+has+truly+and+effectually+delivered+from+death%2C+purged+from+sin%2C+sanctified%2C+reconciled+unto+God%2C+and+restored+unto+his+grace+and+favor+by+his+death+and+bloodshedding+all+and+every+single+man%2C+yea+even+those+who+are+not+saved%2C+but+have+been+ever+since+Caine%2C+etc.+are+at+this+day%2C+and+shall+be+hereafter+damned%E2%80%A6+they+neither+perished%2C+nay+perish%2C+nor+shall+perish%2C+for+their+sins+%28whereas+they+are+washed+away+by+the+blood+of+Christ+Jesus%29+but+for+unbelief+alone.%E2%80%9D%0A%0A%E2%80%94+Zachary+Ursinus%2C+A+Preface+of+an+Oration%E2%80%A6+by+a+certain+student+of+divinity+in+the+famous+University+of+Heidelberg%E2%80%A6%3A+To+whom+the+benefit+of+the+Death+%26+Resurrection+of+Christ+appertains%3A+and+how+Christ+died+for+all+men+%5Bby+way+of+sufficiency%5D+in+A+Collection+of+Certain+Learned+Discourses%E2%80%A6+%28Oxford%2C+1600%29%2C+pp.+132+%26+134%2C+142&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F656fe32bd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/656fe32bd6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/atonement#:~:text=Concerning%20the%20story%20and%20benefit%20of,Christ%20Jesus%29%20but%20for%20unbelief%20alone&amp;text=Concerning%20the%20story%20and%20benefit%20of%20our%20Lord%E2%80%99s&amp;text=blood%20of%20Christ%20Jesus%29%20but%20for%20unbelief%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. Among the ancients, it appears that the universality of redemption was contended for by the Pelagians and Semipelagians. Hence Prosper [of Aquitaine, c. 390 – c. 455 AD] (concerning the remains of the Pelagian heresy) says, ‘This is their definition and profession that Christ died for the whole human race and that no one is excluded from the redemption effected by his blood’ (Letter to Augustine 6 [ACW 32:43; PL 33.1005]). And among the damnable errors which they boasted of having found in Augustine was this also: ‘The Savior was not crucified for the redemption of the whole world.’ Faustus (Rhegiensis) [a semi-pelagian prelate, d. c. 485 A.D.] says, ‘They wander far from the path of piety who say that the Savior did not die for all’ (De Gratia Dei et Libero Arbitrio 1.4 [PL 58.789])</p></blockquote>

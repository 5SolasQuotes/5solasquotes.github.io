<blockquote><p>If thou knewest the gift of God, and who it is that saith to thee. Give me to drink; thou wouldest have asked of him, and he would have given thee living water. — John iv. 10.

IF the puzzled woman had but known that the mysterious stranger then talking with her was no mere Jew, but the divine Creator of all the floods of waters, and the divine Friend and Redeemer of the soul that is at the same time sin-smitten and athirst for heavenly blessings, she would have become a suppliant herself and would have sued for that “gift of God”‘ which Christ, the gracious and omnipotent Jehovah, had it in his power to bestow upon her.

Nor would he have denied her request, but would have conferred upon her that true inward “fountain of living water “so faintly symbolized by the freshly bubbling fountainheads and leaping streams of this earth. Eternal Life.” He who, as some think, pointed to the rising sun when he exclaimed, “I am the light of the world,” stood amidst the pillared galleries of Herod’s temple when the golden flagon was brought from the pool of Siloam on the last day of the feast and poured on the altar, and cried, “If any man thirst, let him come unto me and drink.</p></blockquote>

<blockquote><p>That which godly Kings and Magistrates in the Old Testament, under the Law, were enjoined to do by God’s own express command, and did accordingly execute with God’s special approbation: Christian Kings and Magistrates under the Gospel, may and ought to do and execute, by virtue of the self-same commands.

But godly Kings and Magistrates in the Old Testament, under the Law, were enjoined by God’s own express command, to restrain all Idolatry, Apostacy, Heresy, Errors, Schisms, Blasphemies; yea to punish with corporal, and in some cases with capital Punishments, such obstinate seducing Idolaters, Apostates, Heretics, False Teachers, Schismatics, and Blasphemers, who disturbed the Peace of Church, State, and drew down God’s Judgments upon either, and did accordingly execute the same command with God’s special approbation, when admonitions, exhortations, and Disputes would not reclaim them.

Therefore Christian Magistrates under the Gospel may and ought to do the like.

The Major Proposition I shall make good by these undeniable reasons.

First, because God hath ordained and continued Kings and Magistrates under the New Testament as well as under the Old, and enjoined obedience to them; ROM. 13. 1. to 6. 1 TIM. 2. 1, 2, 3. TIT. 3. 1. 1 PET. 2. 13, 14. c. 4. 15. which none but professed Anabaptists do deny.

Secondly, because Christian Kings and Magistrates under the Gospel, have the self-same authority as godly Kings and Magistrates had under the Law; even as Parents, Masters, Husbands (natural Magistrates) have the self-same authority over their Children, Servants, Wives, under the Gospel, as they had under the Law; ROM. 13. 1. to 6. TIT. 3. 1. 1 PET. 2. 13, 14, 15. c. 4. 15. compared with EPH. 6. 1. to 8. c. 5. 21, 22. COL. 3. 18. to 25. 1 TIM. 6. 1, 2. 1 PET. 3. 11. 12. 13. c. 2. 18. there being no one text in the New Testament which restrains either Kings or Magistrates power given them by God in the Old.

Thirdly, because the ends and uses for which Magistrates were instituted are the same under the New Testament and Old, ROM. 13. 1. to 6. 1 TIM. 2. 1, 2, 3. 1 PET. 2. 13. 14. c. 4. 15. ISA 1. 49. 23. therefore their power and rule the same.

Fourthly, because the precepts given to Magistrates under the Law, for punishing Idolaters, Apostates, False Prophets, Heretics, and Blasphemers, are not Ceremonial or Judicial, but moral and perpetual: and so of equal obligation under the Law and Gospel, as well as the Decalogue and Moral Law of God.

Fifthly, because godly Kings and Christian Magistrates ought to be as zealous for God and his truth (if not more zealous) under the Gospel, as they were under the Law; REV. 3. 19. c. 2. 14, 15, 16. 20. 23. compared with NUM. 15. 11, 13. 2 KING. 10. 16. &amp;c.

The Minor I shall ratify by this particular Induction.

First, for Idolatry, Idolaters, Apostates, False Prophets, and Seducers of men from the true God and Religion, to Idols and Idolatry, we have these expresse precepts, warranting, if not commanding, the civil Magistrate to inflict corporal and capital punishments on them.

Levit. 20. 2. to 6. Whosoever of the children of Israel, or of the strangers that sojourn in Israel, that giveth any of his seed to Molech, (that is, sacrificeth any of his children, or maketh them pass through the fire to that Idol; LEVIT. 18. 21. 2 KING. 21. 10.) He shall SURELY BE PƲT TO DEATH; the people of the Land shall stone him with stones; and I will set my face against that man, and will cut him off from among his people, because he hath given of his seed to Molech, to defile my sanctuary and to prophane my holy Name. And if the people of the Land do any way hide their eyes when he giveth his seed unto Molech and kill him not, then I will set my face against that man and against his family, and will cut him off, and all that go a whoring after him to commit whoredom with Molech, from among their people. From which text we may observe these particulars.

First, that not only such stranger Idolaters, who constantly worshipped Idols, and never adored the true God were to be put to death by the Israelites; but even such of the Israelites themselves, and of the sojourners among them who turned Idolaters and sacrificed unto Molech (to whom they offered their children) were to be surely put to death, and stoned with stones by the people without mercy; being first convicted and condemned by the Magistrate.

Secondly, that the Magistrates’ and peoples’ hiding of their eyes and sparing such as these, contrary to this precept, was a grievous sin. Thirdly, that where the Magistrates and people winked at such an Idolater, and hid their eyes from him, God himself, in their default, would set his face against him, and cut him off from among his people; and not only so, but would set his face against his family; and cut off all them that went a whoring after him, from among his people: whereas if the Magistrate had punished him, his family had not been thus cut off by God.

Fourthly, that it is not sufficient to leave Idolaters, Heretics, and Blasphemers to God’s own vengeance and execution, who will certainly cut them and their families off, if they repent not; but themselves must likewise cut them off, as God commands, before God proceeds to do it, they being his Ministers and Executioners appointed for this end, who must not put off the Execution of such to God the supreme Judge, no more then the Hangman amongst us may transfer the Execution of a Felon or Traitor to the Judge who condemns them: which answers and refutes one main objection of our opposites, that we must leave Idolaters, Heretics, and False Teachers unto Gods Judgement and Execution, if we cannot convert them by the Word, and let such tares to grow till the harvest, amongst the Corn.</p></blockquote>

URELY+BE+P%C6%B2T+TO+DEATH%3B+the+people+of+the+Land+shall+stone+him+with+stones%3B+and+I+will+set+my+face+against+that+man%2C+and+will+cut+him+off+from+among+his+people%2C+because+he+hath+given+of+his+seed+to+Molech%2C+to+defile+my+sanctuary+and+to+prophane+my+holy+Name.+And+if+the+people+of+the+Land+do+any+way+hide+their+eyes+when+he+giveth+his+seed+unto+Molech+and+kill+him+not%2C+then+I+will+set+my+face+against+that+man+and+against+his+family%2C+and+will+cut+him+off%2C+and+all+that+go+a+whoring+after+him+to+commit+whoredom+with+Molech%2C+from+among+their+people.+From+which+text+we+may+observe+these+particulars.%0A%0AFirst%2C+that+not+only+such+stranger+Idolaters%2C+who+constantly+worshipped+Idols%2C+and+never+adored+the+true+God+were+to+be+put+to+death+by+the+Israelites%3B+but+even+such+of+the+Israelites+themselves%2C+and+of+the+sojourners+among+them+who+turned+Idolaters+and+sacrificed+unto+Molech+%28to+whom+they+offered+their+children%29+were+to+be+surely+put+to+death%2C+and+stoned+with+stones+by+the+people+without+mercy%3B+being+first+convicted+and+condemned+by+the+Magistrate.%0A%0ASecondly%2C+that+the+Magistrates%E2%80%99+and+peoples%E2%80%99+hiding+of+their+eyes+and+sparing+such+as+these%2C+contrary+to+this+precept%2C+was+a+grievous+sin.+Thirdly%2C+that+where+the+Magistrates+and+people+winked+at+such+an+Idolater%2C+and+hid+their+eyes+from+him%2C+God+himself%2C+in+their+default%2C+would+set+his+face+against+him%2C+and+cut+him+off+from+among+his+people%3B+and+not+only+so%2C+but+would+set+his+face+against+his+family%3B+and+cut+off+all+them+that+went+a+whoring+after+him%2C+from+among+his+people%3A+whereas+if+the+Magistrate+had+punished+him%2C+his+family+had+not+been+thus+cut+off+by+God.%0A%0AFourthly%2C+that+it+is+not+sufficient+to+leave+Idolaters%2C+Heretics%2C+and+Blasphemers+to+God%E2%80%99s+own+vengeance+and+execution%2C+who+will+certainly+cut+them+and+their+families+off%2C+if+they+repent+not%3B+but+themselves+must+likewise+cut+them+off%2C+as+God+commands%2C+before+God+proceeds+to+do+it%2C+they+being+his+Ministers+and+Executioners+appointed+for+this+end%2C+who+must+not+put+off+the+Execution+of+such+to+God+the+supreme+Judge%2C+no+more+then+the+Hangman+amongst+us+may+transfer+the+Execution+of+a+Felon+or+Traitor+to+the+Judge+who+condemns+them%3A+which+answers+and+refutes+one+main+objection+of+our+opposites%2C+that+we+must+leave+Idolaters%2C+Heretics%2C+and+False+Teachers+unto+Gods+Judgement+and+Execution%2C+if+we+cannot+convert+them+by+the+Word%2C+and+let+such+tares+to+grow+till+the+harvest%2C+amongst+the+Corn.%E2%80%9D%0A%0A%E2%80%94+William+Prynne%2C+The+sword+of+Christian+magistracy+supported%2C+or%2C+A+vindication+of+the+Christian+magistrate%E2%80%99s+authority+under+the+Gospel%2C+to+punish+idolatry%2C+apostacy%2C+heresy%2C+blasphemy%2C+and+obstinate+schism%2C+with+corporal%2C+and+in+some+cases+with+capital+punishments%2C+%28London%3A+John+Bellamy%2C+1653%29%2C+pp+2-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F168076e78d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/168076e78d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/02/william-prynne-on-the-authority-of-christian-kings-to-suppress-idolatry/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>

<blockquote><p>The Jewish way under the law of praising the Lord was upon the timbrel, the harp, psaltery, and ten-stringed instruments, and other instruments of music that belonged to ceremonial worship that is now abolished. Christ, who is the end of the law, has torn or taken away the ceremonies of the law, and there is no warrant now to make use of the organs, as they do in the Popish Church, and in the Prelatical Church of England, and even among them that are more reformed, those over in Holland. Oh, but we have a great advantage in being free of these! But there are some in the other extreme, that are for no music at all, but we are to sing and praise vocally, and with the heart too. This reproves Quakers, who make a mock at singing of psalms. But we will let them see a fine ancient warrant for vocal music. “And be not drunk with wine… speaking to yourselves in psalms, hymns, and spiritual songs, making melody in your hearts to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Lecture 2’ on Ps. 92</cite></span></figcaption>

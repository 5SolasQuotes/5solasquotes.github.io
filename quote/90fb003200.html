<main class="wrap"><figure class="quote" id="q-90fb003200" data-kw="">
<blockquote><p>And it is very frivolous that they have always in their mouth that images are certain visible words of God which help the faith of them that be ignorant. For Paul testifies that faith comes by hearing and hearing by the word of God, not by pictures or images. If any be desirous to have Christ pictured, let him read the holy scriptures, let him have in his hand the gospels, the apostolical epistles, and the Acts of the apostles, and let him be oftentimes present at godly sermons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, (London, 1583), pt. 2, ch. 5, sect. 25, p. 353</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-1e6551a841" data-kw="">
<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>

</figure><figure class="quote" id="q-c3a3be2842" data-kw="">
<blockquote><p>Undoubtedly, in my opinion, no man endued with sound judgment will deny that lights, crosses and trifles of that sort flowed from superstition. Whence I hold, that those who retain them, while they possess liberty of choice, draw too eagerly from dregs. Nor do I see what purpose can be answered by burdening the Church with frivolous and useless (not to call them by their proper name, noxious) ceremonies, where we enjoy the liberty of establishing a pure and simple order.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ed4087ec9b" data-kw="">
<blockquote><p>Dr. Preston answered that Christ was in himself sufficient to save all; and might be said to be provided for that end and use; as a medicine is to cure infected poison, though it cures none actually but those that drink it. “Habet in se quod omnibus prosit, sed, si non bibitur, non,” as in 1 John 5:11-12. But many did not thus apply Christ, because they had him not so offered and exhibited as others had, Matt 11:21; Luke 10:13, for God gave some faith and repentance, as I have showed. The serpent (Moses was commanded to make), was in itself sufficient to cure those that were bitten, Num. 21:8-9, yet cured none but only those who looked on it. “So, as Moses lifted up the Serpent in the wilderness, shall the Son of Man be lifted up, that whosoever believed in Him should not perish but have everlasting life,” John 3:14-15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This is John Ball’s</cite>, (1590-1659) narrative of Preston’s debate with the Arminian Francis White (1564-1638). From Ball’s, The Life of the Renowned Doctor Preston, ed. by E. W. Harcourt (London: Parker &amp; Co., 1885), p. 135. This quote was compiled by Tony Byrne.</span></figcaption>

<blockquote><p>The third theological foundation of the Genevan Psalter was the doctrine of common grace. By this it was recognized that there are two types of divine gifts — supernatural and natural. The former are the virtues wrought in the soul by a special work of grace; the latter are those which pertain to secular matters and are distributed to all, not to saints only; as a matter of fact, often to sinners. But, wherever they were, Calvin recognized these and used them for his purposes. Skill in music is a natural rather than a supernatural skill, but Calvin was ever on the alert to capture this for the worship of God. Thus, at his Academy in Geneva, he made music required four hours each week. The choir thereby trained in this skill was to lead the people so they could, under its leadership, cultivate the same skill. Acting on this same principle, Calvin was quick to appreciate the able — though not excessively orthodox — Marot, and to stand by the gifted composer, Bourgeois, who was thrown into prison for breaking some of the rigid disciplines of Geneva of which Calvin was himself the main author. Abraham Kuyper, in his admirable Lectures on Calvinism, so aptly remarks, “Music…would flourish, henceforth, not within the narrow limitation of particular grace, but in the wide and fertile fields of common grace.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing the Words God Has Put in Our Mouths”</cite>, (originally published in The Hymn, January 1953), in John H. Gerstner: The Early Writings, vol. 1, pp. 204-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

— Philip Henry, An Exposition upon the First 11 Chapters of Genesis, p. 166">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+the+Lord+said%2C+My+Spirit+shall+not+always+strive+with+man%2C+for+that+he+also+is+flesh.%E2%80%9D%0A%0A%E2%80%94+Philip+Henry%2C+An+Exposition+upon+the+First+11+Chapters+of+Genesis%2C+p.+166&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83ee5c8d5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83ee5c8d5b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/#:~:text=And%20the%20Lord%20said%2C%20My%20Spirit,for%20that%20he%20also%20is%20flesh&amp;text=And%20the%20Lord%20said%2C%20My%20Spirit%20shall%20not&amp;text=with%20man%2C%20for%20that%20he%20also%20is%20flesh" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5785375741" data-kw="">
<blockquote><p>The origin of the doctrine of common grace was occasioned by the fact that there is in the world, alongside of the course of the Christian life with all its blessings, a natural course of life, which is not redemptive and yet exhibits many traces of the true, the good, and the beautiful. The question arose, How can we explain the comparatively orderly life in the world, seeing that the whole world lies under the curse of sin? How is it that the earth yields precious fruit in rich abundance and does not simply bring forth thorns and thistles? How we can we account for it that sinful man still retains some knowledge of God, of natural things, and of the difference between good and evil, and shows some regard for virtue and for good outward behavior? What explanation can be given for the special gifts and talents that with which the natural man is endowed, and of the development of science and art by those who are entirely devoid of the new life that is in Christ Jesus? How can we explain the religious aspirations of men everywhere, even of those who did not come in touch with the Christian religion? How can the unregenerate still speak truth, do good to others, and lead outwardly virtuous lives?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Eerdmans, 1968), pp. 432-46</span></figcaption>

od%20to%20others%2C%20and%20lead%20outwardly%20virtuous%20lives" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ddd2ba5cf" data-kw="">
<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

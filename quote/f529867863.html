<blockquote><p>X. We may sometimes interchange the eudokian [good-purpose of decree] for the euarestia [good-pleasure or complacency of the revealed will], when it is spoken of those things with which God is pleased because there is in them some quality or condition which agrees with the nature of God and therefore conciliates his favor… XI. Eurestia contradistinguished from eudokian in this connection means nothing else than the mere complacency by which God approves anything as just and holy and delights in it (and besides wills to prescribe it to the creature as his most just duty). Hence it does not properly include any decree or volition in God, but implies only the agreement of the thing with the nature of God (according to which He cannot but love what is agreeable to his holiness)… … XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 1 | 3rd Topic, ‘The Will of God’, 15th Question, ‘May the will be properly distinguished into the will of decree and of precept, good purpose (eudokias) and good pleasure (euarestias), signified, secret and revealed? We affirm.’</cite>, pp. 222, 224</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b8cb63195f" data-kw="">
<blockquote><p>I answer that… Therefore, that toward which God has ordered the creature with regard to himself is said to be willed by him as by a first intention or by an antecedent will. But when a creature is impeded from this end because of its defect, God still fulfills in it the goodness of which it is capable; and this pertains, as it were, to his second intention and it is called a consequent will. Thus, since God made all men for blessedness, he is said to will the salvation of all men by an antecedent will; but since some are turned against their own salvation, whom the order of his wisdom does not allow to come to salvation because of their defect, he fulfills in them what pertains to his goodness in another way, namely, condemning them by justice; so that whereas they do not attain to the first order of his will, they fall into the second; and while they do not carry out God’s will, the will of God is fulfilled in them. However, the very defect of sin by which someone is rendered worthy of punishment in the present or else the future is not willed by God either by an antecedent or a consequent will, but it is only permitted by him… and neither did he order him to salvation according to the order of predestination, which is the order of absolute will; rather, to the extent that this order is from himself, he gave to him a nature ordered to beatitude. Reply Obj. 1: Neither order nor distinction comes from the act of the will, but only from the things willed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the divine will can be distinguished by antecedent and consequent?’ in Disputed Questions, On Truth, question 23, On the Will of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-a47b51708f" data-kw="">
<blockquote><p>But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind... (Cambridge: Daniel, 1641), ‘Answer to his Five Reasons against Absolute Reprobation’</cite>, pp. 225-27</span></figcaption>

</figure><figure class="quote" id="q-c67f6c7c3c" data-kw="">
<blockquote><p>Having proved it [the Mosaic deliverance of the 10 Commandments] is a covenant, all the difficulty remains in declaring what covenant it is; for here is much difference of judgements, even with the learned and orthodox… Some explain it thus: God (say they) had a primary or antecedent will in giving of the Law, or a secondary and consequent: His primary will was to hold out perfect and exact righteousness, against which the apostle argues and proves no man can be justified thereby: but then God, knowing man’s impotency and inability, did secondarily command repentance and promises a gracious acceptance through Christ; and this [understanding] may be very well received, if it be not vexed with ill interpretations. But, lastly, this way I shall go: The Law (as to this purpose) may be considered more largely, as that whole doctrine delivered on Mount Sinai with the preface and promises adjoined and all things that may be reduced to it; or more strictly, as it is an abstracted rule of righteousness, holding forth life upon no terms but perfect obedience. Now take it in the former sense: it was a covenant of grace; take it in the later sense, as abstracted from Moses’s administration of it, and so it was not of grace, but works.</p></blockquote>

online.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Having%20proved%20it%20%5Bthe%20Mosaic%20deliverance,was%20not%20of%20grace%2C%20but%20works." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God’s call sometimes is ineffectual, and sometimes effectual. So the same apostle plainly declares in 1 Thess. 2:13: “For this cause also thank we God, which effectually works also in you that believe.” Observe that it is the work of God’s Spirit in the heart, superadded to the Word of the Gospel, as spoken by men, that makes any call effectual. Without this inward work, God may call, and the soul will never answer… It is this effectual work of God’s Spirit, in regenerating the soul by infusing of habits of grace, which distinguishes an internal effectual call of God form a mere external and ineffectual one… The text makes sure that it might be known whether or not God has so called you by His Word, as that also He has worked in you by His Spirit; whether God has illuminated your understanding, and inclined your will, so that you have complied with God’s will, and have answered His call. Whether, when God drew you, you ran after Him (Cant. 1:4); whether, when God entreated and persuaded you to be reconciled to Him you consented (2 Cor. 5:20); whether, when He wooed you, He also won you; whether, when He invited you to the wedding supper of His Son, you made no excuse or delay, but accepted, and welcomed the offer of the Gospel with faith and love (Luke 14:18). All which if you did do, it arose from the power of an inward call, being superadded to the outward call of the Word…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-aa549e4838" data-kw="">
<blockquote><p>He rose the same person, the same Jesus Christ, very God and very man, which had died; he rose according to the nature in which he had suffered, which was his human nature, his true human nature, the very same which it was in essence and properties, not deified, but glorified, having laid aside all the infirmities to which it was subject. “Behold my hands and my feet, it is I myself; handle me, and see; for a spirit has not flesh and bones, as you see me have” (Luke 24:39.) And truly nothing different from that which had died, could rise again. The very same body, therefore, which had fallen a victim to death rose again; and it is this which affords us such great consolation. For it was necessary that he should be one, and the same mediator, who would merit for us those blessings which we had lost by sin, and who would restore them unto us, by applying them to each one singly. Indeed, had not the flesh of Christ risen, ours could not rise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Doctrine, on Heidelberg Catechism Question 45</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ.html">The Person of Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82d60b4913" data-kw="">
<blockquote><p>That God did spiritually and mystically represent unto Moses the incarnation and mediation of Christ, with the church of the elect which was to be gathered thereby, and its spiritual worship. And moreover, he let him know how the tabernacle and all that belonged thereunto, did represent him and them. For the tabernacle that Moses made was a sign and figure of the body of Christ. This we have proved in the exposition of the second verse of this chapter; and it is positively affirmed by the apostle, Col. 2:17. For therein would God dwell really and substantially: Col. 2:9, “In him dwelleth all the fulness of the Godhead bodily.” And the tabernacle was but to represent this inhabitation of God in Christ. Therefore did he dwell therein typically by sundry pledges of his presence, that he might represent the real substantial inhabitation of the Godhead in the body or human nature of Christ. This, therefore, was the ἀρχέτυπος, whereunto the tabernacle was to be framed; and this was that which was showed unto Moses on the top of the mount. These were the “heavenly things,” which they served unto the resemblance and shadow of. It is therefore most probable, and most agreeable unto the mystery of the wisdom of God in these things, that, before the building of the tabernacle below, God did show unto Moses what was to be signified and represented thereby, and what he would introduce when that was to be taken away. He first showed “the true tabernacle,” then appointed a figure of it, which was to abide and serve the worship of the church, until that true one was to be introduced, when this was to be taken down and removed out of the way: which is the substance of what the apostle designeth to prove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 46–47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>I… The occasion for this calumny [by Romanists] is taken from Calvin’s words in Mt. 26, found in his Harmony of the Gospels. There, Calvin, writing about Christ’s prayer, “My Father, if it is possible, let this cup pass from me; yet not as I will, but as you will,” includes these words among others: ‘He was struck with fear and constricted by anxiety, so that it was necessary for him to vacillate, as it were, with alternating prayers amidst the violent waves of temptations. This is the reason why, having prayed for the cup to pass, He immediately reins Himself in, and submitting his prayer to the Father’s command, He chastises and recalls the request that had just slipped out. And there, He says, ‘This was not a deliberate prayer of Christ, but the force and sudden impulse of grief extorted the words, to which correction was immediately added; the same vehemence also took away the immediate memory of the heavenly decree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), on the Impeccability of Christ, p. 570 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<main class="wrap"><figure class="quote" id="q-ed958aa302" data-kw="">
<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World, p. 170</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>

<blockquote><p>On the Natures of Things &amp; Substantial Forms 1. We do not introduce these things to the students so that they will all now immediately necessarily believe in forms with their appendices, or contend tooth and nail for them, but so that they may at least for a time abstain from a peremptory judgment and its execution, by which the miserable and innocent beings are cast down from their ancient possession, until they have learned thoroughly, if not most accurately, at least moderately the philosophy of the schools, specifically logic, metaphysics, physics and these few notes which we subjoin, having been solidly determined, and they see that they are satisfied in them. However they will finally judge, we will not have wasted our labor if in the meantime we will have recalled them from a fierce contempt and flight of the philosophical study, moreover from an idiotic rustic and proud ignorance, so that at least it could sometime be said concerning those dissenting elsewhere what is boasted among the Arabs: A wise man when he errs, errs with learned error. Moreover our notes are threefold: 1. Certain prejudgments which I [approvingly] suggest to the disputants. 2. Reasons for forms, which are to be clearly solved. 3. Reasons against forms and for those vicarious accidents which certain more recent [mechanical] authors wish to be substituted for forms, which forms and their doubts, with their principles and consequences, are fittingly to be defended. 2. The notes of the first kind are: I. Let them consider whether they satisfy themselves in the reconciliation of this opinion [of forms] with sacred scripture. For it indeed harmonizes with truth: and Christian philosophers will profess learned ignorance a thousand times rather than that they bring even the least appearance of prejudice to divine truth. See Gen. 1:11, 21-22, 24-25; Prov. 30:24-27, where we think permanent natures, faculties and distinct species of things are implied. II. It is to be seen whether from the denying opinion there would be at least an easier lapse than from the affirming into doubt. [Put the question forth:] Whether there are any substantial forms which actuate the body of man and constitute one composite with it? But if someone denies this, and substitutes the krasin of Galen, or a particle of divine breath or soul of the world, or the universal intellect of Averroes, or the mind of Plato, thrust into the workshop of the body as a genial pipor and bound to it, as Prometheus the Caucasian, if someone I say substitutes such a thing, by what reasons would you more successfully and safely rebut him than [those by which] the assertors of forms [do]. III. It is to be seen how with this opinion standing the distinction between the being of substance and of accident can be conveniently explained and defended. For there would be, according to them, no substantial difference between a wolf, a sheep, a whale, an elephant, a serpent, a stone, a monk’s hood, aconite, wheat, the sun, the moon, the earth; add also a clock, the wooden Trojan horse, the bronze bull of Phalaris, the flying dove of Archytas, the bronze head of Pope Sylvester, the speaking statue of Albertus Magnus, a house, a chair, a garment etc. But perhaps they would retort that those substances differ essentially through those five accidents motion, rest, position, figure and quantity. I respond: Granting this to be so (about which we do not now dispute), the difficulty is nevertheless not removed by this escape. It nevertheless remains [on this view] that substances are distinguished from substances in no other way than accidents from substances and accidents among themselves, for both the former and the latter are distinguished by accidents. IV. It is to be seen whether from here there is not an easier lapse, when someone is pressed by reasons and consequences into this absurd [occasionalist] opinion: ‘Secondary causes endowed with their own causality are not given, but only the first and universal cause acts in the presence and disposition of secondary causes.’ See the absurdity of this opinion shown by the Scholastics and more recent metaphysicians and theologians in the topic on Providence, on the concourse of God with creatures. Let the consequences [of their position], by which they could be pressed, be these: 1. That the concourse of God is not given, nor the motion of the first mover accommodated to the natures and properties of secondary causes, whether they are necessary or contingent. 2. That there is not in created substances an intrinsic mover and a substantial principle of internal and proper motion: for the disposition of the mobile thing to motion from quantity, figure, position is not the activity or causality of the efficient cause, but only a required condition, and a cause sine qua non (‘without which nothing’). 3. Consequently, since no mobile thing can move itself in potency to act or determine itself to motion, it remains that some external mover is to be sought which may lead the potency into act. But what will they give here? The Platonic-Virgilian soul of the world, or intelligences, or God, or atoms, or celestial globules. Here something will have to be said [by them]. V. It is to be seen lest the negation of proper qualities, which internally emanate from the form and substance of a thing (the negation of which follows the negation of forms, just as one error drags another), drive us into these absurdities: 1. That created substances are the immediate principle of their own operation, since there are no active qualities by which substances operate as a means: which see shaken out by the metaphysicians and theologians when they treat of the simplicity of God and of the distinction of the divine attributes. 2. That there are no qualities altogether, as neither of the second, or third, so also not of the first species; that is, there are no habits, against the common school of philosophers and theologians. I would like to see how those who deny natural faculties or powers will vindicate habits against the atheists, skeptics and infidels (the necessity of which Scripture and reason persuades), lest they be likewise shut up in that pentagon-workshop of motion, rest, quantity, position and figure. VI. From this opinion it follows that no definitions of substances are given, since there are no forms or proper first and internal essentials from which the difference can be taken. How this may savor to the sons of the logicians of whatever sect, and to all acroamatic minds, and to the professors of whatever disciplines, they themselves will see. VII. This absurdity also follows: That all created substances, even man himself (and why not angels and separate souls?), are beings per accidens [through accident], collective and aggregate: but not essences or natures, one per se [through itself]. So that no essence seems to be per se, except perhaps atoms, or ethereal globules, or insensible particles, or Platonic ideas (which he called αυτοάνθρωπον, αυτοίππον, etc.) or chimeras buzzing in the void, etc. But that man ought to be called a being and one per se, we will teach below. VIII. It would follow that there are no proper and intrinsic faculties, nor are their principles in animals of another kind than in automata or Daedalean statues; and consequently the works of God and nature produced through creation or generation are essentially and univocally the same with works of art: which how it may agree well enough with Ps. 104:29; 7:14-15; Num. 16:22; 27:16; Heb. 11:9-10; Hab. 2:19, I confess I do not see the knot. IX. It would follow that there is no generation or corruption of natural things. But more on this in Thesis 4 [below]. X. Since efficiency and motion, which is usually attributed to forms and their active qualities, is attributed to quantity and figure, it is to be seen lest young men at some time imprudently admit through consequence that magical axiom rejected by all Christian theology and philosophy: “There is some efficacy of quantity and figure, and it either per se or with others things concurs as an active principle of transmutation.</p></blockquote>

lity are not given, but only the first and universal cause acts in the presence and disposition of secondary causes.’ See the absurdity of this opinion shown by the Scholastics and more recent metaphysicians and theologians in the topic on Providence, on the concourse of God with creatures. Let the consequences [of their position], by which they could be pressed, be these: 1. That the concourse of God is not given, nor the motion of the first mover accommodated to the natures and properties of secondary causes, whether they are necessary or contingent. 2. That there is not in created substances an intrinsic mover and a substantial principle of internal and proper motion: for the disposition of the mobile thing to motion from quantity, figure, position is not the activity or causality of the efficient cause, but only a required condition, and a cause sine qua non (‘without which nothing’). 3. Consequently, since no mobile thing can move itself in potency to act or determine itself to motion, it remains that some external mover is to be sought which may lead the potency into act. But what will they give here? The Platonic-Virgilian soul of the world, or intelligences, or God, or atoms, or celestial globules. Here something will have to be said [by them]. V. It is to be seen lest the negation of proper qualities, which internally emanate from the form and substance of a thing (the negation of which follows the negation of forms, just as one error drags another), drive us into these absurdities: 1. That created substances are the immediate principle of their own operation, since there are no active qualities by which substances operate as a means: which see shaken out by the metaphysicians and theologians when they treat of the simplicity of God and of the distinction of the divine attributes. 2. That there are no qualities altogether, as neither of the second, or third, so also not of the first species; that is, there are no habits, against the common school of philosophers and theologians. I would like to see how those who deny natural faculties or powers will vindicate habits against the atheists, skeptics and infidels (the necessity of which Scripture and reason persuades), lest they be likewise shut up in that pentagon-workshop of motion, rest, quantity, position and figure. VI. From this opinion it follows that no definitions of substances are given, since there are no forms or proper first and internal essentials from which the difference can be taken. How this may savor to the sons of the logicians of whatever sect, and to all acroamatic minds, and to the professors of whatever disciplines, they themselves will see. VII. This absurdity also follows: That all created substances, even man himself (and why not angels and separate souls?), are beings per accidens [through accident], collective and aggregate: but not essences or natures, one per se [through itself]. So that no essence seems to be per se, except perhaps atoms, or ethereal globules, or insensible particles, or Platonic ideas (which he called αυτοάνθρωπον, αυτοίππον, etc.) or chimeras buzzing in the void, etc. But that man ought to be called a being and one per se, we will teach below. VIII. It would follow that there are no proper and intrinsic faculties, nor are their principles in animals of another kind than in automata or Daedalean statues; and consequently the works of God and nature produced through creation or generation are essentially and univocally the same with works of art: which how it may agree well enough with Ps. 104:29; 7:14-15; Num. 16:22; 27:16; Heb. 11:9-10; Hab. 2:19, I confess I do not see the knot. IX. It would follow that there is no generation or corruption of natural things. But more on this in Thesis 4 [below]. X. Since efficiency and motion, which is usually attributed to forms and their active qualities, is attributed to quantity and figure, it is to be seen lest young men at some time imprudently admit through consequence that magical axiom rejected by all Christian theology and philosophy: “There is some efficacy of quantity and figure, and it either per se or with others things concurs as an active principle of transmutation.”

— Gisbertus Voetius, ‘On the Natures of Things &amp; Substantial Forms’, pp. 369-76 in Select Theological Disputations, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), ‘On Creation’, pt. 8 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+the+Natures+of+Things+%26+Substantial+Forms+1.+We+do+not+introduce+these+things+to+the+students+so+that+they+will+all+now+immediately+necessarily+believe+in+forms+with+their+appendices%2C+or+contend+tooth+and+nail+for+them%2C+but+so+that+they+may+at+least+for+a+time+abstain+from+a+peremptory+judgment+and+its+execution%2C+by+which+the+miserable+and+innocent+beings+are+cast+down+from+their+ancient+possession%2C+until+they+have+learned+thoroughly%2C+if+not+most+accurately%2C+at+least+moderately+the+philosophy+of+the+schools%2C+specifically+logic%2C+metaphysics%2C+physics+and+these+few+notes+which+we+subjoin%2C+having+been+solidly+determined%2C+and+they+see+that+they+are+satisfied+in+them.+However+they+will+finally+judge%2C+we+will+not+have+wasted+our+labor+if+in+the+meantime+we+will+have+recalled+them+from+a+fierce+contempt+and+flight+of+the+philosophical+study%2C+moreover+from+an+idiotic+rustic+and+proud+ignorance%2C+so+that+at+least+it+could+sometime+be+said+concerning+those+dissenting+elsewhere+what+is+boasted+among+the+Arabs%3A+A+wise+man+when+he+errs%2C+errs+with+learned+error.+Moreover+our+notes+are+threefold%3A+1.+Certain+prejudgments+which+I+%5Bapprovingly%5D+suggest+to+the+disputants.+2.+Reasons+for+forms%2C+which+are+to+be+clearly+solved.+3.+Reasons+against+forms+and+for+those+vicarious+accidents+which+certain+more+recent+%5Bmechanical%5D+authors+wish+to+be+substituted+for+forms%2C+which+forms+and+their+doubts%2C+with+their+principles+and+consequences%2C+are+fittingly+to+be+defended.+2.+The+notes+of+the+first+kind+are%3A+I.+Let+them+consider+whether+they+satisfy+themselves+in+the+reconciliation+of+this+opinion+%5Bof+forms%5D+with+sacred+scripture.+For+it+indeed+harmonizes+with+truth%3A+and+Christian+philosophers+will+profess+learned+ignorance+a+thousand+times+rather+than+that+they+bring+even+the+least+appearance+of+prejudice+to+divine+truth.+See+Gen.+1%3A11%2C+21-22%2C+24-25%3B+Prov.+30%3A24-27%2C+where+we+think+permanent+natures%2C+faculties+and+distinct+species+of+things+are+implied.+II.+It+is+to+be+seen+whether+from+the+denying+opinion+there+would+be+at+least+an+easier+lapse+than+from+the+affirming+into+doubt.+%5BPut+the+question+forth%3A%5D+Whether+there+are+any+substantial+forms+which+actuate+the+body+of+man+and+constitute+one+composite+with+it%3F+But+if+someone+denies+this%2C+and+substitutes+the+krasin+of+Galen%2C+or+a+particle+of+divine+breath+or+soul+of+the+world%2C+or+the+universal+intellect+of+Averroes%2C+or+the+mind+of+Plato%2C+thrust+into+the+workshop+of+the+body+as+a+genial+pipor+and+bound+to+it%2C+as+Prometheus+the+Caucasian%2C+if+someone+I+say+substitutes+such+a+thing%2C+by+what+reasons+would+you+more+successfully+and+safely+rebut+him+than+%5Bthose+by+which%5D+the+assertors+of+forms+%5Bdo%5D.+III.+It+is+to+be+seen+how+with+this+opinion+standing+the+distinction+between+the+being+of+substance+and+of+accident+can+be+conveniently+explained+and+defended.+For+there+would+be%2C+according+to+them%2C+no+substantial+difference+between+a+wolf%2C+a+sheep%2C+a+whale%2C+an+elephant%2C+a+serpent%2C+a+stone%2C+a+monk%E2%80%99s+hood%2C+aconite%2C+wheat%2C+the+sun%2C+the+moon%2C+the+earth%3B+add+also+a+clock%2C+the+wooden+Trojan+horse%2C+the+bronze+bull+of+Phalaris%2C+the+flying+dove+of+Archytas%2C+the+bronze+head+of+Pope+Sylvester%2C+the+speaking+statue+of+Albertus+Magnus%2C+a+house%2C+a+chair%2C+a+garment+etc.+But+perhaps+they+would+retort+that+those+substances+differ+essentially+through+those+five+accidents+motion%2C+rest%2C+position%2C+figure+and+quantity.+I+respond%3A+Granting+this+to+be+so+%28about+which+we+do+not+now+dispute%29%2C+the+difficulty+is+nevertheless+not+removed+by+this+escape.+It+nevertheless+remains+%5Bon+this+view%5D+that+substances+are+distinguished+from+substances+in+no+other+way+than+accidents+from+substances+and+accidents+among+themselves%2C+for+both+the+former+and+the+latter+are+distinguished+by+accidents.+IV.+It+is+to+be+seen+whether+from+here+there+is+not+an+easier+lapse%2C+when+someone+is+pressed+by+reasons+and+consequences+into+this+absurd+%5Boccasionalist%5D+opinion%3A+%E2%80%98Secondary+causes+endowed+with+their+own+causality+are+not+given%2C+but+only+the+first+and+universal+cause+acts+in+the+presence+and+disposition+of+secondary+causes.%E2%80%99+See+the+absurdity+of+this+opinion+shown+by+the+Scholastics+and+more+recent+metaphysicians+and+theologians+in+the+topic+on+Providence%2C+on+the+concourse+of+God+with+creatures.+Let+the+consequences+%5Bof+their+position%5D%2C+by+which+they+could+be+pressed%2C+be+these%3A+1.+That+the+concourse+of+God+is+not+given%2C+nor+the+motion+of+the+first+mover+accommodated+to+the+natures+and+properties+of+secondary+causes%2C+whether+they+are+necessary+or+contingent.+2.+That+there+is+not+in+created+substances+an+intrinsic+mover+and+a+substantial+principle+of+internal+and+proper+motion%3A+for+the+disposition+of+the+mobile+thing+to+motion+from+quantity%2C+figure%2C+position+is+not+the+activity+or+causality+of+the+efficient+cause%2C+but+only+a+required+condition%2C+and+a+cause+sine+qua+non+%28%E2%80%98without+which+nothing%E2%80%99%29.+3.+Consequently%2C+since+no+mobile+thing+can+move+itself+in+potency+to+act+or+determine+itself+to+motion%2C+it+remains+that+some+external+mover+is+to+be+sought+which+may+lead+the+potency+into+act.+But+what+will+they+give+here%3F+The+Platonic-Virgilian+soul+of+the+world%2C+or+intelligences%2C+or+God%2C+or+atoms%2C+or+celestial+globules.+Here+something+will+have+to+be+said+%5Bby+them%5D.+V.+It+is+to+be+seen+lest+the+negation+of+proper+qualities%2C+which+internally+emanate+from+the+form+and+substance+of+a+thing+%28the+negation+of+which+follows+the+negation+of+forms%2C+just+as+one+error+drags+another%29%2C+drive+us+into+these+absurdities%3A+1.+That+created+substances+are+the+immediate+principle+of+their+own+operation%2C+since+there+are+no+active+qualities+by+which+substances+operate+as+a+means%3A+which+see+shaken+out+by+the+metaphysicians+and+theologians+when+they+treat+of+the+simplicity+of+God+and+of+the+distinction+of+the+divine+attributes.+2.+That+there+are+no+qualities+altogether%2C+as+neither+of+the+second%2C+or+third%2C+so+also+not+of+the+first+species%3B+that+is%2C+there+are+no+habits%2C+against+the+common+school+of+philosophers+and+theologians.+I+would+like+to+see+how+those+who+deny+natural+faculties+or+powers+will+vindicate+habits+against+the+atheists%2C+skeptics+and+infidels+%28the+necessity+of+which+Scripture+and+reason+persuades%29%2C+lest+they+be+likewise+shut+up+in+that+pentagon-workshop+of+motion%2C+rest%2C+quantity%2C+position+and+figure.+VI.+From+this+opinion+it+follows+that+no+definitions+of+substances+are+given%2C+since+there+are+no+forms+or+proper+first+and+internal+essentials+from+which+the+difference+can+be+taken.+How+this+may+savor+to+the+sons+of+the+logicians+of+whatever+sect%2C+and+to+all+acroamatic+minds%2C+and+to+the+professors+of+whatever+disciplines%2C+they+themselves+will+see.+VII.+This+absurdity+also+follows%3A+That+all+created+substances%2C+even+man+himself+%28and+why+not+angels+and+separate+souls%3F%29%2C+are+beings+per+accidens+%5Bthrough+accident%5D%2C+collective+and+aggregate%3A+but+not+essences+or+natures%2C+one+per+se+%5Bthrough+itself%5D.+So+that+no+essence+seems+to+be+per+se%2C+except+perhaps+atoms%2C+or+ethereal+globules%2C+or+insensible+particles%2C+or+Platonic+ideas+%28which+he+called+%CE%B1%CF%85%CF%84%CE%BF%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CE%BD%2C+%CE%B1%CF%85%CF%84%CE%BF%CE%AF%CF%80%CF%80%CE%BF%CE%BD%2C+etc.%29+or+chimeras+buzzing+in+the+void%2C+etc.+But+that+man+ought+to+be+called+a+being+and+one+per+se%2C+we+will+teach+below.+VIII.+It+would+follow+that+there+are+no+proper+and+intrinsic+faculties%2C+nor+are+their+principles+in+animals+of+another+kind+than+in+automata+or+Daedalean+statues%3B+and+consequently+the+works+of+God+and+nature+produced+through+creation+or+generation+are+essentially+and+univocally+the+same+with+works+of+art%3A+which+how+it+may+agree+well+enough+with+Ps.+104%3A29%3B+7%3A14-15%3B+Num.+16%3A22%3B+27%3A16%3B+Heb.+11%3A9-10%3B+Hab.+2%3A19%2C+I+confess+I+do+not+see+the+knot.+IX.+It+would+follow+that+there+is+no+generation+or+corruption+of+natural+things.+But+more+on+this+in+Thesis+4+%5Bbelow%5D.+X.+Since+efficiency+and+motion%2C+which+is+usually+attributed+to+forms+and+their+active+qualities%2C+is+attributed+to+quantity+and+figure%2C+it+is+to+be+seen+lest+young+men+at+some+time+imprudently+admit+through+consequence+that+magical+axiom+rejected+by+all+Christian+theology+and+philosophy%3A+%E2%80%9CThere+is+some+efficacy+of+quantity+and+figure%2C+and+it+either+per+se+or+with+others+things+concurs+as+an+active+principle+of+transmutation.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+%E2%80%98On+the+Natures+of+Things+%26+Substantial+Forms%E2%80%99%2C+pp.+369-76+in+Select+Theological+Disputations%2C+vol.+1%2C+pt.+2+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+%E2%80%98On+Creation%E2%80%99%2C+pt.+8+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17509e63f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17509e63f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=On%20the%20Natures%20of%20Things,as%20an%20active%20principle%20of%20transmutation&amp;text=On%20the%20Natures%20of%20Things%20%26%20Substantial%20Forms&amp;text=things%20concurs%20as%20an%20active%20principle%20of%20transmutation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Potential Being to Something is Pure Act [see pp. 50-55 of the Summary] 40. Act and potency¹ divide being and every kind of being. This Scholastic axiom must be understood of act and potency as disjunctive attributes of being, where its truth is sufficiently plain. The sense is: everything of which the definition of being holds (namely, what existence is not repugnant to) either actually exists or does not actually exist. This disjunctive is valid not only of being as a transcendental but also of categorical being, so that everything of which the definition of substance or any of the accidents is true, either actually exists or is in objective potency to existing. 41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.] 42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible. 43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not. 44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable. 45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause. 46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency. 47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).] … 59. Every composite consists of act and potency. For parts have in their formal concept the idea of mutual perfectibility, and so are in potency to the whole.</p></blockquote>

— Allan Wolter, ‘Allan Wolter’s Conclusions respecting Reality, Proving God’, ‘Conclusions respecting Reality’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPotential+Being+to+Something+is+Pure+Act+%5Bsee+pp.+50-55+of+the+Summary%5D+40.+Act+and+potency%C2%B9+divide+being+and+every+kind+of+being.+This+Scholastic+axiom+must+be+understood+of+act+and+potency+as+disjunctive+attributes+of+being%2C+where+its+truth+is+sufficiently+plain.+The+sense+is%3A+everything+of+which+the+definition+of+being+holds+%28namely%2C+what+existence+is+not+repugnant+to%29+either+actually+exists+or+does+not+actually+exist.+This+disjunctive+is+valid+not+only+of+being+as+a+transcendental+but+also+of+categorical+being%2C+so+that+everything+of+which+the+definition+of+substance+or+any+of+the+accidents+is+true%2C+either+actually+exists+or+is+in+objective+potency+to+existing.+41.+Potency+involves+some+imperfection+if+it+is+understood+in+the+sense+of+subjective+or+objective+potency+%28potential+being%29+%5Bsee+pp.+51-52%5D+or+of+passive+or+obediential+potency%C2%B9+%5Bsee+pp.+52-53%5D%3B+but+not+if+it+is+understood+as%3A+the+possible+is+opposed+to+the+impossible.+%C2%B9+%5BSee+also+%E2%80%98On+Obediential+Potency%E2%80%99.%5D+The+point+is+plain+from+the+definitions+of+these+potencies%3B+for+all+these+potencies+adduced+before+agree+in+that+they+express+the+capacity+of+receiving+some+real+perfection%2C+and+so+that+which+is+said+to+be+in+this+sort+of+potency+is+in+itself+perfectible+and+hence+in+some+way+imperfect.+Actual+being+on+the+contrary+does+not+involve+imperfection.+The+same+must+be+said+of+the+logically+possible+and+of+active+potency%C2%B9+%5Bthat+these+do+not+involve+imperfection%5D.+%C2%B9+%5BThe+importance+here+is+because+the+First+Cause+%28i.e.+God%29+has+no+passive+potency%2C+or+capability+to+be+acted+upon+or+effected%2C+but+has+all+active+potency%2C+that+is%2C+to+act+upon+others.+This+is+not+special+pleading+for+God%2C+but+is+plainly+necessary+for+what+a+First+Cause+must+be.+See+%E2%80%98On+the+Distinction+Between+Passive+Power+%28Denied%29+%26+Active+Power+%28Affirmed%29+About+God%E2%80%99.%5D+42.+Act+and+potency+as+constitutive+principles+involve+imperfection+insofar+as+they+are+mutually+perfectible+in+themselves%3B+for+only+the+imperfect+is+perfectible.+43.+Potential+being+considered+in+itself+is+not+simply+real%2C+that+is%2C+does+not+really+exist%2C+save+virtually+in+its+causes.+But+it+differs+conceptually+from+the+absolutely+nothing+and+from+being+of+reason+%5Bthat+which+only+exists+in+a+mind%5D%3B+for+the+idea+of+a+possible+quiddity+%5Bwhat-ness+or+essence%5D+involves+the+relation+of+non-repugnance+to+existence%2C+while+the+others+do+not.+44.+Therefore+that+which+is+a+potential+being+cannot+have+the+reason+for+its+existence+in+itself+but+in+its+cause%3B+so+the+potential+is+the+causable.+45.+If+something+is+a+potential+being%2C+something+else+is+actual.+Potential+being+does+not+in+fact+exist%3B+therefore+if+it+can+in+fact+exist%2C+some+being+is+required+that+can+effect+it%3B+therefore+%28from+conclusions+24+and+26%29+something+actually+exists%2C+namely+at+least+the+first+ineffectible+efficient+cause.+46.+If+something+is+in+subjective%2C+passive%2C+objective%2C+or+obediential+potency+it+is+causable.+The+point+is+plain+from+the+definitions%2C+at+least+as+concerns+the+real+perfection+to+which+something+is+in+potency.+47.+Therefore+if+something+is+uncausable%2C+it+is+not+in+this+sort+of+potency%2C%C2%B9+but+is+pure+act+%28from+negation+of+the+previous+conclusion%29.+%C2%B9+%5BThe+importance+again%2C+is+that+the+First+Cause+%28i.e.+God%29+can+have+no+passive+potency+to+be+acted+on+%28which+would+be+an+imperfection%29%2C+but%2C+in+the+words+of+Wolter%2C+has+all+logical+potency%2C+or+active+potency+to+cause+others+%28which+is+no+imperfection%2C+but+the+height+of+perfection%29.%5D+%E2%80%A6+59.+Every+composite+consists+of+act+and+potency.+For+parts+have+in+their+formal+concept+the+idea+of+mutual+perfectibility%2C+and+so+are+in+potency+to+the+whole.%E2%80%9D%0A%0A%E2%80%94+Allan+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa83b38496a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a83b38496a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=Potential%20Being%20to%20Something%20is%20Pure,are%20in%20potency%20to%20the%20whole&amp;text=Potential%20Being%20to%20Something%20is%20Pure%20Act%20%5Bsee&amp;text=and%20so%20are%20in%20potency%20to%20the%20whole" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

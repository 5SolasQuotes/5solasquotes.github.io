<main class="wrap"><figure class="quote" id="q-ae60862e38" data-kw="">
<blockquote><p>Let us 1. distinguish of opinions. Some are in the foundation, in those necessary doctrines upon which the House of God is built, 1 Cor. 3:9-10; Heb. 6:1; Mt. 7:24, the errors contrary wherereunto are pernicious and damnable, 2 Pet. 2:1. Some are only in the superstruction which do not so nearly touch the vitals and essentials of religion, which are not fidei but quaestionum, as Augustine somewhere distinguishes. Such were in the apostles’ time disputes touching meats, and drinks, and days, and things indifferent, Rom. 14:5-6, and in our days touching forms of discipline and government in the Church, wherein men abound in their own sense, with meekness and with submission to the spirits of the prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Two Sermons, one touching composing of Controversies, another touching Unity of Judgement &amp; Love amongst Brethren</cite>, … (London, 1659), pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85e9dc4a2c" data-kw="">
<blockquote><p>We acknowledge separation from corruption, but not from the worship of corrupters, when they keep the foundation; the Samaritan-Church had not the foundation, but worshipped they knew not what, neither was there salvation in their Church, Jn. 4:2; but there was the true God worshipped among the Jews and salvation amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, p. 133</span></figcaption>

</figure><figure class="quote" id="q-de6215db97" data-kw="">
<blockquote><p>Bucer believed that in a face-to-face dialogue it would be easierto persuade one’s opponents of the truth… Bucer knew well that written documents were subjected to differing interpretations. His preference for public dialogue also influenced many of his written works, which adopted the literary genre of a fictional dialogue. In these works, he would exemplify how men of differing opinions could peaceably and gradually arrive at agreement on the truth. This gradual approach was illustrative of his pedagogy for persuading and teaching others the truth of God’s word… As Stupperich has asserted, for Bucer unity would result not from compromise but from the clarification of misunderstandings that enable a unity in the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism</cite>, (Oxford Univ. Press, 2010) 260 pp. ToC, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-79509cd451" data-kw="">
<blockquote><p>What if I live in a Church where I think their gouernment is not according to God’s Word? I answer: First, that though euery particular in that government cannot be maintained by God’s Word, yet in the general it may be soundly maintained.</p></blockquote>

</figure><figure class="quote" id="q-3941b2b017" data-kw="">
<blockquote><p>…this accommodation is not impossible: if indeed it were, God does not bind us to the seeking after it… If we look upon the nature of the things wherein they differ, they are not of such moment as to divide between brethren; their differences are not about fundamentals, but superstructures: there is no opinion expressly maintained by either side which is directly contrary to the substance of faith, or destructive to salvation; nay, whatever are such, they are condemned by both. Nor [is] the difference in those matters wherein they differ so wide but they may be composed and brought together, if men will act humility and self-denial. It was said of the differences between Luther and the [reformed] Helvetians, that there was not any impossibility in respect of the things themselves; if their spirits could be reconciled, their causes might easily be reconciled… where the difference is substantial, I do not see but if humility and self-denial might take place, if interests might be waved, if pre-engagements might be slighted, even in those things there might be an agreement; certainly, God does not make the difference so great as we ourselves do make it… It was the speech of one concerning the reconciliation of the German Churches: It is possible for the most hot and rigorous spirits to be reconciled, but it is easy for peaceable and moderate men to be agreed. The differences are not between enemies, but between brethren, and neither of them proud, imperious and contentious, but both of them humble, holy and peaceable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), pp. 349–50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

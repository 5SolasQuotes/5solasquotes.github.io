<main class="wrap"><figure class="quote" id="q-1494879734" data-kw="">
<blockquote><p>it is enacted, that the parsons and curates of five parish churches whereunto the town of Royston did extend itself and every of them, and the successors of every of them shall have their remedy by authority of that act to sue, demand, ask and recover in the King’s Court of Chancery the tithes of corn, hay, wool lamb, and calf, subtracted or divid[ed] to be paid by my person, or persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Altar of Damascus (1621), pp. 123-127 See also the EEBO ed. Calderwood was a Scottish presbyterian. | This man owe me a cole, that man a stick, the third two stone of butter, the fourth such a number of saffron [spice] heads, the fifth so many sallow [willow] trees: such and such suits were very pertinent for a presbytery to sit [rule] upon; for the presbytery is the true and right consistory. Now change this consistory as ye please, and make the bishop alone to be the Church-consistory, it is all one. For the causes themselves being temporal, the quality of the person does not alter the nature of the cause. In the Assertion for True &amp; Christian Policy (p. 99) [an opponent’s work], it is said, that by a statute, 32, Hom. 8, ch. 44:</cite></span></figcaption>

</figure><figure class="quote" id="q-07a400f136" data-kw="">
<blockquote><p>1. Our [Independent] Brethren say [that] it is… another thing to say [as the presbyterians] that it was impossible that they [the Christians in Jerusalem in Acts] could be one congregation and meet in one place… [Rutherford’s] Answer: …now the question then is… whether or no[t] was the Church at Jerusalem of such a competent number, only as that they could meet not only occasionally to hear a sermon, but in an ordinary Church-meeting, to hear the Word and communicate in the breaking of bread and seals of the Covenant; and though the want [lack] of a capacious house be also an extrinsic impediment why they could not meet… but it cannot be said that they wanted a capacious house for the ordinary meeting of a congregation, the ordinary and genuine use whereof is to be edified by the Word and sacraments; and that an ordinary house could contain such a number of thousands and multitudes as can be edified in a congregational way is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 1</cite>, pp. 426-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

 Books Online</a></div>
</figure><figure class="quote" id="q-f2f9ef2aec" data-kw="">
<blockquote><p>Another feature of the book [of Common Order, 1564] was that it was so framed as to make responsive worship impossible. The worshipper was to follow the continuous prayers with silent accord… At Frankfort [Germany] the signal for the outbreak of hostilities between the two parties was the loud responses of the Anglicans when a liturgy of compromise was read. The ground which Knox had taken up there, he was not likely to abandon in Scotland. His position would be that the people’s vocal part in divine service was the singing of Psalms; for the preface to the original Geneva Book says: ‘Prayers are after two manner of sorts, that is, either in words only or else with song joined thereunto.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-leishman.html">Thomas Leishman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ritual of the Church’ in ed. Story, Robert, The Church of Scotland, Past and Present (1890 ff.), vol. 5</cite>, p. 327</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

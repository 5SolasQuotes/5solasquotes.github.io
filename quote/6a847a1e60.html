<main class="wrap"><figure class="quote" id="q-6a847a1e60" data-kw="">
<blockquote><p>…as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1646) | pt. 1, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel, and doctrine concerning Christ the Savior and faith in him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and Him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 6-7</span></figcaption>

</figure><figure class="quote" id="q-38d4725347" data-kw="">
<blockquote><p>Thirdly, while you are preaching that opinion which your zeal is so much for, you are omitting far greater and more necessary truths. Fourthly, mercy is to be preferred before sacrifice: What if the present uttering some truth would cost many thousand men’s lives? Were not that an untimely and unmerciful word? And is it not as bad if (but accidentally) it tend to the ruin of the Church and the hurt of souls? It were easy to instance in unseasonable and imprudent words of truth spoken to princes, which have raised persecutions of long continuance and ruined Churches, silenced ministers and caused the death of multitudes of men. … It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good, and not to hurt them. And the Devil, who is the Destroyer, so he may but do men hurt, will be content to make use even of truth to do it; though usually he only pretends truth to cover his lies: And this angel of Light has his ministers of light and righteousness, who are known by their fruits; whilst the pretenses of light and righteousness are used to Satan’s ends and not to Christ’s, to hurt and destroy and to hinder Christ’s Kingdom, and not to save and to do good: as the wolf is known by his bloody jaws, even in his sheep’s clothing.</p></blockquote>

<blockquote><p>8. Vocation uneffectual is common to pagans. Vocation thoroughly effectual is of the same extent as justification, and (I think) election. Vocation which is effectual only to bring men to an outward profession of saving faith is larger than election and makes men such whom we are bound to baptize.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Apology against the Modest Exceptions of Mr. Thomas Blake</cite>, ... (London: A.M., 1654), §46, p. 88</span></figcaption>

<main class="wrap"><figure class="quote" id="q-448ef2b40c" data-kw="">
<blockquote><p>If the inheritance of life eternal be by the law, it is no more by the promise. But it is by the promise because God gave it unto Abraham freely by promise. Therefore it comes not by the law. The opposition between the law and the promise shows that Paul in this epistle speaks not only of the ceremonial, but also of the moral. For the greatest opposition is between the moral law and the free promise of God….For if life come by the law, it comes not by the promise,” says Paul. And, ‘If they which are of the law are heirs, the promise is of none effect’ (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:192–93 (on Gal 3:15–18; HT: Inwoo Lee).</span></figcaption>

<blockquote><p>And here let it be remembered that we are not patrons of licentiousness and enemies of good works. For though we exclude them from the act of our justification and salvation, yet we maintain a profitable and necessary use of them in the life of every Christian man.</p></blockquote>

— William Perkins, The Works of William Perkins, 7:145 (HT: Inwoo Lee).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+here+let+it+be+remembered+that+we+are+not+patrons+of+licentiousness+and+enemies+of+good+works.+For+though+we+exclude+them+from+the+act+of+our+justification+and+salvation%2C+yet+we+maintain+a+profitable+and+necessary+use+of+them+in+the+life+of+every+Christian+man.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+The+Works+of+William+Perkins%2C+7%3A145+%28HT%3A+Inwoo+Lee%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F12f97a3710.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/12f97a3710.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/perkins-we-exclude-good-works-from-the-act-of-justification-and-salvation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-157d80b1c4" data-kw="">
<blockquote><p>It must not be omitted, that if any article is stated as necessary to be known, which cannot be understood, unless some other article shall have been previously understood and believed; that other article must also rank among those which are necessary. For example; it is necessary to know that we are saved only by the grace of our Lord Jesus Christ; for the Apostle Paul says, “If any man preach any other gospel unto you than that which we have preached unto you, let him be accursed.” But this can be neither understood nor believed, unless we know that sin has plunged us into so deep an abyss of misery, that our deliverance surpassed our own power, and even the united exertions of all creatures. Thus, from the necessity of the article respecting our deliverance, we strongly infer the necessity of the article respecting our misery. …When any thing, in fine, the necessity of which must have been more doubtful, is expressly represented as necessary to be known; it follows, that a doctrine will also be necessary, the necessity of which we should have been less, or at least not more, disposed to question. To give an instance of this: the Apostle teaches that the article regarding justification by faith in Christ without the works of the law, is necessary, when he asserts that they who are “ignorant of God’s righteousness, and going about to establish their own righteousness, have not submitted themselves to the righteousness of God.” The necessity of this article being thus demonstrated; it unavoidably follows, that it is necessary for us to know also, that, considered in ourselves, we are obnoxious to condemnation and wrath: for this last article is much more evident than the former, and more obvious to every one that is willing to examine himself; nor, without the knowledge of it, can we be induced to seek that righteousness which is in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser vol. 1 (Edinburgh: A. Fullarton &amp; Co., 1823), 25–26.</span></figcaption>

</figure><figure class="quote" id="q-6ef0405c03" data-kw="">
<blockquote><p>From all these absurdities [of the sacrament of penance] the doctrine which we deliver is completely free. For absolution is conditional, allowing the sinner to trust that God is propitious to Him, provided he sincerely seek expiation in the sacrifice of Christ, and accept of the grace offered to him. Thus, he cannot err who, in the capacity of a herald, promulgates what has been dictated to him from the Word of God. The sinner, again, can receive a clear and sure absolution when, in regard to embracing the grace of Christ, the simple condition annexed is in terms of the general rule of our Master Himself—a rule impiously spurned by the Papacy—’According to your faith be it unto you,’ (Mt. 9:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174., vol. 2, bk. 3, ch. 4, sect. 22, p. 212</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

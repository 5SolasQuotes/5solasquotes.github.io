<blockquote><p>That the covenant of grace is the contract of marriage, the plan of which was agreed upon in the council of peace, betwixt the Father and the Son, from all eternity: Psa. Ixxxix. 3. “I have made a covenant with my chosen, I have sworn unto David my servant.” It was originally made with the Bridegroom, as the Head, Husband, and Representative of the bride, wherein he undertakes, that the grace of God shall reign and be glorified through his own righteousness, to her eternal life and salvation.

As Surety of the covenant, he undertakes to fulfil the condition of it, by his own obedience unto death, to buy his bride from the hands of justice, by paying a ransom of his own blood for her, and to buy. at the same time, all the blessings and goods of the covenant for her use; and that, by the power of his word and Spirit, he will make her to take hold of his covenant, bring her within the bond of it, and make an effectual application thereof in due time, according to the order of the covenant; and that he will betroth her unto himself for ever, in righteousness, and in judgment, and in loving-kindness, and in mercies; yea, that he will betroth her unto himself in faithfulness, and that she shall know the Lord, Hos. ii. 19, 20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wise virgins going forth to meet the bridegroom in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a56fb96e32" data-kw="">
<blockquote><p>The third difference which the Schoolmen make, and which only the Papists do hold, is, that the Old Testament did only promise eternal blessings, and the eternal inheritance, and did foreshew them in Types, as in the blood of Sacrifices, Christ’s Blood, in the promised Land, the inheritance of Heaven, and such like: but it did not give them till CHRIST the Testator was dead. But the New Testament doth promise, and also give and exhibit the things promised. This difference is very false and impious, and is easily confuted by the former Doctrine, and by the whole Scriptures. For that which only promiseth, and giveth not, is not a Testament, it is never in force, neither ratified at all; for being in force by the Testator’s Death, it must needs give as well as promise. If the Testator’s Death never come between, then it is no Testament. But the Old is a Testament, and was in force, and did give, and doth give Grace, as well as promise it.

This the whole Scriptures shew; for the Legacies promised and given in Christ’s Will, are Himself, with all his benefits which doe accompany him.

First, his Conception and Birth, most holy without spot, to sanctify our conception in sin, and our unclean birth.

Secondly, His perfect righteousness of life, to make believers righteous.

Thirdly, His Death and Sufferings, to ransom them from eternal death, and Hell, by satisfying for their sins.

Fourthly, His Spirit, with all saving Graces, as Faith, and such like, by which they come to have Communion with him of his Son-ship, inheritance, righteousness, and right to all blessings, Temporal, and Spiritual.

Now though Christ was only promised in the Old Testament, that he should come, and obey, and suffer for man’s redemption; but was not actually exhibited, nor did obey and suffer till the days of the New Testament: yet his Manhood, Birth, Obedience, and Death, were then as effectual to save the faithful, as now they are; And in that respect he is called the Lamb slain from the beginning of the world. Also by the Words of promise in the Old Testament, Christ communicated &amp; gave his Spirit to Adam, Noah, Abraham, David, and all the faithful in the Old Testament, which Spirit wrought in them Faith and perfect Communion with Christ, of his person so far, as to make them sons and heirs of God, of his Death for remission of their sins; of his righteousness for their justification, and of all saving Graces needful to Salvation.

This appears by Enoch’s translation into glory, that he might not see death, and by Elijah’s taking up into Heaven, by virtue of Christ’s Resurrection and Ascension, who is the first fruits from the beginning: Also by that which is said of Abraham, that he by believing came to be counted righteous: And by that which David saith to himself, That God is his portion, Psal. 16. and with him he had all things to make him blessed. Therefore this difference is a blasphemous and wicked fiction, excluding the Church of the Old Testament from Heaven, and all fruition of Christ’s benefits, and from all saving graces, as Regeneration, Remission of sins, Justification, and Redemption, which are the blessings promised and given in the Old Testament.</p></blockquote>

<blockquote><p>[5.] We on all accounts stand in need of a surety for us, or on our behalf. Neither without the interposition of such a surety could any covenant between God and us be firm and stable, or “an everlasting covenant, ordered in all things, and sure.” In the first covenant, made with Adam, there was no surety, but God and man were the immediate covenanters. And although we were then in a state and condition able to perform and answer all the terms of that covenant, yet was it broken and disannulled. If this came to pass by the failure of the promise of God, it was necessary that, on the making of a new covenant, he should have a surety to undertake for him, that the covenant might be stable and everlasting. But this is false, and blasphemous to imagine. It was man alone who failed and brake that covenant. Wherefore it was necessary that, upon the making of the new covenant, and that with a design and purpose that it should never be disannulled as the former was, we should have a surety and undertaker for us; for if that first covenant was not firm and stable, because there was no surety to undertake for us, notwithstanding all that ability which we had to answer the terms of it, how much less can any other be so, now our natures are become depraved and sinful! Wherefore we alone are capable of a surety, properly so called, for us; we alone stood in need of him; and without him the covenant could not be firm and inviolable on our part: the surety, therefore, of this covenant is so with God for us. [6.] It is the priesthood of Christ that the apostle treats of in this place, and that alone. Wherefore he is a surety as he is a priest, and in the discharge of that office; and is therefore so with God on our behalf. … (3.) It remaineth that we inquire positively how the Lord Christ was the surety of the new covenant, and what is the benefit we receive thereby. And unto this purpose we must first consider that opinion of some that the whole end of the mediation of Christ was only to procure the new covenant: although at first view it be irreconcilable unto the nature and notion of a surety; for a surety is not the procurer of that whereof he is the surety, but only the undertaker for its accomplishment. But we must more distinctly consider this assertion, and in what sense Christ may be said to procure the new covenant by his death and mediation. And to this end we must observe, that the new covenant may be considered divers ways, in various respects:— [1.] In the designation and preparation of its terms and benefits in the counsel of God. And this, although it have the nature of an eternal decree, yet is it distinguished from the decree of election, which first and properly respects the subjects or persons for whom grace and glory are prepared; for this respects the preparation only of that grace and glory, as to the way and manner of their communication. It is true, this purpose, or counsel of God’s will, is not called the covenant of grace, which is the express declared exemplification of it. The covenant of grace, I say, is only the declaration of this counsel of God’s will, accompanied with the means and power of its accomplishment, and the prescription of the ways whereby we are to be interested in it, and made partakers of the benefits of it. But in the inquiry after the procuring cause of the new covenant, it is the first thing that ought to come under consideration; for nothing can be the procuring cause of this covenant which is not so of this spring and fountain of it,—of this idea of it in the mind of God. But this is nowhere in the Scripture affirmed to be the effect of the death or mediation of Christ; and so to ascribe it, is to overthrow the whole freedom of eternal grace and love. Neither can any thing that is absolutely eternal, as is this decree and counsel of God, be the effect of, or be procured by, any thing that is external and temporal. And besides, it is expressly assigned unto absolute love and grace: see Eph. 1:4–6, with all those places where the love of God is assigned as the sole cause of the designation of Christ unto his office, and the sending of him. [2.] It may be considered with respect unto the federal transactions between the Father and Son concerning the accomplishment of this counsel of his will. What these were, wherein they did consist, I have declared at large in my exercitations. Neither do I call this the covenant of grace absolutely, nor is it so called in the Scripture: but it is that wherein it had its establishment, as unto all the ways, means, and ends of its accomplishment; and by it were all things so disposed, as that it might be effectual unto the glory of the wisdom, grace, righteousness, and power of God. Wherefore the covenant of grace could not be procured by any means or cause but that which was the cause of this covenant of the mediator, or of God the Father with the Son as undertaking the work of mediation. And as this is nowhere ascribed unto the death of Christ in the Scripture, so to assert it is contrary unto all spiritual reason and understanding. Who can conceive that Christ, by his death, should procure the agreement between God and him that he should die? [3.] With respect unto the declaration of it. This you may call God’s making or establishing of it with us, if you please; though making of the covenant in the Scripture is applied only unto its execution or actual application unto persons. But this declaration of the grace of God, and the provision in the covenant of the mediator for the making of it effectual unto his glory, is most usually called the covenant of grace. And this is twofold:— 1st. In the way of a singular and absolute promise; as it was first declared unto and thereby established with Adam, and afterwards with Abraham. This is the declaration of the purpose of God, or the free determination of his will as to his dealing with sinners, on the supposition of the fall and the forfeiture of their first covenant state. Hereof the grace and will of God were the only cause, Heb. 8:8. And the death of Christ could not be the means of its procurement; for he himself, and all that he was to do for us, were the substance of that promise wherein this declaration of God’s grace and purpose was made, or of this covenant of grace, which was introduced and established in the room of that which was broken and disannulled, as unto the ends and benefits of a covenant. The substance of the first promise, wherein the whole covenant of grace was virtually comprised, directly respected and expressed the giving of him for the recovery of mankind from sin and misery, by his death, Gen. 3:15. Wherefore if he, and all the benefits of his mediation, his death and all the effects of it, be contained in the promise of the covenant, that is, in the covenant itself, then was not his death the procuring cause of that covenant, nor do we owe it thereunto.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[5.] We on all accounts stand in need of a surety for us, or on our behalf. Neither without the interposition of such a surety could any covenant between God and us be firm and stable, or “an everlasting covenant, ordered in all things, and sure.” In the first covenant, made with Adam, there was no surety, but God and man were the immediate covenanters. And although we were then in a state and condition able to perform and answer all the terms of that covenant, yet was it broken and disannulled. If this came to pass by the failure of the promise of God, it was necessary that, on the making of a new covenant, he should have a surety to undertake for him, that the covenant might be stable and everlasting. But this is false, and blasphemous to imagine. It was man alone who failed and brake that covenant. Wherefore it was necessary that, upon the making of the new covenant, and that with a design and purpose that it should never be disannulled as the former was, we should have a surety and undertaker for us; for if that first covenant was not firm and stable, because there was no surety to undertake for us, notwithstanding all that ability which we had to answer the terms of it, how much less can any other be so, now our natures are become depraved and sinful! Wherefore we alone are capable of a surety, properly so called, for us; we alone stood in need of him; and without him the covenant could not be firm and inviolable on our part: the surety, therefore, of this covenant is so with God for us. [6.] It is the priesthood of Christ that the apostle treats of in this place, and that alone. Wherefore he is a surety as he is a priest, and in the discharge of that office; and is therefore so with God on our behalf. … (3.) It remaineth that we inquire positively how the Lord Christ was the surety of the new covenant, and what is the benefit we receive thereby. And unto this purpose we must first consider that opinion of some that the whole end of the mediation of Christ was only to procure the new covenant: although at first view it be irreconcilable unto the nature and notion of a surety; for a surety is not the procurer of that whereof he is the surety, but only the undertaker for its accomplishment. But we must more distinctly consider this assertion, and in what sense Christ may be said to procure the new covenant by his death and mediation. And to this end we must observe, that the new covenant may be considered divers ways, in various respects:— [1.] In the designation and preparation of its terms and benefits in the counsel of God. And this, although it have the nature of an eternal decree, yet is it distinguished from the decree of election, which first and properly respects the subjects or persons for whom grace and glory are prepared; for this respects the preparation only of that grace and glory, as to the way and manner of their communication. It is true, this purpose, or counsel of God’s will, is not called the covenant of grace, which is the express declared exemplification of it. The covenant of grace, I say, is only the declaration of this counsel of God’s will, accompanied with the means and power of its accomplishment, and the prescription of the ways whereby we are to be interested in it, and made partakers of the benefits of it. But in the inquiry after the procuring cause of the new covenant, it is the first thing that ought to come under consideration; for nothing can be the procuring cause of this covenant which is not so of this spring and fountain of it,—of this idea of it in the mind of God. But this is nowhere in the Scripture affirmed to be the effect of the death or mediation of Christ; and so to ascribe it, is to overthrow the whole freedom of eternal grace and love. Neither can any thing that is absolutely eternal, as is this decree and counsel of God, be the effect of, or be procured by, any thing that is external and temporal. And besides, it is expressly assigned unto absolute love and grace: see Eph. 1:4–6, with all those places where the love of God is assigned as the sole cause of the designation of Christ unto his office, and the sending of him. [2.] It may be considered with respect unto the federal transactions between the Father and Son concerning the accomplishment of this counsel of his will. What these were, wherein they did consist, I have declared at large in my exercitations. Neither do I call this the covenant of grace absolutely, nor is it so called in the Scripture: but it is that wherein it had its establishment, as unto all the ways, means, and ends of its accomplishment; and by it were all things so disposed, as that it might be effectual unto the glory of the wisdom, grace, righteousness, and power of God. Wherefore the covenant of grace could not be procured by any means or cause but that which was the cause of this covenant of the mediator, or of God the Father with the Son as undertaking the work of mediation. And as this is nowhere ascribed unto the death of Christ in the Scripture, so to assert it is contrary unto all spiritual reason and understanding. Who can conceive that Christ, by his death, should procure the agreement between God and him that he should die? [3.] With respect unto the declaration of it. This you may call God’s making or establishing of it with us, if you please; though making of the covenant in the Scripture is applied only unto its execution or actual application unto persons. But this declaration of the grace of God, and the provision in the covenant of the mediator for the making of it effectual unto his glory, is most usually called the covenant of grace. And this is twofold:— 1st. In the way of a singular and absolute promise; as it was first declared unto and thereby established with Adam, and afterwards with Abraham. This is the declaration of the purpose of God, or the free determination of his will as to his dealing with sinners, on the supposition of the fall and the forfeiture of their first covenant state. Hereof the grace and will of God were the only cause, Heb. 8:8. And the death of Christ could not be the means of its procurement; for he himself, and all that he was to do for us, were the substance of that promise wherein this declaration of God’s grace and purpose was made, or of this covenant of grace, which was introduced and established in the room of that which was broken and disannulled, as unto the ends and benefits of a covenant. The substance of the first promise, wherein the whole covenant of grace was virtually comprised, directly respected and expressed the giving of him for the recovery of mankind from sin and misery, by his death, Gen. 3:15. Wherefore if he, and all the benefits of his mediation, his death and all the effects of it, be contained in the promise of the covenant, that is, in the covenant itself, then was not his death the procuring cause of that covenant, nor do we owe it thereunto.”

— John Owen, An Exposition of the Epistle to the Hebrews, ed. W. H. Goold, vol. 22, Works of John Owen (Edinburgh: Johnstone and Hunter, 1855), 502–506.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B5.%5D+We+on+all+accounts+stand+in+need+of+a+surety+for+us%2C+or+on+our+behalf.+Neither+without+the+interposition+of+such+a+surety+could+any+covenant+between+God+and+us+be+firm+and+stable%2C+or+%E2%80%9Can+everlasting+covenant%2C+ordered+in+all+things%2C+and+sure.%E2%80%9D+In+the+first+covenant%2C+made+with+Adam%2C+there+was+no+surety%2C+but+God+and+man+were+the+immediate+covenanters.+And+although+we+were+then+in+a+state+and+condition+able+to+perform+and+answer+all+the+terms+of+that+covenant%2C+yet+was+it+broken+and+disannulled.+If+this+came+to+pass+by+the+failure+of+the+promise+of+God%2C+it+was+necessary+that%2C+on+the+making+of+a+new+covenant%2C+he+should+have+a+surety+to+undertake+for+him%2C+that+the+covenant+might+be+stable+and+everlasting.+But+this+is+false%2C+and+blasphemous+to+imagine.+It+was+man+alone+who+failed+and+brake+that+covenant.+Wherefore+it+was+necessary+that%2C+upon+the+making+of+the+new+covenant%2C+and+that+with+a+design+and+purpose+that+it+should+never+be+disannulled+as+the+former+was%2C+we+should+have+a+surety+and+undertaker+for+us%3B+for+if+that+first+covenant+was+not+firm+and+stable%2C+because+there+was+no+surety+to+undertake+for+us%2C+notwithstanding+all+that+ability+which+we+had+to+answer+the+terms+of+it%2C+how+much+less+can+any+other+be+so%2C+now+our+natures+are+become+depraved+and+sinful%21+Wherefore+we+alone+are+capable+of+a+surety%2C+properly+so+called%2C+for+us%3B+we+alone+stood+in+need+of+him%3B+and+without+him+the+covenant+could+not+be+firm+and+inviolable+on+our+part%3A+the+surety%2C+therefore%2C+of+this+covenant+is+so+with+God+for+us.+%5B6.%5D+It+is+the+priesthood+of+Christ+that+the+apostle+treats+of+in+this+place%2C+and+that+alone.+Wherefore+he+is+a+surety+as+he+is+a+priest%2C+and+in+the+discharge+of+that+office%3B+and+is+therefore+so+with+God+on+our+behalf.+%E2%80%A6+%283.%29+It+remaineth+that+we+inquire+positively+how+the+Lord+Christ+was+the+surety+of+the+new+covenant%2C+and+what+is+the+benefit+we+receive+thereby.+And+unto+this+purpose+we+must+first+consider+that+opinion+of+some+that+the+whole+end+of+the+mediation+of+Christ+was+only+to+procure+the+new+covenant%3A+although+at+first+view+it+be+irreconcilable+unto+the+nature+and+notion+of+a+surety%3B+for+a+surety+is+not+the+procurer+of+that+whereof+he+is+the+surety%2C+but+only+the+undertaker+for+its+accomplishment.+But+we+must+more+distinctly+consider+this+assertion%2C+and+in+what+sense+Christ+may+be+said+to+procure+the+new+covenant+by+his+death+and+mediation.+And+to+this+end+we+must+observe%2C+that+the+new+covenant+may+be+considered+divers+ways%2C+in+various+respects%3A%E2%80%94+%5B1.%5D+In+the+designation+and+preparation+of+its+terms+and+benefits+in+the+counsel+of+God.+And+this%2C+although+it+have+the+nature+of+an+eternal+decree%2C+yet+is+it+distinguished+from+the+decree+of+election%2C+which+first+and+properly+respects+the+subjects+or+persons+for+whom+grace+and+glory+are+prepared%3B+for+this+respects+the+preparation+only+of+that+grace+and+glory%2C+as+to+the+way+and+manner+of+their+communication.+It+is+true%2C+this+purpose%2C+or+counsel+of+God%E2%80%99s+will%2C+is+not+called+the+covenant+of+grace%2C+which+is+the+express+declared+exemplification+of+it.+The+covenant+of+grace%2C+I+say%2C+is+only+the+declaration+of+this+counsel+of+God%E2%80%99s+will%2C+accompanied+with+the+means+and+power+of+its+accomplishment%2C+and+the+prescription+of+the+ways+whereby+we+are+to+be+interested+in+it%2C+and+made+partakers+of+the+benefits+of+it.+But+in+the+inquiry+after+the+procuring+cause+of+the+new+covenant%2C+it+is+the+first+thing+that+ought+to+come+under+consideration%3B+for+nothing+can+be+the+procuring+cause+of+this+covenant+which+is+not+so+of+this+spring+and+fountain+of+it%2C%E2%80%94of+this+idea+of+it+in+the+mind+of+God.+But+this+is+nowhere+in+the+Scripture+affirmed+to+be+the+effect+of+the+death+or+mediation+of+Christ%3B+and+so+to+ascribe+it%2C+is+to+overthrow+the+whole+freedom+of+eternal+grace+and+love.+Neither+can+any+thing+that+is+absolutely+eternal%2C+as+is+this+decree+and+counsel+of+God%2C+be+the+effect+of%2C+or+be+procured+by%2C+any+thing+that+is+external+and+temporal.+And+besides%2C+it+is+expressly+assigned+unto+absolute+love+and+grace%3A+see+Eph.+1%3A4%E2%80%936%2C+with+all+those+places+where+the+love+of+God+is+assigned+as+the+sole+cause+of+the+designation+of+Christ+unto+his+office%2C+and+the+sending+of+him.+%5B2.%5D+It+may+be+considered+with+respect+unto+the+federal+transactions+between+the+Father+and+Son+concerning+the+accomplishment+of+this+counsel+of+his+will.+What+these+were%2C+wherein+they+did+consist%2C+I+have+declared+at+large+in+my+exercitations.+Neither+do+I+call+this+the+covenant+of+grace+absolutely%2C+nor+is+it+so+called+in+the+Scripture%3A+but+it+is+that+wherein+it+had+its+establishment%2C+as+unto+all+the+ways%2C+means%2C+and+ends+of+its+accomplishment%3B+and+by+it+were+all+things+so+disposed%2C+as+that+it+might+be+effectual+unto+the+glory+of+the+wisdom%2C+grace%2C+righteousness%2C+and+power+of+God.+Wherefore+the+covenant+of+grace+could+not+be+procured+by+any+means+or+cause+but+that+which+was+the+cause+of+this+covenant+of+the+mediator%2C+or+of+God+the+Father+with+the+Son+as+undertaking+the+work+of+mediation.+And+as+this+is+nowhere+ascribed+unto+the+death+of+Christ+in+the+Scripture%2C+so+to+assert+it+is+contrary+unto+all+spiritual+reason+and+understanding.+Who+can+conceive+that+Christ%2C+by+his+death%2C+should+procure+the+agreement+between+God+and+him+that+he+should+die%3F+%5B3.%5D+With+respect+unto+the+declaration+of+it.+This+you+may+call+God%E2%80%99s+making+or+establishing+of+it+with+us%2C+if+you+please%3B+though+making+of+the+covenant+in+the+Scripture+is+applied+only+unto+its+execution+or+actual+application+unto+persons.+But+this+declaration+of+the+grace+of+God%2C+and+the+provision+in+the+covenant+of+the+mediator+for+the+making+of+it+effectual+unto+his+glory%2C+is+most+usually+called+the+covenant+of+grace.+And+this+is+twofold%3A%E2%80%94+1st.+In+the+way+of+a+singular+and+absolute+promise%3B+as+it+was+first+declared+unto+and+thereby+established+with+Adam%2C+and+afterwards+with+Abraham.+This+is+the+declaration+of+the+purpose+of+God%2C+or+the+free+determination+of+his+will+as+to+his+dealing+with+sinners%2C+on+the+supposition+of+the+fall+and+the+forfeiture+of+their+first+covenant+state.+Hereof+the+grace+and+will+of+God+were+the+only+cause%2C+Heb.+8%3A8.+And+the+death+of+Christ+could+not+be+the+means+of+its+procurement%3B+for+he+himself%2C+and+all+that+he+was+to+do+for+us%2C+were+the+substance+of+that+promise+wherein+this+declaration+of+God%E2%80%99s+grace+and+purpose+was+made%2C+or+of+this+covenant+of+grace%2C+which+was+introduced+and+established+in+the+room+of+that+which+was+broken+and+disannulled%2C+as+unto+the+ends+and+benefits+of+a+covenant.+The+substance+of+the+first+promise%2C+wherein+the+whole+covenant+of+grace+was+virtually+comprised%2C+directly+respected+and+expressed+the+giving+of+him+for+the+recovery+of+mankind+from+sin+and+misery%2C+by+his+death%2C+Gen.+3%3A15.+Wherefore+if+he%2C+and+all+the+benefits+of+his+mediation%2C+his+death+and+all+the+effects+of+it%2C+be+contained+in+the+promise+of+the+covenant%2C+that+is%2C+in+the+covenant+itself%2C+then+was+not+his+death+the+procuring+cause+of+that+covenant%2C+nor+do+we+owe+it+thereunto.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+ed.+W.+H.+Goold%2C+vol.+22%2C+Works+of+John+Owen+%28Edinburgh%3A+Johnstone+and+Hunter%2C+1855%29%2C+502%E2%80%93506.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff08c05e564.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f08c05e564.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/owen-the-new-covenant-was-inaugurated-after-the-fall-and-christ-was-its-mediator/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>It should be taken as a rule in explaining the psalms, that they exhibit the covenant of grace dispensed by the Lord Jesus Christ, the King and Head of the church. He is the subject-matter of the whole of divine revelation; but in a special manner of the psalms. This appears from his own declaration, just before his ascension: Luke 24:44, “All things must be fulfilled which were written in the law of Moses, and in the prophets and in the psalms concerning me.” They are called “the word of Christ,” Col. 3:16. And in order that it may dwell in us richly in all wisdom in singing these sacred songs, we must see Christ in them. This is to be brought out in their exposition.

In Psalm 22:22, we have further confirmation of this point: “In the midst of the congregation will I praise thee.” Jesus Christ is in the midst of his people when singing his praise and participates in the service. He presides over the devotions of the sanctuary. In Heb. 2:12 these words of the psalm are ascribed to him, and they are adduced to show the oneness between him and his people. “Both he that sanctifieth and they that are sanctified are all of one,” verse 11.

Can it be a theme less important than the salvation which he has secured to his people, in which he takes so deep an interest? The numerous quotations from the Psalms and references to them in the New Testament, clearly shows that the Psalms were designed and suited to celebrate the kingdom and glory of the Mediator. Of the former there are about seventy, and of the latter, thirty. In all these the application is more or less directly to Christ. And these are not exhaustive. They are merely specimens of what the Psalms are throughout. Christ is in the Psalms, or rather the Psalms are full of Christ, and it is the business of the expounder to bring forth these good things out of this abundant storehouse.</p></blockquote>

In Psalm 22:22, we have further confirmation of this point: “In the midst of the congregation will I praise thee.” Jesus Christ is in the midst of his people when singing his praise and participates in the service. He presides over the devotions of the sanctuary. In Heb. 2:12 these words of the psalm are ascribed to him, and they are adduced to show the oneness between him and his people. “Both he that sanctifieth and they that are sanctified are all of one,” verse 11.

Can it be a theme less important than the salvation which he has secured to his people, in which he takes so deep an interest? The numerous quotations from the Psalms and references to them in the New Testament, clearly shows that the Psalms were designed and suited to celebrate the kingdom and glory of the Mediator. Of the former there are about seventy, and of the latter, thirty. In all these the application is more or less directly to Christ. And these are not exhaustive. They are merely specimens of what the Psalms are throughout. Christ is in the Psalms, or rather the Psalms are full of Christ, and it is the business of the expounder to bring forth these good things out of this abundant storehouse.”

<main class="wrap"><figure class="quote" id="q-c037a6240d" data-kw="">
<blockquote><p>But in the letter to the Romans [12:7-8] and in the first letter to the Corinthians [12:28], he lists others [other offices besides those of the Word], as powers [miracles], the gift of healing, interpretation, government, and caring for the poor. Two of these I omit as being temporary, for it is not worthwhile to tarry over them. But two of them are permanent: government [ruling elders] and caring for the poor [deacons].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4, ch. 3, section 8, p. 1061</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b57b819614" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: …

144. That there are revelations and visions in these times, yea to some they are more ordinary, and shall be to the people of God, generally within a while.

145. That the gift of miracles is not ceased in these times, but that some of the sectaries have wrought miracles, and miracles have accompanied them in their baptism, etc. and the people of God shall have power of miracles shortly.

146. That anointing the sick with oil by the Elders praying over them, with laying on of hands [James 5], is a Church-ordinance for Church-members that are sick, for their recovery.

147. ‘Tis ordinary for Christians now in these days, with Paul to be rapt up to the third Heavens, and to hear words unutterable, and they cannot well have assurance of being Christians, that have not found and had experience of this.</p></blockquote>

<blockquote><p>9. Heaven and Hell and the Last Judgement are nowhere, but within a man, in a spiritual manner; Heaven is in this life. Antinomians, as Town and Saltmarsh hold that in this life we have as much of Heaven in full and complete possession as the glorified in Heaven. … 11. Under David George is the time of perfection, when all ordinances shall be useless, so Antinomians, ut supra. … 14. The Resurrection of the Dead, the blowing of the last trumpet, the shout of the archangel, the coming of Christ to judge all are to be taken in a spiritual sense of the doctrine and discipline of David George, as Hymenaeus and Phyletus said; see hereafter the parallel between Antinomians and Libertines; so said Libertines (Calvin Against the Libertines, ch. 22, p. 458). … 18. The body or flesh sinneth, but not the soul.</p></blockquote>

<blockquote><p>I have hesitated till the present time, not through lack of ability to refute the falsehood or bear testimony for the truth, but from fear and apprehension that I might seem to some to be making additions to the doctrines or precepts of the Gospel of the New Testament, which it is impossible for one who has chosen to live according to the Gospel, either to increase or to diminish. But being recently in Ancyra in Galatia, I found the church there greatly agitated by this novelty, not prophecy, as they call it, but rather false prophecy, as will be shown. Therefore, to the best of our ability, with the Lord’s help, we disputed in the church many days concerning these and other matters separately brought forward by them, so that the church rejoiced and was strengthened in the truth, and those of the opposite side were for the time confounded, and the adversaries were grieved… Their opposition and their recent heresy which has separated them from the Church arose on the following account… a recent convert, Montanus [fl. 157-172] by name… And he became beside himself, and being suddenly in a sort of frenzy and ecstasy, he raved, and began to babble and utter strange things, prophesying in a manner contrary to the constant custom of the Church handed down by tradition from the beginning. Some of those who heard his spurious utterances at that time were indignant, and they rebuked him as one that was possessed, and that was under the control of a demon, and was led by a deceitful spirit, and was distracting the multitude; and they forbade him to talk, remembering the distinction drawn by the Lord and his warning to guard watchfully against the coming of false prophets… For the faithful in Asia met often in many places throughout Asia to consider this matter, and examined the novel utterances and pronounced them profane, and rejected the heresy, and thus these persons were expelled from the Church and debarred from communion. Since, therefore, they called us slayers of the prophets because we did not receive their loquacious prophets, who, they say, are those that the Lord promised to send to the people…</p></blockquote>

</figure><figure class="quote" id="q-d2c06fc13a" data-kw="">
<blockquote><p>The extraordinary gifts of the Spirit, such as the gift of tongues, of miracles, of prophecy, etc., are called extraordinary, because cause they are such as are not given in the ordinary course of God’s providence. They are not bestowed in the way of God’s ordinary providential dealing with his children, but only on extraordinary occasions, as they were bestowed on the prophets and apostles to enable them to reveal the mind and will of God before the canon of Scripture was complete, and so on the primitive Church, in order to the founding and establishing of it in the world. But since the canon of the Scripture has been completed, and the Christian Church fully founded and established, these extraordinary gifts have ceased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Love More Excellent than the Extraordinary Gifts of the Spirit’ on 1 Cor</cite>, 13:1-2</span></figcaption>

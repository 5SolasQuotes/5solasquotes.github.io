<main class="wrap"><figure class="quote" id="q-39ac191455" data-kw="">
<blockquote><p>What the New Testament ordinarily does is to state parts of the doctrine, so that when we put those parts together, and when we summarize them, we have the great doctrine of the three persons and one God. For example, all passages in the New Testament where the deity of Jesus Christ is set forth are, when taken in connection with passages setting forth the deity and personality of the Holy Spirit, passages supporting the doctrine of the Trinity. But what needs to be observed now is that although by far the larger part of the Biblical teaching about the Trinity is given in that incidental and partial way – presupposing the doctrine rather than formally enunciating it as a whole – yet there are some passages where the doctrine is definitely presented by the mention, together, of Father, Son and Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“J. Gresham Machen Bibliography”</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1021da70d5" data-kw="">
<blockquote><p>The Scriptures teach that there is essentially but one God, and, therefore, that the essence both of the Son and Spirit is unbegotten; but inasmuch as the Father is first in order, and of himself begat his own Wisdom, he, as we lately observed, is justly regarded as the principle and fountain of all the Godhead. Thus God, taken indefinitely, is unbegotten, and the Father, in respect of his person, is unbegotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>

</figure><figure class="quote" id="q-ffeea9e3e5" data-kw="undivided external works">
<blockquote><p>Although the external works are undivided and equally common to the single persons (both on the part of the principle and on the part of the accomplishment), yet they are distinguished by order and by terms. For the order of operating follows the order of subsisting. As therefore the Father is from himself, so he works from himself; as the Son is from the Father, so he works from the Father; as the Holy Spirit is from both, so he works from both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.27</span></figcaption>

</figure><figure class="quote" id="q-f7b0b8747b" data-kw="">
<blockquote><p>There are, indeed, very many other things that are taught and disputed about this doctrine of the Trinity, as: the manner of the eternal generation of the Son, of the essence of the Father, of the rocession of the Holy Ghost, and the difference of it from the generation of the Son, of the mutual in-being of the persons, by reason of their unity in the same substance or essence, the nature of their personal subsistence, with respect unto the properties whereby they are mutually distinguished; all which are true and defensible against all the sophisms of the adversaries of this truth. Yet, because the distinct apprehension of them, and their accurate expression, is not necessary unto faith, as it is our guide and principle in and unto religious worship and obedience, they need not here be insisted on. Nor are those brief explications themselves before mentioned so proposed as to be placed immediately in the same rank or order with the original revelations before insisted on, but only are pressed as proper expressions of what is revealed, to increase our light and farther our edification. And although they cannot rationally be opposed or denied, nor ever were by any, but such as deny and oppose the things themselves as revealed, yet they that do so deny or oppose them, are to be required positively, in the first place, to deny or disapprove the oneness of the Deity, or to prove that the Father, or Son, or Holy Ghost, in particular, are not God, before they be allowed to speak one word against the manner of the explication of the truth concerning them. For either they grant the revelation declared and contended for, or they do not. If they do, let that concession be first laid down, namely that the Father, Son, and Spirit, are one God; and then let it be debated, whether they are one in substance and three in persons, or how else the matter is to be stated. If they deny it, it is a plain madness to dispute of the manner of anything, and the way of expressing it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Trinity Explained &amp; Vindicated</cite>, pp. 407-8 in Works ed. William H. Goold (NY: Robert Carter, 1851), vol. 2</span></figcaption>

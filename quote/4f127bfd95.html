<main class="wrap"><figure class="quote" id="q-4f127bfd95" data-kw="">
<blockquote><p>A. But who is this new-seen dragon and what his triflings against the doctrines of the Truth tell to me who ask.

B. The new-seen dragon, this crooked one and who has his tongue drunk with venom, who all-but bids farewell to the tradition of the initiators of the world, yea rather to all the God-inspired Scripture, and who innovates what seems good to him and says that the holy Virgin is not Mother of God, but mother of Christ and mother of man, bringing in moreover other things discordant and senseless, upon the right and sincere doctrines of the Catholic Church.

A. You say (I mean) Nestorius, for I understand, but I do not know, my friend, the actual state of his words: how does he say that the holy Virgin is not Mother of God?

B. She bare not (he says) God: for the Word was before her too, yea rather before every age and time, Co-eternal with God the Father.

A. They will therefore manifestly deny this too, that Emmanuel is God, and to no purpose as it seems, does the Evangelist interpret the name saying, Which is interpreted, With us is God, for thus did God the Father clearly affirm through the voice of the Prophet that He was to be called Who has been born of the holy Virgin after the flesh, as God Incarnate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-cyril-of-alexandria.html">Cyril of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Christ is One by way of Dispute with Hermias</cite>, (c. 431), trans. P. E. Pusey in A Library of Fathers of the Holy Catholic Church, Anterior to the Division of the East and West, Translated by Members of the English Church. Volume 47 (Oxford: James Parker, 1881), pp 239-40.</span></figcaption>

</figure><figure class="quote" id="q-26878d10ee" data-kw="">
<blockquote><p>There follows the other part of the disputation on merit, in which we must discuss “what and how many conditions are necessary for a work to be called truly and properly meritorious of eternal happiness.” … Seven conditions in all seem to be required, three of which are granted by all, while the other four are in controversy. The first condition is that it be a good work. For evil works do indeed merit, but punishment, not reward. … The second condition is that the good work be done in obedience to God. For merit implies a relation to a reward to be received from another; hence he who merits, merits with someone. The third, that he who merits be a wayfarer. For in this life is the race and the battle; in the next, the prize and the crown. … The fourth, that the work be not only good but also free. The fifth, that he who merits be a friend of God and pleasing to him. The sixth, that a promise intervene. The seventh, that the work proceed from the virtue of charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.10 (translated from the Latin)</span></figcaption>

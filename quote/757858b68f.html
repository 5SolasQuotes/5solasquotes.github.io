<blockquote><p>In this scholastic theology is to be praised: 1. the simple and concise kind of language; 2. the accurate and dialectical method; 3. the use or support of philosophy and natural disciplines. They are to be blamed, however, out of themselves, even the defenders of it, by: 1. the obnoxious doctrine of the papacy unto tyranny; and hence it is false in many ways; 2. the multitude of philosophical things; 3. the curiosity of vain inquiries [or topics]; 4. the confusion itself of things, arising out of an ignorance of languages; 5. obscurity and barbarities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-burman.html">Francis Burman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of Theology</cite>, (Utrecht: Noenardus, 1671), vol. 1, bk. 1, ch. 2, section 47, p. 12 trans. T. Fentiman</span></figcaption>

<blockquote><p>2 …but the metaphysician proves the principles of the inferior sciences in as much as if those principles are obstinately denied by anyone, he explains their terms, which having been declared and perceived by the adversary, he cannot but assent to the truth of the proposed principles, unless he be completely stripped of reason in the manner of a brute. For nothing conduces more to the confirmation of principles than the perception of the same: and nothing more helps the intellect, that it perceive principles than the understanding of the terms from which the principles are composed. Furthermore, he proves those principles a posteriori [from those things that follow], and indeed by leading the adversary through the impossible, in as much as unless he acknowledge the truth of the principles it will be necessary for him to have acknowledged the greatest absurdity resulting from the denied principles. Thus to one denying that the whole is greater than its part, it will be explained what part, what whole. If he be not yet sufficiently moved, it will be inferred from that negation, the acception of the terms having been presupposed according to the explained way, that the whole would not be whole, nor would the part be part; and thus the same would be and not be at the same time. Which, as most absurd, will not be to be admitted. 5. …All principles, of whatever genus they be, can be called first; and in what way first, in that way also they are indemonstrable. They are therefore first in as much as they do not recognize others through which they are demonstrated a priori [from things prior]. Then they are first in as much as in that science of which they are principles, they do not recognize others prior to themselves through which they are demonstrated. But what principles in their science are first can still in the order of another science be posterior and thus demonstrable, at least a posteriori, if not also a priori.</p></blockquote>

</figure><figure class="quote" id="q-50f44e86d0" data-kw="">
<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>

<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

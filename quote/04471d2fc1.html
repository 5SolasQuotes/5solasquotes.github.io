<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics… If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them.</p></blockquote>

</figure><figure class="quote" id="q-f724b599d3" data-kw="">
<blockquote><p>77. It is certain that we must attempt nothing in all our actions whereof we are not certain that it pleases God: whatsoever is done otherwise, does make us guilty before God. The apostle says, ‘Blessed is he that condemneth not himself in that which he alloweth.’ Whereupon it comes to pass that he that judges and condemns anything, and yet admits it, or puts it in practice, he is damned [condemned], because he does it not of faith. 78. Conscience has that virtue and power that if some work being of it own nature indifferent, if the conscience be good, it makes the work also to be good: and contrariwise, if the conscience be evil, it makes the work also evil. 79. But yet nevertheless it cannot be that any work, being evil in its own nature, may by our conscience be made good. For whatsoever conscience thou hast, yet when thou doest forswear thyself, or when thou committest adultery, thou doest grievously sin. Wherefore the force of conscience has power only in things indifferent, and also in those actions, which of their own nature are good. 80. And amongst these things, somewhat may seem to be against a man’s conscience, or unlawful two ways. First, uncertainly and doubtfully, without full assent, persuasion or resolution; namely, when a man doubts or is uncertain, whether something be lawful, or not. Secondly, determinately and absolutely with a resolved persuasion, to wit, when a man is certainly persuaded that something is simply lawful, albeit by error of conscience, or upon false and erroneous grounds. 81. If anything appears to be unlawful unto a man uncertainly and doubtfully, he is to abstain from doing of it of himself, so long as he is at his owne free choice and liberty, till his doubts be removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, … (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, p. 86 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“77. It is certain that we must attempt nothing in all our actions whereof we are not certain that it pleases God: whatsoever is done otherwise, does make us guilty before God. The apostle says, ‘Blessed is he that condemneth not himself in that which he alloweth.’ Whereupon it comes to pass that he that judges and condemns anything, and yet admits it, or puts it in practice, he is damned [condemned], because he does it not of faith. 78. Conscience has that virtue and power that if some work being of it own nature indifferent, if the conscience be good, it makes the work also to be good: and contrariwise, if the conscience be evil, it makes the work also evil. 79. But yet nevertheless it cannot be that any work, being evil in its own nature, may by our conscience be made good. For whatsoever conscience thou hast, yet when thou doest forswear thyself, or when thou committest adultery, thou doest grievously sin. Wherefore the force of conscience has power only in things indifferent, and also in those actions, which of their own nature are good. 80. And amongst these things, somewhat may seem to be against a man’s conscience, or unlawful two ways. First, uncertainly and doubtfully, without full assent, persuasion or resolution; namely, when a man doubts or is uncertain, whether something be lawful, or not. Secondly, determinately and absolutely with a resolved persuasion, to wit, when a man is certainly persuaded that something is simply lawful, albeit by error of conscience, or upon false and erroneous grounds. 81. If anything appears to be unlawful unto a man uncertainly and doubtfully, he is to abstain from doing of it of himself, so long as he is at his owne free choice and liberty, till his doubts be removed.”

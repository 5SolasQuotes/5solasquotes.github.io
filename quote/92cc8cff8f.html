<main class="wrap"><figure class="quote" id="q-92cc8cff8f" data-kw="">
<blockquote><p>Objection [of a congregationalist]: The union betwixt Christ and his Church is as strait and immediate, as the union betwixt the vine and the branches, betwixt the head and the body, betwixt the Husband and the Wife. Therefore every true Church of Christ has direct and immediate interest in, and title to Christ Himself, and the whole New Testament, and every ordinance of it. Answer: The strait union betwixt Christ and the Church, expressed by these comparisons, cannot be understood of the Church taken politically: for then the union betwixt Christ and the Church might be dissolved as often as the Church ceases to be ordered and governed as an Ecclesiastical republic. It is therefore to be understood either of the invisible Church, or at most of the visible Church taken metaphysically or entitatively. But I add withal, it is to be likewise understood of every faithful Christian: so that not only every true Church, but every true member thereof, by virtue of this union, has direct and immediate title to Christ, and to the benefit of all his ordinances for his edification and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, … (Edinburgh, 1641) | pt. 2, ch. 11, ‘Objections…’, pp. 201-2</span></figcaption>

<blockquote><p>The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity</cite>, … (d. 1707; Boston, 1726), Sermon 172, Q. 60, pp. 584-88</span></figcaption>

</figure><figure class="quote" id="q-4b3469d8b8" data-kw="">
<blockquote><p>Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid.

2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20.

3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid.

4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644) Rathband was a Westminster divine., pp. 31-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

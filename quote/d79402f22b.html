<main class="wrap"><figure class="quote" id="q-d79402f22b" data-kw="">
<blockquote><p>But why was circumcision on the eighth day, if not because, after the seventh day of the sabbath, the Lord rose on Sunday, the Lord’s Day? So then, the resurrection of Christ—which indeed happened on the third day after his passion, and on the eighth day in a seven-day week—that is what circumcises us. Listen to the exhortation of the apostle to those circumcised by the true rock: If then you have risen with Christ, seek the things that are above, where Christ is, seated on God’s right; savor the things that are above, not the things on earth (Col 3:1–2). He is speaking to the circumcised; Christ has risen; he has rid you of the desires of the flesh, rid you of evil lusts, rid you of the superfluity you were born with and the much worse extras you have added by bad lives; circumcised with rock, why do you still savor the earth?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Gospel of John 1-40</cite>, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 30.5, p. 500.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-76b5726ef8" data-kw="">
<blockquote><p>His worship must be spiritual, in Heb. 9. 1. Then verily the first Covenant had also Ordinances of Divine Service, and a worldly Sanctuary. Mark, in the time of the Law it was but a worldly Sanctuary in comparison of what is now in the times of the Gospel; those ways of worship though they were once appointed by God, Christ the King of His Church in the new Testament would not have His homage tendered up by these ways of worship, they were too worldly for Him[.]

[T]hen surely to have the inventions of men in the worship of Christ, in the new Testament especially, it is too worldly for Christ: No it must be Divine and Spiritual, he that worships, must worship in spirit and in truth: all that worship and homage we tender up to Jesus Christ, we must look to have it spiritual and not worldly; and so the Ordinances, though they have something external, as the Sacraments, yet if we stick to the outward part, we do not worship Christ as our King in a right way; but we must be spiritual in all, look upon the spiritual part in all Ordinances, or else (I say) we do not tender up that homage to Christ that is due to Him, as the King of His Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 142-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-b06c3fbaea" data-kw="">
<blockquote><p>We are further told, he made them coats or garments of skins to cover their nakedness. They were naked in paradise, and were not ashamed lo long as they were innocent; but so soon as sin entered, shame came along with it: A fair intimation that their nakedness lay in their fouls. It is natural to put the question. What skins were these? Supposing, what yet is denied by most, that they fed on flesh, could so many be killed for Adam and Eve?

But if we suppose, what indeed must be admitted, that God revealed to them his grant of eternal life, and the conduct required on their part; which is what our translators call making a covenant; of which solemnity a sacrifice was an absolutely necessary part, as is clear from the case of Noah, Abraham, and the Israelites, not to mention the more private and particular ones; then covering their nakedness with the skins of the sacrifice, was a fair emblem and representation of that covering for sin which God had provided for them, and all who would be prevailed with to renounce their fig-leaf coverings, and put on the Lord Jesus.

It was on this great foundation that the constitution of grace, and the grant of eternal life, were then established, and ever since have stood. Nor is it conceivable how the butchering of beats, shedding their blood, and formally burning their flesh in a fire prepared for the purpose, could ever have been set up as a piece of divine worship, on any lower authority than that of God; nor even on that, without explaining the design of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 262-63.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-c1dc9455e9" data-kw="">
<blockquote><p>[A]nything borrowed from heathenism or the abolished temple-service — as pretended priests, altars, altar-cloths, incense, symbolical vestments, or instrumental music — are entirely without divine warrant, and therefore unlawful. The same thing may be said of all man-pleasing, sensationalism, solo-singing, with any of the peculiarities of the theatre transferred without divine warrant into the worship of the Christian Church.

The worship of the New Testament Church, unlike that of the temple, is based on the worship of the synagogue. That worship consisted of singing, prayer, with reading and expounding the Scriptures. All priests, incense, instruments of music, and sacrifices were discarded; and our worship, now that the temple is completely destroyed, must be the simple worship of the synagogue under the clearer light of the New Testament, conducted in the name and by the authority of Christ, and under the solemn impression that “God is a Spirit, and they that worship Him must worship Him in spirit and in truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“[A]nything borrowed from heathenism or the abolished temple-service — as pretended priests, altars, altar-cloths, incense, symbolical vestments, or instrumental music — are entirely without divine warrant, and therefore unlawful. The same thing may be said of all man-pleasing, sensationalism, solo-singing, with any of the peculiarities of the theatre transferred without divine warrant into the worship of the Christian Church.

The worship of the New Testament Church, unlike that of the temple, is based on the worship of the synagogue. That worship consisted of singing, prayer, with reading and expounding the Scriptures. All priests, incense, instruments of music, and sacrifices were discarded; and our worship, now that the temple is completely destroyed, must be the simple worship of the synagogue under the clearer light of the New Testament, conducted in the name and by the authority of Christ, and under the solemn impression that “God is a Spirit, and they that worship Him must worship Him in spirit and in truth.”

— James A. Begg, Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 13-14.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BA%5Dnything+borrowed+from+heathenism+or+the+abolished+temple-service+%E2%80%94+as+pretended+priests%2C+altars%2C+altar-cloths%2C+incense%2C+symbolical+vestments%2C+or+instrumental+music+%E2%80%94+are+entirely+without+divine+warrant%2C+and+therefore+unlawful.+The+same+thing+may+be+said+of+all+man-pleasing%2C+sensationalism%2C+solo-singing%2C+with+any+of+the+peculiarities+of+the+theatre+transferred+without+divine+warrant+into+the+worship+of+the+Christian+Church.%0A%0AThe+worship+of+the+New+Testament+Church%2C+unlike+that+of+the+temple%2C+is+based+on+the+worship+of+the+synagogue.+That+worship+consisted+of+singing%2C+prayer%2C+with+reading+and+expounding+the+Scriptures.+All+priests%2C+incense%2C+instruments+of+music%2C+and+sacrifices+were+discarded%3B+and+our+worship%2C+now+that+the+temple+is+completely+destroyed%2C+must+be+the+simple+worship+of+the+synagogue+under+the+clearer+light+of+the+New+Testament%2C+conducted+in+the+name+and+by+the+authority+of+Christ%2C+and+under+the+solemn+impression+that+%E2%80%9CGod+is+a+Spirit%2C+and+they+that+worship+Him+must+worship+Him+in+spirit+and+in+truth.%E2%80%9D%0A%0A%E2%80%94+James+A.+Begg%2C+Anarchy+in+Worship+or+Recent+Innovations+Contrasted+with+the+Constitution+of+the+Presbyterian+Church+and+the+Vows+of+Her+Office-Bearers%2C+%28Edinburgh%3A+Lyon+%26+Gemmell%2C+1875%29%2C+pp+13-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc1dc9455e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c1dc9455e9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/10/james-begg-against-judaical-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a>

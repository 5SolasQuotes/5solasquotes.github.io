<main class="wrap"><figure class="quote" id="q-a14bad4793" data-kw="">
<blockquote><p>…Him that accepteth not the persons of princes, nor regardeth the rich more than the poor? for they all are the work of his hands. In a moment shall they die… For his eyes are upon the ways of man, and He seeth all his goings. There is no darkness, nor shadow of death, where the workers of iniquity may hide themselves. He shall break in pieces mighty men without number, and set others in their stead. Therefore He knoweth their works, and He overturneth them in the night… Because they turned back from Him, and would not consider any of his ways: So that they cause the cry of the poor to come unto him, and He heareth the cry of the afflicted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Job, 34:19-28</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-710314ac0a" data-kw="">
<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Therapeutica Sacra</cite>, Book 1, Chapter 6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.”

</figure><figure class="quote" id="q-8857767c45" data-kw="">
<blockquote><p>It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed; and inasmuch as this reference is a beneficial one, we are led to posit back of it a form of love equally comprehensive and effective, which will have to be coordinated with the three other forms of universal love previously distinguished [ (1) ‘this indiscriminate goodness in the sphere of nature,’ (2) ‘the collective love which embraces the world as an organism,’ (3) ‘the love of compassion which God retains for every lost sinner’]. The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption. It makes an immense difference whether our present life be spent in the consciousness of this hope or without it. This may be best realized by making clear to ourselves what a tremendous change the withdrawal of the offer of the gospel would produce in the entire outlook upon life, even for those who do not accept its terms. On the other hand, the love from which these universal benefits of the atonement flow should never be so defined as to obscure the fact that it falls short of the intention to bestow efficacious grace. We must also remember that as it embodies itself in the offer of the gospel it can be called universal in a qualified sense only, since its field is circumscribed by the actual spread of the gospel at any given time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review</cite>, (1902), from The Presbyterian &amp; Reformed Review, 13:1-37, p. 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-ff35eaf9cf" data-kw="">
<blockquote><p>We must not view these ways of talking about the love of God as independent, compartmentalized, loves of God… as if each were hermetically sealed off from the other… If you absolutize any one of these ways in which the Bible speaks of the love of God, you will generate a false system that squeezes out other important things the Bible says, thus finally distorting your vision of God.</p></blockquote>

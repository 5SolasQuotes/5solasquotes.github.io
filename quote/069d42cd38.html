<blockquote><p>Such as deny the morality of the Christian Sabbath, and profane it with all manner of sports, because the ancient day is changed by virtue of Christ’s resurrection. All these and other like them turn the grace of God into lasciviousness; that is, into all kind of licentious living. An Apostle gives this verdict of them, They were of old ordained to condemnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 27-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60448b4f68" data-kw="">
<blockquote><p>The doctrine of God’s sovereignty likewise, though not so generally owned as the former, is no less fully assented to by those who are called Calvinists. We zealously contend for this point, in our debates with the Arminians; and are ready to wonder that any should be hardy enough to dispute the Creator’s right to do what he will with his own.

While we are only engaged in defence of the election of grace, and have a comfortable hope that we are ourselves of that number, we seem so convinced, by the arguments the Scripture affords us in support of this truth, that we can hardly forbear charging our adversaries with perverse obstinacy and pride, for opposing it.

Undoubtedly the ground of this opposition lies in the pride of the human heart: but this evil principle is not confined to any party; and occasions frequently arise, when they who contend for the Divine sovereignty are little more practically influenced by it than their opponents. This humiliating doctrine concludes as strongly for submission to the will of God, under every circumstance of life, as it does for our acquiescing in his purpose to have mercy on whom he will have mercy.

But, alas! how often do we find ourselves utterly unable to apply it, so as to reconcile our spirits to those afflictions which he is pleased to allot us! So far as we are enabled to say, when we are exercised with poverty, or heavy losses or crosses, “I was dumb and opened not my mouth, because thou didst it,” so far, and no farther, are we truly convinced that God has a sovereign right to dispose of us, and all our concernments, as he pleases.

How often, and how justly, at such seasons, might the argument we offer to others, as sufficient to silence all their objections, be retorted upon ourselves, “Nay, but who art thou, O man, who repliest against God? Shall the thing formed say unto him that formed it, Why hast thou made me thus?”—a plain proof that our knowledge is more notional than experimental. What an inconsistence, that, while we think God is just and righteous in withholding from others the things which pertain to their everlasting peace, we should find it so hard to submit to his dispensations to ourselves in matters of unspeakably less importance!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter XVI, Forty-One Letters on Religious Subjects</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-529047fc76" data-kw="">
<blockquote><p>For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, Section 2, pp. 15-16</span></figcaption>

<blockquote><p>The sabbath is approaching; and on the sabbath day night this [letter] will come to your hand. I hope we shall find it a precious day of rest to our souls. It commemorates the accomplishment of that stupendous work which brings deliverance to guilty sinners, by the resurrection of Christ from the dead. It is an emblem of that rest which sinners find in Christ for their weary souls, in consequence of his having finished the glorious work he had undertaken. This is also a pledge of that rest that yet remaineth for the people of God. As sure as we are now enjoying the one, we shall soon enjoy the other, if indeed we are pilgrims and sojourners here on earth.

The Jewish sabbath, being the seventh day, was to them a commemoration of their glorious deliverance from their Egyptian bondage, a sign between God and them, and a pledge of the promised inheritance. It looked backward and forward, it reminded them of their slavery and deliverance from it, whilst by faith they were looking forward to the land of promise, where they should rest from their wanderings in a barren and dangerous wilderness. Our Sabbath also speaks the same language, – it reminds us of a bondage infinitely dreadful, and of a deliverance infinitely complete and glorious, and also of a rest eternal in the heavens.

It directly looks to Christ as the glorious author of this deliverance, and in whom only we can find rest to our souls. This rest is his purchase and gift— “I will give you rest.” When we consider what this rest cost him, can we help admiring his love and his kindness? “The travail of his soul” is our rest. “With his stripes are healed” – “He hath borne our sorrows and carried our griefs,” — What words are these. His sorrow is our joy, his travail is our rest, his stripes are our medicine, and his death is our life. How strange the mystery!

You see, my dear, where we are to go for rest, when weary and burdened – Jesus gives it. And if we have it not, the reason is, because we go not to him for it. The sabbath reminds us both of a duty and of a privilege in this view. It preaches to us, whilst our bodies rest from worldly toil, that we should seek rest also for our weary souls in Jesus. Christ hath “ceased from his work,” having gloriously finished it. God the Father looks upon every thing which Christ has done in our behalf, and says, “Behold it is very good,” that is, comely, glorious, satisfactory and sufficient, bringing glory to God in the highest, and peace and happiness on earth. May the Lord open our eyes to behold also the glory of the stupendous work. In the light of the Spirit it will appear to us to be very good. We shall with astonishment admire and rejoice in it, as the means of our present and eternal rest.

There is rest now in Christ; but the apostle saith, “There remaineth a rest to the people of God.” They have rest to their souls now by faith in Christ; but there remaineth a rest, both for body and soul, eternal in the heavens. Our rest now in Christ is the first fruits; the harvest will soon follow. The sabbath is a sign of the one, and a pledge of the other. Let us not therefore be weary in well-doing, but be stedfast and unmoveable, always abounding in the work of the Lord.

Let us with cheerfulness bear the cross. It is but for a little while. If the road is rough, let us not complain, for it leads to a glorious rest which nothing shall ever disturb. Let every returning sabbath revive our drooping spirits with this glorious hope, and assure our faith with increasing confidence, that whilst now we are by faith resting in Jesus, all our toils, crosses, and troubles will soon be for ever at an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— Thomas Charles, The Sabbath in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+sabbath+is+approaching%3B+and+on+the+sabbath+day+night+this+%5Bletter%5D+will+come+to+your+hand.+I+hope+we+shall+find+it+a+precious+day+of+rest+to+our+souls.+It+commemorates+the+accomplishment+of+that+stupendous+work+which+brings+deliverance+to+guilty+sinners%2C+by+the+resurrection+of+Christ+from+the+dead.+It+is+an+emblem+of+that+rest+which+sinners+find+in+Christ+for+their+weary+souls%2C+in+consequence+of+his+having+finished+the+glorious+work+he+had+undertaken.+This+is+also+a+pledge+of+that+rest+that+yet+remaineth+for+the+people+of+God.+As+sure+as+we+are+now+enjoying+the+one%2C+we+shall+soon+enjoy+the+other%2C+if+indeed+we+are+pilgrims+and+sojourners+here+on+earth.%0A%0AThe+Jewish+sabbath%2C+being+the+seventh+day%2C+was+to+them+a+commemoration+of+their+glorious+deliverance+from+their+Egyptian+bondage%2C+a+sign+between+God+and+them%2C+and+a+pledge+of+the+promised+inheritance.+It+looked+backward+and+forward%2C+it+reminded+them+of+their+slavery+and+deliverance+from+it%2C+whilst+by+faith+they+were+looking+forward+to+the+land+of+promise%2C+where+they+should+rest+from+their+wanderings+in+a+barren+and+dangerous+wilderness.+Our+Sabbath+also+speaks+the+same+language%2C+%E2%80%93+it+reminds+us+of+a+bondage+infinitely+dreadful%2C+and+of+a+deliverance+infinitely+complete+and+glorious%2C+and+also+of+a+rest+eternal+in+the+heavens.%0A%0AIt+directly+looks+to+Christ+as+the+glorious+author+of+this+deliverance%2C+and+in+whom+only+we+can+find+rest+to+our+souls.+This+rest+is+his+purchase+and+gift%E2%80%94+%E2%80%9CI+will+give+you+rest.%E2%80%9D+When+we+consider+what+this+rest+cost+him%2C+can+we+help+admiring+his+love+and+his+kindness%3F+%E2%80%9CThe+travail+of+his+soul%E2%80%9D+is+our+rest.+%E2%80%9CWith+his+stripes+are+healed%E2%80%9D+%E2%80%93+%E2%80%9CHe+hath+borne+our+sorrows+and+carried+our+griefs%2C%E2%80%9D+%E2%80%94+What+words+are+these.+His+sorrow+is+our+joy%2C+his+travail+is+our+rest%2C+his+stripes+are+our+medicine%2C+and+his+death+is+our+life.+How+strange+the+mystery%21%0A%0AYou+see%2C+my+dear%2C+where+we+are+to+go+for+rest%2C+when+weary+and+burdened+%E2%80%93+Jesus+gives+it.+And+if+we+have+it+not%2C+the+reason+is%2C+because+we+go+not+to+him+for+it.+The+sabbath+reminds+us+both+of+a+duty+and+of+a+privilege+in+this+view.+It+preaches+to+us%2C+whilst+our+bodies+rest+from+worldly+toil%2C+that+we+should+seek+rest+also+for+our+weary+souls+in+Jesus.+Christ+hath+%E2%80%9Cceased+from+his+work%2C%E2%80%9D+having+gloriously+finished+it.+God+the+Father+looks+upon+every+thing+which+Christ+has+done+in+our+behalf%2C+and+says%2C+%E2%80%9CBehold+it+is+very+good%2C%E2%80%9D+that+is%2C+comely%2C+glorious%2C+satisfactory+and+sufficient%2C+bringing+glory+to+God+in+the+highest%2C+and+peace+and+happiness+on+earth.+May+the+Lord+open+our+eyes+to+behold+also+the+glory+of+the+stupendous+work.+In+the+light+of+the+Spirit+it+will+appear+to+us+to+be+very+good.+We+shall+with+astonishment+admire+and+rejoice+in+it%2C+as+the+means+of+our+present+and+eternal+rest.%0A%0AThere+is+rest+now+in+Christ%3B+but+the+apostle+saith%2C+%E2%80%9CThere+remaineth+a+rest+to+the+people+of+God.%E2%80%9D+They+have+rest+to+their+souls+now+by+faith+in+Christ%3B+but+there+remaineth+a+rest%2C+both+for+body+and+soul%2C+eternal+in+the+heavens.+Our+rest+now+in+Christ+is+the+first+fruits%3B+the+harvest+will+soon+follow.+The+sabbath+is+a+sign+of+the+one%2C+and+a+pledge+of+the+other.+Let+us+not+therefore+be+weary+in+well-doing%2C+but+be+stedfast+and+unmoveable%2C+always+abounding+in+the+work+of+the+Lord.%0A%0ALet+us+with+cheerfulness+bear+the+cross.+It+is+but+for+a+little+while.+If+the+road+is+rough%2C+let+us+not+complain%2C+for+it+leads+to+a+glorious+rest+which+nothing+shall+ever+disturb.+Let+every+returning+sabbath+revive+our+drooping+spirits+with+this+glorious+hope%2C+and+assure+our+faith+with+increasing+confidence%2C+that+whilst+now+we+are+by+faith+resting+in+Jesus%2C+all+our+toils%2C+crosses%2C+and+troubles+will+soon+be+for+ever+at+an+end.%E2%80%9D%0A%0A%E2%80%94+Thomas+Charles%2C+The+Sabbath+in+Edward+Morgan+%28ed.%29%2C+Essays%2C+Letters%2C+and+Interesting+Papers+of+the+Late+Rev.+Thomas+Charles%2C+A.B.+Bala%2C+Merionethshire&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F663b16fbdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/663b16fbdb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/25/thomas-charles-our-sabbath-rest-in-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>That which hinders the Church’s edification by the ruler’s fault, it may be the people’s duty to obey for a greater good. For instance, it is less edifying to use our old singing psalms than a better version. And yet for concord, if the ruler appoint them, the people must use them because concord with that imperfection is better than to sing everyone a several better version or diverse versions at once. So a faulty translation of Scripture, a weak sermon, an inconvenient hour and place, when concord is necessary and cannot be had in the more edifying circumstances, it must be had in the best way we can. If the sheriff appoint an unfit time and place to meet to choose parliament-men, it’s a duty to comply rather than not to meet at all. Every evil so far excludes good, and yet we must not renounce communion in all good where men mix any evil lest we also give over all good ourselves.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5df3ae534" data-kw="">
<blockquote><p>Q. DId God create the world at the same instant, or in the space of six days? A. In the space of six days: First, because Moses’ narration is historical, and therefore he speaks of six distinct days. Secondly, Moses, Ex. 20 &amp; 31, urges the Jews to work six days and rest the seventh, because God created the world in six days and rested the seventh; this reason had been ridiculous if God had made the world in an instant. Thirdly, if we understand Moses in this place allegorically, then we must make this whole history an allegory. Fourthly, if the seventh day had been the first (and in it God had created the world), then how is it understood that God rested the seventh day? Fiftly, how could so many diverse kinds of creatures be created in the same instant of time? yea, then we must say that man was created and brought into Paradise and was cast asleep, and Eve was formed of his rib the same instant. Q. How then is that understood, Ecclesiasticus 18 [v. 1], ‘He that lives forever, created all things together’? A. It is to be understood of that confused mass that God created in the beginning: out of the which afterward He created the rest of the creatures in their distinct days. Q. Why did God spend so much time in making the world? A. Not because He was weak and could not make it in less time, but that we might the more seriously consider the order of the creation, distinction and replenishing of the world; and in these, the omnipotency, wisdom and goodness of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Fourteen First Chapters of Genesis, by way of Question &amp; Answer… (London, 1626), Questions on the 2nd Chapter</cite>, pp. 28-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-6372163ef0" data-kw="">
<blockquote><p>VIII. …For on the first day [of Creation]… a shining body lighted up in one hemisphere of the ethereal heavens (which by its circumrotation distinguished the day and night of the first three days, until that light was afterwards, on the fourth day, collected and distributed into the body of the sun and stars).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, vol. 1, 5th Topic, ‘Creation’, 6th Question</cite>, p. 449</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-de85ec286c" data-kw="">
<blockquote><p>In like sort we may imagine time before the world; for who doubts but that it was possible that time should have been sooner than it was and wh•s it is now about six thousand years since the world began; so if it had pleased God, it might have been 10 thousand. But do not you infer here hence that we do imagine infinite time preceding the world; for that is not held to be possible as finite time is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity... (London, 1631), sect. 2, ch. 5</cite>, pp. 89-90</span></figcaption>

</figure><figure class="quote" id="q-4f8dce999b" data-kw="">
<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brief Remarks upon Mr. [William] Whiston’s New Theory of the Earth &amp; upon an other Gentleman’s Objections Against Some Passages in a Discourse of the Existence &amp; Providence of God, Relating to the Copernican Hypothesis (London, 1697)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.”

<blockquote><p>What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | See especially Ch. 5, ‘Divine Revelation itself the only foundation and reason of faith’, p. 69 ff.</cite>, pp. 69, 72, 81</span></figcaption>

</figure><figure class="quote" id="q-2dbd98f48a" data-kw="">
<blockquote><p>I. Protestants call historical faith a mere and simple assent that many give to what is proposed in the Word of God, because of the authority of God who speaks and testifies; however, it does not move them to act rightly or make them better. By such faith, it is said Simon Magus believed, whose heart was not right before God, and who nevertheless remained in the gall of bitterness and in the bonds of iniquity, as judged by Peter, Acts 8. And similarly, those Jewish leaders believed who did not confess Christ because they loved the glory of men more than the glory of God, Jn. 12. II. Moreover, this faith is called historical, not because it concerns only those things which are narrated historically in the Scriptures. For those endowed with this faith truly believe whatever is contained in the Word of God, not less the promises, doctrines, and precepts than the histories and narratives. But this appellation is derived from the way this faith deals with its object. Just as when we read histories that do not pertain to us, we contemplate them dispassionately, and are not moved or affected internally: so those who have that faith idly speculate on what the Word of God teaches, without referring it to practice. III. And this is the faith that James, in the second chapter of his epistle, calls dead faith; because, devoid of all motion and action, it is like a corpse. Therefore, it is of no benefit for salvation but rather increases the guilt and condemnation of those who adhere to it. As James says there, “What does it profit, my brothers, if someone says he has faith but does not have works? Can faith save him?” He even dares to attribute such faith to demons in the same passage: “You believe that there is one God. You do well. Even the demons believe—and tremble!” Hence, Protestants do not consider it worthy of the name of true faith; because, in their judgment, only that faith deserves to be called true which brings righteousness and salvation to the one who is endowed with it, which is not the case with this kind of faith. IV. Hence they conclude that this faith must be distinguished from that faith which scripture adorns with the highest praises and commendations, to which we are so frequently and vehemently exhorted, and to which our righteousness and salvation are usually attributed, as being inseparably connected with it. As when it is said in John, “For God so loved the world that he gave his only Son, that whoever believes in him should not perish but have eternal life.” And similarly in Mark, “Whoever believes and is baptized will be saved.” This is consistent with Paul’s statement in the Letter to the Romans, “For Christ is the end of the law for righteousness to everyone who believes.” Hence, it is evident that there is a kind of faith by which whoever has it is righteous before God and is gracious and acceptable to God for salvation and eternal life; and which is therefore different from the faith found in the wicked and demons. This very faith of the pious and the righteous is considered by Protestants alone worthy of the name of true, salvific, and justifying faith. Jn. 3, Mk. 16, Rom. 10. … XVIII. Moreover, from all these definitions of justifying and salvific faith, it is apparent that two things, according to the Reformed, distinguish living and justifying faith from historical and dead faith. The first is that historical faith is theoretical and resides in the theoretical intellect; but justifying faith is a practical assent, through which the things believed, in any way, are brought back to practice, and the will and affections of man are effectively moved and affected; so they act in conformity with the things believed. The second is that historical faith provides only a general assent to divine promises, but justifying faith applies them individually to each believer. XIX. Hence, it is also clear, from the Reformed perspective, that justifying faith is so different from historical faith that it includes all its virtue; and thus it is distinguished from it as the perfect from the imperfect, or with the distinction with which a higher degree differs from a lower. For justifying faith relates to dead and historical faith as the rational soul to the sensitive and vegetative, which eminently includes their power and faculties, life, sensation, and motion, and adds the degree of reason. For justifying faith also makes us believe all that is taught by the word of God, which historical faith provides. But it surpasses it in that it illuminates the theoretical mind more clearly, powerfully affects the practical aspect, and deeply penetrates; it generates a sharper sense of truth and a firmer assent in our minds than that inert and idle faith. Moreover, whatever it derives from the word of God, it refers to action, organizing life, and applies to each believer in a certain particular way. … XXIII. Moreover, Reformed theologians diligently warn that the promises of the Gospel are the object of justifying faith, not merely as their truth is considered in general, for example, that salvation and remission of sins were obtained by the death and passion of Christ for all who believe in Christ and repent; but also as they are considered to apply individually to this or that person, and are to be apprehended by faith and applied to oneself. “It is not sufficient,” says Andreas Rivetus in the cited location, “if someone knows the historical account, namely, that Christ suffered, nor even if one agrees and believes that Christ suffered for the sins of all people: But in addition, a certain confidence is required, by which the sinner most firmly believes, not only that other believers are granted the remission of sins for the sake of Christ’s merit but also that he himself individually is granted forgiveness and is received into grace because of His satisfaction, and that he applies this to himself with confidence. … LXXXII. To open up our position on each of these points we have so far presented, and where Reformed scholars seem to differ in opinion, we affirm, according to the common view of the Reformers, that historical faith must be carefully distinguished from saving and justifying faith, and there’s a significant difference between the two. Historical faith is a mere and simple assent given to the Word of God; although it stems from the Holy Spirit, it remains theoretical, resting solely in the intellect and not moving the will and affections. In contrast, saving faith not only illuminates the theoretical mind but also affects the practical mind, moving the will and affections, and consequently, this saving faith refers what the Word of God teaches to the believer’s use and applies God’s promises specifically to the believer, which historical faith does not do; for it contemplates what it believes passively, as things not pertaining to oneself. LXXXIII. The Reformed scholars dispute whether historical faith and justifying faith are subcategories of the same generic or at least analogous category, or are they merely different connotations of a homonymous term? However, we consider this question purely philosophical. As long as the distinction between historical faith and justifying faith is clear, the specific philosophical terms used to describe this difference are of little consequence to theology. But if we wish to use philosophical terms according to the convention in academic circles, I see no reason why historical faith and justifying faith cannot be considered subcategories of the same genus. They share not just a common name but also a concept represented by that name, as both involve a certain assent given to God speaking, illuminated by the Holy Spirit. LXXXIV. We also demonstrated that justifying faith is described and defined in various and differing ways by the Reformed. This diversity primarily arises because many in their definitions omit what justifying faith shares with historical faith and choose to highlight only the aspects by which justifying faith differs from historical faith. For instance, some definitions do not mention the assent justifying faith gives to the entire Word of God as revealed and presented. Furthermore, some describe justifying faith from one characteristic, while others focus on a different aspect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1</cite>, p. 135-36, 139, 158-59 Latin</span></figcaption>

— Louis Le Blanc, Theological Theses, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, p. 135-36, 139, 158-59 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Protestants+call+historical+faith+a+mere+and+simple+assent+that+many+give+to+what+is+proposed+in+the+Word+of+God%2C+because+of+the+authority+of+God+who+speaks+and+testifies%3B+however%2C+it+does+not+move+them+to+act+rightly+or+make+them+better.+By+such+faith%2C+it+is+said+Simon+Magus+believed%2C+whose+heart+was+not+right+before+God%2C+and+who+nevertheless+remained+in+the+gall+of+bitterness+and+in+the+bonds+of+iniquity%2C+as+judged+by+Peter%2C+Acts+8.+And+similarly%2C+those+Jewish+leaders+believed+who+did+not+confess+Christ+because+they+loved+the+glory+of+men+more+than+the+glory+of+God%2C+Jn.+12.+II.+Moreover%2C+this+faith+is+called+historical%2C+not+because+it+concerns+only+those+things+which+are+narrated+historically+in+the+Scriptures.+For+those+endowed+with+this+faith+truly+believe+whatever+is+contained+in+the+Word+of+God%2C+not+less+the+promises%2C+doctrines%2C+and+precepts+than+the+histories+and+narratives.+But+this+appellation+is+derived+from+the+way+this+faith+deals+with+its+object.+Just+as+when+we+read+histories+that+do+not+pertain+to+us%2C+we+contemplate+them+dispassionately%2C+and+are+not+moved+or+affected+internally%3A+so+those+who+have+that+faith+idly+speculate+on+what+the+Word+of+God+teaches%2C+without+referring+it+to+practice.+III.+And+this+is+the+faith+that+James%2C+in+the+second+chapter+of+his+epistle%2C+calls+dead+faith%3B+because%2C+devoid+of+all+motion+and+action%2C+it+is+like+a+corpse.+Therefore%2C+it+is+of+no+benefit+for+salvation+but+rather+increases+the+guilt+and+condemnation+of+those+who+adhere+to+it.+As+James+says+there%2C+%E2%80%9CWhat+does+it+profit%2C+my+brothers%2C+if+someone+says+he+has+faith+but+does+not+have+works%3F+Can+faith+save+him%3F%E2%80%9D+He+even+dares+to+attribute+such+faith+to+demons+in+the+same+passage%3A+%E2%80%9CYou+believe+that+there+is+one+God.+You+do+well.+Even+the+demons+believe%E2%80%94and+tremble%21%E2%80%9D+Hence%2C+Protestants+do+not+consider+it+worthy+of+the+name+of+true+faith%3B+because%2C+in+their+judgment%2C+only+that+faith+deserves+to+be+called+true+which+brings+righteousness+and+salvation+to+the+one+who+is+endowed+with+it%2C+which+is+not+the+case+with+this+kind+of+faith.+IV.+Hence+they+conclude+that+this+faith+must+be+distinguished+from+that+faith+which+scripture+adorns+with+the+highest+praises+and+commendations%2C+to+which+we+are+so+frequently+and+vehemently+exhorted%2C+and+to+which+our+righteousness+and+salvation+are+usually+attributed%2C+as+being+inseparably+connected+with+it.+As+when+it+is+said+in+John%2C+%E2%80%9CFor+God+so+loved+the+world+that+he+gave+his+only+Son%2C+that+whoever+believes+in+him+should+not+perish+but+have+eternal+life.%E2%80%9D+And+similarly+in+Mark%2C+%E2%80%9CWhoever+believes+and+is+baptized+will+be+saved.%E2%80%9D+This+is+consistent+with+Paul%E2%80%99s+statement+in+the+Letter+to+the+Romans%2C+%E2%80%9CFor+Christ+is+the+end+of+the+law+for+righteousness+to+everyone+who+believes.%E2%80%9D+Hence%2C+it+is+evident+that+there+is+a+kind+of+faith+by+which+whoever+has+it+is+righteous+before+God+and+is+gracious+and+acceptable+to+God+for+salvation+and+eternal+life%3B+and+which+is+therefore+different+from+the+faith+found+in+the+wicked+and+demons.+This+very+faith+of+the+pious+and+the+righteous+is+considered+by+Protestants+alone+worthy+of+the+name+of+true%2C+salvific%2C+and+justifying+faith.+Jn.+3%2C+Mk.+16%2C+Rom.+10.+%E2%80%A6+XVIII.+Moreover%2C+from+all+these+definitions+of+justifying+and+salvific+faith%2C+it+is+apparent+that+two+things%2C+according+to+the+Reformed%2C+distinguish+living+and+justifying+faith+from+historical+and+dead+faith.+The+first+is+that+historical+faith+is+theoretical+and+resides+in+the+theoretical+intellect%3B+but+justifying+faith+is+a+practical+assent%2C+through+which+the+things+believed%2C+in+any+way%2C+are+brought+back+to+practice%2C+and+the+will+and+affections+of+man+are+effectively+moved+and+affected%3B+so+they+act+in+conformity+with+the+things+believed.+The+second+is+that+historical+faith+provides+only+a+general+assent+to+divine+promises%2C+but+justifying+faith+applies+them+individually+to+each+believer.+XIX.+Hence%2C+it+is+also+clear%2C+from+the+Reformed+perspective%2C+that+justifying+faith+is+so+different+from+historical+faith+that+it+includes+all+its+virtue%3B+and+thus+it+is+distinguished+from+it+as+the+perfect+from+the+imperfect%2C+or+with+the+distinction+with+which+a+higher+degree+differs+from+a+lower.+For+justifying+faith+relates+to+dead+and+historical+faith+as+the+rational+soul+to+the+sensitive+and+vegetative%2C+which+eminently+includes+their+power+and+faculties%2C+life%2C+sensation%2C+and+motion%2C+and+adds+the+degree+of+reason.+For+justifying+faith+also+makes+us+believe+all+that+is+taught+by+the+word+of+God%2C+which+historical+faith+provides.+But+it+surpasses+it+in+that+it+illuminates+the+theoretical+mind+more+clearly%2C+powerfully+affects+the+practical+aspect%2C+and+deeply+penetrates%3B+it+generates+a+sharper+sense+of+truth+and+a+firmer+assent+in+our+minds+than+that+inert+and+idle+faith.+Moreover%2C+whatever+it+derives+from+the+word+of+God%2C+it+refers+to+action%2C+organizing+life%2C+and+applies+to+each+believer+in+a+certain+particular+way.+%E2%80%A6+XXIII.+Moreover%2C+Reformed+theologians+diligently+warn+that+the+promises+of+the+Gospel+are+the+object+of+justifying+faith%2C+not+merely+as+their+truth+is+considered+in+general%2C+for+example%2C+that+salvation+and+remission+of+sins+were+obtained+by+the+death+and+passion+of+Christ+for+all+who+believe+in+Christ+and+repent%3B+but+also+as+they+are+considered+to+apply+individually+to+this+or+that+person%2C+and+are+to+be+apprehended+by+faith+and+applied+to+oneself.+%E2%80%9CIt+is+not+sufficient%2C%E2%80%9D+says+Andreas+Rivetus+in+the+cited+location%2C+%E2%80%9Cif+someone+knows+the+historical+account%2C+namely%2C+that+Christ+suffered%2C+nor+even+if+one+agrees+and+believes+that+Christ+suffered+for+the+sins+of+all+people%3A+But+in+addition%2C+a+certain+confidence+is+required%2C+by+which+the+sinner+most+firmly+believes%2C+not+only+that+other+believers+are+granted+the+remission+of+sins+for+the+sake+of+Christ%E2%80%99s+merit+but+also+that+he+himself+individually+is+granted+forgiveness+and+is+received+into+grace+because+of+His+satisfaction%2C+and+that+he+applies+this+to+himself+with+confidence.+%E2%80%A6+LXXXII.+To+open+up+our+position+on+each+of+these+points+we+have+so+far+presented%2C+and+where+Reformed+scholars+seem+to+differ+in+opinion%2C+we+affirm%2C+according+to+the+common+view+of+the+Reformers%2C+that+historical+faith+must+be+carefully+distinguished+from+saving+and+justifying+faith%2C+and+there%E2%80%99s+a+significant+difference+between+the+two.+Historical+faith+is+a+mere+and+simple+assent+given+to+the+Word+of+God%3B+although+it+stems+from+the+Holy+Spirit%2C+it+remains+theoretical%2C+resting+solely+in+the+intellect+and+not+moving+the+will+and+affections.+In+contrast%2C+saving+faith+not+only+illuminates+the+theoretical+mind+but+also+affects+the+practical+mind%2C+moving+the+will+and+affections%2C+and+consequently%2C+this+saving+faith+refers+what+the+Word+of+God+teaches+to+the+believer%E2%80%99s+use+and+applies+God%E2%80%99s+promises+specifically+to+the+believer%2C+which+historical+faith+does+not+do%3B+for+it+contemplates+what+it+believes+passively%2C+as+things+not+pertaining+to+oneself.+LXXXIII.+The+Reformed+scholars+dispute+whether+historical+faith+and+justifying+faith+are+subcategories+of+the+same+generic+or+at+least+analogous+category%2C+or+are+they+merely+different+connotations+of+a+homonymous+term%3F+However%2C+we+consider+this+question+purely+philosophical.+As+long+as+the+distinction+between+historical+faith+and+justifying+faith+is+clear%2C+the+specific+philosophical+terms+used+to+describe+this+difference+are+of+little+consequence+to+theology.+But+if+we+wish+to+use+philosophical+terms+according+to+the+convention+in+academic+circles%2C+I+see+no+reason+why+historical+faith+and+justifying+faith+cannot+be+considered+subcategories+of+the+same+genus.+They+share+not+just+a+common+name+but+also+a+concept+represented+by+that+name%2C+as+both+involve+a+certain+assent+given+to+God+speaking%2C+illuminated+by+the+Holy+Spirit.+LXXXIV.+We+also+demonstrated+that+justifying+faith+is+described+and+defined+in+various+and+differing+ways+by+the+Reformed.+This+diversity+primarily+arises+because+many+in+their+definitions+omit+what+justifying+faith+shares+with+historical+faith+and+choose+to+highlight+only+the+aspects+by+which+justifying+faith+differs+from+historical+faith.+For+instance%2C+some+definitions+do+not+mention+the+assent+justifying+faith+gives+to+the+entire+Word+of+God+as+revealed+and+presented.+Furthermore%2C+some+describe+justifying+faith+from+one+characteristic%2C+while+others+focus+on+a+different+aspect.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98On+Justifying+Faith%E2%80%99%2C+pt.+1%2C+p.+135-36%2C+139%2C+158-59+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2dbd98f48a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2dbd98f48a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=I.%20Protestants%20call%20historical%20faith%20a,others%20focus%20on%20a%20different%20aspect&amp;text=I.%20Protestants%20call%20historical%20faith%20a%20mere%20and&amp;text=characteristic%2C%20while%20others%20focus%20on%20a%20different%20aspect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If at this day we should take a survey of the several professions of Christianity that have any large spread in any part of the world (as of the religion of the Roman and the Reformed Churches in our quarters, of the Egyptians and Ethiopians in the South, of the Grecians and other Christians in the Eastern parts) and should put-by the points wherein they differ one from another, and gather into one body the rest of the articles wherein they do all generally agree, we should find that in those propositions which without all controversy are universally received in the whole Christian world, so much truth is contained, as being joined with holy obedience, may be sufficient to bring a man unto everlasting salvation. Neither have we cause to doubt, but that as many as do walk according to this rule (neither overthrowing that which they have builded by superinducing any damnable heresies thereupon, nor otherwise vitiating their holy faith with a lewd and wicked conversation), peace shall be upon them and mercy, and upon the Israel of God.</p></blockquote>

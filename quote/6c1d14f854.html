<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>

</figure><figure class="quote" id="q-52baa4154a" data-kw="">
<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law.

3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty.

4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things.

5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie.

6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one.

7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know:

1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such.

2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause.

3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechizing of Families, a Teacher of Householders how to Teach their Households</cite>, ... (London, 1683), ch. 42, ‘Of the 9th Commandment’, pp. 361-62</span></figcaption>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>

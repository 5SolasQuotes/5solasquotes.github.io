<main class="wrap"><figure class="quote" id="q-8e7f2dc0ca" data-kw="temporal power">
<blockquote><p>Only one thing may be gathered—that princes as to spiritual matters are subjected to the spiritual power; not in like manner that they lose their political authority over ministers in temporal matters. (b) No better “are Christians distinguished here from priests, so that these things are addressed to them as Christians and not as priests.” Things to be joined together are absurdly separated; for if a priest is a Christian he ought always to be subject (although in the exercise of his office and as to spiritual matters he is free). Also, if the mark of baptism and of gospel liberty in Christ does not release from obedience to the king, much less does clerical character. For the liberty of the church is stated concerning faith and the soul before temporal matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/temporal-power.html">Temporal power</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>

</figure><figure class="quote" id="q-b2dd3d4865" data-kw="">
<blockquote><p>Therefore, having been persuaded that the Pope is the Antichrist, and since truly it is clear from the words of Scripture that this be so, we must conclude that our secession from his communion is consummately necessary and that it is quite impossible that there be a reconciliation between us, if things so remain as they are.</p></blockquote>

</figure><figure class="quote" id="q-386ba41121" data-kw="">

<main class="wrap"><figure class="quote" id="q-ccdb759494" data-kw="">
<blockquote><p>But first of all, it is necessary to consider certain changes which took place in Christian thought on this subject during the preceding centuries. Be the origin of the doctrine in the attempt to smooth the rough places of law for the sake of the weak or tender conscience, or in the practical necessity for a guiding principle of division as a kind of ready reckoner for pastoral purposes, or in both these causes, a change of deep significance came about in its structure. At first, and up to the close of the patristic era, the key-note of the distinction was oþjectivity. The external act is the criterion, so that there is a regular tabula of sins, the commission of any of which involves the sinner in mortal sin. But by the time of the Schoolmen, and notably, of in the works of St. Thomas Aquinas, a tremendous ethical course, change in the idea has come about. There are still sins which are reckoned as mortal, suo genere [in its genera], but the governing factor is no longer the external act. It is the deliberateness with which the act is committed. In other words, intention or motive is receiving recognition as the determining element in assessing the gravity of sin. It was to Peter Abelard [c. 1079–1142)] that Aquinas and his fellows were indebted for this improved idea: In the Scito Te Ipsum [Know Yourself, by Abelard] the discussion of sin moves forward out of the realm of externals. Consequent on this stressing of deliberateness at the expense of drawing a clear line between what was mortal and what venial. This indeterminacy. inevitably paved the way for laxity in the computation of the guiltiness of certain sinful acts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-r-mcadoo.html">Henry R. McAdoo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 4, ‘Mortal &amp; Venial Sin: the Reforming Strain’ in The Structure of Caroline Moral Theology (Longmans, Green, 1949), pp. 98-119</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-508fcbbc57" data-kw="">
<blockquote><p>2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ.</p></blockquote>

</figure><figure class="quote" id="q-e31e9ad7d3" data-kw="Original Sin">
<blockquote><p>Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.</p></blockquote>

</figure><figure class="quote" id="q-73711eb6d7" data-kw="">
<blockquote><p>There are some of our party who think the distinction of mortal and venial sin can be retained in this sense [as in Rom. 7], as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Disputation on the True Distinction Between Mortal &amp; Venial Sin &amp; the Impossibility of Fulfilling the Law of God from the Daily Incursion of Venial Sins; to which is annexed an Appendix on the Possibility of Perfecting</cite>, A Theological Disputation on the True Distinction Between Mortal &amp; Venial Sin &amp; the Impossibility of Fulfilling the Law of God from the Daily Incursion of Venial Sins; to which is annexed an Appendix on the Possibility of Perfecting [Praestandi, Supassing?] the Law Considered as a Gospel Rule (Aberdeen, 1633) 176 pp. | Baron (1596-39) was one of the Scottish ‘Aberdeen doctors’, a hypothetical universalist, and one whom Rutherford disputed with. Turretin says:</span></figcaption>

</figure><figure class="quote" id="q-8cc42432c9" data-kw="">
<blockquote><p>Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.13</span></figcaption>

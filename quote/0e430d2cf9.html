<main class="wrap"><figure class="quote" id="q-0e430d2cf9" data-kw="conditional thing not decree">
<blockquote><p>It is one thing for the thing decreed to be conditional; another for the decree itself. The former we grant, but not the latter. There can be granted an antecedent cause or condition of the thing willed, but not immediately of the volition itself. Thus God wills salvation to have the annexed condition of faith and repentance in the execution, but faith and repentance are not the condition or cause of the act of willing in God, nor of the decree to save in the intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/nature-of-the-decree.html">Nature of the Decree</a> › <a href="../topics/the-decrees-of-god/nature-of-the-decree/eternal-wise-free-immutable-unconditional.html">Eternal, wise, free, immutable, unconditional</a></span><span class="t"><a href="../topics/election/conditional-election.html">Conditional Election</a> › <a href="../topics/election/conditional-election/faith-the-fruit-not-the-cause-of-election.html">Faith the fruit, not the cause, of election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-285e6e7ed1" data-kw="foreknowledge decree">
<blockquote><p>If the foreknowledge of God is eternal, it is necessary that the decree upon which it is founded should also be eternal (since he does not know things as future except in the decree, through which they pass from a state of possibility to a state of futurition).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/nature-of-the-decree.html">Nature of the Decree</a> › <a href="../topics/the-decrees-of-god/nature-of-the-decree/decree-and-foreknowledge.html">Decree and foreknowledge</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 4.2.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf%20the%20foreknowledge%20of%20God%20is%20eternal%2C%20it%20is%20necessary%20that%20the%20decree%20upon%20which%20it%20is%20founded%20should%20also%20be%20eternal%20%28since%20he%20does%20not%20know%20things%20as%20future%20except%20in%20the%20decree%2C%20through%20which%20they%20pass%20from%20a%20state%20of%20possibility%20to%20a%20state%20of%20futurition%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%204.2.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F285e6e7ed1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/285e6e7ed1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-e44b964dae" data-kw="decrees of God">
<blockquote><p>That there are decrees in God both Scripture testifies (which repeatedly attributes to him foreknowledge, purpose, determinate counsel, good pleasure) and manifold reason evinces. This is true both from the highest perfection of God (to which it pertains that nothing shall take place without his will) and from his omniscience (by which he knows from eternity all his works, not only possible but also future—which he could not behold otherwise than in his decree).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1.2</span></figcaption>

</figure><figure class="quote" id="q-4abeab1df8" data-kw="liberty decree free">
<blockquote><p>The eternity of God’s decrees does not take away his liberty in decreeing. Although no moment can be assigned in which God was actually indifferent to decreeing this or that thing, still it is certain that the nature of God was in itself indifferent to decreeing this or that thing. For there was no necessary connection between God and creatures as exists between the Father and the Son (whom he could not but beget). On the other hand, he might (if he had willed) have abstained from any production of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.13</span></figcaption>

</figure><figure class="quote" id="q-36908052ff" data-kw="eternal decrees election">
<blockquote><p>We believe that all the decrees are absolutely eternal. … Scripture ascribes eternity to them (as when a kingdom is said to have been prepared for the pious “from the foundation of the world” [Mt. 25:34]; when we are said to have been chosen “before the foundation of the world” [Eph. 1:4]; and grace is said to have been given in Christ “before the world began” [2 Tim. 1:9]).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8c569efa4a" data-kw="">
<blockquote><p>Some at the first may possibly say, that this [the Trinity] cannot stand, because it is against all reason that one should be three, or three one. The answer is, that indeed if one and the same respect be kept it is not possible, but in divers [various] considerations and respects it may. And thus the Father, the Son, and the Holy Ghost are three, namely in person; and again, they three are one, not in person but in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 201.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-cd4ab28589" data-kw="against Sabellius">
<blockquote><p>The passages that the Apostle to the Hebrews applies to Christ are not obscure praises of the supreme God: &quot;You, Lord, laid the foundation of the earth in the beginning, and the heavens are the work of your hands.&quot; Also, &quot;Let all God&#x27;s angels worship him.&quot; John begins his Gospel with a splendid proclamation of Christ&#x27;s divinity: &quot;In the beginning was the Word, and the Word was with God, and the Word was God.&quot; This phrase, &quot;the Word was God, and was with God,&quot; clearly argues both the divinity of Christ and the distinction of persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XV</span></figcaption>

</figure><figure class="quote" id="q-55d2b5f415" data-kw="">
<blockquote><p>TWENTY-FOURTH QUESTION

Is the mystery of the Trinity a fundamental article of faith? We affirm against the Socinians and Remonstrants [Arminians].

I. Before discussing the truth of the mystery of the Trinity, we must premise some things concerning its necessity, not only against the Socinians (who directly deny it to be an article of faith), but also on account of the Remonstrants (who, although seeming to profess their belief of it, still deny it a place among the fundamental articles, so that the ignorance of it does not bring salvation into peril … Thus they would secretly subvert the truth of Christian doctrines oftentimes begin by agitating the question concerning their importance and necessity so that men, lulled into the sleep of security, may the more easily suffer themselves to be robbed of the truth and refuse to contend for the faith once delivered to the saints. …

IV. The question does not concern the full and perfect comprehension of this mystery; nor does it concern an intuitive knowledge of it. The former belongs to the glorified saints alone; the latter belongs to the Trinity alone … Rather the question is only whether the knowledge and confession of the three divine persons is required for the catholic faith and necessary to all who would be saved. …

VI. Thus the question comes to this: whether the mystery of the Trinity is a fundamental article, necessary to the faith of all believers, so that not only the denial, but even the ignorance of it cannot consist with salvation. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), 3.24.4, 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-8f3b8fc5f4" data-kw="">
<blockquote><p>Among all the works of God those things rightly hold the first place, which concern the glory of His creation. For neither is it permitted, that we should consider concerning those works which are of the Father toward the Son, of the Son toward the Father, of both toward the Holy Spirit, of the Holy Spirit toward both, which are neither scrutable, nor necessary to be known: but it is abundantly sufficient, if the creature should acknowledge, look up unto and glorify the work of its creator as creator, propagator, conservator, reparator, governor and consummator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd</cite>, ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<main class="wrap"><figure class="quote" id="q-14f9d5ee14" data-kw="">
<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Use of Reason in Matters of Faith’ in Willem J. van Asselt, Introduction to Reformed Scholasticism (RHB, 2011), Appendix 2</cite>, pp. 226-27</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-544a74fd5e" data-kw="">
<blockquote><p>Fourth, when I say that we cannot get from the world to God except via premises derived from philosophy of nature, I have a quite specific conception of God in mind. I do not deny that conclusions of a sort that might in some sense of the term be called “theological” might be derived from natural science. But I do deny that arguments grounded in natural science alone can get you to classical theism—the conception of God defended by Athanasius and Augustine, Avicenna and Maimonides, Anselm and Aquinas… If anything, they have a tendency to lead you away from the God of classical theism. You might get to a demiurge, to a being of superhuman intelligence and power, with arguments grounded in physics, chemistry, or biology. What you cannot get to is that which is ipsum esse subsistens [subsisting existence itself] rather than merely a being among other beings; to a sustaining cause on whom the very being of the world depends at every instant; or to that which is absolutely simple or in no way composed of parts, whether physical or metaphysical. One implication of this is that “design arguments” of the sort associated with William Paley [early-1700’s] and contemporary “Intelligent Design” theory are at best irrelevant to natural theology (as that discipline is understood in the classical theist tradition), and at worst threaten seriously to distort our understanding of God and His relationship to the world (again, at least from the point of view of classical theism).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015) | 4. Natural Theology Must Be Grounded in the Philosophy of Nature, Not in Natural Science 61</cite>, p. 72</span></figcaption>

</figure><figure class="quote" id="q-3adc09ff17" data-kw="">
<blockquote><p>Classical metaphysics attains knowledge of God’s nature by means of an interpretation, mostly taken from the Christian Neo-Platonist Pseudo-Dionysius the Areopagite (c. late fifth century) known as the via triplex or three-fold way. This entails (1) the way of causality (via causalitatis), (2) the way of remotion or negation (via remotionis), and (3) the way of eminence (via eminentiae).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dennis-bonnette.html">Dennis Bonnette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How God’s Nature Is Known: The Three-Fold Way” (2018)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-7b07652e40" data-kw="">
<blockquote><p>Aquinas’s argument is thus immune to the sorts of objections [David] Hume pressed upon design arguments, to the effect that the designer would have to work through corporeal organs the way human designers do, and would manifest complexity which itself requires explanation… They [Paley’s defenders] do not, and cannot deny that the designer at least could in principle be the sort Hume describes. But the Humean objections do not even get off the ground against Aquinas’s divine intelligence, who, being pure act, is necessarily absolutely simple and incorporeal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147</cite>, p. 185</span></figcaption>

</figure><figure class="quote" id="q-19d46ee560" data-kw="natural">
<blockquote><p>We find in man a natural law written upon each one’s conscience excusing and accusing them in good and bad actions, which therefore necessarily implies the knowledge of God, the legislator, by whose authority it binds men to obedience and proposes rewards or punishments. “The Gentiles, which have not the law” (i.e., the law of Moses) “do by nature the things contained in the law, these, having not the law, are a law unto themselves: which show the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the meanwhile accusing or else excusing one another” (Rom. 2:14, 15). This could not be said if conscience did not dictate to each one that there is a deity who approves of good actions and disapproves and punishes evil deeds. Nor are these objections of force: (1) the work of the law and not the law itself is said to be inscribed because with the apostle these are synonymous—“to be a law unto themselves” (v. 14) and “to have the work of the law written in their hearts” (v. 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.3</span></figcaption>

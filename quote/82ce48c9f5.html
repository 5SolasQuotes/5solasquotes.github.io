<main class="wrap"><figure class="quote" id="q-82ce48c9f5" data-kw="">
<blockquote><p>1. Such as are taken into an everlasting covenant shall never totally fall from grace. But all truly gracious persons are taken into an everlasting covenant, therefore they shall never totally fall from grace. That gracious persons are taken into covenant is evident because the grace of the covenant is wrought in them. That this covenant is everlasting is evident from Isaiah 55:3: “I will make an everlasting covenant with you, even the sure mercies of David.” And from Jeremiah 32:40: “I will make an everlasting covenant with them.”

That such as are taken into an everlasting covenant shall never totally fall from grace is evident because their total fall from grace would turn them out of the covenant, inasmuch as it would turn them out of God’s favour. And there is no promise of the covenant that belongs to total apostates – many threatenings, but no promises – and so the covenant would not be everlasting to them, neither would the mercies therefore be sure mercies.

2. Those to whom God has made sure promises of everlasting life and happiness shall never totally fall from grace. But God has made sure promises of everlasting life and happiness to all who are truly gracious; therefore none who are truly gracious shall totally fall from grace. … All such as are truly gracious have these graces of faith and love, and therefore the promises of eternal life and happiness are made unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Work Begun in the Day of Grace Performed Until the Day of Christ</cite>, ed. Don Kistler (1672; Morgan PA: Soli Deo Gloria, 1998), p. 46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bc5b6209af" data-kw="">
<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-johnson.html">Charles Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Thomas &amp; TULIP’</cite>, (2020) 20 paragraphs at Reformed Theology Delatinized</span></figcaption>

</figure><figure class="quote" id="q-d608331739" data-kw="">
<blockquote><p>Though many storms and floods arise and beat against them, yet they shall never be able to take them off that foundation and rock which by faith they are fastened upon; notwithstanding, through unbelief and the temptations of Satan, the sensible sight of the light and love of God may for a time be clouded and obscured from them, yet he is still the same, and they shall be sure to be kept by the power of God unto salvation, where they shall enjoy their purchased possession, they being engraven upon the palm of his hands, and their names having been written in the book of life from all eternity.</p></blockquote>

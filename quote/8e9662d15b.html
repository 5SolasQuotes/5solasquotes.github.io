<main class="wrap"><figure class="quote" id="q-8e9662d15b" data-kw="union">
<blockquote><p>From this sealing arises the sacramental union of the sign with the thing signified. This is neither physical, such as is that of matter and form, of the subject and accident; nor local, by contact and contiguity; nor spiritual, so that by the signs the power of justifying and regenerating is immediately instilled. But it is wholly schetical (schetikē) and relative, or moral (such as between the rites of investiture and the office with which anyone is invested or between a pledge and the thing which the pledge signifies). Just as things signified are not joined by a natural position with those words by which they are signified and by the very substance, but only by a relation and schesis (schesei), inasmuch as those words (as the marks of things) make the things themselves as it were present to the understanding of those who perceive them. Thus also a sacrament (which moreover is said to be a certain visible word, bearing into the eyes that which words bring into the ears) demands no local presence or nonexistence (inexistentiam) of the sign with the thing signified, but implies the</p></blockquote>

inked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7794a32bba" data-kw="two vs seven">
<blockquote><p>However, this topic contains many heads. First, we will dispute in general concerning the sacraments; second, in particular of baptism and the holy Supper, which are the two sacraments of the New Testament instituted by Christ; third, of the five false and spurious ones added by Romanists. But we must first say something about the word and the definition of a sacrament. Use of the word “sacrament.”.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.1.2</span></figcaption>

</figure><figure class="quote" id="q-35edb03733" data-kw="signs seals">
<blockquote><p>In defining a sacrament, we follow Paul, who, speaking of circumcision, says, it is “a sign and seal of the righteousness of faith” (Rom. 4:11). This is a generic definition and is rightly ascribed to the species. Therefore, this torch throwing its light before us, we say: “The sacraments are the signs and seals of the grace of God in Christ.” Or a little more explicitly: “Sacred visible signs and seals divinely instituted to signify and seal to our consciences the promises of saving grace in Christ and in turn to testify our faith and piety and obedience towards God.” In this definition, the nature of the sacraments is made clearly known from their causes (concerning which something must be said didactically before we treat them argumentatively). The matter of a sacrament is twofold: the sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.1.9</span></figcaption>

</figure><figure class="quote" id="q-70fbe0dd05" data-kw="">
<blockquote><p>The schools of the Sophists have taught with remarkable agreement that the sacraments of the new law (those now used in the Christian church) justify and confer grace, provided we do not set up a barrier of mortal sin. How deadly and pestilential this notion is cannot be expressed — and the more so because for many centuries it has been a current claim in a good part of the world, to the great loss of the church. Of a certainty it is diabolical. For in promising a righteousness apart from faith, it hurls souls headlong to destruction… Hence, any man is deceived who thinks anything more is conferred upon him through the sacraments than what is offered by God’s Word and received by him in true faith. From this something else follows: assurance of salvation does not depend upon participation in the sacrament, as if justification consisted in it. For we know that justification is lodged in Christ alone, and that it is communicated to us no less by the preaching of the gospel than by the seal of the sacrament, and without the latter can stand unimpaired.</p></blockquote>

</figure><figure class="quote" id="q-485a9633bd" data-kw="">
<blockquote><p>Do the sacraments of the New Testament work grace so physically that they effect and contain it ex opere operato, whether faith and devotion are present or not? Or are they rather efficacious signs and seals of grace? The former we deny; the latter we affirm against the Romanists.</p></blockquote>

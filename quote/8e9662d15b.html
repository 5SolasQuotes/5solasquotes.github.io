<main class="wrap"><figure class="quote" id="q-8e9662d15b" data-kw="union">
<blockquote><p>From this sealing arises the sacramental union of the sign with the thing signified. This is neither physical, such as is that of matter and form, of the subject and accident; nor local, by contact and contiguity; nor spiritual, so that by the signs the power of justifying and regenerating is immediately instilled. But it is wholly schetical (schetikē) and relative, or moral (such as between the rites of investiture and the office with which anyone is invested or between a pledge and the thing which the pledge signifies). Just as things signified are not joined by a natural position with those words by which they are signified and by the very substance, but only by a relation and schesis (schesei), inasmuch as those words (as the marks of things) make the things themselves as it were present to the understanding of those who perceive them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.4.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f85e5fd28" data-kw="intention">
<blockquote><p>(1) The personal sin of one does not injure another who does not share in it. Now the defect of intention of the minister is the personal sin of that minister. Therefore it does not injure another not partaking of it—him, namely, who is the partaker of the sacrament rightly celebrated. However, it would injure him, if from the defect of that intention, the sacrament would be made void. 2. Because there is the same relation of the sacrament as of the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.7.5</span></figcaption>

</figure><figure class="quote" id="q-7794a32bba" data-kw="two vs seven">
<blockquote><p>However, this topic contains many heads. First, we will dispute in general concerning the sacraments; second, in particular of baptism and the holy Supper, which are the two sacraments of the New Testament instituted by Christ; third, of the five false and spurious ones added by Romanists. But we must first say something about the word and the definition of a sacrament. Use of the word “sacrament.”.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.1.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“However, this topic contains many heads. First, we will dispute in general concerning the sacraments; second, in particular of baptism and the holy Supper, which are the two sacraments of the New Testament instituted by Christ; third, of the five false and spurious ones added by Romanists. But we must first say something about the word and the definition of a sacrament. Use of the word “sacrament.”.”

— Francis Turretin, Institutes of Elenctic Theology, 19.1.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C%20this%20topic%20contains%20many%20heads.%20First%2C%20we%20will%20dispute%20in%20general%20concerning%20the%20sacraments%3B%20second%2C%20in%20particular%20of%20baptism%20and%20the%20holy%20Supper%2C%20which%20are%20the%20two%20sacraments%20of%20the%20New%20Testament%20instituted%20by%20Christ%3B%20third%2C%20of%20the%20five%20false%20and%20spurious%20ones%20added%20by%20Romanists.%20But%20we%20must%20first%20say%20something%20about%20the%20word%20and%20the%20definition%20of%20a%20sacrament.%20Use%20of%20the%20word%20%E2%80%9Csacrament.%E2%80%9D.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2019.1.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7794a32bba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7794a32bba.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-35edb03733" data-kw="signs seals">
<blockquote><p>In defining a sacrament, we follow Paul, who, speaking of circumcision, says, it is “a sign and seal of the righteousness of faith” (Rom. 4:11). This is a generic definition and is rightly ascribed to the species. Therefore, this torch throwing its light before us, we say: “The sacraments are the signs and seals of the grace of God in Christ.” Or a little more explicitly: “Sacred visible signs and seals divinely instituted to signify and seal to our consciences the promises of saving grace in Christ and in turn to testify our faith and piety and obedience towards God.” In this definition, the nature of the sacraments is made clearly known from their causes (concerning which something must be said didactically before we treat them argumentatively). The matter of a sacrament is twofold: the sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.1.9</span></figcaption>

</figure><figure class="quote" id="q-0286a9a64d" data-kw="">
<blockquote><p>While the grace of God generally operates mediately, it is not inherent in the means as a divine deposit, but accompanies the use of these. This must be maintained in opposition to the Roman Catholics, the High Church Anglicans, and the Lutherans, who proceed on the assumption that the means of grace always operate in virtue of an inherent power, though their operation may be made ineffective by the condition or attitude of the recipient. Protestants, on the other hand, teach that the sacraments are not absolutely necessary unto salvation, but are obligatory in view of the divine precept.… That they are not absolutely necessary unto salvation, follows… from the fact that Scripture mentions only faith as the instrumental condition of salvation… and from the fact that the sacraments do not originate faith but presuppose it, and are administered where faith is assumed, Acts 2:41; 16:14,15,30,33; I Cor. 11:23-32; and from the fact that many were actually saved without the use of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Means of Grace; Necessity of the Sacraments</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4acaa6973a" data-kw="">
<blockquote><p>…the overwhelming majority of the [1680’s] Society People [or Cameronians] followed their ministers and joined with the Church of Scotland… The last official record (in Faithful Contendings [pp. 461-62]) of the General Society was a blank letter of protest for individual Society members to use when they resumed membership in the Church of Scotland.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (Ross-shire, Scotland: Christian Focus, 2000), p. 158</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-e16d53b188" data-kw="">
<blockquote><p>Testimonies for the Lord are necessary, lovely and singularly useful, when according to the rule: But, when these prescribed bounds are exceeded, and our misguided zeal for a pretended respect to the Lord’s honor hurries to a taxing the commissions of his choicest ambassadors, and trampling such as are eminently beautified with Christ’s image, who can tell how far this gangrene may reach? My heart trembles at the mischiefs which any one unsound and unsafe position does lead to, especially in matters of this nature; and have often admired the judicious observe of a great man, against whom our friends, especially the more exercised, are not much, if at all, prejudiced, viz. ‘He that sheds man’s blood, by man shall his blood be shed; but whoso sheds the blood of Churches, his blood shall be shed by the Lord.’ (These are said to be the words of Mr. Shepherd.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-432f4c9ea1" data-kw="">
<blockquote><p>There was impurity or corruption in worship in the Church of Corinth; for women taught in the Church: There was corrupt doctrine; many denied the resurrection. In manners she was most corrupt, there being so many fornications, sects, palpable love of the world, etc. Yet the apostle did not command those that were worthily prepared to abstain from the Supper, but, rectifying abuses, he did command everyone to try himself, and so eat.</p></blockquote>

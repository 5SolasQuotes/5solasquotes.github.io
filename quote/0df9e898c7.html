<main class="wrap"><figure class="quote" id="q-0df9e898c7" data-kw="">
<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on The Heart, p. 322</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a067c1d621" data-kw="">
<blockquote><p>When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.</p></blockquote>

</figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>

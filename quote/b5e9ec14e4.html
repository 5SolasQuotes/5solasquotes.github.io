<main class="wrap"><figure class="quote" id="q-b5e9ec14e4" data-kw="">
<blockquote><p>The full assurance of obtaining what we want must not chill our supplications for it. Who can have greater assurance of supply than our Redeemer had of assistance in his task, and exaltation after it? Insured by the promises to him, backed by the oath of God, that he should be a priest for ever, of which he had at this time a sense and impression upon his heart, John xiii. 1, 3, he knew that he should ‘depart out of this world unto the Father;’ and ‘knowing that the Father had given all things into his hands, that he was come from God, and went to God,’ yet he prays for that glory. Promises are not damps, but incentives and guides, to prayer; they are to inflame us, not to cool us.

How can we pray in faith without a promise, which is the ground of faith, since prayer is nothing but a putting promises in suit! Precepts command us to pray, and promises direct us what to pray for, with hopes of success. The promises of a seed to Christ stand firm, yet he is now in heaven an advocate interceding for it. As Christ, though assured, hath nothing without asking, so neither can his members. Promises encourage to put in our claim to them, and not our waiving it. When Daniel knew that the term of the church’s captivity was near expired, according to the promise of God, he buckles more to prayer, Dan. ix. 2, 3</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 6-7.</span></figcaption>

<blockquote><p>Without all question the Models of some eminent persons Devotion, may be a singular help to others Devotion. Every one that hath this divine fire of Devotion in his soul, cannot always readily bring fit fuel to make it flame forth. But when fuel is brought by others, it will soon take, and quickly flame out.

Neither is this (as some too weakly, though very violently cavil) to stint the spirit of supplication. For the work of the Spirit consists not so much in the words and phrases whereby the matter of Devotion is expressed, as in the intention of the heart, and in the entireness and earnestness of the affection, wherein the very form, soul and life of true Devotion consisteth.

Otherwise, the spirit of all GOD’S people in all public Liturgies, and forms of prayer would be stinted: yea by this reason the spirit of every one that joineth with another in prayer (except his spirit only who conceiveth and uttereth the prayer) would be stinted. And if so, then away with public assemblies for prayer: away with family meetings to call upon GOD: away with all meetings of two or three together in CHRIST’S name, notwithstanding CHRIST’S promise of being in the midst of them (Mat. 18. 20.) But rather away with such proud and preposterous conceits, which clean cross the tenor of sacred Scripture, and commendable custom of GOD’S Church in all ages.

Sacred Scripture records sundry prayers conceived and uttered by one, but assented to by sundry others, whereby they became also the prayers of those others. The 102. Psalm bears this title, A Prayer for the afflicted when he is overwhelmed and poureth out his complaint before the LORD. This title apparently sheweth that the Prophet who first penned this Psalm, did it in the persons and for the use of any poor distressed servant of GOD.

So as we thereby are taught what to pray when our sins lie heavy upon us, or when we are in any other distress. It is expressly said that John taught his Disciples to pray, Luke 11. 1. This questionless was done by prescribing unto them a form of prayer. Whereupon when a Disciple of CHRIST said unto him, LORD teach us to pray as John also taught his Disciples, he said unto them, when ye pray, say Our Father which art in Heaven, &amp;c.

As John had prescribed a form to his Disciples, so CHRIST doth to his: and so teacheth them to pray, as John did his. Sundry forms of prayers were by the Ancient Fathers composed for the Churches in their days. In like manner have all Christian Churches in succeeding ages, had their particular forms. Never had any age, or country more pious, pithy forms then ours, some for public, others for private use, among which the form here tendered unto thee hath its excellency. As it is lawful to have such help, so may such an help be very useful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Robert Bolton, Certain devout prayers of Mr. Bolton upon solemn occasions</cite></span></figcaption>

</figure><figure class="quote" id="q-20e177c1c2" data-kw="">
<blockquote><p>And in this way, under the head of prayer, which is an offering up of desires, there may be comprehended the consideration of the whole motives by which men are induced to engage in theological study, and in preparing for the work of the ministry. The motive by which men should be led to engage in theological study is a real desire to attain to the knowledge of God’s revealed will, and the grounds of reason of this desire, the causes that produce it, and keep it in strong and vigorous exercise, should be right views of its nature, excellence, and objects, as coming from God, as making him known to us, and as communicated by him to men, in order that they, through the knowledge and belief of it, may be saved from eternal misery, and enabled to glorify God and to enjoy him for ever.

It is because theology, as taught in the word of God, is possessed of this character, and intended to be the means of effecting these results, that you should desire the knowledge of it. And as candidates for the office of the ministry, you should seek and desire the knowledge of it, not only for your own salvation, but in order that, devoting your lives to the making it known to others, you may become the instruments of saving the souls of your fellow-men.

A desire to attain to a full knowledge of God’s revealed will, and generally to acquire all the qualifications necessary for entering upon the work of the ministry, originating in such views as these, clearly apprehended, and deeply impressed upon your hearts, will ever be accompanied with profound humility, with a deep sense of responsibility, and with a firm determination to be unwearied and persevering, to spare no pains, and to shrink from no sacrifice, in the use of all the means by which the necessary knowledge may be acquired, and the due qualifications may be secured. And the first and most indispensable of all requisites is, that you have such a desire, founded upon such views and considerations; and whenever this desire becomes at any time weak and languid, you are to seek to have it strengthened and invigorated by meditation upon the value of divine truth, and the preciousness of the salvation of souls.

When this desire has been really called forth in your hearts—and without it your labours and studies in acquiring theological knowledge cannot be expected to lead to any important practical results, but only to harden your hearts and prove offensive to God—then you will feel constrained to offer it up to God in prayer, under a conviction that he alone can gratify it, and animated by the assurance that he has promised his Holy Spirit to them that ask him.

If all your studies, and especially all your attempts to ascertain the meaning of the statements of God’s word, are not accompanied by fervent prayer for the outpouring of the Holy Spirit, the inference is irresistible, either that you do not really desire to become savingly acquainted with divine truth for your own benefit and that of others, or else that you do not really believe that God alone can bestow this knowledge, and that he usually gives it in answer to prayer.

And it is most proper that, in connection with this topic, you should examine carefully into the state of your hearts, and into the motives which have led you to engage in a course of theological study, the desires by which you are animated in the prosecution of it, and the objects which you have in view. Without right views and deep impressions of the origin and source, the character and objects of theological truth, you can have no right and well-principled desire to acquire the knowledge of it, and without such a desire existing in your heart, and distinctly recognised and felt there, you can present no sincere or acceptable prayer to God for the enlightening influences of the Holy Spirit.

Where no desire exists in the heart, of course it cannot be offered up; and where a desire for the outpouring of the Holy Spirit is not offered up, there is no reason to expect that the Spirit will be given. If you are not yet aware that a useful and really valuable knowledge of theology must come from the Holy Spirit, and is usually given in answer to prayer, you are still ignorant of the first principles of God’s oracles; and if you have no real and ardent desire to get this knowledge, and are not ready and resolved to abound and to persevere in the use of all the means which may contribute to the attainment of it, then your attendance here is a mockery, it is a hypocritical profession which does not correspond with the actual state of your hearts; and in that case it would be much safer and more expedient for you to direct your attention to some other object of pursuit.

Your prayers thus become tests of your character and motives—plain indications of the real desires that exist in your hearts, and of the objects which you are really aiming at. Although a desire to have the enlightening influences of the Holy Spirit is the only right basis, and will prove the only efficient source of prayer for his outpouring, yet it is to be remembered that the desire must not only exist, but must also be offered up.

Men are very apt to deceive themselves in regard to the state of their hearts, and the character of their desires and affections. They are not naturally inclined to pray, and you must beware of being satisfied with any other evidence of the existence and strength of that desire, under the influence of which you profess to be acting, except the fervency and the frequency with which you offer it up to God in prayer.</p></blockquote>

— William Cunningham, Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture, (New York: Robert Carter and Brothers, 1878), Lecture V, pp 66-68.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+in+this+way%2C+under+the+head+of+prayer%2C+which+is+an+offering+up+of+desires%2C+there+may+be+comprehended+the+consideration+of+the+whole+motives+by+which+men+are+induced+to+engage+in+theological+study%2C+and+in+preparing+for+the+work+of+the+ministry.+The+motive+by+which+men+should+be+led+to+engage+in+theological+study+is+a+real+desire+to+attain+to+the+knowledge+of+God%E2%80%99s+revealed+will%2C+and+the+grounds+of+reason+of+this+desire%2C+the+causes+that+produce+it%2C+and+keep+it+in+strong+and+vigorous+exercise%2C+should+be+right+views+of+its+nature%2C+excellence%2C+and+objects%2C+as+coming+from+God%2C+as+making+him+known+to+us%2C+and+as+communicated+by+him+to+men%2C+in+order+that+they%2C+through+the+knowledge+and+belief+of+it%2C+may+be+saved+from+eternal+misery%2C+and+enabled+to+glorify+God+and+to+enjoy+him+for+ever.%0A%0AIt+is+because+theology%2C+as+taught+in+the+word+of+God%2C+is+possessed+of+this+character%2C+and+intended+to+be+the+means+of+effecting+these+results%2C+that+you+should+desire+the+knowledge+of+it.+And+as+candidates+for+the+office+of+the+ministry%2C+you+should+seek+and+desire+the+knowledge+of+it%2C+not+only+for+your+own+salvation%2C+but+in+order+that%2C+devoting+your+lives+to+the+making+it+known+to+others%2C+you+may+become+the+instruments+of+saving+the+souls+of+your+fellow-men.%0A%0AA+desire+to+attain+to+a+full+knowledge+of+God%E2%80%99s+revealed+will%2C+and+generally+to+acquire+all+the+qualifications+necessary+for+entering+upon+the+work+of+the+ministry%2C+originating+in+such+views+as+these%2C+clearly+apprehended%2C+and+deeply+impressed+upon+your+hearts%2C+will+ever+be+accompanied+with+profound+humility%2C+with+a+deep+sense+of+responsibility%2C+and+with+a+firm+determination+to+be+unwearied+and+persevering%2C+to+spare+no+pains%2C+and+to+shrink+from+no+sacrifice%2C+in+the+use+of+all+the+means+by+which+the+necessary+knowledge+may+be+acquired%2C+and+the+due+qualifications+may+be+secured.+And+the+first+and+most+indispensable+of+all+requisites+is%2C+that+you+have+such+a+desire%2C+founded+upon+such+views+and+considerations%3B+and+whenever+this+desire+becomes+at+any+time+weak+and+languid%2C+you+are+to+seek+to+have+it+strengthened+and+invigorated+by+meditation+upon+the+value+of+divine+truth%2C+and+the+preciousness+of+the+salvation+of+souls.%0A%0AWhen+this+desire+has+been+really+called+forth+in+your+hearts%E2%80%94and+without+it+your+labours+and+studies+in+acquiring+theological+knowledge+cannot+be+expected+to+lead+to+any+important+practical+results%2C+but+only+to+harden+your+hearts+and+prove+offensive+to+God%E2%80%94then+you+will+feel+constrained+to+offer+it+up+to+God+in+prayer%2C+under+a+conviction+that+he+alone+can+gratify+it%2C+and+animated+by+the+assurance+that+he+has+promised+his+Holy+Spirit+to+them+that+ask+him.%0A%0AIf+all+your+studies%2C+and+especially+all+your+attempts+to+ascertain+the+meaning+of+the+statements+of+God%E2%80%99s+word%2C+are+not+accompanied+by+fervent+prayer+for+the+outpouring+of+the+Holy+Spirit%2C+the+inference+is+irresistible%2C+either+that+you+do+not+really+desire+to+become+savingly+acquainted+with+divine+truth+for+your+own+benefit+and+that+of+others%2C+or+else+that+you+do+not+really+believe+that+God+alone+can+bestow+this+knowledge%2C+and+that+he+usually+gives+it+in+answer+to+prayer.%0A%0AAnd+it+is+most+proper+that%2C+in+connection+with+this+topic%2C+you+should+examine+carefully+into+the+state+of+your+hearts%2C+and+into+the+motives+which+have+led+you+to+engage+in+a+course+of+theological+study%2C+the+desires+by+which+you+are+animated+in+the+prosecution+of+it%2C+and+the+objects+which+you+have+in+view.+Without+right+views+and+deep+impressions+of+the+origin+and+source%2C+the+character+and+objects+of+theological+truth%2C+you+can+have+no+right+and+well-principled+desire+to+acquire+the+knowledge+of+it%2C+and+without+such+a+desire+existing+in+your+heart%2C+and+distinctly+recognised+and+felt+there%2C+you+can+present+no+sincere+or+acceptable+prayer+to+God+for+the+enlightening+influences+of+the+Holy+Spirit.%0A%0AWhere+no+desire+exists+in+the+heart%2C+of+course+it+cannot+be+offered+up%3B+and+where+a+desire+for+the+outpouring+of+the+Holy+Spirit+is+not+offered+up%2C+there+is+no+reason+to+expect+that+the+Spirit+will+be+given.+If+you+are+not+yet+aware+that+a+useful+and+really+valuable+knowledge+of+theology+must+come+from+the+Holy+Spirit%2C+and+is+usually+given+in+answer+to+prayer%2C+you+are+still+ignorant+of+the+first+principles+of+God%E2%80%99s+oracles%3B+and+if+you+have+no+real+and+ardent+desire+to+get+this+knowledge%2C+and+are+not+ready+and+resolved+to+abound+and+to+persevere+in+the+use+of+all+the+means+which+may+contribute+to+the+attainment+of+it%2C+then+your+attendance+here+is+a+mockery%2C+it+is+a+hypocritical+profession+which+does+not+correspond+with+the+actual+state+of+your+hearts%3B+and+in+that+case+it+would+be+much+safer+and+more+expedient+for+you+to+direct+your+attention+to+some+other+object+of+pursuit.%0A%0AYour+prayers+thus+become+tests+of+your+character+and+motives%E2%80%94plain+indications+of+the+real+desires+that+exist+in+your+hearts%2C+and+of+the+objects+which+you+are+really+aiming+at.+Although+a+desire+to+have+the+enlightening+influences+of+the+Holy+Spirit+is+the+only+right+basis%2C+and+will+prove+the+only+efficient+source+of+prayer+for+his+outpouring%2C+yet+it+is+to+be+remembered+that+the+desire+must+not+only+exist%2C+but+must+also+be+offered+up.%0A%0AMen+are+very+apt+to+deceive+themselves+in+regard+to+the+state+of+their+hearts%2C+and+the+character+of+their+desires+and+affections.+They+are+not+naturally+inclined+to+pray%2C+and+you+must+beware+of+being+satisfied+with+any+other+evidence+of+the+existence+and+strength+of+that+desire%2C+under+the+influence+of+which+you+profess+to+be+acting%2C+except+the+fervency+and+the+frequency+with+which+you+offer+it+up+to+God+in+prayer.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Theological+Lectures+on+Subjects+Connected+with+Natural+Theology%2C+Evidences+of+Christianity%2C+the+Canon+and+Inspiration+of+Scripture%2C+%28New+York%3A+Robert+Carter+and+Brothers%2C+1878%29%2C+Lecture+V%2C+pp+66-68.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20e177c1c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/20e177c1c2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/04/william-cunningham-on-the-importance-of-prayer-to-theological-study/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-92fe329262" data-kw="">
<blockquote><p>The prayer for the blessed resurrection of bodies is a form of charity toward the dead, through which we wish for them and ask God that their bodies may rise to eternal life on the last day. This does not contradict faith: Because it is commanded by Christ: When He instructs us to pray that the kingdom of our Father in heaven may come, He refers not only to the kingdom of grace but also to the kingdom of glory, which will not come without the resurrection of bodies. Therefore, when we pray, “Thy kingdom come,” we are also praying for the future resurrection of the dead… Because we have the promise of the resurrection of the flesh to eternal life. Whatever is promised to us and to others, even to the deceased in Christ’s faith, it is right to pray for its fulfillment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Theology</cite>, (Hanau, 1609; 1615), vol. 2, bk. 10, ‘Moral Virtues’ Latin | 15. ‘On the Prayer [voto] for the Blessed Resurrection of Bodies’, p. 1</span></figcaption>

</figure><figure class="quote" id="q-cc49d79512" data-kw="">
<blockquote><p>Furthermore, some do place before the word, “Amen,” immediately after the rehearsal of these words, “But deliver us from evil,” “For thine is the kingdom, and the power, and the glory, for ever. Amen.” But Erasmus Roterod., in his annotations upon the new Testament, witnesseth, that those words are not found in any old Latin copy; but are found added in all Greek copies, howbeit not expounded of any of the interpreters, but of Chrysostom only and his follower Theophylact; and that therefore they seemed unto him to be added unto the Lord’s Prayer, as some have added these unto the Psalms: “Glory be to the Father, to the Son,” &amp;c. The same Erasmus immediately adjouneth: “Wherefore there is no cause why Laurentius Valla should stomach the matter, that a good part of the Lord’s Prayer was curtailed. Their rashness was rather to be reproved, who feared not to so heavenly a prayer to patch their own toys. For I may call them toys, in comparison of that which God hath taught whatsoever hath proceeded from men; especially if that which men have added and put to, be compared with Christ the author of the prayer.”

Neither did Erasmus only doubt of this addition; for the Spanish copy, which they call Codex Complutensis, hath: “That it seemeth more credible, that these words are not a part of the Lord’s prayer, as a member of the whole; but put in through the fault of some certain writers, or printer.” In the same book is by and bye added: “And albeit St Chrysostom in his Commentaries upon Matt., Homil. xx., do expound these words, as if they were of the text; yet it is conjectured to be more true, that even in his time the first originals in his treatise were corrupted: whereupon none of the Latins, no, not of the ancient interpreters or entreaters thereof, is read to have made any mention of these words.” And surely this is truly said. For the most diligent interpreters, which have taken in hand each of them word for word to expound the Lord’s Prayer, as were St Cyprian, Hierome, and Augustine, of this addition have not spoken so much as one word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 219-20.</span></figcaption>

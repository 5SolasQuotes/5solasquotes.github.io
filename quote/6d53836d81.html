<main class="wrap"><figure class="quote" id="q-6d53836d81" data-kw="">
<blockquote><p>Positive attributes are such which so ascribe some perfection to God, as not inferring any respect unto the creature’s existing or in present being; by these, our understanding is helped in our meditation of God by way of eminency. The more principal of them are in number six: 1. Holiness. 2. Wisdom. 3. Will. 4. Liberty. 5. Omnipotency. 6. Perfection. To which, or some of which, the rest of like nature may conveniently be referred. … God comprehending his own essence, sees all things, because all possibilities, futuritions and beings, that is, all things that might have been, shall be or actually be, are eminently contained in the divine essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 16</span></figcaption>

<blockquote><p>§VIII. The external means are the Word (James 1:18, “Of his own will begat he us with the word of truth.” v. 21, “receive with meekness the engrafted word, which is able to save your souls.” 1 Pet. 1:23, “Being born again… by the word of God, which liveth.” Lk. 8:15; Gal. 3:2) and the sacraments (Jn. 3:5; Tit. 3:5; Gal. 3:27; Rom. 6:4; Lk. 22:20). The internal is faith (Gal. 5:6), hence in Acts 15:9, hearts are said to be purified by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sanctification’ trans. AI (Frankfurt: Zeitler, 1709), p. 3 Holtzfus (1659-1717) was a German, reformed professor of philosophy and theology at Frankfurt.</cite></span></figcaption>

</figure><figure class="quote" id="q-cc531a15f1" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-washer.html">Paul Washer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post on X (@paulwasher)</cite>, Oct 25, 2023</span></figcaption>

</figure><figure class="quote" id="q-b032c34f43" data-kw="">
<blockquote><p>Since, however, it [concupiscence] is diffused through all the parts of our soul, not even the will can be excepted from being infected by it. Since, however, its movements tickle, allure, and entice, this cannot happen without some will, which happens with delight. One and the same man in us is both old and new, in different respects. From this it comes that an inordinate movement is both voluntary and involuntary. Voluntary in that the will of the remaining old man inclines to it; involuntary, in that the new man resists. Although it is one and the same will, since however there are in it two qualities fighting against each other, as long as the Spirit and the flesh remain in us, it is not surprising if concerning one and the same object there is both willing and not willing. When, therefore, a regenerate person does the evil that he does not want [Rom. 7], it is not to be understood that he in no way wants it, but insofar as he is regenerate. Therefore, even the first movements are sins, because they proceed from the corruption of our will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’</cite>, p. 13 trans. AI</span></figcaption>

ill." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…Which comes to pass thus: 1. By habitual grace infused, the sanctified will is constantly determined to embrace all spiritual good. 2. By assisting grace the will is stirred up, provoked, allured and inclined to obedience, through the proposal of the promises and the heavenly suggestions of the Holy Spirit. 3. By the same assisting grace all contrary motions of concupiscence are subdued and kept under. So that nothing can hinder obedience to follow; because by grace the will is made willing to obey and by grace all impediments in obeying are taken away: now when all lets are removed, what can let a willing mind to do that which it desires?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627)</cite>, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

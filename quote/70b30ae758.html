<main class="wrap"><figure class="quote" id="q-70b30ae758" data-kw="">
<blockquote><p>But who can endure the day of His coming? And who can stand when He appears? For He is like a refiner’s fire and like launderers’ soap. (Malachi 3:2)

Preaching on the above text before the House of Lords, George Gillespie instructed his hearers that references to the coming of Christ do not always refer to the incarnation or to the Lord’s visible return. Instead, when the Bible refers to the coming of Christ, it is often talking about the advance of his kingdom prior to his second coming:

We look for a more glorious coming of Jesus Christ before the end; for the Redeemer shall come to Zion (Isa. 59:20), and shall turn away ungodliness from Jacob (Rom. 11:26) and he shall destroy Antichrist with the brightness of his coming (2 Thess. 2:8); in which place the apostle has respect to Isaiah 11:4, where it is said of Christ, the rod of Jesse, with the breath of his lips shall he slay the wicked. There, withal, you have the church’s tranquillity, the filling of the earth with the knowledge of the Lord, and the restoring of the dispersed Jews …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached before the Right Honourable the House of Lords in the Abbey Church at Westminster, August 27, 1645. The Day Appointed for Solemn and Public Humiliation in Chris Coldwell (ed.), Sermons Preached before the English Houses of Parliament by the Scottish Commissioners to the</cite></span></figcaption>

</figure><figure class="quote" id="q-8de93cabef" data-kw="">
<blockquote><p>Whether will these [Separatist] men allow one Christian to sing a psalm alone by himself, methinks the texts and examples mentioned, together with Jam. 5:13… are so plain as no rational man can deny it; But if one may, then the Church may. There is no act of worship which any member of the Church is bound to perform, but the Church is bound to perform; but on the contrary it is not true that what worship the Church does perform, a member of Church can, or may; For instance for the first part, meditation needs no organ of the body, and therefore I leave that. But does a member of the Church pray, so does the whole Church: does he read the Scriptures? so they are read in the Church; does he fast and pray? so does the Church; does he sing a psalm? so does the Church; But it is not true on the contrary, as appears in the sacraments, preaching, discipline, etc.</p></blockquote>

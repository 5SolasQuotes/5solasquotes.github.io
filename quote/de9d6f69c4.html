<main class="wrap"><figure class="quote" id="q-de9d6f69c4" data-kw="">
<blockquote><p>A weak Christian is one who cannot bear reproof. Sharp weather discovers whether you are of a weak or sound body. So a sharp reproof will discover whether you are of a weak spiritual temper and constitution. When Nathan came to David, he could bear the reproof though the prophet told him to his face that he was the man who had sinned. Asa, though a good man, could not endure the faithful reproof of a prophet, but was wroth with the seer and put him in the prison house.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: The Truth, Growth, and Different Degrees</cite>, ed. Don Kistler (1652; Morgan PA: Soli Deo Gloria, 1997), p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a7bfa6eef" data-kw="">
<blockquote><p>In reality there are two, and only two, foundations of law; and they are both of them conditions without which nothing can give it any force; I mean equity and utility. With respect to the former, it grows out of the great rule of equality, which is grounded upon our common nature, and which Philo, with propriety and beauty, calls the mother of justice. All human laws are, properly speaking, only declaratory; they may alter the mode and application, but have no power over the substance of original justice. The other foundation of law, which is utility, connected in the same manner with, and derived directly from, our rational nature; for any other utility may be the utility of a robber, but cannot be that of a citizen; the interest of the domestic enemy, and not that of a member of the commonwealth. This present equality can never be the foundation of statues which create an artificial difference between men, as the laws before us [under consideration in his time] do, in order to induce a consequential inequality in the distribution of justice. Law is a mode of human action respecting society, and must be governed by the same rules of equity which govern every private action; and so Tully [Cicero?] considers it in his Offices as the only utility [being a utility to all commonly] agreeable to that [common] nature…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works &amp; Correspondence of the Right Honourable Edmund Burke. A New Edition</cite>, vol. 6 (d. 1797; London, 1852), p. 17. See also the larger context from pp. 14-18, which includes helpful Latin quotes from Suarez. Burke is opposing certain laws contrary to Romanists in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-c3eaebbd60" data-kw="">
<blockquote><p>The magistrates look to peace and civil order; tis well done; and tis their duty, yet not the principal, and they do commonly fail in this, that they use not the sword for this end, to urge men to the keeping of the commandments of the First Table, to a practice of pure religion and to the keeping of the Sabbath day. This is the main duty of the magistrate, who bears the sword especially for the good of men’s souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Callings in Works</cite>, vol. 1, p. 764</span></figcaption>

</figure><figure class="quote" id="q-4374921f3f" data-kw="">
<blockquote><p>The conception of Christ by the Holy Spirit is the formation of the human nature of Christ out of the sanctified flesh and blood of the virgin Mary by the miraculous operation of the Holy Spirit, Mt. 1:18,20; Lk. 1:31,35. The assumption of the human nature is that by which the Logos deemed it worthy to assume the formed and sanctified nature by the Holy Spirit through that economic grace, Heb. 2:16.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0db55133c7" data-kw="">
<blockquote><p>The will of God is God by one simple act, absolutely willing the being of whatsoever He pleases. That distinction of the absolute and conditional will, as also that of the antecedent and consequent will of God, are both unsound. God wills it to be a truth that whosoever believes shall be saved: He likewise wills it to be the duty of Judas to believe: Hence follows (in case) a will of approbation concerning things in their own nature possible, which yet never shall be: as namely, the acceptation of the obedience of the reprobates; but it does not follow that God has conditionally willed the acceptation of the obedience of the reprobates. God decrees the coexistence of two extremes conditionally cohering, as the faith and salvation of Judas, the sight of such miracles and repentance in the Tyrians: the being of which extremes themselves He has not decreed. Though the things willed be conditioned, yet the volition or willing of God concerning those things is absolute. The authors and approvers of the second distinction, understand by the antecedent will of God (John Damascene, Of the Orthodox Faith, bk. 2, ch. 29), his will concerning the creature looking at it as in itself, without any consideration of after-circumstances: so they say God wills all men, even the reprobate to be saved: this they call his first will, and it is, say they, uncertain. By the consequent will of God, they understand his will concerning the creature looked at, not only as in itself, but together with after-adjuncts and circumstances, as sin, etc. This they call his second will, and it is, say they, certain. As a judge looking upon such a person as in himself, accounts it best that he should live; but looking upon him in second respects, as a murderer, etc. he accounts it best that he should die. The vanity of both these distinctions appears in that they are repugnant to the simplicity, perfection and independence of the first cause. The will of God in the decree, and the revealing of part thereof in the command, do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 17-18</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f9facaff9" data-kw="">
<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>

<blockquote><p>‘But for this cause came I to this hour.’ Here is the fifth article in this prayer: a sort of correction, in which Christ does resign his will, as man, to the will of God; as Mt. 26:39; Lk. 22:42. ‘Nevertheless, not my will, but thine be done.’ In this there is offered to us a question, Whether or no there be in this prayer any repugnancy in the human will of Christ to the will of God? For: 1. A correction of the human will seems to import a jarring and a discord; 2. Christ desired that, the contrary whereof He knew was from eternity decreed of God. 3. The Law of God is so spiritual, straight and holy that it requires not only a conformity to it, and our will, actions, words and purposes, but also in all our affections, desires, first-motions and inclinations of our heart, that no unperfect and half-formed lustings arise in us even before the complete consent of the will that may thwart or cross the known Law and command of God; and by this, ‘Thou shalt not lust,’ Rom. 7, and the duty of the highest love we owe to God, to love him with all the heart, soul, mind, and whole strength, Mt. 22:37; Mk. 12:33; Lk. 10:27. Some Arians and Arminians, John Geysteranus at the Synod of Dort, have said blasphemously that there was concupiscence and a will repugnant to God’s will in the second Adam, as in the first. But this they spoke against the consubstantiality and deity of the Son of God. To which we say: Assertion 1. Jesus Christ that holy thing, Lk. 1:35, was a fit high priest, holy, harmless, undefiled, separated from sinners, Heb. 7:26. Which of you (says Christ to the Jews) convinces me of sin, Jn. 8:46. There could not be a spot in this Lamb sacrificed for the sins of the world, no prick in this Rose, no cloud in this fair Sun, no blemish in this beautiful Well-beloved. Assertion 2. An absolute, resolved will or desire of heart to lust after that which God forbids in his Law must be a sinful jarring between the creature’s and the Creator’s will. Now, Christ‘s will was conditional and clearly submissive; it lay ever level with his Father’s holy will. Assertion 3. I shall not with some affirm that which in the general is true, a will contrary to God’s revealed command and will, called voluntas signi, which is our moral rule to oblige us, is a sin [see Assertion 4 below]; but a will contrary to God’s decree, called voluntas beneplaciti, which is not our rule obliging, except the Lord be pleased to impose it on us as a moral Law, is not a sin. Peter and the apostles, after they heard that prophecy of their denying of Christ and their being sinfully scandalized, and their forsaking of Christ when the Shepherd was smitten, were obliged to have a will contrary to that decree and to pray that they might not be led into temptation, but might have grace to confess their Savior before men and not flee, nor be scattered: Here is a resolute will of men lawfully contrary to the revealed decree of God, yet not sinful. But the Lord’s will that Christ should die for man, as it was a decree of the wise and most gracious Lord pitying lost man, so was it also a revealed commandment to Christ, that He should be willing to die and be obedient to the death, even the death of the cross, Phil. 2:8; yea, a rule of such humble obedience as we are obliged to follow, as is said, verse 5, ‘Let this mind be in you, which was also in Christ Jesus,’ etc. If the Lord’s will that Christ should die be nothing but his mere decree, it could not oblige us in the like case to be willing, as John says to lay down our life for the brethren. Yea, Jn. 10:18, Christ has a commandment of God and the revealed will of God to die for us: ‘No man takes it from Me, but I lay it down of myself: I have power to lay it down; I have power to take it again: this commandment have I received of my Father.’ Here is an express commandment given to Christ to die for sinners; and the Father loves Christ for obedience to this commandment. Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations. 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment, for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son, if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did God’s precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination natural in a father to preserve the life of the child.’ So the positive command of the Father that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die. 2. A martyr dying for the truth of Christ may have a natural and conditional desire and inclination to live, though his living be contrary to the Lord’s revealed will commanding him to seal the Gospel with his blood and to confess Christ before men. 3. If the brother, son, daughter, wife or friend that is as a man’s own soul, Dt. 13:6, blaspheme God, yea if father or mother do it, Dt. 33:8-9, yet is a father obliged to stone the son or daughter, the son being a magistrate or a Levite and priest, to judge according to law (the priests’ lips should preserve knowledge, Mal. 2:8) that his father or mother ought to be stoned to death; yet ought not father or son to lay aside that natural desire of being and life to son, father, brother which the law of nature in the Fifth Command does require, especially the desire being conditional, with submission to God’s will, as the desire of Christ is here; and the command to stone the blasphemer, that the father stone the son, the son the father, being positive, and though founded on the law of nature, that a man prefer his Lord Creator and God before son or father and mother, yet are they not precepts of the law of nature such as is the precept of nature that a man desire his own life and being, the father the life and being of the son. Assertion 5. The apparent opposition (for it is not real) is rather between Christ‘s sensitive and his sinless mere natural desire and affection, and his reasonable will, than his [human] will and the will of God: Nor can any say there is a fight or jarring between the conditional desire of Christ subjected in the same act of praying, to the Lord’s decree and the resolute and immutable will of God. The Law of God, because holy and spiritual, does require a conformity between all the inclinations and motions of our soul and the law of nature; but an absolute conformity between all our inclinations and every positive command of God, such as was the Lord’s command that Christ should die for sinners, is not required in the Law of God. If Adam submit his natural hunger or desire to eat of the forbidden tree, to God’s Law, and eat not, there is no sinful jarring between his will and God’s positive Law, ‘Thou shalt not eat of the tree of Knowledge of good and evil.’</p></blockquote>

ure’s and the Creator’s will. Now, Christ‘s will was conditional and clearly submissive; it lay ever level with his Father’s holy will. Assertion 3. I shall not with some affirm that which in the general is true, a will contrary to God’s revealed command and will, called voluntas signi, which is our moral rule to oblige us, is a sin [see Assertion 4 below]; but a will contrary to God’s decree, called voluntas beneplaciti, which is not our rule obliging, except the Lord be pleased to impose it on us as a moral Law, is not a sin. Peter and the apostles, after they heard that prophecy of their denying of Christ and their being sinfully scandalized, and their forsaking of Christ when the Shepherd was smitten, were obliged to have a will contrary to that decree and to pray that they might not be led into temptation, but might have grace to confess their Savior before men and not flee, nor be scattered: Here is a resolute will of men lawfully contrary to the revealed decree of God, yet not sinful. But the Lord’s will that Christ should die for man, as it was a decree of the wise and most gracious Lord pitying lost man, so was it also a revealed commandment to Christ, that He should be willing to die and be obedient to the death, even the death of the cross, Phil. 2:8; yea, a rule of such humble obedience as we are obliged to follow, as is said, verse 5, ‘Let this mind be in you, which was also in Christ Jesus,’ etc. If the Lord’s will that Christ should die be nothing but his mere decree, it could not oblige us in the like case to be willing, as John says to lay down our life for the brethren. Yea, Jn. 10:18, Christ has a commandment of God and the revealed will of God to die for us: ‘No man takes it from Me, but I lay it down of myself: I have power to lay it down; I have power to take it again: this commandment have I received of my Father.’ Here is an express commandment given to Christ to die for sinners; and the Father loves Christ for obedience to this commandment. — Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself (London: 1647), pp. 138-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98But+for+this+cause+came+I+to+this+hour.%E2%80%99+Here+is+the+fifth+article+in+this+prayer%3A+a+sort+of+correction%2C+in+which+Christ+does+resign+his+will%2C+as+man%2C+to+the+will+of+God%3B+as+Mt.+26%3A39%3B+Lk.+22%3A42.+%E2%80%98Nevertheless%2C+not+my+will%2C+but+thine+be+done.%E2%80%99+In+this+there+is+offered+to+us+a+question%2C+Whether+or+no+there+be+in+this+prayer+any+repugnancy+in+the+human+will+of+Christ+to+the+will+of+God%3F+For%3A+1.+A+correction+of+the+human+will+seems+to+import+a+jarring+and+a+discord%3B+2.+Christ+desired+that%2C+the+contrary+whereof+He+knew+was+from+eternity+decreed+of+God.+3.+The+Law+of+God+is+so+spiritual%2C+straight+and+holy+that+it+requires+not+only+a+conformity+to+it%2C+and+our+will%2C+actions%2C+words+and+purposes%2C+but+also+in+all+our+affections%2C+desires%2C+first-motions+and+inclinations+of+our+heart%2C+that+no+unperfect+and+half-formed+lustings+arise+in+us+even+before+the+complete+consent+of+the+will+that+may+thwart+or+cross+the+known+Law+and+command+of+God%3B+and+by+this%2C+%E2%80%98Thou+shalt+not+lust%2C%E2%80%99+Rom.+7%2C+and+the+duty+of+the+highest+love+we+owe+to+God%2C+to+love+him+with+all+the+heart%2C+soul%2C+mind%2C+and+whole+strength%2C+Mt.+22%3A37%3B+Mk.+12%3A33%3B+Lk.+10%3A27.+Some+Arians+and+Arminians%2C+John+Geysteranus+at+the+Synod+of+Dort%2C+have+said+blasphemously+that+there+was+concupiscence+and+a+will+repugnant+to+God%E2%80%99s+will+in+the+second+Adam%2C+as+in+the+first.+But+this+they+spoke+against+the+consubstantiality+and+deity+of+the+Son+of+God.+To+which+we+say%3A+Assertion+1.+Jesus+Christ+that+holy+thing%2C+Lk.+1%3A35%2C+was+a+fit+high+priest%2C+holy%2C+harmless%2C+undefiled%2C+separated+from+sinners%2C+Heb.+7%3A26.+Which+of+you+%28says+Christ+to+the+Jews%29+convinces+me+of+sin%2C+Jn.+8%3A46.+There+could+not+be+a+spot+in+this+Lamb+sacrificed+for+the+sins+of+the+world%2C+no+prick+in+this+Rose%2C+no+cloud+in+this+fair+Sun%2C+no+blemish+in+this+beautiful+Well-beloved.+Assertion+2.+An+absolute%2C+resolved+will+or+desire+of+heart+to+lust+after+that+which+God+forbids+in+his+Law+must+be+a+sinful+jarring+between+the+creature%E2%80%99s+and+the+Creator%E2%80%99s+will.+Now%2C+Christ%E2%80%98s+will+was+conditional+and+clearly+submissive%3B+it+lay+ever+level+with+his+Father%E2%80%99s+holy+will.+Assertion+3.+I+shall+not+with+some+affirm+that+which+in+the+general+is+true%2C+a+will+contrary+to+God%E2%80%99s+revealed+command+and+will%2C+called+voluntas+signi%2C+which+is+our+moral+rule+to+oblige+us%2C+is+a+sin+%5Bsee+Assertion+4+below%5D%3B+but+a+will+contrary+to+God%E2%80%99s+decree%2C+called+voluntas+beneplaciti%2C+which+is+not+our+rule+obliging%2C+except+the+Lord+be+pleased+to+impose+it+on+us+as+a+moral+Law%2C+is+not+a+sin.+Peter+and+the+apostles%2C+after+they+heard+that+prophecy+of+their+denying+of+Christ+and+their+being+sinfully+scandalized%2C+and+their+forsaking+of+Christ+when+the+Shepherd+was+smitten%2C+were+obliged+to+have+a+will+contrary+to+that+decree+and+to+pray+that+they+might+not+be+led+into+temptation%2C+but+might+have+grace+to+confess+their+Savior+before+men+and+not+flee%2C+nor+be+scattered%3A+Here+is+a+resolute+will+of+men+lawfully+contrary+to+the+revealed+decree+of+God%2C+yet+not+sinful.+But+the+Lord%E2%80%99s+will+that+Christ+should+die+for+man%2C+as+it+was+a+decree+of+the+wise+and+most+gracious+Lord+pitying+lost+man%2C+so+was+it+also+a+revealed+commandment+to+Christ%2C+that+He+should+be+willing+to+die+and+be+obedient+to+the+death%2C+even+the+death+of+the+cross%2C+Phil.+2%3A8%3B+yea%2C+a+rule+of+such+humble+obedience+as+we+are+obliged+to+follow%2C+as+is+said%2C+verse+5%2C+%E2%80%98Let+this+mind+be+in+you%2C+which+was+also+in+Christ+Jesus%2C%E2%80%99+etc.+If+the+Lord%E2%80%99s+will+that+Christ+should+die+be+nothing+but+his+mere+decree%2C+it+could+not+oblige+us+in+the+like+case+to+be+willing%2C+as+John+says+to+lay+down+our+life+for+the+brethren.+Yea%2C+Jn.+10%3A18%2C+Christ+has+a+commandment+of+God+and+the+revealed+will+of+God+to+die+for+us%3A+%E2%80%98No+man+takes+it+from+Me%2C+but+I+lay+it+down+of+myself%3A+I+have+power+to+lay+it+down%3B+I+have+power+to+take+it+again%3A+this+commandment+have+I+received+of+my+Father.%E2%80%99+Here+is+an+express+commandment+given+to+Christ+to+die+for+sinners%3B+and+the+Father+loves+Christ+for+obedience+to+this+commandment.+Assertion+4.+A+conditional+and+a+submissive+desire%2C+though+not+agreeable+to+a+positive+law+and+commandment+of+God%2C+is+no+sin%2C+nor+does+the+Law+require+a+conformity+in+all+our+inclinations+and+the+first+motions+of+our+desires+to+every+command+of+God%2C+though+most+contrary+to+nature+and+our+natural+and+sinless+inclinations.+1.+If+God+command+Abraham+to+kill+his+only+begotten+son+and+offer+him+in+a+sacrifice+to+God%2C+which+was+a+mere+positive+commandment%2C+for+it%E2%80%99s+not+a+command+of+the+law+of+nature+%28nor+any+other+than+positive%29+for+the+father+to+kill+the+son%2C+if+yet+Abraham+retain+a+natural+inclination+and+love+commanded+also+in+the+law+of+nature+to+save+his+son%E2%80%99s+life+and+to+desire+that+he+may+live%2C+this+desire+and+inclination%2C+though+contradictory+to+a+positive+command+of+God%2C+is+no+sin%3B+because+the+Fifth+Command%2C+grounded+on+the+law+of+nature%2C+does+command+it.+Nor+did+God%E2%80%99s+precept+%28%E2%80%98Abraham%2C+kill+now+thy+son%2C+even+Isaac+thine+only+begotten+son%E2%80%99%29+ever+include+this%2C+%E2%80%98Abraham%2C+root+out+of+thine+heart+all+desire+and+inclination+natural+in+a+father+to+preserve+the+life+of+the+child.%E2%80%99+So+the+positive+command+of+the+Father+that+the+Son+of+God+should+lay+down+his+life+for+his+sheep%2C+did+never+root+out+of+the+sinless+nature+of+the+man-Christ+a+natural+desire+to+preserve+his+own+being+and+life%2C+especially+He+desiring+it+with+special+reservation+of+the+will+of+God+commanding+that+He+should+die.+2.+A+martyr+dying+for+the+truth+of+Christ+may+have+a+natural+and+conditional+desire+and+inclination+to+live%2C+though+his+living+be+contrary+to+the+Lord%E2%80%99s+revealed+will+commanding+him+to+seal+the+Gospel+with+his+blood+and+to+confess+Christ+before+men.+3.+If+the+brother%2C+son%2C+daughter%2C+wife+or+friend+that+is+as+a+man%E2%80%99s+own+soul%2C+Dt.+13%3A6%2C+blaspheme+God%2C+yea+if+father+or+mother+do+it%2C+Dt.+33%3A8-9%2C+yet+is+a+father+obliged+to+stone+the+son+or+daughter%2C+the+son+being+a+magistrate+or+a+Levite+and+priest%2C+to+judge+according+to+law+%28the+priests%E2%80%99+lips+should+preserve+knowledge%2C+Mal.+2%3A8%29+that+his+father+or+mother+ought+to+be+stoned+to+death%3B+yet+ought+not+father+or+son+to+lay+aside+that+natural+desire+of+being+and+life+to+son%2C+father%2C+brother+which+the+law+of+nature+in+the+Fifth+Command+does+require%2C+especially+the+desire+being+conditional%2C+with+submission+to+God%E2%80%99s+will%2C+as+the+desire+of+Christ+is+here%3B+and+the+command+to+stone+the+blasphemer%2C+that+the+father+stone+the+son%2C+the+son+the+father%2C+being+positive%2C+and+though+founded+on+the+law+of+nature%2C+that+a+man+prefer+his+Lord+Creator+and+God+before+son+or+father+and+mother%2C+yet+are+they+not+precepts+of+the+law+of+nature+such+as+is+the+precept+of+nature+that+a+man+desire+his+own+life+and+being%2C+the+father+the+life+and+being+of+the+son.+Assertion+5.+The+apparent+opposition+%28for+it+is+not+real%29+is+rather+between+Christ%E2%80%98s+sensitive+and+his+sinless+mere+natural+desire+and+affection%2C+and+his+reasonable+will%2C+than+his+%5Bhuman%5D+will+and+the+will+of+God%3A+Nor+can+any+say+there+is+a+fight+or+jarring+between+the+conditional+desire+of+Christ+subjected+in+the+same+act+of+praying%2C+to+the+Lord%E2%80%99s+decree+and+the+resolute+and+immutable+will+of+God.+The+Law+of+God%2C+because+holy+and+spiritual%2C+does+require+a+conformity+between+all+the+inclinations+and+motions+of+our+soul+and+the+law+of+nature%3B+but+an+absolute+conformity+between+all+our+inclinations+and+every+positive+command+of+God%2C+such+as+was+the+Lord%E2%80%99s+command+that+Christ+should+die+for+sinners%2C+is+not+required+in+the+Law+of+God.+If+Adam+submit+his+natural+hunger+or+desire+to+eat+of+the+forbidden+tree%2C+to+God%E2%80%99s+Law%2C+and+eat+not%2C+there+is+no+sinful+jarring+between+his+will+and+God%E2%80%99s+positive+Law%2C+%E2%80%98Thou+shalt+not+eat+of+the+tree+of+Knowledge+of+good+and+evil.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+138-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfce7c195b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cfce7c195b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=%E2%80%98But%20for%20this%20cause%20came%20I,of%20Knowledge%20of%20good%20and%20evil.%E2%80%99" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-d7af93fa52" data-kw="">
<blockquote><p>Repentance [poenitentia] is true or false, internal or external, major or minor, preceeding or following faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctions through Universal Theology, taken out of the Canon of the Sacred Letters &amp; Classical Theologians (Frankfurt: 1626), ch. 21, ‘Repentance’</cite>, p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“Repentance [poenitentia] is true or false, internal or external, major or minor, preceeding or following faith.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ccc85ca8f2" data-kw="">
<blockquote><p>Now consider we in the next place what manner of preaching our Savior Christ’s was, that collating the Gospel by this man [the Antinomian Saltmarsh] described, with the Gospel that Christ preached, we may see how well they sort and suit the one with the other. ‘I came,’ says our Savior, ‘to call sinners to repentance’ (Mt 3:13): and, ‘Unlesse ye repent, ye shall all perish,’ (Lk. 13:3, 5) and, ‘Verily, I say unto you, Unless ye be converted and become like children, ye shall not enter into the Kingdom of Heaven,’ (Mt. 18:3) and, ‘If a man will come after Me, let him deny himself, and take up his cross and follow Me.’ (Mt. 16:23) And, ‘If any man come to Me, and hate not his father and mother, and wife and children, and brethren and sisters, yea, and his own life also, he cannot be my disciple.’ (Lk. 14:26) And, ‘Whosoever he be of you that forsakes not all that he hath, he cannot be my disciple.’ (Lk. 14:33) Here is no such short work as Mr. Saltmarsh makes of it. Here are conditions, you see, required; and those not of faith alone, but of repentance and humiliation, and self-denial, and conversion, and renouncing of all, in disposition and purpose at least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), pp. 9-10 Note, according to Westminster, “purposing and endeavoring to walk with him in all the ways of his commandments” is part of the definition of repentance; WCF 15.2.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now consider we in the next place what manner of preaching our Savior Christ’s was, that collating the Gospel by this man [the Antinomian Saltmarsh] described, with the Gospel that Christ preached, we may see how well they sort and suit the one with the other. ‘I came,’ says our Savior, ‘to call sinners to repentance’ (Mt 3:13): and, ‘Unlesse ye repent, ye shall all perish,’ (Lk. 13:3, 5) and, ‘Verily, I say unto you, Unless ye be converted and become like children, ye shall not enter into the Kingdom of Heaven,’ (Mt. 18:3) and, ‘If a man will come after Me, let him deny himself, and take up his cross and follow Me.’ (Mt. 16:23) And, ‘If any man come to Me, and hate not his father and mother, and wife and children, and brethren and sisters, yea, and his own life also, he cannot be my disciple.’ (Lk. 14:26) And, ‘Whosoever he be of you that forsakes not all that he hath, he cannot be my disciple.’ (Lk. 14:33) Here is no such short work as Mr. Saltmarsh makes of it. Here are conditions, you see, required; and those not of faith alone, but of repentance and humiliation, and self-denial, and conversion, and renouncing of all, in disposition and purpose at least.”

— Thomas Gataker, A Mistake or Misconstruction Removed (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), pp. 9-10 Note, according to Westminster, “purposing and endeavoring to walk with him in all the ways of his commandments” is part of the definition of repentance; WCF 15.2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+consider+we+in+the+next+place+what+manner+of+preaching+our+Savior+Christ%E2%80%99s+was%2C+that+collating+the+Gospel+by+this+man+%5Bthe+Antinomian+Saltmarsh%5D+described%2C+with+the+Gospel+that+Christ+preached%2C+we+may+see+how+well+they+sort+and+suit+the+one+with+the+other.+%E2%80%98I+came%2C%E2%80%99+says+our+Savior%2C+%E2%80%98to+call+sinners+to+repentance%E2%80%99+%28Mt+3%3A13%29%3A+and%2C+%E2%80%98Unlesse+ye+repent%2C+ye+shall+all+perish%2C%E2%80%99+%28Lk.+13%3A3%2C+5%29+and%2C+%E2%80%98Verily%2C+I+say+unto+you%2C+Unless+ye+be+converted+and+become+like+children%2C+ye+shall+not+enter+into+the+Kingdom+of+Heaven%2C%E2%80%99+%28Mt.+18%3A3%29+and%2C+%E2%80%98If+a+man+will+come+after+Me%2C+let+him+deny+himself%2C+and+take+up+his+cross+and+follow+Me.%E2%80%99+%28Mt.+16%3A23%29+And%2C+%E2%80%98If+any+man+come+to+Me%2C+and+hate+not+his+father+and+mother%2C+and+wife+and+children%2C+and+brethren+and+sisters%2C+yea%2C+and+his+own+life+also%2C+he+cannot+be+my+disciple.%E2%80%99+%28Lk.+14%3A26%29+And%2C+%E2%80%98Whosoever+he+be+of+you+that+forsakes+not+all+that+he+hath%2C+he+cannot+be+my+disciple.%E2%80%99+%28Lk.+14%3A33%29+Here+is+no+such+short+work+as+Mr.+Saltmarsh+makes+of+it.+Here+are+conditions%2C+you+see%2C+required%3B+and+those+not+of+faith+alone%2C+but+of+repentance+and+humiliation%2C+and+self-denial%2C+and+conversion%2C+and+renouncing+of+all%2C+in+disposition+and+purpose+at+least.%E2%80%9D%0A%0A%E2%80%94+Thomas+Gataker%2C+A+Mistake+or+Misconstruction+Removed+%28Whereby+little+difference+is+pretended+to+have+been+acknowledged+between+the+Antinomians+%26+us%29%E2%80%A6+%28London%3A+Clifton%2C+1646%29%2C+pp.+9-10+Note%2C+according+to+Westminster%2C+%E2%80%9Cpurposing+and+endeavoring+to+walk+with+him+in+all+the+ways+of+his+commandments%E2%80%9D+is+part+of+the+definition+of+repentance%3B+WCF+15.2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fccc85ca8f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ccc85ca8f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=Now%20consider%20we%20in%20the%20next,in%20disposition%20and%20purpose%20at%20least." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-230ec2e3a4" data-kw="">
<blockquote><p>Wherefore the Gospel dispossesses all unbelievers of Christ’s benefits, not only by a flat exclusion, but also by positive virtue of that condition of faith and repentance, by which He promises expressly or covertly his benefits unto men, and which it appears is never found in the reprobate, that is, such as do persist, and will still persist in their impiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-ursinus.html">Zachary Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Certain Learned Discourses... (d. 1583; Oxford, 1600), ‘A Preface of an Oration… To whom the Benefit of the Death and Resurrection of Chrsit Appertains…’</cite>, p. 134</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-83d9d40e9b" data-kw="">
<blockquote><p>They did not hold that faith was the only thing which invariably accompanies justification, or even that it was the only thing required of men in order to their being justified; for they admitted that repentance was necessary to forgiveness, in accordance with the doctrine of our [Westminster] standards, that, ‘to escape the wrath and curse of God due to us for sin, God requireth of us repentance unto life,’ [WSC #85] as well as ‘faith in Jesus Christ.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology (Edinburgh: T&amp;T Clark, 1863), vol. 2, ch. 21, ‘Justification’, section 1, ‘Popish &amp; Protestant Views’</cite>, p. 22</span></figcaption>

</figure><figure class="quote" id="q-36b7092420" data-kw="">
<blockquote><p>The gospel does not promise salvation on condition of good works as causes effecting it, but on condition of faith and repentance: the one as an instrument of accepting remission of sins the other as a causa sine qua non [casue without which: nothing]: nor on condition of such repentance or new obedience as is perfect, but such as is by grace begun.</p></blockquote>

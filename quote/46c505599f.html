<blockquote><p>It is the gospel that also discloses to sinners the covenant of grace into which the Father and the Son as last Adam, with the infinite approbation of the Holy Spirit, have entered for the salvation of such sinners as believe. Sinful men cannot be otherwise saved than by being enabled to take hold of that everlasting covenant by faith as to come into the bond of it. This, however, they cannot do unless they are made so to know it as to discern spiritually the reality, glory, and suitableness of it to their miserable condition as lost sinners. But it is the gospel only, coming to them “in demonstration of the Spirit and of power” (1 Cor. 2:4), that reveals this gracious covenant to them and shows them how they may be so instated in it as to possess and enjoy the blessings of salvation. They could never, according to the plan established in the counsel of peace, have known that eternal contract but by the revelation of it in the everlasting gospel. It is by the gospel, accompanied with the illuminating influences of His Holy Spirit, that the Lord Jesus, the messenger of the covenant, shows elect sinners His covenant (Ps. 25:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 108.</span></figcaption>

<blockquote><p>1. That there is such a covenant of which they speak which was entered between God and Christ containing the transactions which pass between the Father and the Son. The tenor of which covenant we find laid down by the prophet Isaiah 53:10 ff., and commented upon by the apostle, Phil. 2:6. There we see first the work that Christ by covenant was to undergo: to make his soul an offering for sin. That is, as elsewhere is expressed, to give His life a ransom for many, and as He covenanted, so He did, “He became obedient to death, even the death of the cross” (Phil. 2:8). And that upon account of this covenant entered, Christ Himself speaking to it and of His work in it, says, “This commandment have I received of my Father” (John 10:18). 2. The reward that He was to receive which is laid down by the prophet in many words. A. “He shall see his seed” (Isa. 53:10). As Isaac being received from the dead in figure saw a seed, had an innumerable posterity, so the Lord Christ who was received from the dead in truth has His seed in like manner, believers innumerable, which are called His seed in resemblance to the seed of man. B. “He shall prolong his days”, not the days of His seed, as some would have it, making this one with the former and rendering the words videbit semen long avum, being delivered from death, He shall live and reign eternally, Rev. 1:18. C. “The pleasure of the Lord shall prosper in his hand”; He shall irresistibly do whatsoever is the Father’s pleasure to be done in the work of man’s salvation. D. “He shall see the travail of his soul, and shall be satisfied”; upon this work done, He fully enjoys the whole of all his desires. E. “Therefore will I divide Him a portion with the great, and He shall divide the spoil with the strong.” He obtains a perfect victory, has a plenary and full conquest over every adversary. 3. We yield that the whole of these covenant transactions between God and Christ was on our behalf. Making His soul an offering for sin, He offers it for those that are fallen by iniquity. All is (as is there said) for the justification of many. Whatsoever it is that upon the work done redounds to Himself. Yet the reason of undertaking was for us: Unto us He was born, unto us He was given, He was wounded for our transgressions, He was bruised for our iniquities, He was delivered for our offences, and raised again for our justification. He endured the work and we reap the benefit. 4. We confess that it is the work of Christ that we enjoy being in covenant, as it is His gift that we enjoy the blessing of ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of God</cite>, … (1658; rep. Puritan Publications), ch. 4, pp. 50-51</span></figcaption>

<blockquote><p>The will is a natural property, and therefore in the divine essence it is but one. The Father, Son, and Spirit, have not distinct wills. They are one God, and God’s will is one, as being an essential property of his nature; and therefore are there two wills in the one person of Christ, whereas there is but one will in the three persons of the Trinity… …for such is the distinction of the persons in the unity of the divine essence, as that they act in natural and essential acts reciprocally one towards another—namely, in understanding, love, and the like; they know and mutually love each other. And as they subsist distinctly, so they also act distinctly in those works which are of external operation. And whereas all these acts and operations, whether reciprocal or external, are either with a will or from a freedom of will and choice, the will of God in each Person, as to the peculiar acts ascribed unto Him, is his will therein peculiarly and eminently, though not exclusively to the other persons, by reason of their mutual in-being. The will of God as to the peculiar actings of the Father in this matter is the will of the Father, and the will of God with regard unto the peculiar actings of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, … vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 87-88</span></figcaption>

<blockquote><p>11. God has made more promises, donations and covenants than one or two, which must not be confounded: 1. His Law and Covenant made to and with man in innocency is one. 2. And his Law and Covenant made to and with Christ, as Mediator, is another. 3. And his absolute promise of a Saviour to the world, with the conditional promise or Law of Grace conjunct, was the first edition of another. And the Gospel, as after the incarnation promulgated, was a more perfect edition of it (to pass by Abraham’s Covenant of Peculiarity, and the Mosaical Law, as such). 12. Though Christ be promised in one of these, and be God’s antecedent gift, He may nevertheless be the Author of another, (and so far the foundation), as well as the meritorious cause. 13. That may be of free grace which is merited by Christ; yea, and that which is annexed to the evangelical worthiness of a believer. 14. That may be a condition required of us, to be done by the help of grace, which yet is the effect of that grace, and given us by God. 15. It is a true Covenant between God the Father, Son, and Holy Ghost, and man, which is solemnly entered into in baptism: And this is a Covenant of Grace, even that proceeds purely from grace; and of grace, as given by God, and by us accepted. He that will confound these various covenants, promises, and laws, on pretense of their unity (though there is doubtless a wonderful unity of all the parts both of God’s moral (signal) means, and his physical works), shall confound much of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

<blockquote><p>First, from the nature of the suretyship of Christ. Since that sponsion is nothing else than the perfectly absolute and immutable will of Christ, of substituting himself according to the eternal counsel of the Father in the place of the elect, and of making satisfaction for their sins, it necessarily implies by that very thing a real transference of the debts to him and the full deliverance and immunity of those for whom he agreed. Thus fidejussio as distinguished from expromissio cannot have place here simply, but expromissio. For the fidejussor is appointed only to insure confidence concerning the payment (not precisely his own) so as to promise that he will pay absolutely, but that the creditor may be made sure of the payment, where the principal debtor can be supplied still for paying it or at least where he still remains obligated and can and should first be applied to before the fidejussor. But here the case is evidently different. For as the elect were not so absolutely by paying, satisfaction could never be demanded of them. Thus by the suretyship and substitution of Christ in their place, they were freed according to the counsel of God, so that the payment could no longer be demanded of them (which Christ by his agreement took upon himself).</p></blockquote>

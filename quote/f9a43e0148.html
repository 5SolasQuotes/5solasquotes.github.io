<main class="wrap"><figure class="quote" id="q-f9a43e0148" data-kw="">
<blockquote><p>Of the knowledge of Christ, there be two parts, the first concerning his person, the second concerning his office. The person of Christ, is one, because Christ is one. Of the knowledge of Christ’s person, there be two parts: the first concerning the natures in the person of Christ, the other concerning his state.

There are two natures in the person of Christ, the divine, and the human nature. Therefore Jesus Christ is true God, and true man in one person. Rom. 1.3.4. and 9.5. 1. John. 4.2. 1. Timot. 3.16. Coloss. 2.9. Heb. 2.14.16. John. 1.1.

Thus far concerning the natures in the person of Christ: now concerning his state.

The state of Christ’s person is two fold: his humiliation, or exaltation. Phil. 2.7.8.9. Luke. 24.26. The humiliation of Christ is that state of his, in which he did abase himself below all creatures. Phil. 2.7.

Of his humiliation there are two parts? his incarnation, and obedience. The incarnation of Christ, is part of the humiliation of the son of God, when taking the human nature, he was manifested in the flesh. John. 1.14. 1. Tim. 3.16. The parts of the incarnation of Christ, are both his conception by the holy spirit, and the personal union of his two natures, and also his birth. The conception of Christ by the holy spirit, is the forming of the human nature of Christ, of the flesh and blood of the virgin Mary, by the miraculous working of the holy spirit. Mat. 1.18.20. Luke. 1.31.35.

The personal union of the two natures in Christ, is such a coupling of them as they might be one person. 1. Tim. 3.16. Coloss. 2.9. Gal. 4.4. Heb. 2.16. In this personal union, both the distinction of the two natures is to be considered, and also the effects of the union. In the personal union, the natures remain distinct, and not confused, whether we respect their essence, or the properties, or operations. Rom. 1.3.4. and 9.5. 1. Tim. 9.16. Heb. 9.14. 1. Pet. 3.18. and 4.1.

As therefore in that one person of Christ there be two natures: so there is a double mind, or understanding a double will, working, wisdom, strength, power, virtue, and so forth. The one heavenly and not created: the other human, and created. Luke. 2.52. Mar. 11.13. and 13.32. 1. John. 2.1.17. John. 2.25. and 6.64. and 5.20. Heb. 1.9. John. 1.33. and 4.6. Heb. 1.3. John. 2.19. and 10.18.

And each of the natures retaineth and keepeth his own essential properties, neither doth it communicate them, to the other nature, and that for two causes: the first is, least the natures should be mingled and confounded: the other, that there might forever remain a difference between the natures. Luke. 24.39. For he that confoundeth the properties, confoundeth the natures: and he that taketh away the properties, taketh away the natures.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03c94e9d27" data-kw="">
<blockquote><p>It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-m-williams.html">Scott M. Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Person’ in Patristic &amp; Medieval Christian Theology’</cite></span></figcaption>

</figure><figure class="quote" id="q-2838d2990a" data-kw="two wills dyothelite">
<blockquote><p>The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6, 7, 11); (2) two wills are ascribed to him (“not my will, but thine, be done,” Lk. 22:42). Nor does it follow that there are two willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.7.14</span></figcaption>

<blockquote><p>It traces the central contours of the Christological debates, from the discussion between Luther and Zwingli in the 1520s to the Colloquy of Montbeliard in 1586… Cross shows that Luther’s Christology is thoroughly Medieval, and that innovations usually associated with Luther-in particular, that Christ’s human nature comes to share in divine attributes-should be ascribed instead to his younger contemporary Johannes Brenz. The discussion is highly sensitive to the differences between the various Luther groups-followers of Brenz, and the different factions aligned in varying ways with Melanchthon-and to the differences between all of these and the Reformed theologians. By locating the Christological discussions in their immediate Medieval background, Cross also provides a comprehensive account of the continuities and discontinuities between the two eras. In these ways, it is shown that the standard interpretations of the Reformation debates on the matter are almost wholly mistaken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communicatio Idiomatum</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“It traces the central contours of the Christological debates, from the discussion between Luther and Zwingli in the 1520s to the Colloquy of Montbeliard in 1586… Cross shows that Luther’s Christology is thoroughly Medieval, and that innovations usually associated with Luther-in particular, that Christ’s human nature comes to share in divine attributes-should be ascribed instead to his younger contemporary Johannes Brenz. The discussion is highly sensitive to the differences between the various Luther groups-followers of Brenz, and the different factions aligned in varying ways with Melanchthon-and to the differences between all of these and the Reformed theologians. By locating the Christological discussions in their immediate Medieval background, Cross also provides a comprehensive account of the continuities and discontinuities between the two eras. In these ways, it is shown that the standard interpretations of the Reformation debates on the matter are almost wholly mistaken.”

<blockquote><p>Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk.xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance.</p></blockquote>

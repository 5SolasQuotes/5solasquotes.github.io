<blockquote><p>Sect. 18. 2. Christ’s Reply is by way of Reprehension, and taxing their hypocrisy, Matth. 15. 7—9. Ye hypocrites, &amp;c. The people indeed had a great veneration for them, and looked upon them as great Devoto’s and Religionists: but Christ puts off their vizor, uncovers their nakedness, and lays open their hypocrisy; and that, by applying to them that prophecy of Isaiah, This people draws nigh, &amp;c. i.e. they pretend a great deal of Religion in their outward carriage, and seem to be very diligent in all external duties, but all is but from the teeth outward: their Religion is but a mere carcass, without any life, or soul, or spirit in it; the heart is wanting. Here he opens the fountain of this evil, which was, The placing all Religion in outward ceremonies, and superstitious observances.

9. But in vain do they worship me] i.e. They shall not only not get any good by such worship, but shall bring upon themselves the wrath of God, and consequently a great deal of evil and mischief, by their thus—teaching for Doctrines] i.e. instead of Doctrines, the commandments of men.] The word [Doctrine] is usually taken for those points either of Faith or Duty, which are delivered in Preaching; and here it must relate, particularly, to matters of worship, as is evident, both because that is the business in hand, which Christ is here speaking of; and also, by comparing these words with those of Isaiah, whence they are taken, viz. Isa. 29. 13 where the words run thus:—and their fear towards me is taught by the precepts of men. Their fear towards me, i. e. their worship of me; as fear is taken, 2 King. 17. 32, 33. And then by [the commandments of men] is meant, those Traditions of the Elders before mentioned; what he calls [your traditions] and [your own traditions] before, here he calls [the commandments of men.] i. e. All such human inventions and institutions in God’s worship, which have no good ground, nor warrant from the Word of God, though they may pretend some. Ea quae fundamentum habent in persuasione mere humanâ, &amp; non divinitus tradita, saith Grotius.

So that the sense of the whole clause is this,—Teaching for Doctrines the commandments of men] i.e. By their thus preaching up, and pressing the observation of their Traditions and humane Inventions in the worship of God, instead of those things which are of divine Institution and Appointment, they render their worship vain. ‘Tis the property of Scripture alone to be profitable for Doctrine, 2 Tim. 3. 16. Hence Titus is required to snow uncorruptness in doctrine; Tit. 2. 7. i. e. to deliver the pure truths of God not dashed with the water, nor alloyed with the lead of human inventions, whereby ’tis corrupted, as wine is with water, and gold with lead.

So that, as the matter of all our Teaching is laid down Positively, in that Commission, Matth. 28. ult. Teaching them to observe whatsoever I have commanded you: So here, teaching and urging any thing in the worship of God, not only contrary to, but besides, the Word, is condemned in these words by Christ; and they that take their measures in Worship, from the Commandments of men, their worship is vain, bootless, and unprofitable, yea mischievous and abominable: And such persons Christ pronounces to be Hypocrites; and such we must take ’em for, except we will contradict his judgement.

Your zealous assertors of, and great sticklers for, the observation of human inventions in God’s worship, are great hypocrites in Christ’s account; and they that urge and impose such things as strictly, or more strictly than the observation of divine Institutions, are guilty of gross hypocrisy, whatever they pretend, as to Decency, Uniformity, Authority, or the like. For, though a practice be really a matter of Decency and Conveniency, and thereupon some Rules and Directions may be given by Authority about it; yet it ought not to be enjoined as strictly, or as much stress laid upon it, as upon the substantials and vitals of Worship: as for example.

In point of Time, or Place, or Gesture, or Habit, ’tis to be supposed, and I think we may well take it for granted, that generally, neither Ministers nor People are such brutes, and so void of understanding, as to perform Duties with such undue Circumstances, at such inconvenient Times, in such inconvenient Places, with such rude Postures, in such undecent Habits, as may render the service, or worship notoriously undecent, and wholly unprofitable, and inconsistent with the Glory of God, and the good of Souls: or, if any particulars should be guilty of such foul miscarriages, then let Governors take notice thereof, and censure offenders proportionably to the demerit of the crime; and not perdere substantiam propter accidentia, imbroil the whole Church by, and silence hundreds or thousands of inoffensive Ministers for non-compliance with. Impositions about such matters.

Certainly the greatest evil that can be imagined to follow upon some irregular, undue, circumstantial miscarriage in worship, is not proportionable to the thousandth part of that mischief which we have always found has followed upon these Impositions.</p></blockquote>

<blockquote><p>3. The government gives a legal security and establishment to gross heresy, blasphemy, and idolatry, under the notion of liberty of conscience. It would be too tedious to examine each of the State constitutions on this head. One may suffice.

We shall select that of the State of Pennsylvania. See the preamble, together with the third and twenty-sixth sections of the ninth article. Here the constitution recognizes and unalterably establishes the indefeasible right of worshipping the Almighty God in whatever way a man’s conscience may dictate; and declares that this shall for ever remain inviolate. We believe that no man has a right to worship God any other way than he himself hath prescribed in his law. We also think it criminal for a man’s conscience to approve any way repugnant to this sacred rule: and that this crime cannot legitimate another, or make an action right which God expressly condemns under pain of eternal wrath.

If conscience can legitimate what God’s law condemns, it must be paramount to the divine law, and, consequently, to the Legislator also, in having a negative over the requisitions of both the one and the other.

Were this the case, it would not only free from criminality, but would render virtuous, laudable, and praiseworthy the most damnable errors—the most horrid blasphemies and detestable abominations—if but dictated by the consciences of Pagans, Mohammedans, &amp;c. Then the Egyptians, worshipping God under the form of a snake or crocodile, would be as lawful, yea, as commendable, as doing it precisely according to the manner which he has prescribed in his word, provided, that, in both cases, conscience said Amen!</p></blockquote>

</figure><figure class="quote" id="q-9977fa1737" data-kw="">
<blockquote><p>They [the three friends of Daniel] expressly refuse knee-bowing [to the idol], and the reason is, because if ye bow your knee religiously to a stock, it is not in your power or free choice to stay the flux and motion of religious honor off, or from, the stock; but because religious bowing does not convey honor to the thing before which ye bow by your free will, but by God and nature’s institution, even as weeping naturally expresses sorrow, laughing, gladnesse, so does religious bowing signify religious honoring, without any act of the free choice of the worshipped intervening. It is impossible to adore God in and through an image, and give no religious reverence to the image at all; as it is impossible to hear the Word and tremble at it, and yet none of that religious trembling be bounded and terminated upon the Word, as it is impossible to kneel to the king’s ambassador conveying all and whole that civil honor to the king, but some honor must redound to the ambassador; a father cannot love the doctor for his son’s cause, but some love he must confer really upon the doctor, if not absolute, yet relative, for his son’s cause. Jacob could not kiss Joseph his son’s coat, and yet refer that whole expressed affection to Joseph and nothing at all to the coat, for then should there be no reason why he should kiss the coat rather than the skin of the beast supposed to be the devourer of his son; If therefore the communicant should kiss the sacramental bread as he bows religiously before it, as the object of his sacramental worship, which he receives, I hope it would be thought very like the kissing of the calves of Samaria, and a religious expression of love to the bread; and by the same case, religious bowing to God, by the intervening of bread, a representative object, must be an expression of religious honoring of bread, but no religious honoring by religious bowing can be expressed, but [it is] adoration of bread…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b85ed370f1" data-kw="">
<blockquote><p>…Van Til fails to communicate clearly, and at times clearly equivocates, regarding three points at the heart of his system of philosophy: [1.] whether man must know everything to know anything, [2.] whether knowledge is true if it corresponds to God’s knowledge, or on the contrary, [it is] only [true] if he consciously refers it to God, [3.] and whether this referring to God is [to] be sufficient, or whether one must be regenerate and possessing a saving faith of God in order to possess ‘true knowledge’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-johnson.html">Charles Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Confused Nature of Van Til’s Epistemology’ 2020 24 paragraphs</cite>, This clear, helpful, documented and persuasive article examines the first chapter in Van Til’s A Survey of Christian Epistemology. Johnson proves and concludes that:</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33a7000fe4" data-kw="">
<blockquote><p>In the order of eminence he [Scotus] shows that 1) some eminent nature is simply first in perfection; 2) a supreme nature is uncausable; 3) a supreme nature actually exists. Next Scotus shows that this triple primacy, namely of efficiency, finality, and eminence, belongs to the same quiddity or nature. Having proved these relative properties of the first being, he proceeds further to prove the infinity of the first being. Having proved infinity, he demonstrates that God is unique in nature, using six (or seven) arguments…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the order of eminence he [Scotus] shows that 1) some eminent nature is simply first in perfection; 2) a supreme nature is uncausable; 3) a supreme nature actually exists. Next Scotus shows that this triple primacy, namely of efficiency, finality, and eminence, belongs to the same quiddity or nature. Having proved these relative properties of the first being, he proceeds further to prove the infinity of the first being. Having proved infinity, he demonstrates that God is unique in nature, using six (or seven) arguments…”

</figure><figure class="quote" id="q-5075e29480" data-kw="">
<blockquote><p>‘But’ says he [Hussey, an Erastian], ‘may they not worship Christ as Mediator? Yes, doubtless they may.’ [Gillespie’s response:] No doubt He that is Mediator must be worshipped, because He is God; Christ God-man is the object of divine adoration, and his God-head is the cause of that adoration; but whether He is to be worshipped because He is Mediator, or under this formal consideration as Mediator; and whether the Mediator ought to be therefore adored with divine adoration, because He is Mediator, is res altioris indaginis [a thing for deeper investigation]. If Mr. Hussey please to read and consider what diverse Schoolmen have said upon that point, as: Aquinas, [Summa] third part, quest. 25, art. 1 &amp; 2; Alex. Alensis, Sum. Theol., part 3, quest. 30, member 2; Suarez in the third part of Thomas, disp. 53, sect. 1; Valentia, Comment on Thomas, tome 4, disp. 1, quest. 24, point 1; Tannerus, Scholastic Theology, tome 4, disp. 1, quest. 7, doubt 7. But much more if he please to read Disputatio de adoratione Christi, habita inter Faustum Socinum &amp; Christianum Francken: and above all Dr. Voetius, Select Disputations, pt. 2, disp. 14, Whether Christ is to be Adored as Mediator? Then I believe he will be more wary and cautious what he holds concerning that question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, … (London: 1646), bk. 2, ch. 6, p. 230</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-5f865897be" data-kw="">
<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Logic, setting forth the Way one ought to Argue Singular Common Places in Most Holy Theology in General &amp; in Specific $5 Downloard</cite>, tr. Jonathan Tomes (Frankfurt, 1625)</span></figcaption>

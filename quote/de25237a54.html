<main class="wrap"><figure class="quote" id="q-de25237a54" data-kw="">
<blockquote><p>…we most heartily wish any disease of this Church to be timeously prevented and cured. But withal we wish this to be done without a rupture, and such a dangerous division… which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius [†264], Bishop of Alexandria, in his epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-aberdeen-doctors.html">Aberdeen Doctors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplies of the Ministers &amp; Professors of Aberdeen to Second Answers of some Reverend Brethren, concerning the Late</cite>, [National] Covenant (Aberdeen: Raban, 1638), “First Duply”, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

 Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26c2da0923" data-kw="">
<blockquote><p>Though the Old Testament rites after Christ’s death were called “the commandments and doctrines of men” (Col. 2:22), just as the sort that Jesus condemns in Mt. 15:2–9, yet Paul and the Christians did not put any opinion of holiness in these rites or opinion of necessity beyond their nature or what derived from the circumstances (though others did). Paul and the Christians used these material, inconvenient and scandalous (in some way) ceremonies in accord with nature’s light, Christian prudence and the Word’s general rules for the greater good: “Unto the pure all things are pure” (Tit. 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-46c286a640" data-kw="">
<blockquote><p>If superiors command that which is above their sphere to command, namely, things not necessary in genere [in their kind], yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, pt. 3, §6 in The Remains of the Reverend &amp; Learned Mr. John Corbet… (d. 1680; London: Thomas Parkhurst, 1684), p. 218</span></figcaption>

</figure><figure class="quote" id="q-c43f3df445" data-kw="">
<blockquote><p>Divines commonly accept that covenants do not remove preexisting obligations. [Andrew] Honyman, amongst other things, maintains that preaching the Gospel and procuring the greater good of “the public peace and good of Church and State, and prevent[ing] horrid confusions” are preexisting and more foundational ministerial obligations than the form of Church government or what the SL&amp;C could alter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 125</span></figcaption>

</figure><figure class="quote" id="q-4223bd30c4" data-kw="">
<blockquote><p>And thus I have showed you what materials our brethren will afford us to this building [of Church government], which I could for my own part rather be content to sit down withal, than by raising it higher, but heighten our confusion, run the mischief of division among ourselves, than which no penal evil can be sadder and more uncomfortable. I wish we might all remember the apostle’s rule, Phil. 3:15-16…</p></blockquote>

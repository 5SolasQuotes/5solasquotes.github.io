<blockquote><p>7. From these things it is plain that God, when He pursues with a hatred of displeasure an elect person whom He previously loved with a love of complacency, is not changed, even though perhaps the act of complacency, considered as it adds a respect of reason to such an object, is now in no way in Him. For: First, when such an act is removed, God is not physically and really changed, because nothing departs from Him beyond a mere respect of reason, as Suárez and Vázquez demonstrate by irrefutable arguments in the places cited. Secondly, neither is He changed morally, because He does not change his purpose, but on the contrary, remains [steadfast] in his purpose, or rather in his natural inclination, by which from eternity He was, now is, and always will be, inclined to love virtue and to detest vices or sins. He also remains [steadfast] in his purpose of leading those whom He chose and justified to eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Venial &amp; Mortal Sin (1633; 1649), pt. 1, sect. 6, ‘God can love those whom He previously hated, and hate those whom He previously loved, without any change, whether physical or moral, in his will’ tr. Michael Lynch Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7602d9f6f" data-kw="">
<blockquote><p>Strictly speaking, therefore, God does not love irrational creatures with the love of friendship; but as it were with the love of desire, in so far as He orders them to rational creatures, and even to Himself. Yet this is not because He stands in need of them; but only on account of His goodness, and of the services they render to us. For we can desire a thing for others as well as for ourselves.</p></blockquote>

</figure><figure class="quote" id="q-d03f9558bd" data-kw="">
<blockquote><p>I answer that, It is necessary to assign an appetitive power to the soul. To make this evident, we must observe that some inclination follows every form: for example, fire, by its form, is inclined to rise, and to generate its like. Now, the form is found to have a more perfect existence in those things which participate knowledge than in those which lack knowledge. For in those which lack knowledge, the form is found to determine each thing only to its own being—that is, to its nature. Therefore this natural form is followed by a natural inclination, which is called the natural appetite. But in those things which have knowledge, each one is determined to its own natural being by its natural form, in such a manner that it is nevertheless receptive of the species of other things: for example, sense receives the species of all things sensible, and the intellect, of all things intelligible, so that the soul of man is, in a way, all things by sense and intellect: and thereby, those things that have knowledge, in a way, approach to a likeness to God, in Whom all things pre-exist, as Dionysius says (Div. Nom. v). Therefore, as forms exist in those things that have knowledge in a higher manner and above the manner of natural forms; so must there be in them an inclination surpassing the natural inclination, which is called the natural appetite. And this superior inclination belongs to the appetitive power of the soul, through which the animal is able to desire what it apprehends, and not only that to which it is inclined by its natural form. And so it is necessary to assign an appetitive power to the soul. … Reply Obj. 2: What is apprehended and what is desired are the same in reality, but differ in aspect [ratione]: for a thing is apprehended as something sensible or intelligible, whereas it is desired as suitable or good. Now, it is diversity of aspect in the objects, and not material diversity, which demands a diversity of powers. Reply Obj. 3: Each power of the soul is a form or nature, and has a natural inclination to something. Wherefore each power desires by the natural appetite that object which is suitable to itself. Above which natural appetite is the animal appetite, which follows the apprehension, and by which something is desired not as suitable to this or that power, such as sight for seeing, or sound for hearing; but simply as suitable to the animal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 | quest. 80, Appetitive Powers in General, art. 1, Whether the appetite is a special power of the soul?</cite></span></figcaption>

</figure><figure class="quote" id="q-7375df7539" data-kw="">
<blockquote><p>The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, pp. 552-53</span></figcaption>

— Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, pp. 552-53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+affections+are%2C+therefore+%5Bafter+quoting+Venema+and+Ames%5D%2C+either+inward+and+inalterable+dispositions+of+the+divine+will+or+figurative+attributions+based+on+ad+extra+manifestations.+Furthermore%2C+what+makes+the+attribution+of+an+affection+to+God+figurative+or+metaphorical+is+its+apparent+variation%2C+temporality%2C+or+alterability.+Significantly%2C+this+figurative+or+metaphorical+understanding+of+some+of+the+divine+affections+as+inward%2C+permanent+dispositions+and+others+as+ad+extra+manifestations+of+permanent+dispositions+in+no+way+lessened+the+Reformed+interest+in+the+topic%E2%80%93nor+did+it+in+any+way+undermine+the+discussion+of+the+divine+affections+in+the+works+of+popular+piety+written+during+the+era+of+orthodoxy.+It+is+even+possible+to+argue+the+opposite%2C+that+the+Reformed+orthodox+reading+of+the+biblical+language+of+divine+affections+as+not+indicating+alterations+of+the+divine+essence+but%2C+nonetheless%2C+as+descriptive+of+genuine+patterns+of+relationship+between+God+and+his+creation%2C+enhanced+the+interest+of+theologians%2C+pastors%2C+and+authors+of+treatises+of+popular+piety+in+the+divine+affections%E2%80%A6+%E2%80%A6Nor%2C+indeed%2C+has+the+basic+doctrinal+assumption+shifted%3A+like+the+Reformers%2C+the+orthodox+assume+that+God+has+affectiones+that+characterize+his+relationship+to+the+world+and+that+some+analogy+can+be+drawn+between+these+%E2%80%98divine+affections%E2%80%99+and+the+affections+that+belong+to+human+willing%E2%80%93with+the+major+qualification+that%2C+unlike+human+affections%2C+the+divine+affections+do+not+indicate+essential+change+in+God+and+that+they+are+permanent+rather+than+transient+dispositions.+Because+of+the+difficulties+inherent+in+the+term+%E2%80%98affection%2C%E2%80%99+some+of+the+Reformed+prefer+to+speak+of+the+divine+%E2%80%98virtues.%E2%80%99+%28Thus%2C+Leigh%2C+Treatise%2C+II.x+%28pp.+78-79%29%3B+Mastricht%2C+Theoretico-practica+theologia%2C+II.xv.18-19.%29+The+question+of+the+%E2%80%98affections%E2%80%99+%28affectiones+or+adfectiones%29+and+%E2%80%98passions%E2%80%99+%28passiones%29+of+the+divine+will+arises+rather+naturally+as+a+result+of+the+definition+and+discussion+of+the+voluntas+Dei%2C+granting+the+context+of+traditional%2C+Christian+Aristotelianism+and+scholastic+faculty+psychology+within+which+Protestant+discussions+of+mind+and+will+took+place%2C+both+in+the+time+of+the+Reformation+and+afterward.+%28See+Muller%2C+Unaccommodated+Calvin%2C+pp.+159-173%3B+and+idem%2C+God%2C+Creation%2C+and+Providence%2C+pp.+143-149%2C+167-169%2C+191-207.%29+The+terminology+is+itself+interesting%3A+the+language+of+affections+and+passions+is+typically+a+language+indicating+the+changeableness+of+a+living+being%2C+specifically+of+the+soul%2C+in+its+sentiments+or+dispositions.+Strictly%2C+an+affection+or+passion+is+an+acquired+quality.+%28Francois+Bremondy%2C+%E2%80%9CAffection%2C%E2%80%9D+in+Encyclopedie+philosophique+universelle%2C+II%2F1%2C+p.+49.%29+An+affection+is+usually+favorable+or+positive%2C+whereas+a+passion+is+usually+negative.+Thus%2C+an+affection+is+a+disposition+of+nature+or+an+inclination+of+will+toward+an+object+and%2C+as+such%2C+it+can+indicate+either+a+transient+disposition+%28in+contrast+to+a+habitus%29+that+is+caused+by+an+external+object+or+a+permanent+disposition+or+virtue.+%28Cf.+Heidanus%2C+Corpus+theol.%2C+II+%28p.+172%29%3B+Venema%2C+Inst.+theol.%2C+viii+%28p.+180%29.%29+It+is+the+latter+sense+of+the+term%2C+as+a+permanent+disposition+or+virtue%2C+that+the+orthodox+accept.+A+passion%2C+most+strictly%2C+is+a+form+of+suffering+and+would+not+have+the+connotation+of+a+permanent+disposition+and+certainly+not+of+a+disposition+positively+directed+toward+an+object.+Passions%2C+moreover%2C+indicate+a+declension+from+an+original+or+natural+condition+that+is+at+variance+with+the+fundamental+inclination+of+the+individual%E2%80%93and%2C+therefore%2C+a+loss+of+power+or+self-control.+%28Venema%2C+Inst.+theol.%2C+viii+%28p.+181%29.%29+A+virtue+is%2C+quite+simply%2C+a+moral+perfection%E2%80%93in+the+case+of+God%2C+the+perfection+of+his+understanding+and%2For+will.%C2%B9+%C2%B9+%28Ames%2C+Marrow%2C+I.iv.63%3B+note+that+this+understanding+of+affections+and+passions+reflects+the+standard+categories+of+predication%2C+in+which+action+and+passion+denote+respectively%2C+the+act+of+a+subject+and+the+subject+being+acted+upon%3A+thus%2C+the+point+of+the+theological+argument+is+that+God+act%5Bs%5D+but+is+not+acted+upon.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+pp.+552-53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7375df7539.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7375df7539.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting,act%5Bs%5D%20but%20is%20not%20acted%20upon&amp;text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting%20Venema%20and&amp;text=that%20God%20act%5Bs%5D%20but%20is%20not%20acted%20upon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>

<blockquote><p>Neither Word nor sacraments, nor anything on the part of the Almighty can be intended in vain, though the end of the ordinance be not obtained. I should have expected some such divinity from the pen of Arminians and Socinians who make God to intend the salvation of all and every one in both the promises of the Gospel, precepts and sacraments, and yet He falls from this end: so you may read, in Arminius, Anti-Perkins, p. 60, that God is disappointed in his end, in both Law and Gospel, and God shooting beside his mark misses the salvation of many, say the Remonstrants at the Synod of Dort, p. 216, and in their confession, ch. 7, sect. 3; and because Socinus thought it hard thus to take from God wise intentions, he did no less than blasphemously deprive Him of his omniscience: So Socians, Contra Puccium, ch. 10, and in Theological Lectures, ch. 11, made all things that are contingently to come uncertain to God: But if you speak of intentio operis, non operantis [the end of the work, not of the worker], that the Supper, in its nature, is ordained…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 23, pp. 525-26</span></figcaption>

<blockquote><p>III. …The instrumental cause [of baptism] is a legitimately called minister. IV. Therefore we do not regard baptism by a layman [privatus], or by a woman, as valid, as the papists do. If there is no circumstance in a worldly government when a private citizen may do anything without authoization, how much less could such a corruption in his Church please Christ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (London, 1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 22, ‘The Seals or Sacraments…’, p. 121; ch. 23, p. 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

— Johannes Wolleb, Abridgment of Christian Divinity (London, 1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 22, ‘The Seals or Sacraments…’, p. 121; ch. 23, p. 129.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+%E2%80%A6The+instrumental+cause+%5Bof+baptism%5D+is+a+legitimately+called+minister.+IV.+Therefore+we+do+not+regard+baptism+by+a+layman+%5Bprivatus%5D%2C+or+by+a+woman%2C+as+valid%2C+as+the+papists+do.+If+there+is+no+circumstance+in+a+worldly+government+when+a+private+citizen+may+do+anything+without+authoization%2C+how+much+less+could+such+a+corruption+in+his+Church+please+Christ%3F%E2%80%9D%0A%0A%E2%80%94+Johannes+Wolleb%2C+Abridgment+of+Christian+Divinity+%28London%2C+1626%29+in+ed.+John+Beardslee%2C+Reformed+Dogmatics%3A+J.+Wollebius%2C+G.+Voetius+%26+F.+Turretin+%28Oxford+Univ.+Press%2C+1965%29%2C+ch.+22%2C+%E2%80%98The+Seals+or+Sacraments%E2%80%A6%E2%80%99%2C+p.+121%3B+ch.+23%2C+p.+129.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feabf10bc10.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eabf10bc10.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=The%20instrumental%20cause%20%5Bof%20baptism%5D%20is,corruption%20in%20his%20Church%20please%20Christ&amp;text=The%20instrumental%20cause%20%5Bof%20baptism%5D%20is%20a%20legitimately&amp;text=such%20a%20corruption%20in%20his%20Church%20please%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4fdc8f7be5" data-kw="">
<blockquote><p>…it becometh not Mr. Hooker with Arminians and Socinians to impeach the wisdom of the Holy One, because He appoints the giving of the seals, baptism to Judas and to Magus, who have no right, true and real in foro Dei [in the court of God], in the Decree of God, and in his holy intention, as I spake [on] pp. 248, 249, to the seals, and the grace sealed; nor to the engraven Law, and God’s teaching of the heart, and to perseverance; .. Again, God giveth a right to the seals to hypocrites; that is, he commandeth the Church to give the seals to Magus, whether such really or hypocritically believe; this is a right not properly inherent in visible members, for their profession, yea, or their supposed conversion: 1. Because all saving and real right to ordinances is relative to election to glory, and flows from the merit of Christ’s death; but visible professors, as such, of whose society Magus and Judas are, have not any saving and real right, as chosen and redeemed in Christ, by grant of our [Congregationalist] Brethren. 2. A right flowing only from an external profession, and from composed hypocrisy in Magus, is no true right; a lie cannot give a true right: I offend that Mr. Hooker so anxiously contends for a charter to such bastards as Magus. 3. It is a favor to hear the Gospel and partake of the seals; and jus activum, ‘an active right’ the Church and ministers have to call and admit to the seals all who profess as Magus, that the elect in the visible Church may be converted, but it is not a right proprie dictum ne quidem Ecclesiasticum [properly said with certainty to the Church], that they have who are such hypocrites as Judas and Magus; for the command and revealed Will of God most unproperly is said to give Magus a right to the seals: Except [for] Mr. Hooker, never [a] divine so spake; the command reveals the right, but gives none. As also the right of visible professors is jus passivum, and a conditional and passive right; for Magus and Judas have no right to be visible members, or to partake of the seals, yea or to profess the Covenant and Name of God, Ps. 50:16, but upon condition of faith: for God cannot command sin and an hypocritical profession: yea, He forbids [their] treading in his courts, Isa. 1:12-13, except they repent and believe, vv. 16, 17; therefore Magus sins in professing, and in being baptized: he remaining rotten. But the Church sins not, but does the command of Christ in calling, inviting all that profess, whether they be really, or in the judgement of charity, converts or no. Which distinction not being observed, our [congregationalist] Brethren and Mr. Hooker mistake the nature of an ecclesiastical right; for the Lord in the command gives to all visible professors, such as Peter, who really believe, both the ecclesiastic and external right to the seals which He decreed to give them, and the same internal and real right which they have by faith, and no other than according to his eternal decree, they have given them in time by real believing. But for hypocrites, as Magus, they have no right ecclesiastic to the seals, but a sort of active and permissive right, by which they claim room in the visible Church, and the seals from the Church. Therefore taking the Church-visible as only visible, as contra-distinguished from the invisible and really believing: and as visibility is common to both Peter and Magus, and their external profession obvious to the eye of man, so the visible Church hath no right that is true and real to the seals. So I retort the Argument upon Mr. Hooker: True real believers, as Peter, and hypocrites, as Magus, have either one and the same Church-right to membership and seals, or another, and diverse. The same right they cannot have: 1. Because the right of truly and really believing ones, is according to the decree of election, such as the Lord ordained to be purchased to them by the merits of Christ, and also according to the Lord’s revealed Will. He who believes hath right to eat of the Tree of Life, and to membership and seals: But this right Magus and hypocrites have not, for they have no part in Christ. 2. The right that believers, as Peter and John, have, is by fulfilling of the condition. He who believes, and loves to be reformed, hath right to the Covenant, promises, to perseverance, to the anointing that teacheth all things. These are promised and decreed to them, Jer. 31:33-34 &amp; 32:38-40; Isa. 54:10-11 &amp; 59:20-21; compared with Acts 13:47-48; Jn. 6:44-46 &amp; 6:37 &amp; 10:26-27; and to them only, not to Magus and to reprobates. 3. Magus, and such like wooden and tree-legs, might claim the same life, living membership, lively and vital operations, and to have the anointing, and to be kept through faith unto salvation by the power of God, 1 Pet. 1:4 and to have the fear of God put in their hearts, that they should not depart from God, as Jer. 31:39-40, if they have the same right to membership and the seals in their substance and grace signified with sound believers. And this is most absurd.</p></blockquote>

e+quidem+Ecclesiasticum+%5Bproperly+said+with+certainty+to+the+Church%5D%2C+that+they+have+who+are+such+hypocrites+as+Judas+and+Magus%3B+for+the+command+and+revealed+Will+of+God+most+unproperly+is+said+to+give+Magus+a+right+to+the+seals%3A+Except+%5Bfor%5D+Mr.+Hooker%2C+never+%5Ba%5D+divine+so+spake%3B+the+command+reveals+the+right%2C+but+gives+none.+As+also+the+right+of+visible+professors+is+jus+passivum%2C+and+a+conditional+and+passive+right%3B+for+Magus+and+Judas+have+no+right+to+be+visible+members%2C+or+to+partake+of+the+seals%2C+yea+or+to+profess+the+Covenant+and+Name+of+God%2C+Ps.+50%3A16%2C+but+upon+condition+of+faith%3A+for+God+cannot+command+sin+and+an+hypocritical+profession%3A+yea%2C+He+forbids+%5Btheir%5D+treading+in+his+courts%2C+Isa.+1%3A12-13%2C+except+they+repent+and+believe%2C+vv.+16%2C+17%3B+therefore+Magus+sins+in+professing%2C+and+in+being+baptized%3A+he+remaining+rotten.+But+the+Church+sins+not%2C+but+does+the+command+of+Christ+in+calling%2C+inviting+all+that+profess%2C+whether+they+be+really%2C+or+in+the+judgement+of+charity%2C+converts+or+no.+Which+distinction+not+being+observed%2C+our+%5Bcongregationalist%5D+Brethren+and+Mr.+Hooker+mistake+the+nature+of+an+ecclesiastical+right%3B+for+the+Lord+in+the+command+gives+to+all+visible+professors%2C+such+as+Peter%2C+who+really+believe%2C+both+the+ecclesiastic+and+external+right+to+the+seals+which+He+decreed+to+give+them%2C+and+the+same+internal+and+real+right+which+they+have+by+faith%2C+and+no+other+than+according+to+his+eternal+decree%2C+they+have+given+them+in+time+by+real+believing.+But+for+hypocrites%2C+as+Magus%2C+they+have+no+right+ecclesiastic+to+the+seals%2C+but+a+sort+of+active+and+permissive+right%2C+by+which+they+claim+room+in+the+visible+Church%2C+and+the+seals+from+the+Church.+Therefore+taking+the+Church-visible+as+only+visible%2C+as+contra-distinguished+from+the+invisible+and+really+believing%3A+and+as+visibility+is+common+to+both+Peter+and+Magus%2C+and+their+external+profession+obvious+to+the+eye+of+man%2C+so+the+visible+Church+hath+no+right+that+is+true+and+real+to+the+seals.+So+I+retort+the+Argument+upon+Mr.+Hooker%3A+True+real+believers%2C+as+Peter%2C+and+hypocrites%2C+as+Magus%2C+have+either+one+and+the+same+Church-right+to+membership+and+seals%2C+or+another%2C+and+diverse.+The+same+right+they+cannot+have%3A+1.+Because+the+right+of+truly+and+really+believing+ones%2C+is+according+to+the+decree+of+election%2C+such+as+the+Lord+ordained+to+be+purchased+to+them+by+the+merits+of+Christ%2C+and+also+according+to+the+Lord%E2%80%99s+revealed+Will.+He+who+believes+hath+right+to+eat+of+the+Tree+of+Life%2C+and+to+membership+and+seals%3A+But+this+right+Magus+and+hypocrites+have+not%2C+for+they+have+no+part+in+Christ.+2.+The+right+that+believers%2C+as+Peter+and+John%2C+have%2C+is+by+fulfilling+of+the+condition.+He+who+believes%2C+and+loves+to+be+reformed%2C+hath+right+to+the+Covenant%2C+promises%2C+to+perseverance%2C+to+the+anointing+that+teacheth+all+things.+These+are+promised+and+decreed+to+them%2C+Jer.+31%3A33-34+%26+32%3A38-40%3B+Isa.+54%3A10-11+%26+59%3A20-21%3B+compared+with+Acts+13%3A47-48%3B+Jn.+6%3A44-46+%26+6%3A37+%26+10%3A26-27%3B+and+to+them+only%2C+not+to+Magus+and+to+reprobates.+3.+Magus%2C+and+such+like+wooden+and+tree-legs%2C+might+claim+the+same+life%2C+living+membership%2C+lively+and+vital+operations%2C+and+to+have+the+anointing%2C+and+to+be+kept+through+faith+unto+salvation+by+the+power+of+God%2C+1+Pet.+1%3A4+and+to+have+the+fear+of+God+put+in+their+hearts%2C+that+they+should+not+depart+from+God%2C+as+Jer.+31%3A39-40%2C+if+they+have+the+same+right+to+membership+and+the+seals+in+their+substance+and+grace+signified+with+sound+believers.+And+this+is+most+absurd.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker+%281658%29+%7C+ch.+16%2C+%E2%80%98Of+the+Principal+%26+Prime+Subject+of+All+the+Privileges+of+Special+Note+Bestowed+in+the+Mediator+Christ+upon+the+Church%E2%80%99%2C+pp.+77-81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4fdc8f7be5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4fdc8f7be5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=it%20becometh%20not%20Mr.%20Hooker%20with,believers.%20And%20this%20is%20most%20absurd&amp;text=it%20becometh%20not%20Mr.%20Hooker%20with%20Arminians%20and&amp;text=with%20sound%20believers.%20And%20this%20is%20most%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(1) The personal sin of one does not injure another who does not share in it. Now the defect of intention of the minister is the personal sin of that minister. Therefore it does not injure another not partaking of it—him, namely, who is the partaker of the sacrament rightly celebrated. However, it would injure him, if from the defect of that intention, the sacrament would be made void. 2. Because there is the same relation of the sacrament as of the word.</p></blockquote>

</figure><figure class="quote" id="q-8424af3a24" data-kw="">
<blockquote><p>Do you think that the Supper of the Lord ought to be celebrated in any other place than in the common and public congregation? Answer: This was a custom in the beginning of the old Church, that the sacrament should be sent by deacons to the sick that were absent from the public meeting, that is to say, at that time that the mysteries were celebrated of the rest in that meeting, because it was meet that those whom one disease did let [prevent] to be present in body, should be accompted as if they were present: neither do I doubt but that that thing brought great comfort to those that were sick, the which custom I would very gladly [wish it] were restored. But whether it be meet to be celebrated to the sick at that time when the Supper of the Lord is not ministred in the Church, of this I greatly doubt. … Notwithstanding I do acknowledge that in this case it is somewhat diverse. For although it were very meet that these mysteries throughout [the] whole [of] Christendom, albeit in diverse places, yet notwithstanding daily also if it were possible, or at least upon appointed and set days were celebrated, which should profit very much to the witnessing of that same mutual fellowship and consolation in Christ: notwithstanding forasmuch as neither of both can be obtained for many just and necessary causes it seems, I know not in what sort to be contrary to the institution of the Supper of the Lord, that all the rest of the Church omitting it, some one house extraordinarily should celebrate those mysteries. Moreover, unless that were done amongst all those that were sick, how shall the suspicion of partiality in respecting of persons be shunned? Now if the Supper of the Lord be to be ministered amongst all that are sick, let pastors see by what means the profanation thereof may be avoided and how they may satisfy and undergo so great labors. The custom therefore of certain [persons] do nothing at all [to] move me, although that it be very ancient, because the matter is to be judged not by examples, but by reasons… But if a man think that he can shun all these inconveniences, and think that those mysteries may be ministred to a sick man in the congregration, he requiring it, upon these conditions I would not be against this custom.</p></blockquote>

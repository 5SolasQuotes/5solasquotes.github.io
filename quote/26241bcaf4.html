<blockquote><p>III… Furthermore, the phrase “according to his measure” [in Essenius’s definition of the image of God] is not without significance, for although this conformity is in itself most perfect, it varies according to the capacity of its subjects (since it applies differently to angels than to humans). Consequently, this image was also implanted in humans according to their measure…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7cba05f842" data-kw="">
<blockquote><p>As has been expressed, this article’s considerations have been put forth with the intention of describing reality and ethical living, which we do everyday, more accurately and fully, not to open up a pandora’s box or skepticism. Indeed, very precise and somewhat complex principles and argumentation (perhaps dizzying) has been used, but that has only been to confirm common sense (or upright practical reason) from subtle, but very significant and potent, practical error, for people’s health. Flee all sophistry¹ (Isa. 5:20-21; Mt. 22:18; Col. 2:8) and simplistic ignorance (Ps. 19:7; Prov. 1:22; 8:5), both which are unworthy of your intelligence and hinder the fruit of God’s truth. † See ‘Which Philosophy Should be Used?’ at ‘Philosophy’ (RBO). ¹ See ‘On Sophistry’ at ‘On the Use of Reason in Theology’ (RBO). Be assured in all this in what is presented here there is no slippery slope. The weight of nature, and that which is above nature, in conjunction with it, will and ought to bear determinative ethical weight in situations according to the natures, context and proportions of that which is involved. God’s Law requires this (Lev. 19:15; Job 34:10-12; Ps. 28:4; 99:4; Prov. 2:9; Jer. 32:19; Mic. 6:8; Zech. 7:9; Mt. 16:27; 23:23; 26:60-61; Mk. 14:61-64; 15:31; Lk. 23:39; Jn. 7:24; 19:12, 17-22).</p></blockquote>

<blockquote><p>One one version [of traducianism], the soul derives form the bodies of the parents. But it is at best difficult to ee how something incorporeal could arise from something corporeal… The other way to interpret traducianism is to hold that the oul derives from the souls of the parents… But it faces another problem. Again, for the reasons considered in chapter 8, the soul is simple or without parts. So how can one’s soul come from the souls of one’s parents? That would seem to require that a part of one’s fatehr’s soul and a part of one’s mother’s soul be passed down to their offspring. But, again, souls do not have parts. It would also seem to require that those parts be combined in order to make up the soul of the child. But souls cannot be made up of parts, because, once again, they lack parts. So it seems that traducianism, on either interpretation, fails. Creationism is the alternative view that… God and the parents together produce the new human being… …Hence, suppose that the existence of God can be independently established… Suppose it can also be established that only God can create something ex nihilo. And suppose that… it can be established that there is no way in principle for a soul to come into being except by being created ex nihilo. Then the appeal to divine action [in creating the soul] will by no means be either ad hoc or a “God of the gaps” explanation. It will be the only possible explanation. My own view is that it is indeed the only possible explanation.</p></blockquote>

</figure><figure class="quote" id="q-ee60753388" data-kw="">
<blockquote><p>Righteousness, which is commonly called ‘Original’, is part of this image, and consists in that rectitude of human nature by which the affections obeyed the will, the will obeyed reason, and reason obeyed God. Since this was implanted in the first man in creation itself, Gen. 1:26-27, 31; 2:25; Eph. 4:24, it is rightly called ‘natural’. Through this man had free will unto good, but mutably. For when God did not preserve him, he could by a fallacious appearance of the object defect unto evil, as the event taught a little later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-bef93b245e" data-kw="">
<blockquote><p>The plant’s roots sinking into the ground is a movement that does arise from within the plant in a sense, since it results from the plant’s natural self-perfective powers qua plant. However, though the power and inclination are in the plant, the end toward which the power is inclined is in no sense present within the plant, nor even represented within it… Now, in a non-human animal, the ends toward which its powers are inclined are represented within it. For an animal can perceive a thing toward which it is naturally inclined, such as the food it eats… the food is in the animal qua perceived… …an animal has a kind of knowledge of the end it is pursuing. However, we still wouldn’t say that an animal knows what it is doing, and thus wouldn’t hold it morally responsible for what it does… For while the animal knows the end it pursues, it doesn’t know that it knows it. It doesn’t know the end as an end, for it does not have the concept of an end, nor indeed any concepts at all. Hence it also lacks the concept of being a means to an end… This lack of concepts entails a certain inflexibility in the animal’s behavior. Like a plant, an animal cannot do otherwise than whatever it in fact does… Because of this… Aquinas says that a non-human animal acts voluntarily only in an imperfect sense… Now, a rational substance is a substance with an intellect, and to have an intellect is precisely to have the capactiy to conceptualize what one knows. A human being qua rational animal not only knows the food that he tries to eat, but knows it as food of a certain kind (an apple, say) and as something that would be good for him to eat given his need for nutrition. He also knows that biting into it straightaway would be one possible means of eating it, and that this has certain advantages and disadvantages compared to other means… What all of this makes possible, as Aquinas emphasizes, is deliberation. Since a rational being posesses universal concepts, he can identify particular ends and means as instances of general kinds. He can make comparisons between these different possible ends and different possible means to the ends. He can arrive at judgments about which ends and means are best, and also make judgments about those judgments themselves. Hence, when he decides to eat the apple, he knows what he is doing in a way that… a non-human animal does not know what it is doing.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The plant’s roots sinking into the ground is a movement that does arise from within the plant in a sense, since it results from the plant’s natural self-perfective powers qua plant. However, though the power and inclination are in the plant, the end toward which the power is inclined is in no sense present within the plant, nor even represented within it… Now, in a non-human animal, the ends toward which its powers are inclined are represented within it. For an animal can perceive a thing toward which it is naturally inclined, such as the food it eats… the food is in the animal qua perceived… …an animal has a kind of knowledge of the end it is pursuing. However, we still wouldn’t say that an animal knows what it is doing, and thus wouldn’t hold it morally responsible for what it does… For while the animal knows the end it pursues, it doesn’t know that it knows it. It doesn’t know the end as an end, for it does not have the concept of an end, nor indeed any concepts at all. Hence it also lacks the concept of being a means to an end… This lack of concepts entails a certain inflexibility in the animal’s behavior. Like a plant, an animal cannot do otherwise than whatever it in fact does… Because of this… Aquinas says that a non-human animal acts voluntarily only in an imperfect sense… Now, a rational substance is a substance with an intellect, and to have an intellect is precisely to have the capactiy to conceptualize what one knows. A human being qua rational animal not only knows the food that he tries to eat, but knows it as food of a certain kind (an apple, say) and as something that would be good for him to eat given his need for nutrition. He also knows that biting into it straightaway would be one possible means of eating it, and that this has certain advantages and disadvantages compared to other means… What all of this makes possible, as Aquinas emphasizes, is deliberation. Since a rational being posesses universal concepts, he can identify particular ends and means as instances of general kinds. He can make comparisons between these different possible ends and different possible means to the ends. He can arrive at judgments about which ends and means are best, and also make judgments about those judgments themselves. Hence, when he decides to eat the apple, he knows what he is doing in a way that… a non-human animal does not know what it is doing.”

— Edward Feser, Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024) | pt. 1, ‘What is Mind?’, ch. 4, ‘The Will’. ‘What is the Will?’, pp. 119-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+plant%E2%80%99s+roots+sinking+into+the+ground+is+a+movement+that+does+arise+from+within+the+plant+in+a+sense%2C+since+it+results+from+the+plant%E2%80%99s+natural+self-perfective+powers+qua+plant.+However%2C+though+the+power+and+inclination+are+in+the+plant%2C+the+end+toward+which+the+power+is+inclined+is+in+no+sense+present+within+the+plant%2C+nor+even+represented+within+it%E2%80%A6+Now%2C+in+a+non-human+animal%2C+the+ends+toward+which+its+powers+are+inclined+are+represented+within+it.+For+an+animal+can+perceive+a+thing+toward+which+it+is+naturally+inclined%2C+such+as+the+food+it+eats%E2%80%A6+the+food+is+in+the+animal+qua+perceived%E2%80%A6+%E2%80%A6an+animal+has+a+kind+of+knowledge+of+the+end+it+is+pursuing.+However%2C+we+still+wouldn%E2%80%99t+say+that+an+animal+knows+what+it+is+doing%2C+and+thus+wouldn%E2%80%99t+hold+it+morally+responsible+for+what+it+does%E2%80%A6+For+while+the+animal+knows+the+end+it+pursues%2C+it+doesn%E2%80%99t+know+that+it+knows+it.+It+doesn%E2%80%99t+know+the+end+as+an+end%2C+for+it+does+not+have+the+concept+of+an+end%2C+nor+indeed+any+concepts+at+all.+Hence+it+also+lacks+the+concept+of+being+a+means+to+an+end%E2%80%A6+This+lack+of+concepts+entails+a+certain+inflexibility+in+the+animal%E2%80%99s+behavior.+Like+a+plant%2C+an+animal+cannot+do+otherwise+than+whatever+it+in+fact+does%E2%80%A6+Because+of+this%E2%80%A6+Aquinas+says+that+a+non-human+animal+acts+voluntarily+only+in+an+imperfect+sense%E2%80%A6+Now%2C+a+rational+substance+is+a+substance+with+an+intellect%2C+and+to+have+an+intellect+is+precisely+to+have+the+capactiy+to+conceptualize+what+one+knows.+A+human+being+qua+rational+animal+not+only+knows+the+food+that+he+tries+to+eat%2C+but+knows+it+as+food+of+a+certain+kind+%28an+apple%2C+say%29+and+as+something+that+would+be+good+for+him+to+eat+given+his+need+for+nutrition.+He+also+knows+that+biting+into+it+straightaway+would+be+one+possible+means+of+eating+it%2C+and+that+this+has+certain+advantages+and+disadvantages+compared+to+other+means%E2%80%A6+What+all+of+this+makes+possible%2C+as+Aquinas+emphasizes%2C+is+deliberation.+Since+a+rational+being+posesses+universal+concepts%2C+he+can+identify+particular+ends+and+means+as+instances+of+general+kinds.+He+can+make+comparisons+between+these+different+possible+ends+and+different+possible+means+to+the+ends.+He+can+arrive+at+judgments+about+which+ends+and+means+are+best%2C+and+also+make+judgments+about+those+judgments+themselves.+Hence%2C+when+he+decides+to+eat+the+apple%2C+he+knows+what+he+is+doing+in+a+way+that%E2%80%A6+a+non-human+animal+does+not+know+what+it+is+doing.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Immortal+Souls%3A+a+Treatise+on+Human+Nature+%28Editiones+Scholasticae%2C+2024%29+%7C+pt.+1%2C+%E2%80%98What+is+Mind%3F%E2%80%99%2C+ch.+4%2C+%E2%80%98The+Will%E2%80%99.+%E2%80%98What+is+the+Will%3F%E2%80%99%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbef93b245e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bef93b245e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=The%20plant%E2%80%99s%20roots%20sinking%20into%20the,not%20know%20what%20it%20is%20doing&amp;text=The%20plant%E2%80%99s%20roots%20sinking%20into%20the%20ground%20is&amp;text=animal%20does%20not%20know%20what%20it%20is%20doing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

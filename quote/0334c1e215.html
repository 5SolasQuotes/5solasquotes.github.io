<main class="wrap"><figure class="quote" id="q-0334c1e215" data-kw="warning means not final loss">
<blockquote><p>It is one thing to be delivered to Satan with the feaster for eternal torment; another to be delivered with the incestuous Corinthian for the destruction of the flesh that the Spirit may be saved in the day of the Lord (1 Cor. 5:5). The believer can be delivered up in the latter, not in the former way. Excommunication does not simply exclude the fallen from the kingdom of heaven, but with this condition—unless they repent. Hence the excommunicated does not cease in secret to be a member of Christ, although as to external discipline for a time he may be cut off from the external body of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.40</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bb3907a8e" data-kw="">
<blockquote><p>The Lord has called you into the fellowship of His Son Jesus Christ, and by that act and deed He has put you into the place of infallible safeguard. If you are indeed a believer you are one with Jesus, and therefore you are secure. Do you not see that it must be so? You must be confirmed to the end until the day of His appearing, if you have indeed been made one with Jesus by the irrevocable act of God. Christ and the believing sinner are in the same boat: unless Jesus sinks, the believer will never drown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, p. 89</span></figcaption>

</figure><figure class="quote" id="q-8541de0ac1" data-kw="perseverance against Remonstrants">
<blockquote><p>The question concerning perseverance is agitated by us with the old and new Pelagians and Semipelagians, who agree in opposing and denying it. Such are the Romanists, Socinians, Anabaptists and Remonstrants, who, on this point (as in the others concerning grace), depart from the orthodox doctrine and were condemned by the Synod of Dort in Article 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.2</span></figcaption>

</figure><figure class="quote" id="q-08cc274924" data-kw="excommunication rod not casting out">
<blockquote><p>Hence the excommunicated does not cease in secret to be a member of Christ, although as to external discipline for a time he may be cut off from the external body of the church and from the communion of sacred things (to wit, excommunication is the rod of a pious mother over a bad son, whom she does not therefore regard as not a son because she whips him, but chastises him severely that he may reform and not cease to be a son altogether).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.40b</span></figcaption>

</figure><figure class="quote" id="q-094fd40078" data-kw="">
<blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-25611324c7" data-kw="">
<blockquote><p>This sentence of the synod, finding Mr. Erskine censurable, has an evident tendency to throw him and many others out of the communion of this Church, who, in the judgment of charity, I am bound to believe would seal their adherence to the valuable privileges with which the King of Zion has vested her, with the last drop of their blood.</p></blockquote>

</figure><figure class="quote" id="q-7da9bbf34b" data-kw="">
<blockquote><p>The mean while the enemy came hard to the bridge-end and spoke to us and we to them. They desired us to come over and they would not harm us, and called for Mr. Hamilton to speak with him; so Mr. David Hume went over, and another gentleman with him, and spoke with the duke, and desired his Grace if he would prevent the effusion of blood. He told them, their petition should have been more humbly worded, and said, lay down our arms and come in his mercy, and we should be favourably dealt with: so he returned and told us. When Robert Hamilton heard it, he laughed at it, and said, ‘and [we shall] hang next.&#x27;</p></blockquote>

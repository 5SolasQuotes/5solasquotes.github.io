<main class="wrap"><figure class="quote" id="q-7cc0ca3135" data-kw="">
<blockquote><p>What assemblies of Christians we behold visibly worshiping God in Christ, we take for granted to be true visible churches. And when we judge of our own communion with them, it is not upon this question, whether they are true churches or no, as though the determination of our practice did depend solely thereon: For as we are not called to judge of the being of their constitution, as to the substance of it, unless they are openly judged in the Scripture, as in the case of idolatry and persecution persisted in, so a determination of the truth of their constitution, or that they are true churches, will not presently resolve us in our duty as to communion with them, for the reasons before given. But in such a case, two things are by us principally to be considered: 1. That nothing sinful in it self, or unto us, be required of us as the condition of communion. 2. That we may in such churches obtain the immediate end of their institution, and our conjunction with them, which is our edification in faith, love and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672), ch. 3</cite>, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-265ec4233d" data-kw="">
<blockquote><p>Which refusal [of church communion] may be either partial or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley-jr.html">John Brinsley Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Araignment of the Present Schism of New Separation in Old England… (London: John Field, 1646) Brinsley (1600-1665) was an English nonconforming presbyterian clergyman and an ejected minister in 1662.</cite>, p. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-d473f1181c" data-kw="">
<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (Religious Tract Society, 1863) Howe (1630-1705) was an English puritan and presbyterian theologian.</cite>, pp. 275-76</span></figcaption>

</figure><figure class="quote" id="q-9289b6c64d" data-kw="">
<blockquote><p>In a word, God has bound all his ministers to use all their gifts to the churches’ greatest edification: But to use a more defective form, with liberty to use my best gifts also, and to exercise my ministry publicly to all, is more to the churches’ edification than to use my own gifts only a few days in a corner and then to lie in prison and use them no more. Though no man must of choice prefer the less congruous before the more congruous, when he is free (which I confess is a sin), yet it is a duty to prefer a less congruous order before none, or before a better for a day with a restraint of that and all our ministry hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 32</cite>, p. 186</span></figcaption>

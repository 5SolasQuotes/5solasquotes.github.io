<blockquote><p>XXV. But are not “psalms, hymns, and spiritual songs,” mentioned in the New Testament, to be sung?

Yes. We are commanded to sing them. Eph. 5:19. Col. 3:16.

XXVI. Were they not something different from the Book of Psalms?

No. For the Colossians and Ephesians had already the Septuagint. “Moses was read in their synagogues every Sabbath day,” their first Christian assemblies Acts 13:15, and converts were Jews Acts 18:19; 19:1,19. Col. 2:14, and therefore, when they were thus directed, they would easily understand, that the psalmois, humnois and odais pneumatikais were obviously the Mitzmorim Shirim, and Tehillim previously given in the Book of Psalms, by the inspiration of God. Besides, in the Septuagint Psa. 72:20, and by Josephus Antiq. B. VII. chap. 12, the Tephiloth, or prayers of David, are called hymns.

XXVII. Do not these various terms indicate different kinds of hymns, from those found in the Book of Psalms, and authorize the composition of religious poetry as the matter of praise?

No. No more than the terms law, commandment, and statutes, in the 119th Psalm, denote any thing different from the word of God, and authorize, as the revealed will of Heaven, the writings of Josephus, the Koran, or the Book of Mormon.

XXVIII. When commanded to “let the word of Christ dwell in” them “richly,” if his “word” could not be found in the “hymns and spiritual songs” contained in the Book of Psalms, could the Colossians and Ephesians remain upon the earth, until modern hymnologists could supply its supposed defects?

No. Nor yet compose, without divine inspiration, hymns for themselves, of which God would assuredly accept, as the matter of his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-blaikie.html">Alexander Blaikie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism of Praise</cite>, (1849; Boston: S. K. Whipple and Co, 1854), pp 12-13.</span></figcaption>

<blockquote><p>By psalms are meant the Psalms of David, and others that compose the book that goes with that name; and by hymns we are to understand, not such as are made by good men, without the inspiration of the Spirit of God; since they are placed between psalms and spiritual songs, made by men inspired by the Holy Ghost… but these are only another name for the book of Psalms, the running title of which may as well be the book of Hymns, as it is rendered by Ainsworth… and by ‘spiritual songs’ are meant the same Psalms of David, Asaph, etc. and the titles of many of them are songs… These three words answer to Mizmorim, Tehillim, and Shirim, the several titles of David’s Psalms…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 5:19.Gill (1697-1771) was an English particular Baptist.</span></figcaption>

</figure><figure class="quote" id="q-3c33e60cd6" data-kw="">
<blockquote><p>The Book of Psalms, viewed merely as a poetical composition, has very high claims on our attention. Men of the most refined and cultivated taste have often been attracted to the study of it from the poetical beauties with which it abounds, and have admitted, in this respect, the superiority of its claims. The greatest of our English poets thus speaks of these sacred songs: “Not in their divine argument alone, but in the very critical art of composition, they may be easily made appear over all the kinds of lyric poesy to be incomparable.” [John Milton] Another elegant scholar speaking on the same subject, says, “In lyric flow and fire, in crushing force and majesty, that seems still to echo the awful sounds once heard beneath the thunder clouds of Sinai, the poetry of the ancient Scriptures is the most superb that ever burned within the breast of man.” [Sir Daniel K. Sandford]

But the intrinsic excellence of this Book gives it still higher claims on our attention. Written under the influence of the Spirit of inspiration, its subject-matter is worthy of its celestial origin. In general, it contains details of the national history of the Jewish people, records of particular portions of the life and experience of individuals, and predictions of future events. Each of these heads embraces a wide field, and they include illustrations of every religious truth which it is necessary for us to know, exemplifications of every devout feeling which it is our duty to cherish, and examples of every spiritual conflict which it is possible for us to experience. We meet with many disclosures of the greatness, majesty, and perfections of the only true God; his government of the world; and his special care over his chosen people.

We meet with the varied exercises of the regenerated soul, and behold it at one time offering up fervent supplications to the Hearer of prayer, at another celebrating his perfections and works; at one time giving utterance to the ardent breathings of love to God, and trust in him, at another struggling with unbelief and corruption; at one time mourning under the divine chastisement on account of sin, at another rejoicing in a sense of forgiving mercy, and enjoying the peace which passeth all understanding. We have presented to us many wonderful predictions concerning the Messiah, his humiliation, sufferings, death, resurrection, and ascension to his Father’s right hand; his work in heaven as the intercessor of his people, and his authority as universal King; the effusion of the influences of the Holy Spirit, and the conversion of all nations to the faith of the Gospel. In short, we have unfolded to our view the final judgment, the gathering of all the righteous to God, and the eternal exclusion of the wicked from happiness and from hope.

These and similar topics which are set forth in the noblest strains of poetry, and in a diction whose magnificence and sublimity correspond to the importance and grandeur of the sentiments, constitute the materials of this Book; and while they afford an incontestable proof that it Is inspired, that it does not consist of the creations of mere human genius, but is an emanation from heaven, they show that its character and tendency are altogether different from the character and tendency of the most admired poetry, which the genius of heathen nations has ever produced.

It ministers to no depraved passion; it fosters no fictitious virtue; it disdains to offer its delicious incense at the shrine of degrading superstition. It teaches the most exalted piety, and the purest morality. It tends only to refine and exalt the nature of man, to elevate the soul to God, and inspire it with the admiration and love of his character, to curb the passions, purify the affections, and excite to the cultivation of whatsoever things are true, honest, just, pure, lovely, and of good report. It has guided the saint in doubt and difficulty; it has nerved him for self-denial and suffering; it has imparted support and comfort to him in the hour of death.

This Book has accordingly been highly appreciated by the best of men in every age, and they have laboured to find expressions in which to set forth its excellence. Athanasius styles it, “An epitome of the whole Scriptures;” Basil, “A compendium of all theology;” Luther, “A little Bible, and the summary of the Old Testament;” Melancthon, “The most elegant work extant in the world;” and for Calvin’s estimate of its value we refer to the excellent preface with which he introduces this department of his labours to the attention of the reader.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-anderson.html">James Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Notice to John Calvin Commentary on the Book of Psalms</cite></span></figcaption>

od%2C+and+inspire+it+with+the+admiration+and+love+of+his+character%2C+to+curb+the+passions%2C+purify+the+affections%2C+and+excite+to+the+cultivation+of+whatsoever+things+are+true%2C+honest%2C+just%2C+pure%2C+lovely%2C+and+of+good+report.+It+has+guided+the+saint+in+doubt+and+difficulty%3B+it+has+nerved+him+for+self-denial+and+suffering%3B+it+has+imparted+support+and+comfort+to+him+in+the+hour+of+death.%0A%0AThis+Book+has+accordingly+been+highly+appreciated+by+the+best+of+men+in+every+age%2C+and+they+have+laboured+to+find+expressions+in+which+to+set+forth+its+excellence.+Athanasius+styles+it%2C+%E2%80%9CAn+epitome+of+the+whole+Scriptures%3B%E2%80%9D+Basil%2C+%E2%80%9CA+compendium+of+all+theology%3B%E2%80%9D+Luther%2C+%E2%80%9CA+little+Bible%2C+and+the+summary+of+the+Old+Testament%3B%E2%80%9D+Melancthon%2C+%E2%80%9CThe+most+elegant+work+extant+in+the+world%3B%E2%80%9D+and+for+Calvin%E2%80%99s+estimate+of+its+value+we+refer+to+the+excellent+preface+with+which+he+introduces+this+department+of+his+labours+to+the+attention+of+the+reader.%E2%80%9D%0A%0A%E2%80%94+James+Anderson%2C+Introductory+Notice+to+John+Calvin+Commentary+on+the+Book+of+Psalms&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c33e60cd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c33e60cd6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/19/james-anderson-on-the-value-of-the-book-of-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-26eb2050ef" data-kw="">
<blockquote><p>Calvin observes… ‘There is in man a twofold government: the one spiritual, whereby the conscience is instructed unto piety and the worship of God: the other political, whereby a man is taught the duties of humanity and civility…’… For whatever is a trespass against the revealed Will of God for duty in moral obedience or instituted worship, is a sin; not but that instituted worship is fundamentally moral obedience, but is therefore in some sense distinguished from it (the serving of God according to his own appointment being the principal part of the Moral Law) because God has, according to the several states of his Church, altered the mode and manner of his worship, as he has thought it best in his wisdom, and as has been most suitable to the several ages and states of his Church; which alterable or altered circumstances, being the product of Christ’s prerogative alone, are called his instituted worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-chauncy.html">Isaac Chauncy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Hierarchy: or the Divine Right of a Sacred Dominion in Church &amp; Conscience… (London: Crouch, 1681), ch. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>The things which we find not in the Scriptures, how can we use them?</p></blockquote>

</figure><figure class="quote" id="q-f3c7583282" data-kw="">
<blockquote><p>§65. The sum of all that I have said is this, that man may determine of modes and circumstances of worship, necessary and commanded in genere, but not determined by God in specie. But to make new worship-ordinances, or institute sacraments, or sacramental signs, or any thing else, for which in genere he has no commission, this is simply unlawful. §66. But this is not all: There is a second thing unlawful also; and that is the misdetermining of those same modes and circumstances, which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude: 1. That every misordering of such great affairs is the sin of them that do it. 2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 2</cite>, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

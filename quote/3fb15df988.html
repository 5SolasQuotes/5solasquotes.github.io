<main class="wrap"><figure class="quote" id="q-3fb15df988" data-kw="">
<blockquote><p>And let it not seem strange to you, we are not so much to deal with a promise here as with the thing promised, nor to feed on a promise as upon Christ himself by faith, to eat his flesh and drink his blood, This is my body, &amp;c. Christ is the meat here for the hand of faith to receive, the mouth of faith to eat, as he faith, My flesh is meat indeed, and my blood is drink indeed. You may make use of the promises here, the Sacrament is the seal to every promise in the covenant.

But the matter of the Sacrament indeed, and that whereon we are chiefly to feed, is Christ himself. Christ as he is laid out unto us in his death and sufferings, whereon feeding, we get spiritual nourishment for grace, and death of sin. The blood of Christ, like the waters appointed for the trial of jealousy, hath a double property, to kill and to make fruitful; to kill our sins, and make our graces grow; to rot our sins, and ripen our grace.

Well then, remember that the great dish thou feedest on at this Feast, be Christ himself. Thou canst not feed upon a promise, until thou first feed upon Christ; he doth not only give us title and interest in them, but appetite to them. If thou feed on him, thy stomach will be quicker to feed on them; nay, if thou feed on him, thou feedest on all the promises, and hast an interest in all the good of them, the sweet of all the promises is tasted in Christ. All the promises are folded up in Christ, and thou canst not feed on him, but thou feedest on all, and hast the blessing of every one in particular. The promises of justification, sanctification, subduing of corruptions, increase of grace, upholding in grace, interest in glory, they are all of them folded up in Christ, he is all.

The promise doth not, but Christ doth justify, Christ doth sanctify; you get nothing from the promise separate from Christ, but all the good of the promise comes in by Christ, and therefore here terminate your faith. And so much for the second, upon what object we must terminate our Faith.</p></blockquote>

<blockquote><p>Thirdly, it cannot be denied but that the first communicants who received from Christ [at the first Lord’s Supper] might with more ease and conveniency be placed at the table than can be now in many churches which have been accustomed to another way. But we must not bring down our rule to our conveniences; rather, bring up our conveniencies to our rule. It is no hard matter to alter pews and such like things in churches, where the present posture is inconsistent with following the pattern: and a less alteration will serve than is apprehended. Fourthly, the flux and reflux (so to speak) of several successive tables, where there is a great number to communicate, and the repeating, or pronouncing, and applying to those several tables of receivers the words, ‘Take ye, eat ye,’ which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they who so charge us ever make good what they alledge, unlesse they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection (suppose I say, there had been so many communicants) yet He had given them all at once the elements and had said but once, ‘Take ye, eat ye,’ and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not. Fifthly, our dissenting brethren of the Independent way, who dislike our several and successive tables in one congregation, as a dividing of those who ought to communicate all together (for they would have none of the communicants receive the cup [which comes after the bread] before all of the congregation who communicate have received the bread), these brethren, I say, may satisfy themselves from their own principles: For they hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example. If one of their congregations may receive the sacrament in several houses, when (by reason of numerousness) they cannot all receive it together in one house, I cannot conceive why they may not much more allow us several successive tables in the assembly when the whole cannot communicate at one table…</p></blockquote>

<blockquote><p>4thly, Ye may not deny your covenant-engagements; ye may, by no means, deny the covenant you have solemnly sworn. For David gives it as a mark of the man that shall dwell on that high and holy hill; that he is a man that will not swear, nor forswear; he will not break his oath, though it should be to his hurt. So, ye must not deny your covenant, though it should be to your hurt; though it should be to the loss of houses, lands, goods, &amp;c.; yea, and your own life also. It is said, “They like Adam have transgressed the covenant.” Many a time the Lord charges this sin upon the people of Israel by the prophets. Now we must tell you in the name of the Lord this day, that ye should beware of breaking the covenant. In the name and by the authority of the Lord Jesus, we debar and excommunicate all such from the table of the Lord, as are not resolved to adhere to these covenants that the lands are under to the most high God.</p></blockquote>

</figure><figure class="quote" id="q-3f108c9fac" data-kw="">
<blockquote><p>That we really feed in the Holy Supper on the flesh and blood of Christ, no otherwise than as bread and wine are the aliments of our bodies, we freely confess. If a clearer explanation is asked, we say, that the substance of Christ’s flesh and blood is our spiritual life, and that it is communicated to us under the symbols of bread and wine; for Christ, in instituting the mystery of The Supper, promised nothing falsely, nor mocked us with a vain shew, but represented by external signs what he has really given us.

Now the question rests on the mode of communication; and hence the conflict arises, because we refuse to subscribe to their fancy respecting a local presence. We say, that though Christ is in heaven, yet through the hidden and incomprehensible power of his Spirit, this favor comes to us that His flesh becomes life to us, so that we become flesh of his flesh and bones of his bones. (Ephesians 5:30.) By them, on the contrary, it is maintained, that except Christ comes down on earth, there is no participation.

That they may, however, get rid of the absurdity of a local presence, it has been found necessary to fabricate the strange notion of ubiquity; which, if we think it not possible to reconcile to the principles of faith, we must beg them at least to pardon our ignorance. Here we follow not our own understanding; but according to the knowledge given us from above, we cannot comprehend that it is at all agreeable to Scripture to say that the body of Christ is everywhere. Both Christ himself and His Apostles clearly shew that the immensity of God does not belong to the flesh; a personal union is what they teach; and no one, except Eutyches, has hitherto taught, that the two natures became so blended, that when Christ became man, the attributes of Deity were communicated to his human nature.

I am not indeed disposed to raise an odium against them by means of a man who has been condemned; they are yet to be reminded to think more attentively, and to consider how contention leads astray even good, learned, and acute men, when they are led away only by a desire to defend their own cause. Doubtless the best and the shortest way of confronting Nestorius at the Council of Ephesus would have been to say, that personal union communicates to two natures what is peculiar to each: to adduce this no one thought of doing on account of its absolute absurdity. I therefore greatly wonder that they who oppose us do not consider into what labyrinth they plunge themselves.

For if the infinity of God appertains to the flesh of Christ, because God was manifested in the flesh, with equal reason His Divinity may be said to have grieved and to have been thirsty, and to have been subject to death, and, in short, to have died; for they cannot escape, as it is a similar mode of reasoning. Christ, while yet a mortal, declared that He knew not when the day of judgment would be. Does He not in these words clearly and distinctly ascribe something to His human nature which could not justly be ascribed to His Divinity? What they bring forward as to the communication of properties, it is unreasonable, and what I may say without offending them, they mistake in a matter that is very simple and plain; for to ascribe what is peculiar to Deity to the Son of man, and again to attribute to Deity what belongs only to humanity, is very improper and rash.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Book of the Prophet Jeremiah and the Lamentations</cite>, trans. and ed. John Owen (Geneva, 1589) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker Books, 1993), ix, pp xvii-xviii.</span></figcaption>

<blockquote><p>Although we have already in some measure shown how faith possesses Christ, and gives us the enjoyment of his benefits… Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2575e114d8" data-kw="">
<blockquote><p>IV. Problem: Whether the will, both in the first and in the second moment of conversion, is determined by grace immediately, or indeed mediately through the ultimate judgment of the practical intellect? Response: See concerning this question the Appendix to the Disputations on Creation. V. Problem: Whether the affirmative opinion [that the will is determined in conversion only mediately] does not favor Pelagianism, and deny the necessity and efficacy of grace in the will? Response: Negative, because they can nevertheless defend special grace, and that efficaciously prevailing and conquering, which is never rejected or can be rejected by any hard heart, in the composite sense; moreover they attribute nothing of faculty or cooperation for spiritual life to man in the first moment of conversion—as can be seen in [John] Cameron’s disputation with Tilenus, and his apology against the epistle of the anonymous Remonstrant (entitled “The Epistle of a Learned Man,” etc.) afterwards published. VI. Problem: Whether the truth can be more easily, evidently, and solidly explained and defended against the Pelagians by this reasoning? Response: So indeed Cameron, just praised, seems to think, and with him Dr. Maccovius in his Academic Disputations recently published. Yet the ancient and received opinion is not obscurely preferred by Molinaeus in his Disputation on Free Will; Walaeus in his Disputation on the Conversion of the Will, in the year 1622, on the 17th day of March; Ames in his Medulla, and passim in his Anti-Remonstrant writings; and Spanheim, who appeared after the first edition of the present disputation, in his latest writing against Universal Grace. The Dominicans and other genuine Thomists, who today plead the cause of God in this matter against the Jesuits and other more recent Pelagians, do not think alike here—concerning which elsewhere. We touch on this question in the Disputations and Problems on Creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-34237a9c9e" data-kw="">
<blockquote><p>§XII. Conversion is distinguished into first conversion, which is the action of God alone and the giving of new life; and second conversion, which is the act of man gladly accepting virtue and fleeing sin after he has been regenerated by the Spirit (Lam. 5:21; Song of Sol. 1:4). … Controversy 3 – Is man in the first act of regeneration merely passive? We affirm against the Socinians and the Arminians.</p></blockquote>

<blockquote><p>2dly, Regeneration does not only show the wide difference between the two states, the regenerate and unregenerate; but it comes in a different manner upon the regenerate themselves. I say a different manner; for there is no difference in the nature of the thing itself, that is the same in substance, essence, and principle in all who are regenerate: yet there are some circumstances attending regeneration sometimes, wherein one regenerate person may greatly differ from another, even in the first moment of regeneration, e.g. some may be regenerated and converted into higher degrees of grace in the first moment of their conversion, than some others (though as truly regenerate as they) may attain to all their days; all in regeneration do receive one and the same spirit of grace, but not in the same measure. Paul was converted into an eminency in grace; he was never a babe in Christ, but was born a strong man in Christ the very first moment of his conversion. God had present use of Paul; he had designed him for eminent service, which he was immediately to enter upon, and therefore God furnishes him accordingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance</cite>, ... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’, p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

<main class="wrap"><figure class="quote" id="q-1c2ff97c32" data-kw="">
<blockquote><p>The general sense of mankind may be brought as a corroboration of this idea [of descending obligation of public vows]. The debts lawfully contracted by the government of a nation, continue obligatory upon the said nation (if not liquidated) though all the people living when they were contracted, should be extinct. The national debt incurred in the reign of William III. attaches to the British nation at this day, though not one of the persons who constituted the nation, when this debt was contracted, is now alive. If this be denied, there is an end to all national confidence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The obligation of covenants. A discourse</cite>, (Glasgow, 1803), p. 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8896018667" data-kw="">
<blockquote><p>Just as soldiers in formation or in watchtowers are expected to hold their position without flinching and not to desert it treacherously or out of cowardice, so it is with Christians, who are expected to defend the noble rank to which we have been raised by Christ with undaunted faith and strong dedication. Just as in military life, Christians need to remember that they cannot do without constant strength of mind and unflagging vigilance if we are not going to allow ourselves to be dislodged from the position assigned to us. For although Christ has set us free, the remains of our evil nature still cling to us and remain present in our flesh. Because of that, our common enemy, Satan, seizes the opportunity to invade us, and if he sees some people more attracted to the flesh than others, he tries to take them away from the pathway of godliness by showing them the example and enticements of the world, in order to transform their Christian freedom into an unbridled license capable of anything.

Others, though, whom he realizes have not yet abandoned the feeling of godliness and who are still influenced by the terrors of conscience, he tempts with newfangled superstitions under the guise of religion, by which he traps the unwary and takes them away from Christ, in whom alone salvation is found. After all, what would that wicked creature not attempt, when he was not afraid to attack our first parents in paradise? Did he not wage war against Jesus Christ, the eternal Son of God, and attempt to overturn his faith and take him away from the obedience that he owed to the Father of our redemption? The apostle is right therefore to warn us that we must stand fearless and unmoved in that freedom that he has won for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 169-70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-da40032e7d" data-kw="">
<blockquote><p>Mere head knowledge of these virtues of faith, hope, and love is worthless; these virtues must be earnestly put into practice. The kingdom of God is not just a matter of talk but of power (1 Cor. 4:20). Thus, we should not be satisfied with merely knowing the virtues we have so far discussed but should endeavour to exercise them so that they are manifest in our actions. Likewise, someone is not justified because he can eloquently describe the doctrine of justification, but because he persistently proves his faith by his good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/godefridus-udemans.html">Godefridus Udemans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Faith, Hope, and Love</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke (1621; Grand Rapids MI: Reformation Heritage Books, 2012), p. 36.</span></figcaption>

<blockquote><p>16. All persons living in the Province who confess and acknowledge the one Almighty and Eternal God, and holds themselves obliged in conscience to live peaceably and quietly in a civil society, shall in no way be molested or prejudged for their religious persuasions and exercise in matters of faith and worship… Yet it is also hereby provided, that no man shall be admitted a member of the great or common Council, or any other place of public trust, who shall not [sic] profaith in in Christ Jesus, and solemnly declare that he does no ways hold himself obliged in conscience to endeavor alteration in the government… Nor by this article is it intended, that any under the notion of this liberty shall allow themselves to avow atheism, irreligiousness, or to practice cursing, swearing, drunkenness, prophaneness, whoring, adultery, murdering or any kind of violence… … 20. That all marriages nor forbidden in the law of God, shall be esteemed lawful…</p></blockquote>

ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1c7f1ad299" data-kw="">
<blockquote><p>Magistracy (saith he, p. 135.) is a power ordained of God, an Image of the power and judgement committed to Christ; Scripture and the gift of wisdom, justice and righteousness, are his unction now. Page 138. They are set up more specially to minister peace and judgement to Gods people in the flesh.

Then Nero, the great Turk, the Indian Kings, being ordained of God, Rom. 3.1. as the image of Christ, must be his submediators and under Deputies, little spiritual Kings, and Prophets, and Priests under Christ as Mediator. And who gave the Scriptures, the Law, written Gospel, and such an unction to the Indian Kings? for they are Magistrates. The man cannot speak of Christian Magistrates; for Rom. 13. which he citeth, speaketh of Nero, whose head was dry from all unction of the Gospel, or new Testament.

If the Magistrate be an Image of Christ’s power, and that power committed to him; they may under the Mediator Christ, ministerially judge of the doctrine preached by Ministers, if true or false. And if they be set up to minister justice more specially to God’s people in the flesh; then the people of God in the Spirit, and in all Spirit, as Saltmarsh saith most of them all are, shall be under no Magistrate; but this he saith of all, page 288, 293, 200, 201, 202, &amp;c. And by this every Magistrate must be a Christian of an image of the Mediator’s power; or then no Christian, or spiritual man can be a Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.21, pp 215-16.</span></figcaption>

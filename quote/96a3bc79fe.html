<main class="wrap"><figure class="quote" id="q-96a3bc79fe" data-kw="">
<blockquote><p>He was above any obligation to that work he so freely undertook for us. When he made himself of no reputation, it was a work of his charity, not of necessity; and he was bound in no other bonds but those of his own love. Nor could he be overruled to anything against his own consent; for being ‘God equal with the Father,’ Philip. ii. 6, he was subject to no law, nor could be constrained to bend under the terms and penalties of it. Christ as the second person was not under a law any more than the Father; for he was ‘in the form of God,’ i. e. had the same essence with God.

Suppose he had been incarnate without entering into any bonds for us, though so far as he was man he was bound actively to obey the precepts of the law, yet not bound to endure the penalties of the law, unless he had been a transgressor of the precept: he was to have obeyed it as a creature, but not suffer the curse, unless he had been a guilty creature.

But he was not only made under the law, as an innocent creature, but ‘in the likeness of sinful flesh,’ Rom. viii. 8, as like as possible could be, sin only excepted; and therefore observed those ceremonial precepts which concerned creatures as sinful: as circumcision, though he had no lust in his human nature to be cut off, and baptism, though he had no stain to be washed away.

And indeed, as he was not, so he could not be a transgressor, being secured by his conception from any original taint, and by the hypostatical union from any actual spot. If he could possibly have been a transgressor, the salvation of the elect had been contingent. Being a creature, of the seed of the woman, he may be supposed to be under the condition of the covenant of nature; yet not violating that covenant, he could not justly die for himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Voluntariness of Christ’s Death</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 549.</span></figcaption>

<blockquote><p>Position 6. Grace is not educed or extracted out of the potency of any created nature. Grace is born in heaven and came from the inmost of the heart of Christ; it has neither seed nor parent on earth; therefore the Lord challenges it as his own, 2 Cor. 12.9, ‘The Lord said unto me, My grace is sufficient for thee.’ 2 Tim. 2:1, ‘The grace that is in Christ Jesus.’ 1 Cor. 15:10, ‘The grace of God.’ 2 Cor. 13:14, ‘The grace of the Lord Jesus Christ.’ Gal. 1:15, ‘He called me by his grace.’ If we could engage the grace of God, or prevent it [come before it], then should grace be our birth; but grace is not essential to angels. It’s a doubt if any creature can be capable by nature of any possibility-natural not to sin; it is much to know the just owner of grace who begot it? It came out of the eternal womb and bowels of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 239</span></figcaption>

</figure><figure class="quote" id="q-f9a43e0148" data-kw="">
<blockquote><p>Of the knowledge of Christ, there be two parts, the first concerning his person, the second concerning his office. The person of Christ, is one, because Christ is one. Of the knowledge of Christ’s person, there be two parts: the first concerning the natures in the person of Christ, the other concerning his state.

There are two natures in the person of Christ, the divine, and the human nature. Therefore Jesus Christ is true God, and true man in one person. Rom. 1.3.4. and 9.5. 1. John. 4.2. 1. Timot. 3.16. Coloss. 2.9. Heb. 2.14.16. John. 1.1.

Thus far concerning the natures in the person of Christ: now concerning his state.

The state of Christ’s person is two fold: his humiliation, or exaltation. Phil. 2.7.8.9. Luke. 24.26. The humiliation of Christ is that state of his, in which he did abase himself below all creatures. Phil. 2.7.

Of his humiliation there are two parts? his incarnation, and obedience. The incarnation of Christ, is part of the humiliation of the son of God, when taking the human nature, he was manifested in the flesh. John. 1.14. 1. Tim. 3.16. The parts of the incarnation of Christ, are both his conception by the holy spirit, and the personal union of his two natures, and also his birth. The conception of Christ by the holy spirit, is the forming of the human nature of Christ, of the flesh and blood of the virgin Mary, by the miraculous working of the holy spirit. Mat. 1.18.20. Luke. 1.31.35.

The personal union of the two natures in Christ, is such a coupling of them as they might be one person. 1. Tim. 3.16. Coloss. 2.9. Gal. 4.4. Heb. 2.16. In this personal union, both the distinction of the two natures is to be considered, and also the effects of the union. In the personal union, the natures remain distinct, and not confused, whether we respect their essence, or the properties, or operations. Rom. 1.3.4. and 9.5. 1. Tim. 9.16. Heb. 9.14. 1. Pet. 3.18. and 4.1.

As therefore in that one person of Christ there be two natures: so there is a double mind, or understanding a double will, working, wisdom, strength, power, virtue, and so forth. The one heavenly and not created: the other human, and created. Luke. 2.52. Mar. 11.13. and 13.32. 1. John. 2.1.17. John. 2.25. and 6.64. and 5.20. Heb. 1.9. John. 1.33. and 4.6. Heb. 1.3. John. 2.19. and 10.18.

And each of the natures retaineth and keepeth his own essential properties, neither doth it communicate them, to the other nature, and that for two causes: the first is, least the natures should be mingled and confounded: the other, that there might forever remain a difference between the natures. Luke. 24.39. For he that confoundeth the properties, confoundeth the natures: and he that taketh away the properties, taketh away the natures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 64-66.</span></figcaption>

</figure><figure class="quote" id="q-5c94c56ae3" data-kw="">
<blockquote><p>For like as by one man sin hath entered into the world (as the Apostle saith to the Rom. cap. 5.) and by sin death, and so death hath passed upon all men, in as much as all have sinned: and as by the disobedience of one man many are made sinners: so by the obedience of one many are made righteous. Also, if by the sin of that one many are dead, much more the grace of God, and the gift through grace, which is of one man Jesus Christ, hath abounded towards many.

Wherefore Christ must be very man both in soul &amp; body, who by obedience even to death, and to the death of the cross, might satisfy the unchangeable righteousness of God, who would not punish that in Angels, because men had sinned, but in the very nature of man, therefore the son of God took not Angels, but the seed of Abraham, that is, the very nature of man of the seed of the Abraham. Heb. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), p. 141.</span></figcaption>

</figure><figure class="quote" id="q-4cc857019a" data-kw="">
<blockquote><p>It is the love of a Divine Person in human nature. The body which was prepared for him was animated, not by his divine nature, but by a human soul, and in this body he was to make his love effectual by means of all the inward affections, as well as external actions which were peculiar and proper to it. His human nature was furnished immeasurably with all grace, and especially with love, pity, and compassion to fallen and lost men.

There was a universal love, or benevolence, exerted in doing good to all within his reach, and in loving and forgiving his enemies, which was the soul of his obedience, and the fulfilling of the law. But there was also in his human soul a peculiar love to those who were given him by the Father, which exerted itself in strong, fervent, and irrepressible desires for their salvation, and which urged him on, and gave him no rest, until he had completed it by “giving himself an offering and a sacrifice of a sweet-smelling savour to God.” “I have a baptism to be baptized with, and how am I straitened till it be accomplished.” “With desire have I desired to eat this passover with you before I suffer.”

So strong did the manifestations of this desire become as the hour of its consummation approached, that the disciples, and especially those that were with him in the garden, might have said, in the language of Naomi, “The man will not be in rest, until he have finished the thing this day.” Now, in meditating on the love of Christ, we are not to confine our thoughts to the eternal actings of his divine nature (for all the acts of his love, as God, must be eternal), but are to take into view also its temporal acting in the human nature.

In undertaking our cause from everlasting, and in becoming man, the love of the divine nature only was displayed; but subsequently to the incarnation there was a concurrence of the two natures in the expression of love, and though the acts of love in these two natures were infinitely distinct, yet, in virtue of the hypostatical union, they were acts of one and the same person. If the bodily actions of Christ were the acts of his divine person, surely his mental acts were so also; if the act of laying down his life, so also the cheerfulness and delight with which he made the sacrifice, from regard to his Father’s glory, and from love to sinners. “God purchased the Church with his own blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ in Sermons</cite></span></figcaption>

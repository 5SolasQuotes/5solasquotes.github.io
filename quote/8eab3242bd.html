<main class="wrap"><figure class="quote" id="q-8eab3242bd" data-kw="">
<blockquote><p>Therefore, let this remain as a most sure maxim, that no doctrine is worthy to be believed but that which we find to be grounded in the Scriptures. The Pope will have all that received without any more ado, whatsoever he doth blunder out at his pleasure; but shall he be preferred before Paul, concerning whose preaching it was lawful for the disciples to make inquisition?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 17:11</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>The cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 3</span></figcaption>

</figure><figure class="quote" id="q-64ef925976" data-kw="infallibility of the church">
<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>

</figure><figure class="quote" id="q-d4bd5dd7bb" data-kw="">
<blockquote><p>The Bereans are praised for not rashly and hastily receiving whatever Paul taught them, but diligently examining his doctrine by scripture. Whence we draw two inferences: First, that all doctrine is to be judged by the scriptures. For, if the Bereans compared the preaching of an apostle with the rule of scripture, shall we embrace without any examination whatever the pope may please to maintain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 8 (p. 457)</span></figcaption>

</figure><figure class="quote" id="q-bcd19810e0" data-kw="">

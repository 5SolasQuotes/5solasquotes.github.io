<main class="wrap"><figure class="quote" id="q-3bba617e92" data-kw="">
<blockquote><p>It is said, Christ is our righteousness, because He satisfied the Father for us, and that satisfaction, when He justifies us, is given and communicated to us in such a way that it can be said to be our satisfaction and righteousness. For even if we are truly and rightly called and are righteous by inherent righteousness, yet we do not satisfy God for our sins and eternal punishment by it. But that inherent righteousness comes with the remission of sin and eternal punishment, the effect of Christ’s satisfaction, which is conferred and applied to us in justification. And in this way it would not be absurd if someone said that the merits of Christ are imputed to us, when they are given and applied to us, as if we ourselves satisfied God; provided that it is not denied that there is in us also an inherent righteousness, which is true and absolute righteousness, which is not liable to punishment but to glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIV. To this are added what the same book adds in chapter 10, Response to the first argument:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b720f9b69" data-kw="">

</figure><figure class="quote" id="q-9def8be007" data-kw="">

<blockquote><p>…faith is the beginning and root of all gospel righteousness, without which no virtue contributing to salvation can exist in a man, and which therefore, if it be not impeded, will attract all other virtues to it, so that Paul, when he expresses all the obedience described in the gospel under the name of faith, speaks in the same manner as the Latin writers do when they use hearing for obeying, as in Terence: “Shall I assist Pamphilus, or listen to the old man?” which figure is called the metonymy of the antecedent for the consequent;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-bull.html">George Bull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Harmonia Apostolica</cite>, … tr. Thomas Wilkinson (1669-1670; London: Rivington, 1801) 320 pp. ToC, p. 95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

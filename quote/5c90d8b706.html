<blockquote><p>We are justified not without works yet not through works, since in our sharing in Christ, which justifies us, [progressive] sanctification is just as much included as [imputed] righteousness.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04f7e630cc" data-kw="">
<blockquote><p>At last, by the mercy of God, meditating day and night, I gave heed to the context of the words, namely, “In it the righteousness of God is revealed, as it is written, ‘He who through faith is righteous shall live.’” There I began to understand that the righteousness of God is that by which the righteous lives by a gift of God, namely by faith. And this is the meaning: the righteousness of God is revealed in the gospel, namely, the passive righteousness with which merciful God justifies us by faith, as it is written, “He who through faith is righteous shall live.” Here I felt that I was altogether born again and had entered paradise itself through open gates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the Complete Edition of Luther’s Latin Writings</cite>, 1545</span></figcaption>

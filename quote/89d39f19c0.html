<main class="wrap"><figure class="quote" id="q-89d39f19c0" data-kw="">
<blockquote><p>For my yoke is easy, and my burden is light.”—Matt. xi. 30.

Yes, brethren, it is so! These are the words of the faithful and true Witness. His yoke is easy, and His burden is light; but in a sense different from that in which it is generally understood by the world. This is one of the declarations of Scripture that is apt to be perverted and misapplied by men, who would make the requirements of Christ easy, by bringing them down to the level of their own natural capacities or sinful inclinations. With unscriptural and superficial views of the nature and extent of Christian obedience, they would employ the language which was designed to soothe and comfort the faint but still pursuing disciple, to extenuate their love of the world, to excuse their sloth and self-indulgence, or even to justify their carelessness and sin.

Here, says the cold and formal professor, whose name is enrolled among the friends of Christ, but whose heart is with the world—here is the text for me. Let men speak as they may about the difficulties, conflicts and trials of the Christian life, I have found none of them. According to the representation of its author himself, religion, even such a religion as He enjoins, is at once easy and pleasant. Christ makes no exorbitant demands upon his followers. He imposes no heavy restraints. There is no undue strictness in his prohibitions or commands. Although, therefore, I make no great sacrifice of personal ease or present enjoyment, and have no pretensions to goodness above my neighbours, I may surely hope that I shall not be disowned by him, who Himself declares, that His yoke is easy, and his burden light. Thus does a gay and an unthinking world construct for themselves a cross of amber—a light and ornamental material which they may almost unconsciously carry about with them, and which, while it indicates profession, neither reminds them of suffering, nor burdens them with its weight.

But look again into the Bible. In every page we see evidence fitted to undeceive those who have taken up such an impression of what it is to be a Christian. Is not the first lesson, which every disciple in the school of Christ must learn, to deny himself and take up his cross and follow his master? When he has made his entrance upon the Christian course, is he not taught to expect that not only strait shall be the gate, but that narrow shall continue to be the way that leadeth unto life? Are not the diligence and laborious perseverance of the husbandman—the watchfulness and vigour of the soldier—the strenuous efforts of the racer, animated by the surrounding spectators, and cheered with the prospect of the prize—are not these some of the emblems employed in Scripture to represent the carefulness and assiduity demanded of every follower of Jesus?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macfarlane.html">John MacFarlane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ s Yoke Easy to the Subjects of His Kingdom’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Our Covenanting forefathers were eminently honoured to contend for the crown-rights of the Redeemer. In their national vows, they plighted the allegiance of the nation to Him – and by those federal deeds, rulers and people were taken bound to consult for the promotion of Christ’s honour, and the interests of true religion, above any worldly interests. The laws passed in the reforming period in Britain were the embodiment of the grand fundamental principles of the Redeemer’s kingdom; and for a brief period, like a gleam of bright sunshine in the history of the nation, the doctrine was generally proclaimed, and widely respected, that Christ Jesus should reign supreme in his own house, and among his people, and that earthly rulers should yield Him all homage and subjection.</p></blockquote>

</figure><figure class="quote" id="q-af45488cdb" data-kw="">
<blockquote><p>Now let us consider “when” this exaltation occurs: when “peoples flow to it,” saying, Let us go up to the mountain of God, that he may teach us his ways and we may walk in his paths [Micah 4:1-2]. Micah’s intention in saying that peoples shall flow to it, is to show there is a great difference between the Church that was under the Law, and the Church that will exist at the coming and manifestation of our Lord Jesus Christ. For in Micah’s time, there was only one nation whom God had chosen; only Abraham’s children had been elected to hear the doctrine of salvation. It was to them alone in particular that God had said: “I am [the Lord] you God, who has brought you out of the land of Egypt” [Exodus 20:2]. That is why he was called in those days “the God of Abraham, of Isaac, and of Jacob” [Exodus 3:6]. But now Micah says that God will sound a trumpet that will be heard to the ends of the earth, just as Psalm 2 declared that Jesus Christ has been consecrated King and Lord of all, and that his Father has bestowed the entire earth, from the rising to the setting of the sun, on him as his posterity [Psalm 2:7-9]. That is the dignity that is entailed in Micah’s declaration that all peoples shall come together on the mountain of Zion, at the house of God [Micah 4:2].

Now this results in an important affirmation of our faith. For we can see how patient God was in calling us to a knowledge of the Gospel. For our fathers were poor pagans, without a covenant with God. They were estranged from his Church. The promises of salvation completely excluded them, as Saint Paul points out in Ephesians 2[:11-12]. Yet, today, we are united with Abraham and his lineage; we have been grafted into the people of God. How did that come about? Through the Gospel. Now, if this had happened, or had come about, without God having prophesied that it would, we could say: “Ah! it happened by chance!” But when we hear that it was proclaimed from of old, that is a true boost to our faith. For God, desirous of a special people among whom his Law might be preached, nonetheless proclaimed that a time would come when the doctrine of salvation would be revealed to all the world; that peoples would flow to it; that a true amity and understanding of faith would exist; that peoples formerly dispersed and separated from each other by great distances would unite together; and that wherever walls had kept them apart, those walls would come down.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now let us consider “when” this exaltation occurs: when “peoples flow to it,” saying, Let us go up to the mountain of God, that he may teach us his ways and we may walk in his paths [Micah 4:1-2]. Micah’s intention in saying that peoples shall flow to it, is to show there is a great difference between the Church that was under the Law, and the Church that will exist at the coming and manifestation of our Lord Jesus Christ. For in Micah’s time, there was only one nation whom God had chosen; only Abraham’s children had been elected to hear the doctrine of salvation. It was to them alone in particular that God had said: “I am [the Lord] you God, who has brought you out of the land of Egypt” [Exodus 20:2]. That is why he was called in those days “the God of Abraham, of Isaac, and of Jacob” [Exodus 3:6]. But now Micah says that God will sound a trumpet that will be heard to the ends of the earth, just as Psalm 2 declared that Jesus Christ has been consecrated King and Lord of all, and that his Father has bestowed the entire earth, from the rising to the setting of the sun, on him as his posterity [Psalm 2:7-9]. That is the dignity that is entailed in Micah’s declaration that all peoples shall come together on the mountain of Zion, at the house of God [Micah 4:2].

Now this results in an important affirmation of our faith. For we can see how patient God was in calling us to a knowledge of the Gospel. For our fathers were poor pagans, without a covenant with God. They were estranged from his Church. The promises of salvation completely excluded them, as Saint Paul points out in Ephesians 2[:11-12]. Yet, today, we are united with Abraham and his lineage; we have been grafted into the people of God. How did that come about? Through the Gospel. Now, if this had happened, or had come about, without God having prophesied that it would, we could say: “Ah! it happened by chance!” But when we hear that it was proclaimed from of old, that is a true boost to our faith. For God, desirous of a special people among whom his Law might be preached, nonetheless proclaimed that a time would come when the doctrine of salvation would be revealed to all the world; that peoples would flow to it; that a true amity and understanding of faith would exist; that peoples formerly dispersed and separated from each other by great distances would unite together; and that wherever walls had kept them apart, those walls would come down.”

— John Calvin, Sermons on the book of Micah, trans. and ed. B. W. Farley (1551; Phillipsburg, 2003), pp 193-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+let+us+consider+%E2%80%9Cwhen%E2%80%9D+this+exaltation+occurs%3A+when+%E2%80%9Cpeoples+flow+to+it%2C%E2%80%9D+saying%2C+Let+us+go+up+to+the+mountain+of+God%2C+that+he+may+teach+us+his+ways+and+we+may+walk+in+his+paths+%5BMicah+4%3A1-2%5D.+Micah%E2%80%99s+intention+in+saying+that+peoples+shall+flow+to+it%2C+is+to+show+there+is+a+great+difference+between+the+Church+that+was+under+the+Law%2C+and+the+Church+that+will+exist+at+the+coming+and+manifestation+of+our+Lord+Jesus+Christ.+For+in+Micah%E2%80%99s+time%2C+there+was+only+one+nation+whom+God+had+chosen%3B+only+Abraham%E2%80%99s+children+had+been+elected+to+hear+the+doctrine+of+salvation.+It+was+to+them+alone+in+particular+that+God+had+said%3A+%E2%80%9CI+am+%5Bthe+Lord%5D+you+God%2C+who+has+brought+you+out+of+the+land+of+Egypt%E2%80%9D+%5BExodus+20%3A2%5D.+That+is+why+he+was+called+in+those+days+%E2%80%9Cthe+God+of+Abraham%2C+of+Isaac%2C+and+of+Jacob%E2%80%9D+%5BExodus+3%3A6%5D.+But+now+Micah+says+that+God+will+sound+a+trumpet+that+will+be+heard+to+the+ends+of+the+earth%2C+just+as+Psalm+2+declared+that+Jesus+Christ+has+been+consecrated+King+and+Lord+of+all%2C+and+that+his+Father+has+bestowed+the+entire+earth%2C+from+the+rising+to+the+setting+of+the+sun%2C+on+him+as+his+posterity+%5BPsalm+2%3A7-9%5D.+That+is+the+dignity+that+is+entailed+in+Micah%E2%80%99s+declaration+that+all+peoples+shall+come+together+on+the+mountain+of+Zion%2C+at+the+house+of+God+%5BMicah+4%3A2%5D.%0A%0ANow+this+results+in+an+important+affirmation+of+our+faith.+For+we+can+see+how+patient+God+was+in+calling+us+to+a+knowledge+of+the+Gospel.+For+our+fathers+were+poor+pagans%2C+without+a+covenant+with+God.+They+were+estranged+from+his+Church.+The+promises+of+salvation+completely+excluded+them%2C+as+Saint+Paul+points+out+in+Ephesians+2%5B%3A11-12%5D.+Yet%2C+today%2C+we+are+united+with+Abraham+and+his+lineage%3B+we+have+been+grafted+into+the+people+of+God.+How+did+that+come+about%3F+Through+the+Gospel.+Now%2C+if+this+had+happened%2C+or+had+come+about%2C+without+God+having+prophesied+that+it+would%2C+we+could+say%3A+%E2%80%9CAh%21+it+happened+by+chance%21%E2%80%9D+But+when+we+hear+that+it+was+proclaimed+from+of+old%2C+that+is+a+true+boost+to+our+faith.+For+God%2C+desirous+of+a+special+people+among+whom+his+Law+might+be+preached%2C+nonetheless+proclaimed+that+a+time+would+come+when+the+doctrine+of+salvation+would+be+revealed+to+all+the+world%3B+that+peoples+would+flow+to+it%3B+that+a+true+amity+and+understanding+of+faith+would+exist%3B+that+peoples+formerly+dispersed+and+separated+from+each+other+by+great+distances+would+unite+together%3B+and+that+wherever+walls+had+kept+them+apart%2C+those+walls+would+come+down.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Sermons+on+the+book+of+Micah%2C+trans.+and+ed.+B.+W.+Farley+%281551%3B+Phillipsburg%2C+2003%29%2C+pp+193-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf45488cdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af45488cdb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/07/17/john-calvin-on-the-international-nature-of-the-gospel/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

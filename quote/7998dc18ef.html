<main class="wrap"><figure class="quote" id="q-7998dc18ef" data-kw="">
<blockquote><p>It is asserted in the first chapter of this Confession, and vindicated in this exposition, that the Scriptures of the Old and New Testaments, having been given by inspiration of God, are, for man in his present state, the only and the all-sufficient rule of faith and practice. All that man is to believe concerning God, and the entire duty which God requires of man, are revealed therein, and are to be believed and obeyed because contained therein, because it is the Word of God. This Divine Word, therefore, is the only standard of doctrine which has intrinsic authority binding the conscience of men. And all other standards are of value or authority only in proportion as they teach what the Scriptures teach.

While, however, the Scriptures are from God, the understanding of them belongs to the part of men. Men must interpret to the best of their ability each particular part of Scripture separately, and then combine all that the Scriptures teach upon every subject into a consistent whole, and then adjust their teachings upon different subjects in mutual consistency as parts of a harmonious system. Every student of the Bible must do this; and all make it obvious that they do it, by the terms they use in their prayers and religious discourse, whether they admit or deny the propriety of human creeds and confessions.

If they refuse the assistance afforded by the statements of doctrine slowly elaborated and defined by the Church, they must make out their own creed by their own unaided wisdom. The real question is not, as often pretended, between the Word of God and the creed of man, but between the tried and proved faith of the collective body of God’s people, and the private judgment and the unassisted wisdom of the repudiator of creeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 1-2.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ccc9b4c4f" data-kw="">
<blockquote><p>The particle wde, ‘here’, if referred to time, notes during Moses’s economy, while the Levitical law lasted; if it refer to place, it notes Jerusalem in the land of Canaan, where the temple was: in that habitation of the Israelitish church the Levitical priests were not only as to their nature and persons withering and decaying, ceasing to be on earth, though they had the honor to decimate their brethren, but as to their order and office, mortal, they were no better than the tithed and blessed by them, in prospect of death. Aaron himself, the first of the order, died, and so did all his successors, as well as Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, On Mt. 23:23</span></figcaption>

<blockquote><p>The ritual of Calvinism, like its creed, was founded, therefore, on the theory of a simple return to the scriptural and primitive pattern. Differing from the systems of Luther and [the English] Cranmer, it lost sight completely of all practices which had originated in a less remote antiquity; it left the missal and the breviary [Romanist responsive, liturgical books] among the rubbish of ‘idolatrous gear’ swept out from its renovated churches; refusing to tamper with the complications of a corrupt ceremonial, whose forms had long enough weighed upon and wearied the souls of men. It went back for authority and inspiration to the law and to the testimony of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/switzerland-geneva.html">Charles Baird</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eutaxia</cite></span></figcaption>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London, 1649), pp. 372-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>XX. The absolution committed to the ministers of the gospel is not judicial, such as belongs to a judge or lord; but ministerial, such as is partly by the preaching of the gospel (which consists in remission of this kind) or by his heralding or ministry of it, and in the exercise of ecclesiastical discipline, as it is subordinated to that preaching of the gospel (which is none other than that declaration by which he who was before leprous is declared clean); or such as belongs to a herald, who officially announces the favor of the magistrate to anyone. Nor does the power of the keys involve anything else because they are not the principal keys of the Lord (which are ascribed to Christ alone, Rev. 1:18; 3:7), but ministerial, such as belong to stewards and doorkeepers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, Q. 31, ‘The Five False Sacraments of the Romanists, p. 554</span></figcaption>

<main class="wrap"><figure class="quote" id="q-63a58dff47" data-kw="">
<blockquote><p>[A] good man is a man of piety and devotedness. Piety, including in that expression reverence towards God, and love to him, is an essential part of real goodness, insomuch that good men are characterised in Scripture as those who fear the Lord, who love God, who seek him, who wait upon him, whose fellowship is with the Father and with his Son Jesus Christ. The language of the saints, as recorded in the Word of God, is expressive of the most fervent piety, of the profoundest reverence for God, and holy joy in fellowship and communion with him.

When we reflect seriously upon the subject, it seems almost incredible that any intelligent man should presume to separate a pious and devout spirit from the other parts of a truly Christian character. Who can deny that it is one of the first duties of man to love God, and to seek to please him? He is the all-perfect Jehovah, infinitely worthy of our love. He is the fountain of our being, and the source of all our happiness; we are under the strongest obligations to love, and fear, and serve him.

There is no alternative between the obligation to do so and Atheism. If we confess that he is, and that he is what he has revealed himself to be, we virtually declare that we are bound to love him supremely, and to serve him faithfully—bound to give him the chief place in our hearts, and to glorify him in our bodies and with our spirits, which are his.

If it be our duty to love and honour our fellow-men, much more is it our duty to love and honour God. They are our brethren, members of the same family, servants of the same master. He is our Father in heaven, our guardian, and guide, and unwearied benefactor. The purest of our fellow-men are polluted and imperfect. God is immaculate and infinitely holy; he is perfectly righteous and good. To love the Lord our God with all our heart, and soul, and mind, is the first and great commandment. Destitute of piety, we are destitute of one of the essential and most important ingredients of moral excellence.

This will appear still more evident if we consider that where there is no piety, the opposite dispositions must have the ascendancy in our souls. If we do not love God, we must be at enmity with him; if we do not fear and honour him, we must be living in rebellion against him. Between loving and hating God, between fearing and despising him, there is no middle space. …

Hence the desire of an irreligious man to exclude devoutness of spirit and life from the constituent parts of true goodness or moral excellence—the cold or the unfriendly eye with which he regards the ordinances of public and family worship—the reluctance with which he engages in these exercises, and the coldness of his heart when he professes to draw near to God. It is not so with a truly good man. He has been taught of God to approve the things that are excellent; he has been taught to know God, and in some measure to love him. He meditates with delight on his character and works; he is afraid of offending him, and finds his chief enjoyment in serving him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-macfarlan.html">Patrick MacFarlan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Goodness in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>The book of Proverbs is the best of all manuals for the formation of a well-balanced mind. The object of Solomon in composing it seems to have been to furnish to the church a summary of rules and maxims by which the Christian character, having been originated by regeneration, should then be educated and made symmetrical. We do not, therefore, go to this portion of Scripture so much for full and definite statements of the distinguishing doctrines of revealed religion, as for those wise and prudential canons whereby we may reform extravagance, prune down luxuriance, and combine the whole variety of traits and qualities into a harmonious and beautiful unity.

We do not find in this part of the Bible careful and minute specifications of the doctrine of the trinity, of the apostasy of mankind, of the incarnation of the Son of God, of vicarious atonement, regeneration and justification. They are hinted at, it is true—as when the Eternal Wisdom is spoken of as being with the Lord ” in the beginning of his way, before his works of old; as one brought up with him, daily his delight, and rejoicing always before him.” (Pro v. viii. 22, 30.) Here we have the same doctrine, germinally, with that of the Apostle John, when he affirms that the Eternal Word, or Reason, “in the beginning was with God, and was God.” And what are such assertions, as that “there is not a just man upon earth that doeth good and sinneth not” (Eccl. vii. 20), and such questions as, “Who can say, I have made my heart clean, I am pure from my sin”? (Prov. xx. 9), but an indirect statement of the doctrine of human depravity?

Still it is not the main purpose of Solomon, in those two books of the inspired canon which go under the name of Proverbs and Ecclesiastes, to particularly enunciate the evangelical system; but rather to set forth those principles of ethics, and religious prudence, which must always follow in the train of evangelical religion. It is reserved for other portions of the Bible—for the Gospels and the Epistles—to make the fundamental statements, and lay the foundations of Christian character; while it remains for the wise Preacher to follow up with those teachings which serve to develop and beautify it.

The book of revelation is, in this way, like the book of nature. The scientific naturalist does not claim that everything in nature is upon a dead level in respect to intrinsic worth and importance—that a bit of charcoal is just as valuable as a bit of diamond; that a lily is just as high up the scale of creation as a man. But he does claim that one is as much the work of creative power as the other, and in its own sphere and place is as indispensable to the great sum total of creation as is the other. And so, too, the scientific theologian does not claim that everything in the Bible is upon a dead level in respect to intrinsic value—that the book of Esther is as important for purposes of regeneration and conversion as is the Epistle to the Romans—but he does claim that both alike are the product of Divine inspiration; that both alike are a portion of that Word of God, that sum-total of revealed truth upon which, as a whole, the kingdom of God in the earth is to be founded and built up.

Had the book of Esther been lost out of the canon, it would not have been so great a detriment to the church as the loss of the Gospel of John, or of the Epistle to the Romans. If the missionary were allowed to carry only a single fragment of Scripture into a heathen population, and were compelled to make his choice between the book of Proverbs or the Gospel of St. Matthew, he would undoubtedly select the latter. Not, however, because one is less trustworthy than the other; but because one contains more of the doctrinal material which the missionary employs in laying the foundation of the church; because it gives more information concerning the Lord Jesus Christ and the way of salvation than does the other.

The book of Proverbs, as we have remarked, was composed not so much for the purpose of originating a holy character, as of shaping and polishing it; and for this purpose it is indispensable, and for this purpose it was inspired. And hence in missionary fields, as well as in the church at large, the wise maxims and well-grounded ethics of Solomon will always follow up the evangelical truths and doctrines of the Apostle John, and the Apostle Paul.</p></blockquote>

el+of+St.+Matthew%2C+he+would+undoubtedly+select+the+latter.+Not%2C+however%2C+because+one+is+less+trustworthy+than+the+other%3B+but+because+one+contains+more+of+the+doctrinal+material+which+the+missionary+employs+in+laying+the+foundation+of+the+church%3B+because+it+gives+more+information+concerning+the+Lord+Jesus+Christ+and+the+way+of+salvation+than+does+the+other.%0A%0AThe+book+of+Proverbs%2C+as+we+have+remarked%2C+was+composed+not+so+much+for+the+purpose+of+originating+a+holy+character%2C+as+of+shaping+and+polishing+it%3B+and+for+this+purpose+it+is+indispensable%2C+and+for+this+purpose+it+was+inspired.+And+hence+in+missionary+fields%2C+as+well+as+in+the+church+at+large%2C+the+wise+maxims+and+well-grounded+ethics+of+Solomon+will+always+follow+up+the+evangelical+truths+and+doctrines+of+the+Apostle+John%2C+and+the+Apostle+Paul.%E2%80%9D%0A%0A%E2%80%94+William+G.T.+Shedd%2C+Letter+to+the+Spiritual+Man+%28New+York%3A+Charles+Scribner%E2%80%99s+Sons%2C+1884%29%2C+pp+19-21.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66d6abf43e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66d6abf43e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/29/w-g-t-shedd-on-the-book-of-proverbs-and-the-formation-of-christian-character/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ad754e980a" data-kw="">

</figure><figure class="quote" id="q-73a9ff7cc5" data-kw="invisible church">
<blockquote><p>That the statement of this most vexed question may be rightly exhibited, the origin of the controversy must be inquired into. The Romanists suppose that the church was called invisible by us in order to satisfy the question asked of us by them—where our church was before Luther. Since we could not show that our church was perpetually visible in the world, we excogitated this distinction—that the visible church is one thing, the invisible another. But they interpret our opinion falsely. For even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>

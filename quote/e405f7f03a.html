<main class="wrap"><figure class="quote" id="q-e405f7f03a" data-kw="">
<blockquote><p>For God in his mercy has permitted the powers of the intellect to remain, though differing greatly from what was in man before the fall. God commands us to cultivate our natural talents, and meanwhile adds both gifts and success. And it is obvious that we make no progress in all the arts without God’s blessing. In any case, Scripture refers all the arts to God; and, indeed, the heathen trace the origin of the arts to the gods who invented them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, (1566), ch. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6cc5c79311" data-kw="">
<blockquote><p>XIV. The efficacy of this instrument, and its entire power in producing the effect, depends on the Holy Spirit and his interior operation in the soul (Acts 16:14). It gives to this vocation its formal character, by which it is distinguished from that general call which is common even to the reprobate, so much so that if the Spirit of God did nothing more here than there, it would not be efficacious, but would be vain for salvation (2 Pet. 1:3).

XV. Just as, on the contrary, if He should operate here as He is accustomed to do in the conversion of the elect (for even in the reprobate He is often efficacious in some manner and degree) (Mt. 13:20), the effect would necessarily exist, and the man would necessarily be brought to obedience and to a new life in Christ (Jn. 6:44-45).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-710314ac0a" data-kw="">
<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Therapeutica Sacra</cite>, Book 1, Chapter 6</span></figcaption>

</figure><figure class="quote" id="q-9f715a8a9e" data-kw="">
<blockquote><p>God made man upright, gave him a righteous law, which, when broken, that all hopes might not be cut off, He sent his Son: Rom. 8:3, ‘God sending his own Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh,’ to be the foundation of a new covenant; offered you grace in Him, pardon of all your sins past, to help you in the course of obedience for time to come; moved you by powerful arguments, not by low and cheap considerations, but those of the greatest weight, the joys of heaven, the torments of hell; called upon you often by the ministry, knocked at your hearts as well as your ears by his Spirit; waited for your amendment for many years, tried you by mercies if they could melt you, by afflictions if they would reduce you to a sense of your duty. But all this will not do; yet you are still alive, and these means continued. What shall God do more? Now why are you not converted? Others are wrought upon by the same means and turned to the Lord, and have entered in by the strait gate, and framed their desire to walk in the narrow way. They have not offers more rich, or free, or particular. God has not told them of a hotter hell or a better heaven, or another or a more taking gospel. God speaks to you and them in the same terms, with the same grace and favor, and makes the door wide enough to get in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-21fd72064c" data-kw="">
<blockquote><p>Surely such a Testimony or voice in the soul [as claimed by Gillespie’s opponent], as the soul sits down satisfied with before ever any work of sanctification can possibly give any evidence, is not an evidence according to the word, but contrary to the word, and therefore not the revealing evidence of the spirit of God, so that in this I must needs dissent from him, for he casts the soul upon a most dangerous precipice, neither is the danger helped, but rather increased by that posterior evidence, or after comfort of sanctification, which he speaks of, for the soul being before set down satisfied with the Testimony of the spirit of the Lord, and Faith receiving that Testimony (so he supposes) it cannot now examine whether its sanctification be sound or not sound, whether its graces be common or special, seeming or real:…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 21</span></figcaption>

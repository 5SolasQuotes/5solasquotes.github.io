<blockquote><p>3. The matter that Paul recommend Phebe for to the Roman Christians was a duty of common Christian love, to entertain her kindly as a Christian, to assist her as they could in her affairs at Rome, a duty jure naturali [by natural law] incumbent to all Christians both conjunctly and severally. And so the recommendation for that on her behalf might well be directed to all, elders and people. But interest of concurring in actings of Church government, being not juris naturalis but juris positivi [by positive law], persons must be sure of special warrant and vocation for concurring in them. So that ’tis but a very sick consequence, if letters of recommendation for such purpose, as these for Phebe, may be (or if ye will, ought to be) directed to the whole Church, then ought the whole Church also to concur in actings of Church government and jurisdiction [as in congregationalism]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-wood.html">James Wood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Stone Pretended to be out of the Mountain, Tried &amp; found to be a Counterfeit</cite>, … (Edinburgh, 1654), pt. 2, section 3, p. 250</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b869d84c47" data-kw="">
<blockquote><p>We hold all who profess faith in Christ to be members of the visible Church, though they be not members of a visible congregation, and that the seals of the Covenant [of Grace] should not be denied to them. And for [the] more full clearing of the question, let these considerations be observed: First Distinction: All believers, as believers, in foro Dei, ‘before God’ have right to the seals of the Covenant [of Grace], these to whom the Covenant and body of the Charter belongs, to these the seal belongs, but in foro Ecclesiastico [in the sight of the Church], and in an orderly Church-way, the seals are not to be conferred by the Church upon persons because they believe, but because they profess their believing: therefore the apostles never baptized pagans, but upon profession of their faith. Second Distinction: Faith in Christ truly gives right to the seals of the Covenant [of Grace], and in God’s intention and decree, called voluntas beneplaciti [will of good-pleasure], they belong only to the invisible Church; but the orderly way of the Churches’ giving the seals is because such a society is a professing or visible Church, and [the] orderly giving of the seals according to God’s approving will, called, voluntas signi et revelata [the signified and revealed will], belongs to the visible Church. Third Distinction: The Church may orderly and lawfully give the seals of the Covenant to those to whom the Covenant and promises of grace do not belong in God’s decree of election. Fourth Distinction: The Church may lawfully add to the Church visible such as God adds not to the Church invisible, as they may add Simon Magus; and the Church may lawfully cast out of the visible Church, such as Christ has not cast out of the invisible Church, as the Church may excommunicate regenerate persons for scandalous sins. Fifth Distinction: Then the regenerate-excommunicated have right to the seals of the Covenant, as they have to the Covenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 185-6 of ‘Whether the Seals of the Covenant can be Denied to Professors of Approved Piety, because they are Not Members of a Particular Visible Church, in the New Testament?’ in The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5</span></figcaption>

</figure><figure class="quote" id="q-0dcd3772ee" data-kw="">
<blockquote><p>The last and worst report of all the rest [of the New England churches] is in Article 12, where he [William Rathband] reports that if any amongst us do not seek and desire church fellowship in our way, [we] account them despisers of it, yea wicked and graceless persons. To which I answer with detestation: God forbid. We speak as knowing God hears all our words; we hope we are far from such a spirit: for we know well that many gracious and precious saints there amongst us may, and sometimes do, for a good time abstain from seeking and desiring church fellowship for other grounds than despite, wickedness and gracelessness: Sometimes because they are not settled in a place: sometimes because they desire more experience of the ministers and people where they should join: some for want of clear light and full conviction of the church-ways we walk in: and some others out of many fears about their own spiritual estate before God, judging themselves (through temptation) out of a state of grace and dare not venture upon the seals, etc. whom we yet esteem precious souls and have labored by all arguments we were able to encourage to come into church fellowship.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“The last and worst report of all the rest [of the New England churches] is in Article 12, where he [William Rathband] reports that if any amongst us do not seek and desire church fellowship in our way, [we] account them despisers of it, yea wicked and graceless persons. To which I answer with detestation: God forbid. We speak as knowing God hears all our words; we hope we are far from such a spirit: for we know well that many gracious and precious saints there amongst us may, and sometimes do, for a good time abstain from seeking and desiring church fellowship for other grounds than despite, wickedness and gracelessness: Sometimes because they are not settled in a place: sometimes because they desire more experience of the ministers and people where they should join: some for want of clear light and full conviction of the church-ways we walk in: and some others out of many fears about their own spiritual estate before God, judging themselves (through temptation) out of a state of grace and dare not venture upon the seals, etc. whom we yet esteem precious souls and have labored by all arguments we were able to encourage to come into church fellowship.”

— Thomas Weld, An Answer to W.R.’s [William Rathband’s] Narration of the Opinions &amp; Practices of the Churches lately Erected in New England: Vindicating those Godly &amp; Orthodoxal Churches [in New England]… (London, 1644), Answer to ch. 3, pp. 19-20 Weld (1590?–1662) was a New England congregationalist. Rathband was a moderate English puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+last+and+worst+report+of+all+the+rest+%5Bof+the+New+England+churches%5D+is+in+Article+12%2C+where+he+%5BWilliam+Rathband%5D+reports+that+if+any+amongst+us+do+not+seek+and+desire+church+fellowship+in+our+way%2C+%5Bwe%5D+account+them+despisers+of+it%2C+yea+wicked+and+graceless+persons.+To+which+I+answer+with+detestation%3A+God+forbid.+We+speak+as+knowing+God+hears+all+our+words%3B+we+hope+we+are+far+from+such+a+spirit%3A+for+we+know+well+that+many+gracious+and+precious+saints+there+amongst+us+may%2C+and+sometimes+do%2C+for+a+good+time+abstain+from+seeking+and+desiring+church+fellowship+for+other+grounds+than+despite%2C+wickedness+and+gracelessness%3A+Sometimes+because+they+are+not+settled+in+a+place%3A+sometimes+because+they+desire+more+experience+of+the+ministers+and+people+where+they+should+join%3A+some+for+want+of+clear+light+and+full+conviction+of+the+church-ways+we+walk+in%3A+and+some+others+out+of+many+fears+about+their+own+spiritual+estate+before+God%2C+judging+themselves+%28through+temptation%29+out+of+a+state+of+grace+and+dare+not+venture+upon+the+seals%2C+etc.+whom+we+yet+esteem+precious+souls+and+have+labored+by+all+arguments+we+were+able+to+encourage+to+come+into+church+fellowship.%E2%80%9D%0A%0A%E2%80%94+Thomas+Weld%2C+An+Answer+to+W.R.%E2%80%99s+%5BWilliam+Rathband%E2%80%99s%5D+Narration+of+the+Opinions+%26+Practices+of+the+Churches+lately+Erected+in+New+England%3A+Vindicating+those+Godly+%26+Orthodoxal+Churches+%5Bin+New+England%5D%E2%80%A6+%28London%2C+1644%29%2C+Answer+to+ch.+3%2C+pp.+19-20+Weld+%281590%3F%E2%80%931662%29+was+

<blockquote><p>Simon Magus was not so tried [as to his sincerity or hypocrisy], yea when Peter found him in the gall of bitterness, we find not that he cast him out of the visible Church in respect his sin was not that publicly scandalous as to offend the whole Church.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104, p. 96</span></figcaption>

<blockquote><p>But for such as are excommunicated because of some particular scandal, as incest, or a particular heresy, and yet profess the truth, as to all other points, they are members cut off, and yet not cut off, in so far as they retain a profession, yea and to the knowledge of the Church, are visible converts, though in one particular scandal they lie without and give not such evidences of repentance [so] as [that] the Church can pardon them, as may be proven from the 2 Cor. 2:6-9; they are ordinary hearers of the Word, as such as must be reclaimed by the preached Word, as sick children, under the medicinal cure of [lesser] excommunication, and the preached Word that the spirit may be saved in the Day of the Lord (1 Cor. 5), but they are not ordinary hearers as visible professors [simply, who have not been excommunicated], nor are they members complete [communicant] of the Church in the inner court, admitted to the seals; 2. 2 Thess. 3:14-15, They are cut off members, yet not counted as enemies, but to be admonished as brethren. Therefore, though they be [in Greek] as heathens and publicans, Mt. 18, yet are they not simply to be counted pagans, nor occasional hearers, as pagans, but brethren: and though Mr. [John] Robinson [a Separatist], and some say the place, 2 Thess. 3, is not meant of excommunicated persons, beside that it is against the text, against the current of sound interpreters, yet it proves our point, that even such as walk disorderly, [in Greek], verse 11, and obey not the doctrine of the Gospel, and with whom we should not keep company, v. 14, and so ought to be excommunicate, by Mr. [Thomas] Hooker’s doctrine [a congregationalist], yet remain brethren, and are to be counted so by members of the Church, and are to hear the word of admonition, and so are visible professors, and so not utterly cast out of the visible Church, and Mr. Hooker doth no more refute our Protestants, than the Scripture who calls such as are fed, and the hearers of the Lord’s testimonies, the Israel of God, and the sheep of his pasture, his flock, inheritance, his vineyard his garath[?] of red vine, his spouse, and what is this but the Church visible, Ps. 147:19-20; Hos. 8:11. What? because the excommunicated who thus hear ordinarily are not members of the Church, because they are not whole and entire members, it is no more consequently spoken, than if he would say a wounded soldier, because he is wounded, and under cure, is not a member of the army and sworn to the colors, because he cannot march and fight as other soldiers.</p></blockquote>

</figure><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 62-63 (PDF p. 67)</span></figcaption>

<blockquote><p>Many martyrs faithfully perform congregational duties, yet does not Christ make good this promise [to build them on the Rock, Mt. 16], for when members are dissolved by banishment, they are thrown off the rock [Hooker had defined a local congregationalist church as those built on the Rock]. That which by our Savior is set down, as contrary to their comfortable union with and building upon Christ their rock, is being foiled [by governments banishing faithful local church members out of the local church] with the temptations of Satan and Hell, and being thrown off the rock [on the congregationalists’ definition], like the hypocrite, Mt. 7, who is the house built on the sand… and so by this interpretation the Lord’s dissolving of a church, which often is a work of mercy, and putting of his children to an honorable condition of martyrdom, and glorifying of God by suffering and scattering of his Church, as Acts 8:12, must be a throwing them off the rock Christ and a prevailing of the ports of Hell against them: contrary to the scope and intent of Christ in the text.</p></blockquote>

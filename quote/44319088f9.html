<main class="wrap"><figure class="quote" id="q-44319088f9" data-kw="">
<blockquote><p>‘The love of God is the essential property or essence of God, whereby delighting Himself in it, He wishes it the good which He approves.’ To be distinguished are ‘the general love of God’, the object of which is creation generally, so that ‘no one either of men or even of demons may say that he is not loved by God’; God hates the sin in the godless, but loves the nature created by Him — and the ‘special love of God, by which He peculiarly pursues the separate elect.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma Theologiae Christianae</cite>, 2.122, quoted by Heinrich Heppe, Reformed Dogmatics, p. 95. The whole, large quote is Heppe’s; the small quotes inside it are from Polanus’.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-0d7bed3c60" data-kw="">
<blockquote><p>First, I say, let us view the love of a God of love, in the different kinds of it. … 2, He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?” And because of your obstinacy in unbelief and sin, He may challenge you as he did Israel, and say, Micah 6:3, “O my people, what have I done unto thee, and wherein have I wearied thee? testify against me. Was I ever a barren wilderness, or a land of darkness?” Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God in Christ, A God of Love’, a sermon on 1 Jn. 4:16, in The Whole Works of the late Rev. Ebenezer Erskine</cite>, vol. 1, pp. 280-81</span></figcaption>

</figure><figure class="quote" id="q-42a4d4d71e" data-kw="">
<blockquote><p>We distinguish and teach that in this sense they [reprobates] are made to be reconciliable by the death of Christ, by which Prosper says (Response to the Little Head of the Gauls, ch. 9): “Christ is the Savior of the whole world on account of his true undertaking of human nature and communion in the ruin of the first man.” Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: … 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, pp. 421-422 c. 1638-1643 trans. T. Fentiman</span></figcaption>

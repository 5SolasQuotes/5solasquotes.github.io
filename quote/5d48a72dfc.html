<main class="wrap"><figure class="quote" id="q-5d48a72dfc" data-kw="">
<blockquote><p>A living faith justifies, not in its active state, but in its act of apprehending and laying hold upon Christ. On the other hand, faith’s second notable act is to purify and cleanse the heart and stir up other graces. In this sense, some learned individuals argue that good works are necessary to preserve a person in the state of justification, though they do not immediately contribute to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis</cite>, 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.</p></blockquote>

<blockquote><p>§IV. For first, whereas justification before God is but one, wherein the Lord by imputation of Christ’s righteousness to a believing sinner does absolve him from his sins and also accepts of him as righteous in Christ, not only in the first moment of justification, wherein being a sinner in himself he was first constituted righteous in Christ: but also in the continuance of justification, wherein the believer being still a sinner in himself, is continued in the favor of God by the merits and intercession of Christ: and though a sinner in himself, yet believing in Him that justifies a sinner, is made the righteousness of God in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 3, ‘Bellarmine’s answers… refuted’, p. 451</span></figcaption>

</figure><figure class="quote" id="q-3eaa37cff6" data-kw="">
<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

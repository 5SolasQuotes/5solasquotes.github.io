<main class="wrap"><figure class="quote" id="q-11c5b7239b" data-kw="Father God only begotten">
<blockquote><p>Secondly, It is proposed as the object of our faith, that the Father is God. … For the Father, as he whom we worship, is often called so only with reference unto his Son; as the Son is so with reference to the Father. He is the “only begotten of the Father,” John 1:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, II</span></figcaption>

</figure><figure class="quote" id="q-afb69e3e82" data-kw="Father begets Son eternal">
<blockquote><p>That the Father begets the Son, and the Son is begotten, can both be said in a sound sense: the former with respect to generation considered in itself because the works of the Trinity inwards (such as to beget and to be begotten) are eternal and unceasing. Otherwise, if personal acts had an end, they would also have a beginning, and all mutation in God could not be denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.7</span></figcaption>

</figure><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VII</span></figcaption>

</figure><figure class="quote" id="q-fd31edefff" data-kw="fons deitatis Father">
<blockquote><p>The Son emanates from the Father alone, but the Holy Spirit from the Father and the Son together. … If the mode of subsisting is considered (according to which the Father is the fountain of deity from whom the Son emanates), not improperly in this sense is he said to proceed from the Father through the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.3, 8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-cade01efb4" data-kw="">
<blockquote><p>My principal design is, to manifest that every believer may, in the due use of the means appointed of God for that end, attain unto such a full assurance of understanding in the truth, or all that knowledge of the mind and will of God revealed in the Scripture, which is sufficient to direct him in the life of God, to deliver him from the dangers of ignorance, darkness, and error, and to conduct him unto blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 1</span></figcaption>

</figure><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>The Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, on ch. 1, §§ 9–10</span></figcaption>

</figure><figure class="quote" id="q-f4b69291f9" data-kw="">
<blockquote><p>To ascertain the true sense of the Scriptures, interpretation is needed. … It is not to be sought by each man&#x27;s private judgment (which is the idia epilysis condemned by Peter), but is to be gathered from the Scriptures themselves as their own best and surest interpreter (Neh. 8:8; Acts 17:11). But for this, after fervent prayer to God, there is need of an inspection of the sources, the knowledge of languages, … collation of passages, … and conformity of the interpretation to the analogy of faith.</p></blockquote>

<blockquote><p>Moreover, as God is to be felt sensibly in every man’s conscience, so is he to be seen visibly, if I may so speak, in the creation of the world, and of all things therein contained; for that this world had a beginning, all the excellent philosophers that ever were, have agreed, except Aristotle for a time, who held a fancy, that this world had no beginning, but was from all eternity but at last in his old age, he confessed and held the contrary, in his book De Mundo, which he wrote to king Alexander (which book Justin Martyr esteemed greatly, and called it the epitome of all Aristotle’s true philosophy). This then being so, that the world had a beginning, it must needs follow, that it had an efficient cause or maker thereof. I demand, then, who it was that made it? If you say it made itself, it is absurd; for how could it make itself before itself was made, and when it had no being at all?

If you say that something within the world made the world, that is, that some one part of the world made the whole, that is more absurd; for it is as much as if a man should say that the finger (and this before it was a finger or part of the body) did make the whole body. Wherefore it may be convinced by force of this argument (which is plainly demonstrative), that a greater and more excellent thing than is the whole world put together, yea, that something which was before heaven and earth were made, was and must needs be the maker and framer of this world; and this can be nothing else but God, the creator of all things, who was before all his creatures, and is termed in the sacred writings, ‘Alpha and Omega, the first and the last,’ for that he only was without beginning himself, and shall be and remain without ending. For he is eternal, being the primus motor; and the only Almighty Creator of all things.

So true it is which Paul the apostle doth testify, when he saith, that ‘the invisible things of God (that is, his eternal power and divine essence), are seen perfectly in the creation of the world, being perceived by his works which he hath made,’ Rom. i. 20. If, therefore, men would but cast up their eyes to heaven, and from thence look down again upon the earth, and so behold the excellent beauty and building of this world, they cannot be so sottish or dull conceited, but they must know there was and is a God, which was the maker of them; and be moved in some sort to glorify so incomparable and excellent a Creator.

Yea, the poets and others have affirmed of God, that he is Pater hominum, the Father of men, to shew that men have their original and creation from him; so that if we should draw our eyes from the beholding of the great world, and consider but man (who for his beauty and excellency is called in Greek Microcosmos, the little world), still we shall be enforced to acknowledge God the author of us, the Father and Creator of us.

So true is that which Paul the apostle noteth out of the poet Aratus, which saith that ejus progenies sumus, we are the issue or offspring of God, Acts xvii. 29. And as true it is, which he further saith in that place, that ‘in him we live, move, and have our being.’ And therefore we owe all dutiful obedience and subjection unto him, which duty and nature commands us to perform in regard of our creation. For the son honoureth his father by natural duty, and all men are naturally carried to be grateful to their founders, to whom they are specially bound, a.nd whom they ought not to forget, neither will, except they be extreme unthankful and dissolute.</p></blockquote>

<blockquote><p>The creation of all things plainly manifests the existence of God. The innumerable alterations and manifold dependence, every where observable in the world, manifest that the things which exist in it, neither are, nor could be, from eternity:– It is self-evident, that they never could form themselves out of nothing, or in any of their respective forms: and that CHANCE, being nothing but the want of design, never did, nor could, form or put into order any thing, far less such a marvellous and well connected system as our world is.

Though we should absurdly fancy MATTER to be eternal, yet it could not change its own form, or produce Life or Reason, nothing being capable to confer that which it hath not in itself, either formally or virtually. Moreover, when we consider the diversified and marvellous forms of creatures in the world, and how exactly their forms and stations correspond with their respective ends and form, and motions of our own bodies, and especially when we consider the powers of our soul, – its desires after an infinite good, and its close union with, and incomprehensible operations on our bodies, we are obliged by the light of evidence to admit a Creator of infinite wisdom, and power, and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compendious view of natural and revealed religion</cite>, (1782; Grand Rapids, 2002), pp 5-6.</span></figcaption>

</figure><figure class="quote" id="q-6ab06d3655" data-kw="">
<blockquote><p>But let us suppose, for I shall not contradict it, that the common determination is right, that God created the world, not necessarily, but freely; not only as freedom is opposite to coaction, and to any extrinsic, imposed necessity, which are unquestionable, but also to an intrinsical necessity, so that his wisdom, and communicative nature, or glory, did not necessitate the creation of the world, but that he so willed to create it, that consideratis considerandis, he might have nilled it, and in this sense did freely create it. I say on this common ground supposed we shall proceed, though I fear such high inquiries myself.</p></blockquote>

<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.”

— George Walker, The History of the Creation as it is Written by Moses, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+is%2C+why+God+called+only+the+light+%E2%80%98day%E2%80%99%2C+and+Moses+calls+both+the+evening+and+the+morning%2C+that+is%2C+the+time+of+light+and+darkness%2C+%E2%80%98one+day%E2%80%99%2C+or+%E2%80%98the+first+day%E2%80%99.+I+answer+that+God%E2%80%99s+%E2%80%98day%E2%80%99%2C+which+is+most+truly+and+properly+so+called%2C+is+the+time+of+light%2C+and+in+it+there+is+no+night+or+darkness.+For+God+speaks+of+a+natural+day%2C+distinct+from+the+night%3A+but+Moses+speaks+of+a+civil+day+which+comprehends+in+it+the+space+of+24+hours%2C+in+which+the+sun+runs+round+about+the+world+with+the+heavens%3B+which+%E2%80%98day%E2%80%99+includes+in+it+a+day+and+a+night%3A+and+here+observe+that+God%E2%80%99s+%E2%80%98day%E2%80%99+is+all+light%2C+and+man%E2%80%99s+%E2%80%98day%E2%80%99+is+mixed+of+light+and+darkness.+Thirdly%2C+it+may+asked+whether+the+night%2C+or+the+day+went+before+in+the+first+day+of+the+creation.+The+answer+is+that+the+night+or+time+of+darkness+was+first%3B+and+it+is+likely+that+darkness+did+overspread+the+face+of+the+deep+the+space+of+a+night%2C+that+is+12+hours%2C+before+God+formed+the+light%2C+and+setled+the+visible+heavens+in+their+place%3B+and+that+after+the+light+was+created%2C+it+did+shine+forth+for+the+space+of+12+hours+more+before+God+went+about+to+make+the+firmament%2C+which+was+the+second+day%E2%80%99s+work%3B+and+so+the+first+day+of+the+world+was+of+the+same+length+with+all+other+civil+or+astronomical+days%2C+that+is%2C+24+hours%2C+divided+equally+between+light+and+darkness.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+History+of+the+Creation+as+it+is+Written+by+Moses%2C+%E2%80%A6+%28London%3A+Barlet%2C+1641%29%2C+Of+the+Creation+of+the+World%2C+ch.+6%3B+p.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe899841436.html&a

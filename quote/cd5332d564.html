<blockquote><p>6. Next it must be noted how peremptorily he [a Romish adversary] charges me with ignorance for saying this antecedent will is not simply, properly and formally in God. But he should have considered that when I said so, I spoke in the words of Durand (Durand, bk. 1, dist. 46, quest. 1), one of his own side, whom I alleged in the margin: that, if it were false I said, yet the ignorance should not be fathered on me, but on them that begot it. For I said the truth, and himself is ignorant of the doctrine of his own Church. For Thomas handling this antecedent will, says (pt. 1, quest. 19, art. 6, to obj. 1), ‘We do not simply will what we will antecedently; and therefore this antecedent will may rather be called a velleity than an absolute will. (magis dici potest velleitas quam absoluta voluntas) A velleity, that is to say as Gregory of Valence expounds him (Commentary on Thomas, pt. 1, disp. 1, quest. 19, point 2), ‘a certain conditionated will; when that only can be said simply to be willed, that is willed consequently.’ Where we see that Thomas reduces this antecedent will to an imperfect kind of willing, which he calls a velleity, which is not a simple, proper or formal will: and the most Schoolmen follow him upon this ground, because there cannot be a formal will in God which is not fulfilled, as the salvation of all men is not. Hence it is says Suarez (Tract on Predestination, bk. 4, ch. 2, no. 2), that some have inferred that this of God whereby He would the salvation of all men, is no proper and formal act of willing in God: because He has no imperfect act of willing, as they call velleity, but only a signification of will (voluntatem signi), which only is metaphorical and interpretative, in that He carries Himself towards men, as if He had that act of willing. Thus think Cajetan and Marsilius. Others say, the formal and proper will of God reaches not to the salvation of all men, for that cause because it is not fulfilled, but only to the giving of sufficient means: which will, only to appoint sufficient means, is formal in God, and thereof God is said to will the salvation of all men: and of this mind are many Schoolmen. This will of God, says Vasquez (in pt. 1 of Thomas, disp. 83, no. 22), whereby He would the salvation of all men, even of the reprobate, very many Schoolmen, especially the newer, think to be only a conditionated will, which they call a velleity: whose act is not absolute and perfect, but under condition. Now the probabler opinion, says Dominicus Bannes (Commentary, pt. 1, quest. 19, art. 6, conclusion 2), is that there is formally no will in God which is signified by the name of velleity. Whence it follows that since by the doctrine of Thomas and many others, this antecedent will is but a velleity, it cannot be formally in God. But to take down this raw student yet a little more, Soto Major says (in tome above, p. 274): This word, God will the salvation of all men, by the good leave of so many ancient authors, we will not only expound of will properly so called, which is God’s good pleasure, but of his antecedent will; that is to say, an imaginary and metaphorical will: according to the which, it is no inconvenience to say, God will have all men to be saved: of which antecedent will, or will improperly so called, Damascene speaks (p. 279). And again: Damascene’s antecedent will is but a general, metaphorical and improper will, which they call a velleity. Here you see that Damascene and Thomas’s antecedent will is but a velleity, and this velleity is no will simply or formally in God; and therefore I spoke not ignorantly, but after the mind of the best Schoolmen that write when I said out of Durand that this antecedent will is not simply, properly and formally the will of God, but knew well enough what I said: and such as hold the contrary, that this antecedent will whereby God is said to will the salvation of all men, is simply, properly or formally the will of God, are driven to hold a paradox, that God’s absolute will, which is defined to be the will of his good pleasure, may be defeated and not accomplished (Opus est fateri non omnem voluntatem Beneplaciti semper impleri. Magal. in Tim., p. 252): which is a desperate shift and contrary to the doctrine of the best ancient divines in the Church of Rome (Thomas, pt. 1, quest. 19, art. 6; Master [of the Sentences, Lombard], bk. 1, dist. 46, where Scotus, Ockham, Dionysius Capreollus, dist. 45, quest. unic. art. 2, concl. 5; Cajetan on 1. Tim. 2:4; Dominic Banez, pt. 1, quest. 19, art. 6, concl. 2, in sum. text. Perer., Select Disputations on Jn. 1, no. 73); and directly against the Scripture, which says, ‘Our God has done whatsoever pleased Him in heaven and earth.’ (Ps. 135:6) ‘Who has resisted his will?’ (Rom. 9:19) ‘Who works all things according to the counsel of his own will.’ (Eph. 1:11)</p></blockquote>

<blockquote><p>But thus they [medieval scholastics] expound themselves, that God works, decrees and wills the deformity that is found in the sins of commission, not by his antecedent will, whereby He works things out of his own liking, but by his consequent and conditional will, whereby presupposing the purpose of suffering his creature to avert and turn from Him, He still intends to move, impel and carry them forward, though being by their own fault out of the way, He carries them thither whither they should not go: first, say they, by substraction of grace, upon the withdrawing whereof He saw the creature would turn from Him, He purposed to suffer the sin of aversion or omission to enter: secondly, this purpose being presupposed, and foreseeing that which would follow upon it in his consequent and conditional will, He positively decreed the other, which is of commission. Man by creation was made to seek an infinite good, and love it infinitely; which if he omit to seek in God, then must he needs commit the contrary and seek it in himself: for so God decreed that man not continuing to adhere unto Him, should fall into self-love, pride and all evils of that kind. All this might be borne withal, save only they make deformity of the essence of an action, which cannot be borne withal…</p></blockquote>

<blockquote><p>Secondly, there is Voluntas Signi [will of sign], a manifestation of his will, whether it be in his works, which are the fruits of his will, or his Word which is the evidence of his will, directing us to the knowledge what He would have us do. A sense tropical and figurative, yet most proper to inform us: and this is scattered into five divisions or species. First, Permissio, his permission or allowance, or privilege to things, without which they cannot be; Non fit aliquid nisi omnipotens fieri velit, vel sinendo ut fiat, vel faciendo [Nothing comes to be unless the Omnipotent wills it to come to be, either by permitting it to come to pass or by bringing it about]. (Augustine, Enchiridion) Secondly, Impletio, the perfecting or fulfilling of them. Thirdly, Consilium, his revealed decree. Fourthly, Praeceptum, his positive law; his precepts wherein He teaches and commands us to do what is acceptable in his sight. Fifthly and lastly, Prohibitio, the restraint He lays upon us, his command for the eschewing those actions which are contrary to his will.</p></blockquote>

<blockquote><p>God from eternity either approves or disapproves of something. Approval in general is either bare and without the decree, or it is with the decree. Approval without the decree is when God approves something simply, yet He does not decree that it be chosen or followed after. Approval without the decree belongs to all good things with respect to themselves, though they are not at any time realized, of which sort are the conversion, faith, and salvation of reprobates; which God surely approves of simply, but does not decree to come about; thus He decrees them not to come about… Concerning approval without the decree, see Dt. 5:29, “O that there were such a heart in them, that they would fear me and keep all my commandments always, that it might be well with them, and with their children forever!” 1 Tim. 2:4, “Who will have all men to be saved, and to come unto the knowledge of the truth.” 1 Tim. 4:10, “…who is the Savior of all men, specially of those that believe.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Brief Instruction on the Eternal Approval &amp; Disapproval of the Divine Mind’</cite>, trans. Charles Johnson &amp; Travis Fentiman (1593/4; ReformedBooksOnline, 2020), p. 3 Rollock here positis an eternal foundation for the revealed will of God, namely God’s will of approval and disapproval. This paradigm would continue through Rutherford and others.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>XXV. Thirdly, it is asked how Christ could offer such prayers to God as openly appear to be repugnant to the divine counsel and will, and thus to the piety and obedience which he most constantly exhibited to the Father? For what? Was he not born and made mediator for this very reason, that he might drink this cup for our salvation? Did he not know that this was the decree of the Father, as he himself testified more than once, that he must suffer many things and be killed? Mt. 16:21. Indeed, when he was being seized by the soldiers, he rebukes Peter for resisting them: “Shall I not drink the cup which my Father hath given me?” How, therefore, is he contrary to himself and to the Father, by requesting with such effort that the cup be transferred from him? Here, indeed, there are many things that can be replied. 1st, We suppose, against the Monothelites, that there was a twofold will in Christ, just as there was a divine and a human nature; these were not indeed adverse and repugnant to one another, but were nevertheless diverse insofar as they were directed toward diverse objects. The divine [will] willed death because it had been so ordained by the Father for our redemption; the human, however, shuddered and prayed against it, because it viewed it as the destruction of nature and the most dire of all evils that could exist; yet the human will is not rightly said to have been repugnant to the divine, because it petitioned not absolutely, but conditionally; not with a deliberate and elective will, but rather with an inefficacious and natural velleity. Therefore, it is to be observed 2nd, that the will can be divided in many ways; for one is called efficacious, another inefficacious; that is called efficacious which is the principle of acting, and which moves and impels a man to execute those things which it wills and to remove, as much as it can, any impediments to operation; [Ineffectual] which is not brought into effect, whether because of impediments arriving from elsewhere, or because it is a simple complacency in the good, or displeasure at evil, and does not proceed further so as to be a principle of operating, nor does it in reality impel one to the execution of the thing, which deserves to be called velleity rather than will. Therefore, when Christ is said to have willed that the cup might pass, this ought not to be understood of an efficacious will which produced in Him any attempt at escaping and extricating Himself from those snares; indeed, we see Him led as a sheep to the slaughter, Isa. LIII:8, so that He in no way resisted, nor attempted to flee from death, but of an ineffectual will which signifies nothing other than a simple displeasure arising from a natural inclination by which the will abhors that which destroys nature. XXVI. The will is either natural and indeliberate, or deliberate and elective. The former is called will by way of nature, the latter by way of reason, thus Thomas, pt. 3, quest. 18, art. 5. Will as nature, or by way of nature, is a physical faculty having a natural inclination toward the preservation of the whole composite, or it is a desire for advantage; it is called indeliberate will because it is borne toward an object considered absolutely without any consideration of circumstances. But will by way of reason is a rational faculty for pursuing the general good of the whole man as he is man, or for following the dictate of the practical intellect advising what is right and just; it is called elective will because it is a desire and affection for justice rather than for one’s own utility; it is also called deliberate will because it regards an object clothed in all its circumstances, and this will is referred to rational cognition as to its cause, because it follows not the instinct of nature but the dictate of reason. The will of nature naturally flees those things which are contrary to nature, such as death, torments, etc. The will by way of reason can be borne even toward those things which are adverse to nature, provided they are just and honorable or necessary; thus, for example, he who by natural will flees and is averse to a bitter potion, nevertheless receives the same by rational will, because he knows there is no other way of recovering health. In the same way, martyrs by nature cannot but shudder at death, but the same persons, nevertheless, approach it eagerly out of reason as the most glorious testimony of the benevolence of God, and glory in it. In clearly the same manner, Christ willed and did not will death, in a different respect. The will by way of nature did not will it, but the same by way of reason willed it; it did not will it insofar as natural appetite was a desire that He might live, and it viewed death absolutely and in itself as the destruction of nature. But insofar as He viewed the same with its circumstances, that is, as decreed by God and necessary for the salvation of the elect, He was borne toward it with a most propense affection, just as He testified elsewhere that this was His food, that He might do the will of His Father. Jn. IV:34; XXVII:4. Will is distinguished into simple and absolute, and hypothetical or conditional. The former is that by which one wills something absolutely and efficaciously, so that he leaves nothing undone so that that will may be brought into effect. The latter in which one wills something under a condition, and which is contained within certain limits. Thus, with an absolute will, the faithful seek the remission of their sins, and whatever things are necessary for their salvation. But with a conditional will, they seek those things which do not pertain to salvation in themselves, nor, whether granted, promote it, or, if denied, remove it—for instance, wealth, health, strength, external peace—in the seeking of which they must always add that condition, expressly or implicitly: “if the will of God so carries it.</p></blockquote>

effect, whether because of impediments arriving from elsewhere, or because it is a simple complacency in the good, or displeasure at evil, and does not proceed further so as to be a principle of operating, nor does it in reality impel one to the execution of the thing, which deserves to be called velleity rather than will. Therefore, when Christ is said to have willed that the cup might pass, this ought not to be understood of an efficacious will which produced in Him any attempt at escaping and extricating Himself from those snares; indeed, we see Him led as a sheep to the slaughter, Isa. LIII:8, so that He in no way resisted, nor attempted to flee from death, but of an ineffectual will which signifies nothing other than a simple displeasure arising from a natural inclination by which the will abhors that which destroys nature. XXVI. The will is either natural and indeliberate, or deliberate and elective. The former is called will by way of nature, the latter by way of reason, thus Thomas, pt. 3, quest. 18, art. 5. Will as nature, or by way of nature, is a physical faculty having a natural inclination toward the preservation of the whole composite, or it is a desire for advantage; it is called indeliberate will because it is borne toward an object considered absolutely without any consideration of circumstances. But will by way of reason is a rational faculty for pursuing the general good of the whole man as he is man, or for following the dictate of the practical intellect advising what is right and just; it is called elective will because it is a desire and affection for justice rather than for one’s own utility; it is also called deliberate will because it regards an object clothed in all its circumstances, and this will is referred to rational cognition as to its cause, because it follows not the instinct of nature but the dictate of reason. The will of nature naturally flees those things which are contrary to nature, such as death, torments, etc. The will by way of reason can be borne even toward those things which are adverse to nature, provided they are just and honorable or necessary; thus, for example, he who by natural will flees and is averse to a bitter potion, nevertheless receives the same by rational will, because he knows there is no other way of recovering health. In the same way, martyrs by nature cannot but shudder at death, but the same persons, nevertheless, approach it eagerly out of reason as the most glorious testimony of the benevolence of God, and glory in it. In clearly the same manner, Christ willed and did not will death, in a different respect. The will by way of nature did not will it, but the same by way of reason willed it; it did not will it insofar as natural appetite was a desire that He might live, and it viewed death absolutely and in itself as the destruction of nature. But insofar as He viewed the same with its circumstances, that is, as decreed by God and necessary for the salvation of the elect, He was borne toward it with a most propense affection, just as He testified elsewhere that this was His food, that He might do the will of His Father. Jn. IV:34; XXVII:4. Will is distinguished into simple and absolute, and hypothetical or conditional. The former is that by which one wills something absolutely and efficaciously, so that he leaves nothing undone so that that will may be brought into effect. The latter in which one wills something under a condition, and which is contained within certain limits. Thus, with an absolute will, the faithful seek the remission of their sins, and whatever things are necessary for their salvation. But with a conditional will, they seek those things which do not pertain to salvation in themselves, nor, whether granted, promote it, or, if denied, remove it—for instance, wealth, health, strength, external peace—in the seeking of which they must always add that condition, expressly or implicitly: “if the will of God so carries it.”

— Francis Turretin, Disputations on the Satisfaction of Christ… (Geneva, 1666), 6th Disputation, which is the Fourth on the Truth of Christ’s Satisfaction, Asserted from his Agony and Desertion tr. AI by The Received Faith, sect. 25-29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXV.+Thirdly%2C+it+is+asked+how+Christ+could+offer+such+prayers+to+God+as+openly+appear+to+be+repugnant+to+the+divine+counsel+and+will%2C+and+thus+to+the+piety+and+obedience+which+he+most+constantly+exhibited+to+the+Father%3F+For+what%3F+Was+he+not+born+and+made+mediator+for+this+very+reason%2C+that+he+might+drink+this+cup+for+our+salvation%3F+Did+he+not+know+that+this+was+the+decree+of+the+Father%2C+as+he+himself+testified+more+than+once%2C+that+he+must+suffer+many+things+and+be+killed%3F+Mt.+16%3A21.+Indeed%2C+when+he+was+being+seized+by+the+soldiers%2C+he+rebukes+Peter+for+resisting+them%3A+%E2%80%9CShall+I+not+drink+the+cup+which+my+Father+hath+given+me%3F%E2%80%9D+How%2C+therefore%2C+is+he+contrary+to+himself+and+to+the+Father%2C+by+requesting+with+such+effort+that+the+cup+be+transferred+from+him%3F+Here%2C+indeed%2C+there+are+many+things+that+can+be+replied.+1st%2C+We+suppose%2C+against+the+Monothelites%2C+that+there+was+a+twofold+will+in+Christ%2C+just+as+there+was+a+divine+and+a+human+nature%3B+these+were+not+indeed+adverse+and+repugnant+to+one+another%2C+but+were+nevertheless+diverse+insofar+as+they+were+directed+toward+diverse+objects.+The+divine+%5Bwill%5D+willed+death+because+it+had+been+so+ordained+by+the+Father+for+our+redemption%3B+the+human%2C+however%2C+shuddered+and+prayed+against+it%2C+because+it+viewed+it+as+the+destruction+of+nature+and+the+most+dire+of+all+evils+that+could+exist%3B+yet+the+human+will+is+not+rightly+said+to+have+been+repugnant+to+the+divine%2C+because+it+petitioned+not+absolutely%2C+but+conditionally%3B+not+with+a+deliberate+and+elective+will%2C+but+rather+with+an+inefficacious+and+natural+velleity.+Therefore%2C+it+is+to+be+observed+2nd%2C+that+the+will+can+be+divided+in+many+ways%3B+for+one+is+called+efficacious%2C+another+inefficacious%3B+that+is+called+efficacious+which+is+the+principle+of+acting%2C+and+which+moves+and+impels+a+man+to+execute+those+things+which+it+wills+and+to+remove%2C+as+much+as+it+can%2C+any+impediments+to+operation%3B+%5BIneffectual%5D+which+is+not+brought+into+effect%2C+whether+because+of+impediments+arriving+from+elsewhere%2C+or+because+it+is+a+simple+complacency+in+the+good%2C+or+displeasure+at+evil%2C+and+does+not+proceed+further+so+as+to+be+a+principle+of+operating%2C+nor+does+it+in+reality+impel+one+to+the+execution+of+the+thing%2C+which+deserves+to+be+called+velleity+rather+than+will.+Therefore%2C+when+Christ+is+said+to+have+willed+that+the+cup+might+pass%2C+this+ought+not+to+be+understood+of+an+efficacious+will+which+produced+in+Him+any+attempt+at+escaping+and+extricating+Himself+from+those+snares%3B+indeed%2C+we+see+Him+led+as+a+sheep+to+the+slaughter%2C+Isa.+LIII%3A8%2C+so+that+He+in+no+way+resisted%2C+nor+attempted+to+flee+from+death%2C+but+of+an+ineffectual+will+which+signifies+nothing+other+than+a+simple+displeasure+arising+from+a+natural+inclination+by+which+the+will+abhors+that+which+destroys+nature.+XXVI.+The+will+is+either+natural+and+indeliberate%2C+or+deliberate+and+elective.+The+former+is+called+will+by+way+of+nature%2C+the+latter+by+way+of+reason%2C+thus+Thomas%2C+pt.+3%2C+quest.+18%2C+art.+5.+Will+as+nature%2C+or+by+way+of+nature%2C+is+a+physical+faculty+having+a+natural+inclination+toward+the+preservation+of+the+whole+composite%2C+or+it+is+a+desire+for+advantage%3B+it+is+called+indeliberate+will+because+it+is+borne+toward+an+object+considered+absolutely+without+any+consideration+of+circumstances.+But+will+by+way+of+reason+is+a+rational+faculty+for+pursuing+the+general+good+of+the+whole+man+as+he+is+man%2C+or+for+following+the+dictate+of+the+practical+intellect+advising+what+is+right+and+just%3B+it+is+called+elective+will+because+it+is+a+desire+and+affection+for+justice+rather+than+for+one%E2%80%99s+own+utility%3B+it+is+also+called+deliberate+will+because+it+regards+an+object+clothed+in+all+its+circumstances%2C+and+this+will+is+referred+to+rational+cognition+as+to+its+cause%2C+because+it+follows+not+the+instinct+of+nature+but+the+dictate+of+reason.+The+will+of+nature+naturally+flees+those+things+which+are+contrary+to+nature%2C+such+as+death%2C+torments%2C+etc.+The+will+by+way+of+reason+can+be+borne+even+toward+those+things+which+are+adverse+to+nature%2C+provided+they+are+just+and+honorable+or+necessary%3B+thus%2C+for+example%2C+he+who+by+natural+will+flees+and+is+averse+to+a+bitter+potion%2C+nevertheless+receives+the+same+by+rational+will%2C+because+he+knows+there+is+no+other+way+of+recovering+health.+In+the+same+way%2C+martyrs+by+nature+cannot+but+shudder+at+death%2C+but+the+same+persons%2C+nevertheless%2C+approach+it+eagerly+out+of+reason+as+the+most+glorious+testimony+of+the+benevolence+of+God%2C+and+glory+in+it.+In+clearly+the+same+manner%2C+Christ+willed+and+did+not+will+death%2C+in+a+different+respect.+The+will+by+way+of+nature+did+not+will+it%2C+but+the+same+by+way+of+reason+willed+it%3B+it+did+not+will+it+insofar+as+natural+appetite+was+a+desire+that+He+might+live%2C+and+it+viewed+death+absolutely+and+in+itself+as+the+destruction+of+nature.+But+insofar+as+He+viewed+the+same+with+its+circumstances%2C+that+is%2C+as+decreed+by+God+and+necessary+for+the+salvation+of+the+elect%2C+He+was+borne+toward+it+with+a+most+propense+affection%2C+just+as+He+testified+elsewhere+that+this+was+His+food%2C+that+He+might+do+the+will+of+His+Father.+Jn.+IV%3A34%3B+XXVII%3A4.+Will+is+distinguished+into+simple+and+absolute%2C+and+hypothetical+or+conditional.+The+former+is+that+by+which+one+wills+something+absolutely+and+efficaciously%2C+so+that+he+leaves+nothing+undone+so+that+that+will+may+be+brought+into+effect.+The+latter+in+which+one+wills+something+under+a+condition%2C+and+which+is+contained+within+certain+limits.+Thus%2C+with+an+absolute+will%2C+the+faithful+seek+the+remission+of+their+sins%2C+and+whatever+things+are+necessary+for+their+salvation.+But+with+a+conditional+will%2C+they+seek+those+things+which+do+not+pertain+to+salvation+in+themselves%2C+nor%2C+whether+granted%2C+promote+it%2C+or%2C+if+denied%2C+remove+it%E2%80%94for+instance%2C+wealth%2C+health%2C+strength%2C+external+peace%E2%80%94in+the+seeking+of+which+they+must+always+add+that+condition%2C+expressly+or+implicitly%3A+%E2%80%9Cif+the+will+of+God+so+carries+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Disputations+on+the+Satisfaction+of+Christ%E2%80%A6+%28Geneva%2C+1666%29%2C+6th+Disputation%2C+which+is+the+Fourth+on+the+Truth+of+Christ%E2%80%99s+Satisfaction%2C+Asserted+from+his+Agony+and+Desertion+tr.+AI+by+The+Received+Faith%2C+sect.+25-29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88115f67b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88115f67b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=XXV.%20Thirdly%2C%20it%20is%20asked%20how,will%20of%20God%20so%20carries%20it&amp;text=XXV.%20Thirdly%2C%20it%20is%20asked%20how%20Christ%20could&amp;text=if%20the%20will%20of%20God%20so%20carries%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…we believe that all things without exception are under divine providence: whether heavenly or sublunary, great or small, necessary and natural or free and contingent. Thus nothing in the nature of things can be granted or happen which does not depend on it. The reasons are: (1) God created all things, therefore He also takes care of all things. For if it was glorious for God to create them, it ought not to be unbecoming in Him to take care of them. Nay, as He created, He is bound to conserve and govern them continually, since He never deserts His own work, but ought to be perpetually present with it that it may not sink back into nothingness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, On Providence</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7c2afaf46" data-kw="">
<blockquote><p>He manifests the more grace and goodwill to our salvation, and that He is more ready to pardon than to punish, in that He waits so long on the sinner’s choice: Rom. 9:22, ‘What if God, willing to show his wrath, and to make his power known, endured with much long‑suffering the vessels of wrath filled to destruction?’ He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace; and if He should do that, the world would never be put upon choice and trial, and obedience would be a matter of necessity and constraint, not of willing acceptation; and men may as well quarrel at this as that He has not made them all angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, pp. 463-79, Two sermons on Eze. 18:23. HT: David Ponter. | Sermon 1:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

n-grace/the-westminster-confession-on-common-grace/#:~:text=He%20manifests%20the%20more%20grace%20and,has%20not%20made%20them%20all%20angels&amp;text=He%20manifests%20the%20more%20grace%20and%20goodwill%20to&amp;text=that%20He%20has%20not%20made%20them%20all%20angels" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-17f9255f8e" data-kw="">
<blockquote><p>Secondly, we must from hence be exhorted to take heed of usurping Christ’s honor to our selves, of being our own rule or way. The Lord is a jealous God, and will not suffer any to be a self mover, or a God unto himself. It is one of God’s extremest judgments to give men over to themselves, and leave them to follow their own rules. When He has first woo’d men by his Spirit, and that is resisted; enticed them by his mercies, and they are abused; threatened them with his judgments, and they are mis-attributed to second causes; cried unto them by his prophets, and they are reviled; sent his own Son to persuade them, and He is trampled on and despised: when He offers to teach them, and they stop their ears; to lead them, and they pull away their shoulder; to convert them, and they hardened their heart; when they set up mounds against the Gospel, as it were to non-plus and pose the mercies of God, that there may be no remedy left; then after all these indignities to the Spirit of Grace, this is the judgement with which God uses to revenge the quarrel of his Grace and Covenant, to leave them to the hardness and impenitency of their own hearts, to be a rule and way unto themselves. My people would not hearken to my voice, and Israel would none of me. … [Reynolds below is describing Christ’s offers, wooings and entreaties both before and after conversion, which is clear from the beginning and end of the quote] We see then, to conclude all, what an absolute necessity lies upon us of having Christ, because with Him we have All things, and can do all things: without Him we are poor and can do nothing. And the more necessary the duty, the more sinful the neglect: especially considering that Christ withholds not Himself, but is ready to meet, to prevent, to attend every heart that in truth desires Him. If a man have a serious, simple, sincere will, to come wholly to Christ, not to be held back from him by His dearest and closest corruptions, by the sweetest pleasures, or strongest temptations, which can allure or assault him, he may draw near unto Him with boldness, and assurance of acceptation: he has a call, Christ invites [Margin Note: Rev. 22:17], yea entreats him, and therefore he may come: he has a command, Christ requires it of him, and therefore he must come. And now when we have Christ, how careful should we be to keep Him; how tender and watchful over all our behaviors towards Him, lest He be grieved and depart again. The Spirit of the Lord is a delicate spirit, most sensible of those injuries which his friends do Him. Let us therefore take heed of violating, afflicting, discouraging, grieving this Spirit (which is the bond of all our union and interest with Christ) in any of those his sacred breathings and operations upon the Soul. But when He teaches, let us submit and obey, receive the belief and the love of His Truth: when He promises, let us neither distrust nor despise, but embrace as true, and admire as precious, all the offers which He makes to us: when He contends with our lusts in His Word and secret suggestions, let him not always strive, but let us give up our fleshly affections to be crucified by Him: when He woos and invites us, when He offers to lead and to draw us, let us not stop the ear, or pull away the shoulder, or draw backward like froward children, or cast cold water in the face of Grace, by thwarting the motions, and rebelling against the dictates thereof, but let us yield our selves unto Him, captivate all our lusts, and consecrate all our powers, and submit all our desires to His rule and government; and then when He has been a Spirit of union, to incorporate us into Christ’s Body; and a Spirit of unction, to sanctify us with His Grace, He will undoubtedly be a Spirit of comfort and assurance, to seal us unto the day of our full redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Christ, from his Three Treatises</cite></span></figcaption>

<blockquote><p>‘The love of God is the essential property or essence of God, whereby delighting Himself in it, He wishes it the good which He approves.’ To be distinguished are ‘the general love of God’, the object of which is creation generally, so that ‘no one either of men or even of demons may say that he is not loved by God’; God hates the sin in the godless, but loves the nature created by Him — and the ‘special love of God, by which He peculiarly pursues the separate elect.’</p></blockquote>

<div class="actions"><button class="copy" data-copy="“‘The love of God is the essential property or essence of God, whereby delighting Himself in it, He wishes it the good which He approves.’ To be distinguished are ‘the general love of God’, the object of which is creation generally, so that ‘no one either of men or even of demons may say that he is not loved by God’; God hates the sin in the godless, but loves the nature created by Him — and the ‘special love of God, by which He peculiarly pursues the separate elect.’”

<blockquote><p>…our Lord also taught the universality of the love of God in the numerical sense of appropriating it to every individual man… …in the second place, that the work of redemption itself bears in our Lord’s representation a broad cosmical character… Especially the doctrine of the kingdom in its eschatological aspect clearly reveals that the divine love sets for its goal not the saving of isolated individuals out of the world, but the salvation of the world as an organic whole… There is, however, still a third sense, in which Jesus leads us to ascribe universality to the divine love. This is done not so much in explicit form as by the implications of His attitude toward sinful men in general.</p></blockquote>

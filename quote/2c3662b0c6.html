<main class="wrap"><figure class="quote" id="q-2c3662b0c6" data-kw="">
<blockquote><p>But before we come to the proper and peculiar exercises, we will set down reasons that prove it perpetual for the Church in this world, to have one such day in seven to be dedicated unto the Lord, that so we may have the use of it in our conscience, and of the ceremony ceased I will speak in the end. First because of the covenant of the law, which biddeth us doe and so live thereby, driving us unto Christ, Rom. 10. 5. There are ten parts, called ten words or sentences, of which if we take away this, there will be but nine, Exod. 34. 18.

Secondly, if Adam being in his soundness, because his mind not being infinite, could not do his work, and praise God, pray to him, meditate in his creatures of his wisdom, mercy, &amp;c. had need for that purpose, wholly to give himself over more fully then he did by times in other days once in seven days: how much more having in us so much ignorance, hardness of heart, &amp;c. that we might help our weakness, and grow forward? Gene. 2. 3. 15.

Thirdly, when this was a piece of the image of God in him, that he did not only those daily duties after mentioned together with tilling and keeping the garden, Gene. 2. 15. every day, but was further able one whole day in soul and body to give over himself to the former Sabbath, exercise of praying, praising, &amp;c. either we must not know, and not be born again to this piece of excellency, or else we must have this peculiar commandment to humble us, and in this point to drive us unto Christ, afterward also be a rule and square unto us of the same.

Fourthly, the Apostles in taking this day, and giving it the name of the Lord’s day, Apoc. 1. 10. as before that was called the Lord’s Sabbath, and ordaining public exercises, Acts 10. 7. and private, 1. Cor. 4. 2. As they did show that in the particular seventh day it was ceremonial: so in the common necessity it was perpetual according to the foresaid equity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief treatise upon the first table of the law orderly disposing the principles of religion, whereby we may examine our selves</cite>, ([Middleburg: R. Schilders, 1588]), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-e3edb3ec83" data-kw="">
<blockquote><p>The imposed use of Indifferencies has been (like the Canaanites to the Israelites) pricks in the eyes, and thorns (or goads) in the sides of, i. e. matter of much mischief and vexation to, the Church of God almost in all ages; Especially, in the Jewish Church, when it drew towards the dregs, much of this sediment appeared. How far the Papal, Antichristian Church is over-run with this ill humour, is notorious:

And it’s one great evil which our English Church now labours and groans under at this day. ‘Tis this, which has been the apple of contention, and bone of division; the stone of stumbling, and rock of offence among us, ever since the beginning of the Reformation, in the time of our Josiah, King Edward the 6th. And after many years freedom from this itch, it brake out again some years since, to our great disturbance, and scratching of one another.</p></blockquote>

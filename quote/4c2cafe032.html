<blockquote><p>When I deny that the body of Christ is present locally, substantially, bodily, and carnally, it must not be inferred that we eat Christ’s body falsely, in pretense or imagination. For if they understand by these words the reality of the thing itself, I will not deny that the body of Christ is truly received by us. What we comprehend by faith must not be considered false or feigned, counterfeit or a phantom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), dedication, p. 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-763842ad09" data-kw="">
<blockquote><p>The foreign emigration to which we are constantly exposed, is an additional reason for alarm. The spirit of Europe generally is unfriendly to our religious as well as to our civil institutions, in the form which has been peculiar to them from the beginning. It is hostile for the most part altogether, to the Sabbath as honoured and observed by our fathers. And yet this spirit, under its worst character, is invading our shores at every point, and labouring to incorporate itself with the native mind of the country from one end of the land to the other.

It is no longer an element so small in itself, that it can be taken up and moulded by the surrounding mass to its own consistency and colour; but already it has actually changed the complexion of our national character, and imparted a tinge to it which may be easily read and understood. And every year is adding immensely to the volume and force, with which the strange transforming power is bearing in upon the ancient order of our institutions.

Every year finds us as a people more disposed to new impressions from abroad, and furnishes at the same time a heavier tide of emigration to take advantage of our condition. It is hard to say, how quickly the very genius of the country may not be literally overwhelmed and lost beneath this moral deluge. Instead of thousands we may soon have millions flowing in upon us, till we shall hardly be able to recognize our distinctive nationality at all, amid the new forms of life and the new modes of thought that shall be found prevailing on every side, rife with the foul spirit of Europe.

Every reflecting person must see, that the Sabbath is in great danger from this quarter. Unless a very vigorous effort be made on the part of the church, to withstand the lax views and loose practice which are thus gathering strength from day to day, the next generation may behold the day converted into a mere festival for popular recreation. Such is the tendency of the feelings we are importing from abroad; such is the result, which both the infidelity and popery of the old world may be expected to aid the secularism of the new, in struggling as quickly as possible to realize.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-presbytery-of-ohio.html">The Presbytery of Ohio</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Claims of the Christian Sabbath; A Report Read and Adopted April 21, 1836, at a Meeting of the Presbytery, held at Raccoon Church</cite>, (Pittsburgh PA: William Allinder, 1836), pp 5-7.</span></figcaption>

</figure><figure class="quote" id="q-a96796ee1c" data-kw="">
<blockquote><p>Took bread. Matthew 26:26 , it is said, “ as they were eating, ” i.e. during the repast, “ Jesus took bread, ” that is, he took of the bread lying on the table; and as it was at the time of the Passover, there is no doubt that the bread used was unleavened. It was the thin Passover bread of the Jews. But as no part of the significancy of the rite depends on the kind of bread used, as there is no precept on the subject, and as the apostles subsequently in the celebration of the ordinance used ordinary bread, it is evidently a matter of indifference what kind of bread is used. It was however for a long time a subject of bitter controversy. At first the Latins and Greeks used leavened bread; when the Latins introduced the unleavened wafer from superstitious fear of any of the fragments being dropped, the Greeks retained the use of fermented bread, and accused the Latins of Judaizing. Romanists and Lutherans use unleavened wafers; Protestants generally ordinary bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1878 | This quote was compiled by Andy Webb</span></figcaption>

</figure><figure class="quote" id="q-c40c632b2a" data-kw="">
<blockquote><p>The third innovation is that the word of promise, ‘This is my body,’ ‘This cup is the new testament, etc.’ is not uttered demonstratively when the elements are delivered to every communicant. It is not enough that the words of the institution were rehearsed before by way of history narratively, or materially. This sacrament is an imitation of Christ, not a recital of his words and actions; it is to do as He did, and not to report what He did, says Pierre du Moulin.</p></blockquote>

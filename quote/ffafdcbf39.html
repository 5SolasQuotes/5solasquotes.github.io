<blockquote><p>M.—Though we should admit the justness of your reasonings upon that ancient example, we are still more closely pressed by a more modern instance in Paul, who commands us to pray for the life of sovereigns, and is far from allowing us to renounce their authority, much less to dethrone, and, when dethroned, to murder them. And what princes does he thus recommend to our prayers? Of all that ever existed the most cruel, Tiberius, Caligula, Claudius, and Nero; for these were co-eval with the epistles of Paul.

B.—In comparing the writings of all the philosophers and lawyers with Paul’s, you seem to me to act rightly, in allowing to his authority so much preponderance in the balance. But you should consider whether you have sufficiently weighed his opinions; for you ought to examine, not only his words, but also at what times, to what persons, and for what purposes, he wrote. First, then, let us see what Paul wrote. In the third chapter of his letter to Titus, he writes, “Put subjects in mind to be obedient to principalities and powers, and to be ready for every good work.” Here you see, I presume, what end he assigns to obedience. In the second chapter of his epistle to Timothy, the same apostle writes, “That we should pray for all men, even for kings and other magistrates, that we may lead a peaceable life, in all godliness and purity.” Here, also, you see that he proposes, as the end of prayer, not the security of kings, but the tranquillity of the church; and, hence, it will be no difficult matter to comprehend his form of prayer.

In his epistle to the Romans, his definition of a king is accurate, even to logical subtlety; for he says that “a king is God’s minister, wielding the sword of the law for the punishment of the bad, and for the support and aid of the good.” “For these passages of Paul’s,” says Chrysostom, “relate not to a tyrant, but to a real and legitimate sovereign, who personates a genuine god upon earth, and to whom resistance is certainly resistance to the ordinance of God.” Yet, though we should pray for bad princes, we ought not, therefore, to infer directly that their vices should not be punished like the crimes of robbers, for whom also we are ordered to pray; nor, if we are bound to obey a good, does it follow that we should not resist a bad prince?

Besides, if you attend to the cause which induced Paul to commit these ideas to writing, you will find, I fear, that this passage is greatly against you; since he wrote them to chastise the temerity of certain persons, who maintained that Christians ought not to be under the control of magistrates. For, since the magistrates were invested with authority on purpose to restrain wicked men, to enable us all to live under equal laws, and to exhibit a living example of divine justice, they contended that he was of no use among persons so uncontaminated by the contagion of vice as to be a law to themselves. Paul, therefore, does not here treat of the magistrate, but of the magistracy—that is, of the function and duty of the person who presides over others, nor of this nor of that species of magistracy, but of every possible form of government.

Nor does he contend against those who maintained that bad magistrates ought not to be punished, but against persons who renounced every kind of authority; who, by an absurd interpretation of Christian liberty, affirmed that it was an indignity to men emancipated by the Son of God, and directed by God’s Spirit, to be controlled by any human power. To refute this erroneous opinion, Paul shows that magistracy is not only a good, but a sacred and divine ordinance, and instituted expressly for connecting assemblages and communities of men, and to enable them, conjointly, to acknowledge God’s blessings, and to abstain from mutual injuries.

Persons raised to the rank of magistrates God has ordered to be the conservators of his laws; and, therefore, if we acknowledge laws to be, as they certainly are, good things, we must also acknowledge that their conservators are entitled to honour, and that their office is a good and useful institution. But the magistrate is terrible. To whom, I beseech you? To the good, or to the bad? To the good he cannot be a terror, as he secures them from injury; but, if he is a terror to the bad, it is nothing to you, who are directed by the Spirit of God. What occasion, then, is there, you will say, for subjecting me to the magistrate, since I am God’s freeman? Much. To prove yourself God’s freeman, obey his laws; for the Spirit of God, of whose direction you boast, framed the laws, approves of magistracy and authorises obedience to the magistrate.

On this head, therefore, we shall easily come to an agreement, that a magistrate is necessary in the best-constituted societies, and that he ought to be treated with every kind of respect. Hence, if any person entertains contrary sentiments, we deem him insane, intestable, and worthy of the severest punishment; since he openly resists God’s will communicated to us in the Scriptures. For, supposing that no punishment for the violation of all laws, human and divine, should be inflicted on a Caligula, a Nero, a Domitian, and other tyrants of that sort, you have here no countenance from Paul, who is discoursing of the power of magistrates and of bad men by whom it is badly exercised. Indeed, if you examine that kind of tyrants by Paul’s rule, they will not at all be magistrates.

Again, if you should contend that even bad princes are ordained by God, take care lest your language should be charged with captiousness. For God, to counteract poison by poison, as an antidote, sometimes sets a bad man over bad men for their punishment; and yet, that God is the author of human wickedness, no man in his senses will dare to affirm, as none can be ignorant that the same God is the author of the punishments inflicted on the wicked. Even a good magistrate generally chooses a bad man to be the executioner in punishing the guilty. This executioner, though thus appointed by the magistrate to that office, is not, in consequence, indulged with impunity for every crime, nor raised so high as not to be amenable to the laws.

On this comparison I shall dwell no longer, lest the sycophants of the court should cry out that I speak with too little reverence of the supreme magistrate. But, let their outcries be ever so loud, certainly they will never be able to deny that the function of the executioner is a part of public, and perhaps also of kingly duty, even by the confession of kings themselves; since, when violence is offered to any public minister, they complain that their own person and majesty are violated. Now, if any thing can, certainly the punishment of the wicked must constitute a part of the king’s executive duty.

In what predicament stand the governors of cities, the commandants of camps, the mayors of corporations, and other superior officers? Does Paul order us to be obedient also to them? or does he hold them private persons? But not only all inferior magistrates, but even those who are upon an equality with kings, it is customary to call to an account for mal-administration. I could wish, therefore, that those who dream of this mighty power conferred on kings by Paul’s words would either show, from the same Paul, that kings alone are to be understood in the name powers, and, therefore, to be alone exempted from legal animadversion; or, if the word powers mean also other magistrates appointed by the authority of the same God for the same purpose, that they would also show where all magistrates are pronounced to be independent of law, and released from the fear of punishment; or, where that immunity has been granted only to kings, and denied to others invested with public authority.

M.—But to the higher powers he commands all to be obedient.

B.—He does so; but under the name of powers he must necessarily comprehend other magistrates also, unless you should, perhaps, imagine that he thought states not under a regal government to be without powers, and therefore mere anarchies. … Paul does not, in the least, refer to tyrants; as they accommodate the whole plan of their government, not to the utility of the people, but to the gratification of their own lusts.</p></blockquote>

+could+wish%2C+therefore%2C+that+those+who+dream+of+this+mighty+power+conferred+on+kings+by+Paul%E2%80%99s+words+would+either+show%2C+from+the+same+Paul%2C+that+kings+alone+are+to+be+understood+in+the+name+powers%2C+and%2C+therefore%2C+to+be+alone+exempted+from+legal+animadversion%3B+or%2C+if+the+word+powers+mean+also+other+magistrates+appointed+by+the+authority+of+the+same+God+for+the+same+purpose%2C+that+they+would+also+show+where+all+magistrates+are+pronounced+to+be+independent+of+law%2C+and+released+from+the+fear+of+punishment%3B+or%2C+where+that+immunity+has+been+granted+only+to+kings%2C+and+denied+to+others+invested+with+public+authority.%0A%0AM.%E2%80%94But+to+the+higher+powers+he+commands+all+to+be+obedient.%0A%0AB.%E2%80%94He+does+so%3B+but+under+the+name+of+powers+he+must+necessarily+comprehend+other+magistrates+also%2C+unless+you+should%2C+perhaps%2C+imagine+that+he+thought+states+not+under+a+regal+government+to+be+without+powers%2C+and+therefore+mere+anarchies.+%E2%80%A6+Paul+does+not%2C+in+the+least%2C+refer+to+tyrants%3B+as+they+accommodate+the+whole+plan+of+their+government%2C+not+to+the+utility+of+the+people%2C+but+to+the+gratification+of+their+own+lusts.%E2%80%9D%0A%0A%E2%80%94+George+Buchanan%2C+De+Jure+Regni+Apud+Scotos%3B+A+Dialogue+Concerning+the+Rights+of+the+Crown+in+Scotland%2C+trans.+Robert+MacFarlan+%281579%3B+Colorado+Springs%3A+Portage+Publications%2C+2016%29%2C+pp+55-57%2C+58-59.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fffafdcbf39.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ffafdcbf39.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/28/george-buchanan-does-paul-endorse-tyranny/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…and I declare before God and the world that it was far from the intention of those that contrived it [the SL&amp;C], to wrong the King and his posterity… and the foresaid supplication doth manifestly declare their intent being only to have settled a conformity in Kirk government throughout all his Majesty’s dominions… I do further declare before God and the World that they [the English] are guilty of the breach of the Sacred Covenant, and that we have discharged our duty thereof (which is only promissory &amp; conditional as all oaths de futuro [of the future] are) by endeavoring to effectuate it quantum in nobis erat [insofar as we are in it], and that we are absolved in foro poli &amp; soli [in the sight of the city and self] of any oath or vow contained therein, insofar as concerns the settling of religion in the Kirk of England and Ireland, and that we are only bound thereby to preserve the Reformation of Religion in our own Kirk and Kingdom [of Scotland]… Therefore I exhort and conjure you, again and again, in the bowels of our Lord Christ, and words of a dying man, especially my brethren of the ministry… to stand fast and firm to this point of your Covenant, which you were bound to before by the Law of God and of this Land [of Scotland], and never suffer your selves by all the gilded allurement of this world, which will prove bitter and deceitful at last, to relinquish it.</p></blockquote>

<blockquote><p>And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…</p></blockquote>

<blockquote><p>I. The first thing I have to show is the general excellence of freedom.

On this point some readers may think it needless to say anything: they imagine that all men know the value of freedom, and that to dwell on it is a mere waste of time. I do not agree with such people at all. I believe that myriads of Englishmen know nothing of the blessings which they enjoy in their own land: they have grown up from infancy to manhood in the midst of free institutions. They have not the least idea of the state of things in other countries: they are ignorant alike of those two worst forms of tyranny,—the crushing tyranny of a cruel military despot, and the intolerant tyranny of an unreasoning mob. In short, many Englishmen know nothing of the value of liberty, just because they have been born in the middle of it, and have never been for a moment without it.

I call then on every one who reads this paper to remember that liberty is one of the greatest temporal blessings that man can have on this side the grave. We live in a land where our bodies are free. So long as we hurt nobody’s person, or property, or character, no one can touch us: the poorest man’s house is his castle. We live in a land where our actions are free. So long as we support ourselves, we are free to choose what we will do, where we will go, and how we will spend our time. We live in a land where our consciences are free. So long as we hold quietly on our own way, and do not interfere with others, we are free to worship God as we please, and no man can compel us to take his way to heaven. We live in a land where no foreigner rules over us. Our laws are made and altered by Englishmen like ourselves, and our Governors dwell by our side, bone of our bone and flesh of our flesh.

In short, we have every kind of freedom to an extent which no other nation on earth can equal. We have personal freedom, civil freedom, religious freedom, and national freedom. We have free bodies, free consciences, free speech, free thought, free action, free Bibles, a free press, and free homes. How vast is this list of privileges! How endless the comforts which it contains! The full value of them can never perhaps be known. Well said the Jewish Rabbins in ancient days: ‘If the sea were ink and the world parchment, it would never serve to describe the praises of liberty.’

The want of this freedom has been the most fertile cause of misery to nations in every age of the world. What reader of the Bible can fail to remember the sorrows of the children of Israel, when they were bondmen under Pharaoh in Egypt, or under Philistines in Canaan? What student of history needs to be reminded of the woes inflicted on the Netherlands, Poland, Spain, and Italy by the hand of foreign oppressors, or the Inquisition? Who, even in our own time, has not heard of that enormous fountain of wretchedness, the slavery of the Negro race? No misery certainly is so great as the misery of slavery.

To win and preserve freedom has been the aim of many national struggles which have deluged the earth with blood. Liberty has been the cause in which myriads of Greeks, and Romans, and Germans, and Poles, and Swiss, and Englishmen, and Americans have willingly laid down their lives. No price has been thought too great to pay in order that nations might be free.

The champions of freedom in every age have been justly esteemed among the greatest benefactors of mankind. Such names as Moses and Gideon in Jewish history, such names as the Spartan Leonidas, the Roman Horatius, the German Martin Luther, the Swedish Gustavus Vasa, the Swiss William Tell, the Scotch Robert Bruce and John Knox, the English Alfred and Hampden and the Puritans, the American George Washington, are deservedly embalmed in history, and will never be forgotten. To be the mother of many patriots is the highest praise of a nation.

The enemies of freedom in every age have been rightly regarded as the pests and nuisances of their times. Such names as Pharaoh in Egypt, Dionysius at Syracuse, Nero at Rome, Charles IX. in France, bloody Mary in England, are names which will never be rescued from disgrace. The public opinion of mankind will never cease to condemn them, on the one ground that they would not let people be free.</p></blockquote>

On this point some readers may think it needless to say anything: they imagine that all men know the value of freedom, and that to dwell on it is a mere waste of time. I do not agree with such people at all. I believe that myriads of Englishmen know nothing of the blessings which they enjoy in their own land: they have grown up from infancy to manhood in the midst of free institutions. They have not the least idea of the state of things in other countries: they are ignorant alike of those two worst forms of tyranny,—the crushing tyranny of a cruel military despot, and the intolerant tyranny of an unreasoning mob. In short, many Englishmen know nothing of the value of liberty, just because they have been born in the middle of it, and have never been for a moment without it.

I call then on every one who reads this paper to remember that liberty is one of the greatest temporal blessings that man can have on this side the grave. We live in a land where our bodies are free. So long as we hurt nobody’s person, or property, or character, no one can touch us: the poorest man’s house is his castle. We live in a land where our actions are free. So long as we support ourselves, we are free to choose what we will do, where we will go, and how we will spend our time. We live in a land where our consciences are free. So long as we hold quietly on our own way, and do not interfere with others, we are free to worship God as we please, and no man can compel us to take his way to heaven. We live in a land where no foreigner rules over us. Our laws are made and altered by Englishmen like ourselves, and our Governors dwell by our side, bone of our bone and flesh of our flesh.

In short, we have every kind of freedom to an extent which no other nation on earth can equal. We have personal freedom, civil freedom, religious freedom, and national freedom. We have free bodies, free consciences, free speech, free thought, free action, free Bibles, a free press, and free homes. How vast is this list of privileges! How endless the comforts which it contains! The full value of them can never perhaps be known. Well said the Jewish Rabbins in ancient days: ‘If the sea were ink and the world parchment, it would never serve to describe the praises of liberty.’

<blockquote><p>Those prisoners being taken at [the Battle of] Bothwell Bridge [1679] were pressed to bind themselves not to take up arms against the king’s person and authority, under the certification of no less punishment than death. … Though they had not been subjects, but only prisoners of war in the victor’s power, to deprive them of life or liberty forever, I suppose they could not have been blamed for the preservation of their life to have given in such a bond; some who were taken prisoners by [Oliver] Cromwell, for their liberty engaged not to carry arms against him; and I do not remember that any censured them for it. What they [the opponents against taking the Scottish Indulgence] say in a parenthesis, that hazard will not make a moral change in actions, is a palpable error: If there were twenty with drawn swords waiting at the church door to kill a minister if he should come to preach, it were rash, furious, self-destroying, self-murdering zeal for a minister to venture to go to preach at that time, in despite of the hazard, so certain, visible and unavoidable, and yet it were his duty at another time to preach where there were no such hazard. For a merchant to cast his wares in the sea in a calm were wicked folly contrary to the 8th Command, a stealing from his family and himself; and yet in a storm, Paul and the passengers and mariners thought it their duty to cast out both goods and tackling of the ship.</p></blockquote>

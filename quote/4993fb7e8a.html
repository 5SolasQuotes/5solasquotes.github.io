<main class="wrap"><figure class="quote" id="q-4993fb7e8a" data-kw="">
<blockquote><p>With regard to “removing… monuments of idolatry,” establishment Anglicans had long affirmed and practiced this, interpreting the phrase as referring (only) to such Romanist monuments and not to the Anglican ceremonies, the latter being held to be not inherently unlawful.¹ ¹ So bishop Richard Cox (c. 1500–1581), who opposed John Knox at Frankfurt regarding the Anglican Liturgy, was a zealous and firm remover of Romanist monuments of superstition and idolatry: Wenig, “Reformation during the Episcopate of Richard Cox,” pp. 167 &amp; 170.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction”, “Larger Catechism: 2nd Commandment</cite>, Question 108” in A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025), p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f7d4f5737" data-kw="">
<blockquote><p>See the goodness of God to our nation, who hath brought us out of mystical Egypt, delivering us from popery, which is Romish idolatry, and hath caused the light of his truth to break forth gloriously among us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, The Second Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“See the goodness of God to our nation, who hath brought us out of mystical Egypt, delivering us from popery, which is Romish idolatry, and hath caused the light of his truth to break forth gloriously among us.”

— Thomas Watson, The Ten Commandments, The Second Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSee+the+goodness+of+God+to+our+nation%2C+who+hath+brought+us+out+of+mystical+Egypt%2C+delivering+us+from+popery%2C+which+is+Romish+idolatry%2C+and+hath+caused+the+light+of+his+truth+to+break+forth+gloriously+among+us.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+The+Second+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9f7d4f5737.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f7d4f5737.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>

</figure><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>

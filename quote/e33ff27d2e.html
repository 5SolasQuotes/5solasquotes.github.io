<blockquote><p>The Romish Doctrine concerning Purgatory, Pardons, Worshipping, and Adoration, as well of Images as of Reliques, and also invocation of Saints, is a fond thing vainly invented, and grounded upon no warranty of Scripture, but rather repugnant to the Word of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d6582df282" data-kw="">

— John Calvin, Institutes of the Christian Religion, 3.5.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+it+is+perfectly+clear%2C+from+what+was+lately+said%2C+that+the+blood+of+Christ+is+the+only+satisfaction%2C+expiation%2C+and+cleansing+for+the+sins+of+believers%2C+what+remains+but+to+hold+that+purgatory+is+mere+blasphemy%2C+horrid+blasphemy+against+Christ%3F%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.5.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd6582df282.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d6582df282.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-b492e8c01d" data-kw="">
<blockquote><p>What then must our conclusion be, but that these men act presumptuously in daring, out of their own brains, to make a fabric of that which has no foundation in the word of God? unless, perhaps, they would have us to receive their device of Purgatory as a kind of vaticination vented by ventriloquism; for there is nothing which serves so well to fill their bellies!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to Session VI / Justification canons</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What then must our conclusion be, but that these men act presumptuously in daring, out of their own brains, to make a fabric of that which has no foundation in the word of God? unless, perhaps, they would have us to receive their device of Purgatory as a kind of vaticination vented by ventriloquism; for there is nothing which serves so well to fill their bellies!”

</figure><figure class="quote" id="q-1b5846db12" data-kw="">
<blockquote><p>We prove the vanity of this fiction in this way. First, because scripture teaches that the faithful (for whom they want Purgatory to be constructed) pass from here through death into eternal life. John 5:24 — &quot;Whoever hears my word and believes him who sent me has eternal life and will not come under judgment but has passed from death to life.&quot; Therefore they do not come into the judgment of Purgatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis on Purgatory</cite>, p. 1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fc14d922a8" data-kw="">
<blockquote><p>2. What is essential for making a minister who is extraordinarily called of God, is not ever more essential to the making of a minister ordinarily called of God, in an island where the Gospel is: if all the pastors should die, the people might choose pastors to themselves, but they could not then make pastors; God only, without the ministry of other pastors, in that case should make pastors; but it follows not hence that pastors ordinarily have not their calling to be pastors from the ordination of pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 266-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b26aa11de" data-kw="">
<blockquote><p>3. Christ gives gifts to men now in the due use of means and not by miracle: Therefore He gives them in great diversity and by hard study and long time, Heb. 5:12, “For the time they ought to have been teachers,” etc. Therefore a novice must not be a bishop, but an elder [older person], whence the office had its name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. Christ gives gifts to men now in the due use of means and not by miracle: Therefore He gives them in great diversity and by hard study and long time, Heb. 5:12, “For the time they ought to have been teachers,” etc. Therefore a novice must not be a bishop, but an elder [older person], whence the office had its name.”

</figure><figure class="quote" id="q-89c952eadc" data-kw="">
<blockquote><p>If they say that men of such erroneous principles, if they cannot be rectified, are bound to give up the ministry to others of better judgments. I answer: 1. Show me but where those men are, in so full a number as may supply the churches necessities, but so far as that I and such as I may conscionably cease without the church’s loss, and I here promise that I will joyfully give up my office whenever any such fitter man shall be called to my place. And I think the rest of my brethren will do the like. But we live in the open world, where we have opportunity to know men, as well as others: and we cannot see any such plentiful choice of able, pious men to supply all our places if we should give them up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“If they say that men of such erroneous principles, if they cannot be rectified, are bound to give up the ministry to others of better judgments. I answer: 1. Show me but where those men are, in so full a number as may supply the churches necessities, but so far as that I and such as I may conscionably cease without the church’s loss, and I here promise that I will joyfully give up my office whenever any such fitter man shall be called to my place. And I think the rest of my brethren will do the like. But we live in the open world, where we have opportunity to know men, as well as others: and we cannot see any such plentiful choice of able, pious men to supply all our places if we should give them up.”

</figure><figure class="quote" id="q-5707ed0f67" data-kw="">
<blockquote><p>I answer, there is, in an extraordinary necessity, where there are no presbyters at all, as little necessity of ordination if there be presbyters in other congregations to ordain. And since you never read that any in the apostolic Church ordained pastors, but pastors only; why, but we may have recourse to a presbytery of other congregations for ordination, as well as for baptizing [in such circumstances, contra congregationalists];</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 195</span></figcaption>

</figure><figure class="quote" id="q-1b61a2764d" data-kw="">
<blockquote><p>…the sign of imposition of hands helps not the cause of our Opposites, because it’s the example of Christ and the apostles, and their disciples, which our [imposed] ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral [sign], for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>

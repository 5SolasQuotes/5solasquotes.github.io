<main class="wrap"><figure class="quote" id="q-080fdcf6c5" data-kw="">
<blockquote><p>It was framed and concluded by the representatives of kingdoms in concurrence with those of the Church; it was sworn by them in their public capacity; at their call and by their authority, it was afterwards sworn by the body of all the people in their different ranks and orders; and finally it was ratified and pronounced valid by laws both civil and ecclesiastical. The public faith was thus plighted by all the organs through which a nation is accustomed to express its mind and will. Nothing was wanting to complete the national tie, and to render it permanent; unless it should be maintained that absolute unanimity is necessary, and that a society cannot contract lawful engagements to God or man, as long as there are individuals who oppose and are dissentient. Sanctions less sacred, and pledges less numerous would have given another nation, or even an individual, a perfect right to demand from Britain the fulfillment of any treaty or contract; and shall not God – who was not only a witness, but a principal party, and whose honor and interests were immediately concerned in this transaction – have a like claim? Or shall we “break the covenant and escape? [Ezekiel 17:15]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two discourses on the unity of the church, her divisions, and their removal. To which is subjoined, a short view of the plan of religious reformation originally adopted in the Secession</cite>, (1821; Dallas, 1989), pp 196-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6b823de2b7" data-kw="">
<blockquote><p>Many today, from Radical Two Kingdom theologians to American Theonomists, think that you can be Reformed without adhering to the establishment principle. Indeed, some of them even accuse establishmentarians of being crypto-papists or crypto-communists (it is hard to know which is more absurd). The reality, however, is that the denial of the establishment principle is enough to exclude one from the pale of Reformed orthodoxy. As the Scottish Seceder William MacKray reminds us the Reformers, all of whom rejected Popery as the antichrist, regarded the establishment principle as anything but a left-over from Rome:

Among the Reformers from Popery — those master-spirits of the sixteenth century — the doctrine, that it is the duty of Christian rulers to protect the Church and her Institutions, and to provide for their maintenance throughout their dominions — was any thing but a matter of doubtful dispute. They demanded, and, with admirable resolution, persevered in endeavoring to accomplish the overthrow of the whole system, root and branch, of Papal idolatry and superstition, that had been for ages the curse and scourge of the nations of Europe;—but they demanded, at the same time, that the emancipated nations should do homage to Christ, by assuming and maintaining a pure and public profession of his name; and that the kings of the earth, who had long given their power to the beast, should now transfer it to the service of Him who “is the Prince of the kings of the earth.” It has been said, indeed, that this doctrine was one of the abominations of Antichrist, which they brought with them from the darkness in which they had been involved. But the assertion is altogether gratuitous.

The truth is, my brethren, the minds of these men were anything but predisposed to retain in their profession the peculiarities of Popery. They had felt its yoke to be so galling, and the utter ungodliness of the whole system was, in the light of God’s word, so plainly revealed before their view, that they were under strong inducement, in the circumstances in which they were placed, to reject every thing that had been at all connected with it. It was because they saw the principle in question to be so important for the welfare of the Church, and so clearly deducible from that divine record which they had been honored to bring forth from Antichristian darkness to the view of mankind, that they retained it in their creed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>

<blockquote><p>6. They [civil magistrates] may, and ought to interpose their authority, for inhibiting the receiving and hearing, or conversing with known and manifest seducers: for, this is but to discharge, and thereby to preserve the people from running to their own hazard, even as men ought to be commanded to keep at distance with a place or person suspected to be infectious because of the pestilence; Neither could such a restraint be accounted any diminution of their just liberty, yea this were but a putting to of their sanction to the clear direction which the Lord lays upon His people, and therefore there could be no hazard to miscarry in it, especially where the application to such and such persons, might be as clearly discernable from the Word as the duty is.</p></blockquote>

<blockquote><p>This offence was plagued with most sharp punishment even in the beginning almost, and as soon as the world was created. Pharao [sic], the king of Egypt, commanded Sara, Abraham’s wife, to be taken away and carried to his palace, that he might use her as his wife; thinking verily that she had been Abraham’s sister. But the scripture saith, “The Lord vexed Pharaoh and all his house with great plagues, because of Sara, Abraham’s wife.” Lo, here the king of Egypt is punished with grievous plagues for his adultery; and yet he knew not that Sara was Abraham’s wife: how great plagues therefore are prepared for the men that wittingly and willingly, without all shame, commit adultery! To Abimelech, king of the Philistines, the Lord doth say, “Lo, thou shalt die, because of the woman which thou hast taken away from her husband.” And yet this king also had taken away Sara, not knowing that she was Abraham’s wife. Joseph, being provoked to adultery by his master’s wife, doth simply say, “How should I do this great wickedness, and sin against God?” Every woth doth bear some weight: for adultery is an heinous sin. Whereupon in the book of Job we find these words of Job himself: “If mine heart have been deceived by a woman, or I have laid wait at my neighbour’s door; then let my wife be another man’s harlot, and let other men have to do with her. For this is a wickedness and sin that is worthy to be judged to death: yea, it is a fire that utterly should consume and root out all mine increase.” [Job 31] Job saith that he hath not only not committed adultery to defile another man’s wife. He confesseth that adultery is a sin, and so grievous an offence, that it doth deserve to have the adulterer’s wife to be defiled with adultery. He addeth that adultery is a fire that utterly consumeth and devoureth all things; and, lastly, that it is a sin to be judged, and punished with death.</p></blockquote>

— Heinrich Bullinger, Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 410-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+offence+was+plagued+with+most+sharp+punishment+even+in+the+beginning+almost%2C+and+as+soon+as+the+world+was+created.+Pharao+%5Bsic%5D%2C+the+king+of+Egypt%2C+commanded+Sara%2C+Abraham%E2%80%99s+wife%2C+to+be+taken+away+and+carried+to+his+palace%2C+that+he+might+use+her+as+his+wife%3B+thinking+verily+that+she+had+been+Abraham%E2%80%99s+sister.+But+the+scripture+saith%2C+%E2%80%9CThe+Lord+vexed+Pharaoh+and+all+his+house+with+great+plagues%2C+because+of+Sara%2C+Abraham%E2%80%99s+wife.%E2%80%9D+Lo%2C+here+the+king+of+Egypt+is+punished+with+grievous+plagues+for+his+adultery%3B+and+yet+he+knew+not+that+Sara+was+Abraham%E2%80%99s+wife%3A+how+great+plagues+therefore+are+prepared+for+the+men+that+wittingly+and+willingly%2C+without+all+shame%2C+commit+adultery%21+To+Abimelech%2C+king+of+the+Philistines%2C+the+Lord+doth+say%2C+%E2%80%9CLo%2C+thou+shalt+die%2C+because+of+the+woman+which+thou+hast+taken+away+from+her+husband.%E2%80%9D+And+yet+this+king+also+had+taken+away+Sara%2C+not+knowing+that+she+was+Abraham%E2%80%99s+wife.+Joseph%2C+being+provoked+to+adultery+by+his+master%E2%80%99s+wife%2C+doth+simply+say%2C+%E2%80%9CHow+should+I+do+this+great+wickedness%2C+and+sin+against+God%3F%E2%80%9D+Every+woth+doth+bear+some+weight%3A+for+adultery+is+an+heinous+sin.+Whereupon+in+the+book+of+Job+we+find+these+words+of+Job+himself%3A+%E2%80%9CIf+mine+heart+have+been+deceived+by+a+woman%2C+or+I+have+laid+wait+at+my+neighbour%E2%80%99s+door%3B+then+let+my+wife+be+another+man%E2%80%99s+harlot%2C+and+let+other+men+have+to+do+with+her.+For+this+is+a+wickedness+and+sin+that+is+worthy+to+be+judged+to+death%3A+yea%2C+it+is+a+fire+that+utterly+should+consume+and+root+out+all+mine+increase.

<main class="wrap"><figure class="quote" id="q-9af99c13b3" data-kw="">
<blockquote><p>First, and most elementally and centrally, it is that one day in seven is distinguished from the other six. That day is to be sanctified, and at the heart of the word “sanctify” is the idea of distinction and separation. This one day is set off, it is placed in a distinct category. This import of the word cannot be evaded and it is to be very carefully marked, for on it depends the whole notion of what we may and must call the “sanctity” of the Sabbath.

It is not, however, the bare notion of distinction or separation that is expressed in the commandment. The command to sanctify occurs in a context. “Six days shalt thou labour, and do all thy work: but the seventh day is the sabbath of the Lord thy God.” And it is not only in the context of the remainder of the commandment, but also in the context of the other commandments. “Thou shalt have no other gods before me.” “I the Lord thy God am a jealous God.” “Thou shalt not take the name of the Lord thy God in vain.” It is separation, therefore, to God, to the specific purpose of contemplation upon Him and specific occupation with His work in contrast with their own work. In this kind of distinction or sanctity the meaning of the fourth commandment resides. Abolish it, and the essence of the commandment is destroyed.

There is no purpose in contending for the moral obligation of the commandment unless this sanctity is recognised and preserved, for it is the core around which all else is formed and without which all else disintegrates. Just as there is an ineradicable distinction between the six days of creation and the day of rest by which they were followed, so it is here. And it is precisely with this reminder that the commandment itself ends, “For in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the Lord blessed the sabbath day, and hallowed it.”

Israel truly was a holy people; they were separated unto God Jehovah. It might, then, be supposed that the sanctification of one day in seven was inconsistent with the totality of their devotion to God. Yet it is an inescapable fact that this kingdom of priests and holy nation was in the most direct way commanded to separate one day from the other six for a specific purpose. And unless our conception of devotion to God, and of time as it is related to Him, can embrace and appreciate this notion, together with the divine wisdom embodied in it, we can have no understanding of the fourth commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fourth Commandment According to the Westminster Standards in The Calvin Forum</cite></span></figcaption>

</figure><figure class="quote" id="q-7f6dfea4c5" data-kw="">
<blockquote><p>It is not the spirit of man that can, and doth thus work: for first, the spirit of man perceiveth not the things of God, till God’s Spirit acquaint him with them. Secondly, they be foolishness unto him. Thirdly, his wisdom is enmity with God, so as God’s wisdom in divine mysteries, and man’s wisdom can never agree in one. Fourthly, the spirit of man savoreth the things of the flesh, and not of the Spirit of God. Fifthly, his heart is continually evil, till he be regenerate. Sixthly and lastly, it is evidently known by too much miserable experience, that man loveth not the study of the Scriptures, he cannot delight in them, he cannot away to frame his life after them; everyone that hath any spark of divine knowledge, knoweth this to be true from his own natural corruption, both in himself and others also.

Now can any reasonable-minded man think, that such an averse spirit as is in man, so disaffecting the holy Scriptures, and the study thereof, that it can be that Spirit which persuadeth and draweth men, contrary to it corrupt self, to embrace that Religion which is grounded upon the Scriptures, and to press to the obedience thereof? Yea, can it be man’s spirit, that worketh love to such a Religion, which so opposeth man’s corruption, as the worldly wise Politician derideth it, the pleasurable man hateth it, the greedy of gain cannot abide to be ruled by it, and the haughty spirit which hunteth after the pride of life, hath it in great contempt? so as none in very deed, but only such as do deny themselves, do forsake the world, and can be well contented to take up their cross, and follow Christ, either can, or will embrace the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Look beyond Luther: or An answer to that question, so often and so insultingly proposed by our adversaries, asking us; where this our religion was before Luther’s time? Whereto are added sound props to bear up honest-hearted Protestants, that they fall not from their saving-faith</cite>, (London: Felix Kingston, 1623), p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

F+so+as+none+in+very+deed%2C+but+only+such+as+do+deny+themselves%2C+do+forsake+the+world%2C+and+can+be+well+contented+to+take+up+their+cross%2C+and+follow+Christ%2C+either+can%2C+or+will+embrace+the+same.%E2%80%9D%0A%0A%E2%80%94+Richard+Bernard%2C+Look+beyond+Luther%3A+or+An+answer+to+that+question%2C+so+often+and+so+insultingly+proposed+by+our+adversaries%2C+asking+us%3B+where+this+our+religion+was+before+Luther%E2%80%99s+time%3F+Whereto+are+added+sound+props+to+bear+up+honest-hearted+Protestants%2C+that+they+fall+not+from+their+saving-faith%2C+%28London%3A+Felix+Kingston%2C+1623%29%2C+p.+4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f6dfea4c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f6dfea4c5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/04/27/richard-bernard-the-reformed-religion-is-not-of-man/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-7e78c2f41c" data-kw="">
<blockquote><p>3. The stream of the Sinai-Covenant runs much upon doing, and perfection of doing… partly to instruct them, that though God intended not their works and obedience as an antecedent condition requisite to their justification; yet He intended them as a consequent condition and qualification in justified persons, as fruits of true faith, and the way towards the attainment of the promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; medulla bibliorum. The mysterie and marrow of the Bible: viz. God’s covenants with man, in the first Adam, before the fall: and in the last Adam Jesus Christ, after the fall; from the beginning to the end of the world; unfolded &amp; illustrated in positive aphorisms &amp; their explanations</cite>, (London, 1657), book 3, ch. 4, aphorism 2, p. 788</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. The stream of the Sinai-Covenant runs much upon doing, and perfection of doing… partly to instruct them, that though God intended not their works and obedience as an antecedent condition requisite to their justification; yet He intended them as a consequent condition and qualification in justified persons, as fruits of true faith, and the way towards the attainment of the promises.”

</figure><figure class="quote" id="q-bae3caf166" data-kw="">
<blockquote><p>6. That we may escape temporal and eternal punishment. ‘Every tree that bringeth not forth good fruit is hewn down and cast into the fire.’ ‘If ye live after the flesh ye shall die.’ ‘Thou with rebukes dost correct man for iniquity.’ (Mt. 7:19; Rom. 8:13; Ps. 39:11) 7. That we may obtain from God those temporal and spiritual rewards, which, according to the divine promise, accompany good works both in this and in a future life. ‘Godliness is profitable unto all things, having promise of the life that now is, and of that which is to come.’ (1 Tim. 4:8) And if God did not desire that the hope of reward, and the fear of punishment should be moving causes of good works, He would not use them as arguments in the promises and threatenings which He addresses unto us in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Why Good Works are to be Done, or why they are Necessary?’ being section 5 of Question 91 of the Heidelberg Catechism in The Commentary of Zacharias Ursinus on the Heidelberg Catechism</cite>, (Cincinnati, 1851), pp. 482-485 d. 1583 | Ursinus (1534-1583) includes in his exposition:, p. 484</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

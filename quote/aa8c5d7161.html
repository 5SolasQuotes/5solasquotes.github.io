<blockquote><p>From this we evidently perceive (1) by what reckoning the will of God is always and universally effective: the former, that is, the decretive will, is so according to the event, and the latter legislative will is so according to our duty, while at the same time he wills in earnest by his legislative will many things that never occur, just as also many things occur by his decretive will that he does not will. And so we perceive from this as well (2) that there is nothing in these wills on God’s part that is repugnant, since they do not will the same thing or in the same way. …when you rightly distinguish the efficacy of the one from the other, as we have said, not only will you entirely avoid conflict and ineffectiveness in the divine wills, but you will also most fittingly free him from the idea of pretending, about which our adversaries continuously growl at us, saying that God (in our opinion, that is) indicates that he wills many things that he does not in fact will, and thus he pretends. Without any trouble we will answer back that God always wills in fact what he indicates that he wills. But what he wills by his legislative will, although he wills its goodness, yet he does not immediately will its futurity, nor does he indicate it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, bk. 2, ch. 15, sections 22-26 in Theoretical Practical Theology (RHB), vol. 2, pp. 306-8</span></figcaption>

<blockquote><p>XVIII. God by his antecedent will decreed to bestow faith and grace on us, which by his consequent will He resolved to deny us; his former will was moved by his own goodness, but his latter will was provoked by our wickedness: if we have unjustly rejected the grace which by his former will He resolved to give us, may not He justly by his latter will deny that grace, which was rejected so perversely by us. Lord, if thou art resolved by thy first will to bestow grace on me, let me not by my disobedience provoke thy second will to deny that grace unto me. XIX. Our wickedness is the cause that moves God to exercise his acts of justice; but his own bounty is the cause, and our misery the occasion, why He exercises his acts of mercy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>

<blockquote><p>Ch. 3, In what manner is the antecedent will of the salvation of all in God? Because of certain testimonies of Scripture by which it seems to be signified that God wills the salvation of all men, such as 1 Tim. 2; 2 Pet. 3; Eze. 18 and others (concerning which below), it is asked whether the antecedent will according to which (as was said above) God is said to will the salvation of all men, is in God: Formally and properly, just as the consequent will is; that is, whether the act signified by these words, “I would that all men be saved,” is properly and without metaphor in God, just as this act is: “I will Peter to be saved,” in the same way that a merchant in danger at sea properly has both of these acts: “I would that I preserve my merchandise” and “I will to throw it away”; Or, on the other hand, whether a will of this kind is in God only improperly and eminently. [This is what Estius argues below.] The same thing can also be asked concerning the antecedent will with respect to other goods which, although God does not will absolutely, are nevertheless proposed to men as they are either commanded by God through precepts or counseled by Him, or as they can be attained through the observance of counsels or the reception of the sacraments, such as the remission of sins, grace, justification, and virtues. For God also seems antecedently to will these goods for all, while through his goodness He everywhere proposes means to men for attaining them. Therefore it is asked whether the antecedent will of these things is also properly in God. For some have thought so, both because of the Scriptures: which, unless a will or velleity [a wish] and desire of this kind is formally and properly constituted in God will seem to be more simulated expressions than true declarations of divine love and affection toward the human race; and also because Christ properly had such a will by which He would that all be saved. Therefore it would not have been absurd to attribute it to God. They further confirm this by the authority of St. Thomas, who, art. 6, to the 1st, says that God wills antecedently every man to be saved in the same way that a just judge antecedently wills every man to live. Since, therefore, the judge properly wills this, it seems that God also properly wills that. But those who deny that there is formally and properly in God an antecedent will to which the voluntas beneplaciti [will of good-pleasure] corresponds [such as Estius] judge much more probably that the will signified by the name ‘velleity’ is not in God in this way. They say: That it is sufficient for a will of this kind to be constituted in God eminently, or by some trope, just as anger, repentance, mercy, and whatever good affections are in God are so, which are in human beings in such a way that they include some imperfection, such as change, passion, or defect; because of these imperfections they must necessarily be attributed to God either through the eminence of causality or through some other trope of speech. Now it is certain that God works in the hearts of the godly this affection, namely, that they all will that everyone be saved. Therefore such an affection is in God eminently. But that this will includes an imperfection, and therefore cannot formally be in God, is argued: First, from the name ‘velleity’. For St. Thomas, in the place mentioned above, considers that this will should rather be called by the name ‘velleity’. But velleity seems to be nothing other than a certain imperfect and suspended will. Secondly, because this will signifies a desire for some thing which is inefficacious, and such a thing cannot be in God. Thirdly, because such a will in God would be idle, and therefore in vain, since it would have no effect in things properly corresponding to itself. Fourthly, because if such a will is in God with respect to men, it will also be with respect to angels, which, nevertheless, the Scriptures nowhere signify. Indeed, no other reason for this seems to exist than that by such a manner of speaking it is signified not what God properly wills, but what men ought to will, and what godly men, through His working, will. But the godly do not will, nor ought they to will, the salvation of all angels, but only of men who are living in this life. Fifthly, because neither is God said to will the salvation of condemned men, namely, for the same reason that we have just mentioned: for He does not work this will in the godly [for the salvation of damned men]. Sixthly, because if that will is formally in God, it will be perpetual, and consequently God will always will the salvation of all men. This seems absurd, since not even godly men will this after this life. Hence there also arises a final argument: the holy angels and the spirits of the righteous in heaven do not have such a will because of the perfection of their state, by which it also comes about that they neither pray for the reprobate nor are moved by any compassion concerning the damned, but purely and perfectly praise God’s justice in their punishment, as is taught at the end of the fourth [book]. Therefore, much less ought such a will to be posited formally in God. Therefore, to the arguments of the opposing side it is answered that: The Scriptures require nothing else than that we posit in God the will of the salvation of all eminently, or in some other improper manner of willing, as will be explained below. Nor on this account does Scripture speak simulatorily, but improperly. For it is very well known that Scripture is full of figurative expressions concerning God, when, after the manner of human speech, it attributes to Him repentance, anger and other human passions, as well as the members of the human body. To the second [argument] it is answered that, granted that there was such a velleity in Christ, it does not follow that it is in God insofar as He is God. For Christ assumed human affections together with the truth of human nature. But what is objected from St. Thomas proves very little: For he makes the comparison in the general account of antecedent will, without descending to the particular manner in which such a will ought to be understood by us in God. Therefore no more does this follow than if you were to infer: “Therefore God wills mutably or with passion, since a human judge wills in this way.” For Scripture also uses such a likeness when it says: “As a mother has compassion on her children, so God will have compassion on you.” [Isa. 66:13] Yet mercy is not properly in God, but only eminently. You will object: It is proper to God to have mercy and to spare, as the prayer of the Church has it; but to punish is a work foreign to God, as the prophet says [in Isa. 28:21]. But to will all to be saved pertains to the mercy and goodness of God; therefore it is properly in God. I answer that the prayer of the Church speaks not of velleity, but of the works of divine mercy and clemency. These are said to be proper to God because the object of the divine will is true good, and it can be nothing else. This, however, shines forth more clearly in works of mercy than in vindicative justice. For the latter brings about evil. But evil, as such, is not willed by God; rather, it is willed only under the consideration of a certain good, namely, as just. And therefore this is called a work foreign to God, insofar, namely, as it is concerned with evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-estius.html">William Estius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences, bk 1</cite>, (d. 1613; Paris, 1680 / 1696), dist. 46, ch. 3 tr. Chat-GPT 5.6 Latin</span></figcaption>

ause+this+will+signifies+a+desire+for+some+thing+which+is+inefficacious%2C+and+such+a+thing+cannot+be+in+God.+Thirdly%2C+because+such+a+will+in+God+would+be+idle%2C+and+therefore+in+vain%2C+since+it+would+have+no+effect+in+things+properly+corresponding+to+itself.+Fourthly%2C+because+if+such+a+will+is+in+God+with+respect+to+men%2C+it+will+also+be+with+respect+to+angels%2C+which%2C+nevertheless%2C+the+Scriptures+nowhere+signify.+Indeed%2C+no+other+reason+for+this+seems+to+exist+than+that+by+such+a+manner+of+speaking+it+is+signified+not+what+God+properly+wills%2C+but+what+men+ought+to+will%2C+and+what+godly+men%2C+through+His+working%2C+will.+But+the+godly+do+not+will%2C+nor+ought+they+to+will%2C+the+salvation+of+all+angels%2C+but+only+of+men+who+are+living+in+this+life.+Fifthly%2C+because+neither+is+God+said+to+will+the+salvation+of+condemned+men%2C+namely%2C+for+the+same+reason+that+we+have+just+mentioned%3A+for+He+does+not+work+this+will+in+the+godly+%5Bfor+the+salvation+of+damned+men%5D.+Sixthly%2C+because+if+that+will+is+formally+in+God%2C+it+will+be+perpetual%2C+and+consequently+God+will+always+will+the+salvation+of+all+men.+This+seems+absurd%2C+since+not+even+godly+men+will+this+after+this+life.+Hence+there+also+arises+a+final+argument%3A+the+holy+angels+and+the+spirits+of+the+righteous+in+heaven+do+not+have+such+a+will+because+of+the+perfection+of+their+state%2C+by+which+it+also+comes+about+that+they+neither+pray+for+the+reprobate+nor+are+moved+by+any+compassion+concerning+the+damned%2C+but+purely+and+perfectly+praise+God%E2%80%99s+justice+in+their+punishment%2C+as+is+taught+at+the+end+of+the+fourth+%5Bbook%5D.+Therefore%2C+much+less+ought+such+a+will+to+be+posited+formally+in+God.+Therefore%2C+to+the+arguments+of+the+opposing+side+it+is+answered+that%3A+The+Scriptures+require+nothing+else+than+that+we+posit+in+God+the+will+of+the+salvation+of+all+eminently%2C+or+in+some+other+improper+manner+of+willing%2C+as+will+be+explained+below.+Nor+on+this+account+does+Scripture+speak+simulatorily%2C+but+improperly.+For+it+is+very+well+known+that+Scripture+is+full+of+figurative+expressions+concerning+God%2C+when%2C+after+the+manner+of+human+speech%2C+it+attributes+to+Him+repentance%2C+anger+and+other+human+passions%2C+as+well+as+the+members+of+the+human+body.+To+the+second+%5Bargument%5D+it+is+answered+that%2C+granted+that+there+was+such+a+velleity+in+Christ%2C+it+does+not+follow+that+it+is+in+God+insofar+as+He+is+God.+For+Christ+assumed+human+affections+together+with+the+truth+of+human+nature.+But+what+is+objected+from+St.+Thomas+proves+very+little%3A+For+he+makes+the+comparison+in+the+general+account+of+antecedent+will%2C+without+descending+to+the+particular+manner+in+which+such+a+will+ought+to+be+understood+by+us+in+God.+Therefore+no+more+does+this+follow+than+if+you+were+to+infer%3A+%E2%80%9CTherefore+God+wills+mutably+or+with+passion%2C+since+a+human+judge+wills+in+this+way.%E2%80%9D+For+Scripture+also+uses+such+a+likeness+when+it+says%3A+%E2%80%9CAs+a+mother+has+compassion+on+her+children%2C+so+God+will+have+compassion+on+you.%E2%80%9D+%5BIsa.+66%3A13%5D+Yet+mercy+is+not+properly+in+God%2C+but+only+eminently.+You+will+object%3A+It+is+proper+to+God+to+have+mercy+and+to+spare%2C+as+the+prayer+of+the+Church+has+it%3B+but+to+punish+is+a+work+foreign+to+God%2C+as+the+prophet+says+%5Bin+Isa.+28%3A21%5D.+But+to+will+all+to+be+saved+pertains+to+the+mercy+and+goodness+of+God%3B+therefore+it+is+properly+in+God.+I+answer+that+the+prayer+of+the+Church+speaks+not+of+velleity%2C+but+of+the+works+of+divine+mercy+and+clemency.+These+are+said+to+be+proper+to+God+because+the+object+of+the+divine+will+is+true+good%2C+and+it+can+be+nothing+else.+This%2C+however%2C+shines+forth+more+clearly+in+works+of+mercy+than+in+vindicative+justice.+For+the+latter+brings+about+evil.+But+evil%2C+as+such%2C+is+not+willed+by+God%3B+rather%2C+it+is+willed+only+under+the+consideration+of+a+certain+good%2C+namely%2C+as+just.+And+therefore+this+is+called+a+work+foreign+to+God%2C+insofar%2C+namely%2C+as+it+is+concerned+with+evil.%E2%80%9D%0A%0A%E2%80%94+William+Estius%2C+Commentary+on+the+Sentences%2C+bk+1+%28d.+1613%3B+Paris%2C+1680+%2F+1696%29%2C+dist.+46%2C+ch.+3+tr.+Chat-GPT+5.6+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F21d32a2dd1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/21d32a2dd1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Ch.%203%2C%20In%20what%20manner%20is,as%20it%20is%20concerned%20with%20evil&amp;text=Ch.%203%2C%20In%20what%20manner%20is%20the%20antecedent&amp;text=insofar%2C%20namely%2C%20as%20it%20is%20concerned%20with%20evil" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the next place you [Thomas Jackson, an Arminian] touch upon a distinction much talked of, and as much advanced by some as cried down by others. Yet both Scotus and Durandus give a tolerable, and Aquinas with the Dominicans after him, an orthodox interpretation thereof, though neither suitable to the mind of [John] Damascene, commonly reputed the father of it. Yet look what in this kind is wanting in them is supplied by [Gregory] Arminiensis, who gives both an orthodox construction thereof, and that also in conformity to the opinion of Damascene, of whose text he gives a very sound and orthodox interpretation and the more orthodox the more opposite to their constructions who, with great cry of words draw it to the countenancing of their Arminian tenets without cause. Love, you say, is the fruit of God’s antecedent will, wrath and severity are the proper effects of his consequent will. Fruit and effect you make all one (as with good reason you may). Now what, I pray you, is this effect which you call love? You seem to intimate that they are the effects of creation, as when you say, ‘Every particular faculty of soul or body is a pledge undoubted of God’s love.’ Yet faculties of souls and bodies are found in beasts, but God’s antecedent will in Damascene is referred wholly unto men. Neither does Damascene at all refer it to the work of creation, but makes it to be that whereby God will have all to be saved. Liberty of will is proper to man in distinction from beasts, but who sees not that this indifferently makes him obnoxious unto damnation as well as capable of salvation? Then when you say wrath and severity is the effect of God’s consequent will, what do you mean by ‘wrath’? Is it either a resolution to take vengeance, or the execution of vengeance itself? I think you take it for the execution of vengeance itself. Now there is an execution of reward also properly opposite unto this which, whether it be the same love you speak of, it became you to express so much, or whether you conceive it to be different, yet it were fit you should take notice of it and acknowledge that this is a fruit of God’s consequent will as well as wrath; that as effectually presupposing obedience, as this disobedience: and that love in rewarding is every way as infallibly consequent to the obeying of God’s will revealed as wrath is of our neglecting and despising it. A full explication of this distinction you promise in good time; how well you perform it we may in good time consider with God’s help. Next you enter upon another form of the same distinction (as you pretend) and you suffer it to fly with one wing, for you talk of God’s absolute will (which you seem to confound with God’s antecedent will), but as touching the member congruously opposite, you leave us to seek for that. But as it is we are to consider it: God’s absolute will was (you say) to have men capable of Heaven and Hell, of joys and miseries immortal. This cannot be understood of God’s consequent will; for this absolute will is indifferent to end in the bestowing of reward or punishment, and is immediately terminated only in making man capable of either; but his consequent will is not so indifferent. For the only effect thereof you mention to be wrath and severity, and this presupposes rather than causes capableness. Neither can this absolute will be the antecedent will of God according to Damascene’s meaning. For the antecedent will in Damascene is only referred to the will of God, whereby He wills man’s salvation: but this absolute will is (you say) to have men capable of Heaven and Hell. To help this, you tell us that this absolute will (whose possible objects are two) is in the first place set on man’s eternal joy. But you do not proceed to show on what it is set in the next place, as if by such like incongruities you desired rather to confound your reader [rather] than to satisfy him. Yet by the tenor of your discourse you leave it to us to guess that in the second place, to wit upon the despising of God’s love, it is set upon a man’s damnation. So that by this your doctrine, both God’s antecedent will and consequent will is all one, and that is God’s absolute will. But no such thing is found in Damascene, from whom, such as you are, do usually take this distinction of will antecedent in God and will consequent: And indeed you do well to make one as absolute as another; for like as wrath, the fruit of this will of God in the second place (as you imply) has not its course but upon presupposition of disobedience; so in like manner, the proper opposite to wrath on the other side, the fruit of this will of God in the first place, has not its course but upon presupposition of obedience.</p></blockquote>

3F+Is+it+either+a+resolution+to+take+vengeance%2C+or+the+execution+of+vengeance+itself%3F+I+think+you+take+it+for+the+execution+of+vengeance+itself.+Now+there+is+an+execution+of+reward+also+properly+opposite+unto+this+which%2C+whether+it+be+the+same+love+you+speak+of%2C+it+became+you+to+express+so+much%2C+or+whether+you+conceive+it+to+be+different%2C+yet+it+were+fit+you+should+take+notice+of+it+and+acknowledge+that+this+is+a+fruit+of+God%E2%80%99s+consequent+will+as+well+as+wrath%3B+that+as+effectually+presupposing+obedience%2C+as+this+disobedience%3A+and+that+love+in+rewarding+is+every+way+as+infallibly+consequent+to+the+obeying+of+God%E2%80%99s+will+revealed+as+wrath+is+of+our+neglecting+and+despising+it.+A+full+explication+of+this+distinction+you+promise+in+good+time%3B+how+well+you+perform+it+we+may+in+good+time+consider+with+God%E2%80%99s+help.+Next+you+enter+upon+another+form+of+the+same+distinction+%28as+you+pretend%29+and+you+suffer+it+to+fly+with+one+wing%2C+for+you+talk+of+God%E2%80%99s+absolute+will+%28which+you+seem+to+confound+with+God%E2%80%99s+antecedent+will%29%2C+but+as+touching+the+member+congruously+opposite%2C+you+leave+us+to+seek+for+that.+But+as+it+is+we+are+to+consider+it%3A+God%E2%80%99s+absolute+will+was+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell%2C+of+joys+and+miseries+immortal.+This+cannot+be+understood+of+God%E2%80%99s+consequent+will%3B+for+this+absolute+will+is+indifferent+to+end+in+the+bestowing+of+reward+or+punishment%2C+and+is+immediately+terminated+only+in+making+man+capable+of+either%3B+but+his+consequent+will+is+not+so+indifferent.+For+the+only+effect+thereof+you+mention+to+be+wrath+and+severity%2C+and+this+presupposes+rather+than+causes+capableness.+Neither+can+this+absolute+will+be+the+antecedent+will+of+God+according+to+Damascene%E2%80%99s+meaning.+For+the+antecedent+will+in+Damascene+is+only+referred+to+the+will+of+God%2C+whereby+He+wills+man%E2%80%99s+salvation%3A+but+this+absolute+will+is+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell.+To+help+this%2C+you+tell+us+that+this+absolute+will+%28whose+possible+objects+are+two%29+is+in+the+first+place+set+on+man%E2%80%99s+eternal+joy.+But+you+do+not+proceed+to+show+on+what+it+is+set+in+the+next+place%2C+as+if+by+such+like+incongruities+you+desired+rather+to+confound+your+reader+%5Brather%5D+than+to+satisfy+him.+Yet+by+the+tenor+of+your+discourse+you+leave+it+to+us+to+guess+that+in+the+second+place%2C+to+wit+upon+the+despising+of+God%E2%80%99s+love%2C+it+is+set+upon+a+man%E2%80%99s+damnation.+So+that+by+this+your+doctrine%2C+both+God%E2%80%99s+antecedent+will+and+consequent+will+is+all+one%2C+and+that+is+God%E2%80%99s+absolute+will.+But+no+such+thing+is+found+in+Damascene%2C+from+whom%2C+such+as+you+are%2C+do+usually+take+this+distinction+of+will+antecedent+in+God+and+will+consequent%3A+And+indeed+you+do+well+to+make+one+as+absolute+as+another%3B+for+like+as+wrath%2C+the+fruit+of+this+will+of+God+in+the+second+place+%28as+you+imply%29+has+not+its+course+but+upon+presupposition+of+disobedience%3B+so+in+like+manner%2C+the+proper+opposite+to+wrath+on+the+other+side%2C+the+fruit+of+this+will+of+God+in+the+first+place%2C+has+not+its+course+but+upon+presupposition+of+obedience.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Discovery+of+Dr.+Jackson%E2%80%99s+Vanity%E2%80%A6+%28Amsterdam%3A+Thorp%2C+1631%29%2C+pp.+677-80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd4ecb3709.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd4ecb3709.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=In%20the%20next%20place%20you%20%5BThomas,course%20but%20upon%20presupposition%20of%20obedience&amp;text=In%20the%20next%20place%20you%20%5BThomas%20Jackson%2C%20an&amp;text=not%20its%20course%20but%20upon%20presupposition%20of%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is a twofold Word, or rather a double declaration of the same Word: 1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice. 2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.</p></blockquote>

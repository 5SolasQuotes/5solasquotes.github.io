<main class="wrap"><figure class="quote" id="q-d64a16d261" data-kw="">
<blockquote><p>True, we speak of an old and a new man in the believer, and so we give expression to the fact that in the new life the whole man has in principle been changed, and that nevertheless the power of sin continues to dwell in all his faculties and members. But actually what it is is that there are two groups of interests, ideas, inclinations, and the like, which do battle against each other and of which neither the one nor the other has been able to gain the full control of any single human faculty. If the truth of God had completely taken over and conquered the consciousness of the believer, there would naturally be no room left for error and falsehood; and if the love of God had wholly filled the heart, there would be no room for hatred, envy, wrath and the like. But that, as every one knows from his experience, is not the case; and Scripture testifies that we cannot look forward to such a perfect condition in this life. The struggle will remain until the end because the faith, the hope, the love, and all the Christian virtues will never be perfected in this life and therefore room remains in our soul for unbelief, doubt, discouragement, fear, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Reasonable Faith: A Survey of Christian Doctrine</cite>, trans. Henry Zylstra (Grand Rapids, MI: Wm. B. Eerdmans Publishing Company, 2016), 476–477.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7d28ddb58" data-kw="">
<blockquote><p>Thesis 10… But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us, is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses Written Out in Full with the Unanimous Consent of the Pastors of the Swiss Churches by the Authority of the Very Distinguished Senate of Bern in the General Synod on AD April 23</cite>, 1588’ in Justification by Faith Alone: Selected Writings from Theodore Beza (1519-1605), Amandus Polanus (1561-1610), Francis Turretin (1623-1687), trans. Casey Carmichael in Classic Reformed Theology (RHB, 2023), pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-d49c153858" data-kw="">
<blockquote><p>…so this [spiritual] life is begun by a union between us and Christ: He lives in us by his Spirit, and we live in Him by faith, Gal. 2:20. The Spirit is the principle of life, and faith is the means to receive it; and therefore we are said, Rom. 6:5, to be planted into the likeness of Christ’s resurrection. Planting notes a union, as a bud that is put into a stock; it becomes one with the stock, and bears fruit by virtue of the life of the stock. We no sooner are planted into Christ, but we feel the power of his life, and virtue of his resurrection; He begins to live in us, and we in him, as the graft in the stock, and as the stock in the graft.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on 2 Cor. 5, Sermon 30, on 2 Cor. 5:15, p. 190</span></figcaption>

<blockquote><p>1. In respect of its first moment regeneration comes about in another way than in respect of its progression. Regarding the first moment of regeneration man is purely passive; regarding its progression man cooperates with God. … 13. In this life regeneration is by degrees: these degrees do not only concern regeneration by itself but also the subjects. Some people are more regenerate than others; hence older people are more regenerated than the young ones.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d353662d30" data-kw="">
<blockquote><p>…whereat Paybody [a Formalist] starts and replies that the gestures which the people of God used in circumcision and baptism, the renting of the garment used in humiliation and prayer, Ezra 9:5; 2 Kings 22:19; Jer. 36:24, lifting up the hands, kneeling with the knees, uncovering the head in the sacrament, standing and sitting at the sacrament, were and are significant in worshipping, yet are not forbidden by the 2nd Commandment. Answer: There are three sorts of signs here to be distinguished:

1. Natural signs: so smoke is a sign of fire, and the dawning of the day a sign of the rising of the sun.

2. Customable signs, and so the uncovering of the head, which of old [in the OT, exampled by the priests] was a sign of preeminence, has through custom become a sign of subjection [such as in 1 Cor. 11].

3. Voluntary signs, which are called signa instituta; these are either sacred or civil. To appoint sacred signs of heavenly mysteries or spiritual graces, is God’s own peculiar, and of this kind are the holy sacraments. Civil signes for civil and moral uses, may be and are commendably appointed by men, both in Church and commonwealth, and thus the tolling of a bell is a sign given for assembling, and has the same signification both in ecclesiastical and secular assemblings. Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For which of you, says our Master [Lk. 17:7], having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat. All these signs have their significations from nature. … Secondly, customable signs have likewise place in divine service, for so a man coming into one of our churches, in time of public worship, if he see the hearers covered, he knows by this customable sign that [the] sermon is begun. Thirdly, civil or moral signs instituted by men, for that common order and decency, which is respect both in civil and sacred actions, have also place in the acts of God’s worship. Thus a basen and a laver set before a pulpit are signs of baptism to be ministered: but common decency teaches us to make the same use of basin and a laver in civility which a minister makes of them in the action of baptizing. All our question [with the Formalists, on the other hand] is about sacred mystical signs. Every sign of this kind, which is not ordained of God, we refer to the imagery forbidden in the 2nd Commandment.</p></blockquote>

</figure><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</span></figcaption>

<blockquote><p>In the second place, to supply the defendant his penury, the Rejoynder brings abundance of instances, out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this: and therefore by prevention, replies: to say these are not human inventions, because they partly spring out of natural light, is as much as to say, they are not, because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross, and surplice; the cornered-cap, and tippet; the bishops’ rochet, and coap; with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willful invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time, lay aside right natural invention, and judgement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), p. 495</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In the second place, to supply the defendant his penury, the Rejoynder brings abundance of instances, out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this: and therefore by prevention, replies: to say these are not human inventions, because they partly spring out of natural light, is as much as to say, they are not, because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross, and surplice; the cornered-cap, and tippet; the bishops’ rochet, and coap; with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willful invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time, lay aside right natural invention, and judgement.”

— William Ames, A Fresh Suit Against Human Ceremonies in Worship… (1633), p. 495">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+second+place%2C+to+supply+the+defendant+his+penury%2C+the+Rejoynder+brings+abundance+of+instances%2C+out+of+his+old+store%3A+1.+Kneeling%2C+bowing%2C+prostrating%2C+lifting+up+of+the+eyes%2C+and+of+the+hands%2C+shouting%2C+and+dancing+for+joy.+But+these+we+absolutely+deny+to+be+human+inventions.+The+Rejoinder+knew+this%3A+and+therefore+by+prevention%2C+replies%3A+to+say+these+are+not+human+inventions%2C+because+they+partly+spring+out+of+natural+light%2C+is+as+much+as+to+say%2C+they+are+not%2C+because+they+are+human+inventions%3A+for+what+are+human+inventions%2C+but+such+as+spring+out+of+natural+light%3F+What%3F+the+cross%2C+and+surplice%3B+the+cornered-cap%2C+and+tippet%3B+the+bishops%E2%80%99+rochet%2C+and+coap%3B+with+a+thousand+such+like%3B+which+whoesoever+will+equal%2C+or+%28in+regard+of+naturalness+and+willful+invention%29+liken+unto+lifting+up+of+eyes+and+hands%2C+etc.+in+prayer%2C+must+for+that+time%2C+lay+aside+right+natural+invention%2C+and+judgement.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+Worship%E2%80%A6+%281633%29%2C+p.+495&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee3d9f351c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee3d9f351c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/posture-in-prayer/#:~:text=In%20the%20second%20place%2C%20to%20supply,aside%20right%20natural%20invention%2C%20and%20judgement&amp;text=In%20the%20second%20place%2C%20to%20supply%20the%20defendant&amp;text=time%2C%20lay%20aside%20right%20natural%20invention%2C%20and%20judgement" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

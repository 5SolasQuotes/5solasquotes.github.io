<main class="wrap"><figure class="quote" id="q-268fbb81ca" data-kw="">
<blockquote><p>And can a man devise to tear the majesty of our Lord Jesus Christ and to deface his glory more than by the things that the Papists do? Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal son, in whom dwells the fulness of the Godhead, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby the only flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 23, the 5th upon Dt. 4, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb6006cb72" data-kw="">
<blockquote><p>If, therefore, the Christian Churches had had images from the very first times, if they had paid them the same cult and the same veneration that now obtains in the Roman rite, there is no doubt that the most bitter and implacable enemies of our discipline, the Jews, would have seized upon this, and would have accused it as some unspeakable impiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Books on Images</cite>, p. 41</span></figcaption>

<blockquote><p>If I love such things as God has lent me, and committed unto mine administration, so that I cannot find in mine heart to bestow them on the uses which God has appointed me, then I dishonour God and abuse his creature, in that I give more honor unto it than I should do; and then I make an idol of it, in that I love it more than God and his commandment; and then I dishonor my neighbor, from whose need I withdraw it.</p></blockquote>

</figure><figure class="quote" id="q-27bfb2857b" data-kw="">
<blockquote><p>Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 283-84 (1633)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

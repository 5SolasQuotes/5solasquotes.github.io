<main class="wrap"><figure class="quote" id="q-03a999a9d1" data-kw="">
<blockquote><p>Q. What ought you to believe concerning God, the chief object of divine knowledge?

A. That there is but one God. …

Q. What else do ye believe of God?

A. That he is of a most glorious nature, being an Eternal spirit, infinite in Essence, Knowledge, Goodness, and Power. …

Q. What else doe ye believe of God?

A. That the God-head is distinguished into three persons; the Father, Son, and holy Ghost.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ccde3d345" data-kw="">
<blockquote><p>Here, then is another test of our Christian discipleship – a test, moreover, which I greatly fear many inwardly feel that they cannot at all abide. They inwardly respect real goodness; but to respect it is one thing, and so to love as to associate with it, and peculiarly to befriend and shelter it, is distinctly another.

And while I say not of now hearing me, that they are without natural affection. I yet would have you all to that you may utterly detest, and shun as would do the contagion of a pestilence, or of the grave, even all that is gracious; and that, should that persecution of which we at last been officially forewarned, be now to break forth upon us, it will be but in fulfilment of all our speculations upon human character, if we find the most active and relentless agents of it among those of our professing brethren, who have ever felt highest respect for real goodness, and yet have been farthest of all from ever liking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bruce.html">John Bruce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Benevolence of the Renewed Heart: A Discourse in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-23e4973a47" data-kw="">
<blockquote><p>It’s a dream, that God loveth sinners with the same love every way, wherewith he loveth his own Son Christ. And why? Because God loveth us only for his own Son, and for nothing in us Ergo, Far more it must follow, it’s a far other, an higher, fountain love, wherewith the Father loveth his own eternal and consubstantial Son, the Mediator between God and man; and that derived love wherewith he loveth us sinners.

As the one is 1. Natural; the latter, free. 2. The love of the Father to the Son, as his consubstantial Son, and so far as it’s essentially included in his love to Jesus Christ Mediator, is not a love founded on grace and free-mercy, which might never have been in God; because essentially, the Father must love his Son Christ, as his Son; and being Mediator, he cannot for that renounce his natural love to him, which is the fundamental cause, why he loveth us for Christ his Son, as Mediator; but the love wherewith the Father loveth us for his Son Christ, is founded on free Grace and mercy; and might possibly never have been in God.

For, 1. as he could not but beget his Son, he could not but love him; nature, not election can have place in either: but it was his Free will to create a man, or not create him. 2. He cannot but love his Son Christ, but God might either have loved neither man nor Angel, so as to chuse them to Salvation, and he might have chosen other Men and Angels, then these whom he hath chosen; God hath no such freedom in loving his own Consubstantial Son.

2. It’s an untruth, that God loveth his chosen ones, as he doth love his Son; that is, with the same degree of love, wherewith he loves his Son; I think that not far from either gross ignorance, or blasphemy. It possibly may be the same love by proportion, with which the Father tendereth the Mediator, or Redeemer, and all his saved and ransomed ones; but in regard of willing good to the creature loved, he neither loveth his redeemed with the same love, wherewith he loveth his Son; except blasphemously we say, God hath as highly exalted all the redeemed, and given to them a name above every name, as he hath done to his own Son; nor doth he so love all his chosen ones, as he conferreth equal grace and glory upon all alike; as if one starre differed not from another star in glory, in the highest heavens.

Our own good works cannot make our Lord love us less or more, with the love of eternal election; but they may make God love us more with the love of complacency, and a sweeter manifestation of God in the fruits and gracious effects of his love. According to that, John 14.23. Jesus said, if a man love me, he will keep my words, and my Father will love him, and we will come unto him, and make our abode with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself</cite>, (London: Andrew Crooke, 1647), I, pp 74-75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-8d58f9f9b0" data-kw="">
<blockquote><p>XXXII. Finally, it is asked here how Christ can be said to have been heard in that prayer from fear, as the apostle testifies, Heb. V:7 [“Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;”], and elsewhere Christ professes that he is always heard by the Father, Jn. XI:42, when nevertheless death had necessarily to be undergone by him. That which Christ willed simply and absolutely, in that he never suffered a refusal; but that which he willed only under a condition, it is no wonder if he did not obtain it, since that was not so much a will as it was velleity, and that was not so much to be reckoned a rational desire, which ought always to hold the primary place, as a natural inclination and sensitive appetite, which never has the principal role in prayer. 2. Christ was heard from the fear of death, not indeed absolutely, as if He had been freed from the necessity of undergoing death, but in a certain respect, namely, insofar as God, who heard Him, so shook off that fear that He received death most steadfastly and submitted Himself wholly to the divine will, and was thus strengthened so that He laid aside all dread of death. For Christ feared two things above all:

1. Lest He should succumb, overwhelmed by the evils which He saw to be most grievous.

2. Lest He should be swallowed up by death, so that no exit from it would be open. But God heard Him, that is, freed Him from both those fears:

1. Because He so corroborated Him by the power of His Spirit in the midst of the struggle that He most steadfastly and invincibly sustained that most grievous contest.

2. Because He freed Him from death, having loosed the pains of hell by His glorious resurrection; and thus, most truly, in this respect He was heard—not, indeed, that He might not pay the penalty of death, but that He might not be swallowed up by it; not that He might not taste it, but that He might not perish in it; not in the subterfuge of punishments, but in the constant toleration of the same and in a strong and invincible liberation and victory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Satisfaction of Christ</cite>, … (Geneva, 1666), 6th Disputation, which is the Fourth on the Truth of Christ’s Satisfaction, Asserted from his Agony and Desertion tr. AI by The Received Faith, sect. 32</span></figcaption>

+Spirit+in+the+midst+of+the+struggle+that+He+most+steadfastly+and+invincibly+sustained+that+most+grievous+contest.+2.+Because+He+freed+Him+from+death%2C+having+loosed+the+pains+of+hell+by+His+glorious+resurrection%3B+and+thus%2C+most+truly%2C+in+this+respect+He+was+heard%E2%80%94not%2C+indeed%2C+that+He+might+not+pay+the+penalty+of+death%2C+but+that+He+might+not+be+swallowed+up+by+it%3B+not+that+He+might+not+taste+it%2C+but+that+He+might+not+perish+in+it%3B+not+in+the+subterfuge+of+punishments%2C+but+in+the+constant+toleration+of+the+same+and+in+a+strong+and+invincible+liberation+and+victory.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Disputations+on+the+Satisfaction+of+Christ%2C+%E2%80%A6+%28Geneva%2C+1666%29%2C+6th+Disputation%2C+which+is+the+Fourth+on+the+Truth+of+Christ%E2%80%99s+Satisfaction%2C+Asserted+from+his+Agony+and+Desertion+tr.+AI+by+The+Received+Faith%2C+sect.+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d58f9f9b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8d58f9f9b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=XXXII.%20Finally%2C%20it%20is%20asked%20here,strong%20and%20invincible%20liberation%20and%20victory&amp;text=XXXII.%20Finally%2C%20it%20is%20asked%20here%20how%20Christ&amp;text=in%20a%20strong%20and%20invincible%20liberation%20and%20victory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We spoke above about the transient as to existence; the transient as to essence, on the contrary, is present if the quiddity or essence of the thing is a process or something flowing and becoming, for example time, a melody, organic life, the action of solving a mathematical problem. The permanent, by contrast, has its whole essence at once and not successively, as Peter, a tree, a table, the human soul.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-add92a35eb" data-kw="">
<blockquote><p>…the rule in our way [amongst the Scottish covenanters], is as certain, though not so stinted, as that in yours [in the Anglican Church with their set forms], and that our ministers, appointed to be the people’s mouth in public prayer and worship, are not only tried in their utterance for preaching but also for prayer;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-mcward.html">Robert McWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nonconformist (1671)</cite>, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2a78fca8a" data-kw="">
<blockquote><p>Prayer is to be made for things lawful… The reading of the Scriptures, preaching, and hearing the Word of God, singing of psalms; as also the administration of baptism and the Lord’s Supper, are all parts of religious worship of God, to be performed in obedience unto God with understanding, faith, reverence, and godly fear. Solemn humiliations, with fastings and thanksgivings upon special occasions, are in their several times and seasons to be used in a holy and religious manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/congregationalists.html">Congregationalists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Savoy Declaration of Faith &amp; Order, 22.4-5 (1658)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-c8c613f9fd" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker [a congregationalist]: ‘It is not warrantable that one not in office (says Mr. Rutherford), but a private Christian, should pray, exhort, preside in the framing of a Church and in ordaining of pastors. [Rutherford’s] Answer: The practice of the Church of Scotland will say to this, we allow not public prophesying of unofficed men.’ (Margin Note: Some chief and ordinary church-prophesying and church-praying is given to the unofficed church, as to the only kindly subject by Mr. Hooker: Mr. H., Survey, part 1, ch. 8, p. 52.) [Rutherford’s] Answer: 1. Here is ordinary prophesying, such as that of the apostle Peter at the calling of Matthias (Acts 1[:15-22]) and public Church-prophesying and praying, such as is by the prophets or presbytery of the Church of Antioch, Acts 13[:3]. when Paul and Barnabas were called to be apostles to the gentiles…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford.html">Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of the Survey of that Sum of Church Discipline</cite>, p. 171</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-0444e8a231" data-kw="">
<blockquote><p>For what synods determine, being the undeniable Word of God, is intrinsically infallible, and can never become fallible, though fallible and sinful men that are obnoxious [liable] to error and mistakes do hold it forth ministerially to others: and it is false that we are to believe that what synods determine according to the Word of God, we are to believe it is fallible and liable to error, and may [be] an untruth because they so determine; for then, when a synod determines [that] ‘there is but one true God,’ this principle of faith is believed to be subject to retraction and falsehood, because a synod has determined it to be a truth. But the truth is, we are to believe truths, determined by synods, to be infallible, and never again liable to retraction or discussion, because they are, and were in themselves and without any synodical determination, infallible, but not for this formal medium, because so says the synod, but because so says the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 2</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

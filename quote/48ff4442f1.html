<main class="wrap"><figure class="quote" id="q-48ff4442f1" data-kw="">
<blockquote><p>Let notice be taken whether Muntzer and his companions be not of that number, who dare not plainly say as much, but they will say as we do; but being put unto it, they make Jesus Christ but an half Saviour, by bringing in good works. We say, That faith without works is dead: but they justify us not before God, neither blot out our sins.

As the flame is not without light, otherwise it were not flame; yet it’s light burneth not, it is the fire, and the flame only that doth lighten: so faith is not without works; but works burn not, i. e. take not away sin; it is faith in Christ only: thus we speak of the virtue of the property of faith, shewing that those who have this true faith, cannot be lazy, so as out of love to God, they should not do good works to glorify God, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, spring and foundation of the Anabaptists, or re-baptized of our time</cite>, trans. Joshua Scottow (1565; Cambridge MA: Marmaduke Johnson, 1668), p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-499d1a69a1" data-kw="">
<blockquote><p>Those that endeavor to perform sincere obedience to all the commands of Christ, as the condition by which they are to procure for themselves a right and title to salvation, and a good ground to trust on Him for the same, do seek their salvation by the works of the law, and not by the faith of Christ, as He is revealed in the gospel and they shall never be able to perform sincere and true holy obedience by all such endeavors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (Zondervan Publishing House, 1954), 64.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation</cite>, [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</span></figcaption>

c" href="https://reformedbooksonline.com/good-works/#:~:text=2.%20Good%20works%20are%20the%20way,as%20the%20other.%20%282%20Thess.%202%3A13&amp;text=2.%20Good%20works%20are%20the%20way%20in%20which&amp;text=as%20well%20as%20the%20other.%20%282%20Thess.%202%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d87f55c427" data-kw="">
<blockquote><p>Q. 154 Therefore, you say that good works are necessary to salvation? A: If faith is necessary to salvation, and works necessarily flow out of true faith, (as that which cannot be idle), certainly also it follows, that good works are necessary to salvation, yet not as the cause of salvation (for we are justified, and thus live, by faith alone in Christ), but as something necessarily attached to true faith. Just as Paul says, they are God’s children, who are led by the Spirit of God; and John, that he is righteous who works righteousness; and James also, explaining not by what method we are justified, but, from whence true faith and justification are known, proves by the example of Abraham that they are not justified who demonstrate no works of faith. For in this way James is reconciled with Paul, so that it is plain that they are contentious who condemn the necessity of good works as a false doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses</cite>, ed. Dikran Y. Hadidian, trans. Kirk M. Summers, vol. 9, Princeton Theological Monograph Series (Eugene, OR: Pickwick Publications, 2009), 61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

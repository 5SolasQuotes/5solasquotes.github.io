<blockquote><p>Scripture bears upon the face of it as clear evidence of its truth, as white and black do of their colour, sweet and bitter of their taste.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b5f26575e" data-kw="">
<blockquote><p>In this we are even more justified, because the nature and requirements of a rule fit as exactly as possible with Scripture alone. First, the rule of living for God, without doubt, ought to be prescribed by God alone (Deut. 12:32; Matt. 15:9). For a rule cannot be prescribed by any other than by the one whom the rule concerns. Now, Scripture alone has been prescribed by God as the rule for us (2 Tim. 3:16; 2 Peter 1:21), and due to the sublimity of the matter it could not be revealed and prescribed by anyone but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, vol. 1: Prolegomena, Part 1, Book 1, ch. 2, §V</span></figcaption>

</figure><figure class="quote" id="q-92dd6ed6d7" data-kw="Mary Queen of Heaven">
<blockquote><p>If God disapproved that men on earth constituted a King for themselves, without consulting him: what will he say of the worms of the earth, who without an oracle from God, constitute a Queen of heaven, and erect for her a throne of majesty, without asking at the mouth of God?</p></blockquote>

</figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

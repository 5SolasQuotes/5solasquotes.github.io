<main class="wrap"><figure class="quote" id="q-643aef881b" data-kw="preceptive will gospel offer">
<blockquote><p>Conditional promises and threatenings do not favor conditional decrees because they do not pertain to the decreeing will, but to the preceptive will and are appendages to the divine commands, added to stimulate and excite men. … Hence such promises and threats show only the necessary connection of the condition with the thing conditioned, but involve no futurition of the thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.10</span></figcaption>

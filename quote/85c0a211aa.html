<blockquote><p>I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service. (Romans 12:1)

Hitherto the apostle hath discoursed of matters of faith; in this and the following chapters he sets down precepts of holy life. By the mercies of God: he useth the word in the plural number, to amplify and set forth the manifold mercies of God, in election, justification, adoption, &amp;c.: … Seeing you Gentiles have received so many and so great mercies from God; seeing he hath preferred you to his ancient people the Jews, and hath chosen and called you, when he hath rejected them; as you value these mercies, let the consideration of them engage you to all manner of holiness and new obedience.

That ye present; that you give, dedicate, and offer up, as spiritual priests. Your bodies; yourselves, or, your whole man; a part is put for the whole; the body is named, because it is the soul’s instrument in the service of God. A living sacrifice; the sacrifices of old were presented alive to God, and their blood was shed at the feet of the altar: a beast that died of itself, or was torn by wild beasts, was not so much as to be eaten, Exodus 22:31 Leviticus 22:8. Conformable hereunto, God will have us offer up ourselves a living sacrifice; i.e. we must be quickened and alive to God, and not dead in sins and trespasses. Holy; as the sacrifices under the law were to be without blemish or defect, Exodus 12:5 Leviticus 1:10 Deut. 15:21. Acceptable unto God; or, well pleasing unto God. So were the appointed sacrifices under the law, Leviticus 1:9; so was the sacrifice of Christ the Lamb of God, Ephesians 5:2; and so are all spiritual sacrifices under the gospel, Philippians 4:18 Hebrews 13:16.

Which is your reasonable service; or, which is agreeable to reason; nothing is more reasonable, than that you should devote yourselves to God in this manner. Some think this is added, to show a difference between the sacrifice here required, and that of the Jews, which was of unreasonable beasts. Others, by reasonable service, understand spiritual service, and expound this place by 1 Peter 2:5, where you read of spiritual sacrifices acceptable to God by Jesus Christ. Others think, that by reasonable you must understand such service as is according to the word of God; and this suits best with the Greek phrase in the text, λογικὴν λατρείαν. The same word is used, 1 Peter 2:2, and there it is rendered the milk of the word, and not reasonable milk. And so the service or worship here spoken of is opposed to that will worship, of which you read in Colossians 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; London: Banner of Truth, 1963), 3: 521.</span></figcaption>

<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>

<blockquote><p>While they [the Jews] had the tenth of their goods consecrated, these [Christians] on the other hand who have received freedom [from the Mosaic Law] assign all that they have to the uses of the Lord, cheerfully and freely giving them, and not in lesser portions only, as becomes men professing the hope of greater things.’ . . Start Here: Articles &amp; Book Articles Smyth, Thomas – The Parsimony of Professing Christians being Note A to The Rule &amp; Measure of Christian Charity in Works, vol. 7 American, southern presbyterian. Parsimony means an extreme unwillingness to spend money. Peck, Thomas – Moral Obligation of the Tithe (1890) in Miscellanies, vol. 1, pp. 146-57 Peck was an American, southern presbyterian.. He argues that while natural and Biblical principles morally obligate us to return a portion of our income to the service of the Lord, this does not obligate an exact amount of, or at least, 10% in the New Testament era. While this article is very valuable, yet throughout it Peck argues for Voluntaryism, which is contrary to the Establishment Principle of the Reformation.. This aspect of Peck’s article is not recommended. Balfour, William – The Establishment Principle Defended, pp. 126-34 (1873) Balfour was a minister in the Free Church of Scotland.. He here defends from Scripture the Reformation’s view of the Establishment Principle with regards to tithing. Balfour is here arguing against the Voluntary position of the Scottish United Presbyterian Church, with which Church the Free Church was considering union with in his time. The teaching of Scripture is clear. . Book Croteau, David – A Biblical &amp; Theological Analysis of Tithing: Toward a Theology of Giving in the New Covenant Era PhD dissertation (2005) 339 pp. Croteau brings out numerous, enlightening Biblical insights.. His historical survey on pp. 6-68 is very helpful, especially in documenting the tithing renewal that occurred in America during the late-1800’s and following.. Indispensable for further digging into the subject, especially for his citations of literature on the subject. . . Dictionary &amp; Encyclopedia Articles on the Biblical tithes 1800’s Smith, William – ‘Tithe’ in Dr. William Smith’s Dictionary of the Bible, Comprising its Antiquities, Biography, Geography &amp; Natural History, vol. 4 ed. H.B. Hackett &amp; Ezra Abbot (1871) ** ed. McClintock &amp; Strong – ‘Tithe’ in Cyclopedia of Biblical, Theological and Ecclesiastical Literature (1880) Davis, John D. – ‘Tithe’ in A Dictionary of the Bible (1898) . 1900’s Jewish Encyclopedia – ‘Tithe’ (1901-1906) ed. Orr, James – ‘Tithe’ in International Standard Bible Encyclopedia (1915 / 1939) . . Articles Theological &amp; Political 1500’s Bullinger, Henry – Tenth Sermon, pp. 486-500 in the Fifth Decade of The Decades 1550’s Bullinger (1504–1575) was a Swiss reformer, the successor of Zwingli as the head of the Zurich Church. ** Ursinus, Zacharias – p. 570 (bottom) of ‘The Fourth Commandment’ in Commentary on the Heidelberg Catechism trans. Williard, 3rd American ed. (1851) Ursinus (1534–1583) was a prominent German Reformed theologian. ** Vermigli, Peter Martyr – Pt. 4, ch. 13, ‘Of a Magistrate, &amp; of the Difference between Civil &amp; Ecclesiastical Power’, section 18-32 in Common Places (1583), pp. 235-45 Quote: “First we must understand that tithes in the old time pertained unto ceremonies, and that as well in Melchisedek as in the Levites: Because in either priesthood they were referred unto Christ, and either priesthood was in very deed a figure of Christ… But what signified the tenths in either priesthood? Truly they signified nothing else but that it behoved the old fathers to acknowledge that whatsoever they had came from Christ. By that ceremony, the people worshipped Christ Himself… Boniface says: “We receive the tithes of all laymen.” Ye take them indeed, but now that Christ is come, the paying of tithes is no more a ceremony as it was before the coming of Christ when by tithes men worshipped Christ which was to come in the flesh, and confessed that they ought unto Him, both themselves, and all that they had. After the very which manner they paid the first fruits of all that they had. Nevertheless our men in these days receive tithes: but by what law? Truly not by the ceremonial law, but by a moral Law: since it is requisite that the minister should be sustained by the people: (Mt. 10:10) For the laborer is worthy of his reward: And he which serves the Gospel ought to live by it. So then, whether stipends be paid unto ministers out of lands or out of houses, either in ready money or in tithes, it makes no matter so that they be not maintained dishonestly, but honestly. Indeed these rewards in some places do retain the old manner of tithes. Howbeit in many places they are not called tithes, but stipends or wages. And doubtless they be rather rewards which are due to the labors of ministers than tithes.</p></blockquote>

<blockquote><p>The scope, end and sum of this [2nd] Commandment is to order us in the solemn worship of God, called Heb. 9:1, ‘Ordinances of divine service,’ and usually termed ‘religious exercises.’ For the constituting of a solemn worship of God three things are required:

1. That it be done with immediate reference to God, and that Himself or something in his stead be made the object thereof, and so therein we draw near to Him, and He to us.

2. That it tend in the doer’s intention directly and of itself to the honoring of God and pleasing Him, and getting of grace from him, by exercising of some or all the virtues required in the First Commandment.

3. That there be a separating of ourselves from all other businesses to be wholly and altogether employed about such acts in which the difference between common and solemn worship does seem to stand. Worship consists in three things:

1. There must be a right knowledge and high apprehension of God, the person to be worshipped.

2. A reflexion of this knowledge.

3. An abasement of the creature under the reflexion of this knowledge, Rev. 5: Christ is represented as sitting on a throne. The people of God are there brought in as compassing Him about, they have high apprehensions of the person of Christ, his glory and holiness.

2. They reflect these excellencies.

3. They abase themselves, fall on their faces, vers. ult. Every religious exercise or ordinance of divine service has usually divers particular acts, that be as parts of the whole, and in the orderly uniting of which the whole is accomplished. And whatsoever is done in any such exercise of religion, for the end and purpose of pleasing God and getting grace from him with respect of conscience to Him (as esteeming that He must and will have it so, or else the service shall not be well-pleasing and acceptable to Him) this is a part of worship, or of divine service. For example: a man brought an ox or a ram, a lamb or such like thing, and presented it to the priest, he did offer it unto God, and that directly with intention of exercising obedience and faith to God. Likewise this offering was to be made by a certain person in a certain place, at a certain time, with certain garments and rites: So all those observations became parts of this worship; for in these also the intention of the doer was directly carried to God, hoping and purposing by them to please God and exercise faith and obedience, and other graces, as well and as much as by the very offering itself, and accounting the service not to be acceptable to God without them.</p></blockquote>

<blockquote><p>Yet it is not so much my object to be favoured with your countenance in my personal labours, as humbly to entreat, and by the sacred name of Christ to implore, not only that, through your kindness, all orthodox books may again be welcomed and freely circulated in England, but that your chief care may be directed to promote religion, which has fallen into shameful neglect.

And if this is justly demanded from all kings of the earth by the Only-begotten Son of God, by a still more sacred tie does he hold you bound, most noble Queen, to perform this duty; for when even you, though a king’s daughters were not exempted from that dreadful storm which fell with severity on the heads of all the godly, by the wonderful manner in which he brought you out safe, though not unmoved by the fear of danger, he has laid you under obligation to devote yourself and all your exertions to his service.

So far are you from having any reason to be ashamed of this deliverance that God has given you large and abundant grounds of boasting, by confirming you to the image of his Son, on whom the Prophet Isaiah bestows this among other commendations, that from prison and judgment (Isaiah 53:8) he was raised to the loftiest height of heavenly dominion.</p></blockquote>

And if this is justly demanded from all kings of the earth by the Only-begotten Son of God, by a still more sacred tie does he hold you bound, most noble Queen, to perform this duty; for when even you, though a king’s daughters were not exempted from that dreadful storm which fell with severity on the heads of all the godly, by the wonderful manner in which he brought you out safe, though not unmoved by the fear of danger, he has laid you under obligation to devote yourself and all your exertions to his service.

So far are you from having any reason to be ashamed of this deliverance that God has given you large and abundant grounds of boasting, by confirming you to the image of his Son, on whom the Prophet Isaiah bestows this among other commendations, that from prison and judgment (Isaiah 53:8) he was raised to the loftiest height of heavenly dominion.”

<main class="wrap"><figure class="quote" id="q-3be6d89447" data-kw="">
<blockquote><p>The pope makes everything right. Where the pope is, there is the true church, pure doctrine, and apostolic succession. The truth is, there is not a word in Scripture about such an apostolic succession. Even as such it is no more a guarantee of purity of doctrine than the hereditary high-priestly office of Caiaphas validated the justice of his pronouncements and actions. For that reason Protestants were right in saying that not “the succession of places and persons” (successio locorum et personarum) but “the succession of doctrine” (successio doctrinae) is a distinguishing feature of the true church. If the latter is missing, the former can make no church into a true church; and if it is present, the former is of very minor significance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §496</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43f398b797" data-kw="Upon this rock">
<blockquote><p>Mt. 16:18 does not favor the primacy of Peter. First, the passage is allegorical and metaphorical, admitting of various interpretations. Assuredly, it cannot establish an ecumenical pontificate, which ought to be proved by some express passage. Second, these things are certainly said to Peter, but not about Peter. The reasons are various. (a) From the very words because Petra is expressly distinguished from Petro, both in person and in gender, as the denominating and the denominated. Yet if he had wished to indicate Peter, why did he use both? Why did he not say, “Thou art Peter and upon thee” (which would have removed all difficulty). Rather he says “and upon this rock.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>

</figure><figure class="quote" id="q-6220ca2321" data-kw="">
<blockquote><p>There is no hierarchy in the church of Christ (Luke 22:25–26; 2 Cor. 1:24; 1 Pet. 5:3). There is no such thing as a diocesan, cathedral, patriarchal, or metropolitan church, for in the New Testament all churches are equal and all have their own ἐπισκοποι; and believers are nowhere instructed to inquire into the legitimate succession of their ministers, but rather to examine the Scriptures and to remain in the teaching [handed down to them] (John 5:39; Acts 17:11; 1 Tim. 4:13–16; 2 Tim. 1:13–14; 3:14–17). Neither does legitimate succession guarantee purity of doctrine (John 8:39; Rom. 2:28; 9:6). [Such succession] would sooner make salvation dependent on certain specific persons and on impracticable, fallible, and often even impossible historical research.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><figure class="quote" id="q-b65840e1fc" data-kw="">
<blockquote><p>For they hold the places, but you the Apostolic Faith. They are, it is true, in the places, but outside of the true Faith; while you are outside the places indeed, but the Faith, within you. Let us consider whether is the greater, the place or the Faith. Clearly the true Faith. Who then has lost more, or who possesses more? He who holds the place, or he who holds the Faith? Good indeed is the place, when the Apostolic Faith is preached there, holy is it if the Holy One dwell there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Festal Letters</cite>, fragment, letter to his children</span></figcaption>

</figure><figure class="quote" id="q-5b5bb0e3ba" data-kw="Upon this rock">
<blockquote><p>Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God (Mt. 16:16). On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay&quot; (1 Cor. 3:11).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7d2b3c8b1c" data-kw="">
<blockquote><p>Yet is it true, said I, it’s more evident the Eucharist is Bread and Wine, than that it is Day: Only the Senses of those who live, and are awake at present, attest the latter; whereas the Senses of all Men, who live, or have lived, since the planting of the Gospel, have affirmed the former. All our Senses do not attest it’s now Day, only our Sight tells us so, whereas all our Senses tell us, That the Eucharist is Bread and Wine.

In effect, take a consecrated Host, take consecrated Wine; Ask your Eyes what they are? Ask your Nose, your Palate, and your Hands; Ask them ten thousand times the same Question; they will ever answer you, what they have always answered those who have consulted them on this Matter. They will tell you, ’tis Bread and Wine; In a word, the Senses never attested any thing in a more clear, expressive, and authentic manner, than what they depose on the Subject of the Eucharist. And if they deceive us herein; they are not to be believed in any thing whatever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six conferences concerning the Eucharist wherein is shewed, that the doctrine of transubstantiation overthrows the proofs of Christian religion</cite>, trans. Thomas Tenison (London: Richard Chiswell 1687), p. 18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c5bb76d2ed" data-kw="">
<blockquote><p>When there have been determinations against the common uncorrupted senses of mankind, as that what their sight, and touch, and taste assures them is Bread, is said to be the flesh of an human body.

For if you cannot be sure of what both your own, and the sound senses of any other man would tell you, you can be sure of nothing at all: You cannot be sure you see one another, or hear me speaking to you; nor be sure when you heard the transforming words, This is my Body; or much less that they were ever spoken, if you heard them not; or that that was Bread and not a Stone, or a piece of Clay that is pretended to be transubstantiated by them.

The foundation of all certainty were upon these terms taken away from among men on Earth; and upon the same common grounds upon which it is pretended you ought to believe that which is shewn or offered you to be the flesh of a man, and not bread any longer, you must believe or judge the quite contrary, that it is bread still, and not flesh, and consequently that he [the Pope] is far from being infallible, but doth actually err, upon whose authority you are directed to believe otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two sermons preached at Thurlow in Suffolk on those words, Rom. 6.13 “Yield your selves to God”</cite>, (London: Tho. Parkhurst, 1688), pp 18-19.</span></figcaption>

ormed Covenanter</a></div>
</figure><figure class="quote" id="q-8aae17ae7c" data-kw="">
<blockquote><p>The ceremonies associated with these signs are of express significance, and therefore are to be implemented as Christ has exemplified in the institution of it. Christ broke the bread, thereby signifying the breaking of his body, that is, his death. The apostle passes on to the congregation the ceremony of breaking; he refers to it as ‘the breaking of bread,’ and ‘the bread which we break’ (1 Cor. 10:16). The apostolic church did likewise, ‘…breaking bread’ (Acts 2:46); ‘…when the disciples came together to break bread’ (Acts 20:7). Therefore today the minister also must break the bread and give it as such to the communicants. The Papists and the Lutherans do this in an entirely different manner by giving a wafer to everyone without breaking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, (RHB), vol. 2, pp. 474, 529 &amp; 532</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

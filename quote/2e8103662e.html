<main class="wrap"><figure class="quote" id="q-2e8103662e" data-kw="">
<blockquote><p>Objection: But Paul and Timothy delivered some decrees, ordained by the apostles and elders, to be kept, Acts 16:4. Answer: 1. They must know [that] their power [was] subjected and inferior to this apostolical [power]. 2. Even the apostles themselves gave no decrees but such as were comprehended in the written Word, as in Acts 15:29, “It seemeth good to the Holy Ghost and us to lay no other burden but in these necessary things”, wherein, besides that in ordering the Church, we see they had such an immediate assistance of the Holy Ghost that they could not err: so also the things decreed were according to the written Word: as the things offered to idols and fornication were condemned in the moral law: the eating of blood forbidden to Noah, before Moses, and in the law: partly, because there was some symbol in it of the blood of Christ, by which the soul is purged, and partly to avoid the note of inhumanity and cruelty. And things strangled were before the apostles’ times prohibited for the former reason, lest blood not let out should be eaten. Which two latter, although their nature were changed and free in themselves after Christ, yet the apostle in the time of gathering the Church of the Jews and gentiles, because he would have no bones of dissension cast between them and [would] avoid the scandal for a time required them, and forbore to abrogate them, but would have them for the time retained without all opinion of worship, necessity and much less of merit: by all which bonds the Papists would fasten upon us all their human inventions so that all their allegations are too weak to remove us from this hold, so immovably grounded upon the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, 89-90. Taylor was a reformed puritan.</span></figcaption>

<blockquote><p>41. Another objection is that in Acts the apostles commanded to abstain from blood and from things strangled (Acts 15:29). Consequently, it does not seem lawful to partake of such things. And so, all things are not clean to the clean. I answer that some believe that this commandment should be interpreted literally, but in a mystical sense, so that by blood is understood homicide, and by strangling, the oppression of the poor. And this is good, but it is not the whole truth. Therefore, I say that literally it is a commandment, but we are not obliged to it. For some things are forbidden because they are evil; and these must simply be avoided. But other things are not evil absolutely, but for a time, and these must be observed so long as a reason exists. But the apostles forbade these things, not because they were evil in themselves, because in Matthew the Lord says the opposite (Matt 15:17). The reason behind them was that some had been converted from Judaism and some from paganism; consequently, it was necessary, if one people was to be formed, that one should condescend to another. In this matter the Jews were to be condescended to, because it was abominable to them to eat blood and anything suffocated. Therefore, to maintain peace, the apostles declared that this law was to be observed for that time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thomas Aquinas, Super ad Titum, C. 1, L. 4</cite>, 41</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3bc1eccea7" data-kw="">
<blockquote><p>Ma. It may seem that this Law doth condemn the art of Painting and Graving ; so that it is not lawful to have any images at all.

Sch. Not so: For in this first Table he speaketh not of any artificial thing civilly to be used, but only treateth of things which do appertain to the worshipping of God.

Ma. What is then the meaning of this Commandment?

Sch. In this second Commandment, God first forbiddeth us to make any Images to express or counterfeit him, or to seek him or to worship him in Images. And secondly, he chargeth us, not to worship the Images themselves or to abuse them in any wise by Idolatry or Superstition: but that we worship God alone in spirit and truth and as himself hath commanded us in his Word, to worship him, and not otherwise, after our own fantasies.

Ma. Why is it not lawful to express GOD with a bodily and visible form?

Sch. Because there can be no likeness or agreeing between God, who is a spirit, eternal, infinite, unmeasurable, incomprehensible, and a bodily, frail, dead, and vain shape or Image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>

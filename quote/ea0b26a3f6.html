<main class="wrap"><figure class="quote" id="q-ea0b26a3f6" data-kw="">
<blockquote><p>Assertion 11. That the promises of the Gospel are holden forth to sinners, as sinners, has a twofold sense: 1. As that they be sinners and all [be] in a sinful condition to whom the promises are holden forth. This is most true and sound. The Kingdom of grace is an hospital and guest-house of sick ones, fit for the art and mercy of the Physician Christ. 2. So as they are all immediately to believe and apply Christ and the promises, who are sinners; and there be nothing required of sinners but that they may all immediately challenge interest in Christ, after their own way and order, without humiliation or any Law-work. In this sense it is most false that the promises are holden forth to sinners as sinners, because then Christ should be holden forth to all sinners, Americans, Indians and sinners who never by the least rumor heard one word of Christ. 2. Peter desires not Simon Magus to believe that God had loved him in Christ Jesus with an everlasting love, nor does the Gospel-promise offer immediately soul-rest to the hardened and proud sinner wallowing in his lusts, as he is a hardened sinner; nor is the acceptable year of the Lord proclaimed, nor beauty and the oil of joy offered immediately to any but to those who are weary and laden and who mourn in Zion and wallow in ashes, Mt. 11:28-30; Isa. 61:1-3. It’s true, to all within the visible Church Christ is offered without price or money, but to be received after Christ’s fashion and order, not after our order; that is, after the soul is under self-despair of salvation and in the sinner’s month, when he has been with child of hell. I grant, in regard of time, sinners cannot come too soon to Christ, nor too early to wisdom; but in regard of order, many come too soon and unprepared. Simon Magus too soon believed. Saltmarsh says He misbelieved too soon, for he falsely believed: none can believe too soon. Answer: To believe too soon is to misbelieve, and Saltmarsh and Antinomians teach us the method of false-believing when they teach us too soon to believe; that is, to believe that God has loved you (be ye what ye will, Simon Magus, Judas or others) with an everlasting love, for that is the Antinomian Faith. Simon Magus is without any foregoing humiliation or sense of sin, or self-despair, to believe he was no less written in the Lamb’s book of life from eternity than Peter; and this he cannot believe soon enough. I say, neither soon or late ought a reprobate to believe any such thing. A covetous man who had great possessions [the rich young ruler] had not yet bidden farewell to his old god mammon when he came to Christ; therefore he departed sad from Christ. Another came before he had buried his father; and some come, Lk. 14:28-29, before they advise with their strength and what Christ will cost them. I desire I be not mistaken: none can be thoroughly fitted for Christ before he come to Christ; but it is as true some would buy the pearl before they sell all they have, which is not the wise merchant’s part: and they err foully who argue thus, If I were not a sinner, or if my sins were less heinous, and so I were less unworthy, I would come to Christ and believe; but ah, I am so grievous an offender and so unworthy that I cannot go. Their antecedent is true, but the consequence is naught and wicked. It is true, I am sick, and [it is] good that I both say and feel that I am sick; but, therefore, I cannot, I will not go to the Physician: that is wicked logic and the contrary consequence is good: whereas the other consequence is a seeking of righteousness in ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 258-59</span></figcaption>

<blockquote><p>…the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to Justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, 2nd pt., ch. 5, p. 349 of A Treatise of the Covenant of Grace (London, 1645)</span></figcaption>

<blockquote><p>Justification and Sanctification agree in their foundation, which is at least inchoate, and initial holiness. For, though no man’s inherent holiness arises so high as to denominate him truly just, or holy, for its own sake; yet both to Sanctification and Justification, is necessarily required some preparatory and imperfect holiness, consisting principally in the conversion of the mind to God, from sin… But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2) … Lastly, to search no farther into this point, before justification there must of necessity go some degree of sanctification, even in the opinion of such as contend most rigorously for freeness of justification:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1 | ch. 17, ‘…In what manner Sanctification goes before Justification, and how it follows it’, pp. 62-63</span></figcaption>

<blockquote><p>CIV… Chamier concedes that a person is justified and sins are forgiven before they believe. But this contradicts the entire Scripture, which consistently teaches that God’s wrath remains on those who do not believe, and faith and repentance are the conditions under which forgiveness of sins is promised to us, without which it cannot be obtained.</p></blockquote>

</figure><figure class="quote" id="q-05ee8e12c5" data-kw="">
<blockquote><p>Note now the order: first God gives me light to see the goodness and righteousness of the law, and mine own sin and unrighteousness; out of which knowledge springs repentance. Now repentance teaches me not that the law is good, and I evil; but a light that the Spirit of God has given me, out of which light repentances springs. The the same Spirit works in mine heart trust and confidence, to believe the mercy of God and his truth, that He will do as He has promised; which belief saves me. And immediately out of that trust springs love toward the law of God again. And whatsoever a man works of any other love than this, it pleases not God, nor is that love godly. Now love does not receive this mercy, but faith only, out of which faith love springs; by which love I pour out again upon my neighbor that goodness which I have received of God by faith. Hereof ye see that I cannot be justified without repentance; and yet repentance justifies me not. And hereof ye see that I cannot have a faith to be justified and saved, except love spring thereof immediately; and yet love justifies me not before God. … Hereof ye see what faith it is that justifies us. The faith in Christ’s blood, of a repenting heart toward the law, does justify us only; and not all manner [of] faiths.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, ... Parker Society (d. 1536; Cambridge Univ. Press, 1850) | Answer to 4th Book, pp. 195-96</span></figcaption>

ne.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Note%20now%20the%20order%3A%20first%20God,and%20not%20all%20manner%20%5Bof%5D%20faiths&amp;text=Note%20now%20the%20order%3A%20first%20God%20gives%20me&amp;text=us%20only%3B%20and%20not%20all%20manner%20%5Bof%5D%20faiths" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

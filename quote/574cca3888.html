<main class="wrap"><figure class="quote" id="q-574cca3888" data-kw="">
<blockquote><p>…they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one when they are necessarily called to give a testimony against the other; Yea, the duty and care they owe to the preservation of the government constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt national Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honoured amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government itself;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (Edinburgh, 1658), pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14036e0edb" data-kw="">
<blockquote><p>You will have many factious zealots to please, who being strangers to the love of holiness, Christianity, and unity, are ruled by the interest of an opinion or sect: and these will never be pleased by you, unless you will be one of their side or party, and conform yourself to their opinions. If you be not against them, but set yourselves to reconcile and end the differences in the church, they will hate you as not promoting their opinions, but weakening them by some abhorred syncretisms. As in civil, so in ecclesiastical wars, the firebrands cannot endure the peaceable: if you will be neuters, you shall be used as enemies. If you be never so much for Christ, and holiness, and common truth, all is nothing, unless you be also for them, and their conceits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, vol. 1, p. 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a37aba1432" data-kw="">
<blockquote><p>Now, the ceremonies are the bane of our churches’ peace and the unhappy instruments of lamentable discord among bretheren who should dwell together in unity. I know that the refusers of the ceremonies are blamed as if they were the troublers of the peace of the Church and the tumultuating contentious spirits who make so much ado about matters of rite and ceremony. But I know also that none have been more ordinarily and commonly blamed for troubling the peace of the Church than they who least deserved to be blamed for it. So was Elijah himself thought to be he that troubled Israel when he contended against the corruptions of the Church in his time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 7, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

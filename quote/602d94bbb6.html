<main class="wrap"><figure class="quote" id="q-602d94bbb6" data-kw="">
<blockquote><p>The fifth mark is “the continued succession of bishops without any interruption, from the apostles even to our times.” But here (in the first place), we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). Nay, since the church is ambulatory and not tied down to this or that place, such also is its succession. (b) It is not proper because it belongs also to false teachers. Annas and Caiaphas succeeded Aaron in the priesthood; the scribes and Pharisees succeeded the fathers and the interpreters of the law; Arians succeeded the orthodox; the Greek church (which the Romanists consider schismatical and heretical) glories in an uninterrupted succession of bishops from the apostles. Bellarmine himself confesses that “the church cannot necessarily be inferred to be where a succession is” (“De Notis Ecclesiae,” 4.8 Opera [1857], 2:118). (c) A local and personal succession can be without a succession of doctrine. Therefore it cannot be a mark of the church because it cannot be a true church which does not have the apostolic doctrine. For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/the-church/marks-of-the-true-church.html">Marks of the True Church</a> › <a href="../topics/the-church/marks-of-the-true-church/unity-holiness-catholicity-apostolicity.html">Unity, holiness, catholicity, apostolicity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-085c3e4109" data-kw="">
<blockquote><p>Now I confidently say that whosoever calls himself, or desires to be called, Universal Priest, is in his elation the precursor of Antichrist, because he proudly puts himself above all others. Nor is it by dissimilar pride that he is led into error; for, as that perverse one wishes to appear as above all men, so whosoever this one is who covets being called sole priest, he extols himself above all other priests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 7, ep. 33 (to the Emperor Maurice)</span></figcaption>

</figure><figure class="quote" id="q-3be6d89447" data-kw="">
<blockquote><p>The pope makes everything right. Where the pope is, there is the true church, pure doctrine, and apostolic succession. The truth is, there is not a word in Scripture about such an apostolic succession. Even as such it is no more a guarantee of purity of doctrine than the hereditary high-priestly office of Caiaphas validated the justice of his pronouncements and actions. For that reason Protestants were right in saying that not “the succession of places and persons” (successio locorum et personarum) but “the succession of doctrine” (successio doctrinae) is a distinguishing feature of the true church. If the latter is missing, the former can make no church into a true church; and if it is present, the former is of very minor significance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §496</span></figcaption>

</figure><figure class="quote" id="q-be1bfa0f0d" data-kw="">
<blockquote><p>For their very doctrine, after comparison with that of the apostles, will declare, by its own diversity and contrariety, that it had for its author neither an apostle nor an apostolic man; because, as the apostles would never have taught things which were self-contradictory, so the apostolic men would not have inculcated teaching different from the apostles, unless they who received their instruction from the apostles went and preached in a contrary manner. To this test, therefore will they be submitted for proof by those churches, who, although they derive not their founder from apostles or apostolic men (as being of much later date, for they are in fact being founded daily), yet, since they agree in the same faith, they are accounted as not less apostolic because they are akin in doctrine.</p></blockquote>

</figure><figure class="quote" id="q-b65840e1fc" data-kw="">
<blockquote><p>For they hold the places, but you the Apostolic Faith. They are, it is true, in the places, but outside of the true Faith; while you are outside the places indeed, but the Faith, within you. Let us consider whether is the greater, the place or the Faith. Clearly the true Faith. Who then has lost more, or who possesses more? He who holds the place, or he who holds the Faith? Good indeed is the place, when the Apostolic Faith is preached there, holy is it if the Holy One dwell there.</p></blockquote>

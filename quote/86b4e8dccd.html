<main class="wrap"><figure class="quote" id="q-86b4e8dccd" data-kw="">
<blockquote><p>2. There are many parts of God’s worship which are not essential, yet such as will not suffer any addition of the Church. For proof whereof, I demand, were all the ceremonies commanded to be used in the legal sacraments and sacrifices, essential parts of those worships? No man will say so. Yet the synagogue was tied to observe those (and no other than those) ceremonies which the Word prescribed. When Israel was again to keep the Passover, it was said; In the fourteenth day of this month at even, ye shall keep it in his appointed season: according to all the rites of it and according to all the ceremonies of it, shall ye keep it. And again: ‘According to all that the Lord commanded Moses, so did the Children of Israel.’ Ritibus et ceremoniis divinitus institutis, non licuit homini suo arbitrio aliquid adijcere aut detrahere, says Peter Martyr.

3. If those accidentary parts of worship which are commanded in the Word be both necessary to be used necessitatè praecepti [by the necessity of precept], and likewise sufficient means fully adequate and proportioned to that end, for which God has destinated such parts of his worship as are not essential (which must be granted by everyone who will not accuse the Scripture of some defect and imperfection: then it follows that other accidentary parts of worship which the Church adds thereto are but superfluous and superstitious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 7, pp. 120-21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1aff900802" data-kw="">
<blockquote><p>The second point is that the outward worship does not please God of itself, but by means of the inward before described. Again, it is spiritual, not by itself, because it stands in bodily actions; but by reason of the inward worship, whence it proceeds and whereof it is a sign. Moreover, being severed from inward worship, it is worship in show, and not worship in truth. If they eye be evil, the whole body is dark. (Mt. 6:13) Christ bids the Pharisees to wash the inside of the cup and platter, and then all shall be clean (Mt. 23:25-26).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 707</span></figcaption>

</figure><figure class="quote" id="q-ac7f231ad0" data-kw="">
<blockquote><p>…the worship of God is twofold, inward or outward… The outward is that worship whereby the inward is testified outwardly in the speach and actions… Indeed all the worship of God is spiritual, even that which we call outward; yet not of itself, but by virtue of the inward, from which it proceeds. The heads of inward worship are two: adoration of God and cleaving to God… Now in adoration there are four virtues: feare, obedience, patience, thankfulness. … The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22. This stands in two things. First, in yielding subjection of the conscience to the commandments, threatnings and promises of God, so as we are willing that it should become bound unto them. Secondly, when the rest of the powers of the soul, in their place and time, perform obedience unto God. … …touching inward worship, we must remember that it alone is properly, simply, and of itself, the worship of God; and the outward is not simply the worship of God, but only so far forth as it is quickened by the inward, and grounded upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, ch. 5, question 2, “How God is to be Worshipped &amp; Served?” in The Whole Treatise of the Cases of Conscience… (Cambridge: Legat, 1606), bk. 2, pp. 256-62</span></figcaption>

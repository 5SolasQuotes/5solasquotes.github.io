<main class="wrap"><figure class="quote" id="q-69b5376adb" data-kw="">
<blockquote><p>[It is superstition] that all the pastors of the protestant Churches abroad, who had only the election of the people and the ordination of parochial pastors, and not of diocesan bishops, are no true ministers of Christ, but laymen. That therefore those Churches are no true Churches (in a political sense and as organized). That therefore their baptism is unlawful and a nullity, and all those nations are no baptized Christians (though the Papists who hold the validity of laymen’s baptizing do here censure [these protestant episcopal men] more easily). That it is not lawful to communicate in such Churches and receive the sacrament of the Lords supper from such ministers. That those countries which are baptized by such should be rebaptized. That those ministers who are ordained by such should be re-ordained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, p. 292</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-50faa103fb" data-kw="">
<blockquote><p>18. It was not necessary to the priesthood before Christ that there were an uninterrupted succession of right ordination: For the priests in Christ’s time were such as had no right to it, not of the right line (which had been long before interrupted), they bought the priesthood for money: and as many judge, were annual and two at a time (though not equal). Yet Christ requires submission to them as priests. I am sorry that we must be put to use the same arguments with these [episcopal] men as we have done against the old Separatists so long.</p></blockquote>

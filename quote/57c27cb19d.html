<main class="wrap"><figure class="quote" id="q-57c27cb19d" data-kw="">
<blockquote><p>We see that God is (as ye would say) wayward towards us; we see that He does not only bereave us of his blessings, but is also angry with us; and to be short, we perceive in Him nothing but all manner of rigor. And what is the cause hereof? Verily that we shut the gate against his goodness and will not suffer Him to use (as ye would say) his natural disposition. Lo here [is] a thing that should make us the better to acknowledge our faults and not to accuse God of any excessive cruelty when He deals not with us after our liking. For it is certain that He will take pleasure in doing us good, but on the other side let us consider also that He must in likewise delight to do us evil. And why so? Verily because that He is just. Indeed, if we did suffer God to use his own inclination towards us, He would bestow infinite benefits upon us and we living in this world should be as in Paradise. But because of our sins, we must live here like wretched wanderers; we must languish in many miseries, we must dwell in continual fear and in doubt and we must groan in great unrest: it must be even so. And wherefore? Because God is just. This is the very pleasure that is spoken of in this text, according whereunto it is said that God will rejoice and be glad when He has punished the wicked and maintained his majesty against them, for that they have despised Him and set Him at nought. Nevertheless, it is likewise true that He says by his prophet Isaiah [1:24] that He does it unwillingly. ‘Alas’ (says He) ‘must I needs revenge Me of mine enemies?’ God cries there ‘Alas,’ as if He were in sorrow and anguish for it. ‘I must’ (says He) ‘take comfort in avenging Me of mine enemies.’ Those whom He terms his enemies are the children whom He had adopted, and which boasted themselves to be his people. And how does He comfort Himself in them? Even by giving them over and by driving them away. But in the meanwhile He shows that it is against his will when He must so beat men down with main strokes, howbeit that He can none otherwise do. Yet notwithstanding, in very deed God is able to tame the hearts of men without any great violence: for (as we have said) He is not subject to our passions. But hereby we be to consider how his intent is to declare that our unreformable naughtiness is the cause why He is faine to pursue us after such manner as is spoken of here and that He is faine to take pleasure in doing us harm, wherein the order of nature is after a sort quite altered and changed: but all is through our own fault and we ourselves are to blame for it, and it is not for us to seek any other reason thereof than our own sin which has kindled his vengeance to the uttermost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of Mr. John Calvin upon the Fifth Book of Moses called Deuteronomy... (London: Middleton, 1583), Sermon 162, the 10th upon the 28th Chapter, p. 1,005 on Dt. 28:63, “And it shall come to pass, that like as the Lord thy God rejoiced over thee to do thee good, and to multiply thee: even so will the Lord rejoice over you to destroy you, and to bring you to nought…”</span></figcaption>

f="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=We%20see%20that%20God%20is%20%28as,kindled%20his%20vengeance%20to%20the%20uttermost&amp;text=We%20see%20that%20God%20is%20%28as%20ye%20would&amp;text=which%20has%20kindled%20his%20vengeance%20to%20the%20uttermost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7576bf8bff" data-kw="">
<blockquote><p>It must be admitted that if the expression [of God’s desiring the repentance and salvation of the reprobate] were intended to apply to the decretive will of God then there would be, at least, implicit contradiction. For to say that God desires the salvation of the reprobate and also that God wills the damnation of the reprobate and apply the former to the same thing as the latter, namely, the decretive will, would be contradiction; it would amount to averring of the same thing, viewed from the same aspect, God wills and God does not will. The question then is: what is implicit in, or lies back of; the full and free offer of the gospel to all without distinction? The word “desire” has come to be used in the debate, not because it is necessarily the most accurate or felicitous word but because it serves to set forth quite sharply a certain implication of the full and free offer of the gospel to all. This implication is that in the free offer there is expressed not simply the bare preceptive will of God but the disposition of lovingkindness on the part of God pointing to the salvation to be gained through compliance with the overtures of gospel grace. In other words, the gospel is not simply an offer or invitation but also implies that God delights that those to whom the offer comes would enjoy what is offered in all its fullness. And the word “desire” has been used in order to express the thought epitomized in Ezekiel 33:11, which is to the effect that God has pleasure that the wicked turn from his evil way and live. It might as well have been said, “It pleases God that the wicked repent and be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’ | Introduction</span></figcaption>

<blockquote><p>13. …There is all in God that is good, and perfect, and excellent in our desires and wishes for the conversion and salvation of wicked men. As, for instance, there is a love to holiness, absolutely considered, or an agreeableness of holiness to his nature and will; or, in other words, to his natural inclination. The holiness and happiness of the creature, absolutely considered, are things that he loves. These things are infinitely more agreeable to his nature than to ours. There is all in God that belongs to our desire of the holiness and happiness of unconverted men and reprobates, excepting what implies imperfection. All that is consistent with infinite knowledge, wisdom, power, self-sufficience, infinite happiness, and immutability. Therefore, there is no reason that his absolute prescience, or his wise determination and ordering what is future, should hinder his expressing this disposition of his nature, in like manner as we are wont to express such a disposition in ourselves, viz. by calls and invitations, and the like.</p></blockquote>

<blockquote><p>There is in God a universal or common love by which he is inclined to do good to every creature, and so then also to man (Ps. 36:6; 1 Tim. 4:10), by external and common benefits (Ps. 17:14), and there is also a special, saving love by which he dispenses the benefits that accompany salvation, which have an unbreakable connection with salvation (Heb. 6:9).</p></blockquote>

<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-39af7ce945" data-kw="">
<blockquote><p>[W]hy the Lord says, “He that doeth the things of the law shall live,” considering no man since the fall can do the things of the law? Answer. The Lord since man’s fall repeats the law in his [its] old tenor, not to mock men, but for other weighty causes. The first is to teach us that the law is of a constant and unchangeable nature. The second is to advertise us of our weakness and to show us what we cannot do. The third is to put us in mind that we must still humble ourselves under the hand of God, after we have begun by grace to obey the law, because even then we come far short in doing the things which the law requires at our hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:178.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>Do you see how he makes this the distinction between law and gospel: that the former attributes righteousness to works, the latter bestows free righteousness apart from the help of works? This is an important passage, and one that can extricate us from many difficulties if we understand that righteousness which is given us through the gospel has been freed of all conditions of the law. (Calvin commenting on Romans 10:9)</p></blockquote>

</figure><figure class="quote" id="q-ca815d96e5" data-kw="uses absolute relative rule">
<blockquote><p>A twofold use of the law may be laid down—absolute and relative. The former regards the law in itself; the latter regards the law in relation to the various states of man. The absolute (which obtains in every state of man) is that it may be a unique, full and certain rule of things to be done and avoided by each of us as well towards God as his neighbor. Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.2</span></figcaption>

</figure><figure class="quote" id="q-ac44ef0045" data-kw="judicial ends theocracy">
<blockquote><p>The forensic or judicial law concerned the civil government of the people of God under the Old Testament and contained a body of precepts concerning the form of that political rule. There were various ends of it. (1) The good order and legitimate constitution of the Jewish polity, which should be a true theocracy, as Josephus calls it. (2) The distinguishing of that state and nation from all other people and states and that that polity might be the seat of the church and the place for the manifestation of God. (3) The vindication of the moral and ceremonial law from contempt. (4) The adumbration of the spiritual kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.26.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-decdbbeb3b" data-kw="">
<blockquote><p>So that as God made all things in six days: so we may use them six days, as Adam did in the garden: and as the Lord rested from his works of creation, though not from his work of providence and administration, so must we set a part this day, to look for a special blessing and special benediction of God his worship, because of his own promise and institution. Why did the Lord this to our first father? He beheld the works of every day, and blessed every day? We must note, that he gave a special blessing above the other days, unto this day.

Now therefore admit that a man should grant this much to a heretic, that we should be as perfect as Adam in his innocence: (which is a manifest heresy) yet they must grant, that we stood in need of the word and Sacraments, (the use whereof they deny) seeing Adam had need of the use of all these things, being yet without sin. We therefore oppose thus much unto them, that so long as they will acknowledge a need of corporal helps, by calling for meat, sleep, apparel: so long their souls stand in need of spiritual means, as of the word, Sacraments and prayer, because their souls must as well be preserved, as their bodies nourished.

Our first father then had a Sabbath to be put in mind of the Creator, and that without distraction he might the better be put in mind of the glorious kingdom to come, that more freely he might give himself to meditation, and that he might the better glorify God in six days. As the heretics then deny the necessity of the word, prayer and Sacraments: so we look for a new heaven, and a new earth, and then we hope and acknowledge, that we shall keep a continual Sabbath. But in the meantime, seeing the Sabbath which we now have, was before sin, we, since sin came into the world, have much more need of it, because that which was needful to continue Adam in innocence, is also as needful to recover us, and to continue us in our recovery. The Lord then having sanctified this day, it is not our day, but the Lord his own day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

<blockquote><p>In these Ten Commandments was contained the sum and essence of all the law that was given unto Israel. Everything else in the way of law, that was delivered to the chosen people, had its foundation in those moral principles and precepts which the Decalogue contains.

This law laid down the rule of man’s obedience, — the righteous and immutable rule which defines and regulates his duty to God on the one hand, and to his fellow-creatures on the other.

The judicial law which, by Divine authority, was separately and subsequently instituted, was nothing more than the application of the great maxims of the moral law, to the government of Israel, as a church and nation placed under theocratic rule. In the details of that judicial law, there were necessarily, in such circumstances, many provisions of a merely local and temporary nature — intended for that people alone, and for the peculiar economy under which they lived. But in all its leading objects and aims, the judicial law of ancient Israel drew its spirit and derived its highest authority, from the law that was written on tables of stone.

Nor was it otherwise in the case of the ceremonial law. That law of meats and drinks, and divers washings and sacrifices of slain beasts, and other carnal ordinances, was, no doubt, in its literal and outward form, a purely positive institution, which had no moral worth or efficacy in itself considered. But nevertheless, the moral law — the law of the Ten Commandments — lay underneath it all. To transgress the moral law was to sin against God. And what was the great end and design of the ceremonial law, but to make palpable the awful and momentous fact, that sin is the abominable thing which God hates; and that without holiness — the holiness which the moral law embodies and demands — no man shall see the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Relation of the Law, as Given to Israel, to the Mission and Work of Christ in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>The state may recognise the Sabbath as a day set apart for worship and sacredness, and throw around the rest of the Sabbath the fence of a legal acknowledgment. … In the case of the weekly rest of the Sabbath, as God imposes on every man the obligation to observe and sanctify it, so by that very obligation He confers on every man the right to demand at the hands of his fellow-men the free and undisturbed use and enjoyment of the day, as a day to be exempted from the claims of human society, because already claimed by God.

This is the warrant which every Christian has to ask that he shall have power and liberty given him to use the day for the service of God. — a power and liberty which, if they are not to be at the mercy of other men, must be guarded by the recognition and protection of law. The Sabbath, in this respect, differs from other duties appointed to the Christian. These are for the most part private, and peculiar to the individual; the Sabbath is a social and public ordinance. The former may be observed by individuals as such, without regard to the observance of them by their fellow-men; the Sabbath cannot be generally or completely observed without the concurrence and consent of others.

It is well-nigh impossible, therefore, for an individual to keep the Sabbath as it ought to be kept, without the aid and advantage of the state making the at least outward observance of the Sabbath rest a national thing. No doubt it is possible, in one sense of the term, for every man not actually under physical restraint to cease from labour on the Sabbath, while others persist in it, and to sanctify the day, while others devote it to their ordinary occupations or pleasures. But a keeping of the Sabbath like this involves such sacrifices to be made, and such obstacles to be overcome, that it would virtually and practically amount to a prohibition of keeping it at all.

The Christian slave in the early ages of the Gospel could not, generally speaking, have kept the Sabbath at all, unless in those rare cases where he was, like Onesimus with Philemon, not so much a slave as a brother beloved in the Gospel. And the Christian who, in modern days, is hardly less a slave, for the sake of his subsistence, to unremitting and constant toil from day to day, with an unprotected Sabbath, and the unprincipled competition of others willing to devote the Sabbath to labour and to gain, would feel himself scarcely in better circumstances for observing its rest and its duties, than the Greek or the Roman bondsman in the days of Paul. Without the protection of law, enforcing the rest of one day in seven, the Sabbath in an irreligious society could hardly be kept even by Christians.

Yet it is only because the civil government to that extent recognises the law of Scripture, and throws around the Sabbath the fence of its authority, that we have a day of weekly rest and sacredness secured to us at all. In itself it is no civil right, but a religious one. The warrant for the weekly Sabbath is no human authority or human convenience, but the express command of God. The state may recognise this authority, and, acting in concert with religion, may sanction the Sabbath by law, and in doing so be at one with religion.

But a state acting on the principle of indifference alike to truth and error, to the religion of God and the falsehoods of man, must necessarily disown any such appointment; and divorced from Christianity, or disavowing it, must afford another illustration of the general position, that when religion and civil government do not co-operate and unite, the separation must be fatal to the highest interests of the one or the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 132, 145-47.</span></figcaption>

— James Bannerman, The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 132, 145-47.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+state+may+recognise+the+Sabbath+as+a+day+set+apart+for+worship+and+sacredness%2C+and+throw+around+the+rest+of+the+Sabbath+the+fence+of+a+legal+acknowledgment.+%E2%80%A6+In+the+case+of+the+weekly+rest+of+the+Sabbath%2C+as+God+imposes+on+every+man+the+obligation+to+observe+and+sanctify+it%2C+so+by+that+very+obligation+He+confers+on+every+man+the+right+to+demand+at+the+hands+of+his+fellow-men+the+free+and+undisturbed+use+and+enjoyment+of+the+day%2C+as+a+day+to+be+exempted+from+the+claims+of+human+society%2C+because+already+claimed+by+God.%0A%0AThis+is+the+warrant+which+every+Christian+has+to+ask+that+he+shall+have+power+and+liberty+given+him+to+use+the+day+for+the+service+of+God.+%E2%80%94+a+power+and+liberty+which%2C+if+they+are+not+to+be+at+the+mercy+of+other+men%2C+must+be+guarded+by+the+recognition+and+protection+of+law.+The+Sabbath%2C+in+this+respect%2C+differs+from+other+duties+appointed+to+the+Christian.+These+are+for+the+most+part+private%2C+and+peculiar+to+the+individual%3B+the+Sabbath+is+a+social+and+public+ordinance.+The+former+may+be+observed+by+individuals+as+such%2C+without+regard+to+the+observance+of+them+by+their+fellow-men%3B+the+Sabbath+cannot+be+generally+or+completely+observed+without+the+concurrence+and+consent+of+others.%0A%0AIt+is+well-nigh+impossible%2C+therefore%2C+for+an+individual+to+keep+the+Sabbath+as+it+ought+to+be+kept%2C+without+the+aid+and+advantage+of+the+state+making+the+at+least+outward+observance+of+the+Sabbath+rest+a+national+thing.+No+doubt+it+is+possible%2C+in+one+sense+of+the+term%2C+for+every+man+not+actually+under+physical+restraint+to+cease+from+labour+on+the+Sabbath%2C+while+others+persist+in+it%2C+and+to+sanctify+the+day%2C+while+others+devote+it+to+their+ordinary+occupations+or+pleasures.+But+a+keeping+of+the+Sabbath+like+this+involves+such+sacrifices+to+be+made%2C+and+such+obstacles+to+be+overcome%2C+that+it+would+virtually+and+practically+amount+to+a+prohibition+of+keeping+it+at+all.%0A%0AThe+Christian+slave+in+the+early+ages+of+the+Gospel+could+not%2C+generally+speaking%2C+have+kept+the+Sabbath+at+all%2C+unless+in+those+rare+cases+where+he+was%2C+like+Onesimus+with+Philemon%2C+not+so+much+a+slave+as+a+brother+beloved+in+the+Gospel.+And+the+Christian+who%2C+in+modern+days%2C+is+hardly+less+a+slave%2C+for+the+sake+of+his+subsistence%2C+to+unremitting+and+constant+toil+from+day+to+day%2C+with+an+unprotected+Sabbath%2C+and+the+unprincipled+competition+of+others+willing+to+devote+the+Sabbath+to+labour+and+to+gain%2C+would+feel+himself+scarcely+in+better+circumstances+for+observing+its+rest+and+its+duties%2C+than+the+Greek+or+the+Roman+bondsman+in+the+days+of+Paul.+Without+the+protection+of+law%2C+enforcing+the+rest+of+one+day+in+seven%2C+the+Sabbath+in+an+irreligious+society+could+hardly+be+kept+even+by+Christians.%0A%0AYet+it+is+only+because+the+civil+government+to+that+extent+recognises+the+law+of+Scripture%2C+and+throws+around+the+Sabbath+the+fence+of+its+authority%2C+that+we+have+a+day+of+weekly+rest+and+sacredness+secured+to+us+at+all.+In+itself+it+is+no+civil+right%2C+but+a+religious+one.+The+warrant+for+the+weekly+Sabbath+is+no+human+authority+or+human+convenience%2C+but+the+express+command+of+God.+The+state+may+recognise+this+authority%2C+and%2C+acting+in+concert+with+religion%2C+may+sanction+the+Sabbath+by+law%2C+and+in+doing+so+be+at+one+with+religion.%0A%0ABut+a+state+acting+on+the+principle+of+indifference+alike+to+truth+and+error%2C+to+the+religion+of+God+and+the+falsehoods+of+man%2C+must+necessarily+disown+any+such+appointment%3B+and+divorced+from+Christianity%2C+or+disavowing+it%2C+must+afford+another+illustration+of+the+general+position%2C+that+when+religion+and+civil+government+do+not+co-operate+and+unite%2C+the+separation+must+be+fatal+to+the+highest+interests+of+the+one+or+the+other.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%3A+A+Treatise+on+the+Nature%2C+Powers%2C+Ordinances%2C+Discipline%2C+and+Government+of+the+Christian+Church%2C+ed.+D.+Douglas+Bannerman+%282+vols%2C+Edinburgh%3A+T+%26+T+Clark%2C+1868%29%2C+1%3A+132%2C+145-47.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fea4f179441.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ea4f179441.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/21/james-bannerman-on-legal-protection-for-the-sabbath-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant [1643] which renounces profaneness, schism and all that is contrary to godliness.

27. So much are Papists angry at Protestant ministers that keep them [non-conformists] out of the parish churches, [Papists] reviling them [such Protestant ministers] as trimmers, [Papists] supposing that conventicles [worship assemblies of non-conformists] can do them less harm, that all that love the Protestant religion should do their best to encourage† all such orthodox men and to strengthen the Protestant interest in the parish churches, and not join against them with the Papists (however it be with other intents and minds).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0617859933" data-kw="">
<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon</cite>, p. 509</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | question 17</cite>, p. 72 lt col top</span></figcaption>

</figure><figure class="quote" id="q-4d11c8f399" data-kw="">
<blockquote><p>I confess that we being free in Christ, are not bound to the Civil Laws of Moses in every circumstance; yet seeing no laws can be more honest, just and wholesome, than those which God Himself gave, who is eternal Wisdom and Goodness, I see not why Christians, in things which no less appertain to them, ought not to follow the Law of God, rather than of any men…</p></blockquote>

</figure><figure class="quote" id="q-76b42ef2c0" data-kw="">
<blockquote><p>…especially seeing his Majesty [King Charles I] shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>

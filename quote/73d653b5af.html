<main class="wrap"><figure class="quote" id="q-73d653b5af" data-kw="">
<blockquote><p>But the word of the gospel explains to a man the riches of divine love and grace. This word of grace offers the remission of sins and eternal life to the one who believes in Christ Jesus the true Mediator. It gently invites a man to communion of God. This good word, a word of consolation, a living word, can restore the life of a soul and, as it were, bring it back from the dead. This word is like a light accompanied by warmth, as is the case with the sun that illumines, warms, and—penetrating into the depths of the earth—produces the movement of life in everything that receives the influence of its rays.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Life</cite>, trans. Charles F. Telfer (Grand Rapids: Reformation Heritage Books, 2018), 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

<blockquote><p>53. For just as a physician who abolishes and removes disease and restores health; a master who abolishes and takes away servitude and grants freedom to a slave; a lord who breaks and destroys a prison and releases a captive and exalts him to the highest dignity – these are not said to use force upon the sick man, the slave, or the captive. So neither does God use force upon one to whom He provides that renewing grace. And just as it is foreign to debate whether a sick man is restored to health irresistibly, a slave to liberty, a captive to dignity, so it is foreign to this matter to dispute whether God’s renewing grace operates irresistibly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-c-waser.html">Johann C. Waser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Consideration of a Theological Question</cite>, (fl. 1628-1667) 22 pp. tr. AI by Confetti, pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“53. For just as a physician who abolishes and removes disease and restores health; a master who abolishes and takes away servitude and grants freedom to a slave; a lord who breaks and destroys a prison and releases a captive and exalts him to the highest dignity – these are not said to use force upon the sick man, the slave, or the captive. So neither does God use force upon one to whom He provides that renewing grace. And just as it is foreign to debate whether a sick man is restored to health irresistibly, a slave to liberty, a captive to dignity, so it is foreign to this matter to dispute whether God’s renewing grace operates irresistibly.”

</figure><figure class="quote" id="q-06ea2b0dbe" data-kw="">
<blockquote><p>Fifthly, if thou art a holy person, if thou art one that hast that real holiness without which there is no happiness, then know for thy comfort, that thy holiness is a glorious witness and evidence of thy effectual vocation, 1 Pet. 1:15, ‘As He who hath called you is holy, so be ye holy in all manner of conversation.’ Many are externally called that are not internally called, and many are ineffectually called that are not effectually called. But now real holiness that speaks out an internal call, an effectual call, a call out of darkness into marvelous light… The Author of this call is a holy God; our holy calling depends upon the purpose of God, the power of God, and the grace and good pleasure of God; the means of our holy calling are the Spirit of God and the Word of God; and the ends of our calling are holiness and the glory of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity</cite>, ... (London: Crips, 1662), The Necessity, Excellency, Rarity &amp; Beauty of Holiness, Use 3, pp. 623-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

 it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c9f458036e" data-kw="">
<blockquote><p>And, in the third place, this external calling is not without results. In general it can be said of it that God achieves His purpose by means of it… Among the heathen there is great difference between the ways in which they react to the calling of nature. Socrates and Plato are not to be named in one breath with Caligula and Nero. And so it is by no means the same thing whether the gospel is mocked and blasphemed, on the one hand, or accepted with an historical or temporary belief, on the other. True, between these two kinds of faith and a saving faith of the heart there is an essential difference. But that is not to equate them with total unbelief. On the contrary, they are fruits of God’s common grace and they carry with them many temporal blessings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Reasonable Faith: A Survey of Christian Doctrine</cite>, trans. Henry Zylstra (Eerdmans, 1956), ch. 20, ‘The Christian Calling,’, pp. 415-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<main class="wrap"><figure class="quote" id="q-3568c2f12c" data-kw="">
<blockquote><p>The mercy of God is but a partial object of faith. A partial, I say, because this alone is not enough to give faith any hold. Faith can find no mercy to pitch on but in and through Christ, nor is there any mercy for a sinner out of him. Therefore Christ must be added before mercy can be an ample object for faith to fix on.

Christ is the only mercy-seat of faith. Would it find mercy? it must seek it where it is to be found, where it is seated: Rom. 3:25, ὃν προέθετο ὁ Θεὸς ἱλαστήριον, whom God has placed as a mercy-seat; the same word, Heb. 9:5, κατασκιάζοντα τὸ ἱλαστήριον.

The mercy-seat in the tabernacle was a type of Christ; and the posture of it is no more mysterious than comfortable, Exod. 25. It was the covering of the ark, above it were the cherubims of glory, the seat of the divine Majesty; and therefore he is said to sit betwixt the cherubims, Ps. 80:1. Under it were the tables of the covenant, or of the testimony, as it is called, Exod. 25; i.e., of the law, which bears testimony against sinners, which accuses, curses, condemns.

Christ the mercy-seat is interposed betwixt the judge and the condemning law. Take away Christ, and nothing can be expected from the Judge but the law in its rigour, law without mercy. As the law will shew no mercy, that is all for justice, so the Lord will shew no mercy but on the mercy-seat, none but through Christ. Christ must be added to make mercy a complete, a fit object for faith. Without him it is but a partial object, if any at all. Mercy through Christ is faith’s object. If faith pitch on mercy without him, it will pitch upon that which will not support it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Faith in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

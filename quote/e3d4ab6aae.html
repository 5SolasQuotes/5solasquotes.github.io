<main class="wrap"><figure class="quote" id="q-e3d4ab6aae" data-kw="">
<blockquote><p>Since, however, we have frequently to mention the words essence and substance, we must determine the meaning of essence, lest in discussing facts we prove ignorant of the signification of our words. Essence is a reality which is, or the reality of those things from which it is, and which subsists inasmuch as it is permanent. Now we can speak of the essence, or nature, or genus, or substance of anything.

And the strict reason why the word essence is employed is because it is always. But this is identical with substance, because a thing which is, necessarily subsists in itself, and whatever thus subsists possesses unquestionably a permanent genus, nature or substance. When, therefore, we say that essence signifies nature, or genus, or substance, we mean the essence of that thing which permanently exists in the nature, genus, or substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 12 in Nicene and Post-Nicene Fathers 2, 9: 7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ec835b72d" data-kw="">
<blockquote><p>The mind of man is a tabula rasa not absolutely, but relatively as to discursion and dianoetical knowledge (which is acquired necessarily by inferring one thing from another); but not as to apprehensive and intuitive knowledge. For even according to Paul, the work of the law is in such a manner written in the hearts of the Gentiles that they do by nature the things contained in the law. Hence is a twofold inscription upon the heart of man: the one of God in the remains of his image and the natural law; the other of the Devil by sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 1st Topic, 3rd question, ‘Whether Natural Theology may be Granted’, sect. 11, p. 9</span></figcaption>

</figure><figure class="quote" id="q-22c305050e" data-kw="">
<blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>

</figure><figure class="quote" id="q-05927b811b" data-kw="">
<blockquote><p>It is the same with the idea of substance, which is but a determination of the idea of being. Substance is being capable of existing in itself and not in something else. The intellect, which at once perceives being underneath the phenomena (something which is), observes that these phenomena are many and variable, while being, on the contrary, is one and the same, and that it exists in itself, and not as an attribute in another. Being considered as such is called substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God: his Existence &amp; his Nature</cite>, vol. 1 (B. Herder: 1945), p. 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-cd272d7124" data-kw="">
<blockquote><p>…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, ch. 11, ‘The Form of the Body’ in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pp. 493-523 See especially, ‘Hylemorphic Dualism’, pp. 505-10., p. 508</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

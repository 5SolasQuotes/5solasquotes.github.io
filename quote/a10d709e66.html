<main class="wrap"><figure class="quote" id="q-a10d709e66" data-kw="">
<blockquote><p>Upon scriptural and Protestant principles, every man has the right of private judgment, —i.e., he is entitled to interpret the word of God for himself upon his own responsibility, for the regulation of his own opinions and conduct, for the execution of his own functions and the discharge of his own duties, whatever these may be; and Christ has conferred upon no class of men any power that interferes with the exercise of this right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, ch. 2 (The Council of Jerusalem)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/reading-by-the-laity.html">Reading by the laity</a></span></div>

</figure><figure class="quote" id="q-b65e48dc5d" data-kw="">
<blockquote><p>In this matter there is no need of knowing immediately and a priori who has the Spirit, but only who speaks according to the Scriptures. When this becomes known by a reference to the Scriptures, we can readily judge a posteriori who utters the words of the Spirit and speaks from him. Thus the Bereans did not inquire a priori whether Paul who preached to them was moved by the Holy Spirit … but whether Paul spoke according to the Scriptures.</p></blockquote>

</figure><figure class="quote" id="q-0793d49be3" data-kw="">
<blockquote><p>The question is whether the reading should be forbidden to anyone (which we deny). … (3) The Scriptures are the Testament of our heavenly father, and should a child be forbidden to read the will of his father? … Is it not sufficient that the reading of the Scriptures is allowed by the papists to some? For that ought not to be granted to some as a privilege which is enjoined upon all as a duty.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bcb63f8b53" data-kw="">
<blockquote><p>As it is never errors or corruption of the heart, but wicked words and deeds, sufficiently and regularly manifested, which are to be corrected in families, punished in Commonwealths, or censured in Churches, Deut. 13:1-14; 17:4-6; Heb. 10:28; 1 Tim. 5:1; so even in punishing manifest crimes, especially in matters of religion, all proper mildness ought to be exercised, never proceeding to extremities, where there is any hope of reformation, or where, as in the case of heresy or blasphemy, confession and repentance can make any kind of restitution, Mat. 18:15-18.

Among the Hebrews, not one appears to have been punished for idolatry, if he professed repentance and reformation. The princes of Israel first attempted to bring the Reubenites and Gadites, whom they supposed guilty of it, to repentance, Josh. 22. Never in the reformation by Asa, Hezekiah, or Josiah, have we one instance of a penitent idolater slain. The idolaters condemned to death, Deut. 13, 17, are represented as men of Belial, presumptuous, and obstinate in their wickedness. The prophets of Baal whom Elijah caused to be put to death, 1 Kings 18:40, and Mattan the priest, who was slain by Jehoiada’s orders, 2 Kings 11:18, were no doubt of this sort; and probably also guilty of promoting the murder of the Lord’s prophets and people. The man put to death for profanation of the Sabbath appears to have acted presumptuously, Num. 15:30-36. Asa and his subjects covenanted to put to death such as obstinately adhered to idolatry, 2 Chron. 15:12, 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The absurdity and perfidy of all authoritative toleration of gross heresy, blasphemy, idolatry, popery, in Britain. In two letters to a friend. In which the doctrine of the Westminster Confession of Faith relative to toleration of a false religion, and the power of the civil magistrate about sacred </cite>, (1780; Glasgow, 1803), p. 13.</span></figcaption>

<blockquote><p>And indeed it [the Exodus] was the greatest typ of Christ’s redemption of any providential event whatsoever. This was by Jesus Christ, for it was wrought by Him who appeared to Moses to redeem that people. But that was Christ, as is evident, because He is called ‘the angel of the Lord,’ Ed. 3:2-3. The bush represented the human nature of Christ, who is called the ‘branch.’ This bush grew on mount Sinai or Horeb, a word that signifies a dry place, as the human nature of Christ was a root out of dry ground. The bush burning with fire, represented the sufferings of Christ, in the fire of God’s wrath. It burned, and was not consumed; so Christ, though He suffered extremely, yet perished not; but overcame at last, and rose from his sufferings. Because this great mystery of the incarnation and sufferings of Christ was here represented, therefore Moses says, ‘I will turn aside, and behold this great sight.’ A great sight he might well call it, when there was represented, ‘God manifest in the flesh,’ suffering a dreadful death, and rising from the dead.</p></blockquote>

<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-8757ce69f8" data-kw="">
<blockquote><p>…the office-power, no, not though it were from idolaters, for idolatrous purposes, does not make persons actually idolaters, till they do actually exhibit divine worship to a creature. Suppose a person be ordained a priest to offer sacrifice-propitiatory for the quick and dead in the mass; yet if he repent thereof, and never do adore the breaden-god, he is not an idolater: Yea, suppose he act in baptizing, preaching, marrying, burying according to the rituals of the Romanists, by virtue of his ordination as a priest, or, as this author speaks, his office-power, without exhibiting any divine worship to a creature (which in some of these may be), yet is he not thereby an idolater. The reason whereof is manifest, because he is not an idolater to whom the definition of idolatry agrees not. And this is the reason why, if Jeroboam’s priests, though consecrated for the worship of idols, did not worship them, they were not to be accounted idolaters: Nor are those that act by virtue of authority committed to them in matters civil, from rebels [such as Oliver Cromwell], equally guilty of rebellion as those from whom they derive that their authority, unless they act rebelliously; if they act for the restitution of their prince, the public peace, they are accounted good subjects [as many did under Cromwell], and not rebels, though at first they derived their authority from rebels. Nor does the worshipping of God by a form merely of humane composition make idolaters, though it have been abused to idolatry with the rites and modes of idolaters, unless there be idolatry in the form, and the rites and modes be idolatrous in their use: because, notwithstanding this, no divine worship may be given to a creature. So, though the form of baptism in the Roman Church were merely of human composition, used with crossings, cream, oil, spittle, if these rites were used, though by them abused to idolatry, not as they do, so as to give divine worship to a creature, the users in this manner, however guilty of will-worship or superstition, yet would not be justly chargeable with idolatry; no, not though they should in some sort symbolize with idolaters, that is, be assimilated to them or in some sort comply with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Sect. 11. Acting in the holy things of God, by an Office-power and modes of Idolaters, may be without Idolatry, Ch. 7; pp. 245-46</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…the office-power, no, not though it were from idolaters, for idolatrous purposes, does not make persons actually idolaters, till they do actually exhibit divine worship to a creature. Suppose a person be ordained a priest to offer sacrifice-propitiatory for the quick and dead in the mass; yet if he repent thereof, and never do adore the breaden-god, he is not an idolater: Yea, suppose he act in baptizing, preaching, marrying, burying according to the rituals of the Romanists, by virtue of his ordination as a priest, or, as this author speaks, his office-power, without exhibiting any divine worship to a creature (which in some of these may be), yet is he not thereby an idolater. The reason whereof is manifest, because he is not an idolater to whom the definition of idolatry agrees not. And this is the reason why, if Jeroboam’s priests, though consecrated for the worship of idols, did not worship them, they were not to be accounted idolaters: Nor are those that act by virtue of authority committed to them in matters civil, from rebels [such as Oliver Cromwell], equally guilty of rebellion as those from whom they derive that their authority, unless they act rebelliously; if they act for the restitution of their prince, the public peace, they are accounted good subjects [as many did under Cromwell], and not rebels, though at first they derived their authority from rebels. Nor does the worshipping of God by a form merely of humane composition make idolaters, though it have been abused to idolatry with the rites and modes of idolaters, unless there be idolatry in the form, and the rites and modes be idolatrous in their use: because, notwithstanding this, no divine worship may be given to a creature. So, though the form of baptism in the Roman Church were merely of human composition, used with crossings, cream, oil, spittle, if these rites were used, though by them abused to idolatry, not as they do, so as to give divine worship to a creature, the users in this manner, however guilty of will-worship or superstition, yet would not be justly chargeable with idolatry; no, not though they should in some sort symbolize with idolaters, that is, be assimilated to them or in some sort comply with them.”

— John Tombes, Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast, … (London: E. Cotes, 1667) | Sect. 11. Acting in the holy things of God, by an Office-power and modes of Idolaters, may be without Idolatry, Ch. 7; pp. 245-46">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+office-power%2C+no%2C+not+though+it+were+from+idolaters%2C+for+idolatrous+purposes%2C+does+not+make+persons+actually+idolaters%2C+till+they+do+actually+exhibit+divine+worship+to+a+creature.+Suppose+a+person+be+ordained+a+priest+to+offer+sacrifice-propitiatory+for+the+quick+and+dead+in+the+mass%3B+yet+if+he+repent+thereof%2C+and+never+do+adore+the+breaden-god%2C+he+is+not+an+idolater%3A+Yea%2C+suppose+he+act+in+baptizing%2C+preaching%2C+marrying%2C+burying+according+to+the+rituals+of+the+Romanists%2C+by+virtue+of+his+ordination+as+a+priest%2C+or%2C+as+this+author+speaks%2C+his+office-power%2C+without+exhibiting+any+divine+worship+to+a+creature+%28which+in+some+of+these+may+be%29%2C+yet+is+he+not+thereby+an+idolater.+The+reason+whereof+is+manifest%2C+because+he+is+not+an+idolater+to+whom+the+definition+of+idolatry+agrees+not.+And+this+is+the+reason+why%2C+if+Jeroboam%E2%80%99s+priests%2C+though+consecrated+for+the+worship+of+idols%2C+did+not+worship+them%2C+they+were+not+to+be+accounted+idolaters%3A+Nor+are+those+that+act+by+virtue+of+authority+committed+to+them+in+matters+civil%2C+from+rebels+%5Bsuch+as+Oliver+Cromwell%5D%2C+equally+guilty+of+rebellion+as+those+from+whom+they+derive+that+their+authority%2C+unless+they+act+rebelliously%3B+if+they+act+for+the+restitution+of+their+prince%2C+the+public+peace%2C+they+are+accounted+good+subjects+%5Bas+many+did+under+Cromwell%5D%2C+and+not+rebels%2C+though+at+first+they+derived+their+authority+from+rebels.+Nor+does+the+worshipping+of+God+by+a+form+merely+of+humane+composition+make+idolaters%2C+though+it+have+been+abused+to+idolatry+with+the+rites+and+modes+of+idolaters%2C+unless+there+be+idolatry+in+the+form%2C+and+the+rites+and+modes+be+idolatrous+in+their+use%3A+because%2C+notwithstanding+this%2C+no+divine+worship+may+be+given+to+a+creature.+So%2C+though+the+form+of+baptism+in+the+Roman+Church+were+merely+of+human+composition%2C+used+with+crossings%2C+cream%2C+oil%2C+spittle%2C+if+these+rites+were+used%2C+though+by+them+abused+to+idolatry%2C+not+as+they+do%2C+so+as+to+give+divine+worship+to+a+creature%2C+the+users+in+this+manner%2C+however+guilty+of+will-worship+or+superstition%2C+yet+would+not+be+justly+chargeable+with+idolatry%3B+no%2C+not+though+they+should+in+some+sort+symbolize+with+idolaters%2C+that+is%2C+be+assimilated+to+them+or+in+some+sort+comply+with+them.%E2%80%9D%0A%0A%E2%80%94+John+Tombes%2C+Theodulia%2C+or+a+Just+Defence+of+Hearing+the+Sermons+%26+other+teaching+of+the+present+Ministers+of+England+against+a+book+unjustly+entitled%2C+A+Christian+testimony+against+them+that+serve+the+image+of+the+beast%2C+%E2%80%A6+%28London%3A+E.+Cotes%2C+1667%29+%7C+Sect.+11.+Acting+in+the+holy+things+of+God%2C+by+an+Office-power+and+modes+of+Idolaters%2C+may+be+without+Idolatry%2C+Ch.+7%3B+pp.+245-46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8757ce69f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8757ce69f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=the%20office%2Dpower%2C%20no%2C%20not%20though%20it,in%20some%20sort%20comply%20with%20them&amp;text=the%20office%2Dpower%2C%20no%2C%20not%20though%20it%20were%20from&amp;text=them%20or%20in%20some%20sort%20comply%20with%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God from eternity either approves or disapproves of something. Approval in general is either bare and without the decree, or it is with the decree. Approval without the decree is when God approves something simply, yet He does not decree that it be chosen or followed after. Approval without the decree belongs to all good things with respect to themselves, though they are not at any time realized, of which sort are the conversion, faith, and salvation of reprobates; which God surely approves of simply, but does not decree to come about; thus He decrees them not to come about… Concerning approval without the decree, see Dt. 5:29, “O that there were such a heart in them, that they would fear me and keep all my commandments always, that it might be well with them, and with their children forever!” 1 Tim. 2:4, “Who will have all men to be saved, and to come unto the knowledge of the truth.” 1 Tim. 4:10, “…who is the Savior of all men, specially of those that believe.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Brief Instruction on the Eternal Approval &amp; Disapproval of the Divine Mind’</cite>, trans. Charles Johnson &amp; Travis Fentiman (1593/4; ReformedBooksOnline, 2020), p. 3 Rollock here positis an eternal foundation for the revealed will of God, namely God’s will of approval and disapproval. This paradigm would continue through Rutherford and others.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53e29e8e2c" data-kw="">
<blockquote><p>The will of God,¹ as to all things, must always be fulfilled, – because as the Almighty can do everything possible, so, when the divine will is determined for positing something in being with final determination, it will be; but to will that with will of being well-pleased is to will it with the last determination that can be posited on the part of the omnipotent will willing the effect into being; therefore, in respect of whatever effect God is thus willing, it will be. ¹ The Vatican editors say this is against Scotus’ doctrine, and they refer to Rep. IA d. 46 nn. 17-18, 12-14, and to nn. 7-8 here below. …

7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation.

8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ordinatio</cite>, bk. 1, dist. 26-48 tr. Peter Simpson (2013 / 2023), dist. 46, Whether God’s Will of Good-Pleasure is always fulfilled? II. To the Principal Arguments, p. 197</span></figcaption>

<blockquote><p>48. That which God wills, that is, swears to be, is not in diverse times, nor does He swear [jubet, commandingly oblige] and call by distinct actions, but by one most simple act. And therefore diverse decrees ought not to be discerned in God. Nor is it true with [amidst, apud] God ‘that which is last in execution, that is the first in intention’, unless we may assuredly so interpret this phrase, ‘that which is last in execution, that is the first in intention’ in the manner that every good most evidently shines forth from preceding acts.</p></blockquote>

<blockquote><p>§12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.”

— Reginald Garrigou-Lagrange, Reality: a Synthesis of Thomistic Thought (Herder Book Co., 1950), ch. 10, God’s Will &amp; God’s Love, pp. 104-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+we+understand+that+God%E2%80%99s+efficacious+will+is+always+infallibly+fulfilled%E2%80%A6+In+what+sense%2C+then%2C+do+we+speak+of+God%E2%80%99s+inefficacious+will%3F+This+will%2C+says+Thomas+%28Ia%2C+q.+19%2C+a.+6+%5BWhether+the+Will+of+God+is+always+fulfilled%3F%5D%2C+ad+1%29%2C+is+a+conditioned+will%2C+an+antecedent+will%2C+which+wills+all+that+is+good+in+itself%2C+independently+of+circumstances.+Now+this+conditional%2C+antecedent+will+remain%5Bs%5D+inefficacious+because%2C+in+view+of+a+higher+good+of+which+He+alone+is+judge%2C+God+permits+that+this+or+that+good+thing+does+not+come+to+pass.+Thus%2C+in+view+of+that+higher+good+%2C+God+permits+to+illustrate%2C+that+harvests+do+not+reach+maturity%2C+that+the+gazelle+becomes+the+prey+of+the+lion%2C+that+the+just+suffer+persecution%2C+that+this+or+that+sinner+dies+in+final+impenitence.+Sometimes+we+see+the+higher+good+in+question%2C+sometimes+we+cannot.+In+permitting+final+impenitence%2C+for+example%2C+God+may+be+manifesting+infinite+justice+against+obstinacy+in+evil.+Such+is+the+Thomistic+distinction+of+antecedent+%28inefficacious%29+will+from+consequent+%28efficacious%29+will%E2%80%A6+To+illustrate.+God+willed%2C+by+consequent+will%2C+the+conversion+of+St.+Paul.+This+conversion+comes+to+be%2C+infallibly+but+freely%2C+because+God%E2%80%99s+will%2C+strong+and+sweet%2C+causes+Paul%E2%80%99s+will+to+consent+freely%2C+spontaneously%2C+without+violence%2C+to+his+own+conversion.+God+did+not+on+the+other+hand+will%2C+efficaciously%2C+the+conversion+of+Judas%2C+though+He%2C+conditionally%2C+inefficaciously%2C+antecedently%2C+certainly+willed+it%2C+and+He+permitted+Judas+to+remain%2C+freely%2C+in+final+impenitence.+What+higher+good+had+God+in+mind%3F+This%2C+at+least%3A+the+manifestation+of+infinite+justic

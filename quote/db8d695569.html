<main class="wrap"><figure class="quote" id="q-db8d695569" data-kw="">
<blockquote><p>Should we hesitate to embrace a faithful witness for the cause of truth, and one, too, suffering in that cause? Surely not. It is not the cause of a party. The question between us and our antagonists is, in my opinion, come to this—Is the Testament of our Lord and Saviour Jesus Christ one Testament? Is it given by the inspiration of God, or not? Did holy men of God speak as moved by their own passions and local prejudices, or as moved by the Holy Ghost? If the book of Psalms be such as many represent it, and if it must be set aside from the peculiar use for which the Lord and Saviour Jesus Christ intended it, I see not but it is a thrust at the whole Bible, and implicitly dishonours and subverts the whole.

I believe the men have no such intention, they mean not so. But they appear to me to be under the influence of most dreadful and dangerous temptations; and to yield to them would be the greatest evil we could do to them, the greatest cruelty and injustice to themselves and their posterity, as well as unfaithfulness to the Lord. This has been long my opinion, and I yet see no cause to alter it. The cunning adversary of the church is never at rest. By various artifices and deceptions he endeavours to subvert the faith of Christians, and weaken their attachment to the Word of God. I cannot help ranking the present opposition to the pure scriptural Psalmody in the same class with Deism, Socinianism, Arianism, Arminianism, Universal Salvation, Antinomianism, and that it is a trial of the faith and patience of the saints. May the Lord enable us to stand fast, and to keep clean garments.

Conscious of much unworthiness, and that I am less than the least of all saints, yet I should shudder to chime in with the prevailing defamation, not to say blaspheming of that part of the Word of God, the book of Psalms, which indeed falls equally, though indirectly, on the whole of the Old Testament, and from that rebounds with equal force on the New Testament; for without faith in the one, I cannot see how there can be a true and saving faith in the other. The saying of the apostle respecting the law, is equally applicable here — “He that offends in one point, is guilty of all.” Whoever lifted up a tool on God’s altar, was guilty of polluting it. But what impure tools have proud, carnal, daring mortals, lifted against the Bible, with the pretext, as they say, of smoothing and polishing the rough stones thereof! But they have by their foolish and sinful attempts diminished its majesty, sublimity, grandeur, and dignity, and made ‘it like the works of men, and not of God. If those men could with equal ease form our globe into a smooth surfaced ball, no doubt they would try their hands on it, and imagine they had greatly improved it. But it is not as easy to spoil God’s works, as it is to reproach and blaspheme his Word.

I pretend not to be wiser than others, much less to infallibility; but I must judge for myself, and I see no great danger of being too strongly attached to the Word of God, or any part of it, not even to what they call the old, obsolete Jewish Psalms. The danger is all on the other side. Often, too often, my carnal heart has started objections against the book of God; and had not the Lord made me frequently taste the goodness and sweetness of it, I might have been a Deist. And what good fruits have proceeded from those men’s innovations and polishings?

Now, who were the first offended with the scriptural Psalmody, and most forward to introduce the new? To my certain knowledge, in New York, (where it first began in the Presbyterian churches,) they were the carnal and worldly part of professors, who could find no spiritual delight in any part of Divine worship. And have their attempts been blessed? Have conversions been promoted? Have saints been more edified, united, and sanctified, by their improvements? Is the worship of God more spiritual, heavenly, and holy? Let the fruits declare it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-annan.html">Robert Annan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Adam Rankin, c. 1785 in ‘An Original Letter from Rev. Robert Annan’, Evangelical Repository, 13, no. 5 (October 1854), pp 274-75.</cite></span></figcaption>

<blockquote><p>Yea, in those confessions, those passionate psalms made for him, we find him acknowledging of sin as his own. This will appear by some passages in those psalms which are prophetically made of Christ, and utter the inward addresses of his soul unto his Father. And of all the psalms, or other prophecies of this nature, there is no one except the twenty-second, which can challenge more passages in so small a space, applied expressly unto Christ in the New Testament, than the sixty-ninth psalm. In ver. 4 we have it, ‘They hated me without a cause.’ This we find applied by Christ himself, as prophesied of himself, John xv. 25. Again, we have it ver. 9 of that psalm, ‘The zeal of thine house hath eaten me up.’

This you have in like manner, John ii. 19, applied unto Christ. Moreover, the next words of that 9th verse, ‘The reproaches of them that reproached thee are fallen upon me.’ Lo, you have them applied by Paul as expressly unto Christ, Rom. xv. 3. Again, that passage, ver. 21, ‘They gave me gall for my meat, and in my thirst they gave me vinegar to drink;’ you know both the story and the application of it by the evangelists, Matthew, Mark, and John. Then that other passage that follows, ‘Let their table be made a snare,’ you have it applied accordingly unto the Jews that crucified him, for their crucifying of him, Rom. xi. 9.

Now then, so many of these being so applied, why should not those others also be so applied? as when it is said, ver. 4, 5, ‘Then I restored that which I took not away; O God, thou knowest my foolishness, and my guiltiness is not hid from thee.’ How fitly do these words express the imputation of sin to him. It was a proverbial speech, when a man suffered innocently as to his own person, to say that ‘He restored that which he took not,’ and so Christ on the cross is brought in here speaking. For as Isaiah tells us, ‘He bore our sins;’ with Oh in the next verse of the psalm he confesseth as his own, having taken them upon him. ‘O God, thou knowest my foolishness’ (that is my sin, as foolishness it is usually taken), ‘and my sins are not hidden from thee.’ Which is plainly in other words that which the apostle says of him, 2 Cor. v., ‘He that knew no sin was made sin.’

The like you have in the fortieth psalm, ‘Sacrifice and burnt-offering thou wouldst not; Lo I come,’ &amp;c., ver. 6, 7, which how it is applied to Christ you may read in Heb. x, neither can it well be applied to any other. Yet, ver. 12, he says, ‘My iniquities take hold of me.’ He calls them his, not by perpetration, but by a voluntary assumption, and by imputation, reckoning them as his. So Isaiah liii. 6, ‘He laid on him the iniquities of us all.’ In the Hebrew it is, ‘He caused to meet in him the iniquities of us all.’ He was made the great ocean, into which the guilt of all our sins did run.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Yea, in those confessions, those passionate psalms made for him, we find him acknowledging of sin as his own. This will appear by some passages in those psalms which are prophetically made of Christ, and utter the inward addresses of his soul unto his Father. And of all the psalms, or other prophecies of this nature, there is no one except the twenty-second, which can challenge more passages in so small a space, applied expressly unto Christ in the New Testament, than the sixty-ninth psalm. In ver. 4 we have it, ‘They hated me without a cause.’ This we find applied by Christ himself, as prophesied of himself, John xv. 25. Again, we have it ver. 9 of that psalm, ‘The zeal of thine house hath eaten me up.’

This you have in like manner, John ii. 19, applied unto Christ. Moreover, the next words of that 9th verse, ‘The reproaches of them that reproached thee are fallen upon me.’ Lo, you have them applied by Paul as expressly unto Christ, Rom. xv. 3. Again, that passage, ver. 21, ‘They gave me gall for my meat, and in my thirst they gave me vinegar to drink;’ you know both the story and the application of it by the evangelists, Matthew, Mark, and John. Then that other passage that follows, ‘Let their table be made a snare,’ you have it applied accordingly unto the Jews that crucified him, for their crucifying of him, Rom. xi. 9.

Now then, so many of these being so applied, why should not those others also be so applied? as when it is said, ver. 4, 5, ‘Then I restored that which I took not away; O God, thou knowest my foolishness, and my guiltiness is not hid from thee.’ How fitly do these words express the imputation of sin to him. It was a proverbial speech, when a man suffered innocently as to his own person, to say that ‘He restored that which he took not,’ and so Christ on the cross is brought in here speaking. For as Isaiah tells us, ‘He bore our sins;’ with Oh in the next verse of the psalm he confesseth as his own, having taken them upon him. ‘O God, thou knowest my foolishness’ (that is my sin, as foolishness it is usually taken), ‘and my sins are not hidden from thee.’ Which is plainly in other words that which the apostle says of him, 2 Cor. v., ‘He that knew no sin was made sin.’

The like you have in the fortieth psalm, ‘Sacrifice and burnt-offering thou wouldst not; Lo I come,’ &amp;c., ver. 6, 7, which how it is applied to Christ you may read in Heb. x, neither can it well be applied to any other. Yet, ver. 12, he says, ‘My iniquities take hold of me.’ He calls them his, not by perpetration, but by a voluntary assumption, and by imputation, reckoning them as his. So Isaiah liii. 6, ‘He laid on him the iniquities of us all.’ In the Hebrew it is, ‘He caused to meet in him the iniquities of us all.’ He was made the great ocean, into which the guilt of all our sins did run.”

— Thomas Goodwin, A Discourse of Christ the Mediator, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 183-84.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYea%2C+in+those+confessions%2C+those+passionate+psalms+made+for+him%2C+we+find+him+acknowledging+of+sin+as+his+own.+This+will+appear+by+some+passages+in+those+psalms+which+are+prophetically+made+of+Christ%2C+and+utter+the+inward+addresses+of+his+soul+unto+his+Father.+And+of+all+the+psalms%2C+or+other+prophecies+of+this+nature%2C+there+is+no+one+except+the+twenty-second%2C+which+can+challenge+more+passages+in+so+small+a+space%2C+applied+expressly+unto+Christ+in+the+New+Testament%2C+than+the+sixty-ninth+psalm.+In+ver.+4+we+have+it%2C+%E2%80%98They+hated+me+without+a+cause.%E2%80%99+This+we+find+applied+by+Christ+himself%2C+as+prophesied+of+himself%2C+John+xv.+25.+Again%2C+we+have+it+ver.+9+of+that+psalm%2C+%E2%80%98The+zeal+of+thine+house+hath+eaten+me+up.%E2%80%99%0A%0AThis+you+have+in+like+manner%2C+John+ii.+19%2C+applied+unto+Christ.+Moreover%2C+the+next+words+of+that+9th+verse%2C+%E2%80%98The+reproaches+of+them+that+reproached+thee+are+fallen+upon+me.%E2%80%99+Lo%2C+you+have+them+applied+by+Paul+as+expressly+unto+Christ%2C+Rom.+xv.+3.+Again%2C+that+passage%2C+ver.+21%2C+%E2%80%98They+gave+me+gall+for+my+meat%2C+and+in+my+thirst+they+gave+me+vinegar+to+drink%3B%E2%80%99+you+know+both+the+story+and+the+application+of+it+by+the+evangelists%2C+Matthew%2C+Mark%2C+and+John.+Then+that+other+passage+that+follows%2C+%E2%80%98Let+their+table+be+made+a+snare%2C%E2%80%99+you+have+it+applied+accordingly+unto+the+Jews+that+crucified+him%2C+for+their+crucifying+of+him%2C+Rom.+xi.+9.%0A%0ANow+then%2C+so+many+of+these+being+so+applied%2C+why+should+not+those+others+also+be+so+applied%3F+as+when+it+is+said%2C+ver.+4%2C+5%2C+%E2%80%98Then+I+restored+that+which+I+took+not+away%3B+O+God%2C+thou+knowest+my+foolishness%2C+and+my+guiltiness+is+not+hid+from+thee.%E2%80%99+How+fitly+do+these+words+express+the+imputation+of+sin+to+him.+It+was+a+proverbial+speech%2C+when+a+man+suffered+innocently+as+to+his+own+person%2C+to+say+that+%E2%80%98He+restored+that+which+he+took+not%2C%E2%80%99+and+so+Christ+on+the+cross+is+brought+in+here+speaking.+For+as+Isaiah+tells+us%2C+%E2%80%98He+bore+our+sins%3B%E2%80%99+with+Oh+in+the+next+verse+of+the+psalm+he+confesseth+as+his+own%2C+having+taken+them+upon+him.+%E2%80%98O+God%2C+thou+knowest+my+foolishness%E2%80%99+%28that+is+my+sin%2C+as+foolishness+it+is+usually+taken%29%2C+%E2%80%98and+my+sins+are+not+hidden+from+thee.%E2%80%99+Which+is+plainly+in+other+words+that+which+the+apostle+says+of+him%2C+2+Cor.+v.%2C+%E2%80%98He+that+knew+no+sin+was+made+sin.%E2%80%99%0A%0AThe+like+you+have+in+the+fortieth+psalm%2C+%E2%80%98Sacrifice+and+burnt-offering+thou+wouldst+not%3B+Lo+I+come%2C%E2%80%99+%26c.%2C+ver.+6%2C+7%2C+which+how+it+is+applied+to+Christ+you+may+read+in+Heb.+x%2C+neither+can+it+well+be+applied+to+any+other.+Yet%2C+ver.+12%2C+he+says%2C+%E2%80%98My+iniquities+take+hold+of+me.%E2%80%99+He+calls+them+his%2C+not+by+perpetration%2C+but+by+a+voluntary+assumption%2C+and+by+imputation%2C+reckoning+them+as+his.+So+Isaiah+liii.+6%2C+%E2%80%98He+laid+on+him+the+iniquities+of+us+all.%E2%80%99+In+the+Hebrew+it+is%2C+%E2%80%98He+caused+to+meet+in+him+the+iniquities+of+us+all.%E2%80%99+He+was+made+the+great+ocean%2C+into+which+the+guilt+of+all+our+sins+did+run.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+A+Discourse+of+Christ+the+Mediator%2C+%28London%2C+1642%29+in+The+Works+of+Thomas+Goodwin+%2812+vols%2C+Edinburgh%3A+James+Nisbet%2C+1861-66%29%2C+5%3A+183-84.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc218a57fc2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c218a57fc2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/03/thomas-goodwin-on-christ-and-the-penitential-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Meanwhile, a certain Hilary, a Catholic layman of tribunitial rank, incited to anger, for some reason or other, against the ministers of God, as often happens, in abusive, censorious language, wherever it was possible, was violently attacking the custom which, at the time, had been introduced in Carthage, of singing hymns from the Book of Psalms either before the oblation or when what had been offered was being distributed to the people; he insisted that this should not be done. At the urging of my brethren, I answered him; the book is called Against Hilary.</p></blockquote>

<blockquote><p>Q. Why is faith required [to rightly receive communion]?

A. Because well we may eat the Bread, and drink the wine without faith; but we cannot eat Christ’s body, and drink his Blood without faith.

True; for the eating of his Body is a spiritual eating, and the drinking of his Blood is a spiritual drinking, consisting in meditation of the wonderful love of GOD the Father, who to save our souls, spared not his own Son: The wonderful love of God the Son, who to save our souls, spared not his own self but gave himself to suffer a shameful death, a bitter death, and an accursed death for our sins: He is the love of Christ that passeth knowledge: such is the breadth and the length and depth, and height of it, that we are not able sufficiently to comprehend it.

And like as the body by feeding and drinking, doth gather strength to the better performance of all actions of nature: so the soul of a Christian by meditation on this love of Christ in giving his body to be crucified, and his blood to be shed for our sins, doth gather more and more strength continually for the better performance of all actions of grace; whether they be actions of dependence, to depend upon him, and put our trust in him in all states, in all conditions, even in the time of affliction, and persecution, and at the very house of death; Or whether they be actions of conformity to his will, in obeying him, and walking in the ways of his commandments unto the end?</p></blockquote>

<blockquote><p>This is that shocking idolatry which is practiced in the Popish mass, which is doubtless so displeasing in the sight of God, that it were better for us to suffer a thousand deaths, than that we should ever be guilty of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper / Popish mass</span></figcaption>

</figure><figure class="quote" id="q-53bee3b9e5" data-kw="">
<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here (section 14) object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [a pseudonym for the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use[d] to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself [a papal apologist] distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgesse [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgesse himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the Sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more then non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, pp. 62-63</span></figcaption>

thing+of+this+is+of+man%2C+but+is+all+divine%5D%2C+for+Christ%E2%80%99s+own+Words+are%2C+or+at+least+should+be%2C+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are+by+Christ%E2%80%99s+own+institution+holy+symbols+of+his+blessed+body+and+blood.+Whereas+the+Word+preached+to+us+is+but+mixedly+and+mediately+divine%2C+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+God%2C+we+are+bidden+try+the+spirits+%5B1+Jn.+4%3A1%5D+and+are+required+after+the+example+of+the+Bereans+to+search+the+Scriptures+daily+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+like+sort+to+try+the+elements+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us+that+the+sacrament+given+according+to+Christ%E2%80%99s+institution+is+more+merely+and+immediately+divine+than+is+the+Word+preached.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+4%2C+%E2%80%98That+the+Ceremonies+are+Idols+among+Formalists+themselves%3B+%26+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+Idolatry%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53bee3b9e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53bee3b9e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=Those%20who%20speak%20out%20more%20plainly,divine%20than%20is%20the%20Word%20preached&amp;text=Those%20who%20speak%20out%20more%20plainly%20than%20bishop&amp;text=and%20immediately%20divine%20than%20is%20the%20Word%20preached" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></di <blockquote><p>…the elements of bread and wine, which are lawful images of Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 85</span></figcaption>

— Samuel Rutherford, The Divine Right of Church Government, ... (1646), p. 85">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+elements+of+bread+and+wine%2C+which+are+lawful+images+of+Christ%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+...+%281646%29%2C+p.+85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36390f37cd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36390f37cd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/#:~:text=the%20elements%20of%20bread%20and%20wine%2C%20which%20are%20lawful%20images%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3f108c9fac" data-kw="">
<blockquote><p>That we really feed in the Holy Supper on the flesh and blood of Christ, no otherwise than as bread and wine are the aliments of our bodies, we freely confess. If a clearer explanation is asked, we say, that the substance of Christ’s flesh and blood is our spiritual life, and that it is communicated to us under the symbols of bread and wine; for Christ, in instituting the mystery of The Supper, promised nothing falsely, nor mocked us with a vain shew, but represented by external signs what he has really given us.

Now the question rests on the mode of communication; and hence the conflict arises, because we refuse to subscribe to their fancy respecting a local presence. We say, that though Christ is in heaven, yet through the hidden and incomprehensible power of his Spirit, this favor comes to us that His flesh becomes life to us, so that we become flesh of his flesh and bones of his bones. (Ephesians 5:30.) By them, on the contrary, it is maintained, that except Christ comes down on earth, there is no participation.

That they may, however, get rid of the absurdity of a local presence, it has been found necessary to fabricate the strange notion of ubiquity; which, if we think it not possible to reconcile to the principles of faith, we must beg them at least to pardon our ignorance. Here we follow not our own understanding; but according to the knowledge given us from above, we cannot comprehend that it is at all agreeable to Scripture to say that the body of Christ is everywhere. Both Christ himself and His Apostles clearly shew that the immensity of God does not belong to the flesh; a personal union is what they teach; and no one, except Eutyches, has hitherto taught, that the two natures became so blended, that when Christ became man, the attributes of Deity were communicated to his human nature.

I am not indeed disposed to raise an odium against them by means of a man who has been condemned; they are yet to be reminded to think more attentively, and to consider how contention leads astray even good, learned, and acute men, when they are led away only by a desire to defend their own cause. Doubtless the best and the shortest way of confronting Nestorius at the Council of Ephesus would have been to say, that personal union communicates to two natures what is peculiar to each: to adduce this no one thought of doing on account of its absolute absurdity. I therefore greatly wonder that they who oppose us do not consider into what labyrinth they plunge themselves.

For if the infinity of God appertains to the flesh of Christ, because God was manifested in the flesh, with equal reason His Divinity may be said to have grieved and to have been thirsty, and to have been subject to death, and, in short, to have died; for they cannot escape, as it is a similar mode of reasoning. Christ, while yet a mortal, declared that He knew not when the day of judgment would be. Does He not in these words clearly and distinctly ascribe something to His human nature which could not justly be ascribed to His Divinity? What they bring forward as to the communication of properties, it is unreasonable, and what I may say without offending them, they mistake in a matter that is very simple and plain; for to ascribe what is peculiar to Deity to the Son of man, and again to attribute to Deity what belongs only to humanity, is very improper and rash.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Book of the Prophet Jeremiah and the Lamentations</cite>, trans. and ed. John Owen (Geneva, 1589) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker Books, 1993), ix, pp xvii-xviii.</span></figcaption>

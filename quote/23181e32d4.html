<main class="wrap"><figure class="quote" id="q-23181e32d4" data-kw="">
<blockquote><p>[T]he orthodox constantly maintain that the theology or true religion by which salvation can come to man after the fall is only one (i.e. that revealed in the word of the law and gospel), and that all other religions except this one are either impious and idolatrous or false and erroneous. Although retaining some obscure and imperfect notions of the law and that which may be known of God, yet these false and erroneous religions are of no further use than to render men inexcusable. […]

There can be no saving religion without Christ and faith in him (Jn. 3:16; 17:3; Acts 4:11, 12; 1 Cor. 3:11; Heb. 11:6). But Christ is revealed nowhere except in the gospel; nor is faith given without the word, since it comes by hearing (Rom. 10:17) […] since the Scriptures testify that Christ is the only way of salvation (without whom no one can come to the Father), it is criminal to suppose an extraordinary way without him […] If salvation could have been obtained by a common religion, there would have been no need of the gospel and the preaching of the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-420a2ccbe6" data-kw="">
<blockquote><p>It is very strange, that the works of our calling should not be permitted on any part of the Sabbath day, and sports and pastimes should; And shall not the spending of our time in God’s Service, not public only, but private also, far better fit us to serve God in the works of our calling, and make us more capable of his blessing upon our labours, then the exercising of our selves in sports and pastimes?</p></blockquote>

</figure><figure class="quote" id="q-34d5ebb988" data-kw="">
<blockquote><p>[I]t is called an holy rest, the rest of the holy Sabbath, and the commandment expressly saith, Remember to keep it holy. Now an holy rest certainly stands distinguished from a rest merely natural, when our bodies cease from action, and worldly labour, 2. A rest that is profane. By which I understand not only a sinful rest, unlawful on any day; but a rest from recreations, and pastimes, lawful enough on other days.

We read not in the old Law of any toleration for sports on the Sabbath, we read on the contrary that it was to be an holy rest, kept holy, &amp;c. To which sports cannot contribute: It seems unreasonable to think that labour should be forbidden, in order to our more serious and solemn service of God, and yet sports should be allowed, which every way as much distract, and unfit the Soul for acts of solemn worship. But the prophets are best interpreters of the Law.

Now the prophet Isaiah, Isa. 58.13. expounding this Law saith, If thou turn away thy foot from the Sabbath, from doing thy pleasure on my holy-day, and call the Sabbath a delight, the holy of the Lord, honourable, and shalt honour him, not doing thine own ways, nor finding thy own pleasure, nor speaking thy own words: Then shalt thou delight thy self in the Lord, and I will cause thee to ride upon the high places of the Earth, and feed thee with the heritage of Jacob thy father, for the mouth of the Lord hath spoken it. There is a precept v. 13. and a promise annexed to the due observance of that precept v. 14. The precept is directive for the sanctification of the Sabbath, which is called the Sabbath, the Lord’s holy day. The end of the Sabbath for which God instituted it, and which every one ought in the observation of it to aim at; and shalt honour him, the honouring and glorifying of God, that is the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), pp 99-100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-6fc8db84bc" data-kw="">
<blockquote><p>XXV. Here, nevertheless, are excepted [to the prohibition of servile work]: … (3) the works of common honesty, because as always, so on this day above others, we ought to carry ourselves and to act honestly and decorously; (4) works of necessity, which are neither feigned nor designedly produced, but imposed upon us by providence (Lk. 14:5); not only absolute and simple, that may be called necessary only (which we can in no way be in want of), but modified and relative so that those things may be reckoned necessary not only which are required absolutely for the existence and support of life, but also those which conduce to our living better. Hence some great advantage and emolument accrues to us or our neighbor if they are done or some great disadvantage and loss if they are omitted. ‘The sabbath’ (as Christ testifies in Mk. 2:27) ‘was made for man and not man for the sabbath.’ XXVI. Therefore, we do not think that in this cessation believers are bound to Judaical precision which some (more scrupulous than is just) maintain was not revoked, so that it is lawful neither to kindle a fire, nor to cook food, nor to take up arms against an enemy, nor to prosecute a journey begun by land or sea, nor to refresh themselves with innocent relaxation of the mind and body, provided they are done out of the hours for divine worship, nor to have any diversion, however slight, to any things belonging to the advantages or emoluments of this life. For although this opinion bears on its face a beautiful appearance of piety (and undoubtedly with good intention is proposed by pious men to procure the better sanctification of this day, usually so basely profaned), still it labors under grievous disadvantages; nor can it be retained without in this way bringing back into the church and imposing anew upon the shoulders of Christians an unbearable yoke (abastakton), repugnant to Christian liberty and the gentleness of Christ and opposed to the sweetness of the covenant of grace by agitating and tormenting the consciences of men through infinite scruples and inextricable difficulties (nearly driving to desperation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 11th Topic, Q. 14, ‘The Lord’s Day…, p. 98</span></figcaption>

<blockquote><p>XXV. Though we think not that men may [morally] command us to destroy our neighbors’ souls by scandal, yet when disobedience to a ruler’s law is likely to do more hurt than the scandal taken at it comes to, we are for avoiding the greater hurt. … XXVII. We hold it unlawful to reproach all Churches that we see to be faulty, but it is our duty to keep peace with all. [Rom. 12:18; Heb. 12:14]</p></blockquote>

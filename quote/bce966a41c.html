<main class="wrap"><figure class="quote" id="q-bce966a41c" data-kw="">
<blockquote><p>First of all, doth not the impious profanation of the Sabbath impropriate from God that which he hath ever reserved to himself, without any redemption by appropriating it to unnecessary journeys, hellish and lascivious revellings, wicked sports, and recreations? hath not God inhibited it peremptorily, above a hundred times in express Scripture? hath he not annexed a combination of public vengeance for it, Amos, 8. even to set fire on the Gates of our chief City therefore? Jerem. 17. Hath not this of late troubled most of the Lord’s Hosts, made the hearts of the Elders melt like Water, slaughtered more then twice thirty-six, in respect of their livelihood, and calling? who then can doubt that a profaner of the Sabbath is an Achan and troubler of Israel?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-fairclough.html">Samuel Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The troublers troubled, or, Achan condemned and executed. A sermon preached before sundry of the honourable House of Commons at Westminster, April 4, 1641</cite>, (London: Henry Overton, 1641), p. 12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8b6704766" data-kw="">
<blockquote><p>The Religion, Doctrine and Discipline received, believed and defended by the Church of Scotland, and namely the public ministration of Baptism, and the Lord’s Supper, sitting at the table in the act of receiving the bread and wine of that Sacrament, the observation of the Lord’s Day, and the examination of children, for the first time at the ninth year of their age, for the second at the twelfth, for the third at the fourteenth, excluding and abhorring private baptism, private communion, kneeling in the act of receiving the Supper, holy days, or feast of Christmas, Passion, Resurrection, Ascension and sending down of the Holy Ghost: were brought in at the reformation of religion [in 1560], and enjoyed ever since in manner and form as follows. After due trial and advertisement taken of the heads in general and particular above written, the whole church was of one heart and judgment concerning the same…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, 1619, p. 24</span></figcaption>

<blockquote><p>…for when we see the strictness of the institution, and how far we come short of it, we are ready to doubt that we do too little, less than God requires… the true soul can comfort itself in the sincerity of its desires; for though God accounts nothing little that springs from an upright heart… Though they cannot be perfect in their services, yet they will make a right choice, serve God after his own manner; not make it up in the pomp, what is wanting in the power of religion, as many do; but look principally to the inward part, to the truth of religion.</p></blockquote>

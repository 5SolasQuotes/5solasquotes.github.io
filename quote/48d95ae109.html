<main class="wrap"><figure class="quote" id="q-48d95ae109" data-kw="Marks of the church Rome">
<blockquote><p>The Lord recognises nothing as his own, save when his word is heard and religiously observed. … If that temple which seemed consecrated for the perpetual habitation of God, could be abandoned by God and become profane, the Romanists have no ground to pretend that God is so bound to persons or places, and fixed to external observances, that he must remain with those who have only the name and semblance of a Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf384d238d" data-kw="">
<blockquote><p>There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.2</span></figcaption>

</figure><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-c39fb5cf7c" data-kw="Apostolic succession">
<blockquote><p>Here, then, is the value of succession when not conjoined with imitation and corresponding conduct: posterity, as soon as they are convicted of having revolted from their origin, are deprived of all honour; unless, indeed, we are prepared to say, that because Caiaphas succeeded many pious priests (nay, the series from Aaron to him was continuous), that accursed assembly deserved the name of Church. … That in the government of the Church especially, nothing is more absurd than to disregard doctrine, and place succession in persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.3</span></figcaption>

</figure><figure class="quote" id="q-84de3e55fc" data-kw="">
<blockquote><p>For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-48a87b3406" data-kw="Supererogation Imputed righteousness">
<blockquote><p>They say that good works are not of such intrinsic worth as to be sufficient to procure justification, but it is owing to accepting grace that they have this effect. Then because they are forced to confess that here the righteousness of works is always imperfect, they grant that so long as we are in this life we stand in need of the forgiveness of sin in order to supply the deficiency of works, but that the faults which are committed are compensated by works of supererogation. I answer, that the grace which they call accepting, is nothing else than the free goodness with which the Father embraces us in Christ when he clothes us with the innocence of Christ, and accepts it as ours, so that in consideration of it he regards us as holy, pure, and innocent. For the righteousness of Christ (as it alone is perfect, so it alone can stand the scrutiny of God) must be sisted for us, and as a surety represent us judicially.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4d4db9884" data-kw="">

</figure><figure class="quote" id="q-5e998e8dd1" data-kw="">
<blockquote><p>Between them and us there is this difference, that they persuade themselves that the movement comes from the man himself, whereas we maintain that faith is voluntary, because God draws our wills to himself. Add, that when we say a man is justified by faith alone, we do not fancy a faith devoid of charity, but we mean that faith alone is the cause of justification.</p></blockquote>

</figure><figure class="quote" id="q-dc860b657c" data-kw="">
<blockquote><p>If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes, not to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ebd8e798d0" data-kw="">
<blockquote><p>For excepting imperfections, wants, spots, blemishes and faults, which destroy not the true worship of God, our Church does worship the Lord aright, without heresy, blasphemy or idolatry… He that will have it to be no true worship of God in which there be errors and spots holds the heresy of perfection, which is very foul and detestable: for it is as far beyond our power to be perfect in God’s worship as to perform perfect obedience in the Second Table of the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists... (London, 1590), ‘Brownist Position’, pp. 9-10 Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), bk. 8, ch. 2, sect. 25</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-79cbcf5e8e" data-kw="">
<blockquote><p>The non-conformist, non-separatist, puritan minister authors of this book: …were examples of holiness, so in this, that they have ever, not only forborne, but steadfastly opposed to their great reproach, damage and danger many ways, the corruptions in our [Anglican] Church government, worship and liturgy, and have been lights and leaders to these latter times therein, yet always in a peaceable and regular way, as not on the one side to subject themselves to suspicious inventions, so on the other, not sinfully to separate from the communion and true worship of churches, accounting it more agreeable to all rules of piety, charity and Christian prudence to tolerate for the time what they could not mend rather than to rent and tear all in pieces to an utter ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Publisher, William Rathband, to the Reader” in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025), p.</cite></span></figcaption>

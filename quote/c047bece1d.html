<blockquote><p>9.3 The Covenant Of Works The covenant of works is the pact of God initiated with the uncorrupted Adam, as head of the whole human race, in which He stipulated from man perfect obedience to the law, promised eternal, heavenly life for the same obedience, but threatened eternal death for transgression, and in turn man promised perfect obedience to God who stipulated, which having furnished, he could expect eternal, heavenly life. Scripture testifies that such a covenant existed with Adam. “They…(like Adam) transgressed the covenant” (Hos. 6:7). And God established the sacrament of the same covenant, “the tree of life” (Gen. 2:9). (VII). 9.4. God And Adam Covenanted They were covenanted, God as the Creator, Law-giver, and Rewarder, and Adam as the first man, uncorrupt, and head of the human race. For Adam was the “one blood” in which the whole posterity lay hidden (Acts 17:26), and he was “the first Adam,” equally representing those to be born from his blood, and “the second Adam” represents the faithful; indeed, he is a “type of” the one “to come” (Rom. 5:14). And since the remaining words concern the whole human race, the human race cannot be secluded from the covenant initiated with him. (VIII). 9.10. The Promise Of Heavenly And Eternal Life The promise of the covenant of works was eternal and heavenly life. This sacrament of it, “the tree of life,” by all means true and…(eternal) (Gen. 2:9), sanctioned not only for animals, and the earthly blessings that he already possessed, in which there was no διαθήκη (covenant), but there was προσθήκη (an accession) to the covenant. And when Christ, fulfilling the law in our place, merited eternal and heavenly life for us, He obtained the fulfillment of the same law by merit for us. Indeed, God promised something more in the covenant of works than that of whom could be a sharer outside of that. And it was not other than the translation into heavenly Paradise. (XXIII–XXVI). 10.4. The Stipulation Of God And The Promise Of The Son In this singular pact God the Father demanded from the Son, as Mediator, vicarious obedience to the law for man the sinner, and the Son promised it in turn. “Behold, I come. In the scroll of the book it has been written about me, that I shall do Your will” (Ps. 40:8–9). “Where He placed His soul as sacrifice, He will see a seed” (Isa. 53:10). “This commandment I have received from the Father, that I may place My soul” (John 10:17, 18). “He was born from a woman, gενόμενος ὑπὸ νόμον (born under the law) (Gal. 4:4). Therefore, everywhere Christ comes in the name br[ ἐγτύου and παρακλήτου (of advocate, guarantor), by guaranteeing and promising for another, of the one who receives Him in his faith (Job 33:23, Jer. 30:21, Isa. 38:14, Heb. 7:22). This Sponsor is at the same time is called “Mediator” (1 Tim. 2:5, Heb. 8:6), “Testator” (Heb. 9:15, 16), “High Priest” (Heb. 7:26), “Vindicator” (Job 19:25, Heb 2:16), etc. (VII–XIV). 10.5. The Demand Of The Son The demand of the same Son follows the promise. For as God the Father demanded payment from the Son and promised inheritance for paying, so the Son by promising and furnishing it, acquired the right to claim an inheritance, church, people of His own possession. “Demand from Me, and I will give you the nations as Your inheritance, and the ends of the earth as Your possession” (Ps. 2:8). “Surely My judgment is before the Lord, and…(My works) are a price before My God” (Isa. 49:4). For the promise and obedience of the Son had reason of true merit, even from condignity, for which nothing could be lacking (XIV).</p></blockquote>

<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>

<blockquote><p>The term &quot;merit&quot; refers in general to the recompense owed by a community or a society for the action of one of its members, experienced either as beneficial or harmful, deserving reward or punishment. Merit is relative to the virtue of justice, in conformity with the principle of equality which governs it. … With regard to God, there is no strict right to any merit on the part of man. Between God and us there is an immeasurable inequality, for we have received everything from him, our Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §§2006–2007</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The term &quot;merit&quot; refers in general to the recompense owed by a community or a society for the action of one of its members, experienced either as beneficial or harmful, deserving reward or punishment. Merit is relative to the virtue of justice, in conformity with the principle of equality which governs it. … With regard to God, there is no strict right to any merit on the part of man. Between God and us there is an immeasurable inequality, for we have received everything from him, our Creator.”

— Catholic Church, Catechism of the Catholic Church, §§2006–2007">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20term%20%22merit%22%20refers%20in%20general%20to%20the%20recompense%20owed%20by%20a%20community%20or%20a%20society%20for%20the%20action%20of%20one%20of%20its%20members%2C%20experienced%20either%20as%20beneficial%20or%20harmful%2C%20deserving%20reward%20or%20punishment.%20Merit%20is%20relative%20to%20the%20virtue%20of%20justice%2C%20in%20conformity%20with%20the%20principle%20of%20equality%20which%20governs%20it.%20%E2%80%A6%20With%20regard%20to%20God%2C%20there%20is%20no%20strict%20right%20to%20any%20merit%20on%20the%20part%20of%20man.%20Between%20God%20and%20us%20there%20is%20an%20immeasurable%20inequality%2C%20for%20we%20have%20received%20everything%20from%20him%2C%20our%20Creator.%E2%80%9D%0A%0A%E2%80%94%20Catholic%20Church%2C%20Catechism%20of%20the%20Catholic%20Church%2C%20%C2%A7%C2%A72006%E2%80%932007&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F552f034c8c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/552f034c8c.html">Permalink</a><a class="src" href="https://www.vatican.va/archive/ENG0015/__P70.HTM" rel="noopener" target="_blank">Read it online · Vatican</a></div>
</figure><figure class="quote" id="q-4926e4926f" data-kw="">
<blockquote><p>Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9668aff4d2" data-kw="">
<blockquote><p>Query 1. Are believers freed from obedience to the Moral Law; or from the Moral Law as a Rule of obedience? There are some who positively or peremptorily affirm that we are freed from the Law as a Rule, and we are not, since Christ, tied to the obedience of it. Others say it still remains in force as a Rule of Obedience, though it is abolished in other respects. We are still under the conduct and commands of the Law, though not under the curses and penalties of it. Others say, again, that we are freed from the law as given by Moses, and are only tied to the obedience of it as it is given by Christ. And though they are subject to those commands, and that Law which Moses gave, yet not as he gave it, but as Christ renews it; and as it comes out of the hand, and from the authority of Christ. Joh 13.34, A new commandment I give you, that you love one another. This is a commandment, for Christ is both a Savior and a Lord; and it is a new one — not that it didn’t exist before; but because it is now renewed, and we have it immediately from the hands of Christ. I will not dislike this much; I acknowledge the Moral Law as a Rule of obedience and of Christian walking; and there will be no falling out, whether you take it as promulgated by Moses, or as handed to you and renewed by Christ. Indeed, the Law as it is considered as a Rule, can no more be abolished or changed, than the nature of good and evil can be abolished and changed. The substance of the Law is the sum of doctrine concerning piety towards God, charity towards our neighbors, temperance and sobriety towards ourselves. And for the substance of it, it is Moral and Eternal, and cannot be abrogated. We grant the circumstances, that they were but temporary and changeable, and we now have nothing to do with the Promulgator, Moses; nor the place, Mount Sinai; nor the time, fifty days after they came out of Egypt; nor yet that it was written on Tablets of stone, delivered with thunder and lightning, etc. We don’t look to Sinai the hill of bondage, but to Zion the mountain of Grace. And we take the Law as the Image of the divine Will of God, which we desire to obey, but from which we do not expect life and favor, nor fear death and rigor. And this, I conceive, is the concurrent opinion of all Divines. The Law is abrogated in respect to its power to justify or condemn; but it still remains in force to direct us in our lives. It condemns sin in the faithful, though it cannot condemn the faithful for sin. Far be that profane opinion from us, to take away the Law as a Rule, which is an inflexible rule of living. By teaching, admonishing, chiding, and reproving, it prepares us for every good work, as Calvin says. The Law is void for its damnatory power, not its directory power; we are not under its curse, but we are still under its commands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Bounds of Christian Freedom</cite>, (London, 1545; 1656), 31.</span></figcaption>

<blockquote><p>5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin, and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery, but, being weak through the flesh, leaves the transgressor under the curse, and man cannot by this law obtain saving grace.

6. What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit through the word or ministry of reconciliation; which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe, as well under the Old as under the New Testament.</p></blockquote>

<blockquote><p>What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.</p></blockquote>

<blockquote><p>It is asked, eighth, whether the covenant of grace was promulgated in the Decalogue. The famous Cameron, because he did not distinguish carefully enough between the use of the Decalogue and its nature, stated that the Decalogue was neither the covenant of works nor the covenant of grace, but a certain subservient covenant, insofar as like a pedagogue, it drove the elect to seek Christ (Gal. 3:24; Rom. 10:4–5). The celebrated Cocceius with his followers, since he stated that by its violation the covenant of works was plainly abolished, nor did anything remain except the eternal and universal testament of grace until the Israelites’ making of the calf, after which the Decalogue, with the adding of the twofold formula, “Do this and you will live,” and “Cursed be the one who will not remain in all things which are written in the book of the law,” accepted not indeed the essence of the covenant of works, but yet the appearance of it, stated that the Decalogue is the pure, unadulterated covenant of grace. On the contrary, the rest of the Reformed state that in the Decalogue there is no promulgation of the covenant of grace, but only the renewal of the covenant of works, although that renewal, at least in relation to the elect, had an evangelical use, that it would drive them to embrace Christ. This is so because: (1) the Decalogue has nothing of Christ, nothing of faith in Christ. (2) Even if it did set forth Christ and faith in Christ, which yet we do not grant, yet it still has in addition all moral good works; accordingly we would not be justified by faith alone, because without any doubt we are justified by the observance of the covenant of grace. (3) The Decalogue has all those things (with only the positive commandment excepted, concerning not eating the forbidden fruit) which God stipulated from our first parents in the covenant of works. (4) It is also sanctioned with threats and promises, in the same way as the covenant of works. Therefore nothing prohibits saying that it properly presents the covenant of works again, although in relation to the elect, for an evangelical end and use. Nor is it any hindrance that in it mention is made of that formula which pertains to the covenant of grace, “I am your God,” because entirely nothing is repugnant to urging obedience to the covenant of works by arguments and motives taken from the benefits of the covenant of grace. But we will set aside this argument for its proper place, concerning the dispensation of the covenant of grace under Moses (bk. 8, ch. 2).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is asked, eighth, whether the covenant of grace was promulgated in the Decalogue. The famous Cameron, because he did not distinguish carefully enough between the use of the Decalogue and its nature, stated that the Decalogue was neither the covenant of works nor the covenant of grace, but a certain subservient covenant, insofar as like a pedagogue, it drove the elect to seek Christ (Gal. 3:24; Rom. 10:4–5). The celebrated Cocceius with his followers, since he stated that by its violation the covenant of works was plainly abolished, nor did anything remain except the eternal and universal testament of grace until the Israelites’ making of the calf, after which the Decalogue, with the adding of the twofold formula, “Do this and you will live,” and “Cursed be the one who will not remain in all things which are written in the book of the law,” accepted not indeed the essence of the covenant of works, but yet the appearance of it, stated that the Decalogue is the pure, unadulterated covenant of grace. On the contrary, the rest of the Reformed state that in the Decalogue there is no promulgation of the covenant of grace, but only the renewal of the covenant of works, although that renewal, at least in relation to the elect, had an evangelical use, that it would drive them to embrace Christ. This is so because: (1) the Decalogue has nothing of Christ, nothing of faith in Christ. (2) Even if it did set forth Christ and faith in Christ, which yet we do not grant, yet it still has in addition all moral good works; accordingly we would not be justified by faith alone, because without any doubt we are justified by the observance of the covenant of grace. (3) The Decalogue has all those things (with only the positive commandment excepted, concerning not eating the forbidden fruit) which God stipulated from our first parents in the covenant of works. (4) It is also sanctioned with threats and promises, in the same way as the covenant of works. Therefore nothing prohibits saying that it properly presents the covenant of works again, although in relation to the elect, for an evangelical end and use. Nor is it any hindrance that in it mention is made of that formula which pertains to the covenant of grace, “I am your God,” because entirely nothing is repugnant to urging obedience to the covenant of works by arguments and motives taken from the benefits of the covenant of grace. But we will set aside this argument for its proper place, concerning the dispensation of the covenant of grace under Moses (bk. 8, ch. 2).”

— Peter van Mastricht, Theoretical-Practical Theology: Redemption in Christ, vol. 4, trans. Todd Rester (Reformation Heritage Books, 2023), 45–46 (HT: Joseph Randall).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+asked%2C+eighth%2C+whether+the+covenant+of+grace+was+promulgated+in+the+Decalogue.+The+famous+Cameron%2C+because+he+did+not+distinguish+carefully+enough+between+the+use+of+the+Decalogue+and+its+nature%2C+stated+that+the+Decalogue+was+neither+the+covenant+of+works+nor+the+covenant+of+grace%2C+but+a+certain+subservient+covenant%2C+insofar+as+like+a+pedagogue%2C+it+drove+the+elect+to+seek+Christ+%28Gal.+3%3A24%3B+Rom.+10%3A4%E2%80%935%29.+The+celebrated+Cocceius+with+his+followers%2C+since+he+stated+that+by+its+violation+the+covenant+of+works+was+plainly+abolished%2C+nor+did+anything+remain+except+the+eternal+and+universal+testament+of+grace+until+the+Israelites%E2%80%99+making+of+the+calf%2C+after+which+the+Decalogue%2C+with+the+adding+of+the+twofold+formula%2C+%E2%80%9CDo+this+and+you+will+live%2C%E2%80%9D+and+%E2%80%9CCursed+be+the+one+who+will+not+remain+in+all+things+which+are+written+in+the+book+of+the+law%2C%E2%80%9D+accepted+not+indeed+the+essence+of+the+covenant+of+works%2C+but+yet+the+appearance+of+it%2C+stated+that+the+Decalogue+is+the+pure%2C+unadulterated+covenant+of+grace.+On+the+contrary%2C+the+rest+of+the+Reformed+state+that+in+the+Decalogue+there+is+no+promulgation+of+the+covenant+of+grace%2C+but+only+the+renewal+of+the+covenant+of+works%2C+although+that+renewal%2C+at+least+in+relation+to+the+elect%2C+had+an+evangelical+use%2C+that+it+would+drive+them+to+embrace+Christ.+This+is+so+because%3A+%281%29+the+Decalogue+has+nothing+of+Christ%2C+nothing+of+faith+in+Christ.+%282%29+Even+if+it+did+set+forth+Christ+and+faith+in+Christ%2C+which+yet+we+do+not+grant%2C+yet+it+still+has+in+addition+all+moral+good+works%3B+accordingly+we+would+not+be+justified+by+faith+alone%2C+because+without+any+doubt+we+are+justified+b

<main class="wrap"><figure class="quote" id="q-d9109a0038" data-kw="">
<blockquote><p>There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gary-north.html">Gary North</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conclusion’ in Ch. 56, ‘Boundary Violations’, ‘C. Public Health’, ‘2. Quarantine’ in Christian Economics</cite>, vol. 4 (2020)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d88f5496f0" data-kw="">
<blockquote><p>May 21, 1585 Wilsoun, Russell, Walker, put to Assize. Finds expedient that Thomas Wilsoun, traveler, presently infected with the pest[ilence] and in point of death, and also Margaret Russell and Jonet Walker, her daughter, be incontinent [not containing themselves] put to the knowledge of an assize [judgment] for having of the pest and known the same concealing thereof and repairing amongst our Sovereign Lord’s lieges [lands] openly, to the infection of some and hazard of many, and being found culpable in any point of the premises, to be immediately execut[ed] to the death at the Stray Mercat. … May 28, 1585 Masters of the College. The bailies and a part of the council being convened, and understanding be master Robert Rollock and master Duncane Nairne, masters of the College, that the whole students, through the fire and brute of the pestilence, has left the schools and thereby they have nothing to do, desiring therefore licence of the town to depart and use their friends for a season, offering to return to their cuir [chair?] and service whensoever the town shall think expedient, upon advertisement to be made in their names be master Alexander Guthre, their clerk. Which desire the said bailies and council thought reasonable, and therefore willingly granted and consented thereto.</p></blockquote>

</figure><figure class="quote" id="q-562f8bcf56" data-kw="">
<blockquote><p>It [the plague] appears to have been brought into Leith by a passenger from England, on 14th October, 1574, and several persons died of it there, before its existence was generally known; it entered Edinburgh on the 24th of the same month [A History of Epidemics in Britain, by Charles Creighton, M.D., I., p. 366], and five days later, viz., on 29th October, the town council of Glasgow prohibited all persons from Leith, Kirkcaldy, Dysart, Burntisland, and other places in which its existence was suspected, from coming to the city; inhabitants of Glasgow were also prohibited from going to these places. In Edinburgh the only place suspected is stated to have been Bell’s Wynd, and inhabitants of Glasgow were prohibited from going to that city without a testimonial, or from returning without a certificate from the magistrates that they had not associated with suspected persons there. Residenters in the town were prohibited from receiving strangers in their houses, except such as were licensed by the magistrates or their officers; and even residenters in houses outside of the ports were subjected to a similar restriction. Travellers from places unsuspected were also required, before being received within the city, to produce a testimonial from the magistrates of the burgh or the minister of the parish beyond a burgh. [Council Records, I., pp. 27–8] Two days later the privy council issued an order from Dalkeith to check the spreading of the plague landwards “through the departure of sick folk and foul persons;” it prohibited concealment of the existence of the malady, and commanded infected persons “to cloise thame selffis in.” [Privy Council Register, II., p. 415]</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It [the plague] appears to have been brought into Leith by a passenger from England, on 14th October, 1574, and several persons died of it there, before its existence was generally known; it entered Edinburgh on the 24th of the same month [A History of Epidemics in Britain, by Charles Creighton, M.D., I., p. 366], and five days later, viz., on 29th October, the town council of Glasgow prohibited all persons from Leith, Kirkcaldy, Dysart, Burntisland, and other places in which its existence was suspected, from coming to the city; inhabitants of Glasgow were also prohibited from going to these places. In Edinburgh the only place suspected is stated to have been Bell’s Wynd, and inhabitants of Glasgow were prohibited from going to that city without a testimonial, or from returning without a certificate from the magistrates that they had not associated with suspected persons there. Residenters in the town were prohibited from receiving strangers in their houses, except such as were licensed by the magistrates or their officers; and even residenters in houses outside of the ports were subjected to a similar restriction. Travellers from places unsuspected were also required, before being received within the city, to produce a testimonial from the magistrates of the burgh or the minister of the parish beyond a burgh. [Council Records, I., pp. 27–8] Two days later the privy council issued an order from Dalkeith to check the spreading of the plague landwards “through the departure of sick folk and foul persons;” it prohibited concealment of the existence of the malady, and commanded infected persons “to cloise thame selffis in.” [Privy Council Register, II., p. 415]”

ommanded+infected+persons+%E2%80%9Cto+cloise+thame+selffis+in.%E2%80%9D+%5BPrivy+Council+Register%2C+II.%2C+p.+415%5D%E2%80%9D%0A%0A%E2%80%94+Civil+Examples%2C+Scotland+1574+%7C+Footnote+33+in+%E2%80%98Historical+preface%3A+1600-3%E2%80%99%2C+in+Charters+and+Documents+Relating+To+the+City+of+Glasgow+1175-1649+Part+1%2C+ed.+J+D+Marwick+%28Glasgow%2C+1897%29%2C+pp.+clxxxiv-cciv.+British+History+Online&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F562f8bcf56.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/562f8bcf56.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=It%20%5Bthe%20plague%5D%20appears%20to%20have,Privy%20Council%20Register%2C%20II.%2C%20p.%20415&amp;text=It%20%5Bthe%20plague%5D%20appears%20to%20have%20been%20brought&amp;text=selffis%20in.%E2%80%9D%20%5BPrivy%20Council%20Register%2C%20II.%2C%20p.%20415" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

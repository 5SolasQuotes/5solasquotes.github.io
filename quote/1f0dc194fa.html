<main class="wrap"><figure class="quote" id="q-1f0dc194fa" data-kw="conservation upholding">
<blockquote><p>Conservation is that by which God conserves all creatures in their own state (which is done by a conservation of essence in the species, of existence in individuals and of virtues to their operations). Government is that by which God governs universals and singulars, and directs and draws them out to ends foreappointed by him. As things could not have been made without God, so neither without him could they subsist even for a moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.4.1–2</span></figcaption>

</figure><figure class="quote" id="q-e2cf359f99" data-kw="Affliction Submission">
<blockquote><p>How kind is God in wisely and mercifully deciding so many things for us! The man who fears God and loves his little daughter, would esteem it a greater affliction to be called on to say when his child should be sick—than he now finds it to nurse her through weeks of disease, close her eyes in death, and then carry her to the grave. God very mercifully bears the heaviest part of all our trials, by marking out our course for us. God is governor. We are servants. To us belong obedience, submission, acquiescence. It is not ours to guide, to decide what is best, to rule the world, to shape the course of events.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Mysteries of God’s Providence”</span></figcaption>

</figure><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin Permission">
<blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite></span></figcaption>

</figure><figure class="quote" id="q-19470c5e06" data-kw="Author of sin">
<blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

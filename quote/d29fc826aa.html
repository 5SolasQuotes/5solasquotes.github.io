<main class="wrap"><figure class="quote" id="q-d29fc826aa" data-kw="">
<blockquote><p>Let every one of you, brethren, give thanks to God in his own order, living in all good conscience, with becoming gravity, and not going beyond the rule of the ministry prescribed to him. Not in every place, brethren, are the daily sacrifices offered, or the peace-offerings, or the sin-offerings and the trespass-offerings, but in Jerusalem only. And even there they are not offered in any place, but only at the altar before the temple, that which is offered being first carefully examined by the high priest and the ministers already mentioned. Those, therefore, who do anything beyond that which is agreeable to His will, are punished with death [Lev. 10]. You see, brethren, that the greater the knowledge that has been vouchsafed to us, the greater also is the danger to which we are exposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to the Corinthians</cite>, ch. 41</span></figcaption>

</figure><figure class="quote" id="q-6037e57a04" data-kw="">
<blockquote><p>If we compare the two Tables together as to the matter contained in them and the immediate object of each duty commanded, the duties of the First Table are greater and the duties of the Second Table lesser, the one relating more immediately, the other more mediately to religion, in which respect they express peculiarly our love to God, which is called the first and great command; For the first four commands require that which in its own nature is worship, and is in an immediate way to be given to God; but the duites required in the other six, are not properly, formally and immediately called for as parts of worship to God, though, as they are acknowledgments of Him, they may be consequentially thereto referred.</p></blockquote>

</figure><figure class="quote" id="q-15b44f5f14" data-kw="">
<blockquote><p>Q. What is the main scope of the First Commandment, ‘Thou shalt have no other Gods before Me?’ A. Here is required all that natural worship of God, whether the same be inward or outward, which is such as if there were no Law prescribed, yet if we well know his nature, we would undoubtedly perform it to Him. Q. Name some principal duties that are here required, with the contrary vices forbidden? A. Here is required faith in God, love to his Majesty, and hope in Him, hearing his voice, calling upon Him by prayer, and such like. … Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline. … Q. What is the sum of the Third Commandement? A. The things here required are the due manner of observing and using all things that pertain to the natural or instituted worship of God, and all that name of God whereby He makes Himself known unto his people?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-mather.html">Richard Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechisme, or the Grounds &amp; Principles of Christian Religion</cite>, … (1650), ch. 32, ‘Of the life that beievers ought to live in the world, and of the Law of God’, pp. 114-16</span></figcaption>

</figure><figure class="quote" id="q-f9b2e72a0b" data-kw="">
<blockquote><p>The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John Eusden (1639; Baker, 1997), bk. 2, ch. 4, ‘Religion’, section 23, p. 239 See also the chart on, pp. 72-73.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-dc9b2435c9" data-kw="">
<blockquote><p>Whoever chooses celibacy because he detests marriage as an unclean thing, such a one, says Paul, not only does not please God but follows a doctrine of demons (1 Tim. 4:1). And anyone who prefers celibacy on account of Epicurean ease, likewise anyone who abstains from marriage only in order to escape the burdens of a household, such a one, Clement rightly says, Stromata, Bk. 3, sins against charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part III, First Topic (Chastity, Celibacy, and Virginity), Sec. II, ch. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/celibacy.html">Celibacy</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/monasticism.html">Monasticism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f76b0bc95" data-kw="">
<blockquote><p>What is the popish religion, but a bundle of ridiculous ceremonies? Their wax, flowers, pixes, agnus Dei, cream and oil, beads, crucifixes,—what are these but Satan&#x27;s policy to dress up a carnal worship, fitted to carnal minds?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a> › <a href="../topics/worship/nature-of-worship/will-worship.html">Will-worship</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“What is the popish religion, but a bundle of ridiculous ceremonies? Their wax, flowers, pixes, agnus Dei, cream and oil, beads, crucifixes,—what are these but Satan&#x27;s policy to dress up a carnal worship, fitted to carnal minds?”

</figure><figure class="quote" id="q-1710e393eb" data-kw="">
<blockquote><p>The old Council Gangrense commandeth that none should make such difference between an unmarried priest and a married priest, as he ought to think the one more holy than the other for single life&#x27;s sake. These men put such a difference between them, that they straightway think all their holy service to be defiled if it be done by a good and honest man that hath a wife.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The old Council Gangrense commandeth that none should make such difference between an unmarried priest and a married priest, as he ought to think the one more holy than the other for single life&#x27;s sake. These men put such a difference between them, that they straightway think all their holy service to be defiled if it be done by a good and honest man that hath a wife.”

— John Jewel, An Apology of the Church of England, Part 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20old%20Council%20Gangrense%20commandeth%20that%20none%20should%20make%20such%20difference%20between%20an%20unmarried%20priest%20and%20a%20married%20priest%2C%20as%20he%20ought%20to%20think%20the%20one%20more%20holy%20than%20the%20other%20for%20single%20life%27s%20sake.%20These%20men%20put%20such%20a%20difference%20between%20them%2C%20that%20they%20straightway%20think%20all%20their%20holy%20service%20to%20be%20defiled%20if%20it%20be%20done%20by%20a%20good%20and%20honest%20man%20that%20hath%20a%20wife.%E2%80%9D%0A%0A%E2%80%94%20John%20Jewel%2C%20An%20Apology%20of%20the%20Church%20of%20England%2C%20Part%205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1710e393eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1710e393eb.html">Permalink</a><a class="src" href="https://anglicanhistory.org/jewel/apology/" rel="noopener" target="_blank">Read it online · Project Canterbury</a></div>
</figure><figure class="quote" id="q-48f84ab3d4" data-kw="">
<blockquote><p>Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, ch. 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/images-icons-and-crucifixes.html">Images, icons and crucifixes</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?”

— Pierre Du Moulin, The Novelty of Popery, ch. 28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo+we+not+see+with+our+eyes+that+in+the+Roman+Church+the+people+is+denied+the+Communion+of+the+cup%3F+Do+we+not+see+pictures+of+the+Trinity%2C+and+the+people+bowing+the+knee+before+images%3F+Do+we+not+hear+public+service+and+prayers+in+an+unknown+tongue%3F+And+if+these+things+be+formally+prohibited+in+the+holy+Scripture%2C+are+they+not+unto+us+sensible+marks+of+a+false+and+erroneous+Church%3F%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Novelty+of+Popery%2C+ch.+28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F48f84ab3d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/48f84ab3d4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a6d63b8e1f" data-kw="">
<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, Second Commandment, p. 96</span></figcaption>

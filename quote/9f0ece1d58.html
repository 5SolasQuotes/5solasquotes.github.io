<main class="wrap"><figure class="quote" id="q-9f0ece1d58" data-kw="">
<blockquote><p>As to the point of justification; no man is, nor can be justified by the law. It is true, the Neonomians or Baxterians, to wind in a righteousness of our own into the case of justification, do turn the gospel into a law, properly so called; and do tell us, that the gospel justifieth as a law, and roundly own what is the necessary consequent of that doctrine, namely, that faith justifieth, as it is our evangelical righteousness, or our keeping the gospel law, which runs thus: He that believeth shall not perish. [Gibbon’s Ser. Morn. Ex. Meth. p. 418-421.] But the holy Scripture teaches, that we are justified by grace, and by no law nor deed, [or work of a law, properly so called,] call it the law of Christ, or the gospel law, or what law one pleaseth; and thereby faith itself, considered as a deed or work of a law, is excluded from the justification of a sinner, and hath place therein, only as an instrument. (Gal 3:11), “That no man is justified by a law in the sight of God, it is evident.”(5:4), “Whosoever of you are justified by a law, ye are fallen from grace.”(Rom 3:28), “Therefore we conclude that a man is justified by faith, without deeds of a law.” (Gal 2:16), “Knowing that a man is not justified by works of a law.” I read, a law, deeds, works, simply; because so the original words, used in these texts, do undeniably signify.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, ’s Notes, in Edward Fisher, The Marrow of Modern Divinity (Ross-Shire, UK: Christian Focus, 2009) 193.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-080a24a856" data-kw="">
<blockquote><p>The righteousness by which we are justified and stand righteous before God, is not our own righteousness, but the righteousness of Christ, Phil. 3:8-9; 2 Cor. 5:21, not the righteousness of Christ as God the Second Person in Trinity, but as Mediator, God-man. In which there are two things:

1. The perfect holiness of his humane nature, Heb. 7:26.

2. The perfect righteousness which He performed in doing and suffering according to the Law, this is imputed to us. Christ’s active obedience, his good works and holy life could never have been meritorious for us, nor brought us to Heaven, if he had not died for us, therefore our justification and obtaining of heaven is ascribed to his blood, as if that alone had done both, Rom. 5:9; Heb. 10:19; Rev. 5:6, 9, 11; his intercession and prayers had not been meritorious for us, if he had not died for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’, pp. 513-14</span></figcaption>

</figure><figure class="quote" id="q-eaed42d1dd" data-kw="">
<blockquote><p>What then is our foundation in Christ? Is it that he begins salvation and leaves us to complete it? Is it that he only opened up the way, and left us to follow it in our own strength? By no means, but as Paul had a little before declared, it is to acknowledge that he has been given us for righteousness. … in short, all things of his are ours, we have all things in him, he nothing in us.</p></blockquote>

</figure><figure class="quote" id="q-ce0092075d" data-kw="">
<blockquote><p>Objection. In the same way as Abraham was justified, so also are we justified, as children of Abraham. But Abraham was not justified by faith alone, but also by works, as the apostle James testifies (Jm. 2:21). Response. A person is said to be justified either before himself and in his conscience, or before God. Abraham was not justified before himself and in his conscience by faith alone, but also by works—I grant it. He was not justified by faith alone before God—I deny it. I explain: a godly person sometimes doubts whether he is among those who are justified; that is, he acknowledges indeed that he must be justified by true faith, but doubts whether his faith is true. This, however, he discovers and recognizes from the warmth of faith, namely charity. James does not treat of that justification which is before the tribunal of God, but of that by which we are justified in our own conscience, when our righteousness is made evident to us. Therefore, we are justified—that is, our righteousness is made manifest to us—not only by faith but also by good works, insofar as they are evidences of sincere faith; but we are not thus justified before God, who regards faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, … (d. 1625; Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V, pp. 364-65, trans. ChatGPT-5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-891dbcdb70" data-kw="">
<blockquote><p>XI. (4) Disagreements are a prejudice under whichthe evangelical churches labor. But they cannot hinder them from retaining the name of [a] true church, because they agree as to the foundation. And if any differences exist (which God wished to permit in order to prove our faith), they are about articles less necessary, in which there can be a disagreement without touching the essence of saving religion: as the apostolic churches formerly had their differences and stains, as is evident from the Acts of the Apostles and the Pauline epistles; nor were the eastern and western churches, the Latin and the Greek, the African and Italian churches free from them, which did not on that account cease to be true churches. Again, the contentions and differences of the evangelicals are far less than those which are agitated among the Romanists, who, as was seen before, frequently charge each other with heresy. Nor do we notice here the more rigid judgments of some of those who take their name from the great Luther, who, carried away by sinister prejudices, are accustomed to attack us. For however harshly they may have treated us, we do not cease to honor them with brotherly affection. And if, their prejudices and private affections being laid aside, they would seriously examine the thing itself by the law of love, truth and Christian prudence, they would not be so much averse to a pious syncretism and reconciliation with us, or at least a mutual toleration, to which not a few of the more moderate among them are not indisposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, question 15, “Are the evangelical and Reformed churches true churches of Christ?, p. 143</span></figcaption>

</figure><figure class="quote" id="q-6a2af103e9" data-kw="">
<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>22. The heretic is not to be confused with the schismatic: nor is every schismatic to be counted among the number of heretics. For although heretics often become schismatics, and conversely schismatics often become heretics, nevertheless the heretic and the schismatic differ. For first, heretics, corrupting the sincerity of faith with false doctrines, do not always separate themselves from the Church: but schismatics, sometimes even retaining the purity of faith without the stain of heresy, break the bond of brotherly society out of ambition for honor or some function in which they do not want another to be preferred over them, or out of hatred and impatience of divine order and ecclesiastical discipline, or under the pretext of scandals which are committed everywhere.

23. Heretics properly strike against the truth of the doctrines of faith, as heretics: but schismatics against charity, as schismatics:

24. Those who at the same time stumble in the truth of faith and charity, and obstinately defending the error of faith separate themselves from the Church of God, they are at the same time heretics and schismatics.

25. Very often it happens in practice that some orthodox individuals think differently from others, without strife or schism: as Jerome and Augustine.

26. Schismatics either separate themselves entirely from the Church, or in part also from this or that Church in the name of particular offenses.</p></blockquote>

<blockquote><p>Q. What are the parts of Justification?

A. Two: the not reckoning of forgiveness of our sins; and the imputation of Christ’s righteousness: both of which are merited by his Priesthood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 194.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db1c72a42f" data-kw="">
<blockquote><p>The Law was at first given to man in a Covenant way with its Sanctions. God not only gave it to be man’s Rule, of which we may take notice anon; but also to be the Rule of his own Relative Justice, in his proceeding with man, in his Government over him.

It was therefore the Law of Special Government: and that it might be adapted to this purpose, there was annexed to it, a promise of a constant life of happiness in case of man’s perfect Obedience to it; and a threatening of all miseries on the supposal of his disobeying it: and accordingly there was a double Sacrament added in the Ratification of it, Viz. The tree of Life, and of Knowledge, these were set as Seals to the Covenant, to signify that God would undoubtedly stand to the terms of it; that he was in earnest, and had obliged himself to see to the accomplishment of the terms of it. Now the Doctrine of Justification by Faith fully Answers this end of the Law to the utmost extent of it, as will be manifest by the following Conclusions.

1. That fallen man hath by sin forfeited the good of the promise, and procured to himself the evil of the threatening in the first Covenant. The life that was therein promised was engaged to perfect Obedience to the whole Law, but man hath not obeyed at all, and on that account his claim to life is gone; he can make no challenge at all of it, the threatened death was against all disobedience, even the least defect in the performance of it therein required; and he hath disobeyed, and on that account is fallen under the efficacy of the threatening. Hereupon, for fallen man to be personally under the Law, and under the Curse of it are inseparable, Gal. 3.10. Whosoever is of the works of the Law, is under the Curse. And this is the true state of every one of Adam’s Posterity as they come into the World, and as long as they abide in their natural state, and now the Justice of God stands armed against them with vengeance, and is ready to fall upon them, and execute on them all that wrath unto which they are sentenced by the Law.

2. Hence there is a double Righteousness requisite for the Justification of fallen man. There are two things requisite for the entire Justification of one who stands upon his trial, Viz. The acquittance of him from Condemnation, and the declaring of him to be a Righteous Person; that so he may both escape the misery he was in hazard of, and be invested with happiness according to the Law: and in the declaration of both these, the Law of Righteousness must be regarded, otherwise the sentence cannot be righteous; to this end there must be a perfect active Obedience to it, every way Commensurate to all the Commands of it, or else he is not righteous: and there must be a full Satisfaction given for all the Offense that hath been given by any Prevarication or departure from it, else he remains under the Condemnation of it: and if there be not both of these found for him, and belonging to him, before, or in order to his being Justified, the Law is superseded, and trampled upon; it is neglected and so made void, which must not be, for so Justice would suffer, which it ought not to do. We shall therefore find both of these put together, Rom. 3.26. That he may be just, and the justifier of him that believeth in Jesus Christ.

3. That fallen man cannot personally answer either of these two, much less both. He cannot perform, for the future that perfect Obedience which is required by the Command; and this by reason of the Impotency, and the Enmity that he is under the efficacy of. He hath lost all his strength, and is not now able to perform any one duty as it ought to be done, and therefore is said to be without strength, Rom. 5.6. which is the condition of every man in his natural state. He is also acted by a Spirit of malignity against the Law, Rom. 8.7. The carnal mind is enmity against God: for it is not subject to the Law of God, neither indeed can be: and although in Conversion the man is renewed again, yet it is but in part, and he hath not attained to be sinless, nor ever will in this life; 1 Joh. 1.8. If we say we are without sin, we lie, and the truth is not in us. So that of the best duties of the most holy mere man upon earth, should be accepted for his Justification, the Law must so far depart from its rigour, as to abate him these great imperfections that it allows not; and thus it must not do, for, Matt. 5.18. Till heaven and earth pass one jot or tittle shall no wise pass from the Law, till all be fulfilled.

Nor yet can he make Satisfaction to the Justice of God for his sin, the guilt whereof he hath contracted to himself, not by his active Obedience to the Law, in as much as he cannot come up to, much less can he ever do that which the Law requires, besides, the transgression of the Law is not satisfied for by doing, but by suffering. Not by passive Obedience, or undergoing the penalties denounced, because sin is against an Infinite Object, and hence eternal sufferings are in the threatening, according to the Language of the word of God: and the reason is because the sufferings of a mere Creature are not sufficient to discharge the debt: otherwise, Eternity of the duration is not Essential to the punishment, for the Son of God undertook it, discharged it, and is delivered from it.

4. That faith in Jesus Christ, fully answers all this Righteousness thus required in the Law of us. We read, Rom. 3.21, 22. The Righteousness, of God without the Law is manifested, even the righteousness of God which is by faith in Jesus Christ, unto all, and upon all that believe. Justice in this way hath all the Satisfaction that it doth or can demand, whiles the Grace of God is withal exalted in the Justifying of a sinner, according to, Psal. 85.10. Mercy and Truth are met together, righteousness, and peace have kissed each other.</p></blockquote>

</figure><figure class="quote" id="q-7d996b190a" data-kw="">
<blockquote><p>The incarnation of Christ was once done and is not to be done again; but remission of sin is so done as that it is continually to be done for us, and the ultimate complete effect of it will then only be when sin shall be quite taken away, so that a total and full remission will be only at the Day of Judgment, as appears, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come:’ Not but that every sin here forgiven is fully and perfectly forgiven, but because we renew sin daily, therefore there is need of a daily pardon: Away therefore with all such opinions as shall either plead such an inherent righteousness in the Pelagian way, or such an imputed righteousness in the Antinomian way that will overthrow this petition [in the Lord’s prayer] for forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, 14.4</span></figcaption>

</figure><figure class="quote" id="q-817228e1be" data-kw="">
<blockquote><p>Why then does James say that it was fulfilled? Even because he intended to shew what sort of faith that was which justified Abraham; that is, that it was not idle or evanescent, but rendered him obedient to God, as also we find in Heb 11:8. The conclusion, which is immediately added, as it depends on this, has no other meaning. Man is not justified by faith alone, that is, by a bare and empty knowledge of God; he is justified by works, that is, his righteousness is known and proved by its fruits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, James 2:23</span></figcaption>

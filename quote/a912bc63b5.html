<main class="wrap"><figure class="quote" id="q-a912bc63b5" data-kw="">
<blockquote><p>For, indeed, in the most considerable councils of the bishops, as I hear, it has been decreed that they who come from heresy should first be trained in catholic doctrine, and then should be cleansed by baptism from the filth of the old and impure leaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dionysius.html">Dionysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Extant Fragments, pt. 2, Epistle 6, to Bishop Sixtus in ANF 6.102</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0238b6d385" data-kw="">
<blockquote><p>If the question, ‘What is the meaning of the words, ‘the system of doctrines taught in the Holy Scriptures,’ as they occur in the formula which makes a part of the ordination service?’ were submitted to any intelligent and impartial jury in the country–to twelve men of plain common sense, who had never head of the subterfuges and refinements of modern subscribers to creeds–I cannot doubt that they would be unanimous in their verdict without quitting their seats. They would naturally decide thus: ‘Since the primary object of subscribing an ecclesiastical creed is to express agreement in doctrinal belief; since the manifest design of the Confession of Faith of the Presbyterian Church is to maintain what is commonly called the Calvinistic system, in opposition to the Socinian, the Arian, the Pelagian, and the Arminian systems; since almost every point which distinguishes these several forms of error are specifically exposed, disproved and rejected, under one or another of its several articles; and since this has notoriously been the universal understanding, ever since that Confession was formed, we judge that no man who is not a sincere Calvinist, that is, who does not ex animo [from the heart; sincerely] receive all the distinguishing articles of the Calvinistic system, can honestly subscribe it. We do not suppose, indeed, that among those who subscribe that formulary, it is necessary, in order to a candid subscription, that there should be entire agreement as to ‘every jot and tittle’ in the mode of explaining every doctrine which the Confession contains. But we cannot resist the conclusion, as fair and honorable men, that unless a candidate for admission… sincerely believes all these [previously listed doctrines], and the essentially allied doctrines which have ever been considered as the distinguishing features of the Calvinistic system, and believes them in substance, as they are laid down in the Confession, our verdict is that he cannot honestly subscribe it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Adherence to our Doctrinal Standards’ ToC in Doctrinal Integrity (Dallas: Presbyterian Heritage Publications, 1979)</cite>, pp. 75–131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-abc8872df7" data-kw="">

</figure><figure class="quote" id="q-7c9d5dcde2" data-kw="">
<blockquote><p>…to speak somewhat of doctrine. I doubt not but you know how necessary a thing the knowledge of Christ’s doctrine is. For if the mind be stirred up with lively teachng, to put full confidence in Christ, and is after this confidence fully inflamed with the love of religion, honesty, and goodness, it is almost necessary all kinds of vices to reign there where no voice instructed with godly sentences is heard, Christ must needs be unknown there, where his benefits with all his acts lie unspoken of… You amongst all men are chosen for great causes, your honour is to restore Christ’s doctrine, and to appoint such as will and shall be able to teach the gospel, to amend the ceremonies, and to put a difference between the ministers of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-sturm.html">Johannes Sturm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Epistle that Johan Sturmius… sent to the Cardinals and Prelates that were chosen and appointed by the Bishop of Rome, to search out the Abuses of the Church (London, 1538), no page number Sturm (1507–1589) was a German educator and Protestant reformer.</cite></span></figcaption>

%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4382d149ad" data-kw="">
<blockquote><p>…the pastors of our reformed Churches, having (in common) had even an ordinary calling: and, therewith holding the true apostolic doctrine, we are the true successors of the apostles, and not our adversaries… …as says Gregory Nazianzen. His words are notable, and which alone are even enough to oppose to all our adversaries shameless brags of bare succession. They are to this sense: The succession of piety is properly to be holden succession: for who professes the same doctrine of faith, he is partner of the same chair: but who embraces a contrary faith, he ought to be accounted an adversary… … therefore, to approve themselves true successors to the apostles, they must also verify themselves to hold the same doctrine:</p></blockquote>

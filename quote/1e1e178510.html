<main class="wrap"><figure class="quote" id="q-1e1e178510" data-kw="">
<blockquote><p>There was some Priests in it, and some Civil men, and they judged together in the LORD’s Matters; The Matters of the LORD belonged to them, to wit, The Priests. And the Kings Matters belonged to the others: But all was to judge according to the Word of GOD. We shall say this one word more, there is one Great Thing Folk stumbles at in that Paper that Kings ought to Rule or Judge according to the Judicial Law; and that these Laws Kings ought to Rule by, ought to be according to the Word of GOD, And think ye this a Great Wrong? The People of GOD was ruled Two Hundred Years and upwards by this Law only, and can any be fitter to be a Law-Giver than GOD? Have we Laws, have we them from Men or of GOD? If of Men, then they had them from Men or of GOD? Then the GOD of Nature, or the GOD that Created All is far better to Teach Laws than Man that is under GOD. We say stumble not that it is said, the Laws of GOD ought to be the Laws of the Land; For it will never be well with you (especially the Mein of the Land) till the Laws of GOD be the Laws of the Land; Then we will not be fashed [sic] with Great Ones to Oppress: For when they have Laws to make, they never do [any] thing but Oppress the Poor. But when the Law of GOD speaks, it will give Right to the Poor as well as to the Great. So the Law of GOD should be our Law. Where the Law of GOD is received where Christians are; Let Christians go to the Law which GOD has found out; And let Heathens and Turks go to the Law that Nature finds out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-cargill.html">Donald Cargill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A lecture and sermon preached in different times by that faithful and painful minister of the gospel, and now glorified martyr, Mr Donald Cargill, concerning Jehosophat and his association with Ahab, and the difficulty where to make recourse, when staged before the tribunal of God</cite>, (n.p., 1681), p. 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2044f19e9" data-kw="">
<blockquote><p>In this post, the Philadelphia Covenanter lands another blow against the New Perspective on Moses by pointing out that Christ upheld the true meaning of the so-called law of retaliation (Matthew 5:38-42) and the penal sanction against rebellious children (Matthew 15:4). Although advocates of the New Perspective on Moses are quick to accuse Judicial Calvinists with being legalists, the irony is that their position is actually that of the Pharisees rather than that of Jesus Christ:

The law of retaliation would seem to be taught by the light of nature […] It is evidently founded on the principles of immutable justice. It appears, however, to have been grossly abused by the Jews, for the purpose of private revenge. This the Redeemer forbids; but in no instance did he interfere with the province of the civil magistrate farther than to command his disciples to obey the laws which God had given to Moses. Matt. xxiii. 1. Could it be proved that Christ abrogated the law of retaliation, the same reasoning would prove that he had abrogated all law, and, consequently, all civil government. Moses commanded – “And he that curseth his father, or his mother, shall surely be put to death.” Exod. xxi. 17. This command the Scribes and Pharisees had set aside, probably under the pretence of its being a cruel law; but, for so doing, the Redeemer calls them hypocrites, and blind leaders of the blind. Matt. xx. 1-9, and 14. Mark vii. 6-13. Think of that ye advocated for the murderer – ye falsely merciful – ye vilifers of the law of Moses. Do ye pretend to be more compassionate than the Son of God? Do you understand, better than he, the demerit of crime, and the manner in which it should be punished? Do our pseudo-philanthropists know that there is such a passage in the gospel?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, pp 164-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d217a63508" data-kw="">
<blockquote><p>Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help to True Happiness</cite>, (London, 1618), pt. 1, question 3, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

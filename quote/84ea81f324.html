<blockquote><p>It is through Christ Jesus we are to make known our requests unto God, because he is the trustee of the covenant, and all its exceeding great and precious promises are in him yea, and in him Amen. He is the heir of all things, and in him all things are ours, whether Paul, or Apollos, or Cephas, or the world, or life, or death, or things present, or things to come; all are ours, and we are Christ’s, and Christ is God’s.

“I will be thy God” is the formula of the covenant. God has given himself to his people as their all-comprehending good as well as their all-disposing Lord. He is their sun and their shield; he will give grace and glory; no good thing will he withhold from them who walk uprightly. The warrant and measure of our prayers, therefore, is this boundless covenant with all its promises, a covenant formed in the depths of eternity, sealed with the blood of the Lamb, and confirmed by an oath. (Heb. vi. 13, etc.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Peace of God (1863) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

<blockquote><p>The covenant of grace is, properly speaking, an unconditional covenant. The conditions have been fulfilled for us by Christ, the covenant head of elect humanity (though we can refer to saving faith as a condition, but only in an improper sense). As Ralph Erskine argues:

This is the condition of the New Covenant. The Covenant of Works had only the active obedience of the first Adam for its condition; but the condition of the Covenant of Grace properly, is both the active and passive obedience of the second Adam, his doing and dying. Now, Lord, have respect to that blood that sealed the covenant; since the condition is fulfilled to thy infinite satisfaction, let the promised good be conferred upon me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith’s Plea Upon God’s Covenant: A Sermon on Psalm LXXIV. 20</cite>, (Falkirk: T. Johnston, 1821), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-a23157ae34" data-kw="">
<blockquote><p>Secondly, Consider we the Law as in the administration of it to Moses, and so to the people of the Jews: The administration of the Law to them it was under another notion, it was to bring them to Christ, and that they might come to see their inability of keeping of that Covenant, and come to understand Christ so much the more, and to be driven unto Christ by having the Law presented to them, God did never intend by giving of the Law to the people of the Jews that it should be a Covenant of eternal life to them; indeed there was this in the administration of it somewhat different from us, some special Covenant about their living in Canaan, and about mercies in that promised Land, beyond that that we have in the Law, as we find in the new Testament, they (I say) had this annexed to it.

The Law that was first given unto Adam and written in his heart, afterwards even obliterated, then it was transcribed by the same hand in tables of stone and given unto them chiefly to shew them their misery, and their need of Christ; to be a preparation for Christ’s coming into the world; and with this one addition beyond what we have in the new Testament, that there was a temporal Covenant annexed unto it, that concerned their living prosperously in the Land of Canaan, (&amp; so far we are delivered even from the Law as it was given by Moses, that is, from the connexion of the Covenant that was added unto the delivering of the Law) concerning their happy and comfortable condition in the Land of Canaan upon the keeping of their Law; but now (how ever it was) certainly that Conversation that becomes the Gospel should be beyond what could be even from godly men in the time of the Law.

As first, The Law to them it was given under low Promises, their promises were but very low that were under the Law: It’s true, they had somewhat of the Gospel that we have, but extreme darkly, and very little that they knew of it, but the chief Ministration of God towards them was then in a legal way, and that had but low promises, as their living in Canaan; you shall find generally al the promises that are annexed to the Law even by Moses, it is but, that they shall prolong their days in the Land the Lord their God shall give them, That they should be blest in their basket and store: their Promises were under Heaven-Promises, Promises of this life only; and therefore it could raise them but to a very low degree of holiness.

Secondly, Their Ordinances were but poor and mean, and beggarly in comparison of our; for so the Gospel calls them, Col. 2. They were but beggarly rudiments, which stood only in meats and drinks, and divers washings, and carnal Ordinances imposed on them until the time of reformation. Heb. 9. 10. They had an earthly Tabernacle, a worldly Sanctuary, Heb. 9. 1. &amp;c.

Thirdly, The burden of them under the Law was very great, they were under a heavy yoke &amp; burden that did bow them down: A man that is under a heavy burden it makes him stoop &amp; bend in the back, he cannot stand so upright nor fast as others that have no such weight upon them. Fourthly, The administration of the Law was with Thunder and Lightning very terrible, It made even Moses quake and tremble, (as the Author to the Hebrews speaks.)

Fifthly, Their spirits were very servile under the Law, they were subject to bondage even all their days; God so ordered things as to carry on his people even in a very servile way, they were but mean servants then, hewers of wood and drawers of water.

But now under the Gospel, First, our Promises are far better, and our Covenant better, in Heb. 8. 6. there the Apostle compares their Condition and ours, Who serve (saith he) unto the example and shadow of heavenly things, There was but the shadow of heavenly things; the Gospel hath the Heavenly things themselves, and they are but the shadow, for so you have it in Heb. 10. 1. For the Law having a shadow of good things to come, and not the very image of the things: They had but a shadow of good things to come, and not the very image it self. As Moses was admonished of God, when he was about to make the Tabernacle, For see (saith he) that thou make all things according to the pattern shewed to thee in the Mount.

And then in Heb. 8. 6. But now hath he obtained a more excellent Ministry, [that’s Christ] By how much also he is the Mediator of a better Covenant, which was established upon better promises: A better Covenant, and stablished upon better promises, or a better Testament: Their promises I say were but low and mean; and our promises are high and precious, and we have a better Covenant, a Covenant not of living in the Land of Canaan, but of Heaven, of which that Canaan was but a Type, and therefore our Conversations should rise higher in holiness according as our Covenant and Promises are better than theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 47-49.</span></figcaption>

hewers+of+wood+and+drawers+of+water.%0A%0ABut+now+under+the+Gospel%2C+First%2C+our+Promises+are+far+better%2C+and+our+Covenant+better%2C+in+Heb.+8.+6.+there+the+Apostle+compares+their+Condition+and+ours%2C+Who+serve+%28saith+he%29+unto+the+example+and+shadow+of+heavenly+things%2C+There+was+but+the+shadow+of+heavenly+things%3B+the+Gospel+hath+the+Heavenly+things+themselves%2C+and+they+are+but+the+shadow%2C+for+so+you+have+it+in+Heb.+10.+1.+For+the+Law+having+a+shadow+of+good+things+to+come%2C+and+not+the+very+image+of+the+things%3A+They+had+but+a+shadow+of+good+things+to+come%2C+and+not+the+very+image+it+self.+As+Moses+was+admonished+of+God%2C+when+he+was+about+to+make+the+Tabernacle%2C+For+see+%28saith+he%29+that+thou+make+all+things+according+to+the+pattern+shewed+to+thee+in+the+Mount.%0A%0AAnd+then+in+Heb.+8.+6.+But+now+hath+he+obtained+a+more+excellent+Ministry%2C+%5Bthat%E2%80%99s+Christ%5D+By+how+much+also+he+is+the+Mediator+of+a+better+Covenant%2C+which+was+established+upon+better+promises%3A+A+better+Covenant%2C+and+stablished+upon+better+promises%2C+or+a+better+Testament%3A+Their+promises+I+say+were+but+low+and+mean%3B+and+our+promises+are+high+and+precious%2C+and+we+have+a+better+Covenant%2C+a+Covenant+not+of+living+in+the+Land+of+Canaan%2C+but+of+Heaven%2C+of+which+that+Canaan+was+but+a+Type%2C+and+therefore+our+Conversations+should+rise+higher+in+holiness+according+as+our+Covenant+and+Promises+are+better+than+theirs.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel-conversation%3A+wherein+is+shewed%2C+I.+How+the+conversation+of+believers+must+be+above+what+could+be+by+the+light+of+nature.+II.+Beyond+those+that+lived+under+the+law.+III.+And+suitable+to+what+truths+the+Gospel+holds+forth%2C+%28London%3A+Peter+Cole%2C+1650%29%2C+pp+47-49.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa23157ae34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a23157ae34.html">Permalink</a><a class="src" href="http <blockquote><p>Obj 4. Faith is a condition (though not of it self, yet) of salvation, &amp; that in the Elect themselves: therefore the Application of salvation seems not to be free in respect of the Elect.

Ans. A Condition, is either a Condition properly so called, (i. e. an antecedent Condition,) Or a Condition improperly so called: i. e. a consequent Condition. A Condition (properly so called) is a Law, or Observation, annexed to a business; the performance whereof lyeth upon the Covenant; and accordingly the business becometh valid, or null. Such a condition was Works in the first Covenant. If Faith were such a condition, there would soon be an end of the Covenant of grace: yea, the Covenant of grace, were indeed no Covenant of grace.

A Condition improperly (so called, or a Consequent Condition) is such a condition, whose performance by the Covenantee, is absolutely undertaken for; and irresistibly wrought by the Covenantor, and not left in suspense upon the Covenantee, to be performed by his own strength. Faith is a consequent condition, not an antecedent condition. So as this Proposition, I will give Eternal life unto the Elect, if they do believe: is aequivolent unto this, I will out of my absolute will give unto the Elect Eternal life, because I will out of my absolute will give unto the Elect to believe. The Condition of Faith depends not upon the Will of the Elect; either to be, or not to be; but upon the absolute and gracious Will of God.</p></blockquote>

<blockquote><p>The Lord God having entered into a covenant of life with the first Adam, for himself and all mankind in him, this covenant has been broken, whereby sin hath entered, and death by sin; and all the world being now become guilty before God, bound over to the vengeance of eternal fire, and under an utter impossibility of recovery by aught which that covenant can do, God has out of his abundant grace made a new covenant, on which whosoever shall lay hold, shall be delivered out of the state of death and wrath into a state of life and blessedness. What the law could not do, being weak through the flesh, God sent his Son in the likeness of sinful flesh to accomplish; and with him this gracious grant, that whosoever believeth in him, shall not perish, but have everlasting life. John 3:16. And this is the covenant which has been declared unto you.

This new covenant is a marriage covenant: I will betroth thee unto me for ever, yea, I will betroth thee to me in righteousness, and in loving-kindness, and in mercies. Hos. 2:20. In it the Lord makes offer, and invites you to accept of a husband and a dower: the husband is the King’s Son, the Lord Jesus Christ, and with him the lost kingdom, and all that belongs to the kingdom of God, for a dower. Liberty for the captives, the opening of the prison to them that are bound; riches to the poor, eyes to the blind, feet to the lame, healing to the diseased, and life to the dead.

And whoever among you all, who are persons under the law, held by the cords of your sins, whose souls are fast bound in fetters of iron, who are willing that your covenant with death be made void and your agreement with hell be disannulled, and will join yourselves to the Lord and be brought within the bonds of this covenant, all the blessings of this covenant are made over and stand sure unto you. The grant is made, the deed is drawn and sealed; the Lord hath set to his seal — come you in and seal the counterpart; set to it your seal, and the match is made up. Christ, and with him all things, are yours, and you are his. Accept, and live; refuse, and die forever.

Come then, sinner; what sayest thou? Dost thou consent? Dost thou accept? Or, as Laban to Rebekah, Wilt thou go with this man? Let me espouse thee to this one Husband; only let me first tell thee, the matter is solemn, and thou must be serious. It is for life, it is for eternity. Consider therefore, and let thy heart, lying prostrate before the Almighty, come in and make answer to these demands, which from him, and in his great and dreadful name, I make unto thee.</p></blockquote>

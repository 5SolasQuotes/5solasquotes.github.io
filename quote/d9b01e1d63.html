<blockquote><p>3. When God commands such offices to be in his house, which depend immediately upon his own immediate will of giving gifts essentially required to these offices, then these offices are so long in his Church as God is pleased by his immediate will to give these gifts; and when God denies these gifts essentially requisite, sure it is, his immediate will has altered and removed the office, not the will of the Church, so the Lord has altered and removed these offices and gifts of apostles, who could speak with tongues and seal their doctrine with miracles, evangelists, prophets extraordinarily inspired, gifts of healing, etc.</p></blockquote>

</figure><figure class="quote" id="q-1df370405b" data-kw="">
<blockquote><p>II. Moral actions of God, whose efficiency is metaphorical and are by way of object, by which He objectively moves and intelligibly instructs the elect (namely, adults or those using reason), by setting forth and offering the goods acquired, adjudicated, and assigned by Christ the Redeemer, and thus inviting to the acceptance of them, which happens through the contracting of the covenant. And such a moral action is of one single species, called Calling—calling, I say, to the contracting of the covenant of grace: so that I may distinguish it from the Calling which demands the performance of the law and summons all men to the obedience due to God from the right which He has over rational creatures. Which we also concede is directed to all the reprobate; but we deny that it can properly be called salvific, or a calling to salvation.

III. Real actions operating really or physically (as the more recent speak), and producing a real and inhering change in the subject, are those by which God makes the elect participants of real possession of goods and inhering gifts. And they are: Regeneration; Beatification in the state of grace; Beatification of the soul after this life; Resurrection to glory; Final glorification. Of these, the three latter pertain to the future life; the two former to the present life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“II. Moral actions of God, whose efficiency is metaphorical and are by way of object, by which He objectively moves and intelligibly instructs the elect (namely, adults or those using reason), by setting forth and offering the goods acquired, adjudicated, and assigned by Christ the Redeemer, and thus inviting to the acceptance of them, which happens through the contracting of the covenant. And such a moral action is of one single species, called Calling—calling, I say, to the contracting of the covenant of grace: so that I may distinguish it from the Calling which demands the performance of the law and summons all men to the obedience due to God from the right which He has over rational creatures. Which we also concede is directed to all the reprobate; but we deny that it can properly be called salvific, or a calling to salvation.

<main class="wrap"><figure class="quote" id="q-b0ce3af63c" data-kw="">
<blockquote><p>From the union of the outward elements, and the things which they denote, arises sacramental phraseology, by which the terms denoting the sign and the things signified are used interchangeably. Thus Christ is termed “our passover;” circumcision is called “the covenant,” the bread in the Lord’s Supper is named the “body” of Christ. [1 Cor. 5:7; Gen. 17:11; Matt. 26:26] The sacramental union so connects the objects that, by a figure of speech common to all languages, the one may be predicated of the other.

Hence, throughout the Scriptures, we find the sign designated by the thing signified, as when sanctification of heart is called circumcision. [Rom. 11:29] The effect of the thing signified is ascribed to the sign, as to baptism is ascribed to regeneration, [Tit. 3:5] and what is proper to the sign, or to the thing signified, is interchanged in the application. The breaking of the bread is applied to Christ’s body, and remission of sins, which is the fruit of grace communicated, is ascribed to external baptism. [Acts 22:16]

This phraseology, which, when understood figuratively, is proper and expressive, has often been grossly misapplied, in a literal sense, to support the dogma of baptismal regeneration, and even to make out the change of the material elements into the substance of the spiritual objects, in transubstantiation. Such a mode of interpretation is utterly opposed to the received usage of all languages, and amounts to a manifest perversion of the sacred writers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Treatise on Christian Baptism</cite>, (1853) in Works: Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 3: 13.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister</cite></span></figcaption>

<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are:

1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause.

2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism.

3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>

<blockquote><p>…use the best skill you have to instruct your children and servants, yet this is no reason to withdraw them from public instructions: nor can any man, who understands his religion, think he discharges his duty to God and the Church, merely by his private instruction of his family, when he neglects, or refuses to bring them to public instructions. 3. For he must consider, that his children and servants, who are baptized, are members of the Christian Church, and therefore ought to be subject to the instructions and discipline of it, as far as their age and capacity will permit. They do not only belong to his private care, but to the public care of the Church, who is to provide for the instruction of her children; and to deny the Church liberty to instruct her children, or not to interpose their own authority to make them submit to it, is to withdraw their children from the communion of the Church, after a solemn dedication of them to God.</p></blockquote>

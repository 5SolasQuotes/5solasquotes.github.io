<main class="wrap"><figure class="quote" id="q-74140b6793" data-kw="">
<blockquote><p>As you sing uncover your heads (1 Cor. 11:4), and behave yourselves in comely reverence as in the sight of God, singing to God in God’s own words; but be sure that the matter make more melody in your hearts (Eph. 5:19; Col. 3:16) than the music in your ear…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4122de5616" data-kw="">
<blockquote><p>…for when the Word determines not, conscience (though misinformed) casts the balance to the side which it judges to be necessary; As for instance, if a man think it a sin to hear the Word with the head uncovered, he is oblidged to cover his head, and contrarily; For conscience there casts the balance: but when the thing is unlawful on the matter, it may bind him up, while it remains in an error, so as he cannot without sin counteract its dictate; but it never oblidges him to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven upon Earth</cite>, ... (Edinburgh, 1685), sermon 2, on Acts 24:16, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-0be51627bb" data-kw="">
<blockquote><p>Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds</cite>, [a Romanist] touching the Head and the Faith of the Church (London, 1584), ch. 8, p. 581</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…”

</figure><figure class="quote" id="q-777c869934" data-kw="">
<blockquote><p>1. Indifferent Things are far below the scale of divine institutions, though these institutions are but positive, and not of eternal goodness and righteousness. All the appointments of God and Christ are lifted up into that state the divine appointment designs them to; and shall, if used according to those appointments, be made efficacious to those ends for which they are appointed, according to the effectual working of that power and grace from which they received their original: So that they do make us better, they do commend us to God, if we observe the will and law of God concerning them; and we are the worse in the sinful neglect of them, according to the degree of neglect.

2. They are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands; and not of confusion; so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion; yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil.

3. Of the same account is that euschemonia, or decency of religious actions, required by God before Himself, and before the holy angels, of which the apostle discourses; ‘Every man praying with his Head uncovered, dishonoureth his head;’ every Woman praying so, ‘ought to have a covering on her head, because of the angels;’ such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beverley.html">Thomas Beverley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Protestant Truth &amp; Peace in Four Treatises</cite>, … (London, 1683), pp. 39-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-377ce1470e" data-kw="">
<blockquote><p>A wive’s outward reverence consists in her reverend gesture, speech. For the first, that a reverend gesture and carriage of herself to her husband, and in her husband’s presence, beseems a wife, was of old implied by the vail which the woman used to put on, when she was brought unto her husband, as is noted in the example of Rebekah (Gen. 24:65): whereunto the apostle alludes in these words, ‘the woman ought to have power on her head.’ (1 Cor. 11:10) That cover on the woman’s head, as in general it implied subjection, so in particular this kind of subjection, viz. a reverend carriage and gesture. But most expressly is this duty set down by Saint Peter who exhorts wives to order their conversation [conduct] before their husbands, so as it be pure, with reverence. This reverend conversation [conduct] consists in a wive-like sobriety, mildness, courtesy and modesty. [Gouge does not go on to mention veils]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London: 1622) | 3rd Treatise, “Of Wives’ Particular Duties,” | section 9, p. 278</span></figcaption>

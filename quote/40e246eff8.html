<main class="wrap"><figure class="quote" id="q-40e246eff8" data-kw="">
<blockquote><p>Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>

</figure><figure class="quote" id="q-8b352127fe" data-kw="">
<blockquote><p>To this principle of contradiction or of identity is subordinated the principle of sufficient reason, which in its generality may be formulated thus: ‘Everything that is has its raison d’etre, in itself, if of itself it exists, in something else, if of itself it does not exist.’ But this generality must be understood in senses analogically different. First. [Formal cause] The characteristics of a thing, e.g.: a circle, have their raison d’etre in the essence (nature) of that thing. [In a siimlar way the sufficient reason for God is in Himself] Secondly. [Efficient cause] The existence of an effect has its raison d’etre in the cause which produces and preserves that existence, that is to say, in the cause which is the reason not only of the ‘becoming,’ but also of the continued being of that effect. Thus that which is being by participation has its reason of existence in that which is being by essence [namely God]. Thirdly. [Final cause] Means have their raison d’etre in the end, the purpose, to which they are proportioned. Fourthly, [Material cause] Matter is the raison d’etre of the corruptibility of bodies. This principle, we see, is to be understood analogically, according to the order in which it is found, whether that order is intrinsic (the nature of a circle related to its characteristics [or in something being material and corruptible]): or extrinsic (cause, efficient or final, to its effects). When I ask the reason why, says St. Thomas, I must answer by one of the four causes. Why has the circle these properties? By its intrinsic nature. Why is this iron dilated? Because it has been heated (efficient cause). Why did you come? For such or such a purpose. Why is man mortal? Because he is a material composite, hence corruptible. [Unfallen Adam was capable of dying though He would not have died by the providence of God if he had remained upright.] Thus the raison d’etre, answering the question ‘why’ (propter quid): is manifold in meaning, but these different meanings are proportionally the same, that is, analogically. We stand here at a central point. We see that the efficient cause presupposes the very universal idea of cause, found also in the final cause, and in formal cause, as well as in the agent. Thus the principle of sufficient reason had been formulated long before Leibnitz.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (n.p., 1946), ch. 4, ‘Intelligible Being &amp; First Principles’, pp. 24-25</span></figcaption>

</figure><figure class="quote" id="q-a11e73fba7" data-kw="">
<blockquote><p>As a result, our faith and theology can be called completely rational, not in that it a priori demonstrates its truth necessarily with arguments in opposition to those who deny the basic assumptions of the Christian religion, but in that it demonstrates its conclusions from the authority of Scripture and with arguments derived from Scripture in opposition to those who accept something [aliquod] of the things that are revealed in a divine manner; and in that it at least refutes the arguments of those who accept nothing of it, namely those arguments by which they charge our faith with contradiction and absurdity, as Thomas [Aquinas] correctly distinguishes in his Summa theologiae, part I, quaestio 1, article 8 [‘Whether Sacred Doctrine is a Matter of Argument’]. Add to this that [reason], by directly attacking false theology, consequently and indirectly defends true theology, that is, by clearing away impediments and prejudices, and so paving the way to the truth. A similar defense of the fatih can be seen in Athenagoras, Justin Martyr, Clement of Alexandria, Origen, Tertullian, Arnobius, Lactantius, Augustine, Theodoret, Cyril of Alexandria, and so forth; in the medieval writers Thomas Against the Pagans and the other scholastics, if one with discretion and discernment takes the more solid excerpts; as well as Savonarola in The Triumph of the Cross; Raymond of Sabunde [d. 1436] in On Natural Theology; Cardinal Cusanus, Dionysius the Carthusian and others who wrote against the Muslims; and finally, more recent writers such as Louis Vives [d. 1540], Agostino Steuco [d. 1548], Charron [d. 1603], the scholastics who treat quaestiones and the commentators on Lombard and Thomas, but especially Du Plessis [Mornay] [1623] in his excellent treatise On the Truth of the Christian Religion. To this list we could add the adversaries of the Socinians whom we have already cited elsewhere [previously in the disputation].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, ‘The Use of Reason in Matters of Faith’, pp. 229-30</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As a result, our faith and theology can be called completely rational, not in that it a priori demonstrates its truth necessarily with arguments in opposition to those who deny the basic assumptions of the Christian religion, but in that it demonstrates its conclusions from the authority of Scripture and with arguments derived from Scripture in opposition to those who accept something [aliquod] of the things that are revealed in a divine manner; and in that it at least refutes the arguments of those who accept nothing of it, namely those arguments by which they charge our faith with contradiction and absurdity, as Thomas [Aquinas] correctly distinguishes in his Summa theologiae, part I, quaestio 1, article 8 [‘Whether Sacred Doctrine is a Matter of Argument’]. Add to this that [reason], by directly attacking false theology, consequently and indirectly defends true theology, that is, by clearing away impediments and prejudices, and so paving the way to the truth. A similar defense of the fatih can be seen in Athenagoras, Justin Martyr, Clement of Alexandria, Origen, Tertullian, Arnobius, Lactantius, Augustine, Theodoret, Cyril of Alexandria, and so forth; in the medieval writers Thomas Against the Pagans and the other scholastics, if one with discretion and discernment takes the more solid excerpts; as well as Savonarola in The Triumph of the Cross; Raymond of Sabunde [d. 1436] in On Natural Theology; Cardinal Cusanus, Dionysius the Carthusian and others who wrote against the Muslims; and finally, more recent writers such as Louis Vives [d. 1540], Agostino Steuco [d. 1548], Charron [d. 1603], the scholastics who treat quaestiones and the commentators on Lombard and Thomas, but especially Du Plessis [Mornay] [1623] in his excellent treatise On the Truth of the Christian Religion. To this list we could add the adversaries of the Socinians whom we have already cited elsewhere [previously in the disputation].”

— Gisbertus Voetius, Willem J. van Asselt, Introduction to Reformed Scholasticism (RHB, 2011), Appendix 2, ‘The Use of Reason in Matters of Faith’, pp. 229-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+a+result%2C+our+faith+and+theology+can+be+called+completely+rational%2C+not+in+that+it+a+priori+demonstrates+its+truth+necessarily+with+arguments+in+opposition+to+those+who+deny+the+basic+assumptions+of+the+Christian+religion%2C+but+in+that+it+demonstrates+its+conclusions+from+the+authority+of+Scripture+and+with+arguments+derived+from+Scripture+in+opposition+to+those+who+accept+something+%5Baliquod%5D+of+the+things+that+are+revealed+in+a+divine+manner%3B+and+in+that+it+at+least+refutes+the+arguments+of+those+who+accept+nothing+of+it%2C+namely+those+arguments+by+which+they+charge+our+faith+with+contradiction+and+absurdity%2C+as+Thomas+%5BAquinas%5D+correctly+distinguishes+in+his+Summa+theologiae%2C+part+I%2C+quaestio+1%2C+article+8+%5B%E2%80%98Whether+Sacred+Doctrine+is+a+Matter+of+Argument%E2%80%99%5D.+Add+to+this+that+%5Breason%5D%2C+by+directly+attacking+false+theology%2C+consequently+and+indirectly+defends+true+theology%2C+that+is%2C+by+clearing+away+impediments+and+prejudices%2C+and+so+paving+the+way+to+the+truth.+A+similar+defense+of+the+fatih+can+be+seen+in+Athenagoras%2C+Justin+Martyr%2C+Clement+of+Alexandria%2C+Origen%2C+Tertullian%2C+Arnobius%2C+Lactantius%2C+Augustine%2C+Theodoret%2C+Cyril+of+Alexandria%2C+and+so+forth%3B+in+the+medieval+writers+Thomas+Against+the+Pagans+and+the+other+scholastics%2C+if+one+with+discretion+and+discernment+takes+the+more+solid+excerpts%3B+as+well+as+Savonarola+in+The+Triumph+of+the+Cross%3B+Raymond+of+Sabunde+%5Bd.+1436%5D+in+On+Natural+Theology%3B+Cardinal+Cusanus%2C+Dionysius+the+Carthusian+and+others+who+wrote+against+the+Muslims%3B+and+finally%2C+more+recent+writers+such+as+Louis+Vives+%5Bd.+1540%5D%2C+Agostino+Steuco+%5Bd.+1548%5D%2C+Charron+%5Bd.+1603%5D%2C+the+scholastics+who+treat+q

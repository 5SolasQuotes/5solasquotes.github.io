<main class="wrap"><figure class="quote" id="q-b073a00e1a" data-kw="">
<blockquote><p>Q. 90. What shall be done to the righteous at the day of judgment? A. At the day of judgment, the righteous, being caught up to Christ in the clouds,[e] shall be set on his right hand, and there openly acknowledged and acquitted,[f] shall join with him in the judging of reprobate angels and men,[g] and shall be received into heaven,[h] where they shall be fully and for ever freed from all sin and misery;[i] filled with inconceivable joys,[k]… [e] 1 Thess. 4:17. [f] Matt. 25:33. Matt. 10:32. [g] 1 Cor. 6:2,3. [h] Matt. 25:34,46. [i] Eph. 5:27. Rev. 14:13. [k] Ps. 16:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-f5230d0a73" data-kw="">
<blockquote><p>XII. The Adjuncts of good works are, their imperfection and their necessity nevertheless. … XV. Good works are necessary by the necessity of precept and of the means, but not by the necessity of the cause or merit. By the necessity of precept they are necessary, because the study of good works through all the Scriptures is most severely enjoined to us: They are necessary in regard of the means, because they are sure marks of Vocation, Election, and true Faith; and because they are the way and means to attain heavenly bliss: As if a man should make a journey from York to London to obtain an inheritance, the way or journey is them medium or means, but not the meriting cause or the inheritance; even so it is in this matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (d. 1629; London, 1660), Book 2, ‘Concerning the Worship of God’, Ch. 1, ‘Of the Nature of Good Works’, sections 12 &amp; 15, pp. 315-317</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

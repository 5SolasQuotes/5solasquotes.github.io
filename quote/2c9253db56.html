<main class="wrap"><figure class="quote" id="q-2c9253db56" data-kw="">
<blockquote><p>…so in like manner, God’s present visitation of our said burgh of Dundee by the plague, enforces the prorogation [discontinuation without being dissolved] of the said [General] Assembly [of the Church of Scotland] to some other time… …that the General Assembly is continued and prorogued to the last Tuesday of April… and betwixt and then, it may be hoped, that it may please God of his mercy to remove the said plague of pestilence.</p></blockquote>

</figure><figure class="quote" id="q-3b4d25d63d" data-kw="">
<blockquote><p>XV. (8) Next is the calumny [of Papists against the Reformed] concerning independency, in the church as well as in the state, which causes us to recognize no authority in the church and to be hostile to superior powers. But nothing could be said more unjustly and be more foreign to our religion… We leave independency to those who withdraw themselves from the jurisdiction of the magistrate [such as Romanists] and think they are raised so far above kings that their crowns depend upon them, which they can confer or take away at pleasure.</p></blockquote>

</figure><figure class="quote" id="q-888559a1bd" data-kw="">
<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-wigglesworth.html">Michael Wigglesworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day of Doom; or A Description of the Great and Last Judgment, with a short discourse about Eternity (London, 1666) This is an extended poem, and was written during the Great London Plague. | Wigglesworth was a puritan. Stanzas 139, 142, 211 &amp;</cite>, p. 91:</span></figcaption>

</figure><figure class="quote" id="q-fb097aeaa4" data-kw="">
<blockquote><p>Nor is it the restraining of him [a spiritual seducer] from personal liberty because of it [his false opinion]; but, because he doth not, nor will not use his personal liberty without prejudice to the whole body, which is to be preferred to him: even as a man, infected with the pestilence, ought justly to be restrained, though against his will; yet cannot that be accounted a restraint of just liberty; for, it is no just liberty to have liberty to hurt others.</p></blockquote>

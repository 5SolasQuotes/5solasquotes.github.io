<main class="wrap"><figure class="quote" id="q-f5c8ac4001" data-kw="">
<blockquote><p>It was a speech of Cyrus, speaking to his soldiers. The historian has this expression of his. It is the part of a true valiant man, either to live honourably, or die honourably, as one of them. But that is the part of a base coward — to be under any base servitude, rather than to be in any hazard of their lives, though perhaps their lives may be saved too. I remember Philo tells us, even of women (for in our times, the public cause of the Kingdom suffers exceedingly by the timorousness of the spirits of women), that being in danger of being brought into bondage by their enemies, they took their children and threw them into the rivers, with these words, You shall not serve; we would rather see you die than be slaves.

I commend not the fact, that it was done well, but to show what a spirit the heathen women had to see their children die, rather than have them bond-slaves. Indeed, what were our lives worth? Were they worth having, if we return to our bondage again? The utmost of the danger is our lives, the killing of our bodies; and yet we hope God will preserve them too. But suppose the worst, it is but death.

But if our lives should not be hazarded now, and if through base cowardice we should decline the cause of God, surely our lives would not be worth taking up. Living in that manner, is to live in bondage to these Cavaliers, notorious wretches, blasphemers of God himself, which would make our lives worth very little — no, it is your children perhaps to be brought up in popery, and to hold a candle to a mass priest at the altar. That may be the employment of your children if so be that they live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Duty in Times of Extremity</cite>, (1644) in idem, The Rare Jewel of Christian Contentment (London, 1651), pp 144-45.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-d2f0d8ac55" data-kw="">
<blockquote><p>Liberty, or human right, in its most exalted sense, consists in being maintained in the possession of whatever is secured to man by the Divine law. I do not say, whatever may be secured by the constitution and laws of a country, because these may be most unrighteous. The law of God is the standard by which all right must be tried; and in accordance with which constitutions of civil government and laws ought to be made.

No man can have a right to do what he pleases. This would not be liberty but licentiousness, and instead of promoting the happiness of a people would most certainly destroy it. The pleasure and the will of the powerful few would then be gratified at the expense of society generally, as has always been the case in despotic governments; and such must always be the case, where the Bible principles of civil government are set aside, however liberal the form of government may be. The moment that these principles are departed from, that moment a nation enters upon dangerous ground, and no human wisdom or foresight can possibly balance the machinery of government, so as to prevent encroachments on the rights of one part or other of the nation. Despotism on the one hand or anarchy on the other, must be the result.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive Principles of the Reformed Presbyterian Church</cite>, (Albany NY: J. Munsell, 1841), p. 242.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-592351cc17" data-kw="">
<blockquote><p>So on the other hand Pope Hildebrand‘s [d. 1085] violent decrees and edicts against married priests’ wives and masses introduced all manner of uncleanness, whoredom, adultery and sodomy itself amongst unmarried Popes, prelates, cardinals, clergymen, votaries of the Roman Church; yea and avowed toleration, patronage of whoredom, public stews, whores in Rome itself, together with an annual tribute to Popes and their officers both from whores and priests. Hence Johannis Andreat, Johannis de Aton and other canononists in their Gloss on Otho•s Constitutions, are not ashamed to publish: Videtur quod crimen Meretricii sub dissimulatione transire debet Ecciesia; Nam et Mareschallus Papae de facto exigit Tributum a Meretricibus, et hoc forte, ad ma•o malum ev•tandum non est culpandum. These public harlots, constituted Popes themselves before Hildebrand’s time, and in most ages since priests’ wives prohibited, they have been highly courted like princes and ladies even in Rome itself at noon-day, as well as in the night by disguised cardinals and clergymen; as Paul the 3rd, his own Cardinals thus informed him: In hac etiam urbe Meretrices, ut Matronae, incedunt per urbem, seu Mula vehuntur; quas affectantur de media die Nobiles, familiares Cardinalium, praesertim noctu: nulla in urbe videmus hanc corruptionem praeterquam in hac omnium exemplari: Habitant etiam insignes aedes; Yea Peter Martyr [Vermigli] adds: Vehuntur per publicum habitu Principum; Sedent in equis gradiariis, etc. Habent secum Torquatos &amp; Larvatos Comites, interdum etiam Cardinalium, praesertim noctu, &amp; ancilarum sumptuosissimam gregem. Nunc, O Deus bone, quomodo Romae coercentur Meretrices? Yea, to prevent the emperors and other kings punishing and reformation of these abuses, they exempted all clergymen from their tribunals, and the accusations of laymen, decreeing, that no cardinal should be convicted, condemned of adultery, whoredom, etc. but by 72 witnesses, no cardinal priest but by 64, no cardinal deacon or bishop but by 24, nor subdeacon or cardinal of inferior degree, nor bishop but by 7 witnesses at least. And those would be more than impudent, who durst commit whoredom, adultery, or sodomy in the open view of so many priests or clergymen; or yet of laymen, though disabled to accuse them by their canons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Chronological History &amp; Full Display of Popes’ Intollerable Usurpations upon the ancient just rights, liberties, of the kings, kingdoms, clergy, nobility, commons of England &amp; Ireland</cite>, (1666), bk. 1, ch. 5, p. 289</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

— William Prynne, An Exact Chronological History &amp; Full Display of Popes’ Intollerable Usurpations upon the ancient just rights, liberties, of the kings, kingdoms, clergy, nobility, commons of England &amp; Ireland, (1666), bk. 1, ch. 5, p. 289">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+on+the+other+hand+Pope+Hildebrand%E2%80%98s+%5Bd.+1085%5D+violent+decrees+and+edicts+against+married+priests%E2%80%99+wives+and+masses+introduced+all+manner+of+uncleanness%2C+whoredom%2C+adultery+and+sodomy+itself+amongst+unmarried+Popes%2C+prelates%2C+cardinals%2C+clergymen%2C+votaries+of+the+Roman+Church%3B+yea+and+avowed+toleration%2C+patronage+of+whoredom%2C+public+stews%2C+whores+in+Rome+itself%2C+together+with+an+annual+tribute+to+Popes+and+their+officers+both+from+whores+and+priests.+Hence+Johannis+Andreat%2C+Johannis+de+Aton+and+other+canononists+in+their+Gloss+on+Otho%E2%80%A2s+Constitutions%2C+are+not+ashamed+to+publish%3A+Videtur+quod+crimen+Meretricii+sub+dissimulatione+transire+debet+Ecciesia%3B+Nam+et+Mareschallus+Papae+de+facto+exigit+Tributum+a+Meretricibus%2C+et+hoc+forte%2C+ad+ma%E2%80%A2o+malum+ev%E2%80%A2tandum+non+est+culpandum.+These+public+harlots%2C+constituted+Popes+themselves+before+Hildebrand%E2%80%99s+time%2C+and+in+most+ages+since+priests%E2%80%99+wives+prohibited%2C+they+have+been+highly+courted+like+princes+and+ladies+even+in+Rome+itself+at+noon-day%2C+as+well+as+in+the+night+by+disguised+cardinals+and+clergymen%3B+as+Paul+the+3rd%2C+his+own+Cardinals+thus+informed+him%3A+In+hac+etiam+urbe+Meretrices%2C+ut+Matronae%2C+incedunt+per+urbem%2C+seu+Mula+vehuntur%3B+quas+affectantur+de+media+die+Nobiles%2C+familiares+Cardinalium%2C+praesertim+noctu%3A+nulla+in+urbe+videmus+hanc+corruptionem+praeterquam+in+hac+omnium+exemplari%3A+Habitant+etiam+insignes+aedes%3B+Yea+Peter+Martyr+%5BVermigli%5D+adds%3A+Vehuntur+per+publicum+habitu+Principum%3B+Sedent+in+equis+gradiariis%2C+etc.+Habent+secum+Torquatos+%26+Larvatos+Comites

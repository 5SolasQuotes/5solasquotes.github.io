<main class="wrap"><figure class="quote" id="q-8116813603" data-kw="">
<blockquote><p>And thus for the Judicial Laws, because they were given to them as a politic body, that polity ceasing, which was the principal, the accessory falls with it; so that the Ceremonial Law, in the judgement of all, had still bound Christians, were there not special revocations of these commands, and were there not reasons for their expiration from the very nature of them. Now no such thing can be affirmed by the Moral Law; for the matter of that is perpetual, and there are no places of Scripture that do abrogate it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 168</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-65f336f864" data-kw="">
<blockquote><p>Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent: 1. In that it is a foundation of the other laws, and they are reducible to it. 2. This was to abide always, not the other. 3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-2ba957fe02" data-kw="">
<blockquote><p>The Law is natural to man. God has engraven it in his heart from creation (Rom 1:32; 2:14,15). When, a long time afterwards, God made and exhibited the two Tables of the Law, this was not to make a new law, but only to restore our first knowledge of the natural law which, because of the corruption of sin, was little by little becoming obliterated from the heart of man (Rom 7:8-9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (Focus Christian Ministries Trust, East Essex England, 1992)</span></figcaption>

</figure><figure class="quote" id="q-dd27223d60" data-kw="">
<blockquote><p>Question 9: Is a man ever bound to accuse himself, and seek justice against himself? Answer 1: In many cases a man is bound to punish himself: As when the law against swearing, cursing or the like, does give the poor a certain mulct [fine] which is the penalty: He ought to give that money himself: And in cases where it is a necessary cure to himself: And in any case where the public good requires it: As if a magistrate offend whom none else will punish, or who is the judge in his own cause: he should so far punish himself as is necessary to the suppression of sin, and to the preserving of the honor of the laws: As I have heard of a justice that swore twenty oaths, and paid his twenty shillings for it. 2. A man may be bound in such a divine vengeance or judgment as seeks after his particular sin, to offer himself to be a sacrifice to justice, to stop the judgement: As Jonah and Achan did. 3. A man may be bound to confess his guilt and offer himself to justice to save the innocent, who is falsely accused and condemned for his crime. 4. But in ordinary cases a man is not bound to be his own public accuser or executioner. Question 10: May a witness voluntarily speak that truth which he knows will further an unrighteous cause, and be made use of to oppress the innocent? Answer: He may never do it as a confederate in that intention: Nor may he do it when he knows that it will tend to such an event (though threatened or commanded) except when some weightier accident does preponderate for the doing it (as the avoiding of a greater hurt to others than it will bring on the oppressed, etc.). Question 11: May a witness conceal some part of the truth? Answer: Not when he swears to deliver the whole truth: nor when a good cause is like[ly] to suffer, or a bad cause to be furthered by the concealment: nor when he is under any other obligation to reveal the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>

<blockquote><p>7. They hold, that the oath ex officio [out of duty], whereby Popish and English ecclesiastical governors, either upon some secret informations or suggestions, or private susicions go about to bind men’s consciences to accuse themselves and their friends of such crimes or imputations as cannot by any direct course of law be proved against them, and whereby they are drawn to be instruments of many heavy crosses upon themselves and their friends, and that often for those actions that they are persuaded in their consciences are good and holy: I say that they hold that such an oath (on the urger’s part) is most damnable and tyrannous, against the very law of Nature, devised by Antichrist, through the inspiration of the Devil; that by means thereof the professors and practicers of the true religion might either in their weakness, by perjury damn their own souls or be drawn to reveal to the enemies of Christianity those secret religious acts and deeds, that being in the persuasion of their consciences for the advancement of the Gospel, will be a means of heavy sentences of condemnation against themselves and their dearest friends.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3b7a0b98ee" data-kw="">
<blockquote><p>We say that it is a superstition to esteem one day more holy than another, or to think that to abstain from labour is something which, in itself, pleases God (Rom 14:5, 6; Col 2:16, 17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us no Judaistic ceremony or stupid superstition. That is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early Church (1 Cor 16:2; Acts 20:7; Rev 1:10). As for other festival days, we have removed them as much as possible from us, especially those which have been introduced through manifest idolatry. We have done this so as to correct the innumerable abuses which flowed from such, and to relive the poverty of many. Nevertheless, because there are certain festivals devoted, since ancient times, to the celebration of the mysteries of concerning our redemption, we use Christian liberty, and submit all to to edification, according to the different circumstances of places, times and persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith (1559), trans. James Clark (East Sussex, UK: Focus Christian Ministries Trust, n.d.), 107–08.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13c402cc4e" data-kw="">
<blockquote><p>We have here a full revelation of God’s favour to David and the kind intentions of that favour, the notices and assurances of which God sent him by Nathan the prophet… David’s purpose to build God a house is superseded. God took notice of that purpose, for he knows what is in man; and He was well pleased with it, as appears 1 Kings 8:18, Thou didst well that it was in thy heart; yet he forbade him to go on with his purpose (2 Sam. 7:5): “Shalt thou build me a house? No, thou shalt not (as it is explained in the parallel place, 1 Chron. 17:4)… That worship only is acceptable which is instituted; why should David therefore design what God never ordained? Let him wait for a warrant, and then let him do it. Better a tent of God’s appointing than a temple of his own inventing… God was not indebted to him for his good intentions, but, whatever he did for God’s honour, God was beforehand with him, 2 Samuel 7:8, 9… Blessings are entailed upon the family and posterity of David. David had purposed to build God a house, and, in requital, God promises to ‘build him a house,’2 Samuel 7:11. Whatever we do for God, or sincerely design to do though Providence prevents our doing it, we ‘shall in no wise lose our reward.’ He had promised to make him a name (2 Sam. 7:9); here he promises to make him a house, which should bear up that name… Though David came short of making good his purpose to build God a house, yet God did not come short of making good his promise to build him a house. Such is the tenour of the covenant we are under; though there are many failures in our performances, there are none in God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible | on 2 Samuel, ch. 7, vv. 4-17</cite></span></figcaption>

</figure><figure class="quote" id="q-19f44e6044" data-kw="">
<blockquote><p>Some make a mockery of the holy things of God. One part of the year they will be holy; a rotten, foolish affection of people that are popish. In Lent they will use a little austerity, oh! they will please God wondrously! but before and after they are devils incarnate. So they make that part of the year as a good parenthesis, in an unlearned and unwitty speech. A good parenthesis is unseemly in a wicked speech, and a good piece is unseemly in a ragged garment; so their lives that make a good show then (and there are few that do so, they are scarce among us; men are such atheists that there is not outward reformation, but if there be), if they give themselves leave to be civil, and to respect holy things a little time, afterward they return to their looseness again. Doth this patching out of a holy life please God? No, no! ‘I have sworn, and I will perform it, that I will keep thy righteous statutes,’ saith David, Ps. 119:106. And St Paul, ‘I have resolved to be so to the end;’ I will be myself still. So where grace is, there is a resolution against all sin for the time to come. If you entertain not this resolution, to walk ‘in holiness and righteousness all the days of your life,’ Luke 1:75, acknowledge no benefit by Christ’s redemption, and come not near the holy things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes, vol. 3 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1862), 313.</cite></span></figcaption>

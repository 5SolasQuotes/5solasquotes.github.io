<main class="wrap"><figure class="quote" id="q-799f13c312" data-kw="">
<blockquote><p>For though natural reason has some knowledge of God and of the faith; in spite of this, she is darkened because of sin, and has not knowledge of the Gospel of the Son of God our Lord Jesus Christ, by whom we obtain by faith true justice and salvation. Seeing, therefore, that the darkness of the human intellect is so great, it is necessary that Parents take care to teach their children the Catechism from their youth. …

From these [created] things we naturally know that there is a God. Because when we see the greatness, the beauty, the order and organisation of the things of this world, the admirable turning and changing of the monuments [perhaps movements] of the heavens and of time, it seems evident to us that there is a divine spirit and intellect which governs all these things. …

Human reason naturally knows some things of God, so much so that the Gentiles called God τὸν ἀγαθὸν, which means Good … And they spoke thus of God, because he is the author of all good. But, because human reason, due to the great temptations, allows itself to be shaken by Satan from this knowledge of God, it is, therefore, necessary that we be armed with the testimonies of the Holy Spirit. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Le Catechism</cite>, (Tubingue, 1563), pp 12, 57, 62. Translated in David Haines, ‘The Use of Aquinas in Early Protestant Theology’ in idem, Without Excuse: Scripture, Reason, and Presuppositional Apologetics (Lincoln NE: The Davenant Press, Kindle Edition, 2020), pp 219, 220-21.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-094b574bde" data-kw="">
<blockquote><p>…the Fifth Way, at least as developed by later Thomists, does indeed plausibly get us to a divine intelligence. By contrast, Paley’s argument is often acknowledged to get us at best to a designer who is extremely powerful and and intelligent, but who for all we know may yet be finite and, thus non-divine. But it is not just that Paley’ s designer may be something other than God as Aquinas understands Him. There is reason to think that Paley’s designer could not be God as Aquinas understands Him. For Aquinas, when we predicate attributes of God, we necessarily do so analogously rather than univocally. But Paley is evidently predicating attributes to his designer and to us in a univocal way, which (for the Thomist at least) entails a radically deficient conception of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147, p. 83</span></figcaption>

</figure><figure class="quote" id="q-d9312c1d79" data-kw="necessity scripture">
<blockquote><p>Three things particularly prove the necessity of the Scripture: (1) the preservation of the word; (2) its vindication; (3) its propagation. It was necessary for a written word to be given to the church that the canon of true religious faith might be constant and unmoved; that it might easily be preserved pure and entire against the weakness of memory, the depravity of men and the shortness of life; that it might be more certainly defended from the frauds and corruptions of Satan; that it might more conveniently not only be sent to the absent and widely separated, but also be transmitted to posterity. For by “letters,” as Vives well observes, “all the arts are preserved as in a treasury, so that they can never perish, while on the contrary, tradition by the hand is unhappy” (De disciplinis … de Corruptis Artibus 1 [1636], p. 5). This is a divine and wonderful advantage of letters, as Quintilian says, “that they guard words and deliver them to readers as a sacred trust” (Institutio Oratoria 1.7.31 [Loeb, 1:144–45]). Nor for any other reason are the public laws, statutes and edicts of kings and the decrees of the commonality inscribed upon brass or committed to public tablets, except that this is the most sure method of preserving them uncorrupted and of propagating through many ages the remembrance of those things which it is important for the people to know.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.2.6</span></figcaption>

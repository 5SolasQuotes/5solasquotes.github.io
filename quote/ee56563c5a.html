<blockquote><p>Christ knocks at the door of thy heart, O sinner. Though invisible to mortal eyes, He is here, whether you regard it or not. He knocks. But how? By his Word—by a preached gospel—by the admonitions of conscience—and by the strivings of his Spirit. Nor is this all. He calls. “Unto you O men, I call, and my voice is unto the sons of men.” [Prov. 8] He calls by all the invitations of mercy contained in the Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton</cite>, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, p. 297</span></figcaption>

<blockquote><p>…in the Revelation that Ecce venio [‘Behold, I come’] (Rev. 16:15) tells us the King of Glory is not far off. O then (as it is in the Psalm) ‘Lift up yourselves ye everlasting gates, that the King of Glory may enter in.’ (Ps. 24:7) The heart is the gate at which Christ must enter, ’tis the fort, the citadel which He would have yielded into his possession, ‘My son give me thy heart (Prov. 23:26); Let us therefore prepare our hearts for the entertainment of so great a guest, that so our souls may hold the same course hereafter which our prayers here do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-king.html">Henry King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Lord’s Prayer delivered in Certain Sermons</cite>, … (London: Haviland, 1628), ‘Thy Kingdom Come’, p. 129 King (1592-1669) was an Anglican bishop and poet.</span></figcaption>

</figure><figure class="quote" id="q-daba0d7595" data-kw="">
<blockquote><p>He knocks, to awaken us to come and let Him in, knocks by his Word and Spirit, knocks by afflictions and by our own consciences; though this is not expressly quoted, yet probably it is referred to (Rev. 3:20), ‘Behold, I stand at the door, and knock.’ He calls sinners into covenant with Him and saints into communion with Him… … III. The excuse she made to put off her compliance with this call (Song 5:3): ‘I have put off my coat; how shall I put it on again?’ She is half asleep; she knows the voice of her beloved; she knows his knock, but cannot find in her heart to open to Him… Making excuses (Lk. 14:18) is interpreted making light of Christ (Mt. 22:5), and so it is. Those put a great contempt upon Christ that cannot find in their hearts to bear a cold blast for him, or get out of a warm bed. IV. The powerful influences of divine grace, by which she was made willing to rise and open to her beloved. When He could not prevail with her by persuasion He put in his hand by the hole in the door, to unbolt it, as one weary of waiting, Song 5:4. This intimates a work of the Spirit upon her soul, by which she was unwilling made willing, Ps. 110:3. The conversion of Lydia is represented by the opening of her heart (Acts 16:14) and Christ is said to open his disciples’ understandings, Lk. 24:45. He that formed the spirit of man within him knows all the avenues to it, and which way to enter into it; he can find the hole of the door at which to put in his hand for the conquering of prejudices and the introducing of his own doctrine and law. He has the key of David (Rev. 3:7), with which He opens the door of the heart in such a way as is suited to it, as the key is fitted to the wards of the lock, in such a way as not to put a force upon its nature, but only upon its ill nature. V. Her compliance with these methods of divine grace at last: ‘My bowels were moved for Him.’ The will was gained by a good work wrought upon the affections: My bowels were moved for Him, as those of the two disciples were when Christ made their hearts to burn within them. She was moved with compassion to her beloved, because his head was wet with dew. Note, Tenderness of spirit, and a heart of flesh, prepare the soul for the reception of Christ into it… Note, When we apply ourselves to our duty, in the lively exercises of faith, under the influence of divine grace, we shall find it will go on much more readily and sweetly than we expected. If we will but rise up, to open to Christ, we shall find the difficulty we apprehended in it strangely overcome, and shall say with Daniel, ‘Now let my Lord speak, for thou hast strengthened me,’ Dan. 10:19… Those that open the doors of their hearts to Christ, those everlasting doors, must meet Him with the lively exercises of faith and other graces, and with these must anoint Him. … 1. She did not open to Him at his first knock, and now she came too late, when afterwards she would have inherited this blessing. Christ will be sought while He may be found; if we slip our time, we may lose our passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, On Song 5, verses 2-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-fccad8979c" data-kw="word and Spirit means">
<blockquote><p>Thus the Spirit is indeed rightly said not to work without the word, but not by the word only, but immediately and distinctly from the word. The movement of efficacious grace is properly to be called neither physical nor ethical, but supernatural and divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.4.17–18</span></figcaption>

</figure><figure class="quote" id="q-12412e837b" data-kw="">
<blockquote><p>For if we give not entrance to Christ, all this will be a further aggravation of our damnation. How will this justify the sentence upon us hereafter, when Christ shall set us on the left hand (Mt. 25) and say: ‘Depart from Me [Mt. 7], for I invited you to come to Me, I knocked at the door of your hearts, and you would give Me no entrance. ‘Depart from us,’ said you; Therefore now depart you from Me.’ What do profane persons in the Church, but bid Christ depart from them, especially in the motions of his Spirit; they entertain Him in the outward room, the brain; they know a little of Christ, but in the heart, the secret room, He must not come there to rule. Is it not equal that He should bid us (Mt. 23:41), ‘Depart ye cursed I know you not? You would not give entrance to Me, I will not now to you.’ As to the foolish virgins He speaks and, Prov. 1:28, wisdom knocks and has no entrance, therefore in times of danger, they call upon her, but she rejoices at their destruction; Where God magnifies his mercy in this kind in sweet allurements and inviting by judgments, mercies, ministry and Spirit, He will magnify his judgment after. Those that have neglected Heaven with the prerogatives, and advantages in this kind, they shall be cast into Hell. ‘Woe to thee Chorazin,’ etc. as you know in the Gospel (Mt. 11:21). This is one thing that may humble us of this place and nation, that Christ has no further entrance, nor better entertainment after so long knocking? For the entertaining of his Word is the welcoming of Himself, as it is, Col. 3:16, ‘Let the word of God dwell plentifully in you,’ and ‘Let Christ dwell in your hearts by faith.’ Eph. 3:17. Compare those places, Let the Word dwell plenteously in you by wisdom, and let Christ dwell in your hearts by faith. For then does Christ dwell in the heart when the truth dwells in us. Therefore what entertainment we give to his truth, we give to Himself. Now what means of knocking has He not used among us a long time? For works of all sorts, He has drawn us by the cords of a man, by all kind of favors. For mercies, How many deliverances have we had (No nation the like; we are a miracle of the Christian world) from foreign invasion and domestical conspiracies at home? How many mercies do we enjoy? Abundance together with long peace, and plenty. Besides, if this would not do, God has added corrections with all these, in every element, in every manner, infection in the air, judgments in inundations; we have had rumors of wars, etc. threatenings, shakings of the rod only, but such as might have awaked us; And then He has knocked at our hearts by the example of other nations. By what He has done to them, He has showed us what He might justly have done to us; we are no better then they.</p></blockquote>

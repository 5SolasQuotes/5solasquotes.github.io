<main class="wrap"><figure class="quote" id="q-86f1b7b339" data-kw="">
<blockquote><p>Yea and the Christian king rules over men as men, and also as Christian-men; he rules over them as men, with a dominion over their bodies, lives and goods by his civil laws, he has also dominion as king over men, as Christians and members of Christ’s kingdom and Church, not over their consciences (for that is proper only to the Father of spirits), but he has a coactive [coercive] power over all men, even pastors, as to cause them do their Christian duties, he has power to compel Church-men in assemblies to determine truth, and to use the keys right, and to preach and use the sacraments according as Christ has commanded in his Word, and to punish them when they do otherwise. … I answer, the infallible rule of judging for both [Church and State] is the Word of God, which speaks home impartially to both, if they will hear, but certainly the king’s civil, kingly coactive power to compel men to do their duty remains the highest and most supreme power on earth, in genere potestatis politicae, in ‘the kind of politic-power’, and pastors and all men may by this power be compelled to do right; as for the abuse of the power, it is no part of the power; and in this kind the king has a negative-politic and kingly suffrage [vote] and voice in all Church assemblies, no ecclesiastical constitution has the force of a [civil] law without the politic suffrage of the civil judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 19, ‘…as about… the King’s Power in Things Ecclesiastical’, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6f79cad8b" data-kw="">
<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’</cite>, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</span></figcaption>

</figure><figure class="quote" id="q-cc61a43d00" data-kw="">
<blockquote><p>October 31, 1798… I have just passed through the most awful scene of epidemic sickness and mortality that I ever witnessed. The Yellow Fever has been raging in the city for more than two months past. From the middle to the 25th of this month was the most mortal time. Though the city was deserted by, perhaps, two-thirds of its regular inhabitants, more than two thousand persons fell victim to the disease. I remained with a brother — a beloved brother — a practitioner of medicine — a bachelor as well as myself. We were both mercifully borne through the raging epidemic without any serious attack. Our housekeeper died of it, and I attended her funeral between midnight and day. To attempt to describe the scenes of mourning and horror which this epidemic presented — I dare it. The task transcends my power of expression. I preached every Sabbath; but only a few attended public worship; and I know not that any sensible — certainly no conspicuous — good was done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Samuel Miller, Jr., The Life of Samuel Miller, D.D. LL.D</cite>, Vol. 1, p. 118</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-333d8504f1" data-kw="">
<blockquote><p>At the very least, Londoners were by this time divided regarding whether or not to attend church during plague visitations. The government ordered theaters and markets closed during outbreaks, parliament was prorogued [discontinued without being dissolved], and the idea of coming together, even for worship, ran counter to contagion theory, which was gaining traction.</p></blockquote>

<blockquote><p>1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, on the 6th Commandment</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.”

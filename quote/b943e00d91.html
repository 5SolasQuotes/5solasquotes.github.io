<main class="wrap"><figure class="quote" id="q-b943e00d91" data-kw="">
<blockquote><p>Thesis XX. Whence it appears not only that all and every heir of Adam is universally corrupt, but also totally corrupt, namely both with respect to the soul, and with respect to the body, and finally with respect to the whole composite being. For it should not be thought as if only the body were corrupt, or even only the soul, but the whole man, as great as he is, is corrupt. For just as the image of God was not in the soul alone, nor even in the body alone, but in man and therefore in the whole composite, so also this original sin should be attributed not only to the soul and body, but to the whole composite consisting of soul and body; which can be best gathered from the opposite, regeneration, which pertains not to one or the other part of man, but to the whole man. … Thesis XXII. That the soul is corrupt is, alas, sufficiently clear from the depravation both of the intellect, which, although it may discern something in matters contributing to the convenience of civil life, yet in spiritual matters pertaining to the true worship of God and the salvation of our soul, it is not so much dim-sighted as blind, unless the Lord gives a mind to understand, eyes to see, etc. For its wisdom is enmity against God, holding those things which are of the Spirit of God for foolishness. And although worldly men sometimes understand something, yet they have it not from flesh and blood, but from the revelation of God the heavenly Father. Then of the will, which is placed in the same plight as the intellect. For original sin has so depraved the will that it in no way wills the spiritual good, namely, neither with respect to substance, nor with respect to manner, that is, from faith and for the glory of God. Whence the heart of man is not undeservedly called fraudulent, hardened, whose imagination is evil from his youth. Thesis XXIII. The body is so corrupt that, first in general, our members present themselves as weapons of unrighteousness for sin; then in particular, the mouth is full of curses and bitterness; the tongue is deceitful and the lips are filled with the venom of asps; the throat is an open sepulcher; the eyes are either lustful and evil; the hands are ready for theft; the belly is a god; the knees are bent to idolatry; the feet are swift to shed innocent blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), pp. 9-10 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>

<blockquote><p>…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-seals.html">Zachary Seals</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beatific Vision</cite>, vol. 82, no. 1 (April 2023), pp. 3-12</span></figcaption>

ncies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§XIII. The special subject, as to man, is either of denomination or the subject which, and this is the whole man; or of inhesion or the subject by which, and this, the remote and mediate, is the soul of man; the proximate and immediate is formally the will; but the intellect, according to Thomas, is so radically; according to Scotus, better, antecedently: because with Scotus and Henricus Gandavensis as authorities, the name of root signifies a true cause, but the intellect is not the true cause of the liberty of the will; but only the antecedent and the condition without which there would not be liberty in the will. … §XVIII. The object of free will is τὰ πρακτὰ, agibilia (doable things), proposed and shown to the will by the intellect. For the will is not borne toward the unknown: nor is anything willed, unless it is first known. Whence that trite saying: Of the unknown there is no desire. Therefore the intellect is not indeed properly the root of liberty, since root signifies a true cause, but causality cannot be attributed to the intellect with respect to liberty; but it is the antecedent and the condition without which the will would not choose freely; whence the will is called the rational appetite, since on the contrary the appetite in brutes is not free, because it is not rational. Nor yet is it always necessary for desiring an object that the intellect should practically judge that the proposed object is to be chosen, but sometimes a simple apprehension of the object as good suffices; which has its place before all others in the movements of the will which they call the very first, and which happen without deliberation.</p></blockquote>

<blockquote><p>I had never read one Socinian, nor much of any Arminians… and I remembered two or three things in Dr. [William] Twisse (whom I most esteemed) which inclined me to moderation in the five Articles [disputed between Arminians and the Reformed]: …

2. That he reduces all the decrees to two, de fine et de mediis [of the end and of the means], as the healing way.

3. That he professes that Arminius and we and all the Schoolmen are agreed that there is no necessity consequentis laid on us by God in predestination, but only necessity consequentiae, or [a] logical [necessity] (but in election I shall here suspend)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

<blockquote><p>5. In what sense is this inability absolute, and in what sense natural, and in what sense moral? … 4th. It is not natural in another sense, because it does not result in the least from any constitutional deficiency in human nature as it now exists as to its rational and moral faculties of soul. 5th. This inability is purely moral, because while every responsible man possess all moral as well as intellectual faculties requisite for right action, the moral state of his faculties is such that right action is impossible. Its essence is in the inability of the soul to know, love, or choose spiritual good, and its ground exists in that moral corruption of soul whereby it is blind, insensible, and totally averse to all that is spiritually good.</p></blockquote>

<blockquote><p>Q. 1. What makes the difference between effectual and ineffectual calling? A. Ineffectual calling is when men have nothing but the external sound of the Gospel. Mt. 20:16, ‘For many be called, and few chosen.’ Effectual is, when the Spirit works in conjunction with the Word. Jn. 6:45: ‘It is written in the prophets, ‘And they shall be all taught of God;’ every man therefore that has heard, and has learned of the Father, comes unto Me.’ … Q. 11. What is the third instruction? A. It is dangerous to refuse God’s call. Prov. 1:24, ‘Because I have called, and ye refused; I have stretched out my hand and no man regarded.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the</cite>, [Westminster] Assembly’s Catechism... (London: Cockerill, 1682), ‘Of Effectual Calling’, pp. 67-68</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

<blockquote><p>2. Touching the second difference, which is their vocation or calling, we must note that there is a twofold calling, vel [either] 1. Inefficaciter, formally, or effectually[?]. 2. efficaciter, formally, or effectually. The 1. is outwardly: the 2. is inwardly. The 1. general: the 2. special. Of the first, our Savior says ‘Many are called, but few are chosen.’ (Mt.) Of the second, the apostle says, ‘whom He has predestinated, them He calls,’ (Rom. 8) i.e. effectually. Now touching the outward calling, we must note that as many are called, so He calls them many ways, especially: 1. By the painful preaching of his Word. 2. By the manifold benefits of his grace. 3. By the manifest judgments of his anger. De [concerning] 1. God gave his Word, and great were the number of the preachers (God calls us diverse ways. Ps. 68:11), and He commanded them to preach unto all nations; and so their sound went unto all lands, to all countries, to all places, but especially to this place, where there are painful men, learned men that do often preach and continually call; and yet I fear their preaching is unrespected, I am sure themselves are unregarded… … … 2. God seeks to draw men unto Him in the chains of love, when He gives unto them, beneficia nimis copiosa multa, et magna, et privata, et positiva, many and great blessings, thereby to allure them unto his service. 3. If men will not turn, nor answer to the first and second call, then will He whet his glittering sword and his hand shall take hold of vengeance, He will pour out the vial of his wrath, thereby to convert them or confound them: and no marvel, for debet amor laesus irasci, love too much provoked must wax angry. All these ways has God called us: the preachers cried, and do cry and call continually, his blessings have been manifold and his judgments have been manifested in some measure upon our nation. O then let us take heed unto ourselves and not harden our hearts any longer, but let us hearken unto his voice, lest He swear in his wrath that we shall not enter into his rest. But indeed all these kinds of outward callings are but in vain, and bring no benefit unless the Lord calls us inwardly by his Spirit, for: 1. Nisi spiritus adsit cordi audientis, inanis est labor docentis (‘In vain is all outward calling, unless we be inwardly called by God’s Spirit.’ Gregory, Homily 30, Super Evangel.): In vain do we preach unto your ears, unless the Spirit of God does open your hearts, as He did the heart of Lydia, that you may believe our preaching, as she did the preaching of Paul. 2. All the blessings of the world will but puff us up with pride (as they did the Israelites, as Moses shows, dilectus meus impinguatus calcitrauit, my beloved, fatted and enlarged, spurned with his heels) unless God does give us the grace to use those blessings to the glory of his name. 3. All punishments and all judgments will sooner work desperation than conversion in a sinful soul, unless the grace of God work true humility in us, to make a right use of his fatherly chastisements. And this experience daily shows: First, the Word is preached, the one believes, the other refuses it. Secondly, God bestows his blessings upon men, the one is puffed up with pride, the other is truly thankful. Thirdly, God sends his judgments, the one grows desperate with Saul, the other is humbled with David. And what is the cause of this? to the one sort, He sends his messengers only to call them outwardly, to the other sort He sends his Spirit and gives his grace to make them yield unto his calling: and this effectual calling of the saints to believe the Gospel and to obey the voice of God is the effect and fruit of the love of God. Whensoever therefore we be outwardly called by what way or means soever it be, let us presently pray to God that He would inwardly work in our hearts to incline them to yield unto his calling, else will the outward calling bring no benefit, but only make us without excuse. And so much of their vocation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints</cite>, … (London: Butter, 1622), pt. 1, pp. 85-90 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</span></figcaption>

+sends+his+Spirit+and+gives+his+grace+to+make+them+yield+unto+his+calling%3A+and+this+effectual+calling+of+the+saints+to+believe+the+Gospel+and+to+obey+the+voice+of+God+is+the+effect+and+fruit+of+the+love+of+God.+Whensoever+therefore+we+be+outwardly+called+by+what+way+or+means+soever+it+be%2C+let+us+presently+pray+to+God+that+He+would+inwardly+work+in+our+hearts+to+incline+them+to+yield+unto+his+calling%2C+else+will+the+outward+calling+bring+no+benefit%2C+but+only+make+us+without+excuse.+And+so+much+of+their+vocation.%E2%80%9D%0A%0A%E2%80%94+William+Gryffith%2C+The+Delights+of+the+Saints%E2%80%A6+%28London%3A+Butter%2C+1622%29%2C+pt.+1%2C+pp.+85-90+Gryffith+%28c.1589%E2%80%931672%29+was+an+Anglican+bishop%2C+opposed+to+the+puritans.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44359a8ca7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44359a8ca7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-calling/#:~:text=2.%20Touching%20the%20second%20difference%2C%20which,And%20so%20much%20of%20their%20vocation&amp;text=2.%20Touching%20the%20second%20difference%2C%20which%20is%20their&amp;text=without%20excuse.%20And%20so%20much%20of%20their%20vocation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fifthly, if thou art a holy person, if thou art one that hast that real holiness without which there is no happiness, then know for thy comfort, that thy holiness is a glorious witness and evidence of thy effectual vocation, 1 Pet. 1:15, ‘As He who hath called you is holy, so be ye holy in all manner of conversation.’ Many are externally called that are not internally called, and many are ineffectually called that are not effectually called. But now real holiness that speaks out an internal call, an effectual call, a call out of darkness into marvelous light… The Author of this call is a holy God; our holy calling depends upon the purpose of God, the power of God, and the grace and good pleasure of God; the means of our holy calling are the Spirit of God and the Word of God; and the ends of our calling are holiness and the glory of God.</p></blockquote>

</figure><figure class="quote" id="q-d9eee47935" data-kw="">
<blockquote><p>2. God’s gracious invitation of lost sinners to Christ, which properly is his calling them, is either external or internal; external by the word, internal by his Spirit. [1.] External, by the commands and promises of the word, requiring such duties from them, and assuring them of such blessings upon obedience. Thus Wisdom’s maidens are sent forth to invite guests to her palace, Prov. 4:2; and the king’s servants to call them to the marriage-feast, Matt 22:9; and so far they prevail in their message, that many present themselves. God would not leave us to a book, but has appointed a living ministry, 2 Cor. 6:10. [2.] Internal, not only by the word, but by his Spirit, and the checks of their own conscience, which is a nearer approach of his grace and power to us. By the motions of his Spirit; how else could it be said, Gen. 6:3, ‘My Spirit shall not always strive with man’? and Acts 7:51, ‘Ye do always resist the Holy Ghost’? And also by their consciences soliciting them to the performance of their duty, and challenging them for the neglect of it. It is natural duty: Rom. 2:14,15, ‘The Gentiles do by nature the things contained in the law; these, having not the law, are a law to themselves, which show the works of the law written in their hearts; their consciences also bearing witness, and their thoughts in the meanwhile accusing or excusing one another.’ And for acceptance of the gospel-covenant: 1 John 3:20,21, ‘If our heart condemn us, God is greater than our heart and knows all things; if our heart condemn us not, then have we confidence towards God.’ 3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, (d. 1677; London: J. Nisbet, 1870), vol. 12, Sermons Upon Romans 8, Sermon 8, p. 288</span></figcaption>

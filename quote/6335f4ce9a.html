<main class="wrap"><figure class="quote" id="q-6335f4ce9a" data-kw="">
<blockquote><p>It may be said that if the Scripture thus evidence itself to be the word of God, as the sun manifests itself by light… or as the first principles of reason are evident in themselves without further proof or testimony, then every one and all men, upon the proposal of the Scripture unto them, and its own bare assertion that it is the word of God, would necessarily on that evidence alone, assent thereunto, and believe it so to be. But this is not so: all experience Iies against it, nor is there any pleadable ground of reason that so it is, or that so it ought to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | On the necessary role of natural and rational evidence in faith, contra Fideism, see the first half of ch. 6, ‘The Nature of Divine Revelations. Their Self-Evidencing Power Considered…’ The opening paragraph of the chapter states the objection of Fideism (below); Owen then proceeds in the rest of the chapter to refute it in a very careful, meticulous and helpful way.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe81a52281" data-kw="">
<blockquote><p>Belief was at first defined to be an assent to things known by revelation: but now ye are further to know that all assent is not of the same kind and degree, but differs according to the diversity of the objects assented unto. Therefore we must observe, that of the objects of belief: 1. Some are represented unto us only as true and good in themselves, without any special relation to our benefit and commodity. Unto such things, whether past, present or to come, the understanding and will of man do yield that common assent and approbation whereby they allow of the truth and goodness of everything that is apprehended by them as true and good in what kind soever it be. This is called a bare assent, or credulitas, belief in strict terms, when we only believe tis good and true, and go no further. 2. Some are revealed unto us not only as true and good in themselves, but more specially as containing some excellent truth and goodness that concerns us in regard of some benefit that we shall get thereby. In these things our assent is with adherence, affiance, trust and dependance upon the thing revealed. For as in general all truth and goodness draws the faculties of the soul to an approbation of them when they are known, so much more does the goodness and truth of those things, which are proportionable to our nature and necessities, wherein we may claim special interest and commodity, unite our wills and understanding in strong assent and adherence unto them. This kind of assent is in strict terms called faith or trust, fides, fiducia, which imply much more than credulitas, belief. Fidere in the property of the word is a degree beyond credere, importing an assent with reliance and confidence. Now the proper object of this assent is nothing but promises of some good hereafter to befall us. And promises are never believed, unless they be trusted upon: as a captive cannot be said to believe him that promises to ransom him upon a day, unless he trust and depend upon him. In which case we cannot distinguish between belief and trust, fidem and fiduciam, to make them two several acts, which are but one and the same; as is manifest thus, a promise is a revelation of some such truth as shall be beneficial to me in particular. The truth of such a promise consists in the certainty of performance. The goodness of the promise consists in the quality of the thing promised more or less excellent. But now to trust (fiduciam ponere, fidem habere) upon a promise is not to believe the goodness of the thing promised (for that often is known perfectly enough) but to be believe the certainty of performance of it unto me: as for instance, if a rich man promise to pay a poor man’s debts, the poor man needs not believe the goodness of the promise, for he well knows the benefit thereof. What then must he believe? The truth of it: where in stands that? in the performance that the rich man will certainly do for him what he has said. Now what is this else but to trust him? So that belief and trust or affiance are here essentially one and the same thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 170-71</span></figcaption>

<blockquote><p>Between them and us there is this difference, that they persuade themselves that the movement comes from the man himself, whereas we maintain that faith is voluntary, because God draws our wills to himself. Add, that when we say a man is justified by faith alone, we do not fancy a faith devoid of charity, but we mean that faith alone is the cause of justification.</p></blockquote>

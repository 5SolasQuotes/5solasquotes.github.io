<main class="wrap"><figure class="quote" id="q-506084c729" data-kw="">
<blockquote><p>The sanctification of the Sabbath, now most shamefully desecrated over the whole land, demands special attention of the public journalist. By the United States’ mail, by travellers, by the running of public vehicles, by the transportation of merchandise, and other forms of Sabbath violation, the religious feelings of good men have been and are outraged. Christianity now demands and will accomplish, a reform of this enormous evil. As God gives grace, we intend to aid in this good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-m-willson.html">James M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction in Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>…in 1 Cor. 11:6, ‘if the woman be not covered, let her also be shorn’: If she lays her vail aside and appears in the public assemblies without a covering, then I say, ‘let her also be shorn or shaved’, let her hair be cut close to the skin, let her go like some of the cropped philosophers among the Stoics. Not that he would have her do so, but only by this sarcastic way of speaking he signifies that one is as decent as the other. It is as disgraceful to be uncovered as to be shaved: for ’twas the laudable custom then in the Christian churches for the women to be vailed, and it was disgraceful and reproachful for any of that sex to appear bare-faced in the time of worship.</p></blockquote>

</figure><figure class="quote" id="q-da3186610b" data-kw="">
<blockquote><p>Would we do good both to ourselves and others? Let us every one remember the Sabbath day at home, to keep it holy. By this we may be aided in judging of our preparation for heaven. The Sabbath on earth is a type of the Sabbath above. If we find no delight in the holy duties of the day, as now enjoyed, and feel the sacrifice of sanctifying it to be too great, how can we hope to enjoy it in the purity and holiness of heaven? But if it is our delight, and its sacred retirement from worldly cares refreshes the soul, we can discern some degree of conformity to the inheritance of the saints in light.

It is our duty and our privilege, then, to comfort ourselves with the expectation of yet enjoying an eternal Sabbath, where there are no temptations to profane it, no despisers of religion to interfere with its quiet sanctification—no ignorance, through which we may fall into sin, and thus impair our enjoyment,—no disinclination of mind to hold communion with God,—where no weariness in duty, or languor in devotion can make the season appear too long.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/silas-milton-andrews.html">Silas Milton Andrews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath at Home</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1840), p. 18.</span></figcaption>

</figure><figure class="quote" id="q-0750867aff" data-kw="">
<blockquote><p>83. Q. What [is the] eleventh motive [for Sabbath observance]?

A. Threats against profaners of it.

What promises cannot do on hard hearts, threats may do. For they are of force to affright men: and in a manner to force men to obedience. The Lord therefore being willing every way to try how men may be wrought upon, useth this remedy: and the rather he useth it, that judgement, and the execution thereof may be prevented. For this is the proper end of threatnings before hand, that after-judgements may be avoided: so as it regard of the end whereat they aim, they appear to be evidences of God’s favour. For these read Exod. 31.14, 15. Jer. 17.27. Ezek. 20.13, 21.

84 Q. What twelfth motive?

A. Judgments executed on such as violated it.

Execution of judgment hath a threefold end.

The first aimeth at him on whom the judgement is executed: by the sense and smart thereof to be drawn to repentance. Thus was Manasseh wrought upon by a fearful judgement executed on him, 2 Chron. 33. 12, 13.

The second aimeth at others, that if they on whom the judgement is executed be so hardened, as it move them not, yet others may be warranted thereby: For this end the judgements on impenitent sinners of old is set before Christians to admonish them. I. Cor. 10.6, etc. Heb. 3.12. Jude ver. 5, 6, etc.

The third aimeth at God: that if neither they on whom judgements are executed, nor others that see them or hear of them, be wrought upon, yet God may be justified. In which respect he is said to be known by the judgement which he executeth (Psal. 9. 16.) He thereby is known to be a mighty, a just, a wise God, a God that hateth iniquity. Read Dan. 9.7. and Neh. 9.32, 33. Now judgements being terrible to such as feel, and to such as see them, or hear of them, they must needs be a forcible motive to restrain men from profaning the Sabbath. Instances of fearful judgements executed for this sin are in Numb. 15.32. and 2 Chron. 36.21. Neh. 13.18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 40-1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

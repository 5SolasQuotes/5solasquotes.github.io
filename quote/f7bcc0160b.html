</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68ca6aa5c2" data-kw="">
<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.1.26</span></figcaption>

</figure><figure class="quote" id="q-c439071ff3" data-kw="final judgment">
<blockquote><p>The final judgment which Christ will exercise at the end of the world over the living and the dead, raised up and gathered together at the trump of God and the voice of the archangel, must be investigated as to its truth and manner. It is not inquired concerning the judgment of God taken merely for his rule and governing, nor concerning the fatherly judgment of God toward believers, but concerning that public and solemn judgment of the last day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.6.1–2</span></figcaption>

</figure><figure class="quote" id="q-d38daf3ce9" data-kw="">
<blockquote><p>8. The good works performed by the gentiles [unbelievers] are pleasing to God in so far as because of them, He will partially but not totally justify them in the last judgment; secondly, because He will remunerate them with temporary goods [in this life]. In hell, therefore, they will bear lighter punishments; they will also be remunerated with temporary goods, as is evident from the midwives in Ex. 1 [v. 21].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse</cite>, (1644), ch. 15, ‘On Good Works’, p. 251</span></figcaption>

</figure><figure class="quote" id="q-ed34e8b466" data-kw="">
<blockquote><p>Properly speaking, Christ&#x27;s Resurrection is not the meritorious cause, but the efficient and exemplar cause of our resurrection.... And since, as was stated above (Reply to Objection 2), the primary cause of human resurrection is the Divine justice, from which Christ has &quot;the power of passing judgment, because He is the Son of Man&quot; (John 5:27); the efficient power of His Resurrection extends to the good and wicked alike, who are subject to His judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, III, q. 56, a. 1, ad 3</span></figcaption>

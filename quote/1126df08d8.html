<main class="wrap"><figure class="quote" id="q-1126df08d8" data-kw="">
<blockquote><p>11… But when we complain of our divisions for making much against the cause of Christ, or work of reformation, we do not complain against men, because they cannot all understand things alike. But this we complain of:

1. That all men who profess godliness, have not joined in opposing that which they believe cannot stand with godliness, by all the ways that God has put into their hands.

2. That they have not joined to promote those ways of godliness, which they are convinced to be so.

3. That they have not joined to study what ways and means may be found out to ease the hearts and consciences one of another, to bear with one another, so far as Christ would have them be helpful to, and bear with one another. It is this that has made such a stop in the work of reformation. A peaceable, humble, and quiet discussing of things furthers that reformation that Christ would have. Do you think that Christ would be pleased with such a reformation wherein the lesser part should give up their consciences and practices to the judgments of the greater? Such a kind of slubbering over matters might soon be, but Christ must have all the matters of his worship and doctrine consented to, and practiced from a principle of faith. Let us join with all our might in all we know, and with peaceable, quiet, humble spirits seek to know more, and in the meantime carry ourselves humbly and peaceably towards those we differ from, and Christ will not charge us at the Great Day for retarding his cause, the great work of reformation in hand. 12. These our dissensions are against a great part of the Covenant of Grace which God has made with his people in Christ, and those many promises of so much peace that there is to be in the times of the Gospel. We by these do that which tends to make void the Covenant…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London: Robert Davvlman, 1653), ch. 28, pp. 207-8</span></figcaption>

</figure><figure class="quote" id="q-aedb36876d" data-kw="">
<blockquote><p>Now of Churches faulty and corrupted, some raze the foundation; others, on the true foundation build timber, hay, stubble. From those we must separate; from these we may not. Peter’s is eternal, ‘Whither shall we go from Thee; Thou hast the words of eternal life.’ (Jn. 6:68) Where these words are found, woe be to us if we be not found. Amongst many good separations then, yours cannot be separated from evil, for that we should so far separate from the evil that therefore we should separate from God’s children in the communion of the holy things of God, that for some (after your worst done) not-fundamental corruptions, we should separate from that Church in whose womb we were conceived, and from betwixt whose knees we fell to God: in a word (as one of yours once said) to separate not only from visible evil, but from visible good, as all Antichristian: who but yours can think less than absurd and impious? Grant we should be clean separated from the world, yet if we be not, must you be separated from us?¹ ¹ Neque propter paleam relinquim are am Domini, neque propter pisces malos rumpimus retia Domini. Augustine, Epistle 48 Do but stay till God have separated us from Himself: will the wise husbandman cast away his corn-heap for the chaff and dust? Shall the fisher cast away a good draught because his drag-net has weeds? Does God separate from the faithful soul, because it has some corruptions, her inmates, though not her commanders?</p></blockquote>

<blockquote><p>…union has the advantage over division, because: It is a commanded mean tending to edification, which division is not.

2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it.

3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>

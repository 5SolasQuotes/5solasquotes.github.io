<main class="wrap"><figure class="quote" id="q-e4c70f1fad" data-kw="">
<blockquote><p>The very life of religion doth much depend upon the solemn observation of this day. Consider, if we should intermit the keeping of it but for one year, to what a height profaneness would rise in those who fear not God, who yet are restrained, though not converted, by the preaching of the word, and their outward partaking of public worship. Yea, those who are most spiritual, would find themselves losers by the intermission.

What forbidden.—1. Bodily labour on this day, where necessity unavoidable, or piety, commands not. 2. Sporting and pastimes. This is not to make it a sabbath to God, but to our lusts and to Satan; and hath a stronger antipathy with the worship of God, and that temper of mind they intend in it, than the hardest labour. 3. Resting from these, but withal, resting from the proper work of this day, neglecting the worship of God in the assemblies of His people. The beasts can keep it thus, as we see in the Precept. 4. Resorting to the public worship of God, but in a customary, cold way, without affection and spiritual delight in it. 5. Spending the remainder of the day incongruously, in vain visits and discourses, &amp;c.

How observed.—1. By pious remembrance of it, and preparation, sequestering not only the body from the labour, but our souls from the cares and other vain thoughts of the world. 2. Attending upon the public worship of God willingly and heartily, as the joy and refreshment of our souls. Isa. Iviii. Psal. cxxii. 3. Spending the remainder of it in private, holily; as much as may be, in meditation of the word preached, and conference, in prayer, reading, and meditating on the great works of God, of creation, redemption, &amp;c.

This is the loveliest, brightest day in all the week to a spiritual mind. These rests refresh the soul in God, that finds nothing but turmoil in the creature. Should not this day be welcome to the soul, that sets it free to mind its own business, which is on other days to attend the business of its servant, the body? And these are a certain pledge to it of that expected freedom, when it shall enter to an eternal sabbath, and rest in Him for ever, who is the only rest of the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 383.</span></figcaption>

<blockquote><p>WHAT IT IS TO KEEP HOLY THE SABBATH-DAY.

To keep holy the sabbath-day is not to cease from bodily labour, that thou shouldest the more licentiously give thy mind to the wearing of gallant apparel, to banqueting, to idle talk, to vain pastimes, and such other filthy pleasures of the flesh; but that thou, setting aside all worldly business, shouldest the more freely apply thyself to read, hear, and learn the word of God, to pray in the temple with the congregation, to be thankful to God for his benefits, to be present at the ministration of the holy sacraments, to be partaker of the mysteries of the Lord’s body and blood, to give some good thing to the relief of the poor, to visit and comfort the sick and them that are in prison, and, casting away the works of the flesh, wholly to exercise thyself in the fruits of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), p. 500.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The very condescending of the second person, who natively and essentially is so great, to assume man’s nature, although in this form of God described, invested with all that manifestative glory spoken of, and this from and upon the first moment of his assuming it; if this act of assuming had been done and undertaken principally in order and with intention to satisfy God, by bringing in a new glory to him, greater than that which he lost by him, and this without the least humbling of himself; I ask, why might not this in just reason have been accounted satisfaction?

For (1.) he had thereby lessened himself to give glory to God. For in that assumption, and in that communication of himself to a creature, he takes on him such relations as do in some respects abate of the height of his native personal glory, as he is considered merely as second person; and in respect to this assumption, he is made less than what before he was. For now it may be said of him, as it was by himself, that ‘his Father is greater than he,’ John xiv. 28, whereas he might have kept himself in a foil equality to him in all respects for ever, and to have had no such diminishing respect affixed to him.

And (2.) by this voluntary act alone he had brought in unto God a new and further revelation of the Godhead than ever was obscured by sin; and it is certain that he had never assumed man’s nature, and thus lessened himself, but that so he might manifest the glory of the Godhead in such a manner as otherwise it never should have been. Therefore for him thus to lessen himself, to the end to manifest and exalt the glory of the Godhead the utmost way it could be, or more than otherwise it should have been, might not this make amends for the glory that sin would take from God?

And the reason of this is, that satisfaction being a return of as much glory as was lost, and that by this means (if no other were added) more manifestative glory would come in unto God than either was or ever could have been debased or impaired by sin, why therefore might it not have been accounted satisfactory, if it had been ordered simply unto this end? And further also, even this would have served to fill up many of those disproportions found in the evil of sin.

For as the evil of Adam’s sin (which was the first sin) lay in this, that he who was a creature affected and aspired to be as God — He is become as one of us, said God, Gen. iii. 22 — so Christ’s obedience, in assuming our nature, would herein have answered it, that he that is God becomes a creature, and on the other side is become as one of us men; so to bring in a new honour unto God. So that, look how high our nature would have ascended, so low doth he descend; and as sin is a turning from God to the creature, so in this act the Creator descends from the height of his glory to become a creature, and join himself in a nearer union with us than wherein we in sinning affected to join ourselves to the Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christ the Mediator</cite>, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 109.</span></figcaption>

</figure><figure class="quote" id="q-b7734e3686" data-kw="">
<blockquote><p>Till men and women are brought to feel their sinfulness and need, no real good is ever done to their souls. Till a sinner sees himself as God sees him, he will continue careless, trifling, and unmoved. …

To this end we must expound the length and breadth of God’s holy law. To this end we must denounce every practice contrary to that law, however fashionable and customary. This is the only way to do good. Never does a soul value the Gospel medicine until it feels its disease.</p></blockquote>

</figure><figure class="quote" id="q-ebc7ade868" data-kw="">
<blockquote><p>Next you [Gilbert Burnet] inquire, Why do you [Scottish non-conformists] not anoint the sick with oil? I answer, though you address this demand to a non-conformist, yet it is evident that your conclusion of deformity to the Scripture pattern thence inferred, is equally levelled against the whole Protestant Church, wherein this ceremony is universally disused, and that not from your vain warrant of the Church’s authority in and over things expressly commanded, as you judge this rite to be; No, this is a presumption so high, and lax, that even the grossest Papists are unwilling to avouch it; But the sound answer of all the Churches is that, as the custom of anointing might have been occasioned from an observance then in use in these parts, where anointings were much more ordinary than in our parts of the world, so it is mentioned in the Scripture by the apostle James, not by way of command, but as the accustomed symbol adhibite[d] in the exercise of the gift of healing, which being then ordinary in the Church, is commanded to be applied by the prayer of faith, whereunto the effect is solely referred, and only with the formality of anointing, as being then customary in the like cases. Seeing then that the text runs clearly thus, ‘Is any sick? Let him call the elders, and let them pray over him anointing him with oil in the name of the Lord, and the prayer of faith shall save the sick;’ and that the application of the extraordinary gift of healing by prayer, with the then us […]all circumstance of anointing […] is here only enjoined, how can you make this text binding as to the manner and circumstance, when you cannot but acknowledge that the substance, viz. the power of healing, is ceased? But having made your non-conformist say that the apostle promises recovery upon the anointing, you turn to fight with your own shadow, and tell him there is no such matter, that the recovery is promised to prayer, and also forgiveness; and seing we pray by all for their raising up, and that they may be forgiven, why do we not as well anoint? But, what logic can make out this consequence inasmuch as anointing, being there only spoken of as the concomitant rite used in the application of the gift of healing, it is manifest that without the existence and exercise of the gift itself, it is not now to be repeated; and therefore though prayer be principally commanded as the special mean, by which even the gift of miracles was actuate[d] and made effectual, and to this day does remain as the great one by which all the promises either for raising up or remission are drawn out unto effect; yet thence to infer that anointing, a peculiar solemnity in the gift of healing, should still continue, notwitstanding the gift itself be ceased, is very absurd: Now, that anointing was an ordinary observance in the exercise of the gift of healing, you may read it clearly in the disciples’ practice, Mk. 6:13. And they anointed with oil many that were sick and healed them. This being then the just and true account, not only of our practice, but also of that of the whole reformed Churches, how vain and ridiculous are you to tell us, that our pretence of Scripture is but to impose on women and simple people, and all our persuasion, grave nods and big words: but leaving you to puff petulantly where you can prove nothing.</p></blockquote>

ut+having+made+your+non-conformist+say+that+the+apostle+promises+recovery+upon+the+anointing%2C+you+turn+to+fight+with+your+own+shadow%2C+and+tell+him+there+is+no+such+matter%2C+that+the+recovery+is+promised+to+prayer%2C+and+also+forgiveness%3B+and+seing+we+pray+by+all+for+their+raising+up%2C+and+that+they+may+be+forgiven%2C+why+do+we+not+as+well+anoint%3F+But%2C+what+logic+can+make+out+this+consequence+inasmuch+as+anointing%2C+being+there+only+spoken+of+as+the+concomitant+rite+used+in+the+application+of+the+gift+of+healing%2C+it+is+manifest+that+without+the+existence+and+exercise+of+the+gift+itself%2C+it+is+not+now+to+be+repeated%3B+and+therefore+though+prayer+be+principally+commanded+as+the+special+mean%2C+by+which+even+the+gift+of+miracles+was+actuate%5Bd%5D+and+made+effectual%2C+and+to+this+day+does+remain+as+the+great+one+by+which+all+the+promises+either+for+raising+up+or+remission+are+drawn+out+unto+effect%3B+yet+thence+to+infer+that+anointing%2C+a+peculiar+solemnity+in+the+gift+of+healing%2C+should+still+continue%2C+notwitstanding+the+gift+itself+be+ceased%2C+is+very+absurd%3A+Now%2C+that+anointing+was+an+ordinary+observance+in+the+exercise+of+the+gift+of+healing%2C+you+may+read+it+clearly+in+the+disciples%E2%80%99+practice%2C+Mk.+6%3A13.+And+they+anointed+with+oil+many+that+were+sick+and+healed+them.+This+being+then+the+just+and+true+account%2C+not+only+of+our+practice%2C+but+also+of+that+of+the+whole+reformed+Churches%2C+how+vain+and+ridiculous+are+you+to+tell+us%2C+that+our+pretence+of+Scripture+is+but+to+impose+on+women+and+simple+people%2C+and+all+our+persuasion%2C+grave+nods+and+big+words%3A+but+leaving+you+to+puff+petulantly+where+you+can+prove+nothing.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%2C+%E2%80%A6+%281671%29%2C+3rd+Dialogue%2C+pp.+117-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Febc7ade868.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ebc7ade868.html">Per

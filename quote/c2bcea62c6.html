<main class="wrap"><figure class="quote" id="q-c2bcea62c6" data-kw="">
<blockquote><p>XIII. The scripture is very perspicuous in such things as be necessary to salvation; and therefore ought to be read of all.

Yea we think and know the whole doctrine of salvation not only plentifully but plainly and perspicuously to be delivered in the holy scriptures, and sith God never spake unto his people but in their natural language, which might be understood of all, that it is a great injustice and tyranny to forbid the reading of them to any men, and consequently the turning of them into the proper tongue of any nation, which the Lord hath willed and commanded should be read of all men for their own salvations sake, yea and should be continually borne about in their hands day and night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), I.XIII, 1: 127.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5a8c0d84e" data-kw="">
<blockquote><p>What is meant by “the consent of all the parts” of the Scriptures?

By “the consent of all the parts” of the Scriptures is meant: (a) that there are no real contradictions in the Bible; (b) that all the parts of the Bible form a unity, an organism, a harmonious whole, not merely a collection of separate writings with diverse ideas and viewpoints.

This beautiful harmony of the various parts of the Bible is an evidence that back of all the human writers there was a divine Author, the Spirit of God, controlling them all so that a harmonious whole would be produced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Larger Catechism of the Westminster Assembly in Blue Banner Faith and Life</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-792fccf965" data-kw="">
<blockquote><p>The question therefore comes to this: is Scripture so understandable in matters necessary for salvation, not with regard to what is taught but with regard to the manner of teaching, not with regard to the subject [persons], but to the object [Scripture itself], that it can be read and understood for salvation (salutariter) by believers without the help of external traditions? The Roman Catholics deny this; we affirm it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.7</span></figcaption>

</figure><figure class="quote" id="q-4e6e6fd000" data-kw="apocrypha">
<blockquote><p>The Apocryphal books are so called not because the authors are unknown (for there are some canonical books whose authors are unknown and some apocryphal books whose authors are known); not because they could be read only in private and not in public (for some of them may be read even in public), but either because they were removed from the crypt (apo tēs kryptēs) (that sacred place in which the holy writings were laid up) as Epiphanius and Augustine think; or because their authority was hidden and suspected, and consequently their use also was secret since the church did not apply to them to confirm the authority of ecclesiastical doctrines (as Jerome says, ‘Praefatio in libros Salomonis’ from “Hieronymi Prologus Galeatus” in Biblia Sacra Vulgata Editionis Sixti V … et Celementis VIII [1865], p. lii); or, what is more probable, because they are of an uncertain and obscure origin (as Augustine says, CG 15.23* [FC 14:474]). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.1</span></figcaption>

<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>

<blockquote><p>2. How names are to be given to places, we cannot better learn than of those ancient founders of names, the holy Patriarchs: As Abraham Gen. 22:14 calls the mountain Jehovah-jireh, ‘The Lord hath seen.’ So Jacob gives holy names to the place where he met the angels, Gen. 32:2, and where he wrestled with the angel, v. 31. They, as we see, gave holy and reverent names unto places, not made peculiar for God’s service, but only for civil use for the places to be called and known by: how much more ought churches and houses of God to be called by his name? We therefore conclude that churches ought not to be erected in saints’ names, to worship them thereby and make them our patrons, mediators, and presenters of our prayers [as Romanists]: for this were great idolatry: Even like as the heathen called their temples by the names of their idols, Venus, Jupiter, Diana and the like: Yet we refuse not to call our churches by the names of saints, as they have been called of old, because we are not inventors of names; and terms inured by continual custom can hardly be left. We use them only as civil terms to distinguish places by: if any otherwise use them, for any religious purpose, they do amiss. And yet we deny not but that the names of holy men may be safely remembered by thanksgiving unto God for such excellent instruments, and setting before our eyes their good example. And concerning the names which have been superstitiously given in times past unto churches and other places (though it were to be wished that they never had been so given) yet now we use them (setting apart all superstition) as civil names of difference, as St. Luke [the author of Acts] describes the ship of Alexandria wherein they were carried, whose badge (says he) was Castor &amp; Pollux, Acts 28:11. In a civil matter of description, he refuses not to use the names of the heathen gods. Augustine also gives a good rule concerning such names. He speaks of the names of days, which were called after the names of heathenish idols, as the fourth day in the week, which we call Wednesday, was then called and is yet in the Latin tongue,Dies Mercurij, Mercury, his day. ‘Sic dicitur, a paganis, &amp; a multis Christianis, sed nolumus vt dicant, et vtinam corrigātur: melius de ore Christiano ritus loquendi ecclesiasticus procedit.’ So it is called of the heathen, and of many Christians, but I would not have them called so, and I wish they were amended: for a Christian kind of speaking best becomes a Christian. Sed si quem forte cōsuetudo traxerit, etc. sciat illos omnes homines fuisse. ‘But if custom prevail with a man so to speak, let him understand that all they were but men,’ whom the heathen take for gods. So say we, it were to be wished that we had names void of all show of superstition: but seeing for our speaking we must be ruled by custom, let us know that those saints by whose names places are called, are no gods, nor God’s fellows, nor patrons or mediators for us, nor any way to be worshipped: But they are the fellow servants of all.</p></blockquote>

<blockquote><p>XXXV. The argument drawn from ‘the abstemious,’ who commune only under one kind, cannot favor our opponents. The insuperable exception of a few ought not to overthrow a general rule. Their abstaining from the cup is not voluntary and free (which would be altogether culpable), but involuntary and invincible on account of a natural and unavoidable inability. Therefore, if they do not use the cup, they are not on that account to be considered as violators of the divine command, because the precept has reference only to those who can use wine and not to those in whom God has placed such an invincible impediment (and whom on that account He wished to dispense [dispensare] from this precept). But so far is this from infringing the command of Christ that it rather strengthens it the more, as an exception added to a rule is wont to bind it more strongly. For since they only are excused from taking the cup who have a disgust for wine, by that very thing all others are determined to be bound to receive it. This is illustrated by the example of the deaf; for although the command to hear the Word is given to all, it binds only those who can hear and not the deaf. And if the deaf are exempted from it, falsely would anyone infer from this that it was also lawful for others to be excepted. XXXVI. The article of discipline of our churches by which the abstemious are excused from the use of the cup, provided they show reverence only by the movement of the cup to the mouth (by which they follow the institution of Christ and do not abstain from it through contempt but from inability), cannot help the Romanists (cf. ‘The Discipline of the Reformed Churches of France,’ 12, Canon 7 in Quick, Synodicon [1692], 1:xlviii). (1) Our practice differs widely from the Roman. It is one thing to bear with the weakness of those who cannot use wine; another to takw away from and prohibit the cup to those who are without such weakness. The former is done by us; the latter by Romanists. (2) The article of discipline is a work of charity and accommodation (synkatabaseos) towards a few out of unavoidable necessity. But the dogma of the Romanists is an absolute and simple interdiction towards all without necessity and against the express command of Christ. (3) The discipline does not intend that the species of the sacrament should be divided; nay, it intends that the sacrament should be retained entire and be conjointly extended and distributed to the people by the ministers (although both species cannot be received by the abstemious, but only one). But the Roman doctrine and practice wishes the sacrament to be divided and the communion mutilated by the priests. According to us the abstemious ought not only to desire the cup, but also to do everything to overcome their weakness; but the Romanists so take away the cup from the people that it is wrong for them to ask for it or to touch it. In one word, while according to our opinion nobody is kept from the use of the cup; nay, pastors are commanded to offer both kinds and believers to do all they can for its reception; by the Romanists the use of the cup is expressly forbidden to the people. It is evident that there is a great and wide difference between our opinion and theirs. XXXVII. Now although the abstemious receive the sacrament only under one kind, their communion is not on that account to be considered wholly profitless (illusoria). (1) The entire sacrament is extended to them by the minister and if they are compelled to abstain from one kind, it is not done spontaneously and contemptuously, but from sheer weakness and unavoidable necessity. (2) Although the species in the sacrament are indivisible by the ordination of God, this has respect to those only who can use them and not to others (whom He Himself dispenses by the obstacle placed in their way). For as He made the law, so He alone can dispense from it whom He pleases; and separate the species in certain cases, who joined them and willed them to be joined. (3) The defect of use (or of either species through the taste) can in some measure be supplied both by the wish and from the sight, touch, smell and other sensations. (4) Although both signs are not received, they do not cease to be made partakers of the whole thing signified, which is indivisible.</p></blockquote>

<blockquote><p>For this mystery of iniquity [of conformity] had its first rise even in the apostles’ times, it began then to work. And what was this mystery of iniquity, but an exaltation of man’s power above all that is called God, or that is worshipped, so as to sit upon, or over, or in the Temple of God, over the consciences of God’s people, and over the Church as God Himself? And note there also, it is called an ‘apostasy’, or (as Tit. 1:14) a turning away from, or of the truth (as afore) and such are adversaries too, and all Antichristian. Such an one was Diotrephes; that [in Greek], who loved the preeminence (the very spawn of this mystery) which sets him a work to raise himself:

1. In not receiving the apostle John;

2. In prating against him with malicious words;

3. In not receiving the brethren;

4. In forbidding those that would; And 5. In casting them out of the Church. Thus also did this mystery begin to work, as the apostle intimates both in Tit. 1:14 and in Col. 2:8,17,18, 20, 22, 23. But then this mystery was but in the swaddling clouts, which afterward growing by degrees to the full stature, was so bedecked with infinite varieties of ceremonies, and daily new fashions in religion (as the crow with every bird’s feather) that getting an unlimited, usurped power, and that under the color of Jure Divino [by divine right], all men’s consciences, churches must conform to the present fashion of worship and Church-government. Thus by degrees this Mystery of iniquity mounted to its height, and has now obtained such a prescription of antiquity, as is equivalent to a law. And not only the Pope claims and exercises this power over his whole Popedom and Hierarchy, but from him our late Prelates. And whence, or from whom you derive this very power, unless immediately either from the Pope or from our late Prelates, whose personal Prelacy you have abandoned, saving their Prelatical spirit and usurped power: or else from the antiquity of this mystery; you may do well to inform us. And in truth, this was that very sluice, which when first opened, did let in that inundation and deluge not only of will-worship, in all kind of ceremonies and superstitions, but also of human forms and frames of Church-government, and in all of them such a tyrannical power over all consciences and Churches as has wholly drowned all; so as Christ’s Dove can nowhere find where to set her foot. And therefore in this time of pretended Reformation, to erect this great idol, to wit, a power in man to prescribe laws and to legitimate commandments for worship and Church government, and to press them upon every man’s conscience: what is it, but with Nebuchadnezzar to erect his golden image and with an immortal law of the Medes and Persians, to bind all men to fall down and worship it? Or what is it, but with Jeroboam and his counsel (and so in every alteration of the State) to set up the golden calves with a strict commandment of universal conformity; none daring among all those Ten Tribes openly to profess the pure worship of God, saving the prophet Eliah, to whom those seven thousand were not known. And therefore God rooted out Jeroboam’s house; and did the Tribes escape scot-free for their yielding willing obedience to the commandment of the king’s counsel, though it were a public act of State? Was not Ephraim oppressed and broken in judgement because he willingly walked after the commandment? For God set wicked kings over them, who oppressed and brake them in judgement, tyrannizing at their pleasure. As always where a people is brought under the spiritual yoke of bondage, they are never free from the temporal. Nor only this, but they were carried into perpetual captivity and never returned unto this day. An example to be laid to heart both of rulers and people. Remember Ephraim therefore, the horribleness of whose sin appears by the horribleness of the punishment. And like to this is that of Jerusalem and of the Jews. They said indeed, ‘If we thus let Him alone, all men will believe in Him, and the Romans will come and take away both our place and nation.’ No, blind Jews, because ye did renounce your King Christ, and so envy the people’s salvation, therefore the Romans came and took away both your place and nation. And how did the Jews reject this their King? Christ tells us in a parable of a nobleman, Luke 19, saying (v. 14), But his citizens hated him and sent a message after him, saying, ‘We will not have this man to reign over us.’ Where note: First, they were such as professed to be the people of God, His citizens. Secondly, the ground of their refusal of Him to be their king was hatred of Him, and so to refuse Him is to hate Him. Thirdly, the manner of their refusal: 1. They sent a message after Him (as the vulgar translation renders it), but the original is, ‘They sent [in Greek] an ambassage after Him,’ which is more then a message. It must be done by a public act of State, to make all cock-sure. And 2. the matter of the ambassage, ‘We will not have this man, or this fellow ([in Greek]) this, noting their contempt of Him. And the reason hereof was their will: ‘We will not.’ But what was the issue? Read and mark it, v. 27, where Christ not long after returns in judgement against them, which He executes by those very Romans whom they so feared, to whom He gives this commission: ‘But those mine enemies that would not that I should reign over them, bring hither, and slay them, etc.’ which was done accordingly. … Such as conform to a State religion, or a State church-government, make that the supreme law and lord over their conscience, and so exclude Christ’s supremacy. Enough is said of that. But you cut me off from what I was about to add: Man’s nature is too prone to idolize the Power so, as to make it as the shadow of the bramble, in Jotham’s parable, under which to ease themselves of the labor to search into the Scriptures and so to come to know what they believe; most men pinning their religion upon the sleeve either of the priest, as the Papists do, or also of the magistrate, as our common Protestants do, wrapping all up in an implicit faith and blind obedience, according to your Remonstrance that urges conformity to the religion and government of Christ already established, or which shall be set up. Thus it was enough for the Pharisees to say, ‘We have a law, and by that law Christ ought to die.’ Thus Christ must not be God, because the Roman Senate, according to their law formerly made, had not first motioned it, or passed their vote for it, before Tiberius Caesar had commended it to them, namely to admit of Christ into their pantheon to take place among their gods. And is it not even so with us? Must not Christ be King of the Jews, only because by an act of State (as before) they will not have this man to reign over them. And Christ must not be God, because the Roman Senate had not pre-resolved it. And so Christ must not be sole Lord over the conscience, nor sole Lawgiver of his Church, nor his Word the sole rule of worship and of Christ’s Kingly government of his spiritual Kingdom in the conscience, and Churches of the saints, nor indeed Christ’s kingdom-spiritual, because the Sate has made a law which must rule the conscience in point of forms of worship and of Church-government, that Christ’s kingdom must be worldly…</p></blockquote>

tained+such+a+prescription+of+antiquity%2C+as+is+equivalent+to+a+law.+And+not+only+the+Pope+claims+and+exercises+this+power+over+his+whole+Popedom+and+Hierarchy%2C+but+from+him+our+late+Prelates.+And+whence%2C+or+from+whom+you+derive+this+very+power%2C+unless+immediately+either+from+the+Pope+or+from+our+late+Prelates%2C+whose+personal+Prelacy+you+have+abandoned%2C+saving+their+Prelatical+spirit+and+usurped+power%3A+or+else+from+the+antiquity+of+this+mystery%3B+you+may+do+well+to+inform+us.+And+in+truth%2C+this+was+that+very+sluice%2C+which+when+first+opened%2C+did+let+in+that+inundation+and+deluge+not+only+of+will-worship%2C+in+all+kind+of+ceremonies+and+superstitions%2C+but+also+of+human+forms+and+frames+of+Church-government%2C+and+in+all+of+them+such+a+tyrannical+power+over+all+consciences+and+Churches+as+has+wholly+drowned+all%3B+so+as+Christ%E2%80%99s+Dove+can+nowhere+find+where+to+set+her+foot.+And+therefore+in+this+time+of+pretended+Reformation%2C+to+erect+this+great+idol%2C+to+wit%2C+a+power+in+man+to+prescribe+laws+and+to+legitimate+commandments+for+worship+and+Church+government%2C+and+to+press+them+upon+every+man%E2%80%99s+conscience%3A+what+is+it%2C+but+with+Nebuchadnezzar+to+erect+his+golden+image+and+with+an+immortal+law+of+the+Medes+and+Persians%2C+to+bind+all+men+to+fall+down+and+worship+it%3F+Or+what+is+it%2C+but+with+Jeroboam+and+his+counsel+%28and+so+in+every+alteration+of+the+State%29+to+set+up+the+golden+calves+with+a+strict+commandment+of+universal+conformity%3B+none+daring+among+all+those+Ten+Tribes+openly+to+profess+the+pure+worship+of+God%2C+saving+the+prophet+Eliah%2C+to+whom+those+seven+thousand+were+not+known.+And+therefore+God+rooted+out+Jeroboam%E2%80%99s+house%3B+and+did+the+Tribes+escape+scot-free+for+their+yielding+willing+obedience+to+the+commandment+of+the+king%E2%80%99s+counsel%2C+though+it+were+a+public+act+of+State%3F+Was+not+Ephraim+oppressed+and+broken+in+judgement+because+he+willingly+walked+after+the+commandment%3F+For+God+set+wicked+kings+over+them%2C+who+oppressed+and+brake+them+in+judgement%2C+tyrannizing+at+their+pleasure.+As+always+where+a+people+is+brought+under+the+spiritual+yoke+of+bondage%2C+they+are+never+free+from+the+temporal.+Nor+only+this%2C+but+they+were+carried+into+perpetual+captivity+and+never+returned+unto+this+day.+An+example+to+be+laid+to+heart+both+of+rulers+and+people.+Remember+Ephraim+therefore%2C+the+horribleness+of+whose+sin+appears+by+the+horribleness+of+the+punishment.+And+like+to+this+is+that+of+Jerusalem+and+of+the+Jews.+They+said+indeed%2C+%E2%80%98If+we+thus+let+Him+alone%2C+all+men+will+believe+in+Him%2C+and+the+Romans+will+come+and+take+away+both+our+place+and+nation.%E2%80%99+No%2C+blind+Jews%2C+because+ye+did+renounce+your+King+Christ%2C+and+so+envy+the+people%E2%80%99s+salvation%2C+therefore+the+Romans+came+and+took+away+both+your+place+and+nation.+And+how+did+the+Jews+reject+this+their+King%3F+Christ+tells+us+in+a+parable+of+a+nobleman%2C+Luke+19%2C+saying+%28v.+14%29%2C+But+his+citizens+hated+him+and+sent+a+message+after+him%2C+saying%2C+%E2%80%98We+will+not+have+this+man+to+reign+over+us.%E2%80%99+Where+note%3A+First%2C+they+were+such+as+professed+to+be+the+people+of+God%2C+His+citizens.+Secondly%2C+the+ground+of+their+refusal+of+Him+to+be+their+king+was+hatred+of+Him%2C+and+so+to+refuse+Him+is+to+hate+Him.+Thirdly%2C+the+manner+of+their+refusal%3A+1.+They+sent+a+message+after+Him+%28as+the+vulgar+translation+renders+it%29%2C+but+the+original+is%2C+%E2%80%98They+sent+%5Bin+Greek%5D+an+ambassage+after+Him%2C%E2%80%99+which+is+more+then+a+message.+It+must+be+done+by+a+public+act+of+State%2C+to+make+all+cock-sure.+And+2.+the+matter+of+the+ambassage%2C+%E2%80%98We+will+not+have+this+man%2C+or+this+fellow+%28%5Bin+Greek%5D%29+this%2C+noting+their+contempt+of+Him.+And+the+reason+hereof+was+their+will%3A+%E2%80%98We+will+not.%E2%80%99+But+what+was+the+issue%3F+Read+and+mark+it%2C+v.+27%2C+where+Christ+not+long+after+returns+in+judgement+against+them%2C+which+He+executes+by+those+very+Romans+whom+they+so+feared%2C+to+whom+He+gives+this+commission%3A+%E2%80%98But+those+mine+enemies+that+would+not+that+I+should+reign+over+them%2C+bring+hither%2C+and+slay+them%2C+etc.%E2%80%99+which+was+done+accordingly.+%E2%80%A6+Such+as+conform+to+a+State+religion%2C+or+a+State+church-government%2C+make+that+the+supreme+law+and+lord+over+their+conscience%2C+and+so+exclude+Christ%E2%80%99s+supremacy.+Enough+is+said+of+that.+But+you+cut+me+off+from+what+I+was+about+to+add%3A+Man%E2%80%99s+nature+is+too+prone+to+idolize+the+Power+so%2C+as+to+make+it+as+the+shadow+of+the+bramble%2C+in+Jotham%E2%80%99s+parable%2C+under+which+to+ease+themselves+of+the+labor+to+search+into+the+Scriptures+and+so+to+come+to+know+what+they+believe%3B+most+men+pinning+their+religion+upon+the+sleeve+either+of+the+priest%2C+as+the+Papists+do%2C+or+also+of+the+magistrate%2C+as+our+common+Protestants+do%2C+wrapping+all+up+in+an+implicit+faith+and+blind+obedience%2C+according+to+your+Remonstrance+that+urges+conformity+to+the+religion+and+government+of+Christ+already+established%2C+or+which+shall+be+set+up.+Thus+it+was+enough+for+the+Pharisees+to+say%2C+%E2%80%98We+have+a+law%2C+and+by+that+law+Christ+ought+to+die.%E2%80%99+Thus+Christ+must+not+be+God%2C+because+the+Roman+Senate%2C+according+to+their+law+formerly+made%2C+had+not+first+motioned+it%2C+or+passed+their+vote+for+it%2C+before+Tiberius+Caesar+had+commended+it+to+them%2C+namely+to+admit+of+Christ+into+their+pantheon+to+take+place+among+their+gods.+And+is+it+not+even+so+with+us%3F+Must+not+Christ+be+King+of+the+Jews%2C+only+because+by+an+act+of+State+%28as+before%29+they+will+not+have+this+man+to+reign+over+them.+And+Christ+must+not+be+God%2C+because+the+Roman+Senate+had+not+pre-resolved+it.+And+so+Christ+must+not+be+sole+Lord+over+the+conscience%2C+nor+sole+Lawgiver+of+his+Church%2C+nor+his+Word+the+sole+rule+of+worship+and+of+Christ%E2%80%99s+Kingly+government+of+his+spiritual+Kingdom+in+the+conscience%2C+and+Churches+of+the+saints%2C+nor+indeed+Christ%E2%80%99s+kingdom-spiritual%2C+because+the+Sate+has+made+a+law+which+must+rule+the+conscience+in+point+of+forms+of+worship+and+of+Church-government%2C+that+Christ%E2%80%99s+kingdom+must+be+worldly%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Henry+Burton%2C+Conformity%E2%80%99s+Deformity.+In+a+Dialogue+Between+Conformity+%26+Conscience.+Wherein+the+Main+Head+of+all+the+Controversies+in+These+Times+Concerning+Church-Government+is+Asserted+%26+Maintained%2C+%E2%80%A6+%28London%2C+1646%29%2C+pp.+11-14%2C+23-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4fab36383e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4fab36383e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-conformity-to-what-is-not-right/#:~:text=For%20this%20mystery%20of%20iniquity%20%5Bof,that%20Christ%E2%80%99s%20kingdom%20must%20be%20worldly&amp;text=For%20this%20mystery%20of%20iniquity%20%5Bof%20conformity%5D%20had&amp;text=of%20Church%2Dgovernment%2C%20that%20Christ%E2%80%99s%20kingdom%20must%20be%20worldly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

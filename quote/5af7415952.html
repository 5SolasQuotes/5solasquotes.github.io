<blockquote><p>Doctrine: When God’s people are divided in opinion, all lenity and mutual forbearance should be used to prevent things from coming to an open rupture. There may be, and often are, differences of opinion about lesser things in the church; partly because of the different degrees of light… Inordinate self-love is not in all alike broken and mortified, and so their particular interests have an influence upon their opinions. And partly because of the accidental prejudices of education and converse, etc… When these differences arise, we should take care they come not to a rupture and open breach. This is the course the apostle taketh here; he doth not by and by despair of the dissenters, and reject them as heretics, but beareth with them, hoping in charity God will at length reveal their error to them by the ministry of his servants, through the powerful operation of his Spirit, and not suffer them to run on in dividing courses from the rest of his people. So should we do in like cases. Partly because when these differences of opinion breed division and separations, the church is destroyed: Gal. 5:15, ‘For if ye bite and devour one another, take heed ye be not consumed one of another.’ Backbitings, revilings, and reproaches make way for a total vastation of the whole church, a ruin to both parties. Partly because the whole is scandalised: Jn. 17:21, ‘That they may all be one, that the world may believe that thou has sent me.’ Divisions in the church breed atheism in the world… As long as charity and mutual forbearance remaineth, there is hope of doing good to one another; but when men break out into opposite parties, they are prejudiced against all that light that they should receive one from another, suspecting every point as counsel from an enemy: Gal. 4:16, ‘Am I therefore become your enemy, because I tell you the truth?’ …when men give themselves up to separating and narrow principles, the power of godliness is lost, and all their zeal is laid out upon their petty and private opinions, and so religion is turned into a disputacity… Observe it where you will, and you shall find that separation and distance from the rest of believers, doth not befriend godliness, but undermine it. A regiment fighting apart from the rest of the army of Christ, is always lost through their own peevishness; at least, they lose great advantages of promoting the kingdom of Christ… To prevent this open rupture, there must be all lenity used and mutual forbearance. We must not rigorously obtrude our conceits upon others, either by church-power, or private censure. It may be done either way; sometimes by church-power, especially when it is possessed or invaded by the more self-seeking sort of Christians… On the other side, private censures may as much break the law of forbearance as public censures, when inferiors promote their differences with turbulency, heat, and animosity, and rend and tear all things, yea, themselves, from the body of Christ, and sober Christians, censuring all that dissent from them as no Christians… If we agree in the principal articles of faith, let us embrace one another with mutual love, though we differ from one another in variety of rites and ceremonies and discipline ecclesiastical. If we agree in the substantial of worship, let us go by the same rule, do the same thing: though in circumstantials there be a difference, these are matters of lesser moment than separation, or the other division of the church… As to the persons contending, there is a difference. The apostle, when he persuadeth this lenity and mutual forbearance, excepts those that raise troubles in the church, and distinguisheth between erring Christians and their factious guides… The poor seduced Christians he would have to be pitied, but the renders and cutters of the church, he would have them beware of such… It is not a forbearance out of necessity, because we dare do no otherwise, but voluntary choice out of Christian pity and compassion, knowing that we need as much forbearance from God and others, for we all have our mistakes and failings… There is one body of Christ, whereof all are members. The whole church maketh but one body, knit by faith to Christ, their head, and by the bond of love among themselves; and the meanest Christian is a member in this body. Now it is unnatural if the members of the same body should tear and destroy one another, and that the body of Christ should be rent and torn; and woe be to them by whom it is so!… every Christian should, as far as it is possible, be an esteemer and promoter of unity among brethren, and not only make conscience of purity, but of unity also, which, next to purity, is the great badge of Christianity… To this end take these considerations: 1. Consider in how many things we agree, and in how few we differ… But there may be a different practice as to some lesser things; should we for these break with one another? 2. Take more notice of their graces than of their infirmities. Is there no good thing found in them?… We reflect upon the evil of every party, but do not consider the good. 3. Remember how open the enforcements to love and unity are, and how much the grounds of separation lie in the dark, and are in a doubtful case, but union is the safest part. 4. Think of God’s love and forbearance towards us before we received the light of his truth, and were brought to the obedience of his will… If we had been dealt with rigorously, we had been cut off from the number of God’s people, had such stumbling-blocks and prejudices laid in our way, that we should never have been converted to God. 5. This forbearance cannot in reason be expected from others to ourselves, if we be not ready to repay it to others. There is no man which hath not infirmities of his own which call for forbearance… We have all our failings and mistakes; usually God punisheth censures with censures… Paul, that stoned Stephen, was himself stoned at Lystra. So he punisheth separations with separations; they are endless, as circles in the water beget one another. 6. Consider how dangerous it is to reject any whom Christ will own for his. Will Christ admit him to heaven, and will you think him unfit for your communion here upon earth?… Now what greater offence than to cast them off from the privileges of the Christian church, either by public or private censures which are causeless or unwarrantable, at least no way grounded on necessary things? 7. As we must not on our part give offence or occasion the divisions, so we must not take offence when it is given by others; for charity, as it provoketh not, so it ‘is not easily provoked,’ (1 Cor. 13:50). So likewise if a rent be made by others, we must do what we can to heal it. If an angry brother call us bastard, yet let us own him as a brother and a child of the family: for ‘Blessed are the peacemakers,’ (Mt. 5:9). The world censureth us for compliers and daubers, but God counteth us his genuine and true children. 8. Our endeavours after unity among the professors of Christianity ought to be earnest and constant (Eph.4:3). I add this partly because many make fair pretences of peace and union, which their practice contradicteth; all cry out of the divisions, but every one keepeth them up; and partly, because when it is endeavoured we shall find difficulties and disappointments, but we must not rest in some careless endeavours, nor grow weary though we meet not with present success; and partly because the instruments of so great a good are usually sacrificed to the wrath of both parties. We must be content to digest affronts, reproaches, censures, and injuries, and love them that hate us (2 Cor. 12:15).</p></blockquote>

hurch%E2%80%A6+As+to+the+persons+contending%2C+there+is+a+difference.+The+apostle%2C+when+he+persuadeth+this+lenity+and+mutual+forbearance%2C+excepts+those+that+raise+troubles+in+the+church%2C+and+distinguisheth+between+erring+Christians+and+their+factious+guides%E2%80%A6+The+poor+seduced+Christians+he+would+have+to+be+pitied%2C+but+the+renders+and+cutters+of+the+church%2C+he+would+have+them+beware+of+such%E2%80%A6+It+is+not+a+forbearance+out+of+necessity%2C+because+we+dare+do+no+otherwise%2C+but+voluntary+choice+out+of+Christian+pity+and+compassion%2C+knowing+that+we+need+as+much+forbearance+from+God+and+others%2C+for+we+all+have+our+mistakes+and+failings%E2%80%A6+There+is+one+body+of+Christ%2C+whereof+all+are+members.+The+whole+church+maketh+but+one+body%2C+knit+by+faith+to+Christ%2C+their+head%2C+and+by+the+bond+of+love+among+themselves%3B+and+the+meanest+Christian+is+a+member+in+this+body.+Now+it+is+unnatural+if+the+members+of+the+same+body+should+tear+and+destroy+one+another%2C+and+that+the+body+of+Christ+should+be+rent+and+torn%3B+and+woe+be+to+them+by+whom+it+is+so%21%E2%80%A6+every+Christian+should%2C+as+far+as+it+is+possible%2C+be+an+esteemer+and+promoter+of+unity+among+brethren%2C+and+not+only+make+conscience+of+purity%2C+but+of+unity+also%2C+which%2C+next+to+purity%2C+is+the+great+badge+of+Christianity%E2%80%A6+To+this+end+take+these+considerations%3A+1.+Consider+in+how+many+things+we+agree%2C+and+in+how+few+we+differ%E2%80%A6+But+there+may+be+a+different+practice+as+to+some+lesser+things%3B+should+we+for+these+break+with+one+another%3F+2.+Take+more+notice+of+their+graces+than+of+their+infirmities.+Is+there+no+good+thing+found+in+them%3F%E2%80%A6+We+reflect+upon+the+evil+of+every+party%2C+but+do+not+consider+the+good.+3.+Remember+how+open+the+enforcements+to+love+and+unity+are%2C+and+how+much+the+grounds+of+separation+lie+in+the+dark%2C+and+are+in+a+doubtful+case%2C+but+union+is+the+safest+part.+4.+Think+of+God%E2%80%99s+love+and+forbearance+towards+us+before+we+received+the+light+of+his+truth%2C+and+were+brought+to+the+obedience+of+his+will%E2%80%A6+If+we+had+been+dealt+with+rigorously%2C+we+had+been+cut+off+from+the+number+of+God%E2%80%99s+people%2C+had+such+stumbling-blocks+and+prejudices+laid+in+our+way%2C+that+we+should+never+have+been+converted+to+God.+5.+This+forbearance+cannot+in+reason+be+expected+from+others+to+ourselves%2C+if+we+be+not+ready+to+repay+it+to+others.+There+is+no+man+which+hath+not+infirmities+of+his+own+which+call+for+forbearance%E2%80%A6+We+have+all+our+failings+and+mistakes%3B+usually+God+punisheth+censures+with+censures%E2%80%A6+Paul%2C+that+stoned+Stephen%2C+was+himself+stoned+at+Lystra.+So+he+punisheth+separations+with+separations%3B+they+are+endless%2C+as+circles+in+the+water+beget+one+another.+6.+Consider+how+dangerous+it+is+to+reject+any+whom+Christ+will+own+for+his.+Will+Christ+admit+him+to+heaven%2C+and+will+you+think+him+unfit+for+your+communion+here+upon+earth%3F%E2%80%A6+Now+what+greater+offence+than+to+cast+them+off+from+the+privileges+of+the+Christian+church%2C+either+by+public+or+private+censures+which+are+causeless+or+unwarrantable%2C+at+least+no+way+grounded+on+necessary+things%3F+7.+As+we+must+not+on+our+part+give+offence+or+occasion+the+divisions%2C+so+we+must+not+take+offence+when+it+is+given+by+others%3B+for+charity%2C+as+it+provoketh+not%2C+so+it+%E2%80%98is+not+easily+provoked%2C%E2%80%99+%281+Cor.+13%3A50%29.+So+likewise+if+a+rent+be+made+by+others%2C+we+must+do+what+we+can+to+heal+it.+If+an+angry+brother+call+us+bastard%2C+yet+let+us+own+him+as+a+brother+and+a+child+of+the+family%3A+for+%E2%80%98Blessed+are+the+peacemakers%2C%E2%80%99+%28Mt.+5%3A9%29.+The+world+censureth+us+for+compliers+and+daubers%2C+but+God+counteth+us+his+genuine+and+true+children.+8.+Our+endeavours+after+unity+among+the+professors+of+Christianity+ought+to+be+earnest+and+constant+%28Eph.4%3A3%29.+I+add+this+partly+because+many+make+fair+pretences+of+peace+and+union%2C+which+their+practice+contradicteth%3B+all+cry+out+of+the+divisions%2C+but+every+one+keepeth+them+up%3B+and+partly%2C+because+when+it+is+endeavoured+we+shall+find+difficulties+and+disappointments%2C+but+we+must+not+rest+in+some+careless+endeavours%2C+nor+grow+weary+though+we+meet+not+with+present+success%3B+and+partly+because+the+instruments+of+so+great+a+good+are+usually+sacrificed+to+the+wrath+of+both+parties.+We+must+be+content+to+digest+affronts%2C+reproaches%2C+censures%2C+and+injuries%2C+and+love+them+that+hate+us+%282+Cor.+12%3A15%29.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+%E2%80%98A+Persuasive+to+Unity+in+Things+Indifferent%E2%80%99+on+Phil.+3%3A15+in+Several+Discourses+tending+to+Promote+Peace+%26+Holiness+among+Christians+in+Works+%28London%3A+Nisbet%2C+1861%29%2C+vol.+2+%7C+Abridged%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5af7415952.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5af7415952.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/unity-of-the-church/#:~:text=Doctrine%3A%20When%20God%E2%80%99s%20people%20are%20divided,that%20hate%20us%20%282%20Cor.%2012%3A15%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-18d4d3a7ca" data-kw="">
<blockquote><p>Both of you, take heed ye bring not your differences any more unto public, nor otherwise put them among the people: Keep them amongst yourselves, where they may abide with less hurt, Rom. 14:1 &amp; 22. Considering the mischiefs of evulgating them, it will evidently appear happy to bury them in silence or oblivion. If ye interest and engage the people therein, then are ye gone; and beside other inconvenients thereof, ye shall not get leave to unite again without their consent, which may be hard to gain. How long shall any affect popularity, and thereby subject their ministerial authority to the humors of men and women for drawing them to their side to strengthen their party? by which means people are taught to domineer over ministers and may fore-run you, and cast at yourselves next when ye begin to sit up and not go along with all their notions and inclinations. Ye may perhaps find no small difficulty to regulate and bridle their humors, being once aloft, Fortur equis auriga, non audit currus habenas. Moreover, what do ye by filling people’s heads with such entangling controversies but divert their minds and take them off the main thing? and turn religion into factions and debates? and wear them out of heart-tenderness, real exercise of conscience and the serious study of universal holiness? If any make it their work to kindle in religious hearers a factious, opinionative zeal, you may thereby trouble their heads, not better their hearts and may sooner make them firebrands to burn down the peace, purity and order of the Church than living polished stones for the New Jerusalem. Yea, likely you may unhinge them so as to tempt them to cast at all ministers, at all religion, and turn either atheists or Seekers and sectarians, as woeful experience has many times proved, even in our own days; so small a friend to the promoting of piety, is division. Avoid then carefully to discover your intestine jars and animosities before the people in public or private. Bear not your nakedness to their eyes. Teach them not to meddle with things above their sphere and beyond their line (Ps. 131:1-2) and turn them not aside unto vain janglings, Tit. 3:9; 2 Tim. 2:17-18; 1 Tim. 1:6-7; 4:7; 6:4-5. Make it rather your work to edify them in the substantials of religion and vitals of piety, such as faith and repentance, humility, sobriety, mortification, self-denial, love and new obedience, etc. How much better were it to fire their hearts with the love of God and man than to heat their heads with puzzling debates, which do but perplex, not edify, and are far out of the way of their salvation or duty, and does not at all concern their practice. What profit reap they by being inveighed into such quicksands? We have seen many unfleeced of their wool, yea torn in their flesh, by being involved in such thorns, but never any advantaged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, pp. 152-54</span></figcaption>

<blockquote><p>That however your judgment stand in the matter contraverted (for we are to impose upon nobody’s judgment, but to leave everyone to their own light), yet ye who are… fomenters of the division, consider, though ye be but few, yet the stir ye make is great, and one man will easily raise more fire than twenty will be able to extinguish. Therefore be exhorted in the fear of God to carry the difference more soberly. Are your brethren willing to let you enjoy your judgments and serve your light in your own practice? and to live in peace with you, notwithstanding the difference? And as to things wherein ye and they are agreed to join with you therein, till God in his time clear up the mistake that is betwixt you, and show upon whose side it is? and will not ye be content unless ye impose your apprehensions upon them and have them conform unto, and lackey after your opinion and practice? must your judgment be the standard and canon to everybody else? and all be anathematized that differ in the least from you? Can there be no peace with you unless ye have leave to trail them at your heels? will ye agree with none that are not of your mind in everything? then Actum est de pace, peace is gone foever on this side of time; for, Non datur intellectus Averroisticus, men’s minds to jump to an ace in all things is hardly to be expected. While we know only in part, will there not be perpetually different measures of light? and diversity of apprehensions in many things? Theology has its own problems, even in greater points than this, which calls for sobriety and mutual tolerance. As we are not for skepticism, nor sinful syncritisms, so we tremble at the vanity of dogmatizing in things of this nature. But whatever ye deem it, treat not your brethren indiscreetly. Speak or write to them, rather than of them. Argue the case with them, convince them if ye can, Lk. 19:17, but usurp not a magistery over them; presume not to be dictators to them more, than ye would take it well they should impose on you, Jam. 3:1. Remember they must serve their own consciences, and be guided by their own light, and not yours, Rom. 14:12. Ye think them wrong, so do they, no doubt, you: But how would ye take it if they served you as ye do them, with outrageous out-cries, virulent epistles and Philippic declamations? What if they did preach against you, your divisive principles and unbrotherly practices, as Erroneous and Donatistical (if not worse), as ye call theirs Erastian? What a pitiful taking would ye and they be in by such Contradictions and invectives? Do therefore no otherwise than ye would be done unto, Mt. 7:12. Think ye are but men fallible, and may be mistaken in not a few of your confident notions; and that it is possible they may have as much of the mind of Christ as you. Therefore reverence their judgments, so far at least as not lightly to trample upon the same: Or, if ye were sure they were in the wrong, yet think, surely they mind honestly (as they judge ye do) and have not wickedly departed from the Lord, Ps. 18:21. If they be stepped aside, it is but for want [lack] of light, which ye (who think ye see more) should pity and bemoan to God, and labor to discover their mistake unto them (for as yet ye cannot charge them with contumacy, sufficient conviction never being yet held forth unto them). But, O! reproach them not; rate them not behind their backs; go not to preach them down, nor out of the hearts of honest people, much less to preach their own people from them! What service were that to Christ, or his Kingdom? or what edification unto people? Sure ye do more hurt than ye are aware of by this course, staggering and unsettling people, weakening your honest brethren’s hands in the Gospel, and marring the success of their labors what ye can. See Jam. 3:16; Gal. 5:14-15. But what? are not ye and they agreed in chiefest principles and theses? What’s your difference then but about the application of principles to some hypotheses or particular cases and practices? The intricacy whereof, with the sense of your short-sightedness, may teach you to think, speak and act more soberly and with all due respect to them that differ from you. O fall not into a stated schism upon so small and disputable a matter! nor lift up yourselves in conceit above your fellows! Are ye preachers of Christ? so are they: Have ye the seal of your labors, so have they; and that they have not more is perhaps through your fault, your contending with them, thereby confounding and distracting their people and taking them off their souls’ ease, by your perplexing controversies and exceptions against their ministers. And if ye continue by this contending to discourage your brethren and enervate the work of God in their hands, fear lest ye be found guilty of destroying so much of the Kingdom of Jesus Christ, [be] and countable for the blood of these souls whose edification ye mar, by abusing and amusing them with your bartering at their ministers and bringing them and their preaching into disesteem, so far as ye can, as Zech. 13:7, ‘Smite the shepherd, and the sheep shall be scattered.’ And what have ye gained when this is done? What advantage is it to the Gospel, to break so many faithful men’s ministry? And what peace will it yield you when accomplished? Bella geri placuit, nullos habitura triumphos. It were but a Cadmean victory. What! may still the old question be put unto you: Does your piety and zeal lie all in negatives? (as theirs in Col. 2:21) Are ye only skillful to destroy? and bold to treat the friends of Christ like foes? Preach the Gospel and propagate real godliness as much as ye can: but O! beware of hurting the Lord’s work and vineyard in your brethren’s hands! Will it not be but a poor vassalage to preach down your brethren, while ye should preach up Christ? and to propagate your private opinions more than the power of piety? or to draw disciples after you more than after Christ? Were it not better make one real Christian than proselyte twenty to your side and party? Ye complain of your brethren’s want [lack] of success, as Peninnah upbraided Hannah with her barrenness; but do not ye much mar their fruitfulness? O be tender of them, for the Gospel’s sake! Go, we pray you, convert the profane to piety rather than preach professors into faction and parties. Mind the great interest of the Gospel more than your particular debates or personal interests. Away with selfish designs under a spiritual mask! Beware of giving ground for that old complaint, Faciunt causam suam, causam publicam. Let not your excellent parts, fervor, zeal and spirits be spent upon so unprofitable a task as this of jangling, plunging, and confounding is. And tempt not people to any unhappy courses, which yourselves may repent of in the end, and come off with that inconsiderate warrior’s word in your mouth, Non putarum— It is easy to kindle a fire, but not so easy to set bounds unto it when and where ye list, saying, ‘Hitherto shalt thou come, but no further.’ Nay, once kindled, it may rage whither soever the winds and aptness of the matter to take with it may carry it, till all be burned down to ashes. And finally, let not your brethren have cause to take up that sad regrate of the psalmists, Ps. 55:12-14, ‘Had it been an enemy,’ etc. How bitter is this? Were it rampant Romanists, or inimical Prelatists, or foul mouthed sectaries who thus battered at honest ministers, it were more tolerable? But to see brethren at such odds, tearing the flesh (as it were) off the bones of their brethren by bitter railings and reproaches (which are as drawn swords, Ps. 57:4), how incongruous and unkindly is that? and may not the world wonder at it? What! shall all your edge and sting be turned against them, no less upright than yourselves? Shall they have no such adversaries as you whom they love and desire to be at peace with? and with whom they agree in all things (almost) else? Will ye do the Prelates work for them, in breaking that little liberty which at first they trembled at, till they saw you made it a bone of contention? and so more likely to break yourselves and it both than to hurt them, while ye stumble so upon it. What thanks will ye get for joining issues with them? See Obad. vv. 10-14. And will ye so positively condemn your brethren unheard (Jn. 7:51) and persecute them as apostates before ever ye wair an admonition on them? It is our admiration and astonishment, that some of you (as is informed) takes the confidence to baffle them in sermons, letters and private discourses to the people and others; and yet to this day never used the brotherliness to write or speak unto themselves what might have sufficed to convince them of their error, if any be. The grossest of heretics are not allowed by the rules of the Word to be so hardly dealt with, Tit. 3:10. Pronounce no anathema upon them till ye first take pains sufficient to reclaim them and find them obstinate. Shall ye be sharper scourges in their sides and thorns in their eyes than any others? Do ye like it, to put them to cry to God against you and (like Job) to complain of their friends mockage, injustice and cruel usage? Shall not God visit for these things? Zeph. 2:8; Obad. vv. 10-14. Beware of inventing or venting stories and reproaches of such friends of Christ! And make not calumnies the strongest arguments you plead against them with. Monopolize not the reputation of honesty to yourselves; give your brethren charity, and treat them not disrespectively. To stigmatize your brethren with black characters and odious imputations, consider again and again what spirit it comes from, Jam. 3:9-12. Upon all these grounds and many more which might be added, be intreated (in the bowels of Christ) to remit and relent of your acrid fervor and bring your dispositions and differences to some temper, and manage your discord with more sobriety. We think we may say the two part of your differences lies more in the acrimony of your spirits and alienation of affection than in the distance of your principles. Would ye let go the misunderstanding and prejudices that are between you, and God heal your dispositions and distempers, the two parts of your disease were away.</p></blockquote>

+were+that+to+Christ%2C+or+his+Kingdom%3F+or+what+edification+unto+people%3F+Sure+ye+do+more+hurt+than+ye+are+aware+of+by+this+course%2C+staggering+and+unsettling+people%2C+weakening+your+honest+brethren%E2%80%99s+hands+in+the+Gospel%2C+and+marring+the+success+of+their+labors+what+ye+can.+See+Jam.+3%3A16%3B+Gal.+5%3A14-15.+But+what%3F+are+not+ye+and+they+agreed+in+chiefest+principles+and+theses%3F+What%E2%80%99s+your+difference+then+but+about+the+application+of+principles+to+some+hypotheses+or+particular+cases+and+practices%3F+The+intricacy+whereof%2C+with+the+sense+of+your+short-sightedness%2C+may+teach+you+to+think%2C+speak+and+act+more+soberly+and+with+all+due+respect+to+them+that+differ+from+you.+O+fall+not+into+a+stated+schism+upon+so+small+and+disputable+a+matter%21+nor+lift+up+yourselves+in+conceit+above+your+fellows%21+Are+ye+preachers+of+Christ%3F+so+are+they%3A+Have+ye+the+seal+of+your+labors%2C+so+have+they%3B+and+that+they+have+not+more+is+perhaps+through+your+fault%2C+your+contending+with+them%2C+thereby+confounding+and+distracting+their+people+and+taking+them+off+their+souls%E2%80%99+ease%2C+by+your+perplexing+controversies+and+exceptions+against+their+ministers.+And+if+ye+continue+by+this+contending+to+discourage+your+brethren+and+enervate+the+work+of+God+in+their+hands%2C+fear+lest+ye+be+found+guilty+of+destroying+so+much+of+the+Kingdom+of+Jesus+Christ%2C+%5Bbe%5D+and+countable+for+the+blood+of+these+souls+whose+edification+ye+mar%2C+by+abusing+and+amusing+them+with+your+bartering+at+their+ministers+and+bringing+them+and+their+preaching+into+disesteem%2C+so+far+as+ye+can%2C+as+Zech.+13%3A7%2C+%E2%80%98Smite+the+shepherd%2C+and+the+sheep+shall+be+scattered.%E2%80%99+And+what+have+ye+gained+when+this+is+done%3F+What+advantage+is+it+to+the+Gospel%2C+to+break+so+many+faithful+men%E2%80%99s+ministry%3F+And+what+peace+will+it+yield+you+when+accomplished%3F+Bella+geri+placuit%2C+nullos+habitura+triumphos.+It+were+but+a+Cadmean+victory.+What%21+may+still+the+old+question+be+put+unto+you%3A+Does+your+piety+and+zeal+lie+all+in+negatives%3F+%28as+theirs+in+Col.+2%3A21%29+Are+ye+only+skillful+to+destroy%3F+and+bold+to+treat+the+friends+of+Christ+like+foes%3F+Preach+the+Gospel+and+propagate+real+godliness+as+much+as+ye+can%3A+but+O%21+beware+of+hurting+the+Lord%E2%80%99s+work+and+vineyard+in+your+brethren%E2%80%99s+hands%21+Will+it+not+be+but+a+poor+vassalage+to+preach+down+your+brethren%2C+while+ye+should+preach+up+Christ%3F+and+to+propagate+your+private+opinions+more+than+the+power+of+piety%3F+or+to+draw+disciples+after+you+more+than+after+Christ%3F+Were+it+not+better+make+one+real+Christian+than+proselyte+twenty+to+your+side+and+party%3F+Ye+complain+of+your+brethren%E2%80%99s+want+%5Black%5D+of+success%2C+as+Peninnah+upbraided+Hannah+with+her+barrenness%3B+but+do+not+ye+much+mar+their+fruitfulness%3F+O+be+tender+of+them%2C+for+the+Gospel%E2%80%99s+sake%21+Go%2C+we+pray+you%2C+convert+the+profane+to+piety+rather+than+preach+professors+into+faction+and+parties.+Mind+the+great+interest+of+the+Gospel+more+than+your+particular+debates+or+personal+interests.+Away+with+selfish+designs+under+a+spiritual+mask%21+Beware+of+giving+ground+for+that+old+complaint%2C+Faciunt+causam+suam%2C+causam+publicam.+Let+not+your+excellent+parts%2C+fervor%2C+zeal+and+spirits+be+spent+upon+so+unprofitable+a+task+as+this+of+jangling%2C+plunging%2C+and+confounding+is.+And+tempt+not+people+to+any+unhappy+courses%2C+which+yourselves+may+repent+of+in+the+end%2C+and+come+off+with+that+inconsiderate+warrior%E2%80%99s+word+in+your+mouth%2C+Non+putarum%E2%80%94+It+is+easy+to+kindle+a+fire%2C+but+not+so+easy+to+set+bounds+unto+it+when+and+where+ye+list%2C+saying%2C+%E2%80%98Hitherto+shalt+thou+come%2C+but+no+further.%E2%80%99+Nay%2C+once+kindled%2C+it+may+rage+whither+soever+the+winds+and+aptness+of+the+matter+to+take+with+it+may+carry+it%2C+till+all+be+burned+down+to+ashes.+And+finally%2C+let+not+your+brethren+have+cause+to+take+up+that+sad+regrate+of+the+psalmists%2C+Ps.+55%3A12-14%2C+%E2%80%98Had+it+been+an+enemy%2C%E2%80%99+etc.+How+bitter+is+this%3F+Were+it+rampant+Romanists%2C+or+inimical+Prelatists%2C+or+foul+mouthed+sectaries+who+thus+battered+at+honest+ministers%2C+it+were+more+tolerable%3F+But+to+see+brethren+at+such+odds%2C+tearing+the+flesh+%28as+it+were%29+off+the+bones+of+their+brethren+by+bitter+railings+and+reproaches+%28which+are+as+drawn+swords%2C+Ps.+57%3A4%29%2C+how+incongruous+and+unkindly+is+that%3F+and+may+not+the+world+wonder+at+it%3F+What%21+shall+all+your+edge+and+sting+be+turned+against+them%2C+no+less+upright+than+yourselves%3F+Shall+they+have+no+such+adversaries+as+you+whom+they+love+and+desire+to+be+at+peace+with%3F+and+with+whom+they+agree+in+all+things+%28almost%29+else%3F+Will+ye+do+the+Prelates+work+for+them%2C+in+breaking+that+little+liberty+which+at+first+they+trembled+at%2C+till+they+saw+you+made+it+a+bone+of+contention%3F+and+so+more+likely+to+break+yourselves+and+it+both+than+to+hurt+them%2C+while+ye+stumble+so+upon+it.+What+thanks+will+ye+get+for+joining+issues+with+them%3F+See+Obad.+vv.+10-14.+And+will+ye+so+positively+condemn+your+brethren+unheard+%28Jn.+7%3A51%29+and+persecute+them+as+apostates+before+ever+ye+wair+an+admonition+on+them%3F+It+is+our+admiration+and+astonishment%2C+that+some+of+you+%28as+is+informed%29+takes+the+confidence+to+baffle+them+in+sermons%2C+letters+and+private+discourses+to+the+people+and+others%3B+and+yet+to+this+day+never+used+the+brotherliness+to+write+or+speak+unto+themselves+what+might+have+sufficed+to+convince+them+of+their+error%2C+if+any+be.+The+grossest+of+heretics+are+not+allowed+by+the+rules+of+the+Word+to+be+so+hardly+dealt+with%2C+Tit.+3%3A10.+Pronounce+no+anathema+upon+them+till+ye+first+take+pains+sufficient+to+reclaim+them+and+find+them+obstinate.+Shall+ye+be+sharper+scourges+in+their+sides+and+thorns+in+their+eyes+than+any+others%3F+Do+ye+like+it%2C+to+put+them+to+cry+to+God+against+you+and+%28like+Job%29+to+complain+of+their+friends+mockage%2C+injustice+and+cruel+usage%3F+Shall+not+God+visit+for+these+things%3F+Zeph.+2%3A8%3B+Obad.+vv.+10-14.+Beware+of+inventing+or+venting+stories+and+reproaches+of+such+friends+of+Christ%21+And+make+not+calumnies+the+strongest+arguments+you+plead+against+them+with.+Monopolize+not+the+reputation+of+honesty+to+yourselves%3B+give+your+brethren+charity%2C+and+treat+them+not+disrespectively.+To+stigmatize+your+brethren+with+black+characters+and+odious+imputations%2C+consider+again+and+again+what+spirit+it+comes+from%2C+Jam.+3%3A9-12.+Upon+all+these+grounds+and+many+more+which+might+be+added%2C+be+intreated+%28in+the+bowels+of+Christ%29+to+remit+and+relent+of+your+acrid+fervor+and+bring+your+dispositions+and+differences+to+some+temper%2C+and+manage+your+discord+with+more+sobriety.+We+think+we+may+say+the+two+part+of+your+differences+lies+more+in+the+acrimony+of+your+spirits+and+alienation+of+affection+than+in+the+distance+of+your+principles.+Would+ye+let+go+the+misunderstanding+and+prejudices+that+are+between+you%2C+and+God+heal+your+dispositions+and+distempers%2C+the+two+parts+of+your+disease+were+away.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%2C+1681%29%2C+pp.+141-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0201af1316.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0201af1316.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=That%20however%20your%20judgment%20stand%20in,parts%20of%20your%20disease%20were%20away." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

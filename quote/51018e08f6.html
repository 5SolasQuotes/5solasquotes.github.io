<main class="wrap"><figure class="quote" id="q-51018e08f6" data-kw="">
<blockquote><p>There be two happy things (worthy Reader), as one says, ‘The one is not to err, the other is to escape from the power of error.’ (Cassian, De incarnatione, bk. 1, ch. 4) Time’s womb brings forth many truths, though truth be not a debtor to time, because time puts new robes on old Truth; but truth is God’s debtor and owes her being to Him only. It is a great evil under the sun and the sickness of man’s vanity that the name of holy men should be a web to make garments of for new opinions, but the errors of holy men have no whiteness, nor holiness from men. And it is a wrong that men’s praise should be truth’s prejudice, and men’s gain, truth’s loss. Yet I shall heartily desire that men herein observe the art of deep providence, for the Creator commands darkness to bring forth her birth of light, and God does so over-awe, with a wise super-dominion, men’s errors, that contrary to nature’s way, from collision of opinions, results truth; and disputes, as stricken flint, cast fire for light, God raising out of the dust and ashes of errors a new living truth. What mistakes, errors, or heresies have been anent Church government, that vigilant and never slumbering wisdom of providence has thence made to appear the sound doctrine of God’s Kingdom. So here Satan shapes and God sews and makes the garment. Error is but dregs, by the artifice of all compassing Providence, from whence are distilled strong and cordial waters. And what Antichrist has conceived for a hierarchy and human ceremonies, has put Christ in his two witnesses in Britain to advocate for the truth and native simplicity of his own Kingdom. But I heartily desire not to appear as an adversary to the holy, reverend and learned [congregationalist] Brethren who are sufferers for the truth, for there be wide marches betwixt striving and disputing. Why should we strive? for we be brethren, the sons of one father, the born citizens of one mother Jerusalem. To dispute is not to contend. We strive as we are carnal, we dispute as we are men, we war from our lusts, we dispute from diversity of starlight and daylight. Weakness is not wickedness, a roving of wit must not be deemed a rebellion of will, a broken engine may part with a dead child and yet be a mother of many healthy children. And while our reverend and dear Brethren, fleeing the coast of Egypt and Babylon’s wicked borders, aim to shore upon truth, wind may deceive good sailors; natural land-motions (as when heavy bodies move downward toward their own (clay country) are upon a straight line. But sea-motions of sailing are not by right lines, but rather by sea-circles. We often argue and dispute as we sail. Where grace and weight of Scripture make motion, we walk in a right line toward God. But where opinion, a messenger only sent to spy the Land of lies and truth, usurps to conduct us, what marvel then we go about truth rather than lodge with truth. And Christ his Kingdom, scepter, glory, Babylon’s fall, be the material object of opinions, on both sides; and yet the Word of God has a right lith [joint], that cannot suffer division. In God’s matters there be not as in grammar the positive and comparative degrees: there are not here truth, and more true, and most true. Truth is in an indivisible line, which has no latitude and cannot admit of splitting. And therefore we may make use of the Philosopher’s word, amicus Socrates, amicus Plato, sed magis amica veritas [Socrates a friend, Plato a friend, but most of all, truth is a friend]. Though Peter and Paul be our beloved friends, yet the truth is a dearer friend: The sons of Babylon make outcries of divisions and diversity of religions amongst us, but every opinion is not a new religion. … But I leave off, and beg from the Reader candor and ingenuous and fair dealing; from Formalists, men in the way to Babylon, I may wish this, I cannot hope it. Farewell.</p></blockquote>

<blockquote><p>So at this day, the public weal does sometime promise rewards unto such as can best handle their weapons, to the intent their citizens may be the better exercised. Howbeit, there must be heed taken, that the kinds of plays be not hurtful and pernicious, and that therein be no danger of killing, maiming, or miserable tearing them, which either exercise themselves or be present, or be assembled to behold. And this kind of games is forbidden Ad legem Aquiliam, in the law, Nam ludus, and in the decrees De tormentis. Those things which of their owne nature be not evil, but are evil oftentimes through that which ensues ought to be forbidden.</p></blockquote>

<blockquote><p>Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…</p></blockquote>

— Martin Bucer, On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 54, ‘Honest Games’, pp. 352-53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+from+gymnastic+art+those+sports+will+have+to+be+proposed+to+youth+which%2C+besides+what+they+contribute+to+the+health+and+preservation+of+the+body+and+the+production+of+graceful+movements%2C+also+render+men+fit+and+ready+for+military+service+and+the+advantageous+use+of+arms.+Young+men+should+therefore+exercise+themselves+in+running%2C+jumping%2C+wrestling%2C+horseback+riding%2C+the+handling+of+all+arms+and+weapons+which+are+used+for+open+and+hand-to-hand+combat%2C+the+arrangement+of+battle+formations%2C+the+positioning+of+camp%2C+and+mock+battle+%28Plato%2C+Laws%2C+VII%2C+803c%2C+813d-e%29.+To+these%2C+nobles+may+add+the+exercise+of+hunting.+These+exercises+which+pertain+to+military+science+ought+to+be+so+constituted+and+conducted+in+such+a+serious+manner+that+they+approximate+as+much+as+possible+the+actual+operations+of+war%2C+as+Plato+has+said+%28Plato%2C+Laws+VII%2C+824+a-c%29%E2%80%A6+according+to+the+words+of+the+psalm%3A+%E2%80%98It+is+God+who+girds+me+with+strength+for+war+and+prepares+my+path%E2%80%99+%28Ps.+18%3A32%29.+In+charge+of+these+sports%2C+as+of+the+kind+previously+mentioned%2C+there+should+always+be+men+singularly+experienced+in+the+field+involved%2C+men+of+universal+wisdom+most+zealous+for+all+piety+and+virtue%2C+who+are+admired+and+therefore+have+the+authority+and+power+to+relate+and+to+adapt+all+youthful+sport+to+a+zeal+for+and+practice+of+the+virtues%2C+which+is+the+one+goal+of+all+sports+among+Christians%3B+for+we+have+been+created+for+the+praise+of+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+On+the+Reign+of+Christ+in+Melanchthon+%26+Bucer%2C+ed.+Wilhelm+Pauck+%28Philadelphia%3A+Westminster+Press%2C+1969%29%2C+bk.+2%2C+ch.+54%2C+%E2%80%98Honest+Games%E2%80%99%2C+pp.+352-53&amp;url=https%3A%

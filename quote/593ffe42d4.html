<blockquote><p>It has been the sad observation of diverse, that every new trial has been the occasion of a new difference, if not division. The Lord partly, in his holy displeasure, withdrawing light and chastising his people for their sins, and partly trying and exercising of them in that great duty of mutual forbearance, so little made conscience of; and partly discovering infirmities, much dross in his own, by the contests so carnally managed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, … (London: Cockerill, 1681), Preface, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-978bf93c61" data-kw="">
<blockquote><p>Fourthly, it is objected, that what concerns all, ought to be done with the consent of all. Answer: We hold the same, but the consent of all is one thing, the exercise of jurisdiction by all, another thing. Ainsworth, in one of his epistles to Paget, condemns the elderships sitting and judging matters apart from the congregation. Paget answers, that though the eldership sit apart to judge, yet before any sentence be given for the cutting off of any offender, or for any other thing which concerneth all, matters are first propounded to the whole church, and their prayers and consent required. And surely this form of proceeding shines forth to us in that apostolical synod at Jerusalem…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (Edinburgh, 1846), Part 2, Concerning the Assemblies of the Church of Scotland, and the Authority Thereof, Ch. 1, ‘Of Popular Government in the Church’; p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

k">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c02d3587ac" data-kw="">
<blockquote><p>But because he conceives the dissenting churches to be true churches also, their ministers generally men of real piety, good learning, and zealously active to save immortal souls… And… because he finds the discipline of the Established Church defective… on the other hand [he] finds the preaching of the dissenting ministers generally more close, methodical, and lively; their ministrations more pure, without those human mixtures… the power of practical religion is more visibly kept up among them… These, and other considerations of the like nature, determine him to hold stated communion with some dissenting congregation, where he thinks himself better edified than in the parochial assemblies. He judges himself obliged to get the best helps he can for his soul, and thinks he ought not to be more restrained in the choice of a spiritual guide for the benefit of his soul than he is in the choice of a lawyer or physician for the preserving of his estate and bodily health.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue</cite>, … (London: Baldwin, 1703), pp. 11-12 Owen (1654-1706) was an English, congregationalist puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-c8a0ce7831" data-kw="">
<blockquote><p>II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For: 1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess. 2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e55b8e106f" data-kw="">
<blockquote><p>Indeed we must remember that the love, election and predestination of God are ordered among themselves and follow on one another for a certain reason. First, all men in their unhappy estate are presented to the knowledge of God, as needy and miserable, then those of whom God of his pure and simple mercy loves and for whom He wills the good are distinguished from those He passes over, who are not comprehended within his benevolence: by this distinction they are said to be elect; the elect, truly, are appointed toward their end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, trans. Richard Muller, Christ &amp; the Decree, p. 65, from Common Places, III.i.10, p. 449. See Muller’s discussion generally for the other infralapsarian characteristics of Vermigli’s view.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>VII. We indeed admit that if we consider the value of Christ’s death, it is of such great worth, both because of the perfection of the expiation for our sins and because of the infinite dignity of Christ, the God-man, that it is not only sufficient to expiate the sins of the faithful but also to save all the descendants of Adam, even if they were much more numerous, provided they embraced its merit with true faith. And thus, the reason that all are not saved lies not in the insufficiency of Christ’s death, but in the depravity and unbelief of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on the Universality of the Death of Christ</cite>, tr. by AI by Chaznvo (Leiden, 1636) Latin</span></figcaption>

</figure><figure class="quote" id="q-6400ffae23" data-kw="">
<blockquote><p>Remember (sirs) Jerusalem might have been gathered, even as a hen gathers her chickens under her wings, but she would not; if you will not, Christ has washed his hands of your blood: your damnation is of yourselves. And ah! think, (poor creatures) think what bad terms these are to be damned upon: what a gnawing upon your conscience in Hell another day will it be to think, ‘If I would I might have been saved; Heaven and glory might have been mine if I would, but now I am tormented, and shall be so forever, because I would not have the Lord Jesus Christ;’ this makes damnation the heavier, to think, there is no more required but only to open the door to receive the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Collings</cite>, vol. 1 (London: Tomlins, 1655), Sermon 9, “A Cordial for a Fainting Soul”, pp. 153–54</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e1c78fe855" data-kw="">
<blockquote><p>Now it should be noted that the Holy Spirit insults the people of the Law and of works here by calling them “sons of the slave woman.” It is as though He were to say: “Why do you boast about the righteousness of the Law and of works and brag that on its account you are the people and the children of God? If you do not know whence you have your birth, I will tell you. You were born as slaves and of a slave woman. What sort of slaves? Of the Law, sin, death, and eternal damnation. A slave is not an heir but is cast out of the house.” Therefore the pope, with all his regime and whatever other self-righteous people there are, regardless of how saintly they may be in appearance, who trust they will obtain grace and salvation through laws human or divine—all of them are sons of the slave woman who will not inherit with the sons of the free woman but will be cast out of the house. And I am not speaking now about the ungodly monks, who worshiped their belly as god (Phil. 3:19) and committed horrible sins that I would just as soon not mention, but about the best of them, to whom I and many others belonged, who lived holy lives and tried with might and main to appease the wrath of God and to merit the forgiveness of sins and eternal life by the observances of their religious order. These men must now hear the sentence that the sons of the slave woman are to be cast out of the house together with the slave woman, their mother. When they are carefully considered, such sentences provide us with certainty and reassurance regarding the doctrine and the righteousness of faith, in opposition to the doctrine and the righteousness of works. The world embraces and praises the latter, and it despises and condemns the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 457–58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Some have upon these words made a question whether it be lawful for the husband or the wife separated for adultery to marry again while each other lives. As to the party offending, it may be a question; but as to the innocent person offended, it is no question, for the adultery of the person offending has dissolved the knot of marriage by the Divine law. It is true that the knot cannot be dissolved without the freedom of both persons each from another, but yet it seemeth against reason that both persons should have the like liberty to a second marriage. For:

1. The adulteress is by God’s law a dead woman, and so in no capacity to a second marriage.

2. It is unreasonable that she should make an advantage of her own sin and error.

3. This might be the occasion of adultery, to give a wicked person a legal liberty to satisfy an extravagant lust. But for the innocent person, it is as unreasonable that he or she should be punished for the sin of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on Matthew</cite>, ch. 19, v. 9</span></figcaption>

<blockquote><p>Obiection II. There was blood and things strangled forbidden in the council at Jerusalem after Christ’s ascension, Acts 15. Answer. It was forbidden only in regard of offence and for a time, so long as the weak Jew remained weak, not in regard of conscience. And therefore afterward Paul says that all things, even blood itself was lawful, though not expedient, in regard of scandal (1 Cor. 6:12). And to the pure all things are pure (Titus 1:15).</p></blockquote>

</figure><figure class="quote" id="q-a1b9e52002" data-kw="">
<blockquote><p>It is true, indeed, a prince should be loath to put out that life that God hath put in, and should beware, to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince hath no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate the punishment, but to say he may let the man go free, he hath no power. But yet they will insist further, and say, Is not this one of the judicial laws that was given to the Jews—then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them—they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know, that natural men, ethnics, who had never the law of the Jews, they executed the murderer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures Upon The Passion, Resurrection, And Ascension Of Christ</cite>, (Edinburgh: The Wodrow Society, 1616), 87–88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

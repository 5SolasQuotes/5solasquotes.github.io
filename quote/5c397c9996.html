<main class="wrap"><figure class="quote" id="q-5c397c9996" data-kw="">
<blockquote><p>Two great miscarriages moreover I was prone to fear the most would be guilty of, which I have especially consulted against. The first, of being swallowed up so much with a sense of their Suffering, as to be indisposed for all profitable Reflections; and therefore fain would I turn men’s eyes and thoughts from off this, to the sin that brought it; and have them only to consider the former, so much as to inform themselves more clearly of the evil of the latter.

Oh what Out-cries we may hear up and down, what doleful times these are! So many Thousands dead this Week, so many another! The Plague got to this Town, and then to that! All Trading, as well as Persons, dead and gone! But were People formerly thus affected, whilst we were bringing this upon our selves? Did they cry out then, Oh how many Thousand Oaths are sworn in a Week? And how many Lies told? How many Thousands Drunk, and how many commit Lewdness?

Had we had Weekly Bills of such Sins brought in, they would far have exceeded the largest Sums that ever yet the Mortality made. But alas! these with the most were light matters. Not half so many groans and tears for these, nor any such complaints of them; nor did the consideration of them make any sensible alteration amongst us. Now this I would fain obtain, to have those days thought as much worse than these; and those actions as much worse than these sufferings, as the Disease is worse than Physick; and a Child’s disobedience to his Parents, worse than his being Whipped: And he that should weep out of pity to the Child, when he sees it lashed; and yet could be content to hear him revile and abuse his father, I should think to be a person of more Fondness, than Discretion; and for him to be more concerned for the Child’s Smart, than the Parent’s Honour, argues him to have no true love for either.

And here by the way let me give a Caution, viz. That no man bewray so much folly as to argue, That because in mercy God may abate and remove his heavy Judgments, before many, or perhaps any of these sins I have mentioned are put away from amongst us; and because we may have our former health and plenty restored, whilst there is no such Reformation of disorders as I have exhorted to, that therefore our Sufferings were not intended to chastise us for those sins, nor to bring us to this Reformation.

If thou be an Atheist or Infidel that makest this Argument, who believest not there is a God, or that he concerns not himself with our Affairs, but that all things come by Nature or Chance, or I know not what, I shall then leave thee to receive satisfaction (if nothing sooner will give it) there, where all such as thou, by the feeling of Divine Vengeance, are at once convinced what the sin is which hath deserved it, and that there is a God who inflicts it; but if thou be a Christian, then I would wish thee well to examine the nature of the thing, (that I mean, which thou thinkest God hath not punished us for, because it is yet continued) and upon the issue of that examination, pass thy judgment. It’s much to be feared thou wilt see Drunkards, and hear Swearers, after the Plague may be ceased; and wilt thou think therefore that these, and the like Wickednesses, did not provoke God to afflict us?

But rather stay, if thou art in doubt, till the great reckoning day, till thou hast heard all men’s Accounts cast up, and those Actions which are then approved confidently pronounce no sins; but not all those that survive the heaviest Judgments here on earth, which may be sent to punish and reform those that were guilty of them; since hardened sinners may frustrate some ends of an Affliction, and all are not followed here, as Pharaoh was. No, I say, do not justify all such Actions, though thou shouldst hear them openly defended, and applauded, and those men punished that dare to oppose and contradict them, and that opposition made the only sin. This lower world is full of such mad mistakes and confusions, but all will shortly be set strait.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Solomon’s prescription for the removal of the pestilence, or, The discovery of the plague of our hearts, in order to the healing of that in our flesh</cite>, (London, 1665), preface to the reader.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0f2cdba7fc" data-kw="">
<blockquote><p>It is a noble temper to be afraid of sin. If a person pretends conscience for a particular opinion and practice, and in the mean time be a common drunkard, swearer, liar, blasphemer, unclean person, one that lives as it were without God in the World, making no conscience of reading the Scripture, praying, bringing up and governing his Family in the nurture and fear of the Lord, only pretends conscience as to baptizing of Children, keeping the Seventh day Sabbath; this man is an hypocrite, and dissembles with God and men for there is an uniformity in conscience, and it would certainly oblige him to avoid known and confessed sins, as much as what he doth fancy is a sin, and as much oblige him to all, as to any known duty.

But where I see a Christian walking close with God in the general of his conversation, and differing from me in this or that point, because he thinks he cannot without sin believe and practise what I do; I cannot but love and honour him, and be very far from their Religion who think it the best and most Gospel way to cudgel him into my Persuasion: A Gaol, or a Fire and Faggots never yet cured an erring Conscience. Such Brethren though overtaken with a fault are certainly (according to the Apostle’s counsel) to be restored in the spirit of meekness, and to be dealt with, (like rational Creatures) argued, and treated, and persuaded out of their mistakes, not cudgelled out of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), epistle dedicatory.</span></figcaption>

<blockquote><p>Yet this is not the whole truth of the matter. We do assert that God, that is, the whole Godhead, is one person…. In other words, we are bound to maintain the identity of the attributes of God with the being of God in order to avoid the specter of brute fact.” …Over against all other beings, that is over against created beings, we must therefore hold that God’s being presents an absolute numerical identity. And even within the ontological Trinity we must maintain that God is numerically one. He is one person. We say that we believe in a personal God we do not merely mean that we believe in a God to whom the adjective “personality” may be attached. God is not an essence that has personality; He is absolute personality. Yet, within the being of the one person we are permitted and compelled by Scripture to make the distinction between a specific or generic type of being, and three personal subsistences.</p></blockquote>

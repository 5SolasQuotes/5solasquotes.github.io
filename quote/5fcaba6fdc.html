<blockquote><p>every word that appertains to God may be required and discussed, and all knowledge of things out of them may be understood. But if anything do remain which the holy Scripture ought to be received to authorize any knowledge; but that which remains we must commit to the fire, that is, we must reserve it to God. For in this present world God would not have us to know all things.</p></blockquote>

<blockquote><p>…notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canticles, or Song of Songs, Opened &amp; Explained</cite>, … (London, 1642), ch. 2, pp. 60-61</span></figcaption>

</figure><figure class="quote" id="q-b3c2026ab0" data-kw="">
<blockquote><p>‘Which is your reasonable service;’ or, which is agreeable to reason; nothing is more reasonable, than that you should devote yourselves to God in this manner… Others, by ‘reasonable service,’ understand spiritual service, and expound this place by 1 Peter 2:5, where you read of spiritual sacrifices acceptable to God by Jesus Christ… And so the service or worship here spoken of is opposed to that will worship, of which you read in Colossians 2:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Whole Bible</cite>, (d. 1679), on Romans 12, verse 1</span></figcaption>

</figure><figure class="quote" id="q-5bda63cb70" data-kw="">
<blockquote><p>Divine worship is that which is performed in acknowledgement of Deity, or any divine excellency, in that to whom it is performed. This is due to God alone.</p></blockquote>

</figure><figure class="quote" id="q-6dd71bd322" data-kw="">
<blockquote><p>He certainly did not suspect the Corinthians of such a degree of ignorance or carelessness as to think that they worshipped idols in their heart. But as they made no scruple of frequenting the assemblies of the wicked, and observing along with them certain rites instituted in honor of idols, he condemns this liberty taken by them, as being a very bad example. It is certain, then, that when he here makes mention of idolatry, he, speaks of what is outward, or, if you prefer it, of the profession of idolatry. For as God is said to be worshipped by the bending of the knee, and other tokens of reverence, while the principal and genuine worship of Him is inward, so is it also as to idols, for the case holds the same in things opposite. It is to no purpose that very many in the present day endeavor to excuse outward actions on this pretext, that the heart is not in them, while Paul convicts of idolatry those very acts, and assuredly with good reason. For, as we owe to God not merely the secret affection of the heart, but also outward adoration, the man who offers to an idol an appearance of adoration takes away so much of the honor due to God. Let him allege as he may that his heart is quite away from it. The action itself is to be seen, in which the honor that is due to God is transferred to an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 10, verse 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

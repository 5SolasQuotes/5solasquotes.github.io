<blockquote><p>The [opposing] author expresses what his meaning is in the other part of this book: for he describes these [church] officers and these laws, what they are: Concerning all which this I say in general, that here is nothing but palpable ignorance to be found, for first these governing officers, pastors, doctors, elders, deacons and relievers, being five in number, are so necessarily required that the want [lack] of these or any of these in a congregation, causes it to be no Church apparant… Secondly, that the want of elders takes not away the esse or being of the church, considering that Christ and his disciples which joined with Him were the apparant Church, and yet during the time of his humiliation these officers were not erected. And when many revolted, as is to be seen, Jn. 6, Christ asking the twelve if they also would go away, Peter answered in the name of the rest, ‘Master to whom shall we go, Thou hast the words of eternal life?’ so that Peter accounts the Word a sufficient warrant for his continuing with Christ, howsoever these men though they confess that the Word of God is to be heard, yet deny the hearing of it at their mouths which have not ordained elders among them. But this may seem no sufficient proof which is taken from Christ and his disciples forasmuch as this discipline was not then commanded. I answer that if there were a time when the Church of Christ was without this government, and forasmuch as it received not the government of the Jews, it is not a perpetual rule that outward government should be the life of the Church. But I will not hold them in this straight: they ask where we can find a Church without this government after that Christ had sent his Spirit upon the disciples. I answer that as Timothy was left at Ephesus, so was Titus in Crete, I mean in the House of God, which is the Church of the living God. And yet at that time elders were not appointed in that Church before Titus had ordained them: not to speak of the Church of Jerusalem, which made choice of deacons, but not of elders. Also it is plain that the elders which were appointed in the churches by the apostles were for the most part such as dealt in the Word, and not in goverment only, as hereafter shall be made more manifest in his due place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alison.html">Richard Alison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Confutation of a Treatise of Brownism (London: Scarlet,1590), A Plain Confutation</cite>, pp. 24-26</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12221e6ad1" data-kw="">
<blockquote><p>2. The law-fear upon a believer is conditional, and not absolute, as he fears hell and falling away, jure, as his deserving, if God should enter in judgment with him, and if he were not in Christ. But he is obliged to a Gospel-faith which lays hold on Christ, righteousness, and deliverance from condemnation; and if Christ and interest in Him be hid from him, and nothing on but law-fear, that is a trial, not a duty of law-fear. (So the faith of Joseph and Mary, that Christ their son shall be great, shall sit in the throne of David his father and shall reign over the house of Jacob forever, Lk. 1:32-33, did well consist with that holy and obediential fear of fleeing into Egypt, for fear that Herod should murdher that hopeful young King in his cradle, Mt. 2) But there is a godly law-fear, or a Gospel-law-fear, which is a godly horror conditional for that which is never to be inflicted, but yet according to deserving may be inflicted; and this is the terror of the Lord, which breeds Gospel persuasion, 2 Cor. 5:11, and so may well stand with Gospel-faith and assurance of deliverance from falling away and of being stablished and confirmed to the end. As a child in the father’s arm threatened to be cast over a sharp rock in the sea, may have horror and fear and cry out for fear, and yet believe so his father’s compassion as he will not through him in the sea, because the threatening is ordained not to be exercised, but that the child may so much the more thrust his arms about his father’s neck.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenant of Life Opened… (Edinburgh: Anderson, 1655), pt. 1</cite>, ch. 27, p. 218</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-8aa7884766" data-kw="">
<blockquote><p>There is a twofold ministerial power: 1. Potestas ordinis, which consists merely in preaching the Word and administring the sacraments. 2. Jurisdictionis, whereby they govern in the Church, by binding the impenitent and losing the penitent.¹ ¹ …’Discipline’ is used sometimes largely, so as it extends to all rule and order, appointed or left for the right managing of the things of God, or strictly for the censures of the Church. So there may be a true Church without discipline. The Helvetians and those of Switzerland have no suspension [from the Table or Church] at all, but what offences other Churches suspend for the civil magistrate punishes other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London: A.M., 1654), bk. 6, ch. 3, ‘Of Ecclesiastical Jurisdiction &amp; Government’</cite></span></figcaption>

<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>

t online · Reformed Books Online</a></div>

<blockquote><p>I distinguish between the Church and her external polity: That which is essential to the Church’s being never ceases, but that which is essential to her outward polity may, because polity itself is not essential. The Church, for being, like Christ as God, never dies; but in her external order, like Christ as man, she dies and rises again.</p></blockquote>

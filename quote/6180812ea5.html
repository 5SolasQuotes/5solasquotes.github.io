<main class="wrap"><figure class="quote" id="q-6180812ea5" data-kw="">
<blockquote><p>Seek the peace of the common wealth and the safety thereof: for in the peace thereof your peace doeth stand. In this sort God is to be feared, in this sort of all sorts he is to be served: and by this mean the common wealth is to be maintained and preserved.

If we, linked together in the fear of God, and in true concord and amity among our selves, put to our helping hands every one dutifully in his calling, to the supporting of this state, and defending thereof; doubtless no enemy, no foreign power can hurt us, no Bull of Bashan shall prevail against us: but we and our common wealth in despite of all both corporal and spiritual enemies, shall be strengthened and stablished for ever. So true is it, that kingdom which is grounded upon good will, standeth fast and sure for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 42.</span></figcaption>

</figure><figure class="quote" id="q-2e8b168620" data-kw="">
<blockquote><p>V. Religion should be cared for by all, chiefly be Magistrates and Ministers. For they are the Churches nursing Fathers, by preserving Schools and Churches, and by maintaining of Ministers, &amp;c.

[…]

IX. Religion may be defended by arms but not propagated by arms.

Examples of pious Kings, the Maccabees, Emperors as Constantine and Theodosius shew this.

X. Reformation of things amiss in Religon, belong to the prince or Magistrate.

After the examples of Moses, Joshua, David, Asa, Jehosaphat, Hezekiah, Josiah, Constantine, Theodosius, &amp;c.</p></blockquote>

<blockquote><p>Question 80, Abortion of a Woman from a Brawl Between Two Men. …Well, the fact that the author [of Exodus] did not want the unborn childbirth to belong to the homicide proves that he thought that it was not man that is carried in the mother’s womb. Here the problem of the soul is usually posed, that is, if what is not formed cannot be said to be animated, and therefore, that it would not be a homicide, since it cannot be affirmed that a being that had not yet had soul.</p></blockquote>

</figure><figure class="quote" id="q-2e5d8328ba" data-kw="">
<blockquote><p>It [magistracy] is an ordinance of men, not effectively, as if it were an invention and a dream of men; but subjectively, because exercised by man. Objectively, and [Greek, telikos], for the good of men, and for the external man’s peace and safety especially; whereas church -officers are for the spiritual good of men’s souls. And Durandus says well (Book on the Origin of Right), “Civil power according to its institution is of God, and according to its acquisition and way of use is of man.” And we may thus far call the forms of magistrates ‘a human ordinance’ [2 Pet. 2]—that some magistrates are ordained to care for men’s lives and matters criminal, of life and death, and some for men’s lands and estates; some for commodities by sea, and some by land; and are thus called magistrates according to these determinations or human ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (Edinburgh: Ogle &amp; Boyd, 1843), p. 6 (lt col top)</span></figcaption>

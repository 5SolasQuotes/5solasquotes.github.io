<main class="wrap"><figure class="quote" id="q-e503c8d926" data-kw="">
<blockquote><p>That the ceremonies are a great hindrance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about. The heathenish priests labored, per varietatem ceremoniarum, rem in pretio retinere [for a variety of ceremonies, a thing of great value to be retained]. The use for which Papists appoint their ceremonies is, ut externam quandam Majestatem sensibus obijciant [that they may cast a certain external majesty before the senses]: And so are the ceremonies urged upon us thought to conciliate reverence and due regard to divine worship, and to stir up devotion. In the meanwhile it is not considered that mentes humanae mirifice capiuntur &amp; fascinantur, ceremoniarum splendore &amp; pompa [human hearts are wonderfully captivated and fascinated by the splendor and pomp of ceremonies]. Videmus siquidem, says Bucer, vulgus delectari actionibus scanicis, &amp; multis uti signis. Chemnitius marks of the cumulating of ceremonies in the ancient Church, that it drew to this, ut tandem in theatricum ferme apparatum ceremonia illa abierint [that so at last by ceremonies they may go wholly prepared to the theater]. Musculus reprehends bishops for departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple. The policy, then, which is most simple and single, and least lustered with the pomp and bravery of ceremonies, cannot but be most expedient for edification. The king’s daughter is most like herselfe when she is all glorious within (Ps. 45:13), not without, and the Kingdom of God appears best what it is, when it comes not with observation (Lk. 17:20-21): But superstition (says [John] Cameron, Popish Prejudices, ch. 10), the mother of ceremonies, is lavish and prodigal; spiritual whoredom as it is, it has this common with the bodily: both of them must have their paintings, their trinkets, their invenglements. Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external. In the second commandment are forbidden omnes Ritus, qui a spirituali Dei cultu discrepant (Calvin, Commentary Ex. 20:5). ‘The Kingdom of God is within you’, says Christ. (Lk. 17:21)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies… (Edinburgh, 1637), 2nd Part, ch. 4, ‘That the Ceremonies are Inexpedient Because they Hinder Edification’</cite>, pp. 19-20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1aff900802" data-kw="">
<blockquote><p>The second point is that the outward worship does not please God of itself, but by means of the inward before described. Again, it is spiritual, not by itself, because it stands in bodily actions; but by reason of the inward worship, whence it proceeds and whereof it is a sign. Moreover, being severed from inward worship, it is worship in show, and not worship in truth. If they eye be evil, the whole body is dark. (Mt. 6:13) Christ bids the Pharisees to wash the inside of the cup and platter, and then all shall be clean (Mt. 23:25-26).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 707</span></figcaption>

</figure><figure class="quote" id="q-ac344361c5" data-kw="">
<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, vol. 3, 18th Topic, Question 31, section III</cite>, p. 286</span></figcaption>

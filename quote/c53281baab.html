<main class="wrap"><figure class="quote" id="q-c53281baab" data-kw="">
<blockquote><p>the Schoolmen manage it as an insuperable difficulty: Whether God could have made the world, or any thing better than it is? If you will pardon me for making that easy which they make ineffable, I answer: Goodness is primitive (that is, God) or derivative, which only is in creatures. This last is formally good, as it is related as conformed to God’s will, the Prime Good, as its rule: To be a Deo volitum [having been willed by God], is the formal notion of created good. And so the world is perfect, and can be no better, because it is as God wills it: and yet God can make particular creatures better to themselves, and to one another; He can make any man more wise, more holy, etc. But bonum sibi [good with respect to Him] is no further properly bonum, than it is volitum a Deo: Therefore God can make the world far otherwise than it is; and yet then it would be no better. For still it would be but as God willed it to be: So that the matter and private goodness might alter; but the true form of goodness would be still just the same as now.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), sect. 1, ‘Of our Knowledge of God as here Attainable’, p. 2, margin note</span></figcaption>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1028b83b72" data-kw="">
<blockquote><p>Hence we define the creation of the world as an external action of the almighty God… whereby… He founded the heavens and the earth out of nothing, at the beginning of time. And in the space of six days He arranged in their proper order all the individual things which He willed to mold from that prime matter…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of Pure Theology</cite>, (Brill, 2015), vol. 1, disputation 10, ‘Concerning the Creation of the World’, pp. 248-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

— Johannes Polander, Synopsis of Pure Theology (Brill, 2015), vol. 1, disputation 10, ‘Concerning the Creation of the World’, pp. 248-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+we+define+the+creation+of+the+world+as+an+external+action+of+the+almighty+God%E2%80%A6+whereby%E2%80%A6+He+founded+the+heavens+and+the+earth+out+of+nothing%2C+at+the+beginning+of+time.+And+in+the+space+of+six+days+He+arranged+in+their+proper+order+all+the+individual+things+which+He+willed+to+mold+from+that+prime+matter%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johannes+Polander%2C+Synopsis+of+Pure+Theology+%28Brill%2C+2015%29%2C+vol.+1%2C+disputation+10%2C+%E2%80%98Concerning+the+Creation+of+the+World%E2%80%99%2C+pp.+248-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1028b83b72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1028b83b72.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=Hence%20we%20define%20the%20creation%20of,to%20mold%20from%20that%20prime%20matter&amp;text=Hence%20we%20define%20the%20creation%20of%20the%20world&amp;text=He%20willed%20to%20mold%20from%20that%20prime%20matter" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1fa55170b9" data-kw="">
<blockquote><p>Conservation, as it is here understood, is defined as the action by which a being from-another remains in the existence it has received. It is double, namely: a) Negative, or the action by which what can destroy the existence of the thing is removed or impeded. Penicillin, for example, which destroys bacteria, conserves the health of the body; b) Positive is the act that consists in the positive inflow by which a thing is continually given existence. Hence it is a sort of continued creation. Conclusion 24: All created things are positively conserved in existence by God. Whatever does not have in itself a reason for its existence positively requires, if it remains in existence, a cause of its remaining in existence. But there cannot be an infinite regress in conserving causes, because such causes need to exist simultaneously; therefore the thing is conserved positively by God as first cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-32d4291ae7" data-kw="">
<blockquote><p>[Thomas, Summa, pt. 1, quest. 25, art. 2:] Reply to second objection. ‘Even if it were to produce no effect, the power of God would not be ineffectual: because a thing is ineffectual which is ordained to an end to which it does not attain. But the power of God is not ordered toward its effect as toward an end; rather it is the end of the effect produced but it.’ St. Thomas in this reply observes that ‘the power of a univocal agent is wholly manifested in its effect. The generative power of man is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect,’ just as the power of the sun is not wholly manifested, for instance, in the ripening of the fruits of the earth. But God evidently is not a univocal agent. ‘Hence his effect is always less than his power.’ Nevertheless His infinite power is manifested in the mode of producing things, inasmuch as He produces something out of nothing, or from no presupposed subject. Analogically we say that men of great genius are superior to the works they produce; but it is, nevertheless, in the way they produce these works that their superiority is seen. On the contrary, men of ordinary ability are, so to speak, univocal agents, and the whole of their power is manifested in the effect produced. They could not do more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The One God</cite>, (Herder Book Co., 1943), ch. 25, p. 721</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-90594fc31d" data-kw="">
<blockquote><p>The possible, on the other hand, can be defined as that to which existence is not repugnant. So it is the same as the notion of being or of thing, and it includes both actually existing things and things that do not actually exist but can exist. For something to be possible in this sense, both extrinsic and intrinsic impossibility must be excluded. Logical possibility in the broad sense therefore includes both internal non-repugnance to existing (logical possibility properly speaking) and, if the being is causable, virtual existence in its cause (virtual possibility).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

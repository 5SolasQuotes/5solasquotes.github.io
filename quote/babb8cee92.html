<main class="wrap"><figure class="quote" id="q-babb8cee92" data-kw="">
<blockquote><p>Thirdly, in respect of the public loss, they mourn for the decay of the righteous: for when multitudes of all nations, and of all sorts of people, do know the ways of God, and praise the name of God, then (as the Prophet saith) the earth shall bring forth her increase, and God even our God shall bless us. If there be but ten righteous men and women in a City, or some few in a whole Country, all the rest shall speed the better for their sakes: how much more then if there be multitudes of them? What a grief therefore must it needs be to the wise and godly, when these props and pillars of the Church and Common-wealth are taken away?

Which serveth,

First, for the just reproof of those that doe carry a deadly enmity against the multitude of Christians that now are, and do much grieve that there should be so many that resort unto the word in public, that read it in private, that have prayer and singing of Psalms in their families, &amp;c. they grudge and murmur at it, as if some conspiracy or mutiny against the State were towards, and as if the good of men’s souls, and the peace of the commonwealth could not stand together.

These are of another spirit then David was, who lamented that there were so few such: and these are indeed utter enemies unto God, who esteems his people to be his chief treasure under heaven: and therefore they shall bear their judgment, whosoever they be that doe thus malice the servants of God, and endeavour to pervert them, or to diminish the number of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal</cite>, (London: William Welbie, 1611), pp 66-67.</span></figcaption>

</figure><figure class="quote" id="q-7d64ca73d6" data-kw="">
<blockquote><p>Judge, therefore, reader, whether the pope with his be the church; whether their authority be above the scripture; whether all they teach without scripture be equal with the scripture; whether they have erred, and not only whether they can. And against the mist of their sophistry take the ensamples that are past, in the Old Testament and authentic stories, and the present practice which thou seest before thine eyes.

Judge whether it be possible that any good should come out of their dumb ceremonies and sacraments into thy soul. Judge their penance, pilgrimages, pardons, purgatory, praying to posts, dumb blessings, dumb absolutions, their dumb pattering, and howling, their dumb strange holy gestures, with all their dumb disguisings, their satisfactions and justifyings. And because thou findest them false in so many things, trust them in nothing; but judge them in all things.

Mark at the last the practice of our fleshly spirituality and their ways, by which they have walked above eight hundred years; how they establish their lies, first, with falsifying the scripture; then through corrupting with their riches, whereof they have infinite treasure in store; and last of all, with the sword. Have they not compelled the emperors of the earth, and the great lords and high officers to be obedient unto them, to dispute for them, and to be their tormentors …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Sir Thomas More’s Dialogue, The Supper of the Lord after the True Meaning of John VI. and 1 Cor. XI., and WM. Tracy’s Testament Expounded, ed. Henry Walter (Cambridge: The Parker Society, 1850), pp 9-10.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

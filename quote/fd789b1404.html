</figure><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation</cite>, [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

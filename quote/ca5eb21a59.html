<main class="wrap"><figure class="quote" id="q-ca5eb21a59" data-kw="">
<blockquote><p>There is another Scripture, that is always brought in upon this Head of Argument, Ezek. xxxiii. 11. Where the Lord declares, with the Solemnity of an Oath, As I live, saith the Lord God, I have no Pleasure in the Death of the wicked, but that the wicked turn from his Way and live. When the Lord says, he has no Pleasure in the Death of the Wicked; the plain Sense of the Words is, that the Death and Misery of Sinners is not a Pleasure to him in itself, or for its own Sake, merely as it is a Misery to the Creature.

But this doesn’t say, but that their Death and Punishment may be agreeable and pleasing to him, under other Considerations; as it is an Execution of Justice, and Manifestation of his own Glory. If it were not so, Would he inflict Punishment upon any of them? Would he displease and make himself uneasy? And when he says, That it is a Pleasure to him, that the Wicked turn from his Way, and Live.

The Meaning is, that righteousness and Holiness in his Creatures, and the Happiness consequent upon it, is the Object of his Approbation and Liking, a Thing, in itself, agreeable and pleasing to his holy Nature. But this, sure, is no Proof, that he equally and alike designed the Sanctification and Salvation of all Sinners. If it proved any thing this Way, it would prove, that he designed it certainly for them all, if his Power could effect it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-blair.html">Samuel Blair</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of predestination truly and fairly stated: confirmed from clear Scripture-evidence, and defended against all the material arguments and objections advanced against it</cite>, (Philadelphia PA: B. Franklin, 1742), p. 58.</span></figcaption>

</figure><figure class="quote" id="q-249daec26d" data-kw="">
<blockquote><p>Immensity is God present everywhere, neither included in, nor excluded from any place or thing (Deus est sphaera, cujus centrum est ubique, circumferentia nusquam. Enter proesenter Deus hic et ubi{que} potenter), Ps. 139:7; Isa. 60:1. God is a sphere whose center is everywhere, the circumference nowhere. God is nowhere and God is everywhere: He is nowhere in that He is not contained anywhere; He is everywhere in that He contains all. Hence God in respect of his omnipresence is compared to an infinite point. God is in every place by his essence as the universal cause of the being and operation of all things, by his presence, beholding all things; and by his power upholding all things. Besides that omnipresence of God whereby He is always present with all creatures, there are certain peculiar ways of his presence with diverse creatures. In Christ He dwells bodily, that is, personally, Col. 2:9, and fills the manhood with the Spirit out of measure, Jn. 3:34. In the saints He dwells as in his temple by the presence of his indwelling Spirit, the effect of his special grace, 1 Cor. 3:16. He is said to dwell in Heaven because it is the place wherein He is pleased to manifest his glory immediately and in most excellent manner unto the blessed. God is said to come to us and depart from us, not in respect of his universal presence or change of place, but in respect of the degrees of his indwelling Spirit, assisting grace and other special effects of his favor towards his people. The same also holds true in respect of the common effects of the Spirit in regard of others. Bodies are in places circumscriptively bounded by their dimensions without penetration. Angels are in places definitively, that is, though they are not bounded by dimensions of height, breadth and depth, as bodies, yet they are not in two places at once; whilst they are in this place, they are not in another. God is in every place always.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, p. 8</span></figcaption>

</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

</figure><figure class="quote" id="q-3b8fb9adf1" data-kw="">
<blockquote><p>The Divine Will, Antecedent and Consequent ‘The will.’ says St. Thomas (Ia, q. 19, a. 6, ad 1), ‘is related to things as they are in themselves, with all their particular circumstances. Hence we will a thing simply (simpliciter) when we will it with all its concrete circumstances. This will we call the consequent will… Thus it is clear that everything which God wills simpliciter comes to pass. If, on the contrary, we will a thing in itself good, but independently of its circumstances, this will is called the antecedent will, or conditional will, since the good in question is not realized here and now. That man should live, says St. Thomas (Ibid.), is good. But if the man is a murderer, it is good that he be executed. Antecedently, God wills that harvests come to maturity, but He allows for some higher good, that not all harvests do in fact mature. Similarly, He wills antecedently the salvation of all men, tough for some higher good, of which He alone is judge, He permits some to sin and perish… It is thus that St. Thomas harmonizes God’s antecedent will, of which St. John Damascene speaks, with God’s omnipotence. . The Supreme Principles Nothing comes to pass, either in heaven or on earth, unless God either brings it to pass in mercy, or then in justice permits it. This principle, taught in the universal Church, shows that there is in God a conditional and antecedent will, relative to a good which does not come to pass, the privation of which He permits in view of some higher good. … All that God wills, He does. This principle has no exception. All that God wills (purely, simply, unconditionally) comes to pass without our freedom being thereby in any way forced, because God moves that freedom sweetly and strongly, actualizing it, not destroying. He wills efficaciously that we freely consent and we do free consent. The supreme efficacy of divine causality, says St. Thomas (Ia, q. 19, a. 6), extends to the free mode of our acts… Hence we find that in the ninth century, to terminate the long controversy with Gottschalk, the Council of Thuzey (860), at the instance of the Augustinian bishops, harmonized God’s will of universal salvation with the sinner’s responsibility. That Council’s synodal letter (OL, CXXVI, 123; Denz., 17th ed., p. 145, no. 320, note 2.) contains this sentence: Whatever He has willed in heaven or on earth, God has done. For nothing comes to pass in heaven or on earth that He does not in mercy bring to pass or permits to come to pass in justice. Since God’s love is the cause of created goodness, says St. Thomas (Ia, q. 20, a. 3), no created thing would be better than another, if God did not give one a great[er] good than He gives to another. This is equivalent to St. Paul’s word: What has thou that thou hast not received? (1 Cor. 4:7)</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Divine Will, Antecedent and Consequent ‘The will.’ says St. Thomas (Ia, q. 19, a. 6, ad 1), ‘is related to things as they are in themselves, with all their particular circumstances. Hence we will a thing simply (simpliciter) when we will it with all its concrete circumstances. This will we call the consequent will… Thus it is clear that everything which God wills simpliciter comes to pass. If, on the contrary, we will a thing in itself good, but independently of its circumstances, this will is called the antecedent will, or conditional will, since the good in question is not realized here and now. That man should live, says St. Thomas (Ibid.), is good. But if the man is a murderer, it is good that he be executed. Antecedently, God wills that harvests come to maturity, but He allows for some higher good, that not all harvests do in fact mature. Similarly, He wills antecedently the salvation of all men, tough for some higher good, of which He alone is judge, He permits some to sin and perish… It is thus that St. Thomas harmonizes God’s antecedent will, of which St. John Damascene speaks, with God’s omnipotence. . The Supreme Principles Nothing comes to pass, either in heaven or on earth, unless God either brings it to pass in mercy, or then in justice permits it. This principle, taught in the universal Church, shows that there is in God a conditional and antecedent will, relative to a good which does not come to pass, the privation of which He permits in view of some higher good. … All that God wills, He does. This principle has no exception. All that God wills (purely, simply, unconditionally) comes to pass without our freedom being thereby in any way forced, because God moves that freedom sweetly and strongly, actualizing it, not destroying. He wills efficaciously that we freely consent and we do free consent. The supreme efficacy of divine causality, says St. Thomas (Ia, q. 19, a. 6), extends to the free mode of our acts… Hence we find that in the ninth century, to terminate the long controversy with Gottschalk, the Council of Thuzey (860), at the instance of the Augustinian bishops, harmonized God’s will of universal salvation with the sinner’s responsibility. That Council’s synodal letter (OL, CXXVI, 123; Denz., 17th ed., p. 145, no. 320, note 2.) contains this sentence: Whatever He has willed in heaven or on earth, God has done. For nothing comes to pass in heaven or on earth that He does not in mercy bring to pass or permits to come to pass in justice. Since God’s love is the cause of created goodness, says St. Thomas (Ia, q. 20, a. 3), no created thing would be better than another, if God did not give one a great[er] good than He gives to another. This is equivalent to St. Paul’s word: What has thou that thou hast not received? (1 Cor. 4:7)”

— Reginald Garrigou-Lagrange, Reality: a Synthesis of Thomistic Thought, (Herder Book Co., 1950), ch. 59, Efficacious Grace">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Divine+Will%2C+Antecedent+and+Consequent+%E2%80%98The+will.%E2%80%99+says+St.+Thomas+%28Ia%2C+q.+19%2C+a.+6%2C+ad+1%29%2C+%E2%80%98is+related+to+things+as+they+are+in+themselves%2C+with+all+their+particular+circumstances.+Hence+we+will+a+thing+simply+%28simpliciter%29+when+we+will+it+with+all+its+concrete+circumstances.+This+will+we+call+the+consequent+will%E2%80%A6+Thus+it+is+clear+that+everything+which+God+wills+simpliciter+comes+to+pass.+If%2C+on+the+contrary%2C+we+will+a+thing+in+itself+good%2C+but+independently+of+its+circumstances%2C+this+will+is+called+the+antecedent+will%2C+or+conditional+will%2C+since+the+good+in+question+is+not+realized+here+and+now.+That+man+should+live%2C+says+St.+Thomas+%28Ibid.%29%2C+is+good.+But+if+the+man+is+a+murderer%2C+it+is+good+that+he+be+executed.+Antecedently%2C+God+wills+that+harvests+come+to+maturity%2C+but+He+allows+for+some+higher+good%2C+that+not+all+harvests+do+in+fact+mature.+Similarly%2C+He+wills+antecedently+the+salvation+of+all+men%2C+tough+for+some+higher+good%2C+of+which+He+alone+is+judge%2C+He+permits+some+to+sin+and+perish%E2%80%A6+It+is+thus+that+St.+Thomas+harmonizes+God%E2%80%99s+antecedent+will%2C+of+which+St.+John+Damascene+speaks%2C+with+God%E2%80%99s+omnipotence.+.+The+Supreme+Principles+Nothing+comes+to+pass%2C+either+in+heaven+or+on+earth%2C+unless+God+either+brings+it+to+pass+in+mercy%2C+or+then+in+justice+permits+it.+This+principle%2C+taught+in+the+universal+Church%2C+shows+that+there+is+in+God+a+conditional+and+antecedent+will%2C+relative+to+a+good+which+does+not+come+to+pass%2C+the+privation+of+which+He+permits+in+view+of+some+higher+good.+%E2%80%A6+All+that+God+wills%2C+He+does.+This+principle+has+no+exception.+All+that+God+wills+%28purely%2C+simply%2C+unconditionally%29+comes+to+pass+without+our+freedom+being+thereby+in+any+way+forced%2C+because+God+moves+that+freedom+sweetly+and+strongly%2C+actualizing+it%2C+not+destroying.+He+wills+efficaciously+that+we+freely+consent+and+we+do+free+consent.+The+supreme+efficacy+of+divine+causality%2C+says+St.+Thomas+%28Ia%2C+q.+19%2C+a.+6%29%2C+extends+to+the+free+mode+of+our+acts%E2%80%A6+Hence+we+find+that+in+the+ninth+century%2C+to+terminate+the+long+controversy+with+Gottschalk%2C+the+Council+of+Thuzey+%28860%29%2C+at+the+instance+of+the+Augustinian+bishops%2C+harmonized+God%E2%80%99s+will+of+universal+salvation+with+the+sinner%E2%80%99s+responsibility.+That+Council%E2%80%99s+synodal+letter+%28OL%2C+CXXVI%2C+123%3B+Denz.%2C+17th+ed.%2C+p.+145%2C+no.+320%2C+note+2.%29+contains+this+sentence%3A+Whatever+He+has+willed+in+heaven+or+on+earth%2C+God+has+done.+For+nothing+comes+to+pass+in+heaven+or+on+earth+that+He+does+not+in+mercy+bring+to+pass+or+permits+to+come+to+pass+in+justice.+Since+God%E2%80%99s+love+is+the+cause+of+created+goodness%2C+says+St.+Thomas+%28Ia%2C+q.+20%2C+a.+3%29%2C+no+created+thing+would+be+better+than+another%2C+if+God+did+not+give+one+a+great%5Ber%5D+good+than+He+gives+to+another.+This+is+equivalent+to+St.+Paul%E2%80%99s+word%3A+What+has+thou+that+thou+hast+not+received%3F+%281+Cor.+4%3A7%29%E2%80%9D%0A%0A%E2%80%94+Reginald+Garrigou-Lagrange%2C+Reality%3A+a+Synthesis+of+Thomistic+Thought%2C+%28Herder+Book+Co.%2C+1950%29%2C+ch.+59%2C+Efficacious+Grace&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b8fb9adf1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b8fb9adf1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=The%20Divine%20Will%2C%20Antecedent%20and%20Consequent,hast%20not%20received%3F%20%281%20Cor.%204%3A7&amp;text=The%20Divine%20Will%2C%20Antecedent%20and%20Consequent%20%E2%80%98The%20will&amp;text=that%20thou%20hast%20not%20received%3F%20%281%20Cor.%204%3

<main class="wrap"><figure class="quote" id="q-685d5658fa" data-kw="">
<blockquote><p>Dost thou give anything to God? offer up any obedience? do it in the sight of thine own weakness and imperfection, and so thou worshippest Him, through whom our lame sacrifices are acceptable, Col. 3:17, for none but God could do this for us.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

rch%20may%20be%20corrupted%20many%20ways%2C%20in&amp;text=The%20Churches%20of%20Protestants%20so%20separated%20from%20Rome" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-103454afe4" data-kw="">
<blockquote><p>If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682), ‘On the Holiness of God’, p. 564</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)”

</figure><figure class="quote" id="q-4ed6c390d0" data-kw="">
<blockquote><p>For if we should suppose that the rites and ceremonies were as expressly set down in the Gospel to be used or forborne in the public worship of God, as the rites and circumstances concerning sacrifices were in the ceremonial law: yet as the sacrifices themselves, much more the modes of preparing and offering them, might be used or omitted for the performance of moral duties, so doubtless, if things of an external, ceremonial nature had been commanded or forbidden in express terms, they might yet be observed or omitted as the substantial service of God and obedience to his greater commands, for charity and peace, might be best performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Character of a Separatist, or Sensuality the ground of Separation</cite>, (London: Kettilby, 1677), Preface concerning the Ceremonies of the Church. Long was a conformist.</span></figcaption>

</figure><figure class="quote" id="q-2815f4ead8" data-kw="">
<blockquote><p>Again, hereby all Popish corruptions and mixtures brought into this sacrament [of baptism] are confuted and condemned, as their cream, their tapers [candles], their crosses, their censers, their salt, their spittle, their holy-water, their exorcisings and conjurations, having also an opinion of salvation and worship annexed unto them… True it is, if all the other parts and actions be observed, these inventions and additions, which are so many abuses make not baptism void, neither bring a nullity therof…</p></blockquote>

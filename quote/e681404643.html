</figure><figure class="quote" id="q-ab7a949e00" data-kw="">
<blockquote><p>The question (so far as we can understand them in it) is, ‘Whether such a submission be due from all the members of this Kirk, ministers and people, to the judicatories of the Kirk, and from the inferior to the superior Kirk-judicatories in matters of government and discipline, as ought upon the sentence (whether just or unjust) of these judicatories to sist [stop or delay] the proceedings of the person or party grieved therewith, and make them acquiesce thereunto, until the determination of the respective superior judicatory therein, without any counteracting to the same, unless it be to appeal unto, and follow their appeal before the superior judicatory?’ Upon this question we find the Brethren for the Protestation in their last paper at the conference, Nov. 25, 1655, expressing their judgment thus: ‘We are willing to subject ourselves to all the just sentences of the lawful assemblies of this Kirk; and if the case were only of a few particular persons, in things of more private interest and personal concernment, and of judicatories employing their power to edification in the current of their actings, we should not much contend about it; but when it is of a great number of godly ministers and elders and professors throughout the land, who do desire to stand in the breach, and to oppose the present course of defection, and of judicatories, the plurality whereof in many places do not act unto edification and for promoving the power of godliness, but to the contrary, it alters the case.’ .. It is to us, and we believe will be to all sober and unbiased men, who understand the principles of Church-government, new and strange doctrine [that of the Resolutioners], that an absolute and unlimited subjection to all sentences (whether just or unjust, or agreeable or repugnant to the Word of God) should be asserted to be at all of kin or alliance to the divine ordinance of presbyterial government, which is a part of the sweet and gentle yoke of Jesus Christ, that is far from tyranny and oppression. … If presbyterial government has (as we do believe and assert it to have) its foundation in the Testament of Jesus Christ, upon whose shoulder the Government is, then whatsoever is of the essence and being thereof, must derive itself from the fountain of Christ’s Revealed Will about the constitution and essentials of that government? But we know no tittle in his Book that says as our [Resolutioner] Brethren say, or from which, what they say in this matter, can be deduced by good and necessary consequence, to wit, that it is essential to the government which He has appointed His House to be ruled by, that all the children of the House should submit unto, and acquiesce in the determination of the governors, without any counteracting, though their sentence be contrary to the Law and the Testimony; and therefore till our [Resolutioner] Brethren prove this, they will give us leave to deny it. We acknowledge that power and authority, and subjection and submission are co-relatives, and that the power and authority of the superior can no more actually subsist without the subjection and submission of the inferior, than one relative can subsist without its co-relative: But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; And when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this submission which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny; because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, but being for matter, God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin, by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: A Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do. Their [the Resolutioners’] second reason is, that without this submission and subordination they do not see how unity and order can be continued in the Kirk, it being in vain to think of a remedy by superior judicatories without this, the refusing thereof being the way to make all union void… Answer [of Guthrie]: This is the very argument and language of the advocates of the Sea of Rome, whilst they plead the Pope’s visible headship and irrefragable authority and jurisdiction over the Church, to which all ought to submit without gainsaying, or counteracting, the very thing that has set up the Man of Sin to sit as God in the Temple of God, unto the enslaving both of the Word of God and the consciences of men, by requiring of them subjection and blind obedience to his dictates, without examining the same according to the light of the Word. If, according to the revealed Will of God, there ought to be such a submission in all cases, without counteracting, what shall we say of the practices of the prophets and apostles, and others of the servants of God who have lived before us in corrupt times? Must all their preachings and other actings, though most agreeable to the Word of God, be condemned, because they were contrary to the [will?] of the Church wherein they lived? [That?] were indeed to set up a power over the Word of God, a power for destruction and not for [edification?]; that would indeed make a sinful unity and order, and teach a way to avoid persecution, and readily to obtain peace with men, but with a loss of truth and a good conscience. The way to preserve unity and order in the House of God is, not to hearken to the counsels of flesh and blood, by setting up the will of man for a law and establishing an arbitrary and tyrannical power over consciences, to which they shall be tied to submit to iniquity and injustice; for, God has said, that the throne of iniquity that frames mischief into a law shall have no fellowship with Him [Ps. 94:20]; And therefore that may destroy unity and order, it will not preserve it. But to let the worship of God (which is both the rule and bond of unity and order) have place, Gal. 6:16, and judicatories proceeding according to this, is an effectual remedy actu primo [by the first act, or source] and objective, as in every ordinance of Christ; albeit actu secundo [by the following act] there is no efficacious remedy in either Word, sacraments, admonitions, suspension, deposition, excommunications, presbyteries, synods, or any ordinance the Church does enjoy or can exercise without the effectual blessing and influence of the Spirit of God, who is the author and appointer of these, and concurs therewith upon the consciences of men according to the pleasure of His own will. Shall persons sentenced unjustly, submit? Yes, say our Brethren, for preserving Unity and Order. What remedy then, say we [the Protesters], for preserving the truth? They may appeal, say they. But, say we, they have appealed, and have therein succumbed. What remedy now? No remedy, but that at one stroke the precious truths of God and interests of Jesus Christ must be born down and buried in oblivion; And the saints and ministers of the Gospel be buried under the rubbish thereof, because one assembly will have it so. But say our [Resolutioner] Brethren, how shall unity and order otherways be preserved in the Church of God? We answer, very well; because if the sentence be unjust, it ought to be recognized and repealed: If it be just, and of an inferior nature; If the persons will not submit, they are, after due procedure, to be cast out, as those that will not hear the Church, and so both unity and purity, both order and truth are preserved. Will our Brethren under a pretext of order, destroy Christian-liberty, and bring-in Popish-tyranny? It is Christ’s order and the King of Saints’ peace that every believer have the judgment of discretion, whether the judicatories of the Kirk speak according to the Scriptures, or whether they ought to obey or submit, or gainsay or counteract; and what Christ has given them, no man can take from them. … As to the judgment of our Church [of Scotland] and of her general assemblies, we do deny that ever they were of this judgment, or have declared any such thing; but upon the contrary, let the Confession of Faith, presented unto the Parliament, and ratified by them in the year 1567 bear witness, Article 21, concerning the power and authority of councils lawfully gathered; the words are these: ‘So far as the council proves the determination and commandment that it gives by the plain Word of God, so soo[n?] do we reverence and embrace the same: But if men, under the name of a council, pretend to forge unto us new articles of our faith, or to make constitutions repugning to the Word of God, then utterly we must refuse the same, as the doctrine of devils, which draws our souls from the voice of our only God, to follow the doctrines and constitutions of men.’ In the beginning of the Reformation, 1562, it is concluded by the whole ministry, in the assembly held that year, session 2, ‘That ministers shall be subject in all lawful admonitions, as is prescribed in the Book of Discipline.’ Likewise, it is provided in the articles agreed upon by the general assembly held at Edinburgh, in March, 1570, session 2, concerning the jurisdiction of the Kirk: ‘That the suspension and deprivation of ministers and others, admitted to functions in the Kirk, charge of souls, etc. shall be for lawful causes.’ In the Book of Discipline, agreed upon in diverse preceding general assemblies, and recorded in the year, 1581, by order of the assembly held in April, session 9, to the defense of which discipline the King and subjects of all ranks did then subscribe and swear; which was also renewed in the year, 1638, it is expressly declared, ch. 7, concerning elderships, assemblies, and discipline, that ‘Office-bearers are to be deposed for good and just causes deserving deprivation.’ If it were needful, we could cite more of this kind: We shall only add [an]other two testimonies from very late assemblies of this Kirk. The Assembly convened at St. Andrews, in Anno 1642, session 8, in the overture for transplantation of ministers, do declare: ‘That no presbytery or assembly should pass a sentence for transportation of any minister, till they give reasons for the expediency of the same, both to him and his congregation, and to the presbytery whereof he is a member; That if they acquiesce to the reasons given, it is so much the better; if they do not acquiesce, yet the presbytery, or assembly, by giving such reasons before the passing of their sentence, shall make it manifest that what they do, is not pro arbitratu vel imperio [for the judgment or command] only, but upon grounds of reason.’ And the Assembly convened at Edinburgh, in anno 1647, in their brotherly exhortation to their Brethren of England, do declare as follows; ‘We would not’ (say they) ‘have our zeal for presbyterial government misunderstood, as if it tended to any rigor or domineering over the flock, or to hinder and exclude that instructing in meekness, them that oppose themselves, which the apostolical rule holds forth; or, as if we would have any such to be entrusted with that government, as are found not yet purged, either from their old profaneness, or from the prelatical principles and practices: which were to put a piece of new cloth into an old garment, and so to make the rent worse; or to put new wine into old bottles, and so to lose both wine and bottles.’ From these passages, impartially considered, it is manifest, that the general assemblies have judged, that as it is rigor and a domineering over the Lord’s flock, for the judicatories of the Kirk to determine, or do anything pro arbitratu vel imperio [for the judgment or the command], or without giving a reason thereof from the Word; so when they do thus determine and judge, there is no reason to submit thereunto, or acquiesce therein. … Our [Resolutioner] Brethren overshoot when they say that thus to submit, has been the constant practice of all the members and judicatories of this Kirk ever since the late Reformation; If they mean of the Reformation of this Church from Popery [in 1560], they cannot but know that there was nothing more ordinary for the members and judicatories of this Kirk than not to submit unto, but to counteract the determinations and sentences of the prelates and their synods and assemblies, not only in matters of doctrine and worship, but also of discipline and government. It was ordinary for godly men, who were deposed by them and their courts, to preach and continue in the exercise of their ministry, notwithstanding of their sentences. Some of our [Resolutioner] Brethren themselves did it. It’s true that the prelates were not a lawful authority, nor Church-officers agreeable to the Word of God: but our Brethren do very well know that as the prelates, according to the act of their assembly at Glasgow, did sometimes in the suspension and deposition of ministers, associate to themselves the ministry of those bounds, where the supposed delinquent served, that is, the presbytery, whereof he was a member, which was a lawfully authority; and that as they did plead for such a submission to their decrees and sentences, as these Brethren do now plead for, and upon the same grounds of its being essential to government and preserving of unity and order, and shunning of confusion, etc. so also that those who did refuse and decline that submission, did it not only upon the ground of their want [lack] of lawful authority, but also upon this ground, that no obedience nor subjection is due to ecclesiastic laws that are unjust and contrary to the Word of God; as will appear to any that shall read the treatises that were published by the defenders of the truth in that hour of temptation, concerning the binding power of ecclesiastical laws. Their citation from the act of the general assembly, in anno 1647, concerning the Hundred and Eleven Propositions [by George Gillespie], and the seventh head of doctrine therein contained, does make against our [Resolutioner] Brethren, and not for them: 1. Because the foregoing words of that act do clear, that the Assembly speaks of ecclesiastical government, committed and entrusted by Christ to the assemblies of the Kirk: but Christ has committed no power to any assembly to tyrannize, nor has He commanded any Church-member, or any inferior Church-judicatory to subject themselves to ecclesiastical tyranny. 2. Because the propositions themselves to which that act do relate, do confine the obedience and subjection that is to be given to the ordinances and decrees of classes and synods, to lawful ordinances and decrees; ‘It is not lawful,’ say they: ‘to particular churches, or (as commonly they are called) parochial, either to decline the authority of classes or synods where they are lawfully settled, or may be had (much less to withdraw themselves from that authority if they have once acknowledged it) or to refuse such lawful ordinances and decrees of the classes or synods, as being agreeable to the Word of God, are with authority imposed upon them, Acts 15:2, 6, 22-24, 28-29; 16:4; Prop. 32.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“The question (so far as we can understand them in it) is, ‘Whether such a submission be due from all the members of this Kirk, ministers and people, to the judicatories of the Kirk, and from the inferior to the superior Kirk-judicatories in matters of government and discipline, as ought upon the sentence (whether just or unjust) of these judicatories to sist [stop or delay] the proceedings of the person or party grieved therewith, and make them acquiesce thereunto, until the determination of the respective superior judicatory therein, without any counteracting to the same, unless it be to appeal unto, and follow their appeal before the superior judicatory?’ Upon this question we find the Brethren for the Protestation in their last paper at the conference, Nov. 25, 1655, expressing their judgment thus: ‘We are willing to subject ourselves to all the just sentences of the lawful assemblies of this Kirk; and if the case were only of a few particular persons, in things of more private interest and personal concernment, and of judicatories employing their power to edification in the current of their actings, we should not much contend about it; but when it is of a great number of godly ministers and elders and professors throughout the land, who do desire to stand in the breach, and to oppose the present course of defection, and of judicatories, the plurality whereof in many places do not act unto edification and for promoving the power of godliness, but to the contrary, it alters the case.’ .. It is to us, and we believe will be to all sober and unbiased men, who understand the principles of Church-government, new and strange doctrine [that of the Resolutioners], that an absolute and unlimited subjection to all sentences (whether just or unjust, or agreeable or repugnant to the Word of God) should be asserted to be at all of kin or alliance to the divine ordinance of presbyterial government, which is a part of the sweet and gentle yoke of Jesus Christ, that is far from tyranny and oppression. … If presbyterial government has (as we do believe and assert it to have) its foundation in the Testament of Jesus Christ, upon whose shoulder the Government is, then whatsoever is of the essence and being thereof, must derive itself from the fountain of Christ’s Revealed Will about the constitution and essentials of that government? But we know no tittle in his Book that says as our [Resolutioner] Brethren say, or from which, what they say in this matter, can be deduced by good and necessary consequence, to wit, that it is essential to the government which He has appointed His House to be ruled by, that all the children of the House should submit unto, and acquiesce in the determination of the governors, without any counteracting, though their sentence be contrary to the Law and the Testimony; and therefore till our [Resolutioner] Brethren prove this, they will give us leave to deny it. We acknowledge that power and authority, and subjection and submission are co-relatives, and that the power and authority of the superior can no more actually subsist without the subjection and submission of the inferior, than one relative can subsist without its co-relative: But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; And when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this submission which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny; because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, but being for matter, God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin, by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: A Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do. Their [the Resolutioners’] second reason is, that without this submission and subordination they do not see how unity and order can be continued in the Kirk, it being in vain to think of a remedy by superior judicatories without this, the refusing thereof being the way to make all union void… Answer [of Guthrie]: This is the very argument and language of the advocates of the Sea of Rome, whilst they plead the Pope’s visible headship and irrefragable authority and jurisdiction over the Church, to which all ought to submit without gainsaying, or counteracting, the very thing that has set up the Man of Sin to sit as God in the Temple of God, unto the enslaving both of the Word of God and the consciences of men, by requiring of them subjection and blind obedience to his dictates, without examining the same according to the light of the Word. If, according to the revealed Will of God, there ought to be such a submission in all cases, without counteracting, what shall we say of the practices of the prophets and apostles, and others of the servants of God who have lived before us in corrupt times? Must all their preachings and other actings, though most agreeable to the Word of God, be condemned, because they were contrary to the [will?] of the Church wherein they lived? [That?] were indeed to set up a power over the Word of God, a power for destruction and not for [edification?]; that would indeed make a sinful unity and order, and teach a way to avoid persecution, and readily to obtain peace with men, but with a loss of truth and a good conscience. The way to preserve unity and order in the House of God is, not to hearken to the counsels of flesh and blood, by setting up the will of man for a law and establishing an arbitrary and tyrannical power over consciences, to which they shall be tied to submit to iniquity and injustice; for, God has said, that the throne of iniquity that frames mischief into a law shall have no fellowship with Him [Ps. 94:20]; And therefore that may destroy unity and order, it will not preserve it. But to let the worship of God (which is both the rule and bond of unity and order) have place, Gal. 6:16, and judicatories proceeding according to this, is an effectual remedy actu primo [by the first act, or source] and objective, as in every ordinance of Christ; albeit actu secundo [by the following act] there is no efficacious remedy in either Word, sacraments, admonitions, suspension, deposition, excommunications, presbyteries, synods, or any ordinance the Church does enjoy or can exercise without the effectual blessing and influence of the Spirit of God, who is the author and appointer of these, and concurs therewith upon the consciences of men according to the pleasure of His own will. Shall persons sentenced unjustly, submit? Yes, say our Brethren, for preserving Unity and Order. What remedy then, say we [the Protesters], for preserving the truth? They may appeal, say they. But, say we, they have appealed, and have therein succumbed. What remedy now? No remedy, but that at one stroke the precious truths of God and interests of Jesus Christ must be born down and buried in oblivion; And the saints and ministers of the Gospel be buried under the rubbish thereof, because one assembly will have it so. But say our [Resolutioner] Brethren, how shall unity and order otherways be preserved in the Church of God? We answer, very well; because if the sentence be unjust, it ought to be recognized and repealed: If it be just, and of an inferior nature; If the persons will not submit, they are, after due procedure, to be cast out, as those that will not hear the Church, and so both unity and purity, both order and truth are preserved. Will our Brethren under a pretext of order, destroy Christian-liberty, and bring-in Popish-tyranny? It is Christ’s order and the King of Saints’ peace that every believer have the judgment of discretion, whether the judicatories of the Kirk speak according to the Scriptures, or whether they ought to obey or submit, or gainsay or counteract; and what Christ has given them, no man can take from them. … As to the judgment of our Church [of Scotland] and of her general assemblies, we do deny that ever they were of this judgment, or have declared any such thing; but upon the contrary, let the Confession of Faith, presented unto the Parliament, and ratified by them in the year 1567 bear witness, Article 21, concerning the power and authority of councils lawfully gathered; the words are these: ‘So far as the council proves the determination and commandment that it gives by the plain Word of God, so soo[n?] do we reverence and embrace the same: But if men, under the name of a council, pretend to forge unto us new articles of our faith, or to make constitutions repugning to the Word of God, then utterly we must refuse the same, as the doctrine of devils, which draws our souls from the voice of our only God, to follow the doctrines and constitutions of men.’ In the beginning of the Reformation, 1562, it is concluded by the whole ministry, in the assembly held that year, session 2, ‘That ministers shall be subject in all lawful admonitions, as is prescribed in the Book of Discipline.’ Likewise, it is provided in the articles agreed upon by the general assembly held at Edinburgh, in March, 1570, session 2, concerning the jurisdiction of the Kirk: ‘That the suspension and deprivation of ministers and others, admitted to functions in the Kirk, charge of souls, etc. shall be for lawful causes.’ In the Book of Discipline, agreed upon in diverse preceding general assemblies, and recorded in the year, 1581, by order of the assembly held in April, session 9, to the defense of which discipline the King and subjects of all ranks did then subscribe and swear; which was also renewed in the year, 1638, it is expressly declared, ch. 7, concerning elderships, assemblies, and discipline, that ‘Office-bearers are to be deposed for good and just causes deserving deprivation.’ If it were needful, we could cite more of this kind: We shall only add [an]other two testimonies from very late assemblies of this Kirk. The Assembly convened at St. Andrews, in Anno 1642, session 8, in the overture for transplantation of ministers, do declare: ‘That no presbytery or assembly should pass a sentence for transportation of any minister, till they give reasons for the expediency of the same, both to him and his congregation, and to the presbytery whereof he is a member; That if they acquiesce to the reasons given, it is so much the better; if they do not acquiesce, yet the presbytery, or assembly, by giving such reasons before the passing of their sentence, shall make it manifest that what they do, is not pro arbitratu vel imperio [for the judgment or command] only, but upon grounds of reason.’ And the Assembly convened at Edinburgh, in anno 1647, in their brotherly exhortation to their Brethren of England, do declare as follows; ‘We would not’ (say they) ‘have our zeal for presbyterial government misunderstood, as if it tended to any rigor or domineering over the flock, or to hinder and exclude that instructing in meekness, them that oppose themselves, which the apostolical rule holds forth; or, as if we would have any such to be entrusted with that government, as are found not yet purged, either from their old profaneness, or from the prelatical principles and practices: which were to put a piece of new cloth into an old garment, and so to make the rent worse; or to put new wine into old bottles, and so to lose both wine and bottles.’ From these passages, impartially considered, it is manifest, that the general assemblies have judged, that as it is rigor and a domineering over the Lord’s flock, for the judicatories of the Kirk to determine, or do anything pro arbitratu vel imperio [for the judgment or the command], or without giving a reason thereof from the Word; so when they do thus determine and judge, there is no reason to submit thereunto, or acquiesce therein. … Our [Resolutioner] Brethren overshoot when they say that thus to submit, has been the constant practice of all the members and judicatories of this Kirk ever since the late Reformation; If they mean of the Reformation of this Church from Popery [in 1560], they cannot but know that there was nothing more ordinary for the members and judicatories of this Kirk than not to submit unto, but to counteract the determinations and sentences of the prelates and their synods and assemblies, not only in matters of doctrine and worship, but also of discipline and government. It was ordinary for godly men, who were deposed by them and their courts, to preach and continue in the exercise of their ministry, notwithstanding of their sentences. Some of our [Resolutioner] Brethren themselves did it. It’s true that the prelates were not a lawful authority, nor Church-officers agreeable to the Word of God: but our Brethren do very well know that as the prelates, according to the act of their assembly at Glasgow, did sometimes in the suspension and deposition of ministers, associate to themselves the ministry of those bounds, where the supposed delinquent served, that is, the presbytery, whereof he was a member, which was a lawfully authority; and that as they did plead for such a submission to their decrees and sentences, as these Brethren do now plead for, and upon the same grounds of its being essential to government and preserving of unity and order, and shunning of confusion, etc. so also that those who did refuse and decline that submission, did it not only upon the ground of their want [lack] of lawful authority, but also upon this ground, that no obedience nor subjection is due to ecclesiastic laws that are unjust and contrary to the Word of God; as will appear to any that shall read the treatises that were published by the defenders of the truth in that hour of temptation, concerning the binding power of ecclesiastical laws. Their citation from the act of the general assembly, in anno 1647, concerning the Hundred and Eleven Propositions [by George Gillespie], and the seventh head of doctrine therein contained, does make against our [Resolutioner] Brethren, and not for them: 1. Because the foregoing words of that act do clear, that the Assembly speaks of ecclesiastical government, committed and entrusted by Christ to the assemblies of the Kirk: but Christ has committed no power to any assembly to tyrannize, nor has He commanded any Church-member, or any inferior Church-judicatory to subject themselves to ecclesiastical tyranny. 2. Because the propositions themselves to which that act do relate, do confine the obedience and subjection that is to be given to the ordinances and decrees of classes and synods, to lawful ordinances and decrees; ‘It is not lawful,’ say they: ‘to particular churches, or (as commonly they are called) parochial, either to decline the authority of classes or synods where they are lawfully settled, or may be had (much less to withdraw themselves from that authority if they have once acknowledged it) or to refuse such lawful ordinances and decrees of the classes or synods, as being agreeable to the Word of God, are with authority imposed upon them, Acts 15:2, 6, 22-24, 28-29; 16:4; Prop. 32.”

— James Guthrie, Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658), pp. 42-56">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+question+%28so+far+as+we+can+understand+them+in+it%29+is%2C+%E2%80%98Whether+such+a+submission+be+due+from+all+the+members+of+this+Kirk%2C+ministers+and+people%2C+to+the+judicatories+of+the+Kirk%2C+and+from+the+inferior+to+the+superior+Kirk-judicatories+in+matters+of+government+and+discipline%2C+as+ought+upon+the+sentence+%28whether+just+or+unjust%29+of+these+judicatories+to+sist+%5Bstop+or+delay%5D+the+proceedings+of+the+person+or+party+grieved+therewith%2C+and+make+them+acquiesce+thereunto%2C+until+the+determination+of+the+respective+superior+judicatory+therein%2C+without+any+counteracting+to+the+same%2C+unless+it+be+to+appeal+unto%2C+and+follow+their+appeal+before+the+superior+judicatory%3F%E2%80%99+Upon+this+question+we+find+the+Brethren+for+the+Protestation+in+their+last+paper+at+the+conference%2C+Nov.+25%2C+1655%2C+expressing+their+judgment+thus%3A+%E2%80%98We+are+willing+to+subject+ourselves+to+all+the+just+sentences+of+the+lawful+assemblies+of+this+Kirk%3B+and+if+the+case+were+only+of+a+few+particular+persons%2C+in+things+of+more+private+interest+and+personal+concernment%2C+and+of+judicatories+employing+their+power+to+edification+in+the+current+of+their+actings%2C+we+should+not+much+contend+about+it%3B+but+when+it+is+of+a+great+number+of+godly+ministers+and+elders+and+professors+throughout+the+land%2C+who+do+desire+to+stand+in+the+breach%2C+and+to+oppose+the+present+course+of+defection%2C+and+of+judicatories%2C+the+plurality+whereof+in+many+places+do+not+act+unto+edification+and+for+promoving+the+power+of+godliness%2C+but+to+the+contrary%2C+it+alters+the+case.%E2%80%99+..+It+is+to+us%2C+and+we+believe+will+be+to+all+sober+and+unbiased+men%2C+who+understand+the+principles+of+Church-government%2C+new+and+strange+doctrine+%5Bthat+of+the+Resolutioners%5D%2C+that+an+absolute+and+unlimited+subjection+to+all+sentences+%28whether+just+or+unjust%2C+or+agreeable+or+repugnant+to+the+Word+of+God%29+should+be+asserted+to+be+at+all+of+kin+or+alliance+to+the+divine+ordinance+of+presbyterial+government%2C+which+is+a+part+of+the+sweet+and+gentle+yoke+of+Jesus+Christ%2C+that+is+far+from+tyranny+and+oppression.+%E2%80%A6+If+presbyterial+government+has+%28as+we+do+believe+and+assert+it+to+have%29+its+foundation+in+the+Testament+of+Jesus+Christ%2C+upon+whose+shoulder+the+Government+is%2C+then+whatsoever+is+of+the+essence+and+being+thereof%2C+must+derive+itself+from+the+fountain+of+Christ%E2%80%99s+Revealed+Will+about+the+constitution+and+essentials+of+that+government%3F+But+we+know+no+tittle+in+his+Book+that+says+as+our+%5BResolutioner%5D+Brethren+say%2C+or+from+which%2C+what+they+say+in+this+matter%2C+can+be+deduced+by+good+and+necessary+consequence%2C+to+wit%2C+that+it+is+essential+to+the+government+which+He+has+appointed+His+House+to+be+ruled+by%2C+that+all+the+children+of+the+House+should+submit+unto%2C+and+acquiesce+in+the+determination+of+the+governors%2C+without+any+counteracting%2C+though+their+sentence+be+contrary+to+the+Law+and+the+Testimony%3B+and+therefore+till+our+%5BResolutioner%5D+Brethren+prove+this%2C+they+will+give+us+leave+to+deny+it.+We+acknowledge+that+power+and+authority%2C+and+subjection+and+submission+are+co-relatives%2C+and+that+the+power+and+authority+of+the+superior+can+no+more+actually+subsist+without+the+subjection+and+submission+of+the+inferior%2C+than+one+relative+can+subsist+without+its+co-relative%3A+But+all+Church-power+and+authority+is+bounded+by+the+Word+of+God%2C+and+is+for+edification+only%3B+And+therefore+all+the+subjection+that+is+due+thereunto%2C+is+in+the+Lord+only%3B+And+when+we+are+thus+subject%2C+the+power+and+authority+is+sufficiently+acknowledged+and+preserved.+But%2C+say+our+%5BResolutioner%5D+Brethren%2C+without+this+submission+which+they+plead+for%2C+our+established+judicatories+would+be+nothing+but+consultative+meetings.+But+this+we+also+deny%3B+because+what+is+resolved+and+determined+by+Kirk-judicatories+in+a+right+way%2C+does+not+only+bind+by+virtue+of+the+intrinsic+lawfulness+thereof%2C+but+being+for+matter%2C+God%E2%80%99s+Word%2C+and+by+virtue+of+the+reverence+that+is+due+to+the+gifts+and+endowments+of+brethren+and+friends+counselling+right+things%2C+which+is+all+that+can+be+attributed+to+a+consultative+meeting%2C+but+also+by+virtue+of+a+positive+law+of+God%2C+by+which+He+has+commanded+us+to+hear+the+Church%2C+and+those+that+sit+in+Moses%E2%80%99+chair%2C+and+to+be+subject+in+the+Lord+to+Church-Governors%2C+to+whom+He+has+given+a+ministerial+and+official+authority+and+power+to+assemble+in+His+Name+in+the+respective+courts+appointed+by+Himself+for+governing+His+House+according+to+the+rule+of+His+Word%3B+And+therefore+as+they+have+authority+or+a+superiority+of+jurisdiction%2C+which+no+consultative+meeting+has%3B+So+whosoever+resists+their+power%2C+when+put+forth+to+edification%2C+and+not+to+destruction%2C+does+not+only+sin%2C+by+despising+that+Word+of+God+which+is+the+matter+of+their+decree%2C+and+by+despising+the+gifts+and+graces+of+their+brethren+that+are+exercised+in+holding+forth+light+unto+them%2C+but+does+also+sin+by+resisting+the+ordinance+of+God%3A+A+Kirk-judicatory+modeled+according+to+the+pattern+showed+in+the+mount%2C+and+clothed+with+authority+from+Jesus+Christ%2C+and+proceeding+according+to+the+Law+and+to+the+Testimony%2C+to+which+they+ought+to+be+subject%2C+God+having+commanded+us+so+to+do.+Their+%5Bthe+Resolutioners%E2%80%99%5D+second+reason+is%2C+that+without+this+submission+and+subordination+they+do+not+see+how+unity+and+order+can+be+continued+in+the+Kirk%2C+it+being+in+vain+to+think+of+a+remedy+by+superior+judicatories+without+this%2C+the+refusing+thereof+being+the+way+to+make+all+union+void%E2%80%A6+Answer+%5Bof+Guthrie%5D%3A+This+is+the+very+argument+and+language+of+the+advocates+of+the+Sea+of+Rome%2C+whilst+they+plead+the+Pope%E2%80%99s+visible+headship+and+irrefragable+authority+and+jurisdiction+over+the+Church%2C+to+which+all+ought+to+submit+without+gainsaying%2C+or+counteracting%2C+the+very+thing+that+has+set+up+the+Man+of+Sin+to+sit+as+God+in+the+Temple+of+God%2C+unto+the+enslaving+both+of+the+Word+of+God+and+the+consciences+of+men%2C+by+requiring+of+them+subjection+and+blind+obedience+to+his+dictates%2C+without+examining+the+same+according+to+the+light+of+the+Word.+If%2C+according+to+the+revealed+Will+of+God%2C+there+ought+to+be+such+a+submission+in+all+cases%2C+without+counteracting%2C+what+shall+we+say+of+the+practices+of+the+prophets+and+apostles%2C+and+others+of+the+servants+of+God+who+have+lived+before+us+in+corrupt+times%3F+Must+all+their+preachings+and+other+actings%2C+though+most+agreeable+to+the+Word+of+God%2C+be+condemned%2C+because+they+were+contrary+to+the+%5Bwill%3F%5D+of+the+Church+wherein+they+lived%3F+%5BThat%3F%5D+were+indeed+to+set+up+a+power+over+the+Word+of+God%2C+a+power+for+destruction+and+not+for+%5Bedification%3F%5D%3B+that+would+indeed+make+a+sinful+unity+and+order%2C+and+teach+a+way+to+avoid+persecution%2C+and+readily+to+obtain+peace+with+men%2C+but+with+a+loss+of+truth+and+a+good+conscience.+The+way+to+preserve+unity+and+order+in+the+House+of+God+is%2C+not+to+hearken+to+the+counsels+of+flesh+and+blood%2C+by+setting+up+the+will+of+man+for+a+law+and+establishing+an+arbitrary+and+tyrannical+power+over+consciences%2C+to+which+they+shall+be+tied+to+submit+to+iniquity+and+injustice%3B+for%2C+God+has+said%2C+that+the+throne+of+iniquity+that+frames+mischief+into+a+law+shall+have+no+fellowship+with+Him+%5BPs.+94%3A20%5D%3B+And+therefore+that+may+destroy+unity+and+order%2C+it+will+not+preserve+it.+But+to+let+the+worship+of+God+%28which+is+both+the+rule+and+bond+of+unity+and+order%29+have+place%2C+Gal.+6%3A16%2C+and+judicatories+proceeding+according+to+this%2C+is+an+effectual+remedy+actu+primo+%5Bby+the+first+act%2C+or+source%5D+and+objective%2C+as+in+every+ordinance+of+Christ%3B+albeit+actu+secundo+%5Bby+the+following+act%5D+there+is+no+efficacious+remedy+in+either+Word%2C+sacraments%2C+admonitions%2C+suspension%2C+deposition%2C+excommunications%2C+presbyteries%2C+synods%2C+or+any+ordinance+the+Church+does+enjoy+or+can+exercise+without+the+effectual+blessing+and+influence+of+the+Spirit+of+God%2C+who+is+the+author+and+appointer+of+these%2C+and+concurs+therewith+upon+the+consciences+of+men+according+to+the+pleasure+of+His+own+will.+Shall+persons+sentenced+unjustly%2C+submit%3F+Yes%2C+say+our+Brethren%2C+for+preserving+Unity+and+Order.+What+remedy+then%2C+say+we+%5Bthe+Protesters%5D%2C+for+preserving+the+truth%3F+They+may+appeal%2C+say+they.+But%2C+say+we%2C+they+have+appealed%2C+and+have+therein+succumbed.+What+remedy+now%3F+No+remedy%2C+but+that+at+one+stroke+the+precious+truths+of+God+and+interests+of+Jesus+Christ+must+be+born+down+and+buried+in+oblivion%3B+And+the+saints+and+ministers+of+the+Gospel+be+buried+under+the+rubbish+thereof%2C+because+one+assembly+will+have+it+so.+But+say+our+%5BResolutioner%5D+Brethren%2C+how+shall+unity+and+order+otherways+be+preserved+in+the+Church+of+God%3F+We+answer%2C+very+well%3B+because+if+the+sentence+be+unjust%2C+it+ought+to+be+recognized+and+repealed%3A+If+it+be+just%2C+and+of+an+inferior+nature%3B+If+the+persons+will+not+submit%2C+they+are%2C+after+due+procedure%2C+to+be+cast+out%2C+as+those+that+will+not+hear+the+Church%2C+and+so+both+unity+and+purity%2C+both+order+and+truth+are+preserved.+Will+our+Brethren+under+a+pretext+of+order%2C+destroy+Christian-liberty%2C+and+bring-in+Popish-tyranny%3F+It+is+Christ%E2%80%99s+order+and+the+King+of+Saints%E2%80%99+peace+that+every+believer+have+the+judgment+of+discretion%2C+whether+the+judicatories+of+the+Kirk+speak+according+to+the+Scriptures%2C+or+whether+they+ought+to+obey+or+submit%2C+or+gainsay+or+counteract%3B+and+what+Christ+has+given+them%2C+no+man+can+take+from+them.+%E2%80%A6+As+to+the+judgment+of+our+Church+%5Bof+Scotland%5D+and+of+her+general+assemblies%2C+we+do+deny+that+ever+they+were+of+this+judgment%2C+or+have+declared+any+such+thing%3B+but+upon+the+contrary%2C+let+the+Confession+of+Faith%2C+presented+unto+the+Parliament%2C+and+ratified+by+them+in+the+year+1567+bear+witness%2C+Article+21%2C+concerning+the+power+and+authority+of+councils+lawfully+gathered%3B+the+words+are+these%3A+%E2%80%98So+far+as+the+council+proves+the+determination+and+commandment+that+it+gives+by+the+plain+Word+of+God%2C+so+soo%5Bn%3F%5D+do+we+reverence+and+embrace+the+same%3A+But+if+men%2C+under+the+name+of+a+council%2C+pretend+to+forge+unto+us+new+articles+of+our+faith%2C+or+to+make+constitutions+repugning+to+the+Word+of+God%2C+then+utterly+we+must+refuse+the+same%2C+as+the+doctrine+of+devils%2C+which+draws+our+souls+from+the+voice+of+our+only+God%2C+to+follow+the+doctrines+and+constitutions+of+men.%E2%80%99+In+the+beginning+of+the+Reformation%2C+1562%2C+it+is+concluded+by+the+whole+ministry%2C+in+the+assembly+held+that+year%2C+session+2%2C+%E2%80%98That+ministers+shall+be+subject+in+all+lawful+admonitions%2C+as+is+prescribed+in+the+Book+of+Discipline.%E2%80%99+Likewise%2C+it+is+provided+in+the+articles+agreed+upon+by+the+general+assembly+held+at+Edinburgh%2C+in+March%2C+1570%2C+session+2%2C+concerning+the+jurisdiction+of+the+Kirk%3A+%E2%80%98That+the+suspension+and+deprivation+of+ministers+and+others%2C+admitted+to+functions+in+the+Kirk%2C+charge+of+souls%2C+etc.+shall+be+for+lawful+causes.%E2%80%99+In+the+Book+of+Discipline%2C+agreed+upon+in+diverse+preceding+general+assemblies%2C+and+recorded+in+the+year%2C+1581%2C+by+order+of+the+assembly+held+in+April%2C+session+9%2C+to+the+defense+of+which+discipline+the+King+and+subjects+of+all+ranks+did+then+subscribe+and+swear%3B+which+was+also+renewed+in+the+year%2C+1638%2C+it+is+expressly+declared%2C+ch.+7%2C+concerning+elderships%2C+assemblies%2C+and+discipline%2C+that+%E2%80%98Office-bearers+are+to+be+deposed+for+good+and+just+causes+deserving+deprivation.%E2%80%99+If+it+were+needful%2C+we+could+cite+more+of+this+kind%3A+We+shall+only+add+%5Ban%5Dother+two+testimonies+from+very+late+assemblies+of+this+Kirk.+The+Assembly+convened+at+St.+Andrews%2C+in+Anno+1642%2C+session+8%2C+in+the+overture+for+transplantation+of+ministers%2C+do+declare%3A+%E2%80%98That+no+presbytery+or+assembly+should+pass+a+sentence+for+transportation+of+any+minister%2C+till+they+give+reasons+for+the+expediency+of+the+same%2C+both+to+him+and+his+congregation%2C+and+to+the+presbytery+whereof+he+is+a+member%3B+That+if+they+acquiesce+to+the+reasons+given%2C+it+is+so+much+the+better%3B+if+they+do+not+acquiesce%2C+yet+the+presbytery%2C+or+assembly%2C+by+giving+such+reasons+before+the+passing+of+their+sentence%2C+shall+make+it+manifest+that+what+they+do%2C+is+not+pro+arbitratu+vel+imperio+%5Bfor+the+judgment+or+command%5D+only%2C+but+upon+grounds+of+reason.%E2%80%99+And+the+Assembly+convened+at+Edinburgh%2C+in+anno+1647%2C+in+their+brotherly+exhortation+to+their+Brethren+of+England%2C+do+declare+as+follows%3B+%E2%80%98We+would+not%E2%80%99+%28say+they%29+%E2%80%98have+our+zeal+for+presbyterial+government+misunderstood%2C+as+if+it+tended+to+any+rigor+or+domineering+over+the+flock%2C+or+to+hinder+and+exclude+that+instructing+in+meekness%2C+them+that+oppose+themselves%2C+which+the+apostolical+rule+holds+forth%3B+or%2C+as+if+we+would+have+any+such+to+be+entrusted+with+that+government%2C+as+are+found+not+yet+purged%2C+either+from+their+old+profaneness%2C+or+from+the+prelatical+principles+and+practices%3A+which+were+to+put+a+piece+of+new+cloth+into+an+old+garment%2C+and+so+to+make+the+rent+worse%3B+or+to+put+new+wine+into+old+bottles%2C+and+so+to+lose+both+wine+and+bottles.%E2%80%99+From+these+passages%2C+impartially+considered%2C+it+is+manifest%2C+that+the+general+assemblies+have+judged%2C+that+as+it+is+rigor+and+a+domineering+over+the+Lord%E2%80%99s+flock%2C+for+the+judicatories+of+the+Kirk+to+determine%2C+or+do+anything+pro+arbitratu+vel+imperio+%5Bfor+the+judgment+or+the+command%5D%2C+or+without+giving+a+reason+thereof+from+the+Word%3B+so+when+they+do+thus+determine+and+judge%2C+there+is+no+reason+to+submit+thereunto%2C+or+acquiesce+therein.+%E2%80%A6+Our+%5BResolutioner%5D+Brethren+overshoot+when+they+say+that+thus+to+submit%2C+has+been+the+constant+practice+of+all+the+members+and+judicatories+of+this+Kirk+ever+since+the+late+Reformation%3B+If+they+mean+of+the+Reformation+of+this+Church+from+Popery+%5Bin+1560%5D%2C+they+cannot+but+know+that+there+was+nothing+more+ordinary+for+the+members+and+judicatories+of+this+Kirk+than+not+to+submit+unto%2C+but+to+counteract+the+determinations+and+sentences+of+the+prelates+and+their+synods+and+assemblies%2C+not+only+in+matters+of+doctrine+and+worship%2C+but+also+of+discipline+and+government.+It+was+ordinary+for+godly+men%2C+who+were+deposed+by+them+and+their+courts%2C+to+preach+and+continue+in+the+exercise+of+their+ministry%2C+notwithstanding+of+their+sentences.+Some+of+our+%5BResolutioner%5D+Brethren+themselves+did+it.+It%E2%80%99s+true+that+the+prelates+were+not+a+lawful+authority%2C+nor+Church-officers+agreeable+to+the+Word+of+God%3A+but+our+Brethren+do+very+well+know+that+as+the+prelates%2C+according+to+the+act+of+their+assembly+at+Glasgow%2C+did+sometimes+in+the+suspension+and+deposition+of+ministers%2C+associate+to+themselves+the+ministry+of+those+bounds%2C+where+the+supposed+delinquent+served%2C+that+is%2C+the+presbytery%2C+whereof+he+was+a+member%2C+which+was+a+lawfully+authority%3B+and+that+as+they+did+plead+for+such+a+submission+to+their+decrees+and+sentences%2C+as+these+Brethren+do+now+plead+for%2C+and+upon+the+same+grounds+of+its+being+essential+to+government+and+preserving+of+unity+and+order%2C+and+shunning+of+confusion%2C+etc.+so+also+that+those+who+did+refuse+and+decline+that+submission%2C+did+it+not+only+upon+the+ground+of+their+want+%5Black%5D+of+lawful+authority%2C+but+also+upon+this+ground%2C+that+no+obedience+nor+subjection+is+due+to+ecclesiastic+laws+that+are+unjust+and+contrary+to+the+Word+of+God%3B+as+will+appear+to+any+that+shall+read+the+treatises+that+were+published+by+the+defenders+of+the+truth+in+that+hour+of+temptation%2C+concerning+the+binding+power+of+ecclesiastical+laws.+Their+citation+from+the+act+of+the+general+assembly%2C+in+anno+1647%2C+concerning+the+Hundred+and+Eleven+Propositions+%5Bby+George+Gillespie%5D%2C+and+the+seventh+head+of+doctrine+therein+contained%2C+does+make+against+our+%5BResolutioner%5D+Brethren%2C+and+not+for+them%3A+1.+Because+the+foregoing+words+of+that+act+do+clear%2C+that+the+Assembly+speaks+of+ecclesiastical+government%2C+committed+and+entrusted+by+Christ+to+the+assemblies+of+the+Kirk%3A+but+Christ+has+committed+no+power+to+any+assembly+to+tyrannize%2C+nor+has+He+commanded+any+Church-member%2C+or+any+inferior+Church-judicatory+to+subject+themselves+to+ecclesiastical+tyranny.+2.+Because+the+propositions+themselves+to+which+that+act+do+relate%2C+do+confine+the+obedience+and+subjection+that+is+to+be+given+to+the+ordinances+and+decrees+of+classes+and+synods%2C+to+lawful+ordinances+and+decrees%3B+%E2%80%98It+is+not+lawful%2C%E2%80%99+say+they%3A+%E2%80%98to+particular+churches%2C+or+%28as+commonly+they+are+called%29+parochial%2C+either+to+decline+the+authority+of+classes+or+synods+where+they+are+lawfully+settled%2C+or+may+be+had+%28much+less+to+withdraw+themselves+from+that+authority+if+they+have+once+acknowledged+it%29+or+to+refuse+such+lawful+ordinances+and+decrees+of+the+classes+or+synods%2C+as+being+agreeable+to+the+Word+of+God%2C+are+with+authority+imposed+upon+them%2C+Acts+15%3A2%2C+6%2C+22-24%2C+28-29%3B+16%3A4%3B+Prop.+32.%E2%80%9D%0A%0A%E2%80%94+James+Guthrie%2C+Protesters+no+Subverters%2C+and+presbyterie+no+papacie%3B+or%2C+A+vindication+of+the+protesting+brethren%2C+and+of+the+government+of+the+kirk+of+Scotland+from+the+aspersions+unjustly+cast+upon+them%E2%80%A6+%281658%29%2C+pp.+42-56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab7a949e00.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab7a949e00.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=The%20question%20%28so%20far%20as%20we,6%2C%2022%2D24%2C%2028%2D29%3B%2016%3A4%3B%20Prop.%2032&amp;text=The%20question%20%28so%20far%20as%20we%20can%20understand&amp;text=Acts%2015%3A2%2C%206%2C%2022%2D24%2C%2028%2D29%3B%2016%3A4%3B%20Prop.%2032" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-0286a9a64d" data-kw="">
<blockquote><p>While the grace of God generally operates mediately, it is not inherent in the means as a divine deposit, but accompanies the use of these. This must be maintained in opposition to the Roman Catholics, the High Church Anglicans, and the Lutherans, who proceed on the assumption that the means of grace always operate in virtue of an inherent power, though their operation may be made ineffective by the condition or attitude of the recipient. Protestants, on the other hand, teach that the sacraments are not absolutely necessary unto salvation, but are obligatory in view of the divine precept.… That they are not absolutely necessary unto salvation, follows… from the fact that Scripture mentions only faith as the instrumental condition of salvation… and from the fact that the sacraments do not originate faith but presuppose it, and are administered where faith is assumed, Acts 2:41; 16:14,15,30,33; I Cor. 11:23-32; and from the fact that many were actually saved without the use of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Means of Grace; Necessity of the Sacraments</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4c1b9cb59" data-kw="">
<blockquote><p>If the sacraments are said to remit sins, to save and to regenerate (Acts 2:38; 22:16; Eph. 5:26; Tit. 3:5; 1 Pet. 3:21), they do not do this by a proper, immediate and internal force (as is evident from 1 Pet. 3:21). Rather they do it sacramentally and improperly because they are efficacious signs by which those benefits are signified and sealed and in their legitimate use conferred.… When remission of sins is ascribed to baptism (Acts 22:16), it is not ascribed to it except under the relation of a sign and seal and not under the relation of a true, proper and immediate physical cause… In fine, although that remission is ascribed to baptism, it does not belong to it by reason of the external action properly, but by reason of the internal grace and receiving faith, without which all the external ablution is in vain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 19</span></figcaption>

</figure><figure class="quote" id="q-b107b86234" data-kw="">
<blockquote><p>Question 72. Is then the external baptism with water, the washing away of sin itself? Answer. Not at all, for the blood of Jesus Christ only, and the Holy Ghost, cleanse us from all sin. …So when it is said, “Baptism saves us,” is “the washing of regeneration,” and “the washing away of sin;” it is the same thing as to say, Baptism is the sign of all these things. Question 73. Why then doth the Holy Ghost call baptism “the washing of regeneration,” and “the washing away of sins?” Answer. God speaks thus not without great cause, to wit, not only thereby to teach us, that, as the filth of the body is purged away by water, so our sins are removed by the blood and Spirit of Jesus Christ; but especially that, by this divine pledge and sign, he may assure us that we are spiritually cleansed from our sins as really as we are externally washed with water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Lord’s Day 27, Q. 72–73</span></figcaption>

</figure><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

</figure><figure class="quote" id="q-9cbaa3a91f" data-kw="">
<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>

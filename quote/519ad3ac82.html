<blockquote><p>Secondly, It is not denied by the advocates of particular redemption, or of a limited atonement, that mankind in general, even those who ultimately perish, do derive some advantages or benefits from Christ’s death; and no position they hold requires them to deny this. They believe that important benefits have accrued to the whole human race from the death of Christ, and that in these benefits those who are finally impenitent and unbelieving partake… Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other. All these benefits were of course forseen by God, when He resolved to send His Son into the world; they were contemplated or designed by Him, as what men should receive and enjoy. They are to be regarded and received as bestowed by Him, and as thus unfolding His glory, indicating His character, and actually accomplishing His purposes; and they are to be viewed as coming to men through the channel of Christ’s mediation, of His sufferings and death. [There is a footnote to Witsius, Economy of the Covenants, Book 2, Ch. 9, Section 4] The truth of this position has been considered as affording some warrant for saying, in a vague and indefinite sense, that Christ died for all men; and in this sense, and on this account, some Calvinists have scrupled about meeting the position that Christ died for all men with a direct negative, as if they might thus be understood as denying that there was any sense in which all men derived benefit, and in which God intended that they should derive benefit from Christ’s death… The advocates of universal atonement, then, have no right to charge us with teaching that none derive any benefit from Christ’s death except those who are pardoned and saved; we do not teach this, and we are not bound in consistency to teach it. We teach the opposite of this; and we are not deterred from doing so by the fear lest we should thereby afford to those who are opposed to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology (1863), vol. 2 | ‘Extent of Atonement &amp; Gospel Offer’</cite>, p. 332-334, 343-348</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6e65f718d" data-kw="">
<blockquote><p>Of whom speaks the Confession this? Of the God of the elect only? Or of the God of every man? Is He the God of the elect only? Is He not also of the non-elect? Is this description of the gracious nature and attributes of God intended to be restricted to a part of mankind? Is not God as thus delineated the Creator and Father of every man without exception? Can it be supposed that the authors of this statement meant to be understood to say that God is not such a being for all men, but only for some? If this section does not teach the unlimited love and compassion of God towards all men as men, as his creatures, it teaches nothing.</p></blockquote>

</figure><figure class="quote" id="q-8619ed2862" data-kw="">
<blockquote><p>The Word must be preached to all without exception; the Gospel must be offered to converted and unconverted. Some object to this as if it would make the offer of grace too general. But the Lord Jesus has commanded it. ‘Many are called, but few are chosen.’ (Matt. 22:14; 20:16) ‘Go ye therefore, and teach all nations, baptizing them in the Name of the Father, and of the Son, and of the Holy Ghost.’ (Matt. 28:19) ‘Go ye into all the world, and preach the Gospel to every creature.’ (Mark 16:15) … Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 2, p. 369</span></figcaption>

</figure><figure class="quote" id="q-2ddd2ba5cf" data-kw="">
<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology, Part I, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God</cite></span></figcaption>

<blockquote><p>Jehoahaz the son of Jehu began to reign over Israel in Samaria, and reigned seventeen years. And he did that which was evil in the sight of the Lord, and followed the sins of Jeroboam the son of Nebat, which made Israel to sin; he departed not therefrom… He delivered them into the hand of Hazael king of Syria, and into the hand of Benhadad the son of Hazael, all their days. And Jehoahaz besought the Lord, and the Lord hearkened unto him: for He saw the oppression of Israel, because the king of Syria oppressed them. And the Lord gave Israel a saviour, so that they went out from under the hand of the Syrians:</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fd44c21ac7" data-kw="">
<blockquote><p>A small measure of acquaintance with their own hearts might have easily persuaded them that the demands of the moral law, or Ten Commandments, were too rigid for them ever to hope justification by their compliance with them. For however much it may be thought by superficial observers that the first nine precepts in the law may be fulfilled by an imperfect creature, yet it is evident that the very letter of the tenth commandment forbids the sins of the heart and all the motions of concupiscence.

How can the proudest legalist plume himself with the foolish conceit of being able to conform himself in all respects to the very letter of the law when the very letter of the law says, “Thou shalt not covet” (Ex. 20:17)? If then there were many Israelites who rested in the law, without looking any further, and fondly imagined that it was able to give them eternal life, this fatal mistake was not chiefly owing to the obscurity of their dispensation but to the blindness of their own hearts that were hard as the stones on which their law was written and veiled as their lawgiver’s face.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcewen.html">William McEwen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory and Fullness of Jesus Christ: In the Most Remarkable Types, Figures, and Allegories of the Old Testament</cite>, ed. Gordon J. Keddie (1763; Grand Rapids MI: Reformation Heritage Books, 2022), p. 125.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84ded9faba" data-kw="">
<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’, p. 13 trans. AI</span></figcaption>

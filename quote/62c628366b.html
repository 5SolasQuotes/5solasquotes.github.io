<blockquote><p>Edward Bagshaw: ‘This we affirm: 1. Because we know not how else to preserve our Christian Liberty (which it is an indispensable duty to maintain) but by separating from those that would unduly take it from us.’ Richard Baxter: These universal terms not limited nor expounded are to be taken universally, and so here are two false doctrines: one that it is indispensable duty to maintain all our Christian liberty, and the other that we know not how else to maintain it. But if by this ‘liberty’, you mean but some sort of liberty, and not all, you should have distinguished, if you would not deceive. And if by ‘we know not’ you intend only a confession of your own ignorance, that would be no proof of the point in hand, because that may be true, which you know not. [On the term ‘Christian liberty’:] 1. There is a liberty called ‘Christian’, because it is essential to Christianity (as to be freed from the Covenant of Works and from the guilt and reign of sin, and from the power of Satan and the state of enmity against God, etc.). 2. There is a liberty called ‘Christian’, because it is procured and given us by Christ, though not essential to Christianity (as to eat of this meat or that, flesh or herbs, to be free from the observation of certain days, and customs, and ceremonies not sinful in themselves). 3. There is a liberty called ‘Christian’, because Christians have it in common with all other men, or with many (as to marry or not marry; to live in this country or that; to be free from oppression, injuries, slanders, persecution, when they can). [On the term ‘our’:] And we must distinguish of the word ‘our’, that is, we must show how far this liberty is ours indeed: 1. It is one thing to be ours necessarily, or as you say ‘indispensably’; [2.] and another thing to be ours when we can get it, keep it, or use it without a greater loss than it will compensate, or a greater hurt to others. [3.] It is one thing to be ours in fundamental right, to be used at fit times; [4.] and another thing to be ours to be always used. [Baxter’s propositions:] Proposition 1: The liberty which is essential to our Christianity or godliness is indispensably to be maintained and exercised (Isa. 61:1; Lk. 14:18; Gal. 5:12; 2 Pet. 2:19-21). Proposition 2: All degrees of the same liberty must be maintained, as well as the essentials (Acts 18:26; 2 Tim. 2:26); that is, we must labor to be as free as we can from all the degrees of sin and misery (2 Cor. 3:17): But we cannot here have what we would (Heb. 2:14-15). Proposition 3: There is a liberty to use certain things as statedly or ordinarily indifferent (Gal. 4:3, 9), which is none of ours (to use them) in several cases (Rom. 8:15), which take away the indifferency (Jn. 8:31, 36, as in case of scandal, or greater hurt to others or ourselves, Rom. 6:16, 18, 22, or of the restraint of just authority). Proposition 4. The same must be said of forbearing things indifferent. Proposition 5. Our liberty from persecution, oppression, injuries, slanders, must be patiently let go, as being none of ours when it cannot be kept by lawful means or without a greater hurt, Acts 22:28, etc. Proposition 6. But our liberty in either of these three last mentioned cases, ought not causelessly to be taken from us by others, nor must be causelessly cast away by ourselves; nor should we yield to false teachers who would deceive the churches by telling them [the churches] that they are under divine obligations when they are not and make them believe that things lawful are unlawful and things indifferent are necessary, Gal. 2:4-5; Col. 2:16, 18, 20-23; Acts 15; 1 Cor. 7:21-22. The third proposition is it that I am to prove. And Paul’s becoming all things to all men, to save some, a Jew to the Jews, his shaving his head, his circumcising Timothy, with the reasons of it, his resolution to forbear the eating of flesh rather than offend the weak and his persuading others to do the like do fully prove it. He maintains the Christian’s right of liberty against false teachers, but he maintains not the exercise of it when he had reason to let it go: For liberty is not necessity: 1 Cor. 9:1, ‘Am I not free?’ vv. 4-5, ‘Have we not power to eat and to drink? Have we not power to lead about a sister, a wife, as well as other apostles?’ v. 12. ‘If others be partakers of this power over you, are not we rather? Nevertheless we have not used this power, but suffered all things lest we should hinder the Gospel of Christ.’ v. 15, ‘But I have used none of these things’ v. 19, ‘For though I be free from all men, yet have I made myself servant to all, that I might gain the more: And unto the Jews I became a Jew, that I might gain the Jews; To them that are under the Law, as under the Law, that I might gain them that are under the Law: To them that are without the Law, as without Law, that I might gain them that are without Law. To the weak I became as weak, that I might gain the weak: I am made all things to all men, that I might by all means save some. And this I do for the Gospel’s sake’—See 1 Cor. 8:13. Rom. 14:21, ‘It is good neither to eat flesh, nor to drink wine, nor any thing whereby thy brother stumbleth, or is offended, or is made weak.’ Christ Himself says: Mt. 17:26, ‘Then are the children free: notwithstanding, lest we should offend, go thou, etc. and give them for Me and thee.’ 1 Pet. 2:16, ‘As free’ (that is, as such as by Christ are freed from true bondage, but not from order and subjection, and therefore) ‘not having or using liberty for a cloak of maliciousness, but as the servants of God.’ No man has liberty to be unruly or hurtful. Rom. 7:3, ‘If her husband be dead, she is free from that law,’ and yet may give away that freedom. Yea, of the very liberty from the Jewish Law, the apostle says, Gal. 5:13, ‘For ye have been called unto liberty’ (quasi dicat [as if he should say], therefore let not false teachers persuade you that you are bound to that which you are freed from) ‘only use not liberty for an occasion to the flesh, but by love serve one another;’ q.d. in the exercise of this liberty you must do or not do the things you are at liberty in, as may do most good according as the law of love requires and not as your own carnal interest and lust inclines you: for all the Law is fulfilled in one word, in this: [1.] ‘Thou shalt love thy neighbor as thyself.’ [2.] 1 Cor. 10:25, 28-31, ‘Whatsoever is sold in the shambles eat, asking no question for conscience sake—But if any man say unto you, ‘This is offered in sacrifice to idols,’ eat not for his sake that showed it, and for conscience sake’ (Thus our liberty is not to be exercised against love: for we have no liberty to hurt our brethren) v. 29, ‘Conscience I say, not thine own, but of the others:’ (Thus others by weakness, and consequently rulers by authority may restrain the exercise of our liberty) ‘For why is my liberty judged of another man’s conscience?’ That is, not that his conscience is the rule of my right or his judgment takes away my title to liberty, but his interest and the law of love do take away my right of using my liberty to another’s hurt. v. 30, ‘For if I by grace be a partaker’ (that is, lawfully according to my Christian liberty), ‘why am I evil spoken of for that for which I give thanks’ (that is, it is a fault in those that accuse me of sin, when I do that which is lawful in itself, abstracted from the consequents or scandal): ‘Whether therefore ye eat or drink’ (which are things indifferent as to the kind of food) ‘or whatsoever ye do’ (how lawful in itself soever) ‘do all to the glory of God’ (For the interest of the end must guide and restrain you in the use even of things in themselves indifferent: For no man has liberty to dishonor God, nor to hurt another, nor to disobey just power). I beseech you therefore while you promise men liberty, be not yourself, and make not them the servants of sin, 2 Pet. 2:19. And take notice that liberty must be distinguished as to right and as to use, and that the use must often be denied and not maintained. 2. Let us next see whether there be no way but separation in our case to preserve our liberty? Paul has here showed you another way: 1. By doctrinal defense to defend it against false teachers that would doctrinally bring us into bondage. To maintain against such, as you [Bagshaw] who add to God’s Laws, that we are not bound to do that which is not commanded [such as separation] or to forbear that which is not by God forbidden [such as partial, qualified conformity], though you say we are. 2. To use our liberty as it tends to God’s glory and man’s good, and disuse it when it crosses these (but not deny our right). This is the Scripture way of preserving it: and not to think that we have no way to preserve it but by doing hurt or crossing love by Church-divisions. 3. No falsehood is a just defense of our Christian liberty: but to say, that a true Church is no true Church, or true worship is no true worship, or that it is not lawful to communicate where it is lawful, is a falsehood. Therefore it is no just defense of our liberty.</p></blockquote>

h+of+the+word+%E2%80%98our%E2%80%99%2C+that+is%2C+we+must+show+how+far+this+liberty+is+ours+indeed%3A+1.+It+is+one+thing+to+be+ours+necessarily%2C+or+as+you+say+%E2%80%98indispensably%E2%80%99%3B+%5B2.%5D+and+another+thing+to+be+ours+when+we+can+get+it%2C+keep+it%2C+or+use+it+without+a+greater+loss+than+it+will+compensate%2C+or+a+greater+hurt+to+others.+%5B3.%5D+It+is+one+thing+to+be+ours+in+fundamental+right%2C+to+be+used+at+fit+times%3B+%5B4.%5D+and+another+thing+to+be+ours+to+be+always+used.+%5BBaxter%E2%80%99s+propositions%3A%5D+Proposition+1%3A+The+liberty+which+is+essential+to+our+Christianity+or+godliness+is+indispensably+to+be+maintained+and+exercised+%28Isa.+61%3A1%3B+Lk.+14%3A18%3B+Gal.+5%3A12%3B+2+Pet.+2%3A19-21%29.+Proposition+2%3A+All+degrees+of+the+same+liberty+must+be+maintained%2C+as+well+as+the+essentials+%28Acts+18%3A26%3B+2+Tim.+2%3A26%29%3B+that+is%2C+we+must+labor+to+be+as+free+as+we+can+from+all+the+degrees+of+sin+and+misery+%282+Cor.+3%3A17%29%3A+But+we+cannot+here+have+what+we+would+%28Heb.+2%3A14-15%29.+Proposition+3%3A+There+is+a+liberty+to+use+certain+things+as+statedly+or+ordinarily+indifferent+%28Gal.+4%3A3%2C+9%29%2C+which+is+none+of+ours+%28to+use+them%29+in+several+cases+%28Rom.+8%3A15%29%2C+which+take+away+the+indifferency+%28Jn.+8%3A31%2C+36%2C+as+in+case+of+scandal%2C+or+greater+hurt+to+others+or+ourselves%2C+Rom.+6%3A16%2C+18%2C+22%2C+or+of+the+restraint+of+just+authority%29.+Proposition+4.+The+same+must+be+said+of+forbearing+things+indifferent.+Proposition+5.+Our+liberty+from+persecution%2C+oppression%2C+injuries%2C+slanders%2C+must+be+patiently+let+go%2C+as+being+none+of+ours+when+it+cannot+be+kept+by+lawful+means+or+without+a+greater+hurt%2C+Acts+22%3A28%2C+etc.+Proposition+6.+But+our+liberty+in+either+of+these+three+last+mentioned+cases%2C+ought+not+causelessly+to+be+taken+from+us+by+others%2C+nor+must+be+causelessly+cast+away+by+ourselves%3B+nor+should+we+yield+to+false+teachers+who+would+deceive+the+churches+by+telling+them+ ffended%2C+or+is+made+weak.%E2%80%99+Christ+Himself+says%3A+Mt.+17%3A26%2C+%E2%80%98Then+are+the+children+free%3A+notwithstanding%2C+lest+we+should+offend%2C+go+thou%2C+etc.+and+give+them+for+Me+and+thee.%E2%80%99+1+Pet.+2%3A16%2C+%E2%80%98As+free%E2%80%99+%28that+is%2C+as+such+as+by+Christ+are+freed+from+true+bondage%2C+but+not+from+order+and+subjection%2C+and+therefore%29+%E2%80%98not+having+or+using+liberty+for+a+cloak+of+maliciousness%2C+but+as+the+servants+of+God.%E2%80%99+No+man+has+liberty+to+be+unruly+or+hurtful.+Rom.+7%3A3%2C+%E2%80%98If+her+husband+be+dead%2C+she+is+free+from+that+law%2C%E2%80%99+and+yet+may+give+away+that+freedom.+Yea%2C+of+the+very+liberty+from+the+Jewish+Law%2C+the+apostle+says%2C+Gal.+5%3A13%2C+%E2%80%98For+ye+have+been+called+unto+liberty%E2%80%99+%28quasi+dicat+%5Bas+if+he+should+say%5D%2C+therefore+let+not+false+teachers+persuade+you+that+you+are+bound+to+that+which+you+are+freed+from%29+%E2%80%98only+use+not+liberty+for+an+occasion+to+the+flesh%2C+but+by+love+serve+one+another%3B%E2%80%99+q.d.+in+the+exercise+of+this+liberty+you+must+do+or+not+do+the+things+you+are+at+liberty+in%2C+as+may+do+most+good+according+as+the+law+of+love+requires+and+not+as+your+own+carnal+interest+and+lust+inclines+you%3A+for+all+the+Law+is+fulfilled+in+one+word%2C+in+this%3A+%5B1.%5D+%E2%80%98Thou+shalt+love+thy+neighbor+as+thyself.%E2%80%99+%5B2.%5D+1+Cor.+10%3A25%2C+28-31%2C+%E2%80%98Whatsoever+is+sold+in+the+shambles+eat%2C+asking+no+question+for+conscience+sake%E2%80%94But+if+any+man+say+unto+you%2C+%E2%80%98This+is+offered+in+sacrifice+to+idols%2C%E2%80%99+eat+not+for+his+sake+that+showed+it%2C+and+for+conscience+sake%E2%80%99+%28Thus+our+liberty+is+not+to+be+exercised+against+love%3A+for+we+have+no+liberty+to+hurt+our+brethren%29+v.+29%2C+%E2%80%98Conscience+I+say%2C+not+thine+own%2C+but+of+the+others%3A%E2%80%99+%28Thus+others+by+weakness%2C+and+consequently+rulers+by+authority+may+restrain+the+exercise+of+our+liberty%29+%E2%80%98For+why+is+my+liberty+judged+of+another+man%E2%80%99s+conscience%3F%E2%80%99+That+is%2C+not+that+his+conscience+is+the+rule+of+my+right+or+his+judgment+takes+away+my+title+to+liberty%2C+but+his+interest+and+the+law+of+love+do+take+away+my+right+of+using+my+liberty+to+another%E2%80%99s+hurt.+v.+30%2C+%E2%80%98For+if+I+by+grace+be+a+partaker%E2%80%99+%28that+is%2C+lawfully+according+to+my+Christian+liberty%29%2C+%E2%80%98why+am+I+evil+spoken+of+for+that+for+which+I+give+thanks%E2%80%99+%28that+is%2C+it+is+a+fault+in+those+that+accuse+me+of+sin%2C+when+I+do+that+which+is+lawful+in+itself%2C+abstracted+from+the+consequents+or+scandal%29%3A+%E2%80%98Whether+therefore+ye+eat+or+drink%E2%80%99+%28which+are+things+indifferent+as+to+the+kind+of+food%29+%E2%80%98or+whatsoever+ye+do%E2%80%99+%28how+lawful+in+itself+soever%29+%E2%80%98do+all+to+the+glory+of+God%E2%80%99+%28For+the+interest+of+the+end+must+guide+and+restrain+you+in+the+use+even+of+things+in+themselves+indifferent%3A+For+no+man+has+liberty+to+dishonor+God%2C+nor+to+hurt+another%2C+nor+to+disobey+just+power%29.+I+beseech+you+therefore+while+you+promise+men+liberty%2C+be+not+yourself%2C+and+make+not+them+the+servants+of+sin%2C+2+Pet.+2%3A19.+And+take+notice+that+liberty+must+be+distinguished+as+to+right+and+as+to+use%2C+and+that+the+use+must+often+be+denied+and+not+maintained.+2.+Let+us+next+see+whether+there+be+no+way+but+separation+in+our+case+to+preserve+our+liberty%3F+Paul+has+here+showed+you+another+way%3A+1.+By+doctrinal+defense+to+defend+it+against+false+teachers+that+would+doctrinally+bring+us+into+bondage.+To+maintain+against+such%2C+as+you+%5BBagshaw%5D+who+add+to+God%E2%80%99s+Laws%2C+that+we+are+not+bound+to+do+that+which+is+not+commanded+%5Bsuch+as+separation%5D+or+to+forbear+that+which+is+not+by+God+forbidden+%5Bsuch+as+partial%2C+qualified+conformity%5D%2C+though+you+say+we+are.+2.+To+use+our+liberty+as+it+tends+to+God%E2%80%99s+glory+and+man%E2%80%99s+good%2C+and+disuse+it+when+it+crosses+these+%28but+not+deny+our+right%29.+This+is+the+Scripture+way+of+preserving+it%3A+and+not+to+think+that+we+have+no+way+to+preserve+it+but+by+doing+hurt+or+crossing+love+by+Church-divisions.+3.+No+falsehood+is+a+just+defense+of+our+Christian+liberty%3A+but+to+say%2C+that+a+true+Church+is+no+true+Church%2C+or+true+worship+is+no+true+worship%2C+or+that+it+is+not+lawful+to+communicate+where+it+is+lawful%2C+is+a+falsehood.+Therefore+it+is+no+just+defense+of+our+liberty.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Second+Admonition+to+Mr.+Edward+Bagshaw%E2%80%A6+%28London%2C+1671%29%2C+sect.+43%2C+pp.+107-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62c628366b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62c628366b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-christian-liberty/#:~:text=Edward%20Bagshaw%3A%20%E2%80%98This%20we%20affirm%3A%201,no%20just%20defense%20of%20our%20liberty&amp;text=Edward%20Bagshaw%3A%20%E2%80%98This%20we%20affirm%3A%201.%20Because%20we&amp;text=it%20is%20no%20just%20defense%20of%20our%20liberty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Mr. [Thomas] Hooker [an Independent]: ‘They [Christian persons] may, as Christians, maintain private communion one with another; and as they be Churches, use that Christian privilege to further their own good, and promote the work by counsel: for what I do qua ethicus, qua oeconomicus, qua Christianus [as an ethical person, as a domestic person, as a Christian] in private, appertains not to the Magistrate, except it entrench upon his policy.’ [Rutherford’s] Answer: 1. Mr. Hooker makes all that Christians do as Christians and as Churches, that is, gathering of Churches, hearing, partaking of seals and censures, to be private actings not belonging to the Magistrate. Strange it is that the convening of the ten thousand subjects in the same place (as our [congregationalist] Brethren say) belongs nothing to the Magistrate; [yet] sure it sides with peace or war. And yet Mr. Hooker saith, ‘The Magistrate may compel men to attend the mind of Christ, and solemnly to humble themselves by fasting and prayer.’ See how these two consist. … Mr. Hooker: ‘Commission and just permission are all one: A Ruler permits a Finder to set up a school, he needs no commission.’ Answer: If fencing be useful, the Ruler must give him positive protection, as others that do well; else if one kill him when he teaches his scholars, the Ruler ought not to revenge that murder, though most treacherously committed, and say he promised to the Fencer only permission; and yet it’s worse to say [that] the Christian Ruler owes to assemblies, pastors, schools only permission. Paul saith, he owes praise, Rom. 13:3, which, with good ground, famous interpreters expound to be countenancing, favor, protection, reward, stipends. And if the Christian magistrate do but permit assemblies to convene, as a very episcopal man, D. Bilson said, permissio est à magistratu, commissio à Christo [‘Permission is from the magistrate, a commission from Christ’]: What more influence (if permission and commission be all one) hath the godly magistrate in the public worship of God, and assemblies of the Church, than heathen magistrates, Ahasuerus, the Kings of Chaldea, who permitted the people of God to worship the true God, Esth. 4:16-17; Dan. 6:7-8, or the Church of Rome have, who by public order establish stews [whore-houses] and permit fornication? See Emmanuel Sa, who says, bishops and priests are by law permitted to have whores.</p></blockquote>

y+permission.+Paul+saith%2C+he+owes+praise%2C+Rom.+13%3A3%2C+which%2C+with+good+ground%2C+famous+interpreters+expound+to+be+countenancing%2C+favor%2C+protection%2C+reward%2C+stipends.+And+if+the+Christian+magistrate+do+but+permit+assemblies+to+convene%2C+as+a+very+episcopal+man%2C+D.+Bilson+said%2C+permissio+est+%C3%A0+magistratu%2C+commissio+%C3%A0+Christo+%5B%E2%80%98Permission+is+from+the+magistrate%2C+a+commission+from+Christ%E2%80%99%5D%3A+What+more+influence+%28if+permission+and+commission+be+all+one%29+hath+the+godly+magistrate+in+the+public+worship+of+God%2C+and+assemblies+of+the+Church%2C+than+heathen+magistrates%2C+Ahasuerus%2C+the+Kings+of+Chaldea%2C+who+permitted+the+people+of+God+to+worship+the+true+God%2C+Esth.+4%3A16-17%3B+Dan.+6%3A7-8%2C+or+the+Church+of+Rome+have%2C+who+by+public+order+establish+stews+%5Bwhore-houses%5D+and+permit+fornication%3F+See+Emmanuel+Sa%2C+who+says%2C+bishops+and+priests+are+by+law+permitted+to+have+whores.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+penned+by+Mr.+Thomas+Hooker+%28London%2C+1658%29%2C+bk.+4%2C+ch.+12%2C+%E2%80%98Of+the+Magistrate%E2%80%99s+Power+in+Convocating+Synods%E2%80%99%2C+pp.+487%2C+489&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa663f3dd93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a663f3dd93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-libertarianism/#:~:text=Mr.%20%5BThomas%5D%20Hooker%20%5Ban%20Independent%5D%3A%20%E2%80%98They,by%20law%20permitted%20to%20have%20whores&amp;text=Mr.%20%5BThomas%5D%20Hooker%20%5Ban%20Independent%5D%3A%20%E2%80%98They%20%5BChristian%20persons&amp;text=priests%20are%20by%20law%20permitted%20to%20have%20whores" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

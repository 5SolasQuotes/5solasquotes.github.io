<main class="wrap"><figure class="quote" id="q-8186843c7c" data-kw="">
<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs. 4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw (London: Simmons, 1671), ‘To those Readers…’</cite>, p. 3</span></figcaption>

</figure><figure class="quote" id="q-c40c632b2a" data-kw="">
<blockquote><p>The third innovation is that the word of promise, ‘This is my body,’ ‘This cup is the new testament, etc.’ is not uttered demonstratively when the elements are delivered to every communicant. It is not enough that the words of the institution were rehearsed before by way of history narratively, or materially. This sacrament is an imitation of Christ, not a recital of his words and actions; it is to do as He did, and not to report what He did, says Pierre du Moulin.</p></blockquote>

</figure><figure class="quote" id="q-a4f0a417ed" data-kw="">
<blockquote><p>It may seem absurd to say that he ‘is in heaven’ while he still lives on earth. If it is answered that this is true about his divine nature, then this expression would mean something else—-namely, that while he was man he was ‘in heaven.’ I could point out that no place is mentioned here and that only Christ is distinguished from everybody else as far as his state is concerned, since he is the heir of the kingdom of God, from which the whole human race is banished. However, as very frequently happens, because of the unity of the person of Christ, what correctly applies to one of his natures is applied to another of his natures, and so we need seek no other solution. So Christ, who ‘is in heaven,’ has clothed himself in our flesh, so that by stretching out his brotherly hand to us he may raise us to heaven with himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John in Crossway Classic Commentaries, eds. Alister McGrath &amp; J. I. Packer (Wheaton, IL: Crossway, 1994), on Jn. 3:13</cite>, pp. 74-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

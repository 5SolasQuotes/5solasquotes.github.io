<blockquote><p>Here by “schoolmaster” understand one that teaches little children or [minors] the first rudiments or elements, A, B, C. And the law is “a schoolmaster to Christ,” for two causes. One, because it points out and shadows forth unto us Christ by bodily rudiments of ceremonies and sacrifices. The second is because the law, specially the moral law, urges and compels men to go to Christ. For it shows us our sins, and that without remedy. It shows us the damnation that is due unto us. And by this means, it makes us despair of salvation in respect of ourselves. And thus it enforces us to seek for help out of ourselves in Christ. The law is then our schoolmaster not by the plain teaching, but by stripes and correction. In this verse, Paul sets down the manner and way of our salvation, which is on this manner: first, the law prepares us by humbling us; then comes the gospel, and it stirs up faith. And faith wrought in the heart apprehends Christ for justification, sanctification, and glorification. Paul sets this forth by a fit similitude. They that would be the servants and children of God must come into the school of God and be taught of Him. In this school are two forms and two masters. In the first form, the teacher and master is the law. And he teaches men to know their sin and their deserved damnation, and he causes us to despair of our salvation in respect of ourselves. And when men have been well schooled by the law and are brought to acknowledge their sins and that they are slaves of sin and Satan, then must they be taken up to a higher form and be taught by another schoolmaster, which is faith or the gospel. The lesson of the gospel is that men after they are humbled must fly to the throne of grace, believe in Christ, and with all their hearts turn unto God that they may be justified and glorified. When we have by the teaching of this second master learned this good lesson, we are become children and servants of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 204–05.</cite></span></figcaption>

<blockquote><p>Obs. I. Believers under the new testament have lost nothing, no privilege that was enjoyed by them under the old. Many things they have gained, and those of unspeakable excellency, but they have lost nothing at all. Whatever they had of privilege in any ordinance, that is continued; and whatever was of burden or bondage, that is taken away. All that they had of old was on this account, that they were the people of God. To them as such did all their advantages and privileges belong. But they were yet so the people of God as to be kept like servants, under the severe discipline of the law, Gal. 4:1. Into this great fountain-privilege believers under the gospel are now succeeded. And what was of servitude in reference unto the law is removed and taken away; but whatever was of advantage is continued unto them, as the people of God. This, I suppose, is unquestionable, that God making them to be “his people who were not a people,” would not cut them short of any privilege which belonged before to his people as such, Rom. 9:25, 26. Besides, the state of the gospel is an estate of more grace and favour from God than that under the law, John 1:17. The whole gospel is an ampliation of divine spiritual grace and favour to God’s people. So is it a better estate than that which went before, accompanied with “better promises,” more liberty, grace, and privileges, than it. Nothing, then, of this nature can be lost therein or thereby to believers, but all privileges at any time granted unto the people of God are made over to them that under the gospel are so. Let men but give one instance to this purpose, and not beg the matter in question, and it shall suffice. Moreover, God hath so ordered all things in the dispensation of his grace and institution of his worship, that Jesus Christ should have the pre-eminence in all. All things are gathered up unto a head in him. And is it possible that any man should be a loser by the coming of Christ, or by his own coming unto Christ? It is against the whole gospel once to imagine it in the least instance. Let it now be inquired whether it were not a great privilege of the people of God of old, that their infant seed were taken into covenant with them, and were made partakers of the initial seal thereof? Doubtless it was the greatest they enjoyed, next to the grace they received for the saving of their own souls. That it was so granted them, so esteemed by them, may be easily proved. And without this, whatever they were, they were not a people. Believers under the gospel are, as we have spoken, the people of God; and that with all sorts of advantages annexed unto that condition, above what were enjoyed by them who of old were so. How is it, then, that this people of God, made so by Jesus Christ in the gospel, should have their charter, upon its renewal, razed with a deprivation of one of their choicest rights and privileges? Assuredly it is not so. And therefore if believers are now, as the apostle says they are, “the people of God,” their children have a right to the initial seal of the covenant. Again,—</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews ed., W. H. Goold (Edinburgh: Johnstone and Hunter), 21. 328–29.</cite></span></figcaption>

<blockquote><p>…Which, as I take it, is to be understood of any time of her coming abroad. But this kind of covering is not used in these cold countries, but instead thereof hats, or other dresses, a difference being yet still retained, in that the woman’s cover upon her head is fixed, but the man moves his in salutation and for reverence at any time… But this as has been already touched out of Beza, holds not but in such countries where to sit with the hat off argues authority, and to be covered, subjection; In these parts it is contrariwise, and therefore our preaching uncovered does not seem to be grounded upon this, but rather to have been taken up in reverence to God… And upon the like reason men are appointed to hear the Word of God read being uncovered, and to follow the same order at the preaching of the Word is most commendable in all, that are not constrained by their bodily infirmity to cover. Only I say it is altogether from the purpose of this place to teach a necessity of so doing.</p></blockquote>

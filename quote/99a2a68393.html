<main class="wrap"><figure class="quote" id="q-99a2a68393" data-kw="">
<blockquote><p>Inveni igitur in Epistolis tuis in lucem editis Epistolas duas 35 et 45 in quarum illa controversiam hanc paucis attingis. In ista vero copiosius et plenius edisseris. In 35 igitur epistola ‘Quid vanius est, inquis, quam justum arbitrari qui Legem non impleverit?’ At, inquam, justicia Evangelii a justicia Legis, prudenter discernenda est, Justicia qua nos justi censemur a Deo ac proinde ab eodem justificamur seu absolvimur, non est justicia Legis, neque enim Deus ideo nos justificat, quod Legem vel ipsi nos impleverimus, vel Christus pro nobis impleverit. Sed est justicia Evangelii, id est quam Deus nobis per Evangelium donat, nempe remissio peccatorum sanguine Christi parta. Vitam igitur petimus a Deo non jure impletae Legis seu obedientiae Legi praestitae sed jure adoptionis, quam Christus sua morte nobis peperit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8</cite>, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024), pp. 219-20 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“Inveni igitur in Epistolis tuis in lucem editis Epistolas duas 35 et 45 in quarum illa controversiam hanc paucis attingis. In ista vero copiosius et plenius edisseris. In 35 igitur epistola ‘Quid vanius est, inquis, quam justum arbitrari qui Legem non impleverit?’ At, inquam, justicia Evangelii a justicia Legis, prudenter discernenda est, Justicia qua nos justi censemur a Deo ac proinde ab eodem justificamur seu absolvimur, non est justicia Legis, neque enim Deus ideo nos justificat, quod Legem vel ipsi nos impleverimus, vel Christus pro nobis impleverit. Sed est justicia Evangelii, id est quam Deus nobis per Evangelium donat, nempe remissio peccatorum sanguine Christi parta. Vitam igitur petimus a Deo non jure impletae Legis seu obedientiae Legi praestitae sed jure adoptionis, quam Christus sua morte nobis peperit.”

8393.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99a2a68393.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Inveni%20igitur%20in%20Epistolis%20tuis%20in,quam%20Christus%20sua%20morte%20nobis%20peperit&amp;text=Inveni%20igitur%20in%20Epistolis%20tuis%20in%20lucem%20editis&amp;text=jure%20adoptionis%2C%20quam%20Christus%20sua%20morte%20nobis%20peperit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08f2c04b0b" data-kw="">
<blockquote><p>But I fear the sense of this [said by antinomians], that ‘Christ repents for us, and obeys for us, He being the end of the Law to overy one that believes,’ be far otherwise, to wit, that Christ’s obedience of the Law, He being the end of the Law, as also his passive obedience is ours. If this be the intended sense, then: [1.] All our sanctification is nothing but the sanctification and holy active obedience of Christ. I yield this to be a broad, a fair and easy way to heaven. Christ does all for us [according to antinomians:], Christ weeped for my sins, and that is all the repentance required in me, if I believe that Christ was mortified and dead to the world for me, that is my mortification; and if I believe that the change of the whole man was truly in Christ, this is my true holiness: then my walking in holiness cannot be rewarded with life eternal, nor have any influence as a way or means leading to the kingdom.

2. Christ’s active obedience imputed to the sinner can be no evidence of justification, because it is in Christ, not in me; any evidence or mark of justification must be inherent in the believer, not in Christ.

3. And one and the same thing cannot be a mark and a sign of itself. Now the active obedience of Christ imputed to the sinner is holden [by antinomians] to be a part of justification [and therefore it cannot be a sign of justification].</p></blockquote>

oksonline.com/the-active-obedience-of-christ#:~:text=But%20I%20fear%20the%20sense%20of,cannot%20be%20a%20sign%20of%20justification&amp;text=But%20I%20fear%20the%20sense%20of%20this%20%5Bsaid&amp;text=therefore%20it%20cannot%20be%20a%20sign%20of%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-513ea6e239" data-kw="">
<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>

</figure><figure class="quote" id="q-c626d585fe" data-kw="">
<blockquote><p>Q. 23. Is it correct to say that the righteousness of the Mediator is imputed to us in justification and infused in sanctification? …it is not the same righteousness of Christ that occurs in its two parts. When I speak of an imputed righteousness of the Mediator, then I mean that righteousness that He obtained by means of his suffering and dying and obedience in the state of humiliation–not, however, the righteousness of life of the human nature of Christ, that is, that Christ in his human nature now possesses. The latter is not imputed to me. And, conversely, the former cannot be infused into me; it can only be reckoned to me. Really, one cannot even say that the righteousness in which Christ now lives is infused into me. This always rests on a more or less unclear mystical conception. It is not the personal righteousness of Christ that is infused into the believer, for, as an inherent quality, righteousness cannot be detached from the person. Q. 24 Is then no ‘holiness’ of Christ imputed to us? Yes; by that term, if one wishes, one can designate his active obedience, imputed to us in justification. As our [Heidelberg] Catechism states in the answer to question 60, ‘How are you righteous before God?… God grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ,’ etc. In this sense, one may thus then say that Christ is not only our sanctification but also our holiness before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, tr: Richard Gaffin 1 vol. ed., pp. 801-2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Q. 23. Is it correct to say that the righteousness of the Mediator is imputed to us in justification and infused in sanctification? …it is not the same righteousness of Christ that occurs in its two parts. When I speak of an imputed righteousness of the Mediator, then I mean that righteousness that He obtained by means of his suffering and dying and obedience in the state of humiliation–not, however, the righteousness of life of the human nature of Christ, that is, that Christ in his human nature now possesses. The latter is not imputed to me. And, conversely, the former cannot be infused into me; it can only be reckoned to me. Really, one cannot even say that the righteousness in which Christ now lives is infused into me. This always rests on a more or less unclear mystical conception. It is not the personal righteousness of Christ that is infused into the believer, for, as an inherent quality, righteousness cannot be detached from the person. Q. 24 Is then no ‘holiness’ of Christ imputed to us? Yes; by that term, if one wishes, one can designate his active obedience, imputed to us in justification. As our [Heidelberg] Catechism states in the answer to question 60, ‘How are you righteous before God?… God grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ,’ etc. In this sense, one may thus then say that Christ is not only our sanctification but also our holiness before God.”

— Geerhardus Vos, Reformed Dogmatics tr: Richard Gaffin 1 vol. ed., pp. 801-2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+23.+Is+it+correct+to+say+that+the+righteousness+of+the+Mediator+is+imputed+to+us+in+justification+and+infused+in+sanctification%3F+%E2%80%A6it+is+not+the+same+righteousness+of+Christ+that+occurs+in+its+two+parts.+When+I+speak+of+an+imputed+righteousness+of+the+Mediator%2C+then+I+mean+that+righteousness+that+He+obtained+by+means+of+his+suffering+and+dying+and+obedience+in+the+state+of+humiliation%E2%80%93not%2C+however%2C+the+righteousness+of+life+of+the+human+nature+of+Christ%2C+that+is%2C+that+Christ+in+his+human+nature+now+possesses.+The+latter+is+not+imputed+to+me.+And%2C+conversely%2C+the+former+cannot+be+infused+into+me%3B+it+can+only+be+reckoned+to+me.+Really%2C+one+cannot+even+say+that+the+righteousness+in+which+Christ+now+lives+is+infused+into+me.+This+always+rests+on+a+more+or+less+unclear+mystical+conception.+It+is+not+the+personal+righteousness+of+Christ+that+is+infused+into+the+believer%2C+for%2C+as+an+inherent+quality%2C+righteousness+cannot+be+detached+from+the+person.+Q.+24+Is+then+no+%E2%80%98holiness%E2%80%99+of+Christ+imputed+to+us%3F+Yes%3B+by+that+term%2C+if+one+wishes%2C+one+can+designate+his+active+obedience%2C+imputed+to+us+in+justification.+As+our+%5BHeidelberg%5D+Catechism+states+in+the+answer+to+question+60%2C+%E2%80%98How+are+you+righteous+before+God%3F%E2%80%A6+God+grants+and+imputes+to+me+the+perfect+satisfaction%2C+righteousness%2C+and+holiness+of+Christ%2C%E2%80%99+etc.+In+this+sense%2C+one+may+thus+then+say+that+Christ+is+not+only+our+sanctification+but+also+our+holiness+before+God.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+Reformed+Dogmatics+tr%3A+Richard+Gaffin+1+vol.+ed.%2C+pp.+801-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc626d585fe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c626d585fe.html">Permalink</a><a

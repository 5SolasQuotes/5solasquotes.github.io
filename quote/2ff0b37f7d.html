<main class="wrap"><figure class="quote" id="q-2ff0b37f7d" data-kw="">
<blockquote><p>The principle of Church Establishments, properly understood, and apart from adventitious circumstances, is just the principle of national religion. It has many ramifications all springing from an acknowledgment of the universal supremacy of Christ, and bearing upon the duty of nations and their rulers to promote the advancement of true religion, and the prosperity of Christ’s cause and kingdom.

It is connected with the protection of the Sabbath, the promotion of scriptural education in the public schools, the conservation of the purity of the Scriptures, and the sacredness of the law of marriage. It assumes that nations are moral and responsible creatures, accountable to God in their corporate capacity, and the proper subjects of rewards and punishments.

It implies that wherever God’s Word exists, its existence and influence ought to be nationally acknowledged as the only supreme authority and the foundation of law. “There is no power but of God; the powers that be are ordained of God.” The civil magistrate is “a minister of God,” and therefore bound to honour and serve Him, whilst “he that ruleth over men must be just, ruling in the fear of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Establishment Principle Defended: A Reply to the Statement by the Committee of the United Presbyterian Church on Disestablishment and Disendowment</cite>, (Edinburgh: Johnstone, Hunter, &amp; Co., 1873), v-vi.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eed89394a8" data-kw="">
<blockquote><p>The next debate of this nature and kind that fell in was, first, about accepting the [civil] indulgence, then about hearing indulged ministers. As to the first, this made no schism, so long as ministers held their debates among themselves. Some accepted, some not. Those who accepted preached in those parishes where they were indulged; others elsewhere, and sometimes there with them. The indulged ministers also preached elsewhere as they had occasion and access, but thought it not duty to offend the magistrate in breaking confinement to go unnecessarily elsewhere to preach, and thereby hazard the peaceable public exercise of their ministry, which was all they acknowledged they held of the magistrate… neither thought they the keeping of their confinement, though unjustly imposed, a sin, but rather suffering on their part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

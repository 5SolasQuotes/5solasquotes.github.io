<main class="wrap"><figure class="quote" id="q-28e5a76b9b" data-kw="">
<blockquote><p>1. Some things are necessary by divine ordination, as magistracy; ‘Whosoever resists the power,’ says the apostle, ‘resists the ordinance of God;’ and ‘the powers that be, are ordained of God,’ Rom. 13:1-2, etc. And as magistracy, so ministry is the ordinance of God, 1 Cor. 12:28, ‘And God hath set some in the Church, first Apostles, etc.’ 2. Some things are necessary by divine precept; as for example, the exercise of the power of the magistrate is not only necessary by virtue of God’s instituting and ordaining magistracy, but also by the command of God, which obliges magistrates to punish vice, to execute wrath upon them who do evil, to promove, encourage and praise that which is good; to protect their subjects in well-doing, and to preserve peace. And so ministers are under a necessity of preaching the Gospel by the command of God. 3. Some things are necessary because God has made them useful and convenient for man, and has given them to man for his use; they are in their nature convenient for man, given and designed of God for the good of man; thus meat and clothing, and houses, peace and the protection of lawful authority are necessary. 4. Some things are necessary means in order to a necessary end; and these again are necessary, either simply for attaining the end, or necessary for the better or more easy and convenient attaining of the end; as a house is necessary, not simply for hearing of the Word, but for the more convenient hearing of the Word, because it shelters the minister and people from storms, winds and scorching heat, etc. Thus the protection of lawful authority is necessary for the peaceable hearing of the Word without disturbance. 5. Some things are necessary for preventing of evil; the evil either of sin, or of affliction and calamity. 6. Some things become necessary, or the more necessary to be done, because of those who urge the forbearance of them out of some erroneous principle, or for establishing of some error. And thus Mr. Rutherford shows in the forecited treatise [the Appendix on Scandal to The Divine Right of Church Government], that to forbear the eating of swine’s-flesh before a Jew, who alleges that it is a sin, or breach of the commandment of God to do so; to forbear it now when we are fully possessed in that liberty wherewith Christ has made us free, were to harden the Jew in his Judaism, and the way to bring us again under the yoke of the Ceremonial Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, … (London, 1681), pp. 249-50</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2fdd3db89d" data-kw="">

</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

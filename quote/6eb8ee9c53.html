<main class="wrap"><figure class="quote" id="q-6eb8ee9c53" data-kw="">
<blockquote><p>[The Reformed Churches] have generally recognized the baptism of other Churches, not excluding the Roman Catholics, and also of the various sects, except in the case of Churches and sects which denied the Trinity. Thus they refused to honour the baptism of the Socinians and of the Unitarians. In general, they considered a baptism as valid which was administered by a duly accredited minister and in the name of the triune God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Wm. B. Eerdmans Publishing Co., 1938), 631.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3087bd07b3" data-kw="">
<blockquote><p>The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation</cite>, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-98e749d745" data-kw="">
<blockquote><p>Naturally, therefore, this sign and seal belongs only to those who are the Lord’s. Or, to put it rather in the positive form, this sign and seal belongs to all those who are the Lord’s. There are no distinctions of race or station, sex or age; there is but one prerequisite—that we are the Lord’s. What it means is just this and nothing else: that we are the Lord’s. What it pledges is just this and nothing else: that the Lord will keep us as his own. We need not raise the question, then, whether infants are to be baptized. Of course they are, if infants, too, may be the Lord’s. Naturally, as with adults, it is only the infants who are the Lord’s who are to be baptized; but equally naturally as with adults, all infants that are the Lord’s are to be baptized. Being the Lord’s they have a right to the sign that they are the Lord’s and to the pledge of the Lord’s holy keeping. Circumcision, which held the place in the old covenant that baptism holds in the new, was to be given to all infants born within the covenant. Baptism must follow the same rule. This and this only can determine its conference: Is the recipient a child of the covenant, with a right therefore to the sign and seal of the covenant? We cannot withhold the sign and seal of the covenant from those who are of the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1920 | (HT: Kim Riddlebarger)</span></figcaption>

<blockquote><p>…yet we find [in the N.T.] whole families baptized, and several saints greeted with the Church of God in such an house, which may as reasonably infer the children and servants of such families to have been baptized, and to have been reckoned Church-members; and we may as reasonably believe there were children in some of their houses and families who were baptized, as they [baptists] can confidently deny it.</p></blockquote>

</figure><figure class="quote" id="q-09f6d34181" data-kw="">
<blockquote><p>Lest any understand what I have said a few pages hence, as if I wholly denied common innate principles, observe that it is only actual connate knowledge that I deny, and in respect to which I say that the soul is rasa tabula [a blank slate]; but I confess a natural passive power for the knowing of them, and a greater disposition, or aptitude in the intellect to understand them, than conclusions drawn from them; and so that an infant also may have a sanctified intellect, by such aptitude and disposition. But I think not that ever these would be acted, in an ordinary natural way, without the help of some sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity</cite>, (London: R.W., 1655), An Advertisement Explicatory, p. iix</span></figcaption>

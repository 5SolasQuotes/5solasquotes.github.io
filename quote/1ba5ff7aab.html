<main class="wrap"><figure class="quote" id="q-1ba5ff7aab" data-kw="">
<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</cite>, p. 34</span></figcaption>

<blockquote><p>I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024)</cite>, pp. 219-20 ff.</span></figcaption>

<blockquote><p>15. Did Christ redeem us only by his passive righteousness? The difference of opinions XXXVII. Fifteenth, it is asked whether Christ redeemed us only by his passive righteousness, or in addition also his active righteousness. Johannes Piscator, otherwise an outstanding theologian, together with several others, because they thought that the necessity of passive righteousness and death would be abolished if it were stated that in our place he most exactly kept the divine law, because one who kept the law exactly could not be punished with death, chose the prior. Protestants commonly prefer the latter, and certainly correctly, but not all in one way. Some divide the passive and active righteousness of Christ in such a way that only by his passive righteousness did he satisfy in our place for the law that was not observed, and by it delivered us only from the guilt of punishment, and likewise, only by his active righteousness did he keep the law perfectly in our place, and by keeping it, acquire for us the right of eternal life. Others, with that more subtle division laid aside, prefer to state that Christ devoted both these kinds of righteousness to us, to the end that he might satisfy for the divine law that was not observed by us, and by satisfying, also merit for us the right of life, in such a way that by this satisfaction he at the same time delivered us from every evil and gained the right of every good. The difficulties raised by Piscator are removed We have adduced the reasons for this view in §XX: with them presupposed, it is not so difficult to respond to the difficulties raised by Piscator. For if (1) it should be alleged that the law demands nothing but one or the other, either obedience or punishment, we will respond that the law, first from man in his integrity, demands only obedience under threat of punishment, but from the sinner, it demands punishment for past sin and obedience in the future, because punishment cannot deliver from the obedience owed to God. Wherefore the Redeemer had to supply both. If (2) it should be alleged that the necessity and use of the death and passive righteousness are removed when he has most fully kept the law on our behalf, we will respond that it is by no means removed, because both kinds of righteousness were necessary for him to satisfy for the injury we inflicted upon the divine majesty and his law, and in satisfying, to merit for us the right of eternal life. If (3) it should be alleged that Scripture refers the consummation of our salvation to his one and only sacrifice accomplished on the cross, we will respond that by that sacrifice is understood by synecdoche his entire satisfaction, the outstanding part of which his death on the cross supplied, just as by the same synecdoche, the blood of Christ designates the same satisfacation (1 John 1:7; Acts 20:28). If one should proceed (4) to allege that obedience was necessary for his own self as a man, and thus could not be expended for us, we will respond that (a) the obedience, insofar as it resulted from the God-man, was not necessary for him, because the law obligates not the God-man to obedience, but a mere man; (b) that obedience of the God-man is of infinite value, whereby it was able to suffice both for himself and for us, because an obedience greater than infinite could not be demanded or supplied for him, or at the same time for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB)</cite>, vol. 4, bk. 5, ch. 18, The Mediator’s Redemption Itself</span></figcaption>

ll+respond+that+the+law%2C+first+from+man+in+his+integrity%2C+demands+only+obedience+under+threat+of+punishment%2C+but+from+the+sinner%2C+it+demands+punishment+for+past+sin+and+obedience+in+the+future%2C+because+punishment+cannot+deliver+from+the+obedience+owed+to+God.+Wherefore+the+Redeemer+had+to+supply+both.+If+%282%29+it+should+be+alleged+that+the+necessity+and+use+of+the+death+and+passive+righteousness+are+removed+when+he+has+most+fully+kept+the+law+on+our+behalf%2C+we+will+respond+that+it+is+by+no+means+removed%2C+because+both+kinds+of+righteousness+were+necessary+for+him+to+satisfy+for+the+injury+we+inflicted+upon+the+divine+majesty+and+his+law%2C+and+in+satisfying%2C+to+merit+for+us+the+right+of+eternal+life.+If+%283%29+it+should+be+alleged+that+Scripture+refers+the+consummation+of+our+salvation+to+his+one+and+only+sacrifice+accomplished+on+the+cross%2C+we+will+respond+that+by+that+sacrifice+is+understood+by+synecdoche+his+entire+satisfaction%2C+the+outstanding+part+of+which+his+death+on+the+cross+supplied%2C+just+as+by+the+same+synecdoche%2C+the+blood+of+Christ+designates+the+same+satisfacation+%281+John+1%3A7%3B+Acts+20%3A28%29.+If+one+should+proceed+%284%29+to+allege+that+obedience+was+necessary+for+his+own+self+as+a+man%2C+and+thus+could+not+be+expended+for+us%2C+we+will+respond+that+%28a%29+the+obedience%2C+insofar+as+it+resulted+from+the+God-man%2C+was+not+necessary+for+him%2C+because+the+law+obligates+not+the+God-man+to+obedience%2C+but+a+mere+man%3B+%28b%29+that+obedience+of+the+God-man+is+of+infinite+value%2C+whereby+it+was+able+to+suffice+both+for+himself+and+for+us%2C+because+an+obedience+greater+than+infinite+could+not+be+demanded+or+supplied+for+him%2C+or+at+the+same+time+for+us.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%28RHB%29%2C+vol.+4%2C+bk.+5%2C+ch.+18%2C+The+Mediator%E2%80%99s+Redemption+Itself&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6427389ef6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6427389ef6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=15.%20Did%20Christ%20redeem%20us%20only,at%20the%20same%20time%20for%20us&amp;text=15.%20Did%20Christ%20redeem%20us%20only%20by%20his&amp;text=him%2C%20or%20at%20the%20same%20time%20for%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-35afe7c913" data-kw="">
<blockquote><p>Which [Scriptural phrases] all signify one thing: that is, his suffering in the flesh. For nowhere in the Scriptures of God is our righteousness particularly attributed to any other action of Christ. Neither can it be collected to consist in any other action, except out of the general word of ‘obedience’. Neither is there any necessity (if the matter be well weighed) to add anything to the sufferings of Christ in the matter of our righteousness. Yea moreover, it would appear by diverse grounds of the truth of God that nothing can or may be added thereunto in the matter of our righteousness.</p></blockquote>

<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>

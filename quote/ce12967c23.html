<main class="wrap"><figure class="quote" id="q-ce12967c23" data-kw="">
<blockquote><p>But, on the contrary, whereas the malicious craft of Satan and the prevalent power and rage of mankind have combined and been set at work to the ruin and utter suppression of this book, proceeding sometimes so far as that there was no appearing way for its escape; yet, through the watchful care and providence of God, sometimes putting itself forth in miraculous instances, it hath been preserved unto this day, and shall be so to the consummation of all things.

The event of that which was spoken by our Saviour, Matt. v. 18, doth invincibly prove the divine approbation of this book, as that doth its divine original, “Till heaven and earth pass, one jot or one tittle shall in no wise pass from the law.” God’s perpetual care over the Scripture for so many ages, that not a letter of it should be utterly lost, nothing that hath the least tendency towards its end should perish, is evidence sufficient of his regard unto it.

Especially would it be so if we should consider with what remarkable judgments and severe reflections of vengeance on its opposers this care hath been managed, instances whereof might easily be multiplied. And if any will not ascribe this preservation of the books of the Bible, not only in their being, but in their purity and integrity, free from the least just suspicion of corruption, or the intermixture of any thing human or heterogeneous, unto the care of God, it is incumbent on him to assign some other cause proportionate to such an effect, whilst it was the interest of heaven and the endeavour of earth and hell to have it corrupted and destroyed.

For my part, I cannot but judge that he that seeth not an hand of divine Providence stretched out in the preservation of this book and all that is in it, its words and syllables, for thousands of years, through all the overthrows and deluges of calamities that have befallen the world, with the weakness of the means whereby it hath been preserved, and the interest, in some ages, of all those in whose power it was to have it corrupted, — as it was of the apostate churches of the Jews and Christians, — with the open opposition that hath been made unto it, doth not believe there is any such thing as divine providence at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reason of Faith; or, An Answer unto that Inquiry, “Wherefore we Believe the Scripture to be the Word of God;” with the Causes and Nature of that Faith wherewith we do so</cite>, (London, 1677) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), iv, 24.</span></figcaption>

<blockquote><p>We say that it is a superstition to esteem one day more holy than another, or to think that to abstain from labor is something which, in itself, pleases God (Rom 14:15, 6; Col 2:16,17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us no Judaistic ceremony or stupid superstition. This is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early Church (1 Cor 16:2; Acts 20:7; Rev 1:10).</p></blockquote>

</figure><figure class="quote" id="q-da8e06a952" data-kw="">
<blockquote><p>As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished, they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first, being almost, if not quite forgotten by those that use them, and are become but as civil customs that have no state in religious worship, experience shows, that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it; but to exasperate rulers and make opposites more violent in their way.</p></blockquote>

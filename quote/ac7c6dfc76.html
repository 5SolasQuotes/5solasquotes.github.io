<blockquote><p>8. Vocation uneffectual is common to pagans. Vocation thoroughly effectual is of the same extent as justification, and (I think) election. Vocation which is effectual only to bring men to an outward profession of saving faith is larger than election and makes men such whom we are bound to baptize.</p></blockquote>

<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>

paration&amp;text=8.%20All%20prophets%20are%20either%20ordinary%20or%20extraordinary&amp;text=a%20gift%20is%20a%20token%20of%20Gods%20separation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Neither can it be ground enough to plead for such decisions in preaching, that the thing they preach-for is truth, and the thing they condemn is error. Because: 1. It is not the lawfulness of the thing simply that is in question, but the necessity and expediency thereof in such a case: Now, many things are lawful that are not expedient, 1 Cor. 10:23. 2. In these differences that were in the primitive times concerning meats, days, genealogies, etc. there was a truth or an error upon one of the sides, as there is a right and a wrong in every contradiction of such a kind, yet the apostle thinks fitter, for the Church’s peace, that such be altogether refrained, rather than any way (at least in public) insisted upon or decided. 3. Because no minister can bring forth every truth at all times, he must then make choice; And I suppose some ministers may die, and all do so, who have not preached every truth, even which they knew, unto the people. Beside, there are (no question) many truths hid to the most learned. Neither can this be thought inconsistent with a minister’s fidelity, who is to reveal the whole counsel of God; because, that counsel is to be understood of things necessary to men’s salvation, and is not to be extended to all things whatsoever; for, we find the great apostle expounding this in that same sermon, Acts 20, verse 20, ‘I have keeped back nothing that was profitable unto you;’ which evidenceth that ‘the whole counsel of God,’ or the things which he showed unto them, is the whole, and all that was profitable for them, and that for no by-respect or fear whatsoever he shunned to reveal that unto them. [4.] Also, it is clear, that there are many truths which are not decided by any judicial act; and amongst other things, sparingness to decide truths that are not fundamental judicially has been ever thought no little mean[s] of the Church’s peace, as the contrary has been of division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, pp. 358-359</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-02839b324d" data-kw="">
<blockquote><p>It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 5, v. 4</span></figcaption>

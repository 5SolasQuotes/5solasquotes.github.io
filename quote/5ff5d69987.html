<blockquote><p>Obs. 1. That the Father is the person to whom reconciliation is made. Not but that it is made to the rest also. But,

First, Because he being the first person, the suit against us runs in his name especially, though it be the quarrel of all the rest of the persons, and the injury done against all the rest. Thus in colleges, and such common societies, their suits against others are commenced in some one’s name, as the master’s or the like, whose name is used for the whole; and so this common quarrel and suit of trespass, which the whole Trinity hath against us, is commenced in God the Father’s name for all the rest; and therefore Christ is said to be an ‘advocate with the Father,’ 1 John ii. 1, as the party betrusted to take the atonement, and make an end of the quarrel in the name of all the rest. And,

Secondly, Because as creation is attributed to the Father especially, so the covenant of works, the law, the covenant we were created under, being a covenant made especially with the Father in the name of the rest, therefore sin, which was the transgression of that covenant, is said to be, as it were, especially against him; for in the dispensation of that covenant he ruled immediately. And as the sins against the second covenant are said to be in a more especial manner against Christ and the Holy Ghost, so those against the first, which occasioned the performance of reconciliation, are said to be against the Father. Because therefore the transgressions of the first testament, as they are called, Heb. ix. 15, are especially said to be committed against him, therefore he takes upon him as the person especially aggrieved, and so the reconciliation is said to be made to him.

Thirdly, And further, because the other two persons have other distinct offices in the work of reconciliation. The Son he is to transact the part of a mediator, as the person by whom reconciliation is to be performed; and the Holy Ghost, he is to make report of that peace and atonement made, and shed abroad the love of both. Rom. v. 5, ‘And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost, which is given unto us.’ He speaks of God’s love in reconciling us: ver. 8, 9, 10, ‘But God commendeth his love towards us, in that, while we were yet sinners, Christ died for us. Much more then, being now justified by his blood, we shall be saved from wrath through him. For if, when we were enemies, we were reconciled to God by the death of his Son: much more, being reconciled, we shall be saved by his life.’ Therefore, the Father he bears (if any such part) the part of him that receives into favour, and to whom we are to be reconciled.

To illustrate this, we are in the same sense and respect said to be reconciled to the Father, in which we are taught especially to pray to the Father, ‘Our Father,’ &amp;c. For the Son and the Spirit do bear other parts in our prayers: the Son, he is the master of requests, the intercessor, in whose name therefore our prayers are to be made. The Holy Ghost, he is the inditer of our prayers, and helper of our infirmities; Rom. viii. 26, 27, ‘Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought; but the Spirit itself maketh intercession for us with groanings which cannot be uttered. And he that searcheth the hearts knoweth what is the mind of the Spirit, because he maketh intercession for the saints according to the will of God.’ Therefore the Father, he is expressed as the party we pray unto; and thus it is in like manner in the business of reconciliation. It is the Father to whom it is and was to be made, and therefore by him to be first promoted and set on work.</p></blockquote>

<blockquote><p>The unction and fragrance of the Spirit with which the Psalms are replete lead me to notice, before leaving this portion of our survey, that it is an utter misconception to represent the Old Testament religion as more fed by mundane hopes, than by the influence of the Holy Spirit.

It is to pervert the plainest evidence to affirm, as Cocceius and his school affirmed, that there was neither sonship nor the spirit of adoption in the Old Testament Church. That was to ignore the Abrahamic Covenant, and Christ’s divine presence with His Church, and merely to fix all attention upon the intermediate and transitory Sinai Covenant. But the Psalms to which we are adverting, when considered as the actual expression of praise for the Israelitish Church, as well as a legacy handed down to us in the Christian Church, sufficiently refute that view.

No book of a similar kind was prepared for the New Testament Church. The Holy Spirit, replenishing the sweet singers of Israel with spiritual truth and holy love, anticipated in this way much of the necessity that should be felt in Christian times. I am not here discussing the debated point as to the use of psalms in public worship.

My object is to show the spirituality of the Israelitish Church as evinced by its inspired and invaluable psalms. They describe the eternity and omnipresence, the majesty and condescension, the justice and mercy of God in a strain of the most fervid devotion. They sing of repentance and faith, of joy in God and delight in God’s law, with an ardour beyond which it is impossible to go. They depict Christ’s royal reign and His union with His Church; the anointing with the oil of gladness (Ps. 45.7); the receiving of gifts for men (Ps. 68.18); and the supreme dominion with which Christ was to be invested by the Father with a tenderness, unction, and joy, to which no other words are equal And those psalms which are called “new songs” anticipate the full millennial glory.

To reason back from effect to cause, the power and presence of the Spirit in ample fulness must have been graciously conferred to produce these psalms, and to use them fitly when prepared. We trace the power of God’s Spirit in turning the captivity of Israel, and in filling them with penitence. Not only so: the apostle, when adducing the quotation from the Psalms, “I believed, therefore have I spoken,” prefixes “We having the same spirit of faith — we also believe and therefore speak” (2 Cor 4.13; Ps. 116.10). The language of the apostle affirms the same faith and the possession of the same Spirit.

From this fact, and from the whole series of quotations made from them, it is evident that the experience of the Church was the same in both economies, though complexional varieties attached to each. But these varieties, as Calvin well remarks, describe the Church more in its corporate character than in the experience of the individual members. The true Church in the Old Testament, whatever might be the character of the nominal adherents, cannot be said to be unspiritual when we trace a faith and a knowledge of God, a fidelity and courage, an endurance and self-denial in all that great cloud of witnesses that fill us with astonishment, and leave us conscious that we are practically far behind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 25-27.</span></figcaption>

er">Share on X</a><a class="perma" href="../quote/a19e6d16fd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/09/george-smeaton-on-the-psalms-and-the-holy-spirit/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c3389cd81d" data-kw="">
<blockquote><p>Some copies read, the first tabernacle; but I suspect that there is a mistake as to the word “tabernacle;” nor do I doubt but that some unlearned reader, not finding a noun to the adjective, and in his ignorance applying to the tabernacle what had been said of the covenant, unwisely added the word tabernacle. I indeed greatly wonder that the mistake had so prevailed, that it is found in the Greek copies almost universally. But necessity constrains me to follow the ancient reading. For the Apostle, as I have said, had been speaking of the old covenant; he now comes to ceremonies, which were additions, as it were, to it. He then intimates that all the rites of the Mosaic Law were a part of the old covenant, and that they partook of the same ancientness, and were therefore to perish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 194-5.</span></figcaption>

</figure><figure class="quote" id="q-cb9bb6fc0d" data-kw="">
<blockquote><p>Although a thing may have its origin in Scripture, if it is to be indifferent, it is nevertheless required that there be no positive precept by which it is ordered, nor any negative one by which it is prohibited, but that it be left to us as something free, to use or not to use, as shall seem useful… Indifferent things must have a manifest and open usefulness, known in the Church, lest they may seem to be received for no purpose, or to be forced into the Church by treachery and deceit… power is given to edification and not to destruction (1 Cor. 14)… …the writings of the apostles and evangelists, which place before us most clearly the annulment of the rituals of Aaron, his ceremonies, priesthood, images, and peculiar figures, and the institution of the new and perfect priesthood of Christ. They must demonstrate to us from these books the grounds and occasion when some peculiar and special vestments should be worn in the ministry, for the adornment of the ministry itself, or for the preferring of its decorum, or for some distinctive mark, by which the minister can be distinguished from the people, as once was ordained by the Lord in the ministry of Aaron’s priesthood. But the statutes, canons and decrees of the apostles and evangelists make no mention of this matter… …What is prohibited by God can in no way be indifferent, as we have given warning above. For this is the doctrine of Paul in Gal. 2, that whatever re-establishes things that have been annulled in Christ, transgresses the will of God… Neither is it without its mystery that our Saviour Jesus Christ hung naked from the Cross. For Aaron’s priests used vestments in their own ministry because the reality of their priesthood, Christ Himself, had not yet come. But when Christ Himself was to be sacrificed, stripped of all clothing, displaying in this way his own priesthood, which since He was Reality itself, now had no further need of veils or semblances…</p></blockquote>

</figure><figure class="quote" id="q-ecc59b3148" data-kw="">
<blockquote><p>Neo. I pray you, sir, then proceed to the negative part, and tell us what the Lord forbiddeth in this [second] commandment.

Evan. Well then, I pray you understand, that in this commandment is forbidden, neglecting of prayer, as you may see, (Psa 14:4). And so also is absenting ourselves from the hearing of the word preached, or any other ordinance of God, when the Lord calls us thereunto, as you may see, (Luke 14:18-20). And so also is our rejecting the sacrament of baptism, as you may see, (Luke 7:30). And so also is our slighting the sacrament of the Lord’s Supper, as you may see, (2 Chron 30:10). And so also is the slighting and omitting any of the other forenamed duties, as you may see, (Psa 10:4, John 3:31, Isa 22:12-14). And so also is praying to saints and angels, as you may see, (Isa 63:16, Rev 19:10).

And so also is the making of images for religious uses, as you may see, (Lev 19:4). And so also is the representing God by an image, as you may see, (Exo 32:8,9). And so also are all carnal imaginations of God in his worship, as you may see, (Acts 17:29). And so also is all will worship, or the worshipping of God according to our own fancy, as you may see, (1 Sam 9:10,13, Col 2:23). And thus have I shown unto you both what the Lord requireth, and what he forbiddeth in this commandment, and now, neighbour Nomologista, I pray you, tell me whether you keep it perfectly or no?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 406.</span></figcaption>

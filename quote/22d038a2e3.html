<main class="wrap"><figure class="quote" id="q-22d038a2e3" data-kw="">
<blockquote><p>Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.”

— Gisbertus Voetius, Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProblem%3A+Whether+the+Lord%E2%80%99s+Supper+can+be+said+directly+and+proximately+to+seal+the+grace+of+regeneration%3F+Response%3A+It+seals+the+continuation+and+excitation+of+it%2C+or+of+its+terminus%2C+namely%2C+faith+%28as+it+is+an+organ%29+primarily%2C+and+new+obedience+secondarily.+But+the+grace+of+regeneration+which+is+the+cause+of+faith+it+designates+consequently+and+mediately%2C+as+something+presupposed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22d038a2e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/22d038a2e3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=Problem%3A%20Whether%20the%20Lord%E2%80%99s%20Supper%20can,consequently%20and%20mediately%2C%20as%20something%20presupposed&amp;text=Problem%3A%20Whether%20the%20Lord%E2%80%99s%20Supper%20can%20be%20said&amp;text=it%20designates%20consequently%20and%20mediately%2C%20as%20something%20presupposed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f16619e0cb" data-kw="">
<blockquote><p>There are commandments which may be called the least, and there are others which may be called the greatest, In ordine motum [in the order of the motion], the order shows the weight. The fundamental article of the Covenant is to have God for our God, and to prefer natural worship before instituted: the means stated, before manner and time [of them]; God before man; parents before others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preference of Duties</cite>, vol. 2, Several Discourses Tending to Promote Peace and Holiness, pp. 6-22, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“There are commandments which may be called the least, and there are others which may be called the greatest, In ordine motum [in the order of the motion], the order shows the weight. The fundamental article of the Covenant is to have God for our God, and to prefer natural worship before instituted: the means stated, before manner and time [of them]; God before man; parents before others.”

</figure><figure class="quote" id="q-8186843c7c" data-kw="">
<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs.

4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, p. 3</span></figcaption>

</figure><figure class="quote" id="q-99adeb18a1" data-kw="">
<blockquote><p>4. As regards the outward administration of the Supper it can only be dispensed by an orderly occupant of the preaching office, in company with whom, chiefly for distributing the cup, there may also be other servants of the Church, elders and deacons, at his side to help him. Polan (VI, 56): ‘Ministers of the Church, and these include pastors, and presbyters or elders (seniores) added to the pastors for the government of the Church and deacons lawfully called, ought to preside at the administration of the Eucharist, no others. If the pastors alone can carry through the administration, as in small gatherings, then the help of others is not required, as Tertullian writes (De corona 3): ‘We do not take the sacrament of the Eucharist from the hands of others than those presiding.’ But if the gatherings are large and the pastors are not sufficient to perform the administration of the Supper alone, they may co-opt elders and deacons to help them, especially in the distribution of the cup.’ Heidegger (XXV, 73): ‘The first to administer was the same as he who instituted it; those who followed them, the pastors and the rulers of the Church (rectores) did and do administer it. No more than baptism or the preaching of God’s Word can it be administered by private persons or by any private person at a banquet.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Bizer &amp; trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 26, p. 629</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

edbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/#:~:text=4.%20As%20regards%20the%20outward%20administration,any%20private%20person%20at%20a%20banquet&amp;text=4.%20As%20regards%20the%20outward%20administration%20of%20the&amp;text=or%20by%20any%20private%20person%20at%20a%20banquet" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-d8a27410cf" data-kw="">
<blockquote><p>III. Ministers are fishers by office; they are catchers of the souls of men, sent “to open the eyes of the blind, and to turn them from darkness to light, and from the power of Satan unto God,” Acts 26:18. Preachers of the gospel are fishers; and their work, and that of fishers, agree in several things.

      1. The design and work of fishers is to catch fish. This is the work that preachers of the gospel have taken in hand, even to endeavour to bring souls to Christ. Their design in their work should be the same. Tell me, O my soul, what is thy design in preaching? for what end dost thou lay the net in the water? is it to shew thy gifts, and to gain the applause of men? Oh! no. Lord, thou knowest my gifts are very small; and had I not some other thing than them to lean to, I had never gone to a pulpit. I confess, that, for as small as they are, the devil and my corruptions do sometimes present them to me in a magnifying glass, and so would blow me up with wind. But, Lord, thou knowest it is my work to repel these motions. An instance of this see in my Diary, Jan. 1. 1699. But of this see afterwards.

      2. Their work is hard work; they are exposed to much cold in the water. So is the minister’s work.

      3. A storm that will affright others, they will venture on, that they may not lose their fish. So should preachers of the gospel do.

      4. Fishers catch fish with a net. So preachers have a net to catch souls with. This is the everlasting gospel, the word of peace and reconciliation, wherewith sinners are caught. It is compared to a net wherewith fishers catch fish….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: A Soliloquy on the Art of Man-Fishing</cite>, ed. Samuel M‘Millan, vol. 5 (Aberdeen: George and Robert King, 1849), 10–11.</span></figcaption>

</figure><figure class="quote" id="q-dc34bb94f0" data-kw="">
<blockquote><p>But whether every truth be fundamental or necessary: ‘Discipline’ (you say) ‘is so’: [it is] indeed necessary to the well-being of a church, no more: it may be true without it, [though] not perfect. Christ compares his spouse to an army with banners: as order is to an army, so is discipline to the Church: if the troops be not well marshalled in their several ranks, and move not forward, according to the discipline of war, it is an army still: confusion may hinder their sucess, it cannot bereave them of their name: it is as beautiful proportion to the body, an hedge to a vineyard, a wall to a city, an hem to a garment, ceiling to an house. It may be a body, vineyard, city, garment, house, without them: it cannot be well and perfect. Yet which of our adversaries will say we have no discipline? Some they grant, but not the right: as if they said, Your city has a brick wall indeed, but it should have one of hewn stone; your vineyard is hedged, but it should be paled and ditched: while they cavil at what we want, we thank God for what we have; and so much we have, in spite of all detraction, as makes us both a true Church and a worthy one.</p></blockquote>

<blockquote><p>5. Whereas ye [David Dickson and Alexander Henderson] alledge, that if some members of this Kirk had not cared more kindly in this time of common danger than others have done, the whole body had been ere now dangerously, if not desperately, diseased. We answer that we most heartily wish, any disease of this Church, to be timeously prevented and cured. But withal we wish this to bee done without a rupture, and such a dangerous division: chiefly seeing our Church is not infected with any such errors, nor is in such dangers as may give just occasion of so fearful a division: which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius Bishop of Alexandria, in his Epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9a269bb602" data-kw="">
<blockquote><p>We say that matrimony is holy and honourable in all sorts and states of persons, in the patriarchs, in the Prophets, in the Apostles, in holy martyrs, in the ministers of the Church, and in bishops; and that it is an honest and lawful thing (as Chrysostom saith) for a man, living in matrimony, to take upon him therewith the dignity of a bishop. And as Sozomenus saith of Spiridion; and as Nazianzen saith of his own father, that a good and diligent bishop doth serve in the ministry never the worse for that he is married, but rather the better, and with more ableness to do good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33a31624e7" data-kw="">
<blockquote><p>The ancient emperor Justinian commanded that, in the holy administration, all things should be pronounced with a clear, loud, and treatable voice, that the people might receive some fruit thereby. These men, lest the people should understand them, mumble up all their service, not only with a drowned and hollow voice, but also in a strange and barbarous tongue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 5</span></figcaption>

</figure><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>

</figure><figure class="quote" id="q-1710e393eb" data-kw="">
<blockquote><p>The old Council Gangrense commandeth that none should make such difference between an unmarried priest and a married priest, as he ought to think the one more holy than the other for single life&#x27;s sake. These men put such a difference between them, that they straightway think all their holy service to be defiled if it be done by a good and honest man that hath a wife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/celibacy.html">Celibacy</a></span></div>

— John Jewel, An Apology of the Church of England, Part 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20old%20Council%20Gangrense%20commandeth%20that%20none%20should%20make%20such%20difference%20between%20an%20unmarried%20priest%20and%20a%20married%20priest%2C%20as%20he%20ought%20to%20think%20the%20one%20more%20holy%20than%20the%20other%20for%20single%20life%27s%20sake.%20These%20men%20put%20such%20a%20difference%20between%20them%2C%20that%20they%20straightway%20think%20all%20their%20holy%20service%20to%20be%20defiled%20if%20it%20be%20done%20by%20a%20good%20and%20honest%20man%20that%20hath%20a%20wife.%E2%80%9D%0A%0A%E2%80%94%20John%20Jewel%2C%20An%20Apology%20of%20the%20Church%20of%20England%2C%20Part%205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1710e393eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1710e393eb.html">Permalink</a><a class="src" href="https://anglicanhistory.org/jewel/apology/" rel="noopener" target="_blank">Read it online · Project Canterbury</a></div>
</figure><figure class="quote" id="q-4d7398975f" data-kw="celibacy">
<blockquote><p>What are thrust forward as evangelical counsels are either commanded in the word (such as the love of enemies [Mt. 5:44; Rom. 12:20]; the suffering of injuries [Mt. 5:39]; chastity or even celibacy, if the gift of continence is possessed and it is required for any reason [1 Cor. 9:5]; voluntary poverty for the sake of Christ and the gospel [Lk. 14:33; Mt. 16:24]); or they have been invented by men without the authority of the word and rest upon no other ground than that of voluntary worship (as regular obedience, which is repugnant to the liberty in which Christ has established us [Gal. 5:1] and according to which we ought no longer to be made the servants of men [1 Cor. 7:23]; perpetual continence, because Christ testifies that this is not a gift belonging to every one [Mt. 19:11] and by the apostle he commands, “If they cannot contain, let them marry: for it is better to marry than to burn” [1 Cor. 7:9]; voluntary poverty, such as is recommended by the papists, because no one without a special call or necessity ought to throw away his resources [Mt. 19:21, 27], lest he tempt God [Mt. 4:7] or be compelled to neglect charity towards his neighbor [Eph. 4:28]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/celibacy.html">Celibacy</a></span></div>

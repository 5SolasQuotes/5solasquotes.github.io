<main class="wrap"><figure class="quote" id="q-238d37b732" data-kw="">
<blockquote><p>&quot;Faith had in the Sacraments,&quot; saith Augustine, &quot;doth justify, and not the Sacraments.&quot; And Origen saith, &quot;Christ is the Priest, the Propitiation, and Sacrifice: which Propitiation cometh to every one by means of faith.&quot; So that by this reckoning, we say that the Sacraments of Christ without faith do not once profit these that be alive; a great deal less do they profit those that be dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/prayers-for-the-dead.html">Prayers for the dead</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/ex-opere-operato.html">Ex opere operato</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c12a764638" data-kw="">
<blockquote><p>As for their brags they are wont to make of their purgatory, though we know it is not a thing so very late risen amongst them, yet is it no better than a blockish and an old wives&#x27; device. Augustine, indeed, sometime saith, there is such a certain place: sometime he denieth not, but there may be such a one; sometime he doubteth; sometime again he utterly denieth it to be, and thinketh that men are therein deceived by a certain natural good will they bear their friends departed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/purgatory.html">Purgatory</a></span></div>

</figure><figure class="quote" id="q-742f1437f8" data-kw="prayers for the dead">
<blockquote><p>Indeed it has been found by experience that from insignificant beginnings wonderful progress was made in superstition and idolatry in the the papacy as to the worship of images, invocation of saints, purgatory, the sacrifice of the mass, prayers for the dead, etc. Thus it seems better to lack some useful good (but less necessary), than from the use of it to incur the imminent danger of any great evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-91c4cd3b52" data-kw="">
<blockquote><p>As this whole business of purgatory is a groundless fable, an invention set up in competition with and opposition unto the sanctification of the Spirit and cleansing virtue of the blood of Christ, as a matter of unspeakably more profit and secular advantage unto those who have its management committed unto them; so it is as great an encouragement unto unholiness and a continuance in sin for those who believe it, and at the same time love the pleasures of sin (which are the generality of their church), as ever was or can be found out or made use of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pneumatologia</cite>, Book 4, ch. 4 (Works, ed. Goold)</span></figcaption>

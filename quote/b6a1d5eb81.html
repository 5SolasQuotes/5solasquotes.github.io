<main class="wrap"><figure class="quote" id="q-b6a1d5eb81" data-kw="">
<blockquote><p>He is well no schismatic, though [he be] in [a] schism, that is willing to join in communion with the true Church, when it appears to be so to him, as he is no heretic, though he holds heretical opinions, who holds them not obstinately, that is (I suppose) with desire to be informed if he be in the wrong. My Lord Falkland’s Discourse of Infallibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 6, ch. 1, p. 453</span></figcaption>

<blockquote><p>The learned and renowned [reformed] professors of Leiden answer [that] the end of synods is not by any means, good or bad, to remove controversies, but to bury them by the power of the Word. 2. Only external peace separated from truth should not be intended [by synods regarding controversies], but [external peace should be] conjoined with truth and peace of conscience.</p></blockquote>

</figure><figure class="quote" id="q-06dba7071a" data-kw="">
<blockquote><p>5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principal Duty of Parliament-Men, or, A Short &amp; Compendious Treatise Concerning the Unity &amp; Unanimity which Should be in the Members of that Honourable Assembly</cite>, (London, 1641), p. 46. Ward, a civil officer, was speaking to the English parliament.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

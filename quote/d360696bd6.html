<main class="wrap"><figure class="quote" id="q-d360696bd6" data-kw="foreseen perseverance mutable election">
<blockquote><p>The Arminians (in order to defend the apostasy of saints) uphold the mutability of election. Thus they make it twofold: one incomplete and not decisive (of those who will believe), which can be revoked and made void by the inconstancy of men who can fall from faith; the other, however, complete and decisive (of those persevering and dying in faith), which is immutable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.12.2</span></figcaption>

<blockquote><p>And assuredly, if this were said because God foreknew that they would believe, not because He Himself would make them believers, the Son is speaking against such a foreknowledge as that when He says, &quot;Ye have not chosen me, but I have chosen you;&quot; when God should rather have foreknown this very thing, that they themselves would have chosen Him, so that they might deserve to be chosen by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Predestination of the Saints</cite>, ch. 17</span></figcaption>

</figure><figure class="quote" id="q-0e430d2cf9" data-kw="conditional thing not decree">
<blockquote><p>It is one thing for the thing decreed to be conditional; another for the decree itself. The former we grant, but not the latter. There can be granted an antecedent cause or condition of the thing willed, but not immediately of the volition itself. Thus God wills salvation to have the annexed condition of faith and repentance in the execution, but faith and repentance are not the condition or cause of the act of willing in God, nor of the decree to save in the intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.9</span></figcaption>

</figure><figure class="quote" id="q-2e6a031b5d" data-kw="eternal immutable unconditional decree">
<blockquote><p>Every decree of God is eternal; therefore it cannot depend upon a condition which takes place only in time. (2) God’s decrees depend on his good pleasure (eudokia) (Mt. 11:26; Eph. 1:5; Rom. 9:11). Therefore they are not suspended upon any condition outside of God. (3) Every decree of God is immutable (Is. 46:10; Rom. 9:11). Now a conditional decree is mutable because every condition is mutable.</p></blockquote>

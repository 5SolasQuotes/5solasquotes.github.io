<main class="wrap"><figure class="quote" id="q-5b81334c43" data-kw="">
<blockquote><p>But after the flood, on Noah’s offering a sacrifice that represented the sacrifice of Christ, God, in smelling a sweet savour, or accepting that sacrifice, as it was a representation of the true sacrifice of Christ, which is a sweet savour indeed to God, he gives Noah a new grant of the earth, founded on that sacrifice of Christ, of that covenant of grace which is by that sacrifice of Christ, with a promise annexed, that now the earth should no more be destroyed, till the consummation of all things; as you may see in Gen. viii. 20.21.22. and chapter ix. 1.2.3.7. The reason why such a promise, that God would no more destroy the earth, was added to this grant made to Noah, and not to that made to Adam, was because this was founded on the covenant of grace, of which Christ was the surety, and therefore could not be broken.

Therefore it comes to pass now, that though the wickedness of man has dreadfully raged, and the earth been filled with violence and wickedness thousands of times, and one age after another, and much more dreadful and aggravated wickedness than the world was full of before the flood, being against so much greater light and mercy; especially in these days of the gospel: yet God’s patience holds out; God does not destroy the earth; his mercy and forbearance abides according to his promise; and his grant established with Noah and his sons abides firm and good, being founded on the covenant of grace.

IV. On this God renews with Noah and his sons the covenant of grace, Gen. ix.9.10. “And I, behold, I establish my covenant with you, and with your seed after you, and with every living creature that is with you,” &amp;c.; which was the covenant of grace; which even the brute creation have this benefit of, that is shall never be destroyed again till the consummation of all things. When we have this expression in scripture, my covenant, it commonly is to be understood of the covenant of grace. The manner of expression, “I will establish my covenant with you, and with your seed after you,” shews plainly, that it was a covenant already in being, that had been made already, and that Noah would understand what covenant it was by that denomination, viz. the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), pp 37-38.</span></figcaption>

<blockquote><p>Is it not a point worth our learning to know the constancy of God’s love, with whom we are in a gracious covenant? And then again, we learn much wisdom how to manage our life hereby, even in the intercourse of our changes, to be now rich, now poor, now high, now low in estate. Wisdom is gotten by experience in variety of estates. He that is carried on in one condition, ho hath no wisdom to judge of another’s estate, or to carry himself to a Christian in another condition, because he was never abased himself. He looks very big at him. He knows not how to tender another, that hath not been in another’s condition. And therefore to furnish us, that we may carry our selves as Christians, meekly, lovingly, and tenderly to others, God will have us go to heaven in variety, not in one uniform condition in regard of outward things.

Use. Learn hence not to quarrel with God’s government; for though he alters our conditions, yet he never alters his love. A Christian is unmoveable in regard of the favour of God to him, and in regard of sanctifying grace. …

[W]e must learn the doctrine of the covenant of grace, that God in Christ is become a Father to us, and carries a fatherly mind to us. In what condition soever we are, he is a father still, and intends us well, and will provide for us in the hardest condition. Having took the relation of a father upon him, do you think that he will fail in the carriage of a father towards us? He is pitiful to us, he respects us in the basest condition. He that knows God to be his father, cast him into what condition you will, knows he hath a good portion. …

What a blessed thing is it to be in the covenant of grace, to have God to be our father, to be in Christ, that let our condition outwardly be what it will be, we shall have grace to carry ourselves in it, God will go along with us by his Holy Spirit!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Contentment</cite>, (London, 1637) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), 5: 179, 180, 181.</span></figcaption>

</figure><figure class="quote" id="q-9b6ce3afc7" data-kw="">
<blockquote><p>The covenants of a church are her glory; God’s covenant of grace and promise, and their covenants of duty and gratitude, Rom. ix. 4, it is said of the Old Testament church “To them belonged the adoption, the glory, and the covenants.” God’s covenant of grace and promise is the glory of a church. It was the misery of the poor Gentiles under the Old Testament, before the coming of Christ, that they were “strangers to the covenants of promise.” This is the church’s charter for all her immunities and privileges, visible or invisible, for the life that now is, and that which is to come: and it is “an everlasting covenant, well ordered in all things and sure:” and him that takes hold of this covenant, “even him will God bring to his holy mountain, and make joyful in his house of prayer,” Is. Ivi.

Now, this covenant hangs upon Christ, the nail fastened in a sure place; for God has “given him for a covenant unto the people;” it was made with him as a second Adam, and with his seed in him; he has fulfilled the condition of it, by the holiness of his nature, the obedience of his life, and the satisfaction made by his death; his fulfilling the commands and demands of the broken covenant of works, is the very condition of the covenant of grace, and by virtue of his doing so the cry comes out. Is. Iv. 1, “Ho, every one that thirsteth, come ye to the waters; he that hath no money, let him come; come, buy wine and milk without money, and without price.” The covenant, and all the blessings and promises of it, hang upon this blessed nail; they are all in him, and “in him yea and amen.”

Again, our covenants for duty, obedience, and gratitude, they hang upon this blessed nail. These are the glory of a church and land, as they were unto the church of Israel. God avouched them to be his peculiar people, and they avouched him, by solemn covenant, to be their God; on which account they are called Hephzibah, and Beulah; a people married to the Lord. This was the glory of this land, and of the three nations, though perfidiously broken, burnt, and buried. Blessed be God there is some small degree of a resurrection of these solemn covenants, by what has been lately transacted in this place.

But now, I say the glory of all our covenants, and engagements into personal or public reformation and obedience, must needs hang upon this nail fastened in a sure place. When men engage to duty in a legal way, in the strength of their own covenants, vows, promises, and resolutions, without fastening faith’s gripes upon the nail in a sure place, for righteousness and strength, they do only make to themselves ropes of sand, that will fall asunder as fast as they can make them. Christ only is “the strength of Israel;” all our funds of grace lie in him, “in whom it has pleased the Father that all fulness should dwell.”

And whatever duty we engage to should be in the strength of promised grace for assistance, and in the faith of his righteousness and intercession for acceptance: Is. xlv. 24, “Surely, shall one say, In the Lord have I righteousness and strength. I will go (says David) in the strength of the Lord God: I will make mention of thy righteousness, even of thine only.” And it is in this way that his commandments are not grievous, his yoke easy, and his burden light.</p></blockquote>

— Ebenezer Erskine, Christ considered as the nail fastened in a sure place, bearing all the glory of his Father s house. A sermon preached at Stirling, December 28, 1743, immediately before the renovation of our solemn covenants, by the ministers of the Associate Presbytery. And some other sermons preached afterwards u">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+covenants+of+a+church+are+her+glory%3B+God%E2%80%99s+covenant+of+grace+and+promise%2C+and+their+covenants+of+duty+and+gratitude%2C+Rom.+ix.+4%2C+it+is+said+of+the+Old+Testament+church+%E2%80%9CTo+them+belonged+the+adoption%2C+the+glory%2C+and+the+covenants.%E2%80%9D+God%E2%80%99s+covenant+of+grace+and+promise+is+the+glory+of+a+church.+It+was+the+misery+of+the+poor+Gentiles+under+the+Old+Testament%2C+before+the+coming+of+Christ%2C+that+they+were+%E2%80%9Cstrangers+to+the+covenants+of+promise.%E2%80%9D+This+is+the+church%E2%80%99s+charter+for+all+her+immunities+and+privileges%2C+visible+or+invisible%2C+for+the+life+that+now+is%2C+and+that+which+is+to+come%3A+and+it+is+%E2%80%9Can+everlasting+covenant%2C+well+ordered+in+all+things+and+sure%3A%E2%80%9D+and+him+that+takes+hold+of+this+covenant%2C+%E2%80%9Ceven+him+will+God+bring+to+his+holy+mountain%2C+and+make+joyful+in+his+house+of+prayer%2C%E2%80%9D+Is.+Ivi.%0A%0ANow%2C+this+covenant+hangs+upon+Christ%2C+the+nail+fastened+in+a+sure+place%3B+for+God+has+%E2%80%9Cgiven+him+for+a+covenant+unto+the+people%3B%E2%80%9D+it+was+made+with+him+as+a+second+Adam%2C+and+with+his+seed+in+him%3B+he+has+fulfilled+the+condition+of+it%2C+by+the+holiness+of+his+nature%2C+the+obedience+of+his+life%2C+and+the+satisfaction+made+by+his+death%3B+his+fulfilling+the+commands+and+demands+of+the+broken+covenant+of+works%2C+is+the+very+condition+of+the+covenant+of+grace%2C+and+by+virtue+of+his+doing+so+the+cry+comes+out.+Is.+Iv.+1%2C+%E2%80%9CHo%2C+every+one+that+thirsteth%2C+come+ye+to+the+waters%3B+he+that+hath+no+money%2C+let+him+come%3B+come%2C+buy+wine+and+milk+without+money%2C+and+without+price.%E2%80%9D+The+covenant%2C+and+all+the+blessings+and+promises+of+it%2C+hang+upon+this+blessed+nail%3B+they+are+all+in+him%2C+and+%E2%80%9Cin+him+yea+and+amen.%E2%80%9D%0A%0AAgain%2C+our+covenants+for+duty%2C+obedience%2C+and+gratitude%2C+they+hang+upon+this+blessed+nail.+These+are+the+glory+of+a+church+and+land%2C+as+they+were+unto+the+church+of+Israel.+God+avouched+them+to+be+his+peculiar+people%2C+and+they+avouched+him%2C+by+solemn+covenant%2C+to+be+their+God%3B+on+which+account+they+are+called+Hephzibah%2C+and+Beulah%3B+a+people+married+to+the+Lord.+This+was+the+glory+of+this+land%2C+and+of+the+three+nations%2C+though+perfidiously+broken%2C+burnt%2C+and+buried.+Blessed+be+God+there+is+some+small+degree+of+a+resurrection+of+these+solemn+covenants%2C+by+what+has+been+lately+transacted+in+this+place.%0A%0ABut+now%2C+I+say+the+glory+of+all+our+covenants%2C+and+engagements+into+personal+or+public+reformation+and+obedience%2C+must+needs+hang+upon+this+nail+fastened+in+a+sure+place.+When+men+engage+to+duty+in+a+legal+way%2C+in+the+strength+of+their+own+covenants%2C+vows%2C+promises%2C+and+resolutions%2C+without+fastening+faith%E2%80%99s+gripes+upon+the+nail+in+a+sure+place%2C+for+righteousness+and+strength%2C+they+do+only+make+to+themselves+ropes+of+sand%2C+that+will+fall+asunder+as+fast+as+they+can+make+them.+Christ+only+is+%E2%80%9Cthe+strength+of+Israel%3B%E2%80%9D+all+our+funds+of+grace+lie+in+him%2C+%E2%80%9Cin+whom+it+has+pleased+the+Father+that+all+fulness+should+dwell.%E2%80%9D%0A%0AAnd+whatever+duty+we+engage+to+should+be+in+the+strength+of+promised+grace+for+assistance%2C+and+in+the+faith+of+his+righteousness+and+intercession+for+acceptance%3A+Is.+xlv.+24%2C+%E2%80%9CSurely%2C+shall+one+say%2C+In+the+Lord+have+I+righteousness+and+strength.+I+will+go+%28says+David%29+in+the+strength+of+the+Lord+God%3A+I+will+make+mention+of+thy+righteousness%2C+even+of+thine+only.%E2%80%9D+And+it+is+in+this+way+that+his+commandments+are+not+grievous%2C+his+yoke+easy%2C+and+his+burden+light.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+Christ+considered+as+the+nail+fastened+in+a+sure+place%2C+bearing+all+the+glory+of+his+Father+s+house.+A+sermon+preached+at+Stirling%2C+December+28%2C+1743%2C+immediately+before+the+renovation+of+our+solemn+covenants%2C+by+the+ministers+of+the+Associate+Presbytery.+And+some+other+sermons+preached+afterwards+u&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b6ce3afc7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b6ce3afc7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/30/ebenezer-erskine-on-the-covenant-of-grace-and-the-covenants-of-duty/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-29e7141547" data-kw="">
<blockquote><p>Does it not seem that the condition of the Gospel Covenant is violated of many as truly as of the Legal Covenant? It is as truly violated by many; but it is not violated by as many. For the condition of the Legal Covenant is violated of all; Yea it is impossible to be kept, even to the penitent; But the condition of the Gospel Covenant is otherwise, etc. There was therefore need of a New Covenant, unless mankind should perish, etc. Certainly no man is saved but by a Covenant kept; therefore the Covenant by which men are saved, is not the same with that by which no man is saved, it being kept by no man.</p></blockquote>

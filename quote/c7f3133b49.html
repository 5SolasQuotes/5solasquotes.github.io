<blockquote><p>In several sorts of controversies and cases you must prefer several sorts of guides or judges: It is a grand pernicious error to think that the same men’s judgments must be most followed in every case. And it is of grand importance to know how to value and vary our guides, as the cases vary. And for the most part every man is more to be regarded in his own way of study and profession than wiser men in other matters of other studies and professions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 42, ‘Your belief of the necessary articles of faith, must be made your own, and not taken merely upon the authority of any: And in all points of belief or practice which are of necessity to salvation, you must ever keep company with the universal Church: for it were not the Church if it erred in these: And in matters of peace and concord the greater part must be your guide; In matters of human obedience, your governors must be your guides: And in matters of high and difficult speculation, the judgment of one man of extraordinary understanding and clearness is to be preferred before both the rulers and the major vote’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 216-18</cite>, p. 216</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>1. Tell them that you love them, aren’t ashamed of them, and that this is something that you have had to overcome. Tell them they can do the same. 2. Tell them that porn is bad for them spiritually, physically, and relationally. And then explain how. 3. Tell them that you are going to set up ‘speed bumps’ to help them when they’re tempted but it comes down to their desire to live with integrity. Those speed bumps are: a. Filters (on devices &amp; internet protocol) b. Screens only in shared spaces c. Weekly check-ups: ‘Have you looked at porn of any form this week?’ 4. Ask them to identify the a) the times that are most tempted and b) the things that seem to trigger the desire to look at porn. 5. Show them ways to deal with stress that are productive: bible reading, prayer, running, pushups, developing a skill, etc. 6. Remind them again that you love them, porn makes you weak, and living a lie is hell. Let them know that you won’t look down on them if they stumble and they need to let you know so you can conquer together.</p></blockquote>

<blockquote><p>III. With these words [Col. 1:12-13], our eternal salvation is ascribed to the heavenly Father with due thanksgiving… IV. Now, following the footsteps of the Apostle, we will first discuss thanksgiving, and then its arguments. Thanksgiving to God is the worship of God when we give Him proper praise for His benefits. V. This thanksgiving is rendered to God in three ways: in thought, in words, and in deeds. VI. In thought, when we truly acknowledge that whatever good we are and have, we owe it all to God the Father, through and on account of Christ, by the efficacy of the Holy Spirit, according to the gracious will and eternal benevolence of the Father, Son, and Holy Spirit towards us. Furthermore, we have perpetual gratitude in our hearts towards God. VII. This thanksgiving, which pertains to thought, holds the first place in order and dignity, without which the other expressions of gratitude are not pleasing and acceptable to God. VIII. In words, when we privately or publicly commemorate the benefits of God, from which they have come forth, through preaching His goodness. IX. In deeds, when, to testify our gratitude to God, we offer ourselves and our material and spiritual possessions to Him, willingly devoting them for His glory and the use of the saints. X. The arguments for thanksgiving are derived both from the cause that impels God to bestow benefits upon us and from the benefits themselves as effects of God.</p></blockquote>

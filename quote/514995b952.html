<blockquote><p>We believe that the word, contained in these books, came from one God; of whom alone, and not of men, the authority thereof dependeth. … it is not lawful to oppose either antiquity, custom, multitude, man&#x27;s wisdom and judgment, or edicts, or any decrees, or councils, or visions, or miracles, unto this holy Scripture; but rather that all things ought to be examined and tried by the rule and square thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed-churches.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The French Confession</cite>, 1559, Art. 5</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We believe that the word, contained in these books, came from one God; of whom alone, and not of men, the authority thereof dependeth. … it is not lawful to oppose either antiquity, custom, multitude, man&#x27;s wisdom and judgment, or edicts, or any decrees, or councils, or visions, or miracles, unto this holy Scripture; but rather that all things ought to be examined and tried by the rule and square thereof.”

</figure><figure class="quote" id="q-265ad77090" data-kw="">

</figure><figure class="quote" id="q-4dfcdd8bf1" data-kw="">
<blockquote><p>Therefore Divine Faith cannot be reduced or resolved into the authority of the Church, or into other simple external arguments which are wont to be called Motives by persuading and inducing things preparing to Faith; but it is to be resolved into the Scripture it self, and that authority which it hath imprinted upon it from the author God, as into the first and proper cause which causeth the thing to be believed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore Divine Faith cannot be reduced or resolved into the authority of the Church, or into other simple external arguments which are wont to be called Motives by persuading and inducing things preparing to Faith; but it is to be resolved into the Scripture it self, and that authority which it hath imprinted upon it from the author God, as into the first and proper cause which causeth the thing to be believed.”

</figure><figure class="quote" id="q-3e453359e8" data-kw="">
<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

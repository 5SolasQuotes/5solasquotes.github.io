<main class="wrap"><figure class="quote" id="q-e7069eb1a8" data-kw="">
<blockquote><p>The person of the Word subsists in two natures: in one, from which he has first esse, and in another (as it were adventitious) from which he has second esse, just as if Socrates were said in some way to subsist in humanity and whiteness. But… it is not generally held that the person of Christ is composed, speaking properly of composition, that is, from act and potency (as from matter and form), or from two potentialities (such as are those things which are called by Aristotle elements that integrate a whole nature). Therefore the authoritative texts of Damascene, which speak of the person as composed, should be expounded by saying that both divine and human natures are as truly there as if they were to compose a person, but without confusion, so that there is no third thing from them, since they do not make a composition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as trans. Richard Cross, Union &amp; Communion | p. 14, from Ord. III, d. 6, q. 1, n. 26</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41015c7b52" data-kw="">
<blockquote><p>It is diverse and another thing, not to have beginning, and to subsist by a beginning: to die, and not to be able to suffer: yet, as they are both proper unto Christ, so are they both common, not unto him, but in Him. For if we say, common unto Him: we must needs be urged and driven, to give and show some other, with whom the same should be common unto Him: which necessity of instance, cannot but incline to the impious opinion of Nestorius. We therefore better and more catholically say, it is common in Him and not to Him: and so we say better, it is proper to Him, and not in Him. Therefore it is proper to Him to die, by the nature of his flesh, which is mortal: and it is proper to Him, not to die, by the nature of the Word, which cannot die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (Cambridge, 1599) | ‘An Appendix to the Eleventh chapter, ‘Of Christ the Redeemer, or of the Person of Christ”, p. 354</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-335170807d" data-kw="">
<blockquote><p>Reply to Objection 3: …Yet we must bear in mind that not every individual in the genus of substance, even in rational nature, is a person, but that alone which exists by itself, and not that which exists in some more perfect thing. Hence the hand of Socrates, although it is a kind of individual, is not a person, because it does not exist by itself, but in something more perfect, viz. in the whole [of Socates, who has a suppositum]. And hence, too, this is signified by a ‘person’ being defined as ‘an individual substance,’ for the hand is not a complete substance, but part of a substance. Therefore, although this human nature is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 2, ‘Whether the union of the Incarnate Word took place in the Person?’</span></figcaption>

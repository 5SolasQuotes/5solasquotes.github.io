<main class="wrap"><figure class="quote" id="q-4d2bdbf2b2" data-kw="">
<blockquote><p>This perseverance of the saints depends not upon their own free will, but upon the immutability of the decree of election, flowing from the free and unchangeable love of God the Father, upon the efficacy of the merit and intercession of Jesus Christ and union with him, the oath of God, the abiding of his Spirit, and the seed of God within them, and the nature of the covenant of grace; from all which ariseth also the certainty and infallibility thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 17.2</span></figcaption>

</figure><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-075d4894b3" data-kw="unbelief">
<blockquote><p>Hence it is evident that the beginning of sin is better referred to unbelief than to pride, although in it both are joined. There ought to be the same order in the sin that was in the temptation. Now in the temptation man was first solicited to unbelief before pride. For by his interrogation, the tempter first urges him to doubt the word of God (Gen. 3:1), then to deny it (“Ye shall not surely die,” v. 4) before he incites to pride by the promise of divinity. Pride could not have place in man except on the positing of unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.6.6-7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 15</span></figcaption>

</figure><figure class="quote" id="q-561ca6a8d8" data-kw="Author of sin The Fall Satan Temptation">
<blockquote><p>Not unto God; he is not the author of sin, nor tempts unto it; nor is he tempted by it: nor to Satan, only as an instrument, enticing and deceiving; but to themselves, to their own will, it was their own act and deed.</p></blockquote>

</figure><figure class="quote" id="q-d7672683ee" data-kw="eve unbelief">
<blockquote><p>But unbelief could not have place in man, unless first by thoughtlessness he had ceased from a consideration of God’s prohibition and of his truth and goodness. If he had always seriously directed his mind to it (especially in the moment of temptation), he could never have been moved from his faith and listened to the tempter. Hence, therefore, unbelief or distrust flowed first. By this man did not have the faith in the word of God which he was bound to have; then incredulity by which he believed the Devil rather than God; then ambition of a false excellence; then a desire of the forbidden fruit and finally an eating of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.6.9</span></figcaption>

</figure><figure class="quote" id="q-360e80a51b" data-kw="Author of sin The Fall Permission">
<blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</span></figcaption>

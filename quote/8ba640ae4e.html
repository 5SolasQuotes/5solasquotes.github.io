<main class="wrap"><figure class="quote" id="q-8ba640ae4e" data-kw="">
<blockquote><p>Unless it [the Covenant of Grace] was conditional, there would be no place for threatenings in the gospel (which could not be denounced except against those who had neglected the prescribed condition)–for the neglect of faith and obedience cannot be culpable, if not required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology (P&amp;R, 1994), vol. 2 | ‘Is the covenant of grace conditional and what are its conditions?’ in the 12th Topic, ‘The Covenant of Grace…’, Question 3, pp. 184-89</cite>, p. 185</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

</figure><figure class="quote" id="q-126564ab71" data-kw="">
<blockquote><p>We respond: Our corollary in the disputation of 1634 set forth that this holds: Good works from the use of Scripture are in some way able to be called the cause of life eternal (2 Cor. 4:17; Phil. 2:12) and nonetheless they are certainly not hence an appearance or a shade of argument for the merit of papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>43rd Categorical, ‘Of Good Works being Causes of Life Eternal’ in Of Some Select Problems, Part 10 in Select Theological Disputations (Utrecht, 1669), vol. 5, pp. 675-86</cite>, pp. 675-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We respond: Our corollary in the disputation of 1634 set forth that this holds: Good works from the use of Scripture are in some way able to be called the cause of life eternal (2 Cor. 4:17; Phil. 2:12) and nonetheless they are certainly not hence an appearance or a shade of argument for the merit of papists.”

— Gisbertus Voetius, 43rd Categorical, ‘Of Good Works being Causes of Life Eternal’ in Of Some Select Problems, Part 10 in Select Theological Disputations (Utrecht, 1669), vol. 5, pp. 675-86, pp. 675-76">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+respond%3A+Our+corollary+in+the+disputation+of+1634+set+forth+that+this+holds%3A+Good+works+from+the+use+of+Scripture+are+in+some+way+able+to+be+called+the+cause+of+life+eternal+%282+Cor.+4%3A17%3B+Phil.+2%3A12%29+and+nonetheless+they+are+certainly+not+hence+an+appearance+or+a+shade+of+argument+for+the+merit+of+papists.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+43rd+Categorical%2C+%E2%80%98Of+Good+Works+being+Causes+of+Life+Eternal%E2%80%99+in+Of+Some+Select+Problems%2C+Part+10+in+Select+Theological+Disputations+%28Utrecht%2C+1669%29%2C+vol.+5%2C+pp.+675-86%2C+pp.+675-76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F126564ab71.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/126564ab71.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=We%20respond%3A%20Our%20corollary%20in%20the,argument%20for%20the%20merit%20of%20papists&amp;text=We%20respond%3A%20Our%20corollary%20in%20the%20disputation%20of&amp;text=shade%20of%20argument%20for%20the%20merit%20of%20papists" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9294436715" data-kw="">
<blockquote><p>Controversy V: Are good works necessary? Position of [the Romanist Robert] Bellarmine: Good works are necessary not only by necessity of presence but also of efficiency, as Scripture, the Church Fathers, and sound reason teach. Orthodox Position: Good works do not precede the justified but necessarily follow him and precede the one who will be saved. They are necessary for adults in an orderly manner, by hypothesis or necessity: 1. Of presence, as signs and effects of faith. 2. Of divine commandment. 3. Of means, for they are the way to salvation, condition, and sine qua non cause. Therefore, if Bellarmine does not understand efficiency as some merit or inherent force and dignity of good works in obtaining salvation, this phrase can be admitted. Good works contribute to attaining eternal life, but not by merit. Therefore, the apparatus of arguments reported here is useless.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy V: Are good works necessary? Position of [the Romanist Robert] Bellarmine: Good works are necessary not only by necessity of presence but also of efficiency, as Scripture, the Church Fathers, and sound reason teach. Orthodox Position: Good works do not precede the justified but necessarily follow him and precede the one who will be saved. They are necessary for adults in an orderly manner, by hypothesis or necessity: 1. Of presence, as signs and effects of faith. 2. Of divine commandment. 3. Of means, for they are the way to salvation, condition, and sine qua non cause. Therefore, if Bellarmine does not understand efficiency as some merit or inherent force and dignity of good works in obtaining salvation, this phrase can be admitted. Good works contribute to attaining eternal life, but not by merit. Therefore, the apparatus of arguments reported here is useless.”

— Johann H. Alsted, ‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CControversy+V%3A+Are+good+works+necessary%3F+Position+of+%5Bthe+Romanist+Robert%5D+Bellarmine%3A+Good+works+are+necessary+not+only+by+necessity+of+presence+but+also+of+efficiency%2C+as+Scripture%2C+the+Church+Fathers%2C+and+sound+reason+teach.+Orthodox+Position%3A+Good+works+do+not+precede+the+justified+but+necessarily+follow+him+and+precede+the+one+who+will+be+saved.+They+are+necessary+for+adults+in+an+orderly+manner%2C+by+hypothesis+or+necessity%3A+1.+Of+presence%2C+as+signs+and+effects+of+faith.+2.+Of+divine+commandment.+3.+Of+means%2C+for+they+are+the+way+to+salvation%2C+condition%2C+and+sine+qua+non+cause.+Therefore%2C+if+Bellarmine+does+not+understand+efficiency+as+some+merit+or+inherent+force+and+dignity+of+good+works+in+obtaining+salvation%2C+this+phrase+can+be+admitted.+Good+works+contribute+to+attaining+eternal+life%2C+but+not+by+merit.+Therefore%2C+the+apparatus+of+arguments+reported+here+is+useless.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alsted%2C+%E2%80%98On+Justification+%26+Good+Works+in+General%E2%80%99+in+Theologia+polemica%2C+exhibens+praecipuas+huius+aeui+in+religionis+negotio+controuersias+sex+in+partes+tributa+studio+%28d.+1638%29+at+Nosferatu%E2%80%99s+Substack+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9294436715.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9294436715.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Controversy%20V%3A%20Are%20good%20works%20necessary,of%20arguments%20reported%20here%20is%20useless&amp;text=Controversy%20V%3A%20Are%20good%20works%20necessary%3F%20Position%20of&amp;text=the%20apparatus%20of%20arguments

<main class="wrap"><figure class="quote" id="q-aca0dbf1a1" data-kw="">
<blockquote><p>Besides these three causes of unsatisfiableness, God Himself doth justly put that property and poison into all worldly things doted upon, and desired immoderately, that they shall plague the heart that pursues them; by filling it still with a furious and fresh supply of more greediness, longings, jealousies, and many miserable discontentments: So that they become unto it, as drink unto a drunkard, a man in a hydropicus, dropsy, or burning fever, serve only to inflame it with new heat, and fiery additions of insatiable thirst and inordinate lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some General Directions for a Comfortable Walking with God</cite>, … (London, 1626) 1625 was a plague year., pp. 226-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b7047b830e" data-kw="">
<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, … (1681), p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

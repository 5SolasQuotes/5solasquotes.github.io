<main class="wrap"><figure class="quote" id="q-c13d002c38" data-kw="">
<blockquote><p>The heart of a holy man rises against secret sins, against such as lie furthest off from the eye of man: Ps. cxix. 113, ‘I hate vain thoughts, but thy law do I love.’ What more secret than vain thoughts? and yet against these the heart of a holy man rises. When Joseph was tempted to be secretly wicked with his mistress, his heart rises against it: Gen. xxxix. 9, ‘How can I do this great wickedness, and sin against the Lord?’ Hezekiah humbled himself for ‘the pride of his heart,’ 2 Chron, xxxii. 24-26.

Heart-sins lie most close and secret; and yet for these a holy man humbles himself. Job would not suffer his heart, in an idolatrous way, secretly to kiss his hand, Job xxxi. 26, 27. The heart of a holy man rises against wickedness in the dark, against folly in a corner, against sin [in] a closet. So Paul was much affected and afflicted with the operations of sin within him, ‘with the law in his members rebelling against the law of his mind,’ Rom. vii. 23, 24. Paul, after his conversion, never fell into any scandalous sin. Those sins that did most trouble him and distress him were of his own house, yea, were in his own heart.

A holy man knows that secret sins are sins, as well as those that are open, Ps. xix. 12. He knows that secret sins must be repented of as well as others; he knows that God takes notice of secret sins as well as of open: 2 Sam. xii. 12, ‘Thou didst it secretly;’ He knows that secret sins do often interpose between God and his soul: ‘Thou hast set our iniquities before thee: our secret sins in the light of thy countenance,’ Ps. xc. 8. He knows that secret sins will quickly become public, except they are presently loathed and speedily mortified, Gen. xxxviii. 24-27.

He knows that secret sins, like secret diseases and secret wounds, do oftentimes prove most dangerous and pernicious; he knows that secret sins are the price of blood, as well as open sinnings. He knows that secret sins are a grief to the Spirit, as well as those that are manifest. He knows that sometimes God punishes secret sins with manifest judgments, as you may see in that great instance of David, 2 Sam. xii. 10, 18. Upon all which accounts, a holy heart rises in a detestation of secret sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 111.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84ded9faba" data-kw="">
<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>

<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>

<blockquote><p>II. And if anyone would exactly view the manner and circumstances of Adam’s sin, he shall find that in every man, the character, and no obscure image, of that first sin, is deeply impressed: for there is engrafted in every man curiosity and desire of knowing those things which pertain nothing to him: and also a distrustful hesitation, and doubting of the Word of God: And as Adam laid the fault upon his wife, and his wife upon the Serpent, so is it natural to every man to cover his fault with another’s fault: Also flight and trembling at the meeting of God, lying, dissembling, and a sense of indecent nakedness are in all men by nature, and are derived into posterity from that fountain; and to these things we are not taught, but made, not instructed, but infected: to these things we do not only not need a master, but contrary to the teaching of masters, and to discipline, all stayes and bars being broken, we return to them, nature being conqueror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1620), pp. 57-73 | 10. ‘Of the propagation of the sin of Adam to his posterity, where also of the traduction of the soul and of sin itself’, pp. 64-65</span></figcaption>

<div class="actions"><button class="copy" data-copy="“II. And if anyone would exactly view the manner and circumstances of Adam’s sin, he shall find that in every man, the character, and no obscure image, of that first sin, is deeply impressed: for there is engrafted in every man curiosity and desire of knowing those things which pertain nothing to him: and also a distrustful hesitation, and doubting of the Word of God: And as Adam laid the fault upon his wife, and his wife upon the Serpent, so is it natural to every man to cover his fault with another’s fault: Also flight and trembling at the meeting of God, lying, dissembling, and a sense of indecent nakedness are in all men by nature, and are derived into posterity from that fountain; and to these things we are not taught, but made, not instructed, but infected: to these things we do not only not need a master, but contrary to the teaching of masters, and to discipline, all stayes and bars being broken, we return to them, nature being conqueror.”

— Pierre Du Moulin, The Anatomy of Arminianism, … (1619; London, 1620), pp. 57-73 | 10. ‘Of the propagation of the sin of Adam to his posterity, where also of the traduction of the soul and of sin itself’, pp. 64-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+And+if+anyone+would+exactly+view+the+manner+and+circumstances+of+Adam%E2%80%99s+sin%2C+he+shall+find+that+in+every+man%2C+the+character%2C+and+no+obscure+image%2C+of+that+first+sin%2C+is+deeply+impressed%3A+for+there+is+engrafted+in+every+man+curiosity+and+desire+of+knowing+those+things+which+pertain+nothing+to+him%3A+and+also+a+distrustful+hesitation%2C+and+doubting+of+the+Word+of+God%3A+And+as+Adam+laid+the+fault+upon+his+wife%2C+and+his+wife+upon+the+Serpent%2C+so+is+it+natural+to+every+man+to+cover+his+fault+with+another%E2%80%99s+fault%3A+Also+flight+and+trembling+at+the+meeting+of+God%2C+lying%2C+dissembling%2C+and+a+sense+of+indecent+nakedness+are+in+all+men+by+nature%2C+and+are+derived+into+posterity+from+that+fountain%3B+and+to+these+things+we+are+not+taught%2C+but+made%2C+not+instructed%2C+but+infected%3A+to+these+things+we+do+not+only+not+need+a+master%2C+but+contrary+to+the+teaching+of+masters%2C+and+to+discipline%2C+all+stayes+and+bars+being+broken%2C+we+return+to+them%2C+nature+being+conqueror.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%2C+%E2%80%A6+%281619%3B+London%2C+1620%29%2C+pp.+57-73+%7C+10.+%E2%80%98Of+the+propagation+of+the+sin+of+Adam+to+his+posterity%2C+where+also+of+the+traduction+of+the+soul+and+of+sin+itself%E2%80%99%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c343373fe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c343373fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/original-sin/#:~:text=II.%20And%20if%20anyone%20would%20exactly,return%20to%20them%2C%20nature%20being%20conqueror&amp;text=II.%20And%20if%20anyone%20

<main class="wrap"><figure class="quote" id="q-899d6c24a5" data-kw="">
<blockquote><p>Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6be95af5f6" data-kw="">
<blockquote><p>But in all the things that God has made… there is nothing which can properly be likened to the nature of God: neither are there any words in the mouths of men that can properly be spoken of it: neither are there any similitudes of man’s inuention that can rightly and squarely agree with the divine essence. And St. Basil, disputing De Ousia &amp; Hypostasi, says: ‘It cannot be that the comparisons of examples should in all points be like to those things, to the use whereof the examples do serve. Thou mayest say that injury is done to the majesty of God if it be compared with mortal things. But for because the holy scripture does not a little condescend and attemper itselfe to our infirmity, I will put a similitude, although in very deed much unlike, which is usually taken and commonly used. Behold the sun and the beams that come from it, and then the heat that proceedes from them both. As the sun is the head-spring of the light and the heat: so is the Father the headspring of the Son, who is light of light. And as of the sun and the beams together the heat does come, so of the Father and the Son together the holy Ghost proceeds. But now, put case, or imagine that the sun were such, as never had beginning, nor ever shall have ending, and should not then I pray you, ye beams of this everlasting sun be everlasting too? and should not the heat, which proceeds of them both, be everlasting as well as they? Finally, should not the Son be one still in essence or substance, and three by reason of the three subsistences or persons? This parable of the sun did Tertullian use (contra Praxeam.), whose words, which do also contain other similitudes, I will not be grieved to recite unto you. ‘I wil not doubt’ (says he) ‘to call both the stalk of a root, the brook of a springhead, and a beam of the sun, by the name of a son: for every original is a parent and every thing that issues of that original is a son: much more then the Word of God may be called a Son, which even properly has the name of Son, and yet neither is the stalk separated from the root, nor the brook from the springhead, nor the beam from the sun, no more is the Word separated from God. Therefore according to the fashion of these examples I profess that I say there are two, God &amp; his Word, the Father and his Son. For the root and the stalk are two things, but joined in one. And the springhead and the brook are two kinds, but undivided. And the sun and the beams are two forms, but both cleaving the one to the other. Everything that comes of anything must needs be second to that out of which it comes, and yet it is not separated from that from which it proceeds. But where a second is, there are two, and where a third is there are three. For the third is the spirit of God and the Son: even as the third from the root is the fruit of the stalk, the third from the springhead is the river of the brook, and the third from the sun is the heat of the beam: yet none of these is alienated from the matrix [womb] of which they take the properties that they have. So the Trinity descending by annexed and linked degrees from the Father, does not make against the monarchy, and does defend the economical state, that is, the mystery of the dispensation. Understand everywhere that I profess this rule wherein I testify, that the Father, the Son and the Holy Ghost are unseparated one from another, and so thou shalt know how everything is spoken.’ And so forth. For all these are the words of Tertullian, who flourished in Africa not long after the age of the apostles.</p></blockquote>

<blockquote><p>Thesis XIV… For because divine essence is infinite, most simple, and eternal, therefore the three hypostases subsisting in it—although they are truly three in number—because these individual hypostases are distinguished by their own incommunicable properties, they are nevertheless not three gods nor are they said to be three gods in the same way that there are three men… But instead, in the divine this happens by an indescribable communication of the whole essence from eternity, in which no point of beginning, middle, or end can be stated.† † dari, i.e., cannot be stated or supplied because it does not exist.</p></blockquote>

</figure><figure class="quote" id="q-a84fb18dc6" data-kw="">
<blockquote><p>As the essence of the Godhead is common to the several persons, they have a common intelligence, will, and power. There are not in God three intelligences, three wills, three efficiencies. The Three are one God, and therefore have one mind and will. This intimate union was expressed in the Greek Church by the word perichoresis, which the Latin words inexistentia, inhabitatio, and intercommunio, were used to explain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-17e6751446" data-kw="">
<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>

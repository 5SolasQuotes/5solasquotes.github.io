<main class="wrap"><figure class="quote" id="q-aafc608860" data-kw="">
<blockquote><p>As to his legal relations, the Scriptures clearly teach that, at his creation, he was put under the equitable Covenant of Works for a certain probationary period. This just constitution provided (a) everlasting well-being on condition of perfect obedience, and (b) everlasting ill-being on condition of disobedience. Now, although under that covenant man failed, it is evident that, nevertheless, both of these conditions must be maintained in their integrity. To relax them would be to violate the word of God, to dishonour his law, and to render his promises and his threatenings alike unworthy of respect. The penalty, when once incurred, can be preserved inviolate only by being executed. The promise of everlasting well-being can be truthfully granted only when the condition of perfect obedience has been fulfilled. Suffering a righteous penalty entitles no criminal to a reward; and to offer eternal blessedness to such, on terms denied to unfallen Adam and to all angels, would be placing a premium on sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement</cite>, (Philadelphia, PA: Presbyterian Board of Publication, 1867), 26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>It will now be asked, what manner of covenant was that at Mount Sinai, which is called the worst covenant? What kind of covenant was it? Sol. In general, it was a covenant of works, as to be fulfilled by Jesus Christ, but not so to Israel. Or, it was the covenant of grace as to its legal condition to be performed by Jesus Christ, represented under a conditional administration of it to Israel.</p></blockquote>

</figure><figure class="quote" id="q-83baa068be" data-kw="">
<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.7 [pp. 575–76].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<main class="wrap"><figure class="quote" id="q-4246cbe1f0" data-kw="">
<blockquote><p>Angels are intelligent spirits free from a body. Propositions …

IV. Angels are in a particular place not as if they were enclosed within it, but to the exclusion of being anywhere else [non circumscriptive sed definitive].

V. Angels cannot be in several places at once.

VI. Angels truly move from one place to another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.”

</figure><figure class="quote" id="q-089a20e32e" data-kw="">
<blockquote><p>Each creature is limited by place, though spirits do not fill up a place† by commensuration of parts, yet they have a certain compass (as I may call it) beyond which their essence extends not: they are so here that they are not there; so in heaven, that they are not the same time on earth. † The angels are in an ubi [where] though not in a place properly; in English we cannot so well distinguish these words: they are limited and confined to some space; an angel cannot be at the same time in heaven and earth. But God is altogether above place, he is omnipresent, not by any material extension, but after an incomprehensible and unexpressible manner. He is quite above all place, wholly without and within all and every place, and that without all local motion or mutation of place. He is every where totally and equally…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/guardian-angels.html">Guardian angels</a></span></div>

</figure><figure class="quote" id="q-cdea257cab" data-kw="">
<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.”

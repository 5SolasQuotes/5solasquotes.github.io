<main class="wrap"><figure class="quote" id="q-74ee5bf636" data-kw="">
<blockquote><p>X. The making of the charge is described by the metaphor of books or records in which the actions of the person who are being judged are written down. Revelation 20:12 ‘And the books were opened.’ By the word ‘books’ is to be understood both God’s omniscience and man’s conscience. XI.The wicked will be judged in accordance with their works and on account of their works; the righteousness according to the works of faith but not on account of their works. Thus in Revelation 20:12 it is said the that another book, the book of life, was opened, so that we may know that the salvation of the righteous depends not on works but on the eternal grace of God, through which they have been entered into the book of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, (1626), 25.10–11 in John W. Beardslee in Reformed Dogmatics (New York: Oxford University Press, 1965), 184.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9def8be007" data-kw="">
<blockquote><p>To be justified means more than to be declared “not guilty.” It actually means to be declared righteous before God. It means God has imputed or charged the guilt of our sin to His Son, Jesus Christ, and has imputed or credited Christ’s righteousness to us.</p></blockquote>

</figure><figure class="quote" id="q-ec3c2e364e" data-kw="">
<blockquote><p>This is the same as though he had said, that we do not attain salvation by a frigid and bare knowledge of God, which all confess to be most true; for salvation comes to us by faith for this reason, because it joins us to God. And this comes not in any other way than by being united to the body of Christ, so that, living through his Spirit, we are also governed by him. There is no such thing as this in the dead image of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, James 2:14</span></figcaption>

</figure><figure class="quote" id="q-b26f83fb13" data-kw="">
<blockquote><p>Consent I. They [Romanists] grant that in justification sin is pardoned by the merits of Christ, and that none can be justified without remission of sins: and that is well.

II. They grant that the righteousness whereby a man is made righteous before God, comes from Christ, and from Christ alone.

III. The most learned among them say that Christ’s satisfaction, and the merit of his death is imputed to every sinner that does believe, for his satisfaction before God: and hitherto we agree. The very point of difference is this: We hold that the satisfaction made by Christ in his death, and obedience to the Law, is imputed to us and becomes our righteousness. They say, it is our satisfaction and not our righteousness whereby we stand righteous before God: because it is inherent in the person of Christ as in a subject. Now the answer of the Papist to the former question is on this manner: The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification, is an excellent gift of God, and has his reward of God; and is the matter of our justification before man: because it serves to declare us to be reconciled to God, and to be justified; yet we deny it to be the thing, which makes us of sinners to become righteous or just before God. And this is the first point of our disagreement in the matter of justification: which must be marked; because if there were no more points of difference between us, this one alone were sufficient to keep us from uniting of our religions: for hereby the Church of Rome does raze the very foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’, pp. 926-27</span></figcaption>

</figure><figure class="quote" id="q-a906397c9a" data-kw="">
<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin.

2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, p. 254</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

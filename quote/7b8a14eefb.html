<main class="wrap"><figure class="quote" id="q-7b8a14eefb" data-kw="">
<blockquote><p>…but it cannot follow, that because teaching and publishing of errors in non-fundamentals is consistent with [the persons having] saving grace, that therefore these non-fundamental sins of murder, adultery, tolerating of idolatrous high places, persecuting of faithful prophets, making of a golden calf, and hallowing of it to be adored as the God that brought Israel out of Egypt, are sins not to be tolerated in the truly godly, such as Aaron, David, and Asa, for then should they be tolerated in the wicked also, for the toleration of such in the godly, because they are not fundamental wickednesses inconsistent with saving grace, is as destructive and more because of their extreme scandalousness, to all peace and safety of human societies, and to the duty of the godly magistrate, as these same sins in the wicked, upon the same grounds publishing of all errors non-fundamental, the toleration of the high places, are as inconsistent with peace, destructive and injurious to souls, especially in the godly, as scandalous to other false teachers, as these non-fundamental sins.</p></blockquote>

<blockquote><p>91. For the national synod ought to declare, and that with [the] greatest reverence, to the Magistrate the grounds of their sentence, and the reasons of their proceedings when he demands or enquires into the same, and desires to be satisfied: but if the Magistrate nevertheless do dissent, or cannot by contrary reasons (which may be brought, if he please) move the synod to alter their judgement, yet may he require and procure that the matter be again debated and canvassed in another national synod…</p></blockquote>

</figure><figure class="quote" id="q-305c9484c3" data-kw="">
<blockquote><p>Neither in this case ought the authority of certain worthy and most learned men to move us, who seem too indiscreetly for to deny that this care appertains unto the Magistrate, whose office (say they) it is not to rid men from diseases, but only to maintain the safety and peace of our life and goods. For it may even out of their own words be proved sufficiently, that albeit the magistrate ought not to cure the diseases of every several man, or preserve them from such as do not openly ravage, nor have common causes (for this is the proper duty of the physicians), yet when as they hold it to be belonging to their charge, by their service and authority to perform, that their subjects may live commodiously: who sees not that this commodiousness does also appertain unto the health of the body? Which thing he that believes not, the same has never seen how miserably all the duties of men are cumbered, the order of the churches, the exercises of godliness, the instruction of youth, the traffic of citizens, whereupon must needs ensue a most grievous destruction of particular persons, when the plague troubles a city or country. Wherefore, I appeal unto thyself, whosoever thou art that art of this opinion, that thou thinkest not it to be the duty of the Magistrate to preserve the commonwealth from diseases (and especially common diseases) do not such sicknesses seem unto thee to be numbered amongst other incommodities? And can men live together commodiously when as these diseases do rage? Doubtless this canst thou not affirm if ever thou hast had experience before what the plague is, or what it may work, where it once has prevailed? Why then, say I, doest thou think it a thing not appertaining unto the duty of the magistrate, to deliver men from such diseases, that is with public care to defend? I pray thee, hast thou not seen that which is usual in all well ordered commonwealths, how diligently in cities the Magistrate provides and stores up such things as serve for the use of war? How carefully he prepares weapons? How busily he retains garrisons set in a readiness? Especially when he is in fear of some hurt to ensue? and to what end? but that men should live commodiously. Wherefore are horses kept; ships built; walls repaired, trenches dug, towers set up and banks cast: but that the citizens should live more commodiously in safety against the invasions or assaults of the enemies? Dogs are maintained for the like cause, nets are pitched, hunters are hired and troops of country people draw together if at any time wolves or such like beasts do trouble a country. I remember in the kingdom of France that certain leopards, which the king uses to keep, did break out of ward, and in every place slew the countrymen. The whole country was mustered and neither cost nor labor spared until they had rid the land from that fear. How much more justly then in this calamity and misery also ought there some provident course to be taken whereby this so mighty an enemy and cruel beast may be kept away from our throats, which in a very short time is wont to ravage very far, and as it were a canker, eat up every thing that is next [to] it? To the end that the clean in the Old Testament should not keep company with the unclean lepers, by the authority of the Magistrate, there was made a separation, neither were they received among the other people before that they were by the priests appointed to this office, judged cleansed after they were viewed naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, (London, 1583), bk. 1, ch. 1, p. 4-5. von Ewich was a reformed German reformer, physician and city health official.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

e+before+what+the+plague+is%2C+or+what+it+may+work%2C+where+it+once+has+prevailed%3F+Why+then%2C+say+I%2C+doest+thou+think+it+a+thing+not+appertaining+unto+the+duty+of+the+magistrate%2C+to+deliver+men+from+such+diseases%2C+that+is+with+public+care+to+defend%3F+I+pray+thee%2C+hast+thou+not+seen+that+which+is+usual+in+all+well+ordered+commonwealths%2C+how+diligently+in+cities+the+Magistrate+provides+and+stores+up+such+things+as+serve+for+the+use+of+war%3F+How+carefully+he+prepares+weapons%3F+How+busily+he+retains+garrisons+set+in+a+readiness%3F+Especially+when+he+is+in+fear+of+some+hurt+to+ensue%3F+and+to+what+end%3F+but+that+men+should+live+commodiously.+Wherefore+are+horses+kept%3B+ships+built%3B+walls+repaired%2C+trenches+dug%2C+towers+set+up+and+banks+cast%3A+but+that+the+citizens+should+live+more+commodiously+in+safety+against+the+invasions+or+assaults+of+the+enemies%3F+Dogs+are+maintained+for+the+like+cause%2C+nets+are+pitched%2C+hunters+are+hired+and+troops+of+country+people+draw+together+if+at+any+time+wolves+or+such+like+beasts+do+trouble+a+country.+I+remember+in+the+kingdom+of+France+that+certain+leopards%2C+which+the+king+uses+to+keep%2C+did+break+out+of+ward%2C+and+in+every+place+slew+the+countrymen.+The+whole+country+was+mustered+and+neither+cost+nor+labor+spared+until+they+had+rid+the+land+from+that+fear.+How+much+more+justly+then+in+this+calamity+and+misery+also+ought+there+some+provident+course+to+be+taken+whereby+this+so+mighty+an+enemy+and+cruel+beast+may+be+kept+away+from+our+throats%2C+which+in+a+very+short+time+is+wont+to+ravage+very+far%2C+and+as+it+were+a+canker%2C+eat+up+every+thing+that+is+next+%5Bto%5D+it%3F+To+the+end+that+the+clean+in+the+Old+Testament+should+not+keep+company+with+the+unclean+lepers%2C+by+the+authority+of+the+Magistrate%2C+there+was+made+a+separation%2C+neither+were+they+received+among+the+other+people+before+that+they+were+by+the+priests+appointed+to+this+office%2C+judged+cleansed+after+they+were+viewed+naked.%E2%80%9D%0A% </figure><figure class="quote" id="q-2cab605abf" data-kw="">
<blockquote><p>All the epistles written by the apostles are a breathing out of love to their flock, not caring to be spent upon them for their good, that they might get them brought forward and present them as chaste virgins to their bridegroom. Therefore, they style their people ‘dearly beloved,’ not using words of office or flattery, but of truth and affection. The hireling will flee, but the true shepherd will lay down his life for the sheep [John 10:11,15]. And if the pest [plague] were in the congregation, he would not leave them, but would go as near them as the Lord’s law, or preservation of his own life, would permit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 10 of Sermons on Jeremiah’s Lamentations</cite>, (RHB &amp; Naphtali Press) Probably from 1628, around the siege and final fall of La Rochelle, France.</span></figcaption>

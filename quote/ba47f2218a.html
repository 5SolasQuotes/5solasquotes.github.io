<main class="wrap"><figure class="quote" id="q-ba47f2218a" data-kw="">
<blockquote><p>…though those names [given us, Anglican ministers, such as “priest,” “parson,” “vicar” and “curate,” etc.] were of themselves of an Antichristian [Romanist] original and use, yet if they be imposed upon any such as take no pleasure in them, we see not how they can any way pollute them and their offices more than Joseph and Daniel were polluted by heathenish and idolatrous names that were given them (Gen. 41:45; Dan. 1:7), or than private Christians are made the worse by the odious terms (1 Cor. 1:12–13) of Precisians, Puritans and Martinists, or than our [Separatist] brethren themselves are by the names of Brownists and Barrowists, which they so usually are called by and so much dislike.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-material.html">English Puritan Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pt. 2, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b937c11fbb" data-kw="">
<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy</cite>, … (London: Simmons, 1681) | pt. 1, ch. 3, pp. 23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-8d95f51221" data-kw="">
<blockquote><p>…for the power is either a power to rule according to God’s law, as he is commanded (Dt. 17) and this is the very office or official power which the King of kings has given to all kings under him, and this is a power of the royal office of a king, to govern for the Lord his Maker; or this is a power to do ill and tyrannize over God’s people; but this is accidental to a king and the character of a tyrant, and is not from God… If then the judge and the king be both lawful ordinances, and if they differ essentially, as Barclay [a Romanist] says, then that specific form which distinguishes the one from the other [according to Barclay], to wit, domination and a power to destroy the subject, must be from God; which is blasphemous: for God can give no moral power to do wickedly; for that is licence, and a power to sin against a law of God, which is absolutely inconsistent with the holiness of God; for so the Lord might deny Himself, and dispense with sin. God avert such blasphemies!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 72 rt col top</span></figcaption>

</figure><figure class="quote" id="q-3541403a02" data-kw="">
<blockquote><p>For the chief convenience of a State is that people might be kept from inconvenience or incommoding one another and that they may be conserved in a liberty to do other good things according to piety and honesty: So that he who does things in themselves good, though under an unlawful civil magistrate, does not by those acts assert any magistrate’s right, but his only who originally gave law and rules for those internal acts, and that is God’s right alone.</p></blockquote>

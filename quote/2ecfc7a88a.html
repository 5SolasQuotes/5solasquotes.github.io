<main class="wrap"><figure class="quote" id="q-2ecfc7a88a" data-kw="">
<blockquote><p>Use 1. Did God make the world and that not from eternity, but in time, about almost six thousand years ago, and no longer? Then here we see He made it not because He needed it, because He wanted it, for if it had been necessary to God, it would have been from eternity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>CXLV Expository Sermons upon the whole 17th Chapter of the Gospel according to St. John (London, 1656), sermon 28</cite>, p. 157</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“Use 1. Did God make the world and that not from eternity, but in time, about almost six thousand years ago, and no longer? Then here we see He made it not because He needed it, because He wanted it, for if it had been necessary to God, it would have been from eternity…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7963400fc6" data-kw="">
<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons &amp; Uses upon the First Epistle General of John (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4</cite>, pp. 224-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.”

— John Cotton, A Practical Commentary, or an Exposition with Observations, Reasons &amp; Uses upon the First Epistle General of John (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4, pp. 224-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+God+did+not+make+the+whole+fabric+of+the+world+at+once%2C+though+it+was+not+impossible+to+Him%2C+being+a+God+Almighty%2C+but+in+the+space+of+six+days%3A+So+does+God+deal+with+his+children%2C+in+creating+in+them+a+clean+heart%3B+first+he+suffers+their+hearts+to+be+as+a+rude+and+massy+lump%2C+full+of+darkness%2C+and+then+God+sends+his+Holy+Spirit+into+their+hearts%2C+and+it+does+illuminate+them%3B+and+drive+away+those+black+clouds+of+darkness+and+ignorance%E2%80%A6+4%E2%80%A6+As+the+sun+does+now+move+with+much+celerity%2C+so+fast%2C+that+it+does+in+the+space+of+a+day%2C+run+over+many+millions+of+miles.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+A+Practical+Commentary%2C+or+an+Exposition+with+Observations%2C+Reasons+%26+Uses+upon+the+First+Epistle+General+of+John+%28d.+1652%3B+1658%29%2C+on+ch.+3%2C+verse+2%2C+doctrines+3-4%2C+pp.+224-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7963400fc6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7963400fc6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=As%20God%20did%20not%20make%20the,run%20over%20many%20millions%20of%20miles&amp;text=As%20God%20did%20not%20make%20the%20whole%20fabric&amp;text=a%20day%2C%20run%20over%20many%20millions%20of%20miles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7ca6866edf" data-kw="">
<blockquote><p>The judgments of God do not always follow crimes, as thunder does lightning, but sometimes the space of many ages coming between. When the sun has shined fair the space of six days upon their tabernacle, we know not what clouds the seventh may bring. And when their punishment does come, let them make their account, in the greatness of their sufferings to pay the interest of that respite which has been given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker… in Eight Books of Ecclesiastical Polity (d. 1600; London: Newcomb, 1666), A Remedy against Sorrow &amp; Fear, delivered in a Funeral Sermon, p. 546 Note Hooker’s use of the phrase here is not limited to natural days.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“The judgments of God do not always follow crimes, as thunder does lightning, but sometimes the space of many ages coming between. When the sun has shined fair the space of six days upon their tabernacle, we know not what clouds the seventh may bring. And when their punishment does come, let them make their account, in the greatness of their sufferings to pay the interest of that respite which has been given them.”

</figure><figure class="quote" id="q-a1e2a858d1" data-kw="">
<blockquote><p>…in taking up the language of ‘the space of six days,’ the Westminster Assembly declared that it stood with previous theologians in affirming a literal six-day creation. The expression of has its roots in at least four previous theologians whom the Westminster divines knew. As we have seen, the words ‘in the space of six days’ appear in the writings of Bonaventure, Calvin, Zanchi, and Ussher.² ² Bonaventure, Commentaries on the Four Books of Sentences, book 2, distinction 12, art. 1, question 2; Calvin, Commentaries on Genesis, 1:78; Zanchius, Confession of Christian Religion, 21 [5.1]; De Operibus Dei intra Spacium Sex Dierum Creatis; Ussher, Works, 11:183.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-dc0b9eecb9" data-kw="">
<blockquote><p>A man breaks down the windows of his house. The house stands. He breaks down the roof or the walls. The house yet stands, though deformed. He pulls up the foundation— the house itself falls and ceases to be a house. Now religion, which we profess, is like a house or building; and some points thereof are like windows, doors, walls, roofs, and some are the very foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed, on the Church in A Golden Chain</cite>, 5:379.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-bf516bf9b6" data-kw="">
<blockquote><p>In the text [of Rom. 3:23-26] we have the eight following things:

1. The persons justified – (i) Sinners; (ii) Such sinners of all sorts that shall believe, whether Jews or Gentiles.

2. The justifier, or efficient cause – God.

3. The impulsive cause – grace.

4. The means effecting, or material cause – the redemption of Christ.

5. The formal cause – the remission of sins.

6. The instrumental cause – faith.

7. The time of declaring – the present time.

8. The end – that God may appear just.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification Open &amp; Applied’, on Rom. 3:23-26 appended to The Gospel Mystery of Sanctification</cite>, … (London: Parkhurst, 1692) 31 pp.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b4884cf61b" data-kw="">
<blockquote><p>Step Five: Analysis Becomes Myth At this stage, the explanation stops needing actual proof. Not because the evidence is overwhelming, but because the story has become self-sustaining. It can explain everything if you just try hard enough. … The belief now no longer functions as an explanation of reality, instead it’s a closed or “self-sealing” system. It can’t be tested, corrected, or falsified. And most importantly, it can’t be escaped without significant psychological cost. It’s a bit like a prison. Because at this point, abandoning it would mean admitting that the soothing clarity you felt was an illusion. This allows anxiety back in the front door, often holding hands with public humiliation. For many “disaffected” and isolated young men, this is an intolerable duo to entertain. But once a belief can’t be falsified, it’s no longer analysis. It’s a mythology. And mythology has a dangerous advantage: it feels deeper than facts, like a soul-level insight. You’ve finally seen behind the curtain to where the puppet masters pull the strings. You don’t have to guess or speculate, you know. … Step Six: Myth Becomes Moral Signal This is when conspiracy thinking stops being a private explanation held by an individual, and instead becomes a public signal to others. You can hear it in the language: … ”If you don’t see it, you’re asleep.” ”Once you see it, you can’t unsee it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/will-spencer.html">Will Spencer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Eight Steps to Scapegoating’</cite>, (2026)</span></figcaption>

</figure><figure class="quote" id="q-f84e1e20f2" data-kw="">
<blockquote><p>For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect):

1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given.

2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object.

3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh, 1658), ch. 1, ‘Concerning the Holy Trinity &amp; Object of Worship’, p. 12</span></figcaption>

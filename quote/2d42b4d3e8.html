<blockquote><p>There is a great difference between those infants born to parents in the covenant and those not born in the covenant … children of believers dying in infancy ought to be reckoned elect since they are graciously taken away by God from this life before they have violated the conditions of the covenant … children of unbelievers born outside the church of God, ought to be left to the judgment of God.</p></blockquote>

<blockquote><p>6. Our next step is to show that baptism has come in the room of circumcision, and therefore, that the former is rightfully and properly applied to the same subjects as the latter. When we say this, we mean, not merely that circumcision is laid aside in the church of Christ, and that baptism has been brought in, but that baptism occupies the same place, as the appointed initiatory ordinance in the church, and that, as a moral emblem, it means the same thing.

The meaning and design of circumcision was chiefly spiritual. It was a seal of a covenant which had not solely, or even mainly, a respect to the possession of Canaan, and to the temporal promises which were connected with a residence in that land; but which chiefly regarded higher and more important blessings, even those which are conveyed through the Messiah, in whom “all the families of the earth” are to be blessed. So it is with baptism. While it marks an external relation, and seals outward privileges, it is, as circumcision was, a “seal of the righteousness of faith,” and has a primary reference to the benefits of the Messiah’s mission and reign. Circumcision was a token of visible membership in the family of God, and of covenant obligation to him. So is baptism.

Circumcision was the ordinance which marked, or publicly ratified, entrance into that visible family. So does baptism. Circumcision was an emblem of moral cleansing and purity. So is baptism. It refers to the remission of sins by the blood of Christ, and regeneration by his Spirit; and teaches us that we are by nature guilty and depraved, and stand in need of the pardoning and sanctifying grace of God by a crucified Redeemer. Surely, then, there is the best foundation for asserting that baptism has come in the place of circumcision. The latter, as all grant, has been discontinued; and now baptism occupies the same place, means the same thing, seals the same covenant, and is a pledge of the same spiritual blessings. Who can doubt, then, that there is the utmost propriety, upon principle, in applying it to the same infant subjects?

Yet, though baptism manifestly comes in the place of circumcision, there are points in regard to which the former differs materially from the latter. And it differs precisely as to those points in regard to which the New Testament economy differs from the Old, in being more enlarged, and less ceremonial. Baptism is not ceremonially restricted to the eighth day, but may be administered at any time and place. It is not confined to one sex; but, like the glorious dispensation of which it is a seal, it marks an enlarged privilege, and is administered in a way which reminds us that “there is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female,” in the Christian economy; but that we are all one in Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), pp 22-23.</span></figcaption>

</figure><figure class="quote" id="q-f618293144" data-kw="">
<blockquote><p>That as the way to kill sin, and so to live was by circumcision into Christ in the old Testament. Colos. 2.11. insomuch that he that should wilfully neglect outward circumcision for himself or his child that might have it, should be cut off, Gen. 17. So baptizing into Christ is the way to bury sin, and so to live. v. 12. of this 2 Colos. insomuch that he that shall wilfully neglect baptism with water, the seal of regeneration who may have it: shall not enter heaven. Joh. 3.5. A soul may be saved without the use of a seal in some case, but in no case can be saved in the contempt of a seal.

I am not ignorant that some do understand this, Joh. 3.5. of the spirit only compared to water, but who doth not know that (as [Henry] Bullinger saith, Omnes penè de baptismo interpretantur) all almost interpret it of the water of baptism, Bullinger himself consenting with them, only he would not have the efficacy of the Spirit, to be transferred to the sign. And sure whiles Christ was instructing Nicodemus of regeneration, he would not be silent touching the seal of it, baptism.

Nor can we so well parallel this phrase with Matth. 3. Baptising with the holy Ghost and with fire; where only the Spirit must be meant, because there is no other baptism of fire. But there is a baptism, with water, beside baptism with the Spirit. And therefore water must signify baptism. For it were harsh to run to a metaphor without need, and to understand by water the Spirit, which in relation to the efficacy of baptism is usually called fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 29-30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>We do make &amp; gather the fourth argument upon the strength &amp; force of circumcision, in stead whereof, baptism is in the church of Christ. As many as were the servants of God, did afore all things, labour &amp; endeavour themselves, to circumcise their children. Josu. v. Exo. iiii. The Apostles were the most faithful ministers of god: Then did not they omit or leave the thing, that was not brought in, in stead of the circumcision, Ergo, they did baptise, not only them that were of age, but also children.

Fifthly we do thus reason upon the use &amp; custom of the Apostles. The Apostles of Christ did direct all their doings to the conveniency &amp; example of the old testament.

This we do prove by the iiii. Evangelists, the Acts of the apostles, by the epistles of the Apostles, Rom. xv. ii. Cor. ii. ii. Tim. iii. ii. Peter i. chap. Ergo, they did order baptism after the Analogy and figure of the old Testament. The going through the red sea, was a type &amp; figure of the baptism that was to come i. Cor. x. cha. Children were in the figure (for both men and women went through with their children). Ergo the apostles did not deny baptism unto the children. The custom &amp; manner of the scripture (which custom and manner is used almost among all nations) is not to rehearse by name, women &amp; children, and yet nevertheless it doth include them, for in the name of the father of the family, or of the good man of the house, all his whole family is comprehended, as in the chief or head. If this were not, women should be in no small jeopardy, if therefore they were not of god, because that they be not circumcised. All these things are done, by the means &amp; help of a figure that is called Synecdoche.

The sixth argument shall be taken out of the manifest and express testimonies of the apostles. The apostles did baptise all whole households and families, ergo they did baptise children also, for the children are in the number of the family or household. This we do prove by the xvii of Gene. For Abraham doth circumcise all the male children that were in his house. For he understood the promise of God, that saith. I shall be thy God, &amp; the God of thy seed. Likewise in the new Testament, when the goodman of the house, had herd &amp; believed the gospel, that is to say, that God was his God, &amp; the God of his seed also, he caused all them that were in his house both great and small, to be baptized.

Thus the apostles did baptize whole households and families. That the children do pertain unto the father’s household &amp; family, it is plain &amp; manifest by the xii. of Exodus &amp; ii. of the Acts: this do I inculcate &amp; beat the oftener into men’s heads, because that I see the Anabaptists to be at this point that they do exclude the children from the family &amp; household. for they can not deny but the whole households were baptized by the Apostles. But who doth not see, that this cometh of mere contention?

For though they could prove that there were no children at all in the families &amp; households, that the apostles did baptise, yet had they not proved that all families or households were, or be without children: wherefore we do make again our argument after this manner. The Apostles baptized all whole households, ergo, they did baptise children, saith the children are the principal &amp; chief part of the family &amp; household.

But let us put the case, that there were no children in those families &amp; households, that the Apostles did baptise, yet do they pertain &amp; belong to the household, &amp; are reckoned in it, and if there had been any, they would have baptized them. For they did baptise the whole household. The fault then should not have been in the Apostles nor in the children, that their were not baptized: but this had been the cause that they had been baptized, because that there were none: For if they had had children they would have baptized them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We do make &amp; gather the fourth argument upon the strength &amp; force of circumcision, in stead whereof, baptism is in the church of Christ. As many as were the servants of God, did afore all things, labour &amp; endeavour themselves, to circumcise their children. Josu. v. Exo. iiii. The Apostles were the most faithful ministers of god: Then did not they omit or leave the thing, that was not brought in, in stead of the circumcision, Ergo, they did baptise, not only them that were of age, but also children.

Fifthly we do thus reason upon the use &amp; custom of the Apostles. The Apostles of Christ did direct all their doings to the conveniency &amp; example of the old testament.

This we do prove by the iiii. Evangelists, the Acts of the apostles, by the epistles of the Apostles, Rom. xv. ii. Cor. ii. ii. Tim. iii. ii. Peter i. chap. Ergo, they did order baptism after the Analogy and figure of the old Testament. The going through the red sea, was a type &amp; figure of the baptism that was to come i. Cor. x. cha. Children were in the figure (for both men and women went through with their children). Ergo the apostles did not deny baptism unto the children. The custom &amp; manner of the scripture (which custom and manner is used almost among all nations) is not to rehearse by name, women &amp; children, and yet nevertheless it doth include them, for in the name of the father of the family, or of the good man of the house, all his whole family is comprehended, as in the chief or head. If this were not, women should be in no small jeopardy, if therefore they were not of god, because that they be not circumcised. All these things are done, by the means &amp; help of a figure that is called Synecdoche.

The sixth argument shall be taken out of the manifest and express testimonies of the apostles. The apostles did baptise all whole households and families, ergo they did baptise children also, for the children are in the number of the family or household. This we do prove by the xvii of Gene. For Abraham doth circumcise all the male children that were in his house. For he understood the promise of God, that saith. I shall be thy God, &amp; the God of thy seed. Likewise in the new Testament, when the goodman of the house, had herd &amp; believed the gospel, that is to say, that God was his God, &amp; the God of his seed also, he caused all them that were in his house both great and small, to be baptized.

Thus the apostles did baptize whole households and families. That the children do pertain unto the father’s household &amp; family, it is plain &amp; manifest by the xii. of Exodus &amp; ii. of the Acts: this do I inculcate &amp; beat the oftener into men’s heads, because that I see the Anabaptists to be at this point that they do exclude the children from the family &amp; household. for they can not deny but the whole households were baptized by the Apostles. But who doth not see, that this cometh of mere contention?

For though they could prove that there were no children at all in the families &amp; households, that the apostles did baptise, yet had they not proved that all families or households were, or be without children: wherefore we do make again our argument after this manner. The Apostles baptized all whole households, ergo, they did baptise children, saith the children are the principal &amp; chief part of the family &amp; household.

But let us put the case, that there were no children in those families &amp; households, that the Apostles did baptise, yet do they pertain &amp; belong to the household, &amp; are reckoned in it, and if there had been any, they would have baptized them. For they did baptise the whole household. The fault then should not have been in the Apostles nor in the children, that their were not baptized: but this had been the cause that they had been baptized, because that there were none: For if they had had children they would have baptized them.”

— Heinrich Bullinger, A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+make+%26+gather+the+fourth+argument+upon+the+strength+%26+force+of+circumcision%2C+in+stead+whereof%2C+baptism+is+in+the+church+of+Christ.+As+many+as+were+the+servants+of+God%2C+did+afore+all+things%2C+labour+%26+endeavour+themselves%2C+to+circumcise+their+children.+Josu.+v.+Exo.+iiii.+The+Apostles+were+the+most+faithful+ministers+of+god%3A+Then+did+not+they+omit+or+leave+the+thing%2C+that+was+not+brought+in%2C+in+stead+of+the+circumcision%2C+Ergo%2C+they+did+baptise%2C+not+only+them+that+were+of+age%2C+but+also+children.%0A%0AFifthly+we+do+thus+reason+upon+the+use+%26+custom+of+the+Apostles.+The+Apostles+of+Christ+did+direct+all+their+doings+to+the+conveniency+%26+example+of+the+old+testament.%0A%0AThis+we+do+prove+by+the+iiii.+Evangelists%2C+the+Acts+of+the+apostles%2C+by+the+epistles+of+the+Apostles%2C+Rom.+xv.+ii.+Cor.+ii.+ii.+Tim.+iii.+ii.+Peter+i.+chap.+Ergo%2C+they+did+order+baptism+after+the+Analogy+and+figure+of+the+old+Testament.+The+going+through+the+red+sea%2C+was+a+type+%26+figure+of+the+baptism+that+was+to+come+i.+Cor.+x.+cha.+Children+were+in+the+figure+%28for+both+men+and+women+went+through+with+their+children%29.+Ergo+the+apostles+did+not+deny+baptism+unto+the+children.+The+custom+%26+manner+of+the+scripture+%28which+custom+and+manner+is+used+almost+among+all+nations%29+is+not+to+rehearse+by+name%2C+women+%26+children%2C+and+yet+nevertheless+it+doth+include+them%2C+for+in+the+name+of+the+father+of+the+family%2C+or+of+the+good+man+of+the+house%2C+all+his+whole+family+is+comprehended%2C+as+in+the+chief+or+head.+If+this+were+not%2C+women+should+be+in+no+small+jeopardy%2C+if+therefore+they+were+not+of+god%2C+because+that+they+be+not+circumcised.+All+these+things+are+done%2C+by+the+means+%26+help+of+a+figure+that+is+called+Synecdoche.%0A%0AThe+sixth+argument+shall+be+taken+out+of+the+manifest+and+express+testimonies+of+the+apostles.+The+apostles+did+baptise+all+whole+households+and+families%2C+ergo+they+did+baptise+children+also%2C+for+the+children+are+in+the+number+of+the+family+or+household.+This+we+do+prove+by+the+xvii+of+Gene.+For+Abraham+doth+circumcise+all+the+male+children+that+were+in+his+house.+For+he+understood+the+promise+of+God%2C+that+saith.+I+shall+be+thy+God%2C+%26+the+God+of+thy+seed.+Likewise+in+the+new+Testament%2C+when+the+goodman+of+the+house%2C+had+herd+%26+believed+the+gospel%2C+that+is+to+say%2C+that+God+was+his+God%2C+%26+the+God+of+his+seed+also%2C+he+caused+all+them+that+were+in+his+house+both+great+and+small%2C+to+be+baptized.%0A%0AThus+the+apostles+did+baptize+whole+households+and+families.+That+the+children+do+pertain+unto+the+father%E2%80%99s+household+%26+family%2C+it+is+plain+%26+manifest+by+the+xii.+of+Exodus+%26+ii.+of+the+Acts%3A+this+do+I+inculcate+%26+beat+the+oftener+into+men%E2%80%99s+heads%2C+because+that+I+see+the+Anabaptists+to+be+at+this+point+that+they+do+exclude+the+children+from+the+family+%26+household.+for+they+can+not+deny+but+the+whole+households+were+baptized+by+the+Apostles.+But+who+doth+not+see%2C+that+this+cometh+of+mere+contention%3F%0A%0AFor+though+they+could+prove+that+there+were+no+children+at+all+in+the+families+%26+households%2C+that+the+apostles+did+baptise%2C+yet+had+they+not+proved+that+all+families+or+households+were%2C+or+be+without+children%3A+wherefore+we+do+make+again+our+argument+after+this+manner.+The+Apostles+baptized+all+whole+households%2C+ergo%2C+they+did+baptise+children%2C+saith+the+children+are+the+principal+%26+chief+part+of+the+family+%26+household.%0A%0ABut+let+us+put+the+case%2C+that+there+were+no+children+in+those+families+%26+households%2C+that+the+Apostles+did+baptise%2C+yet+do+they+pertain+%26+belong+to+the+household%2C+%26+are+reckoned+in+it%2C+and+if+there+had+been+any%2C+they+would+have+baptized+them.+For+they+did+baptise+the+whole+household.+The+fault+then+should+not+have+been+in+the+Apostles+nor+in+the+children%2C+that+their+were+not+baptized%3A+but+this+had+been+the+cause+that+they+had+been+baptized%2C+because+that+there+were+none%3A+For+if+they+had+had+children+they+would+have+baptized+them.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+A+most+sure+and+strong+defence+of+the+baptism+of+children%2C+against+%5Bthe%5D+pestiferous+sect+of+the+Anabaptists%2C+trans.+John+Heron+%28Worcester%3A+John+Oswen%2C+1551%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c2272def6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c2272def6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/15/henry-bullinger-on-the-apostles-and-infant-baptism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[I]t is the fault of our people, they turn the Gospel into the Law; and we may say, Whosoever seeks to be saved by his Baptism, he falls off from Christ.

[…]

The man that thinks the very outward work of Baptism, the very outward work of receiving a Sacrament will justify him, doth as much dishonour God, as a Jew that thought circumcision, or the sacrifices did justify him.</p></blockquote>

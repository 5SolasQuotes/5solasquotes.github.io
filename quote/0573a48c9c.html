<main class="wrap"><figure class="quote" id="q-0573a48c9c" data-kw="">
<blockquote><p>But what art thou, except that which, as the highest of all beings, alone exists through itself, and creates all other things from nothing? For, whatever is not this is less than a thing which can be conceived of. But this cannot be conceived of thee. What good, therefore, does the supreme Good lack, though which every good is? Therefore, thou are just, truthful, blessed, and whatever it is better to be than not to be. For it is better to be just than not just; better to be blessed than not blessed.</p></blockquote>

</figure><figure class="quote" id="q-4eae98ce2e" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The third way is taken from possibility and necessity, and runs thus. We find in nature things that are possible to be and not to be, since they are found to be generated, and to corrupt, and consequently, they are possible to be and not to be. But it is impossible for these always to exist, for that which is possible not to be, at some time is not. Therefore, if everything is possible not to be, then at one time there could have been nothing in existence. Now if this were true, even now there would be nothing in existence, because that which does not exist only begins to exist by something already existing. Therefore, if at one time nothing was in existence, it would have been impossible for anything to have begun to exist; and thus even now nothing would be in existence—which is absurd. Therefore, not all beings are merely possible, but there must exist something the existence of which is necessary. But every necessary thing either has its necessity caused by another, or not. Now it is impossible to go on to infinity in necessary things which have their necessity caused by another, as has been already proved in regard to efficient causes [see on Causation above]. Therefore we cannot but postulate the existence of some being having of itself its own necessity, and not receiving it from another, but rather causing in others their necessity. This all men speak of as God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

<blockquote><p>Let this truth be fixed in the heart of every backsliding believer. The Lord restores the soul gently. The moment He discovers to it its sin, He conveys some token of His pardoning mercy; the balm is applied the moment the wound is given; the remedy is at hand the moment the distemper is discovered. There is a tenderness, an unutterable tenderness, in the heart and hand, in the mercy and the method of the Lord’s recovery of His child, which only He can feel. See it in the case of David. How did God bring his sin to remembrance? By the chastising rod? by heavy judgment? by severe expressions of displeasure? No; none of these were His messengers: but He sent a kind, tender, faithful prophet to discover to him his awful backsliding; and the astounding words, “Thou art the man,” had scarcely died away upon his ear, before he pours in this healing balm, “The Lord also hath put away thy sin, thou shalt not die.”

Oh, what gentleness, what tenderness, are thus shown in the Lord’s restorings of His wandering child! From whom could this have been expected but from Him whose nature and whose name is love—from whom, but Him who could thus speak to His backsliding Ephraim: “Is Ephraim my dear son? is he a pleasant child? for since I spoke against him, I do earnestly remember him still; therefore my bowels are troubled for him: I will surely have mercy upon him, saith the Lord.” (Jer. 31:20). This gush of tenderness towards a poor, returning, backsliding soul could only have had its dwelling-place in the heart of Jehovah.

All real return of a backsliding soul is through Jesus. Jesus is God’s great door of approach to His throne. No other entrance will conduct us to the golden scepter; no other will bring us to the holy of holies. Thus has the Holy Spirit unfolded this truth: “Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, His flesh; and having an High Priest over the house of God; let us draw near.” Oh, blessed Door of return for a poor, backsliding, heart-broken believer! A crucified Savior, in whom God is well pleased, and for whose sake He can receive the sinner, and put away his sin, can welcome the backslider, and heal his backsliding.</p></blockquote>

<blockquote><p>8. They differ [effectis] in the effects of both. The former covenant sheweth what is just, fit, and meet to be done, but ministereth no strength, and therefore man that was under it did not actually keep it; the first covenant never brought salvation to any one soul that was under it; but now this gospel covenant is a quickening spirit, conferreth grace, assisteth all who are under it, and hath brought thousands to heaven, it never faileth of attaining the end, in its own nature it brings life and happiness, 2 Cor. iii. 6—9. Heb. vii. 19. The former is a ministration of condemnation and death, consequentially because man cannot keep it; this other is a ministration of the Spirit, righteousness and salvation; the former never saves, the latter never finally condemns, but always saves such as are sincerely, and perseveringly within the compass of it.

9. They differ [adjuncto durationis] in the adjunct of duration. The former covenant is antiquated and superseded by the latter, and such as are within the new covenant, are “not under the law, but under grace,” and so are “delivered from the curse of the law; those are dead to the law, who are married to Christ.” The new covenant is perpetual and unalterable, it shall continue to the end of time, as it commenced near the beginning of time, as it was designed before all time; “For ever, O Lord, thy word is settled in heaven,” it reacheth from eternity, and to all eternity; it was laid in the eternal councils of God, before the world began, and will continue as to its efficacy, when there will be no world; God hath fixed this way of salvation, and will not repent, or retract it.

10. The old covenant and new differ [sponsore] as to the admission of a surety, the former had none, the latter hath; this indeed is the chief difference betwixt the two covenants. As to the former, the whole weight of this massy fabric of man’s happiness was laid on man’s shoulders, who though he was of a giant strength by creation, yet he was but a creature, and if God put no trust in his servants, yea his angels he charged with folly, how short must man needs be? who though he was perfect in his kind, yet not immutably perfect, and to our sorrow we feel he lost that happiness: but now God hath “laid help upon one that is mighty,” even the right hand of omnipotency hath strengthened him; “I will preserve thee, saith God, and give thee for a covenant of the people, to stablish the earth.”

This, this is the distinguishing characteristic of this glorious dispensation; this forms the Jachin and Boaz of the house of God; this only is the pearl of price that enricheth and adorneth the gold ring of the gospel covenant; this rendereth God approachable by man; this is the rainbow round about the throne; this is what rendereth the state of covenanted souls safe and durable, and elevateth the second covenant so many degrees above the first: “By so much,” saith the apostle, “was Jesus made a surety of a better testament,” Heb vii. 22; and therefore was it better, because it is in Jesus Christ, this better surety; and now the flames of the burning mount are quenched, the piercing sword has lost its edge, the blackness, darkness, and tempests are removed; Moses may draw near, and not exceedingly fear and quake; people may endure that which is commanded, for it is ordained in the hands of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Bonds Renewed</cite>, (1687) in The Whole Works of the Rev. Oliver Heywood, B.A. (5 vols, Idle: John Vint, 1826), 4: 17-19.</span></figcaption>

<blockquote><p>The 14th Chapter of Ecclesiastical doctrine is of the Lord’s keys, of which he says to Peter, I will give thee the Keys of the Kingdom of Heaven, and these keys are the peculiar function or Ministry and administration of Christ his power, and his holy Spirit; which power is committed to the Church of Christ, and to the Ministers thereof, unto the end of the world: that they should not only by preaching publish the holy Gospel, although they should do this especially, that is, should shew forth that Word of true comfort, and the joyful message of peace, and new tidings of that favor which God offers, but also that to the believing and unbelieving, they should publicly or privately denounce and make known, to wit, to them His favor, to these his wrath, and that to all in general, or to everyone in particular, that they may wisely receive some into the house of God, to the communion of Saints, and drive some out from thence, and may so through the performance of their Ministry, hold in their hand the Scepter of Christ his Kingdom, and use the same to the government of Christ his Sheep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, The Confession of Bohemia, which Gillespie quotes approvingly on, p.154</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The 14th Chapter of Ecclesiastical doctrine is of the Lord’s keys, of which he says to Peter, I will give thee the Keys of the Kingdom of Heaven, and these keys are the peculiar function or Ministry and administration of Christ his power, and his holy Spirit; which power is committed to the Church of Christ, and to the Ministers thereof, unto the end of the world: that they should not only by preaching publish the holy Gospel, although they should do this especially, that is, should shew forth that Word of true comfort, and the joyful message of peace, and new tidings of that favor which God offers, but also that to the believing and unbelieving, they should publicly or privately denounce and make known, to wit, to them His favor, to these his wrath, and that to all in general, or to everyone in particular, that they may wisely receive some into the house of God, to the communion of Saints, and drive some out from thence, and may so through the performance of their Ministry, hold in their hand the Scepter of Christ his Kingdom, and use the same to the government of Christ his Sheep.”

— George Gillespie, Aaron’s Rod Blossoming, The Confession of Bohemia, which Gillespie quotes approvingly on, p.154">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+14th+Chapter+of+Ecclesiastical+doctrine+is+of+the+Lord%E2%80%99s+keys%2C+of+which+he+says+to+Peter%2C+I+will+give+thee+the+Keys+of+the+Kingdom+of+Heaven%2C+and+these+keys+are+the+peculiar+function+or+Ministry+and+administration+of+Christ+his+power%2C+and+his+holy+Spirit%3B+which+power+is+committed+to+the+Church+of+Christ%2C+and+to+the+Ministers+thereof%2C+unto+the+end+of+the+world%3A+that+they+should+not+only+by+preaching+publish+the+holy+Gospel%2C+although+they+should+do+this+especially%2C+that+is%2C+should+shew+forth+that+Word+of+true+comfort%2C+and+the+joyful+message+of+peace%2C+and+new+tidings+of+that+favor+which+God+offers%2C+but+also+that+to+the+believing+and+unbelieving%2C+they+should+publicly+or+privately+denounce+and+make+known%2C+to+wit%2C+to+them+His+favor%2C+to+these+his+wrath%2C+and+that+to+all+in+general%2C+or+to+everyone+in+particular%2C+that+they+may+wisely+receive+some+into+the+house+of+God%2C+to+the+communion+of+Saints%2C+and+drive+some+out+from+thence%2C+and+may+so+through+the+performance+of+their+Ministry%2C+hold+in+their+hand+the+Scepter+of+Christ+his+Kingdom%2C+and+use+the+same+to+the+government+of+Christ+his+Sheep.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aaron%E2%80%99s+Rod+Blossoming%2C+The+Confession+of+Bohemia%2C+which+Gillespie+quotes+approvingly+on%2C+p.154&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67e7455814.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67e7455814.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/george-gillespie-on-the-sincere-free-offer-of-the-gospel/#:~:text=The%2014th%20Chapter%20of%20Ecclesiastical%20doctrine,the%20government%20of%20Christ%20his%20Sheep&amp;text=The%2014th%20Chapter%20of%20Ecclesiastical%20doctrine%20is%20of&amp;text=same%20to%20the%20government%20of%20Christ%20his%20Sheep" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8bcd639db3" data-kw="">
<blockquote><p>What remains for sinners, that they may be personally and savingly in covenant with God, is not, as parties contractors and undertakers, to make a covenant with him for life and salvation; but only, to take hold of God’s covenant already made from eternity, between the Father and Christ the second Adam, and revealed and offered to us in the gospel, Isa. lvi. 4, 6. I have no design hereby to disparage our covenants made for national reformation by our godly progenitors, and commonly called the national covenant, and solemn league and covenant, on which God set the seal of his good pleasure in the experience of many. These and the like are covenants of duties, consequential enough to the taking hold of God’s covenant of grace.

Neither would I discourage any serious souls, from taking hold of God’s covenant of grace, for eternal life and salvation to themselves, with all the awful solemnity of the most express words, yea, and of writing and subscribing it with their hands; which is commonly called personal covenanting. But I would have all to beware of a practical corrupting of the covenant of grace, by making covenants of their own, upon such and such terms, which they will fulfil for life and salvation. The carnal Jews mistaking the design of the giving of the law, did so corrupt the covenant of grace; looking for life and salvation, not for the sake of the promised seed alone, but for their obedience, such as it was, to the moral and ceremonial laws.

And thus many, thinking that eternal salvation is proposed to them in the word upon the condition of faith, repentance, and sincere obedience to God’s law, do consent to these terms, and solemnly undertake to perform them: just binding themselves to such and such duties, that God may save their souls : and so they make their covenant. And while they can persuade themselves, that they perform their part of the covenant, they look for life and salvation thereupon. This doth quite overturn the nature of the covenant of grace: for “to him that worketh, the reward is not reckoned of grace, but of debt,” Rom. iv. 4; and “if it be of works, then it is no more grace,” chap. xi. 6.

The sinfulness of this practice is great, as overlooking Christ, the great undertaker and party-contractor by the appointment of the Father; and putting themselves in his room, to do and work for themselves for life. And the danger of it must needs be great, as laying a foundation to bear the weight of their salvation, which divine wisdom saw to be quite unable to bear it. The issue whereof must be, that such covenanters shall lie down in sorrow. So the apostle determines, Gal. v. 4, “Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 430-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Of Admonition, to take heed how we vilifie or contemne this Law of God, either doctrinally, or practically. Doctrinally, so the Marcionites, and the Manichees, and Basilides; whereof some have said, it was carnall, yea that it was from a Devil, and that it was given to the Jews for their destruction because it’s said to work wrath, and to be the instrument of death. And those opinions and expressions of the Antinomians about it are very dangerous. What, shall we revile that which is God’s great mercy to a people? Because the Jews and Papists do abuse the Law, and the works of it to justification, shall it not therefore have its proper place and dignity?

Take heed therefore of such phrases, An Old-Testament-spirit, and, His Sermon is nothing but an explication of the Law: For it ought much to rejoyce thee, to hear that pure and excellent image of Gods holiness opened. How mayest thou delight to have that purity enjoyned, which will make thee loath thy self, prize Christ and Grace more, and be a quick goad to all holiness? And if you say, Here is nothing of Christ all this while: I answer That is false, as is to be proved, if the Law be not taken very strictly: And besides, the Law and the Gospel are not to be severed, but they mutually put a fresh relish and taste upon each other. And shall no mercy be esteemed, but what is the Gospel? Thou art thankfull for temporall mercies, and yet they are not the Gospel; but this is a spiritual mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians</cite>, (London, 1647), pp 152-3 emphasis added.</span></figcaption>

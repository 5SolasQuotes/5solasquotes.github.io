</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 18, ‘Understand well the necessity of your Communion with all the Universal Church, and wherein it consists, and how far to be preferred before your Communion with any particular Church’</cite>, pp. 115-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-42dc7236d2" data-kw="">
<blockquote><p>Fourthly, the signs that difference a true Church from a false, do not primarily belong to a particular congregation, but to the Church-catholic-visible, viz. profession of the true faith, the administration of the true ordinances of God, the Word and sacraments; for therein all the whole Church agree, and is thereby distinguished from those that are without, not from those that are within. This is no note to know this or that particular church by, from another, for it is common to the universal Church, it distinguishes not among themselves, but from the general common opposite: the heathen, or the gross heretic. A man being lead into a vault where were the skulls of many dead men, and understanding that Alexander’s skull was there, desired his guide to show him that; his guide told him it was that skull with the hollow eye holes and with the gristly nose, and with futures crossing the brain pan, and when the man replied that they had all so, yea says his guide, there is no difference between kings and other men’s skulls when they are dead. So if any man should ask you or me which is the church of Ipswich, Dedham or Colchester, it were a folly to say it is the Church where the word of God is preached and sacraments administered, and that profess Jesus Christ to be crucified, dead and buried, risen again, and ascended into Heaven, for so do all the Church catholic, but I must give some other notes to distinguish any of them, for these are not distinctive, because common. Therefore the signs of the true Church belong primarily to the whole, secondarily to particular parts thereof, and are therefore not distinctive to the parts. That which is primary to any thing is distinctive to that thing, but that which is secondary and common is not distinctive from other particulars of the like kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, p. 29</span></figcaption>

</figure><figure class="quote" id="q-cf8d9e31f7" data-kw="">
<blockquote><p>Its a wide mistake that a presbyterian Church has its formal essence from a voluntary, actual combination in such bounds, or such a circuit more or less. That is not a pillar of presbyterian Churches. For their near association, by dwelling where they may edify or scandalize one another, gives them right to be an associated Church; not simply habitation, but the habitation of such and such professors in covenant with God, baptized and giving themselves up in profession to Christ as disciples, before there be a formal consent, they are obliged to associate: yea, nor does that voluntary combination make a presbyterial Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658)</cite>, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-d4defa13d0" data-kw="">
<blockquote><p>Profession of Christianity is every man’s Church-title. No man is to prove the sincerity of his own profession; nor may the Church require such proof at his hands; For how can a man prove to another the sincerity of his own heart? But the fuller testimony he gives of it, the better it is: And therefore none should refuse to make his own profession, as fully credible to the church as he is able; nor is the church to be blamed for enquiring after the fullest credibility, so be it they do it but ad melius esse [to the better existence], and not ad esse [to the existence of it]; not laying his title upon it, nor refusing him for want [lack] of it. But every profession as such is credible in some degree, which is not disproved. Because men are, under God, the only competent judges of their own hearts: and the belief of one another is the ground of human converse: And it is an injury to any man to account him a liar, without sufficient proof. He that will disprove a man’s profession must prove first that he does not tolerably understand what he says; secondly, or that he speaks not seriously, but in jest; or not voluntarily, but in hypocrisy by constraint, or for some by end: Thirdly, or that he contradicts his own words by some more credible words or deeds. And if you never yet thus disproved men’s profession of Christianity before the pastors of the church and yet cry out against the pastors for admitting them, you are not true reformers, but disorderly mutineers and peevish censurers in the Church of Christ. Christ’s orders and men’s right, and all church-justice, must not be trodden down and sacrificed to your humor and arbitrary way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 16</cite>, pp. 112-13</span></figcaption>

— Richard Baxter, The Cure of Church Divisions… (London, 1670), pt. 1, Direction 16, pp. 112-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProfession+of+Christianity+is+every+man%E2%80%99s+Church-title.+No+man+is+to+prove+the+sincerity+of+his+own+profession%3B+nor+may+the+Church+require+such+proof+at+his+hands%3B+For+how+can+a+man+prove+to+another+the+sincerity+of+his+own+heart%3F+But+the+fuller+testimony+he+gives+of+it%2C+the+better+it+is%3A+And+therefore+none+should+refuse+to+make+his+own+profession%2C+as+fully+credible+to+the+church+as+he+is+able%3B+nor+is+the+church+to+be+blamed+for+enquiring+after+the+fullest+credibility%2C+so+be+it+they+do+it+but+ad+melius+esse+%5Bto+the+better+existence%5D%2C+and+not+ad+esse+%5Bto+the+existence+of+it%5D%3B+not+laying+his+title+upon+it%2C+nor+refusing+him+for+want+%5Black%5D+of+it.+But+every+profession+as+such+is+credible+in+some+degree%2C+which+is+not+disproved.+Because+men+are%2C+under+God%2C+the+only+competent+judges+of+their+own+hearts%3A+and+the+belief+of+one+another+is+the+ground+of+human+converse%3A+And+it+is+an+injury+to+any+man+to+account+him+a+liar%2C+without+sufficient+proof.+He+that+will+disprove+a+man%E2%80%99s+profession+must+prove+first+that+he+does+not+tolerably+understand+what+he+says%3B+secondly%2C+or+that+he+speaks+not+seriously%2C+but+in+jest%3B+or+not+voluntarily%2C+but+in+hypocrisy+by+constraint%2C+or+for+some+by+end%3A+Thirdly%2C+or+that+he+contradicts+his+own+words+by+some+more+credible+words+or+deeds.+And+if+you+never+yet+thus+disproved+men%E2%80%99s+profession+of+Christianity+before+the+pastors+of+the+church+and+yet+cry+out+against+the+pastors+for+admitting+them%2C+you+are+not+true+reformers%2C+but+disorderly+mutineers+and+peevish+censurers+in+the+Church+of+Christ.+Christ%E2%80%99s+orders+and+men%E2%80%99s+right%2C+and+all+church-justice%2C+must+not+be+trodden+down+and+sacrificed+to+your+humor+and+arbitrary+way.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Ch

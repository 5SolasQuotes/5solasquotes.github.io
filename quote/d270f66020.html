<main class="wrap"><figure class="quote" id="q-d270f66020" data-kw="">
<blockquote><p>But without faith it is impossible to please God.” (Hebrews 11:6)

Our Apostle speaks of faith. By this you are not to understand that historical faith, by which a man takes all to be true, firm and infallible, which God has revealed in His eternal word. A man can have that by a study of Divine truth which has a certain power of demonstration to the conscience, in convincing him that God alone is the Author of such a revelation. The devils themselves believe in this sense and they tremble. Neither are you to understand the faith of miracles; for in the great and universal day shall Christ say unto some, who in His name have cast out devils: “Depart from me, ye workers of iniquity, I know you not.” Neither understand here temporary faith; for that has no root, neither can it withstand the heat of adversity and persecution.

But understand with me that precious saving faith which is God’s priceless gift; whereby the convinced, burdened and heavy-laden sinner goes out of himself and all his own righteousness, unto Jesus, embracing Him and clinging to Him; this is the faith by which the just do live, and receive a share in all the good things of the covenant, whereby we can be saved. Our Apostle says of this saving faith, that without it men cannot please God; this being the doctrine of God’s precious word, that all which is not of faith, is sin; and hence, being displeasing to God, it speaks little comfort to those who rest upon their moral and respectable walk, or upon their profession and knowledge, without ever experiencing the heart-renewing grace of God. What do I say? It points out to them that all they do, since it issues not of faith, but displeases God, yes angers Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), xvii-iii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith.html">Faith</a></span></div>

</figure><figure class="quote" id="q-f82372b9b7" data-kw="">
<blockquote><p>5. Still, however, we see not how necessary that obedience is, unless we at the same time consider how prone our carnal nature is to shake off the yoke of God whenever it has been treated with some degree of gentleness and indulgence. It just happens to it, as with refractory horses, which, if kept idle for a few days at hack and manger, become ungovernable and no longer recognize the rider, whose command before they implicitly obeyed. And we invariably become what God complains of in the people of Israel — waxing gross and fat, we kick against Him who reared and nursed us (Deut. xxxii. 15). The kindness of God should allure us to ponder and love his goodness…</p></blockquote>

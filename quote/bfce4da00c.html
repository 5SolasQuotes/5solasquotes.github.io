<main class="wrap"><figure class="quote" id="q-bfce4da00c" data-kw="">
<blockquote><p>Wherein the wickedness of this exceeds, in that men commonly no day in the week follow so much their own ways, and delights of their own heart, as on that day, which is appointed to learn them how to cease from their owne ways, works, and delights. For a great number (and those not the worst of all) take that day to be ordeind only for ease of their body and to be a day of recreation after their travels and labors that hae been the six days before, and use it accordingly: whereas, the Lord has appointed it to the exercise of Word and prayer, that being unburdened of their worldly affairs, they might with free hearts and minds attend upon the Word, prayer, and meditation…. Thus the right use and end of the Sabbath is clean altered, and not that only, but changed into a practice most contrary to the institution thereof. For being appointed to be… the market day of the soul, to make provision for the days following…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knewstub.html">John Knewstub</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the Twentieth Chapter of Exodus</cite>, (1577), pp. 72–73, as quoted in James T. Dennison, Jr., The Market Day of the Soul: The Puritan Doctrine of the Sabbath in England, 1532–1700 (Lanham, MD: University Press of America, 1983), pp. 24-25 Knewstub (1544–1624)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53fccf7f2e" data-kw="">
<blockquote><p>…[by] the abrogation of these ceremonies [of preparing manna the day before and not kindling a fire in the wilderness on the Sabbath by the Israelites] ought not Christians to turn into surquedry [arrogance] and excess of feasting (as too many do) so abusing their christian liberty: but to be used with all sobriety, such as may not hinder, but help the holy spiritual duties of this day by a due refreshing of the body, for necessity, not for superfluity. … So that the whole worship and service of God, and his saving knowledge for man’s salvation (to speak nothing of bodily refreshing and works of charity for the relief of the poor) having a necessary dependance, as touching the external means, upon the due observation of the Fourth Commandment in the morality of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law &amp; the Gospel Reconciled</cite>, … (London: Slatter, 1631), pp. 40-41</span></figcaption>

</figure><figure class="quote" id="q-148fd6d0dc" data-kw="">
<blockquote><p>…young men who would ‘endure long and hard labor in so much that after twelve hours hard work they will go in the evening to football, stoole ball, cricket, prison-base, wrestling, cugel throwing, or some such like vehement exercise.&#x27;” 7 Richard Baxter maintained that the argument from lack of spare time on week-days was a “sad argument to be used by them that by racking of rents do keep them (laboring people) in poverty.”8 The Puritan protest against Sabbath profanation was also a protest against overwork on the other six days of the week. But the truth is, it is not the minds of poor laboring men, that are overworked and tired on week-days, but it is their bodies; and therefore there is no recreation so suitable to them as the ease of the body, and the holy and joyful exercise of the mind, upon their Creator, and their Redeemer, and their everlasting rest.9 1 Bownd, Sabbathum Veteris, p. 271; cf. Dudley Fenner, A Short and Profitable Treatise, of lavvful and unlavvful Recreations; William Perkins, 1558-1602: English Puritanist, ed. by Thomas F. Merrill (Nieuwkoop, 1966), pp. 217-22 with extracts from Perkins’ The Whole Treatise of Cases of Conscience, Book 3. 2 Elton, An Exposition of the Ten Commandments, pp. 54-56; George Walker, The Doctrine of the Holy Weekly Sabbath (London, 1641), p. 157; Richard Baxter, The Divine Appointment of the Lord’s Day, pp. 440, 444-445. 3 Cf. Nicolas Bifield (Byfield), The Beginning of the Doctrine of Christ, or, A Catalogue of Sinnes (London, 1636), p. 63. 4 For a survey of the relative truth of this point, see Carl Bridenbaugh, Vexed and Troubled Englishmen, 1590-1642 (New York, 1968), pp. 109-118. 5 John Dod and Robert Cleaver, A Plaine and Familiar Exposition of the Ten Commandments (London, 1628), p. 140. 6 Percy Scholes (The Puritans and Music in England and New England(London, 1934), pp. 104-111) mentions the provisions of a bill presented to Parliament in 1647 which allowed every other Tuesday to be designated as a holiday. Scholes’ judicious treatment of the Puritan attitude toward recreation is refreshing as well as accurate; cf. also pp. 302-331. Compare Hugh Martin, Puritanism and Richard Baxter (London, 1954), pp. 101-106. 7 Bridenbaugh, Vexed, p. 115. 8 Baxter, Divine Appointment, p. 444. 9 Ibid., p. 445.</p></blockquote>

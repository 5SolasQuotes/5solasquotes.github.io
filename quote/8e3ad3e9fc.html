<main class="wrap"><figure class="quote" id="q-8e3ad3e9fc" data-kw="">
<blockquote><p>5. In so doing God does all that belongs to Him to do as Legislator: For it must be understood that here He speaks those words ‘that the world by Him might be saved’ not as absolute-Lord merely or properly, but as Rector per Leges [a Governor through laws]; And it belongs to Him as Legislator only to propound salvation to man as his end: and to promise it on his conditions, and prescribe those conditions and command man to perform them: and to threaten him with the loss of that end (of salvation) if he perform them not. But to give faith, which is the condition itself, does not belong so God as Legislator. (No man living can claim the first act of faith, or effectual grace thereto, from God by any promise that He has made): But He gives it as Dominus absolutus [an absolute Lord], and as one that may do with his own as he list. So that it is Finis prescriptus et conditionaliter datus [the end prescribed and conditionally given], that is here spoken of; and not Finis Decretus [the end decreed] to be by God eventually infallibly accomplished. It is the end of God’s Law and Legislative Will, and so of God as mere Legislator or Rector per Leges: and not of his decretive will de eventu [of the event], and of God as absolute Lord above Laws, without them disposing of his own. (The prediction of events does collaterally and secundum quid [according to that] belong to his Law: but not per se and directly.) And 6. Consider that if it be never so much denied that God has properly a conditional will de rerum eventu [respecting the event of things], yet it is beyond all question true that He has a conditional will de debito [of debt or obligation] (officii, Præmii et Pænæ [of office or duty, reward and punishment]) and so his Law is conditional most commonly. He has constituted the Debitum pramii [debt of reward], the dueness of salvation on condition of believing, loving and sincerely obeying Christ. And therefore they must nor deny conditional promises and threatnings, though they deny conditional, decrees. This I add, because I know they here usually answer that God intends no end conditionally, but where He intends also the condition itself, that so it may be equivalent to absolute: But He intends as Legislator that faith shall be the prescribed means to glory, and glory the end promised to all that perform that condition; and so conditionally gives it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared</cite>, (London: Salusbury, 1694), pp. 305-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-840df9d4d5" data-kw="">
<blockquote><p>It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God’s Serious &amp; Unfeigned Ardency of Desire that we do what is our Duty’ from Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London 1647), pp. 443-45 (irregular pagination: colophon lll2-lll3) &amp;, pp. 440-42 (colophon: Kkk4-Lll1)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-b414c636c8" data-kw="">
<blockquote><p>Shall it be said that sin does not displease God; that He has no will against sin; it is not repugnant to his will? Yes; it is to his revealed will, to his law. But is that an untrue revelation? His law is not his will itself, but the signum [sign], the discovery of his will. Now, is it an insignificant sign? A sign that signifies nothing? Or to which there belongs no correspondent significatum [signification]? –nothing that is signified by it? Is that which is signified (for sure no one will say it signifies nothing) his real will, yea or no? Who can deny it? That will, then (and a most calm, sedate, impassionate will it must be understood to be), sin and consequently the consequent miseries of his creatures, are repugnant unto. … Therefore, it seems out of question, that the holy God does constantly and perpetually, in a true sense, will universal obedience, and the consequent felicity of all his creatures capable thereof; i.e. He does will it with simple complacency, as what were highly grateful to Him, simply considered by itself. Who can doubt, but that purity, holiness, blessedness, wheresoever they were to be beheld among his creatures, would be a pleasing and delightful spectacle to Him, being most agreeable to the perfect excellency, purity, and benignity of his own nature, and that their deformity and misery must be consequently unpleasing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, Appendix, “How God is said to Will the Salvation of them that Perish”</cite>, pp. 386-8</span></figcaption>

<blockquote><p>Many more effectual reasons are produced by our divines for the denial of this natural affection in God [necessarily resulting in sending Christ for the human race, Jn. 3:16] in the resolution of the Arminian distinction (I call it so, as now by them abused) of God’s antecedent and consequent will, to whom the learned reader may repair for satisfaction: so that the love mentioned in this place is not that natural affection to all in general, which is not:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu, or the Death of Death in the Death of Christ</cite>, … (London: W.W., 1648), bk. 4, ch. 2, p. 203</span></figcaption>

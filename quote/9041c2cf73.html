<blockquote><p>6. OBJECT. “To make adherence to these covenants, and an unlimited approbation of every tenet and act of the reformers, in entering into and maintaining them, necessary to admission to church privileges, renders your terms of communion very complex and unwieldy. And as many of the documents are now involved in obscurity, through the lapse of time, and the inaccuracy of records, a considerable part must be believed implicitly, and rested upon the fallible testimony of men.”

PERHAPS it may be admitted, that our terms of church communion could well enough bear some simplification, and amendment. We never believed them to be perfect. – With respect to an unlimited approbation of our venerable reformers, this we never require. We would wish to be followers of them as far as they were followers of Christ. We would call no man master, with regard to the articles of our faith. To the law and to the testimony of God, we would look for the sanction of all our religious principles, and approve of our ancestors, only as far as their conduct was agreeable to that unerring rule.

We adhere to our present religious system, not because it was adopted by our ancestors, but because we believe it to be agreeable to the word of God, and consequently ought to be adopted by all nations, wherever the scriptures have been revealed. We admire their faithfulness and valiant contendings, and hold ourselves bound to go and do likewise – As to the charge of implicit faith, it will, I trust, appear unfounded. Some knowledge of the history of any society, is necessary previous to a junction with it. Upon the man who would connect himself with any particular society of men, independently of this knowledge, the charge of implicit faith may justly devolve. This is necessary to form an accurate view of the ground on which the society stands. Particular parts of its history may be so interwoven with its constitution and laws, that the knowledge of the former is necessary to appreciate the value of the latter. With these, it is the business of every one, who intends connecting himself with the society, to be acquainted. Just so in our church admissions. We do not make anything a term of communion, but what is founded on the word of God. And when we find a man totally ignorant of our ecclesiastical history, we consider him unqualified to be an accurate judge of our church standing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-b-wylie.html">Samuel B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The obligation of covenants. A discourse</cite>, (Glasgow, 1803), pp 37-8.</span></figcaption>

<blockquote><p>The terms of Communion in the Reformed Presbyterian Church are certainly more comprehensive than those in force in any other denomination. It is necessary that all who become members acknowledge the inspiration and infallibility of the Old and New Testaments; the agreeableness of the Confession of Faith and Catechisms (Larger and Shorter) with the Word of God; the divine right of Presbyterianism; the perpetual obligation of the National Covenant and Solemn League and Covenant; practical dissent from all national constitutions that ignore the Lord Jesus Christ as King of nations, and the duty of adorning the doctrine of God our Saviour by a life of godliness. No Church in the world has a larger creed for membership. […]

The popular cry now is for a brief creed, and the avowed object of this cry is that larger numbers may be led into the membership of the Church. The more comprehensive and intensive the creed the fewer must the members of the Church be; the fewer and less explicit the articles of the creed the more numerous will be the members. A creed with many articles is said to be a stumbling-block in the way of those without, to burden the Church and diminish her influence. It is true, doubtless, that a large creed is the occasion of much unpopularity meanwhile, but the adoption of the policy implied in the objection would abolish all creeds, however brief and narrow. […] To remove any truth from the creed of a Church is to strip her of part of the armour with which she is to gird herself for the duty required of her by her great Commander-in-chief. It is to limit and narrow the area on which she stands, and so bind her arms – her powers and influence. “The faith which was once for all delivered unto the saints” is one body; it is a perfect unity; and the Church that attempts to mutilate that perfect body incurs a dread responsibility. Her offence against the Lord is aggravated when this deed is perpetuated under the profession of breadth and enlargement. When the policies of ecclesiastical procedure have the peacock feathers of liberality and charity, with which they have been adorned, plucked off, they stand revealed as vultures which, with unrestrained appetite, would devour the whole body of revealed truth, and reduce the Christian and the Church to a condition of lamentable leanness – the mere skeletons of Christians and Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-kerr.html">James Kerr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterianism: its special claims</cite>, (Belfast, 1895), pp 5-6.</span></figcaption>

</figure><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, pp. 566-67</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.”

<blockquote><p>In our national and social affairs a wholesome, timely, and needed reaction has begun to set in against the false catholicity that was undermining the public welfare. Patriotism and statesmanship have begun to deal at various points with the question whether we have not swung open somewhat too widely the doors of our national hospitality.

Our loud invitation—”Ho, every one!”—has gone beyond the limits of public safety. We are watching somewhat more closely the immigrants across the two great oceans. We begin to question whether we are equal to the entertainment, government and assimilation of such a mixed multitude, who fall a-lusting so soon and so grossly after liberties and indulgences that are so strange, intolerable and abhorrent to us.

We object to the emptying upon our shores of the poorhouses and prisons and slums and lazarettos of the Old World; we send back the imported refuse, and hold the importers responsible. Economists, and not demagogues of labour only, are writing on our statute-books restrictions upon the unlimited importation of foreign labour. Propositions are pending, or are awaiting introduction in our national Senate, against the free admission of anarchists and the deluded converts of Mormon emissaries.</p></blockquote>

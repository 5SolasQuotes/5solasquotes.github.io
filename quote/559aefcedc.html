<main class="wrap"><figure class="quote" id="q-559aefcedc" data-kw="">
<blockquote><p>Since our author deals so much in authorities” (says Mr. Wilson), “I shall give him two testimonies upon this head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f016b59e9" data-kw="">
<blockquote><p>But yet it’s an error to hold that if any unjustly condemn other churches, it is a renunciation of that condemned church-state to have communion with them that condemn. Who would have thought the two separating extremes had so agreed in their principles? This is just the very core of the evil of the book of the contrary party which I here answer. Alas! how few Churches on earth have not peevishly condemned one another: it may be for Easter-day, for the choice of a bishop, as the Donatists (striving whose bishop was the right one): The case of the [early Church groups, the] Novatians, Audians, Luciferians and even of most in East and West are sad instances: And will such censoriousness unChurch them and forbid us communion with them? This is plain revenge and to curse them that curse us and abuse them that abuse us. I like Calvin ‘s spirit better than this, who said, “Though Luther should call me a devil, I would call him the excellent servant of God.”* Too many Lutherans now renounce communion with the Calvinists, who yet renounce not communion with them. * John Calvin, Letters of John Calvin, ed. Jules Bonnet (Philadelphia: Presbyterian Board of Publication, 1900), letter 122, to Bullinger (1544), p. 433.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-41bfd5bf9a" data-kw="">
<blockquote><p>If our parliament found it such an insupportable grievance and burden, it must needs be that they acknowledged it such, upon such solid grounds of reason and law as are of a standing nature. And in this case, the inclination (besides that it is declared general since the Reformation, and this is supposed grounded upon the Gospel’s reforming light) is nothing else than what the Law of God, of Nature and Nations, the love of true national and Christian liberty prompts unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-93d8008fc2" data-kw="">
<blockquote><p>We do believe and own, that Jesus Christ is the only Head and King of his Church; and that he has instituted in his Church officers and ordinances, order and government, and not left it to the will of man, magistrate or Church to alter at their pleasure; and we believe this government is neither prelatical nor congregational, but presbyterian, which now, through the mercy of God, is established amongst us; and believe we have a better foundation for this our Church government, than the inclination of the people or laws of men, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

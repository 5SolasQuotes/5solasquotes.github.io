<blockquote><p>But farther, while the maintenance of Christian integrity among all classes is essential to the prosperity of the trade and commerce of a nation, we wish to draw attention to the fact, that its prevalence is especially necessary among the employed classes. If a comparison were admissible in such a case, it might be maintained that it is even more necessary among them than among the class of employers.

Among the latter, a higher secular education, enlarged knowledge of the world, and the influence of public opinion, often operate in sustaining personal integrity where true religion is wanting. But the employed classes ordinarily are not subject to these extraneous influences. If they possess not Christian principles, founded on religious knowledge and maintained by Sabbath observances, there is nothing to preserve them from becoming careless, dishonest, profligate, and unworthy of confidence.

It need not be asked, Could either the production or interchange of manufactures flourish, where, through the neglect of religion and its Sabbaths, this has become the prevalent character of workmen, artisans, overseers, or agents? Universal experience has declared it to be impossible. Trade and commerce must sooner or later decline, wherever the employed classes, through want of early education, over-work, and neglect of the Sabbath, are permitted to sink in the scale of morality and religion.

It is from a conviction of the truth of this statement that Britain has, from time to time, had recourse to various legislative expedients, in order to elevate the character of her employed population. One only of these may be adverted to here, from its connection with our present subject. I refer to the lessening of the hours of labour on the Saturday, evidently with the view of enabling certain working-classes to wind up their weekly dealings, and arrange their outdoor family affairs, in order that there may be no temptation to encroach on the leisure and the duties of the Sabbath.

But it may well be asked, How comes it that the legislature, or rather the nation, so considerately secures a portion of the Saturday for a large section of her employed population, and yet persists in condemning another large section to lose the benefit even of the Lord’s day itself? Is it not strangely inconsistent to compel the many thousand officials connected with railways and the post-office to labour on the Sabbath, to the whole of which day God has given them an absolute right, at the very same time that other classes are relieved from their workshops and manufactories on a part, of the Saturday, for which indulgence no such claim can be pleaded?

The inconsistency and impolicy of such a course become still more obvious, when it is remembered, that the class who are thus cut off from the full enjoyment of the blessed Sabbath, who are prevented from devoting themselves, in the midst of their families, to the religious exercises of this “Pearl of days,” and whose moral and religious character is thereby to a certain extent impaired, are the very class on whose fidelity and uprightness one of the most important operations of commercial activity depends for its success. What is more essential to the prosperous prosecution of trade than the faithful transmission of its correspondence?

And yet, as a nation, we blindly and perversely intrust this operation to persons whose fidelity we at the same time undermine by compulsory labour on the Sabbath. We force them on that day to leave their domestic circle, to attend at their post of weekly labour, to receive, weigh, assort, take money for, convey, and, in some thousand localities, deliver letters, to the violation of the rest of that day so authoritatively enjoined by God, and to the neglect of their religious duties, on which their integrity is alone based; for it can never for a moment be admitted, that the design of the Sabbath, as embodied in the fourth commandment, is complied with, when merely the hour or two occupied m public worship is left free.

Ought not this day, therefore, to be given, whole and entire, to this important class of public functionaries? Could the nation do anything more essential to uphold the moral and religious character of these men, on whom commercial intercourse and prosperity so much depend, than secure to them what God has expressly declared to be their right — the free and uninterrupted enjoyment of Sabbath rest and Sabbath ordinances?

One step, at least, ought to be taken without delay. Let the post-office officials in every town in the kingdom enjoy the same privilege of an unbroken Sabbath, which their brethren in labour and responsibility enjoy in London. No inconvenience from such an arrangement is experienced in that immense emporium of trade and commerce, whose population now equals that of the entire kingdom of Scotland only a few years ago. And how can any other city consistently demand, as necessary to their interests, what the merchants of that vast metropolis have so frequently and so decidedly repudiated as unnecessary, and even injurious?</p></blockquote>

<blockquote><p>There is, therefore, a powerful call on all who love the Lord Jesus Christ in sincerity, to strive and pray for the triumphs of the cross, for the extension of Christ’s cause. My friends, the great Head of the Church has committed, in some measure, into the hands of his believing people, the interests of his kingdom—the diffusion of his religion. He does not look for success in their public exertions exclusively; for how shall they conquer the pride of human wisdom—how shall they pull down the temples of idolatry—how shall they burst asunder the shackles of superstition—how shall they overthrow the lengthened and long-maintained reign of ignorance, error, prejudice, corruption, and vice! That is impossible.

But he calls upon them to be fellow-workers with Him in the glorious cause; to go forth in his name, and, relying on his strength, and animated with the spirit of faith and prayer, and girded with the armour of righteousness, he summons them to the conflict—he calls on them to fight the battles of the Lord. And oh! were their zeal, and their faith, and their love, proportioned to the magnitude of the work, and the goodness of the cause, and the encouragements they possess, under the banners of the Captain of Salvation, they should go forth conquering and to conquer—one should chase a thousand, and two should put ten thousand to flight.

In the early ages of Christianity, the activity, the devotedness, and the prayerfulness of Christians, were essential to the evangelizing of the world, as needful in the Divine economy as the miracles that accompanied the preaching of the Apostles; and shall these be less necessary now that these supernatural gifts are withdrawn and have ceased—shall their duty be still imperative, and yet their faith fail, their zeal flag, their efforts become feeble, and their supplications faint—shall they relax, shall they intermit, now that Peter ceases to strengthen the brethren and to feed the flock, now that James and John are withdrawn from the field of labour and conflict, now that Paul and Barnabas have ceased to struggle and strive for the cause of Zion’s King? Surely not.

But it may be asked, What can individual Christians do? What can they do? They can pray and cry aloud—they can plead the honour of Christ’s name—they can remember God’s covenant promises, and witness their fulfilment—they can bear in mind what God did in the generations of old, and pray that the arm of the Lord would awake and put on strength, and cause light to arise on the dreary waste. They can urge, with intensity, this prayer, “Let thy kingdom come.” What Christian cannot do this, and what Christian, animated with love to Christ, and convinced of the value of the gospel, and the need of salvation to the perishing sinner, does not do this?</p></blockquote>

<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. …

2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse.

3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity.

4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’

5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>

<blockquote><p>He [Baynes] subsequently discusses the difference of the words in terms of the manner of singing. He does say that a spiritual song might be one which is framed according to the Scripture (Baynes, [ed. London, 1658,] p. 505), but makes no suggestion that this is to be used in an ordinary public worship context. When he comes to “the sum of the verse,” he speaks of “singing both in private and publick, which this Scripture and Col. 3:16 do commend;” but where he speaks of the church service he confines his terms to “Psalms”—”and all things, Psalms, Prayers in the Church must be to edify” (p. 505). When he finally applies the passage he provides this maxim: “get the spirit of David to sing a Psalm of David” (p. 506).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Winzer, ‘Westminster and Worship Examined</cite>, Matthew Winzer, ‘Westminster and Worship Examined: a Review of Nick Needham’s Essay on the Westminster Confession of Faith’s Teaching Concerning the Regulative Principle, the Singing of Psalms, and the Use of Musical Instruments in the Public Worship of God’ from The Confessional Presbyterian #4 (2008), p. 264</span></figcaption>

<blockquote><p>Transgressions of the law of property are on this principle punished by the demand for restitution, which is compensative to him who has suffered from theft or robbery, together with such additions as are necessary to indemnify him for the loss he may have temporarily sustained, and for the trouble he may have had in obtaining redress of his wrong. Thus, by the law of God, a thief was compelled to restore fourfold.

Those offences, again, which consist in destroying the virtue, order, or happiness of society – those acts which are directed against what is essential to the well-being of all around – and for which no sacrifice of personal service, no payment of money, no loss of liberty, can compensate, are to be punished with death; that is, with the forfeiture of the power which has been so abused, that the individual may never be able to repeat the crime. Thus treason, adultery, blasphemy, &amp;c., are by the divine law visited with capital punishment, because they are directed against the very first principles of law, government, and society, whether these be human or divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craig.html">Robert Craig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theocracy or the principles of the Jewish religion and polity adapted to all nations and times</cite>, (Edinburgh, 1848), pp 282-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-569592563e" data-kw="">
<blockquote><p>We must love our Neighbour as our Selves, for he is made like us in the Image of God. Therefore honour all Men, and therefore love the Brotherhood. Have we not all one Father, has not One God created us? And have not Saints One Redeemer &amp; Sanctifier, whose Image is renewed on them all! The End of the Commandment is Charity (the Love of God and of our Neighbour) out of a pure Heart, a good Conscience and Faith unfeigned.

Say not, Who is my Neighbour? Let Humanity be found in us, for the sake of that Image of God wherein Man was created. We must love the Stranger, for the Lord loveth Him. Contempt of Men is Contempt of God, and Cruelty to Men is odious to God. So is all Injustice and Unrighteousness. The last Injury to Man is in his Life, and this is forbidden from the Beginning, and revenged by God, for this Reason, For in the Image of God made He Man! therefore whoso sheddeth Man’s Blood, by Man shall his Blood be shed. No wonder that the Blood of Abel cried so from the Ground against wicked Cain, and that God has set such a Mark and Brand upon his Name for ever. Benevolence and Beneficence ever was and is the Law of Nature, of Moses and of Christ. Love is the fulfilling of the Law. As we have Opportunity let us do good to all Men, especially to the Household of Faith.

Christians are under a more special Law of Love than others, from the Knowledge of God and his Love in Jesus Christ, that great Love wherewith he has loved us; and from the Example and Law of Christ, A new Commandment give I unto you, that you love one another, as I have loved you that ye love one another. And how is this new Commandment inforced and urged on us in the New Testament? but from the Image of God restored by Grace in the Godly. Therefore we must love the Brethren, and to Godliness add Brotherly Kindness. We should be able to see God in one another, and we must love the Godly in Christ Jesus for the sake of his Spirit in them, and their Likeness to Him. As Aaron and the Elders of Israel looked on the shining Face of Moses, when he came down from the Mount, with Wonder and great Reverence. The Apostle of Love, who had lain in the Bosom of Jesus, vehemently urges the Law of Christian Love from the Image of God renewed in the Saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissertation on the image of God wherein man was created</cite>, (Boston: S. Kneeland and T. Green, 1736), pp 32-33.</span></figcaption>

</figure><figure class="quote" id="q-7f7ce76c33" data-kw="">
<blockquote><p>In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>

<blockquote><p>Some Citizens at Church prepar’d to pray; But (as they had been excommunicate) The good Church-wardens [lay grounds-keepers, regulated by Church and State] thrust them out the gate. Another country virtue I’ll repeat, The people’s charity was grown so great That whatsoever Londoner did die, In Church or Church-yard should not buried lie. Thus were they scorn’d, despised, banished, Excluded from the Church, alive, and dead, Alive, their bodies could no harbor have, And dead, not be allow’d a Christian grave: Thus was the Country’s kindness cold, and small, No house, no Church, no Christian burial. Oh Thou that on the winged winds dost sit And seest our misery, remedy it, Although we have deserv’d thy vengeance hot, Yet in thy jury (Lord) consume us not. But in thy mercies sheath thy slaying sword, Deliver us, according to thy word, Shut up thy quiver, stay thy angry rod That all the world may know Thou art our God, Oh open wide the gate of thy compassion Assure our souls that thou art our salvation. Then all our thoughts and words, and works, we’ll frame To magnify thy great and glorious Name, The ways of God, are intricate, no doubt Unsearchable, and pass man’s finding out, He at his pleasure worketh wond’rous things And in his hand doth hold the hearts of kings, And for the love, which to our king he bears, By sickness He our sinful Country clears, That he may be a Patron, and a guide Unto a people purg’d and purified.</p></blockquote>

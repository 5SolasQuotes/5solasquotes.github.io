<blockquote><p>Zanchi argues that good acts cannot prepare a man for receiving justifying grace, and he quotes and interprets several passages from Thomas as supporting his teaching against the doctrine of the Council of Trent.” (Donnelly, Calvinst Thomism, p. 451) . No Flesh Justified by the “Law”: Not Limited to Ceremonial Law Turretin quotes and references Thomas and other Romanists in support that ‘law’ in verses such as Rom. 3:20, ‘By the deeds of the law, there shall no flesh be justified,’ is not limited to only the ceremonial law. (2.641) . The First &amp; Fountain Principle of Justification is Faith Vermigli: “…we will omit this, and briefly declare, that the ancient fathers did not mislike of this word ‘only,’ the which our adversaries so greatly shun… Whom these things suffice not, let them read… Thomas, upon the third [chapter] to the Galatians [lectures 2, 3, 4, on vv. 2-12]…</p></blockquote>

<blockquote><p>Transient to a First Uncausable Efficient Cause [see pp. 38-46 of the Summary for background for 16-21] . 16. In the same class of essentially ordered causes, the series cannot be infinite, for otherwise there would be an actually infinite series of simultaneously existing dependent things, which is impossible (from conclusion 4). Hence there cannot be an infinite series of essentially ordered efficient causes. The like must be said of final causes, or of material or formal causes. 17. A circle of essentially ordered causes cannot exist as independent or uncaused in itself (conclusion 5). Since a circle of causes must always be understood of things simultaneously existing,¹ this conclusion extends to every circle of causes. ¹ “But just as the cause which gives being to something must exist in the moment when the transient thing begins to exist,² so too the reason that the transient thing persists in being must coexist as long as the transient thing continues to exist.” p. 34 ² [This is confirmed in that only something actual can actualize something potential.] 18. A material cause does not behave as matter unless the formal cause forms it and vice versa. The point is plain from the definitions of these causes [see pp. 39-40], for unless that which is composed of both exists, matter and form cannot have an inflow on the thing caused [see pp. 38 &amp; 40]. Here from follows another conclusion, namely: 19. If something has behaved as matter, something else has behaved as form, and vice versa. 20. What is not effected is not caused by a final cause. The point is plain from the definitions of each [see pp. 39-40], for the final cause is that for the sake of which the efficient cause produces the effect; therefore it causes only by mediation of the efficient cause. This conclusion can thus be formulated in another way, namely that if something depends on a final cause it also depends on an efficient cause. 21. What is not effected is not mattered or formed, or, if something is caused by a material and formal cause, it is also caused by an efficient cause. For matter and form are parts; therefore they are in themselves indifferently disposed to forming one thing. Therefore something in the order of efficient cause is required to effect this one thing. 22. If something is transient or changeable or temporal, something is effectible or able to be effected. For nothing of this sort has in itself the total reason for its existence; therefore it is from another, namely from an efficient cause; therefore it is something that can be an effect or is effectible. 23. If something is effectible, something can effect. Cause and effect are correlatives¹ so that the possibility of one involves the possibility of the other. ¹ [Correlatives are things that are by definition depedent on each other; if there is one, there must be the other. An example is: if there is a father, there must be, or have been, a son; if there is a son, there must be, or have been, a father.] 24. If some efficient cause can exist, some first efficient and uncausable thing can exist. The proof is as follows: If there is an efficient cause it is either a first efficient cause (that is, not itself effectible) or not. If it is not the first ineffectible efficient cause, there is either: a) a circle of efficient causes such that the circle as a whole is altogether independent of anything outside it, but its individual members are effected by each other, or b) there is an infinite series of efficient causes that are either i) essentially ordered or ii) accidentally ordered.¹ ¹ “Causes are said to be accidentally ordered among themselves if one depends on the other in being, but not in actually causing; hence if the first cause of such a series ceases to exist, the others can still exist and still cause. Thus a father, when grandfather and great-grandfather are dead, can generate a son.” p. 44 But a) is impossible (from conclusion 17) and so is b) i) (from conclusion 16). But b) ii) would also be impossible unless there existed something outside the series on which the whole series depends. The proof is twofold: First, that from the fact that the individual members are dependent, the series consists, as a totality, of dependent things, and so the series as a whole is dependent and thus requires some cause outside itself. Second, from the fact that if the individual causes are not simultaneously existent, [then] they begin to be and cease to be; therefore they are transient. But if something is transient, there is also something absolutely permanent and independent both as to its existence and as to its permanence (from conclusion 3). Such a being, to the extent it keeps the series in being, is also an efficient cause, otherwise it would not be altogether independent as to its permanence in being. For if it were merely a material or formal cause, it would depend on some other efficient cause so that it be formally a cause (from conclusions 18 and 21). If it were merely a final cause, it would also require an efficient cause in order to exercise its final causality (from conclusion 20). There is a confirmation from the fact that to persist in being is formally an effect, at least in its beginning. Therefore if it is an efficient cause, it is in every case the first ineffectible efficient cause. That this first efficient cause is simply uncausable is plain from conclusions 20 and 21. 25. What is ineffectible cannot be caused by a final or material or formal cause; therefore it is simply uncausable. 26. If an ineffectible being can exist, it must exist; for if it did not actually exist, it could not receive existence from a cause. So it could not in fact exist but would be simply impossible. 27. A first uncausable efficient cause actually exists. The point is plain from the fact that there is something transient, changeable and temporal (from conclusions 8, 14, 15); therefore there is an uncausable first efficient cause (from conclusions 24 to 26). It follows next that there exists at least one efficient cause. Hence if something can be transient, changeable, etc. some ineffectible efficient cause must exist as the condition sine qua non [without which: nothing] of the possibility of something else.</p></blockquote>

he+effect%3B+therefore+it+causes+only+by+mediation+of+the+efficient+cause.+This+conclusion+can+thus+be+formulated+in+another+way%2C+namely+that+if+something+depends+on+a+final+cause+it+also+depends+on+an+efficient+cause.+21.+What+is+not+effected+is+not+mattered+or+formed%2C+or%2C+if+something+is+caused+by+a+material+and+formal+cause%2C+it+is+also+caused+by+an+efficient+cause.+For+matter+and+form+are+parts%3B+therefore+they+are+in+themselves+indifferently+disposed+to+forming+one+thing.+Therefore+something+in+the+order+of+efficient+cause+is+required+to+effect+this+one+thing.+22.+If+something+is+transient+or+changeable+or+temporal%2C+something+is+effectible+or+able+to+be+effected.+For+nothing+of+this+sort+has+in+itself+the+total+reason+for+its+existence%3B+therefore+it+is+from+another%2C+namely+from+an+efficient+cause%3B+therefore+it+is+something+that+can+be+an+effect+or+is+effectible.+23.+If+something+is+effectible%2C+something+can+effect.+Cause+and+effect+are+correlatives%C2%B9+so+that+the+possibility+of+one+involves+the+possibility+of+the+other.+%C2%B9+%5BCorrelatives+are+things+that+are+by+definition+depedent+on+each+other%3B+if+there+is+one%2C+there+must+be+the+other.+An+example+is%3A+if+there+is+a+father%2C+there+must+be%2C+or+have+been%2C+a+son%3B+if+there+is+a+son%2C+there+must+be%2C+or+have+been%2C+a+father.%5D+24.+If+some+efficient+cause+can+exist%2C+some+first+efficient+and+uncausable+thing+can+exist.+The+proof+is+as+follows%3A+If+there+is+an+efficient+cause+it+is+either+a+first+efficient+cause+%28that+is%2C+not+itself+effectible%29+or+not.+If+it+is+not+the+first+ineffectible+efficient+cause%2C+there+is+either%3A+a%29+a+circle+of+efficient+causes+such+that+the+circle+as+a+whole+is+altogether+independent+of+anything+outside+it%2C+but+its+individual+members+are+effected+by+each+other%2C+or+b%29+there+is+an+infinite+series+of+efficient+causes+that+are+either+i%29+essentially+ordered+or+ii%29+accidentally+ordered.%C2%B9+%C2%B9+%E2%80%9CCauses+are+said+to+be+accidentally+ordered+among+themselves+if+one+depends+on+the+other+in+being%2C+but+not+in+actually+causing%3B+hence+if+the+first+cause+of+such+a+series+ceases+to+exist%2C+the+others+can+still+exist+and+still+cause.+Thus+a+father%2C+when+grandfather+and+great-grandfather+are+dead%2C+can+generate+a+son.%E2%80%9D+p.+44+But+a%29+is+impossible+%28from+conclusion+17%29+and+so+is+b%29+i%29+%28from+conclusion+16%29.+But+b%29+ii%29+would+also+be+impossible+unless+there+existed+something+outside+the+series+on+which+the+whole+series+depends.+The+proof+is+twofold%3A+First%2C+that+from+the+fact+that+the+individual+members+are+dependent%2C+the+series+consists%2C+as+a+totality%2C+of+dependent+things%2C+and+so+the+series+as+a+whole+is+dependent+and+thus+requires+some+cause+outside+itself.+Second%2C+from+the+fact+that+if+the+individual+causes+are+not+simultaneously+existent%2C+%5Bthen%5D+they+begin+to+be+and+cease+to+be%3B+therefore+they+are+transient.+But+if+something+is+transient%2C+there+is+also+something+absolutely+permanent+and+independent+both+as+to+its+existence+and+as+to+its+permanence+%28from+conclusion+3%29.+Such+a+being%2C+to+the+extent+it+keeps+the+series+in+being%2C+is+also+an+efficient+cause%2C+otherwise+it+would+not+be+altogether+independent+as+to+its+permanence+in+being.+For+if+it+were+merely+a+material+or+formal+cause%2C+it+would+depend+on+some+other+efficient+cause+so+that+it+be+formally+a+cause+%28from+conclusions+18+and+21%29.+If+it+were+merely+a+final+cause%2C+it+would+also+require+an+efficient+cause+in+order+to+exercise+its+final+causality+%28from+conclusion+20%29.+There+is+a+confirmation+from+the+fact+that+to+persist+in+being+is+formally+an+effect%2C+at+least+in+its+beginning.+Therefore+if+it+is+an+efficient+cause%2C+it+is+in+every+case+the+first+ineffectible+efficient+cause.+That+this+first+efficient+cause+is+simply+uncausable+is+plain+from+conclusions+20+and+21.+25.+What+is+ineffectible+cannot+be+caused+by+a+final+or+material+or+formal+cause%3B+therefore+it+is+simply+uncausable.+26.+If+an+ineffectible+being+can+exist%2C+it+must+exist%3B+for+if+it+did+not+actually+exist%2C+it+could+not+receive+existence+from+a+cause.+So+it+could+not+in+fact+exist+but+would+be+simply+impossible.+27.+A+first+uncausable+efficient+cause+actually+exists.+The+point+is+plain+from+the+fact+that+there+is+something+transient%2C+changeable+and+temporal+%28from+conclusions+8%2C+14%2C+15%29%3B+therefore+there+is+an+uncausable+first+efficient+cause+%28from+conclusions+24+to+26%29.+It+follows+next+that+there+exists+at+least+one+efficient+cause.+Hence+if+something+can+be+transient%2C+changeable%2C+etc.+some+ineffectible+efficient+cause+must+exist+as+the+condition+sine+qua+non+%5Bwithout+which%3A+nothing%5D+of+the+possibility+of+something+else.%E2%80%9D%0A%0A%E2%80%94+Allan+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52a28e625b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52a28e625b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=Transient%20to%20a%20First%20Uncausable%20Efficient,of%20the%20possibility%20of%20something%20else&amp;text=Transient%20to%20a%20First%20Uncausable%20Efficient%20Cause%20%5Bsee&amp;text=which%3A%20nothing%5D%20of%20the%20possibility%20of%20something%20else" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Another issue concerned substantial forms. Here, Voetius and others defended a neo-Aristotelian concept because they found it to be more compatible with the Physica Mosaica [Mosaic physics] than early modern alternatives. The substantial forms could not only explain the classification of ‘kinds’ in the biblical creation account, but also constituted the internal principles of activity in secondary causes. In contrast, the Cartesian mechanistic worldview with its rejection of substantial form seemed to create more difficulties than it might solve. In particular, it implied a denial of genuine secondary causality, leading either to occasionalism or Spinozistic pantheism, as Voetius noted with remarkable foresight (Van Ruler 1995; Goudriaan 2006, 113-33; Beck 2007, 65-69).</p></blockquote>

ormed Books Online</a></div>

<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

C+quaestiuncula+2%29+Voet%3A+%E2%80%9CWhether+true+fire+is+given+in+Hell%2C+or+whether+it+is+only+metaphorical%3F+It+is+not+said+and+it+is+permitted+to+be+inquired+into.+Whether+it+is+corporal+or+rather+spiritual%3F+The+question+is+inept.+Whether+it+is+of+the+same+species+with+our+fire%3F+The+question+is+curious%E2%80%A6+Is+it+an+error+of+the+Faith+to+suppose+an+incorporeal+and+immaterial+infernal+fire%3F+The+question+is+absurd.%E2%80%9D+%28Syllabus%2C+sect.+2%2C+tract+6%2C+title+6%2C+subtitle+2%2C+%E2%80%98Of+Infernal+Fire%E2%80%99%29+.+Heaven+Agreements+Saints+do+Not+See+All+Things+on+Earth+through+God+Turretin+contends+against%2C+%E2%80%9Cas+the+papists+wish%E2%80%A6+the+imaginary+mirror+of+the+Trinity%2C+which+they+feign+%28as+if+saints%2C+seeing+all+things+in+the+essence+of+God+saw+all+things+done+here%29+%5Bto+support+the+intercession+of+the+saints%5D%E2%80%A6+It+displeased+not+a+few+of+the+distinguished+papists%3A+Lombard%2C+Thomas+Aquinas+%5BSumma%2C+suppl.+92%2C+art.+3%5D%E2%80%A6%E2%80%9D+%282.43%29+.+Saints+will+See+Punishment+of+the+Damned+Leigh%3A+%E2%80%9CAquinas+has+this+question%2C+Whether+the+blessed+which+are+in+the+Fatherland+see+the+punishment+of+the+damned%3F+and+resolves+they+shall%2C+because+it+makes+to+the+perfection+of+their+blessedness%2C+%E2%80%98Opposites+placed+next+to+each+other+shine+forth+more+brightly.%E2%80%99+They+shall+perfectly+see+the+punishment+of+the+wicked%2C+that+their+blessedness+may+the+more+content+them+and+they+may+give+more+abundant+thanks+to+God.%E2%80%9D+%28System+of+Divinity%2C+p.+872%29+.+The+Heaven+of+God%E2%80%99s+Throne+Room+will+Not+be+Renovated+with+Fire+Thomas%3A+%E2%80%9C%E2%80%A6the+higher+heavens+will+not+be+cleansed+by+that+fire%E2%80%A6+The+cleansing+of+the+world+will+be+for+the+purpose+of+removing+from+bodies+the+disposition+contrary+to+the+perfection+of+glory%E2%80%A6+Peter+explains+himself+to+which+heavens+he+refers%E2%80%A6+%E2%80%98the+heavens+first%2C+and+the+earth+through+water+perished%2C+which+now+by+the+same+word+are+kept+in+store%2C+reserved+unto+fire+unto+the+day+of+judgment%E2%80%99+%282+Pet+5%3A5%E2%80%937%29%E2%80%A6+Nor+did+the+empyrean+heaven+contract+any+stain%E2%80%A6%E2%80%9D+%28Summa%2C+suppl.%2C+q.+74%2C+art.+4%29+For+the+Reformed%3A+%E2%80%98On+the+Renovation%2C+New+Heavens+%26+Earth%E2%80%99.+.+Mixed+Deification+Thomas+affirmed+a+kind+of+deification+of+heavenly+saints+with+respect+to+the+light+of+glory+and+the+beatific+vision.+Yet+for+Thomas%2C+%E2%80%9Cthe+light+of+glory%2C+like+the+habit+of+grace%2C+is+something+created.+So+in+either+state%2C+pre-+or+post-mortem%2C+deification+is+something+created.%E2%80%9D+%28p.+32%29+This+is+in+contrast+to+deification+being+grounded+in+uncreated+grace%2C+per+the+Eastern+Orthodox%2C+which+entails+the+host+of+problems+often+associated+with+the+term.+See+Richard+Cross%2C+%E2%80%98Deification+in+Aquinas%E2%80%99.+Yet+many+of+the+Reformed+were+hesitant+or+contrary+to+accepting+Thomas%E2%80%99s+exact+method+and+paradigm+of+how+saints+see+God.+See+on+the+Beatific+Vision+below.+Yet%2C+Carl+Mosser+has+found+the+concept+and%2For+terminology+of+deification%2C+in+protestant+senses%2C+in+Martin+Luther%2C+Ulrich+Zwingli%2C+Martin+Bucer%2C+Henry+Bullinger%2C+John+Calvin%2C+Richard+Hooker+and+Jonathan+Edwards%3A+%E2%80%98Deification%3A+a+Truly+Ecumenical+Concept%E2%80%99+and+%E2%80%98Recovering+the+Reformation%E2%80%99s+Ecumenical+Vision+of+Redemption+as+Deification+and+Beatific+Vision%E2%80%99.+Using+the+term+of+deification+for+growing+more+and+more+into+the+image+of+God%2C+through+beholding+Him%2C+for+all+eternity%2C+is+not+to+no+purpose.+2+Pet.+1%3A4+says+%E2%80%9Cthat+by+these%2C%E2%80%9D+including+godliness%2C+all+graces+and+the+promises+of+God%2C+including+that+of+glorification%2C+%E2%80%9Cye+might+be+partakers+of+the+divine+nature%E2%80%9D.+Ps.+17%3A15%3A+%E2%80%9CAs+for+me%2C+I+will+behold+thy+face+in+righteousness%3A+I+shall+be+satisfied%2C+when+I+awake%2C+with+thy+likeness.%E2%80%9D%0A%0A%E2%80%94+Disagreements%2C+Purgatory+is+Not+Real+%7C+Ussher%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F672ce0b2da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/672ce0b2da.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/where-reformed-orthodox-writers-agreed-disagreed-with-aquinas/#:~:text=this%20being%20a%20case%20with%20them,when%20I%20awake%2C%20with%20thy%20likeness&amp;text=this%20being%20a%20case%20with%20them%20%5B%E2%80%9Cour%20Romanists&amp;text=be%20satisfied%2C%20when%20I%20awake%2C%20with%20thy%20likeness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>7. In Corollary 1 I had said that the opinion of Taurellus and Gorlaeus about man as a being per accidens stumbles in many ways. The argument by which they are moved is such. Two beings or complete substances make one per accidens and not per se: but the body and soul of man are two complete substances. Therefore. I respond: The major is not universally true; and the minor is denied. That in the presence of the disputation itself it may be aired to many and to the end, we now cursorily indicate these hypotheses: I. That man is a species of substance and animal created into one essence or nature from soul and body, we think is implied in Gen. 3:7, 1 Cor. 15:45, compared with Gen. 1:26-27. II. Christ-Theanthropos [God-man] (in whom there are two natures or complete substances) is one per se and not per accidens: for the union of natures was made into one suppositum, [Greek]. See the theologians on the person of Christ: Much more therefore substantially and per se the union was made between the soul and body of man, which indeed are not so far distant, nor are they such complete substances as divinity and humanity. III. The true human nature of Christ would not be more one substance through itself than in the death of the same … [These articles are about Christ, man, the soul and angels] … IX. This opinion even impinges on many metaphysical dogmas… … 5. That man is not a substance nor does he directly pertain to the predication of substance: but only indirectly, and per accidens is referred to it, since he is a being per accidens and collective. 6. That one man is no more one per se, than an army, a city, etc. where there are many men collectively. 7. That consequently man cannot be defined by an essential and perfect definition. 8. That the matter and form of a composite are properly matter, and its form is the union, that is an accident, or pure mode, namely a relation. See Gorlaeus, Exercit. 14, p. 266. 9. That the union of the human soul with its body is to be sought in some mere accident from those five, and indeed in position or posture: as some seem to concede. 10. That the body is not the nature of man, but only his instrument, through which the soul existing in the body operates.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e8605bb9c3" data-kw="">
<blockquote><p>I am currently reading through the famous Decades of the Swiss Reformer, Henry Bullinger. Since Bullinger’s writings had a significant impact upon English Protestantism, they are a crucial source for understanding the theoretical framework in which the Westminster Confession was written. Although I have many more quotes from Bullinger to post, here is one that I read today:

The law of the Lord, published by the ministry of Moses, doth in the eighteenth and twentieth of Leviticus reckon up a beadrow long enough of offences as are to be punished. And lest perhaps any man think, that at this day that which Moses hath rehearsed is utterly abolished, let him give ear to St Paul, who saith: “To the just the law is not given, but to the unjust, and to sinners, to unholy and unclean, to murderers of fathers and murderers of mothers, to manslayers, to whore-mongers, to them that defile themselves with mankind, to manstealers, to liars, to perjured men, and if there by any other thing contrary to sound doctrine.” [1 Timothy 1:9-10] But apostates, idolaters, blasphemers, heretics, false teachers, and mockers of religion, do offend against the laws of religion, (and therefore ought they to be punished by the magistrate’s authority.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 357.</span></figcaption>

<blockquote><p>42nd Question, How Moses was contented with Aaron’s Answer.

1. He did not absolutely approve of his reason, as though he had done it intuita divino, by divine direction, as Cajetan: for Moses was better acquainted with God’s mind than Aaron, and there was a direct commandment, which should not have been omitted.

2. But Moses rather in human commiseration bears with Aaron’s infirmity: 1. because he saw him forced by a kind of necessity… 2. and afflication was not to be added to affliction, Osiander: and Moses found it to be of less fault than he supposed, Calvin: he did it not willingly, but of human frailty and of perplexity through grief, and therefore was to be pitied.

3. And it may be Moses deferred his further admonishing of Aaron till another time because he saw now he was in grief…</p></blockquote>

<blockquote><p>The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 142-43.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-80835e15e7" data-kw="">
<blockquote><p>The reason why St. James would not have the ceremonies buried as soon as they were dead, was because the Jews had been so long confirmed in them, and bare such a love unto them; and he would purchase concord between them and the Gentile converts; though the Gentiles should bear with some inconvenience into the bargain, as not presently using all the liberty which through Christ they had a right unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 15:20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c334192d1" data-kw="">
<blockquote><p>Why thus it is, God in the beginning authorized marriage to be betwixt man and woman, and appointed how it should be transacted, to wit, by the mutual consent, or cleaving together of each party: and enacted other rules concerning it, as touching proximity of blood, etc. And now by virtue of this his ordinance, whatever couple do accordingly contract, are joined together by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right &amp; Original of the Civil Magistrate From God</cite>, … (London, 1658), section 4 Gee (1613–1660) was an English presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-b5fc378be8" data-kw="">
<blockquote><p>Neither the husband’s consent alone or the wife’s makes a marriage, but both conjunct: So here: mutual consent makes a church-member.</p></blockquote>

</figure><figure class="quote" id="q-c50ef5a04d" data-kw="">
<blockquote><p>Further, if parents should be unwilling to allow the honorable vows of their children and proceed to abuse their power over them, they must be admonished and persuaded by a warning, prayers, and the urging first of relatives and friends, and secondly of the presbyters of the church. But if harsh parents should ignore all these, then the magistrates must interpose their authority, lest anyone by the wickedness of his parents be either kept from marriage longer than is fair or driven to a less acceptable marriage, provided that those who have such inhuman parents are not seeking to be joined with corrupt men of little honor and piety. There was a provision concerning such things even in Roman laws (Digest XXIII, 2, 19, 21, 22; Code V, 4, 12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 18, ‘Marriages should not be held valid which are contracted without the consent of those who have power over the ones who make the contract, or without suitable advisors’, pp. 323-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

%20V%2C%204%2C%2012&amp;text=Further%2C%20if%20parents%20should%20be%20unwilling%20to%20allow&amp;text=2%2C%2019%2C%2021%2C%2022%3B%20Code%20V%2C%204%2C%2012" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-515bc6a4a5" data-kw="">
<blockquote><p>We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersol.html">William Attersol</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, ch. 30, pp. 704-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

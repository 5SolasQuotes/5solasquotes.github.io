<main class="wrap"><figure class="quote" id="q-1709ebcbf5" data-kw="">
<blockquote><p>But since this sacrament [of baptism] is a solemn reception into the church of God, or rather a testimony of burghership in the heavenly city into which are enrolled all those whom God adopts for his children, above all things it is to be observed that it is not lawful to administer it except in the society of professed believers. Not that it is necessary to have a public temple, but assuredly it is indispensable that there should be a certain flock assembled, forming a body constituted as a church, and recognizing for its pastor, the person appointed to baptize. For should a child be baptized in private and without witnesses, the ceremony would in no wise correspond to the ordinance instituted by Jesus Christ, nor to the practice of the Apostles. It is then requisite that the child should be baptized in a society that keeps itself separate from the pollutions of Popery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of John Calvin, vol. 3 ed. Jules Bonnet trans. Marcus Gilchrist (Philadelphia: Presbyterian Board of Publication), Letter 368, ‘To John Paule’</cite>, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4acd1df203" data-kw="">
<blockquote><p>The same prelate pleads for the expediency of giving the Communion to the sick in private houses, because he thinks they should not want [lack] this mean of comfort: As if the wanting of the sacramental signs, not procured by a man’s own negligence or contempt, could stop or stay the comforts of the Holy Spirit. Nay, it is not so: we have seen some who received not the Communion in time of their sickness, end more gloriously and comfortably than ever we heard of any who received the sacrament for their viaticum [journey] when they were a dying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 2, 14</cite></span></figcaption>

</figure><figure class="quote" id="q-80f4c94ea9" data-kw="">
<blockquote><p>First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, ‘Private Communion’ in Answer to the Reasons for Refusal of Subscription in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 194 Cotton was an Anglican bishop.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-cc25ddb50f" data-kw="">
<blockquote><p>Herein now we disprove the papistical doctrine which allows of private masses and teaches that the priest offers up the body and blood of our Lord for the standers by; and that by the mass he applies the merit of redemption unto them that with devotion come to that sacrifice. For as there is no one word of the Lord extant that commands the priests to sacrifice or privately to apply the supper for others, or that promises anything unto them that stand by and look on it (for He says, “Do this; eat ye and drink ye all in the remembrance of me;” He says not, ‘Look upon the priests only while they be eating and drinking for you’)… … Concerning the place where the supper is to be celebrated, I find no contention has been amongst the most ancient ministers of the Church. It is read how that our Lord Jesus used the hall of a certain private man’s house. And also the apostle Paul both preached and brake bread at Troas in a certain dining-place (Acts 20)… At this present there seems no place to be more worthy or more commodious to celebrate the holy supper in, than that which is appointed for doctrine and prayer. For so have we learned of St. Paul, 1 Cor. ch. 11. Howbeit, if tyrannical power will not suffer us to have a church, what shall let us but that we may reverently celebrate the supper in honest private houses?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decades (Parker Society, 1852), 5th Decade, Sermon 9, ‘Of the Lord’s Holy Supper’</cite>, pp. 417-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

<blockquote><p>This imposing [of Church courts] takes not away judicious believing [by individuals]… If imposing were a commanding that we receive absolutely what they say, be it good, or ill, without examining [whether] the argument were concludent, as God himself requires Abraham to kill his son, Abraham was without examination to give absolute obedience, and this proves God to be Lord of the conscience, for knowing his Word to be his Word, we are not to examine it by the Scripture or Law of Nature, because if we know who speaks, we are not to examine what is spoken. But though we know who speaks among creatures, be it a prophet, an apostle, an angel, yet must we examine both who speaks and what is spoken.</p></blockquote>

</figure><figure class="quote" id="q-0c33103c99" data-kw="">
<blockquote><p>Second, there are means of a most indispensable kind to be employed in the way of explanation and instruction, counsel and persuasion, to secure the convictions and concurrence of the private members of the Church, in whatever act or declaration the rulers, in the exercise of their judicial, or legislative, or administrative functions, may find it necessary for them to perform or to adopt. Without the use of such means to carry the conscience and understanding of the members of the Church along with them in all that they do and declare, the office-bearers are not at liberty to use or enforce their peculiar power at all. And it is only when all such means have been employed and exhausted without effect, and when the members of the Church, so dealt with in the way of Christian persuasion and instruction, still refuse their concurrence, that it may be necessary and is lawful to use authority to strengthen the appeal, and to fall back upon the ultimate resource of all societies, — namely, the inherent right of the rulers to rule, and the no less inherent duty of the ruled to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1 (Edinburgh, 1868), pp. 241-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

ne</a></div>
</figure><figure class="quote" id="q-1dd146195a" data-kw="">
<blockquote><p>Sententia pastoris ligat te, pro tua salute, etiam si injusta fuerit.“ Envy cannot ascribe this to us; Calvin, Beza, yea, all our writers condemn blind obedience as brutish. … But that the magistrate is not obliged to execute the decrees of the Church without further examination, whether they be right or wrong, as Papists teach that the magistrate is to execute the decrees of their Popish councils with blind obedience and submit his faith to them, because he is a layman and may not dare to examine whether the Church does err or not, is clear:

1. Because if in hearing the Word all should follow the example of the men of Berea, not relying on the testimony of Paul or any preacher, try whether that which concerns their conscience and faith be agreeable to the Scriptures or no, and accordingly receive or reject; so in all things of discipline, the Magistrate is to try by the Word whether he ought to add his sanction to these decrees which the Church gives out for edification and whether he should draw the sword against such a one as a heretic and a perverter of souls: But the former is true: the magistrate’s practice in adding his civil sanction and in punishing heretics concerns his conscience, knowing that he must do it in faith as he does all his moral actions; Ergo [Therefore], the magistrate must examine what he practices in his office, according to the Word, and must not take it upon the mere authority of the Church, else his faith in these moral acts of his office should be resolved ultimately on the authority of the Church, not on the Word of God, which no doubt is Popery; for so the warrant of the magistrate’s conscience should not be, ‘Thus saith the Lord,’ but ‘Thus saith the Church in their decrees.’

2. The magistrate and all men have a command to try all things; Ergo, to try the decrees of the Church and to retain what is good, 1 Thess. 5:21, to try the spirits even of the Church, in their decrees, 1 Jn. 3:1.

3. We behooved to lay down this Popish ground, that 1. The Church cannot err in their decrees. 2. It’s against Scripture and reason that magistrates, and by the like reason, all others, should obey the decrees of the Church with a blind faith, without inquiring in the warrants and grounds of their decrees, which is as good Popery as magistrates and all men are to believe as the Church believes with an implicit faith; so ignorance shall be the mother of devotion; Whoever impute[s] this to us, who have suffered for non-conformity, and upon this ground, that synods can err, [and have] refused the ceremonies, are to consult with their own conscience whether this be not to make us appear disloyal and odious to magistracy in that which we never thought, far less to teach and profess it to the world.

4. Their chief reason is: The magistrate by our doctrine, by his office, is obliged:

1. To follow the judgment of the Church, and in that he is a servant or enslaved: Qui enim judicia aliorum sequi tenetur, is non regit, sed regitur, adeoque servus est, &amp; mancipium brutum eorum, quorum judicium sequi obligatur, and the magistrate (say they), as such, is neither to judge nor try what the Church decrees, but as a burrio, or hangman, [is] to execute that which the Church has decreed. But 1. I put it in form and retort it thus: They are servants and slaves who are obliged not to despise, but to hear and obey and so to follow the judgement of the prophets, the faithful pastors of Christ, preaching the Word of God soundly and orthodoxly. But not only magistrates, but all within the visible Church are obliged not to despise, but to hear and obey and so to follow the judgment of the prophets, the faithful pastors of Christ preaching the Word of God soundly and orthodoxly; Ergo, magistrates and all within the visible Church are slaves and servants. But the conclusion is absurd; Ergo, some of the premises [are absurd]; but the assumption is the Word of God: Judah was carried captive because they would not hear the prophets rising early in the morning and speaking to them. Also in the New Testament, this is true to the second coming of Christ: ‘He that heareth you, heareth me, he that despiseth you, despiseth me.’ And this, he that will not obey the servant of the supreme magistrate in that wherein he is a servant and holds forth the lawful commands of the supreme magistrate, he will not obey the supreme magistrate. The major proposition is the adversaries’; the assumption is express Scripture; let them see then to the conclusion.

2. When the adversary shall answer this argument with equal strength made against preaching and hearing the Word, they will answer their own argument made against Church-government.

3. This argument is made against synods-Popish, that cannot err, as our protestant divines object; and therefore the adversary is Popish here, not we. Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it. The other part is, they are servants and slaves who are to follow the judgement of the Church and councils with a reserve and a condition and limitation, insofar as they agree with the Word; now the major [premise] is false. 2. He that is obliged to follow the judgement of another does not rule, but is ruled; true, in that in which he follows the judgment of another. The magistrate, insofar as in matters of religion that concern his conscience, faith and practice, he follows pastors; he is not a ruler formally to those whose judgement he is obliged to follow. But in civil matters he may be, and is, a ruler to those same; for we answer to Papists who by this same argument would prove that Church-men are not subject to the magistrate, nor to civil laws: He that is a sheep is not to rule and command his shepherd; but the magistrate is a sheep and a member of the Church, and pastors and doctors are shepherds. We answer, in diverse considerations a magistrate as a magistrate in civil things, is not ruled by pastors and doctors, but he is to rule them: But a magistrate as a member of the Church, as a Christian in things that concern his conscience, is a sheep and to be ruled, [and he is] not a ruler to pastors and doctors, and so here; and therefore, non concluditur quod est [that is not concluded]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 595-9 | Ibid.:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

1. To follow the judgment of the Church, and in that he is a servant or enslaved: Qui enim judicia aliorum sequi tenetur, is non regit, sed regitur, adeoque servus est, &amp; mancipium brutum eorum, quorum judicium sequi obligatur, and the magistrate (say they), as such, is neither to judge nor try what the Church decrees, but as a burrio, or hangman, [is] to execute that which the Church has decreed. But 1. I put it in form and retort it thus: They are servants and slaves who are obliged not to despise, but to hear and obey and so to follow the judgement of the prophets, the faithful pastors of Christ, preaching the Word of God soundly and orthodoxly. But not only magistrates, but all within the visible Church are obliged not to despise, but to hear and obey and so to follow the judgment of the prophets, the faithful pastors of Christ preaching the Word of God soundly and orthodoxly; Ergo, magistrates and all within the visible Church are slaves and servants. But the conclusion is absurd; Ergo, some of the premises [are absurd]; but the assumption is the Word of God: Judah was carried captive because they would not hear the prophets rising early in the morning and speaking to them. Also in the New Testament, this is true to the second coming of Christ: ‘He that heareth you, heareth me, he that despiseth you, despiseth me.’ And this, he that will not obey the servant of the supreme magistrate in that wherein he is a servant and holds forth the lawful commands of the supreme magistrate, he will not obey the supreme magistrate. The major proposition is the adversaries’; the assumption is express Scripture; let them see then to the conclusion.

2. When the adversary shall answer this argument with equal strength made against preaching and hearing the Word, they will answer their own argument made against Church-government.

3. This argument is made against synods-Popish, that cannot err, as our protestant divines object; and therefore the adversary is Popish here, not we. Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it. The other part is, they are servants and slaves who are to follow the judgement of the Church and councils with a reserve and a condition and limitation, insofar as they agree with the Word; now the major [premise] is false. 2. He that is obliged to follow the judgement of another does not rule, but is ruled; true, in that in which he follows the judgment of another. The magistrate, insofar as in matters of religion that concern his conscience, faith and practice, he follows pastors; he is not a ruler formally to those whose judgement he is obliged to follow. But in civil matters he may be, and is, a ruler to those same; for we answer to Papists who by this same argument would prove that Church-men are not subject to the magistrate, nor to civil laws: He that is a sheep is not to rule and command his shepherd; but the magistrate is a sheep and a member of the Church, and pastors and doctors are shepherds. We answer, in diverse considerations a magistrate as a magistrate in civil things, is not ruled by pastors and doctors, but he is to rule them: But a magistrate as a member of the Church, as a Christian in things that concern his conscience, is a sheep and to be ruled, [and he is] not a ruler to pastors and doctors, and so here; and therefore, non concluditur quod est [that is not concluded]…”

— Samuel Rutherford, The Divine Right of Church Government, … (1646), pp. 595-9 | Ibid.:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSententia+pastoris+ligat+te%2C+pro+tua+salute%2C+etiam+si+injusta+fuerit.%E2%80%9C+Envy+cannot+ascribe+this+to+us%3B+Calvin%2C+Beza%2C+yea%2C+all+our+writers+condemn+blind+obedience+as+brutish.+%E2%80%A6+But+that+the+magistrate+is+not+obliged+to+execute+the+decrees+of+the+Church+without+further+examination%2C+whether+they+be+right+or+wrong%2C+as+Papists+teach+that+the+magistrate+is+to+execute+the+decrees+of+their+Popish+councils+with+blind+obedience+and+submit+his+faith+to+them%2C+because+he+is+a+layman+and+may+not+dare+to+examine+whether+the+Church+does+err+or+not%2C+is+clear%3A+1.+Because+if+in+hearing+the+Word+all+should+follow+the+example+of+the+men+of+Berea%2C+not+relying+on+the+testimony+of+Paul+or+any+preacher%2C+try+whether+that+which+concerns+their+conscience+and+faith+be+agreeable+to+the+Scriptures+or+no%2C+and+accordingly+receive+or+reject%3B+so+in+all+things+of+discipline%2C+the+Magistrate+is+to+try+by+the+Word+whether+he+ought+to+add+his+sanction+to+these+decrees+which+the+Church+gives+out+for+edification+and+whether+he+should+draw+the+sword+against+such+a+one+as+a+heretic+and+a+perverter+of+souls%3A+But+the+former+is+true%3A+the+magistrate%E2%80%99s+practice+in+adding+his+civil+sanction+and+in+punishing+heretics+concerns+his+conscience%2C+knowing+that+he+must+do+it+in+faith+as+he+does+all+his+moral+actions%3B+Ergo+%5BTherefore%5D%2C+the+magistrate+must+examine+what+he+practices+in+his+office%2C+according+to+the+Word%2C+and+must+not+take+it+upon+the+mere+authority+of+the+Church%2C+else+his+faith+in+these+moral+acts+of+his+office+should+be+resolved+ultimately+on+the+authority+of+the+Church%2C+not+on+the+Word+of+God%2C+which+no+doubt+is+Popery%3B+for+so+the+warrant+of+the+magistrate%E2%80%99s+conscience+should+not+be%2C+%E2%80%98Thus+saith+the+Lord%2C%E2%80%99+but+%E2%80%98Thus+saith+the+Church+in+their+decrees.%E2%80%99+2.+The+magistrate+and+all+men+have+a+command+to+try+all+things%3B+Ergo%2C+to+try+the+decrees+of+the+Church+and+to+retain+what+is+good%2C+1+Thess.+5%3A21%2C+to+try+the+spirits+even+of+the+Church%2C+in+their+decrees%2C+1+Jn.+3%3A1.+3.+We+behooved+to+lay+down+this+Popish+ground%2C+that+1.+The+Church+cannot+err+in+their+decrees.+2.+It%E2%80%99s+against+Scripture+and+reason+that+magistrates%2C+and+by+the+like+reason%2C+all+others%2C+should+obey+the+decrees+of+the+Church+with+a+blind+faith%2C+without+inquiring+in+the+warrants+and+grounds+of+their+decrees%2C+which+is+as+good+Popery+as+magistrates+and+all+men+are+to+believe+as+the+Church+believes+with+an+implicit+faith%3B+so+ignorance+shall+be+the+mother+of+devotion%3B+Whoever+impute%5Bs%5D+this+to+us%2C+who+have+suffered+for+non-conformity%2C+and+upon+this+ground%2C+that+synods+can+err%2C+%5Band+have%5D+refused+the+ceremonies%2C+are+to+consult+with+their+own+conscience+whether+this+be+not+to+make+us+appear+disloyal+and+odious+to+magistracy+in+that+which+we+never+thought%2C+far+less+to+teach+and+profess+it+to+the+world.+4.+Their+chief+reason+is%3A+The+magistrate+by+our+doctrine%2C+by+his+office%2C+is+obliged%3A+1.+To+follow+the+judgment+of+the+Church%2C+and+in+that+he+is+a+servant+or+enslaved%3A+Qui+enim+judicia+aliorum+sequi+tenetur%2C+is+non+regit%2C+sed+regitur%2C+adeoque+servus+est%2C+%26+mancipium+brutum+eorum%2C+quorum+judicium+sequi+obligatur%2C+and+the+magistrate+%28say+they%29%2C+as+such%2C+is+neither+to+judge+nor+try+what+the+Church+decrees%2C+but+as+a+burrio%2C+or+hangman%2C+%5Bis%5D+to+execute+that+which+the+Church+has+decreed.+But+1.+I+put+it+in+form+and+retort+it+thus%3A+They+are+servants+and+slaves+who+are+obliged+not+to+despise%2C+but+to+hear+and+obey+and+so+to+follow+the+judgement+of+the+prophets%2C+the+faithful+pastors+of+Christ%2C+preaching+the+Word+of+God+soundly+and+orthodoxly.+But+not+only+magistrates%2C+but+all+within+the+visible+Church+are+obliged+not+to+despise%2C+but+to+hear+and+obey+and+so+to+follow+the+judgment+of+the+prophets%2C+the+faithful+pastors+of+Christ+preaching+the+Word+of+God+soundly+and+orthodoxly%3B+Ergo%2C+magistrates+and+all+within+the+visible+Church+are+slaves+and+servants.+But+the+conclusion+is+absurd%3B+Ergo%2C+some+of+the+premises+%5Bare+absurd%5D%3B+but+the+assumption+is+the+Word+of+God%3A+Judah+was+carried+captive+because+they+would+not+hear+the+prophets+rising+early+in+the+morning+and+speaking+to+them.+Also+in+the+New+Testament%2C+this+is+true+to+the+second+coming+of+Christ%3A+%E2%80%98He+that+heareth+you%2C+heareth+me%2C+he+that+despiseth+you%2C+despiseth+me.%E2%80%99+And+this%2C+he+that+will+not+obey+the+servant+of+the+supreme+magistrate+in+that+wherein+he+is+a+servant+and+holds+forth+the+lawful+commands+of+the+supreme+magistrate%2C+he+will+not+obey+the+supreme+magistrate.+The+major+proposition+is+the+adversaries%E2%80%99%3B+the+assumption+is+express+Scripture%3B+let+them+see+then+to+the+conclusion.+2.+When+the+adversary+shall+answer+this+argument+with+equal+strength+made+against+preaching+and+hearing+the+Word%2C+they+will+answer+their+own+argument+made+against+Church-government.+3.+This+argument+is+made+against+synods-Popish%2C+that+cannot+err%2C+as+our+protestant+divines+object%3B+and+therefore+the+adversary+is+Popish+here%2C+not+we.+Thus+they+are+servants+and+slaves+who+are+obliged+to+follow+the+judgment+of+councils+absolutely%2C+without+limitation%3B+and+because+they+say+it%2C+whether+they+warrant+their+decrees+by+the+Word+of+God+or+not%2C+that+is+a+true+major+proposition%3A+But+now+the+assumption+is+most+false%2C+for+neither+magistrates+nor+any+other+are+to+follow+the+judgment+of+the+Church+absolutely%2C+without+limitation%2C+and+because+they+say+it.+The+other+part+is%2C+they+are+servants+and+slaves+who+are+to+follow+the+judgement+of+the+Church+and+councils+with+a+reserve+and+a+condition+and+limitation%2C+insofar+as+they+agree+with+the+Word%3B+now+the+major+%5Bpremise%5D+is+false.+2.+He+that+is+obliged+to+follow+the+judgement+of+another+does+not+rule%2C+but+is+ruled%3B+true%2C+in+that+in+which+he+follows+the+judgment+of+another.+The+magistrate%2C+insofar+as+in+matters+of+religion+that+concern+his+conscience%2C+faith+and+practice%2C+he+follows+pastors%3B+he+is+not+a+ruler+formally+to+those+whose+judgement+he+is+obliged+to+follow.+But+in+civil+matters+he+may+be%2C+and+is%2C+a+ruler+to+those+same%3B+for+we+answer+to+Papists+who+by+this+same+argument+would+prove+that+Church-men+are+not+subject+to+the+magistrate%2C+nor+to+civil+laws%3A+He+that+is+a+sheep+is+not+to+rule+and+command+his+shepherd%3B+but+the+magistrate+is+a+sheep+and+a+member+of+the+Church%2C+and+pastors+and+doctors+are+shepherds.+We+answer%2C+in+diverse+considerations+a+magistrate+as+a+magistrate+in+civil+things%2C+is+not+ruled+by+pastors+and+doctors%2C+but+he+is+to+rule+them%3A+But+a+magistrate+as+a+member+of+the+Church%2C+as+a+Christian+in+things+that+concern+his+conscience%2C+is+a+sheep+and+to+be+ruled%2C+%5Band+he+is%5D+not+a+ruler+to+pastors+and+doctors%2C+and+so+here%3B+and+therefore%2C+non+concluditur+quod+est+%5Bthat+is+not+concluded%5D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+pp.+595-9+%7C+Ibid.%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1dd146195a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1dd146195a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-implicit-faith-obedience/#:~:text=Sententia%20pastoris%20ligat%20te%2C%20pro%20tua,quod%20est%20%5Bthat%20is%20not%20concluded&amp;text=Sententia%20pastoris%20ligat%20te%2C%20pro%20tua%20salute%2C%20etiam&amp;text=non%20concluditur%20quod%20est%20%5Bthat%20is%20not%20concluded" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 251-52</span></figcaption>

<blockquote><p>…the [German] Elector of Brandenburg, John Sigismund, who celebrated Christmas in 1613 by converting from Lutheranism to the Reformed faith. This plunged his land into crisis, since most of his subjects were Lutheran and unwilling to follow their prince’s religious wanderings. John Sigismund refrained from ordering them to do so, but did impose several measures aimed at reducing Lutheran-Reformed animus. Among these were requirements for confessional parity at Brandenburg’s flagship university at Frankfurt, Oder, as well as stringent prohibitions against confessional polemicizing in sermons. This was a kind of forced ecumenism, and it set important precedents. In time, Brandenburg, which eventually became Prussia, created the first Reformed-Lutheran “united” church. It, too, was ordered from on high. In 1817, two centuries after his forefather’s momentous conversion, King Frederick William III of Prussia ordered Lutherans and Reformed to form one single church body, the Prussian Union of Churches. As the rising Prussia swallowed more and more of its neighboring German territories, its union model expanded as well, soon covering roughly half the Protestant territories in Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-g-appold.html">Kenneth G. Appold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Lutheran-Reformed Relations: A Brief Historical</cite>, p. 59</span></figcaption>

<blockquote><p>Till far on in the second half of the century of the Reformation there were, properly speaking, only Evangelicals or Protestants; and the names Lutherans, Zwinglians, Calvinists were by all authorities of that time entirely repudiated. (Zanchius in a letter complains of people applying to themselves such names.)… in Frankfort [Germany] those who held the views of the Swiss, by the advice of Dathen, let their children be baptized by the city clergy who held Lutheran opinions; and when Calvin in September, 1556, was called as arbitrator to Frankfort, the wine of honor was poured out to him. Moreover, the states of the empire that were inclined to the Swiss doctrine were not excluded, in the year 1555, in the compact entitled ‘the Religious Peace;’ and there was then in Germany only one Protestant Church which in that Peace received on the basis of the Augsburg Confession toleration, or rather equal authorization… The doctrine of predestination was nto then matter of dispute. (…Calvin writes in 1560 to Zerkint of Bern, that up to this year no one had taken exception to the doctrine of predestination (v. Op. Omnia, Strassburg edition, Vol. xvii, 238)…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Till far on in the second half of the century of the Reformation there were, properly speaking, only Evangelicals or Protestants; and the names Lutherans, Zwinglians, Calvinists were by all authorities of that time entirely repudiated. (Zanchius in a letter complains of people applying to themselves such names.)… in Frankfort [Germany] those who held the views of the Swiss, by the advice of Dathen, let their children be baptized by the city clergy who held Lutheran opinions; and when Calvin in September, 1556, was called as arbitrator to Frankfort, the wine of honor was poured out to him. Moreover, the states of the empire that were inclined to the Swiss doctrine were not excluded, in the year 1555, in the compact entitled ‘the Religious Peace;’ and there was then in Germany only one Protestant Church which in that Peace received on the basis of the Augsburg Confession toleration, or rather equal authorization… The doctrine of predestination was nto then matter of dispute. (…Calvin writes in 1560 to Zerkint of Bern, that up to this year no one had taken exception to the doctrine of predestination (v. Op. Omnia, Strassburg edition, Vol. xvii, 238)…”

<blockquote><p>14. The inward offer is a spiritual enlightening, whereby those promises are propounded to the hearts of men, as it were by an inward word. John 6:45, Whosoever has heard of the Father and has learned, comes to me. Eph. 1:17. That He might give unto you the spirit of wisdom and revelation, the eyes of your mind being enlightened, that ye may know what is that hope of your calling.

15. This also is sometime, and in a certain manner granted to those that are not elected. Hebrews 6:4 &amp; 10:29; Mat. 13:20.

16. If anyone oppose himself out of malice to this illumination, he commits a sin against the Holy Ghost, which is called unpardonable, or unto death. Heb.6:6 &amp; 10:29; 1 John 5:16; Matt 12:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (d. 1633), bk 1, ch. 26</span></figcaption>

<blockquote><p>2. The apostle, 1 Jn. 5:16, speaks of a sin unto death, that we are not to pray for one guilty of that; This has much troubled the learned; The ancients, they thought it was not an absolute prohibition of all [persons] to pray for such, but only that eminent men might do it; They thought for an ordinary Christian to pray for such sinners, it would be high presumption; As it’s not for everyone in the court to speak for some heinous offender but a special favourite; When God said, though Noah, Job and Daniel should pray for that people, He would not hear them (Eze. 14:14); This implied that they were nearer to God’s ear and might prevail sooner than others; Though this exposition be old, yet the text seems to be absolutely prohibitive; and so Augustine said that if we knew who had sinned that unpardonable sin against the Holy Ghost, we were no more to pray for him than for one damned in hell:</p></blockquote>

<blockquote><p>This was opposed by the decree of the National Synod which met at Charenton in 1644, which sanctioned and confirmed the doctrine received in our churches concerning the imputation of Adam’s first sin and the hereditary corruption flowing upon all. The words of the decree are as follows: “Whereas a report has been made to the Synod of certain writings, printed and manuscript, by which the nature of original sin is made to consist solely in the hereditary corruption, originally residing in all men, but the imputation of the first sin of Adam is denied; the Synod condemns the aforesaid doctrine so far as it restricts the nature of original sin to the mere hereditary corruption of Adam’s posterity, excluding the imputation of the first sin by which he fell; and, under the penalty of censures of all kinds, forbids all pastors, professors and others who may treat this subject, to depart from the common opinion of all Protestant churches, which, besides corruption, have always acknowledged the aforesaid imputation to the whole posterity of Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.9</span></figcaption>

</figure><figure class="quote" id="q-4a3de6de98" data-kw="">
<blockquote><p>It is good for us to mind what Christ says of great sinners, Mt. 12:31-32, ‘I say unto you, all manner of sin and blasphemy shall be forgiven unto men.’ When Christ says, ‘all manner of sin and blasphemy shall be forgiven unto men,’ and excepts none but the blasphemy against the Holy Ghost, no, not a word spoken against the Son of Man Himself, we may well think a word spoken or a deed done against ourselves may be pardoned; and that it may be so, [we] should pray for it; and we may hope for a good effect of it. Stephen’s prayer, when he was stoned (Acts 7:60), probably had an influence on Paul’s conversion. St. John tells us, 1 John 5:16, ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death.’ So that unless a man could be assured that another has sinned that sin which is unto death, he may, nay, he ought to pray for him: ‘He shall ask, etc.’ In any case where there is but an ‘if so be,’ or a ‘who can tell,’ or a ‘perhaps,’ there is room left for prayer. In that mighty tempest that arose in the sea to arrest Jonah as he was going to Tarshish, which was like to have broken the ship, he is called on to arise and call upon his God, Jon. 1:6, ‘If so be that God will think upon us, that we perish not.’ Their case was very doubtful, yet they pray. So when Jonah had delivered his message to the Ninevites, ‘Yet forty days and Nineveh shall be overthrown,’ they cry mightily unto God, saying, ‘Who can tell if God will turn and repent?’ Jon. 3.9. Simon Magus was in a very bad state, in the gall of bitterness and the bond of iniquity, and Peter perceived it; yet he bids him repent and pray, if perhaps the thoughts of his heart might be forgiven him; and can we think, that he who put him upon praying for himself, would not pray for him too, especially considering Simon requested it of him? Acts 8:21, 24. Calvin in location: Si fieri possit, ab ipsis inferis extrahendi nobis sunt homines. [“If it were possible, men ought to be drawn by us even from the very depths of hell.”]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-millward.html">John Millward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved</cite>, ... (London: Dunton, 1683), Sermon 19, ‘How ought we to do our Duty towards others, though they do not theirs towards us?’, p. 564 Millward (d. 1684) was an English puritan put out at the Great Ejection.</span></figcaption>

<blockquote><p>Between these two texts [at the beginning and ending of 1 Jn. 5], occur the words we wish to explain: ‘There is a sin unto death: I do not say that ye shall pray for it.’ Must not ‘the sin unto death,’ be that against which he wished to fortify the saints; I mean apostasy? What! you will say, is a man lost without remedy who has denied the truth; and is every one in the sad situation of those for whom the apostle prohibits prayer? God forbid, my brethren, that we should preach so strange a doctrine; and once more renew the Novatian severity! There are two kinds of apostates, and two kinds of apostasies: there is one kind of apostasy into which we fall by the fear of punishment, or on the blush of the moment, by the promises Satan makes to his proselytes. There is another, into which we fall by the enmity we have against the truth, by the detestable pleasure we take in opposing its force. It were cruel to account the first of these offenses, ‘a sin unto death;’ but the Spirit of God prompts us to attach this idea to the second. There are likewise two kinds of apostates. There is one class, who have made only small attainments in the knowledge of the truth; weak and imperfect Christians, unacquainted as yet with the joys and transports excited in the soul by a religion, which promises remission of sin, and everlasting felicity. There is another, on the contrary, to whom God has given superior knowledge, to whom He has communicated the gifts of miracles, and whom He has caused to experience the sweetness of his promise. It would be hard to reject the first; but the apostle had regard to the second. Those, according to St. John, who have committed the ‘sin unto death,’ are the persons who abjure Christianity, after the reception of all those gifts. In the primitive church, where some were honoured with the endowment of discerning spirits, there probably were brethren who could discern the latter apostates from the former. … Now, if you have been attentive to all the considerations we have just advanced: if you have understood the explanations we have given of the several texts, you may form a correct idea of the unpardonable sin. You may know what this crime was, at least, in the time of the primitive church. It was denying, hating and maliciously opposing the truth at the moment they were persuaded it proceeded from God. Two classes of men might commit this crime in the apostolic age. First, those who had never embraced Christianity; but opposed its progress in defiance of rational conviction, and the dictates of conscience. This was the sin of the Pharisees, who maliciously ascribed to the devil miracles, which they knew could have God alone for their author. Secondly, those who had embraced the gospel, who had been baptized, who had received the gift of miracles, and experienced all the graces enumerated in the text. This was the sin of those, who, after conversion, abjured the truth, and pronounced against Jesus Christ the anathemas which his enemies, and particularly the Jews, required of apostates. These St. Paul had in view, in the words of our text [Heb. 6:4 ff.], and in the tenth chapter of this epistle. Of this St. John also spake, when he said, ‘there is a sin unto death.’ Hence the sin described in these three passages, and the sin against the Holy Ghost, is the same in quality, if I may so speak, though diversified in circumstances: we have, consequently, comprised the whole under the vague appellation of unpardonable sin.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e6c6b7f3a6" data-kw="">
<blockquote><p>Hitherto we have spoken of the perfection of Gods nature: Now followeth the life of GOD, by which the Divine Nature is in perpetual action, living, and moving in it self. Psal. 42. 2. My soule thirsteth for God, even for the living God, when shall I come and appeare before the presence of God? Heb. 3. 12. See there be not at any time in any of you an evel heart to depart [note] from the living God. The divine Nature, is especially in perpetual operation by three attributes, the which do manifest the operation of God towards his creatures. These are his Wisdom, Will, and Omnipotency. The wisdom or knowledge of God, is that by the which God doth, not by certaine notions abstracted from the things themselves, but by his own essence: nor successively and by discourse of reason, but by one eternal and immutable act of understanding, distinctly and perfectly know himself, and all other things, though infinite, whether they have been or not. Mat. 11. 27. No man knoweth the son but the Father, nor the Father but the [note] Son, and he to whom the Son will reveale him. Heb. 4. 13. There is nothing created, which is not manifest in his sight: but all things are naked and open to his eyes, with whom we have to do, Psal. 147. 5. His wisdom is infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, (1616), 12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3dea9d2390" data-kw="">
<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 5, pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/holiness-and-justice.html">Holiness and Justice</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

h%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c7d46fa28c" data-kw="">
<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Danger of Prosperity Discovered in Several Sermons upon Prov. 1:27</cite>, (London: Aylmer, 1685), p. 57</span></figcaption>

</figure><figure class="quote" id="q-a3ebf2ba79" data-kw="">
<blockquote><p>Both Piscator of late, by evidence of Scripture, and Bradwardine long before, by demonstration of reason, have proved that no will in God is conditionate, quoad actum volentis [as to the act of the one willing]; all the conditions are found, quoad res volitas [with respect to the things willed]. And indeed, though the purposes of God are absolute, yet his promises are therefore conditionate, because they are conformed to the manner of God’s operation with man: For, as God works in all things agreeable to their natures, so in man He uses to work agreeable to his nature. And therefore, albeit his purpose be absolute to bring them to grace and glory, to faith, repentance and salvation; yet He allures them to faith and repentance by promises and threatnings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646) | 3rd Doubt, p. 63</span></figcaption>

<blockquote><p>The former will [of command] is called by the [Medieval] Scholastics, on the authority, it is thought, of Hugh of St. Victor, voluntas signi, whether because it is signified by some sign, like a word, precept, interdict, etc.; or because it signifies God’s will as the effect and adjunct of it…</p></blockquote>

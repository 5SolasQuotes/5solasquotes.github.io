<blockquote><p>20. Then he shows the greatness of Christ’s power when he says, whom he has appointed heir of all things; for as it says: and if a son, an heir also through God (Gal 4:7).

But in Christ are two natures, namely, the divine and the human: insofar as he is the natural Son, he is not an appointed heir, but he is so naturally; but inasmuch as he is man, he has become the Son of God: concerning his Son who was made to him of the seed of David (Rom 1:3). Indeed, as a man, he has been appointed heir of all things, just as he has become a true son of the Father: all power is given to me in heaven and in earth (Matt 28:18), and it extends to every creature that he has taken under his rule. It extends, therefore, not only to one type of man, but to all, i.e., both Jews and gentiles: ask of me and I will give you the gentiles for your inheritance (Ps 2:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 1, L. 1, 20.</span></figcaption>

<blockquote><p>The controversy over Aristotelianism hardly ended with Aquinas’s work, much less with his death. In 1270, while Aquinas was still alive, Stephen Tempier, the bishop of Paris, had condemned several propositions associated with Averroism, though these did not include any defended by Aquinas. But after Aquinas’s death, in 1277, Tempier went on to condemn 219 propositions, some of which were clearly to be found in Aquinas. This led Albert the Great to come to Paris to defend his former student, and other Dominicans also threw themselves into the task of upholding the doctrine of their fellow friar. Indeed, the study of Aquinas was to become mandatory within the order. This Dominican defense and consolidation of Aquinas’s teaching beginning just after his death is sometimes taken by historians to constitute the beginning of the first of three periods in the history of Thomism. That it was successful is evidenced by the facts that Aquinas was declared a saint by Pope John XXII in 1323, and that two years later, in 1325, Tempier’s condemnations of 1277 were revoked by his successor. Just as Dominicans had generally defended Aquinas, members of the Franciscan order had been among his fiercest critics. The rivalry between the two orders would only become more bitter as a result of the influence of the Franciscan thinkers John Duns Scotus (c. 1266-1308) and William of Ockham (c. 1287-1347). Scotus and Ockham tended toward voluntarism, which emphasizes God’s will over his intellect and thus makes his actions more impenetrable to our rational understanding than they are on Aquinas’s account. Ockham is famously associated with nominalism, which denies the existence of universals. From the Thomistic point of view, these doctrines threaten to undermine the intelligibility of the world and the rational foundations of ethics and of our knowledge of God. Aquinas’s positions were ably defended against them by the likes of John Capreolus (1380-1444), who became known as princeps Thomistarum or ‘foremost Thomist.’ A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009)</span></figcaption>

<blockquote><p>Since, however, we have frequently to mention the words essence and substance, we must determine the meaning of essence, lest in discussing facts we prove ignorant of the signification of our words. Essence is a reality which is, or the reality of those things from which it is, and which subsists inasmuch as it is permanent. Now we can speak of the essence, or nature, or genus, or substance of anything.

And the strict reason why the word essence is employed is because it is always. But this is identical with substance, because a thing which is, necessarily subsists in itself, and whatever thus subsists possesses unquestionably a permanent genus, nature or substance. When, therefore, we say that essence signifies nature, or genus, or substance, we mean the essence of that thing which permanently exists in the nature, genus, or substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 12 in Nicene and Post-Nicene Fathers 2, 9: 7.</span></figcaption>

<blockquote><p>Nor do I wish the philosophical‑theological exercises to be omitted or neglected by those approaching theology. For although philosophy is often abused — from which the Apostle found it necessary to warn us: “See that no one takes you captive through philosophy and empty deceit” (Col. 2:8) — yet both the ancients and the moderns, by their example and use, have shown that its right use is of great help, not only in all other sciences, arts, and the whole life of man, but also in theological doctrine.

Here, as in all things, there are limits, beyond which or short of which it is not right to stand. He who measures matters of faith by the principles of philosophy, who thinks its rules hold in theology as in nature, or who uses its acuteness, subtleties, and distinctions for barren and cold speculation, for contention and vain glory — such a man, by understanding, comes to understand nothing. Meanwhile, he who does not think the mind ought to be adorned by philosophy as the tongue is by literature, who does not wish the inner speech of the mind, as well as the outward speech of the mouth, to be directed and polished by art, or who thinks something sounds ill merely because it comes from philosophy — such a man seems to me no less in error.

For although philosophy does not have the same rule, dignity, or necessity as theology, yet in forming and expressing concepts, in penetrating the subtleties of things and questions, in refuting the evasions of adversaries, it greatly helps not to be entirely without it. We require a moderate use of philosophy in theological matters; we entirely forbid its dominion.

Luther said aptly in his Disputation on the Simplicity of God and the Trinity of Persons: “When dialectic argues that something does not square with its rules, we must say to it, ‘Let the woman keep silence in the Church.’” The Fathers use a similar image of Hagar the handmaid, who is commanded to be cast out of the house when she behaves too wantonly and wishes to rule her mistress at her own pleasure.

When philosophy rises too imperiously against theology, seeks a dictatorship, or tries to confine the most august truth within its own bars and rules, it must be expelled; and where it tends toward contention, it must be modestly avoided. For truth, wherever it is, has this first: that it is chaste; then that it is peaceable (James 3:17). But that which has bitter zeal and strife may be called “wisdom,” but it is earthly, sensual, and demonic, says the Apostle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Theology. Compiled from the Best Authors</cite>, (Leiden: Franciscus Moyardus, 1658), epistle dedicatory. (Translated by Copilot.)</span></figcaption>

Luther said aptly in his Disputation on the Simplicity of God and the Trinity of Persons: “When dialectic argues that something does not square with its rules, we must say to it, ‘Let the woman keep silence in the Church.’” The Fathers use a similar image of Hagar the handmaid, who is commanded to be cast out of the house when she behaves too wantonly and wishes to rule her mistress at her own pleasure.

When philosophy rises too imperiously against theology, seeks a dictatorship, or tries to confine the most august truth within its own bars and rules, it must be expelled; and where it tends toward contention, it must be modestly avoided. For truth, wherever it is, has this first: that it is chaste; then that it is peaceable (James 3:17). But that which has bitter zeal and strife may be called “wisdom,” but it is earthly, sensual, and demonic, says the Apostle.”

— Johannes Hoornbeeck, Institutes of Theology. Compiled from the Best Authors, (Leiden: Franciscus Moyardus, 1658), epistle dedicatory. (Translated by Copilot.)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor+do+I+wish+the+philosophical%E2%80%91theological+exercises+to+be+omitted+or+neglected+by+those+approaching+theology.+For+although+philosophy+is+often+abused+%E2%80%94+from+which+the+Apostle+found+it+necessary+to+warn+us%3A+%E2%80%9CSee+that+no+one+takes+you+captive+through+philosophy+and+empty+deceit%E2%80%9D+%28Col.+2%3A8%29+%E2%80%94+yet+both+the+ancients+and+the+moderns%2C+by+their+example+and+use%2C+have+shown+that+its+right+use+is+of+great+help%2C+not+only+in+all+other+sciences%2C+arts%2C+and+the+whole+life+of+man%2C+but+also+in+theological+doctrine.%0A%0AHere%2C+as+in+all+things%2C+there+are+limits%2C+beyond+which+or+short+of+which+it+is+not+right+to+stand.+He+who+measures+matters+of+faith+by+the+principles+of+philosophy%2C+who+thinks+its+rules+hold+in+theology+as+in+nature%2C+or+who+uses+its+acuteness%2C+subtleties%2C+and+distinctions+for+barren+and+cold+speculation%2C+for+contention+and+vain+glory+%E2%80%94+such+a+man%2C+by+understanding%2C+comes+to+understand+nothing.+Meanwhile%2C+he+who+does+not+think+the+mind+ought+to+be+adorned+by+philosophy+as+the+tongue+is+by+literature%2C+who+does+not+wish+the+inner+speech+of+the+mind%2C+as+well+as+the+outward+speech+of+the+mouth%2C+to+be+directed+and+polished+by+art%2C+or+who+thinks+something+sounds+ill+merely+because+it+comes+from+philosophy+%E2%80%94+such+a+man+seems+to+me+no+less+in+error.%0A%0AFor+although+philosophy+does+not+have+the+same+rule%2C+dignity%2C+or+necessity+as+theology%2C+yet+in+forming+and+expressing+concepts%2C+in+penetrating+the+subtleties+of+things+and+questions%2C+in+refuting+the+evasions+of+adversaries%2C+it+greatly+helps+not+to+be+entirely+without+it.+We+require+a+moderate+use+of+philosophy+in+theological+matters%3B+we+entirely+forbid+its+dominion.%0A%0ALuther+said+aptly+in+his+Disputation+on+the+Simplicity+of+God+and+the+Trinity+of+Persons%3A+%E2%80%9CWhen+dialectic+argues+that+something+does+not+square+with+its+rules%2C+we+must+say+to+it%2C+%E2%80%98Let+the+woman+keep+silence+in+the+Church.%E2%80%99%E2%80%9D+The+Fathers+use+a+similar+image+of+Hagar+the+handmaid%2C+who+is+commanded+to+be+cast+out+of+the+house+when+she+behaves+too+wantonly+and+wishes+to+rule+her+mistress+at+her+own+pleasure.%0A%0AWhen+philosophy+rises+too+imperiously+against+theology%2C+seeks+a+dictatorship%2C+or+tries+to+confine+the+most+august+truth+within+its+own+bars+and+rules%2C+it+must+be+expelled%3B+and+where+it+tends+toward+contention%2C+it+must+be+modestly+avoided.+For+truth%2C+wherever+it+is%2C+has+this+first%3A+that+it+is+chaste%3B+then+that+it+is+peaceable+%28James+3%3A17%29.+But+that+which+has+bitter+zeal+and+strife+may+be+called+%E2%80%9Cwisdom%2C%E2%80%9D+but+it+is+earthly%2C+sensual%2C+and+demonic%2C+says+the+Apostle.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+Institutes+of+Theology.+Compiled+from+the+Best+Authors%2C+%28Leiden%3A+Franciscus+Moyardus%2C+1658%29%2C+epistle+dedicatory.+%28Translated+by+Copilot.%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F085c832adc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/085c832adc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2026/02/19/johannes-hoornbeeck-on-the-right-use-of-philosophy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b571955e76" data-kw="">
<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

</figure><figure class="quote" id="q-ebf3a1e066" data-kw="">
<blockquote><p>The statement of the question is not: (1) whether proper reverence and honor are due to the bread and the cup, the symbols of the Lord’s body and blood, both on account of the majesty of the author and the divinity of the things they seal and the excellent and singular use they have in religion, such as is legitimately exhibited to baptism and other rites and signs of religion. … However, we, although not denying that a proper reverence should be paid to the sacred symbol, do deny that the adoration which is due to the supreme God (usually designated by the Romanists as the worship of latria) should be paid to them. And although in one and the same celebration of the sacrament, they are made once and at the same time, still we think that they ought to be distinct the one from the other and unconfounded that we may not receive the signs for the things themselves; but may pay reverence to the signs indeed, but adoration to Christ alone. As in baptism of adults, the adoration of Christ (into whom they are initiated) and the reverence towards the water (the sacred symbol of the mystery) remain widely distinct… But we deny that on this account the sacrament itself should be adored; nay, we reject this worship as a most foul and detestable idolatry and bread-worship (artolatreian).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.538-39</span></figcaption>

<blockquote><p>…in the receiving of the blessed Sacrament we are to distinguish between the outward and the inward action of the communicant. In the outward, with our bodily mouth we receive really the visible elements of bread and wine; in the inward, we do by faith really receive the body and blood of our Lord; that is to say, we are truly and indeed made partakers of Christ crucified, to the spiritual strengthening of our inward man.</p></blockquote>

</figure><figure class="quote" id="q-6225698499" data-kw="">
<blockquote><p>Regarding ministers, if one today comes to believe it is most proper, apart from necessity, to sit at a table for the Supper, or to do it with a common cup, and that’s not going to happen in the next few weeks or several months, must a minister abstain from dispensing an impure Supper (with the attendant consequences) or resign his charge to his congregation and go elsewhere? Do you have a framework in which to deal with this, while maintaining a clear and undoubting conscience? If Church officers cannot ever comply with things not fully right, regarding worship or otherwise, then officers can never remain in the Church while seeking her reform. Most all the reformers were against Gillespie’s principle as they continued in the Church (maintaining her unity) while performing practices they did not believe were fully right, while seeking to reform them to the Word, which largely occurred. That was a great good, only able to be attained through that means and our principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Regarding ministers, if one today comes to believe it is most proper, apart from necessity, to sit at a table for the Supper, or to do it with a common cup, and that’s not going to happen in the next few weeks or several months, must a minister abstain from dispensing an impure Supper (with the attendant consequences) or resign his charge to his congregation and go elsewhere? Do you have a framework in which to deal with this, while maintaining a clear and undoubting conscience? If Church officers cannot ever comply with things not fully right, regarding worship or otherwise, then officers can never remain in the Church while seeking her reform. Most all the reformers were against Gillespie’s principle as they continued in the Church (maintaining her unity) while performing practices they did not believe were fully right, while seeking to reform them to the Word, which largely occurred. That was a great good, only able to be attained through that means and our principle.”

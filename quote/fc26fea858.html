<main class="wrap"><figure class="quote" id="q-fc26fea858" data-kw="">
<blockquote><p>2. They [the Jerusalem Church] were under a tie by due proportion, not to keep the Law of Moses and not to be circumcised by any necessity of a Divine Law, but only by permission to use these ceremonies for fear of scandal. 3. They are tied by proportion also to give no offence in things indifferent. 4. Not to reject the gentiles whom the Lord had called to his heavenly kingdom as well as the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, pp. 400</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>1. If baptism be administered [in public worship], stay, Ezek. xlvi. 10, and attend unto it, (1.) To honour that holy ordinance with the greater solemnity. (2.) And in charity to the persons to be baptized, joining with the congregation in hearty prayer for them, and in a joyful receiving them into the communion of the visible church. (3.) Also in respect of yourself. For hereby you may call to mind your own baptism, in which you did not put on Christ, Gal. iii. 27, which also does lively represent the death, burial, and resurrection of Christ, together with your crucifying the affections and lusts, Gal. v. 24; being dead and buried with him unto sin, and to hope of glory, Col. i. 27, ii. 11-13; understanding clearly that the blood and Spirit of Christ, Heb. ix. 14. x. 22, signified by water, doth cleanse you from the guilt and dominion of sin to your justification and sanctification, Matt. iii. 11. Tit. iii. 5, 1 John i. 7.

Remembering, moreover, that, by way of sealing, Gen. xvii. 11. Rom. iv. 11, your baptism did in particular exhibit and apply to you that believe, Christ with all the benefits of the covenant of grace ratified in his blood; minding you also of this, that it does not only seal God’s promises of forgiveness, grace, and salvation to you; but that also it seals and binds you to the performance of your promise, and vow of faith and obedience, which is the branch of the covenant to be performed, according as was professed, on your part.

Recourse to your baptism is an excellent strengthener of your weak faith, 1 Peter iii. 21, and an occasion of renewing of your vow, you having broken it: and of resisting temptations, considering that they are against your promise and vow in baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, (1627; Philadelphia, 1800), pp 88-89.</span></figcaption>

<blockquote><p>We do make &amp; gather the fourth argument upon the strength &amp; force of circumcision, in stead whereof, baptism is in the church of Christ. As many as were the servants of God, did afore all things, labour &amp; endeavour themselves, to circumcise their children. Josu. v. Exo. iiii. The Apostles were the most faithful ministers of god: Then did not they omit or leave the thing, that was not brought in, in stead of the circumcision, Ergo, they did baptise, not only them that were of age, but also children.

Fifthly we do thus reason upon the use &amp; custom of the Apostles. The Apostles of Christ did direct all their doings to the conveniency &amp; example of the old testament.

This we do prove by the iiii. Evangelists, the Acts of the apostles, by the epistles of the Apostles, Rom. xv. ii. Cor. ii. ii. Tim. iii. ii. Peter i. chap. Ergo, they did order baptism after the Analogy and figure of the old Testament. The going through the red sea, was a type &amp; figure of the baptism that was to come i. Cor. x. cha. Children were in the figure (for both men and women went through with their children). Ergo the apostles did not deny baptism unto the children. The custom &amp; manner of the scripture (which custom and manner is used almost among all nations) is not to rehearse by name, women &amp; children, and yet nevertheless it doth include them, for in the name of the father of the family, or of the good man of the house, all his whole family is comprehended, as in the chief or head. If this were not, women should be in no small jeopardy, if therefore they were not of god, because that they be not circumcised. All these things are done, by the means &amp; help of a figure that is called Synecdoche.

The sixth argument shall be taken out of the manifest and express testimonies of the apostles. The apostles did baptise all whole households and families, ergo they did baptise children also, for the children are in the number of the family or household. This we do prove by the xvii of Gene. For Abraham doth circumcise all the male children that were in his house. For he understood the promise of God, that saith. I shall be thy God, &amp; the God of thy seed. Likewise in the new Testament, when the goodman of the house, had herd &amp; believed the gospel, that is to say, that God was his God, &amp; the God of his seed also, he caused all them that were in his house both great and small, to be baptized.

Thus the apostles did baptize whole households and families. That the children do pertain unto the father’s household &amp; family, it is plain &amp; manifest by the xii. of Exodus &amp; ii. of the Acts: this do I inculcate &amp; beat the oftener into men’s heads, because that I see the Anabaptists to be at this point that they do exclude the children from the family &amp; household. for they can not deny but the whole households were baptized by the Apostles. But who doth not see, that this cometh of mere contention?

For though they could prove that there were no children at all in the families &amp; households, that the apostles did baptise, yet had they not proved that all families or households were, or be without children: wherefore we do make again our argument after this manner. The Apostles baptized all whole households, ergo, they did baptise children, saith the children are the principal &amp; chief part of the family &amp; household.

But let us put the case, that there were no children in those families &amp; households, that the Apostles did baptise, yet do they pertain &amp; belong to the household, &amp; are reckoned in it, and if there had been any, they would have baptized them. For they did baptise the whole household. The fault then should not have been in the Apostles nor in the children, that their were not baptized: but this had been the cause that they had been baptized, because that there were none: For if they had had children they would have baptized them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>

<blockquote><p>Paul, Rom. 4. stands much upon this to prove that justification by faith is not conferred by the sacraments. And from the circumstance of time he gathers that Abraham was first justified and afterward received circumcision, the sign and the seal of his righteousness. Now we know that the general condition of all sacraments is one and the same and that baptism succeeded circumcision. And what can be more plain then the example of Cornelius (Acts 10). who before Peter came to him had the commendation of the fear of God and was indued with the spirit of prayer. And afterward when Peter by preaching opened more fully the way of the Lord, he and the rest received the holy Ghost? And after all this they were baptized. Now if they received the holy Ghost before baptism, then they received remission of sins, and were justified before baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, 611.</span></figcaption>

</figure><figure class="quote" id="q-be8d7af92f" data-kw="">
<blockquote><p>The Baptists, especially those of the time of the Reformation, do not hold the common doctrine on this subject. The Anabaptists not only spoke in very disparaging terms of the old economy and of the state of the Jews under that dispensation, but it was necessary to their peculiar system, that they should deny that the covenant made with Abraham included the covenant of grace. Baptists hold that infants cannot be church members, and that the sign of such membership cannot properly be administered to any who have not knowledge and faith. But it cannot be denied that infants were included in the covenant made with Abraham, and that they received circumcision, its appointed seal and sign. It is therefore essential to their theory that the Abrahamic covenant should be regarded as a merely national covenant entirely distinct from the covenant of grace. The Romanists assuming that saving grace is communicated through the sacraments, and seeing that the mass of the ancient Israelites, on many occasions at least, were rejected of God, notwithstanding their participation of the sacraments then ordained, were driven to assume a radical difference between the sacraments of the Old Testament and those of the New. The former only signified grace, the latter actually conveyed it. From this it follows that those living before the institution of the Christian sacraments were not actually saved. Their sins were not remitted, but pretermitted, passed over. At death they were not admitted into heaven, but passed into a place and state called the limbus patrum, where they remained in a negative condition until the coming of Christ, who after his death descended to hell, sheol, for their deliverance. In opposition to these different views the common doctrine of the Church has ever been, that the plan of salvation has been the same from the beginning. There is the same promise of deliverance from the evils of the apostasy, the same Redeemer, the same condition required for participation in the blessings of redemption, and the same complete salvation for all who embrace the offers of divine mercy.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4abf76940e" data-kw="">
<blockquote><p>Assertion 2 – This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him, as Dr. Ferne [a royalist] confesses, (sec. vii, p. 30)… …2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, Question 12, ‘Whether or not a Kingdom may Lawfully be Purchased by the Sole Title of Conquest?’, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-900ae0fb00" data-kw="">
<blockquote><p>XVII. The consideration of this, that magistracy is an ordinance of the only wise God, and that such as are in authority are warranted of Him, and have commission from Him, should move Christians to carry themselves under them in the exercise of their power, as loyal, dutiful subjects, whatever their persons be, tho’ heathens and strangers to Christ, and enemies to his kingdom; for He would have the Christian Romans live in subjection unto their heathen magistrates, emperors, consul or senate, upon this motive, that there is no power but of God; and the powers that be, are ordained of God [Rom. 13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Romans</cite>, (Edinburgh: Paterson, 1766), ch. 13, p. 505 Wamphray was an influential and leading Scottish covenanter.</span></figcaption>

</figure><figure class="quote" id="q-67937c6a69" data-kw="">
<blockquote><p>In regard of the justness and necessity of some things which may be the subject or matter of the usurpers’ command and the arbitrariness of others, and the lawfulness of either, not depending upon the command or warrant of a superior, but resulting out of the nature of the action itself; so that a private man might do it, were there no magistrate to command it, or no command from the magistrate for it. We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: 1. Taking up arms for the preservation of ourselves and the country against a common enemy, upon the usurpers’ summons; the which we might do of ourselves, were there no authority; or if a just authority were in being, yet if it could not, or did not, maturely enough call us forth to it. 2. Payment of taxes and bearing other impositions for the usurping power, where, and while we are under his compulsive power, because such contributions may, and will be taken whether I will pay them or not; and I yield them under his enforcement, as a ransom for my life, or liberty, or somewhat else that is better to me than the payment; and consequently I am to choose the parting with it as the less evil, rather than with that which is better, which to loose is to incur a greater evil for the avoidance of a less… 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me… But, in granting liberty of concurrence with some commands of an usurped authority, we neither yield any obedience at all to be due, or performable to it; nor can we allow a correspondence with it in diverse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered</cite>, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, pp. 22-25</span></figcaption>

ity+were+in+being%2C+yet+if+it+could+not%2C+or+did+not%2C+maturely+enough+call+us+forth+to+it.+2.+Payment+of+taxes+and+bearing+other+impositions+for+the+usurping+power%2C+where%2C+and+while+we+are+under+his+compulsive+power%2C+because+such+contributions+may%2C+and+will+be+taken+whether+I+will+pay+them+or+not%3B+and+I+yield+them+under+his+enforcement%2C+as+a+ransom+for+my+life%2C+or+liberty%2C+or+somewhat+else+that+is+better+to+me+than+the+payment%3B+and+consequently+I+am+to+choose+the+parting+with+it+as+the+less+evil%2C+rather+than+with+that+which+is+better%2C+which+to+loose+is+to+incur+a+greater+evil+for+the+avoidance+of+a+less%E2%80%A6+3.+Complaining%2C+petitioning+or+going+to+law+before+the+magistrates+or+courts+authorized+by+the+usurpers+provided+you+give+not+the+usurpers+to+whom+you+petition+such+titles+as+you+give+to+the+lawful+magistrate%29.+%28%E2%80%9C%E2%80%A6excusantur+%C3%A0+peccato+inducendi+tyrannum+ad+actum%2C+et+opus+illicitum+petentes+ab+illo+iustitiam%2C+quia+non+petunt+actum+illicitum%2C+sed+justitiam+illius+actus+illiciti%E2%80%A6+pie+interpretandae+sunt+petitiones+tam+iustitiae+quam+honestae+gratiae+quae+offeruntur+tyrannis%2C+s.+si+vis%2C+seu+ex+quo+vis+detinere%2C+et+exercere+hoc+dominium%2C+utere+illo+iuste%2C+utere+honeste%2C+utere+pie%2C+utere+ad+utilitatem+publicam%2C+et+privatorum%2C+prout+deceret+dominium%E2%80%A6+nec+intendunt%2C+nec+petunt+actum+usurpatum%2C+sed+qualitatem+sanctam+inactu+usurpato+exercendo.%E2%80%9D+Cajetan%2C+Summula+%5BVenice%3A+Carampellum%2C+1596%5D%2C+title%3A+Rempublicam+tyrannice+occupare%E2%80%A6+%5Bpp.+411-12%5D%29+In+thus+doing%2C+I+seek+my+necessary+self-preservation%3B+neither+do+I+yield+or+ascribe+to+them+to+whom+I+have+recourse+any+just+power+of+judicature+or+participate+in+their+sin+of+usurping+it%3B+only+I+acknowledge+they+have+might+and+ability+in+their+hand+to+right+me%3B+which%2C+though+they+ought+not+to+assume%2C+yet+I+may+take+the+benefit+of+their+unjust+use+of+it%3B+as+a+poor+man+may+receive+relief+at+the+hands+of+him+that+has+gotten+those+goods+he+distributes+unjustly%3B+and+I+may+receive+my+money%2C+with+a+good+conscience%2C+from+the+hands+of+a+thief+that+is+willing+to+return+it+to+me+though+he+took+it+by+robbery+from+another+thief+that+robbed+me+of+it%3B+and+if+the+party%2C+with+whom+I+have+a+controversy+for+my+right+will+agree+to+refer+the+matter+betwixt+us+to+a+private+person+as+an+arbitrator%2C+and+stand+to+his+arbitrement%3B+that+is+a+lawful+means+of+coming+by+my+own%2C+though+by+his+help+and+award+that+has+not+claim+of+authority+over+me%E2%80%A6+But%2C+in+granting+liberty+of+concurrence+with+some+commands+of+an+usurped+authority%2C+we+neither+yield+any+obedience+at+all+to+be+due%2C+or+performable+to+it%3B+nor+can+we+allow+a+correspondence+with+it+in+diverse+things%2C+and+therefore+we+are+to+put+a+difference%3A+First%2C+betwixt+things+that+are+in+themselves+necessary%2C+and+those+that+are+of+a+middle+or+an+indifferent+nature+in+themselves+considered%E2%80%A6+2.+Betwixt+moral%2C+or+prudential+acts+competible+%5Bcompetent%5D+to+private+men+or+subjects%2C+and+political+acts+or+judicial+proceedings+that+flow+from+power+and+authority+inherent+in+the+person+that+acts+them%2C+or+are+the+issues+of+distributive+justice%2C+and+either+come+forth+from+a+person+clothed+with+government%2C+or+unto+which+is+requisite+a+stamp+of+authority+to+make+them+lawful%2C+and+justifiable%3A+as+to+bear+the+office+of+a+magistrate%2C+or+commander+in+civil+or+military+affairs%2C+or+to+be+any+under+agent%2C+or+servant+in+carrying+on%2C+or+assisting+the+government.%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%E2%80%A6+%28London%2C+1650%29+88+pp.+ToC%2C+pp.+22-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67937c6a69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67937c6a69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=In%20regard%20of%20the%20justness%20and,carrying%20on%2C%20or%20assisting%20the%20government&amp;text=In%20regard%20of%20the%20justness%20and%20necessity%20of&amp;text=servant%20in%20carrying%20on%2C%20or%20assisting%20the%20government" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The French Confession [1559] says (article 40) ‘Ajjirmamus ergo parendumesse legibus et statutis, solvenda tributa, subjectionis denique jugum voluntarie tolerandum, etiamsi infideles fuerint magistrates, dummodo Dei summum imperium integrum et illibatum maneat. [Therefore we affirm that obedience must be yielded unto their laws and statutes, that tribute must be paid them, taxes and all other duties, and that we must bear the yoke of subjection with a free and willing mind, although the magistrates are infidels; so that the sovereign government of God may be preserved entire.]’ So clear it is that all active obedience is due to all magistrates, and that that yoke of passive obedience is to be tolerated but conditionally, with a dummodo [so that], ‘so as’ the magistrate violate not the supreme commandment of the King of kings; and we know, accordingly, protestants of that church have taken defensive arms against their king.</p></blockquote>

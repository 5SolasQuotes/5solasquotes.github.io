<main class="wrap"><figure class="quote" id="q-21da6436c8" data-kw="">
<blockquote><p>This translation is a selection from Lessius’ treatment of contract law in his larger work On Justice and Right. By drawing on diverse sources ranging from Roman and canon law to moral philosophy, Lessius offers practical advice in commercial and financial matters. These chapters on sale, securities, and insurance engage perennial questions concerning the lawfulness of insider trading, the sale of toxic debt, and asymmetric information in insurance markets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonardus-lessius.html">Leonardus Lessius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Sale, Securities &amp; Insurance</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3e9b3071f" data-kw="">
<blockquote><p>…a permissive law of God… such as a law of a bill of divorcement… The law of a bill of divorcement is a mere positive law, permitted in a particular exigent, when a husband, out of levity of heart and affection, cannot love his wife; therefore God by a law permitted him out of indulgence to put her away, that both might have a seed (the want [lack] whereof, because of the blessed Seed to be born of woman, was a reproach in Israel [in the Old Testament]), and though this was an affliction to some particular women, yet the intent of the law and the soul thereof was a public benefit to the commonwealth of Israel, of which sort of laws I judge the hard usage permitted by God to his people — in the master toward the servant — and the people of God toward the stranger, of whom they might exact usury — though not toward their brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 196</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-3d2019ef10" data-kw="">
<blockquote><p>The Judicial Law concerning the punishments of likedness, for the substance, viz. that it should be punished remains under the Gospel, because it comes within the nature of the Moral Law, and was prescribed to the Jews, not quae [as] Jews or a people peculiarly taken into Covenant, but qua [as] men subject to the Law of nature as other nations were… The Judicial laws may be considered according to their substance and equity, or according to many accessories, circumstances, forms and manner of them. Now though the magistrate under the Gospel is not bound unto these laws simply, that is, to every circumstance and particular of them for form, manner, time and place; as for example, not to the same kinds and formality of punishments set down in those laws; for those forms are accessions of the law; and therefore out of the nature of persons, times, places, and constitution of commonwealths, mutable: Yet he is bound to the substance and equity of them, so as not to derogate from the right of those laws… Now though to the degrees and measures of punishment, the severity and utmost rigor the Magistrate is not now tied, yet to the thing in cases of idolatry, seduction, false prophesying, speaking lies in the name of the Lord he is bound, and in some cases of gross and high idolatry and blasphemy committed presumptuously, to inflict capital punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience</cite>, pp. 50, 54-55</span></figcaption>

</figure><figure class="quote" id="q-be07a9b2e5" data-kw="">
<blockquote><p>As for the law of divorce, it was indeed a permissive law, whereby the husband might give the wife a bill of divorce and be free of punishment before men, but not free of sin and guiltiness before God, for it was contrary to God’s institution of marriage at the beginning, as Christ says, and the prophet says (Mal. 2) that the Lord hates putting away;</p></blockquote>

</figure><figure class="quote" id="q-930c01a611" data-kw="">
<blockquote><p>XVIII. The natural law cannot be said to have undergone a change by the division of lands and the ownership of possessions and goods introduced by the law of nations. No natural law commands a community of goods or prohibits their distribution. If all things are said to have been common from the beginning, this is to be understood not so much positively (as if God had enacted a law making all things common) as negatively (because nothing was expressly determined concerning it, since there was as yet no necessity for it). Afterwards a distinction and ownership of goods was justly introduced with the authority of God, to prevent controversies, to restrain external violence and to afford certainty to inheritances and make a distinction in conditions (without which human society could not exist).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 18, pp. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

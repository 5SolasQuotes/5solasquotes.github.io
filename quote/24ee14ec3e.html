<main class="wrap"><figure class="quote" id="q-24ee14ec3e" data-kw="">
<blockquote><p>Now, the great gift, and large allowance of our Father, is expressed in the next words, “But ye have received the spirit of adoption,” &amp;c. Which spirit of adoption is a spirit of intercession, to make us cry to God as our Father. These are two gifts,—adoption, or the privilege of sons, and the spirit of adoption revealing the love and mercy of God to the heart, and framing it to a soul -like disposition. Compare the two states together, and it is a marvellous change,—a rebel condemned, and then pardoned, and then adopted to be a son of God;—a sinner under bondage, a bound slave to sin and Satan, not only from that intolerable bondage, but advanced to this liberty,—to be a son of God!

This will be the continued wonder of eternity, and that whereabout the song of angels and saints will be. Accursed rebels, expecting nothing but present death, sinners arraigned and sentenced before his tribunal, and already tasting hell in their consciences, and in fear of eternal perishing, not only to be delivered from that, but to be dignified with this privilege,—to be the sons of God, – to be taken from the gibbet to be crowned,—that is the great mystery of wisdom and grace revealed in the gospel, the proclaiming whereof will be the joint labour of all the innumerable companies above for all eternity.

Now, if you ask how this estate is attainable, himself tells us, John i. 12, “As many as believed, or received, to them he gave the privilege to be the sons of God.” The way is made plain and easy,—Christ the Son of God, the natural and eternal Son of God, became the son of man. To facilitate this, he hath taken on the burden of man’s sin, the chastisement of our peace; and so of the glorious Son of God he became like the wretched and accursed sons of men; and therefore God hath proclaimed in the gospel, not only an immunity and freedom from wrath, to all that in the sense of their own misery cordially receive him as he is offered; but the unspeakable privilege of sonship and adoption, for his sake who became our elder brother. Gal. iv. 4, 5.

Men that want children, use to supply their want by adopting some beloved friend in the place of a son; and this is a kind of supply of nature for the comfort of them that want. But it is strange that God, having a Son so glorious, the very character of his person, and brightness of his glory, in whom he delighted from eternity; strange, I say, that he should in a manner lose and give away his only-begotten Son, that he might by this means adopt others, poor, despicable creatures, yea, rebellious, to be his sons and daughters.

Certainly, this is an act infinitely transcending nature, such an act that bath an unsearchable mystery in it, into which angels desire to look, and never cease looking, because they never see the bottom of it. It was not out of indigency he did it, not for any need he had of us, or comfort expected from us, but absolutely for our necessity and consolation, that he might have upon whom to pour the riches of his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary: Being Sermons on the Eighth Chapter of the Epistle to the Romans</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 150-52.</span></figcaption>

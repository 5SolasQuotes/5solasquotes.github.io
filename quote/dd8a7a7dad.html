<main class="wrap"><figure class="quote" id="q-dd8a7a7dad" data-kw="">
<blockquote><p>Infinite goodness does not immediately take away all evils if it is a perfectly free and not a necessary agent. It judges that the permission of evil for the purpose of extracting good from it pertains more to its wisdom and omnipotence than the not permitting the existence of evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R, 1992), vol. 1, topic 3, question 1, ‘Can the existence of God be irrefutably demonstrated against atheists? We affirm.”, section 26, p. 177</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e710bbc718" data-kw="Author of sin">
<blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-cox.html">Benjamin Cox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Appendix to a Confession of Faith</cite>, 1646, art. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a> › <a href="../topics/providence/providence-and-evil/the-problem-of-evil.html">The problem of evil</a></span><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/gods-concurrence-with-secondary-causes.html">God&#x27;s concurrence with secondary causes</a></span></div>

</figure><figure class="quote" id="q-1f18105752" data-kw="">
<blockquote><p>Desertion in sin is when, God withdrawing the assistance of his spirit, a man is left to fall into some actual and grievius sin. And for all this no man is to think that God is the author of sin, but only man that falls, and Satan. A resemblance of this truth we may see in a staff: which, if a man shall take and set upright upon the ground, so long as he holds it with his hand, it stands upright; but so soon as he withdraws his hand, though he never push it down, it falls of itself. In this desertion was the good king Hezekiah… God left him (namely, to the pride of his heart to exalt himself) in tempting him, that he might try out all that was in his heart. To this place appertain[s] Noah’s drunkenness, David’s adultery, Peter[‘s] denial of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, ... (Cambridge, 1600), A Declaration of Certain Spiritual Desertions…, p. 682</span></figcaption>

</figure><figure class="quote" id="q-5636806dec" data-kw="Sovereignty Author of sin Satan">
<blockquote><p>We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 13</span></figcaption>

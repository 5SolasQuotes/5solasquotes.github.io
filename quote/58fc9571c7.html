<main class="wrap"><figure class="quote" id="q-58fc9571c7" data-kw="">
<blockquote><p>The matter is often spoken of as if the Church of England must of necessity have laid down, and had in fact laid down, a certain definite precise view upon this subject, and peremptorily enjoined it upon all her ministers for their acceptance and belief. In my humble apprehension such a notion is entirely opposed to fact… …all which our Church has done upon this question is, to lay down certain limits on both sides, within which the views of her ministers are to be confined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-goode.html">William Goode</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Church of England as to the Effects of Baptism in the Case of Infants</cite>, … (London: J. Hatchard, 1849) 487 pp. ToC, pp. 1 &amp; 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f9f3b0b84" data-kw="">
<blockquote><p>As concerning children, we cannot bind all to the same measure of age. For there are some in whom spiritual knowledge, study and zeal for piety, and grave and well-ordered morals supply the defect of years. Yet it is not in the least to be approved that each and all alike, after the age of fourteen, initiated with the sacrament of confirmation (according to the Papists)… are received to communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, 6th Question, ‘Is the Supper to be Granted to Infants, or to Children?’ [No] in Ecclesiastical Politics, vol. 1, book 2, tract 2, section 4, ch. 3, pp. 757-58 trans. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— Gisbertus Voetius, 6th Question, ‘Is the Supper to be Granted to Infants, or to Children?’ [No] in Ecclesiastical Politics, vol. 1, book 2, tract 2, section 4, ch. 3, pp. 757-58 trans. Charles Johnson">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+concerning+children%2C+we+cannot+bind+all+to+the+same+measure+of+age.+For+there+are+some+in+whom+spiritual+knowledge%2C+study+and+zeal+for+piety%2C+and+grave+and+well-ordered+morals+supply+the+defect+of+years.+Yet+it+is+not+in+the+least+to+be+approved+that+each+and+all+alike%2C+after+the+age+of+fourteen%2C+initiated+with+the+sacrament+of+confirmation+%28according+to+the+Papists%29%E2%80%A6+are+received+to+communion.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+6th+Question%2C+%E2%80%98Is+the+Supper+to+be+Granted+to+Infants%2C+or+to+Children%3F%E2%80%99+%5BNo%5D+in+Ecclesiastical+Politics%2C+vol.+1%2C+book+2%2C+tract+2%2C+section+4%2C+ch.+3%2C+pp.+757-58+trans.+Charles+Johnson&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f9f3b0b84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f9f3b0b84.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/paedocommunion/#:~:text=As%20concerning%20children%2C%20we%20cannot%20bind,are%20received%20to%20communion&amp;text=As%20concerning%20children%2C%20we%20cannot%20bind%20all%20to&amp;text=are%20received%20to%20communion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3087bd07b3" data-kw="">
<blockquote><p>The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos</cite>, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-576f4001d4" data-kw="">
<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, section 50, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

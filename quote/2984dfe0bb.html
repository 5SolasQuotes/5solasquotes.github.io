<main class="wrap"><figure class="quote" id="q-2984dfe0bb" data-kw="">
<blockquote><p>In the next place, great advantage redounds to the infants themselves, especially when they shall have grown up and come to understand what a pious intention did for them while they were yet children.

How dear to pious hearts must be the remembrance of that love divine, which, as it were, solemnly took them into its own arms from the bosom of their mother when they had but just entered upon life and were still rosy from the birth that put this song into their mouths, “Thou hast made me to hope from my mother’s breasts; I was cast upon thee from the womb; thou hast been my God from my mother’s belly” (Ps. 22:10, 11), which, in short, from early childhood, as we say, united them to itself by the holiest bond and mercifully initiated them into the enjoyment of all good.

The same remembrance, as it is full of consolation, is also calculated to strengthen the Christian virtues and the power of genuine holiness. For nothing ought to be more dear to us than that we may keep sacred and inviolable that covenant of our youth—the first and holiest pledge that has been given to God in our name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 170-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

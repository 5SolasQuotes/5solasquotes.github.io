<main class="wrap"><figure class="quote" id="q-e49b6da69f" data-kw="">
<blockquote><p>Monogamy is a distinctive aspect of the Christian tradition. Polygamy existed in most ancient societies, but Christian authorities opposed the practice, in part to distinguish monogamous Christianity from other faiths. By the early modern period, polygamy was rare in Christian Europe, and it had gained a negative reputation because of its association with sexual excess and lust. During the Reformation, however, certain individuals, including Luther himself, condoned polygamy, and Lutheran doctrine was compatible with plural marriage in some ways. After an ill-fated attempt [by Anabaptists] to establish a polygamous community at Munster, however, it became much more difficult to support polygamy, as the practice was further tainted by association with religious radicalism and lustful, degenerate behavior. During the English Revolution, the downfall of censorship and the tumultuous political climate allowed some English authors to write in support of plural marriage, using both practical and religious arguments. Yet, the majority of authors condemned the practice. Plural marriage continued to be associated with pagan and barbaric culture, and accusations of polygamy were used to undermine and discredit one’s enemies. In the literature of travel and colonisation, accusations of polygamy were used to demean and vilify peoples such as Jews and Turks. The existence of polygamy in Europe’s colonies helped Christian Europeans to maintain a sense of superiority over the pagan, barbaric indigenous inhabitants and helped to establish a shared European and Christian identity. In the writings of the Reformation and the Revolution, along with the literature of travel and colonisation, polygamy became a boundary marker between Christians and non-Christians, Catholics and Protestants, radicals and non-radicals, civilised countries and barbaric countries, and England and its colonies. Polygamy’s function as a boundary marker, more than any theological reasons, was the reason why plural marriage did not gain significant support in early modern England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lisa-loughead.html">Lisa Loughead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perception of Polygamy in Early Modern England MA thesis (Nova Scotia: Dalhousie University, 2008) 150 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>It must be diligently observed, that though justification be but one individual act in respect of the Father, Son and Holy Ghost, in the first act of faith, and conversion of a sinner, whereby the person of a man stands justified before God, and shall, without intercision of justification and loss of this favor of God, stand before the barre of God’s tribunal, and is, and always shall be absolutely justified and acquitted from all sins past, present and to come, because all obligations and handwritings against him, are in that act cancelled and blotted out: he forgiving all trespasses, Col. 2:13-14. Yet it must be known, that of this act there is (as it were) a double sentence: First, in court of heaven, at which time the elect in Christ have their names enrolled in the book of God’s effectual calling, and are numbered among the just, which sentence can never be revoked or blotted out: this is that which was passed with God (that I may so speak, after the manner of men) in the first act of conversion. Secondly, this sentence of forgiveness is passed in the court of the conscience of him that had the former sentence pronounced for him in heaven. This sentence is the second act of the holy Ghost, wrought in this manner. First, after that a sinner is cōvinced of his guiltiness of sin, and of his damnable condition because of his sin, then forgiveness is offered, and pronounced to the ear in that gracious promise of salvation to all that believe in Christ Jesus, which promise is proclaimed in the ministry of the Gospel, in which light of the Gospel, he shows unto a man possibility of salvation, setting before him (I speak of men of years and understanding) Christ the means of salvation; and by this means the Holy Ghost works faith in Christ; then confession and grief for sin; then prayer to ask forgiveness; and grace to live godly, and then does witness to his spirit that he is accepted of God. Thus sentence is pronounced in the conscience: from whence arises sense of God’s love, which is called the shedding abroad of the love of God in our hearts by the Holy Ghost, Rom. 5:5, also sense of the loving countenance of God, which is the sign of his loving kindness, and is that speech of God, by which he does say to our souls, he is our salvation, and then arises in our hearts peace of conscience, and joy in the Holy Ghost. This sentence of forgiveness unto the conscience has different degrees: it is sometimes more clear in the apprehension of the soul, sometimes more dim, yea sometimes quite blotted out in the counterpane of our release, or copy of our acquittance; as it was with David, Ps. 51, so that a person perfectly just before God, has sometime little or no sense or apprehension of it in his own conscience, but doubts whether he be in state of grace or no. Which happens because of the stain and guilt of new sins, which guilt abides in the conscience, until a man do confess his sins, repent, and ask forgiveness, and, by a renewed faith, apply forgiveness: by which means the evidence of his pardon is again by the Holy Ghost exemplified, and sentence by this new application is again pronounced in his conscience; whence arises new assurance of salvation, and renewed joy in the Holy Ghost. This is that justification, which for distinction sake, Divines call justification by parts, or continued, or repeated justification, or new application of one and the same justification: which justification though in respect of the sentence pronounced in heaven, is one individual act, whereby a man standeth alwayes just before God; yet in respect of the pronouncing of that sentence to the heart, it is not actually applied; neither can a particular sinne be said to be everie way actually forgiven, until after it have beene committed, is confessed, and repented of; nor untill forgivenesse be asked, and until the holy Ghost hath made new application thereof unto the conscience, through renewing of faith, by which a man doth again and again, as new sins are committed, apply the merits of the blood of Christ unto his soul. Also it must be known that the sentence of pardon which is passed in heaven with God, is not fully executed until the last degree of it, when sentence of absolution shall be pronounced by Christ Jesus: Come ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world, Matt. 25.34. It must moreover be conceived and held, that notwithstanding this distinction of justification between an absolute justification in respect of God, and a justification by parts in respect of application to mans conscience, there are not two kinds of justification, a first and a second, as the Papists hold: but one and the same justification, considered in different respects. In respect of God’s actual acceptation of a man’s person, justification is absolute; but in respect of the actual application and manifestation of God’s acceptation unto a mans conscience, justification is by parts and degrees. When a man already justified asks forgiveness, he doth not ask a new justification, but a second or new application of pardon unto the conscience of those particular sins which are daily committed, together with continuance of God’s favor, and more clear evidence that he is sealed up unto the day of redemption. The third thing to be spoken of for the better understanding the word [forgive] concerns the effects following the apprehension thereof; these are peace of conscience, and joy in the holy Ghost. These things touching justification and remission of sins being opened, we may understand what is prayed for, when we say, Forgive sins. We pray… Secondly, we pray that ourselves and others being justified and accepted into favor, it would please the Lord to continue this his favor, and that he would signify and make the same known to our hearts and consciences daily, by a new testification of the holy Ghost, accompanied with a new application of pardon for new sins daily committed, and that we may have more and more assurance of our perfect redemption at the day of judgment; and that we may have peace of conscience, and joy in the Holy Ghost, in the meantime.</p></blockquote>

<blockquote><p>There is therefore a twofold justification. One whereby, in ourselves being sinners, we are justified before God, from without us: The other whereby being now justified before God from without us, we are justified before Him within ourselves. The first of these is the cause of the second. The second is the effect and demonstration of the first. The first is done by faith, the other by works. Both must concur that the righteousness of the Law may be fulfilled in us… Let us speak fullier of the second sort of justification. It is that whereby God, by regeneration given us, and the works of sincere faith which we performed, absolves us from the charge of hypocrisy, profaness and impiety, and no longer takes us for men dead in sin, servants of the Devil and children of the world, but for true believers, his sons restored to his image, endued with his life and translated into his Kingdom: which judgment of God, the Law also approves. Not that it [the Law] takes it self-satisfied by our works, but because being bereaved of its dominion and subjected to Christ our Lord, it cannot choose but [to] commend the works which come from faith in Christ and from his Spirit, and account them for true righteousness, though they are imperfect; and them that perform them, for truly righteous and sons pleasing to God. Let it be here enquired, seeing Scripture does often and expressly ascribe to us both these righteousnesses we speak of, and therefore we are in respect of them both to be judged righteous, not only with men, but with God, whether in the same sense as we are said to be justified by works, Jam. 2, and to be justified by words, Mt. 12, works may not be said to be imputed to us for righteousness? Not indeed as faith is imputed to righteousness: but as the fact of Phineas is said to be imputed to him for righteousness, Ps. 106:31.</p></blockquote>

— Richard Baxter, ch. 10, sect. 3, pp. 342-52 in Richard Baxter’s Confession of his Faith… (London: 1655) The page numbering is misnumbered. The whole of sect. 3 has more on this topic, as Baxter quotes 80 authors in support of his views on the necessity of works for believers in salvation., pp. 344-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+therefore+a+twofold+justification.+One+whereby%2C+in+ourselves+being+sinners%2C+we+are+justified+before+God%2C+from+without+us%3A+The+other+whereby+being+now+justified+before+God+from+without+us%2C+we+are+justified+before+Him+within+ourselves.+The+first+of+these+is+the+cause+of+the+second.+The+second+is+the+effect+and+demonstration+of+the+first.+The+first+is+done+by+faith%2C+the+other+by+works.+Both+must+concur+that+the+righteousness+of+the+Law+may+be+fulfilled+in+us%E2%80%A6+Let+us+speak+fullier+of+the+second+sort+of+justification.+It+is+that+whereby+God%2C+by+regeneration+given+us%2C+and+the+works+of+sincere+faith+which+we+performed%2C+absolves+us+from+the+charge+of+hypocrisy%2C+profaness+and+impiety%2C+and+no+longer+takes+us+for+men+dead+in+sin%2C+servants+of+the+Devil+and+children+of+the+world%2C+but+for+true+believers%2C+his+sons+restored+to+his+image%2C+endued+with+his+life+and+translated+into+his+Kingdom%3A+which+judgment+of+God%2C+the+Law+also+approves.+Not+that+it+%5Bthe+Law%5D+takes+it+self-satisfied+by+our+works%2C+but+because+being+bereaved+of+its+dominion+and+subjected+to+Christ+our+Lord%2C+it+cannot+choose+but+%5Bto%5D+commend+the+works+which+come+from+faith+in+Christ+and+from+his+Spirit%2C+and+account+them+for+true+righteousness%2C+though+they+are+imperfect%3B+and+them+that+perform+them%2C+for+truly+righteous+and+sons+pleasing+to+God.+Let+it+be+here+enquired%2C+seeing+Scripture+does+often+and+expressly+ascribe+to+us+both+these+righteousnesses+we+speak+of%2C+and+therefore+we+are+in+respect+of+them+both+to+be+judged+righteous%2C+not+only+with+men%2C+but+with+God%2C+whether+in+the+same+sense+as+we+are+said+to+be+justified+by+works%2C+Jam.+2%2C+and+to+be+justified+by+words%2C+Mt.+12%2C+works+may+not+be+said+to+be+imputed+to+us+for+righteousness%3F+Not+indeed+as+faith+is+imputed+to+righteousness%3A+but+as+the+fact+of+Phineas+is+said+to+be+imputed+to+him+for+righteousness%2C+Ps.+106%3A31.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+ch.+10%2C+sect.+3%2C+pp.+342-52+in+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29+The+page+numbering+is+misnumbered.+The+whole+of+sect.+3+has+more+on+this+topic%2C+as+Baxter+quotes+80+authors+in+support+of+his+views+on+the+necessity+of+works+for+believers+in+salvation.%2C+pp.+344-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3658de9588.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3658de9588.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=There%20is%20therefore%20a%20twofold%20justification,to%20him%20for%20righteousness%2C%20Ps.%20106%3A31&amp;text=There%20is%20therefore%20a%20twofold%20justification.%20One%20whereby&amp;text=be%20imputed%20to%20him%20for%20righteousness%2C%20Ps.%20106%3A31" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2160b66eb0" data-kw="">
<blockquote><p>To be justified by faith, which is the first and vital justification, James has interpreted as being called a friend of God, that is, with sins forgiven, to be reconciled with God and to be received by Him into grace and friendship, who before was an enemy of God and a son of wrath. But to be justified by works, he taught is the same as to receive from God, on account of good works, which Abraham and Rahab received from Him, that is, approbation, praise and remuneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | Let the kind reader, I beseech him, compare this our opinion with that which is extant in the other Colloquy of Ratisbon, where that great light of the Church, Martin Bucer, speaks thus on the passage of James (p. 302):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

%2C%20praise%20and%20remuneration&amp;text=To%20be%20justified%20by%20faith%2C%20which%20is%20the&amp;text=from%20Him%2C%20that%20is%2C%20approbation%2C%20praise%20and%20remuneration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8cc0c0b6f2" data-kw="">
<blockquote><p>For as no man receives that general justification which discharges from the guilt of all foregoing sins, but on the concurrence of repentance, faith, a purpose of a new life, and other actions of the same kind; so no man retains a state free from guilt in respect of following sins, but by means of the same actions of believing in God, calling on God, mortifying the flesh, daily repenting and sorrowing for sins daily committed. The reason why all these are required on our part is this: Because these cannot be still absent, but their opposites will be present, which are contrary to the nature of a justified man—As therefore to the conservation of natural life it is necessarily required that a man carefully avoid fire, water, precipices, poisons and other things destructive to the health of the body; so to the conserving of spiritual life, it is necessarily required that a man avoid incredulity, impenitency and other things that are destructive and contrary to the salvation of souls; which cannot be avoided unless the opposite and contrary actions be exercised. And these actions do not conserve the life of grace properly and of themselves by touching the very effect of conservation, but improperly and by accident, by excluding and removing the cause of destruction.</p></blockquote>

<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 13, n.p.</span></figcaption>

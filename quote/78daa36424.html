</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10bee237fb" data-kw="">
<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath</cite>, (1595/1606; Naphtali &amp; RHB, 2015) Emphasis in the original. See also pp. 402-3. | Book 2, ch. 11, ‘Private Worship: Singing of Psalms’, pp. 396-8</span></figcaption>

g+psalms%2C+as+well+as+in+the+church.+And+though+I+do+not+bind+men+unto+this%E2%80%93for+be+it+far+from+me+that+I+should+lay+any+heavier+burden+upon+any%2C+than+the+Word+of+God+itself+binds%E2%80%93bind+them+I+say+unto+this%2C+that+in+all+their+mirth+they+should+sing+psalms%2C+as+might+seem+the+places+alleged+do+import%E2%80%A6+For+as+that+is%E2%80%A6+a+blessed+heaviness+that+makes+us+seek+unto+the+Lord%3B+so+that+is+a+godly+mirth+that+ends+with+singing+of+psalms%2C+and+a+heavenly+joy%2C+that+at+leastwise+makes+us+more+fit+to+serve+God.+.+pp.+406-7+What+Makes+it+Comely+%E2%80%A6So+though+to+sing+be+never+so+comely+in+its+own+nature%2C+yet+it+become+not+us%2C+except+we+be+prepared+for+it%2C+and+do+sing+David%E2%80%99s+psalms+%5Bnot+so+much+with+David%E2%80%99s+harp%2C%5D+as+with+David%E2%80%99s+spirit.+Therefore+the+apostle%2C+writing+to+the+Ephesians%2C+wills+them+in+singing+to+make+melody+in+their+hearts+to+the+Lord+%28Eph.+5%3A19%29%2C+and+not+to+sing+with+the+tongue+only%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Nicholas+Bownd%2C+The+True+Doctrine+of+the+Sabbath+%281595%2F1606%3B+Naphtali+%26+RHB%2C+2015%29+Emphasis+in+the+original.+See+also+pp.+402-3.+%7C+Book+2%2C+ch.+11%2C+%E2%80%98Private+Worship%3A+Singing+of+Psalms%E2%80%99%2C+pp.+396-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F10bee237fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/10bee237fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=And%20if%20we%20look%20into%20the,to%20sing%20with%20the%20tongue%20only&amp;text=And%20if%20we%20look%20into%20the%20book%20of&amp;text=and%20not%20to%20sing%20with%20the%20tongue%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9af95198b7" data-kw="">
<blockquote><p>It is an undeniable historical fact that non-canonical songs were excluded from the Geneva services and that this sate of affairs was due to Calvin’s influence and desire… He took great pains to put together a psalter for use in Strasbourg, translating a number of the psalms himself. He included no hymns, and that in spite of the fact that the congregational singing of hymns was an established ordinance in Strasbourg. He borrowed some of the German tunes but none of the lyrics, and the choice must have been deliberate. There is also the fact that, throughout its long history of development, the Geneva Psalter never included a single hymn. The only possible exception to this would be the inclusion of a metrical version of the Apostle’s Creed in the first edition of Calvin’s Geneva Psalter (1542). The Creed, however, was in a different category from either hymns or biblical songs… In any event, the Creed was not present in the final and authoritative version of the psalter (1562). …it must be kept in mind that, ’till the middle of the seventeenth century it was the current belief of Roman Catholic and Protestant Christendom that the Apostle’s Creed was ‘Membratim articulatimque‘ composed by the Apostle’s in Jerusalem on the day of Pentecost…’ (Schaff, Creeds, vol. 1, p. 22) Calvin himself prefers to leave the question of authorship open… In his catechism Calvin says, ‘It is commonly called the Apostle’s Creed, because from the beginning of the church it came from the lips of the Apostles or was faithfully collected from their writings.’ (Theological Treatises, p. 92) The Apostles’ Creed was thus seen by Calvin as having Apostolic sanction, if not authority, and as deriving directly from the Apostolic age, if not from the hands of the Apostles themselves. It was in his view a creed that had the honor and respect attending its use in the Church for some 1,500 years. Should we then be surprised to find that Calvin included a metrical version of such a creed in his psalter? It is unfortunate that he did so, but we can certainly see reasons for his having done so, which ultimately have nothing to do with whether the Apostles’ Creed is inspired. Certainly there is a wide difference between the inclusion of such a creed in the psalter and the inclusion of contemporary hymns, which is something that Calvin never did…. the final and complete version of the Genevan Psalter (1562) did not contain a metrical version of the Apostles’ Creed. Whatever reasons Calvin had for including the creed in the first place, he evidently changed his mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Origin of Reformed Psalmody’ in Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, pp. 179-81.</span></figcaption>

<blockquote><p>Another thing God did towards this work at that time was His inspiring David to show forth Christ and His redemption in Divine songs, which should be for the use of the Church in public worship throughout all ages. … This was also a glorious advancement of the office of redemption, as God hereby gave His Church a book of divine songs for their use in that part of their public worship–viz., singing His praises throughout all ages to the end of the world. It is manifest the Book of Psalms was given of God for this end. … David is called the “sweet Psalmist of Israel” (II Sam. 23:1), because he penned Psalms for the use of the Church of Israel;… and we find the same are appointed in the New Testament to be made use of in their worship: ‘Speaking to yourselves in psalms and hymns and spiritual songs’ (Eph. 5:19).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-78a36d89b8" data-kw="">
<blockquote><p>You cannot therefore attribute to God the cause of any human fault. For of all human offences, the cause is pride. For the conviction and removal of this a great remedy comes from heaven. God in mercy humbles Himself, descends from above, and displays to man, lifted up by pride, pure and manifest grace in very manhood, which He took upon Himself out of vast love for those who partake of it.

For, not even did even this One, so conjoined to the Word of God that by that conjunction he became at once the one Son of God and the same One the one Son of man, act by the antecedent merits of His own will. It behoved Him, without doubt, to be one; had there been two, or three, or more, if this could have been done, it would not have come from the pure and simple gift of God, but from man’s free will and choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 2.27 in Nicene and Post-Nicene Fathers 1, 5: 55.</span></figcaption>

<blockquote><p>Eternity is a perpetual duration, which hath neither beginning nor end. Time hath both. Those things we say are in time, that have beginning, grow up by degrees, have succession of parts. Eternity is contrary to time, and is therefore a permanent and immutable state, a perfect possession of life without any variation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Eternity of God</span></figcaption>

<blockquote><p>Election and rejection or reprobation, and in general the will of God, may be considered either quoad actum voluntis, ‘as touching the act of’ God ‘willing,’ or as touching the things willed. Of this distinction, this author [Samuel Hoard] takes no notice; It is fit for some and advantageous to fish in troubled waters. Now as touching the act of God willing, both Aquinas has proved that there can be no cause thereof and withal professes that never was any so mad as to say that merits can be the cause of predestination, quoad actum praedestinantis, ‘as touching the act of’ God ‘predestinating’. And Bradwardine has curiously disputed this way, that no will of God is conditional, to will quoad actum volentis; and [Johannes] Piscator against Vorstius has proved the same after his way; and by variety of demonstration this way may be convinced, as in part I have showed in this discourse, both on the part of election and on the part of reprobation. And both Dr. [Thomas] Jackson [an Arminian] in his book of Providence, professes that the distinction of Voluntas antecedens and consequens, or antecedent and consequent will in God, is to be understood quoad res volitas, ‘as touching the things willed’, as much as to say, non quoad actum volentis. And Gerardus Vossius [an Arminian], drawing the distinction of will antecedent and will consequent unto the distinction of will absolute and will conditional, applies it only quoad res volitas, and so interprets Fathers’ discourse[s] thereof; And of a conditional will gives this instance: God will have men to be saved in case they believe, where faith is clearly made the condition of salvation, a temporal thing, the condition of a temporal thing, not the condition of God’s will to save, it being no way fit that a temporal thing should be made the condition of a thing eternal, such as is God’s will to save. And this is more apparent by the reading of Vossius himself, History of Pelagianism, bk. 7, treating of God’s will to save all. Now if we speak thus of God’s will quoad res volitas, ‘as touching the things willed,’ these things willed being very different, we have reason to consider them distinctly also. Now these things are either grace or glory, commonly called salvation; and as touching grace, to wit, the grace of regeneration, the grace of faith and repentance, we willingly confess that God’s will to confer them is so absolute that He has determined to confer them according to the mere pleasure of his will, not according to man’s works (which is plain Pelagianism and condemned in the Synod of Palestine above 1200 years ago); and as He gives them to whom He will, so He denies them to whom He will, according to that Rom. 9:18, ‘He hath mercy on whom He will, and whom He will He hardneth.’ But as touching salvation or damnation, in which respect this author usually speaks of the absolute or conditional will of God, we utterly deny that God in the dispensation or administration, or execution of these proceeds or ever did decree to proceed according to the mere pleasure of his own will, but altogether according to their works. For albeit God has made no law according whereto He means to proceed in giving or denying grace, yet has He made a law according whereto He proceeds in bestowing salvation and inflicting damnation. And the law is this: ‘Whosever believeth shall be saved; whosoever believeth not shall bedamned.’ 2 Cor. 5:10, ‘We must all appear before the judgment seat of Christ, that every man may receive the things, which are done in his body according to that he hath done, whether good or evil.’ So that according to that sense wherein this author usually speaks of the absolute and conditional will of God, we utterly deny that God does absolutely elect any man to salvation or reject any man unto damnation, though He does absolutely elect some unto grace, that is to the grace of regeneration, to the grace of faith and repentance, and absolutely reject others therefrom. For as much as He bestows these graces on some and denies them unto others not according to their works, but according to the mere pleasure of his own will, but he does not inflict damnation or bestow salvation according to the mere pleasure of his will, but according unto man’s works. And as he carries himself in the execution of salvation and damnation, after the same manner He did from everlasting decree to carry Himself, namely to save no man of ripe years but by way of reward of their faith, repentance and good works, [and] so to damn none but for their infidelity, impenitency and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, ... (d. 1646; Oxford, L.L., 1653), bk. 1, pt. 2, Discourse, 3rd Sort of Reasons, pp. 250-51</span></figcaption>

ed%3B+whosoever+believeth+not+shall+bedamned.%E2%80%99+2+Cor.+5%3A10%2C+%E2%80%98We+must+all+appear+before+the+judgment+seat+of+Christ%2C+that+every+man+may+receive+the+things%2C+which+are+done+in+his+body+according+to+that+he+hath+done%2C+whether+good+or+evil.%E2%80%99+So+that+according+to+that+sense+wherein+this+author+usually+speaks+of+the+absolute+and+conditional+will+of+God%2C+we+utterly+deny+that+God+does+absolutely+elect+any+man+to+salvation+or+reject+any+man+unto+damnation%2C+though+He+does+absolutely+elect+some+unto+grace%2C+that+is+to+the+grace+of+regeneration%2C+to+the+grace+of+faith+and+repentance%2C+and+absolutely+reject+others+therefrom.+For+as+much+as+He+bestows+these+graces+on+some+and+denies+them+unto+others+not+according+to+their+works%2C+but+according+to+the+mere+pleasure+of+his+own+will%2C+but+he+does+not+inflict+damnation+or+bestow+salvation+according+to+the+mere+pleasure+of+his+will%2C+but+according+unto+man%E2%80%99s+works.+And+as+he+carries+himself+in+the+execution+of+salvation+and+damnation%2C+after+the+same+manner+He+did+from+everlasting+decree+to+carry+Himself%2C+namely+to+save+no+man+of+ripe+years+but+by+way+of+reward+of+their+faith%2C+repentance+and+good+works%2C+%5Band%5D+so+to+damn+none+but+for+their+infidelity%2C+impenitency+and+evil+works.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%2C+consistent+with+his+absolute+Hatred+or+Reprobation+of+the+Vessels+of+Wrath%2C+...+%28d.+1646%3B+Oxford%2C+L.L.%2C+1653%29%2C+bk.+1%2C+pt.+2%2C+Discourse%2C+3rd+Sort+of+Reasons%2C+pp.+250-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbad5963280.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bad5963280.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Election%20and%20rejection%20or%20reprobation%2C%20and,their%20infidelity%2C%20impenitency%20and%20evil%20wo <blockquote><p>Having proved it [the Mosaic deliverance of the 10 Commandments] is a covenant, all the difficulty remains in declaring what covenant it is; for here is much difference of judgements, even with the learned and orthodox… Some explain it thus: God (say they) had a primary or antecedent will in giving of the Law, or a secondary and consequent: His primary will was to hold out perfect and exact righteousness, against which the apostle argues and proves no man can be justified thereby: but then God, knowing man’s impotency and inability, did secondarily command repentance and promises a gracious acceptance through Christ; and this [understanding] may be very well received, if it be not vexed with ill interpretations. But, lastly, this way I shall go: The Law (as to this purpose) may be considered more largely, as that whole doctrine delivered on Mount Sinai with the preface and promises adjoined and all things that may be reduced to it; or more strictly, as it is an abstracted rule of righteousness, holding forth life upon no terms but perfect obedience. Now take it in the former sense: it was a covenant of grace; take it in the later sense, as abstracted from Moses’s administration of it, and so it was not of grace, but works.</p></blockquote>

<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>

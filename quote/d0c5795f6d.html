<main class="wrap"><figure class="quote" id="q-d0c5795f6d" data-kw="">
<blockquote><p>As the relatively strict confessionalism of the sixteenth and seventeenth centuries gave way to various patterns of deconfessionalization, it became increasingly difficult to justify and sustain a strict understanding of the fundamental articles. Among the Reformed themselves, the half century from 1675 to 1725 saw a shift from the attempt to define confessional orthodoxy in the strictest terms in the Formula Consensus Helvetica to the passing of strict confessional subscription throughout nearly all of Protestant Switzerland. At the same time, in England, the Dissenting clergy [after 1662] were unable to maintain any sort of standardized confessional subscription and the Anglican Church had reached the conclusion that both Reformed and Arminian constructions of the doctrine of salvation could be legitimate under subscription to the Thirty-Nine Articles–and some even argued the legitimacy of non-Nicene understandings of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (2003) 1.428-9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-096963ca8c" data-kw="">
<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>

r%20premises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-abd2d967b8" data-kw="">
<blockquote><p>If ye state yourselves into parties, as the Corinthians did, how will ye avoid being puffed up for one against another? and what one says be taken as an oracle and what another says cried down according to interest and affection? Cum res transit in affectum, perit judicium [When a thing turns to affection, judgment perishes]. Beware of a wrong bias upon your affection, for that will bias and bribe your judgment, and forbear rash judgings and spurning at ministers, 1 Cor. 4:5. Censure only what the Scripture censures and approve only what it approves; else ye may soon take light for darkness, etc.</p></blockquote>

</figure><figure class="quote" id="q-e5add384d7" data-kw="">
<blockquote><p>If you ask, ‘Whom must we learn of?’ I answer: Of those that know, and have learned themselves. No name or title, or relation, or habit will enable any man to teach you that which he knows not himself. 1. Children must learn of their parents and tutors. 2. People must learn of their able, faithful pastors and catechizers. 3. All Christians must be teachers by charitable helps to one another… 4. Take nothing as necessary to the being of Christianity and to salvation which is not recorded in the Scripture and has not been held as necessary by all true Christians in every age and place… 5. Maintain the unity of the Spirit in the bond of peace with all true Christians as such, and live in love in the communion of saints… 6. Prefer not any odd or singular sect before the universal consent of the faithful in your learning or communion, so far as the judgment of men is to be regarded… 7. Never set a doubtful opinion against a certain truth or duty: reduce not things certain to things uncertain; but contrarily uncertain things to certain: for instance, It is certain that you ought to live in love and peace with all that are true Christians, and to do good to all and wrong to none: Let not any doubtful difference make you violate this rule, and hate, and slander and backbite, and hurt them for a doubtful, indifferent or unnecessary thing… 8. Faithfully serve Christ as far as you have attained, and be true to all the truth that you know; sin not by omission or practice against the knowledge which you have, lest God in justice give up your understanding to believe a lie. 9. Remember that all men on earth are ignorant, and know but as in a glass, and in part, and therefore the best have many errors: No man knows the smallest grass or worm with an adequate, perfect knowledge. And if God bear with multitudes of errors in us all, we must bear with such as are tolerable in each other… Divinity is not less mysterious than Law and Physic, etc. where controversies abound. 10. Yet stilt not yourselves in knowledge, nor say we have learned enough, but continue as Christ’s scholars in learning more and more to the death: the wisest know little, and may still increase. There is a great difference in excellency, usefulness and comfort between men of clear digested knowledge, and confused undigested apprehensions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 283-87 in Sermon 11, ‘The Cure of Melancholy &amp; Overmuch Sorrow by Faith &amp; Physic’ in A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved by Sundry Ministers in October, 1682 ed. Samuel Annesley (London: Dunton, 1683), pp. 285-87</span></figcaption>

</figure><figure class="quote" id="q-388b438a3a" data-kw="">
<blockquote><p>First, for schismatical Churches, that is, such as embrace and profess the common saving faith of the catholic Church; but yet have separated themselves from the outward communion of those particular visible Churches, that sometimes they have been, and should be members of: the cause of such schisms is sometimes pride, discontent, weakness, willfulness, pretended zeal, a factious spirit; always it is Satan’s instigation, and man’s acceptation: whatsoever the cause be, and how great soever the schism be, though they be justly condemned as schismatical, in regard they are rent from the outward fellowship of such visible congregations as they belong unto, yet because they hold correspondency with the catholic Church in matters of saving faith, and accordingly profess the same, they [the schismatics] cannot be denied to be true visible Churches: Such were the Donatists of old, and such are the Brownists at this day…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 2, Lecture 26; p. 151</span></figcaption>

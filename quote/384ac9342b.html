<main class="wrap"><figure class="quote" id="q-384ac9342b" data-kw="">
<blockquote><p>32. They [presbyterians] hold (I believe with warrant of God’s Word) if the king refuse to reform religion, the inferior judges, and assembly of godly pastors and other church-officers may reform; if the king will not kiss the Son, and do his duty in purging the House of the Lord, may not Elijah and the people do their duty and cast out Baal’s priests [1 Kings 18:19-24, 30, 37-40]. Reformation of religion is a personal act that belongs to all, even to any one private person according to his place. 33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17). 34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex (1644; Edinburgh: Ogle, 1843)</cite>, p. xxiii</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>

</figure><figure class="quote" id="q-0e46a7aa42" data-kw="">
<blockquote><p>But if they [the Resolutioners] will extend it [the ordination vows] further, and say that it is meaned of absolute subjection to the sentence of his brethren, whether he have offended or not, they may as well, and with more color of reason, say that he is bound by his oath, not only to give subjection, but also obedience† to all their admonitions, whether just or unjust, lawful or unlawful; because there is no express limitation in the words of the oath, these qualifications, being as we said before, amongst the praecognita [assumptions] and praesupposita [presuppositions] of all such questions and answers, and there being no need to express them, except where there are grounds of jealousy.</p></blockquote>

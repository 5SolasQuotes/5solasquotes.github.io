<main class="wrap"><figure class="quote" id="q-0c7bcfc779" data-kw="">
<blockquote><p>But we have yet more to do, for the consequence of our argument is also denied both by the prelatical faction and by others [congregationalists] (whom we are more sorry to contradict) holding that reasons fetched from the Jewish Church do better fat the prelates than the consistorians; howsoever now to fetch the form of government for the Church from the Church of the Jews, were, say they, to revive the Old Testament. To me it seems strange that both the one side and the other do when they please reason from the forms of the Jewish Church and yet they will not permit us to reason in like manner. The former go about to prove the prelacy by the high priesthood and the lawful use of organs in the Church from the like in the temple of Solomon. The latter do argue that a congregation has right not only to elect ministers, but to ordain them and lay hands on them because the people of Israel laid hands on the Levites. That the maintenance of the ministers of the Gospel ought to be voluntary, because under the Law God would not have the priests and Levites to have any part or inheritance in the land of Canaan, but to be sustained by the offerings and altars of the Lord. That the power of excommunication is in the body of the Church, because the Lord laid upon all Israel the duty of removing the unclean and of putting away leaven out of their houses at the feast of Passover. Is it right dealing now to forbid us to reason from the form of the Jews? I will not use any further expostulation, but let the reader judge. The truth is this, even as that which is in a child, as he is a child, agrees not to a man, yet that which is in a child, as he is animal rationale, agrees also to a man: so what we find in the Jewish Church, as it was Jewish or in infancy and under the pedagogy of the Law, agrees not indeed to the Christian Church. But whatsoever the Jewish Church had as it was a political Church, or ecclesiastical republic (of which sort of things, the diversity and subordination of ecclesiastical courts was one) does belong by the same reason to the Christian Church. I say further, though the commonwealth and civil policy of the Jews be not in all points a pattern to our civil policy, yet I am sure it is no error to imitate the civil policy of the Jews in such things as they had, not for any special reason proper to them, but are common to all well constituted commonwealths, and so we may argue from their commonwealth that it is a good policy to have diverse civil courts and the higher to receive appellations from the inferior, as it was among them. Shall we not by the very like reason fetch from their ecclesiastical republic, diversity of spiritual courts, and the supreme to receive appellations from the inferior, because so was the constitution of the Jewish Church and that under the common respect and account of a political Church, and not for any special reason which does not concern us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, bk. 1 ToC of Aaron’s Rod Blossoming, or the Divine Ordinance of Church Government Vindicated… (Edinburgh: Ogle, Oliver &amp; Boyd, 1844), | 12. Fourteen arguments to prove that scandalous and presumptuous offenders against the moral law (though circumcised and not being legally unclean) were excluded from the Passover 56, p. 57</span></figcaption>

<blockquote><p>And as touching things of prudence, they are things properly mixed [partly moral and partly positive], as at what hour sermon shall begin in such a church, at eight, or nine or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; for to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12. Not to imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro, p. 6</span></figcaption>

<blockquote><p>Because these places [of Scripture] do not only apply the titles indifferently, but do indifferently apply the duties, qualifications and every other thing that belongs to such officers and offices; and there is nothing spoken of the one in Scripture, but it is also spoken of the other, neither anything required as a qualification in, or duty from the one, but is also done in reference to the other, and that expressly.</p></blockquote>

<blockquote><p>A man may be in some sort called by another to exercise some power which is not his that so called him. As when a physician is called by the civil magistrate or by a bishop to exercise such art as he has, among the people that are ruled by him. For no man I think will say that such a physician in giving of a potion does exercise a kingly or an episcopal power. So likewise is the case of a schoolmaster set in place by a bishops license and authority: in teaching of grammar, he does not exercise the power of a bishop.</p></blockquote>

<blockquote><p>This I do infinitely grieve at, that many most wholesome precepts of divine Scripture are little regarded, and in the meantime all is so full of many presumption, that he is more grievously found fault with who during this octaves touches the earth with his naked foot than he that shall bury his soul in drunkenness. And after, I cannot approve them, and I think they are to be cut off wheresoever we have power. Many of these things, for fear of scandalizing many holy persons, or provoking those that are turbulent, I dare not freely disallow.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This I do infinitely grieve at, that many most wholesome precepts of divine Scripture are little regarded, and in the meantime all is so full of many presumption, that he is more grievously found fault with who during this octaves touches the earth with his naked foot than he that shall bury his soul in drunkenness. And after, I cannot approve them, and I think they are to be cut off wheresoever we have power. Many of these things, for fear of scandalizing many holy persons, or provoking those that are turbulent, I dare not freely disallow.”

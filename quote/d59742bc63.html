<blockquote><p>But Damascene makes the emphasis on the mode of willing. For he distinguishes in God an antecedent will and a consequent will. And the antecedent will is the will with respect to that for which God makes man, and it is irrefragably of goods. The consequent will, however, is the will, not that which follows merits, but that which wills some things according to the foreknowledge of merits. The first, namely the antecedent, is called by the masters the conditional will or the will by which God wills, as far as it depends on Him. The second, however, namely the consequent, is called absolute. The difference, however, between this will and that is not according to a diversity of affection or mode of willing that is in God, but according to the reason of connoting and understanding. For as God is said to will the salvation of all, as far as it depends on Him and antecedently, there is connoted in all men an orderability to salvation, both on the part of the nature given and on the part of the grace offered. For God gave a nature according to which they could know Him and, once known, seek Him, and once sought, find Him, and once found, adhere to Him, and through this obtain salvation. He similarly offered grace, when he sent and offered his Son, whose price sufficed for the salvation of all. He also bestowed and showed the laws and mandates of salvation. He Himself is also present to all who inquire and is near to all who call upon Him. Therefore, to will antecedently to save man is to do what is ordered to salvation and not to be lacking to the one who wills to arrive. Whence, to will antecedently to save does not connote salvation, but orderability to salvation. To will, however, consequently or absolutely to save is to will to give salvation to him whom he foreknows will arrive at salvation through his help and grace, and it connotes the event of salvation. And thus it is not to be said that God wills all men to be saved. The masters agree more with this response, although both are good. According to this, therefore, it must be answered that God wills all men to be saved, as far as it depends on Him or by his antecedent will, but not by his absolute or consequent will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 46, Question 1, ‘Whether God wills all men to be saved by the will of his good-pleasure? [No]’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4e40a5d205" data-kw="">
<blockquote><p>And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.</p></blockquote>

</figure><figure class="quote" id="q-3299ae28fa" data-kw="">
<blockquote><p>Question: But how could he [Paul] wish this [to be accursed from Christ for his brethren’s sake, in Rom. 9:3], seeing it imports a diminution of the love of God… Answer: If ye will consider this petition by itself, it was neither sin nor dimunition of this love: but if ye will consider the consequents of this wish, if indeed he had been excluded from the Kingdome of heaven, then it had been a sin for him to have wished it. One may wish a thing simply without sin, yet to wish it vestitum omnibus circumstantiis [clothed with all circumstances] it may be sin. Example: a woman has her husband to be executed for some capital offence, the woman wished her husband to live, as her husband and a father to her children to provide for them; but if she should desire her husband to live as an enemy to the commonwealth contrary to the law, then her wish were a sinful wish: So for Paul to wish this to testify his earnest love to the Church, it was no sin; but if he had wished it vestitum ominibus circumstantiis, with a diminution of the love of God and want of eternal happiness, then his wish had been sin. Again we wish a thing antecedente voluntate vel consequente voluntate, ‘with an antecedent or consequent will.’ Example: a judge by his antecedent will wishes that all the subjects may live; but by his consequent will, he wishes the malefactor to die. So Paul wished this by his antecedent will, but not considering it with all the consequents that might follow upon it. Fourthly, Paul wished not this absolutely, but in comparison: as the natural mother who pleaded before Solomon chose rather that the child should be given to her who was not the mother of it than that the child should be cut in two, 1 Kn. 3:26. If ye consider Paul’s wish here, it was only in comparison; rather than they should die, he wishes this to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Moral Law, or Ten Commandments</cite>, ... (London: Cotes, 1632), bk. 1, Commandment 1, Exercitation 7, pp. 50-51</span></figcaption>

<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>

<blockquote><p>In a wonderful and ineffable manner, that which is done even contrary to His will is not done apart from His will; for it would not happen if He did not permit it. Nor does He permit it unwillingly, but willingly. Nor would He, being good, permit evil to be done unless, being omnipotent, He were also able to bring good out of evil.” Augustine, Handbook on Faith, Hope &amp; Love, ch. 100] 2. Conditional, when He wills, some condition being put in us; so God would have all men saved on this condition, if they can believe. The first of these is by another name called Voluntas beneplaciti, the last Voluntas signi. God’s will is:

1. Secret, Voluntas propositi, that whereby He has absolutely and freely determined with Himself what He will do, permit or hinder. Ps. 115:3; Eph. 1:11; Rom. 9:18, called the will of God concerning us.

2. Revealed, Voluntas praecepti, that whereby God has manifested what He would have believed, done or left undone by his reasonable creatures, Mk. 3:35; 1 Thess. 4:3. That distinction of God’s will into beneplaciti et signi, differs little from this. Signi is the same with revealed. Beneplacitum is the decree properly so called, which may be either hidden or manifest.</p></blockquote>

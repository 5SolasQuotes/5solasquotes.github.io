<main class="wrap"><figure class="quote" id="q-9bae189c45" data-kw="">
<blockquote><p>To be justified in the sight of God, to be Justified by faith or by works. A man is said to be justified in the sight of God when in the judgment of God he is deemed righteous, and is accepted on account of his righteousness…Thus we simply interpret justification, as the acceptance with which God receives us into his favor as if we were righteous; and we say that this justification consists in the forgiveness of sins and the imputation of the righteousness of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“To be justified in the sight of God, to be Justified by faith or by works. A man is said to be justified in the sight of God when in the judgment of God he is deemed righteous, and is accepted on account of his righteousness…Thus we simply interpret justification, as the acceptance with which God receives us into his favor as if we were righteous; and we say that this justification consists in the forgiveness of sins and the imputation of the righteousness of Christ.”

— John Calvin, Institutes 3.11.2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+be+justified+in+the+sight+of+God%2C+to+be+Justified+by+faith+or+by+works.+A+man+is+said+to+be+justified+in+the+sight+of+God+when+in+the+judgment+of+God+he+is+deemed+righteous%2C+and+is+accepted+on+account+of+his+righteousness%E2%80%A6Thus+we+simply+interpret+justification%2C+as+the+acceptance+with+which+God+receives+us+into+his+favor+as+if+we+were+righteous%3B+and+we+say+that+this+justification+consists+in+the+forgiveness+of+sins+and+the+imputation+of+the+righteousness+of+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+3.11.2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9bae189c45.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9bae189c45.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/08/calvin-sinners-are-justified-only-by-free-acceptance-is-the-forgiveness-of-sins-and-the-imputation-of-christs-righteousness/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-246cf2ebb2" data-kw="">
<blockquote><p>As I have said, therefore, the statement of Moses, “Cursed be everyone who does not abide by all things, etc.,” is not contrary to Paul’s declaration that all who rely on works of the Law are under a curse. For Moses demands a doer who keeps the Law perfectly. But where are we to find such a one? Nowhere. Paul admits that he is not such a one, because he says in Rom. 7:15: “I do not do what I want”; and David says: “Enter not into judgment with Thy servant” (Ps. 143:2). Therefore Moses, together with Paul, necessarily drives us to Christ, through whom we become doers of the Law and are accounted guilty of no transgression. How? First, through the forgiveness of sins and the imputation of righteousness, on account of faith in Christ; secondly, through the gift and the Holy Spirit, who creates a new life and new impulses in us, so that we may keep the Law also in a formal sense. Whatever is not kept is forgiven for the sake of Christ. Besides, whatever sin is left is not imputed to us. Thus Moses agrees with Paul and means the same thing when he says: “Cursed be everyone, etc.,” because he denies that they are keeping the Law when they want to justify themselves on the basis of works; and with Paul he concludes that they are under a curse. Therefore Moses requires true doers, who are men of faith, just as Paul condemns those who are not true doers, that is, who are not men of faith. There is no problem here. Moses was speaking negatively and Paul affirmatively, provided that you define correctly what “doing” means. Thus both are true, namely, that all are under a curse who do not abide by all things, etc., and that those who rely on works of the Law are under a curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260–261.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260–261.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+I+have+said%2C+therefore%2C+the+statement+of+Moses%2C+%E2%80%9CCursed+be+everyone+who+does+not+abide+by+all+things%2C+etc.%2C%E2%80%9D+is+not+contrary+to+Paul%E2%80%99s+declaration+that+all+who+rely+on+works+of+the+Law+are+under+a+curse.+For+Moses+demands+a+doer+who+keeps+the+Law+perfectly.+But+where+are+we+to+find+such+a+one%3F+Nowhere.+Paul+admits+that+he+is+not+such+a+one%2C+because+he+says+in+Rom.+7%3A15%3A+%E2%80%9CI+do+not+do+what+I+want%E2%80%9D%3B+and+David+says%3A+%E2%80%9CEnter+not+into+judgment+with+Thy+servant%E2%80%9D+%28Ps.+143%3A2%29.+Therefore+Moses%2C+together+with+Paul%2C+necessarily+drives+us+to+Christ%2C+through+whom+we+become+doers+of+the+Law+and+are+accounted+guilty+of+no+transgression.+How%3F+First%2C+through+the+forgiveness+of+sins+and+the+imputation+of+righteousness%2C+on+account+of+faith+in+Christ%3B+secondly%2C+through+the+gift+and+the+Holy+Spirit%2C+who+creates+a+new+life+and+new+impulses+in+us%2C+so+that+we+may+keep+the+Law+also+in+a+formal+sense.+Whatever+is+not+kept+is+forgiven+for+the+sake+of+Christ.+Besides%2C+whatever+sin+is+left+is+not+imputed+to+us.+Thus+Moses+agrees+with+Paul+and+means+the+same+thing+when+he+says%3A+%E2%80%9CCursed+be+everyone%2C+etc.%2C%E2%80%9D+because+he+denies+that+they+are+keeping+the+Law+when+they+want+to+justify+themselves+on+the+basis+of+works%3B+and+with+Paul+he+concludes+that+they+are+under+a+curse.+Therefore+Moses+requires+true+doers%2C+who+are+men+of+faith%2C+just+as+Paul+condemns+those+who+are+not+true+doers%2C+that+is%2C+who+are+not+men+of+faith.+There+is+no+problem+here.+Moses+was+speaking+negatively+and+Paul+affirmatively%2C+provided+that+you+define+correctly+what+%E2%80%9Cdoing%E2%80%9D+means.+Thus+both+ </figure><figure class="quote" id="q-ed27b9bc75" data-kw="">
<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-41a65a8c0f" data-kw="">
<blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)</span></figcaption>

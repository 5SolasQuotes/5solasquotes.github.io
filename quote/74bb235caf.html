<main class="wrap"><figure class="quote" id="q-74bb235caf" data-kw="">
<blockquote><p>We have gotten the new heavens and as a pledge of that the bridegroom’s love-ring: The children of the wedding chamber have cause to skip and leap for joy, for the marriage supper is drawing nigh and we find the fours-hours sweet &amp; comfortable. O time be not slow! O sun move speedily, &amp; hasten our banquet? O bridegroom be like a roe, or a young hart upon the mountains!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, (1664) | To Mr. Thomas Garven (117), p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aa0b348ef9" data-kw="">
<blockquote><p>His comforts to me are not dealt with a niggard’s hand, but I would fain learn not to idolize comfort, sense, joy, and sweet felt-presence: All these are but creatures, and nothing but the kingly robe, the gold-ring and the bracelets of the Bridegroom: The Bridegroom Himself is better then all the ornaments that are about Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, (1664) | To Mr. David Dickson (197), pp. 381-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-2949f0dfa9" data-kw="">
<blockquote><p>Secondly, the mate [spouse] must be fit… diverse men have many virtues, and yet do not fit to some women: and therefore we see many times, even the godly couples to jar when they are married, because there is some unfitness between them which makes odds. What is odds but the contrary to even?… From hence came the first use of the ring in weddings, to represent this evenness: for if it be straighter than the finger it will pinch, and if it be wider than the finger it will fall off; but if it be fit, it neither pinches nor slips: So they which are like strive not…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591), pp. 30-31</span></figcaption>

</figure><figure class="quote" id="q-5e2f529fc6" data-kw="">
<blockquote><p>Secondly some things dissolve mariage… Disrumpendo, by breaking of it, viz…. Secondly, fornication, as in this verse and Mt. 19:9, where for adultery and fornication it is lawful for a man to put away his wife… [Rudolph] Gualter here includes all greater things, as poison, offering to stab, and the like: but this is doubtful, and the Scripture herein silent, and therefore Peter Martyr (pt. 2, ch. 10, §54-55) holds the contrary.</p></blockquote>

</figure><figure class="quote" id="q-0de849ba89" data-kw="">

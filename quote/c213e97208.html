</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb3f07544b" data-kw="">
<blockquote><p>Three things in fact are required for the possible real, namely: 1) that existence is not intrinsically repugnant to it; 2) that having necessary existence is repugnant to it; 3) that existence is not extrinsically repugnant to it. The last requirement involves the existence of a cause having the capacity to bring the possible into actual existence. For this reason the possible is said to have virtual existence in its cause, that is, a cause exists that has the virtue or power of producing it. The possible is also said to have ‘existence in a certain respect’ in itself, that is, existence in something intelligent as a known object (intelligible being).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>‘My Father worketh hitherto, etc.’ God having finished that work of Creation in the space of six days, rested from that work on the seventh day; but from the work of his providence, and governing the things He has made, He never rested one day from the Creation of the world. In six days the Creation of the world was finished, but the government thereof is perpetual, and God continually works in preserving and maintaining the order thereof, even as the apostle says…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Eye &amp; Wheel of Providence</cite>, (London: Tyton, 1662), ch. 1, pp. 5-6</span></figcaption>

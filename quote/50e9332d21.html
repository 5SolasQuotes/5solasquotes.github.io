<main class="wrap"><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress. 2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do. 3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-c240066799" data-kw="">
<blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 15 | ‘First Sermon’ of Sermons on the Sacraments</cite>, pp. 351-52</span></figcaption>

</figure><figure class="quote" id="q-142f3f74c3" data-kw="">
<blockquote><p>…for when we see the strictness of the institution, and how far we come short of it, we are ready to doubt that we do too little, less than God requires… the true soul can comfort itself in the sincerity of its desires; for though God accounts nothing little that springs from an upright heart… Though they cannot be perfect in their services, yet they will make a right choice, serve God after his own manner; not make it up in the pomp, what is wanting in the power of religion, as many do; but look principally to the inward part, to the truth of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 15 | ‘First Sermon’ of Sermons on the Sacraments</cite>, p. 354</span></figcaption>

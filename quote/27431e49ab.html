<blockquote><p>With urgency.—If a neighbour’s house were on fire, would we not cry aloud and use every exertion? If a friend were drowning, would we be ashamed to strain every nerve to save him? But alas! the souls of our neighbours are even now on their way to everlasting burnings,—they are ready to be drowned in the depths of perdition. Oh, shall we be less earnest to save their never-dying souls, than we would be to save their bodies? How anxious was the Lord Jesus in this! When He came near and beheld the city. He wept over it.

How earnest was Paul! “Remember that by the space of three years I ceased not to warn every one night and day with tears.” Such was George Whitfield; that great man scarcely ever preached without being melted into tears. Brethren, there is need of the same urgency now. Hell is as deep and as burning as ever. Unconverted souls are as surely rushing to it. Christ is as free — pardon as sweet as ever! Ah! how we shall be amazed at our coldness when we do get to heaven!</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39693ca8d2" data-kw="">
<blockquote><p>The gathering of churches out of churches has no footsteps in Scripture, is contrary to apostolic practice, is the scattering of churches, the daughter of schism, the mother of confusion, but the step-mother of edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a4352062c6" data-kw="">
<blockquote><p>3. Therefore let the Church of Christ, the city of the great King, full of grace, prolific offspring, let her say what the prophecy uttered about her so long before by the mouth of this pious mother confesses, “My heart is made strong in the Lord, and my horn is exalted in my God.” Her heart is truly made strong, and her horn is truly exalted, because not in herself, but in the Lord her God. “My mouth is enlarged over mine enemies;” because even in pressing straits the word of God is not bound, not even in preachers who are bound. “I am made glad,” she says, “in Thy salvation.” This is Christ Jesus Himself, whom old Simeon, as we read in the Gospel, embracing as a little one, yet recognizing as great, said, “Lord, now lettest Thou Thy servant depart in peace, for mine eyes have seen Thy salvation.” Therefore may the Church say, “I am made glad in Thy salvation. For there is none holy as the Lord, and none is righteous as our God;” as holy and sanctifying, just and justifying. “There is none holy beside Thee;” because no one becomes so except by reason of Thee. And then it follows, “Do not glory so proudly, and do not speak lofty things, neither let vaunting talk come out of your mouth. For a God of knowledge is the Lord.” He knows you even when no one knows; for “he who thinketh himself to be something when he is nothing deceiveth himself.” These things are said to the adversaries of the city of God who belong to Babylon, who presume in their own strength, and glory in themselves, not in the Lord; of whom are also the carnal Israelites, the earth-born inhabitants of the earthly Jerusalem, who, as saith the apostle, “being ignorant of the righteousness of God,” that is, which God, who alone is just, and the justifier, gives to man, “and wishing to establish their own,” that is, which is as it were procured by their own selves, not bestowed by Him, “are not subject to the righteousness of God,” just because they are proud, and think they are able to please God with their own, not with that which is of God, who is the God of knowledge, and therefore also takes the oversight of consciences, there beholding the thoughts of men that they are vain, if they are of men, and are not from Him. “And preparing,” she says, “His curious designs.” What curious designs do we think these are, save that the proud must fall, and the humble rise? These curious designs she recounts, saying, “The bow of the mighty is made weak, and the weak are girded with strength.” The bow is made weak, that is, the intention of those who think themselves so powerful, that without the gift and help of God they are able by human sufficiency to fulfill the divine commandments; and those are girded with strength whose inward cry is, “Have mercy upon me, O Lord, for I am weak.” …5. “The Lord killeth and maketh alive:” He has killed her who had many children, and made this barren one alive, so that she has born seven. Although it may be more suitably understood that He has made those same alive whom He has killed. For she, as it were, repeats that by adding, “He bringeth down to hell, and bringeth up.” To whom truly the apostle says, “If ye be dead with Christ, seek those things which are above, where Christ sitteth on the right hand of God.” Therefore they are killed by the Lord in a salutary way, so that he adds, “Savor things which are above, not things on the earth;” so that these are they who, hungering, have passed beyond the earth. “For ye are dead,” he says: behold how God savingly kills! Then there follows, “And your life is hid with Christ in God:” behold how God makes the same alive! But does He bring them down to hell and bring them up again? It is without controversy among believers that we best see both parts of this work fulfilled in Him, to wit our Head, with whom the apostle has said our life is hid in God. “For when He spared not His own Son, but delivered Him up for us all,” in that way, certainly, He has killed Him. And forasmuch as He raised Him up again from the dead, He has made Him alive again. And since His voice is acknowledged in the prophecy, “Thou wilt not leave my soul in hell,” He has brought Him down to hell and brought Him up again. By this poverty of His we are made rich; for “the Lord maketh poor and maketh rich.” But that we may know what this is, let us hear what follows: “He bringeth low and lifteth up;” and truly He humbles the proud and exalts the humble. Which we also read elsewhere, “God resisteth the proud, but giveth grace to the humble.” This is the burden of the entire song of this woman whose name is interpreted “His grace.</p></blockquote>

t+sitteth+on+the+right+hand+of+God.%E2%80%9D+Therefore+they+are+killed+by+the+Lord+in+a+salutary+way%2C+so+that+he+adds%2C+%E2%80%9CSavor+things+which+are+above%2C+not+things+on+the+earth%3B%E2%80%9D+so+that+these+are+they+who%2C+hungering%2C+have+passed+beyond+the+earth.+%E2%80%9CFor+ye+are+dead%2C%E2%80%9D+he+says%3A+behold+how+God+savingly+kills%21+Then+there+follows%2C+%E2%80%9CAnd+your+life+is+hid+with+Christ+in+God%3A%E2%80%9D+behold+how+God+makes+the+same+alive%21+But+does+He+bring+them+down+to+hell+and+bring+them+up+again%3F+It+is+without+controversy+among+believers+that+we+best+see+both+parts+of+this+work+fulfilled+in+Him%2C+to+wit+our+Head%2C+with+whom+the+apostle+has+said+our+life+is+hid+in+God.+%E2%80%9CFor+when+He+spared+not+His+own+Son%2C+but+delivered+Him+up+for+us+all%2C%E2%80%9D+in+that+way%2C+certainly%2C+He+has+killed+Him.+And+forasmuch+as+He+raised+Him+up+again+from+the+dead%2C+He+has+made+Him+alive+again.+And+since+His+voice+is+acknowledged+in+the+prophecy%2C+%E2%80%9CThou+wilt+not+leave+my+soul+in+hell%2C%E2%80%9D+He+has+brought+Him+down+to+hell+and+brought+Him+up+again.+By+this+poverty+of+His+we+are+made+rich%3B+for+%E2%80%9Cthe+Lord+maketh+poor+and+maketh+rich.%E2%80%9D+But+that+we+may+know+what+this+is%2C+let+us+hear+what+follows%3A+%E2%80%9CHe+bringeth+low+and+lifteth+up%3B%E2%80%9D+and+truly+He+humbles+the+proud+and+exalts+the+humble.+Which+we+also+read+elsewhere%2C+%E2%80%9CGod+resisteth+the+proud%2C+but+giveth+grace+to+the+humble.%E2%80%9D+This+is+the+burden+of+the+entire+song+of+this+woman+whose+name+is+interpreted+%E2%80%9CHis+grace.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+City+of+God%2C+ed.+Philip+Schaff%2C+trans.+Marcus+Dods%2C+vol.+2%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+First+Series+%28Buffalo%2C+NY%3A+Christian+Literature+Company%2C+1887%29%2C+340%E2%80%9341.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4352062c6.html&amp;via=5Solas" target="_blank" rel="noopener">Sha <blockquote><p>(5) Beware of having the persons of men in admiration, either for gifts or grace, or because of advantage, Judg. 5:16. This was it which occasioned the schisms in the Church of Corinth, admiring their teachers, they were puffed up for one against another, and one said, ‘I am of Paul, another, I of Apollo, others, I of Cephas, etc.’ even according as their humor and liking led them? take heed of being taken in the same snare. All flesh is grass, none infallible, and therefore none to be doted upon. Ne judicemus ex personis fidem, sed ex fide personas, said Tertullian. Let not your eyes be so dazzled with whatever eminency of parts or graces ye apprehend to be in any, as to set up their bare word for your oracle, or their example for your rule. This was it which drew many of the Jews (and Barnabas among the rest) into a sinful separation (Gal. 2:12-13) because they saw Peter a leading man, a prime and eminent apostle, going that way before them. And yet that pillar of the Church did therein halt, and walked not with a straight foot, and was to be blamed; and consequently to be not imitated, but shunned. It is dangerous to shape our course by another’s compass; as many a ship has been lost and run on banks by following their admiral’s lanthorn. Give eminent and godly men their due respect, but put them not in God’s room. It is divine rule, not human example we are to walk by. Follow no man further than he follows Christ, 1 Cor. 11:1… … (8) Enslave not yourselves to any person or party, so as to be over-desirous to please them or over-fearful of their censures. Is it not servile man-pleasing and cowardice to do so? and leads many to sinful compliance with dividing courses? When therefore any fervent self-conceited person or people would carry all down by their censoriousness and passions, it is high time for pastors and the aged, graver and maturer sort of Christians openly to rebuke them, to appear against them and stand their ground (as Paul did, Gal. 2:11) and not to comply with the misguided sort (though well-meaning) and their preposterous zeal, that by connivance or compliance ye may escape their censures and reproaches. He that thus saves his name, shall lose it, and perhaps on a worse account. Be not therefore cowed to silence or amen to their way, for fear of the scourge of tongues. Be valiant for the truth and against such ills, else fainting will feed their humor and invite them to be more insolent. Put on authority and Gospel-austerity to check their petulancy and untowardliness.</p></blockquote>

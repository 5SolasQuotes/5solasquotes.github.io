<blockquote><p>Section 3, That on the Lord’s Day we must abstain from carnal recreations… we ought to… feed and cherish it with vain sports and worldly recreations… To them that are wearied with labour, the rest of the Lord’s Day is the best and fittest recreation for the refreshing of their bodies; and if they be spiritually-minded, the exercises of the Sabbath before spoken of, are the best recreations for the cheering of the heart and mind. For who can reasonably think when a man is tired with the week’s labour, that… should recreate a man more, than an holy and religious rest, hearing the Word, singing of Psalms, holy conferences, and such like…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, … (London: Kingstone, 1622), ch. 39, sections 2 &amp; 3, p. 385</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b571955e76" data-kw="">
<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21 Westminster divine, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-53fccf7f2e" data-kw="">
<blockquote><p>…[by] the abrogation of these ceremonies [of preparing manna the day before and not kindling a fire in the wilderness on the Sabbath by the Israelites] ought not Christians to turn into surquedry [arrogance] and excess of feasting (as too many do) so abusing their christian liberty: but to be used with all sobriety, such as may not hinder, but help the holy spiritual duties of this day by a due refreshing of the body, for necessity, not for superfluity. … So that the whole worship and service of God, and his saving knowledge for man’s salvation (to speak nothing of bodily refreshing and works of charity for the relief of the poor) having a necessary dependance, as touching the external means, upon the due observation of the Fourth Commandment in the morality of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law &amp; the Gospel Reconciled</cite>, … (London: Slatter, 1631), pp. 40-41</span></figcaption>

</figure><figure class="quote" id="q-db215012fe" data-kw="Lord&#x27;s day apostolic institution">
<blockquote><p>Others ascend to a divine ordination, so that either Christ himself may be said to have immediately and expressly instituted that day, which Junius holds and some others with him; or mediately only inasmuch as the apostles inspired of God sanctioned it in the Christian church by precept, example and their own practice. This is the more common opinion of the orthodox and to this we adhere.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-96e9c4f20c" data-kw="">
<blockquote><p>That objection of Durandus would have force if God rendered the reward to good works out of commutative justice; but since God has decreed to give rewards to those who work well out of distributive justice, it is not necessary that we properly give him anything. For neither do those who run for the prize give anything to the king, and yet the king is bound to give the prize to him who has outstripped the rest in the race. Let it stand, therefore, that the good works of the just merit eternal life out of justice, and so ex condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4926e4926f" data-kw="">
<blockquote><p>Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.”

</figure><figure class="quote" id="q-d975b1fe9f" data-kw="">
<blockquote><p>Absolutely, man cannot exact anything from God, since all things are his; yet, given his will and pact, by which he wills not to require our works of us gratis but to render a reward according to the proportion of the works, we can truly exact the reward from him: just as a slave cannot absolutely ask any reward of his master, since all that the slave acquires he acquires for his master; yet if it please the master to give him his works as his own, and to promise a reward for them as though they were not owed to him, he will by right ask a reward for his works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-a483e5ffc8" data-kw="">
<blockquote><p>We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 6</span></figcaption>

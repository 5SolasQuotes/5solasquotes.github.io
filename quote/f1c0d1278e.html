<main class="wrap"><figure class="quote" id="q-f1c0d1278e" data-kw="">
<blockquote><p>But the practice of this devotion [a psalmody] I derived from a higher precedent [and not just the Early Church], even of Christ and his apostles: for before the passion, immediately they sung a Psalm, saith the Scripture, hymno dicto, saith the vulgar Latin, ‘having recited or said a Psalm’. But however, it was part of David’s Psalter that was sung, it was the great Allelujah, as the Jews called it, beginning at the 113 psalm, to the 119 exclusively, part of that was sung… Against the example of Christ, if we confront the practice of Antichrist, nothing can be said greater in commendation of this manner of devotion: for B. Hippolytus, in his oration of the end of the world, saith that in the days of Antichrist, Psalmorum decantatio cessabit, they shall then no more use the singing or saying of the Psalms; which when I had observed. without any further deliberation I fixed upon the Psalter as the best weapon against him whose coming we have great reason to believe is not far off, so great preparation is making for him. From the example of Christ this grew to be a practice apostolical, and their devotion came exactly home to the likeness of the design of this very Book: they turned the Psalms into prayers. Thus it was said of Paul and Silas, Acts 16, ‘they prayed a Psalm’, so it is in the Greek… I only add this, that since according to the instruction of our blessed Savior, God is to be worshipped in Spirit and in truth, no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in Psalms and Hymns, and spiritual Songs, and the spirit of truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-vaughan.html">Robert Vaughan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects According to the Matter of Each Psalm (Oxford, 1644), The Preface, no page number. This psalter only contains the 150 psalms.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7b83c6949" data-kw="">
<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-heidegger.html">Johann H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology (1697; RHB, 2019), Locus 23, ‘On the Grace of Sanctification’, section 14</cite>, p. 166</span></figcaption>

</figure><figure class="quote" id="q-fd15ac487b" data-kw="">
<blockquote><p>…the venerable councils of the fathers [referring to Laodicea (365) and Braga (563) above] decree that vulgar psalms should not at all be sung in the Church and that ‘nothing put together in poetic fashion’ should be employed in the divine praises. … …so that to avoid growths and errors of that kind they [‘God-fearing ones‘] cling more vigorously and more carefully to divine authority and statutes of the church. This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles; his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices. It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offense and hesitation. Let us apply ourselves wholly to divine words in which there is no error, no ambiguity.. … There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agobard-of-lyons.html">Agobard of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Divine Psalmody c. 836 10 paragraphs</cite></span></figcaption>

<blockquote><p>Q. 12. What is the duty of worthy receivers, after the sacra- ment? A. Their duty is, heartily to bless God for Christ, and the benefits of his blood, Mt. 26:30, ‘And when they had sung an hymn, they went out into the mount of Olives;’ to double their care and watchfulness against sin; Eph. 4:30…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God | Exposition of the Assembly’s Catechism, p. 291</cite>, vol. 1; vol. 6</span></figcaption>

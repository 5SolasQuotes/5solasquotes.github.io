<main class="wrap"><figure class="quote" id="q-afde237aac" data-kw="">
<blockquote><p>The Bible either is or is not infallibly true. If it be not, let us scout it as a fraud and fable, not to be believed at all because it has set up these false claims. But if, on the contrary, the Bible be infallibly true, then it must be conclusive against all opposing morals, and all opposing metaphysicks [sic].

The infidelity of the eighteenth century was bold enough to take the consistent position of rejecting, with ribald scorn and furious hate, the claims of Scripture. But, as has been well said, “The undying instincts of virtue, the unceasing voices of conscience, and the inevitable needs of human life, in all its passages of sadness and sin, arose in constant and unanswerable protest against this grinning and ghastly mockery of that which meets all the demands of the human soul.” And, therefore, infidelity now takes this new and less repulsive form. It admits that Christianity is no imposture, but “a true life,” “a genuine manifestation of the religious spirit,” and that the Bible is God’s inspired word.

But then, Christianity, profoundly thankful for these compliments, must let all her claims not weigh one feather against those of the youngest sister in the circle of the sciences. And the Bible must be a thing of wax to be shaped at will by any Philosopher, or school of Philosophers, who may have, by “metaphysical enquiry or moral induction,” established a new theory. And the “student of nature,” as soon as he discovers new facts, from which he draws conclusions subversive of the authority of Scripture, must have not only his facts, but also his conclusions, too, received and accepted, or else he becomes another persecuted Galileo!

In the name of Science, we protest against this profane abuse of her name and influence! Let these noisy votaries of hers go forward in their investigations! But let them be careful how they overthrow her kingdom by setting science against herself! The elucidation and arrangement of the Evidences of Christianity have employed much of her time and strength. She has demonstrated the Scriptures to be the revealed word of God, by arguments which never have been successfully withstood. She has proved, on testimony which human reason cannot but receive, that Jesus Christ and His Apostles were witnesses sent from God. Having done this, she has accomplished a grand and noble task, and the results of it should meet with neither open nor covert hostility from any true lover of Science.

Having accomplished this work. Science has no more to do with the authority of Scripture, but only with its interpretation. She resigns her first position and Faith steps in, seats herself at the feet of Jesus, and meekly learns of Him and His inspired servants. Then it becomes accordant with the strictest philosophy and the purest science to receive any doctrine as proved, for which there can be found in Scripture, a “Thus saith the Lord.” The immortal rule of [John] Robinson then prevails; and then, if seeming contradictions arise between these old and any new elaborations of Science, every son of hers eschews all proud and rash haste, and takes full time to examine and compare. Truth always must and always will be harmonious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bailey-adger.html">John Bailey Adger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Plenary Inspiration of the Scriptures in Southern Presbyterian Review</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33dc49d682" data-kw="">
<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>

<blockquote><p>St. Paul never called Philosophical truths vain, for so he should condemn divinity, to which Philosophy is subservient: besides, truth cannot be repugnant to truth; and Philosophy is one of God’s special gifts, by which even the Gentiles were brought to the knowledge of God, and made inexcusable; there are vain opinions among some professors of Philosophy, as there are among some Divines: must therefore Philosophy or Divinity be condemned as vain: he that speaks against Philosophy doeth both bewray his ignorance and malice; in disparaging men for making use of those arms which God hath given us to fight withal against the enemies of truth; and to destroy the field of good corn, because the envious man hath sown some tears among them. To speak against Philosophy, is to speak against the light of reason, which God hath kindled in our minds.</p></blockquote>

<blockquote><p>God is incomprehensible, because it is said in Jeremiah: if the heavens above can be measured, and the foundations of the earth below can be explored, then I will cast off all the descendants of Israel (Jer 31:37).

I answer that in one sense, to comprehend means to enclose, as a house comprehends us; in another sense, it means to attain and hold.

In the first sense he is incomprehensible, because he cannot be enclosed in a created intellect, since he is most simple and because you do not know or love him to the degree that he is knowable and loveable, as a person who does not know a truth by demonstration but by opinion does not know it as perfectly as it can be known. But God knows himself, as far as he is knowable. The reason for this is that a thing is known according to the mode of its own being and truth. God, however, is infinite light and truth, whereas our light is finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super ad Philipenses</cite>, C. 3, L. 2, 127.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“God is incomprehensible, because it is said in Jeremiah: if the heavens above can be measured, and the foundations of the earth below can be explored, then I will cast off all the descendants of Israel (Jer 31:37).

I answer that in one sense, to comprehend means to enclose, as a house comprehends us; in another sense, it means to attain and hold.

In the first sense he is incomprehensible, because he cannot be enclosed in a created intellect, since he is most simple and because you do not know or love him to the degree that he is knowable and loveable, as a person who does not know a truth by demonstration but by opinion does not know it as perfectly as it can be known. But God knows himself, as far as he is knowable. The reason for this is that a thing is known according to the mode of its own being and truth. God, however, is infinite light and truth, whereas our light is finite.”

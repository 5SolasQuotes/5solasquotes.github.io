</figure><figure class="quote" id="q-810a0efac6" data-kw="">
<blockquote><p>As you allow me to speak freely, I solemnly assure you I have been most scrupulously adverse from strife and contention. I have taught nothing which did not naturally arise from the passage on which I was lecturing; yea, when occasions of speaking on the habits [vestments] have come in my way, I have ever avoided them. But I do not deny that I have said our ministry [in the Church in England] has deviated from that of the primitive and apostolic church, to the purity of which I wished ours to be conformed: but this I said in so candid and modest a way, that none but ignorant or malicious persons could find fault. Yet I hear that I am accused to your excellency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by Alexander Grosart in the biographical preface</cite>, p. ix, to A Commentary upon the Epistle… to the Colossians</span></figcaption>

</figure><figure class="quote" id="q-2ec377fb86" data-kw="">
<blockquote><p>The Genevan practice of wearing black academic gowns, white preaching bands, and black caps deliberately indicated that ministers were teachers of the Word rather than sacerdotal mediators. There clothes were not considered clerical vestments but were standard attire for clergy to be worn during and outside public worship (Maetsch, Calvin’s Company of Pastors, 19; William D. Maxwell, John Knox’s Genevan Service Book, 1556 (Westminster: Faith Press, 1965), 210-213). Lavater’s Short Work on Rites and Regulations described a similar approach to clerical attire in Zurich; however, the clerical dress was more informal than Calvin’s: clergy were to ‘wear ordinary, yet respectable clothing (as other respectable citizens do), not theatrical clothing.’ John Knox held a similarly minimalist approach among the English exiles in Frankfurt, signaling his displeasure at Cranmer’s retention of the surplice. In a sermon on Noah’s drunkenness and the subject of what should or should not be covered up, he touched upon the sensitive matter of English cleric John Hooper’s refusal to wear clerical vestments (Jane Dawson, John Knox (New Haven, CT: Yale University Press, 2016), 101). Earlier in 1550, Hooper refused to be consecrated as bishop, partly on the grounds of what he perceived to be unreformed vestments (‘those Aaronic habits’). (John Hooper to Heinrich Bullinger, June 29, 1550. See Hastings Robinson, Original Letters Relative to the English Reformation, 2 vols. (Cambridge: Cambridge University Press, 1846-1847), 1:87) In reply, both Martin Bucer and Peter Martyr Vermigli refuted his position on the basis that vestments were adiaphorus [indifferent]. Vermigli made the slightly backhanded remark that ‘indifferent things cannot corrupt those that are of a pure mind and sincere conscience in their doings.’ (Correspondence between Bucer, Martyr and Hooper in George Cornelius Gorham, Gleanings of a Few Scattered Ears During the Period of the Reformation in England (London: Bell and Daldy, 1857). Bucer and Martyr’s replies to Hooper were also used by Archbishop Parker [who sought to universally enforce such clerical dress] in response to the Vestarian Controversy under Queen Elizabeth I. Quotes are in Matthew Parker, A Brief Examination for the Tyme…, (London: Richard Jugge, 1566), RSTC 10387, sig. C.2r.) Hooper–helped by a spell in prison–begrudingly took the advice on board and was consecrated Bishop of Gloucester later that year. Thus, when Knox and his colleagues left the English congregation at Frankfurt for Calvin’s Geneva, they found the clerical attire more congenial to their approach. However, when the Genevan exiles returned home after the death of Queen Mary, they had mixed success in implementing their desired clerical attire. Knox returned to Scotland where the Genevan gown became the norm, whereas Christopher Goodman and others returned to England were vestments were retained (indeed, to the 1549 standards). The controversy over vestments was reignited and contributed to the production of the Middelburg Liturgy (1586) by the English Puritans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-earngey.html">Mark Earngey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Soli Deo Gloria: The Reformation of Worship’ being ch. 2 of Reformation Worship: Liturgies from the Past for the Present</cite>, (New Growth, 2017), pp. 42-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

<blockquote><p>What if we should yield to the Bishop that kneeling [to the bread and wine in the Supper] and holidays are with us applied to another service, and used with another meaning than they are with the Papists [as is often claimed with vestments]? Does that excuse our conformity with Papists in the external use of these ceremonies? If so, J. [John] Hart did rightly argue out of Pope Innocentius, that the church does not Judaize by the sacrament of unction or anointing, because it figures and works another thing in the New Testament than it did in the Old (Rainolds, Conference with Hart, ch. 8, div. 4, p. 496). Rainolds answers, that though it were so, yet is the ceremony Jewish; and mark his reason (which carries a fit proportion to our present purpose), ‘I trust’, he says, ‘you will not maintain but it were Judaism for your church to sacrifice a lamb in burnt-offering, though you did it to signify, not Christ that was to come, as the Jews did, but that Christ is come, etc. St. Peter did constrain the Gentiles to Judaize, when they were induced by his example and authority to follow the Jewish rite in choice of meat; yet neither he nor they allowed it in that meaning which it was given to the Jews in; for it was given them to betoken that holiness, and train them up into it, which Christ by his grace should bring to the faithful. And Peter knew that Christ had done this in truth, and taken away that figure, yea the whole yoke of the law of Moses; which point he taught the Gentiles also. Wherefore, although your church keeps the Jewish rites with another meaning than God ordained them for the Jews… yet this of Peter shows that the thing is Jewish, and you to Judaize to keep them. (Ibid., p. 496 [567])</p></blockquote>

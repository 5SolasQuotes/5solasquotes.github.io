<blockquote><p>But the work by which he is best known, and in which his learning and wit appear to the best advantage, is his ‘Defense of the Church Government… and [it] may be said to have never been answered.” – Wodrow William G. Blaikie: “Great anxiety was felt at the time by the presbyterian clergy in connection with the general use of the English liturgy in the episcopalian congregations, which had not been in common use among them till the beginning of the eighteenth century… This publication has always been considered one of the ablest defences of the presbyterian system.” – DNB Hall, Archibald – Being an Attempt to Exhibit a Scriptural View of the Nature… of the Worship of God, in the New Testament Ref Buy (Gray &amp; Alston, 1770) This has been newly reprinted by Reformation Heritage Books. . 2000’s McMahon, Matthew – The Lord’s Voice Cries to the City: A Biblical Guide for Hearing the Word of God Preached Buy (Puritan Publications, 2017) 190 pp. Willard, Dickinson, Moodey, Stone &amp; Edwards – Vain Imaginations in the Worship of God Buy (Puritan Publications, 2018) This book consists of the following works: Willard, Samuel – The Sinfulness of Worshipping God with Men’s Institutions (d. 1707) on Mt. 15:9, “But in vain do they worship me, teaching for doctrines the commandments of men.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f70124e0d4" data-kw="">
<blockquote><p>There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>

<blockquote><p>There are three fundamental principles held by non-conformists (and those especially of them which are called presbyterians) wherein they differ from others: 1. That the Scriptures of the Old and New Testament are a perfect Rule for Christians, directing them not only what to believe in the things of God, but also what to do in all matters relating to the Worship of God, and the government of the Church; so as in these things they may not either believe or do what is not there expressly, or by immediate consequence revealed. In civil matters they believe the Scripture to be only a general rule, or rather as to them, to contain some general rules only, by which all men’s actions are to be directed; but in sacred things, they believe the Scriptures to be a particular rule… Thus they differ from Papists, who will not allow the Scriptures to be a perfect rule as to matters of faith; and from those, who although they allow them in matters of faith a perfect rule, yet deny them to be so in the matters of worship, or government of the Church; and as to the first, say that the Scriptures are only a perfect rule as to acts of worship, not as to means, and modes, or religious rites used in, and about the worship of God; but that these may be directed by superiours for spiritual edification; or who say, that the Scripture has only directed that the Church should be governed, but has left to superiours to determine by what officers, acts and rules that government should be exercised: So as the first and main question is, Whether the Scriptures be a perfect and sufficient rule for Christians in matters of worship, and Church government, as well as matters of faith? which those called presbyterians believe it is; because they find sufficient directions in it for the decent and orderly performance of all acts of worship, without any human supplements; and such Church-officers directed by it, such acts of jurisdiction and censures prescribed in it, as are sufficient to preserve the unity, peace and purity of the Church; which are the great ends of that government.</p></blockquote>

<blockquote><p>…the most part of men have some form in worshipping God and please themselves in it so well that they think God well-pleased with it; but few there are who know indeed what it is to worship Him in a manner acceptable to his majesty: Now you know it is all one not to worship Him at all, as not to worship Him in that way He likes to be worshipped: Therefore the most part of men are but self-worshippers, because they please none but themselves in it, it is not the worship his soul has chosen, but their own invention, for you must take this as an undeniable ground, that God must be worshipped according to his own will and pleasure, and not according to your humor, or invention; therefore his soul abhors will-worship, devised by men out of ignorant zeal, or superstition, though there might seem much devotion in it, and much affection to God, as in the Israelites sacrificing their children, what more seeming self-denial? And yet what more real self-idolatry; God owns not such a service, for it is not service and obedience to his will and pleasure, but to men’s own will and humor: therefore a man must not look for a reward but from Himself. Now it is not only will-worship when the matter and substance of the worship is not commanded of God, but also when a commanded worship is not discharged in the appointed manner: Therefore, O how few true worshippers will the Father find? True worship must have truth for the substance and spirit for the manner of it: else it is not such a worship as the Father seeks and will be pleased with; divine worship must have truth in it, that is plain, but what was that truth, it must be conformed to the rule and pattern of worship, which is God’s will and pleasure revealed in the word of truth, true worship is the very practice of the word of truth, it caries the image and superscription and command upon it, which is a necessary ingredient in it, and constituent of it. Therefore if thy service have the image of thy own will stamped on it, it is not divine worship, but will-worship. Thus all human ceremonies and ordinances enjoined for service of God, carry the inscription not of God, but of man who is the author and original of them, and so are but adulterated and false coin, that will not pass current with God…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-aaf93bec2a" data-kw="">
<blockquote><p>How shall we hold and keep fast the letter of Scripture, when there are so many Greek copies of the New Testament? and these diverse from one another? Yes, well: for though there are many received copies of the New Testament; yet there is not material difference between them. The four Evangelists do vary in the relation of the same thing; yet because there is no contradiction or material variation, we do adhere to all of them, and deny none. In the times of the Jews before Christ, they had but one original of the Old Testament; yet that has several readings: there is a marginal reading and a line reading, and they differ no less than eight hundred times the one from the other; yet the Jews did adhere to both and denied neither; Why? Because there was no material difference. And so now, though there be many copies of the New Testament; yet seeing that there is no material difference between them, we may adhere to all:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture Light the Most Sure Light</cite>, (1656), sermon 3 on 2 Pet. 1:19, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3a3ffc529" data-kw="">
<blockquote><p>Youth could also perform comedies and tragedies, and by such means a useful form of entertainment, honorable and contributing toward an increase of piety, may be staged for the people; but it will be necessary that devout and wise men experienced in the Kingdom of Christ compose these comedies and tragedies, in which there may be presented on the stage the plans, actions and events of mankind, whether common and ordinary as it occurs in compedies or unique and eliciting admiration as it is characteristic of tragedies. All this will contribute toward a correction of morals and a pious orientation to life (Aristotle, Poetics II, 1448a). … It must be observed, however, that when in both kinds of poetic material, comic and tragic, the activities and sins of men are described and actively presented to be seen with the eyes, it should be done in such a way that although the crimes of reprobate men are related, yet a certain terror of divine judgment and horror of sin should appear in these things, and a shameless daring and an exultant delight in crimes should not be expressed. It is better here to take something away from poetic fitness rather than from the concern for edifying the piety of the spectators, which demands that in every representation of sin there be felt the condemnation of one’s conscience and the horrible fear of God’s judgment. But when pious and good actions are shown, they should express as clearly as possible a happy, secure and confident sense of the divine mercy, but moderate and diffident as regards the self, and a joyful trust in God and his promises, with holy and spiritual pleasure in doing good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 349-52 of ch. 54, ‘Honest Games’ in On the Reign of Christ, bk. 2 in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-293341cf5f" data-kw="">
<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>

</figure><figure class="quote" id="q-7b6f423734" data-kw="">
<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts</cite>, … (London: 1679), ch. 4, p. 89</span></figcaption>

</figure><figure class="quote" id="q-75f5ec9c12" data-kw="">
<blockquote><p>That which no law of God or valid law of man forbids, is not unlawful: but the use of the things forementioned, no law of God or valid law of man forbids: Therefore the use of the things forementioned, is not unlawful. He that will say that there is any such law must show that law and prove his affirmative: But let him take heed of adding to God’s law: A false prophet that fathered a false message from God was an heinous sinner. Is it not worse falsely to father a law on Him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), pt. 2, p. 10</span></figcaption>

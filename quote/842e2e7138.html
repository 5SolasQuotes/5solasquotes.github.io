<main class="wrap"><figure class="quote" id="q-842e2e7138" data-kw="">
<blockquote><p>If Adam had remained upright and done everything which God required of him, he would indeed have merited his reward, but not condignly, as if either his own person or his works were equal in value to the reward. For no creature, no matter how perfect, can merit anything from God in that sense. […] Rather he would have merited ex pacto, according to the stipulation of the covenant—that is, according to God’s good pleasure.*</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrina Foederum</cite>, (1688; republished 1702), 259–260. Translated by Aaron Denlinger.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb00224ded" data-kw="">
<blockquote><p>No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2027</span></figcaption>

</figure><figure class="quote" id="q-6d2ec44acf" data-kw="">
<blockquote><p>If Christ were now speaking of the cause of our salvation, the Papists could not be blamed for inferring that we merit eternal life by good works; but as Christ had no other design than to exhort his people to holy and upright conduct, it is improper to conclude from his words what is the value of the merits of works. … But we have another reply to offer, which is still more clear; for we do not deny that a reward is promised to good works, but maintain that it is a reward of grace, because it depends on adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>

</figure><figure class="quote" id="q-db6e52eb0d" data-kw="">
<blockquote><p>The question also arises, whether it was strictly speaking through his passion and death that Christ merited this glory for his human nature. And whereas we really do not wish to enter into a dispute with those who make this claim,† since Christ certainly did obtain it for us by the worthiness of what He merited, yet we are of the opinion that the opposite point of view, which is shared by many Reformed writers, rests upon arguments that are stronger. The chief one of these is that the glory was owed to Christ by the right of his hypostatic union, and as the Son’s, and as the Son’s rightful inheritance (Ps. 2:7-8; Heb. 1:2). And so, by the consensus of all theologians, that hypostatic union does not follow upon any merit, nor the things which necessarily and by God’s decree followed it–which is why the apostle Paul also uses the word [karisasthai] ‘to bestow as gift’ in this context (Phil. 2:9 [‘and given Him’]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Section 29 of Disputation 28, ‘On Jesus Christ in his State of Exaltation’ in Synopsis of a Purer Theology, vol. 2, ed. Henk van den Belt (1625; Brill, 2016), p. 175 In Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

ether%20it%20was%20strictly&amp;text=in%20this%20context%20%28Phil.%202%3A9%20%5B%E2%80%98and%20given%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a702a69ba8" data-kw="">
<blockquote><p>Since the initiative belongs to God in the order of grace, no one can merit the initial grace of forgiveness and justification, at the beginning of conversion. Moved by the Holy Spirit and by charity, we can then merit for ourselves and for others the graces needed for our sanctification, for the increase of grace and charity, and for the attainment of eternal life. Even temporal goods like health and friendship can be merited in accordance with God&#x27;s wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2010</span></figcaption>

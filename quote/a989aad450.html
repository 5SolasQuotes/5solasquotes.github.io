<main class="wrap"><figure class="quote" id="q-a989aad450" data-kw="">
<blockquote><p>1. …The apostle tells us there must be nudatio capitis, our heads must be uncovered. The wearing of a cap, pileo donari, among the Romans, was peculiar to free men only, and an hieroglyphic of honor, for once if a man cepisset pileum, he was free, and when he laid aside his cap, he was said deponere magnificentiam, to lay aside his honor and privilege whereby he was distinguished from a servant. So then, as servants are to be uncovered in their master’s service, so are we to be in God’s: and therefore Saint Paul (in the place before cited) tells us that it is a shame for a man to have his head covered at that time. … But in this point corruption is crept into our Church. Instead of humbling ourselves by prostration and kneeling, we are pleased to sit at our ease, and that in a proud manner: instead of the depositio magnificentiae, et nudatio capitis, kneeling and uncovering our heads, we sit, and with our heads covered too; this is not to enquire, at least not to imitate, the days of old… This sedentary prayer and proud fashion of covering the head cannot be warranted by any text in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pattern of Catechistical Doctrine at Large, or a Learned &amp; Pious Exposition of the Ten Commandments… (d. 1626; London, 1650), 2nd Commandment, ch. 7</cite>, pp. 215, 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-91a53fdb92" data-kw="">
<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms a Gospel-Ordinance… (London, 1650), ch. 10, ‘Of the Manner of Singing’</cite>, pp. 58-59</span></figcaption>

<blockquote><p>Let us take heed that our rest be not turned into idleness and vanity; but being sequestered from all rural works, and from all business, let us wholly attend upon the worship of God.” (Augustine, ibid. [PL 39, col. 2274–2275.]) The principal end then of rest, is that we might in soul and body, without all let and interruption, wholly attend upon the worship of God. . Upon the Lord’s Day we ought to rest from all honest recreations &amp; lawful delights. But to proceed in this matter according to my purpose; it is most certain that we are not only commanded to rest from these that we have spoken of, but from all other things which might hinder us from the sanctifying of the Sabbath, as well as these: of which sort are all honest recreations, and lawful pleasures, which are permitted unto us upon the other days, to further us in the works of our calling, which we do also stand in need of sometimes, even as of meat, and drink, and sleep. For if those worldly duties (which we are commanded to walk in, and be of necessity required, and without the which the commonwealth cannot stand at all) are then forbidden, when we should attend upon the Lord’s work, because we cannot be wholly occupied in both; much more those things must be given over which serve but for pleasure, without the which mankind may continue, though not so well continue. Because we cannot have the present delight in the use of them, and yet at the same time be occupied in the hearing of the Word, and such other parts of God’s holy worship and service, as He requires of us upon the Sabbath day. Nay, because men cannot be both at church serving God with the rest of the people, and in their houses sporting themselves with their companions together; nor in the great congregation (Ps. 35:18) praising God with their brethren, and in the open fields playing with their fellows at one time (and God upon the Sabbath requires these of them). Therefore, the other must give place to them, and we must not think it sufficient that we do no work upon the Sabbath, and in the mean season |263| be occupied about all manner of delights, but we must cease as well from the one as from the other. … And we must rest from these things so much the more, by how much the works of our recreation are less needful, than the works of our vocation, and yet do more hinder us from the sanctifying of the Sabbath than they. For experience (which is the mistress of very fools) may teach us (and our nature is such that it must needs be so), how much we are moved with delectable things everyone in his kind, some this way, another that; how marvelously they do affect us, how all our senses are taken up with them, and all the parts of soul and body wholly possessed with them, that for the present time none of them can be occupied about the Lord’s work immediately, at least wise as they should be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath</cite>, (Naphtali Press &amp; Reformation Heritage Books, 2015), pp. 152-53, 167, 267-68 | But the end of rest was that they might attend upon other things, whereupon St. Augustine thus concludes, in one of his sermons which we noted before: Videamus, ne otium nostrum vanum sit.</span></figcaption>

<blockquote><p>Our Savior also had a law for the strict observation of the Sabbath day, yet when it came in competition with greater, such as those that concerned the propagation of the Gospel, and the necessary refreshment of his disciples, who had attended Him from place to place, to the neglect of their bodily sustenance, he urges it not, but justifies them in the nonobservance of it. Nay, he did not only make that law to give place to the preaching of the Gospel and the necessary refreshment of his Disciples, but the helping of an ox or an ass out of the ditch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-wilson.html">Joseph Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Vanity of Human Inventions</cite>, … (London, 1666), p. 37</span></figcaption>

<blockquote><p>6. The question concerning particular works, or permitted recreations, is wholly useless and trifling: for quod lege prohibitoriâ vetitum non est, permissum intelligitur, says the law: all that is permitted which in the negative precept is not forbidden: But as for some persons to give themselves great liberties of sport on that day is neither pious nor prudent; so to deny some to others is neither just nor charitable. The plowman sits still in the Church and the Priest labours; and the wearied man is permitted to his refreshment, and others not permitted because they need it not (Ordinary Gloss on Mt. 28); and there is no violation of any commandement of God, even when there is a profanation of the day indulged upon pious and worthy considerations.</p></blockquote>

olasquotes.github.io%2Fquote%2F81490dfea0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/81490dfea0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=6.%20The%20question%20concerning%20particular%20works,indulged%20upon%20pious%20and%20worthy%20considerations&amp;text=6.%20The%20question%20concerning%20particular%20works%2C%20or%20permitted&amp;text=the%20day%20indulged%20upon%20pious%20and%20worthy%20considerations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the great rule of Gospel administrations is that all things be done to edification. This is the main end of the ministry itself, in all the duties thereof, that are purely evangelical. For this end was the office of the ministry instituted, for this end are ministerial gifts dispensed, for this end were the sacraments appointed, and all Church assemblies, Church power, and whatever else belongs to Churches; it is all ordained for this end that the Body of Christ may be edified and increased with the increase of God, Eph. 4:7-15; Col. 2:19; Acts 9:31; Rom. 14:15, 19; 1 Cor. 10:23; ch. 14:3-5; 12:26; 2 Cor. 12:19; 1 Tim. 1:4. The full and adaequate rule of all Church-order and duties is that all things be done to edification. It does not hence ensue that whatever men shall judge to conduce to edification, may be used by themselves or imposed on others in the worship of God. Christ Himself, the onely wise and competent Judge in such cases…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 10, ‘Other Considerations about the Imposition of Liturgies,’, p. 61</span></figcaption>

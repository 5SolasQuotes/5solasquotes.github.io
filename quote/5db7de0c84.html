<main class="wrap"><figure class="quote" id="q-5db7de0c84" data-kw="">
<blockquote><p>But that even our Scriptures… use metaphorical and symbolic words and discourse is clearly apparent from these things… How is it that Mary herself calls Joseph the father of Jesus (Luke 2:48)? What pious person would not profess that all these things are said improperly? Or, having been taught by Scripture, do we not firmly believe that the Lord Jesus was by no means conceived by the seed of Joseph (which certain heretics, being of unsound mind with the Jews, have dared to proclaim) but that He was conceived of the Holy Spirit (Luke 1:35), and that His blessed mother had never known a man but remained a virgin and untouched forever?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Affirmation of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rhaetian Confession (1552) | ed. Dennison, Jr., Reformed Confessions 1.675. This was a Swiss reformed confession.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-d8b5db9ae0" data-kw="">
<blockquote><p>Now the question may occupy us how Christ could have brothers, since He was the only Son of Mary, and the Virgin Mary bore no children besides Him. Some say that Joseph had been married before his marriage to Mary, and that the children of this first wife were later called Christ’s brothers… Any children born to Joseph by other wives would have been half brothers of Christ. This is the explanation offered by some. But I am inclined to agree with those who declare that “brothers” really means “cousins” here, for Holy Writ and the Jews always call cousins brothers. Be that as it may, it matters little. It neither adds to nor detracts from faith. It is immaterial whether these men were Christ’s cousins or His brothers begotten by Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4 (1539) in LW</cite>, 22:214-215</span></figcaption>

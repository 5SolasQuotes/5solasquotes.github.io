<main class="wrap"><figure class="quote" id="q-86885556c1" data-kw="">
<blockquote><p>Besides such necessary concerns of the church, there are countless temporal matters that need reform. There is discord among princes and political estates. Usury and avarice have burst in like a deluge and have taken on the color of legality. Wantonness, lewdness, extravagance in dress, gluttony, gambling, vain display, all manner of vice and wickedness, disobedience of subjects, domestics, and laborers, extortion in every trade and on the part of peasants—who can enumerate everything?—these have gained the ascendancy to such an extent that ten councils and twenty diets would not be able to set things right again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Smalcald Articles in Theodore G. Tappert, ed., The Book of Concord the Confessions of the Evangelical Lutheran Church (Mühlenberg Press, 1959), 290.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c2cd21a76" data-kw="">
<blockquote><p>First, that the blessed and long sought for union of Protestant Churches may be recommended unto the public prayers of the Church. And secondly, that either an Evangelical correspondency for mutual edification, for healing of breaches, for taking away of scandals and for the advancement of the Gospel of Jesus Christ amongst Protestants should henceforth be entertained with foreign Churches, by those to whom the care of so blessed a work may be with authority referred: Or that his Majesty, with your Honours’ advice and grave counsel, might be moved to call together a general synod of Protestants in due time, for the better setling of weighty matters in the Church, which now trouble not only the consciences of most men, but disturb the tranquility of publick states and divide the Churches one from another to the great hinderance of Christianity, and the dishonour of religion. All which evils by this means may be taken out of the way, and from hence a great blessing of God, and much honour amongst men will redound to this Church and nation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/articles-of.html">Articles of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Dury, his Petition to the Honourable House of Commons in England, now Assembled in Parliament (London, 1641) 2 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

hurch%20and%20nation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-24bf54aa64" data-kw="">
<blockquote><p>We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Papists&#x27; Damnable Faith</cite>, p. 8, Third Conclusion</span></figcaption>

</figure><figure class="quote" id="q-17d93318c3" data-kw="">
<blockquote><p>But tell me now your opinion of another matter, and that is concerning liberty of conscience, and toleration of heretics and sectaries, for which there are so many books written of late… This question about the toleration of those whose way is different from the common rule which shall be established, must be both stated and resolved, cum grano salis [with a grain of salt]. We must remember to distinguish persons from corporations or Churches, and both these from errors. Again, to distinguish persons, whether godly and gracious, or loose and libertine, whether moderate and peaceable, or factious and turbulent; whether such as have deserved well of the public, or such as have done either no service or a disservice. To distinguish corporation, whether the question be of such only as have a present existence, or of all who shall join to such a way afterward. To distinguish errors, whether practical or doctrinal only, whether fundamental, or circa-fundamental, or neither of the two. To distinguish toleration, whether absolute, or hypothetical and conditional, whether anywhere, or in some few certain places only, whether indefinite and general, or limited and bounded, and if bounded, how far and how much: Whether such toleration as may stand with the Solemn League and Covenant, or such as is inconsistent therewith; whether such as is profitable for the public peace, or such as is apparently destructive thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Late Dialogue Betwixt a Civilian &amp; a Divine Concerning the Present Condition of the Church of England… (London, 1644)</cite>, pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Dort’s form of subscription [1619] remained in use in the Reformed churches of the Netherlands for almost two hundred years. In 1816, after the monarchy was restored following the Napoleonic wars, the Dutch Reformed church was reorganized, and a new form of subscription replaced that of Dort… the new version contained a weaker declaration of agreement with ‘the doctrine, which, in agreement with God’s Holy Word, is contained in the accepted forms of unity.&#x27;” p. 279 . Book Janssen, Roelf Christiaan – By this our Subscription: Confessional Subscription in the Dutch Reformed Tradition since 1816 PhD diss. (Theologische Universiteit, Gereformeerde Kerken, 2009) 480 pp. On the era before 1619, see pp. 22-33. On the era from 1619 to 1816, see pp. 33-45. . Lutheranism On the Post-Reformation to Today Cochrane, Arthur C. – ‘The Act of Confession-Confessing’ in Sixteenth Century Journal, vol. 8, no. 4, The Formula of Concord: Quadricentennial Essays (Dec., 1977), pp. 61-83 Cochrane is a confessional Lutheran professor at Wartburg Theological Seminary (ELCA, Iowa) that here gives helpful thoughts and observations about confessing in general and historically in the Post-Reformation up through to the (German) Barmen Declaration (1934). Preus, Robert – 6. ‘Confessional Subscription’ in eds. Kiehl &amp; Werning, Evangelical Directions for the Lutheran Church (1970), pp. 43-52 . On the 1800’s Lee II, James A. – ‘Theodosius Harnack &amp; Confessional Subscription’ in Concordia Theological Quarterly, vol. 89:1 (Jan. 2025), pp. 61-83 Harnack (1817–1889) was a Baltic, German, Neo-Lutheran theologian of the Erlangen school. Abstract: “This essay explores the significant contributions of Theodosius Harnack to the nineteenth-century discourse on subscription to the Lutheran Confessions, contextualized against the debate over Johannes von Hofmann‘s theory of the atonement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-sinnema.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal (July 2007)</cite>, pp. 256-82</span></figcaption>

<main class="wrap"><figure class="quote" id="q-26919745da" data-kw="sinless without immaculate Mary">
<blockquote><p>Thus there is no necessity to have recourse to the immaculate conception of Mary. For although there is no creature of whatever power possessed who can bring a clean thing out of an unclean (Job 14:4), still the power of God is not thus to be measured (with whom nothing is impossible and who calls those things which are not).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.11.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/true-humanity.html">True Humanity</a> › <a href="../topics/the-person-of-christ/true-humanity/sinlessness-and-impeccability.html">Sinlessness and impeccability</a></span><span class="t"><a href="../topics/the-person-of-christ/true-humanity.html">True Humanity</a> › <a href="../topics/the-person-of-christ/true-humanity/virgin-birth.html">Virgin birth</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus there is no necessity to have recourse to the immaculate conception of Mary. For although there is no creature of whatever power possessed who can bring a clean thing out of an unclean (Job 14:4), still the power of God is not thus to be measured (with whom nothing is impossible and who calls those things which are not).”

— Francis Turretin, Institutes of Elenctic Theology, 13.11.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%20there%20is%20no%20necessity%20to%20have%20recourse%20to%20the%20immaculate%20conception%20of%20Mary.%20For%20although%20there%20is%20no%20creature%20of%20whatever%20power%20possessed%20who%20can%20bring%20a%20clean%20thing%20out%20of%20an%20unclean%20%28Job%2014%3A4%29%2C%20still%20the%20power%20of%20God%20is%20not%20thus%20to%20be%20measured%20%28with%20whom%20nothing%20is%20impossible%20and%20who%20calls%20those%20things%20which%20are%20not%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2013.11.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26919745da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26919745da.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b75b7256b9" data-kw="virgin birth Holy Spirit">
<blockquote><p>The conception is that by which Christ was invisibly formed in the womb of the blessed virgin, without the concurrence of man, but by the power and overshadowing of the Holy Spirit alone: “That which is conceived in her is of the Holy Ghost” (Mt. 1:20). In this a twofold principle must be remarked: an active—the Holy Spirit; a passive—the blessed virgin. The active principle was not a man (as in ordinary generation) because the conception should be such as to permit the virginity of the blessed virgin to remain pure and inviolate. It was also one by which Christ should be free from all taint of sin, which is usually propagated and contracted by ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.11.2–3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/true-humanity.html">True Humanity</a> › <a href="../topics/the-person-of-christ/true-humanity/virgin-birth.html">Virgin birth</a></span><span class="t"><a href="../topics/the-person-of-christ/true-humanity.html">True Humanity</a> › <a href="../topics/the-person-of-christ/true-humanity/sinlessness-and-impeccability.html">Sinlessness and impeccability</a></span><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a> › <a href="../topics/the-states-of-christ/state-of-humiliation/incarnation.html">Incarnation</a></span></div>

</figure><figure class="quote" id="q-f42ee4c27d" data-kw="extra calvinisticum circumscription">
<blockquote><p>For the more easily to evade the argument drawn from the ascension of Christ to prove the circumscription of Christ’s body, they deny that Christ truly and properly ascended; but only figuratively, inasmuch as he withdrew his visible presence from the world (although he still remains in the world invisibly). And the heaven into which he ascended (they maintain) is not the highest or third heaven (called the heaven of the blessed), but the heaven of the beatitude and kingdom of God (which is everywhere). We affirm that Christ ascended properly by a local movement from the lower places to the supreme heaven of the blessed; and deny the metaphorical disappearance against the Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.18.1</span></figcaption>

</figure><figure class="quote" id="q-bbeb5e21f4" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incarnation</cite>, ch. 1</span></figcaption>

</figure><figure class="quote" id="q-4730c523b9" data-kw="session not ubiquity">
<blockquote><p>What is the session of Christ at the right hand of God? According to what nature does it apply to Christ and does it pertain to the relation of situation? We deny. This question is necessary on account of the Lutherans, who, to prove the omnipresence and omnipotence of the human nature of Christ, maintain that he (according to his human nature) sits at God’s right hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.19.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0991b36d39" data-kw="">
<blockquote><p>Meditate upon the mercy of God; mercy is an innate disposition in God to do good; as the Sun hath an innate property to shine, Psalm 86.5. Thou Lord art good, and ready to forgive, and plenteous in mercy to all them that call upon thee. God’s mercy is so sweet, that it makes all his other attributes sweet. Holiness without mercy, and Justice without mercy were dreadful. Geographers write that the City of Syracuse in Sicily is so curiously situated, that the Sun is never out of sight; though the children of God are under some clouds of affliction, yet the Sun of mercy is never quite out of fight. God’s justice reacheth to the clouds, his mercy reacheth above the clouds. How slow is God to anger.

He was longer in destroying Jericho, than in making the world; He made the world in six days, but he was seven days in demolishing the walls of Jericho. How many warning-pieces did God shoot against Jerusalem, before he shot off his murdering-piece? Justice goes a foot-pace, Gen. 18.21. mercy hath wings; the sword of justice oft lies a long time in the scabbard, and rusts, till sin doth draw it out and whet it against a Nation; God’s justice is like the widow’s oil, which ran a while, and ceased, 1 Kings 4.6. God’s mercy is like Aaron’s oil, which rested not on his head, but ran down to the skirts of his garment, Psalm 133.2. So the golden oil of God’s mercy doth not rest upon the head of a good parent, but is poured on his children, and so runs down, to the third and fourth generation, even the borders of a religious seed. Often meditate upon the mercy of God.

The meditation of mercy would be a powerful loadstone to draw sinners to God by repentance. It would be as a cork to the net to keep the heart from sinking in despair; behold a City of refuge to fly to; God is the Father of mercies, 2 Cor. 1.3. mercy doth as naturally issue from him, as the child from the parent. God delights in mercy, Micah 7.18. Chrysostom saith, ’tis delightful to the mother to have her breasts drawn; and how delightful is it to God to have the breasts of mercy drawn; mercy finds out the worst sinner, mercy comes not only with salvation in its hand, but with healing under its wings.

The meditation of God’s mercy would melt a sinner into tears; One reading a pardon sent him from the King, fell a weeping, and burst out into these words, A pardon hath done that which death could not do, it hath made my heart relent.</p></blockquote>

<blockquote><p>Obs. VIII. There is infinite grace in every divine covenant, inasmuch as it is established on promises. Infinite condescension it is in God, that he will enter into covenant with dust and ashes, with poor worms of the earth. And herein lies the spring of all grace, from whence all the streams of it do flow. And the first expression of it is in laying the foundation of it in some undeserved promises. And this was that which became the goodness and greatness of his nature, the means whereby we are brought to adhere unto him in faith, hope, trust, and obedience, until we come unto the enjoyment of him; for that is the use of promises, to keep us in adherence unto God, as the first original and spring of all goodness, and the ultimate satisfactory reward of our souls, 2 Cor. vii. 1.

Obs. IX. The promises of the covenant of grace are better than those of any other covenant, as for many other reasons, so especially because the grace of them prevents any condition or qualification on our part. I do not say the covenant of grace is absolutely without conditions, if by conditions we intend the duties of obedience which God requireth of us in and by virtue of that covenant; but this I say, the principal promises thereof are not in the first place remunerative of our obedience in the covenant, but efficaciously assumptive of us into covenant, and establishing or confirming in the covenant.

The covenant of works had its promises, but they were all remunerative, respecting an antecedent obedience in us; (so were all those which were peculiar unto the covenant of Sinai). They were, indeed, also of grace, in that the reward did infinitely exceed the merit of our obedience; but yet they all supposed it, and the subject of them was formally reward only. In the covenant of grace it is not so; for sundry of the promises thereof are the means of our being taken into covenant, of our entering into covenant with God. The first covenant absolutely was established on promises, in that when men were actually taken into it, they were encouraged unto obedience by the promises of a future reward.

But those promises, namely, of the pardon of sin and writing of the law in our hearts, which the apostle expressly insisteth upon as the peculiar promises of this covenant, do take place and are effectual antecedently unto our covenant obedience. For although faith be required in order of nature antecedently unto our actual receiving of the pardon of sin, yet is that faith itself wrought in us by the grace of the promise, and so its precedency unto pardon respects only the order that God had appointed in the communication of the benefits of the covenant, and intends not that the pardon of sin is the reward of our faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 68-69.</span></figcaption>

<blockquote><p>All that the Father gives me will come to me, and whoever comes to me I will never cast out.” (John 6:37)

The English language fails to give the full sense of the Greek in this sentence. The literal meaning of the Greek is, not “all persons whom the Father giveth shall come,” but “everything, – the whole thing.” It is not a masculine plural, but a neuter singular. The idea is either “that the whole mystical body, the company of my believing people, shall come to Me,” or else “every single part or jot or member of my mystical body shall come to Me, and not one be found missing at last.”

We learn from these words the great and deep truth of God’s election and appointment to eternal life of a people out of this world. The Father from all eternity has given to the Son a people to be His own peculiar people. The saints are given to Christ by the Father as a flock, which Christ undertakes to save completely, and to present complete at the last day. (See John xvii. 2, 6, 9, 11, 12: and xviii. 9.) However wicked men may abuse this doctrine, it is full of comfort to a humble believer. He did not begin the work of His salvation. He was given to Christ by the Father, by an everlasting covenant.</p></blockquote>

The English language fails to give the full sense of the Greek in this sentence. The literal meaning of the Greek is, not “all persons whom the Father giveth shall come,” but “everything, – the whole thing.” It is not a masculine plural, but a neuter singular. The idea is either “that the whole mystical body, the company of my believing people, shall come to Me,” or else “every single part or jot or member of my mystical body shall come to Me, and not one be found missing at last.”

We learn from these words the great and deep truth of God’s election and appointment to eternal life of a people out of this world. The Father from all eternity has given to the Son a people to be His own peculiar people. The saints are given to Christ by the Father as a flock, which Christ undertakes to save completely, and to present complete at the last day. (See John xvii. 2, 6, 9, 11, 12: and xviii. 9.) However wicked men may abuse this doctrine, it is full of comfort to a humble believer. He did not begin the work of His salvation. He was given to Christ by the Father, by an everlasting covenant.”

erlasting-covenant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>We are astonished at the man who is wholly intent on the pursuit of gain, while he neglects the salvation of his soul, “a good all price beyond.” But are none of us treading in his steps? The heart is deceitful above all things, and a covetous heart, perhaps, the most deceitful of all. On no subject do men more frequently mistake their own character.

We often see those over whom this vice reigns with the most unlimited sway, apparently as unconscious of the fact, as if their souls were baptised with the purest charity. They may even become a proverb for their covetousness without suspecting that this disposition has ever found its way into their hearts. But how is it with us? Are we so far absorbed in the world as to have neither time nor inclination to attend to the great duties of religion? Do we plead the multiplicity of our worldly cares as an excuse for neglecting the great and solemn concerns of our souls?

Then are we covetous. We indulge an inordinate desire for the good things of this world, and we are not willing to cast our care on divine providence in the humble discharge of our duty. We are not willing to seek the kingdom of God and his righteousness first of all, leaving it to the Lord to supply us with whatever is needful, according to his good promise. We tread in the steps of the rich worldling, whose heart was supremely set upon the acquisition and enjoyment of the present life.

But suppose we do not neglect the duties of religion altogether — yet if we attend to them only as our worldly interest and convenience will admit — if we subordinate them to the pursuits and acquisitions of the world, we are among the covetous, whom the Lord abhorreth. I will go farther. Suppose we are scrupulously attentive to all the external duties of religion, yet if our souls are not in them, what will it avail? If our hearts are not in heaven but on earth, are we not earthly?

The Pharisees abounded in the rites and forms of religion, while they devoured widows’ houses and gave other signs of the most deep rooted covetousness. Whoever toils chiefly for the body, not for the soul, is like the man in the parable, who hid up treasure for himself, but was not rich towards God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-40215b5bd6" data-kw="">
<blockquote><p>And as for his [Jesus’] gesture in teaching, that He sat down, it was their custom in these times, and a testimony of the respect that is due to them that carry the mind of God; and we find Christ sometime[s] preach[ing] sitting, Lk. 4:20-21, sometime standing, Jn. 7:37, and at this time his weariness with night watching might call for it. Nor is it much to be stood upon which of these gestures men use in preaching, but preachers ought in these things [to] accommodate themselves to seek the benefit of hearers and that they be heard and seen by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, According to John (London, 1657) | on John</cite>, 8:1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60fab3155c" data-kw="">
<blockquote><p>The bodily gestures usually observed in prayer, such as kneeling and uncovering the head (Calvin in Acts 20:36), are exercises by which we attempt to rise to higher veneration to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, bk. 3, ch. 20, section 33, end</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“The bodily gestures usually observed in prayer, such as kneeling and uncovering the head (Calvin in Acts 20:36), are exercises by which we attempt to rise to higher veneration to God.”

</figure><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-f4c9a982ea" data-kw="">
<blockquote><p>13. It [prayer] is likewise held forth by several expressions, pointing forth the posture and gesture of the body, such as ‘spreading forth of the hands’ (Ex. 9:29), ‘stretching out of the hands,’ (Job 11:13) ‘lifting up of the hands’ (Ex. 17:11; 1 Tim. 2:8; Ps. 28:2 and 63:4), ‘bowing the knee’ (Eph. 3:14), and ‘falling down’ (Dt. 9:18), mainly to point forth thereby the frame of the soul, and of the whole man, in prayer, to wit, that we should approach in humility, self-loathing, prostrating ourselves before the Lord, and in faith, earnestness, single dependence, hope, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pious &amp; Elaborate Treatise Concerning Prayer &amp; the Answer of Prayer (d. 1679), ch. 3, ‘Of the Nature of Prayer’</cite>, p. 33</span></figcaption>

</figure><figure class="quote" id="q-04a6736d4c" data-kw="">
<blockquote><p>It is not in the adorer’s power that kneeling should be a sign of lesse worship, as referred to the image, and of greater, as referred to God; for the same material kissing and religious rostration which would immediatly be conveyed to Christ if He were in person present in the image and elements, is done to the image and elements; and religious kissing and religious kneeling signifies internal divine submission of heart to God, as the First Author of all and the last end, not by man’s will, but by divine institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646)</cite>, Ch. 1; p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

<main class="wrap"><figure class="quote" id="q-e54e001d1d" data-kw="">
<blockquote><p>The Popish Prelate [John Maxwell] (ch. 7, p. 87) objects against us… 2. The maxim of the law is, Surrogatus gaudet privilegus ejus cui surrogatur, et qui succedit in locum, succedit in jus. The person surrogated has all the privileges that he has in whose place he succeeds; he who succeeds to the place succeeds to the rights; the adopted son, or the bastard who is legitimated and comes in the place of the lawful born son, comes also in the privileges of the lawful born son. … Answer: 1. He that is surrogated in the place of another, due to him by a positive law of man, he has law to all the privileges that he has in whose place he is surrrogated, that is true. He who comes in the place of a mayor of a city, of a captain in an army, of a pilot in a ship, or of a pope, has all the privileges and rights that his predecessors had by law. Jus succedit juri, persona jure predita personce jure preditce. So the law, so far as my reading can reach, who profess myself a divine; but that he who succeeds to the place of a father by nature, should enjoy all the natural rights and privileges of the person to whom he succeeds, I believe the law never dreamed it; for then the adopted son, coming in place of the natural son, has right to the natural affection of the father. If any should adopt Maxwell the prelate, should he love him as the pursuivant of Crail (Maxwell’s father) loved him, I conceive not. Has the adopted son his life, his being, the figure bodily, the manners of the son in whose place he is adopted; or doth he naturally resemble the father as the natural son does? The Prelate did not read this law in any approved jurist… A natural son is not made a son by the consent of parents, but he is a son by generation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, pp. 63-64</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3461a54042" data-kw="">

</figure><figure class="quote" id="q-39c2e2c7c7" data-kw="">
<blockquote><p>I. Faith taken theologically in general is the assent which we give to God speaking, when we are certainly persuaded that something is true, moved to that by Divine Authority. And by this faith is distinguished from opinion, which is a timid and uncertain assent. Likewise from knowledge, which is indeed a certain assent; but one which rests on demonstration or some evident argument, not truly on anyone’s testimony. Finally, from human faith, which acquiesces in the authority of men. II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Faith’</cite>, pp. 125, 131</span></figcaption>

</figure><figure class="quote" id="q-ea39884cbf" data-kw="">
<blockquote><p>2. Express and actual reference and intention to every commandment of God, or to God’s glory in every particular action, I do not urge; a habitual reference and intention I conceive is holden forth to us in Scripture: 1 Cor. 10:31… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in faith, and with a warrant from scripture to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (London, 1646)</cite>, pp. 73-4</span></figcaption>

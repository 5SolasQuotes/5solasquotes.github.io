<main class="wrap"><figure class="quote" id="q-96da43f7dc" data-kw="">
<blockquote><p>11. ‘Then Zipporah tooke a sharpe knife and cut away the foreskin of her son.’ The two things that here might be considered (namely, that doctrine of Popery concerning the danger of children dying unbaptized, and secondly of such an absolute necessity of baptism, as that women must administer it in time of supposed need) I forbear to stand upon now: I have sufficiently touched them in my Notes upon Genesis. Therefore do but remember with yourself (touching the first) that we make a great difference betwixt want [lack] of the sacrament and contempt of the same; contempt, damning; and want, not, through the strength of God’s promise; meaning, by want, when God so prevents by death, that it cannot be had, according to the manner allowed in the Word. And, touching the second, observe, that this act of Zipporah, here, in circumcizing her child, was merely extraordinary, and does no way warrant women to baptize now-a-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable Notes upon the Books of Exodus &amp; Leviticus</cite>, … (London, 1604), on Exodus, ch. 4, p. 60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-cf024ff49e" data-kw="">
<blockquote><p>By Baptism… we are received solemnly into the visible Church; and Baptism is a seal of our entry into Christ’s visible Body, as swearing to the colors enters a soldier a member to the army; and, we teach not that Baptism constitutes the Church-visible simply, as the Church: its a seal of a visible profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 1, ch. 21, ‘Whether Baptism gives formality, or makes a Member of a visible Church?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), pp. 115-122 | Hooker, a congregationalist, had misunderstood Rutherford, thinking that Rutherford had said that baptism was the formal principle that made someone a member of the visible Church. However, what Rutherford actually said, and what he defends here, distinguishing, is only that:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

he%20visible%20Church&amp;text=Church%3A%20its%20a%20seal%20of%20a%20visible%20profession" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-63ac008ebd" data-kw="">
<blockquote><p>…from whence it will appear that a believing master may present his servant and children to baptism, though it does not follow that a believing master may or will present those of his servants or children that are adult or of years without their consent, yet he may by his authority require them to it as an external duty; he cannot compel them to any duty, or restrain them from any vice without their consent, yet he may correct them, and incline their will to any outward duty by his authority, and having wrought upon them to consent and submit, the commissioner may baptize them that come so presented: the master of a family is a king, a prophet, and a priest, if by any of these offices he can prevail with his houshold, he may bring them to the performance of their duties… …though it be the master or husband’s duty to move his family, yet he cannot always prevail; and special direction concerning the wife is given to suffer her in regard of the bond of matrimony and that under some limited and restrained terms in hope of her conversion [1 Cor. 7]; yet nothing is said concerning servants but that he may either force them or be rid of them if they continue infidels in that sense, that is refuse to list themselves among disciples; the public worship of some God being the bond of all human society, Ps. 101:6, ‘He that walketh in a perfect way, he shall serve me:’ he that keeps any servant that will not be baptized, is not a good Christian; it is true, all men of discretion ought to consent to every duty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hussey.html">William Hussey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Mr. Tombes</cite>, [a Baptist], his Sceptical Examination of Infants’-Baptism… (London, 1646), pp. 44-45 Page 43 starts the context. Hussey was the Erastian minister who debated Gillespie on the Mediatorial Kingdom of Christ. Not every particular in the larger context is endorsed.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-cfefc8c245" data-kw="">
<blockquote><p>This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.”

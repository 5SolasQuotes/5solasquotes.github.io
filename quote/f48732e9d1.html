<main class="wrap"><figure class="quote" id="q-f48732e9d1" data-kw="">
<blockquote><p>A learned man of late, out of hatred unto the Spirit of prayer, or prayer as his gift, hath endeavoured to deprive the church of God of the whole benefit and comfort of this promise (Amyrald. Præfat. in Psal.) for he contends that it belongs not unto the Christian church, but unto the Jews only. Had he said it belonged unto the Jews in the first place who should be converted unto Christ, he had not gone so wide from the truth nor from the sense of other expositors, though he had said more than he could prove. But to suppose that any grace, any mercy, any privilege by Jesus Christ, is promised unto the Jews, wherein Gentile believers shall be no sharers, that they should not partake of the same kind, whoever hath the prerogative as to degrees, is fond and impious; for if they also are children of Abraham, if the blessing of faithful Abraham do come upon them also, if it is through them that he is the heir of the world, his spiritual seed inhabiting it by right in all places, then unto them do all the promises belong that are made unto him and his seed. And whereas most of the “exceeding great and precious promises” of the Old Testament are made to Jacob and Israel, to Jerusalem and Zion, it is but saying that they are all confined unto the Jews, and so at once to despoil the church of God of all right and title to them; which impious folly and sacrilege hath been by some attempted. But whereas all the promises belong unto the same covenant, with all the grace contained in them and exhibited by them, whoever is interested by faith in that covenant is so in all the promises of God that belong thereunto, and hath an equal right unto them with those unto whom they were first given. To suppose, now that the Jews are rejected for their unbelief, that the promises of God made unto them whilst they stood by faith are ceased and of no use, is to overthrow the covenant of Abraham, and, indeed, the whole truth of the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 4 (Edinburgh: T&amp;T Clark, n.d.), 261.</span></figcaption>

<blockquote><p>Both can be explained in one word. The covenant made with all the patriarchs is so much like ours in substance and reality that the two are actually one and the same. Yet they differ in the mode of dispensation. But because no one can gain a clear understanding from such a short statement, a fuller explanation is required if we wish to make any progress. Now, in showing their similarity—or rather, unity—it would be superfluous to examine afresh the details that have already been reviewed; and it would be inappropriate here to mingle matters to be discussed elsewhere. Here we must take our stand on three main points. First, we hold that carnal prosperity and happiness did not constitute the goal set before the Jews to which they were to aspire. Rather, they were adopted into the hope of immortality; and assurance of this adoption was certified to them by oracles, by the law, and by the prophets. Secondly, the covenant by which they were bound to the Lord was supported, not by their own merits, but solely by the mercy of the God who called them. Thirdly, they had and knew Christ as Mediator, through whom they were joined to God and were to share in his promises. The second of these, because perhaps we do not yet sufficiently understand it, will be explained at length in its place. For by numerous clear testimonies of the prophets we shall confirm the truth that all those blessings which the Lord has ever given or promised to his people arose solely out of his goodness and kindness. Here and there we have also given clear proofs of the third point; and we have not left even the first point untouched.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, vol. 1, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 2.10.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-2ccc0475a4" data-kw="">
<blockquote><p>…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.”

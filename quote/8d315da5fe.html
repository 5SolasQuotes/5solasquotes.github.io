<blockquote><p>Wherefore he teaches that God in these threatnings and promises does not always reveal his hidden and unchangeable will, whereby He has most firmly decreed what He will do: but only his will, which they call the antecedent will, or the will of the sign, that is of admonition: for that their present estate requires that. But Paul in this place and the prophet in the beginning of the chapter entreat of that will and power of God whereby He by most good right both makes, and makes n•w all things as pleases Him.</p></blockquote>

<blockquote><p>In a wonderful and ineffable manner, that which is done even contrary to His will is not done apart from His will; for it would not happen if He did not permit it. Nor does He permit it unwillingly, but willingly. Nor would He, being good, permit evil to be done unless, being omnipotent, He were also able to bring good out of evil.” Augustine, Handbook on Faith, Hope &amp; Love, ch. 100] 2. Conditional, when He wills, some condition being put in us; so God would have all men saved on this condition, if they can believe. The first of these is by another name called Voluntas beneplaciti, the last Voluntas signi. God’s will is: 1. Secret, Voluntas propositi, that whereby He has absolutely and freely determined with Himself what He will do, permit or hinder. Ps. 115:3; Eph. 1:11; Rom. 9:18, called the will of God concerning us. 2. Revealed, Voluntas praecepti, that whereby God has manifested what He would have believed, done or left undone by his reasonable creatures, Mk. 3:35; 1 Thess. 4:3. That distinction of God’s will into beneplaciti et signi, differs little from this. Signi is the same with revealed. Beneplacitum is the decree properly so called, which may be either hidden or manifest.</p></blockquote>

<blockquote><p>11. We must as is said before distinguish between Christ (and the Father in Him) as Rector per Leges [Legislator through laws] or Legislator, and as Dominus Absolutus [Absolute Lord]. And so we must distinguish between those benefits which Christ as Rector gives by his laws and those which as mere Benefactor and Absolute Proprietary He gives, though not contrary to his laws or Covenant, yet over and above what by Covenant or Law He gives. Also we must distinguish between the event and nature of things as such, and the right to and dueness of things as such. And consequently we must most carefully distinguish between God’s will de rerum eventu [concerning the event of things] and his will de debito [concerning debt], as such. The clear distinguishing of these two is a singular key to the opening of the sense of Scripture, and in particular of this controversy. For indeed, it is to distinguish between our physics and our ethics. God’s will about natural beings as such stands at the top of physics as the first cause. God’s will de debito, as such, stands at the top of our ethics as the first cause. And you may easily conceive how the confounding of our physics and ethics must needs blind us and lose us in our divinity, as it would do in philosophy. I join all these distinctions together, for in some they all come to one or are of necessary consideration jointly that any one of them may be understood. Our divines, usually with the Schoolmen, distinguish between voluntatem signi and beneplaciti [will of sign and of good-pleasure]. But in the ordinary school-sense, that is not the same distinction with that which I here intend. Dr. [William] Twisse oft uses the distinction between voluntatem propositi et praecepti [will of putting forth and of precept], and means in effect the same that I do: But he oft speaks of it as being but metonymically God’s will and not properly. By which I must conclude that he meant quoad eventum [as to the event], and not quoad debitum [as to debt]; for God properly wills that this shall be man’s due or duty. I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies: 1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines: 1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing. 2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold: 1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will. 2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do. Also observe that you must here carefully distinguish between God’s act in making a law and the moral act of that law, or of his will by that law when it is made. I call not legislation itself, ‘God’s will de debito‘ or ‘his legislative will’. His ordaining the sign itself, or making the law which is his instrument, is an act of his will de rerum eventu vel naturae [concerning the event of things, or of their nature]. For it only makes that instrument or sign by which right [of debt] shall be after[wards] produced, but [it] does not directly thereby produce that right. But it is the signification and moral act of that law, which flows from its nature, which does produce right, and which we here intend. The scribe that writes a statute, and the sovereign himself, in composing the matter, order and terms, does but make that signum or instrument which, being made, does therefore institute right, because it signifies the sovereign’s will to institute it. So much for the explication of my meaning in this distinction. 2. Next I shall say somewhat to prove the soundness of it, which is therefore necessary because some ignorant persons laugh at it, as if we feigned two wills in God, and one of them contrary to the other. Otherwise, to men of understanding, it is not very needful; and therefore I shall say but this briefly: It is not two wills in God as two distinct essences or faculties that I assert, but only two distinct acts: Distinct, I say, in regard of their distinct products or effects, and so to man’s apprehension, though in God we say there is no diversity or distinction. Yet as we cannot handsomely conceive of his will to save Peter, and his will to damn Judas, as one act, having such different effects: so it is here. Who knows not that naturality and morality, physics and ethics, event and right are different things, and consequently we may and must distinguish of God’s willing them accordingly. When a man says, ‘You shall do this,’ preceptively, he does only say, ‘It shall be your duty to do it,’ but says not that eventually you shall do it. Nor are his words false if you never do it. He that says prophetically or by prognostication, ‘you shall do this,’ means that it shall so come to pass; and if it do not, his words are false; but he does not say, ‘It is or shall be your duty.’ 12. Accordingly we must distinguish between the antecedent and consequent acts and will of Christ as Ruler of mankind. For the understanding of which and avoiding mistakes, observe: 1. That we speak not now of eternal decrees, but of the will of Christ in this relation as He is the Ruler of the world and Church, and as He is the conveyer of his mercies according to and by his Covenant, and as He judges the world according thereunto. 2. That by his antecedent will and acts, we mean only that which in his government is antecedent to man’s obedience or disobedience, which is principally legislation and making his new Covenant, and also the giving of preachers and other acts, which are the first part of his administration. And by his consequent acts and will, we mean only that second part of government which finds man obedient or disobedient, and is commonly called judgment and execution. And when we say that by his antecedent acts and will Christ gives pardon, justification and right to glory equally to all, we mean that as Legislator and Promiser He has antecedently made an universal act of oblivion, or deed of gift, conditionally pardoning, etc. all, and no farther than conditionally pardoning any. And when we say that He consequently justifies and saves none but true Christians, and in that sense died for no other according to his consequent will, we mean that as Judge of mankind, He will give justification and salvation to believers and to no others; nor [did He] ever intended to do otherwise. (Let the reader know that the foresaid scheme of the effects of Christ’s death is more accurately, and yet more briefly, done in my Methodus Theologiae: and therefore let him that dislikes the number or order of distributions pass it by: But I have not time to reform it here.</p></blockquote>

ntum [as to the event], and not quoad debitum [as to debt]; for God properly wills that this shall be man’s due or duty. I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies: 1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines: 1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing. 2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold: 1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will. 2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do. Also observe that you must here carefully distinguish between God’s act in making a law and the moral act of that law, or of his will by that law when it is made. I call not legislation itself, ‘God’s will de debito‘ or ‘his legislative will’. His ordaining the sign itself, or making the law which is his instrument, is an act of his will de rerum eventu vel naturae [concerning the event of things, or of their nature]. For it only makes that instrument or sign by which right [of debt] shall be after[wards] produced, but [it] does not directly thereby produce that right. But it is the signification and moral act of that law, which flows from its nature, which does produce right, and which we here intend. The scribe that writes a statute, and the sovereign himself, in composing the matter, order and terms, does but make that signum or instrument which, being made, does therefore institute right, because it signifies the sovereign’s will to institute it. So much for the explication of my meaning in this distinction. 2. Next I shall say somewhat to prove the soundness of it, which is therefore necessary because some ignorant persons laugh at it, as if we feigned two wills in God, and one of them contrary to the other. Otherwise, to men of understanding, it is not very needful; and therefore I shall say but this briefly: It is not two wills in God as two distinct essences or faculties that I assert, but only two distinct acts: Distinct, I say, in regard of their distinct products or effects, and so to man’s apprehension, though in God we say there is no diversity or distinction. Yet as we cannot handsomely conceive of his will to save Peter, and his will to damn Judas, as one act, having such different effects: so it is here. Who knows not that naturality and morality, physics and ethics, event and right are different things, and consequently we may and must distinguish of God’s willing them accordingly. When a man says, ‘You shall do this,’ preceptively, he does only say, ‘It shall be your duty to do it,’ but says not that eventually you shall do it. Nor are his words false if you never do it. He that says prophetically or by prognostication, ‘you shall do this,’ means that it shall so come to pass; and if it do not, his words are false; but he does not say, ‘It is or shall be your duty.’ 12. Accordingly we must distinguish between the antecedent and consequent acts and will of Christ as Ruler of mankind. For the understanding of which and avoiding mistakes, observe: 1. That we speak not now of eternal decrees, but of the will of Christ in this relation as He is the Ruler of the world and Church, and as He is the conveyer of his mercies according to and by his Covenant, and as He judges the world according thereunto. 2. That by his antecedent will and acts, we mean only that which in his government is antecedent to man’s obedience or disobedience, which is principally legislation and making his new Covenant, and also the giving of preachers and other acts, which are the first part of his administration. And by his consequent acts and will, we mean only that second part of government which finds man obedient or disobedient, and is commonly called judgment and execution. And when we say that by his antecedent acts and will Christ gives pardon, justification and right to glory equally to all, we mean that as Legislator and Promiser He has antecedently made an universal act of oblivion, or deed of gift, conditionally pardoning, etc. all, and no farther than conditionally pardoning any. And when we say that He consequently justifies and saves none but true Christians, and in that sense died for no other according to his consequent will, we mean that as Judge of mankind, He will give justification and salvation to believers and to no others; nor [did He] ever intended to do otherwise. (Let the reader know that the foresaid scheme of the effects of Christ’s death is more accurately, and yet more briefly, done in my Methodus Theologiae: and therefore let him that dislikes the number or order of distributions pass it by: But I have not time to reform it here.”

— Richard Baxter, Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared… (London: Salusbury, 1694), ch. 2, pp. 27-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C11.+We+must+as+is+said+before+distinguish+between+Christ+%28and+the+Father+in+Him%29+as+Rector+per+Leges+%5BLegislator+through+laws%5D+or+Legislator%2C+and+as+Dominus+Absolutus+%5BAbsolute+Lord%5D.+And+so+we+must+distinguish+between+those+benefits+which+Christ+as+Rector+gives+by+his+laws+and+those+which+as+mere+Benefactor+and+Absolute+Proprietary+He+gives%2C+though+not+contrary+to+his+laws+or+Covenant%2C+yet+over+and+above+what+by+Covenant+or+Law+He+gives.+Also+we+must+distinguish+between+the+event+and+nature+of+things+as+such%2C+and+the+right+to+and+dueness+of+things+as+such.+And+consequently+we+must+most+carefully+distinguish+between+God%E2%80%99s+will+de+rerum+eventu+%5Bconcerning+the+event+of+things%5D+and+his+will+de+debito+%5Bconcerning+debt%5D%2C+as+such.+The+clear+distinguishing+of+these+two+is+a+singular+key+to+the+opening+of+the+sense+of+Scripture%2C+and+in+particular+of+this+controversy.+For+indeed%2C+it+is+to+distinguish+between+our+physics+and+our+ethics.+God%E2%80%99s+will+about+natural+beings+as+such+stands+at+the+top+of+physics+as+the+first+cause.+God%E2%80%99s+will+de+debito%2C+as+such%2C+stands+at+the+top+of+our+ethics+as+the+first+cause.+And+you+may+easily+conceive+how+the+confounding+of+our+physics+and+ethics+must+needs+blind+us+and+lose+us+in+our+divinity%2C+as+it+would+do+in+philosophy.+I+join+all+these+distinctions+together%2C+for+in+some+they+all+come+to+one+or+are+of+necessary+consideration+jointly+that+any+one+of+them+may+be+understood.+Our+divines%2C+usually+with+the+Schoolmen%2C+distinguish+between+voluntatem+signi+and+beneplaciti+%5Bwill+of+sign+and+of+good-pleasure%5D.+But+in+the+ordinary+school-sense%2C+that+is+not+the+same+distinction+with+that+which+I+here+intend.+Dr.+%5BWilliam%5D+Twisse+oft+uses+the+distinction+between+voluntatem+propositi+et+praecepti+%5Bwill+of+putting+forth+and+of+precept%5D%2C+and+means+in+effect+the+same+that+I+do%3A+But+he+oft+speaks+of+it+as+being+but+metonymically+God%E2%80%99s+will+and+not+properly.+By+which+I+must+conclude+that+he+meant+quoad+eventum+%5Bas+to+the+event%5D%2C+and+not+quoad+debitum+%5Bas+to+debt%5D%3B+for+God+properly+wills+that+this+shall+be+man%E2%80%99s+due+or+duty.+I+shall+therefore+a+little+further+explain+this+distinction+and+then+show+you+the+soundness+of+it%2C+and+then+the+exceeding+usefulness+and+necessity+of+it%2C+both+in+this+and+many+other+controversies%3A+1.+For+the+title+I+choose+rather+to+denominate+it+from+the+object+than+the+act%2C+because+the+diversity+is+in+the+object%2C+but+none+in+the+species+of+the+act+naturally+considered%3A+Debitum+and+natural+being+are+two+distinct+things%3B+but+%E2%80%98to+will%E2%80%99+one+and+%E2%80%98to+will%E2%80%99+the+other+is+all+one+as+to+the+nature+of+willing.+God+does+as+properly+will+duty+as+He+wills+natural+beings.+Yet+if+I+must+denominate+it+from+the+acts%2C+I+would+distinguish+between+God%E2%80%99s+Directive+Will+and+his+Legislative.+For+to+call+it+voluntas+praecepti+is+too+narrow+a+term%2C+for+the+precept+is+but+one+part+of+God%E2%80%99s+Law+and+determines+only+of+one+sort+of+right%2C+that+is%2C+of+the+dueness+of+obediential+actions+or+forbearance+of+forbidden+actions.+But+there+is+also+a+debitum+praemii+et+beneficii%E2%80%93pure+vel+absolute%E2%80%93dati%2C+et+debitum+poenae+%5Bdebt+of+reward+and+benefit%2C+whether+purely+or+absolutely+given%2C+and+a+debt+of+punishment%5D%2C+which+the+rest+of+the+Law%2C+Testament+or+Covenant+of+God+determines+of%2C+which+must+all+be+here+included+as+well+as+the+former.+In+sum%2C+the+Law+determines%3A+1.+What+shall+be+due+from+us%3B+2.+and+what+shall+be+due+to+us%2C+and+on+what+terms.+I+call+it+therefore%2C+The+will+of+God+de+eventu%2C+et+de+debito+%5Bof+event%2C+and+of+debt%5D%2C+as+such.+I+say+%E2%80%98as+such%2C%E2%80%99+for+else+they+are+coincident%3A+For+God%E2%80%99s+will+de+rerum+natura%2C+vel+existentia+determines+de+debito+quatenus+evenit+esse+debitum+%5Bdetermines+the+nature+or+existence+of+things%2C+and+debt+so+far+as+debt+comes+about%5D%2C+but+not+qua+debitum+%5Bas+debt%5D.+And+his+will+de+debito+determines+of+the+dueness+of+some+events%2C+not+as+eventual+%5Bas+to+the+event%5D%2C+but+as+due.+Or+to+avoid+all+ambiguity%3A+call+it+God%E2%80%99s+will+de+ente+mere+naturali+%5Bconcerning+merely+natural+being%5D+and+his+will+de+debito+morali+%5Bconcerning+moral+debt%5D%2C+or+Legislative+or+Governing.+2.+And+for+the+nature+of+the+distinction%2C+understand+further+that+there+are+two+acts+which+I+call+God%E2%80%99s+will+de+debito%3A+The+first+is+that+immanent+act+of+his+will+by+which+He+strictly+and+properly+wills+what+shall+be+due.+This+also+is+twofold%3A+1.+Productive%2C+or+instituting+dueness%3B+2.+and+approbative%2C+or+taking+complacency+in+duty.+The+former+of+these+I+principally+intend%2C+but+exclude+not+the+latter.+God+does+eternally+will+every+due%2C+but+it+is+not+therefore+eternally+or+from+eternity+due.+For+He+wills+from+eternity+%28to+speak+vulgarly%29+only+that+this+shall+be+due+at+such+a+time+and+by+such+a+means.+I+say+by+such+means%3A+For+though+God%E2%80%99s+will+produce+all+dueness%2C+yet+only+by+means+does+He+produce+it.+That+means+is+the+revelation+of+his+will.+2.+This+revelation+of+God%E2%80%99s+will+de+debito+we+call+his+Law.+This+therefore+is+the+second+thing+which+I+call+God%E2%80%99s+will+de+debito%2C+or+his+Legislative+will%2C+that+is%2C+the+Law+as+it+is+signum+voluntatis+divinae+%5Ba+sign+of+the+divine+will%5D%2C+that+is%2C+formally+as+a+law.+This+I+call+God%E2%80%99s+will+de+debito%2C+only+metonymically%2C+as+it+is+the+sign+of+his+will+before+expressed.+If+the+proper+will+of+God+were+separated+from+this%2C+it+would+then+be+no+producer+of+dueness+or+right+at+all%2C+for+it+would+be+no+law%2C+no+signum%3B+it+would+lose+its+nature+as+abrogated+laws+do.+Also+observe+that+you+must+here+carefully+distinguish+between+God%E2%80%99s+act+in+making+a+law+and+the+moral+act+of+that+law%2C+or+of+his+will+by+that+law+when+it+is+made.+I+call+not+legislation+itself%2C+%E2%80%98God%E2%80%99s+will+de+debito%E2%80%98+or+%E2%80%98his+legislative+will%E2%80%99.+His+ordaining+the+sign+itself%2C+or+making+the+law+which+is+his+instrument%2C+is+an+act+of+his+will+de+rerum+eventu+vel+naturae+%5Bconcerning+the+event+of+things%2C+or+of+their+nature%5D.+For+it+only+makes+that+instrument+or+sign+by+which+right+%5Bof+debt%5D+shall+be+after%5Bwards%5D+produced%2C+but+%5Bit%5D+does+not+directly+thereby+produce+that+right.+But+it+is+the+signification+and+moral+act+of+that+law%2C+which+flows+from+its+nature%2C+which+does+produce+right%2C+and+which+we+here+intend.+The+scribe+that+writes+a+statute%2C+and+the+sovereign+himself%2C+in+composing+the+matter%2C+order+and+terms%2C+does+but+make+that+signum+or+instrument+which%2C+being+made%2C+does+therefore+institute+right%2C+because+it+signifies+the+sovereign%E2%80%99s+will+to+institute+it.+So+much+for+the+explication+of+my+meaning+in+this+distinction.+2.+Next+I+shall+say+somewhat+to+prove+the+soundness+of+it%2C+which+is+therefore+necessary+because+some+ignorant+persons+laugh+at+it%2C+as+if+we+feigned+two+wills+in+God%2C+and+one+of+them+contrary+to+the+other.+Otherwise%2C+to+men+of+understanding%2C+it+is+not+very+needful%3B+and+therefore+I+shall+say+but+this+briefly%3A+It+is+not+two+wills+in+God+as+two+distinct+essences+or+faculties+that+I+assert%2C+but+only+two+distinct+acts%3A+Distinct%2C+I+say%2C+in+regard+of+their+distinct+products+or+effects%2C+and+so+to+man%E2%80%99s+apprehension%2C+though+in+God+we+say+there+is+no+diversity+or+distinction.+Yet+as+we+cannot+handsomely+conceive+of+his+will+to+save+Peter%2C+and+his+will+to+damn+Judas%2C+as+one+act%2C+having+such+different+effects%3A+so+it+is+here.+Who+knows+not+that+naturality+and+morality%2C+physics+and+ethics%2C+event+and+right+are+different+things%2C+and+consequently+we+may+and+must+distinguish+of+God%E2%80%99s+willing+them+accordingly.+When+a+man+says%2C+%E2%80%98You+shall+do+this%2C%E2%80%99+preceptively%2C+he+does+only+say%2C+%E2%80%98It+shall+be+your+duty+to+do+it%2C%E2%80%99+but+says+not+that+eventually+you+shall+do+it.+Nor+are+his+words+false+if+you+never+do+it.+He+that+says+prophetically+or+by+prognostication%2C+%E2%80%98you+shall+do+this%2C%E2%80%99+means+that+it+shall+so+come+to+pass%3B+and+if+it+do+not%2C+his+words+are+false%3B+but+he+does+not+say%2C+%E2%80%98It+is+or+shall+be+your+duty.%E2%80%99+12.+Accordingly+we+must+distinguish+between+the+antecedent+and+consequent+acts+and+will+of+Christ+as+Ruler+of+mankind.+For+the+understanding+of+which+and+avoiding+mistakes%2C+observe%3A+1.+That+we+speak+not+now+of+eternal+decrees%2C+but+of+the+will+of+Christ+in+this+relation+as+He+is+the+Ruler+of+the+world+and+Church%2C+and+as+He+is+the+conveyer+of+his+mercies+according+to+and+by+his+Covenant%2C+and+as+He+judges+the+world+according+thereunto.+2.+That+by+his+antecedent+will+and+acts%2C+we+mean+only+that+which+in+his+government+is+antecedent+to+man%E2%80%99s+obedience+or+disobedience%2C+which+is+principally+legislation+and+making+his+new+Covenant%2C+and+also+the+giving+of+preachers+and+other+acts%2C+which+are+the+first+part+of+his+administration.+And+by+his+consequent+acts+and+will%2C+we+mean+only+that+second+part+of+government+which+finds+man+obedient+or+disobedient%2C+and+is+commonly+called+judgment+and+execution.+And+when+we+say+that+by+his+antecedent+acts+and+will+Christ+gives+pardon%2C+justification+and+right+to+glory+equally+to+all%2C+we+mean+that+as+Legislator+and+Promiser+He+has+antecedently+made+an+universal+act+of+oblivion%2C+or+deed+of+gift%2C+conditionally+pardoning%2C+etc.+all%2C+and+no+farther+than+conditionally+pardoning+any.+And+when+we+say+that+He+consequently+justifies+and+saves+none+but+true+Christians%2C+and+in+that+sense+died+for+no+other+according+to+his+consequent+will%2C+we+mean+that+as+Judge+of+mankind%2C+He+will+give+justification+and+salvation+to+believers+and+to+no+others%3B+nor+%5Bdid+He%5D+ever+intended+to+do+otherwise.+%28Let+the+reader+know+that+the+foresaid+scheme+of+the+effects+of+Christ%E2%80%99s+death+is+more+accurately%2C+and+yet+more+briefly%2C+done+in+my+Methodus+Theologiae%3A+and+therefore+let+him+that+dislikes+the+number+or+order+of+distributions+pass+it+by%3A+But+I+have+not+time+to+reform+it+here.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Universal+Redemption+of+Mankind+by+the+Lord+Jesus+Christ+Stated+%26+Cleared%E2%80%A6+%28London%3A+Salusbury%2C+1694%29%2C+ch.+2%2C+pp.+27-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3379d5e856.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3379d5e856.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=11.%20We%20must%20as%20is%20said,not%20time%20to%20reform%20it%20here." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ . 1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following. 2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing. 3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation. 4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ . 1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following. 2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing. 3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation. 4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.”

C+effectively+obtain+any+object+whatsoever%2C+and+yet+does+not+will+to+obtain+it+effectively%2C+but+only+to+desire+it+ineffectively%3B+then+rather+it+is+a+perfection+of+the+will%2C+and+a+dominion+over+itself+and+over+its+power.+It+is+confirmed%2C+since+to+will+not+to+produce+other+worlds+is+not+an+imperfection%2C+but+rather+a+perfection%3B+therefore+likewise+to+will+not+to+produce+effectively+free+actions%2C+but+only+to+supply+to+them+a+sufficient+concurrence%2C+will+not+be+an+imperfection.+To+the+confirmation+it+is+answered%3A+if+the+desired+thing+is+not+obtained+on+account+of+a+defect+of+power%2C+or+if+the+desired+thing+increases+in+some+way+the+happiness+of+the+desiring+will%3B+then+not+to+obtain+that+thing+can+of+itself+sadden+and+afflict.+But+to+God+neither+is+there+lacking+power+to+obtain%2C+nor+is+the+happiness+of+God+increased+in+anyway+by+the+obtaining+of+the+desired+thing.+3.+The+second+objection+is%2C+that%3A+A+conditional+volition+is+proper+to+a+will+which+cannot+obtain+that+good+without+the+condition+appended%3A+just+as+a+conditional+will+of+retaining+wares+in+a+storm+%5Bon+the+sea%5D+is+proper+to+a+will+which+cannot+avoid+shipwreck+unless+a+jettison+of+the+wares+be+made.+It+is+confirmed%2C+because+that+will+of+the+merchant+would+effectively+preserve+the+wares%2C+if+he+could+without+danger%2C+or+inconvenience%2C+and+difficulty.+But+God%2C+without+danger%2C+inconvenience%2C+and+difficulty%2C+could+have+saved+all+men%2C+if+He+willed.+Therefore+neither+by+a+conditional+will+does+He+will+their+salvation.+4.+It+is+answered%3A+By+denying+the+first+antecedent.+For+although+the+will+be+omnipotent%2C+and+can+without+an+appended+condition+obtain+such+a+good%2C+nonetheless+most+wisely+and+most+powerfully+it+uses+a+conditioned+volition%2C+when+another+greater+good%2C+incompatible%2C+is+loved+by+an+efficacious+volition%2C+which+depends+on+the+aforesaid+condition.+But+the+%5Bproposed%5D+greater+good+is+a+better+administration+of+the+universe%2C+and+a+more+illustrious+manifestation+of+divine+justice+together+with+mercy+requires+that+the+salvation+of+all+be+loved%2C+as+much+as+regards+God%2C+efficaciously%3B+nor+does+it+allow+that%2C+by+the+antecedent+will+of+God%2C+impediments+of+salvation+be+decreed+and+procured%3B+yet+at+the+same+time+it+requires+that+many+men+be+so+left+to+their+own+choice+that+they+be+permitted%2C+if+they+will%2C+to+resist+the+aforesaid+will+of+God.+Since+therefore+this+greater+good+efficaciously+willed+by+God+implies+a+contradiction+with+the+salvation+of+those+same+men+efficaciously+willed%2C+for+that+reason+God+most+wisely+and+most+powerfully+appends+a+condition+to+His+will%2C+depending+upon+the+choice+of+men.+For+this+volition+satisfies+the+natural+propensity+and+benevolence%2C+which+He+professes+toward+men%2C+even+the+reprobate%2C+without+dissimulation.+It+is+confirmed%3A+By+the+example+of+the+human+will+of+Christ+the+Lord%2C+to+whom+there+was+not+lacking+the+power+of+avoiding+death%2C+according+to+that+of+Mt.+26%3A+%E2%80%9CDo+you+think+that+I+cannot+ask+my+Father%2C+and+He+will+provide+for+Me+now+more+than+twelve+legions+of+angels%3F%E2%80%9D+and+Jn.+10%3A+%E2%80%9CI+lay+down+my+life%2C+that+I+may+take+it+again.+No+one+takes+it+from+Me%3B+but+I+lay+it+down+of+Myself.%E2%80%9D%0A%0A%E2%80%94+Diego+Ruiz+de+Montoya%2C+Commentaries+%26+Disputations+on+the+First+Part+of+St.+Thomas%2C+on+the+Will+of+God+%26+its+Proper+Acts+%28Lugduni%3A+Prost%2C+1630%29%2C+Quest.+19%2C+On+the+Will+of+God%2C+Disputation+20%2C+%E2%80%98It+is+explained+whether+the+antecedent+will+is+conditional%2C+and+whether+it+is+formally+concerned+with+the+means%2C+insofar+as+they+are+means%E2%80%99+tr.+AI+by+The+Faith+Received+Ruiz+%281562-1632%29+was+a+Spanish+Jesuit+theologian+who+fundamentally+was+on+the+side+of+those+affirming+Middle+Knowledge+in+the+De+Auxiliis+controversy%2C+who+yet+sought+to+bridge+the+difference+with+a+formulation+which+came+to+be+critiqued+by+both+Jesuits+and+Dominicans.+Ruiz+was+a+favorite+of+John+Davenant.&amp;ur

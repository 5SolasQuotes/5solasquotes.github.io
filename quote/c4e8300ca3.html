<blockquote><p>Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/baruch-c-cohen.html">Baruch C. Cohen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Nazi Medical Experimentation: The Ethics Of Using Medical Data From Nazi Experiments’ (n.d.) 115 paragraphs | It is clear that good can be, and has been brought out of the Nazis’ preserved data (which can’t be obtained in any other way), but should it? The main cost involved in doing so, besides the sheer revoltingness of it all, is the very scandal of the knowledge of these things becoming known. The article concludes:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>Conquest, seeing it is an act of violence and God’s revenging justice for the sins of a people, cannot give in God’s court such a just title to the throne as the people are to submit their consciences unto, except God reveal his regulating will by some immediate voice from heaven, as he commanded Judah to submit to Nebuchadnezzar as to their king by the mouth of Jeremiah. Now this is not a rule to us; for then, if the Spanish king should invade this land, and, as Nebuchadnezzar did, deface the temple and instruments and means of God’s worship, and abolish the true worship of God, it should be unlawful to resist him, after he had once conquered the land: neither God’s Word, nor the law of nature could permit this. I suppose, even by grant of adversaries, now no act of violence done to a people, though in God’s court they have deserved it, can be a testimony to us of God’s regulating will; except it have some warrant from the law and testimony [Scripture], it is no rule to our conscience to acknowledge him a lawful magistrate whose sole law to the throne is an act of the bloody instrument of divine wrath, I mean the sword. That, therefore, Judah was to submit, according to God’s Word, to Nebuchadnezzar, whose conscience and best warranted calling to the kingdom of Judah was his bloody sword, even if we suppose Jeremiah had not commanded them to submit to the king of Babylon, I think cannot be said.</p></blockquote>

<blockquote><p>But I pray you what do people get when wars for recoveries of dubious rights are long and calamitous? What are the people of France or the people of Spain better for the long and hereditary anger of their two kings? Or what was the world better for Alexander’s conquering it? The [English Parliament] Houses which are burnt and the millions of bodies left dead in the field are the peoples; and princes scorning to derive from them [the people] still trample them to dung.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 34</span></figcaption>

<blockquote><p>24. But as we have hitherto described the magistrate who truly is what he is called-viz. the father of his country, and (as the Poet speaks) the pastor of the people, the guardian of peace, the president of justice, the vindicator of innocence, he is justly to be deemed a madman who disapproves of such authority. And since in almost all ages we see that some princes, careless about all their duties on which they ought to have been intent, live, without solicitude, in luxurious sloth; others, bent on their own interest, venally prostitute all rights, privileges, judgments, and enactments; others pillage poor people of their money, and afterwards squander it in insane largesses; others act as mere robbers, pillaging houses, violating matrons, and slaying the innocent; many cannot be persuaded to recognize such persons for princes, whose command, as far as lawful, they are bound to obey. For while in this unworthy conduct, and among atrocities so alien, not only from the duty of the magistrate, but also of the man, they behold no appearance of the image of God, which ought to be conspicuous in the magistrate, while they see not a vestige of that minister of God, who was appointed to be a praise to the good and a terror to the bad, they cannot recognize the ruler whose dignity and authority Scripture recommends to us. And, undoubtedly, the natural feeling of the human mind has always been not less to assail tyrants with hatred and execration, than to look up to just kings with love and veneration. 25. But if we have respect to the Word of God, it will lead us farther, and make us subject not only to the authority of those princes who honestly and faithfully perform their duty toward us, but all princes, by whatever means they have so become, although there is nothing they less perform than the duty of princes. For though the Lord declares that a ruler to maintain our safety is the highest gift of his beneficence, and prescribes to rulers themselves their proper sphere, He at the same time declares, that of whatever description they may be, they derive their power from none but Him. Those, indeed, who rule for the public good, are true examples and specimens of his beneficence, while those who domineer unjustly and tyrannically are raised up by him to punish the people for their iniquity. Still all alike possess that sacred majesty with which he has invested lawful power. I will not proceed further without subjoining some distinct passages to this effect (Job 34:30; Hos. 13:11; Isa. 3:4; 10:5; Deut. 28:29). We need not labor to prove that an impious king is a mark of the Lord’s anger, since I presume no one will deny it, and that this is not less true of a king than of a robber who plunders your goods, an adulterer who defiles your bed, and an assassin who aims at your life, since all such calamities are classed by Scripture among the curses of God. But let us insist at greater length in proving what does not so easily fall in with the views of men, that even an individual of the worst character, one most unworthy of all honor, if invested with public authority, receives that illustrious divine power which the Lord by his Word devolved on the ministers of his justice and judgment, and that, accordingly, in so far as public obedience is concerned, he is to be held in the same honor and reverence as the best of kings. … 27. …If we constantly keep before our eyes and minds the fact, that even the most iniquitous kings are appointed by the same decree which establishes all regal authority, we will never entertain the seditious thought, that a king is to be treated according to this deserts, and that we are not bound to act the part of good subjects to him who does not in his turn act the part of a king to us. … 29. This feeling of reverence, and even of piety, we owe to the utmost to all our rulers, be their characters what they may. This I repeat the oftener, that we may learn not to consider the individuals themselves, but hold it to be enough that by the will of the Lord they sustain a character on which he has impressed and engraven inviolable majesty. But rulers, you will say, owe mutual duties to those under them. This I have already confessed. But if from this you conclude that obedience is to be returned to none but just governors, you reason absurdly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutes of the Christian Religion, bk. 4, ch. 20</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

— John Calvin, The Institutes of the Christian Religion, bk. 4, ch. 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C24.+But+as+we+have+hitherto+described+the+magistrate+who+truly+is+what+he+is+called-viz.+the+father+of+his+country%2C+and+%28as+the+Poet+speaks%29+the+pastor+of+the+people%2C+the+guardian+of+peace%2C+the+president+of+justice%2C+the+vindicator+of+innocence%2C+he+is+justly+to+be+deemed+a+madman+who+disapproves+of+such+authority.+And+since+in+almost+all+ages+we+see+that+some+princes%2C+careless+about+all+their+duties+on+which+they+ought+to+have+been+intent%2C+live%2C+without+solicitude%2C+in+luxurious+sloth%3B+others%2C+bent+on+their+own+interest%2C+venally+prostitute+all+rights%2C+privileges%2C+judgments%2C+and+enactments%3B+others+pillage+poor+people+of+their+money%2C+and+afterwards+squander+it+in+insane+largesses%3B+others+act+as+mere+robbers%2C+pillaging+houses%2C+violating+matrons%2C+and+slaying+the+innocent%3B+many+cannot+be+persuaded+to+recognize+such+persons+for+princes%2C+whose+command%2C+as+far+as+lawful%2C+they+are+bound+to+obey.+For+while+in+this+unworthy+conduct%2C+and+among+atrocities+so+alien%2C+not+only+from+the+duty+of+the+magistrate%2C+but+also+of+the+man%2C+they+behold+no+appearance+of+the+image+of+God%2C+which+ought+to+be+conspicuous+in+the+magistrate%2C+while+they+see+not+a+vestige+of+that+minister+of+God%2C+who+was+appointed+to+be+a+praise+to+the+good+and+a+terror+to+the+bad%2C+they+cannot+recognize+the+ruler+whose+dignity+and+authority+Scripture+recommends+to+us.+And%2C+undoubtedly%2C+the+natural+feeling+of+the+human+mind+has+always+been+not+less+to+assail+tyrants+with+hatred+and+execration%2C+than+to+look+up+to+just+kings+with+love+and+veneration.+25.+But+if+we+have+respect+to+the+Word+of+God%2C+it+will+lead+us+farther%2C+and+make+us+subject+not+only+to+the+authority+of+those+princes+who+honestly+and+faithfully+perform+their+duty+toward+us%2C+but+all+princes%2C+by+whatever+means+they+have+so+become%2C+although+there+is+nothing+they+less+perform+than+the+duty+of+princes.+For+though+the+Lord+declares+that+a+ruler+to+maintain+our+safety+is+the+highest+gift+of+his+beneficence%2C+and+prescribes+to+rulers+themselves+their+proper+sphere%2C+He+at+the+same+time+declares%2C+that+of+whatever+description+they+may+be%2C+they+derive+their+power+from+none+but+Him.+Those%2C+indeed%2C+who+rule+for+the+public+good%2C+are+true+examples+and+specimens+of+his+beneficence%2C+while+those+who+domineer+unjustly+and+tyrannically+are+raised+up+by+him+to+punish+the+people+for+their+iniquity.+Still+all+alike+possess+that+sacred+majesty+with+which+he+has+invested+lawful+power.+I+will+not+proceed+further+without+subjoining+some+distinct+passages+to+this+effect+%28Job+34%3A30%3B+Hos.+13%3A11%3B+Isa.+3%3A4%3B+10%3A5%3B+Deut.+28%3A29%29.+We+need+not+labor+to+prove+that+an+impious+king+is+a+mark+of+the+Lord%E2%80%99s+anger%2C+since+I+presume+no+one+will+deny+it%2C+and+that+this+is+not+less+true+of+a+king+than+of+a+robber+who+plunders+your+goods%2C+an+adulterer+who+defiles+your+bed%2C+and+an+assassin+who+aims+at+your+life%2C+since+all+such+calamities+are+classed+by+Scripture+among+the+curses+of+God.+But+let+us+insist+at+greater+length+in+proving+what+does+not+so+easily+fall+in+with+the+views+of+men%2C+that+even+an+individual+of+the+worst+character%2C+one+most+unworthy+of+all+honor%2C+if+invested+with+public+authority%2C+receives+that+illustrious+divine+power+which+the+Lord+by+his+Word+devolved+on+the+ministers+of+his+justice+and+judgment%2C+and+that%2C+accordingly%2C+in+so+far+as+public+obedience+is+concerned%2C+he+is+to+be+held+in+the+same+honor+and+reverence+as+the+best+of+kings.+%E2%80%A6+27.+%E2%80%A6If+we+constantly+keep+before+our+eyes+and+minds+the+fact%2C+that+even+the+most+iniquitous+kings+are+appointed+by+the+same+decree+which+establishes+all+regal+authority%2C+we+will+never+entertain+the+seditious+thought%2C+that+a+king+is+to+be+treated+according+to+this+deserts%2C+and+that+we+are+not+bound+to+act+the+part+of+good+subjects+to+him+who+does+not+in+his+turn+act+the+part+of+a+king+to+us.+%E2%80%A6+29.+This+feeling+of+reverence%2C+and+even+of+piety%2C+we+owe+to+the+utmost+to+all+our+rulers%2C+be+their+characters+what+they+may.+This+I+repeat+the+oftener%2C+that+we+may+learn+not+to+consider+the+individuals+themselves%2C+but+hold+it+to+be+enough+that+by+the+will+of+the+Lord+they+sustain+a+character+on+which+he+has+impressed+and+engraven+inviolable+majesty.+But+rulers%2C+you+will+say%2C+owe+mutual+duties+to+those+under+them.+This+I+have+already+confessed.+But+if+from+this+you+conclude+that+obedience+is+to+be+returned+to+none+but+just+governors%2C+you+reason+absurdly.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+The+Institutes+of+the+Christian+Religion%2C+bk.+4%2C+ch.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F301302d040.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/301302d040.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=24.%20But%20as%20we%20have%20hitherto,but%20just%20governors%2C%20you%20reason%20absurdly&amp;text=24.%20But%20as%20we%20have%20hitherto%20described%20the&amp;text=to%20none%20but%20just%20governors%2C%20you%20reason%20absurdly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In a disputation by writing, those of the other part [Richard Baxter and others] formed an argument, whose major proposition was to this sense… ‘Whatsoever book [of law] enjoins nothing but what is of itself lawful, and by lawful authority, enjoins nothing that is sinful’. We denied this proposition, and at last gave diverse reasons of our denial; amongst which one was that ‘It may be unlawful by accident, and therefore sinful’… And I must confess I am still guilty of so much weakness as to be confident that ‘Some things, not evil of themselves, may have accidents so evil as may make it a sin to him that shall command them.’ Is this opinion inconsistent with all government? Yea I must confess myself guilty of so much greater weakness as that I thought I should never have found a man on earth that had the ordinary reason of a man, that had made question of it; yea I shall say more than that which has offended, viz, ‘That whensoever the commanding or forbidding of a thing indifferent is like to occasion more hurt than good, and this may be foreseen, the commanding or forbidding it is a sin.’ … I think Paul spake not anything inconsistent with the government of God or man when he bid both the rulers and the people of the Church not to destroy him with their meat for whom Christ died: and when he says, he hath not his power to destruction, but to edification; yea there are evil accidents of a thing, not evil of itself, that are caused by the commander: and it is my opinion that they may prove his command unlawful.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e91e1795a4" data-kw="">
<blockquote><p>They assert that Transubstantiation is not impossible, because God can do all things. Now, though it may sound presumptuous, this statement we deny; and God, we affirm, cannot do all things. God can, indeed, do all things that are the legitimate objects of power. God can do all things by His attribute of power that are not inconsistent with His attributes of wisdom, holiness, justice, goodness, or truth. …

When, therefore, we say that God can do all things – by “all things” we mean not “all things” as objects of mere power, but “all things” that God’s almighty power can effect in consistence with the harmony of all His moral attributes.

On this unquestionable principle we assert that God cannot make moral wrong to be moral right; for morality is love, and love is eternal and unchangeable as God himself – (1 John iv. 7, 8.) He cannot make truth falsehood, nor falsehood truth; for, as He hates “everything that maketh a lie,” He cannot make a lie, else would He hate himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-cooke.html">Henry Cooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The sacrifice of the mass examined in the light of the words of our Lord Jesus Christ and his holy apostles; being a full report of a sermon preached on the 15th December, 1844</cite>, (2nd edn, Belfast: William McComb, 1845), p. 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04ea9ba944" data-kw="">
<blockquote><p>I do not know of any satisfactory answer to this problem,” Kenny continued. “If I did, I would give it. Since I do not, I must leave it, as the writers of textbooks say, as an exercise for the reader” (A Path from Rome, 1986, 167–168). These questions may seem abstruse… But the question of Christ’s presence now on the altar is… central to the consecration and adoration of the Eucharist [in Romanism]. It is a question that many others besides Thomas Aquinas sought to answer, and a seriously inquiring intellect might rightly be disturbed, even scandalized, if forbidden to ask it. But for a long time Thomas’s answer was accepted just because it was his… Thomas’s answer to Kenny’s question can, in fact, be found in other Scholastics who variously adopt the principle that “that into which something is converted is where the converted thing was before.” This principle is dubious and was not universally accepted. Since transubstantiation converts only the substance of the bread into Christ’s body and not also the accidents, why should any of the accidents of the bread be kept by Christ’s body if, according to the doctrine, the accidents are not part of the transubstantiation? [Simpson goes on to describe Scotus’s proposed answer to the issue.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-l-p-simpson.html">Peter L.P. Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Have you Tried Scotus? Aquinas Didn’t Know Everything’ in Commonweal</cite>, (June 14, 2019), p. 12</span></figcaption>

</figure><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 4</span></figcaption>

<blockquote><p>V. Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary). We do not deny that the use of fermented bread seems to us the more suitable, both because it is more in accordance with the design of Christ (which was to use common and ordinary bread, which is everywhere to be found); and because it is more appropriate to sustain the sacramental analogy (which consists in signifying our communion with Christ by the similitude of bodily nourishment); and because the necessity of unleavened bread belongs to the Jewish ceremonies (which are abrogated and cannot be retained without a certain affectation [kakozēlia] of Judaism); and because in the whole ancient church no traces appear of the common use of unleavened bread in the Eucharist before the ninth or tenth century. Yea, it is evident that the Eucharistic symbols were formerly taken from the offerings of bread and wine made by believers, which were undoubtedly of ordinary and fermented bread (as the Jesuit James Sirmondus, “Disquisitio de Azymo,” Opera Varia [1696], 4:513–30, candidly acknowledges and solidly confirms by many arguments). The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever he did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks: “An act of Christ alone is not sufficient to form a command; for although he consecrated in white wine, or at night, for example, he did not on that account command us so to consecrate” (3. Thom. de Sacra). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>

the ninth or tenth century. Yea, it is evident that the Eucharistic symbols were formerly taken from the offerings of bread and wine made by believers, which were undoubtedly of ordinary and fermented bread (as the Jesuit James Sirmondus, “Disquisitio de Azymo,” Opera Varia [1696], 4:513–30, candidly acknowledges and solidly confirms by many arguments). The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever he did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks: “An act of Christ alone is not sufficient to form a command; for although he consecrated in white wine, or at night, for example, he did not on that account command us so to consecrate” (3. Thom. de Sacra). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.”

— Francis Turretin, Institutes of Elenctic Theology, 19.22.5, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 430.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+Christ+used+bread+because+with+the+divine+blessing+it+is+of+all+the+elements+the+most+efficacious+for+nourishing+and+strengthening+the+body%3B+the+most+common%2C+the+most+familiar+and+to+be+found+everywhere%2C+easily+prepared+and+the+most+pleasant.+However%2C+the+bread+he+used+was+unleavened%3B+not+from+the+necessity+of+the+thing%2C+but+from+an+accidental+circumstance+of+time%2C+on+account+of+the+feast+of+the+Passover%2C+in+which+it+was+lawful+neither+to+use+nor+to+have+any+other+%28Ex.+12%3A19%29.+Otherwise+it+was+always+fermented+in+Judea+%28whenever+the+Supper+was+celebrated+outside+of+that+time%2C+Acts+2%3A42%29+as+well+as+among+the+Gentiles+%28who+used+common+and+not+unleavened+bread%29.+Hence+it+was+called+simply+the+%E2%80%9Cbreaking+of+bread%E2%80%9D+%28Acts+20%3A7%3B+1+Cor.+10%3A16%3B+11%3A26%2C+27%29.+So+that+here+so+fierce+a+dispute+on+this+subject+falsely+sprang+up+between+the+Greeks+and+Latins%3B+the+Greeks+pressing+the+necessity+of+leavened%2C+the+latter+of+unleavened+bread.+The+former+were+called+%E2%80%9Cfermentarians%E2%80%9D+and+the+latter+%E2%80%9Cazymites.%E2%80%9D+The+thing+is+in+itself+indifferent+%28as+many+of+the+Romanists+acknowledge%29%3B+on+account+of+which+the+peace+of+the+church+ought+not+to+be+disturbed%2C+but+it+should+be+left+to+their+freedom+%28as+it+is+evident+that+both+the+ancient+and+also+the+modern+uses+vary%29.+We+do+not+deny+that+the+use+of+fermented+bread+seems+to+us+the+more+suitable%2C+both+because+it+is+more+in+accordance+with+the+design+of+Christ+%28which+was+to+use+common+and+ordinary+bread%2C+which+is+everywhere+to+be+found%29%3B+and+because+it+is+more+appropriate+to+sustain+the+sacramental+analogy+%28which+consists+in+signifying+our+communion+with+Christ+by+the+similitude+of+bodily+nourishment%29%3B+and+because+the+necessity+of+unleavened+bread+belongs+to+the+Jewish+ceremonies+%28which+are+abrogated+and+cannot+be+retained+without+a+certain+affectation+%5Bkakoz%C4%93lia%5D+of+Judaism%29%3B+and+because+in+the+whole+ancient+church+no+traces+appear+of+the+common+use+of+unleavened+bread+in+the+Eucharist+before+the+ninth+or+tenth+century.+Yea%2C+it+is+evident+that+the+Eucharistic+symbols+were+formerly+taken+from+the+offerings+of+bread+and+wine+made+by+believers%2C+which+were+undoubtedly+of+ordinary+and+fermented+bread+%28as+the+Jesuit+James+Sirmondus%2C+%E2%80%9CDisquisitio+de+Azymo%2C%E2%80%9D+Opera+Varia+%5B1696%5D%2C+4%3A513%E2%80%9330%2C+candidly+acknowledges+and+solidly+confirms+by+many+arguments%29.+The+example+of+Christ+neither+can+nor+ought+to+be+made+an+objection+here%2C+because+as+we+have+said+there+was+a+peculiar+reason+which+impelled+him+to+the+use+of+unleavened+bread+%28which+no+longer+exists%29.+Therefore%2C+his+example+binds+us+as+to+the+essence+of+the+thing+itself%2C+that+we+should+do+whatever+he+did+%28take%2C+bless%2C+and+break+the+bread+and+other+acts+of+this+kind+mentioned+by+the+sacred+writers%29%3B+but+not+forthwith+as+to+the+particular+circumstances%2C+which+do+not+belong+to+the+thing.+Suarez+remarks%3A+%E2%80%9CAn+act+of+Christ+alone+is+not+sufficient+to+form+a+command%3B+for+although+he+consecrated+in+white+wine%2C+or+at+night%2C+for+example%2C+he+did+not+on+that+account+command+us+so+to+consecrate%E2%80%9D+%283.+Thom.+de+Sacra%29.+Nor+if+unleavened+cakes+have+a+mystical+signification%2C+are+they+immediately+of+divine+institution%2C+since+it+is+evident+that+the+cause+of+the+institution+was+the+memory+of+the+hasty+departure+from+Egypt.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+19.22.5%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+3+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+430.&amp;url=https%3A%2F%2F5solasquotes.github.i

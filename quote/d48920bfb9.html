<blockquote><p>A fourth Argument is drawn from the names which the Scripture giveth to Heretics and Sectaries, holding forth the extreme danger of tolerating and letting them alone. They are called ravening wolves, Matth. 7. 15. and grievous wolves not sparing the flock, Act. 20. 29. thieves and robbers, John 10. 8. Their word eateth as a canker, 2 Tim. 2. 17. and is as a little leaven leavening the whole lump, Gal. 5. 9. They are troublers of Israel, Act. 15. 24. Gal. 5. 12. Shall the troublers of the State be punished, and the troublers of Israel go free? Shall Physicians cut off the member that hath a Gangrene in it, because it endangereth the whole body, and shall the great State physicians suffer the Gangrene to spread in the Church?

Shall men’s bodies, goods, and purses, be so far cared for, that thieves and robbers must not be suffered, but justice done upon them; and shall those have immunity who steal away souls from Christ, and rob us of the pearl of truth? Nay shall the poor sheep be so much looked to, that the wolf must not be spared; and shall we suffer the soul-destroying wolves to enter, yea abide peaceably among the dear-bought flock of Jesus Christ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity reconciled with Christian liberty, or, The true resolution of a present controversy concerning liberty of conscience here you have the question stated, the middle way betwixt popish tyranny and schismatizing liberty approved and also confirmed from Scripture and the testimonies of</cite>, (London: Christopher Meredith, 1645), pp 14-15.</span></figcaption>

<blockquote><p>From whence we take the freedom to entreat you for God’s sake, strictly to inspect into vocations and employments, that they be not mixed nor confounded to the detriment both of the one and other. The ministerial function is expressly limited by the Word of God as to its laws, ends, means and actings, it being altogether different from, yea and totally contrary to the secular government; And we conceive that there is no such difficulty in the matter, but that ministers may be kept within the inviolable bounds of their most holy calling, and yet be useful unto the public without glorying in those little arts of subtilties and surprisals, which abutt at no other mark than temporal and carnal profit. Besides that ’tis a very rare thing to find a man capable both of the one and other calling, there is this grand mischief in it, that flesh and blood seeing in the holy ministry nothing but what is mean and humble, despicable, and painful, difficult and dangerous, and contrariwise meeting in the management of secular affairs with food and fuel enough for pride, ambition and covetousness (the ground of all envies and jealousies), and with the means and helps to carry on designs of self-advancement and domination, as tricks, craft and dissimulation; It will be almost impossible to hinder the spreading of this contagion, which creeps insensibly into the greatest wits, and seizes upon them at unawares, and not as an affected and approved vice. We know very well, that necessity, the law of the present day, is pleaded and urged on behalf of this practice, too too much in use among you to vindicate and justify it. But for God’s sake, most dear brethren, we beseech you to consider, whether it were not better that your temporal affair should suffer some inconveniencies, than your spiritual ones to be contaminated; And whether the great risk you run in ruining and depraving your pastors should be preferred unto your temporal interests. And whether it were not better to have a reserve among you of some pure and savory salt against the general corruption, rather than to hazard all in this universal overthrow by the world, upon which theater we see the most valiant champions to be foiled. If the necessity be absolute, peremptory and indispensable, then let them go about such secular political affairs with regret and grief, troubled at their enforced distraction from their heavenly calling, lamenting as the spouse in the Canticles that they have made me the keeper of the vineyard, but mine own vineyard have I not kept. Let them go, but then only, when your businesses are in extreme danger, as it were at the last gasp, when you need the greatest circumspection, a most immovable fidelity, and unchangeable integrity, and without any affectation or introduction of ambition, or hidden, disguised interests. No man going to war entangles himself with the world, that so he may the better please his Captain that has listed him. That commination is very dreadful, the priest shall be as the people, and that lamentation exceeding doleful, All this evil and mischief is from the prophets, and the stones of the sanctuary are lying at the four corners of the streets. Let us, most dear and honored brethren, give up and resign ourselves to the conduct of true wisdom, speaking to us from the Word of God, which is, to forsake our own. This also, most honored brethren should be endeavored, that all persons whatsoever in the ministry, when called forth unto those secondary employments of the Church, do retain in their deportments and conversations the marks and characters of their first and most sacred vocation. Let their devotion, piety, gravity, self-denial, and sequestration from worldly pleasures, used with too great a liberty by many Christian statesmen serve to maintain the sweet odor and reputation of our Church government, and to keep up inviolably the authority of their most holy ministry, and to bind the souls and consciences of men by religious humility to an everlasting dependance on the majesty of their great Lord, whose holiness and sovereign wisdom shines forth most resplendently in the order of his service, as the Queen of Sheba saw and admired it in the Court of Solomon. Impiety and impudence are too much in vogue everywhere. But let the sanctuary, the Church of God be at least the receptacle and habitation of true and unfeigned piety, where it may act and breath freely at in the open air, with an uplifted countenance, in a courageous demonstration of the Spirit, and evidence of Truth, convincing and condemning the unfruitful works of darkness, and awakening with its bright shining flambeau the drowzy consciences of a perverse generation, it may encourage the faithful unto perseverance, and preserve the remnant of Jacob in this day of dispersions and desolations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, pp. 441-42</span></figcaption>

— French Reformed Churches, Synodicon in Gallia Reformata (John Quick, London, 1692), ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, pp. 441-42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+whence+we+take+the+freedom+to+entreat+you+for+God%E2%80%99s+sake%2C+strictly+to+inspect+into+vocations+and+employments%2C+that+they+be+not+mixed+nor+confounded+to+the+detriment+both+of+the+one+and+other.+The+ministerial+function+is+expressly+limited+by+the+Word+of+God+as+to+its+laws%2C+ends%2C+means+and+actings%2C+it+being+altogether+different+from%2C+yea+and+totally+contrary+to+the+secular+government%3B+And+we+conceive+that+there+is+no+such+difficulty+in+the+matter%2C+but+that+ministers+may+be+kept+within+the+inviolable+bounds+of+their+most+holy+calling%2C+and+yet+be+useful+unto+the+public+without+glorying+in+those+little+arts+of+subtilties+and+surprisals%2C+which+abutt+at+no+other+mark+than+temporal+and+carnal+profit.+Besides+that+%E2%80%99tis+a+very+rare+thing+to+find+a+man+capable+both+of+the+one+and+other+calling%2C+there+is+this+grand+mischief+in+it%2C+that+flesh+and+blood+seeing+in+the+holy+ministry+nothing+but+what+is+mean+and+humble%2C+despicable%2C+and+painful%2C+difficult+and+dangerous%2C+and+contrariwise+meeting+in+the+management+of+secular+affairs+with+food+and+fuel+enough+for+pride%2C+ambition+and+covetousness+%28the+ground+of+all+envies+and+jealousies%29%2C+and+with+the+means+and+helps+to+carry+on+designs+of+self-advancement+and+domination%2C+as+tricks%2C+craft+and+dissimulation%3B+It+will+be+almost+impossible+to+hinder+the+spreading+of+this+contagion%2C+which+creeps+insensibly+into+the+greatest+wits%2C+and+seizes+upon+them+at+unawares%2C+an forsake+our+own.+This+also%2C+most+honored+brethren+should+be+endeavored%2C+that+all+persons+whatsoever+in+the+ministry%2C+when+called+forth+unto+those+secondary+employments+of+the+Church%2C+do+retain+in+their+deportments+and+conversations+the+marks+and+characters+of+their+first+and+most+sacred+vocation.+Let+their+devotion%2C+piety%2C+gravity%2C+self-denial%2C+and+sequestration+from+worldly+pleasures%2C+used+with+too+great+a+liberty+by+many+Christian+statesmen+serve+to+maintain+the+sweet+odor+and+reputation+of+our+Church+government%2C+and+to+keep+up+inviolably+the+authority+of+their+most+holy+ministry%2C+and+to+bind+the+souls+and+consciences+of+men+by+religious+humility+to+an+everlasting+dependance+on+the+majesty+of+their+great+Lord%2C+whose+holiness+and+sovereign+wisdom+shines+forth+most+resplendently+in+the+order+of+his+service%2C+as+the+Queen+of+Sheba+saw+and+admired+it+in+the+Court+of+Solomon.+Impiety+and+impudence+are+too+much+in+vogue+everywhere.+But+let+the+sanctuary%2C+the+Church+of+God+be+at+least+the+receptacle+and+habitation+of+true+and+unfeigned+piety%2C+where+it+may+act+and+breath+freely+at+in+the+open+air%2C+with+an+uplifted+countenance%2C+in+a+courageous+demonstration+of+the+Spirit%2C+and+evidence+of+Truth%2C+convincing+and+condemning+the+unfruitful+works+of+darkness%2C+and+awakening+with+its+bright+shining+flambeau+the+drowzy+consciences+of+a+perverse+generation%2C+it+may+encourage+the+faithful+unto+perseverance%2C+and+preserve+the+remnant+of+Jacob+in+this+day+of+dispersions+and+desolations.%E2%80%9D%0A%0A%E2%80%94+French+Reformed+Churches%2C+Synodicon+in+Gallia+Reformata+%28John+Quick%2C+London%2C+1692%29%2C+ed.+John+Quick%2CSynodicon+in+Gallia+reformata%2C+or%2C+The+Acts%2C+Decisions%2C+Decrees+%26+Canons+of+those+Famous+National+Councils+of+the+Reformed+Churches+in+France+%28London%3A+Parkhurst%2C+1692%29%2C+Synod+21%2C+of+Tonneins%2C+1614%2C+ch.+19%2C+A+Letter+from+the+Church+of+Geneva.+To+the+National+Synod+of+the+Reformed+Churches+of+France+assembled+at+Tonneins%2C+pp.+441-42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0dcd26448c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0dcd26448c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=From%20whence%20we%20take%20the%20freedom,this%20day%20of%20dispersions%20and%20desolations&amp;text=From%20whence%20we%20take%20the%20freedom%20to%20entreat&amp;text=Jacob%20in%20this%20day%20of%20dispersions%20and%20desolations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f513f688ee" data-kw="">
<blockquote><p>To a person in any degree acquainted with the history of the Scottish Reformation, it must be completely evident that the Reformers laboured strenuously to establish, as an essential part of their system, the harmonious co-operation of a reformed State with a reformed Church, in maintaining truth and piety, and repressing falsehood and irreligion. This principle, after countless struggles and costly sacrifices, willingly tendered for its attainment, became ascendant at the memorable era of the Second Reformation, from 1638 to 1649, and was embodied in the solemn vows of the nation. These Federal Deeds assume the doctrine of an Establishment so fundamentally, that lay it aside, and they are deprived of half their meaning. They tender the national faith for the upholding of a pure establishment, which, through the good hand of God, had been set up; and they most unequivocally bind men, in civil authority, of whatever class, to employ their official power and resources to sustain the true religion professed, and to discontinue and eradicate error and false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenanter’s narrative and plea: exhibiting the error, schism, radicalism, and slander of Dr. Paul, and other separatists from the Reformed Presbyterian Church</cite>, (Belfast, 1841), pp 32-3.</span></figcaption>

ants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>At the very least, Londoners were by this time divided regarding whether or not to attend church during plague visitations. The government ordered theaters and markets closed during outbreaks, parliament was prorogued [discontinued without being dissolved], and the idea of coming together, even for worship, ran counter to contagion theory, which was gaining traction.</p></blockquote>

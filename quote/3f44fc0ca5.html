<main class="wrap"><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>

<blockquote><p>7th Question: Is it necessary in essence for the Church, or at least as a requirement, that all its members be closely united in terms of locality? Response: Conclusion: It is very convenient, so this should generally be observed, that members are constituted from a common locality, such as from a neighborhood or city. Because such is suggested by the practice of the Apostolic Church. For we do not read that the inhabitants of Cenchreae were included in the Church of the Corinthians, or vice versa. Because if they can observe one another more easily, they can stimulate love and good works, Hebrews 10, and give and receive examples. Because in this way they can best encourage, comfort, and build each other up, 1 Thess. 5:11,14, and indeed as mentioned in Heb. 3:13. Conclusion: Therefore, it should not be proven that without a just necessity, citizens, for example, of our city should be enrolled in the Church of a neighboring city or village, and vice versa. Because this inconvenience exists and affects many looking towards ecclesiastical communion; for the enjoyment of which God primarily instituted gatherings and ecclesiastical societies: See the statements of the preceding problem. Because it breeds confusion, contentions, and divisions among members and churches; it removes harmony and weakens the vigor of ecclesiastical discipline. Hence, ancient canons have prohibited transitions and appeals to other churches for both private believers and clergy. See the Canons of the African Church, especially Canons 23, 28, 54, 105, 125, and notably the Canons and Acts of the Council of Carthage in the year 419, where a synodical letter to Boniface, Bishop of the Roman Church, shows that one should not be summoned from Africa across the sea to the See of Rome. The constitutions, decrees, and practices of the Belgian Churches absolutely prohibit any transfer from one church to another, whether of the same language or a different one, without good permission and dismissal, or written testimony from the church of which one is a member. This especially applies to those transient members around whom the office of correction or even censorship is exercised. Because it smacks of schismatic and factious behavior or carnal curiosity, i.e., factionalism, pride, and disdain; similarly as in the Church of Corinth, 1 Cor. 1:12 &amp; 3:3. Conclusion: If in any case, due to urgent reasons, it is granted to someone or some people to be enrolled in a church outside their place of residence, or to remain in the same church after moving to a nearby city or village, this must be done with the advice and consent of both churches. Conclusion: Another reason is far different when churches are not of the same confession or at least differ to the extent that the advantages of local presence and cohabitation are postponed for the tranquility of conscience and safer and much greater edification. This must be dealt with elsewhere in detail, and we may touch on it below. Conclusion: Where faithful cannot enjoy the benefits of close cohabitation, they should not be circumscribed by the boundaries of that church and excluded from it, just as those who live outside the parish, city, or village should not be forced to join it any more than those who live there. Because the circumstance of location and civil cohabitation is external and accidental to the church; therefore, it is not of its nature or essence. Because it is not a necessary requirement. Ecclesiastical communion acts can be carried out among those members, although not as promptly, abundantly, easily, and excellently. For more and less do not alter the species. Because the status of a clandestine and troubled church often requires such a thing due to persecutions, heresies, schisms, and similar disturbances. Because the defects of other faithful, churches, and ministers in many places leave nothing else for the faithful but to resort to this last refuge, especially since they cannot use the first ship.</p></blockquote>

<blockquote><p>Its a wide mistake that a presbyterian Church has its formal essence from a voluntary, actual combination in such bounds, or such a circuit more or less. That is not a pillar of presbyterian Churches. For their near association, by dwelling where they may edify or scandalize one another, gives them right to be an associated Church; not simply habitation, but the habitation of such and such professors in covenant with God, baptized and giving themselves up in profession to Christ as disciples, before there be a formal consent, they are obliged to associate: yea, nor does that voluntary combination make a presbyterial Church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0f616ed5d9" data-kw="">
<blockquote><p>There are three distinct Persons of the blessed Trinity, the Father, Son, and Spirit, who are the same one God: in the Name of these Three, is Baptism administrated; and from Them, Grace is wished and prayed for, 2 Cor, 13.14. For, 1. That there are Three, who are distinctly mentioned here, cannot be denied; that the first is the Father; and the third, Jesus Christ, really distinct from the Father, is clear: for, the Son, and not the Father, was incarnate: and therefore the like must be said of the seven Spirits, that they set forth the Holy Ghost personally, seeing it is He who in the like places useth to be joined in with the Father and the Son, as 2 Cor. 13.13. 1 Joh. 5.7, 8. and therefore it’s said in the seven Epistles, to be what the Spirit saith. These Seven Spirits therefore, is that one Spirit, and He a person that speaketh to the Churches.

Secondly, That each of these Three must be God, appears, 1. Because the last Two are both joined as equal with the Father, of whom there can be no question. 2. Because the Son, Jesus Christ, afterward hath the same Title attributed to Him, which is here given to the Father. 3. Because the same one suit, is prayed for from all of them; and, it being Grace and Peace, which only God can give, suppones [supposes] divine essential Attributes to be in those from whom they are wished: yea, They are named here, as joint Senders of this Epistle, and Authorizers of this Word; therefore is it so often afterward said, Let him that hath ears, hear what the Spirit saith: and there can no Authority but what is divine, be sufficient here. Hence also, Thus saith the Lord, and, thus saith the Holy Ghost, are frequently put for one another: each one therefore of these Three must be God. 3. It may appear from this also, that all these Three are One God, thus, This Revelation and Salutation cometh from one God, chap. 1. ver. 1. and 22. 18, 19. and yet this Revelation and Salutation cometh from the Father, Son, and Spirit: therefore They are that One God.

Again, If the Grace and Peace proceed from one Essence, which is common to all, then they are the same God essentially, though distinct Persons; but Grace and Peace looks to the same Godhead and Essence, though it be wished for from all, for the effect, Grace and Peace, is but one, it doth therefore suppose an unity in the fountain from which it comes, to wit, these Three Persons of the glorious Godhead, who are named distinctly, not to shew a different effect from the Father, which is not from the Son; but to shew the concurrence of these blessed Three in an united way for bringing forth of these; so that what cometh from the Father, cometh also from the Son and Spirit.

These essential Attributes, and that most simple and infinite Essence, being common to all the Three Persons, it rests therefore that they are Three distinct Persons, and yet of the same infinite Godhead. Neither will that which the Socinians and others oppose to this place, have weight. Say they, Christ is spoken of here, as dead; Therefore cannot be God. For, it’s one thing to speak of Him who was dead, another to say that it speaks of Him as such. He that died was God, but He died not as God: and therefore this can only prove, that Jesus Christ, as to His Person, is man; but by it, we can no more deny Him to be the second Person of the Godhead, than afterward when He is called the first and the last, by that, we can deny Him to be man. And that the Son, and the Holy Ghost, are equal with the Father, appeareth also in this, That they are both equally with Him, the object of divine Worship here, to wit, of Invocation and Prayer, which could not otherwise be.</p></blockquote>

<blockquote><p>Ob. The Son and holy Ghost are not without beginning, therefore they are not eternal.

Answ. This is not a beginning of time or continuance, but only of order and offspring: but the Sabellian here cavil, viz. Christ saith, He that seeth me, seeth the Father: and believest thou not that I am in the Father, and the Father in me? Joh. 14.9.10. therefore the Father and the Son are one person. Ans. Indeed he that seeth the Son seeth the Father, because the Son hath the same essence with the Father, and being manifested in the flesh, hath delivered to us the whole will of God, Joh. 1.18.

Ob. 2. That which is one in number, cannot without contradiction be said to be three in persons: but God is one in number, (Deut. 6.4.) ergo.

Ans. That unity doth signify God’s simple essence, not the manner by which that simple essence subsisteth. Therefore God absolutely according to his essence is one, because he is indivisible: and only in respect of inward relation, I meane the reason of subsisting, is three.

Ob. 3. If there be one being of the Father, another of the Son, and another of the holy Ghost: it followeth, that in God there are three divers beings, and consequently three divers persons.

Ans. The being of the Father doth not signify that essence by which he is absolutely God, but by which he is Father, that is, in that he otherwise subsisteth then doth the Son: therefore the being of the Father is one thing, and the being of the Son is another, and yet both of them have the same essence.

Ob. 4. If there be three Persons truly distinguished, and one only essence, then is there a quaternity in God.

Ans. Not so: for the essence differeth from Person only in reason: but the Persons differ each from other both in reason and in being.

Ob. 5. The Father begot his Son either existing or not existing, to say either of these is absurd.

Ans. We may well say, that the Father begat his Son already existing, because the Father was never without the Son, even as the sun was never without his light. Again, it may be as well said, that he begat him not existing, in that his generation, although it be eternal, yet in order goeth before existence, as the sun is before his light.</p></blockquote>

<blockquote><p>The debate over Remonstrant Arminianism involved more than a dispute over soteriology. The Scottish Covenanter and Commissioner to the Westminster Assembly, Robert Baillie reminds us that the original Arminians were also suspect on the doctrines of the Trinity and divine simplicity:

It is to be remarked that the Arminian spirit in Holland leads men to hell another way than here in Britain; there the Arminians with great boldness running after Vorstius &amp; Socinus with a marvelous petulancy fell to brangle [shake into confusion] the Trinity of the Divine persons, yea, the simplicity of the Divine nature itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scotch Antidote Against the English Infection of Arminianism</cite>, (London: Samuel Gellibrand, 1652), pp 18-19.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The debate over Remonstrant Arminianism involved more than a dispute over soteriology. The Scottish Covenanter and Commissioner to the Westminster Assembly, Robert Baillie reminds us that the original Arminians were also suspect on the doctrines of the Trinity and divine simplicity:

<blockquote><p>c. The eternal generation of the Son. The personal property of the Son is that He is eternally begotten of the Father (briefly called “filiation”), and shares with the Father in the spiration of the Spirit. The doctrine of the generation of the Son is suggested by the Biblical representation of the first and second persons of the Trinity as standing in the relation of Father and Son to each other. Not only do the names “Father” and “Son” suggest the generation of the latter by the former, but the Son is also repeatedly called “the only-begotten,” John 1:14, 18; 3:16, 18; Heb. 11:17; 1 John 4:9. Several particulars deserve emphasis in connection with the generation of the Son: (1) It is a necessary act of God. Origen, one of the very first to speak of the generation of the Son, regarded it as an act dependent on the Father’s will and therefore free. Others at various times expressed the same opinion. But it was clearly seen by Athanasius and others that a generation dependent on the optional will of the Father would make the existence of the Son contingent and thus rob Him of His deity. Then the Son would not be equal to and homoousios with the Father, for the Father exists necessarily, and cannot be conceived of as non-existent. The generation of the Son must be regarded as a necessary and perfectly natural act of God. This does not mean that it is not related to the Father’s will in any sense of the word. It is an act of the Father’s necessary will, which merely means that His concomitant will takes perfect delight in it. (2) It is an eternal act of the Father. This naturally follows from the preceding. If the generation of the Son is a necessary act of the Father, so that it is impossible to conceive of Him as not generating, it naturally shares in the eternity of the Father. This does not mean, however, that it is an act that was completed in the far distant past, but rather that it is a timeless act, the act of an eternal present, an act always continuing and yet ever completed. Its eternity follows not only from the eternity of God, but also from the divine immutability and from the true deity of the Son. In addition to this it can be inferred from all those passages of Scripture which teach either the pre-existence of the Son or His equality with the Father, Mic. 5:2; John 1:14, 18; 3:16; 5:17, 18, 30, 36; Acts 13:33; John 17:5; Col. 1:16; Heb. 1:3. The statement of Ps. 2:7, “Thou art my Son; this day have I begotten thee,” is generally quoted to prove the generation of the Son, but, according to some, with rather doubtful propriety, cf. Acts 13:33; Heb. 1:5. They surmise that these words refer to the raising up of Jesus as Messianic King, and to the recognition of Him as Son of God in an official sense, and should probably be linked up with the promise found in 2 Sam. 7:14, just as they are in Heb. 1:5. (3) It is a generation of the personal subsistence rather than of the divine essence of the Son. Some have spoken as if the Father generated the essence of the Son, but this is equivalent to saying that He generated His own essence, for the essence of both the Father and the Son is exactly the same. It is better to say that the Father generates the personal subsistence of the Son, but thereby also communicates to Him the divine essence in its entirety. But in doing this we should guard against the idea that the Father first generated a second person, and then communicated the divine essence to this person, for that would lead to the conclusion that the Son was not generated out of the divine essence, but created out of nothing. In the work of generation there was a communication of essence; it was one indivisible act. And in virtue of this communication the Son also has life in Himself. This is in agreement with the statement of Jesus, “For as the Father hath life in Himself, even so gave He to the Son also to have life in Himself,” John 5:26. (4) It is a generation that must be conceived of as spiritual and divine. In opposition to the Arians, who insisted that the generation of the Son necessarily implied separation or division in the divine Being, the Church Fathers stressed the fact that this generation must not be conceived in a physical and creaturely way, but should be regarded as spiritual and divine, excluding all idea of division or change. It brings distinctio and distributio, but no diversitas and divisio in the divine Being. (Bavinck) The most striking analogy of it is found in man’s thinking and speaking, and the Bible itself seems to point to this, when it speaks of the Son as the Logos. (5) The following definition may be given of the generation of the Son: It is that eternal and necessary act of the first person in the Trinity, whereby He, within the divine Being, is the ground of a second personal subsistence like His own, and puts this second person in possession of the whole divine essence, without any division, alienation, or change</p></blockquote>

<blockquote><p>The point of the Trinity it is a speculative point, and it tends to practice. First, to be a foundation of our worship, that we worship one God in three persons. And then it tends to shew the unity among Christians, that God will work among Christians at length, that they shall be all one in some sort, as the Father, Son, and Holy Ghost are one: which, though it be a point of high and deep speculation, yet it tends to practice.</p></blockquote>

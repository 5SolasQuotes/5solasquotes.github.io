<blockquote><p>Moreover, the tables of the law in the ark were covered and hid by the mercy seat, or propitiatory cover. This prefigured that the violated law should be so covered by the divine Surety, who was to fulfill all the righteousness of it for believers, as never to appear any more to condemn them (Rom. 8:33–34).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/covenant-of-redemption/counsel-of-peace.html">Counsel of Peace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46c505599f" data-kw="">
<blockquote><p>It is the gospel that also discloses to sinners the covenant of grace into which the Father and the Son as last Adam, with the infinite approbation of the Holy Spirit, have entered for the salvation of such sinners as believe. Sinful men cannot be otherwise saved than by being enabled to take hold of that everlasting covenant by faith as to come into the bond of it. This, however, they cannot do unless they are made so to know it as to discern spiritually the reality, glory, and suitableness of it to their miserable condition as lost sinners. But it is the gospel only, coming to them “in demonstration of the Spirit and of power” (1 Cor. 2:4), that reveals this gracious covenant to them and shows them how they may be so instated in it as to possess and enjoy the blessings of salvation. They could never, according to the plan established in the counsel of peace, have known that eternal contract but by the revelation of it in the everlasting gospel. It is by the gospel, accompanied with the illuminating influences of His Holy Spirit, that the Lord Jesus, the messenger of the covenant, shows elect sinners His covenant (Ps. 25:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 108.</span></figcaption>

</figure><figure class="quote" id="q-d877258831" data-kw="">
<blockquote><p>1. That there is such a covenant of which they speak which was entered between God and Christ containing the transactions which pass between the Father and the Son. The tenor of which covenant we find laid down by the prophet Isaiah 53:10 ff., and commented upon by the apostle, Phil. 2:6. There we see first the work that Christ by covenant was to undergo: to make his soul an offering for sin. That is, as elsewhere is expressed, to give His life a ransom for many, and as He covenanted, so He did, “He became obedient to death, even the death of the cross” (Phil. 2:8). And that upon account of this covenant entered, Christ Himself speaking to it and of His work in it, says, “This commandment have I received of my Father” (John 10:18). 2. The reward that He was to receive which is laid down by the prophet in many words. A. “He shall see his seed” (Isa. 53:10). As Isaac being received from the dead in figure saw a seed, had an innumerable posterity, so the Lord Christ who was received from the dead in truth has His seed in like manner, believers innumerable, which are called His seed in resemblance to the seed of man. B. “He shall prolong his days”, not the days of His seed, as some would have it, making this one with the former and rendering the words videbit semen long avum, being delivered from death, He shall live and reign eternally, Rev. 1:18. C. “The pleasure of the Lord shall prosper in his hand”; He shall irresistibly do whatsoever is the Father’s pleasure to be done in the work of man’s salvation. D. “He shall see the travail of his soul, and shall be satisfied”; upon this work done, He fully enjoys the whole of all his desires. E. “Therefore will I divide Him a portion with the great, and He shall divide the spoil with the strong.” He obtains a perfect victory, has a plenary and full conquest over every adversary. 3. We yield that the whole of these covenant transactions between God and Christ was on our behalf. Making His soul an offering for sin, He offers it for those that are fallen by iniquity. All is (as is there said) for the justification of many. Whatsoever it is that upon the work done redounds to Himself. Yet the reason of undertaking was for us: Unto us He was born, unto us He was given, He was wounded for our transgressions, He was bruised for our iniquities, He was delivered for our offences, and raised again for our justification. He endured the work and we reap the benefit. 4. We confess that it is the work of Christ that we enjoy being in covenant, as it is His gift that we enjoy the blessing of ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of God</cite>, … (1658; rep. Puritan Publications), ch. 4, pp. 50-51</span></figcaption>

<blockquote><p>4. I have perused the larger Catechism of the Assembly, and judge it a most excellent sum of divinity: and so much the more excellent, in that it is sparing in the difficult and more abstruse part, and most full in the practical part: And I find no word that I dissent from, so I may have leave but to interpret four words, as follows: 1. Where it is said, that the Covenant of Grace was made with Christ, as the second Adam, and in Him, with all the elect. I understand it of the genus of the Covenant, one species being made with Christ, and another with man, and not as if it were one and the same Covenant in specie that was made with Christ and with man: though I acknowledge that the promise made to Christ contained the salvation of his elect as the matter of it.</p></blockquote>

<blockquote><p>…the nature of those eternal transactions… And these were carried on “per modum foederis,” “by way of covenant,” compact, and mutual agreement, between the Father and the Son; for although it should seem that because they are single acts of the same divine understanding and will, they cannot be properly federal [between different parties], yet because those properties of the divine nature are acted distinctly in the distinct persons, they have in them the nature of a covenant… And therefore are those counsels of the will of God, wherein lies the foundation of the priesthood of Christ, expressly declared as a covenant in the Scripture; for there is in them a respect unto various objects and various effects, disposed into a federal relation one to another.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the nature of those eternal transactions… And these were carried on “per modum foederis,” “by way of covenant,” compact, and mutual agreement, between the Father and the Son; for although it should seem that because they are single acts of the same divine understanding and will, they cannot be properly federal [between different parties], yet because those properties of the divine nature are acted distinctly in the distinct persons, they have in them the nature of a covenant… And therefore are those counsels of the will of God, wherein lies the foundation of the priesthood of Christ, expressly declared as a covenant in the Scripture; for there is in them a respect unto various objects and various effects, disposed into a federal relation one to another.”

— John Owen, An Exposition of the Epistle to the Hebrews… vol. 2 ed. W.H. Goold in Works (Edinburgh: T&amp;T Clark, 1862), vol. 19, Preliminary Exercitations, Ex. 28, ‘Federal Transactions Between the Father &amp; the Son’, pp. 77-78">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+nature+of+those+eternal+transactions%E2%80%A6+And+these+were+carried+on+%E2%80%9Cper+modum+foederis%2C%E2%80%9D+%E2%80%9Cby+way+of+covenant%2C%E2%80%9D+compact%2C+and+mutual+agreement%2C+between+the+Father+and+the+Son%3B+for+although+it+should+seem+that+because+they+are+single+acts+of+the+same+divine+understanding+and+will%2C+they+cannot+be+properly+federal+%5Bbetween+different+parties%5D%2C+yet+because+those+properties+of+the+divine+nature+are+acted+distinctly+in+the+distinct+persons%2C+they+have+in+them+the+nature+of+a+covenant%E2%80%A6+And+therefore+are+those+counsels+of+the+will+of+God%2C+wherein+lies+the+foundation+of+the+priesthood+of+Christ%2C+expressly+declared+as+a+covenant+in+the+Scripture%3B+for+there+is+in+them+a+respect+unto+various+objects+and+various+effects%2C+disposed+into+a+federal+relation+one+to+another.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%E2%80%A6+vol.+2+ed.+W.H.+Goold+in+Works+%28Edinburgh%3A+T%26T+Clark%2C+1862%29%2C+vol.+19%2C+Preliminary+Exercitations%2C+Ex.+28%2C+%E2%80%98Federal+Transactions+Between+the+Father+%26+the+Son%E2%80%99%2C+pp.+77-78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47c9a52daf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47c9a52daf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-covenant-of-redemption/#:~:text=the%20nature%20of%20those%20eternal%20transactions,a%20federal%20relation%20one%20to%20another&amp;text=the%20nature%20of%20those%20eternal%20transactions&amp;text=disposed%20into%20a%20federal%20relation%20one%20to%20another" rel="noop

<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 9. ‘What is Meant in Scripture by the Word ‘Heresies’…’</span></figcaption>

<blockquote><p>The religious observance of this institution was required under a very severe penalty, Gen. 17:14. The contempt of circumcision was a contempt of the covenant; if the parents did not circumcise their children, it was at their peril, as in the case of Moses, Ex. 4:24–25. With respect to those that were not circumcised in their infancy, if, when they grew up, they did not themselves come under this ordinance, God would surely reckon with them. If they cut not off the flesh of their foreskin, God would cut them off from their people. It is a dangerous thing to make light of divine institutions, and to live in the neglect of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 17, verse 14</span></figcaption>

<blockquote><p>III. Here therefore we think the question can be solved by distinguishing heretics. For there are some who corrupt the substance of baptism and omit or change the form of institution; such as were the ancient Arians, who denied a Trinity of persons in unity of essence, and the modern Socinians. Others, while they retain substantials and defend the true doctrine of the holy Trinity contained in the formula of baptism, ‘err on other heads of doctrine’; as the ancient Novatians and Donatists, and the modern Romanists and Arminians. As to the former, we judge that baptism administered by them is null, and so they are not properly to be rebaptized, but baptized, who have been baptized by such heretics, because they evidently corrupt the essential form of baptism, to which the invocation of the Trinity belongs. For this reason, the baptism of the Arians, who baptized ‘in the name of the Father, the only true God, in Jesus Christ, the Savior and a creature, and in the Holy Spirit, the servant of both’… was formerly rejected in the Nicene Council… Still a distinction must be made here again. For either the minister alone was infected with that heresy or the whole church with him. If the latter, we deny it to be true baptism. If the former (to wit, if the church thinks rightly, notwithstanding the error of the pastor, if he is a secret heretic), provided the formula of Christ be retained, we believe the baptism to be valid and that it is not necessary to rebaptize those who have been once baptized. The sacrament is the property of the church, which is administered in her name and in her faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 15, ‘Is Baptism Administered by Heretics Lawful? We Distinguish’ in Institutes (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, pp. 396-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-7cdee6be1e" data-kw="">
<blockquote><p>30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith.

31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues.

32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>

— Louis Le Blanc, Theological Theses Published at Various Times in the Academy of Sedan 3rd, ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), vol. 2, ‘On Faith’, pp. 131-32 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C30.+But+those+in+whom+true+faith+is+found+are+all+and+only+those+who+are+predestined+to+eternal+life.+For+that+faith+falls+to+them+from+the+decree+of+divine+election%3B+and+therefore+it+is+called+by+Paul%2C+%E2%80%9Cthe+faith+of+God%E2%80%99s+elect%2C%E2%80%9D+Tit.+1%3A1.+Whence+it+happens+that+without+it+no+one+can+be+saved%2C+nor+does+anyone+have+it+who+does+not+obtain+salvation.+For+that+assent+which+imitates+true+faith+in+some+of+the+reprobate+is+temporary+faith%2C+about+which+we+spoke+above%3A+and+it+must+be+distinguished+from+justifying+and+saving+faith.+31.+But+as+to+what+is+often+asked+here%2C+whether+elect+and+saved+infants+also+have+faith%2C+it+is+plain+indeed+that+they+cannot+have+actual+faith%3B+but+nothing+prohibits+a+certain+habitual+faith%2C+or+rather+the+seed+and+root+of+faith%2C+from+being+infused+in+them.+And+certainly+it+cannot+happen+that+God+does+not+cleanse+from+every+stain+of+original+sin+all+the+infants+whom+he+admits+into+his+heavenly+kingdom%2C+into+which+nothing+polluted+or+defiled+enters.+Since+therefore+original+sin+in+infants+includes+a+certain+seed+of+unbelief%2C+just+as+of+all+vices%2C+while+God+cleanses+them%2C+He+undoubtedly+takes+away+that+innate+unbelief%2C+and+so+infuses+the+principle+and+a+certain+seed+of+faith.+For+God+does+not+purge+his+own+from+vices+except+by+infusing+the+contrary+habits+of+virtues.+32.+Moreover%2C+whatever+that+may+be%2C+whether+faith+or+the+root+of+faith+and+disposition+to+faith+which+can+be+found+in+infants%2C+it+is+beyond+controversy+that+it+must+be+attributed+to+God+alone%2C+and+that+the+offices+of+man+do+not+concur+with+it%3A+nor+can+it+be+called+into+doubt+by+anyone%3A+but+Scripture+also+manifestly+teaches+that+the+same+must+be

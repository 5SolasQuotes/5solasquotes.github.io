<main class="wrap"><figure class="quote" id="q-feda9ba05a" data-kw="">
<blockquote><p>I advise you to be aware that the subject of Paul’s Epistle to the Galatians is the same as that found in the letter written to the Romans. But there is this difference between them: in the latter epistle he has made use of loftier meaning and more profound arguments, whereas in Galatians he writes as to those of whom he says in what follows, “Oh foolish Galatians,” and, “so you are foolish?” He has restrained himself by using this sort of language in which he is rebuking rather than teaching, using words that fools could understand. Thus he dresses common opinions in common speech, and authority recalls those whom reason was unable to persuade.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on Galatians, Titus, and Philemon</cite>, trans. Thomas P. Scheck (c. 386-88; Notre Dame IN: University of Notre Dame, 2010), p. 50.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-c1195806d4" data-kw="">
<blockquote><p>The Zeeland form for ministers reads: ‘We the undersigned ministers of the Word declare by this subscription, that we heartily believe and are persuaded that all the articles and points of doctrine contained and explained in this Confession and Catechism, from greatest to least, do fully conform (in alles conform syn) to the Word of God, and we also hereby solemnly promise, as the occasion requires, to teach and advocate all these points of doctrine publicly and privately. And if at any time we should have any sentiment or objection against any article or point of doctrine, contained in the aforesaid Confession and Catechism, we promise that we will neither publicly nor privately present the same except properly in classical or synodical assemblies, under the penalty of being censured as schismatics. And if at any time the classis or synod may deem it proper, to maintain unity in doctrine, to require of us our further sentiments and explanation of any article of the aforesaid Confession or Catechism, we also hereby promise to be always ready and willing to do so, without refusal, under the penalty above mentioned.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription</cite></span></figcaption>

k">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-27431e49ab" data-kw="">
<blockquote><p>With urgency.—If a neighbour’s house were on fire, would we not cry aloud and use every exertion? If a friend were drowning, would we be ashamed to strain every nerve to save him? But alas! the souls of our neighbours are even now on their way to everlasting burnings,—they are ready to be drowned in the depths of perdition. Oh, shall we be less earnest to save their never-dying souls, than we would be to save their bodies? How anxious was the Lord Jesus in this! When He came near and beheld the city. He wept over it.

How earnest was Paul! “Remember that by the space of three years I ceased not to warn every one night and day with tears.” Such was George Whitfield; that great man scarcely ever preached without being melted into tears. Brethren, there is need of the same urgency now. Hell is as deep and as burning as ever. Unconverted souls are as surely rushing to it. Christ is as free — pardon as sweet as ever! Ah! how we shall be amazed at our coldness when we do get to heaven!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon XI. At the Ordination of the Rev. P. L. Miller, Wallacetown, Dundee, 1840 in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

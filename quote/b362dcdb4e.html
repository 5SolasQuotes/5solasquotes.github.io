</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e06d74f326" data-kw="">
<blockquote><p>Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-martyn-lloyd-jones.html">D. Martyn Lloyd-Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Depression – Its Causes and its Cures</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-as-a-one-time-act.html">Justification as a one-time act</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.”

</figure><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

</figure><figure class="quote" id="q-e6913080d1" data-kw="">
<blockquote><p>The sum and, as it were, the goal of all Scripture is the forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, Third Topic (Indulgences), Sec. I, ch. II, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/pardon-and-acceptance.html">Pardon and acceptance</a></span></div>
<div class="actions"><button class="copy" data-copy="“The sum and, as it were, the goal of all Scripture is the forgiveness of sins.”

— Martin Chemnitz, Examination of the Council of Trent, Part IV, Third Topic (Indulgences), Sec. I, ch. II, p. 167">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+sum+and%2C+as+it+were%2C+the+goal+of+all+Scripture+is+the+forgiveness+of+sins.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+Examination+of+the+Council+of+Trent%2C+Part+IV%2C+Third+Topic+%28Indulgences%29%2C+Sec.+I%2C+ch.+II%2C+p.+167&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe6913080d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e6913080d1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-31ccf53a7e" data-kw="">
<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

<blockquote><p>During the period to which this volume relates, the magistrates and council seem to have usually met twice a-week, on Wednesdays and Fridays, at ten o’clock… On 19th May 1585, it was resolved, in consideration of the apparent increase of the plague, that the council should meet every day after prayers and sermon…</p></blockquote>

</figure><figure class="quote" id="q-d9109a0038" data-kw="">
<blockquote><p>There has to be a system of government regulation, up to and including quarantine, in order to stop the spread of dangerous pathogens. These should be regarded as invaders. If a society has the right to create a military defense system against invading armies, then it has the right to do the same with respect to invading armies of pathogens. Only the civil government can do this. This cannot be done on a profit-seeking basis. This is not a matter for the free market to solve. The free market can solve certain issues, such as the development of anti-pathogen chemicals or techniques. There can be profit in this. But the taxpayer is going to have to provide the money that civil governments use to develop systematic pathogen defense strategies, and then implement these strategies. In terms of the total cost of government, these are minor expenditures. Societies have used them throughout history. Most people accept them. There is no well-organized opposition to their use. Compared to the massive expenditures of the modern state on projects that are clearly banned by the Bible, these exceptions do not constitute a threat to the freedom of covenant-keeping people. Furthermore, those free market economists who would deny any of these expenditures have not developed comprehensive monographs on how the free market could attain these goals. They are legitimate goals. Free-market economists need to come to grips with this fact: they cannot beat something with nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gary-north.html">Gary North</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conclusion’ in Ch. 56, ‘Boundary Violations’, ‘C. Public Health’, ‘2. Quarantine’ in Christian Economics: Scholar’s Edition, vol. 4 (2020)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-1a90b4ca97" data-kw="">
<blockquote><p>6. They [civil magistrates] may, and ought to interpose their authority, for inhibiting the receiving and hearing, or conversing with known and manifest seducers: for, this is but to discharge, and thereby to preserve the people from running to their own hazard, even as men ought to be commanded to keep at distance with a place or person suspected to be infectious because of the pestilence; Neither could such a restraint be accounted any diminution of their just liberty, yea this were but a putting to of their sanction to the clear direction which the Lord lays upon His people, and therefore there could be no hazard to miscarry in it, especially where the application to such and such persons, might be as clearly discernable from the Word as the duty is.</p></blockquote>

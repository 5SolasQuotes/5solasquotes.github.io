<main class="wrap"><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands? 2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively. 3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>

<blockquote><p>For what synods determine, being the undeniable Word of God, is intrinsically infallible, and can never become fallible, though fallible and sinful men that are obnoxious [liable] to error and mistakes do hold it forth ministerially to others: and it is false that we are to believe that what synods determine according to the Word of God, we are to believe it is fallible and liable to error, and may [be] an untruth because they so determine; for then, when a synod determines [that] ‘there is but one true God,’ this principle of faith is believed to be subject to retraction and falsehood, because a synod has determined it to be a truth. But the truth is, we are to believe truths, determined by synods, to be infallible, and never again liable to retraction or discussion, because they are, and were in themselves and without any synodical determination, infallible, but not for this formal medium, because so says the synod, but because so says the Lord.</p></blockquote>

</figure><figure class="quote" id="q-27cd85be14" data-kw="">
<blockquote><p>The main body of the thesis explores the practice and experience of faith in the North East between 1560 and 1610 using three main themes. The first studies the Sabbath, the weekly fixture that was the heart of public worship and observance in the parish. Sacramental practice is the second theme with an in-depth study of the annual administration of Communion, which reinforced temporal and spiritual bonds among Kirk adherents and starkly exposed non-adherents and recusants. The final theme considers the role and position of ministers and readers in religious practice and investigates the relationship between them and their parishioners. From detailed analysis of these three themes, it is concluded that the North East as a whole was transformed into the general mould of Scottish Reformed Protestantism by 1610, but that there was a spectrum of practices and experiences of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catherine-mcmillan.html">Catherine McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Keeping the Kirk: The Practice &amp; Experience of Faith in Northeast Scotland</cite>, 1560-1610 (2016) PhD dissertation, Univ. of Edinburgh This has been published in book form. | Abstract:</span></figcaption>

ine</a></div>
</figure><figure class="quote" id="q-749ffbefe0" data-kw="">
<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer’ in Practical Religion</cite>, (Evangelical Press), pp. 97-98</span></figcaption>

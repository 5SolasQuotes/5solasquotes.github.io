<blockquote><p>When the most refined and civilized nations throw away all regard for religion, they become, as the history of our own age attests, the most ferocious of all mankind. Genuine civilization must commence with reformation of the heart; and nothing but true religion is capable of producing this effect.</p></blockquote>

<blockquote><p>§40.

II. It is greatly needful to the well-being of the ministry and the success that doctrine be kept sound: And therefore:

      1. That the Christian simplicity be retained, and many subtle and curious decisions be not made necessary: A few great, necessary certain truths are easilier preserved than multitudes of uncertain controverted niceties.

      2. It is needful that such as are ordained ministers, be tried men, of sound understanding in that which they must teach and do, and therefore that both the ordainers and the hearers try them. This account of their understanding is better than the imposing of human forms upon them for subscription: Not but that teachers should know more than the flock, that is, than the essentials; nor that I presume to condemn all the Churches that impose their confessions to be subscribed in their own and not in Scripture-words, while they keep only to necessary, certain things: But I shall afterward prove that this way, though tolerable, is not best, but unnecessary and dangerous: 1. The Scripture affording us apt words enough to form our confessions in, which are past controversy; 2. and there being no probability of bounding men’s impositions of this kind, when once they set upon this way; 3. and most confessions of that nature now extant, having some needless words which other Churches or good Christians do dissent from:

      4. And the ancient Creeds understood (which the ordainers must try) and the old catechistical verities being sufficient to this use.

      5. And there being means of restraining men from preaching and vending heresies which are more safe and congruous.

      3. I add therefore that a certain confession containing the certainest and needfulest integrals of religion should or may well be drawn up as a law, forbidding all upon meet penalties to preach or speak against them, without any subscribing, promising or professing.

      4. And upon proof of the violating of such a law, and preaching against such articles it is sufficient that both the Church and the Christian magistrate in their several ways may judge them and by just penalties correct them (of which more after in due place). For it is very hard so to form long confessions (beyond the old creeds, Lord’s Prayer, Decalogue, and the general belief of Scripture) and this not in Scripture-terms, which shall not have some words which sound and honest Ministers cannot assent to (without lying, which they will not do): But to silence many words which yet we conceive true, and forbear speaking against some things which yet he cannot profess assent to, there are very few sober men but will do. And an error never spoken or written hurts not others, nor is to be judged, being not known; Non apparere here is as non esse. And if it be vended, the person may be judged as well as if he had sworn, subscribed or promised. And they that will tell us yet what evil may befall secret whispering errors without such oaths, subscriptions or promises, do by this over-doing dangerously undo; and lest man should be man and the Church imperfect, on pretence of avoiding a possible unavoidable hurt, they will set up knaves that will say any thing, shut out honest men, and necessitate divisions, confusions and persecutions, where they can never stop on this side banishing or killing or continued imprisoning multitudes of faithful men, and never the more attain their ends. Sound doctrine may be kept up as far as is to be hoped by the aforesaid means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 222-23</span></figcaption>

<blockquote><p>Now we know that God (according to his promise to Abraham) hath an holy seed out of all Nations, which is the Catholic and Universal Church: if then the Church be Catholic and Universal, let our love and peace be also Catholic and Universal. And to this end our affections must be enlarged, and made capable of the whole world; for he that will love a Catholic Church with a Catholic love, must not have a narrow love contracted and confined to the measure of one City, Kingdom, or nation; but extended and enlarged to the measure of all Cities, Kingdoms, and Nations, even of the whole world.

It that which is to be loved be universal, the affection which loveth must not be partial: For if the love be but to a part, when it should be to the whole, this is not that Catholic love which belongs to the Catholic Church; and whatsoever title such men may take to themselves, they are not true, but counterfeit Catholics; for they have not that Catholic spirit of love which is in the true Catholic Church, and by which the Catholic Church doth love itself with a Catholic love. But such men by likelihood have a private spirit, by which they love a private part and faction, and are short of that universal spirit which loveth the universal Church with an universal love: for there is a private spirit of love as well as of faith; and it is that kind of spirit which Saint James mentioneth, a spirit that lusteth after envy, after Sects and divisions. But let us never rest until we get that Catholic spirit by which we may embrace the Catholic Church with a Catholic love; and then we may be assured we are not titular, but true and real Catholics.

Hereby we know that we are of the truth (saith Saint John) and we shall assure our hearts before God: And, We know that we have passed from death to life, because we love the brethren; even the brethren without exception and reservation: and he that dwelleth in this general and undeserved love, God, who is love, dwelleth in him, and he in God; And we know that we dwell in him and he in us, because he hath given us his spirit, even the spirit of this Catholic and Universal love. Let no man therefore say of another, He is of such a Nation with which my Nation is at enmity; or of such a Church which professeth some differences with the Church in which I live, and therefore I will by no means have love and peace with him; but remember, that in every Nation, he that feareth God and worketh righteousness is accepted of God: and therefore doe thou enquire, whether this spirit of fear and holiness be in him, which those that have are accepted of God: if he be accepted of God, take heed he be not rejected of thee: It were a madness in thee for God’s sake to hate one whom God loves, and for Christ’s sake to hate a member of Christ.

Indeed, if he be of a Church infected with errors, thou must be wary of him, that he infect thee not with those errors; but be also wary of not hating the Spirit of Christ in a member of Christ: It is an Apostolical, and so an undeniable Inference, If ye have put on the New-man, in which is neither Greek nor Jew, Circumcision nor Uncircumcision, Barbarian, Scythian, bond nor free, but Christ is all in all; Put on therefore (there is a binding force in this therefore) as the elect of God, holy and beloved, bowels of mercy, kindness, &amp;c. And above all these things, put on charity, which is the bond of perfectness; and let the peace of God rule in your hearts, to which ye are called in one body.

Let us then have love and peace with a believing Muscovite, Grecian, Aethiopian, Indian, if he be of that one body wherein Christ is all in all, and by the unity whereof we are called to love and peace; yea, from this universal peace and love may not be excluded any remnant according to the election of grace, pertaining to the body of Christ, though sojourning in the tents and territories of Rome: we may not hate the seven thousand that doe not bow their knees to Baal, though dispersed among seven millions of Idolaters; we may not hate Israel, though in bondage under Pharaoh.

But to the true Israel, even to the pure in heart, and those who in Christ Jesus are new creatures, and walk according to this rule, peace, and the prayers of peace, the true fruits of love doe belong, the divine Apostle being herein our guide and example. And while thus we enjoy and embrace this universal love with the universal body of Christ, great is our safety; for hereby we know and may assure our hearts, that we belong to that universal body, which alone loveth it selfe with this universal love. That is the truly Catholic Church, which indued with this Catholic love; that is a living Church, which is a loving Church: We therefore embracing and exercising this Catholic love, are of the Church truly Catholic; even of that Church, which being a Church of love, is also a Church of life.</p></blockquote>

Indeed, if he be of a Church infected with errors, thou must be wary of him, that he infect thee not with those errors; but be also wary of not hating the Spirit of Christ in a member of Christ: It is an Apostolical, and so an undeniable Inference, If ye have put on the New-man, in which is neither Greek nor Jew, Circumcision nor Uncircumcision, Barbarian, Scythian, bond nor free, but Christ is all in all; Put on therefore (there is a binding force in this therefore) as the elect of God, holy and beloved, bowels of mercy, kindness, &amp;c. And above all these things, put on charity, which is the bond of perfectness; and let the peace of God rule in your hearts, to which ye are called in one body.

Let us then have love and peace with a believing Muscovite, Grecian, Aethiopian, Indian, if he be of that one body wherein Christ is all in all, and by the unity whereof we are called to love and peace; yea, from this universal peace and love may not be excluded any remnant according to the election of grace, pertaining to the body of Christ, though sojourning in the tents and territories of Rome: we may not hate the seven thousand that doe not bow their knees to Baal, though dispersed among seven millions of Idolaters; we may not hate Israel, though in bondage under Pharaoh.

But to the true Israel, even to the pure in heart, and those who in Christ Jesus are new creatures, and walk according to this rule, peace, and the prayers of peace, the true fruits of love doe belong, the divine Apostle being herein our guide and example. And while thus we enjoy and embrace this universal love with the universal body of Christ, great is our safety; for hereby we know and may assure our hearts, that we belong to that universal body, which alone loveth it selfe with this universal love. That is the truly Catholic Church, which indued with this Catholic love; that is a living Church, which is a loving Church: We therefore embracing and exercising this Catholic love, are of the Church truly Catholic; even of that Church, which being a Church of love, is also a Church of life.”

— Francis Rous, The balm of love: To heal divisions, and the wounds made by them, and to make the body of Christ whole and entire for its own beauty, strength, and safety. Partly presented in a former discourse, when it might have prevented, and now after many evils for want of prevention re-enforced in a second, (London: John Wright, 1648), pp 6-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+we+know+that+God+%28according+to+his+promise+to+Abraham%29+hath+an+holy+seed+out+of+all+Nations%2C+which+is+the+Catholic+and+Universal+Church%3A+if+then+the+Church+be+Catholic+and+Universal%2C+let+our+love+and+peace+be+also+Catholic+and+Universal.+And+to+this+end+our+affections+must+be+enlarged%2C+and+made+capable+of+the+whole+world%3B+for+he+that+will+love+a+Catholic+Church+with+a+Catholic+love%2C+must+not+have+a+narrow+love+contracted+and+confined+to+the+measure+of+one+City%2C+Kingdom%2C+or+nation%3B+but+extended+and+enlarged+to+the+measure+of+all+Cities%2C+Kingdoms%2C+and+Nations%2C+even+of+the+whole+world.%0A%0AIt+that+which+is+to+be+loved+be+universal%2C+the+affection+which+loveth+must+not+be+partial%3A+For+if+the+love+be+but+to+a+part%2C+when+it+should+be+to+the+whole%2C+this+is+not+that+Catholic+love+which+belongs+to+the+Catholic+Church%3B+and+whatsoever+title+such+men+may+take+to+themselves%2C+they+are+not+true%2C+but+counterfeit+Catholics%3B+for+they+have+not+that+Catholic+spirit+of+love+which+is+in+the+true+Catholic+Church%2C+and+by+which+the+Catholic+Church+doth+love+itself+with+a+Catholic+love.+But+such+men+by+likelihood+have+a+private+spirit%2C+by+which+they+love+a+private+part+and+faction%2C+and+are+short+of+that+universal+spirit+which+loveth+the+universal+Church+with+an+universal+love%3A+for+there+is+a+private+spirit+of+love+as+well+as+of+faith%3B+and+it+is+that+kind+of+spirit+which+Saint+James+mentioneth%2C+a+spirit+that+lusteth+after+envy%2C+after+Sects+and+divisions.+But+let+us+never+rest+until+we+get+that+Catholic+spirit+by+which+we+may+embrace+the+Catholic+Church+with+a+Catholic+love%3B+and+then+we+may+be+assured+we+are+not+titular%2C+but+true+and+real+Catholics.%0A%0AHereby+we+know+that+we+are+of+the+truth+%28saith+Saint+John%29+and+we+shall+assure+our+hearts+before+God%3A+And%2C+We+know+that+we+have+passed+from+death+to+life%2C+because+we+love+the+brethren%3B+even+the+brethren+without+exception+and+reservation%3A+and+he+that+dwelleth+in+this+general+and+undeserved+love%2C+God%2C+who+is+love%2C+dwelleth+in+him%2C+and+he+in+God%3B+And+we+know+that+we+dwell+in+him+and+he+in+us%2C+because+he+hath+given+us+his+spirit%2C+even+the+spirit+of+this+Catholic+and+Universal+love.+Let+no+man+therefore+say+of+another%2C+He+is+of+such+a+Nation+with+which+my+Nation+is+at+enmity%3B+or+of+such+a+Church+which+professeth+some+differences+with+the+Church+in+which+I+live%2C+and+therefore+I+will+by+no+means+have+love+and+peace+with+him%3B+but+remember%2C+that+in+every+Nation%2C+he+that+feareth+God+and+worketh+righteousness+is+accepted+of+God%3A+and+therefore+doe+thou+enquire%2C+whether+this+spirit+of+fear+and+holiness+be+in+him%2C+which+those+that+have+are+accepted+of+God%3A+if+he+be+accepted+of+God%2C+take+heed+he+be+not+rejected+of+thee%3A+It+were+a+madness+in+thee+for+God%E2%80%99s+sake+to+hate+one+whom+God+loves%2C+and+for+Christ%E2%80%99s+sake+to+hate+a+member+of+Christ.%0A%0AIndeed%2C+if+he+be+of+a+Church+infected+with+errors%2C+thou+must+be+wary+of+him%2C+that+he+infect+thee+not+with+those+errors%3B+but+be+also+wary+of+not+hating+the+Spirit+of+Christ+in+a+member+of+Christ%3A+It+is+an+Apostolical%2C+and+so+an+undeniable+Inference%2C+If+ye+have+put+on+the+New-man%2C+in+which+is+neither+Greek+nor+Jew%2C+Circumcision+nor+Uncircumcision%2C+Barbarian%2C+Scythian%2C+bond+nor+free%2C+but+Christ+is+all+in+all%3B+Put+on+therefore+%28there+is+a+binding+force+in+this+therefore%29+as+the+elect+of+God%2C+holy+and+beloved%2C+bowels+of+mercy%2C+kindness%2C+%26c.+And+above+all+these+things%2C+put+on+charity%2C+which+is+the+bond+of+perfectness%3B+and+let+the+peace+of+God+rule+in+your+hearts%2C+to+which+ye+are+called+in+one+body.%0A%0ALet+us+then+have+love+and+peace+with+a+believing+Muscovite%2C+Grecian%2C+Aethiopian%2C+Indian%2C+if+he+be+of+that+one+body+wherein+Christ+is+all+in+all%2C+and+by+the+unity+whereof+we+are+called+to+love+and+peace%3B+yea%2C+from+this+universal+peace+and+love+may+not+be+excluded+any+remnant+according+to+the+election+of+grace%2C+pertaining+to+the+body+of+Christ%2C+though+sojourning+in+the+tents+and+territories+of+Rome%3A+we+may+not+hate+the+seven+thousand+that+doe+not+bow+their+knees+to+Baal%2C+though+dispersed+among+seven+millions+of+Idolaters%3B+we+may+not+hate+Israel%2C+though+in+bondage+under+Pharaoh.%0A%0ABut+to+the+true+Israel%2C+even+to+the+pure+in+heart%2C+and+those+who+in+Christ+Jesus+are+new+creatures%2C+and+walk+according+to+this+rule%2C+peace%2C+and+the+prayers+of+peace%2C+the+true+fruits+of+love+doe+belong%2C+the+divine+Apostle+being+herein+our+guide+and+example.+And+while+thus+we+enjoy+and+embrace+this+universal+love+with+the+universal+body+of+Christ%2C+great+is+our+safety%3B+for+hereby+we+know+and+may+assure+our+hearts%2C+that+we+belong+to+that+universal+body%2C+which+alone+loveth+it+selfe+with+this+universal+love.+That+is+the+truly+Catholic+Church%2C+which+indued+with+this+Catholic+love%3B+that+is+a+living+Church%2C+which+is+a+loving+Church%3A+We+therefore+embracing+and+exercising+this+Catholic+love%2C+are+of+the+Church+truly+Catholic%3B+even+of+that+Church%2C+which+being+a+Church+of+love%2C+is+also+a+Church+of+life.%E2%80%9D%0A%0A%E2%80%94+Francis+Rous%2C+The+balm+of+love%3A+To+heal+divisions%2C+and+the+wounds+made+by+them%2C+and+to+make+the+body+of+Christ+whole+and+entire+for+its+own+beauty%2C+strength%2C+and+safety.+Partly+presented+in+a+former+discourse%2C+when+it+might+have+prevented%2C+and+now+after+many+evils+for+want+of+prevention+re-enforced+in+a+second%2C+%28London%3A+John+Wright%2C+1648%29%2C+pp+6-9.&amp;url=https%3A%2F%2F5

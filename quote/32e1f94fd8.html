<main class="wrap"><figure class="quote" id="q-32e1f94fd8" data-kw="">
<blockquote><p>Secondly, it is evident from the distribution of the Scripture; for it is divided into the Law and the Gospel: but justification is not sought or contained in the doctrine of the Law. Not in that part which prescribes obedience and promises a recompence to those fulfilling its commands; because the conscience of every one witnesses, that we cannot be justified by the legal covenant. Much less in that other part which contains the threats and punishments due to those who violate the law; because this doctrine affords not the hope of salvation, but inspires the dread of hell. It remains, therefore, that justification be sought in the Gospel, i. e. in the promises of grace; and the act of faith, as far as it justifies, should be especially directed to these promises. …

For the divine word is not adapted in every part to produce hope; nay the law serves to arouse fear. Hope, therefore, arises, not from the preaching of the legal covenant. This do and thou shalt live; but from the promulgation of the evangelical covenant, Believe, and thou shalt be saved. Well spake Tertullian, advers. Marc. iii. cap. 16, The possession of eternal life comes not to us through the discipline of the law, but through the grace of the Gospel. As the possession is through grace, not through the law, so the hope of the possession is excited through the preaching of the grace of the gospel, not of the doctrine of the law. They who expect eternal life from the covenant of works, do not hope, but presume. But it has been shewn before by us, that the proper object of faith and hope, is, not all those things in general which are delivered in the word, but the promises of grace …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 63, 86.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b17eeb2b3" data-kw="">
<blockquote><p>Q. 36 What is the difference between the law and the gospel?

A. The law contains the covenant of nature established by God with man in creation; that means, it is known by man from nature, it requires perfect obedience of us to God, and it promises eternal life to those who keep it but threatens eternal punishment to those who do not.

The gospel, however, contains the covenant of grace; that means, although it exists, it is not known at all from nature; it shows us Christ’s fulfilment of that righteousness which the law requires, and its restoration in us through Christ’s Spirit; and it promises eternal life freely on account of Christ to those who believe in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-7ba75fe427" data-kw="">
<blockquote><p>But this communication of the subsistence of the second Person unto the humanity is not (as [Robert] Baron,Philosophia. Theol. Ancil., Article 12, and after him Mr. Barlow in the forementioned place, very excellently show) by way of real inhesion, or denomination, but only by way of sustentation: And this is no advantage unto the Lutherans’ communication of divine properties. Look as when a subject does communicate itself unto its accidents by way of support, it does not hereupon follow that it inheres in them, or does denominate them. So though the person of the Son do assume, receive, and sustain the humanity of Christ, yet it does not hereupon follow that the subsistence of the Son is formally in the manhood, or that the manhood is a person, as is proved at large by those two mentioned authors.</p></blockquote>

</figure><figure class="quote" id="q-335170807d" data-kw="">
<blockquote><p>Reply to Objection 3: …Yet we must bear in mind that not every individual in the genus of substance, even in rational nature, is a person, but that alone which exists by itself, and not that which exists in some more perfect thing. Hence the hand of Socrates, although it is a kind of individual, is not a person, because it does not exist by itself, but in something more perfect, viz. in the whole [of Socates, who has a suppositum]. And hence, too, this is signified by a ‘person’ being defined as ‘an individual substance,’ for the hand is not a complete substance, but part of a substance. Therefore, although this human nature is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 2, ‘Whether the union of the Incarnate Word took place in the Person?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-d69043c73c" data-kw="">
<blockquote><p>The humanity taken up into the personality of the Logos is, then, not a personal man but human nature without personal subsistence, yet thought of in its full spirit-body essentiality and individuality. This is why in the incarnation of the Logos it was not a new third thing that arose by the union of the divine and human natures. It was the human finite mode of being that was added to the eternal and infinite mode of being of the Logos, by the human nature being taken up into His personal subsistence. The Logos thus exists alike without and within the humanity of Christ. The Logos is still pre-existent, the Trinity is still complete. Christ’s human nature had hypostatic subsistence only by its being taken up into the hypostasis of the Logos. …For the truth of the human nature is to be measured ‘by its matter, form and essential attributes’, and not ‘by its personality’. Christ’s humanity is therefore to be regarded as a man not suppositaliter but specifically.–Maresius (IX, 23) expresses himself in exactly similar terms. Hence Christ’s humanity is of course an individuum, an exposition of human nature in individual form. It has real existence only in the person of the Logos, not in itself.–Zanchius (De incarnat. Filii Dei, p. 152ff.): ‘As a most perfect entity existent per se [through itself] the person of the Son of God drew to itself a rather imperfect entity, lacking any subsistence of its own to make it self-existent.’ The moment therefore ‘the Son of God assumed a true body with a true human soul, together with all the essential and natural attributes of both, and the defects as well, he is not therefore to be said to have assumed either a persona or an huphistamenon [a susbsisting person], but–a nature en atomo, i.e. existing in a fixed individuum, which however has never existed anywhere of itself except in the assumer.’ [so Zanchi] Keckermann 315: ‘(Christ’s human nature is) an individuum distinct from the divine nature, though not a distinct person. Concerning this thought we must first of all think accurately that person differs from nature, and so an individuum from a person, yet so that the human nature is not a person, but is meanwhile an individuum, or as the Logicians say, a first substance. But some one may say: Every substantial individuum subsists per se; if therefore considered by itself Christ’s human nature is an individuum, it therefore subsists per se. Answer: Subsistence per se is sometimes opposed to what subsists in something else, and so human nature generally subsists per se, because it is a substance and not an accident, the property of which is to exist in something else. But if subsistence per se means the same as separate subsistence, outside the union and support of a second things, then it is false to say that the human nature subsists per se. It is sustained by the Logos to which it is united, so that apart from it it could not exist for a moment.’ So it must be said (Alsted 517) that: ‘He assumed not a person but a nature, and it considered as an individuum. The reason for the former statement is that Christ’s human nature never subsisted per se but has always been an instrument enupostaton en to logo.’ So the Incarnation is not to be regarded as though by union of two different essences a new third one had arisen, but in such wise that the human mode of being was added to the eternal mode of the Logos by the assumption of the human nature into its personality without altering the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, (Wipf &amp; Stock), ‘The Mediator of the Covenant of Grace’, section 7, pp. 416-18. Heppe was in the 1800’s.</span></figcaption>

herefore+to+be+said+to+have+assumed+either+a+persona+or+an+huphistamenon+%5Ba+susbsisting+person%5D%2C+but%E2%80%93a+nature+en+atomo%2C+i.e.+existing+in+a+fixed+individuum%2C+which+however+has+never+existed+anywhere+of+itself+except+in+the+assumer.%E2%80%99+%5Bso+Zanchi%5D+Keckermann+315%3A+%E2%80%98%28Christ%E2%80%99s+human+nature+is%29+an+individuum+distinct+from+the+divine+nature%2C+though+not+a+distinct+person.+Concerning+this+thought+we+must+first+of+all+think+accurately+that+person+differs+from+nature%2C+and+so+an+individuum+from+a+person%2C+yet+so+that+the+human+nature+is+not+a+person%2C+but+is+meanwhile+an+individuum%2C+or+as+the+Logicians+say%2C+a+first+substance.+But+some+one+may+say%3A+Every+substantial+individuum+subsists+per+se%3B+if+therefore+considered+by+itself+Christ%E2%80%99s+human+nature+is+an+individuum%2C+it+therefore+subsists+per+se.+Answer%3A+Subsistence+per+se+is+sometimes+opposed+to+what+subsists+in+something+else%2C+and+so+human+nature+generally+subsists+per+se%2C+because+it+is+a+substance+and+not+an+accident%2C+the+property+of+which+is+to+exist+in+something+else.+But+if+subsistence+per+se+means+the+same+as+separate+subsistence%2C+outside+the+union+and+support+of+a+second+things%2C+then+it+is+false+to+say+that+the+human+nature+subsists+per+se.+It+is+sustained+by+the+Logos+to+which+it+is+united%2C+so+that+apart+from+it+it+could+not+exist+for+a+moment.%E2%80%99+So+it+must+be+said+%28Alsted+517%29+that%3A+%E2%80%98He+assumed+not+a+person+but+a+nature%2C+and+it+considered+as+an+individuum.+The+reason+for+the+former+statement+is+that+Christ%E2%80%99s+human+nature+never+subsisted+per+se+but+has+always+been+an+instrument+enupostaton+en+to+logo.%E2%80%99+So+the+Incarnation+is+not+to+be+regarded+as+though+by+union+of+two+different+essences+a+new+third+one+had+arisen%2C+but+in+such+wise+that+the+human+mode+of+being+was+added+to+the+eternal+mode+of+the+Logos+by+the+assumption+of+the+human+nature+into+its+personality+without+altering+the+latter.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Heppe%2C+Reformed+Dogmatics+%28Wipf+%26+Stock%29%2C+%E2%80%98The+Mediator+of+the+Covenant+of+Grace%E2%80%99%2C+section+7%2C+pp.+416-18.+Heppe+was+in+the+1800%E2%80%99s.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd69043c73c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d69043c73c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=The%20humanity%20taken%20up%20into%20the,its%20personality%20without%20altering%20the%20latter&amp;text=The%20humanity%20taken%20up%20into%20the%20personality%20of&amp;text=nature%20into%20its%20personality%20without%20altering%20the%20latter" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>9. In Christ, the person must be distinguished from the enhypostatic adjunct. Person is only the divine nature. For one should not think that the person of Christ is a kind of conflation of human and divine nature – as if the person was composed out of parts. But because the divine nature, which assumed the human nature into the divine personality, is alone person, human nature is an enhypostatic adjunct.</p></blockquote>

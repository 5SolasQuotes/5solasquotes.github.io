<blockquote><p>If anyone comes to you and does not bring this doctrine, do not receive him into your house, nor say greeting to him,” etc. Since therefore from apostolic tradition it is clear that certain persons who differ in doctrine are altogether to be rejected and avoided, and again that certain others are to be received and held in the place of brothers, one must consider what diversity of doctrine breaks the Christian bond of peace, and what does not. This Paul, as in all things, teaches excellently. For in the First [Letter] to Timothy, chapter 1, after he had commanded him to warn certain persons not to follow a different doctrine which gave no edification [1 Tim. 1:3-4], he immediately added: “Now the end of the commandment is love from a pure heart, a good conscience, and unfeigned faith.” [v. 5] By which he taught plainly enough wherein the approved and genuine doctrine of our religion is to be placed and recognized—namely, in love that is alien to fraud in conscience and to deceit in faith, which love is altogether inimitable by all destitute of the Spirit of Christ. Therefore, whoever displays this love in such manner that his life does not disprove it is clearly to be regarded as a member of Christ, whatever errors he may be subject to, and is worthy of being cherished by the duties of Christian brotherhood. Thus in chapter 6, after he had set forth the doctrines of faith in Christ along with the commands of genuine love, he wrote in this manner: “These things teach and exhort…” [v. 2] How then will these people justify their judgment before Him who commanded these things through Paul—these people who dare immediately to hand over to Satan, and, as far as lies in them, to cast out of the kingdom of God, men who are truly good, who knowingly resist no sound doctrine, who listen with ready minds to every admonition in which the Spirit of God breathes and his Word is expressed—men who reject only a few things, and these of no great moment, which they cannot yet recognize as having proceeded from God? . Peter Martyr Vermigli Latin On 1 Corinthians, ch. 10, verse 11 It is a pitiable thing that, although we have so many clear and open statements in the sacred writings concerning faith, hope, love, and the duties of the other virtues—things in which there is nothing obscure—we altogether leave these neglected, and wish, with such great superstition, to pursue matters which are uncertain and contribute less to salvation. This the Devil is intent upon: that men should labor strenuously in endless and useless questions, while casting aside those things which are necessary to be kept. . King James I of Great Britain as reported by Isaac Casaubon, Epistle 710, to Cardinal Perron Latin But the King judges it to be most truly written, in the explanation of [the Greek phrase] “the things simply necessary,” that the number of things absolutely necessary for salvation is not great. Therefore His Majesty considers that there will be no shorter way to enter into concord than if the necessary things are carefully separated from the non-necessary, and that every effort be expended so that agreement may be reached concerning the necessary; in the non-necessary, room should be given to Christian liberty. The King calls those things “simply necessary” which either the Word of God expressly commands to be believed or done, or which the ancient Church drew out from the Word of God by necessary consequence. But the things which, apart from the Word of God, have been received into the use of the Church by human institution—although piously and prudently, according to the circumstances of the time—His Majesty considers can be changed, softened, or antiquated; and what Pius II said concerning clerical celibacy, that although it had once been rightly enacted, it would now be better abolished, the King believes that this, in general, may be applied to most ecclesiastical observances introduced apart from the Word of God. If, for deciding the controversies of the present day, this distinction were applied, and divine law were candidly separated from positive law, it appears that there would not be, among pious and moderate men, a long or bitter contention concerning those things which are absolutely necessary. For these things are few, as we just said, and are approved almost equally by all who claim to be called Christians. And the Most Serene King considers this distinction to be of such great weight for diminishing the controversies which today so greatly trouble the Church of God, that he judges it the duty of all who are devoted to peace to explain, teach, and press this distinction with the utmost diligence. . Francis Junius Latin Eirenicum, pt. 2, on Psalm 133 Therefore I can hardly express my astonishment at the audacity—or rather the madness—of those men who esteem so lightly this right of kinship, established by God Himself, founded upon divine power and constituted by means that are altogether divine, that they judge others not to be their brothers; or even if, in general terms, they acknowledge that we are brothers to one another, yet when it comes to particulars—this or that individual, this or that church—they think that such a person or such a church has nothing at all in common with them in respect of fellowship and brotherhood. But now—good God—what do I hear? A man cannot abolish the obligation of nature; nor can one man, by any private or individual act of his own, remove a human bond of kinship. And shall that bond which the divine institution of grace has established be dissolved at the will of man? O pitiable madness! Whoever allows himself to be carried away into such a state must, of necessity, already have torn himself away from God and from Christ before he can, even in thought, tear another away. For who hates his own flesh? What member devotes its efforts to mutilating its own body? He is no longer of the body of Christ who plans to cut off a member of Christ. And yet this disease (if I may speak so) is epidemic in our age: in which we are, nearly all of us, most daring in noticing, weighing, judging, condemning and exploding the deeds of our brethren, and in insolently deposing them; nor do we hesitate to assail men, churches, whole regions and authorities appointed by God with curses and anathemas, as though by some sovereign right—merely because they do not agree with us in all things, although they hold the mind of Christ. Our union remains, my brother, it remains; but the estrangement is yours (for which I feel pity). If you are willing to estrange yourself from me, you cannot avoid first estranging yourself from Christ, in whom we are brothers. I neither will nor can do this; for Christ has joined me to Himself as a brother, and has made me a brother to you. If you break the bond of brotherhood, I shall knit it again; if you unsew it, I shall labor to mend it; if you overturn it, I shall raise it anew; if you deny it, Christ affirms it—and I with Christ. If you will not listen, yet good men hear, and the Lord hears, before whom I grieve from the heart over your powerlessness. Led by mercy, I shall bear whatever I cannot cure; but in bearing it, I shall carefully maintain these two things: first, that I steadfastly await from the Lord the healing of this wretched infirmity of yours; second, that I myself watch for just opportunities to assist you in love and to lift you up again, if perchance God may at some time be pleased to use this my endeavor for your salvation. For why should we not bear with those who are disturbed in mind—even in matters of religion—just as readily as we bear with those whom anger, hatred or other such passions have driven out of the state of a sound mind? If such things arise among brothers, they are nonetheless brothers, and do not cease to be such. I shall therefore act unjustly if, because you deny that you are my brother, or deny the duty of a brother, I fall into the same fault. I am unwilling to heap my own wrongdoing upon your folly; but whatever wisdom I have received from the Lord, that I intend to preserve unimpaired, and by duty to procure your restoration—or at least, if nothing else, to testify before God and men to the obligation which is mine. What then do we suppose, poor wretches that we are? What do we imagine, when with such loftiness of brow we thrust one another out, as with a pitchfork, and apply a kind of censor’s rod indiscriminately to these and to those, as though we alone possessed the nose for judgment, or as though Christ had transferred to us this faculty, to be abused according to the caprice of our own spirits? Let such things indeed be done by the grooms of Satan; but it is not fitting for the sheep of Christ—least of all for pastors. Rather, let us yield to Christ, who most graciously admits both us and them into the communion of His body and Spirit. . David Pareus Latin Irenicum ch. 4 The first question will be: Which articles are fundamental, that is, in which heads of faith does the foundation of salvation truly consist? Here there must prudently be distinguished the articles of the catholic faith—which no Christian of adult age, whether learned or unlearned, may, without loss of salvation, either be ignorant of or fail to believe—from other questions that come into controversy among some theologians because of differing understandings of some particular passage of Scripture; and also from scholastic or ecclesiastical conclusions, the knowledge and assent of which, one way or the other, are indeed necessary for theologians for the sake of the scientific character of their theological profession, and for transmitting or defending a fuller knowledge of divine matters, but which can be unknown by Christians in general without danger to salvation. For most of these either do not touch fundamental articles directly, or not even indirectly; rather, they are such that they will not benefit those who know them, if they do not possess true faith in Christ, nor will they harm those who are ignorant of them, if they truly believe in Christ. For I would venture to affirm that the greater part of both the ancient heresies and the present dissensions in the Church has arisen, and still arises, chiefly from this: that councils, bishops, and doctors of the Church, without any distinction, have put forth whatever doctrines of the schools and whatever opinions of the chairs as articles of the catholic faith, and have imposed them upon consciences as to be believed with the same necessity for salvation; and that from every discrepancy in the interpretation of the Scriptures they have far too easily fashioned heresies or schisms. . ch. 29 A foundation, properly speaking, is that which is laid in the lowest place beneath for the support of a building, and without which the house cannot stand. Thus the foundation of our faith and salvation will be that which all Christians must strictly believe as necessary for salvation, and without faith in which none obtain salvation. This foundation, in one word, is Jesus Christ, according to the apostle, etc. But the foundation of the prophets and apostles is the sum of the doctrine of the prophets and apostles, etc. In the Church the “elements of the Christian faith,” containing the sum of the Law and the Gospel, are accustomed to be so called; and all these appear able to be reduced to four heads: The first head is the Decalogue, etc. The second is the Apostles’ Creed, etc. The third is the Lord’s Prayer, etc. The fourth, finally, is concerning the sacraments, etc. In these heads, in our judgment indeed—if one should speak popularly—the foundation of the Christian faith and salvation, taken in the widest sense, consists. For he who shall have held these by faith and shall have practiced them will undoubtedly be saved, although he may be ignorant of the remaining debates of the theologians… Yet in these very heads we have freely conceded that some distinction may exist. For some things are more or less necessary to salvation than others. . Georg Calixtus Latin Of the Judge of Theological Controversies, sect. 1 &amp; 3 Let it be far from us, therefore, to hate, avoid or abhor any Christian who has not ceased to be a Christian, who has not ceased to be a son of God, and therefore is our brother, and together with us a member of the body of Christ and a co-heir of eternal salvation. Far be it, I say, that we should abominate the fellowship of anyone whom Christ has received into communion. Far be it that to him to whom He will say, “Come, blessed of my Father,” we should say, “Depart, cursed Satan…</p></blockquote>

t+agreement+may+be+reached+concerning+the+necessary%3B+in+the+non-necessary%2C+room+should+be+given+to+Christian+liberty.+The+King+calls+those+things+%E2%80%9Csimply+necessary%E2%80%9D+which+either+the+Word+of+God+expressly+commands+to+be+believed+or+done%2C+or+which+the+ancient+Church+drew+out+from+the+Word+of+God+by+necessary+consequence.+But+the+things+which%2C+apart+from+the+Word+of+God%2C+have+been+received+into+the+use+of+the+Church+by+human+institution%E2%80%94although+piously+and+prudently%2C+according+to+the+circumstances+of+the+time%E2%80%94His+Majesty+considers+can+be+changed%2C+softened%2C+or+antiquated%3B+and+what+Pius+II+said+concerning+clerical+celibacy%2C+that+although+it+had+once+been+rightly+enacted%2C+it+would+now+be+better+abolished%2C+the+King+believes+that+this%2C+in+general%2C+may+be+applied+to+most+ecclesiastical+observances+introduced+apart+from+the+Word+of+God.+If%2C+for+deciding+the+controversies+of+the+present+day%2C+this+distinction+were+applied%2C+and+divine+law+were+candidly+separated+from+positive+law%2C+it+appears+that+there+would+not+be%2C+among+pious+and+moderate+men%2C+a+long+or+bitter+contention+concerning+those+things+which+are+absolutely+necessary.+For+these+things+are+few%2C+as+we+just+said%2C+and+are+approved+almost+equally+by+all+who+claim+to+be+called+Christians.+And+the+Most+Serene+King+considers+this+distinction+to+be+of+such+great+weight+for+diminishing+the+controversies+which+today+so+greatly+trouble+the+Church+of+God%2C+that+he+judges+it+the+duty+of+all+who+are+devoted+to+peace+to+explain%2C+teach%2C+and+press+this+distinction+with+the+utmost+diligence.+.+Francis+Junius+Latin+Eirenicum%2C+pt.+2%2C+on+Psalm+133+Therefore+I+can+hardly+express+my+astonishment+at+the+audacity%E2%80%94or+rather+the+madness%E2%80%94of+those+men+who+esteem+so+lightly+this+right+of+kinship%2C+established+by+God+Himself%2C+founded+upon+divine+power+and+constituted+by+means+that+are+altogether+divine%2C+that+they+judge+others+not+to+be+their+brothers%3B+or+even+if%2C+in+general+terms%2C+they+acknowledge+that+we+are+brothers+to+one+another%2C+yet+when+it+comes+to+particulars%E2%80%94this+or+that+individual%2C+this+or+that+church%E2%80%94they+think+that+such+a+person+or+such+a+church+has+nothing+at+all+in+common+with+them+in+respect+of+fellowship+and+brotherhood.+But+now%E2%80%94good+God%E2%80%94what+do+I+hear%3F+A+man+cannot+abolish+the+obligation+of+nature%3B+nor+can+one+man%2C+by+any+private+or+individual+act+of+his+own%2C+remove+a+human+bond+of+kinship.+And+shall+that+bond+which+the+divine+institution+of+grace+has+established+be+dissolved+at+the+will+of+man%3F+O+pitiable+madness%21+Whoever+allows+himself+to+be+carried+away+into+such+a+state+must%2C+of+necessity%2C+already+have+torn+himself+away+from+God+and+from+Christ+before+he+can%2C+even+in+thought%2C+tear+another+away.+For+who+hates+his+own+flesh%3F+What+member+devotes+its+efforts+to+mutilating+its+own+body%3F+He+is+no+longer+of+the+body+of+Christ+who+plans+to+cut+off+a+member+of+Christ.+And+yet+this+disease+%28if+I+may+speak+so%29+is+epidemic+in+our+age%3A+in+which+we+are%2C+nearly+all+of+us%2C+most+daring+in+noticing%2C+weighing%2C+judging%2C+condemning+and+exploding+the+deeds+of+our+brethren%2C+and+in+insolently+deposing+them%3B+nor+do+we+hesitate+to+assail+men%2C+churches%2C+whole+regions+and+authorities+appointed+by+God+with+curses+and+anathemas%2C+as+though+by+some+sovereign+right%E2%80%94merely+because+they+do+not+agree+with+us+in+all+things%2C+although+they+hold+the+mind+of+Christ.+Our+union+remains%2C+my+brother%2C+it+remains%3B+but+the+estrangement+is+yours+%28for+which+I+feel+pity%29.+If+you+are+willing+to+estrange+yourself+from+me%2C+you+cannot+avoid+first+estranging+yourself+from+Christ%2C+in+whom+we+are+brothers.+I+neither+will+nor+can+do+this%3B+for+Christ+has+joined+me+to+Himself+as+a+brother%2C+and+has+made+me+a+brother+to+you.+If+you+break+the+bond+of+brotherhood%2C+I+shall+knit+it+again%3B+if+you+unsew+it%2C+I+shall+labor+to+mend+it%3B+if+you+overturn+it%2C+I+shall+raise+it+anew%3B+if+you+deny+it%2C+Christ+affirms+it%E2%80%94and+I+with+Christ.+If+you+will+not+listen%2C+yet+good+men+hear%2C+and+the+Lord+hears%2C+before+whom+I+grieve+from+the+heart+over+your+powerlessness.+Led+by+mercy%2C+I+shall+bear+whatever+I+cannot+cure%3B+but+in+bearing+it%2C+I+shall+carefully+maintain+these+two+things%3A+first%2C+that+I+steadfastly+await+from+the+Lord+the+healing+of+this+wretched+infirmity+of+yours%3B+second%2C+that+I+myself+watch+for+just+opportunities+to+assist+you+in+love+and+to+lift+you+up+again%2C+if+perchance+God+may+at+some+time+be+pleased+to+use+this+my+endeavor+for+your+salvation.+For+why+should+we+not+bear+with+those+who+are+disturbed+in+mind%E2%80%94even+in+matters+of+religion%E2%80%94just+as+readily+as+we+bear+with+those+whom+anger%2C+hatred+or+other+such+passions+have+driven+out+of+the+state+of+a+sound+mind%3F+If+such+things+arise+among+brothers%2C+they+are+nonetheless+brothers%2C+and+do+not+cease+to+be+such.+I+shall+therefore+act+unjustly+if%2C+because+you+deny+that+you+are+my+brother%2C+or+deny+the+duty+of+a+brother%2C+I+fall+into+the+same+fault.+I+am+unwilling+to+heap+my+own+wrongdoing+upon+your+folly%3B+but+whatever+wisdom+I+have+received+from+the+Lord%2C+that+I+intend+to+preserve+unimpaired%2C+and+by+duty+to+procure+your+restoration%E2%80%94or+at+least%2C+if+nothing+else%2C+to+testify+before+God+and+men+to+the+obligation+which+is+mine.+What+then+do+we+suppose%2C+poor+wretches+that+we+are%3F+What+do+we+imagine%2C+when+with+such+loftiness+of+brow+we+thrust+one+another+out%2C+as+with+a+pitchfork%2C+and+apply+a+kind+of+censor%E2%80%99s+rod+indiscriminately+to+these+and+to+those%2C+as+though+we+alone+possessed+the+nose+for+judgment%2C+or+as+though+Christ+had+transferred+to+us+this+faculty%2C+to+be+abused+according+to+the+caprice+of+our+own+spirits%3F+Let+such+things+indeed+be+done+by+the+grooms+of+Satan%3B+but+it+is+not+fitting+for+the+sheep+of+Christ%E2%80%94least+of+all+for+pastors.+Rather%2C+let+us+yield+to+Christ%2C+who+most+graciously+admits+both+us+and+them+into+the+communion+of+His+body+and+Spirit.+.+David+Pareus+Latin+Irenicum+ch.+4+The+first+question+will+be%3A+Which+articles+are+fundamental%2C+that+is%2C+in+which+heads+of+faith+does+the+foundation+of+salvation+truly+consist%3F+Here+there+must+prudently+be+distinguished+the+articles+of+the+catholic+faith%E2%80%94which+no+Christian+of+adult+age%2C+whether+learned+or+unlearned%2C+may%2C+without+loss+of+salvation%2C+either+be+ignorant+of+or+fail+to+believe%E2%80%94from+other+questions+that+come+into+controversy+among+some+theologians+because+of+differing+understandings+of+some+particular+passage+of+Scripture%3B+and+also+from+scholastic+or+ecclesiastical+conclusions%2C+the+knowledge+and+assent+of+which%2C+one+way+or+the+other%2C+are+indeed+necessary+for+theologians+for+the+sake+of+the+scientific+character+of+their+theological+profession%2C+and+for+transmitting+or+defending+a+fuller+knowledge+of+divine+matters%2C+but+which+can+be+unknown+by+Christians+in+general+without+danger+to+salvation.+For+most+of+these+either+do+not+touch+fundamental+articles+directly%2C+or+not+even+indirectly%3B+rather%2C+they+are+such+that+they+will+not+benefit+those+who+know+them%2C+if+they+do+not+possess+true+faith+in+Christ%2C+nor+will+they+harm+those+who+are+ignorant+of+them%2C+if+they+truly+believe+in+Christ.+For+I+would+venture+to+affirm+that+the+greater+part+of+both+the+ancient+heresies+and+the+present+dissensions+in+the+Church+has+arisen%2C+and+still+arises%2C+chiefly+from+this%3A+that+councils%2C+bishops%2C+and+doctors+of+the+Church%2C+without+any+distinction%2C+have+put+forth+whatever+doctrines+of+the+schools+and+whatever+opinions+of+the+chairs+as+articles+of+the+catholic+faith%2C+and+have+imposed+them+upon+consciences+as+to+be+believed+with+the+same+necessity+for+salvation%3B+and+that+from+every+discrepancy+in+the+interpretation+of+the+Scriptures+they+have+far+too+easily+fashioned+heresies+or+schisms.+.+ch.+29+A+foundation%2C+properly+speaking%2C+is+that+which+is+laid+in+the+lowest+place+beneath+for+the+support+of+a+building%2C+and+without+which+the+house+cannot+stand.+Thus+the+foundation+of+our+faith+and+salvation+will+be+that+which+all+Christians+must+strictly+believe+as+necessary+for+salvation%2C+and+without+faith+in+which+none+obtain+salvation.+This+foundation%2C+in+one+word%2C+is+Jesus+Christ%2C+according+to+the+apostle%2C+etc.+But+the+foundation+of+the+prophets+and+apostles+is+the+sum+of+the+doctrine+of+the+prophets+and+apostles%2C+etc.+In+the+Church+the+%E2%80%9Celements+of+the+Christian+faith%2C%E2%80%9D+containing+the+sum+of+the+Law+and+the+Gospel%2C+are+accustomed+to+be+so+called%3B+and+all+these+appear+able+to+be+reduced+to+four+heads%3A+The+first+head+is+the+Decalogue%2C+etc.+The+second+is+the+Apostles%E2%80%99+Creed%2C+etc.+The+third+is+the+Lord%E2%80%99s+Prayer%2C+etc.+The+fourth%2C+finally%2C+is+concerning+the+sacraments%2C+etc.+In+these+heads%2C+in+our+judgment+indeed%E2%80%94if+one+should+speak+popularly%E2%80%94the+foundation+of+the+Christian+faith+and+salvation%2C+taken+in+the+widest+sense%2C+consists.+For+he+who+shall+have+held+these+by+faith+and+shall+have+practiced+them+will+undoubtedly+be+saved%2C+although+he+may+be+ignorant+of+the+remaining+debates+of+the+theologians%E2%80%A6+Yet+in+these+very+heads+we+have+freely+conceded+that+some+distinction+may+exist.+For+some+things+are+more+or+less+necessary+to+salvation+than+others.+.+Georg+Calixtus+Latin+Of+the+Judge+of+Theological+Controversies%2C+sect.+1+%26+3+Let+it+be+far+from+us%2C+therefore%2C+to+hate%2C+avoid+or+abhor+any+Christian+who+has+not+ceased+to+be+a+Christian%2C+who+has+not+ceased+to+be+a+son+of+God%2C+and+therefore+is+our+brother%2C+and+together+with+us+a+member+of+the+body+of+Christ+and+a+co-heir+of+eternal+salvation.+Far+be+it%2C+I+say%2C+that+we+should+abominate+the+fellowship+of+anyone+whom+Christ+has+received+into+communion.+Far+be+it+that+to+him+to+whom+He+will+say%2C+%E2%80%9CCome%2C+blessed+of+my+Father%2C%E2%80%9D+we+should+say%2C+%E2%80%9CDepart%2C+cursed+Satan%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer+Latin%2C+Letter+to+the+Academy+of+Marburg+%7C+Yet+it+must+be+determined+how+far+those+who+differ+in+doctrines+of+Christian+teaching+are+to+be+granted+the+right+of+holy+communion+and+fraternity+preserved.+%7C+Certainly+blessed+Paul+relates+that+he+%E2%80%9Chanded+over+Hymenaeus+and+Alexander+to+Satan%2C%E2%80%9D+%5B1+Tim.+1%3A20%3B+2+Tim.+4%3A14%5D+although+they+were+blasphemers%3B+but+at+the+end+of+the+same+epistle+he+commands+separation+also+from+those+who+follow+a+different+doctrine+and+do+not+adhere+to+the+sound+words+of+our+Lord+Jesus.+%5B1+Tim.+6%3A3%3B+2+Tim.+4%3A3%5D+And+the+presbyter+John+wrote%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0f21606d93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0f21606d93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/j-a-turretin-discourse-concerning-fundamental-articles/#:~:text=If%20anyone%20comes%20to%20you%20and,we%20should%20say%2C%20%E2%80%9CDepart%2C%20cursed%20Satan&amp;text=If%20anyone%20comes%20to%20you%20and%20does%20not&amp;text=my%20Father%2C%E2%80%9D%20we%20should%20say%2C%20%E2%80%9CDepart%2C%20cursed%20Satan" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Contra a civil toleration of sects:]

1. Because it cannot but open a door to all sorts of erroneous opinions.

2. It is dangerous for the State; it may breed factions and divisions between all persons of whatsoever relation—between the magistrate and the subject, the husband and the wife, the father and the son, brothers, sisters, the master and the servant—when the one is of one religion or ecclesiastical government, and the other of another, as you have experienced. The son may refuse to receive any communion with the father, and the brother with the brother, and so dissolve all natural, civil, and domestic bonds of society.

3. No State in Christendom, where there is one only religion established, will admit the public exercise of any other, or endure a schism in that which is already received. Wherefore then should it be done here?

4. If it be granted to our brethren, I cannot see how it can well be denied to other sects. If it be said that other sects differ more from us than they do, it is all one; magis et minus non mutant speciem [more or less does not change the species] in the matter of toleration. For then all must be tolerated, some more, some less. And some of our brethren grant all this argument. And if we distinguish so, you must declare and expound clearly what sects and what opinions are to be tolerated, and what not—an inextricable question, which no mortal man, apparently, is able distinctly to determine. And some may say: the less the difference is, the less need there is for a toleration to be granted to such a sect; for the less it is, the greater is the schism.

5. God in the Old Testament granted no toleration of diverse religions or disciplines; and the New Testament requires no less union among Christians than the Old among the Jews.

6. Either our brethren assent to our doctrine and are resolved likewise to assent to the discipline which (God willing) shall be established by common consent, or they do not. If they grant the first, what need they any other toleration than the rest? If the second, it should first be discussed wherein they are resolved to dissent, and afterwards considered whether it is of such importance that, in consideration thereof, they dare not in good conscience entertain communion with us.

7. They are not pressed to be actors in anything against their consciences. Therefore they need not be suitors for a toleration; or if they be, it may justly be refused.

8. It is against the nature of the communion of saints to live in sects apart, without communicating at the Lord’s Table—which very hardly will be avoided if toleration be granted.

9. Because Scripture exhorts us evermore to unity, which cannot be easily procured by a toleration of sects, which cannot but daily beget new schisms and divisions.

10. Because the difference among the members of the Church of Corinth in the time of Saint Paul was greater, and yet they communicated together; indeed, the Apostle exhorted them to mutual communion and forbearance of sects and divisions.

11. Because the opinion of our brethren resembles too much that of the Donatists, who separated themselves from other churches under pretext that they were not so holy as their own. Neither is it unlike the convents and monasteries among the Papists; for as they all profess one doctrine with the Romish Church, and yet every order has its own discipline—Saint Francis one, Saint Dominic another—and in every order one general, and in every monastery one abbot, prior, or president, so all your churches believe one doctrine together with us, and every one of your churches has one minister, as their convents have a particular abbot or prior. You only differ in this, that you have no general, or anything answering thereto, to keep you in unity and conformity. …

13. We have but one God, one Christ, and one Lord, one Spirit; we are one body; we have one faith and one baptism, whereby we enter into the Church. Wherefore shall we not have one communion, whereby to be spiritually fed, and one discipline to be ruled by?

14. If churches have disciplines or governments different in their species, then the churches must be different in their species also; for all collective bodies or consociations that are governed are differentiated by their different governments, as we see in civil government, in the constitution and distinction of states, kingdoms, and republics. Wherefore, as many diverse governments as there are in churches, so many different species of churches must we admit. I speak here of the Church considered according to her visible form. But the consequent is false, since there is but one Church. Therefore— 15. Neither Christ nor his Apostles ever granted any toleration to diverse sects and governments in the Church; wherefore then will you be suitors for that which they never granted? …

17. Besides all this, Scripture forbids all such toleration as that of Jezebel. (Rev. 2:20) There must be no such speeches among us as “I am of Paul,” “I of Apollos,” “I of Cephas” (1 Cor 1:12); nor that some are “Calvinians,” as you term us, some “Independents,” some Brownists, some Anabaptists, etc. We must all be Christ’s; we must all think and speak the same things (v. 10). Otherwise men are carnal. Neither has the Church of God a custom to be contentious. [1 Cor. 11:16] Neither does the apostle permit schisms. [1 Cor. 12:25] We must not quit our mutual meetings, as others do, and as must be done in a public toleration. They that trouble the Church must be cut off. [Gal. 5:12]

18. Such a toleration cannot but expose our churches to the calumnies of Papists, who always object to Protestants the innumerable number of their sects, whereas they pretend to be nothing but one Church.

19. From such a toleration follows all that we formerly deduced out of Independency. … 21. Neither can it but overthrow all ecclesiastical government; for a man being censured in one church may flee to another, and being again suspended in that other, from thence to another, and so scorn all the churches of God and their censures; and thus this order by necessary consequence will breed all disorder.</p></blockquote>

<blockquote><p>10. We have said that the symbols by which the Church is discerned are the preaching of the Word and the observance of the sacraments, for these cannot any where exist without producing fruit and prospering by the blessing of God… When the preaching of the gospel is reverently heard, and the sacraments are not neglected, there for the time the face of the Church appears without deception or ambiguity; and no man may with impunity spurn her authority… far less revolt from her, and violate her unity, (see Chap. II, sec. 1, 10, and Chap. VIII, sec. 12). For such is the value which the Lord sets on the communion of his Church, that all who contumaciously alienate themselves from any Christian society, in which the true ministry of his Word and sacraments is maintained, He regards as deserters of religion. So highly does He recommend her authority, that when it is violated He considers that his own authority is impaired. For there is no small weight in the designation given to her, “the house of God,” “the pillar and ground of the truth,” (1 Tim. 3:15)… 11… How perilous, then, nay, how fatal the temptation, when we even entertain a thought of separating ourselves from that assembly in which are beheld the signs and badges which the Lord has deemed sufficient to characterise his Church!… If it holds the order instituted by the Lord in Word and sacraments there will be no deception; we may safely pay it the honour due to a church: on the other hand, if it exhibit itself without Word and sacraments, we must in this case be no less careful to avoid the imposture… 12… in the administration of word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith…</p></blockquote>

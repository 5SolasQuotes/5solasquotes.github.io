<blockquote><p>The Dicaeologicae was an immense Latin work that sought to construct a single comprehensive juridical system by collating the Decalogue, Jewish law, Roman law, and various streams of European customary law. The translated sections comprising On Law and Power address such topics as common law, natural law, private or individual (civil) law, the nature of sovereign public authority, and limitations on public power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Law &amp; Power</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Dicaeologicae was an immense Latin work that sought to construct a single comprehensive juridical system by collating the Decalogue, Jewish law, Roman law, and various streams of European customary law. The translated sections comprising On Law and Power address such topics as common law, natural law, private or individual (civil) law, the nature of sovereign public authority, and limitations on public power.”

<blockquote><p>4. He [Parker] makes a distinction betwixt the case of appellation and the case de nulla administratione mala praesumpta. Though the particular eldership has proceeded aright, though it consist of able and sufficient men, and though it be in re propria [in a proper thing], yet if one think himself wronged, and so appeal, then is it made obnoxious to a higher consistory, for says Parker, as the Council of Sardis ordains, audience must not be denied to him who entreats for it. So says Zepperus, speaking of the same purpose: ‘cuivis integrum quoque sit ad superiores gradus provocare, si in inferioris gradus sententia aut decreto aliquid desideret.’ (de Pol. Eccl., bk. 3, ch. 2)</p></blockquote>

</figure><figure class="quote" id="q-5f8c05f3f4" data-kw="">
<blockquote><p>For besides the moral precepts (in which all mankind are concerned) we have an account of the laws of the Israelites by which they were to be governed in their own land: And though it be true, that these judicial laws were given to the Hebrews, and that they were concerned in them, and that other nations must be governed by the laws of their several countries, yet, certain it is, that the justice and the equity, on which these laws are founded, and which they recommend, are worthy the consideration and imitation too of other nations. And if inquisitive persons think it worth their while to look into the laws of Sparta, and Athens, of Rome and other kingdoms and commonwealths, certainly they must judge the laws of Moses, which came from God Himself, are well worthy their looking into, and their serious consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-kidder.html">Richard Kidder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Five Books of Moses</cite>, vol. 1, p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>However, all those things of which it cannot be said that God was not by necessity of nature bound to the other part of the contradiction (or in which we know that God can make or has actually made some change in the obligation) belong to positive right. Such were the symbolical law given to Adam and the ceremonial laws of the Old Testament (which depended on the free will of God). Here also the permission of sin is usually referred.</p></blockquote>

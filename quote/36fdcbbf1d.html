<main class="wrap"><figure class="quote" id="q-36fdcbbf1d" data-kw="">
<blockquote><p>Q. What are you to believe concerning the third estate of man, which is the estate of Grace?

A. That God of his free grace, before the foundations of the world hath elected certain men to eternal Salvation. …

Q. What else?

A. That God in the fullness of time, sent his only begotten Son Jesus Christ to Redeem us from our misery. …

Q. What ought you to believe concerning the person of Christ our Saviour.

A. That he is God and man in one person. …

Q. What is the office of Christ in general?

A. To be the only Mediator between God and man. …

Q. What hath he undertaken to do for our Redemption in particular?

A. Five things.

Q. Which is the first?

A. To reveal unto God’s Elect all truth necessary to their salvation. …

Q. What is the second?

A. To bring in an everlasting Righteousness, by obeying the Law of God for us. …

Q. What is the third?

A. To make satisfaction to the justice of God for our sins, by the sacrifice of himself. …

Q. What is the fourth?

A. To make Intercession for us, at the right hand of God for ever. …

Q. What is the fifth?

A. To gather, and govern all the Elect in all ages, to the end of the World, and to bring them to everlasting Glory in Heaven. …</p></blockquote>

<blockquote><p>52. Given the inherently diverse and manifold structure of the ordinances of civil government and the Church (not to mention their de facto material structures), in their varied subjects, authorities, objects, purposes, ends, means, adjuncts, effects, relations to each other and how they relate differently to God and Christ,† the phrases “God” and “Christ centered voting” are simplistic and unhelpful. † See ed. Fentiman, All of George Gillespie’s Writings on Christ’s Mediatorial Kingdom is the Church Only (RBO, 2014), pp. 9-10 &amp; 18-27 One can talk about “Christ centered mowing the lawn” or “plumbing,” as Christians ought to mow their lawn and do plumbing in faith to Christ and support his Church by it if possible, perhaps by mowing a church’s lawn or fixing some of their leaky pipes, but the nature, science and work of mowing the lawn and plumbing, or their immediate, nearest ends, do not center around Christ, but around mowing the lawn and plumbing. Likewise, “Christ centered voting,” or “politics,” is most directly centered around voting and politics, and “Christ centered chess” is difficult to appreciate. On the other hand, trusting Christ to save us from our sins, growing in the knowledge of Christ and worshipping Him are Christ centered.</p></blockquote>

</figure><figure class="quote" id="q-062119f733" data-kw="">
<blockquote><p>The Socinian doctrine of Jesus dying as a holy martyr, sealing his doctrine with his blood, will that remove the scandal? Nay: it blasphemes the character of God and shocks the conscience of man.

Was the righteous overruling God, the judge of all, evoking merely a martyr’s testimony, when he awoke all legal and official powers in Jerusalem to serve the ends of his “determinate counsel,” and put the case against Jesus into legal shape, and follow it out from first to last in all due legal form? God forbid.

Or will the Arminian notion of Jesus dying in some sense, and in the same sense, for all men?—that is, when rightly sifted and examined, merely in some sense for the good of men, so that now all men can make better terms with God or have another chance of escaping hell,—an opportunity, through a relaxed or softened covenant, to save themselves. That also is very far from removing this grievous scandal or explaining this most offensive exhibition.

There must be an explanation that will gloriously vindicate the justice of God in so pursuing and prosecuting legally the man of sorrows. There must be an explanation which will not merely vindicate the character of God, in the sense of showing that this process or prosecution which the divine “determinate counsel” carried on, is no impeachment of the divine justice, but that it involves an illustrious instance and forthgoing of this divine justice. There must be an explanation which will even swallow up the scandal in glory, and make the very offence of the cross a fountain and a revelation of high moral excellence and triumph, not only not the eclipse, but the victory of righteousness.

The doctrine which thus at once vindicates the personal innocence of Jesus and the public righteousness of God, and transforms the scandal into glory, and the shame into moral loveliness, is the suretyship and substitution of Jesus in the room of his people, with the imputation to him, thereon, of his people’s transgressions. Accordingly, for this very reason—the Holy Ghost signifying this very truth— both at the commencement and at the close of this criminal process, the imputation of sin to Jesus is announced as the satisfactory and sufficient explanation of the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Calvary: Gethsemane – The Arrest – The Trial</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 134-35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

— Hugh Martin, The Shadow of Calvary: Gethsemane – The Arrest – The Trial, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 134-35.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Socinian+doctrine+of+Jesus+dying+as+a+holy+martyr%2C+sealing+his+doctrine+with+his+blood%2C+will+that+remove+the+scandal%3F+Nay%3A+it+blasphemes+the+character+of+God+and+shocks+the+conscience+of+man.%0A%0AWas+the+righteous+overruling+God%2C+the+judge+of+all%2C+evoking+merely+a+martyr%E2%80%99s+testimony%2C+when+he+awoke+all+legal+and+official+powers+in+Jerusalem+to+serve+the+ends+of+his+%E2%80%9Cdeterminate+counsel%2C%E2%80%9D+and+put+the+case+against+Jesus+into+legal+shape%2C+and+follow+it+out+from+first+to+last+in+all+due+legal+form%3F+God+forbid.%0A%0AOr+will+the+Arminian+notion+of+Jesus+dying+in+some+sense%2C+and+in+the+same+sense%2C+for+all+men%3F%E2%80%94that+is%2C+when+rightly+sifted+and+examined%2C+merely+in+some+sense+for+the+good+of+men%2C+so+that+now+all+men+can+make+better+terms+with+God+or+have+another+chance+of+escaping+hell%2C%E2%80%94an+opportunity%2C+through+a+relaxed+or+softened+covenant%2C+to+save+themselves.+That+also+is+very+far+from+removing+this+grievous+scandal+or+explaining+this+most+offensive+exhibition.%0A%0AThere+must+be+an+explanation+that+will+gloriously+vindicate+the+justice+of+God+in+so+pursuing+and+prosecuting+legally+the+man+of+sorrows.+There+must+be+an+explanation+which+will+not+merely+vindicate+the+character+of+God%2C+in+the+sense+of+showing+that+this+process+or+prosecution+which+the+divine+%E2%80%9Cdeterminate+counsel%E2%80%9D+carried+on%2C+is+no+impeachment+of+the+divine+justice%2C+but+that+it+involves+an+illustrious+instance+and+forthgoing+of+this+divine+justice.+There+must+be+an+explanation+which+will+even+swallow+up+the+scandal+in+glory%2C+and+make+the+very+offence+of+the+cross+a+fountain+and+a+revelation+of+high+moral+excellence+and+triumph%2C+not+only+not+the+eclipse%2C+but+the+victory+of+righteousness.%0A%0AThe+doctrine+which+thus+at+once+vindicates+the+personal+innocence+of+Jesus+and+the+public+righteousness+of+God%2C+and+transforms+the+scandal+into+glory%2C+and+the+shame+into+moral+loveliness%2C+is+the+suretyship+and+substitution+of+Jesus+in+the+room+of+his+people%2C+with+the+imputation+to+him%2C+thereon%2C+of+his+people%E2%80%99s+transgressions.+Accordingly%2C+for+this+very+reason%E2%80%94the+Holy+Ghost+signifying+this+very+truth%E2%80%94+both+at+the+commencement+and+at+the+close+of+this+criminal+process%2C+the+imputation+of+sin+to+Jesus+is+announced+as+the+satisfactory+and+sufficient+explanation+of+the+whole.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Shadow+of+Calvary%3A+Gethsemane+%E2%80%93+The+Arrest+%E2%80%93+The+Trial%2C+%28Edinburgh%3A+Lyon+%26+Gemmell%2C+1875%29%2C+pp+134-35.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F062119f733.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/062119f733.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/18/hugh-martin-on-socinian-and-arminian-conceptions-of-the-atonement/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

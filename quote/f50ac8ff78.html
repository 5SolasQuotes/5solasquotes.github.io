<blockquote><p>Richard Cameron believed that those who trust in Christ alone for societal salvation will only vote for those whom Christ has designated in his word as fit for magisterial office; to vote for anyone else is trusting in unlawful means, and thus making a messiah out of a politician. Listen carefully to his reasoning:

Ye will not look to Christ, and yet there is no other ye can have help from but from Him. There is none to help you at all, except you acknowledge Him as your King and Head, and except you acknowledge no other magistrate but according to what He ordains in His word. See what David says, “He that ruleth over men must be just, ruling in the fear of God.” Compare this with “Moreover, thou shalt provide out of all the people, able men, such as fear God, men of truth hating covetousness. Therefore let the fear of God be upon you, take heed, and do it, for there is no iniquity with the Lord your God.” Ye see such should be men that fear God, and men of truth. Oh, take heed and consider what you are doing! Cry unto the Lord, and let us fight against these wicked rulers with the weapons of the spiritual warfare, the arms of secret prayer. Let us pray unto the Lord to cut them off, and the Lord will raise up those that will condemn and despise them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Hosea 13:9-10 (1680)′ in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite>, ed. James Kerr (Edinburgh, 1880), p. 417.</span></figcaption>

<blockquote><p>Therefore, because cruel and greedy masters should not use them too hardly, God remembered them in his creation, and made every week one day of rest, wherein they should be as free as their masters, Gen. ii. 2; so God pitieth the labourer from heaven, and every Sabbath looks down upon him from heaven, as if he should say, One day thy labours shall have an end, and thou shalt rest for ever, as thou restedst this day.

By this we see, as David did limit Joab, that he should not kill Absalom, 2 Sam. xviii. 5, so God hath bound masters, that they should not oppress their servants. Shall God respect thine more than thou? Art thou made fresher to thy labour by a little rest? And is not thy servant made stronger by rest to labour for thee? How many beasts and sheep did Laban lose, only for hardly entreating of a good servant, Gen. xxxi. 9; therefore that is the way to lose, but not to thrive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 33.</span></figcaption>

<blockquote><p>Lastly, No place is so sanctified by the miraculous special presence of God, but that presence ceases, when the tokens of God’s residence cease; the Ark, the Mercy-seat, the places became as before.

For us to go a pilgrimage to Jerusalem, and to the Temple, is an abominable thing; how many bloody battles have since been sought there? these places where the presence of God was, when abused to the dishonour of God, they become worse and worse: whatever we use in holy uses, loses their holiness when abused. It’s boldness for us to tie the presence of God to any place, for God hath not tied himself to any place.

I cannot but wonder, how it’s possible for men to hold, that the Lord’s day, which God hath been pleased to set apart for himself, that its holiness can cease; for that they say, the Lord’s day is not holier longer than the service is in doing; yet that the Church, that God never appointed, should retain its holiness, that you must not tread there, but with your hat off, nor come there without bowing the knee. …

There are several persons to be reproved; those that take pilgrimages to particular places, because of that holiness they suppose in them. I might tell you of their lying Reliques: I will not trouble you with them: suppose them true, what is this to Institution and command of God? where have you a command for such a thing? I might take notice of those that put holiness in places of Burial; in the Church; think it holier than the Church-yard; and one part of the Church holier than another; private prayer, rather than join in public: for any to bow towards the place of the Communion Table, rather than to any other place of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The burning yet un-consumed bush, or, The holiness of places discussed held forth in two farewell-sermons at Christ-Church London, August 17th, 1662</cite>, (London, 1662), pp 33, 34.</span></figcaption>

</figure><figure class="quote" id="q-c722f2b7b9" data-kw="">
<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 77-78</span></figcaption>

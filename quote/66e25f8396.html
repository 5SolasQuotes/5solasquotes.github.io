<main class="wrap"><figure class="quote" id="q-66e25f8396" data-kw="">
<blockquote><p>(7.) Sanctification fits for heaven: ‘Who hath called us to glory and virtue.’ 2 Pet i 3. Glory is the throne, and sanctification is the step by which we ascend to it. As you first cleanse the vessel, and then pour in the wine; so God first cleanses us by sanctification, and then pours in the wine of glory. Solomon was first anointed with oil, and then was a king. 1 Kings i 39. First God anoints us with the holy oil of his Spirit, and then sets the crown of happiness upon our head. Pureness of heart and seeing God are linked together. Matt v 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, p. 166 in The Select Works of the Rev. Thomas Watson… (New York, 1855)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d95ad2e21" data-kw="">
<blockquote><p>2. We are mere patients in the causes of blessedness; but in respect of conditions we are not so: for as we said of faith, we may also say of good works: God enables to them, but man works them, and walks in the way of them to blessedness: not that our works are causes, but conditions without which blessedness is not attained. See Mt. 25:35.

3. This assertion [previously objected] bewrays great ignorance of the proper and present use of sanctification, and the duties of it; which they conceive as legally urged to help the believer in his title and right to the blessed inheritance purchased in heaven: whereas only Christ’s righteousness and merits give right and title unto heaven; but yet the grace of sanctification gives us an aptitude and fitness unto it: for, ‘without holiness none shall see God,’ Heb. 12:14, and, no unclean thing shall enter into the gates of that City. (Rev. 21:27) Yea it is proceeding in sanctification to the measure and stature of Christ that fits us to the vision and fruition of the glorious presence of God, and for the full possession of that heavenly inheritance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regula Vitæ: the Rule of the Law under the Gospel</cite>, … (London: Dawman, 1631), ch. 4, 3rd Error, pp. 72-73 Taylor (1576–1632) was a partially conforming English minister, sympathetic with the puritans.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-3bd0cf9000" data-kw="">
<blockquote><p>The necessity of repentance, as a means, we here also acknowledge, seeing that to the impenitent there can be neither salvation nor remission of sin, etc. Remission of sin belongs to it, neither formally, nor meritoriously, nor satisfactorily, but at most:

1. Conditionally, as this is offered to us in the gospel, on the condition of repentance and faith.

2. Dispositively, etc.

3. Judicatively and ostensively, etc. Far be it from us therefore to make that remission with the Papists to be an effect properly so called of repentance; when that is due only to God’s grace by Christ, etc. But it’s partly a necessary consequent adjunct of it, in as much as under that condition, as also of new obedience (though not for it), remission of sins is propounded and offered to us, seeing it is inconvenient to remit sin to him that perseveres in sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collegium theologicum</cite>, ... (1649) trans. in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, pp. 407-8 | locus 13, p. 337</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-b696011b19" data-kw="">
<blockquote><p>Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14.</p></blockquote>

<blockquote><p>Some of the passages show the quality or condition required of those who are promised eternal life (Heb. 10:36, etc.). Other passages show the mark and way of faith whereby one reaches eternal life (as in Mt. 25:35; James 1:25 and 2:14). And other places point out the fruit and effect of the salvation that has begun and that consists in the forgiveness of sins (as in Lk. 7:47, etc.).</p></blockquote>

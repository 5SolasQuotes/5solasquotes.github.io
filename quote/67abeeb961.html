<main class="wrap"><figure class="quote" id="q-67abeeb961" data-kw="">
<blockquote><p>IV. Third, “in all the precepts synecdoche is to be acknowledged” by which in one proposed species, all under the same genus are understood, and by one prohibited vice others of the same kind analogous to it (and whatever bear upon or lead to it) are prohibited. Thus in the precept “thou shalt not commit adultery” is prohibited every affection for another’s wife; to lust after her (Mt. 5:28) and all illicit desires are forbidden.

Under homicide, all angry feelings are included. What are most base and capital in each species of sin are forbidden, under which all the others are included, either because they flow thence or because they lead at length to it; or because what appear the smallest to men are in the most accurate judgment of God rated more severely. This is not done, therefore, to excuse or exclude lesser sins, but that a greater detestation of sin may be impressed upon our minds. For the flesh endeavours to dilute the foulness of sin and to cover it under specious pretexts; for example, anger and hatred are supposed to be so execrable when these terms are used, but when they are prohibited under the name of homicide, we understand better in how great abomination they are held by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.6.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ff41b378c" data-kw="">
<blockquote><p>XIV. The law, which God in this manner published, consists of ten words or commandments, Exod. 34:28, Deut. 4:13. Wherefore the Greeks also called it δεκάλογος, the decalogue. Moreover the contents of those ten words are various. 1st, There is the prescription of certain duties; and in this, the nature of a law, as such, properly consists. 2dly, The threatening of divine vengeance against the transgressors thereof, as in the second and third commandments; and this is the sanction of the covenant of works, from which all threatenings are derived, as we explained at large, book iii. chap. i sect. 22. 3dly, The proposal of divine grace and favour; and as this is made to sinners, and that under a condition, not of perfect, but of sincere obedience, so far it flows from the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, 2.175</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-900bb6b6ed" data-kw="third use rule of life">
<blockquote><p>It not only antecedently prepares the elect man for Christ, but consequently also directs him already renewed through Christ in the ways of the Lord; serving him as a standard and rule of the most perfect life, to which he knows he is called by Christ and which he ought diligently to pursue (1 Tim. 1:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.11</span></figcaption>

</figure><figure class="quote" id="q-ca815d96e5" data-kw="uses absolute relative rule">
<blockquote><p>A twofold use of the law may be laid down—absolute and relative. The former regards the law in itself; the latter regards the law in relation to the various states of man. The absolute (which obtains in every state of man) is that it may be a unique, full and certain rule of things to be done and avoided by each of us as well towards God as his neighbor. Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.2</span></figcaption>

</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

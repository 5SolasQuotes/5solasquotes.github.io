<main class="wrap"><figure class="quote" id="q-45975e8e8a" data-kw="">
<blockquote><p>If then a man cannot distinguish aright between the law and the gospel, he cannot rightly understand as much as a single article of divine truth. If he does not have spiritual and just apprehensions of the holy law, he cannot have spiritual and transforming discoveries of the glorious gospel; and on the other hand, if his view of the gospel is erroneous or wrong, his notions of the law cannot be right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>As the doctrine concerning the law of God properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life—as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin (Rom. 3:20). (3) For preparation for grace—in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1.1</span></figcaption>

</figure><figure class="quote" id="q-b72ef7f2ea" data-kw="">
<blockquote><p>5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation.

6. Although true believers be not under the law, as a covenant of works, to be thereby justified, or condemned; yet is it of great use to them, as well as to others; in that, as a rule of life informing them of the will of God, and their duty, it directs and binds them to walk accordingly; discovering also the sinful pollutions of their nature, hearts, and lives; so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin, together with a clearer sight of the need they have of Christ, and the perfection of his obedience. It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin: and the threatenings of it serve to show what even their sins deserve; and what afflictions, in this life, they may expect for them, although freed from the curse thereof threatened in the law. The promises of it, in like manner, show them God’s approbation of obedience, and what blessings they may expect upon the performance thereof: although not as due to them by the law as a covenant of works. So as, a man’s doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law; and, not under grace.

7. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it; the Spirit of Christ subduing and enabling the will of man to do that freely, and cheerfully, which the will of God, revealed in the law, requireth to be done.</p></blockquote>

</figure><figure class="quote" id="q-f32f3548f9" data-kw="">
<blockquote><p>The basic principle in application is to know whether the passage is a statement of the law or of the gospel. For when the Word is preached, the law and the gospel operate differently. The law exposes the disease of sin, and as a side-effect, stimulates and stirs it up. But it provides no remedy for it. However the gospel not only teaches us what is to be done, it also has the power of the Holy Spirit joined to it….A statement of the law indicates the need for a perfect inherent righteousness, of eternal life given through the works of the law, of the sins which are contrary to the law and of the curse that is due them…. By contrast, a statement of the gospel speaks of Christ and his benefits, and of faith being fruitful in good works</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Prophesying: or a Treatise concerning the Sacred &amp; Only True Manner &amp; Method of Preaching</cite>, (1592). Reprinted, Edinburgh: Banner of Truth Trust, 1996, 54-55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-61e1b01320" data-kw="">
<blockquote><p>We, on the other hand, declare with Paul that no law, whether it is human or divine, justifies or makes alive. Therefore we distinguish the Law from righteousness as sharply as death from life or hell from heaven. We are prompted to declare this by the clear statement of Paul: “The Law was not given in order to justify, make live, or save, but merely in order to condemn, kill, and destroy, contrary to the opinion of all men, who naturally suppose that the Law was given in order to obtain righteousness, life, and salvation.” Such a proper distinction between the function of the Law and that of the Gospel keeps all genuine theology in its correct use. It also establishes us believers in a position as judges over all styles of life and over all the laws and dogmas of men. Finally it provides us with a faculty for testing all the spirits (1 John 4:1). By contrast, because the papists have completely intermingled and confused the doctrine of the Law and that of the Gospel, they have been unable to teach anything certain either about faith or about works or about styles of life or about judging the spirits. And the same thing is happening to the sectarians today. After these refutations and arguments, therefore, Paul teaches, at some length and with considerable beauty, that if you consider the true and best use of the Law, it is nothing but some sort of discipline toward righteousness. It humbles men and makes them ready for the righteousness of Christ, if it performs its proper function, that is, if it makes them guilty, terrifies them, makes them conscious of sin, wrath, death, and hell. When this has happened, the presumption of their own righteousness and holiness disappears, and Christ, with His blessings, begins to become sweet. Therefore the Law is not against the promises of God; it is for them. Although it does not fulfill the promise and does not grant righteousness, still, in its use and function, it humbles us and thus makes us ready for the grace and blessing of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 331.</span></figcaption>

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 331.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+on+the+other+hand%2C+declare+with+Paul+that+no+law%2C+whether+it+is+human+or+divine%2C+justifies+or+makes+alive.+Therefore+we+distinguish+the+Law+from+righteousness+as+sharply+as+death+from+life+or+hell+from+heaven.+We+are+prompted+to+declare+this+by+the+clear+statement+of+Paul%3A+%E2%80%9CThe+Law+was+not+given+in+order+to+justify%2C+make+live%2C+or+save%2C+but+merely+in+order+to+condemn%2C+kill%2C+and+destroy%2C+contrary+to+the+opinion+of+all+men%2C+who+naturally+suppose+that+the+Law+was+given+in+order+to+obtain+righteousness%2C+life%2C+and+salvation.%E2%80%9D+Such+a+proper+distinction+between+the+function+of+the+Law+and+that+of+the+Gospel+keeps+all+genuine+theology+in+its+correct+use.+It+also+establishes+us+believers+in+a+position+as+judges+over+all+styles+of+life+and+over+all+the+laws+and+dogmas+of+men.+Finally+it+provides+us+with+a+faculty+for+testing+all+the+spirits+%281+John+4%3A1%29.+By+contrast%2C+because+the+papists+have+completely+intermingled+and+confused+the+doctrine+of+the+Law+and+that+of+the+Gospel%2C+they+have+been+unable+to+teach+anything+certain+either+about+faith+or+about+works+or+about+styles+of+life+or+about+judging+the+spirits.+And+the+same+thing+is+happening+to+the+sectarians+today.+After+these+refutations+and+arguments%2C+therefore%2C+Paul+teaches%2C+at+some+length+and+with+considerable+beauty%2C+that+if+you+consider+the+true+and+best+use+of+the+Law%2C+it+is+nothing+but+some+sort+of+discipline+toward+righteousness.+It+humbles+men+and+makes+them+ready+for+the+righteousness+of+Christ%2C+if+it+performs+its+proper+function%2C+that+is%2C+if+it+makes+them+guilty%2C+terrifies+them%2C+makes+them+conscious+of+sin%2C+wrath%2C+death%2C+and+hell.+When+this+has+hap

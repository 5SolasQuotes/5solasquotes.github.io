<main class="wrap"><figure class="quote" id="q-a58969579b" data-kw="">
<blockquote><p>23. To imagine God either without providence, or with general only, not special, indeed also singular, concerning any entities whatsoever and any acts of entities, is impious and hurls God from his throne. 24. But this providence is either effective of all good, or permissive and directive of evil, nor idle concerning evil but efficacious, although not efficient. 25. Whence those who strive to ascribe to God the efficiency of evil reduplicatively as such to orthodox [Reformed] Churches, do what they do from mere either ignorance or malice, since they constantly teach that God can be neither the physical nor the ethical cause of ethical evil as such. 26. To imagine God also without predestination is both to detract the eternal direction of all things from God, and to establish an uncertain end of the creation of men, and to make primary causes from secondary, and to constitute man the craftsman and architect of his own salvation. 27. Yet the orthodox doctrine of the Reformed Churches concerning predestination neither removes the guilt of the fall from man, nor imputes it to God, nor establishes a necessity of the fall incompossible with the freedom of the one falling or fallen. Nor have those who oppose necessity in every way to freedom well-perceived the nature either of necessity or of freedom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim-the-elder.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

<blockquote><p>[Scotus:] ‘God does not operate for that operation except with the will freely acting and determining itself to operate; then God operates with it. Yet there the first liberty and dominion is not in it but in the divine will, which has no cause operating with it for its own act; yet as much liberty as can be in a creature is there.&#x27;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin">
<blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Absolute Predestination</cite>, tr. Augustus Toplady, on the omnipotence of God</span></figcaption>

<blockquote><p>7. Because the opponents deny predetermining grace to good acts, and subject habitual grace to the nod and motion of the created will, so that the will by nature influences the good work prior to divine grace. Hence, if God is moved to give grace on account of previous dispositions, then conversion will begin from the endeavor, influence and natural motion of free will. But on the contrary, God begins the good work in us, Phil. 1:6. Neither man, nor angel, first gives something to God, Rom. 11:33-34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism tr. by AI by Onku (1639-1642; 1668)</cite>, ch. 7, State of Fallen Man, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>In the testimonies from the ancient fathers, which [John] Owen appends to the following treatise, he quotes Augustine and Prosper as authorities in support of his own view of a definite and effectual atonement. Though these fathers, in opposition to the Pelagians and semi-Pelagians of their day, held this view, the point did not emerge into commanding prominence in the controversy with which their names are chiefly and honourably associated. It was by no means a subject of special controversy, or the key of their position in the field on which their polemical laurels were won. It was otherwise in the dispute which prevailed between Hincmar and Gottschalc, exactly four centuries later.

The discussion on the extent of the atonement then assumed a distinct and positive shape. The decisions of the different councils which sat in judgment upon their conflicting principles will be found in the appendix to this treatise. The same controversy was renewed in Holland between the Gomarists and the Arminians, when the Synod of Dort, in one of its articles, condemned the Remonstrant doctrine of a universal atonement.

[John] Cameron, the accomplished professor of divinity at Saumur, originated the last important discussion on this point before Owen wrote his treatise on it. The views of Cameron were adopted and urged with great ability by two of his scholars, [Moïse] Amyraut and [Paul] Testard; and in the year 1634 a controversy arose, which agitated the French Church for many years. Amyraut had the support of [Jean] Daillé and [David] Blondell. He was ably opposed by [André] Rivet, [Friedrich] Spanheim, and Des Marets.

In the last two instances in which discussion on the extent of the atonement revived in the Reformed Churches, there was an essential distinction, very commonly overlooked, between the special points upon which the controversies respectively turned. The object of the article on the death of Christ, emitted by the Synod of Dort, was to counteract the tenet that Christ by the atonement only acquired for the Father a plenary right and freedom to institute a new procedure with all men, by which, on condition of their own obedience, they might be saved.

The divines of Saumur would not have accepted this tenet as a correct representation of their sentiments. Admitting that, by the purpose of God, and through the death of Christ, the elect are infallibly secured in the enjoyment of salvation, they contended for an antecedent decree, by which God is free to give salvation to all men through Christ, on the condition that they believe on him. Hence their system was termed hypothetic universalism. [1]

The vital difference between it and the strict Arminian theory lies in the absolute security asserted in the former for the spiritual recovery of the elect. They agree, however, in attributing some kind of universality to the atonement, and in maintaining that, on a certain condition, within the reach of fulfilment by all men, — obedience generally, according to the Arminians, and faith, according to the divines of Saumur, — all men have access to the benefits of Christ’s death. To impart consistency to the theory of Amyraut, faith must, in some sense, be competent to all men; and he held, accordingly, the doctrine of universal grace: in which respect his theory differs essentially from the doctrine of universal atonement, as embraced by eminent Calvinistic divines, who held the necessity of the special operation of grace in order to the exercise of faith.

The readers of Owen will understand, from this cursory explanation, why he dwells with peculiar keenness and reiteration of statement upon a refutation of the conditional system, or the system of universal grace, according to the name it bore in subsequent discussions. It was plausible; it had many learned men for its advocates; it had obtained currency in the foreign churches; and it seems to have been embraced by [Thomas] More, or Moore, to whose work on “The Universality of God’s Free Grace,” our author replies at great length.</p></blockquote>

<blockquote><p>According to the common doctrine of Augustinians, as expressed in the Westminster Catechism, “God, having … elected some to everlasting life, did enter into a covenant of grace, to deliver them out of the estate of sin and misery, and to bring them into an estate of salvation by a Redeemer.” In opposition to this view some of the Reformed theologians of the seventeenth century introduced the scheme which is known in the history of theology as the doctrine of hypothetical redemption. The principal advocate of this doctrine was Amyraut (died 1664), Professor in the French Protestant Seminary at Saumur. He taught, (1.) That the motive impelling God to redeem men was benevolence, or love to men in general. (2.) From this motive He sent His Son to make the salvation of all men possible. (3.) God, in virtue of a decretum universale hypotheticum, offers salvation to all men if they believe in Christ. (4.) All men have a natural ability to repent and believe. (5.) But as this natural ability was counteracted by a moral inability, God determined to give his efficacious grace to a certain number of the human race, and thus to secure their salvation. This scheme is sometimes designated as “universalismus hypotheticus.” It was designed to take a middle ground between Augustinianism and Arminianism. It is liable to the objections which press on both systems. It does not remove the peculiar difficulties of Augustinianism, as it asserts the sovereignty of God in election. Besides, it leaves the case of the heathen out of view. They, having no knowledge of Christ, could not avail themselves of this decretum hypotheticum, and therefore must be considered as passed over by a decretum absolutum. It was against this doctrine of Amyraut and other departures from the standards of the Reformed Church that, in 1675, the “Formula Consensus Helvetica” was adopted by the churches of Switzerland. This theory of the French theologians soon passed away as far as the Reformed churches in Europe were concerned. Its advocates either returned to the old doctrine, or passed on to the more advanced system of the Arminians. In this country it has been revived and extensively adopted. At first view it might seem a small matter whether we say that election precedes redemption or that redemption precedes election. In fact, however, it is a question of great importance. The relation of the truths of the Bible is determined by their nature. If you change their relation you must change their nature. If you regard the sun as a planet instead of as the centre of our system you must believe it to be something very different in its constitution from what it actually is. So in a scheme of thought, if you make the final cause a means, or a means the final cause, nothing but confusion can be the result…

1. It supposes mutability in the divine purposes; or that the purpose of God may fail of accomplishment. According to this scheme, God, out of benevolence or philanthropy, purposed the salvation of all men, and sent his Son for their redemption. But seeing that such purpose could not be carried out, He determined by his efficacious grace to secure the salvation of a certain portion of the human race. This difficulty the scheme involves, however it may be stated. It cannot however be supposed that God intends what is never accomplished; that He purposes what He does not intend to effect; that He adopts means for an end which is never to be attained. This cannot be affirmed of any rational being who has the wisdom and power to secure the execution of his purposes. Much less can it be said of Him whose power and wisdom are infinite. If all men are not saved, God never purposed their salvation, and never devised and put into operation means designed to accomplish that end. We must assume that the result is the interpretation of the purposes of God. If He foreordains whatsoever comes to pass, then events correspond to his purposes; and it is against reason and Scripture to suppose that there is any contradiction or want of correspondence between what He intended and what actually occurs. The theory, therefore, which assumes that God purposed the salvation of all men, and sent his Son to die as a means to accomplish that end, and then seeing, or foreseeing that such end could not or would not be attained, elected a part of the race to be the subjects of efficacious grace, cannot be admitted as Scriptural.

2. The Bible clearly teaches that the work of Christ is certainly efficacious. It renders certain the attainment of the end it was designed to accomplish. It was intended to save his people, and not merely to make the salvation of all men possible. It was a real satisfaction to justice, and therefore necessarily frees from condemnation. It was a ransom paid and accepted, and therefore certainly redeems. If, therefore, equally designed for all men, it must secure the salvation of all. If designed specially for the elect, it renders their salvation certain, and therefore election precedes redemption. God, as the Westminster Catechism teaches, having elected some to eternal life, sent his Son to redeem them.

3. The Scriptures further teach that the gift of Christ secures the gift of all other saving blessings. “He that spared not his own Son, but delivered him up for us all, how shall he not with him also freely give us all things?” (Rom. 8:32.) Hence they are certainly saved for whom God delivered up his Son. The elect only are saved, and therefore He was delivered up specially for them, and consequently election must precede redemption. The relation, therefore, of redemption to election is as clearly determined by the nature of redemption as the relation of the sun to the planets is determined by the nature of the sun.

4. The Bible in numerous passages directly asserts that Christ came to redeem his people; to save them from their sins; and to bring them to God. He gave Himself for his Church; He laid down his life for his sheep. As the end precedes the means, if God sent his Son to save his people, if Christ gave Himself for his Church, then his people were selected and present to the divine mind, in the order of thought, prior to the gift of Christ.

5. If, as Paul teaches (Rom. 8:29, 30), foreknowledge precedes predestination, and if the mission of Christ is the means of accomplishing the end of predestination, then of necessity predestination to eternal life precedes the gift of Christ. Having, as we are taught in Eph. 1:4, 5, predestinated us to the adoption of sons, God chose us before the foundation of the world, and sent his Son to be the propitiation for our sins. This is the order of the divine purposes, or the mutual relation of the truths of redemption as presented in the Scriptures.

6. The motive (so to speak) of God in sending his Son is not, as this theory assumes, general benevolence or that love of which all men are equally the objects, but that peculiar, mysterious, infinite love in which God, in giving his Son, gives Himself and all conceivable and possible good. All these points, however, as before remarked, ask for further consideration when we come to treat of the nature and design of Christ’s work.</p></blockquote>

inst+this+doctrine+of+Amyraut+and+other+departures+from+the+standards+of+the+Reformed+Church+that%2C+in+1675%2C+the+%E2%80%9CFormula+Consensus+Helvetica%E2%80%9D+was+adopted+by+the+churches+of+Switzerland.+This+theory+of+the+French+theologians+soon+passed+away+as+far+as+the+Reformed+churches+in+Europe+were+concerned.+Its+advocates+either+returned+to+the+old+doctrine%2C+or+passed+on+to+the+more+advanced+system+of+the+Arminians.+In+this+country+it+has+been+revived+and+extensively+adopted.+At+first+view+it+might+seem+a+small+matter+whether+we+say+that+election+precedes+redemption+or+that+redemption+precedes+election.+In+fact%2C+however%2C+it+is+a+question+of+great+importance.+The+relation+of+the+truths+of+the+Bible+is+determined+by+their+nature.+If+you+change+their+relation+you+must+change+their+nature.+If+you+regard+the+sun+as+a+planet+instead+of+as+the+centre+of+our+system+you+must+believe+it+to+be+something+very+different+in+its+constitution+from+what+it+actually+is.+So+in+a+scheme+of+thought%2C+if+you+make+the+final+cause+a+means%2C+or+a+means+the+final+cause%2C+nothing+but+confusion+can+be+the+result%E2%80%A6+1.+It+supposes+mutability+in+the+divine+purposes%3B+or+that+the+purpose+of+God+may+fail+of+accomplishment.+According+to+this+scheme%2C+God%2C+out+of+benevolence+or+philanthropy%2C+purposed+the+salvation+of+all+men%2C+and+sent+his+Son+for+their+redemption.+But+seeing+that+such+purpose+could+not+be+carried+out%2C+He+determined+by+his+efficacious+grace+to+secure+the+salvation+of+a+certain+portion+of+the+human+race.+This+difficulty+the+scheme+involves%2C+however+it+may+be+stated.+It+cannot+however+be+supposed+that+God+intends+what+is+never+accomplished%3B+that+He+purposes+what+He+does+not+intend+to+effect%3B+that+He+adopts+means+for+an+end+which+is+never+to+be+attained.+This+cannot+be+affirmed+of+any+rational+being+who+has+the+wisdom+and+power+to+secure+the+execution+of+his+purposes.+Much+less+can+it+be+said+of+Him+whose+power+and+wisdom+are+infinite.+If+all+men+are+not+saved%2C+God+never+purposed+their+salvation%2C+and+never+devised+and+put+into+operation+means+designed+to+accomplish+that+end.+We+must+assume+that+the+result+is+the+interpretation+of+the+purposes+of+God.+If+He+foreordains+whatsoever+comes+to+pass%2C+then+events+correspond+to+his+purposes%3B+and+it+is+against+reason+and+Scripture+to+suppose+that+there+is+any+contradiction+or+want+of+correspondence+between+what+He+intended+and+what+actually+occurs.+The+theory%2C+therefore%2C+which+assumes+that+God+purposed+the+salvation+of+all+men%2C+and+sent+his+Son+to+die+as+a+means+to+accomplish+that+end%2C+and+then+seeing%2C+or+foreseeing+that+such+end+could+not+or+would+not+be+attained%2C+elected+a+part+of+the+race+to+be+the+subjects+of+efficacious+grace%2C+cannot+be+admitted+as+Scriptural.+2.+The+Bible+clearly+teaches+that+the+work+of+Christ+is+certainly+efficacious.+It+renders+certain+the+attainment+of+the+end+it+was+designed+to+accomplish.+It+was+intended+to+save+his+people%2C+and+not+merely+to+make+the+salvation+of+all+men+possible.+It+was+a+real+satisfaction+to+justice%2C+and+therefore+necessarily+frees+from+condemnation.+It+was+a+ransom+paid+and+accepted%2C+and+therefore+certainly+redeems.+If%2C+therefore%2C+equally+designed+for+all+men%2C+it+must+secure+the+salvation+of+all.+If+designed+specially+for+the+elect%2C+it+renders+their+salvation+certain%2C+and+therefore+election+precedes+redemption.+God%2C+as+the+Westminster+Catechism+teaches%2C+having+elected+some+to+eternal+life%2C+sent+his+Son+to+redeem+them.+3.+The+Scriptures+further+teach+that+the+gift+of+Christ+secures+the+gift+of+all+other+saving+blessings.+%E2%80%9CHe+that+spared+not+his+own+Son%2C+but+delivered+him+up+for+us+all%2C+how+shall+he+not+with+him+also+freely+give+us+all+things%3F%E2%80%9D+%28Rom.+8%3A32.%29+Hence+they+are+certainly+saved+for+whom+God+delivered+up+his+Son.+The+elect+only+are+saved%2C+and+therefore+He+was+delivered+up+specially+for+them%2C+and+consequently+election+must+precede+redemption.+The+relation%2C+therefore%2C+of+redemption+to+election+is+as+clearly+determined+by+the+nature+of+redemption+as+the+relation+of+the+sun+to+the+planets+is+determined+by+the+nature+of+the+sun.+4.+The+Bible+in+numerous+passages+directly+asserts+that+Christ+came+to+redeem+his+people%3B+to+save+them+from+their+sins%3B+and+to+bring+them+to+God.+He+gave+Himself+for+his+Church%3B+He+laid+down+his+life+for+his+sheep.+As+the+end+precedes+the+means%2C+if+God+sent+his+Son+to+save+his+people%2C+if+Christ+gave+Himself+for+his+Church%2C+then+his+people+were+selected+and+present+to+the+divine+mind%2C+in+the+order+of+thought%2C+prior+to+the+gift+of+Christ.+5.+If%2C+as+Paul+teaches+%28Rom.+8%3A29%2C+30%29%2C+foreknowledge+precedes+predestination%2C+and+if+the+mission+of+Christ+is+the+means+of+accomplishing+the+end+of+predestination%2C+then+of+necessity+predestination+to+eternal+life+precedes+the+gift+of+Christ.+Having%2C+as+we+are+taught+in+Eph.+1%3A4%2C+5%2C+predestinated+us+to+the+adoption+of+sons%2C+God+chose+us+before+the+foundation+of+the+world%2C+and+sent+his+Son+to+be+the+propitiation+for+our+sins.+This+is+the+order+of+the+divine+purposes%2C+or+the+mutual+relation+of+the+truths+of+redemption+as+presented+in+the+Scriptures.+6.+The+motive+%28so+to+speak%29+of+God+in+sending+his+Son+is+not%2C+as+this+theory+assumes%2C+general+benevolence+or+that+love+of+which+all+men+are+equally+the+objects%2C+but+that+peculiar%2C+mysterious%2C+infinite+love+in+which+God%2C+in+giving+his+Son%2C+gives+Himself+and+all+conceivable+and+possible+good.+All+these+points%2C+however%2C+as+before+remarked%2C+ask+for+further+consideration+when+we+come+to+treat+of+the+nature+and+design+of+Christ%E2%80%99s+work.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+2+%28Oak+Harbor%2C+WA%3A+Logos+Research+Systems%2C+Inc.%2C+1997%29%2C+321%E2%80%9324.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8589b1bd5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="pe <blockquote><p>The Compromise of the School of Saumur. The School of Saumur represents an attempt to tone down the rigorous Calvinism of the Synod of Dort, and to avoid at the same time the error of Arminianism. This is seen especially in the work of Amyraldus, who boldly taught a hypothetical universalism, which was really a species of universal atonement. God willed by an antecedent decree that all men should be saved on condition of repentance and faith in Jesus Christ. He therefore sent Christ into the world to die for all men. But seeing that, left to themselves, none would repent and believe, He by a subsequent decree elected some as the objects of the saving operation of His grace. These and these only are actually saved. The outcome proved this to be an untenable position. Of the followers of this school some emphasized the first decree and the universal offer of salvation based on it, with the result that they landed in the Arminian camp; and others stressed the second decree and the necessity of effectual grace, and thus returned to the Calvinistic position. The views of the School of Saumur were practically shared by Davenant, Calamy, and especially Richard Baxter, in England. Its peculiar opinions gave occasion for the construction of the Formula Consensus Helvetica by Turretin and Heidegger, in which these views are combatted.</p></blockquote>

<blockquote><p>Previously, we have published extracts from the contributions of Edmund Calamy and Samuel Rutherford to the Westminster Assembly’s debate on hypothetical universalism. On this occasion, we publish the contribution of the Scots Commissioner, George Gillespie with some of the replies of Edmund Calamy and Lazarus Seaman, and with the brief contributions of Edward Reynolds and John Lightfoot:

Debate about the redemption of the elect only by Christ. …

Mr. Gillespie—Nothing to the thing itself; but for the state of the question, let more be looked upon than that expressed in the proposition, because there is a concatenation of the death of Christ with the decrees; therefore we must see what they hold concerning that which in order goes before and what in order follows after. … [John] Camero[n] saith for all upon condition of believing, but [Moïse] Amyrauld he hath drawn it further. . . . Whether he hold an absolute reprobation of all that shall not be saved. . . . A parte post what follows upon that conditional redemption.

Mr. Calamy—In the point of election, I am for special election; and for reprobation, I am for massa corrupta. . . . Those to whom He … by virtue of Christ’s death, there is ea administrate of grace to the reprobate, that they do wilfully damn themselves. I neither hold sufficient grace nor special grace. …

Mr. Reynolds—The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se, of sufficient value to all,—nay, ten thousand worlds. There are two Adams,—one a fountain of misery, and the other of mercy. … To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.

Mr. Seaman—All in the first Adam were made liable to damnation, so all liable to salvation in the second Adam.

This proposition to be debated: ‘That Christ did intend to redeem the elect only.’ …

Mr. Gillespie—In answer to the two arguments [of Edmund Calamy from John 3:16 and Mark 16],—one from the iii. Joh[n] 16. A. I. The brother takes for granted that by the world is meant the whole world. It is a point much controverted. Our divines do deny that the word world must in some places be taken in another sense. . . . For that of the philanthropy it makes much against it. … I cannot understand how there can be such a universal love of God to mankind as is maintained. Those that will say it must needs deny the absolute reprobation; then alone to those whom God hath absolutely reprobated both from salvation and the means of salvation.

. . . For the next argument from xvi. Mark. . . . He conceives the ground of this universal offer is the institution of Christ in dying. . . . For that of the truth . . . There is a truth in it: the connection of those two extremes must ever hold true faith and salvation. But what is that to a reprobate? He[re] is the mistak[e]. The voluntas decreti and mandati are not distinguished. … A man is bound to believe that he ought to believe, and that by faith he shall be saved. It is his duty. The command doth not hold out God’s intentions; otherwise God’s command to Abraham concerning sacrificing of his son . . . Said I cannot say so to a devil. . . . True; but reason is, that it is the revealed will of God that devils are absolutely excluded, but not so any man known to me.

Mr. Calamy—The difference is not in the offer, but in the application. . . . That voluntas decreti comes only in the application. . . . For the word world … I grant it signifies continued, the elect sometimes, but sometimes it signifies the whole world, and so it must do here. . . . For this love he saith he under . . . There is a double love: general and special. A general love to the reprobate, and the fruit of this, a general offer, and general grace, and general reformation.

Mr. Gillespie—It is acknowledged the word world may suffer another sense—the elect, but said it must be a larger thing than believers. … A. This is still taken for granted, which is to be proved, for I say it is very good sense. God so loved the elect, that whosoever believes in Him . . . The reconciling of a general love with absolute reprobation is not answered. . . . The general offers of the gospel are not grounded upon the secret decree.

Mr. Lightfoot—I understand the word world in a middle sense. It is only in opposition to the nation of the Jews. … For the universal offer God intends as the salvation of the elect, so the inexcusableness of the wicked.</p></blockquote>

— Alexander F. Mitchell and John Struthers, Minutes of the Sessions of the Westminster Assembly of Divines, (Edinburgh: William Blackwood and Sons, 1874), Sess. 522, 22 Oct. 1645, pp 152, 153-54, 155-56.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPreviously%2C+we+have+published+extracts+from+the+contributions+of+Edmund+Calamy+and+Samuel+Rutherford+to+the+Westminster+Assembly%E2%80%99s+debate+on+hypothetical+universalism.+On+this+occasion%2C+we+publish+the+contribution+of+the+Scots+Commissioner%2C+George+Gillespie+with+some+of+the+replies+of+Edmund+Calamy+and+Lazarus+Seaman%2C+and+with+the+brief+contributions+of+Edward+Reynolds+and+John+Lightfoot%3A%0A%0ADebate+about+the+redemption+of+the+elect+only+by+Christ.+%E2%80%A6%0A%0AMr.+Gillespie%E2%80%94Nothing+to+the+thing+itself%3B+but+for+the+state+of+the+question%2C+let+more+be+looked+upon+than+that+expressed+in+the+proposition%2C+because+there+is+a+concatenation+of+the+death+of+Christ+with+the+decrees%3B+therefore+we+must+see+what+they+hold+concerning+that+which+in+order+goes+before+and+what+in+order+follows+after.+%E2%80%A6+%5BJohn%5D+Camero%5Bn%5D+saith+for+all+upon+condition+of+believing%2C+but+%5BMo%C3%AFse%5D+Amyrauld+he+hath+drawn+it+further.+.+.+.+Whether+he+hold+an+absolute+reprobation+of+all+that+shall+not+be+saved.+.+.+.+A+parte+post+what+follows+upon+that+conditional+redemption.%0A%0AMr.+Calamy%E2%80%94In+the+point+of+election%2C+I+am+for+special+election%3B+and+for+reprobation%2C+I+am+for+massa+corrupta.+.+.+.+Those+to+whom+He+%E2%80%A6+by+virtue+of+Christ%E2%80%99s+death%2C+there+is+ea+administrate+of+grace+to+the+reprobate%2C+that+they+do+wilfully+damn+themselves.+I+neither+hold+sufficient+grace+nor+special+grace.+%E2%80%A6%0A%0AMr.+Reynolds%E2%80%94The+Synod+%5Bof+Dort%5D+intended+no+more+than+to+declare+the+sufficiency+of+the+death+of+Christ%3B+it+is+pretium+in+se%2C+of+sufficient+value+to+all%2C%E2%80%94nay%2C+ten+thousand+worlds.+There+are+two+Adams%2C%E2%80%94one+a+fountain+of+misery%2C+and+the+other+of+mercy.+%E2%80%A6+To+be+salvable+is+a+benefit%2C+and+therefore+belongs+only+to+them+that+have+interest+in+Christ.%0A%0AMr.+Seaman%E2%80%94All+in+the+first+Adam+were+made+liable+to+damnation%2C+so+all+liable+to+salvation+in+the+second+Adam.%0A%0AThis+proposition+to+be+debated%3A+%E2%80%98That+Christ+did+intend+to+redeem+the+elect+only.%E2%80%99+%E2%80%A6%0A%0AMr.+Gillespie%E2%80%94In+answer+to+the+two+arguments+%5Bof+Edmund+Calamy+from+John+3%3A16+and+Mark+16%5D%2C%E2%80%94one+from+the+iii.+Joh%5Bn%5D+16.+A.+I.+The+brother+takes+for+granted+that+by+the+world+is+meant+the+whole+world.+It+is+a+point+much+controverted.+Our+divines+do+deny+that+the+word+world+must+in+some+places+be+taken+in+another+sense.+.+.+.+For+that+of+the+philanthropy+it+makes+much+against+it.+%E2%80%A6+I+cannot+understand+how+there+can+be+such+a+universal+love+of+God+to+mankind+as+is+maintained.+Those+that+will+say+it+must+needs+deny+the+absolute+reprobation%3B+then+alone+to+those+whom+God+hath+absolutely+reprobated+both+from+salvation+and+the+means+of+salvation.%0A%0A.+.+.+For+the+next+argument+from+xvi.+Mark.+.+.+.+He+conceives+the+ground+of+this+universal+offer+is+the+institution+of+Christ+in+dying.+.+.+.+For+that+of+the+truth+.+.+.+There+is+a+truth+in+it%3A+the+connection+of+those+two+extremes+must+ever+hold+true+faith+and+salvation.+But+what+is+that+to+a+reprobate%3F+He%5Bre%5D+is+the+mistak%5Be%5D.+The+voluntas+decreti+and+mandati+are+not+distinguished.+%E2%80%A6+A+man+is+bound+to+believe+that+he+ought+to+believe%2C+and+that+by+faith+he+shall+be+saved.+It+is+his+duty.+The+command+doth+not+hold+out+God%E2%80%99s+intentions%3B+otherwise+God%E2%80%99s+command+to+Abraham+concerning+sacrificing+of+his+son+.+.+.+Said+I+cannot+say+so+to+a+devil.+.+.+.+True%3B+but+reason+is%2C+that+it+is+the+revealed+will+of+God+that+devils+are+absolutely+excluded%2C+but+not+so+any+man+known+to+me.%0A%0AMr.+Calamy%E2%80%94The+difference+is+not+in+the+offer%2C+but+in+the+application.+.+.+.+That+voluntas+decreti+comes+only+in+the+application.+.+.+.+For+the+word+world+%E2%80%A6+I+grant+it+signifies+continued%2C+the+elect+sometimes%2C+but+sometimes+it+signifies+the+whole+world%2C+and+so+it+must+do+here.+.+.+.+For+this+love+he+saith+he+under+.+.+.+There+is+a+double+love%3A+general+and+special.+A+general+love+to+the+reprobate%2C+and+the+fruit+of+this%2C+a+general+offer%2C+and+general+grace%2C+and+general+reformation.%0A%0AMr.+Gillespie%E2%80%94It+is+acknowledged+the+word+world+may+suffer+another+sense%E2%80%94the+elect%2C+but+said+it+must+be+a+larger+thing+than+believers.+%E2%80%A6+A.+This+is+still+taken+for+granted%2C+which+is+to+be+proved%2C+for+I+say+it+is+very+good+sense.+God+so+loved+the+elect%2C+that+whosoever+believes+in+Him+.+.+.+The+reconciling+of+a+general+love+with+absolute+reprobation+is+not+answered.+.+.+.+The+general+offers+of+the+gospel+are+not+grounded+upon+the+secret+decree.%0A%0AMr.+Lightfoot%E2%80%94I+understand+the+word+world+in+a+middle+sense.+It+is+only+in+opposition+to+the+nation+of+the+Jews.+%E2%80%A6+For+the+universal+offer+God+intends+as+the+salvation+of+the+elect%2C+so+the+inexcusableness+of+the+wicked.%E2%80%9D%0A%0A%E2%80%94+Alexander+F.+Mitchell+and+John+Struthers%2C+Minutes+of+the+Sessions+of+the+Westminster+Assembly+of+Divines%2C+%28Edinburgh%3A+William+Blackwood+and+Sons%2C+1874%29%2C+Sess.+522%2C+22+Oct.+1645%2C+pp+152%2C+153-54%2C+155-56.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa48a82c3f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa48a82c3f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/09/george-gillespie-and-the-westminster-assemblys-debate-over-hypothetical-universalism-and-a-general-love-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Formula Consensus Helvetica of 1675 is a response to the Amyraldian errors tolerated within the French Reformed Church. The primary author of the Formula was Johann Heinrich Heidegger (pictured), whom Francis Turretin of Geneva and Lucas Gernler of Basel assisted. In this extract, they reject the Amyraldian notion of two decrees (one for the salvation of all men conditionally, and another for the salvation of the elect alone):

Canon VI: Wherefore, we can not agree with the opinion of those who teach: 1) that God, moved by philanthropy, or a kind of special love for the fallen of the human race, did, in a kind of conditioned willing, first moving of pity, as they call it, or inefficacious desire, determine the salvation of all, conditionally, i.e., if they would believe, 2) that he appointed Christ Mediator for all and each of the fallen; and 3) that, at length, certain ones whom he regarded, not simply as sinners in the first Adam, but as redeemed in the second Adam, he elected, that is, he determined graciously to bestow on these, in time, the saving gift of faith; and in this sole act election properly so called is complete.

For these and all other similar teachings are in no way insignificant deviations from the proper teaching concerning divine election; because the Scriptures do not extend unto all and each God’s purpose of showing mercy to man, but restrict it to the elect alone, the reprobate being excluded even by name, as Esau, whom God hated with an eternal hatred (Rom 9:11). The same Holy Scriptures testify that the counsel and will of God do not change, but stand immovable, and God in the, heavens does whatsoever he will (Ps 115:3; Isa 47:10); for God is infinitely removed from all that human imperfection which characterizes inefficacious affections and desires, rashness repentance and change of purpose. The appointment, also, of Christ, as Mediator, equally with the salvation of those who were given to him for a possession and an inheritance that can not be taken away, proceeds from one and the same election, and does not form the basis of election.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ad601a4a8b" data-kw="">
<blockquote><p>Disputing in his Panstrat. vol. iii. book xv. chap. iii. against Bellarmine, [Chamier] teaches that the true and determinate difference between the law of works and that of faith, is the condition of works and of faith; that is, that the law of works proposes salvation, upon condition of performing the law. But the law of faith proposes it, upon condition only of believing in Christ. Lest, however he should leave any thing unexplained, he observes, that conditions in contracts are of two kinds; some of which may be called antecedent, others consequent. He calls these antecedent, which give rise to the contract, according to the maxim, I give, that thou mayest give, as when one sells a field for a certain sum of money. But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only: so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete. This distinction that very learned divine applies to the present purpose, in the following manner: The law of works requires the fulfilling of the law as an antecedent condition, without which, not only no man can enter upon the possession of eternal life, but cannot so much as have a right to it. But the law of faith does not admit of works as a condition p 151 in this sense, but only in the other: viz. that by virtue of the life already given through faith, works are necessary, so that he who shows no works, falls from every right which he had, or rather seemed to have, on account of his external vocation; although otherwise, works are not the causes of the life to be given. Thus far Chamier: compare Tuckney in his Theological Prelections, p. 233.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, trans. Thomas Bell (Glasgow: W. Lang, 1807), 149–51.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3889c8ecc7" data-kw="">
<blockquote><p>In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons</cite>, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.”

— Henry Smith, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+respect+of+God%2C+our+election+standeth+certain+from+all+eternity%E2%80%A6+But+in+respect+of+ourselves+it+is+uncertain%2C+and+therefore+we+must+%E2%80%98strive+to+make+the+same+sure%E2%80%99+by+good+works%2C+2+Peter+1%3A10.+These+are+the+ways+to+come+to+heaven%2C+though+they+be+not+the+cause+why+we+should+come+to+heaven%3B+therefore+we+must+keep+the+way%2C+if+ever+we+mean+to+come+to+heaven%3B+for+as+we+are+ordained+to+the+end%2C+so+are+we+ordained+to+the+means+which+bring+us+to+that+end.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+In+%E2%80%98Good+Works+are+the+Way+to+Heaven%E2%80%99+in+The+Lawyer%E2%80%99s+Question%3A+In+Three+Sermons+%281595%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A108&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3889c8ecc7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3889c8ecc7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=In%20respect%20of%20God%2C%20our%20election,which%20bring%20us%20to%20that%20end&amp;text=In%20respect%20of%20God%2C%20our%20election%20standeth%20certain&amp;text=the%20means%20which%20bring%20us%20to%20that%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-de53499081" data-kw="">
<blockquote><p>In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works. What precedes in the order of administration is called the cause of what follows. For this reason, he sometimes makes eternal life a consequent of works; not because it is to be ascribed to them, but because those whom he has elected he justifies, that he may at length glorify (Rom. 8:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.21</span></figcaption>

</figure><figure class="quote" id="q-935f45ba52" data-kw="">
<blockquote><p>We do not absolutely deny, that good works are a cause of salvation, viz., an instrumental rather than an efficient one… Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<main class="wrap"><figure class="quote" id="q-b22076a49e" data-kw="">
<blockquote><p>Some have tried to argue that when the Old Testament law refers to people being “cut off” from the people of Israel, it is referring to capital punishment. This error usually arises due to confusion concerning civil punishment and excommunication in the Old Testament, with people thinking that the two were conflated. George Gillespie helpfully corrects this error when commenting on 1 Corinthians 5 and points out that it originates in the teachings of the tolerationist, Roger Williams:

Wherefore I conclude that the cutting off in the law, and especially in the ceremonial law, can be nothing else but excommunication from the Church, and communion in the holy things. Which as it is most received among our expositors, so the apostle (1 Cor. 5), does give us a hint of it. For it is plain from verses 6-8 that he alludes to the history of the Passover (Exod. 12), so when he says (verse 13), Put away from among yourselves that wicked person, he has respect to Ex. 12:19, where it is said, Whosoever eats that which is leavened, even that soul shall be cut off from the congregation of Israel. All this I conclude with a passage of Mr. Williams’ Bloody Tenet, cap. 121, where he does not acknowledge a spiritual excommunication in the Jewish Church, yet he acknowledges such a coercive power in cutting off, as has for the anti-type and parallel of it excommunication in the Christian Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Late Dialogue between a Civilian and a Divine</cite>, (London, 1644) in The Anonymous Writings of George Gillespie, ed. Chris Coldwell (Dallas TX: Naphtali Press, 2008), pp 127-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>In a series of articles on religious establishments published in the Covenanter periodical, which was edited at the time by Thomas Houston of Knockbracken, we find this brief statement as to why it is the state’s duty to submit to Christ and obey his word:

To a sincere believer in the Bible, there can be no question that the Lord Jesus Christ, in his Mediatorial character, has been exalted by the Father to the sovereignty of all worlds, and that the princes and potentates of the earth, being placed in subjection under him, are bound to yield to him an unreserved obedience. Messiah is the rightful Governor among the nations – King of kings and Lord of lords – the Prince of the kings of the earth. If this simple statement is admitted, and we see not how it can be refused, it must irresistibly follow, that the nations, as such, are bound to submit to Christ the Lord, and their rulers are indispensably required to frame their legislation on the basis of his Word, and regulate their lives according to its infallible directions. Especially are a people professedly Christian solemnly required to act from a far higher principle than a mere worldly expediency, and to set the Saviour’s glory before them in all their public deeds – in choosing their rulers, in devising or executing laws, and in regulating the measure of subjection. Should they overlook these fundamental maxims, and act in opposition to them, they will inevitably incur the Divine displeasure, and must bear the fearful consequences of rebellion against the Lord’s Anointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1831, p. 388</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>2. Nations are bound to frame their constitutions of government; to enact their laws; and to conduct the civil administration, in professed and real obedience to the Scriptures. – National acknowledgment of the Messiah’s authority is not a bare profession. “Not every one that saith, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven,” Matt. vii. 21. Christ’s titles are not mere honorary titles; he is really a king. Submission to his sceptre implies the reception of his law and obedience to its demands.

The laws of Christ are contained in the Bible, and all the laws of the Bible are Christ’s laws. Both the Old and New Testaments are his statute books. Every moral law found there, carries with it an obligation to obedience. And it is the imperative duty of all Christ’s subjects to search, each for himself, the inspired record, that he may ascertain from its pages the principles of righteousness by which his conduct ought to be governed. “Search the Scriptures; – and they are they which testify of me.” As nations are under the government of the Mediator, this obligation rests upon them as well as upon individuals.

And why should not nations seek light from the Bible? The remains of the moral law are very broken and imperfect in the natural man, even in regard to civil duties. Witness the national follies and crimes of the most enlightened pagan nations: to say nothing of the great majority of the inhabitants of those nations that either have not the Bible at all, or have only a closed Bible and who have consequently sunk into the most wretched condition of moral and social debasement. The Bible professes to be a perfect rule. It has been “given by inspiration of God, that the man of God may be perfect; thoroughly furnished unto all good works,” 2 Tim. iii. 16, 17. There is no exception made of civil or political “works.” This gracious revelation finds man in all things wanting such light as will clearly show him the will of God. This it does.

Nor are its teachings confined to the duties of personal religion and those of the domestic and other social relations. The Scriptures abound with instruction respecting matters civil and political. The historical part of the Old Testament, the prophecies, the book of Proverbs and the Psalms, are full of the richest treasures of political wisdom; while the Pentateuch contains a system of laws devised by infinite wisdom for the chosen people of God. Indeed, civil duties occupy as large a space in the Bible as they do in the actual operations of society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible Magistracy: or Christ’s Dominion over the Nations: with an Examination of the Civil Institutions of the</cite>, United States (Philadelphia, 1842), pp 47-50.</span></figcaption>

<blockquote><p>Why is it right to defend ourselves against unlawful violence?

Self-defence against unlawful violence is always legitimate. It is more than legitimate: it is a moral obligation. Our life is not our own; it belongs to God, and therefore as stewards of God’s possessions we are under obligation to preserve our own life, and the lives of others, from destruction by criminal violence. The principle that necessary self-defence is legitimate is generally upheld by the civil laws of nations.

To claim that the “Golden Rule,” or the obligation to love our neighbour, means that it is wrong to kill in an effort at self-defence is to push loving our neighbour to an absurd and fanatical extreme. The Scripture commands a person to love his neighbour as himself: that is, love for one’s neighbour is to be kept in balance with a proper love for oneself. The person who will let himself be murdered by a criminal, without attempting self-defence, loves his neighbour too much, and does not love himself enough.</p></blockquote>

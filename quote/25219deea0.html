<main class="wrap"><figure class="quote" id="q-25219deea0" data-kw="">
<blockquote><p>Whether you [Independents] do practice and observe your own rule here given with the exceptions made by you? or whether you do not much depart from it in your church-way, not yielding to mere circumstances, nor the rules the law of nature do in common dictate? As for instance, receiving the Lord’s Supper at night, contrary to the practice of the reformed Churches, standing upon that circumstance of time;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), p. 75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-389d830e47" data-kw="">
<blockquote><p>They who write on this subject with judgment and understanding, use to distinguish three sorts of modes of men’s actions that are found in religion, viz. circumstances, rites and ceremonies. Circumstances are modifications of actions, as time, place, person; or, a circumstance is any thing that accompanies an action which is not of its essence, but is used with it, relates to it, and is an accident, or adjunct of it: and it may be such, either with respect to the pysical or moral being of the action: Circumstances use to be sorted in these memorial verses: ‘Quis, quid, ubi, quibus auxiliis, cur, quomodo, quando.’ And ‘forma, figura, locus, tempus, stirps, patria, nomen.’ Circumstance is a word of larger extent than rite, and that than ceremony; a rite is the manner of going about any action (chiefly that which is public or solemn) confirmed by law or custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), section 12, p. 276</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

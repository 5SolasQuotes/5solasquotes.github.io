<main class="wrap"><figure class="quote" id="q-4bdf077cb8" data-kw="">
<blockquote><p>…therefore all who would be saved, must join to a visible independent congregation [a congregationalist’s arguments conclude]; hence no Church has title and due right to the Word and sacraments but members of such a congregation: this is the reason why men of approved piety are denied the seales of the covenant, and their children excluded from baptism and themselves debarred from the Lord’s Supper, because they are not members of your congregation; and members they cannot be, because they find no warrant from God’s Word, to swear your church-covenant, and to your [congregationalist] church-government, which is so far against the Word of God: the seals of the covenant belong to all professing believers, as God’s Word says, Acts 10:47; 8:37; 16:31-33; 1 Cor. 11:28. Whether he be a member of a particular independent Church, or not, God the Lawgiver makes not this exception, neither should man do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London: 1644), pt. 1, ch. 5, section 5, p. 83</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7304caa200" data-kw="">
<blockquote><p>7. When any member of any of the churches of their own way go from one church to another only as travelers or sojourners for the time, they are admitted to sacraments, only bringing with them letters of recommendation from their own church. Ans. to 32. q., p. 29. But when any such member comes from one of their churches to another to be admitted as a fixed member there, then he is not admitted (notwithstanding any letters of recommendation or any other testimonial or evidence whatsoever) without such a new examination as aforesaid, and as if he had never been examined nor admitted into church-society before. Ans. to 32. q. pp. 29-30; Ans. to 9. Pos., p. 62; Apology, p. 2, 7, 9, 35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice</cite>, … (London, 1644) Rathband was a Westminster divine., Ch. 3; p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“7. When any member of any of the churches of their own way go from one church to another only as travelers or sojourners for the time, they are admitted to sacraments, only bringing with them letters of recommendation from their own church. Ans. to 32. q., p. 29. But when any such member comes from one of their churches to another to be admitted as a fixed member there, then he is not admitted (notwithstanding any letters of recommendation or any other testimonial or evidence whatsoever) without such a new examination as aforesaid, and as if he had never been examined nor admitted into church-society before. Ans. to 32. q. pp. 29-30; Ans. to 9. Pos., p. 62; Apology, p. 2, 7, 9, 35.”

</figure><figure class="quote" id="q-6dc426196a" data-kw="">
<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), p. 173</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>4. For the profession itself, understand that we distinguish between that which makes a man a member of the universal Church (which must go first) and that which makes or declares a man to be a member of a particular church. And therefore we have first put down so much as is necessary to the former (largely, as being of most weight) and then put down that which is necessary to the later (briefly).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 17</span></figcaption>

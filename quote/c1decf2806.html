<main class="wrap"><figure class="quote" id="q-c1decf2806" data-kw="">
<blockquote><p>He so designates, undoubtedly, the elders who presided over discipline. For the primitive church had its senate who preserved good morals among the people, while the apostles and teachers were left free to preach. The apostle indicates this plainly enough (1 Tim. v. 17), where he specifies two kinds of presbyters. These governors, then, were not princes or praetors armed with the sword, but presbyters, excelling others in gravity, experience, authority, chosen from amidst the assembly with the church’s consent, who aided or relieved the pastors in administering discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-king.html">David King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, An Exposition and Defence of the Presbyterian Form of Church Government. In Reply to Episcopal and Independent Writers</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146</cite>, (to Evangelus), §1</span></figcaption>

<blockquote><p>…according to the Scripture phrase it is termed a ‘presbytery’. It is made up of the pastor or pastors of every congregation, together with those governing elders which labor there (not in doctrine, but) in discipline only: of which things, we have spoken before (above, Digression 1 [pp. 161-2, 170-1]).</p></blockquote>

</figure><figure class="quote" id="q-7196856abe" data-kw="">
<blockquote><p>All the officers of the New Testament both ordinary and extraordinary are designed and distinguished by their names, or compellations, as apostles, evangelists, presbyters, deacons. The extraordinary and superior have upon good reason the names of the ordinary and inferior common unto them, as the apostles are called ‘elders’ (1 Pet. 5:1). But this is not reciprocal, for the ordinary and inferior are never called by the names of the extraordinary and superior: the deacon is not called an ‘elder,’ nor the pastor by the name of the ‘apostle’ or ‘evangelist’. It is true that Barnabas is called an ‘apostle’ (Acts 14:4, 14) because he was an apostle [messenger] of Christ as Paul was. Titus and others and Epaphroditus are only called ‘apostles’ or messengers of the Church (2 Cor. 8:23; Phil. 2:25). Whence it must follow that the office of a bishop is not an office superior to the office of a pastor, since the name ‘bishop’ is common to the pastor; and that the office of a bishop and the office of a pastor are not different, but one and the same office, since the names are altogether common in all the places of the New Testament (Acts 20:28; Phil 1:1; 1 Tim. 3:2; 1 Pet. 5:1), and the Syriac Interpreter has translated the one by the other (Tit. 1:7). What reason can there be, while the officers are distinguished by their names and the names of ‘bishop’ and ‘pastor’ are common, but that the office of the bishop and elder is one and the same office; the one name signifying, sapientiae maturitatem [a maturity of wisdom], and the other Industriam curae Pastoralis [the industry of the pastoral oversight], says Beda.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy</cite>, (1641), pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-da4e78acf0" data-kw="">
<blockquote><p>It is the height of this bitter tyranny to act cruelly towards the wife by stripes or blows, which we do not read that any one among the heathen did unless he was drunk or mad. Hence the civil law [of England] permits the wife to avail herself of a divorce if she can prove that her husband has beaten her: and it gives as a reason that blows are foreign to a state of freedom, Cod. lib. 5, tit. 17, De repudiis and in Novell, Constit. 117. For no superiority whatever gives the power of coercing the inferior by blows. If two persons enter into a league of friendship on the condition that the younger shall obey the elder, and be directed in all things by his wisdom and discretion; he is bound to obedience by virtue of this contract: but if he refuse to do that, he cannot be forced to his duty by blows. The same must be said with regard to the matrimonial contract: for in this the husband and wife agree to a certain amicable fellowship in life, so that the wife is to be subject to her husband and directed by him; but as a companion, not as a slave; by advice, not by stripes. Aristotle gives this reason, because it is not ft to instil such fear into the wife, which may be injurious both to respect and love: but that servile fear which is instilled by blows is subversive of both. Neither is it fit that anyone should exercise power over another by constraint supported by no law; but that power of chastising a wife by stripes is supported by no law either divine or human. Finally add, that is not to be done which cannot be done without sin and what always derives its origin from this sin of bitterness. For although parents often chastise their children from love; yet both the experience and conscience of everyone will testify that no one proceeds to beat his wife except from anger, bitterness or hatred; all which are unlawful things and diametrically opposite to the matrimonial state. Therefore, let all bitterness be done away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of</cite>, … Colossians tr. Josiah Allport (London: Hamilton, Adams, 1831), vol. 2, on Col. 3:19, pp. 167-68</span></figcaption>

ify+that+no+one+proceeds+to+beat+his+wife+except+from+anger%2C+bitterness+or+hatred%3B+all+which+are+unlawful+things+and+diametrically+opposite+to+the+matrimonial+state.+Therefore%2C+let+all+bitterness+be+done+away.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of%2C+%E2%80%A6+Colossians+tr.+Josiah+Allport+%28London%3A+Hamilton%2C+Adams%2C+1831%29%2C+vol.+2%2C+on+Col.+3%3A19%2C+pp.+167-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda4e78acf0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da4e78acf0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ladies/#:~:text=It%20is%20the%20height%20of%20this,let%20all%20bitterness%20be%20done%20away&amp;text=It%20is%20the%20height%20of%20this%20bitter%20tyranny&amp;text=state.%20Therefore%2C%20let%20all%20bitterness%20be%20done%20away" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[T]he design of the apostle is plainly to shew, that the woman ought not to exercise any dominion over her husband, for two reasons which he urges: 1st. Because Adam was first created as the head, and then Eve, as a help meet for him. 2dly. Because the woman shewed she was more easily deceived, for being deceived first, she was the cause of deceiving her husband, who was likewise deceived (though not first) but by her means …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank (1677; 2 vols, London, 1822), i, pp 139-40, 1.8.9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7d239ae2c" data-kw="">
<blockquote><p>It is the Confession to which all ranks in these lands are bound to adhere as a part of their Covenanted uniformity. This Confession was framed in carrying into effect one principal object of the Solemn League, which was to bring the Churches in the three kingdoms to the nearest possible uniformity, in doctrine, worship, discipline, and government. Moreover, it was actually received, and solemnly recognized by the parties concerned in that federal deed, as their doctrinal standard of uniformity, to which they were bound to adhere by the oath of God. To abandon this Confession, therefore, in principle at least, so long as it cannot be shown to be unscriptural, would be to incur the charge of covenant violation.

We do not insist that the design of that League would be defeated by a mere change of statement, if the principles in the Westminster Confession were retained, provided the change of statement had that concurrence of all the Churches in Britain and Ireland, which gave their sanction to that Confession. But till this is obtained, the safest way to preserve the public faith inviolate, is to adhere to it not only in the spirit, but also in the letter of it. …

It is a Confession to which the Churches in Britain and Ireland are not only bound to adhere by solemn covenant, but it is also the basis on which there is a great probability that they will unite, when the Lord brings again Zion. Though the greater part of these Churches have never fully redeemed the pledge given by them in the Solemn League, to cleave to the Westminster Standards, as standards of uniformity to the three nations; it does not free any of them from their solemn engagements. The friends of these standards are still bound to hold them fast, and to display them as a banner to the generation, in order to remind them of their first love, and of their first works.

Nor are they left without hope that the great object of the Westminster Confession, as a standard of uniformity, will ultimately be gained. However far even the Presbyterian Churches in Britain and Ireland may have departed in administration from that Confession, it is still recognised by them in some form or other, as an explanatory standard. It seems therefore to be reserved in the providence of God as a central point, in which all the scattered sections of the Church in these lands will meet, when times of refreshing shall come from the presence of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-stevenson.html">George Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea for the Covenanted Reformation in Britain and Ireland</cite>, (3rd edn, Edinburgh: W. P. Kennedy, 1844), p. 95.</span></figcaption>

</figure><figure class="quote" id="q-dc76ba989f" data-kw="">
<blockquote><p>Zanchi: In things indifferent something is to be yielded to the weaker, and that for a time; namely, until they be taught the truth. For if after that the truth is sufficiently and clearly laide abroad unto them so as being convicted they have nothing more what they may object and yet will notwithstanding stick in doubt; sure their infirmity is not to be nourished by their dissembling with them or winking at them. For this is rather strong obstinacy then weakness; Of Redemption, ch. 17, fol. 493. Beza in a case of [the threat of] deprivation [of one’s office as minister] advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire:) We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires:) they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, p. 196</span></figcaption>

</figure><figure class="quote" id="q-dc981ba28d" data-kw="">
<blockquote><p>We deny that the pope was or can be said to be the successor of Peter, as they pretend. The reasons are: first, if he is his successor, this will be either with respect to the common and ordinary ministry of preaching the word, administering the sacraments and exercising discipline; or with respect to the special and extraordinary work of the apostleship. And yet in the former sense, succession does not belong to anyone in particular, but to all true ministers of Christ and pastors of the church in general, who on this account are everywhere called by the fathers “successors of the divine apostles” (diadochoi tōn theiōn apostolōn). While in the latter sense, no one could succeed the apostles because their office was temporary and extraordinary (to lay the foundations of the Christian church) and therefore did not admit of successors in the same office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.3</span></figcaption>

<blockquote><p>Discord is better for the advantage of piety, than dissembled discord.</p></blockquote>

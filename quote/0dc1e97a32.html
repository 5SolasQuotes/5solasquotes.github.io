<main class="wrap"><figure class="quote" id="q-0dc1e97a32" data-kw="">
<blockquote><p>The first consideration which I shall offer, as a reason why you should not be found in the way of evil instruction, is, that that there is great danger that you will embrace the errors with which you thus become acquainted. This danger results partly from the fact that men naturally love darkness rather than light. Of this fact the history of the world furnishes abundant proof; else how will you account for it, not only that men in all ages have misinterpreted the voice of God speaking to them in his works and ways, and that they have worshipped everything as God but Jehovah himself, but also that so many have shut their eyes against the broad light of revelation, and have either denied its divine authority, or else perverted it to sanction the most gross and fatal errors.

Taking for granted then this fact, it amounts to nothing less than a predisposition in the human heart to the reception of error. Suppose your bodily system was exactly predisposed to some contagious disease, would not that fact greatly increase your clanger, on being brought into contact with the elements of infection? Or suppose an individual had a strong thirst for intoxicating liquors, would not this invest with additional danger all opportunities for indulging in the use of them? Is it not equally manifest that that natural aversion to the reception of God’s truth, of which I have spoken, must be peculiarly favourable to the influence of evil instruction?

But this danger farther arises from the love of novelty, and the pride of opinion. There is something exceedingly grateful to many youthful minds, in the reflection that they have turned off from the beaten track; —that they have escaped from vulgar prejudices, and broken away from the trammels of education, and that they are giving the world a fine example of independent thought. But this spirit finds but little aliment in the way of truth; for that is a highway, and the simple and unlettered walk in it; and the way to be distinguished from the vulgar herd, is to leave this plain path, and broach some wild or wicked speculation. More or less of this spirit no doubt belongs to human nature; and though you may not hitherto have been sensible of its operation, yet if you venture into the way of evil instruction, there is great danger that you will find, not only that this spirit exists, but that it exerts a powerful influence in opening your mind to the reception of error.

Moreover, you are in danger of embracing the errors which you accustom yourselves to hear defended, from the fact that familiarity with error, as with vice, has a tendency to make you insensible of its deformity. This tendency results partly from the power of habit, and partly from the deceitful nature of sin; and it exists universally, though it must be acknowledged that it is often counteracted by the influence of circumstances. The process by which it discovers itself, needs only to be described, to be recognised by everyone as a reality. The youth who has been educated to reverence the Bible as God’s word, when he first hears it assailed by infidel cavils and scoffs, shudders at the impiety, and perhaps wonders that God suffers such a wretch to live.

He hears the same thing the second time, but with less horror than before. He hears it again and again, and at length ceases to be affected by the impiety. At no distant period, he gathers bravery enough to smile at what once made him tremble; to assent to that, which once drew from him expressions of abhorrence. At a more remote point in the process, he cordially takes the infidel by the hand, and greets him as a brother; thus, perhaps, in a little period, having travelled the whole distance from a firm belief to a total rejection of the Bible. Say, my young friends, whether all this is not perfectly natural, and easily accounted for on the principle that familiarity with error blinds the mind to its inherent odiousness. Venture not then in the way of evil instruction, lest, through the operation of the same principle, you should be the subjects of the same disastrous change.

Another consideration which renders it probable that you will embrace the errors which you hear defended, is, that, from your age and inexperience, you cannot be supposed to he properly furnished for an encounter with error. The man who, when properly armed, might stand his ground against a company of ruffians, would, if stripped of his armour, fall into their hands at the first onset. In like manner, the man who has been long accustomed to study his Bible, might find little difficulty, and be in little danger, in meeting the cavils of the enemies of truth; while he who is comparatively unacquainted with the word of God, might be easily entangled and drawn away by their sophistry.

Taking it for granted then that you have not that deep and thorough knowledge of the Bible which might more naturally be looked for in advanced life, you cannot but perceive that you are in great danger, from this circumstance, of receiving the errors which are defended in your hearing. Cavils which might be satisfactorily answered in many ways, and the fallacy of which a more thorough knowledge of the word of God might enable you instantly to detect, assume, from your ignorance, the weight of arguments; and there is danger that you will soon come to conclude that what you cannot answer, is unanswerable.

But the consideration which crowns the evidence of your danger on this subject, is, that multitudes of youth, from hearing evil instruction, actually have embraced the errors with which they have thus been made familiar. Yes, I could point you to many a young person, who thought himself safe when he ventured on this forbidden ground, and felt confident that his belief of the truth was never to be shaken, who can now speak boldly in defence of the most dangerous errors, and even pour contempt on the revelation of God. Tell me, my young friends, what there is in your circumstances which promises that the same experiment will result more favourably in respect to you. Rely on it, that ground which your curiosity may tempt you to explore, is beset with snares; if you venture among them, take heed lest they prove to you the snares of death.</p></blockquote>

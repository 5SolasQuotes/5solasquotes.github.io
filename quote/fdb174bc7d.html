<blockquote><p>V. Restoration or restitution, in the case of a lapse, or of prolonged custom in some sin, or of spiritual relapse—which can be called a kind of second regeneration and specifically a renovation (Galatians 4:19; 2 Corinthians 2:7–8). Problem I. Whether in such a case the habits were diminished, or rather only the acts impeded? Eighteen years ago we inclined to the affirmative of the latter, and we wiped away the cavils of the Remonstrant darkener against this our assertion in the Thersites Heautontimorumenos [Thersites the Self-Tormentor]. Nor did any of the most distinguished theologians who attested in letters sent to me that they had read that writing see anything heterodox in it. Problem II. Whether the habit is restored through infusion or apposition of a degree or augmentation, which happens at once and simultaneously through the practice of renewed faith and repentance; or rather gradually and successively through frequent and repeated actions? [No answer is given in the English]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-c6ac1d6124" data-kw="">
<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) L <blockquote><p>§XII. For in the State of Grace, restituted or of inchoate reparation, the man who is called is excited and vivified from the lethargy and death of sin by prevenient and preparing grace, so that he may be able to read, hear, understand and meditate on the Word of God; by which means the intellect is illuminated and the will is impelled, and is gradually prepared and disposed, so that he can obey God calling through the Word, believe, and convert himself [Acts 2:40]. Eph. 2:5: “God, even when we were dead in sins, hath quickened us together in Christ… And hath raised us up together, and made us sit together in the heavenly places, in Christ Jesus.” ch. 5:8: “For you were heretofore darkness; but now, light in the Lord. Walk then as children of the light.” v. 14: “Wherefore he saith: Arise, thou that sleepest, and arise from the dead: and Christ shall enlighten thee.” Tit. 2:11-12: “For the grace of God our Saviour hath appeared to all men; Instructing us, that, denying ungodliness and worldly desires, we should live soberly, and justly, and godly in this world.” Rev. 3:20: “Behold, I stand at the gate, and knock. If any man shall hear my voice, and open to me the door, I will come in to him, and will sup with him, and he with me.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§XII. For in the State of Grace, restituted or of inchoate reparation, the man who is called is excited and vivified from the lethargy and death of sin by prevenient and preparing grace, so that he may be able to read, hear, understand and meditate on the Word of God; by which means the intellect is illuminated and the will is impelled, and is gradually prepared and disposed, so that he can obey God calling through the Word, believe, and convert himself [Acts 2:40]. Eph. 2:5: “God, even when we were dead in sins, hath quickened us together in Christ… And hath raised us up together, and made us sit together in the heavenly places, in Christ Jesus.” ch. 5:8: “For you were heretofore darkness; but now, light in the Lord. Walk then as children of the light.” v. 14: “Wherefore he saith: Arise, thou that sleepest, and arise from the dead: and Christ shall enlighten thee.” Tit. 2:11-12: “For the grace of God our Saviour hath appeared to all men; Instructing us, that, denying ungodliness and worldly desires, we should live soberly, and justly, and godly in this world.” Rev. 3:20: “Behold, I stand at the gate, and knock. If any man shall hear my voice, and open to me the door, I will come in to him, and will sup with him, and he with me.”

— Barthold Holtzfus, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 25-26 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7XII.+For+in+the+State+of+Grace%2C+restituted+or+of+inchoate+reparation%2C+the+man+who+is+called+is+excited+and+vivified+from+the+lethargy+and+death+of+sin+by+prevenient+and+preparing+grace%2C+so+that+he+may+be+able+to+read%2C+hear%2C+understand+and+meditate+on+the+Word+of+God%3B+by+which+means+the+intellect+is+illuminated+and+the+will+is+impelled%2C+and+is+gradually+prepared+and+disposed%2C+so+that+he+can+obey+God+calling+through+the+Word%2C+believe%2C+and+convert+himself+%5BActs+2%3A40%5D.+Eph.+2%3A5%3A+%E2%80%9CGod%2C+even+when+we+were+dead+in+sins%2C+hath+quickened+us+together+in+Christ%E2%80%A6+And+hath+raised+us+up+together%2C+and+made+us+sit+together+in+the+heavenly+places%2C+in+Christ+Jesus.%E2%80%9D+ch.+5%3A8%3A+%E2%80%9CFor+you+were+heretofore+darkness%3B+but+now%2C+light+in+the+Lord.+Walk+then+as+children+of+the+light.%E2%80%9D+v.+14%3A+%E2%80%9CWherefore+he+saith%3A+Arise%2C+thou+that+sleepest%2C+and+arise+from+the+dead%3A+and+Christ+shall+enlighten+thee.%E2%80%9D+Tit.+2%3A11-12%3A+%E2%80%9CFor+the+grace+of+God+our+Saviour+hath+appeared+to+all+men%3B+Instructing+us%2C+that%2C+denying+ungodliness+and+worldly+desires%2C+we+should+live+soberly%2C+and+justly%2C+and+godly+in+this+world.%E2%80%9D+Rev.+3%3A20%3A+%E2%80%9CBehold%2C+I+stand+at+the+gate%2C+and+knock.+If+any+man+shall+hear+my+voice%2C+and+open+to+me+the+door%2C+I+will+come+in+to+him%2C+and+will+sup+with+him%2C+and+he+with+me.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+the+Free+Will+of+Man%E2%80%99+trans.+AI+by+Nosferatu+%28Frankfurt%3A+Zeitler%2C+1707%29%2C+pp.+25-26+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcbd0ebcdcd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cbd0ebcdc

<main class="wrap"><figure class="quote" id="q-363697ea87" data-kw="">
<blockquote><p>In which case the Church cannot be settled all in one day, or in one year, but must crave time, as the building of Solomon’s Temple, and of the second Temple after the Babylonian Captivity, which was not accomplished in several years. Nor can it be planted over again all at once, no more than it could be in Joshua’s days, or the Judges, or in the time of the reforming kings of Judah, until the Canaanites and other enemies be subdued. Nor can it be purged totally altogether, but gradually, least it be in hazard of a superpurgation.</p></blockquote>

<blockquote><p>XXVIII… Gathering new churches by way of separation from others, or gathering assemblies without the consent of the lawful pastors who had the charge of the people of those assemblies, is a sin and schism in all these cases following:

1. In general, when the laws, practices or persons of the church which they separate from give them no sufficient cause of a departure.

2. In general, when in the judgment of true reason, according to the notable evidence of the case, the said assemblies are likely to do more hurt than good.

3. When such assemblies are gathered in opposition to some truth which the separaters would thereby disown (e.g. infant-baptism, the lawfulness of [some] set-forms of praise or prayer, or any sound doctrine) or [they are gathered] for the profession and propagation of some heresy or error (as Antinomianism, Popery, etc.).

4. When such churches are gathered by men that have no true fitness and calling for the sacred ministry or the work which they undertake.

5. When they are gathered by the pride of the ministers that would thereby unduly set up themselves and draw away disciples after them, or by their covetousness, seeking not the good of the flock, but the fleece, not them, but theirs, not serving the Lord Jesus, but their own bellies: or when gathered, by the pride of the people that unjustly think those that they separate from [are] men unworthy of their communion, and say to them, ‘Come not near to us; we are holier than you,’ Isa. 65:5.

6. When they are gathered by a quarrelsome passion, falling out with the pastors and people whom they separate from. The parting of Paul and Barnabas [Acts 15:36-40] had some evil in it.

7. When they are gathered to encourage and strengthen a sinful faction or party, or when men separate from others for fear of being censured by such a party, as Peter did withdraw from the gentile Christians lest he should displease the erroneous Jews, Gal. 2.

8. When it is done out of a proud overvaluing of men’s own opinions, or some odd singularity whereby men cannot bear those that are not of their mind, or whereby they would fain be more conspicuous as more orthodox and wise than others.

9. When it is done mistakingly to set up some wrong course of Church government or worship (as that the people may have the power of the keys or of examining and judging all admitted members, or that Papal government or the mass may be introduced, [or for] enthusiastical disorderly talking by pretended inspiration, by ignorant uncalled men, or to introduce such traditions and superstitions as the Papists use, etc.).

10. When it is done upon a false conceit that a man’s presence with any Church that has known error or faults in doctrines or worship is guilty [of] approving them; and therefore that they must separate from all such.

11. When they separate out of an unruliness of spirit, because they will not be governed by their lawful pastors in lawful things, as time, place, order, etc. or because a minor part in elections is over-voted by the major part and cannot have their wills.

12. When they separate out of a profaneness of mind, not enduring the power of the preacher’s doctrine or the holiness and discipline of the Church, but would be licentious, while they would be called religious. All these are unlawful separations and assemblings.

13. Yet that which is unlawful as to the principle, end and manner secundum quid [‘according to that’], is not always unlawful simply and in the thing itself, for a proud, covetous, turbulent person may sinfully do a lawful thing. XXIX… When pastors by concord or magistrates by laws have settled lawful circumstances or accidents of Church order or worship, or discipline, though they be in particular but human institutions, it is sinful disobedience to violate them without necessary reason, e.g. parochial order, associations, times, places, ministers, maintenance, Scripture-translations, etc. XXX… When able, faithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gathering of Separate Churches</cite>, The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6, pp. 47-49 &amp; 51-58, 85, 100-2, 118 | When Gathering of Separate Worship Assemblies or Churches is Schismatic</span></figcaption>

<blockquote><p>It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863), pp. 278-79</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?”

— John Howe, ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863), pp. 278-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+not+enough+to+justify+such+a+choice+and+practice%2C+that+it+be+in+itself+or+simply+best%2C+but+that+it+be+best+in+present+circumstances+and+all+things+considered+that+ought+to+be+considered+in+the+present+juncture%E2%80%A6.+The+most+sacred%2C+external+act+of+duty+becomes+a+sin+when+it+excludes+that+which+is+more+a+duty+at+that+time%E2%80%A6+How+long+was+sacramental+obsignation+%5Bby+circumcision+and+the+Passover%2C+Josh.+5%3A1-12%5D+in+the+wilderness+omitted%21+How+much+more+may+attending+upon+such+an+institution+in+what+some+may+think+a+more+eligible+manner%2C+if+there+be+a+reason+that+outweighs%2C+when+not+the+substance+of+the+ordinance+is+wanting%2C+but+what+is+counted+%28perhaps+by+you%29+a+fitter+modus+%5Bmode%2C+or+way%5D%3F%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99+in+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+%26+the+Trinity%E2%80%A6+%28d.+1705%3B+Religious+Tract+Society%2C+1863%29%2C+pp.+278-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5623f461a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5623f461a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=It%20is%20not%20enough%20to%20justify,a%20fitter%20modus%20%5Bmode%2C%20or%20way&amp;text=It%20is%20not%20enough%20to%20justify%20such%20a&amp;text=by%20you%29%20a%20fitter%20modus%20%5Bmode%2C%20or%20way" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

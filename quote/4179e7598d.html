<main class="wrap"><figure class="quote" id="q-4179e7598d" data-kw="">
<blockquote><p>The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or signification. … Ceremonies are external rites and sacred accidents of the worship of God. They are not of themselves the worship of God, but concomitant adjuncts and assistants by signification, exercise, exercise, work and decorum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R, 1994), vol. 2, 11th Topic, ‘On the Law of God’, Question 24, ‘What was the end and use of the ceremonial law under the Old Testament?’, section 4 &amp; 6, pp. 146-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-6037e57a04" data-kw="">
<blockquote><p>If we compare the two Tables together as to the matter contained in them and the immediate object of each duty commanded, the duties of the First Table are greater and the duties of the Second Table lesser, the one relating more immediately, the other more mediately to religion, in which respect they express peculiarly our love to God, which is called the first and great command; For the first four commands require that which in its own nature is worship, and is in an immediate way to be given to God; but the duites required in the other six, are not properly, formally and immediately called for as parts of worship to God, though, as they are acknowledgments of Him, they may be consequentially thereto referred.</p></blockquote>

</figure><figure class="quote" id="q-886a61bd3d" data-kw="">
<blockquote><p>38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>I know that the opinions of the expositors touching these thousand years be diverse. I know how the heresy of the Chiliasts or Millenaries by Papias, authour hereof, as Eusebius recites in the 3rd book [ch. 39.12] of the Ecclesiastical History, was taken hereof. I will not here stand about to confute the opinion of others, which also would be overlong and tedious, and not of so great profit. I wil only utter my own to be weighed of the godly readers, then will I leave it free for every man to follow that thing which he shall think most agreable to the truth and profitable for the godly. And I understand plainly and simply that St. John speaks of a thousand years which ran on by continual course from the time of Christ until the last corrupting of the evangelical preaching and church of Christ. Neither am I very scrupulous in searching out the term of the supputation of these thousand years. Simply I appoint the beginning of the reckoning in the open preaching of the Gospel and what time the Word began now to be received, and was now received of the gentiles. I suppose therefore that there may be three terms or times appointed, which nevertheless shall come all to one reckoning, differing little or nothing amongst themselves or having small diversity, not passing half a year more or less. Ye may therefore, if you please, begin the supputation of the thousand years from the 33rd year of Christ’s birth, wherein Christ also ascended into heaven and Paul being called to the ministry and drawing the gentiles into the felloweship of God’s people by the preaching of God’s Word, began to restrain Satan. And you shall come to the year of our Lord, 1034, and to the bishopric of Pope Benedict IX, which after he come by unlawful means into the chair of St. Peter, as they call it, practiced art-magic and was joined in league with the Devil: of whom he was carried away also, what time he had sold his bishopric before the Pope Gregory VI… Thou wilt say then, that about that time the Devil brake loose again and seduced the people, especially by Popes. Or begin the supputation of the thousand years from that time wherein Paul, being bound for the gospel at Rome, testified that the gospel was preached throughout the world. That was about the year of our Lord, 60; from thence accompting a thousand years, you shall come to the year of our Lord, 1060, when Nicholas II was Pope, under whom it is written that the verity was diversely tempted and corrupted and that Gregory VII did then also by his crafts and enterprises trouble the whole world. Or begin the supputation from the destruction of Jerusalem, what time the Jews [were] cast off, the gentiles in great number entered and were received into the place of the Jews rejected, which was the year of our Lord 73, and thou shalt attain to the year of our Lord 1073, even to Pope Gregory VII: in the which time not a few historiographers write that the Devil himself reigned. Doubtless never man hurt godliness or more stoutly advanced impiety than did this Gregory, otherwise called Hildebrand. Of him I have spoken before in the 13th chapter. Where also I admonished you that Cardinal Benon did accompt those thousand years from the birth of the Lord and concluded [the same] in Sylvester II. It is evident therefore that the gospel has had a notable place in the world, neither has [it] been quenched for the space of a thousand years: that is to say, from the time of the apostles until the year of our Lord was reckoned 1073 or there about… … St. John assigned to Antichrist a certain number of years, to wit 666. Whereof we might understand the name of Antichrist. But therefore it follows not that the Devil was then quite loosed or the light of the Gospel utterly extinguished. For the apostle in his time, speaking of him: ‘The mystery,’ says he, ‘of iniquity now works.’ Antichrist therefore has his seeds, he has his beginning, he has his rising up, his growing and increases. But after a thousand years, he went to work most impudently and most boldly which before also had uttered his maliciousness: but now most venomously of all he spews out his poison, oppressing kings and all that speak never so little against him. We know moreover that in these thousand years past the Devil has reigned in many by murder, perjury and innumerable and unspeakeable evils. But if you consider what has been done since those thousand years, and what is done at this day: you will say those ages of the thousand years to have been golden and silver worlds and ours now for these five hundred years to be of brass, iron, lead and clay. Lactantius in the seventh book of Institutes, the 15th chapter, towards the last end of the world, says he, the state of worldly matters must needs be altered and iniquity prevailing to incline to the worse: so that these our times, in the which iniquity and mischief is grown to the highest degree, yet in comparison of that uncurable evil may be accompted fortunate and in manner golden ages. For justice shall than wear so thin, ungodliness, covetousness, wilfulness and lust shall be so common, that if there shall be then haply any good men, they shall be a pray to the wicked, and everywhere vexed of the unrighteous… By all the which our days now seem to be painted lively. But what is that, which is annexed, that the Devil must be loosed for a little season? seems this a little season which continues now five hundred years? And this place we expound so as that same in the gospel: unless those days were shortened, no flesh should be saved. For it is evidently by stories that neither the Devil, nor Antichrist has enjoyed that his kingdom long quiet. For evermore and in all ages have sprung up some holy and learned men, which being illumined and comforted of God, like Enoch and Helie [Elijah?], haue resisted the ungodly and ungodliness, and have maintained the true religion… Therefore both Satan and the Pope could enjoy these matters but a small season. For immediately after the thousand years sprang up the Waldenses which constantly impugned the Pope and his ungodliness. The Lord has raised up certain kings amongst whom be the Fridericks, German Emperors, Lewis of the house of Bauier, and many others. The Popes also have been at dissension amongst themselves whilst many have been chosen, and every one of them wil be the vicar of Christ, and so tear all that ecclesiastical body of theirs with schisms. There rise up against these preachers earnest and vehement, Wyclif, Huss, Jerome of Prague and diverse others. What is done at this day and has been now these 30 years and more against superstitions and idolatry, against the Pope, and all his clergy, the Papists themselves cry out and all parts of the world can testify. Therefore is the Devil loosed a little season. The Lord Jesus tread him under our feat shortly.</p></blockquote>

<blockquote><p>Some take these thousand years for the total time of the first coming of Christ unto His second coming, as this word thousand signifies sometimes in Scripture a certain number for an uncertain. See Ps. 91:7; 105:8; Dan. 7:10. But forasmuch as verses 7 and 8, Satan is let loose again after those thousand years, the same cannot be, as neither the opinion of some others who desire to have these thousand years end before the coming of the Antichrist. Seeing in verse 4, even during these thousand years mention is made of some who did not worship the beast nor his image, then Antichrist must also needs have been before the end of the thousand years. Therefore others begin the binding of Satan, that he would deceive the nations no more from the time that Christ, by the preaching of the Gospel and the power of His Spirit by His apostles, has brought the pagan nations in the world everywhere unto repentance; which for the most part was fulfilled about the time of the desolation of Jerusalem and the eradication of the Jews, that is, about the year 70, and end them with the time of pope Gregory VII, who was a strong instrument of the devil to bring the Antichrist’s reign to the highest, and to cause all nations to worship him who sat in the chair about the year 1070. Though some, by reason of the persecutions which Satan raised against the Christians more than two hundred and fifty years after the destruction of Jerusalem, begin these thousand years somewhat later, namely, from Constantine’s time, and continue them till about the year 1300, when the antichrist not only caused the state of Christians to decline more and more, when Boniface VIII reigned over this realm, but also the Turks and Tartars were most set on by Satan to subdue the christian nations in the East and West, and destroyed many kingdoms and Christian churches, not only in Asia, but also in Africa and Europe, as the present condition thereof shows.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Some take these thousand years for the total time of the first coming of Christ unto His second coming, as this word thousand signifies sometimes in Scripture a certain number for an uncertain. See Ps. 91:7; 105:8; Dan. 7:10. But forasmuch as verses 7 and 8, Satan is let loose again after those thousand years, the same cannot be, as neither the opinion of some others who desire to have these thousand years end before the coming of the Antichrist. Seeing in verse 4, even during these thousand years mention is made of some who did not worship the beast nor his image, then Antichrist must also needs have been before the end of the thousand years. Therefore others begin the binding of Satan, that he would deceive the nations no more from the time that Christ, by the preaching of the Gospel and the power of His Spirit by His apostles, has brought the pagan nations in the world everywhere unto repentance; which for the most part was fulfilled about the time of the desolation of Jerusalem and the eradication of the Jews, that is, about the year 70, and end them with the time of pope Gregory VII, who was a strong instrument of the devil to bring the Antichrist’s reign to the highest, and to cause all nations to worship him who sat in the chair about the year 1070. Though some, by reason of the persecutions which Satan raised against the Christians more than two hundred and fifty years after the destruction of Jerusalem, begin these thousand years somewhat later, namely, from Constantine’s time, and continue them till about the year 1300, when the antichrist not only caused the state of Christians to decline more and more, when Boniface VIII reigned over this realm, but also the Turks and Tartars were most set on by Satan to subdue the christian nations in the East and West, and destroyed many kingdoms and Christian churches, not only in Asia, but also in Africa and Europe, as the present condition thereof shows.”

— Pastmillennialism, Dutch Annotations (1637), on Rev., 20:3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+take+these+thousand+years+for+the+total+time+of+the+first+coming+of+Christ+unto+His+second+coming%2C+as+this+word+thousand+signifies+sometimes+in+Scripture+a+certain+number+for+an+uncertain.+See+Ps.+91%3A7%3B+105%3A8%3B+Dan.+7%3A10.+But+forasmuch+as+verses+7+and+8%2C+Satan+is+let+loose+again+after+those+thousand+years%2C+the+same+cannot+be%2C+as+neither+the+opinion+of+some+others+who+desire+to+have+these+thousand+years+end+before+the+coming+of+the+Antichrist.+Seeing+in+verse+4%2C+even+during+these+thousand+years+mention+is+made+of+some+who+did+not+worship+the+beast+nor+his+image%2C+then+Antichrist+must+also+needs+have+been+before+the+end+of+the+thousand+years.+Therefore+others+begin+the+binding+of+Satan%2C+that+he+would+deceive+the+nations+no+more+from+the+time+that+Christ%2C+by+the+preaching+of+the+Gospel+and+the+power+of+His+Spirit+by+His+apostles%2C+has+brought+the+pagan+nations+in+the+world+everywhere+unto+repentance%3B+which+for+the+most+part+was+fulfilled+about+the+time+of+the+desolation+of+Jerusalem+and+the+eradication+of+the+Jews%2C+that+is%2C+about+the+year+70%2C+and+end+them+with+the+time+of+pope+Gregory+VII%2C+who+was+a+strong+instrument+of+the+devil+to+bring+the+Antichrist%E2%80%99s+reign+to+the+highest%2C+and+to+cause+all+nations+to+worship+him+who+sat+in+the+chair+about+the+year+1070.+Though+some%2C+by+reason+of+the+persecutions+which+Satan+raised+against+the+Christians+more+than+two+hundred+and+fifty+years+after+the+destruction+of+Jerusalem%2C+begin+these+thousand+years+somewhat+later%2C+namely%2C+from+Constantine%E2%80%99s+time%2C+and+continue+them+till+about+the+year+1300%2C+when+the+antichrist+not+only+caused+the+state+of+Christians+to+decline+more+and+more%2C+when+Boniface+VIII+reigned+over+this+realm%2C+but+also+the+Turks+and+Tartars+were+most+set+on+by+Satan+to+subdue+the+christian+nations+in+the+East+and+West%2C+and+destroyed+many+kingdoms+and+Christian+churches%2C+not+only+in+Asia%2C+but+also+in+Africa+and+Europe%2C+as+the+present+condition+thereof+shows.%E2%80%9D%0A%0A%E2%80%94+Pastmillennialism%2C+Dutch+Annotations+%281637%29%2C+on+Rev.%2C+20%3A3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7441ac4356.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7441ac4356.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=Some%20take%20these%20thousand%20years%20for,as%20the%20present%20condition%20thereof%20shows&amp;text=Some%20take%20these%20thousand%20years%20for%20the%20total&amp;text=and%20Europe%2C%20as%20the%20present%20condition%20thereof%20shows" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8c3cdf1933" data-kw="">
<blockquote><p>When as the Devil had walked at liberty through all nations almost from the beginning of the world, and had filled the whole world with all kind of wickedness and heinous sins, at length in the coming of Christ, which had chosen to Himself a Church and much people among the gentiles, his licenciousness is bridled… he was caught I say and bound with that great chain of sincere doctrine, that he cannot range abroad at liberty as he was wont… But the time which here is compassed in the space of a thousand years, in which the Devil should be kept bound in prison, does signify a long time, and uncertan to men. In which space of time the pure doctrine of the Gospel should flourish in the world, and many men out of all nations should be taken into the eternal inheritaunce of Christ and we see that almost by the space of a thousand years after Christ some light of sincere doctrine remained in the world, at the least many did consent upon the points of Christian religion which were chief and most necessary to salvation: until at length the doctrine of Antichrist being brought in, of merits, of satisfactions, of the sacrifice of the mass and other monsters, the only foundation of faith and free justification of faith was taken away. In that whole space of time therefore, the power of Satan was bound, so long as by faith in the merits of Christ alone, the way was open for men to heaven. And we must note that Satan is said to be bound, and shut in prison, so long as he does not seduce the greatest multitude to eternal destruction…. For after that he must be loosed for a litle season, etc. When as now the pestilence of the Mahumet, and the Pope waxed strong and increased. He must be loosed for a litle time, that he may seduce the nations into idolatry, as he seduced the whole world before the birth of Christ. For after a thousand yeares whiles the Turks in the East, and the papists in the west possessed all with there dotages, we may rightly conjecture that Satan was loosed out of prison. But this evil shall not endure long, for the end of the world is at hand, and the truth of the gospel being restored again to the world, has disclosed the falsehoods of both the enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prælections upon the Sacred &amp; Holy Revelation of St. John (1573), on Rev. 20, p. 131-32 Fulke (1538-1589) was a reformed Anglican.</cite></span></figcaption>

<blockquote><p>On the positive side, contrary to the criticism of our detractors, the phrase VICARIUS FILLI DEI has been used historically as a major papal title, and possibly it was also inscribed in some papal tiaras or mitres. On the negative side, the identification of the number 666 with VICARIUS FILII DEI, cannot be exegetically supported by Revelation 13:18, because the text does not say that the meaning of 666 is to be found in the added numerical value of the letters of a name. We noted that such numerical method of interpretation is unknown in the Bible.</p></blockquote>

<blockquote><p>The Fifth Age is of the Church reverting, and Antichrist raging, until this present age when Reformation was aimed at and begun in the West, Antichristian pride was detected and the number of true believers did increase. Then Satan was let loose again, the thousand years of his binding, from the days of Constantine, being expired: then persecutions were frequent; Antichrist foamed and opened his mouth wide to devour the sheep of Jesus. But he who preserved the Woman in the wilderness is the stronger, so that the gates of Hell were not able nor shall be able to prevail against her; yea by the breath of his mouth and preaching of the Word her enemies are scattered, Antichrist is revealed and true Christians are multiplied.</p></blockquote>

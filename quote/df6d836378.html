<blockquote><p>And, first, we may advert to the fact, that not only is the Church a spiritual community, by spiritual means aiming at a spiritual end, and that the functions performed by its members, as members of the Church, are all of a spiritual character, but also, that the standing which any member occupies within the Church depends on spiritual gifts and qualifications alone. The privileges we enjoy as members of it are the result of profession and character, not of civil or worldly status. The rich and poor meet together in the house of God; and the grave itself is not a more complete leveller of all earthly distinctions than the Church.

Men get together for worship—they partake of the sacraments, they bear rule in God’s house, not because they are rich, or noble, or learned, but because they are creatures of the same God, because they have the like precious faith, because they have the graces of the Divine Spirit. It is unquestionable that this is, or ought to be, the condition and character of every true Church. No powers except those which have the express sanction of God ought to have place in it.

The temptation to break in upon this levelling process—to suffer the distinctions which the world established between the rich and the poor, the noble and the mean—to obtain a place in the Church, has but too often prevailed to the destruction of the Church’s usefulness, and to the staining of its purity. We are too apt to forget that, as members of the Church, we are all brethren, and that no kind of authority but that which Christ himself has expressly conferred is to be exercised, or ought to be retained, by any of the brethren in the same faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 31.</span></figcaption>

<blockquote><p>14. God has by nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances or accidents of this universal religion which are not themselves meet for an universal and unchangeable obligation, but [for] local, temporary and mutable [circumstances and obligations]: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin. I have often named many particulars, as: The translation of the Scripture, which to choose: the version of the Psalms in rhyme or meter, the common use of new made hymns,¹ the dividing the Scripture into chapter and verse, the words of sermons, their method, the particular text to be chosen, what chapters to read, at what hour to begin, how long to preach, in what words to pray, whether the same oft or changed, whether forestudied or not, whether written or unwritten, whether studied and written by ourselves or by others, where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? ¹ [Elsewhere Baxter speaks of, “the choice of psalms and hymns: the use of David’s are lawful and so are others: but no institution ties us to one, but leaves us to choose.” Schism Detected in Both Extremes (1684), pt. 2, pp. 5-6. This is plainly false: Ex. 15:20-21; 2 Sam. 23:1; 1 Chron. 25:1-7; 2 Chron. 29:25-30; Neh. 12:45-46; Ps. 95:2; etc. See ‘Singing of Psalms’.] Whether we be bareheaded or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit or be prostrate at prayer, etc. What distinctive garments pastors shall use, by what signs of consent and obligation men vow and swear, whether by putting the hand under the thigh [Gen. 24:2, 9; 47:29], lifting it up [Gen. 14:22; Dt. 32:40], subscribing, laying it on the Book,² kissing the Book,³ etc. What catechisms to use, with many more such. ² [See ‘On Laying One’s Hand on the Bible to Swear’.] ³ [See ‘On Trembling at the Word, Weeping before the Bible, Kissing the Stake, etc.’] God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.

15. These [things] may be called ‘worship’ in a sense subservient to God’s ordinances of worship¹ (as we worship men by putting off the hat, kneeling, bowing [Mt. 18:26; Lk. 14:10; Rev. 3:9], etc.). But if any will not call it ‘worship’, they must [then] not call it ‘false worship’, nor pretend that the controversy is any more than about the bare name. ¹ [For an explanation of this, see pp. 73-84 of Travis Fentiman, 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022).]

16. They that feign such things as these to be sinful additions and an invading of Christ’s office and denying his faithfulness, etc. condemn the Scripture that commands such determinations, and contradict the Law of Nature and the practice of all Churches on earth, and would exterminate all God’s worship, which cannot be performed without some such determinations.</p></blockquote>

</figure><figure class="quote" id="q-78aaab70d4" data-kw="">
<blockquote><p>15… As for the differences which arose about the public resolutions [in the late-1640’s], they made a division indeed in the Church, but no schism, at lest in worship (of which we speak), but only in government, except by accident in some places where presbyteries divided themselves, whereupon followed opposite ordinations, which brought in division among the people, some adhering to one minister, some to another. But I never heard that any held it unlawful to hear ministers on either side, though comparatively they judged it duty rather to hear others. By the way I wish the question about hearing of curates had never come a greater length. See below. However (as dogs, they say, gars swine ‘gree (make to agree)) by the reintroduction of prelacy [in 1661] this difference was buried, as fire under ashes.” Ministers, who had before been putting and thrusting at one another, being, by this, put all an one condition, that is, thrust all out together [in 1662, for 30% of the ministry], except those who complied with Prelacy [or rather a relatively low form of episcopacy]. These, and others whom the prelates and tey put in, occupying the room of pastors, debates arose among presbyterians, ministers and others, anent the lawfulness or unlawfulness, duty or sin of hearing them. Some pleading compliance in hearing, to prove it sinful; some pleading separation in withdrawing to prove hearing to be duty: Some pleading soundness in doctrine to prove it lawful and duty to hear, some pleading corruption in government to prove it unlawful and sinful. And though these different pleadings, accompanied with different practices, in hearing or not hearing curates, as they were called, made no schism among presbyterians. In regard, ministers, who heard and who heard not, preached sometimes privately; and people of either practice heard any of them indifferently. Yet, in these debates, some laid down principles, which, if followed out, would oblige them to hear none that were not of their mind or way, in all matters whether of judgment or practice, which were too much improven afterward. (See Dr. [Gilbert] Rule’s Rational Defence of Non-Conformity, and Mene Tekel)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“15… As for the differences which arose about the public resolutions [in the late-1640’s], they made a division indeed in the Church, but no schism, at lest in worship (of which we speak), but only in government, except by accident in some places where presbyteries divided themselves, whereupon followed opposite ordinations, which brought in division among the people, some adhering to one minister, some to another. But I never heard that any held it unlawful to hear ministers on either side, though comparatively they judged it duty rather to hear others. By the way I wish the question about hearing of curates had never come a greater length. See below. However (as dogs, they say, gars swine ‘gree (make to agree)) by the reintroduction of prelacy [in 1661] this difference was buried, as fire under ashes.” Ministers, who had before been putting and thrusting at one another, being, by this, put all an one condition, that is, thrust all out together [in 1662, for 30% of the ministry], except those who complied with Prelacy [or rather a relatively low form of episcopacy]. These, and others whom the prelates and tey put in, occupying the room of pastors, debates arose among presbyterians, ministers and others, anent the lawfulness or unlawfulness, duty or sin of hearing them. Some pleading compliance in hearing, to prove it sinful; some pleading separation in withdrawing to prove hearing to be duty: Some pleading soundness in doctrine to prove it lawful and duty to hear, some pleading corruption in government to prove it unlawful and sinful. And though these different pleadings, accompanied with different practices, in hearing or not hearing curates, as they were called, made no schism among presbyterians. In regard, ministers, who heard and who heard not, preached sometimes privately; and people of either practice heard any of them indifferently. Yet, in these debates, some laid down principles, which, if followed out, would oblige them to hear none that were not of their mind or way, in all matters whether of judgment or practice, which were too much improven afterward. (See Dr. [Gilbert] Rule’s Rational Defence of Non-Conformity, and Mene Tekel)”

— Gavin Hamilton, Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan, ([Edinburgh?], 1712), p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C15%E2%80%A6+As+for+the+differences+which+arose+about+the+public+resolutions+%5Bin+the+late-1640%E2%80%99s%5D%2C+they+made+a+division+indeed+in+the+Church%2C+but+no+schism%2C+at+lest+in+worship+%28of+which+we+speak%29%2C+but+only+in+government%2C+except+by+accident+in+some+places+where+presbyteries+divided+themselves%2C+whereupon+followed+opposite+ordinations%2C+which+brought+in+division+among+the+people%2C+some+adhering+to+one+minister%2C+some+to+another.+But+I+never+heard+that+any+held+it+unlawful+to+hear+ministers+on+either+side%2C+though+comparatively+they+judged+it+duty+rather+to+hear+others.+By+the+way+I+wish+the+question+about+hearing+of+curates+had+never+come+a+greater+length.+See+below.+However+%28as+dogs%2C+they+say%2C+gars+swine+%E2%80%98gree+%28make+to+agree%29%29+by+the+reintroduction+of+prelacy+%5Bin+1661%5D+this+difference+was+buried%2C+as+fire+under+ashes.%E2%80%9D+Ministers%2C+who+had+before+been+putting+and+thrusting+at+one+another%2C+being%2C+by+this%2C+put+all+an+one+condition%2C+that+is%2C+thrust+all+out+together+%5Bin+1662%2C+for+30%25+of+the+ministry%5D%2C+except+those+who+complied+with+Prelacy+%5Bor+rather+a+relatively+low+form+of+episcopacy%5D.+These%2C+and+others+whom+the+prelates+and+tey+put+in%2C+occupying+the+room+of+pastors%2C+debates+arose+among+presbyterians%2C+ministers+and+others%2C+anent+the+lawfulness+or+unlawfulness%2C+duty+or+sin+of+hearing+them.+Some+pleading+compliance+in+hearing%2C+to+prove+it+sinful%3B+some+pleading+separation+in+withdrawing+to+prove+hearing+to+be+duty%3A+Some+pleading+soundness+in+doctrine+to+prove+it+lawful+and+duty+to+hear%2C+some+pleading+corruption+in+government+to+prove+it+unlawful+and+sinful.+And+though+these+different+pleadings%2C+accompanied+with+different+practices%2C+in+hearing+or+not+hearing+curates%2C+as+they+were+called%2C+made+no+schism+among+presbyterians.+In+regard%2C+ministers%2C+who+heard+and+who+heard+not%2C+preached+sometimes+privately%3B+and+people+of+either+practice+heard+any+of+them+indifferently.+Yet%2C+in+these+debates%2C+some+laid+down+principles%2C+which%2C+if+followed+out%2C+would+oblige+them+to+hear+none+that+were+not+of+their+mind+or+way%2C+in+all+matters+whether+of+judgment+or+practice%2C+which+were+too+much+improven+afterward.+%28See+Dr.+%5BGilbert%5D+Rule%E2%80%99s+Rational+Defence+of+Non-Conformity%2C+and+Mene+Tekel%29%E2%80%9D%0A%0A%E2%80%94+Gavin+Hamilton%2C+Just+Reflections+upon+a+Pamphlet+entitled%2C+A+Modest+Reply+to+a+Letter+from+a+Friend+to+Mr.+John+M%E2%80%99millan%2C+%28%5BEdinburgh%3F%5D%2C+1712%29%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78aaab70d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78aaab70d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/for-occasional-hearing/#:~:text=As%20for%20the%20differences%20which%20arose,Defence%20of%20Non%2DConformity%2C%20and%20Mene%20Tekel&amp;text=As%20for%20the%20differences%20which%20arose%20about%20the&amp;text=Rule%E2%80%99s%20Rational%20Defence%20of%20Non%2DConformity%2C%20and%20Mene%20Tekel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2b43c99223" data-kw="">
<blockquote><p>Again, he [an episcopalian] argues we cannot be said to be members of a particular Church, or to hold communion with it, if we do not join in their worship, as it is established among them. This is easily answered by a plain distinction: unless we join in their established worship, as to the greatest and chief acts of it, conceditur [it is conceded]: as to all the parts of it, even to the least, negatur [I deny]. I may join with a Church in the Word and sacraments; and yet if they have a holy day or two beside the Sabbath, may forbear; yea I may, without this be a member of that Church (if they will suffer me), which all the Reformed Churches do, except the Episcopal Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., p. 257</span></figcaption>

</figure><figure class="quote" id="q-17eeef07c0" data-kw="">
<blockquote><p>We must understand that in these civil things that might be decent and fit in one country (and consequently commanded of God) which in another country is utterly undecent, and consequently forbidden. It was a great sin among the Corinthians for a woman to come into the congregation with her head uncovered, that is, without a vail to cover her whole head, 1 Cor. 11:5. In our congregations (because it is undecent) it were a sin for a woman to come so attired. In which respect, though we have oft in the New Testament mention of fasts both public and private, of sackcloth used in them, we have no mention at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Fasting &amp; Prayer, &amp; Humiliation for Sin Delivered in Sundry Sermons</cite>, ... (London, 1633), Sermon 3 (1625), pp. 50-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-ca982ba289" data-kw="">
<blockquote><p>He was tempted as Man, but He conquered as God; yea, He bids us be of good cheer, for He has overcome the world. He hungered—but He fed thousands; yea, He is the Bread that giveth life, and That is of heaven. He thirsted—but He cried, If any man thirst, let him come unto Me and drink. Yea, He promised that fountains should flow from them that believe. He was wearied, but He is the Rest of them that are weary and heavy laden. He was heavy with sleep, but He walked lightly over the sea. He rebuked the winds, He made Peter light as he began to sink. He pays tribute, but it is out of a fish; yea, He is the King of those who demanded it.

He is called a Samaritan and a demoniac;—but He saves him that came down from Jerusalem and fell among thieves; the demons acknowledge Him, and He drives out demons and sinks in the sea legions of foul spirits, and sees the Prince of the demons falling like lightning. He is stoned, but is not taken. He prays, but He hears prayer. He weeps, but He causes tears to cease. He asks where Lazarus was laid, for He was Man; but He raises Lazarus, for He was God. He is sold, and very cheap, for it is only for thirty pieces of silver; but He redeems the world, and that at a great price, for the Price was His own blood. As a sheep He is led to the slaughter, but He is the Shepherd of Israel, and now of the whole world also. As a Lamb He is silent, yet He is the Word, and is proclaimed by the Voice of one crying in the wilderness.

He is bruised and wounded, but He healeth every disease and every infirmity. He is lifted up and nailed to the Tree, but by the Tree of Life He restoreth us; yea, He saveth even the Robber crucified with Him; yea, He wrapped the visible world in darkness. He is given vinegar to drink mingled with gall. Who? He who turned the water into wine, who is the destroyer of the bitter taste, who is Sweetness and altogether desire.

He lays down His life, but He has power to take it again; and the veil is rent, for the mysterious doors of Heaven are opened; the rocks are cleft, the dead arise. He dies, but He gives life, and by His death destroys death. He is buried, but He rises again; He goes down into Hell, but He brings up the souls; He ascends to Heaven, and shall come again to judge the quick and the dead, and to put to the test such words as yours. If the one give you a starting point for your error, let the others put an end to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Theological Orations</cite>, (379), 3.20 in Nicene and Post-Nicene Fathers 2, 7: 308-09.</span></figcaption>

</figure><figure class="quote" id="q-b114ded39c" data-kw="">
<blockquote><p>Oh! it is a grievous thing for Christ to call and we to refuse his gracious calling… And thus we see how all under the gospel are called by the Word: Secondly, all under the gospel are called by the Spirit working within as well as by the Word preached without… Question 3. Whether the call of the Spirit be ineffectual or not?… Answer. All this [unquoted here, including Bible verses] is true of the effectual operation of the Holy Spirit, because that is certain and eternal; but there is a general work of the Spirit, which ends in perdition; that is, many may and do fall finally and totally into sin, and consequently into eternal destruction, in whom sometimes there has been some good motions, and general operations of the blessed Spirit; this is clear from these places, to wit, Mt. 7:22; 13:20; Heb. 6:4; 10:26; 2 Pet. 2:20. Now this general call and operation of the Holy Spirit has these degrees following: viz. First, an understanding of the Word, for the mere natural man cannot understand it, Mt. 16:23 &amp; 1 Cor. 2:14. Here observe two things, to wit, First, there are many in the places of the Gospel who hear the Word preached all the days of their lives and yet understand nothing, but remain children in understanding; now these never were made partakers so much as of common or general grace: Secondly, there are some who live under the Word, and do dogmatically understand the Word; now these must remember that knowledge is not enough, God having given them knowledge for practice’s sake, yea to know and not to obey will aggravate their punishment. Secondly, a taste of spiritual things and the heavenly gift, Heb. 6:4: this is to receive the Word with joy. Mt. 13:20, and there are few ordinary hearers, but at some time or other have these affecting motions, although for the most part the reprobate rather rejoices in the newness than in the trueness of that which he hears. Thirdly, obedience in part, forsaking some sins and doing God some service, Mk. 6:20.</p></blockquote>

o+obey+will+aggravate+their+punishment.+Secondly%2C+a+taste+of+spiritual+things+and+the+heavenly+gift%2C+Heb.+6%3A4%3A+this+is+to+receive+the+Word+with+joy.+Mt.+13%3A20%2C+and+there+are+few+ordinary+hearers%2C+but+at+some+time+or+other+have+these+affecting+motions%2C+although+for+the+most+part+the+reprobate+rather+rejoices+in+the+newness+than+in+the+trueness+of+that+which+he+hears.+Thirdly%2C+obedience+in+part%2C+forsaking+some+sins+and+doing+God+some+service%2C+Mk.+6%3A20.%E2%80%9D%0A%0A%E2%80%94+William+Prynne%2C+Canterbury%E2%80%99s+Doom%2C+73.+%E2%80%98Passages+razed+out+concerning+our+effectual+vocation%E2%80%99+in+Canterbury%E2%80%99s+Doom%2C+or+the+first+part+of+a+complete+history+of+the+commitment%2C+charge%2C+trial%2C+condemnation%2C+execution+of+William+Laud...+%28London%3A+Macock%2C+1646%29%2C+pp.+344-45&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb114ded39c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b114ded39c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-calling/#:~:text=Oh%21%20it%20is%20a%20grievous%20thing,doing%20God%20some%20service%2C%20Mk.%206%3A20&amp;text=Oh%21%20it%20is%20a%20grievous%20thing%20for%20Christ&amp;text=sins%20and%20doing%20God%20some%20service%2C%20Mk.%206%3A20" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other.” [Historical Theology, vol. 2, p. 333] And it is but natural that this should be so. If Christ was to save an elect race, gradually called out of the world of humanity in the course of centuries, it became necessary for God to exercise forbearance, to check the course of evil, to promote the development of the natural powers of man, to keep alive within the hearts of men a desire for civil righteousness, for external morality and good order in society, and to shower untold blessings upon mankind in general. Dr. [Charles] Hodge expresses it thus: ‘It is very plain that any plan designed to secure the salvation of an elect portion of a race propagated by generation and living in association, as is the case with mankind, cannot secure its end without greatly affecting, for better or for worse, the character and destiny of all the rest of the race not elected.’ He quotes Dr. [Robert] Candlish to the effect that ‘the entire history of the human race, from the apostasy to the final judgment, is a dispensation of forbearance in respect to the reprobate, in which many blessings, physical and moral, affecting their characters and destinies forever, accrue even to the heathen, and many more to the educated and refined citizens of Christian communities. These come to them through the mediation of Christ, and coming to them now, must have been designed for them from the beginning.’ [The Atonement, pp. 358 ff.] These general blessings of mankind, indirectly resulting from the atoning work of Christ, were not only foreseen by God, but designed by Him as blessings for all concerned. It is perfectly true, of course, that the design of God in the work of Christ pertained primarily and directly, not to the temporal well-being of men in general, but to the redemption of the elect; but secondarily and indirectly it also included the natural blessings bestowed on mankind indiscriminately. All that the natural man receives other than curse and death is an indirect result of the redemptive work of Christ. [Cf Turretin, Opera, Locus XIV, Q. XIV, par. XI; Witsius, De Verbonden, B. II, Kap. 9, s. 4; Cunningham, Hist. Theol. II, p. 332; Symington, Atonement and Intercession, p. 255; Bavinck, Geref. Dogm. III, p. 535; Vos, Ger. Dogm. III, p. 150.]</p></blockquote>

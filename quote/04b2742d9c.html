<blockquote><p>THESIS 29: And indeed the statutes of Moses in whatever way they possess the law, they possess the common law, obligating either by a common reason or by analogy, and thus it is necessary to preserve either the laws or their analogy, just as the jurists teach regarding their own laws.

THESIS 30: But this analogy is only mutable in the circumstances, not in the foundation of reason or in its substance. Accordingly, whoever civilly by the common law is liable to death penalty according to the law of Moses, likewise the same person must be considered liable to the death penalty in our time because there is a single and immutable rationale of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, trans. Todd M. Rester, ed. Andrew M. McGinnis (1593; Grand Rapids, 2015), p. 34.</span></figcaption>

<blockquote><p>6. Not everything in what is called a worship service must be worship.¹ The material presence of things or actions do not therein make them formally worship (2 Chron. 6:13; 20:21-23; Neh. 8:4; Acts 20:7-11). While generally speaking a church ought to keep within ‘Principles for the Use of Indifferent Things in Worship’, as that is what is found in the Word, yet, again, there is no necessary rule that all worship must be continuous. ¹ See historic reformed writers affirm: ‘Not Everything in what is called a Worship Service must be Worship’. The Reformed in the Post-Reformation sometimes held a monetary offering to be indifferent and able to be prudently done in the worship service,¹ even in the Church of Scotland.² The Westminster Assembly on a fast day filled with worship took a collection for maimed soldiers at the end.³ Westminster, allowing for the view and practice expressed, said in her Directory for the Public Worship of God, ‘Celebration of the Communion’: “The collection for the poor is so to be ordered, that no part of the public worship be thereby hindered.” The same might be said for children’s church. ¹ At the Reformation the collection of money (and possibly other things) was frequently moved from being with the offering of the Mass to after the Lord’s Supper, and was designated for the poor. On the continent it was often done as a part of the service, either at the dismissal, or just before: Hughes O. Old, The Patristic Roots of Reformed Worship (Zurich: Theologischer Verlag Zurich, 1975), pp. 28, 46, 49, 53-54, 63, 184, 310. In the Anglican Church it was done at the Lord’s Supper; see the reform made by Cranmer, illustrating his thought, in Horton Davies, Worship &amp; Theology in England: from Cranmer to Hooker, 1534-1603 (Princeton University Press, 1973), p. 188. Even a paradigmatic separatist congregation in Amsterdam, pastored by an English puritan turned separatist, had a similar practice: Ibid, p. 339. The partially conforming puritan, Nicholas Bownd, though against a collection in the service due to disturbances, yet testifies of the practice in his context: Bownd, Sabbathum Veteris et Novi Testamenti: or The True Doctrine of the Sabbath, ed. Chris Coldwell (Naphtali Press &amp; Reformation Heritage Books, 2015), pp. 353-55. The presbyterian and independent ministers’ request to the Anglican Church at the Savoy Conference (1661) shows what was happening and is consistent with pragmatic reasons: that the “Collection for the poor may be better made at or a little before the departing of the communicants.” The Grand Debate between the most reverend Bishops &amp; the Presbyterian Divines appointed by His Sacred Majesty as Commissioners for the Review &amp; Alteration of the Book of Common Prayer... (London, 1661), ‘Exceptions’, p. 15 ² William McMillan documents the collection often being taken when coming to sit at the Lord’s Table, or while there: The Worship of the Scottish Reformed Church, 1550-1638... (London: Clarke, 1931) ch. 18, pp. 220-21; Frederick W. McNally, The Westminster Directory, its Origin &amp; Significance, PhD diss. (University of Edinburgh, 1958), pp. 325-27 ³ John Lightfoot, Journal of the Proceedings of the Assembly of Divines, John R. Pitman (London: 1824) in The Whole Works of John Lightfoot, vol. 13, Oct. 17, 1643, p. 19 Thomas Cartwright (d. 1603) was a father of presbyterianism and puritanism in the late-1500’s and a partial-conformist to the Anglican Church government and worship. Over things he did not agree with therein, the chief political advisor to Queen Elizabeth was appealed to by Edward Dering (d. 1576), another presbyterian partial-conformist, to exhort Cartwright “to use Christian liberty and to bear with the time[s].”¹ That is, if something is not impious or of itself immoral (such as children’s church is not), with sufficient justification it may be done as part of one’s liberty in Christian life, though it be in a worship service and may be considered as worship by others. See this puritan principle of partial conformity soundly theologically set forth and defended.² ¹ Peter Lake, Moderate Puritans &amp; the Elizabethean Church (Cambridge University Press, 1982), p. 19 ² See Fentiman’s quote under ‘Not Everything in what is called a Worship Service must be Worship’, the book by English, Partially Conforming Puritans, A Refutation of the Errors of Separatists (1644; RBO, 2025) and the page at large, ‘On Occasional &amp; Principled Partial Conformity without Sin, or Moderate Puritanism’.</p></blockquote>

-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=6.%20Not%20everything%20in%20what%20is,Conformity%20without%20Sin%2C%20or%20Moderate%20Puritanism&amp;text=6.%20Not%20everything%20in%20what%20is%20called%20a&amp;text=Principled%20Partial%20Conformity%20without%20Sin%2C%20or%20Moderate%20Puritanism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But why was circumcision on the eighth day, if not because, after the seventh day of the sabbath, the Lord rose on Sunday, the Lord’s Day? So then, the resurrection of Christ—which indeed happened on the third day after his passion, and on the eighth day in a seven-day week—that is what circumcises us. Listen to the exhortation of the apostle to those circumcised by the true rock: If then you have risen with Christ, seek the things that are above, where Christ is, seated on God’s right; savor the things that are above, not the things on earth (Col 3:1–2). He is speaking to the circumcised; Christ has risen; he has rid you of the desires of the flesh, rid you of evil lusts, rid you of the superfluity you were born with and the much worse extras you have added by bad lives; circumcised with rock, why do you still savor the earth?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Gospel of John 1-40</cite>, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 30.5, p. 500.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But why was circumcision on the eighth day, if not because, after the seventh day of the sabbath, the Lord rose on Sunday, the Lord’s Day? So then, the resurrection of Christ—which indeed happened on the third day after his passion, and on the eighth day in a seven-day week—that is what circumcises us. Listen to the exhortation of the apostle to those circumcised by the true rock: If then you have risen with Christ, seek the things that are above, where Christ is, seated on God’s right; savor the things that are above, not the things on earth (Col 3:1–2). He is speaking to the circumcised; Christ has risen; he has rid you of the desires of the flesh, rid you of evil lusts, rid you of the superfluity you were born with and the much worse extras you have added by bad lives; circumcised with rock, why do you still savor the earth?”

— Augustine of Hippo, Homilies on the Gospel of John 1-40, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 30.5, p. 500.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+why+was+circumcision+on+the+eighth+day%2C+if+not+because%2C+after+the+seventh+day+of+the+sabbath%2C+the+Lord+rose+on+Sunday%2C+the+Lord%E2%80%99s+Day%3F+So+then%2C+the+resurrection+of+Christ%E2%80%94which+indeed+happened+on+the+third+day+after+his+passion%2C+and+on+the+eighth+day+in+a+seven-day+week%E2%80%94that+is+what+circumcises+us.+Listen+to+the+exhortation+of+the+apostle+to+those+circumcised+by+the+true+rock%3A+If+then+you+have+risen+with+Christ%2C+seek+the+things+that+are+above%2C+where+Christ+is%2C+seated+on+God%E2%80%99s+right%3B+savor+the+things+that+are+above%2C+not+the+things+on+earth+%28Col+3%3A1%E2%80%932%29.+He+is+speaking+to+the+circumcised%3B+Christ+has+risen%3B+he+has+rid+you+of+the+desires+of+the+flesh%2C+rid+you+of+evil+lusts%2C+rid+you+of+the+superfluity+you+were+born+with+and+the+much+worse+extras+you+have+added+by+bad+lives%3B+circumcised+with+rock%2C+why+do+you+still+savor+the+earth%3F%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Homilies+on+the+Gospel+of+John+1-40%2C+%28c.+406-20%29%2C+trans.+Edmund+Hill%2C+ed.+Allan+D.+Fitzgerald%2C+The+Works+of+Saint+Augustine%3A+A+Translation+for+the+21st+Century%2C+Volume+12+%28Hyde+Park+NY%3A+New+City+Press%2C+2009%29%2C+30.5%2C+p.+500.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd79402f22b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d79402f22b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/01/09/augustine-of-hippo-on-circumcision-and-the-lords-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The first remark which we would make for these words is, that, while a “Sabbath is made for man,” we nowhere read of a Sabbath made for devils. What would the spirits shut up in darkness and in misery give for a weekly Sabbath – a weekly rest – a weekly cessation of misery – a weakly trust from the attacks of the elements of their agony? Truly they would find it no difficulty to “count their Sabbath their rest – a delight.” (Is. lviii. 13.) We would never hear of them being weary of it, or saying, “Would God it were over!”

If that “worm which dieth not” were to slumber for one period out of seven – were those “fires which are not quenched” to be extinguished during one part of the time out of seven – were conscience, with its lash of scorpions, driven back and kept at a distance, so that a weekly rest, a strange Sabbath, might be formed for those to whom, as matters are, there belongeth nothing but “a fearful looking for of vengeance and fiery indignation” – we are quite prepared to see that this would be a boon for which they would scrupulously avoid any line of conduct which would cause the removal.

And from what would thus, in such circumstances, be the actings of those who are shut up in hopeless despair, we, respited and reprieved sinners, may, in solemn and trembling awe, receive a most important lesson. For if, concerning the unearthly supposition which we have made, such a gift would be received with a wild and ecstatic joy, as a periodic gleam of peace, breaking up the monotony of the agony and the despair of the damned, with how much greater joy and rejoicing ought we to receive the return of our Christian Sabbath? For (to speak for a moment longer of this imagination about the condemned) their Sabbath – their rest – would be infinite less valuable than ours.

Their Sabbath, when completed, would throw them full again into the lap of all their misery – misery unmitigated, and to be thus eternally returned to, deriving almost an increased poignancy from its temporary cessation. Their worm would again receive them to the uncontrolled reign of his six days’ malice, augmented (shall we say?) by the temporary release of his victims; and the consuming fire would again blaze forth (shall we say?) with forced redoubled by its temporary suppression. The last hour of supposed Sabbath, as it rang their rest away, would be the returning knell of their spiritual death, obtrusively reminding them, by its regular recurrence, that for them there was no beam of hope – “that hope that comes to all.”

How different the Christian Sabbath given to man! It is designed as the means of saving him from his unbroken eternity of death. It is intended to perpetuate itself for ever. It is intended to lead man where all is rest and all is Sabbath. And oh! If such greater powers belong to it – if such greater gifts are wrapt up in it than in that awful supposition we have made – and if, stinted and mean and meagre as the gift of the day of rest to devils would be, they would nevertheless receive it with a joy and a gladness inconceivable – how ought we to be ready to “count it a delight – the holy of the Lord, and honourable?” (Is. lviii. 13.) “This is the day which the Lord hath made; in it will we rejoice and be glad.” (Ps. cxviii.)</p></blockquote>

<blockquote><p>But the sun has the highest, best and most burningly glorious characteristics of all.” But there are a whole lotta good things it can’t do, which others can; the moon is more elegant, the stars sparkling, the cool wind refreshing and waddling baby skunks are really cute. When there’s no Christian liberty judgmentalism is the norm. Hypocrisies become glaring; straining at gnats is glorified while camels get swallowed. One can’t use the sacred lingo except in approving ways (otherwise it hurts the group’s ideals, image and cause, which is tantamount to sacrilege). With a bit of time the ideals of the leader are basically the ideals of the group. The very epitomy of the most desirable balance of this best spiritual life is the leader; his godly characteristics are not just a pattern in the church, but the mold. If the leaders don’t see it this way, most of the people do. He doesn’t seem to have any faults; he never mentions any (except for petty faults hardly considered sins). Any other balance than his is seen as less godly or good. The reason why the expectations never end is because he (or they) are trying to mold you to be like him, or them. The rising leaders are replicas of him, or try to be; you notice similar lingo, mannerisms, choices, imaging, etc. He is pleased they are following the best way (his). The elders always support his ideas. He has persuaded his closer colleagues of his same principles (distinctives). They are either his adoring fans or the same indistinguishable front with him. If you’re not fully on board with all these choices you probably feel like a bit of a second class citizen, passed over, inferior or a sandbag. What do you make of the Holy Spirit’s words in Eccl. 7:16: “Be not righteous over much; neither make thyself over wise: why shouldest thou destroy thyself?” They have only ever referenced this verse in a diminuitive way. . Pressure to do what You’re Not Comfortable with Manipulation is a near-universal characteristic of cultic groups, but it’s not most basic. Why do persons manipulate? To get you to do something you’re not comfortable with. You see all the fronted reasons they put forth, but they don’t add up. Why all the pressure? They won’t reveal their real reasons, but why not? If you knew them, you wouldn’t do it. They don’t see natural boundaries (Lk. 11:5-7) themselves and their view of you doesn’t take natural boundaries or your conscience into account (otherwise known as ‘respect’), because they are blinded by their principles. Hence they don’t believe you have a right to these boundaries. That is why the teeth of the bear-trap only dig deeper and further in. The only justification you need is, “I’m not comfortable with that.” You are not to do things apart from your faith that it’s right and with a sure conscience before the Lord: “Whatsoever is not of faith is sin,” (Rom. 14:23). For them to pressure you, or counsel, instruct or command you to do it anyway, without satisfying your reasons and conscience to your satisfaction, is to pressure you to sin, which is sinful of them. If you give your reasons and they minimize or dismiss them without satisfying them, and still pressure you, whatever they want you to do (especially if it means stepping into what may be a bear-trap), do not do it. If this is a pattern of their behavior, you are talking to a cultic person or cult leaders. If they won’t listen to you but give you the most spiritual reasons for doing what you’re not comfortable with, quoting Scriptures, citing Church authority, the elders’ great wisdom, etc. etc. you are being brainwashed and now know how and why most people around you can go along with this. The likely reason they won’t give you straight-forward satisfying reasons is because they are keeping from you not only the real reasons, but what will occur if you comply (which you can be sure you will not be comfortable with). They may speak softly, humbly and seek your agreement beforehand; if you backout, you had agreed to it, and their proceedings are legitimized. Don’t trust people that won’t tell you what they’re doing (especially when they won’t send you ahead of time an outline of what is to be “discussed” at the meeting). If they can have witnesses, but you can’t (“We just want to visit with you alone;” “Sorry but that’s not how we do things;” “There’s no need for that”), you already have years of psychological friendship with abusers, and your default inclination is to stay with them. If they are always asking you to accommodate and compromise with them, but they never accomodate you, you are already cooperating with and on the path of “equity rescuing” (see the Intro above). If you provide terms upon which you can safely communicate and interact with them, and they dismiss this, still claiming you are obliged to do something you are not comfortable with, they are telling you expressly: “We are a cult.</p></blockquote>

tion is a near-universal characteristic of cultic groups, but it’s not most basic. Why do persons manipulate? To get you to do something you’re not comfortable with. You see all the fronted reasons they put forth, but they don’t add up. Why all the pressure? They won’t reveal their real reasons, but why not? If you knew them, you wouldn’t do it. They don’t see natural boundaries (Lk. 11:5-7) themselves and their view of you doesn’t take natural boundaries or your conscience into account (otherwise known as ‘respect’), because they are blinded by their principles. Hence they don’t believe you have a right to these boundaries. That is why the teeth of the bear-trap only dig deeper and further in. The only justification you need is, “I’m not comfortable with that.” You are not to do things apart from your faith that it’s right and with a sure conscience before the Lord: “Whatsoever is not of faith is sin,” (Rom. 14:23). For them to pressure you, or counsel, instruct or command you to do it anyway, without satisfying your reasons and conscience to your satisfaction, is to pressure you to sin, which is sinful of them. If you give your reasons and they minimize or dismiss them without satisfying them, and still pressure you, whatever they want you to do (especially if it means stepping into what may be a bear-trap), do not do it. If this is a pattern of their behavior, you are talking to a cultic person or cult leaders. If they won’t listen to you but give you the most spiritual reasons for doing what you’re not comfortable with, quoting Scriptures, citing Church authority, the elders’ great wisdom, etc. etc. you are being brainwashed and now know how and why most people around you can go along with this. The likely reason they won’t give you straight-forward satisfying reasons is because they are keeping from you not only the real reasons, but what will occur if you comply (which you can be sure you will not be comfortable with). They may speak softly, humbly and seek your agreement beforehand; if you backout, you had agreed to it, and their proceedings are legitimized. Don’t trust people that won’t tell you what they’re doing (especially when they won’t send you ahead of time an outline of what is to be “discussed” at the meeting). If they can have witnesses, but you can’t (“We just want to visit with you alone;” “Sorry but that’s not how we do things;” “There’s no need for that”), you already have years of psychological friendship with abusers, and your default inclination is to stay with them. If they are always asking you to accommodate and compromise with them, but they never accomodate you, you are already cooperating with and on the path of “equity rescuing” (see the Intro above). If you provide terms upon which you can safely communicate and interact with them, and they dismiss this, still claiming you are obliged to do something you are not comfortable with, they are telling you expressly: “We are a cult.”

ccl.+7%3A16%3A+%E2%80%9CBe+not+righteous+over+much%3B+neither+make+thyself+over+wise%3A+why+shouldest+thou+destroy+thyself%3F%E2%80%9D+They+have+only+ever+referenced+this+verse+in+a+diminuitive+way.+.+Pressure+to+do+what+You%E2%80%99re+Not+Comfortable+with+Manipulation+is+a+near-universal+characteristic+of+cultic+groups%2C+but+it%E2%80%99s+not+most+basic.+Why+do+persons+manipulate%3F+To+get+you+to+do+something+you%E2%80%99re+not+comfortable+with.+You+see+all+the+fronted+reasons+they+put+forth%2C+but+they+don%E2%80%99t+add+up.+Why+all+the+pressure%3F+They+won%E2%80%99t+reveal+their+real+reasons%2C+but+why+not%3F+If+you+knew+them%2C+you+wouldn%E2%80%99t+do+it.+They+don%E2%80%99t+see+natural+boundaries+%28Lk.+11%3A5-7%29+themselves+and+their+view+of+you+doesn%E2%80%99t+take+natural+boundaries+or+your+conscience+into+account+%28otherwise+known+as+%E2%80%98respect%E2%80%99%29%2C+because+they+are+blinded+by+their+principles.+Hence+they+don%E2%80%99t+believe+you+have+a+right+to+these+boundaries.+That+is+why+the+teeth+of+the+bear-trap+only+dig+deeper+and+further+in.+The+only+justification+you+need+is%2C+%E2%80%9CI%E2%80%99m+not+comfortable+with+that.%E2%80%9D+You+are+not+to+do+things+apart+from+your+faith+that+it%E2%80%99s+right+and+with+a+sure+conscience+before+the+Lord%3A+%E2%80%9CWhatsoever+is+not+of+faith+is+sin%2C%E2%80%9D+%28Rom.+14%3A23%29.+For+them+to+pressure+you%2C+or+counsel%2C+instruct+or+command+you+to+do+it+anyway%2C+without+satisfying+your+reasons+and+conscience+to+your+satisfaction%2C+is+to+pressure+you+to+sin%2C+which+is+sinful+of+them.+If+you+give+your+reasons+and+they+minimize+or+dismiss+them+without+satisfying+them%2C+and+still+pressure+you%2C+whatever+they+want+you+to+do+%28especially+if+it+means+stepping+into+what+may+be+a+bear-trap%29%2C+do+not+do+it.+If+this+is+a+pattern+of+their+behavior%2C+you+are+talking+to+a+cultic+person+or+cult+leaders.+If+they+won%E2%80%99t+listen+to+you+but+give+you+the+most+spiritual+reasons+for+doing+what+you%E2%80%99re+not+comfortable+with%2C+quoting+Scriptures%2C+citing+Church+authority%2C+the+elders%E2%80%99+great+wisdom%2C+etc.+etc.+you+are+being+brainwashed+and+now+know+how+and+why+most+people+around+you+can+go+along+with+this.+The+likely+reason+they+won%E2%80%99t+give+you+straight-forward+satisfying+reasons+is+because+they+are+keeping+from+you+not+only+the+real+reasons%2C+but+what+will+occur+if+you+comply+%28which+you+can+be+sure+you+will+not+be+comfortable+with%29.+They+may+speak+softly%2C+humbly+and+seek+your+agreement+beforehand%3B+if+you+backout%2C+you+had+agreed+to+it%2C+and+their+proceedings+are+legitimized.+Don%E2%80%99t+trust+people+that+won%E2%80%99t+tell+you+what+they%E2%80%99re+doing+%28especially+when+they+won%E2%80%99t+send+you+ahead+of+time+an+outline+of+what+is+to+be+%E2%80%9Cdiscussed%E2%80%9D+at+the+meeting%29.+If+they+can+have+witnesses%2C+but+you+can%E2%80%99t+%28%E2%80%9CWe+just+want+to+visit+with+you+alone%3B%E2%80%9D+%E2%80%9CSorry+but+that%E2%80%99s+not+how+we+do+things%3B%E2%80%9D+%E2%80%9CThere%E2%80%99s+no+need+for+that%E2%80%9D%29%2C+you+already+have+years+of+psychological+friendship+with+abusers%2C+and+your+default+inclination+is+to+stay+with+them.+If+they+are+always+asking+you+to+accommodate+and+compromise+with+them%2C+but+they+never+accomodate+you%2C+you+are+already+cooperating+with+and+on+the+path+of+%E2%80%9Cequity+rescuing%E2%80%9D+%28see+the+Intro+above%29.+If+you+provide+terms+upon+which+you+can+safely+communicate+and+interact+with+them%2C+and+they+dismiss+this%2C+still+claiming+you+are+obliged+to+do+something+you+are+not+comfortable+with%2C+they+are+telling+you+expressly%3A+%E2%80%9CWe+are+a+cult.%E2%80%9D%0A%0A%E2%80%94+Reformed+Books+Online%2C+Cults+and+Spiritual+Legalism%2C+Spiritual+Legalism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F815a30f56e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/815a30f56e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cu

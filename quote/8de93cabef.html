<blockquote><p>Whether will these [Separatist] men allow one Christian to sing a psalm alone by himself, methinks the texts and examples mentioned, together with Jam. 5:13… are so plain as no rational man can deny it; But if one may, then the Church may. There is no act of worship which any member of the Church is bound to perform, but the Church is bound to perform; but on the contrary it is not true that what worship the Church does perform, a member of Church can, or may; For instance for the first part, meditation needs no organ of the body, and therefore I leave that. But does a member of the Church pray, so does the whole Church: does he read the Scriptures? so they are read in the Church; does he fast and pray? so does the Church; does he sing a psalm? so does the Church; But it is not true on the contrary, as appears in the sacraments, preaching, discipline, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined</cite>, … (London: 1652), pp. 35-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cac7503f0" data-kw="">
<blockquote><p>When the worship of God, in its purity and simplicity, is the object of our esteem and love, ’tis the effect of a spiritual frame of soul. During the Levitical dispensation, the service of God was performed with pomp and luster, suitable to the Church in its minority, when faith did need the assistance of the senses: But now the Church is come to mature age, and brought to nearer communion with God, the gaudy allurements of sense are taken away. Men are naturally under the dominion of sense; of this there is the most clear and palpable proof in the heathen world, that would rather worship visible idols than the true invisible God. ‘Tis a certain indication of men’s carnal minds, that they are pleased with carnal service, that lavishly runs out in formalities, which by sympathy works upon them. This affects the eye, and is far more easy than spiritual, inward worship that issues from the strength of the soul and is performed with attention and ardency. This is very disparaging to the nature of God; for it proceeds from the conceiving of Him to be like themselves (who are not heavenly and spiritual) to be pleased with an earthly bodily service. The introducing theatrical ceremonies into the service of God, is directly opposite to the simplicity of the Gospel. Whatever pretenses are made, that they set a gloss upon the plainness of Christian worship and make it more amiable and venerable, they are like the artificial painting of natural beauty that corrupts and does not commend it. The productions of human minds are imperfect at first, and are polished and arrive to perfection by degrees: But divine institutions are complete in their kind at first, and the more they recede from their original, [the more] they lose of their purity and perfection. How acceptable those parts of worship (not chosen and commanded by God) are we may clearly understand by considering that the enjoining such new rites, is a tacit presumption that the reason of man knows better how God should be honored than Himself does; and how unprofitable they are to us, is evident: for being used without his warrant and promise, we cannot expect the conveyance of his grace, and obtaining his favor by them. Only spiritual religion, the inward reality, is of value in his esteem. When the understanding is spiritually enlightened, it esteems the simplicity of Gospel-worship to be its true beauty: ‘Tis like the nakedness of Paradise, the indication of the unstained purity of our first parents in that state. ‘Tis true, in the Worship of God, we are to glorify Him with our bodies, to behave ourselves in such a manner, as may express reverence and excite affection; but the joining human devices upon that pretense, is the snare of conscience and has been fatal to the peace of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Perfection, Unfolded &amp; Enforced from 2 Cor. 7:1</cite>, … (London, 1699), ch. 10, pp. 310-32</span></figcaption>

</figure><figure class="quote" id="q-a2708ddae5" data-kw="">
<blockquote><p>My experience after two decades both at the local level and institutional level is this: for Southern Baptists image is everything. There is nothing and no one they will not sacrifice on the altar of their image. But it’s not just a commitment; it’s embedded in the culture itself. When image is everything, a culture of fear follows, so that anyone who does not match up with that image is considered a threat. As we’ve seen in the last couple of years, the SBC has been plagued with covering up sin to protect its image. But this occurs at the local church level as well. When there is sin in the leadership, the impulse is to cover it up to protect the image rather than being transparent with the church. Southern Baptist pastors often tell their congregations, “Just trust us,” and “Don’t gossip,” which results in a church incapable of acting when they suspect sin in the leadership. Moreover, they have little recourse to an external ecclesiastical authority to hold the leadership accountable… I can no longer go along with Southern Baptists who pride themselves on a type of independence that locks out effective external accountability. Nor can I continue ignoring the spiritual abuse that so many have suffered as a consequence. In short, when image is everything, the cross is eclipsed. Ironically, this does not image the humility of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-barrett.html">Matthew Barrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘I am leaving the SBC and becoming Anglican’</cite>, (2025) at Anselm House</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“My experience after two decades both at the local level and institutional level is this: for Southern Baptists image is everything. There is nothing and no one they will not sacrifice on the altar of their image. But it’s not just a commitment; it’s embedded in the culture itself. When image is everything, a culture of fear follows, so that anyone who does not match up with that image is considered a threat. As we’ve seen in the last couple of years, the SBC has been plagued with covering up sin to protect its image. But this occurs at the local church level as well. When there is sin in the leadership, the impulse is to cover it up to protect the image rather than being transparent with the church. Southern Baptist pastors often tell their congregations, “Just trust us,” and “Don’t gossip,” which results in a church incapable of acting when they suspect sin in the leadership. Moreover, they have little recourse to an external ecclesiastical authority to hold the leadership accountable… I can no longer go along with Southern Baptists who pride themselves on a type of independence that locks out effective external accountability. Nor can I continue ignoring the spiritual abuse that so many have suffered as a consequence. In short, when image is everything, the cross is eclipsed. Ironically, this does not image the humility of Christ.”

— Matthew Barrett, ‘I am leaving the SBC and becoming Anglican’ (2025) at Anselm House">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMy+experience+after+two+decades+both+at+the+local+level+and+institutional+level+is+this%3A+for+Southern+Baptists+image+is+everything.+There+is+nothing+and+no+one+they+will+not+sacrifice+on+the+altar+of+their+image.+But+it%E2%80%99s+not+just+a+commitment%3B+it%E2%80%99s+embedded+in+the+culture+itself.+When+image+is+everything%2C+a+culture+of+fear+follows%2C+so+that+anyone+who+does+not+match+up+with+that+image+is+considered+a+threat.+As+we%E2%80%99ve+seen+in+the+last+couple+of+years%2C+the+SBC+has+been+plagued+with+covering+up+sin+to+protect+its+image.+But+this+occurs+at+the+local+church+level+as+well.+When+there+is+sin+in+the+leadership%2C+the+impulse+is+to+cover+it+up+to+protect+the+image+rather+than+being+transparent+with+the+church.+Southern+Baptist+pastors+often+tell+their+congregations%2C+%E2%80%9CJust+trust+us%2C%E2%80%9D+and+%E2%80%9CDon%E2%80%99t+gossip%2C%E2%80%9D+which+results+in+a+church+incapable+of+acting+when+they+suspect+sin+in+the+leadership.+Moreover%2C+they+have+little+recourse+to+an+external+ecclesiastical+authority+to+hold+the+leadership+accountable%E2%80%A6+I+can+no+longer+go+along+with+Southern+Baptists+who+pride+themselves+on+a+type+of+independence+that+locks+out+effective+external+accountability.+Nor+can+I+continue+ignoring+the+spiritual+abuse+that+so+many+have+suffered+as+a+consequence.+In+short%2C+when+image+is+everything%2C+the+cross+is+eclipsed.+Ironically%2C+this+does+not+image+the+humility+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Matthew+Barrett%2C+%E2%80%98I+am+leaving+the+SBC+and+becoming+Anglican%E2%80%99+%282025%29+at+Anselm+House&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa2708ddae5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a2708ddae5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cu

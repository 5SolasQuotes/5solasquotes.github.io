<main class="wrap"><figure class="quote" id="q-f3000814d5" data-kw="">
<blockquote><p>1. IT [social covenanting] was expressly commanded under the Old Testament dispensation, Psalm lxxvi. 11. “Vow, and pay unto the LORD your God.” It behoves those, who deny its obligation in New Testament times, to prove that it was not, in its nature, a moral duty, but belonged to the ceremonial law, or judicial policy of the Jews. But this I presume, will not be easily done. If it was a type, where is its antitype? What peculiarity was there, in the circumstances of the Jews, rendering it expedient for them, to bind themselves to serve the Lord, while Christians are exempted from every such obligation?

IT seems to be the bent of the present generation, to get rid of all the obligations contained in the Old Testament. These deistical Christians (if I may be allowed the expression) resemble the children of old, who spoke half in the language of Canaan, and half in the language of Ashdod. But the Old and New Testament ought to be considered as the two Statute-books of heaven. All the Statutes contained in the former book, remain binding upon the conscience, if not repealed in the latter, either by express precept, necessary deduction, or approved example. Therefore, before the doctrine of covenanting be rejected, it ought to be proved, that it has been abrogated by the authority of that divine Legislator who first appointed it. It would be but reasonable to allow us the same privilege, in quoting the statutes of heaven, that every lawyer has in referring to acts of Parliament. Though these were made in the reign of Alfred the Great, and thirty folio volumes intervened between that in which these acts are contained, and the one in which those of the present age are recorded, yet, if they are not repealed by some subsequent act, they remain obligatory on the nation. By these the most important suits will be decided. Why should we deny the same authority to the unrepealed statutes of the King of nations?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-b-wylie.html">Samuel B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The obligation of covenants. A discourse</cite>, (Glasgow, 1803), pp 21-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b937c11fbb" data-kw="">
<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy</cite>, … (London: Simmons, 1681) | pt. 1, ch. 3, pp. 23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-d27615bfc7" data-kw="">
<blockquote><p>And hereunto divines and casuists give their concurrence; among them one that is resolute both for monarchy and lineal succession [of royalty], thus expresses his judgment, both for seeking of right and justice from a usurper (whom he calls a tyrant, in regard of an unjust title, not in respect of tyranical oppression [only]) and for obeying his commands. First, that subjects may lawfully seek justice of him…¹ ¹ ‘Dicendum est, licite subditos ab eo (qui•y rannus jure et titulo est) jus petere, quia quamvis jus et titulum non habeat, respublica tamen tacite consemit in hoc ut civibus ipsi tyranno, facto, non jure subditis, jus dicat, ac si esset competens judex et legitimus superior’… Juan Azor, Moral Institutions [d. 1603; Hierat, 1608], pt. 2, bk. 11, ch. 5 [col. 1675]. ‘Non peceat subditus tyranni, qui dominium et jurisdictionem alicujus di•ionis usurpavit, petendo ab eo justitiae administrationem, etc. Si quidem dat operem ut qui pe••at jurisdictionem usurpando, non peccet etiam justitiae administrationem praetermittendo;’ Martin de Azpilcueta Navarro, Manual de Confessores [c. 1557], ch. 1•, n. 41.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lawfulness of Obeying the Present Government</cite>, … (London, 1649), p. 6</span></figcaption>

eunto%20divines%20and%20casuists%20give%20their%20concurrence&amp;text=de%20Confessores%20%5Bc.%201557%5D%2C%20ch.%201%E2%80%A2%2C%20n.%2041" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And yet we conceive another case… wherein this submission to a new power may be called legal. For the end of all law and government is to preserve our persons and estates; and they who are in supremacy of power have power to preserve or destroy both if they please; and therefore have as great a power over our laws, which are less then our lives. So soon as one supreme power is expelled by another, law, life and estate fall all into the hands of the succeeding power; and what it does not actually take away, stands in effect as deriving from it; and if that supreme power make a sanction for our obedience to it (as always is immediately done) then we may say our submission is legal, or else the supreme power cannot make a law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 31</span></figcaption>

<blockquote><p>XXIX. Though I here tell you once for all that I justify not all that I can thus bear with, yet we can submit by peaceable silence to many abuses in a Church which we dare not subscribe to and approve, and use also passive obedience where active is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London, 1689), ch. 2, p. 16</span></figcaption>

<blockquote><p>I returned, and saw under the sun, that the race is not to the swift, nor the battle to the strong, neither yet bread to the wise, nor yet riches to men of understanding, nor yet favour to men of skill; but time and chance happeneth to them all.” – Eccl. 9:11 Wettstein, Gernler &amp; Buxtorf – 6. Providence in A Syllabus of Controversies in Religion which come between the Orthodox Churches &amp; whatever other Adversaries, for material for the regular disputations… customarily held in the theological school of the academy at Basil (Basil, 1662), pp. 19-21 . 1700’s Hottinger, Johann J. – A Theological Exercitation on the Immediate Operation of God in the Soul of Man (Zurich, 1714) 54 pp. . . Latin Book 1600’s Rutherford, Samuel – A Scholastic Disputation on Divine Providence… (Edinburgh, 1649) 620 pp. ToC English ToC . . Historical Theology On the 1500’s-1600’s Article Matava, R.J. – ‘A Sketch of the Controversy de auxiliis‘ in Journal of Jesuit Studies (Apr, 2020) Abstract: “In the 16th century, the Dominicans and the Jesuits engaged in a polarized theological debate about how God can move the human will in a way that neither compromises human free choice nor makes God the author of moral evil. This debate, called the “controversy de auxiliis,” was never resolved. In 1607, Pope Paul V decreed that neither side was heretical and forbade further publishing on the issue without his explicit permission. This article explains the main theological points of the various Dominican and Jesuit actors, the human factors that contributed to the debate…</p></blockquote>

<blockquote><p>It is asked: Does fortune reign, according to the Arminians? They deny it; we prove that fortune dominates in everything, according to them. … 5. Because Prov. 16:33: “The lot is cast into the lap, but its every decision is from Jehovah.” But that is false, for the decision of the lot, and its determination, so that it be white rather than black, is either from the hand apprehending the lot, or from the lots themselves, or from God, or from fortune. Not from the hand, because the bare contact is of itself blind, nor is it directed by any light or instinct, so that it apprehends this lot rather than that one. Not from the lots themselves, because the whole question is about the lots; for they are of themselves determinable and indifferent. Nor is the decision from God, because the adversaries deny that God determines second contingent causes; and they teach that He concurs with them by a universal concourse indifferent and determinable, from which neither is the apprehension of the white lot, rather than the black. Therefore, it is from fortune alone, or from mere and absolute contingency, by which contingent causes, loosed from all predetermining action of God, and notwithstanding all action of God, can act or not act; and this certainly is a cause superior to God, which is not ruled by God, and is blind fortune itself. Because if it is fortune, it is not providence; and if it is providence, it is not fortune.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668) | ch. 2, On God, Title 5, Will of God, on Lk. 21:18, “But not a hair of your head will perish.”, pp. 140-41</span></figcaption>

</figure><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will">

<blockquote><p>[We say no:] 3. Because God denied this effectual influence to Adam not willing to have it; and therefore there was here a virtual and interpretative demerit of Adam, although not formal–because in the same instant of time in which God denied this actual influence, Adam freely willed to lack it, and by this very fact, that he sinned the first sin, he interpretatively willed to lack that predetermining grace, which if he had had, he would have devoutly avoided the first sin. Nor do we deem it absurd for the lack of predetermining grace, and the culpable demerit of that lack, to coexist at the same time, although the lack is prior in the order of nature to the demerit–which I acknowledge to be a mystery of our theology not to be scrutinized.</p></blockquote>

<blockquote><p>XXX. These and many similar points [discussed above on Romanism generally] are elaborated at length by Louis de Molina in his Concord of Free Will with the Gifts of Grace, quest. 14, disp. 26. He first asserts that God concurs with secondary causes in their operations and effects in such a way that just as the secondary cause immediately elicits its operation and produces its term or effect, so God immediately influences with it in the same operation and produces the term or effect through that operation or action. Secondly, he asserts that when God concurs with secondary causes, He influences as a universal cause with an indifferent influence towards various actions and effects. This general influence is determined to specific kinds of actions and effects by the particular influence of the secondary causes, which varies according to the nature of each in acting. Just as the influence of the sun, which is also universal, is determined by the influence of a man to produce a human being, and by the influence of a horse to produce a horse. If the cause is free, it is in its power to influence in such a way that this action rather than that one is produced, such as willing rather than not willing or walking rather than sitting, and this effect rather than that one, namely this artifact rather than another. Or it may even suspend its influence entirely so that there is no action at all. Thirdly, he asserts that the influence of God through universal concurrence is not sufficient for the production of any effect without the particular influence of the secondary cause by which it is determined, nor is the particular influence of the secondary cause sufficient without the influence of God through universal concurrence by which it is assisted, which, according to the ordinary law, He never denies. These two influences mutually depend on each other to exist in nature. Indeed, there are not two actions but one numerically, which as it comes from God influencing in this way is called universal concurrence, but as it comes from the secondary cause, for example from fire causing heat, is called the concurrence or influence of the fire. This action is specified not because it is from God through universal concurrence but because it is from the fire with God cooperating through its particular power. XXXI. The doctors who hold this explanation of divine concurrence think they can easily show how such concurrence can be reconciled with the freedom of human actions. For since two kinds of freedom are usually attributed to the will—one concerning the exercise of the act and the other concerning its specification—this divine concurrence, as explained, prejudices neither. Not the former, which concerns the exercise, since this concurrence does not impose the necessity of acting on the will. For the will does not act because God acts but rather conversely, God acts because the will acts, although they both begin to act at the same moment in time and nature. Scholastic terms express this by saying that the will acts prior in nature to God, not by priority of the instant in which but of the order from which. XXXII. Although the will can do nothing at all without God concurring, according to the law established by God when He created it free, that concurrence is always available to it because God willed and decreed from eternity to concur with every work of the free will when it determines itself to act. Nevertheless, the will is equally free concerning the specification of its act. For that the will acts well or badly, avoids or seeks this rather than that, does not proceed from any power of divine concurrence but from the proper determination of the will, which freely uses the divine concurrence, indifferent in itself, to produce an action of this rather than that kind.</p></blockquote>

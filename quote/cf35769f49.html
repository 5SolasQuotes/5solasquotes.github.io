<main class="wrap"><figure class="quote" id="q-cf35769f49" data-kw="">
<blockquote><p>In the manner of justifying, the two covenants (law and gospel) are locked in frontal combat. This is because the gospel justifies through grace through faith, not works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Samuel Rutherford: Arminianism: A Systematic and Theological Response</cite>, ed. Chad Van Dixhoorn, trans. David C. Noe (Reformation Heritage Books, 2026), 1:554.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08d6a514fe" data-kw="Faith alone">
<blockquote><p>Man is justified by faith without works; therefore by faith alone. The reason of the consequence is manifest because there are not more modes of justifying than these two—by faith and by works. Thus, one being removed, the other must not only necessarily be left, but also left alone. Otherwise the enumeration would not be legitimate. … Now why would the apostle so often and so expressly institute an antithesis between faith and works in this matter, if works could concur with faith in any way to the act of justification? Would he not in this particular have occasioned believers to err by removing works absolutely and simply from it, if they contribute anything towards it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/trent.html">Trent</a></span></div>

</figure><figure class="quote" id="q-7cb199e3ab" data-kw="Forensic">
<blockquote><p>The Hebrew word to which the Greek dikaioun answers and the Latin justificare, is used in two ways in the Scriptures—properly and improperly. Properly the verb is forensic, put for “to absolve” anyone in a trial or “to hold” and to declare “just”; as opposed to the verb “to condemn” and “to accuse” (Ex. 23:7; Dt. 25:1; Prov. 17:15; Lk. 18:14; Rom. 3–5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.1.4</span></figcaption>

</figure><figure class="quote" id="q-e8d111f8eb" data-kw="">
<blockquote><p>…so the Gospel may be taught in catechism to children, Dt. 6:6-7; 2 Tim. 3:15; Ex. 12:26-27; Gen. 18:19; Prov. 22:6, because there is a necessity they be saved by hearing, Rom. 10:14; 1 Cor. 1:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London: 1646), ch. 23, p. 520</span></figcaption>

</figure><figure class="quote" id="q-b86bb291ee" data-kw="">
<blockquote><p>The Reformation doctrine of justification helps us to see that our salvation is the work of Christ for us. It also delivers us from a life of doubt and fear that causes us to wonder how God could possibly love sinners like us. It shows us that we have peace with God objectively because Christ has satisfied the demands of God for us, and it shows us subjectively because we can know confidently that by faith in Christ we are right with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-robert-godfrey.html">W. Robert Godfrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tabletalk</cite>, April 2004, p. 18</span></figcaption>

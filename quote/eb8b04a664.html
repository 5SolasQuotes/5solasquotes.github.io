<blockquote><p>Where are now the seven churches in the Lesser Asia? and where are many of those churches that were planted by the apostle of the Gentiles? Alas! their candlestick has been long ago removed out of its place, and the delusions of Mahomet prevail in those places where once the pure doctrines of the gospel were preached.</p></blockquote>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

</figure><figure class="quote" id="q-f7e72e2760" data-kw="">
<blockquote><p>But perhaps there will not be wanting those who will furnish the [example of] the authority of the Turkish [Islamic] emperor over his subjects. I should wish these to have their answer in a single word: an empire of that description does not deserve to be called either kingly or human, but wholly barbarous, tyrannical, uncivilized and detestable, especially because whereas the other monarchies and empires, to however many faults they may have been subject, were still instruments suitable for the preservation of human society, it is obvious that on the contrary this Turkish tyranny is an awful scourge of God by means of which God in accordance with his just judgment threatens this world with its final ruin and overthrow.

Therefore, if there are men to be found today who are counsellors to kings so that these may fashion an example and an image of their rule from that source, I proclaim with a clear and loud voice that those Turks should be deemed the public enemies of humankind and should be cast out in banishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), pp 147-48.</span></figcaption>

</figure><figure class="quote" id="q-ae492c950e" data-kw="">
<blockquote><p>If I shall speak something of the Mahometish religion, I think the truth of the Christian religion will appear so much the more; for when black and white are laid together, the white carrieth the greater estimation and glory with it. And beside, Mahomet himself testifieth of Christ to be a great prophet of God, and a great worker of miracles; and that the same Jesus Christ was born of the virgin Mary, that he lived without sin among men, that he was a prophet, and more than a prophet, and that he ascended into the heavens. And therefore he reproveth the Jews, for that they would not believe him to be born of a virgin. But, on the other side, because he would not have Christ to bear credit above him, he disliked that he should be called or reputed the Son of God. But beside, the testimony of all the former prophets of the world, both Jews and Gentiles, as is afore shewed, do all teach that he should be the Son of God.

Suidas doth moreover confute this false prophet, who reporteth in his History that the Pharisees at Jerusalem called a council to find out the father of Jesus; they enjoined certain women to search his mother; the women affirmed they found her a virgin; then was it recorded in the famous register book of the temple, Jesus the Son of God, and of Mary the virgin. This proveth, not only that the mother of Jesus was a virgin (which Mahomet truly held), but also that Jesus was the Son of God, which Mahomet alloweth not. And indeed Mahomet’s religion is a patched religion, mixed partly with Judaism, partly with Gentilism, partly with Papism, partly with Christianism, being subtilely contrived for the erecting of the same, and to bring followers after him, whereof shall be spoken more hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Arrow Against Atheism and Irreligion</cite>, (1593) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 404-05.</span></figcaption>

for+the+erecting+of+the+same%2C+and+to+bring+followers+after+him%2C+whereof+shall+be+spoken+more+hereafter.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+God%E2%80%99s+Arrow+Against+Atheism+and+Irreligion%2C+%281593%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A+404-05.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae492c950e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae492c950e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/18/henry-smith-on-islams-denial-of-the-son-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8358fa4afc" data-kw="">
<blockquote><p>For the church to be able to proclaim this Gospel in all its richness and freedom, it was necessary for the church to distantiate herself from Judaism. A Gospel so rich created a people of God that could no longer be contained within the boundaries of one nation and country.

In the death of Christ all that which is typical and prophetic, priest and sacrifice, law and shadow, even Israel herself finds its fulfilment. The cross of Christ reconciles all things — God and humanity, heaven and earth, Jew and Gentile, Barbarian and Scythian, man and woman, slave and free.

On Pentecost, the New Testament church is born as an independent community, independent of temple and altar, priest and sacrifice, independent even of the visible appearance and physical presence of Jesus himself in whom the disciples had hitherto found their unity. From this point on they would no longer know him according to the flesh. His departure was their gain. Leaving them in body, he in truth came nearer to them in his divinity, majesty, grace, and Spirit. Through his Spirit he makes his dwelling among them and never leaves them. No matter how small and insignificant it thus appeared, this church was truly catholic, heir of the future, proclaimer of a joy destined for all creatures.

However, the catholicity of the early church was soon severely tested. Jesus had restricted his own preaching and, during his sojourn on earth, that of his disciples, to the lost sheep of Israel. The first congregations in Judea, Galilee, and Samaria were Jewish. Soon the apostle Paul, already on his first missionary journey, established Christian churches of Gentile believers. This development brought about a collision with the Jewish exclusivism that was still very much present in the church and from which the apostle Peter had been set free by a special revelation. When the judaizing tendency became popular, a conflict was inevitable and the young Christian church faced its first dangerous crisis.

Paul recognized the absolute seriousness of this struggle. It was a struggle about the catholicity of the church, about freedom in Christ, about the universal significance of the Cross, about the richness of God’s grace, about justification by faith alone apart from the works of the law. Was there to be a schism at the beginning, was the exclusivism of the false brothers to triumph over Pauline catholicity? It was precisely in this catholicity that Paul, in his letters, gloried as the mystery of God — “the Gentiles are heirs together with Israel, members together of one body, and sharers together in the promise in Christ Jesus” (Eph. 3:6). We know that thanks to the unanimous decision of the apostles the unity and catholicity of the Church was saved at the Council of Jerusalem.</p></blockquote>

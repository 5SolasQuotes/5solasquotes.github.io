<blockquote><p>He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you… ‘My son, my child, give me your heart.’ Open to Me, your God, your Savior; for my head has been ‘filled with the dew’ of divine wrath, ‘and my locks with the drops’ of fearful affronts ‘for thy sake:’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Addresses to Children Concerning Salvation</cite>, (Torwood Press, 2013) | Two Short Catechisms Mutually Connected (Edinburgh: 1769), Appendix: “An Address to the Rising Generation”, pp. 9-15</span></figcaption>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee.

4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost.

5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John</cite>, ... (d. 1563), ch. 3, p. 50 Bale was an Anglican reformer.</span></figcaption>

</figure><figure class="quote" id="q-b6c88927fa" data-kw="">
<blockquote><p>Let us care for nothing but to get Christ, and let Christ be the end of our faith and works, and then let Christ alone for bringing us to life, heaven, and happiness. Let us by faith make way for Christ to come into our hearts to be our Prophet, Priest, King, and Shepherd, that we may receive Him offering Himself, and then He will make way for us to God, heaven and eternal happiness.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-c915a21c1a" data-kw="">
<blockquote><p>(5) This lamentation of Christ over impenitent Jerusalem teaches us also that man’s ruin is from himself? If after all Christ’s gracious invitations, all his unwearied forbearances, all his bitter and salt tears, Jerusalem will stil persist in her rebellious contempt of his gracious offers, how inexcusable is her sin, and inevitable her ruin? What will prevail upon her, if Christ’s tears and entreaties will not prevail? What can save her, if her Redemer’s grace and mercy save her not? What is it that keeps evangelic sinners from being saved? is it any defect in the object, or its revelation? is it mere simple ignorance, or impotence in the subject? No; but it is wilfull blindness and impotence: they shut their eyes and will not see; they bolt their hearts and will not open to Christ, who knocks at the door of the soul by many gracious invitations of his Gospel and Spirit. And do not such deservedly perish, who electively embrace their own ruin, and wilfully reject the things that belong to their peace, Mt. 23:37?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger</cite>, (London: Widdowes, 1679), bk. 1, ch. 9, pp. 68-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-f0de67ec8a" data-kw="">
<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Words of Advice to Young Men delivered in Two Sermons</cite>, … (London: Parkhurst, 1668), sermon 1, sect. 5, pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

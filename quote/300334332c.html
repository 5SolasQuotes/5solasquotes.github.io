<main class="wrap"><figure class="quote" id="q-300334332c" data-kw="">
<blockquote><p>Imperfect and unsatisfactory as this survey necessarily is, it is enough to prove not only that the Scriptures teach the divinity of Christ, but that Christianity as a religion consists in the love, worship, and service of the Lord Jesus, whose creatures we are, and to whom we belong by the still dearer relation of those whom He hath purchased with his own precious blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 7, “The Divinity of Christ”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Consider therefore, his infinite condescension, grace, and love herein. Why all this towards you? Does he stand in need of you? Have you deserved it at his hands? Did you love him first? Cannot he be happy and blessed without you? Has he any design upon you, that he is so earnest in calling you unto him? Alas! it is nothing but the overflowing of mercy, compassion, and grace, that moves and acts him herein.</p></blockquote>

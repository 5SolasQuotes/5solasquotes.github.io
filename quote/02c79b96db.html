</figure><figure class="quote" id="q-76622747c4" data-kw="">
<blockquote><p>Although certain ordinations of the apostles (which referred to the rites and circumstances of divine worship) were variable and instituted only for a time (as the sanction of not eating blood and of things strangled [Acts 15:20]; concerning the woman’s head being covered and the man’s being uncovered when they prophesy [1 Cor. 11:4, 5]) because there was a special cause and reason for them and (this ceasing) the institution itself ought to cease also; still there were others invariable and of perpetual observance in the church, none of which were founded upon any special occasion to last only for a time by which they might be rendered temporary…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, The Law of God, 14th Question: The Lord’s Day</cite>, p. 95</span></figcaption>

</figure><figure class="quote" id="q-22852c9cde" data-kw="">
<blockquote><p>For the past forty years NT scholars have been divided over the text of 1 Cor 11.2–16. Some see this pericope as addressing the issue of head coverings, while others see the issue as one of hairstyles. Although Stefan Lösch was the first to advocate the case for long flowing hairstyles, credit for starting this enduring controversy must be given to Abel Isaksson. This article investigates Isaksson’s claim for the hairstyle thesis and concludes that a study of the verb κατακαλυπτω will permit a translation only of textile head coverings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Meaning of κατακαλυπτω [covered] and κατα κεϕαλης εχων [hanging down from the head] in 1 Corinthians 11.2–16’ Ref New Testament Studies, vol. 53, issue 4 (Oct. 2007)</cite>, pp. 502-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“For the past forty years NT scholars have been divided over the text of 1 Cor 11.2–16. Some see this pericope as addressing the issue of head coverings, while others see the issue as one of hairstyles. Although Stefan Lösch was the first to advocate the case for long flowing hairstyles, credit for starting this enduring controversy must be given to Abel Isaksson. This article investigates Isaksson’s claim for the hairstyle thesis and concludes that a study of the verb κατακαλυπτω will permit a translation only of textile head coverings.”

— Preston T. Massey, ‘The Meaning of κατακαλυπτω [covered] and κατα κεϕαλης εχων [hanging down from the head] in 1 Corinthians 11.2–16’ Ref New Testament Studies, vol. 53, issue 4 (Oct. 2007), pp. 502-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+past+forty+years+NT+scholars+have+been+divided+over+the+text+of+1+Cor+11.2%E2%80%9316.+Some+see+this+pericope+as+addressing+the+issue+of+head+coverings%2C+while+others+see+the+issue+as+one+of+hairstyles.+Although+Stefan+L%C3%B6sch+was+the+first+to+advocate+the+case+for+long+flowing+hairstyles%2C+credit+for+starting+this+enduring+controversy+must+be+given+to+Abel+Isaksson.+This+article+investigates+Isaksson%E2%80%99s+claim+for+the+hairstyle+thesis+and+concludes+that+a+study+of+the+verb+%CE%BA%CE%B1%CF%84%CE%B1%CE%BA%CE%B1%CE%BB%CF%85%CF%80%CF%84%CF%89+will+permit+a+translation+only+of+textile+head+coverings.%E2%80%9D%0A%0A%E2%80%94+Preston+T.+Massey%2C+%E2%80%98The+Meaning+of+%CE%BA%CE%B1%CF%84%CE%B1%CE%BA%CE%B1%CE%BB%CF%85%CF%80%CF%84%CF%89+%5Bcovered%5D+and+%CE%BA%CE%B1%CF%84%CE%B1+%CE%BA%CE%B5%CF%95%CE%B1%CE%BB%CE%B7%CF%82+%CE%B5%CF%87%CF%89%CE%BD+%5Bhanging+down+from+the+head%5D+in+1+Corinthians+11.2%E2%80%9316%E2%80%99+Ref+New+Testament+Studies%2C+vol.+53%2C+issue+4+%28Oct.+2007%29%2C+pp.+502-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22852c9cde.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/22852c9cde.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=For%20the%20past%20forty%20years%20NT,translation%20only%20of%20textile%20head%20coverings." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Faith is man’s response to God’s elective purpose. God’s choice of men is election; men’s choice of God is faith. In election God gives His promises, and by faith men receive them.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bca1995867" data-kw="">
<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 80</span></figcaption>

</figure><figure class="quote" id="q-a1ab80edcc" data-kw="">
<blockquote><p>The Lord Jesus is very pitiful, and of tender mercy. He does not regard the quantity of faith, but the quality: He does not measure its degree, but its truth. He will not break any bruised reed, nor quench any smoking flax. He will never let it be said that any perished at the foot of the cross. &quot;Him that cometh unto Me,&quot; He says, &quot;I will in no wise cast out.&quot; (John 6:37.) Yes! Though a man&#x27;s faith be no bigger than a grain of mustard seed, if it only brings him to Christ, and enables him to touch the hem of His garment, he shall be saved,—saved as surely as the oldest saint in paradise,—saved as completely and eternally as Peter, or John, or Paul. There are degrees in our sanctification. In our justification there are none.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holiness</cite>, ch. “Assurance”, p. 171</span></figcaption>

</figure><figure class="quote" id="q-cb098ede78" data-kw="">
<blockquote><p>True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits (Eph. 2:7–9; Rom. 3:24–25; Gal. 2:16; Acts 10:43).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 21</span></figcaption>

</figure><figure class="quote" id="q-763c635995" data-kw="">
<blockquote><p>It is not great faith, but true faith, that saves; and the salvation lies not in the faith, but in the Christ in whom faith trusts. Faith as a grain of mustard seed will bring salvation. It is not the measure of faith, but the sincerity of faith, which is the point to be considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, p. 55</span></figcaption>

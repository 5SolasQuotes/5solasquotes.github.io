<main class="wrap"><figure class="quote" id="q-1d651cbde2" data-kw="">
<blockquote><p>Peter clearly insinuates that all who have received the Holy Ghost are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals; and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer, when he goes to another visible congregation than his own, that faith giveth him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does, as a condition notify this faith, and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), ch. 4, section 5, pp. 195-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

nk">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8424af3a24" data-kw="">
<blockquote><p>Do you think that the Supper of the Lord ought to be celebrated in any other place than in the common and public congregation? Answer: This was a custom in the beginning of the old Church, that the sacrament should be sent by deacons to the sick that were absent from the public meeting, that is to say, at that time that the mysteries were celebrated of the rest in that meeting, because it was meet that those whom one disease did let [prevent] to be present in body, should be accompted as if they were present: neither do I doubt but that that thing brought great comfort to those that were sick, the which custom I would very gladly [wish it] were restored. But whether it be meet to be celebrated to the sick at that time when the Supper of the Lord is not ministred in the Church, of this I greatly doubt. … Notwithstanding I do acknowledge that in this case it is somewhat diverse. For although it were very meet that these mysteries throughout [the] whole [of] Christendom, albeit in diverse places, yet notwithstanding daily also if it were possible, or at least upon appointed and set days were celebrated, which should profit very much to the witnessing of that same mutual fellowship and consolation in Christ: notwithstanding forasmuch as neither of both can be obtained for many just and necessary causes it seems, I know not in what sort to be contrary to the institution of the Supper of the Lord, that all the rest of the Church omitting it, some one house extraordinarily should celebrate those mysteries. Moreover, unless that were done amongst all those that were sick, how shall the suspicion of partiality in respecting of persons be shunned? Now if the Supper of the Lord be to be ministered amongst all that are sick, let pastors see by what means the profanation thereof may be avoided and how they may satisfy and undergo so great labors. The custom therefore of certain [persons] do nothing at all [to] move me, although that it be very ancient, because the matter is to be judged not by examples, but by reasons… But if a man think that he can shun all these inconveniences, and think that those mysteries may be ministred to a sick man in the congregration, he requiring it, upon these conditions I would not be against this custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Other Part of Christian Questions &amp; Answers, which is concerning the Sacraments</cite>, Question 242, ‘Of the Celebration of the Supper of the Lord in Private Houses besides the Time of the Ecclesiastical Meeting’ in The Other Part of Christian Questions &amp; Answers, which is Concerning the Sacraments (London, 1580), no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-c14575093b" data-kw="">
<blockquote><p>But as public baptism is that which is now performed in the public place, where public ordinances are usually administered, the accustomed signs being given for the assembling of the congregation there, at such time when it is to be celebrated, so private baptism, on the contrary, is that which is done either in the place of public assembly when no public notice is duly given for the congregation to resort thither, or in a private house, where although many are present, yet it is not free, or at least its generally supposed it would not be civil for any Christian that will, though uninvited, to come to the ordinance of baptism there administered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-langley.html">Samuel Langley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether</cite>, (or if at all in what cases) Baptism may be now Administered Privately, not Publicly?’ 20 pp. being the bottom 2/3rds of the Epistle Dedicatory of Suspension Reviewed, Stated, Cleared &amp; Settled upon Plain Scripture-Proof: Agreeable to the former &amp; late constitutions of the Protestant Church of England &amp; other Reformed Churches… (London, 1658) no page numbers</span></figcaption>

<blockquote><p>Lastly, the names given to this sacrament, noting the nature thereof, do afford us a good consideration to strike through the heart of this private mass, being called sometimes the Supper of the Lord, and sometimes a Communion among ourselves. If it be an holy supper and spiritual banquet, why are none bidden and called thereunto? If it be a communion, why does the priest uncharitably swallow all alone? whereby they make it a communion, but without company: a supper, but without guests: meat, but without eating: drink, but without drinking: a table, but without sitting down: a participation, but without any that are partakers: a banquet, but without seeding thereat, the people departing as hungry and thirsty as they came. Wherefore, as no man celebrated the Passover aright, or received profit thereby, but such as did eat the flesh thereof: so can none come to the supper of the Lord as he ought, though he look upon others, except he eat of the bread and drink of the cup, according to the commandment of Christ, the author thereof. And thus much of the sole communions and private masses brought into the church against the example of Christ against the use of the apostles, and against the name and nature of the sacrament itself.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Lastly, the names given to this sacrament, noting the nature thereof, do afford us a good consideration to strike through the heart of this private mass, being called sometimes the Supper of the Lord, and sometimes a Communion among ourselves. If it be an holy supper and spiritual banquet, why are none bidden and called thereunto? If it be a communion, why does the priest uncharitably swallow all alone? whereby they make it a communion, but without company: a supper, but without guests: meat, but without eating: drink, but without drinking: a table, but without sitting down: a participation, but without any that are partakers: a banquet, but without seeding thereat, the people departing as hungry and thirsty as they came. Wherefore, as no man celebrated the Passover aright, or received profit thereby, but such as did eat the flesh thereof: so can none come to the supper of the Lord as he ought, though he look upon others, except he eat of the bread and drink of the cup, according to the commandment of Christ, the author thereof. And thus much of the sole communions and private masses brought into the church against the example of Christ against the use of the apostles, and against the name and nature of the sacrament itself.”

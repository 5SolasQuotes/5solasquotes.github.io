<main class="wrap"><figure class="quote" id="q-43b8e22d5f" data-kw="">
<blockquote><p>These [Christians] I call by name (for they are not nameless like the stars which are numbered and have names), and they follow me, for I rear them up beside the waters of rest; and they follow every such shepherd, whose voice they love to hear, as you see; but a stranger they will not follow, but will flee from him, because they have a habit of distinguishing the voice of their own from that of strangers. They will flee from Valentinus with his division of one into two, refusing to believe that the Creator is other than the Good. They will flee from Depth and Silence, and the mythical Æons, that are verily worthy of Depth and Silence.

They will flee from Marcion’s god; compounded of elements and numbers; from Montanus’ evil and feminine spirit; from the matter and darkness of Manes; from Novatus’ boasting and wordy assumption of purity; from the analysis and confusion of Sabellius, and if I may use the expression, his absorption, contracting the Three into One, instead of defining the One in Three Personalities; from the difference of natures taught by Arius and his followers, and their new Judaism, confining the Godhead to the Unbegotten; from Photinus earthly Christ, who took his beginning from Mary.

But they worship the Father and the Son and the Holy Ghost, One Godhead; God the Father, God the Son and (do not be angry) God the Holy Ghost. One Nature in Three Personalities, intellectual, perfect, Self-existent, numerically separate, but not separate in Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Arians</cite>, (380), XVI in Nicene and Post-Nicene Fathers 2, 7: 333-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6636989924" data-kw="">
<blockquote><p>The purpose of all the Catholic commentators I have been able to read on the divine books of both testaments, who have written before me on the trinity which God is, has been to teach that according to the scriptures Father and Son and Holy Spirit in the inseparable equality of one substance present a divine unity; and therefore there are not three gods but one God; although indeed the Father has begotten the Son, and therefore he who is the Father is not the Son; and the Son is begotten by the Father, and therefore he who is the Son is not the Father; and the Holy Spirit is neither the Father nor the Son, but only the Spirit of the Father and of the Son, himself coequal to the Father and the Son, and belonging to the threefold unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, trans. Edmund Hill, ed. J. E. Rotelle (420; New York: New City Press, 1991), 1.2.7, p. 69.</span></figcaption>

</figure><figure class="quote" id="q-a6a6dcb745" data-kw="begot necessarily willingly">
<blockquote><p>Arius vexed the Orthodox by asking whether the Father begot the Son by necessity or by will. To this, the response must be that the Father begot the Son not out of necessity but necessarily, for He did not beget contingently. However, whatever this necessity is, it is voluntary and natural and lacks coercion. The Father did not beget the Son by will, but He begot willingly, for He is not compelled by any external or superior cause to beget.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXIV</span></figcaption>

</figure><figure class="quote" id="q-8f06aaa25f" data-kw="">
<blockquote><p>Thesis XVII. ὁμούσια (homousia) or ὁμοούσια (homoousia)… And so this term was adopted for divine phenomena in order to refute the Arians, who claimed that the Son was from the Father—not begotten from the Father’s substance but made ex nihilo. Consequently, they claim, the Son is God by participating in his power, not by nature. Therefore, against such men it was decided that the Son is ὁμούσιον (homousion) or ὁμοούσιον (homoousion) with the Father. They did not, however, intend by this term merely that the essence of the Father and of the Son is similar, as is the case in natural phenomena (this is how two essences numerically would be taken, and thus there would be numerically two gods, which is anathema). Instead, they wished to describe two realities: first, that the Son is not different from the Father in essence, not because he was made ex nihilo, but as he was begotten from the Father himself, and so from eternity. This distinction they marked by another term, coeternal. Second, that he is from the Father insofar as he is the Son, such that he is one with the Father insofar as he is God. That is to say, that the Son’s essence is not somehow a derivative essence which took its origin from another principal. The heretics called this notion ex traduce, and today some men advance this idea under the term essentiation. But we assert that the actual, complete essence—by which the Father is God—is the Son by begetting, as the essence has been shared with him by the Father. As a result, Father and Son—insofar as they subsist in one and the same essence, or are of one and the same essence numerically, with respect to essence—are the one and same God, although, nevertheless the Father is not the Son. … Thesis XX. The ancients used these formulas [such as homoousios and homousios] not to convey the notion of a plurality of essences but to show that there was identity of essence in the relations of the persons, against those who said that Christ was made ex nihilo and in fact made in time. For statements of the Arians like the following lead to that understanding: “there was a time when he was not” and, “he was created from things that were not.” In other words, that he was established from things that did not exist. Therefore the Fathers added to the Creed the phrase “true God from true God” to show that God from whom God exists, i.e., the Father, and God who is from God, i.e., the Son, are by reason of essence one God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beza on the Trinity</cite>, 21 Theses’ from Tractationes Theologicae Bezae, Volumen I (Geneva: Jean Crespin, 1570), p. 651 trans. David Noe</span></figcaption>

<blockquote><p>In brief therefore, here it is said, that in the unity of the Godhead there be three Persons; that is, though there be but one living and true God, yet there are three Persons, who are that one living and true God. Though the true God be but one in substance, yet he is three in subsistence; and so three in subsistence, as still to be but one in substance. And these three Persons, every one of which is God, and yet all three but one God, are really related to one another: as they are termed in the scripture, one is a Father, the other a Son, the other an Holy Ghost.

The first is Father to the second; the second is Son to the first; the third is neither Father nor Son, but the issue or Spirit of both. The first was a Father from eternity, as well as God; the second was God from eternity, as well as a Son; the third was both Holy Ghost and God from eternity, as well as either of them. The Father is the first person in the Deity; not begotten, nor proceeding, but begetting: the Son the second person; not begetting nor proceeding, but begotten: the Holy Ghost the third; not begotten, nor begetting, but proceeding. The first is called the Father, because he begot the second; the second is called the Son, because he is begotten of the Father; the third is called the Holy Ghost, because breathed both from the Father and the Son.</p></blockquote>

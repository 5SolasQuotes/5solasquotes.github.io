<main class="wrap"><figure class="quote" id="q-19b35ae52e" data-kw="">
<blockquote><p>Fecundity: “increase and multiply.” These words can have: (1) an imperative sense, in which way the ancient Hebrews wanted there to be here a universal precept, placed upon all people, of contracting marriage, which they call ונמה פיריה מצות” ,the commandment of fruitfulness and multiplication,” because one who does not confirm this commandment has no part, they say, in the age to come. But in this way the commandment would fall even upon brute beasts, since the same thing is said of them in verse 22; in this way also there would be a commandment to have dominion over the fish, “have dominion over the fish of the sea,” and so forth. (2) A concessive sense, just as in Genesis 2:16 and Deuteronomy 14:11, 20. Finally, (3) a promissory sense, so that the imperative stands in place of the future, “increase” in place of “you will increase,” and so forth, such that he is promising fertility, power, and appetite to beget what is similar to them; hence this is said only of fecund things, but not of light, stars, plants, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-mastricht.html">Peter Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 9, Exegetical Part, p. 252</span></figcaption>

</figure><figure class="quote" id="q-c00aba9715" data-kw="">
<blockquote><p>Both Roman Catholicism and liberal modernism, though fiercely opposed to each other through much of their history, draw from the same poisoned well: the exaltation of man over the Word of God. One exalts church leaders, especially the pope, as its divinely reliable guide. The other exalts human reasoning and/or feelings as the supreme judge of religion.</p></blockquote>

</figure><figure class="quote" id="q-dc91030cbf" data-kw="">
<blockquote><p>We do not profess to teach anything new. We consider the teaching of the Westminster Confession of Faith and other standards of the Reformed Churches to be absolutely true and sufficient, as they set forth the gracious operations of the Holy Spirit in redemption. We do hope, however, to set up and maintain the traditional view as taught in them, by treating the subject from a different point of view, and in refutation of heresies that were not prominently before the minds of those who formulated these standards. … Our aim is to ascertain and classify all the works of the Holy Spirit in all ages and dispensations, and to differentiate them one from the other by accurate definition; and also to determine, from the Scriptures, which have been permanent and universal and will be till the end of time, and which were limited and temporary. So far as we know, this ground has not been traversed, nor indeed has its importance been appreciated. Having accomplished this, as we hope and believe, we then bring the more popular claims of Modern Mysticism to the test of ascertained principles, and then consider their special pleas based on the Scriptures. … The thoughtful reader may perhaps find it profitable to read ‘Summary I’ at the close before reading the discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shearer.html">John Shearer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Modern Mysticism; or, The Covenants of the Spirit, their Scope &amp; Limitations</cite>, (Richmond, 1905) ToC</span></figcaption>

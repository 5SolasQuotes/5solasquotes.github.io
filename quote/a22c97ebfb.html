<blockquote><p>For as he is omnipotent, and therefore able, so he is the God of truth, yea truth it self, and therefore willing; he is Jehovah, one that giveth being to his word; who though he can do all things, yet he cannot lie, nor deny himself.</p></blockquote>

<blockquote><p>1. There is a subjection in respect of natural being, as the effect to the cause; so, though Adam had never sinned, this morality of the Fifth Command should have stood in vigor, that the son by nature, without any positive law, should have been subject to the father, because from him he has his being, as from a second cause. But I doubt if the relation of a father, as a father, does necessarily infer a royal or kingly authority of the father over the son; or by nature’s law, that the father has a power of life and death over, or above, his children, and the reasons I give are: (1) Because power of life and death is by a positive law, presupposing sin and the fall of man [Gen. 9:5-6]; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt [Gen. 4:14-15]. (2) I judge that the power royal, and the fatherly power of a father over his children, shall be found to be different; and the one is founded on the law of nature, the other, to wit, royal power, on a mere positive law.

2. The degree or order of subjection natural is a subjection in respect of gifts or age. So Aristotle (1 polit., chp. 3) says, “that some are by nature servants.” His meaning is good — that some gifts of nature, as wisdom natural, or aptitude to govern, has made some men of gold, fitter to command, and some of iron and clay, fitter to be servants and slaves… It is possible Plato had a good meaning (Dialogue 3, Of Laws) who made six orders here. “1. That fathers command their sons;

2. The noble the ignoble;

3. The elder the younger;

4. The masters the servants;

5. The stronger the weaker;

6. The wise the ignorant.” Aquinas (22, q. 57, article 3), Driedo (de libert. Christ, bk. 1, p. 8), following Aristotle (polit. bk. 7, ch. 14) hold, though man had never sinned there should have been a sort of dominion of the more gifted and wiser above the less wise and weaker; not antecedent from nature properly, but consequent, for the utility and good of the weaker, in so far as it is good for the weaker to be guided by the stronger, which cannot be denied to have some ground in nature.</p></blockquote>

<blockquote><p>Here I shall briefly advert to the main topics of discussion in the publications to which I have referred; and then notice the exceptions that have been taken to the way in which the writers conducted the Controversy.

As to the first of these, the principal topics on which Dr M’Crie and his friends laid emphasis, were the three following:—

I. The place assigned in matters of religion to the civil ruler or to the Christian nation acting through its Rulers in a corporate capacity. The Synod, in their new Testimony, had asserted that the power competent to worldly kingdoms is wholly temporal, respecting only the secular interests of society, (p. 193.) Of course, they adduced no scripture for this, because no scripture could be adduced to lend countenance to such a tenet. Nor can it be deduced by sound deduction from any revealed truth. The advocates of the Synod could only have recourse to the rights of man.

Were this dogma consistently carried out, the separating brethren clearly proved, that all the laws previously in force in every Christian country in favour of religion, the sabbath, scripture-education, and the like, must needs be cancelled by a universal act rescissory. They, on the contrary, maintained from scripture, that nations as such are under obligation to recognise the true religion and aid in its diffusion by wise and salutary laws. They maintained that rulers are bound to give civil sanction to the truth; to establish the church; and to contribute from the national resources, for the furtherance of the gospel. This was one point which they argued out in all its bearings.

II. Liberty of conscience, on its true foundation, was fully and admirably expounded. The doctrine of the Synod on this point was in the last degree unguarded. They not only tied up the magistrate’s hands from any exercise of civil authority in suppressing blasphemy, sabbath-breaking, or profaneness,—representing such coercive measures as inconsistent with the spiritual nature of Christ’s Kingdom,—but went so far as to allege that the national sanction of one particular profession of Christianity in preference to another, partook of the nature of compulsion, intolerance, and persecution.

On the contrary, the separating brethren put the question of liberty of conscience on its true ground: that is, they placed it not on the mere metaphysical rights of man, but on the ground that God alone is Lord of the conscience; and that its rights, as derived from him, can never be alleged as running counter to the authority of God speaking in His word, and commanding nations and rulers to obey Him. The unregulated license to which I have referred was well designated by the Rev. Mr Chalmers of Haddington, “the grim idol,” at whose shrine the entire national profession of religion and the due exercise of magistratical power about religion were recklessly sacrificed.

III. The Christian state, according to the Old Testament precedent, was represented by the separating brethren as an organised community, capable of being in covenant with God. On this they laid great stress This was the most definite expression, according to these brethren, for national religion; and their whole theory, in large measure, took its peculiar colour from this conviction.

Not that they supposed any step or act of man originating the relation between a State and God. Rather, their whole mode of representing the matter proceeded on the supposition that by an act of prevenient grace the nation to whom the word of God had come, occupied a position analogous to that of Israel; and the formal act of covenanting was but the expression of the national consciousness of being taken into such a relation. Nor was this a merely Scottish idea: for we find in other countries the same thing done or fully approved of.</p></blockquote>

<blockquote><p>Forsomuch now as the word of God is the only truth that driveth away all lies, and discloseth all joggling and deceit, therefore is our Baalam of Rome so loath that the scripture should be known in the mother, tongue; lest, if kings and princes, specially above all other, were exercised therein, they should reclaim and challenge again their due authority, which he falsely hath usurped so many years, and so to tie him shorter; and lest the people, being taught by the word of God, should fall from the false feigned obedience of him and his disguised apostles into the true obedience commanded by God’s own mouth; as namely, to obey their prince, to obey father and mother, &amp;c., and not to step over father and mother’s belly to enter into his painted religions, as his hypocrites teach. For he knoweth well enough, that if the clear sun of God’s word come once to the heat of the day, it shall drive away all the foul mist of his devilish doctrines. Therefore were it more to the maintenance of antichrist’s kingdom, that the world were still in ignorance and blindness, and that the scripture should never come to light.</p></blockquote>

s.github.io%2Fquote%2Fb839c2986d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b839c2986d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/02/11/myles-coverdale-on-the-popes-fear-of-scripture-in-the-mother-tongue/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6e8bda2314" data-kw="">
<blockquote><p>Evangelicals responded similarly to the Scottish cholera epidemic of 1832, organizing weekly, and even nightly, prayer meetings in the hope of arresting the advance of the disease. These meetings supplemented the fast days called by the government at the request of the Church of Scotland… As a result, Evangelicals also saw these public prayer meetings as a suitable context in which to ask God to send religious revival. This latter purpose prevailed after the threat of the epidemic passed away, at least among groups in the parish of Kilsyth, which continued to meet during the remainder of the 1830’s, asking God ‘to awaken a spirit of earnest and vital religion among them, and throughout the Christian Church generally’ .</p></blockquote>

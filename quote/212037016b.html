<blockquote><p>Let men and devils curse the bride of Christ, he will bless her. Let her be excommunicate, or cast out of the Church unto the devil’s common, Christ will not affirm, but make void such sentences. In the ninth chapter of John, we read of a poor man born blind, whose eyes Christ had opened upon the Sabbath day, by making a little clay, and putting it upon his eyes. The Jewish Sanhedrin met; and under a very religious pretence of zeal for the Sabbath day, they convene the man before them, who professed Christ, in as far as he knew him; and thereupon they excommunicate him, and cast him out of the church, and held him as a Heathen man and a Publican.

Well, was this sentence bound in heaven? No; so far from that, that ver. 35. when Christ heard they had cast him out (or excommunicated him, as in the margin), Christ seeks him out, and finds him, and manifests himself the more to him, as you may see, ver. 35 — 38.: and, in the 39th verse, he passes a heavy doom and sentence upon them that had cast him out: “For judgement I am come into this world, that they who see not might see, and that they who see (or imagine that they are the only men that see things, or know them in a better light), might be made blind.” Thus Christ will take up and defend his bride, to the confusion of them that do her hurt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wise virgins going forth to meet the bridegroom in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ae3641a333" data-kw="">
<blockquote><p>And that otherwise, if the tares grow so rank that they cannot be pulled up, and if the same evil disease take hold of so very many that the consent of the Church cannot be had to the excommunication of a wicked person, then good men must grieve and groan, and endure what they cannot help. Therefore, that excommunication may fruitfully succeed, the consent of the people is necessary… Howbeit, even in such cases when the consent of the Church cannot be had to the execution of this discipline, faithful pastors and professors [laymen] must, every one for his own part, take heed that he have no fellowship with the unfruitful works of darkeness, but even reprove them; yea they ought, in sensu negativo, excommunicate those who should be (but are not) excommunicate positively: which negative excommunication is not an ecclesiastical censure, but either a bare punishment, or a cautel and animadversion; And so says the Archbishop of Spalato [Marco Antonio de Dominis, d. 1624] (De Republica Ecclesiastica, vol. 2, bk. 6, ch. 9, num. 8, pp. 735-36), not only one brother may refuse to communicate with another, but a people also may refuse to communicate with their pastor, which he confirms by certain examples.</p></blockquote>

</figure><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 62-63 (PDF p. 67)</span></figcaption>

<blockquote><p>Hence, by the way, a word of that necessary and judicious question moved by Calvin, Mt. 18:18, ‘What ye bind on earth,’ etc. Since the Church tolerateth many hypocrites and absolveth and looseth many who do but counterfeit and fancy repentance, shall we say that such are loosed and pardoned in heaven? Some say [that] by ‘heaven’ here is meant the visible Church; and they distinguish between sin and scandal: and therefore that by ‘binding and loosing’, here is meant, not forgiveness or justification, or absolution from the guilt of sin in Heaven, or in the Court of God, or condemnation for that sin, but only deliverance from scandal and the removing of scandal and admitting of the man into the visible Church as a member: suppose his repentance be but hypocritical, yet when the Church proceedeth impartially according to the Rule of Christ, the sentence is ratified by God, and the man is loosed from the scandal, though not from the sin; the sin is yet bound before God, because he hath not really repented; otherwise the Church, who knows not heart-actings and who really repent, who not, though proceeding right according to the rule of Christ, should not have the promise of ratifying in Heaven what they do on earth, fulfilled to them; which cannot be said. But taking it for a good observation that Calvin hath here, that Mt. 16, Christ speaketh of binding and loosing concional, by the Word preached; but here, Mt. 18, he speaketh especially of binding and loosing juridical in the court of the Church, by excommunication or absolution from that sentence. In the former consideration the question is easy. No pastor in preaching Gospel-promises or threatnings can bind, but conditionally: If the party do not believe and repent, the man’s sin is bound in Heaven; if he do believe and repent, his sin is loosed in heaven. As to the other [Mt. 18], we find in the Word no such signification of binding and loosing in regard of scandal, but they are ever spoken of in regard of sin and the guilt thereof. And therefore:

1. Calvin saith well that the speech of Christ is directed to no other than to those who duly and sincerely do reconcile themselves with the Church; and the Lord being willing to comfort trembling consciences, is not setting down a rule for comforting of hypocrites: But by the contrary, because hypocrites s[b?]oldly provoke to the Tribunal of God, when for gross scandals they are justly cast out; our Savior saith, The sentence of excommunication is ratified in Heaven. The Scripture-rule is for such as obey, and for those who fulfill the condition, non de obliquis [not for those who are crosswise]. As to the doubt that the Church often absolves such who really repent not, how then can the hypocrite be loosed in Heaven, when the Lord knows he does but fancy repentance? Answer: Two things here are to be distinguished:

1. The Church’s proceeding in the external Court as relating to them, if they impartially, according to the rule of Christ, proceed and be not sudden in re-admitting, but see [that] the incestuous man near swallowed up (though one man’s measure of visible repentance be not the rule to all) before they confirm their love to him, and forgive him, 2 Cor.

2. Suppose his repentance be but counterfeit, or not saving and real, as was that of Ahab, yet are they to receive him, and admit him to the ordinances, and the Lord ratifies what they do in Heaven. As:

1. The Lord ratifies Philip’s baptizing of Magus; and the Lord approves the servants inviting to the marriage-supper the man that wanted the wedding-garment: for what the Lord commands, that He must approve and ratify in Heaven.

2. What in charitable judgments is praise-worthy, that God also must ratify in Heaven; yea, it is praise-worthy in the disciples, when they heard Christ say, ‘One of you twelve hath a Devil, one of you shall betray the Son of Man;’ every one suspected and feared himself; none of the eleven suspected Judas, but gave him charity.

3. Without this God should not approve the gathering of Churches, nor the casting of the draw-net in the sea, nor the sowing of seed upon all sort of grounds, the way side, the thorny, the rocky, the good ground, that the chosen, who are yet in the state of nature, may be brought in and effectually called. But in receiving in excommunicates, the Church would not be sudden. In the ancient Church, sacrificers to Idols were six years before they were received; they that defiled themselves with beasts, were debarred from the sacrament thirty years; adulterers, seven; women who made away their births, ten years; such as uncompelled denied the faith, twelve years. What other years Burchardus and Gratianus have, may be seen. Something for edification sure there was here.

2. There is another thing here, which concerneth the conscience of him who is to be received, and when the Church-Court applies the sentence to the conscience for his personal pardon, sure whatever satisfaction the people have for removing of the scandal, the sentence of absolution so relating to him, is concional, not properly juridical; and conditional, not absolute; and therefore is to be pronounced by the mouth of the Church, the Pastor, thus: ‘Be it unto thee according to thy faith and repentance;’ and except the man really repent, his sin is not loosed in Heaven. So then, the Churches loosing from the scandal is conditional, upon a seen condition of outward repentance morally sincere to the Churches apprehension, but they simply and absolutely make him a citizen of the Church and admit him to ordinances according to the command of Christ, both in private and public Church offences (If thy brother who offended, repent, forgive him), but his loosing from the sin or guilt in heaven, is ever conditional and never absolutely to be pronounced by the Pastor, the mouth of the Church, who cannot certainly know the condition. Hence:

1. The scandal is loosed in earth and heaven; the Church impartially following the rule of Christ sometime when the sin remains and is bound in heaven.

2. The Church may say the man is absolutely freed from the scandal, so as the Church sins not in receiving him in, if they follow the rule; but he sins, and the scandal is bound in coming in, if he repent not: and also as to the guilt, he is freed from the sin only conditionally, for the condition of removal of the scandal is seen, and visible: but the condition of the loosing from sin is invisible.

3. Sometime the man is both loosed from the scandal and from the sin, and every way loosed in heaven and earth, when he both really and visibly repents.

4. The Church should go as near in readmitting a fallen sinner, and loosing him on earth as they can discern the Lord’s loosing in Heaven: the Corinthians seem to exceed in this, 2 Cor. 2:7, so that contrariwise, ye ought rather to forgive him.

5. There is more of real saintship required, to receive in again one who hath been once a member and hath fallen, and was cast out, than to admit a member newly come from paganism:

1. The larger the means of salvation have been, the greater guiltiness, as the scandal of a Christian is greater than the sin and scandal of a Sodomite, Mt. 10:15; Mt. 11:22; Mt. 12:41-42. And therefore the repentance of the one must be more signal and larger than the repentance of the other.

2. There is not such a measure of marriage-love required of a virgin before she be married, as after she hath been married, and born children to the husband; nor can any say there is so much knowledge required in a new entrant that knows not the first elements of philosophy, as in one who hath studied seven years. Hence 6, it is utterly false that as visible saintship and real repentance, as far as can be, is required of one excommunicate, before he can be received in again; so real visible saintship, as far as can be seen, must be required in members before they be first admitted. But I desire our [congregationalist] Brethren, if they judge the first receiving into the Church a loosing from sin and scandal, as readmission is, they will teach it me.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Hence, by the way, a word of that necessary and judicious question moved by Calvin, Mt. 18:18, ‘What ye bind on earth,’ etc. Since the Church tolerateth many hypocrites and absolveth and looseth many who do but counterfeit and fancy repentance, shall we say that such are loosed and pardoned in heaven? Some say [that] by ‘heaven’ here is meant the visible Church; and they distinguish between sin and scandal: and therefore that by ‘binding and loosing’, here is meant, not forgiveness or justification, or absolution from the guilt of sin in Heaven, or in the Court of God, or condemnation for that sin, but only deliverance from scandal and the removing of scandal and admitting of the man into the visible Church as a member: suppose his repentance be but hypocritical, yet when the Church proceedeth impartially according to the Rule of Christ, the sentence is ratified by God, and the man is loosed from the scandal, though not from the sin; the sin is yet bound before God, because he hath not really repented; otherwise the Church, who knows not heart-actings and who really repent, who not, though proceeding right according to the rule of Christ, should not have the promise of ratifying in Heaven what they do on earth, fulfilled to them; which cannot be said. But taking it for a good observation that Calvin hath here, that Mt. 16, Christ speaketh of binding and loosing concional, by the Word preached; but here, Mt. 18, he speaketh especially of binding and loosing juridical in the court of the Church, by excommunication or absolution from that sentence. In the former consideration the question is easy. No pastor in preaching Gospel-promises or threatnings can bind, but conditionally: If the party do not believe and repent, the man’s sin is bound in Heaven; if he do believe and repent, his sin is loosed in heaven. As to the other [Mt. 18], we find in the Word no such signification of binding and loosing in regard of scandal, but they are ever spoken of in regard of sin and the guilt thereof. And therefore:

1. Calvin saith well that the speech of Christ is directed to no other than to those who duly and sincerely do reconcile themselves with the Church; and the Lord being willing to comfort trembling consciences, is not setting down a rule for comforting of hypocrites: But by the contrary, because hypocrites s[b?]oldly provoke to the Tribunal of God, when for gross scandals they are justly cast out; our Savior saith, The sentence of excommunication is ratified in Heaven. The Scripture-rule is for such as obey, and for those who fulfill the condition, non de obliquis [not for those who are crosswise]. As to the doubt that the Church often absolves such who really repent not, how then can the hypocrite be loosed in Heaven, when the Lord knows he does but fancy repentance? Answer: Two things here are to be distinguished:

1. The Church’s proceeding in the external Court as relating to them, if they impartially, according to the rule of Christ, proceed and be not sudden in re-admitting, but see [that] the incestuous man near swallowed up (though one man’s measure of visible repentance be not the rule to all) before they confirm their love to him, and forgive him, 2 Cor.

2. Suppose his repentance be but counterfeit, or not saving and real, as was that of Ahab, yet are they to receive him, and admit him to the ordinances, and the Lord ratifies what they do in Heaven. As:

1. The Lord ratifies Philip’s baptizing of Magus; and the Lord approves the servants inviting to the marriage-supper the man that wanted the wedding-garment: for what the Lord commands, that He must approve and ratify in Heaven.

2. What in charitable judgments is praise-worthy, that God also must ratify in Heaven; yea, it is praise-worthy in the disciples, when they heard Christ say, ‘One of you twelve hath a Devil, one of you shall betray the Son of Man;’ every one suspected and feared himself; none of the eleven suspected Judas, but gave him charity.

3. Without this God should not approve the gathering of Churches, nor the casting of the draw-net in the sea, nor the sowing of seed upon all sort of grounds, the way side, the thorny, the rocky, the good ground, that the chosen, who are yet in the state of nature, may be brought in and effectually called. But in receiving in excommunicates, the Church would not be sudden. In the ancient Church, sacrificers to Idols were six years before they were received; they that defiled themselves with beasts, were debarred from the sacrament thirty years; adulterers, seven; women who made away their births, ten years; such as uncompelled denied the faith, twelve years. What other years Burchardus and Gratianus have, may be seen. Something for edification sure there was here.

2. There is another thing here, which concerneth the conscience of him who is to be received, and when the Church-Court applies the sentence to the conscience for his personal pardon, sure whatever satisfaction the people have for removing of the scandal, the sentence of absolution so relating to him, is concional, not properly juridical; and conditional, not absolute; and therefore is to be pronounced by the mouth of the Church, the Pastor, thus: ‘Be it unto thee according to thy faith and repentance;’ and except the man really repent, his sin is not loosed in Heaven. So then, the Churches loosing from the scandal is conditional, upon a seen condition of outward repentance morally sincere to the Churches apprehension, but they simply and absolutely make him a citizen of the Church and admit him to ordinances according to the command of Christ, both in private and public Church offences (If thy brother who offended, repent, forgive him), but his loosing from the sin or guilt in heaven, is ever conditional and never absolutely to be pronounced by the Pastor, the mouth of the Church, who cannot certainly know the condition. Hence:

1. The scandal is loosed in earth and heaven; the Church impartially following the rule of Christ sometime when the sin remains and is bound in heaven.

2. The Church may say the man is absolutely freed from the scandal, so as the Church sins not in receiving him in, if they follow the rule; but he sins, and the scandal is bound in coming in, if he repent not: and also as to the guilt, he is freed from the sin only conditionally, for the condition of removal of the scandal is seen, and visible: but the condition of the loosing from sin is invisible.

3. Sometime the man is both loosed from the scandal and from the sin, and every way loosed in heaven and earth, when he both really and visibly repents.

4. The Church should go as near in readmitting a fallen sinner, and loosing him on earth as they can discern the Lord’s loosing in Heaven: the Corinthians seem to exceed in this, 2 Cor. 2:7, so that contrariwise, ye ought rather to forgive him.

5. There is more of real saintship required, to receive in again one who hath been once a member and hath fallen, and was cast out, than to admit a member newly come from paganism:

1. The larger the means of salvation have been, the greater guiltiness, as the scandal of a Christian is greater than the sin and scandal of a Sodomite, Mt. 10:15; Mt. 11:22; Mt. 12:41-42. And therefore the repentance of the one must be more signal and larger than the repentance of the other.

2. There is not such a measure of marriage-love required of a virgin before she be married, as after she hath been married, and born children to the husband; nor can any say there is so much knowledge required in a new entrant that knows not the first elements of philosophy, as in one who hath studied seven years. Hence 6, it is utterly false that as visible saintship and real repentance, as far as can be, is required of one excommunicate, before he can be received in again; so real visible saintship, as far as can be seen, must be required in members before they be first admitted. But I desire our [congregationalist] Brethren, if they judge the first receiving into the Church a loosing from sin and scandal, as readmission is, they will teach it me.”

— Samuel Rutherford, A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker, … wherein the way of the Churches of New England is now Re-examined (London, 1658), Book 1, ch. 14, pp. 148-51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%2C+by+the+way%2C+a+word+of+that+necessary+and+judicious+question+moved+by+Calvin%2C+Mt.+18%3A18%2C+%E2%80%98What+ye+bind+on+earth%2C%E2%80%99+etc.+Since+the+Church+tolerateth+many+hypocrites+and+absolveth+and+looseth+many+who+do+but+counterfeit+and+fancy+repentance%2C+shall+we+say+that+such+are+loosed+and+pardoned+in+heaven%3F+Some+say+%5Bthat%5D+by+%E2%80%98heaven%E2%80%99+here+is+meant+the+visible+Church%3B+and+they+distinguish+between+sin+and+scandal%3A+and+therefore+that+by+%E2%80%98binding+and+loosing%E2%80%99%2C+here+is+meant%2C+not+forgiveness+or+justification%2C+or+absolution+from+the+guilt+of+sin+in+Heaven%2C+or+in+the+Court+of+God%2C+or+condemnation+for+that+sin%2C+but+only+deliverance+from+scandal+and+the+removing+of+scandal+and+admitting+of+the+man+into+the+visible+Church+as+a+member%3A+suppose+his+repentance+be+but+hypocritical%2C+yet+when+the+Church+proceedeth+impartially+according+to+the+Rule+of+Christ%2C+the+sentence+is+ratified+by+God%2C+and+the+man+is+loosed+from+the+scandal%2C+though+not+from+the+sin%3B+the+sin+is+yet+bound+before+God%2C+because+he+hath+not+really+repented%3B+otherwise+the+Church%2C+who+knows+not+heart-actings+and+who+really+repent%2C+who+not%2C+though+proceeding+right+according+to+the+rule+of+Christ%2C+should+not+have+the+promise+of+ratifying+in+Heaven+what+they+do+on+earth%2C+fulfilled+to+them%3B+which+cannot+be+said.+But+taking+it+for+a+good+observation+that+Calvin+hath+here%2C+that+Mt.+16%2C+Christ+speaketh+of+binding+and+loosing+concional%2C+by+the+Word+preached%3B+but+here%2C+Mt.+18%2C+he+speaketh+especially+of+binding+and+loosing+juridical+in+the+court+of+the+Church%2C+by+excommunication+or+absolution+from+that+sentence.+In+the+former+consideration+the+question+is+easy.+No+pastor+in+preaching+Gospel-promises+or+threatnings+can+bind%2C+but+conditionally%3A+If+the+party+do+not+believe+and+repent%2C+the+man%E2%80%99s+sin+is+bound+in+Heaven%3B+if+he+do+believe+and+repent%2C+his+sin+is+loosed+in+heaven.+As+to+the+other+%5BMt.+18%5D%2C+we+find+in+the+Word+no+such+signification+of+binding+and+loosing+in+regard+of+scandal%2C+but+they+are+ever+spoken+of+in+regard+of+sin+and+the+guilt+thereof.+And+therefore%3A+1.+Calvin+saith+well+that+the+speech+of+Christ+is+directed+to+no+other+than+to+those+who+duly+and+sincerely+do+reconcile+themselves+with+the+Church%3B+and+the+Lord+being+willing+to+comfort+trembling+consciences%2C+is+not+setting+down+a+rule+for+comforting+of+hypocrites%3A+But+by+the+contrary%2C+because+hypocrites+s%5Bb%3F%5Doldly+provoke+to+the+Tribunal+of+God%2C+when+for+gross+scandals+they+are+justly+cast+out%3B+our+Savior+saith%2C+The+sentence+of+excommunication+is+ratified+in+Heaven.+The+Scripture-rule+is+for+such+as+obey%2C+and+for+those+who+fulfill+the+condition%2C+non+de+obliquis+%5Bnot+for+those+who+are+crosswise%5D.+As+to+the+doubt+that+the+Church+often+absolves+such+who+really+repent+not%2C+how+then+can+the+hypocrite+be+loosed+in+Heaven%2C+when+the+Lord+knows+he+does+but+fancy+repentance%3F+Answer%3A+Two+things+here+are+to+be+distinguished%3A+1.+The+Church%E2%80%99s+proceeding+in+the+external+Court+as+relating+to+them%2C+if+they+impartially%2C+according+to+the+rule+of+Christ%2C+proceed+and+be+not+sudden+in+re-admitting%2C+but+see+%5Bthat%5D+the+incestuous+man+near+swallowed+up+%28though+one+man%E2%80%99s+measure+of+visible+repentance+be+not+the+rule+to+all%29+before+they+confirm+their+love+to+him%2C+and+forgive+him%2C+2+Cor.+2.+Suppose+his+repentance+be+but+counterfeit%2C+or+not+saving+and+real%2C+as+was+that+of+Ahab%2C+yet+are+they+to+receive+him%2C+and+admit+him+to+the+ordinances%2C+and+the+Lord+ratifies+what+they+do+in+Heaven.+As%3A+1.+The+Lord+ratifies+Philip%E2%80%99s+baptizing+of+Magus%3B+and+the+Lord+approves+the+servants+inviting+to+the+marriage-supper+the+man+that+wanted+the+wedding-garment%3A+for+what+the+Lord+commands%2C+that+He+must+approve+and+ratify+in+Heaven.+2.+What+in+charitable+judgments+is+praise-worthy%2C+that+God+also+must+ratify+in+Heaven%3B+yea%2C+it+is+praise-worthy+in+the+disciples%2C+when+they+heard+Christ+say%2C+%E2%80%98One+of+you+twelve+hath+a+Devil%2C+one+of+you+shall+betray+the+Son+of+Man%3B%E2%80%99+every+one+suspected+and+feared+himself%3B+none+of+the+eleven+suspected+Judas%2C+but+gave+him+charity.+3.+Without+this+God+should+not+approve+the+gathering+of+Churches%2C+nor+the+casting+of+the+draw-net+in+the+sea%2C+nor+the+sowing+of+seed+upon+all+sort+of+grounds%2C+the+way+side%2C+the+thorny%2C+the+rocky%2C+the+good+ground%2C+that+the+chosen%2C+who+are+yet+in+the+state+of+nature%2C+may+be+brought+in+and+effectually+called.+But+in+receiving+in+excommunicates%2C+the+Church+would+not+be+sudden.+In+the+ancient+Church%2C+sacrificers+to+Idols+were+six+years+before+they+were+received%3B+they+that+defiled+themselves+with+beasts%2C+were+debarred+from+the+sacrament+thirty+years%3B+adulterers%2C+seven%3B+women+who+made+away+their+births%2C+ten+years%3B+such+as+uncompelled+denied+the+faith%2C+twelve+years.+What+other+years+Burchardus+and+Gratianus+have%2C+may+be+seen.+Something+for+edification+sure+there+was+here.+2.+There+is+another+thing+here%2C+which+concerneth+the+conscience+of+him+who+is+to+be+received%2C+and+when+the+Church-Court+applies+the+sentence+to+the+conscience+for+his+personal+pardon%2C+sure+whatever+satisfaction+the+people+have+for+removing+of+the+scandal%2C+the+sentence+of+absolution+so+relating+to+him%2C+is+concional%2C+not+properly+juridical%3B+and+conditional%2C+not+absolute%3B+and+therefore+is+to+be+pronounced+by+the+mouth+of+the+Church%2C+the+Pastor%2C+thus%3A+%E2%80%98Be+it+unto+thee+according+to+thy+faith+and+repentance%3B%E2%80%99+and+except+the+man+really+repent%2C+his+sin+is+not+loosed+in+Heaven.+So+then%2C+the+Churches+loosing+from+the+scandal+is+conditional%2C+upon+a+seen+condition+of+outward+repentance+morally+sincere+to+the+Churches+apprehension%2C+but+they+simply+and+absolutely+make+him+a+citizen+of+the+Church+and+admit+him+to+ordinances+according+to+the+command+of+Christ%2C+both+in+private+and+public+Church+offences+%28If+thy+brother+who+offended%2C+repent%2C+forgive+him%29%2C+but+his+loosing+from+the+sin+or+guilt+in+heaven%2C+is+ever+conditional+and+never+absolutely+to+be+pronounced+by+the+Pastor%2C+the+mouth+of+the+Church%2C+who+cannot+certainly+know+the+condition.+Hence%3A+1.+The+scandal+is+loosed+in+earth+and+heaven%3B+the+Church+impartially+following+the+rule+of+Christ+sometime+when+the+sin+remains+and+is+bound+in+heaven.+2.+The+Church+may+say+the+man+is+absolutely+freed+from+the+scandal%2C+so+as+the+Church+sins+not+in+receiving+him+in%2C+if+they+follow+the+rule%3B+but+he+sins%2C+and+the+scandal+is+bound+in+coming+in%2C+if+he+repent+not%3A+and+also+as+to+the+guilt%2C+he+is+freed+from+the+sin+only+conditionally%2C+for+the+condition+of+removal+of+the+scandal+is+seen%2C+and+visible%3A+but+the+condition+of+the+loosing+from+sin+is+invisible.+3.+Sometime+the+man+is+both+loosed+from+the+scandal+and+from+the+sin%2C+and+every+way+loosed+in+heaven+and+earth%2C+when+he+both+really+and+visibly+repents.+4.+The+Church+should+go+as+near+in+readmitting+a+fallen+sinner%2C+and+loosing+him+on+earth+as+they+can+discern+the+Lord%E2%80%99s+loosing+in+Heaven%3A+the+Corinthians+seem+to+exceed+in+this%2C+2+Cor.+2%3A7%2C+so+that+contrariwise%2C+ye+ought+rather+to+forgive+him.+5.+There+is+more+of+real+saintship+required%2C+to+receive+in+again+one+who+hath+been+once+a+member+and+hath+fallen%2C+and+was+cast+out%2C+than+to+admit+a+member+newly+come+from+paganism%3A+1.+The+larger+the+means+of+salvation+have+been%2C+the+greater+guiltiness%2C+as+the+scandal+of+a+Christian+is+greater+than+the+sin+and+scandal+of+a+Sodomite%2C+Mt.+10%3A15%3B+Mt.+11%3A22%3B+Mt.+12%3A41-42.+And+therefore+the+repentance+of+the+one+must+be+more+signal+and+larger+than+the+repentance+of+the+other.+2.+There+is+not+such+a+measure+of+marriage-love+required+of+a+virgin+before+she+be+married%2C+as+after+she+hath+been+married%2C+and+born+children+to+the+husband%3B+nor+can+any+say+there+is+so+much+knowledge+required+in+a+new+entrant+that+knows+not+the+first+elements+of+philosophy%2C+as+in+one+who+hath+studied+seven+years.+Hence+6%2C+it+is+utterly+false+that+as+visible+saintship+and+real+repentance%2C+as+far+as+can+be%2C+is+required+of+one+excommunicate%2C+before+he+can+be+received+in+again%3B+so+real+visible+saintship%2C+as+far+as+can+be+seen%2C+must+be+required+in+members+before+they+be+first+admitted.+But+I+desire+our+%5Bcongregationalist%5D+Brethren%2C+if+they+judge+the+first+receiving+into+the+Church+a+loosing+from+sin+and+scandal%2C+as+readmission+is%2C+they+will+teach+it+me.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker%2C+%E2%80%A6+wherein+the+way+of+the+Churches+of+New+England+is+now+Re-examined+%28London%2C+1658%29%2C+Book+1%2C+ch.+14%2C+pp.+148-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49bacb0323.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49bacb0323.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=Hence%2C%20by%20the%20way%2C%20a%20word,is%2C%20they%20will%20teach%20it%20me&amp;text=Hence%2C%20by%20the%20way%2C%20a%20word%20of%20that&amp;text=as%20readmission%20is%2C%20they%20will%20teach%20it%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We think it of great consequence, that all these sceptical and latitudinarian views with regard to church discipline, should be made to cease. We believe, that there is a power in the church as such, independently of the mere weight it might have as an ordinary society among men, which is capable of being used in this way, for Christian purposes, with very great effect.

This power, like the word of God itself and the holy sacraments, is of a spiritual force, working far deeper and more efficiently than appears to common reason, and in a way not to be measured therefore by its calculations. To judge of it, as a man would judge of the authority and influence of a mere human organization, without taking into view the divinity which lies hidden within it, is to err in the same way as if anyone should think to estimate the power of the Bible by the same considerations, to which it is common to recur in weighing the eloquence or reasonings of men.

The word of God is quick and powerful, far beyond its outward show; and so also is the discipline of his church, administered according to his own appointment, and in the spirit of sincere piety. It is in itself eminently adapted to take hold of the conscience and heart, with quickening and convincing power; and were it only faithfully employed, as it ought to be, it might be relied upon for the accomplishment of the most difficult ends, where the more plausible methods of this world’s policy are trusted in vain. It is no objection at all to the worth of this agency that it may appear weak or unwise to common reason.

We know, that the wisdom of God is in other cases foolishness with men; and it belongs to that faith, by which the church should be led, to confide in his appointments, even where the power of them is not at once manifest, rather than in any rules of action suggested by the philosophy of man, however profound and comprehensive that philosophy may claim to be.

In every case in which the church is bold enough to commit her cause in this way, with godly simplicity, to the experiment of faith, it will be found that the foolishness of God is wiser than men, and his weakness stronger than their strength; and that it is better to trust his counsel, even against hope, than to put confidence in the most princely show of reason arrayed against it.</p></blockquote>

— The Presbytery of Ohio, On the Claims of the Christian Sabbath; A Report Read and Adopted April 21, 1836, at a Meeting of the Presbytery, held at Raccoon Church, (Pittsburgh PA: William Allinder, 1836), pp 9-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+think+it+of+great+consequence%2C+that+all+these+sceptical+and+latitudinarian+views+with+regard+to+church+discipline%2C+should+be+made+to+cease.+We+believe%2C+that+there+is+a+power+in+the+church+as+such%2C+independently+of+the+mere+weight+it+might+have+as+an+ordinary+society+among+men%2C+which+is+capable+of+being+used+in+this+way%2C+for+Christian+purposes%2C+with+very+great+effect.%0A%0AThis+power%2C+like+the+word+of+God+itself+and+the+holy+sacraments%2C+is+of+a+spiritual+force%2C+working+far+deeper+and+more+efficiently+than+appears+to+common+reason%2C+and+in+a+way+not+to+be+measured+therefore+by+its+calculations.+To+judge+of+it%2C+as+a+man+would+judge+of+the+authority+and+influence+of+a+mere+human+organization%2C+without+taking+into+view+the+divinity+which+lies+hidden+within+it%2C+is+to+err+in+the+same+way+as+if+anyone+should+think+to+estimate+the+power+of+the+Bible+by+the+same+considerations%2C+to+which+it+is+common+to+recur+in+weighing+the+eloquence+or+reasonings+of+men.%0A%0AThe+word+of+God+is+quick+and+powerful%2C+far+beyond+its+outward+show%3B+and+so+also+is+the+discipline+of+his+church%2C+administered+according+to+his+own+appointment%2C+and+in+the+spirit+of+sincere+piety.+It+is+in+itself+eminently+adapted+to+take+hold+of+the+conscience+and+heart%2C+with+quickening+and+convincing+power%3B+and+were+it+only+faithfully+employed%2C+as+it+ought+to+be%2C+it+might+be+relied+upon+for+the+accomplishment+of+the+most+difficult+ends%2C+where+the+more+plausible+methods+of+this+world%E2%80%99s+policy+are+trusted+in+vain.+It+is+no+objection+at+all+to+the+worth+of+this+agency+that+it+may+appear+weak+or+unwise+to+common+reason.%0A%0AWe+know%2C+that+the+wisdom+of+God+is+in+other+cases+foolishness+with+men%3B+and+it+belongs+to+that+faith%2C+by+which+the+church+should+be+led%2C+to+confide+in+his+appointments%2C+even+where+the+power+of+them+is+not+at+once+manifest%2C+rather+than+in+any+rules+of+action+suggested+by+the+philosophy+of+man%2C+however+profound+and+comprehensive+that+philosophy+may+claim+to+be.%0A%0AIn+every+case+in+which+the+church+is+bold+enough+to+commit+her+cause+in+this+way%2C+with+godly+simplicity%2C+to+the+experiment+of+faith%2C+it+will+be+found+that+the+foolishness+of+God+is+wiser+than+men%2C+and+his+weakness+stronger+than+their+strength%3B+and+that+it+is+better+to+trust+his+counsel%2C+even+against+hope%2C+than+to+put+confidence+in+the+most+princely+show+of+reason+arrayed+against+it.%E2%80%9D%0A%0A%E2%80%94+The+Presbytery+of+Ohio%2C+On+the+Claims+of+the+Christian+Sabbath%3B+A+Report+Read+and+Adopted+April+21%2C+1836%2C+at+a+Meeting+of+the+Presbytery%2C+held+at+Raccoon+Church%2C+%28Pittsburgh+PA%3A+William+Allinder%2C+1836%29%2C+pp+9-10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc6b1fb719e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c6b1fb719e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/05/01/the-presbytery-of-ohio-on-the-power-of-church-discipline/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-c30af86216" data-kw="">
<blockquote><p>Just as Abraham, when God allied Himself with him, was obligated to ‘walk before his face’, so Israel as a people was similarly admonished by God’s covenant to a new obedience. The entire law, which the covenant of grace at Mount Sinai took into its service, is intended to prompt Israel as a people to ‘walk’ in the way of the covenant. It is but an explication of the one statement to Abraham: ‘Walk before me, and be blameless [Gen. 17:1], and therefore no more a cancellation of the covenant of grace and the foundation of a covenant of works than this word spoken to Abraham. The law of Moses, accordingly, is not antithetical to grace but subservient to it and was also thus understood and praised in every age by Israel’s pious men and women. But detached from the covenant of grace, it indeed became a letter that kills, a ministry of condemnation. Another reason why in the time of the Old Testament the covenant of grace took the law into its service was that it might arouse the consciousness of sin, increase the felt need for salvation, and reinforce the expectation of an even richer revelation of God’s grace. It is from that perspective that Paul views especially the Old Testament dispensation of the covenant of grace. He writes that Israel as a minor, placed under the care of the law, had to be led to Christ (Rom. 10:4; Gal. 3:23f.; 4:1f.) and that in that connection sin would be increased and the uselessness of works for justification and the necessity of faith would be understood (Rom. 4:15; 5:20; 7:7f.; 8:3; Gal. 3:19). On the one hand, therefore, the law was subservient to the covenant of grace; it was not a covenant of works in disguise and did not intend that humans would obtain justification by their own works. On the other hand, its purpose was to lay the groundwork for a higher and better dispensation of that same covenant of grace to come in the fullness of time. The impossibility of keeping the Sinaitic covenant and of meeting the demands of the law made another and better dispensation of the covenant of grace necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 3, pt. 2, ch. 5, ‘The Covenant in Old Testament Salvation History’, p. 222</span></figcaption>

</figure><figure class="quote" id="q-e0985778de" data-kw="">
<blockquote><p>The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?</p></blockquote>

<blockquote><p>Canon XXIV: But this later Covenant of Grace according to the diversity of times has also different dispensations. For when the Apostle speaks of the dispensation of the fullness of times, that is, the administration of the last time (Eph 1:10), he very clearly indicates that there had been another dispensation and administration until the times which the Father appointed. Yet in the dispensation of the Covenant of Grace the elect have not been saved in any other way than by the Angel of his presence (Isa 63:9), the Lamb slain from the foundation of the world (Rev 13:8), Christ Jesus, through the knowledge of that just Servant and faith in him and in the Father and his Spirit. For Christ is the same yesterday, today, and forever (Heb 13:8). And by His grace we believe that we are saved in the same manner as the Fathers also were saved, and in both Testaments these statutes remain unchanged: “Blessed are all they that put their trust in Him,” (the Son) (Ps 2:12); “He that believes in Him is not condemned, but he that does not believe is condemned already” (John 3:18). “You believe in God,” even the Father, “believe also in me” (John 14:1). But if, moreover, the holy Fathers believed in Christ as their God, it follows that they also believed in the Holy Spirit, without whom no one can call Jesus Lord. Truly there are so many clearer exhibitions of this faith of the Fathers and of the necessity of such faith in either Covenant, that they can not escape any one unless one wills it. But though this saving knowledge of Christ and the Holy Trinity was necessarily derived, according to the dispensation of that time, both from thc promise and from shadows and figures and mysteries, with greater difficulty than in the NT. Yet it was a true knowledge, and, in proportion to the measure of divine Revelation, it was sufficient to procure salvation and peace of conscience for the elect, by the help of God’s grace. Canon XXV: We disapprove therefore of the doctrine of those who fabricate for us three Covenants, the Natural, the Legal, and the Gospel, different in their entire nature and essence, and in explaining these and assigning their differences, so intricately entangle themselves that they greatly obscure and even impair the nucleus of solid truth and piety. Nor do they hesitate at all, with regard to the necessity, under the OT dispensation, of knowledge of Christ and faith in him and his satisfaction and in the whole sacred Trinity, to speculate much too loosely and dangerously.</p></blockquote>

— Stephen Marshall, The Formula Consensus Helvetica [The Swiss Form of Consensus] 1675 | trans. Martin I. Klauber, Trinity Journal 11 (1990): pp. 103-23 See Wikipedia for background.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCanon+XXIV%3A+But+this+later+Covenant+of+Grace+according+to+the+diversity+of+times+has+also+different+dispensations.+For+when+the+Apostle+speaks+of+the+dispensation+of+the+fullness+of+times%2C+that+is%2C+the+administration+of+the+last+time+%28Eph+1%3A10%29%2C+he+very+clearly+indicates+that+there+had+been+another+dispensation+and+administration+until+the+times+which+the+Father+appointed.+Yet+in+the+dispensation+of+the+Covenant+of+Grace+the+elect+have+not+been+saved+in+any+other+way+than+by+the+Angel+of+his+presence+%28Isa+63%3A9%29%2C+the+Lamb+slain+from+the+foundation+of+the+world+%28Rev+13%3A8%29%2C+Christ+Jesus%2C+through+the+knowledge+of+that+just+Servant+and+faith+in+him+and+in+the+Father+and+his+Spirit.+For+Christ+is+the+same+yesterday%2C+today%2C+and+forever+%28Heb+13%3A8%29.+And+by+His+grace+we+believe+that+we+are+saved+in+the+same+manner+as+the+Fathers+also+were+saved%2C+and+in+both+Testaments+these+statutes+remain+unchanged%3A+%E2%80%9CBlessed+are+all+they+that+put+their+trust+in+Him%2C%E2%80%9D+%28the+Son%29+%28Ps+2%3A12%29%3B+%E2%80%9CHe+that+believes+in+Him+is+not+condemned%2C+but+he+that+does+not+believe+is+condemned+already%E2%80%9D+%28John+3%3A18%29.+%E2%80%9CYou+believe+in+God%2C%E2%80%9D+even+the+Father%2C+%E2%80%9Cbelieve+also+in+me%E2%80%9D+%28John+14%3A1%29.+But+if%2C+moreover%2C+the+holy+Fathers+believed+in+Christ+as+their+God%2C+it+follows+that+they+also+believed+in+the+Holy+Spirit%2C+without+whom+no+one+can+call+Jesus+Lord.+Truly+there+are+so+many+clearer+exhibitions+of+this+faith+of+the+Fathers+and+of+the+necessity+of+such+faith+in+either+Covenant%2C+that+they+can+not+escape+any+one+unless+one+wills+it.+But+though+this+saving+knowledge+of+Christ+and+the+Holy+Trinity+was+necessarily+derived%2C+according+to+the+dispensation+of+that+time%2C+both+from+thc+promise+and+from+shadows+and+figures+and+mysteries%2C+with+greater+difficulty+than+in+the+NT.+Yet+it+was+a+true+knowledge%2C+and%2C+in+proportion+to+the+measure+of+divine+Revelation%2C+it+was+sufficient+to+procure+salvation+and+peace+of+conscience+for+the+elect%2C+by+the+help+of+God%E2%80%99s+grace.+Canon+XXV%3A+We+disapprove+therefore+of+the+doctrine+of+those+who+fabricate+for+us+three+Covenants%2C+the+Natural%2C+the+Legal%2C+and+the+Gospel%2C+different+in+their+entire+nature+and+essence%2C+and+in+explaining+these+and+assigning+their+differences%2C+so+intricately+entangle+themselves+that+they+greatly+obscure+and+even+impair+the+nucleus+of+solid+truth+and+piety.+Nor+do+they+hesitate+at+all%2C+with+regard+to+the+necessity%2C+under+the+OT+dispensation%2C+of+knowledge+of+Christ+and+faith+in+him+and+his+satisfaction+and+in+the+whole+sacred+Trinity%2C+to+speculate+much+too+loosely+and+dangerously.%E2%80%9D%0A%0A%E2%80%94+Stephen+Marshall%2C+The+Formula+Consensus+Helvetica+%5BThe+Swiss+Form+of+Consensus%5D+1675+%7C+trans.+Martin+I.+Klauber%2C+Trinity+Journal+11+%281990%29%3A+pp.+103-23+See+Wikipedia+for+background.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29bc292ded.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29bc292ded.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/#:~:text=Canon%20XXIV%3A%20But%20this%20later%20Covenant,speculate%20much%20too%20loosely%20and%20dangerously&amp;text=Canon%20XXIV%3A%20But%20this%20later%20Covenant%20of%20Grace&amp;text=Trinity%2C%20to%20speculate%20much%20too%20loosely%20and%20dangerously" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Whether there is a natural law, and how it differs from the moral law. The former we affirm; the latter we distinguish. The moral law remains perpetual; the ceremonial is abrogated in Christ as to obligation, having served as types; the judicial binds as to general equity. From the law comes knowledge of sin, and justification by the law is impossible to fallen man.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c5704adf74" data-kw="">
<blockquote><p>Mrs Dougal, Sarah Jane Kelly, and Jospeh Hall being present as candidates for membership are examined.

The examinations was sustained as regards Mrs Dougal &amp; Joseph Hall but Sarah Jane Kelly being found somewhat deficient in scriptural knowledge and not having read our Testimony nor the covenants her admission was deferred for the present that she may read these standards &amp; otherwise. […]

John Wark being present as a candidate for admission to membership is examined at considerable length and being found rather deficient in knowledge in some respects his admission is deferred and he is recommended to read the Testimony and the covenants, neither of which he has read, and to persevere in his search after further information in religious subjects. And it is hoped that before our next communion the session will see the way clear to admit him. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/londonderry-reformed-presbyterian-church.html">Londonderry Reformed Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Londonderry Reformed Presbyterian Church</cite>, 21 Oct. 1860, 16 May 1861</span></figcaption>

</figure><figure class="quote" id="q-5ae056fcaf" data-kw="">
<blockquote><p>I hope no length of time, or change of circumstances, shall cause you to forget those solemn views of eternity, and impressions of your misery as a sinner, and those beginnings of the knowledge of the glory and love of Christ, which so deeply engaged your thoughts while with us. These gifts and callings of God, being according to the counsel of his eternal love, are without repentance on his part.

And though we, in ourselves, are unstable as water, and would soon mar the work, and cast away the charters of our eternal inheritance, he is the Rock, he changeth not, and will not suffer us essentially to change; but will bring judgment unto victory—bringing light out of our wretched darkness, order out of our confusion, and establishment and fresh displays of his power and love out of our faintings and backslidings.</p></blockquote>

</figure><figure class="quote" id="q-8186843c7c" data-kw="">
<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs.

4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>

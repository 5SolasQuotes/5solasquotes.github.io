<main class="wrap"><figure class="quote" id="q-e3236da1c4" data-kw="">
<blockquote><p>A class of subjects same to be discussed in the latter part of the sixteenth century which had not engaged so much of the attention of the earlier Reformers–especially the Erastian and the Prelatic controversies–and in the discussion of these matters Beza bore his part nobly as an able and faithful champion of the truth. The Erastian controversy, indeed, as conducted between Erastus and Beza, turned mainly upon the particular subject of the excommunication of church members; and it was not till the following century, that the whole of the principles usually regarded by Presbyterian divines as comprehended in the Erastian controversy, were subjected to a full and thorough discussion. Still, even at that early stage, the quested was mooted, on which the entire progress of the subsequent discussion, down even to our own day, has made it more and more manifest that the whole controversy hinges–viz. whether or not Christ has appointed in His church a government, distinct from, independent of, and in its own province not subordinate to, civil magistracy. And on this great question, as well as on the particular topic of excommunication comprehended under it, Erastus took the side which has always been supported by politicians, sycophants [obedient flatterers], and worldlings, while Beza ably defended that which has been adhered to by all intelligent and conscientious Presbyterians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation</cite>, ch. 7, ‘Calvin &amp; Beza’, pp. 350-51</span></figcaption>

<blockquote><p>…and if the Church should tell the Magistrate his duty, as watchmen should do to all under their care, Eze. 3:16-19, Magistrate or other[wise]; if the Magistrate spare the life of a murderer, the watchmen are unfaithful if they complain not openly and tell the Magistrate he does not his duty; and upon the same ground, if the Magistrate must coerce with the sword seducing wolves and Jezebels, the pastors ought to admonish him. And it’s atheistic to say [that] the ‘Magistrate is conscious of sins against manners, and of his duty and obligation he needs no instigation.’ Because no Magistrate, be he an Ahab or a David, but he needs be quickened to his duty; and will send a murderer away, and a bloody Joab whom God will have not to live; and should the prophets be called instigatores [instigators] and savientes per alios [those raging through others], such as destroy men’s lives, when they tell the Magistrate [that] he is a murderer and guilty of innocent blood if he suffer the bloody man to live? Or should this be called tale-telling and the pastor thrusting of himself into a more disaffecting office to be a tale-teller, an apparitor [servant of a public official] or summoner of men to the civil Magistrate’s court, [in that] he made such a poor man be fined, and wife and children be starved because he is not of his opinion? [This is an absurd charge.] …Such a man of our [pastoral] charge [if he did not so complain of false teachers to the magistrate] is damned by his own conscience and devours the flock, as Arius [an early Church heresiarch] and Manes [of the Manicheans] did; such a one is a bloody murderer, a sorcerer; the Magistrate bears the sword to execute vengeance on evil doers, and yet [contrary to this, he] suffer[s] known murderers to live and be gray-haired: Are ministers, who are to warn fathers, teachers, masters, judges, kings, Jer. 1:10, nations and kingdoms of their duty, ‘thrusters of themselves into a disaffecting office, and apparitors and summoners of men before civil courts’ because they warn the Magistrate of his duty? Is this obtruding into another office to give warning to all to be free of the blood of all men? [Eze. 33:8-9] This is like the speech of a wicked King Amaziah, 2 Chron. 25:16, to the prophet who rebuked him, for seeking after the gods of the nations: ‘Art thou made of the king’s counsel? Forbear, why shouldest thou be smitten?’ I therefore summon this [Libertine] author to compeer [appear] before the Judge of the world, and give an account of this doctrine, for he speaks it against the faithful servants of God of the Church of Scotland, who complained to the king of idolatrous seducers and seminary priests and Jesuits, of bloody murderers, of grinders of the faces of the poor and incorrigible, scandalous offenders, whose wretched example was a shame to the gospel and brought guilt upon the land, that he might use the sword against such evil doers? And should ministers be apparitors and tale-tellers either against such as deserve capital punishment for sins against the Second Table as well as against the First Table? Woe will be to him that calls good evil and evil good. Is the necessary duty of the calling of a watchman to warn the Magistrate of his bloody omissions, for so the Lord calls it (Isa. 1.21-22; 3:12-15; Prov. 29:7; 31:8) and exhorts to it, an overdoing? and a tale-bearing?</p></blockquote>

<blockquote><p>Conclusion 1: This civil coercive power is not only unnecessary, but unlawful to be exercised in the planting of the Church, and bringing men to the faith of Christ. Churches are not to be planted by weapons, but by doctrines (Lactantius, Institutes, bk. 5, ch. 20); not by the power of the sword, but by the efficacy of the Word; not by carnal weapons, but by spiritual means. The commission that Christ gave his apostles for the spreading and planting of the Gospel was only this, ‘Go and teach all nations, baptizing them in the name of the Father, and of the Son and of the Holy Ghost,’ Mt. 28:19-20, the like, in Mk. 16:15. And Christ tells us his kingdom is not of this world, for then his servants would fight for him, Jn. 18:36, but that was not the way to plant or advance his kingdom. Christ has no need of such carnal weapons for the planting of his Church, or the settling Him in his kingdom: the apostles had a warfare to fight, but the weapons of their warfare were not carnal, but spiritual, and yet strong to pull down the strongest holds of sin and Satan, and to bring every thought in obedience to Christ, 2 Cor. 10:3-4. They had a sword to wield, but that sword was no other but the Word of God, the sword of the Spirit, Eph. 6:17; Rev. 19:15. Here were armies to subdue even nations to Christ, but these were armies of teachers, not of soldiers, as the Psalmist alludes, Ps. 68:11. External force is not the way of Christ for the spreading his Gospel, and planting of his kingdom: It is true here, Religio suaderi potest, cogi non potest, ‘Men may be persuaded into a religion, but they can never be compelled.’ All externall acts of power are not able to beget internal acts of faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5569676ec3" data-kw="ministry angels heirs">
<blockquote><p>No one can doubt that God uses the ministry of angels, since they are called “ministering spirits” (Heb. 1:14), “ministers of God” (Ps. 104:4), who continually stand before him and minister unto him (Dan. 7:10) and do his will (Ps. 103:21). He uses their help not from necessity and indigence, but from indulgence and love—for the good of the angels themselves and for the good of the heirs of salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/ministry-to-the-heirs-of-salvation.html">Ministry to the heirs of salvation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84f6615a61" data-kw="angel power limits">
<blockquote><p>Whatever the power of the angels (the greatest of all created power) may be, still it is finite and circumscribed by certain limits, so that although they can do many things, still they cannot do all things (since this power to do all things belongs to the omnipotent God alone). Scripture calls them excelling in strength (Ps. 103:20) and mighty angels (2 Thess. 1:7), yet their power is created and limited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.5.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/power-of-satan.html">Power of Satan</a> › <a href="../topics/angels-and-demons/power-of-satan/limits.html">Limits</a></span><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a> › <a href="../topics/angels-and-demons/evil-angels/satan.html">Satan</a></span><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a> › <a href="../topics/angels-and-demons/evil-angels/the-demons.html">The demons</a></span></div>

</figure><figure class="quote" id="q-bbd51f384d" data-kw="fall of angels">
<blockquote><p>What was the sin of the angels by which they are said to have rebelled against God? Sin in particular is distinguished with regard to the subjects in which it inheres: the sin of the angels, who became devils by it; and the sin of men. To no purpose is it inquired how angels could sin. It is evident from Scripture that they did sin and reason persuades us that they could fall into sin since they were created capable of falling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.5.1–2</span></figcaption>

</figure><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/guardian-angels.html">Guardian angels</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 7.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs%20a%20particular%20angel%20assigned%20as%20a%20perpetual%20guardian%20to%20each%20believer%3F%20We%20deny.%20From%20Acts%2012%3A15%2C%20where%20mention%20is%20made%20of%20Peter%E2%80%99s%20angel%2C%20it%20can%20be%20collected%20that%20a%20certain%20angel%20was%20then%20present%20with%20Peter%2C%20but%20not%20that%20a%20particular%20and%20perpetual%20guardian%20was%20given%20to%20him.%20For%20he%20is%20said%20%E2%80%9Cto%20have%20come%20upon%20him%E2%80%9D%3B%20as%20when%20%E2%80%9Cthe%20physician%20and%20servant%20of%20the%20king%E2%80%9D%20is%20alluded%20to%2C%20not%20a%20particular%20one%20is%20understood%2C%20but%20indefinitely%20he%20who%20performs%20that%20office%20%28which%20many%20can%20perform%20successively%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%207.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F753214a097.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/753214a097.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7a6b36f33c" data-kw="">

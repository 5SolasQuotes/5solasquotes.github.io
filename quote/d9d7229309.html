<main class="wrap"><figure class="quote" id="q-d9d7229309" data-kw="">
<blockquote><p>Plus, the proof he [Francis Suarez] tries to give there says nothing peculiar that exceeds in certainty and evidence the common method of demonstrating from effect to cause, from creation to creator, shown in sacred Scripture (Isaiah 40, Psalm 19, Romans 1 and 2, Acts 17), explained and developed by the church fathers, Thomas Aquinas with the scholastics, and more recent thinkers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665; 2024) at Translationes Lyncei</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f59812f657" data-kw="">
<blockquote><p>In the book The Open Secret: A New Vision for Natural Theology, Alister McGrath sets out to lay the foundations for an entirely new natural theology… ‘…if nature is to disclose the transcendent, it must be ‘seen’ or ‘read’ in certain specific ways – ways that are not themselves necessarily mandated by nature itself.’ He does not wish to embark on a neutral natural theology, but to advance a Christian natural theology – one which, rather than proving the doctrinal claims of Christianity, begins by accepting the doctrinal claims of Christianity, and then goes on to show how the Christian worldview gives the best interpretation of our perceptions of this universe. The claim that he will seek to validate in his book is summarized briefly as follows: ‘…A Christian understanding of nature is the intellectual prerequisite for a natural theology which discloses the Christian God.’ In order to understand his revised natural theology we must first understand the need for this revision. What does McGrath perceive as the old natural theology, and what is so wrong with it that we need a new vision? Once we have understood these contentions we will be able to better understand McGrath’s revised version, which will allow us to give it a critical analysis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Alister McGrath &amp; Natural Theology’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

%20The%20Open%20Secret%3A%20A%20New&amp;text=allow%20us%20to%20give%20it%20a%20critical%20analysis" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1f3ebcac39" data-kw="">
<blockquote><p>The holy scripture therefore, designing by revealed religion to maintain and improve natural religion, to repair the decays of it and supply the defects of it, since the fall, for the reviving of the precepts of the law of nature, lays down, at first, this principle of the unclouded light of nature, That this world was, in the beginning of time, created by a Being of infinite wisdom and power, who was himself before all time and all worlds.</p></blockquote>

</figure><figure class="quote" id="q-d456c6d02f" data-kw="">
<blockquote><p>Michael Sudduth examines three prominent objections to natural theology that have emerged in the Reformed streams of the Protestant theological tradition: objections from the immediacy of our knowledge of God, the noetic effects of sin, and the logic of theistic arguments. Distinguishing between the project of natural theology and particular models of natural theology, Sudduth argues that none of the main Reformed objections is successful as an objection to the project of natural theology itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-sudduth.html">Michael Sudduth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Objection to Natural Theology Pre</cite></span></figcaption>

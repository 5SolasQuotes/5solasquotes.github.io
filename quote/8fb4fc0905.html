<main class="wrap"><figure class="quote" id="q-8fb4fc0905" data-kw="">
<blockquote><p>Hence our Fifth Conclusion: when there is an equal rupture in the body, nothing extraordinary would be attempted if ordinary ways can be had: if Saul the ordinary magistrate had, at God’s commandment, killed Hagag, Samuel the prophet should not have drawn his sword…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

</figure><figure class="quote" id="q-66b7d80cb8" data-kw="">
<blockquote><p>A particular church, gathered and completely organized according to the mind of Christ, consists of officers and members; and the officers appointed by Christ to be chosen and set apart by the church (so called and gathered), for the peculiar administration of ordinances, and execution of power or duty, which he intrusts them with, or calls them to, to be continued to the end of the world, are bishops or elders, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>
<div class="actions"><button class="copy" data-copy="“A particular church, gathered and completely organized according to the mind of Christ, consists of officers and members; and the officers appointed by Christ to be chosen and set apart by the church (so called and gathered), for the peculiar administration of ordinances, and execution of power or duty, which he intrusts them with, or calls them to, to be continued to the end of the world, are bishops or elders, and deacons.”

</figure><figure class="quote" id="q-f2fe5b8374" data-kw="">
<blockquote><p>…therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God… And as touching things of prudence, they are things properly mixed, as at what hour sermon shall begin in such a church, at eight, or nine, or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; For to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12, not to [the] imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-0c68bea489" data-kw="">
<blockquote><p>Because these places [of Scripture] do not only apply the titles indifferently, but do indifferently apply the duties, qualifications and every other thing that belongs to such officers and offices; and there is nothing spoken of the one in Scripture, but it is also spoken of the other, neither anything required as a qualification in, or duty from the one, but is also done in reference to the other, and that expressly.</p></blockquote>

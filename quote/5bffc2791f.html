<main class="wrap"><figure class="quote" id="q-5bffc2791f" data-kw="">
<blockquote><p>Also one must bear in mind that God’s original wish was that all should be saved [1 Tim. 2:4] and come to His Kingdom. For it was not for punishment that He formed us but to share in his goodness, inasmuch as He is a good God. But inasmuch as He is a just God, his will is that sinners should suffer punishment. The first then is called God’s antecedent will and pleasure, and springs from Himself, while the second is called God’s consequent will and permission, and has its origin in us. And the latter is twofold: one part dealing with matters of guidance and training, and having in view our salvation, and the other being hopeless and leading to our utter punishment, as we said above. And this is the case with actions that are not left in our hands. But of actions that are in our hands, the good ones depend on his antecedent goodwill and pleasure, while the wicked ones depend neither on his antecedent, nor on His consequent will, but are a concession to free-will. For that which is the result of compulsion has neither reason nor virtue in it. God makes provision for all creation and makes all creation the instrument of his help and training, yea often even the demons themselves, as for example in the cases of Job and the swine [Mt. 8:30 ff.].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-of-damascus.html">John of Damascus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Orthodox Faith</cite>, bk. 2, ch. 29, ‘On Providence’ in NPNF2, vol. 9, pt. 2, p. 42 Damascus (c. 675 or 676 – 749) was Christian monk, apologist and theologian, known as the last of the Greek fathers. Damascus appears not to believe in an unconditional predestination underlying his antecedent/ consequent distinction, per ch. 30.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7292ee5fa0" data-kw="">
<blockquote><p>Again, some school-divines following Damascene make and ascribe to God an applied or depending [consequent] will, on this manner: God for his part [antecedently] would have all men without exception to be saved: why then are they not saved? They themselves will not. And because they will not, God therefore [consequently] chooses some and refuses others. But according to the former doctrine, I take this kind of applied will to be an invention of man’s brain. For the contrary is the truth, namely that man’s will wholly depends on the will of God. That vessels be some of honor, some of dishonor, it is not in the power of the clay, but in the will of the potter. The first cause orders the second, and not the second the first. To make God’s will depend on man’s will, is to put God out of his throne of majesty, and to set the creature in his room. Others set forth the depending will of God on this manner: God (say they) decrees nothing in particular of things that are casual and contingent, but He foresees within Himself what the will of the creature will do or not do, when things are thus or thus ordered: and upon this foresight He consequently determines what shall be done. (Bellarmine, bk. 4, ch. 15, Of Grace &amp; Free Will; Richard Tapper) But this opinion, as it gives unto God a common or general providence, so it takes away the certain determination of God touching all particular events. And it is absurd to think that God should foresee the future acts of man’s freewill, when as yet He has determined nothing: for things that shall be, are therefore to come to pass, because God by decree has determined their being. And therefore the foreknowledge of things that shall be follows the decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), pp. 146-48</span></figcaption>

</figure><figure class="quote" id="q-e7cc6e2b80" data-kw="">
<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. 1 | PRRD, vol. 3, p. 470</span></figcaption>

</figure><figure class="quote" id="q-cdf2b964bf" data-kw="decretive preceptive">
<blockquote><p>Although the will in God is only one and most simple, yet because it is occupied differently about various objects, it may be apprehended as manifold. The first and principal distinction is that of the decretive and preceptive will. The former means that which God wills to do or permit himself; the latter what he wills that we should do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.1–2</span></figcaption>

</figure><figure class="quote" id="q-c81dac9740" data-kw="">
<blockquote><p>§ 53. But how comes it to pass then, that these blessed means of grace, these conveyances of the Spirit are so often ineffectual? Many men do daily pray, often hear and read the Word of God, have been engraffed into the body of Christ by baptism, and many times receive the blessed eucharist, and yet little or no news do they hear of the Spirit, very little stirrings of the heart, few good motions do they feel within, they are never the better, nor a whit the more enriched, either with spiritual gifts or graces for the use of these means: The cause whereof is the hardness of man’s heart, which receives not the impressions of the Spirit; the corruption of man’s nature, which quenches the sacred fires of piety and charity, before they be well enkindled in the soul; the exorbitant and unruly lusts of the flesh, and of the world, which resist the good motions, lustings, and strivings of the Spirit of God. Intus existens prohibet alienum; when the fruits of the flesh have overgrown the soul, there’s no room for the fruits of the Spirit to take rooting there: These two kinds of fruits cannot grow both in one heart, but the one will choak, overgrow, and destroy the other. To this outward means of grace then, and of the Spirit, the inward qualifications, the infitting of the soul to receive the impressions of the Spirit must be added…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel</cite>, … with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman., pp. 152-53</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§ 53. But how comes it to pass then, that these blessed means of grace, these conveyances of the Spirit are so often ineffectual? Many men do daily pray, often hear and read the Word of God, have been engraffed into the body of Christ by baptism, and many times receive the blessed eucharist, and yet little or no news do they hear of the Spirit, very little stirrings of the heart, few good motions do they feel within, they are never the better, nor a whit the more enriched, either with spiritual gifts or graces for the use of these means: The cause whereof is the hardness of man’s heart, which receives not the impressions of the Spirit; the corruption of man’s nature, which quenches the sacred fires of piety and charity, before they be well enkindled in the soul; the exorbitant and unruly lusts of the flesh, and of the world, which resist the good motions, lustings, and strivings of the Spirit of God. Intus existens prohibet alienum; when the fruits of the flesh have overgrown the soul, there’s no room for the fruits of the Spirit to take rooting there: These two kinds of fruits cannot grow both in one heart, but the one will choak, overgrow, and destroy the other. To this outward means of grace then, and of the Spirit, the inward qualifications, the infitting of the soul to receive the impressions of the Spirit must be added…”

— Richard Sherlock, The Quakers’ Wild Questions Objected against the Ministers of the Gospel… with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman., pp. 152-53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7+53.+But+how+comes+it+to+pass+then%2C+that+these+blessed+means+of+grace%2C+these+conveyances+of+the+Spirit+are+so+often+ineffectual%3F+Many+men+do+daily+pray%2C+often+hear+and+read+the+Word+of+God%2C+have+been+engraffed+into+the+body+of+Christ+by+baptism%2C+and+many+times+receive+the+blessed+eucharist%2C+and+yet+little+or+no+news+do+they+hear+of+the+Spirit%2C+very+little+stirrings+of+the+heart%2C+few+good+motions+do+they+feel+within%2C+they+are+never+the+better%2C+nor+a+whit+the+more+enriched%2C+either+with+spiritual+gifts+or+graces+for+the+use+of+these+means%3A+The+cause+whereof+is+the+hardness+of+man%E2%80%99s+heart%2C+which+receives+not+the+impressions+of+the+Spirit%3B+the+corruption+of+man%E2%80%99s+nature%2C+which+quenches+the+sacred+fires+of+piety+and+charity%2C+before+they+be+well+enkindled+in+the+soul%3B+the+exorbitant+and+unruly+lusts+of+the+flesh%2C+and+of+the+world%2C+which+resist+the+good+motions%2C+lustings%2C+and+strivings+of+the+Spirit+of+God.+Intus+existens+prohibet+alienum%3B+when+the+fruits+of+the+flesh+have+overgrown+the+soul%2C+there%E2%80%99s+no+room+for+the+fruits+of+the+Spirit+to+take+rooting+there%3A+These+two+kinds+of+fruits+cannot+grow+both+in+one+heart%2C+but+the+one+will+choak%2C+overgrow%2C+and+destroy+the+other.+To+this+outward+means+of+grace+then%2C+and+of+the+Spirit%2C+the+inward+qualifications%2C+the+infitting+of+the+soul+to+receive+the+impressions+of+the+Spirit+must+be+added%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Sherlock%2C+The+Quakers%E2%80%99+Wild+Questions+Objected+against+the+Ministers+of+the+Gospel%E2%80%A6+with+Brief+Answers+Thereunto...+%28London%3A+Cotes%2C+1654%29+Sherlock+%281612%E2%80%931689%29+was+an+Anglican+clergyman.%2C+pp.+152-5

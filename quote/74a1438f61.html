<blockquote><p>The Rules,

I. As the Ceremonial Law had relation to God, so the Judicial to our Neighbour.

II. The Judicial Law binds us in those things that agree with the Moral Law, and were of common right.

III. But what was of private right, and commanded for the Jewish Common-wealth in particular, do no more bind us, than the Municipal Laws of other Common-wealths.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), pp 107-08.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1b9e52002" data-kw="">
<blockquote><p>It is true, indeed, a prince should be loath to put out that life that God hath put in, and should beware, to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince hath no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate the punishment, but to say he may let the man go free, he hath no power. But yet they will insist further, and say, Is not this one of the judicial laws that was given to the Jews—then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them—they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know, that natural men, ethnics, who had never the law of the Jews, they executed the murderer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures Upon The Passion, Resurrection, And Ascension Of Christ</cite>, (Edinburgh: The Wodrow Society, 1616), 87–88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-3032479f3f" data-kw="">
<blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh, 1659), pt. 2, ch. 10, ‘Clearing whether in Church-processes an Accuser be always necessary’, pp. 120-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>XIII. The glory of God, the good of souls, the happiness of Christian societies, are irresistible motives to quicken the magistrate to act (against such dangerous persons as we have described according to the law of judgement, and their different demerits) in Faith and Love:

      1. In Faith; for the Christian magistrate does not act like himself, if he does not perform acts of civil-justice in faith. And it is clear that if there be no moral equity in any of the judicial laws in the Old Testament (and there are none at all extant in the New) [then] the Christian magistrate cannot perform any act of Civil-justice in faith. But it is indeed too evident to be denied that all divine laws which concern the punishment of moral transgressions are of perpetual obligation, and therefore still remain in force according to their substance and general equity, abstracted from special circumstances, typical accessories and the old forms of Mosaical polity, for:

      1. These divine laws are not expired in their own nature.

      2. They are not repealed by God.

      3. The authority of the Lawgiver is the same under both administrations, old and new; the consciences of Christians as well as Jews are subject to his sovereign and perpetual jurisdiction.

      4. The matter of the laws is moral, and very agreeable to the dictates of nature, as does appear by the several laws and decrees of heathens: Dan. 3:29; Ezra. 7:23,25-27; Ezra 10:3,5,8 compared with Num. 15:30-31; Lev. 24:15-16; Deut. 13:8-9; Zech. 13:3,6. Seducing, poisoning, slaying of souls is by the law of Nature and Nations the worst of injuries.

      5. The reason of these divine laws is immutable, and that reason is sometimes expressed and declared: But it is not necessary that there should be any express ratification of every moral law in the New Testament which is plainly delivered in the Old.

      6. These divine laws are independent on the will of man, and therefore indispensable man’s authority.</p></blockquote>

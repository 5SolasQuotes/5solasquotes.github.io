<main class="wrap"><figure class="quote" id="q-19d46ee560" data-kw="natural">
<blockquote><p>We find in man a natural law written upon each one’s conscience excusing and accusing them in good and bad actions, which therefore necessarily implies the knowledge of God, the legislator, by whose authority it binds men to obedience and proposes rewards or punishments. “The Gentiles, which have not the law” (i.e., the law of Moses) “do by nature the things contained in the law, these, having not the law, are a law unto themselves: which show the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the meanwhile accusing or else excusing one another” (Rom. 2:14, 15). This could not be said if conscience did not dictate to each one that there is a deity who approves of good actions and disapproves and punishes evil deeds. Nor are these objections of force: (1) the work of the law and not the law itself is said to be inscribed because with the apostle these are synonymous—“to be a law unto themselves” (v. 14) and “to have the work of the law written in their hearts” (v. 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a> › <a href="../topics/theology/natural-theology/knowledge-of-god-from-creation.html">Knowledge of God from creation</a></span><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a> › <a href="../topics/theology/natural-theology/limits-of-natural-light.html">Limits of natural light</a></span></div>

ked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5f702de65" data-kw="wayfarers">
<blockquote><p>A science practical per se is not only that which is concerned with an operable thing and is regulative and directive of some operation. Otherwise that part of medicine which considers the parts of the human body and their diseases (and the signs and causes of diseases) would be speculative and not practical, which is absurd. For the ultimate and principal object of that branch of medicine is not the knowledge but the cure of diseases. Also that which is either impulsive to operation (as the knowledge of the good or evil consequences which follow virtue or vice), impels to right actions or is prerequisite to a better operation and action, as pathology (pathologikē) in medicine. Theology is called practical not only in the first sense, but also in the second and third. There is no mystery proposed to our contemplation as an object of faith which does not excite us to the worship of God or which is not prerequisite for its proper performance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.7</span></figcaption>

</figure><figure class="quote" id="q-febddeb1ba" data-kw="preacher">
<blockquote><p>The reasons are: (1) the Scriptures frequently enjoin this judgment (Mt. 7:15; 16:6; Col. 2:8; 1 Thess. 5:21; Heb. 5:14); (2) the examples of the saints confirm it, as the Bereans (Acts 17:11) and the Corinthians (1 Cor. 10:15); (3) the design of Scripture teaches it (which is the perfection of the man of God in the knowledge of the truth and the conviction of gainsayers [2* Tim. 3:16; Tit. 1:9], which cannot be accomplished without it); (4) the use of reason is a strong proof because as the knowledge of the affirmation and negation of propositions and the doctrine of contradiction belong to it, so also must such a judgment. And unless we allow this, the widest door will be thrown open to all kinds of heretics and fanatics for introducing their fictions and monstrous opinions and we can never use any true contradiction. Sources of explanation.</p></blockquote>

</figure><figure class="quote" id="q-88c9aedd8b" data-kw="">
<blockquote><p>The Bible is to the theologian what nature is to the man of science. It is his store-house of facts; and his method of ascertaining what the Bible teaches, is the same as that which the natural philosopher adopts to ascertain what nature teaches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 1, § 5, “The Inductive Method”</span></figcaption>

</figure><figure class="quote" id="q-d9312c1d79" data-kw="necessity scripture">
<blockquote><p>Three things particularly prove the necessity of the Scripture: (1) the preservation of the word; (2) its vindication; (3) its propagation. It was necessary for a written word to be given to the church that the canon of true religious faith might be constant and unmoved; that it might easily be preserved pure and entire against the weakness of memory, the depravity of men and the shortness of life; that it might be more certainly defended from the frauds and corruptions of Satan; that it might more conveniently not only be sent to the absent and widely separated, but also be transmitted to posterity. For by “letters,” as Vives well observes, “all the arts are preserved as in a treasury, so that they can never perish, while on the contrary, tradition by the hand is unhappy” (De disciplinis … de Corruptis Artibus 1 [1636], p. 5). This is a divine and wonderful advantage of letters, as Quintilian says, “that they guard words and deliver them to readers as a sacred trust” (Institutio Oratoria 1.7.31 [Loeb, 1:144–45]). Nor for any other reason are the public laws, statutes and edicts of kings and the decrees of the commonality inscribed upon brass or committed to public tablets, except that this is the most sure method of preserving them uncorrupted and of propagating through many ages the remembrance of those things which it is important for the people to know.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-21ed39e65e" data-kw="">
<blockquote><p>I have indicated in a variety of ways that the Christian man must believe for a certainty that he is in a state of divine grace, and that he has the cry of the Holy Spirit in his heart, especially when he is performing his proper function, which is to confess or to suffer for confessing. I did this in order that you might utterly repudiate the wicked idea of the entire kingdom of the pope, the teaching that a Christian man must be uncertain about the grace of God toward him. If this opinion stands, then Christ is completely useless. For whoever doubts the grace of God toward him this way must necessarily doubt the promises of God and therefore the will of God, as well as the birth, suffering, death, and resurrection of Christ. There is no greater blasphemy against God than to deny the promises of God and God Himself, Christ, etc. Therefore it was the height not only of insanity but of wickedness when the monks were so zealous in enlisting the youth of both sexes in the monasteries for their religious and, as they called them, “holy” orders, as a sure state of salvation; and then, once they were enlisted, they commanded them to doubt the grace of God. Thus the pope also summoned the whole human race to the obedience of the holy Roman Church as a holy estate in which they would be sure to obtain salvation, and then he commanded those who obeyed his laws to have doubts. In this way the kingdom of Antichrist first boasts and exaggerates the sacredness of its laws, orders, and rules, and it promises the certainty of eternal life to those who observe them; but then, when the miserable beings have been punishing their bodies for a long time in accordance with human traditions by keeping vigils, fasting, etc., their reward for all this is not to know whether or not this obedience of theirs is pleasing to God. Satan took a horrible delight in the killing of souls by the papists. Therefore the papacy is a veritable torture chamber of consciences and the very kingdom of the devil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 385–386.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-246cf2ebb2" data-kw="">
<blockquote><p>As I have said, therefore, the statement of Moses, “Cursed be everyone who does not abide by all things, etc.,” is not contrary to Paul’s declaration that all who rely on works of the Law are under a curse. For Moses demands a doer who keeps the Law perfectly. But where are we to find such a one? Nowhere. Paul admits that he is not such a one, because he says in Rom. 7:15: “I do not do what I want”; and David says: “Enter not into judgment with Thy servant” (Ps. 143:2). Therefore Moses, together with Paul, necessarily drives us to Christ, through whom we become doers of the Law and are accounted guilty of no transgression. How? First, through the forgiveness of sins and the imputation of righteousness, on account of faith in Christ; secondly, through the gift and the Holy Spirit, who creates a new life and new impulses in us, so that we may keep the Law also in a formal sense. Whatever is not kept is forgiven for the sake of Christ. Besides, whatever sin is left is not imputed to us. Thus Moses agrees with Paul and means the same thing when he says: “Cursed be everyone, etc.,” because he denies that they are keeping the Law when they want to justify themselves on the basis of works; and with Paul he concludes that they are under a curse. Therefore Moses requires true doers, who are men of faith, just as Paul condemns those who are not true doers, that is, who are not men of faith. There is no problem here. Moses was speaking negatively and Paul affirmatively, provided that you define correctly what “doing” means. Thus both are true, namely, that all are under a curse who do not abide by all things, etc., and that those who rely on works of the Law are under a curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260–261.</span></figcaption>

</figure><figure class="quote" id="q-3bb240ac05" data-kw="">
<blockquote><p>This, also, is a passage worthy of observation, as shewing that a gratuitous righteousness is not conferred upon us in Christ, without our being at the same time regenerated by the Spirit to the obedience of righteousness, as he teaches us elsewhere, that Christ is made to us righteousness and sanctification. (1Co 1:30.) The former we obtain by a gratuitous acceptance; and the latter by the gift of the Holy Spirit, when we are made new creatures. There is however an inseparable connection between these two blessings of grace.</p></blockquote>

</figure><figure class="quote" id="q-f734a38c26" data-kw="">
<blockquote><p>[1.] Now the active obedience of Christ falls under a twofold consideration: 1. As the man-Christ’s perfect conformity to the Law of God, so as man he was obliged to do and suffer all that He did and suffered, even to lay down his life for man. But had He been only man his righteousness had neither been by condignity meritorious, nor yet satisfactory for us. But: 2. The whole course of Christ’s obedience from his birth to the grave, by doing and suffering, is to be considered as the doing and suffering of so excellent a Person, his being born, his praying, preaching, dying, coming from a Person, God-man. Now the Law required not praying, preaching of God-man, the blood of God, or the dying of Him who was God-Man. And so all these being both so excellent, and then so undue, have respect of satisfaction to God. 2. The active obedience of Christ and all that Christ did and suffered were performed by Him in his state of humiliation: in which he was poor, [Greek], 2 Cor. 8:9, for us, so also by the same ground a weeping man, hungry, thirsty, weary for us, made lower then the angels by the suffering of death, Heb. 2:9, humbled by partaking of flesh and blood, because of the children, Heb. 2:14, emptied Himself for us, Phil. 2. This was, as [David] Pareus well says: perpetua quaedam passio et paena peccatorum nostrorum, fuit tota vita Christi [‘The whole life of Christ was a certain perpetual suffering and punishment for our sins’]: All these have a respect of punishment and suffering. For since Christ was both a viator [pilgrim] and a comprehensor [one attaining glory], and such a holy sinless person, He ought to have had the actual possession of the crown of glory from the womb, and so should have been free of weeping, hunger, thirst, weariness, groaning, sighing, sadnesse, persecution, reproaches, etc., all which adhered to all his active holiness, and therefore, in that, his actions were satisfactory passions. For satisfaction is defined [as] a voluntary restoring of the equivalent, and as good in the place of what is taken away; and the good restored must be: 1. Undue. 2. The proper good of the restorer, which agrees to the active and passive obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; pp. 226-27</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[1.] Now the active obedience of Christ falls under a twofold consideration: 1. As the man-Christ’s perfect conformity to the Law of God, so as man he was obliged to do and suffer all that He did and suffered, even to lay down his life for man. But had He been only man his righteousness had neither been by condignity meritorious, nor yet satisfactory for us. But: 2. The whole course of Christ’s obedience from his birth to the grave, by doing and suffering, is to be considered as the doing and suffering of so excellent a Person, his being born, his praying, preaching, dying, coming from a Person, God-man. Now the Law required not praying, preaching of God-man, the blood of God, or the dying of Him who was God-Man. And so all these being both so excellent, and then so undue, have respect of satisfaction to God. 2. The active obedience of Christ and all that Christ did and suffered were performed by Him in his state of humiliation: in which he was poor, [Greek], 2 Cor. 8:9, for us, so also by the same ground a weeping man, hungry, thirsty, weary for us, made lower then the angels by the suffering of death, Heb. 2:9, humbled by partaking of flesh and blood, because of the children, Heb. 2:14, emptied Himself for us, Phil. 2. This was, as [David] Pareus well says: perpetua quaedam passio et paena peccatorum nostrorum, fuit tota vita Christi [‘The whole life of Christ was a certain perpetual suffering and punishment for our sins’]: All these have a respect of punishment and suffering. For since Christ was both a viator [pilgrim] and a comprehensor [one attaining glory], and such a holy sinless person, He ought to have had the actual possession of the crown of glory from the womb, and so should have been free of weeping, hunger, thirst, weariness, groaning, sighing, sadnesse, persecution, reproaches, etc., all which adhered to all his active holiness, and therefore, in that, his actions were satisfactory passions. For satisfaction is defined [as] a voluntary restoring of the equivalent, and as good in the place of what is taken away; and the good restored must be: 1. Undue. 2. The proper good of the restorer, which agrees to the active and passive obedience of Christ.”

— Samuel Rutherford, The Covenant of Life Opened (1655), pt. 2, ch. 1; pp. 226-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B1.%5D+Now+the+active+obedience+of+Christ+falls+under+a+twofold+consideration%3A+1.+As+the+man-Christ%E2%80%99s+perfect+conformity+to+the+Law+of+God%2C+so+as+man+he+was+obliged+to+do+and+suffer+all+that+He+did+and+suffered%2C+even+to+lay+down+his+life+for+man.+But+had+He+been+only+man+his+righteousness+had+neither+been+by+condignity+meritorious%2C+nor+yet+satisfactory+for+us.+But%3A+2.+The+whole+course+of+Christ%E2%80%99s+obedience+from+his+birth+to+the+grave%2C+by+doing+and+suffering%2C+is+to+be+considered+as+the+doing+and+suffering+of+so+excellent+a+Person%2C+his+being+born%2C+his+praying%2C+preaching%2C+dying%2C+coming+from+a+Person%2C+God-man.+Now+the+Law+required+not+praying%2C+preaching+of+God-man%2C+the+blood+of+God%2C+or+the+dying+of+Him+who+was+God-Man.+And+so+all+these+being+both+so+excellent%2C+and+then+so+undue%2C+have+respect+of+satisfaction+to+God.+2.+The+active+obedience+of+Christ+and+all+that+Christ+did+and+suffered+were+performed+by+Him+in+his+state+of+humiliation%3A+in+which+he+was+poor%2C+%5BGreek%5D%2C+2+Cor.+8%3A9%2C+for+us%2C+so+also+by+the+same+ground+a+weeping+man%2C+hungry%2C+thirsty%2C+weary+for+us%2C+made+lower+then+the+angels+by+the+suffering+of+death%2C+Heb.+2%3A9%2C+humbled+by+partaking+of+flesh+and+blood%2C+because+of+the+children%2C+Heb.+2%3A14%2C+emptied+Himself+for+us%2C+Phil.+2.+This+was%2C+as+%5BDavid%5D+Pareus+well+says%3A+perpetua+quaedam+passio+et+paena+peccatorum+nostrorum%2C+fuit+tota+vita+Christi+%5B%E2%80%98The+whole+life+of+Christ+was+a+certain+perpetual+suffering+and+punishment+for+our+sins%E2%80%99%5D%3A+All+these+have+a+respect+of+punishment+and+suffering.+For+since+Christ+was+both+a+viator+%5Bpilgrim%5D+and+a+comprehensor+%5Bone+attaining+glory%5D%2C+and+such+a+holy+sinless+person%2C+He+ought+to+have+had+the+actual+possession+of+the+crown+of+glory+from+the+womb%2C+and+so+should+have+been+free+of+weeping%2C+hunger%2C+thirst%2C+weariness%2C+groaning%2C+sighing%2C+sadnesse%2C+persecution%2C+reproaches%2C+etc.%2C+all+which+adhered+to+all+his+active+holiness%2C+and+therefore%2C+in+that%2C+his+actions+were+satisfactory+passions.+For+satisfaction+is+defined+%5Bas%5D+a+voluntary+restoring+of+the+equivalent%2C+and+as+good+in+the+place+of+what+is+taken+away%3B+and+the+good+restored+must+be%3A+1.+Undue.+2.+The+proper+good+of+the+restorer%2C+which+agrees+to+the+active+and+passive+obedience+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+%281655%29%2C+pt.+2%2C+ch.+1%3B+pp.+226-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff734a38c26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f734a38c26.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=1.%5D%20Now%20the%20active%20obedience%20of,active%20and%20passive%20obedience%20of%20Christ&amp;text=1.%5D%20Now%20the%20active%20obedience%20of%20Christ%20falls&amp;text=to%20the%20active%20and%20passive%20obedience%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

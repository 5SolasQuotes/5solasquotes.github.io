<main class="wrap"><figure class="quote" id="q-c130cad5a4" data-kw="">
<blockquote><p>There is a distinction between sin committed out of weakness and sin committed out of full desire. The Arminians ridicule this distinction by saying: if a criminal sins, does he not sin out of weakness too, because by his nature he is not able to do any good? Answer: no. For we assert that only they sin out of weakness, who resist sins with all, though imperfect power. Yet because it is an imperfect power, they fall. And they grieve because of their committed sins, for they know what their duty is, because they are regenerated by the Holy Spirit. For those, who are completely dead in their sins, cannot be called weak, but only those who possess a spiritual life which does not square with criminals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: On Theological and Philosophical Distinctions and Rules</cite>, PIRef 4, trans. Willem J. van Asselt et al, ed. William den Boer (1656; Apeldoorn: Institute for Reformation Research, 2009), 10.21, p. 193.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a89d19e613" data-kw="">
<blockquote><p>5. Children! Be humbled under the sense of the iniquity of your parents when ye remember their ways, or possess what unjustly they have gotten, ye become guilty of their sins, without repentance. Especially you have need to take notice of this that are the children of parents that have opposed the purity of God’s service and worship and the work of its reformation, and have been corrupters of it: Children may be partakers of their parents’ faults and so plagued for them several ways; and we think that this forfeiture is more than ordinary. And therefore, as amongst men there are special crimes beyond ordinary procuring such a sentence, so is it here. And:

1. They be guilty by following their foot-steps, in walking in their parents sins, as Jeroboam’s children did.

2. In approving their fathers’ way, praising their fathers’ sayings or doings, as it is Psalm 49:13.

3. In winking at their parents’ sins and wickedness.

4. In boasting of their oppressions, bloodshed, etc. as if they were were acts of valor and manhood.

5. In being content that their fathers sinned, if it gained any possession to them.

6. In possessing and enjoying without repentance what to their knowledge they sinfully purchased.

7. In spending prodigally and riotously what the parents covetously gathered; the sin of the parent here is the seed of the sons’ sin.

8. In professing sorrow for the want [lack] of occasion to live in ignorance, profanity, or looseness as their fathers did, as in Jer. 44:17-19, they said that things went well then. [9.] In not being humbled before God for the sins of predecessors, nor confessing them to him, as Lev. 26:40, nor repairing the losses or injuries which we knew they did to any that were wronged or oppressed by them.</p></blockquote>

<blockquote><p>Once more, it is named, &quot;lust&quot; or &quot;concupiscence&quot;; which is sin itself, and the mother of all sin; it consists of various branches, called fleshly lusts, and worldly lusts, the lust of the flesh, the lust of the eyes, and the pride of life (Romans 7:7; Jam. 1:15; 1 John 2:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, 3.11</span></figcaption>

</figure><figure class="quote" id="q-892fa01c51" data-kw="">
<blockquote><p>Seeing that bold and rash men overshoot them selves so far, as to give judgement of that which is known to one only God, and oft forgetting what they them selves ought to be, and how they ought to live according to God’s will, cruelly condemn those on whom the Lord will have mercy: It is good first to note that not all sin which seemeth to be against the holy Ghost, is sin against the holy Ghost in deed: for there are many that resist the truth of the Gospel, whereof it seemeth they have had some knowledge, which nevertheless sin not against the holy Ghost, in as much as it is joined with some ignorance which exempteth them from this horrible sin which is not pardoned in this world, nor in the world to come. Which S. Paul signifieth, saying: that he obtained pardon, because that through ignorance and for lack of faith he had been a blasphemer, a persecutor and oppressor: whereby it followeth that not all sin (wherewith man resisteth the truth of God) is sin against the holy Ghost.

But when man is so touched with the light of the truth, that he cannot pretend ignorance, and nevertheless of determinate malice resisteth, then he sinneth against the holy Ghost, and it is not possible for him to be renewed by repentance, in that he hath forsaken God and is become an Apostate or forsaker of Christianity. Such were the Scribes and Pharisees, who having the knowledge of the Law, and seeing the manifest works of the power of God, attributed the miracles which Jesus Christ wrought, to Beelzebub.

Such were they also which resisted S. Stephen, and of determinate purpose blamed that doctrine, whereof they could not be ignorant but that it proceeded from God: as that holy Martyr likewise reproved them, when he was ready to shed his blood in the defence of the doctrine of the Gospel. For if S. Stephen had delt with ignorant men, he would have used them otherwise. But seeing that they raged against God, and went about to rob God of his honour, he boldly pronounceth that they withstand the holy Ghost, let us then conclude that they sin against the holy Ghost, who having the knowledge of God truth, doo nevertheless of determinate malice resist the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-marlorat.html">Augustine Marlorat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of the sin against the holy ghost made by M. Augustine Marlorate. Translated out of French to the great consolation of all such as repent them of their sins, and to the astonying [sic] of those that mock and despise the gospel of our Lord Jesus Christ</cite>, (London: Lucas Harison, [1570]), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-97321aa156" data-kw="Original Sin Mortification Forgiveness">
<blockquote><p>This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 6.5</span></figcaption>

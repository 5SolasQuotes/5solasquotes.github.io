<main class="wrap"><figure class="quote" id="q-cdc33fd05c" data-kw="">
<blockquote><p>But if ye contemn or refuse God, who thus lovingly offereth unto you salvation and life, ye shall neither escape plagues temporal, which shortly shall apprehend you, neither yet the torment prepared for the devil and for his angels, except by speedy repentance ye return to the Lord, whom you now refuse, if you refuse the messengers of his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Address to the Commonality of Scotland (1558) in R. S. Candlish (ed.), Select Practical Writings of John Knox</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-494727580c" data-kw="">
<blockquote><p>XVI. Moreover, it makes no difference for justification according to the law whether our good works proceed from our own free will or from the power of the Holy Spirit (even though, by the law, the Spirit is not received – Gal. 3:2). For in judgment according to the law, what matters is whether you have done what the law requires as it should be done, not where that obedience came from. Just as in judgment according to the Gospel, what matters is not how faith came about, but whether you believe. Thus, if it were possible for someone, by their own free will and without the work of the Holy Spirit, truly to believe in Christ, he would be just as justified before God as one in whom the Spirit has implanted faith—for with God there is no partiality (Rom. 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), p. 4</span></figcaption>

</figure><figure class="quote" id="q-bcc3bddb30" data-kw="">
<blockquote><p>6. Reprobation is contrary to election, whereupon the reprobate are so called, by a metaphor taken either from counterfeit silver which is rejected or from a barren soil which is left untilled as cursed of God. But it is to be noted that election and reprobation are taken two ways. Indeed they are properly referred to the condition of man already created and through his fall corrupted, that by election there might be signified a separation, which in very deed might be in time through an effectual calling of certain men from amongst the cast-away sort of mankind, and that from darkness to light. But by ‘reprobation’ is signified a neglect or a casting away of some, who being left to themselves and their corruption, are forsaken of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London: 1606), Place 36, ‘Of Predestination’, pp. 424-25</span></figcaption>

</figure><figure class="quote" id="q-3137406937" data-kw="">
<blockquote><p>As Muller perceptively notes, however, the concept of Christ as fundamentum electionis became problematic only when the name Christ was no longer “loosely” applied after the fashion of Calvin, but “strictly” applied as the title of the elected mediator. (Christ &amp; the Decree, 156– 57) Later generations arose to further the basic christological and soteriological insights of the earliest Reformers in a “new language” with “a more strict theological method.” (Christ &amp; the Decree, 131)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-pomplun.html">Robert Pomplun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Predestined a Passible Redeemer</cite>, “Predestined a Passible Redeemer: Scientia Media in Early Modern Christologies” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

/a></div>

<blockquote><p>17. It is mercy that there is a possibility of happiness, and that upon our pain’s taking, we may have a Kingdom; by our Fall in Adam we forfeited Heaven; why might not God have dealt with us as with the lapsed angels? they had no sooner sinned but were expelled Heaven never to come thither more; we may say as the apostle, Rom. 11:22, ‘Behold the goodness and severity of God.’ To the apostate angels behold the severity of God that He should throw them down to Hell forever; to us behold the goodness of God, that He has put us into a possibility of mercy, and if we do but take pains, there is a Kingdom stands ready for us; how may this whet and sharpen our industry, that we are in a capacity of salvation; and if we do but what we are able, we shall receive an eternal weight of glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, (d. 1686; London: Parkhurst, 1692), The Lord’s Prayer, ‘Thy Kingdom Come’, p. 507</span></figcaption>

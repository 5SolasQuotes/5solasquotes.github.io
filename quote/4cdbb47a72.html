<blockquote><p>All human laws are, properly speaking, only declaratory.” – Edmund Burke . 2000’s Oderberg, David – “The Metaphysical Foundations of Natural Law” in ed. H. Zaborowski, Natural Law &amp; Contemporary Society (Catholic University of America Press, 2010) Odeberg is an analytical Thomist. Feser, Edward Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015) 13. ‘Being, the Good, and the Guise of the Good’ 297 Feser is a Romanist professor of philosophy and is an Analytical Thomist. Here he shows how morals derive from what exists, a la natural law. 14. ‘Classical Natural Law Theory, Property Rights &amp; Taxation’ 321 15. ‘Self-Ownership, Libertarianism, and Impartiality’ 357 16. In Defense of the Perverted Faculty Argument 378 Feser here argues against contraception, but lays a lot of groundwork in natural law before hand. To see that Feser is wrong about contraception, see Fentiman, ‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to Feser’ (RBO, 2025). VanDrunen, David ‘Natural Law in Reformed Theology: Historical Reflections a&amp; Biblical Suggestions’ (2012) 24 paragraphs Note: While we do not agree with VanDrunen’s conclusions on the modern ‘Reformed Two Kingdom’ (R2K) position, his work on natural law is a good introduction to the topic, with which the Westminster divines and puritans agreed. For something faithfully, historically reformed on the topic of how Christ’s two kingdoms (one by divine, natural right, the other as Mediator over the Church) relate, see our section on the Establishment Principle. ‘Why Protestant Christianity Needs a Theology of Natural Law’ (2019) at The Davenant Institute Feser, Edward – ch. 16, ‘In Defense of the Perverted Faculty Argument’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 378-415 Feser in this chapter (whatever one thinks about his view against contraception, which this chapter is in defense of) has an excellent summary exposition of natural law and how ethics derives from existence and the teleological designs therein. Haines, David – ‘The Role of Natural Knowledge in Biblical Interpretation as Key to Solving the Protestant Problem’ (2018) This is the rough draft of the author’s presentation at the Davenant Convivium in 2018. Abstract: “This, then, is the protestant problem: How can we “infallibly” determine which doctrines are necessary for a person to be considered orthodox if the only authority for Protestant theology is the Bible, as interpreted by the individual reader? I will argue that natural knowledge of man, God, and the universe is necessary for biblical interpretation, and is a key element in a well-rounded solution to the protestant problem.</p></blockquote>

<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

<blockquote><p>The Judicial Law concerning the punishments of likedness, for the substance, viz. that it should be punished remains under the Gospel, because it comes within the nature of the Moral Law, and was prescribed to the Jews, not quae [as] Jews or a people peculiarly taken into Covenant, but qua [as] men subject to the Law of nature as other nations were… The Judicial laws may be considered according to their substance and equity, or according to many accessories, circumstances, forms and manner of them. Now though the magistrate under the Gospel is not bound unto these laws simply, that is, to every circumstance and particular of them for form, manner, time and place; as for example, not to the same kinds and formality of punishments set down in those laws; for those forms are accessions of the law; and therefore out of the nature of persons, times, places, and constitution of commonwealths, mutable: Yet he is bound to the substance and equity of them, so as not to derogate from the right of those laws… Now though to the degrees and measures of punishment, the severity and utmost rigor the Magistrate is not now tied, yet to the thing in cases of idolatry, seduction, false prophesying, speaking lies in the name of the Lord he is bound, and in some cases of gross and high idolatry and blasphemy committed presumptuously, to inflict capital punishment.</p></blockquote>

<blockquote><p>Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.”

<blockquote><p>2. What rulers think good is not a rule for constitutions and for peoples obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command… 3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is convenient in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as he is in all matters…</p></blockquote>

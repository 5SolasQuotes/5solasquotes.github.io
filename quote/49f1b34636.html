<main class="wrap"><figure class="quote" id="q-49f1b34636" data-kw="">
<blockquote><p>§44. 4. And though the taking of an oath be a sort of worship, yet not the natural worship of the First Commandment, nor the instituted of the Second, but the reverent use of his name in the third; so that it is not primarily an act of worship, but reductively and consequentially: It being the principal use of an oath to confirm the truth and end strife, by appealing to God, which appellation is indeed an acknowledgment of his government and justice. And the laying the hand upon the book, or kissing it, is but a professing sign of my own intentions, such as my words themselves are: and therefore is left to human choice, and a lawful thing. And I have met but with very few [non-conformists], among all our ceremonies, that questioned this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-42caf17fa2" data-kw="">
<blockquote><p>But in these games, pastimes, sports and plays at cards and dice, there is a certain distinction to be used. For, some of them are after such a sort played and passed over, that to the winning and obtaining of the victory, honest industry of the mind helps more than any blind casualty or chanceable hazard: insomuch that the awkward luck which falls out contrary to desire is supplied, amended and reformed by art and cunning. These kinds of play may not properly be termed ‘alea’ [chance] or hazardry, neither are they absolutely to be forbidden: only let measurable mean therein be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 6, ‘What the meaning of this word ‘Alea’ [Chance] properly is: and what Games &amp; Plays are contained and comprehended under the name thereof’ in A Discourse of Gaming, and Specially of Dice-Play in True &amp; Christian Friendship… Together also with a right excellent Invective… against the wicked exercise of diceplay, and other profane gaming (London: Veale, 1586) no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-f92399d50e" data-kw="against mental reservations">
<blockquote><p>Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits. We do not speak of the rhetorical use of equivocations, nor of the logical use which often obtains in disputations. Rather we speak of the theological and moral use in giving testimony and in oaths, where truth and sincerity are required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.12.1</span></figcaption>

</figure><figure class="quote" id="q-3f1e671f45" data-kw="">
<blockquote><p>Insofar as the matter of an oath is lawful or unlawful, pleasing or displeasing to God, it may and ought to be kept or broken. When Herod beheaded John the Baptist for keeping of his oath, he added sin to sin. But David did well in sparing Nabal and his family, whom he had sworn to destroy: and he blessed God, for the good counsel of Abigail, whereby he was diverted from performing that oath.</p></blockquote>

<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

</figure><figure class="quote" id="q-7665cff6b5" data-kw="">
<blockquote><p>We say, furthermore, that these Reformed Churches do not dissent in the fundamentals of faith. For although they may dissent in some chapters of Doctrine, we nevertheless deny any dissension in the fundamentals of faith… We are not saying here that they do not dissent in rites and ceremonies, for not every such dissension, either by its own nature severs, or ought to sever, the union of the Reformed Churches, especially since none of the Reformed Churches retains rites that are repugnant to the Gospel or introduced with an opinion of worship… Augustine, in Epistle 86, wrote no less skillfully than holily: “Let the garment of the Church be so varied by different observances that it is not torn apart by adverse contentions.”… Furthermore, it should also be added that we do not say that the Reformed Churches do not likewise dissent in the external mode of administering ecclesiastical polity or discipline… Nevertheless, we also contend that, this discrepancy being admitted, there is still no dissension in the fundamentals of faith. Indeed, such diversity in external polity can and ought to be tolerated without injury to or rupture of fraternal unity, especially since all the reformed Churches retain those things which are absolutely necessary, namely, the pure preaching of the Word of God, the due administration of the Sacraments, the ordination of pastors by public authority, and finally, the censure of morals. It is not on account of a difference in external form in these matters, where there is consensus in the fundamentals of faith, that the Reformed Churches should fight among themselves and reject all external ecclesiastical union. … The Foundation of Faith denotes… The primary object of faith, which is Christ the Savior… An epitome of this doctrine of the prophets and apostles [Eph. 2:20], containing in itself the sum of the Law and the Gospel, can be and is accustomed to be most conveniently reduced to four heads. So Augustine in the Enchiridion.

1. The Apostles’ Creed.

2. The Decalogue.

3. The Lord’s Prayer.

4. The doctrine of the sacraments. … But neither do we say they dissent in the very many secondary and tertiary articles, which since they are sufficiently proposed to, revealed to, and understood by all the Reformed Churches, are asserted with unanimous consent by them against the old heresies of the Marcionites, Manichaeans, Arians, Eunomians, Nestorians, Eutychians, and Monothelites, and against the new heresies of the Romanists. In a very few secondary articles not sufficiently proposed to all, or certainly not well enough weighed by them, and in some tertiary ones whose clear deduction from the primary is still hidden from some Churches, let there be dissent… Yet that does not impede the harmony of faith (ὁμονοίαν πίστεως) nor does it, or should it, break the ecclesiastical unity of the said Churches.</p></blockquote>

+reject+all+external+ecclesiastical+union.+%E2%80%A6+The+Foundation+of+Faith+denotes%E2%80%A6+The+primary+object+of+faith%2C+which+is+Christ+the+Savior%E2%80%A6+An+epitome+of+this+doctrine+of+the+prophets+and+apostles+%5BEph.+2%3A20%5D%2C+containing+in+itself+the+sum+of+the+Law+and+the+Gospel%2C+can+be+and+is+accustomed+to+be+most+conveniently+reduced+to+four+heads.+So+Augustine+in+the+Enchiridion.+1.+The+Apostles%E2%80%99+Creed.+2.+The+Decalogue.+3.+The+Lord%E2%80%99s+Prayer.+4.+The+doctrine+of+the+sacraments.+%E2%80%A6+But+neither+do+we+say+they+dissent+in+the+very+many+secondary+and+tertiary+articles%2C+which+since+they+are+sufficiently+proposed+to%2C+revealed+to%2C+and+understood+by+all+the+Reformed+Churches%2C+are+asserted+with+unanimous+consent+by+them+against+the+old+heresies+of+the+Marcionites%2C+Manichaeans%2C+Arians%2C+Eunomians%2C+Nestorians%2C+Eutychians%2C+and+Monothelites%2C+and+against+the+new+heresies+of+the+Romanists.+In+a+very+few+secondary+articles+not+sufficiently+proposed+to+all%2C+or+certainly+not+well+enough+weighed+by+them%2C+and+in+some+tertiary+ones+whose+clear+deduction+from+the+primary+is+still+hidden+from+some+Churches%2C+let+there+be+dissent%E2%80%A6+Yet+that+does+not+impede+the+harmony+of+faith+%28%E1%BD%81%CE%BC%CE%BF%CE%BD%CE%BF%CE%AF%CE%B1%CE%BD+%CF%80%CE%AF%CF%83%CF%84%CE%B5%CF%89%CF%82%29+nor+does+it%2C+or+should+it%2C+break+the+ecclesiastical+unity+of+the+said+Churches.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98The+Reformed+Churches+do+not+Dissent+in+the+Fundamentals+of+Faith%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%2C+%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+144-53%2C+pp.+145-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7665cff6b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7665cff6b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=We%20say%2C%20furthermore%2C%20that%20these%20Reformed,ecclesiastical%20unity%20of%20the%20said%20Churches&amp;text=We%20say%2C%20furthermore%2C%20that%20these%20Reformed%20Churches%20do&amp;text=break%20the%20ecclesiastical%20unity%20of%20the%20said%20Churches" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

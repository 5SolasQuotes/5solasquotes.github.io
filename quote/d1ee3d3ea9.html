<main class="wrap"><figure class="quote" id="q-d1ee3d3ea9" data-kw="against moral suasion">
<blockquote><p>Hence of two to whom the same grace is offered, if one is converted while the other remains unbelieving, the reason is not to be found (according to them) in the grace (which is the same), but in the disposition of the subject or man, because the one draws the bolt, the other does not (i.e., one rejects the grace which the other admits). Thus what they seem to give largely with one hand (preaching that the beginning, progress and complement of all our good is from grace), they secretly steal away with the other, maintaining that the mode of that operation is such that man can always resist it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.6.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-338a4dba70" data-kw="">
<blockquote><p>Drawing when he is on the Crosse, doth most extoll Christs love: death parteth company amongst men, and often parteth loves; but Christ dying draweth his Church into his bosome and heart, as not willing that the grave should part them and him … Christ dyed loving, and dyed drawing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying and Drawing Sinners to Himself</cite>, London, 1647, p. 532</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation.html">Sacrifice and Propitiation</a></span></div>

</figure><figure class="quote" id="q-f0bc1b9847" data-kw="irresistible vs resistible">
<blockquote><p>Whether efficacious grace operates only by a certain moral suasion which man is able either to receive or to reject. Or whether it operates by an invincible and omnipotent suasion which the will of man cannot resist. The former we deny; the latter we affirm against the Romanists and Arminians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.6.1b</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ece79072f1" data-kw="">
<blockquote><p>When our Saviour Christ (who being such an extraordinary Person, might have warrant to do what would have been presumption in any other) was appealed to in a cause that appertained to the civil magistrate’s decision, He refused to deal in it with these words, ‘Who made me a judge or a divider over you?’ according to which words of Him who was the truth, he that may rule must be placed in that office by some body and may not undertake it of himself: no man may take this honor to himself or be his own advancer to the throne; but he must be installed by another: and what other creature, besides the nation itself can challenge a power to appoint over it its rulers is not to me imaginable. Angels are not of this economy, do not intermeddle in this business, and for other people, or foreign states, they are but in an equality, and have no partnership in this matter; they have no more to do to impose governors over their neighbors than they have reciprocally over them… A calling from the people who are to be subject, being so necessary and essential to a humanly constituted magistracy, it is easy to discern what is usurpation, viz: that which is opposite to it, or privative thereof, which is a snatching hold of the scepter and wresting it out of the hands of those who are to dispose of it or have it committed to them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered</cite>, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-643bfc56c0" data-kw="">
<blockquote><p>A people may be, by God’s special commandment, subject to a conquering Nebuchadnezzar and a Caesar, as to their king, as was Judah commanded by the prophet Jeremiah to submit unto the yoke of the king of Babylon, and to pray for him, and the people of the Jews were to give to Caesar the things of Caesar; and yet both those were unjust conquerors: for those tyrants had no command of God to oppress and reign over the Lord’s people, yet were they to obey those kings; so the passive subjection was just and commanded of God, and the active [subjection], unjust and tyrannous, and forbidden of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 47</span></figcaption>

</figure><figure class="quote" id="q-8d95f51221" data-kw="">
<blockquote><p>…for the power is either a power to rule according to God’s law, as he is commanded (Dt. 17) and this is the very office or official power which the King of kings has given to all kings under him, and this is a power of the royal office of a king, to govern for the Lord his Maker; or this is a power to do ill and tyrannize over God’s people; but this is accidental to a king and the character of a tyrant, and is not from God… If then the judge and the king be both lawful ordinances, and if they differ essentially, as Barclay [a Romanist] says, then that specific form which distinguishes the one from the other [according to Barclay], to wit, domination and a power to destroy the subject, must be from God; which is blasphemous: for God can give no moral power to do wickedly; for that is licence, and a power to sin against a law of God, which is absolutely inconsistent with the holiness of God; for so the Lord might deny Himself, and dispense with sin. God avert such blasphemies!</p></blockquote>

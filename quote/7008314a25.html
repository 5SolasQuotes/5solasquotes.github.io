<blockquote><p>Despite its many weaknesses, this earlier work remains a landmark of scholarship in the field… At that time, the only serious attempt to document this development was Ritschl’s Die christliche Lehre von der Rechtfertigung und Versohnung (1870). The value of that work was rather reduced by the moralist assumptions Ritschl brought to his task, and by his decision to limit his analysis from the eleventh to the nineteenth century, focusing particularly on German-language Protestant contributions to the discussion. The vast scholarly undertakings which have given the modern period the magnificent critical editions denied to Ritschl (such as the Weimar Luther edition) have also cast new light on the theology of the medieval period, calling into question many of Ritschl’s conclusions. One of the more troubling aspects of my investigation was the realisation that most of Ritschl’s conclusions, particularly his very unsatisfactory account of Luther’s theological formation, could no longer be sustained.” – McGrath, Iustitia Dei, 3rd ed., Preface, vii, ix-x McGrath, Alister – Iustitia Dei: A History of the Christian Doctrine of Justification 3rd ed. rev. (Cambridge Univ. Press, 2005) 2nd ed.: ToC 1, 2 Kang, Paul C. – Justification: the Imputation of Christ’s Righteousness from Reformation Theology to the American Great Awakening &amp; the Korean Revivals Pre (2006) 160 pp. ToC . On the Early &amp; Medieval Church Book Estrada, Erik – Faith Alone: Debates About Justification Before the Reformation Pre (Fortress Press, 2026) 466 pp. ToC Blurb: “…contrary to the historical outlook of a good number of Catholic and Protestant historians and theologians, there were indeed conflicts within the Great Church (ca. 100-700 CE) over the question ‘After baptism, is faith alone enough to save the orthodox Christian?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/albrecht-ritschl.html">Albrecht Ritschl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Critical History of the Christian Doctrine of Justification &amp; Reconciliation</cite>, (1870; Edinburgh, 1872) 620, pp. ToC</span></figcaption>

<blockquote><p>In the text [of Rom. 3:23-26] we have the eight following things:

1. The persons justified – (i) Sinners; (ii) Such sinners of all sorts that shall believe, whether Jews or Gentiles.

2. The justifier, or efficient cause – God.

3. The impulsive cause – grace.

4. The means effecting, or material cause – the redemption of Christ.

5. The formal cause – the remission of sins.

6. The instrumental cause – faith.

7. The time of declaring – the present time.

8. The end – that God may appear just.</p></blockquote>

<blockquote><p>16. And indeed, as among the external instrumental causes of justification there is both the Word of the Gospel, Rom. I.16, and the sacraments, Tit. III.5; 1 Pet. III.21: so the internal instrumental cause is not hope, charity, fear, repentance, etc., but faith alone among causes of its own order — and alone indeed not by reason of its existence, but by reason of its apprehension and the faculty of apprehending — inasmuch as it alone is the analogous instrument suited to the apprehension of the righteousness of Christ.

17. Faith, moreover, is considered in the act of justification neither dispositively, nor habitually, nor formally, nor meritoriously, nor in the genus of a work, but partly organically by reason of its own act, and partly correlatively by reason of its object [i.e. Christ]. Whence the apostle wisely says that we are justified πίστει [pistei, by faith], ἐκ πίστεως [ek pisteōs, out of faith], διὰ τῆς πίστεως [dia tēs pisteōs, through faith] — but never διὰ τὴν πίστιν [dia tēn pistin, on account of faith].</p></blockquote>

f83496309.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff83496309.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=16.%20And%20indeed%2C%20as%20among%20the,t%C4%93n%20pistin%2C%20on%20account%20of%20faith&amp;text=16.%20And%20indeed%2C%20as%20among%20the%20external%20instrumental&amp;text=%CF%80%CE%AF%CF%83%CF%84%CE%B9%CE%BD%20%5Bdia%20t%C4%93n%20pistin%2C%20on%20account%20of%20faith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Objection: Faith is never without good works. Therefore, it cannot justify alone. Response. Faith may be said to justify without good works in two ways: either in such a way that we say the faith which justifies does not have good works joined with it, or in such a way that we say good works are not co-causes of justification. Faith indeed is never without good works; yet it does not follow from this that good works are a co-operating cause concurring with faith unto justification. Thus, the sun never gives light without heat, yet heat is not a co-operating cause which concurs with the sun unto illumination. So faith does not justify as separated from good works, nor yet for that reason are good works a co-operating cause of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, … (Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V, p. 364, trans. ChatGPT-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection: Faith is never without good works. Therefore, it cannot justify alone. Response. Faith may be said to justify without good works in two ways: either in such a way that we say the faith which justifies does not have good works joined with it, or in such a way that we say good works are not co-causes of justification. Faith indeed is never without good works; yet it does not follow from this that good works are a co-operating cause concurring with faith unto justification. Thus, the sun never gives light without heat, yet heat is not a co-operating cause which concurs with the sun unto illumination. So faith does not justify as separated from good works, nor yet for that reason are good works a co-operating cause of our justification.”

— John Cameron, Works… (Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V, p. 364, trans. ChatGPT-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection%3A+Faith+is+never+without+good+works.+Therefore%2C+it+cannot+justify+alone.+Response.+Faith+may+be+said+to+justify+without+good+works+in+two+ways%3A+either+in+such+a+way+that+we+say+the+faith+which+justifies+does+not+have+good+works+joined+with+it%2C+or+in+such+a+way+that+we+say+good+works+are+not+co-causes+of+justification.+Faith+indeed+is+never+without+good+works%3B+yet+it+does+not+follow+from+this+that+good+works+are+a+co-operating+cause+concurring+with+faith+unto+justification.+Thus%2C+the+sun+never+gives+light+without+heat%2C+yet+heat+is+not+a+co-operating+cause+which+concurs+with+the+sun+unto+illumination.+So+faith+does+not+justify+as+separated+from+good+works%2C+nor+yet+for+that+reason+are+good+works+a+co-operating+cause+of+our+justification.%E2%80%9D%0A%0A%E2%80%94+John+Cameron%2C+Works%E2%80%A6+%28Geneva%3A+Chovet%2C+1658%29%2C+Arguments+Proposed+in+Disputation+against+the+Preceding+Theses%2C+with+Solutions%2C+To+Corollary+V%2C+p.+364%2C+trans.+ChatGPT-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff3c2b6d568.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f3c2b6d568.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=Objection%3A%20Faith%20is%20never%20without%20good,a%20co%2Doperating%20cause%20of%20our%20justification&amp;text=Objection%3A%20Faith%20is%20never%20without%20good%20works.%20Therefore&amp;text=good%20works%20a%20co%2Doperating%20cause%20of%20our%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

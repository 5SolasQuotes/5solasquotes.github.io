<blockquote><p>The musical instruments, however, adopted for the pantomime (saltatrici) Mass of Antichrist, together with images, we abhor. There is no use for them in the church, and indeed they are marks and occasions of idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-reformed-churches.html">Hungarian Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Articles (1567) art. 17 in James T. Dennison Jr., ed. Reformed Confessions of the 16th and 17th Centuries in English Translation: 1523–1693, vol. 3 (Grand Rapids, MI: Reformation Heritage Books, 2008–14), 111.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ddbd7b749" data-kw="">
<blockquote><p>Fifthly, some consider instruments to be a mere circumstance rather than a real element of worship, so the Church can use them or not, as it sees fit. That there are such circumstances the Westminster Confession acknowledges: “There are some circumstances concerning the worship of God . . . common to human actions and societies, which are to be ordered by the light of nature, and Christian prudence, according to the general rules of the word, which are always to be observed” (1:6). However, God did not treat instruments as mere circumstances. They had no place in Old Testament worship until He put them in it by His express command. And He has never put them into New Testament worship. Plus, to class something as a mere circumstance rather than an element of worship, it must be common to human society and necessary. Appointing a suitable time and place to meet for public worship is a circumstance of worship, because without that no gathering of people could be possible, and is done for all orderly public meetings. But singing with instruments is not necessary: it may be done, but it does not need to be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-m-watkins.html">K.M. Watkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Watkins is a minister in the Free Presbyterian Church of Scotland. ‘Musical Instruments in Worship’</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

o%20be%20a%20mere&amp;text=but%20it%20does%20not%20need%20to%20be%20done" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-08dc83f3c9" data-kw="">
<blockquote><p>The use of instruments in worship was admittedly part of the Temple service. It had no place in the Tabernacle before David’s day, beyond the use of two silver trumpets made by Moses, in the hands of the priests. There is not a particle of evidence to show that it entered into the ordinary worship of the family or the synagogue. We are now prepared to take a step further, and note that, in the Temple service, it was uniformly and most closely associated with sacrifice and the burning of incense. …[T]he playing on instruments was confined to those bands of Levites whom David was training in anticipation of the building of the temple—these acting in this for and as representing the whole people. …1 Chron xxiii.26–32. It is very plain from this passage that the service of praise as conducted by the Levitical choirs with musical accompaniment, was associated with the regular morning and evening sacrifice, and with other sacrifices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-nevin.html">Robert Nevin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instrumental Music in Christian Worship: A Review Chiefly in the Way of Reply to Professor Wallace</cite>, 2nd edition, rev. (Londonderry: Bible and Colportage Society, 1873), 29, 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-50dc14226a" data-kw="">
<blockquote><p>Objection 8. In respect of God, who is truth itself, we are to believe the promise in particular: yet if we respect our own unworthiness and indisposition, we are to fear and in some part to doubt. For the promise of remission of sins is not absolute, but depends upon the condition of our works. Therefore our certainty is only conjectural. Answer. I answer first that in respect of our own unworthiness, we are not to doubt of our salvation, but to be out of all doubt, yea to despair before the judgment seat of God. For they which are of the works of the law, are under the curse, (Gal. 3:10), and Paul saith of his own works of grace, “in this am I not justified” (1 Cor. 4:4). And David being out of all doubt of his own deserved damnation in regard of his own unworthiness saith freely, “Enter not into judgment with thy servant, O Lord, for no flesh shall be justified in thy sight” (Ps. 143:2). Again the consideration of any unworthiness in ourselves, doth not hinder a resolution considering God’s mercy in Christ. For true faith makes an entrance unto God with boldness, (I say with boldness) even for those persons that are unworthy in themselves, (Eph. 4:12). And Abraham (whose faith is to be followed of us) did not upon the consideration of his old decayed body, rest himself with bare hope upon a likelihood of the accomplishment of God’s promise, but he “believed under hope even against hope” (Rom. 4:18). Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture saith, it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith here must not be considered as a work, but as an instrument apprehending Christ with His benefits: and withal repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith, and the signs and documents thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse of Conscience in The Works of William Perkins</cite>, 8.73. (emphasis added)</span></figcaption>

<blockquote><p>II. A Voluntate Dei, ‘from the will of God’. This is the other reason: ‘For the Father seeks such to worship Him.’ [Jn. 4:23] God requires such worship and worshippers. The foundation of this reason is this: The rule of worship is not mans fancy, but God’s will: Men’s fancies and wills are infinitely various, and therefore those that have gone that way, have been divided into a thousand varieties; they worship they know not what, as v. 22. Only God’s will is the stable rule: None knows the mind of God but the Spirit of God: Now this is the worship God requires in Gospel times. Argument Second: From the end [design] of worship. Look what the ends of worship are, such must the worship be: And that was the reason why the Jewish worship was so much typical, because the end of it was to represent Christ; And that end being now attained, and Christ exhibited [revealed], we must consider what were and are the further ends of worship. Now the ends are of two sorts.

1. In reference to God.

2. In reference to men. And both will show us that the worship must be spiritual.

I. In relation to God; so it is double:

      1. To please God: this is finis operis &amp; operantis too [‘the end of the work, and of working’], (if a man be sincere) Ps. 19:14, ‘Let the words of my mouth and the meditation of my heart be acceptable in thy sight.’ Now it is only spiritual worship that can please God: That man does but little consider the nature of God, that thinks God is pleased with the bowing of the knee to an altar, no, it is the bending of the heart that God respects. It is not an organ in a church, but the organ of a gracious heart, and melody in the heart that pleases God.

      2. To exalt God amongst men, to render Him glorious in the eyes of the world: Now how is that done? Do you think that it makes God glorious, when men seek to honor Him with bodily and external services? No, you cannot dishonor God more than by giving Him such a worship as begets a carnal representation of God, etc. And when God would set Himself forth in his glory, He represents Himself in a spiritual manner, and He takes them off from all corporeal thoughts and fancies: ‘God is a Spirit.’ ‘To whom will you liken Me?’ ‘You saw no shape.’ ‘God dwells not in temples made with hands.’

II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), pp. 13-14 Poole was an English puritan.</span></figcaption>

II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.”

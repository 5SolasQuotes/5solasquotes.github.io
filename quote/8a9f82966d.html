<main class="wrap"><figure class="quote" id="q-8a9f82966d" data-kw="">
<blockquote><p>Now those first ceremonial observations [of the Early Church with evangelical feasts] are guilty of opening that gate for all the human presumptions to enter into God’s house which pressed in after them: which gate could never be shut from that day to this. 2. Those very feasts made a composition or mixture of human institutions with divine, and therefore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day. Easter brought in a superstitious Lent to attend upon it, made baptism wait for her moon: and conformed our Lord’s Supper unto the Jewish Passover in unleavened bread, etc. [3.] It was the first apple of contention among Christians, the first weapon wherewith the Bishop of Rome played his prises [prices?] against other Churches, and after slew so many Britons with by Austin the monk. Holy-days in honor of Christ invited unto them saints’ holy days, etc. 4. It is presumtion to make men’s inventions as guiltless of evil consequences as God’s holy ordinances. They are active efficacious occasions given of evil: these [ordinances of God] are only passive occasions taken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), ch. 1, section 17, pp. 84-85</span></figcaption>

</figure><figure class="quote" id="q-f1855a06cc" data-kw="">
<blockquote><p>I respond: The Papists make ordination a sacrament, and this the material of it, the laying on of hands (see Cornelius a Lapide, Commentary in location). This opinion has been refuted, see their antagonists. The Lutherans however reckon it according to the indifferent rites (see Eckhardt in location cited); however they are seen to discover something in it mystical and necessary however often they knowingly touch upon our indifferent things on this rite. We, however varied in locations and possibly in however many churches this right is used, yet adjudge it to be merely indifferent. See Piscator, Daneus and other commentators in 1 Timothy and Acts 6 &amp; 13; and Alting in the Exegesis of the Augsburg Confession, p. 90. This right was commonly used in synagogues, schools and the polity of the Jews, from where it is seen the apostles took it, which is the opinion of Calvin in his Commentary on Acts 6 &amp; 13, and Institutes, bk. 4, ch. 3, section 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 1, p. 460 “Problems on rites follow, certainly not all, but only some select ones in particular that the Scripture has mentioned. Those remaining are nearly innumerable which occur in the books of the Old and New Testament or ecclesiastical writings, whether ancient, medieval, modern or recent…” | 4th Problem, ‘What is to be decided about the laying on of hands in ordination or the constituting of ministers (on which see 1 Tim. 4 &amp; 5)?’, pp. 461-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, … (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

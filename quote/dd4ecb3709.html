<main class="wrap"><figure class="quote" id="q-dd4ecb3709" data-kw="">
<blockquote><p>In the next place you [Thomas Jackson, an Arminian] touch upon a distinction much talked of, and as much advanced by some as cried down by others. Yet both Scotus and Durandus give a tolerable, and Aquinas with the Dominicans after him, an orthodox interpretation thereof, though neither suitable to the mind of [John] Damascene, commonly reputed the father of it. Yet look what in this kind is wanting in them is supplied by [Gregory] Arminiensis, who gives both an orthodox construction thereof, and that also in conformity to the opinion of Damascene, of whose text he gives a very sound and orthodox interpretation and the more orthodox the more opposite to their constructions who, with great cry of words draw it to the countenancing of their Arminian tenets without cause. Love, you say, is the fruit of God’s antecedent will, wrath and severity are the proper effects of his consequent will. Fruit and effect you make all one (as with good reason you may). Now what, I pray you, is this effect which you call love? You seem to intimate that they are the effects of creation, as when you say, ‘Every particular faculty of soul or body is a pledge undoubted of God’s love.’ Yet faculties of souls and bodies are found in beasts, but God’s antecedent will in Damascene is referred wholly unto men. Neither does Damascene at all refer it to the work of creation, but makes it to be that whereby God will have all to be saved. Liberty of will is proper to man in distinction from beasts, but who sees not that this indifferently makes him obnoxious unto damnation as well as capable of salvation? Then when you say wrath and severity is the effect of God’s consequent will, what do you mean by ‘wrath’? Is it either a resolution to take vengeance, or the execution of vengeance itself? I think you take it for the execution of vengeance itself. Now there is an execution of reward also properly opposite unto this which, whether it be the same love you speak of, it became you to express so much, or whether you conceive it to be different, yet it were fit you should take notice of it and acknowledge that this is a fruit of God’s consequent will as well as wrath; that as effectually presupposing obedience, as this disobedience: and that love in rewarding is every way as infallibly consequent to the obeying of God’s will revealed as wrath is of our neglecting and despising it. A full explication of this distinction you promise in good time; how well you perform it we may in good time consider with God’s help. Next you enter upon another form of the same distinction (as you pretend) and you suffer it to fly with one wing, for you talk of God’s absolute will (which you seem to confound with God’s antecedent will), but as touching the member congruously opposite, you leave us to seek for that. But as it is we are to consider it: God’s absolute will was (you say) to have men capable of Heaven and Hell, of joys and miseries immortal. This cannot be understood of God’s consequent will; for this absolute will is indifferent to end in the bestowing of reward or punishment, and is immediately terminated only in making man capable of either; but his consequent will is not so indifferent. For the only effect thereof you mention to be wrath and severity, and this presupposes rather than causes capableness. Neither can this absolute will be the antecedent will of God according to Damascene’s meaning. For the antecedent will in Damascene is only referred to the will of God, whereby He wills man’s salvation: but this absolute will is (you say) to have men capable of Heaven and Hell. To help this, you tell us that this absolute will (whose possible objects are two) is in the first place set on man’s eternal joy. But you do not proceed to show on what it is set in the next place, as if by such like incongruities you desired rather to confound your reader [rather] than to satisfy him. Yet by the tenor of your discourse you leave it to us to guess that in the second place, to wit upon the despising of God’s love, it is set upon a man’s damnation. So that by this your doctrine, both God’s antecedent will and consequent will is all one, and that is God’s absolute will. But no such thing is found in Damascene, from whom, such as you are, do usually take this distinction of will antecedent in God and will consequent: And indeed you do well to make one as absolute as another; for like as wrath, the fruit of this will of God in the second place (as you imply) has not its course but upon presupposition of disobedience; so in like manner, the proper opposite to wrath on the other side, the fruit of this will of God in the first place, has not its course but upon presupposition of obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity</cite>, … (Amsterdam: Thorp, 1631), pp. 677-80</span></figcaption>

<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>

<blockquote><p>360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are:

1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.]

2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.]

3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.]

4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.]

5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.]

361. I tell you their sense that I may the better open the plain truth to you, which is as follows:

1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man.

2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it.

3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.</p></blockquote>

<blockquote><p>As God may by metaphor be said to will what by His will, properly speaking, He wills not; so He may by metaphor be said to will what He does will, properly speaking. Hence there is nothing to prevent the same thing being the object of the will of good pleasure and of the will of expression [sign]. But operation is always the same as the will of good pleasure; while precept and counsel are not; both because the former regards the present, and the two latter the future; and because the former is of itself the effect of the will; the latter its effect as fulfilled by means of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, q. 19, art. 12, reply to obj. 2</span></figcaption>

<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>

<blockquote><p>§1. Christian theologians… further divide natural theology into innate or congenital and acquired… These same theologians [Johannes Junius, Heinrich Alting, Johannes Hoornbeeck] explain distinctly, precisely, and in opposition to the heterodoxy of their adversaries, the common view of our people: that natural knowledge is partly innate, partly acquired: that innate knowledge is also called subjective, while the acquired is called objective. Heinrich Alting [d. 1644] teaches that innate knowledge is distinct from acquired knowledge. And Johannes Hoornbeeck warns that [Faustus] Socinus neglects that distinction, and that, therefore, he stumbles at the very threshold of this controversy. That is why Alting poses separate questions about each type of knowledge, proves the affirmative for each with distinct arguments, and responds individually to objections raised against each. Concerning the former, or innate [knowledge], he determines, in the same place, that, “The affirmative thesis of the Orthodox is that there is some natural theology or knowledge of God; or that there is some sense of divinity naturally implanted in man.” (Theologia Elenctica Nova, p. 2) The same author in the same place and in his Heidelberg Problems describes this knowledge “as a faculty or potency (not an act) implanted in humans by nature, or at birth, and spontaneously manifesting itself in all adults of sound mind.” (Theologia Elenctica Nova, p. 2; Alting, Problemata Theologica, vol. 2, Amsterdam: Johannes Janssonius, 1646, pp. 1–10) And on page 4: “It is naturally inscribed, imprinted, and made evident to human hearts.” (Theologia Elenctica Nova, p. 4) On page 6, to the objection that “[all] knowledge is either habitual or actual, but knowledge of God is natural in neither of these ways,” he responds: “This is not a complete enumeration of the species or modes [of such knowledge]: for what is missing is a natural potency or faculty spontaneously manifesting itself in its own time according to the innate light of nature, even without demonstration or external instruction—however much it may afterwards be aroused, increased, and confirmed.” (Theologia Elenctica Nova, p. 6) On page 2 of the same work, he qualifies this natural knowledge, [stating] that “in this darkness, which is greatly obscured and imperfect due to sin, it varies according to the condition and quality of the subjects or individuals, whether of single human beings or even of nations and peoples.” (Theologia Elenctica Nova, p. 2) On page 8, he affirms the acquired knowledge of God in accordance with the common view of the orthodox, which he describes as being acquired from God’s works. And he assigns two principles of it, sense and reason, etc. (Theologia Elenctica Nova, pp. 8–9) In the same place, from the saying of Dionysius the Areopagite customarily set forth in the schools, he proves and explains the threefold mode of ascending and attaining to the knowledge of God from his works [i.e., via eminentiae, via negationis, and via causationis, the way of eminence, negation and causation]. (Theologia Elenctica Nova, p. 9) Concerning this same acquired knowledge, in the same place he declares that it is “not perfect, but imperfect; neither clear nor distinct, but confused.” (Theologia Elenctica Nova, p. 8) In his Heidelberg Problems he explains it this way. It is called natural [theology]: … 2. “Nor because it exists in actuality, as if an actual knowledge of God were innate to man, … or by habit, as if some intellectual habit were engendered in him, … but natural both in its source and objectively. In its source, insofar as the power and faculty is innate in all men… But objectively, because such evident and clear traces of deity are impressed upon the whole world and all its parts….” (Problemata Theologica, in Scriptorum Theologicorum Heidelbergensium, vol. 2, p. 1) … …my ideas, which I formed under the guidance of my teachers’ living voice and writings, and which I have imparted to others to the best of my ability for so many years, both in writings and speech—both publicly and privately—agree with Alting’s explanation. §3. Meanwhile, anyone who reads these theologians or takes the time to look into and compare them on this occasion will see that Alting has accurately represented the common understanding and consensus of the orthodox in the view he explains there. I will point out some [theologians] for the benefit of the younger ones below. As for myself, profess that I imbibed that distinction and explanation of natural theology in my academic studies from the lectures of my preceptor Fr[ancis] Gomarus on Romans 1:18–19, his lectures on common places, and his 1609 disputation on Theology put forward with Petrus Lansbergius as the respondent: which can be found re-published among his works. (cf. Gomarus, Opera Theologica Omnia, 2 vols., Amsterdam: Johannes Janssonius, 1644, I: Part 2, p. 7; III: Part 3, pp. 1–4) With these writings [of Gomarus] I had joined the reading of Franciscus Junius’ Treatise On Theology, book 1 chapter 5, and book 2 chapter 2. (Junius, Loci nonnulli Theologici, [Heidelberg]: In Bibliopolio Commeliniano, 1612, pp. 15–16, 64–65) There was also the disputation of Johannes Cuchlinus, regent of the Dutch College, of which part 1 was on the knowledge of God, part 2 on the modes of knowing God, proposed in the year 1605 with Caspar Barlaeus as the respondent. The works of metaphysics, which were then well-used by diligent students—those of Cornelius Martini, [James?] Cheyne, Jacob Martini, [Chrysostomus] Javellus, [Pedro da] Fonseca, especially [that] of Francisco Suárez (from which our teacher Gilbert Jacchaeus dictated and explained to us an abridged compendium)—these also contributed something to this. (Cf. Martini, Metaphysica commentatio compendiose, Strassburg: Johannes Carolus, 1612; Cheyne, Analysis &amp; Scholia in Aristotelis XIV. Libros De Prima, seu divina Philosophia, 2nd ed. (Hanover: Guilielmus Antonius, 1607); Martini, Disputationes Metaphysicae viginti octo, Wittenberg: Zacharius Churerus, 1611; Javellus, Quaestiones, In Metaphysicam Aristotelis, Wittenberg: Henckelius Selfischius, 1609; Pedro da Fonseca, Commentarii … In Libros Metaphysicorum Aristotelis Stagiritae, 4 vols., Cologne: Zetner, 1615; Suárez, Metaphysicae Disputationes, 2 vols., Cologne: Franciscus Heluidius, 1614; Jacchaeus, Primae Philosophiae sive Institutionum Metaphysicarum, Leiden: House of Elzevir, 1640) … §4. In my disputation On Atheism, 1639, part 2, we discussed the knowledge of God as follows. In response to objections against the congenital natural knowledge of God, we provided these sources of solutions (Selectarum Disputationum Theologicarum, vol. 1, Utrecht: Johannes a Waesberge, 1648, pp. 141–42): 1. There is a certain congenital or innate knowledge of God, which they denote as natural theology, preconceptions (προσλήψεις), impressed notions, common conceptions (κοινάς ἐννοίας), natural light, the dictate of nature, and synecdochically the law of nature or conscience (synteresis), or metonymically natural reason. 2. This doesn’t mean that newborn infants have some actual knowledge of God or that it can be drawn out of them, or that intelligible species are implanted in them along with the intellect and memory such that what adults learn are only reminiscences (as Tertullian translates it: “discentiae sint reminiscentiae”), as Plato believed. For with respect to actual knowledge, Aristotle rightly says: “the human mind is like a blank slate.</p></blockquote>

he+disputation+of+Johannes+Cuchlinus%2C+regent+of+the+Dutch+College%2C+of+which+part+1+was+on+the+knowledge+of+God%2C+part+2+on+the+modes+of+knowing+God%2C+proposed+in+the+year+1605+with+Caspar+Barlaeus+as+the+respondent.+The+works+of+metaphysics%2C+which+were+then+well-used+by+diligent+students%E2%80%94those+of+Cornelius+Martini%2C+%5BJames%3F%5D+Cheyne%2C+Jacob+Martini%2C+%5BChrysostomus%5D+Javellus%2C+%5BPedro+da%5D+Fonseca%2C+especially+%5Bthat%5D+of+Francisco+Su%C3%A1rez+%28from+which+our+teacher+Gilbert+Jacchaeus+dictated+and+explained+to+us+an+abridged+compendium%29%E2%80%94these+also+contributed+something+to+this.+%28Cf.+Martini%2C+Metaphysica+commentatio+compendiose%2C+Strassburg%3A+Johannes+Carolus%2C+1612%3B+Cheyne%2C+Analysis+%26+Scholia+in+Aristotelis+XIV.+Libros+De+Prima%2C+seu+divina+Philosophia%2C+2nd+ed.+%28Hanover%3A+Guilielmus+Antonius%2C+1607%29%3B+Martini%2C+Disputationes+Metaphysicae+viginti+octo%2C+Wittenberg%3A+Zacharius+Churerus%2C+1611%3B+Javellus%2C+Quaestiones%2C+In+Metaphysicam+Aristotelis%2C+Wittenberg%3A+Henckelius+Selfischius%2C+1609%3B+Pedro+da+Fonseca%2C+Commentarii+%E2%80%A6+In+Libros+Metaphysicorum+Aristotelis+Stagiritae%2C+4+vols.%2C+Cologne%3A+Zetner%2C+1615%3B+Su%C3%A1rez%2C+Metaphysicae+Disputationes%2C+2+vols.%2C+Cologne%3A+Franciscus+Heluidius%2C+1614%3B+Jacchaeus%2C+Primae+Philosophiae+sive+Institutionum+Metaphysicarum%2C+Leiden%3A+House+of+Elzevir%2C+1640%29+%E2%80%A6+%C2%A74.+In+my+disputation+On+Atheism%2C+1639%2C+part+2%2C+we+discussed+the+knowledge+of+God+as+follows.+In+response+to+objections+against+the+congenital+natural+knowledge+of+God%2C+we+provided+these+sources+of+solutions+%28Selectarum+Disputationum+Theologicarum%2C+vol.+1%2C+Utrecht%3A+Johannes+a+Waesberge%2C+1648%2C+pp.+141%E2%80%9342%29%3A+1.+There+is+a+certain+congenital+or+innate+knowledge+of+God%2C+which+they+denote+as+natural+theology%2C+preconceptions+%28%CF%80%CF%81%CE%BF%CF%83%CE%BB%CE%AE%CF%88%CE%B5%CE%B9%CF%82%29%2C+impressed+notions%2C+common+conceptions+%28%CE%BA%CE%BF%CE%B9%CE%BD%CE%AC%CF%82+%E1%BC%90%CE%BD%CE%BD%CE%BF%CE%AF%CE%B1%CF%82%29%2C+natural+light%2C+the+dictate+of+nature%2C+and+synecdochically+the+law+of+nature+or+conscience+%28synteresis%29%2C+or+metonymically+natural+reason.+2.+This+doesn%E2%80%99t+mean+that+newborn+infants+have+some+actual+knowledge+of+God+or+that+it+can+be+drawn+out+of+them%2C+or+that+intelligible+species+are+implanted+in+them+along+with+the+intellect+and+memory+such+that+what+adults+learn+are+only+reminiscences+%28as+Tertullian+translates+it%3A+%E2%80%9Cdiscentiae+sint+reminiscentiae%E2%80%9D%29%2C+as+Plato+believed.+For+with+respect+to+actual+knowledge%2C+Aristotle+rightly+says%3A+%E2%80%9Cthe+human+mind+is+like+a+blank+slate.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+on+the+Ways+of+Knowing+God%2C+pt.+1+tr.+Michael+Lynch+%281665%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fad55f6f3cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ad55f6f3cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-theology/#:~:text=%C2%A71.%20Christian%20theologians%E2%80%A6%20further%20divide%20natural,mind%20is%20like%20a%20blank%20slate." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. Vos is very insightful and helpful for developing a Reformed natural theology. 2. Vos’s natural-theological method and underlying cognitive theory differ substantively from both that of Thomas Aquinas and even most Reformed scholastics (Voetius, Turretin, Maastricht, Charnock…). Associating Vos with Thomism (as Fesko seems to do in his Introduction) is inaccurate and amateurish. 3. Vos’s and Van Til’s accounts are fundamentally aligned. A main difference between Vos and Van Til is that Van Til makes the implanted knowledge of God a condition for the possibility of not only (i) the acquired knowledge of God but also (ii) knowledge of creatures—which Vos may not even disagree with. Non-Thomist elements in Vos’s natural theology—which also distinguish him from many Reformed scholastics: 1. Innate knowledge of God. The innate knowledge of God (i) involves a “thick” concept of God as absolute being (not a general concept of a highest being), (ii) is produced in all people by the Holy Spirit’s illumination, and (iii) is the principle of knowledge of God acquired through experience and inference. 2. Ontological argument. An adjusted form of the ontological argument is sound. It consists merely in drawing attention to the innate knowledge of God—not in deducing God’s existence from a concept of God’s essence (p. 52, n. 113; p. 56, n. 127). 3. Cosmological arguments. Arguments which simply prove that an uncaused cause exists are weak: They don’t prove that the cause must be an absolute being (p. 55, n. 124). The innate knowledge of God (as an absolute being) grounds our knowledge that every (non-absolute) effect requires a cause (p. 55, n. 127). Vos thinks that innate knowledge of God is a condition for the possibility of acquired knowledge of God, and he takes himself to be following Calvin here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Natural Theology ed. J.V. Fesko, trans. Albert Gootjes</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. Vos is very insightful and helpful for developing a Reformed natural theology. 2. Vos’s natural-theological method and underlying cognitive theory differ substantively from both that of Thomas Aquinas and even most Reformed scholastics (Voetius, Turretin, Maastricht, Charnock…). Associating Vos with Thomism (as Fesko seems to do in his Introduction) is inaccurate and amateurish. 3. Vos’s and Van Til’s accounts are fundamentally aligned. A main difference between Vos and Van Til is that Van Til makes the implanted knowledge of God a condition for the possibility of not only (i) the acquired knowledge of God but also (ii) knowledge of creatures—which Vos may not even disagree with. Non-Thomist elements in Vos’s natural theology—which also distinguish him from many Reformed scholastics: 1. Innate knowledge of God. The innate knowledge of God (i) involves a “thick” concept of God as absolute being (not a general concept of a highest being), (ii) is produced in all people by the Holy Spirit’s illumination, and (iii) is the principle of knowledge of God acquired through experience and inference. 2. Ontological argument. An adjusted form of the ontological argument is sound. It consists merely in drawing attention to the innate knowledge of God—not in deducing God’s existence from a concept of God’s essence (p. 52, n. 113; p. 56, n. 127). 3. Cosmological arguments. Arguments which simply prove that an uncaused cause exists are weak: They don’t prove that the cause must be an absolute being (p. 55, n. 124). The innate knowledge of God (as an absolute being) grounds our knowledge that every (non-absolute) effect requires a cause (p. 55, n. 127). Vos thinks that innate knowledge of God is a condition for the possibility of acquired knowledge of God, and he takes himself to be following Calvin here.”

— Geerhardus Vos, Natural Theology ed. J.V. Fesko, trans. Albert Gootjes">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Vos+is+very+insightful+and+helpful+for+developing+a+Reformed+natural+theology.+2.+Vos%E2%80%99s+natural-theological+method+and+underlying+cognitive+theory+differ+substantively+from+both+that+of+Thomas+Aquinas+and+even+most+Reformed+scholastics+%28Voetius%2C+Turretin%2C+Maastricht%2C+Charnock%E2%80%A6%29.+Associating+Vos+with+Thomism+%28as+Fesko+seems+to+do+in+his+Introduction%29+is+inaccurate+and+amateurish.+3.+Vos%E2%80%99s+and+Van+Til%E2%80%99s+accounts+are+fundamentally+aligned.+A+main+difference+between+Vos+and+Van+Til+is+that+Van+Til+makes+the+implanted+knowledge+of+God+a+condition+for+the+possibility+of+not+only+%28i%29+the+acquired+knowledge+of+God+but+also+%28ii%29+knowledge+of+creatures%E2%80%94which+Vos+may+not+even+disagree+with.+Non-Thomist+elements+in+Vos%E2%80%99s+natural+theology%E2%80%94which+also+distinguish+him+from+many+Reformed+scholastics%3A+1.+Innate+knowledge+of+God.+The+innate+knowledge+of+God+%28i%29+involves+a+%E2%80%9Cthick%E2%80%9D+concept+of+God+as+absolute+being+%28not+a+general+concept+of+a+highest+being%29%2C+%28ii%29+is+produced+in+all+people+by+the+Holy+Spirit%E2%80%99s+illumination%2C+and+%28iii%29+is+the+principle+of+knowledge+of+God+acquired+through+experience+and+inference.+2.+Ontological+argument.+An+adjusted+form+of+the+ontological+argument+is+sound.+It+consists+merely+in+drawing+attention+to+the+innate+knowledge+of+God%E2%80%94not+in+deducing+God%E2%80%99s+existence+from+a+concept+of+God%E2%80%99s+essence+%28p.+52%2C+n.+113%3B+p.+56%2C+n.+127%29.+3.+Cosmological+arguments.+Arguments+which+simply+prove+that+an+uncaused+cause+exists+are+weak%3A+They+don%E2%80%99t+prove+that+the+cause+must+be+an+absolute+being+%28p.+55%2C+n.+124%29.+The+innate+knowledge+of+God+%28as+an+absolute+being%29+grounds+our+knowledge+that+every+%28non-absolute%29+effect+requires+a+cause+%28p.+55%2C+n.+12

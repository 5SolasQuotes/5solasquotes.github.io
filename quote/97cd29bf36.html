<main class="wrap"><figure class="quote" id="q-97cd29bf36" data-kw="">
<blockquote><p>From this passage let us learn, that we ought to contemplate the providence of God in such a manner as to ascribe to his almighty power the praise which it deserves for righteous government. Although the rectitude by which God regulates his judgments is not always apparent or made visible to us, still it is never lawful to separate his wisdom and justice from his power. But as the Scriptures very frequently state and clearly explain the reason why God does this or that, we ought carefully to examine the cause of his works.

That invention which the Schoolmen have introduced, about the absolute power of God, is shocking blasphemy. It is all one as if they said that God is a tyrant who resolves to do what he pleases, not by justice, but through caprice. Their schools are full of such blasphemies, and are not unlike the heathens, who said that God sports with human affairs. But in the school of Christ we are taught that the justice of God shines brightly in his works, of whatever kind they are, “that every mouth may be stopped,” (Romans 3:19,) and that glory may be ascribed to him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 152.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>[Durell:] ‘There was a great irreverence at prayer in their congregations, very few kneeling, many not so much as putting off their hats, and of this,’ he says, he was an eye-witness. …Into how many congregations he went where many did not so much as put off their hats in the time of prayer? And whether he either saw or heard that the ministers of those churches did any way countenance that irreverence? …For ought I know those in whom he observed this irreverence might be sectaries, who did more bitterly inveigh against presbyterians than against any other men whatever; perhaps also they might be episcopal-men, who designed to put an affront upon the presbyterians’ prayers: just as now some are observed to sit upon their breech all the time of pulpit-prayer, unless when just the Lord’s prayer is repeating, because forsooth pulpit-prayer is not allowed by the [establishing Anglican] Church, but only bidding of prayer. I write it with grief, but I must write it, I never in any congregations where I have been observed so much irreverence as I have observed in those in which there is the greatest abundance of such as always pretended a love to the English [Anglican] liturgy; particular stories I might relate…</p></blockquote>

</figure><figure class="quote" id="q-c00382ea43" data-kw="">
<blockquote><p>14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 11, pp. 162-63</span></figcaption>

<blockquote><p>Mind it, families in their domestic capacity, as well as in a personal, or national capacity may be alienated from God, and may have a root that beareth gall and wormwood, then see what follows: this is that which makes evil families, when instead of praying, reading scriptures, singing psalms, there is cursing, swearing, mocking at serious godliness, vain or profane talk, at least only worldly discourse.</p></blockquote>

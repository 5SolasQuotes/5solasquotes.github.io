<blockquote><p>(3) What encouragement a repenting returning sinner has to hope for pardon and life according to this promise… he has this to support himself with, that God’s nature, property, and delight, is to have mercy and to forgive, for He has said (Eze. 18:23): “Have I any pleasure at all that the wicked should die? No, by no means; you never had any cause given you to think so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ezekiel</cite>, 18, vv. 21-29</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a31fa81a8b" data-kw="">
<blockquote><p>God wills not only Himself, but other things apart from Himself. This is clear from the comparison which we made above (A. 1). For natural things have a natural inclination not only towards their own proper good, to acquire it if not possessed, and, if possessed, to rest therein; but also to spread abroad their own good among others, so far as possible. Hence we see that every agent, in so far as it is perfect and in act, produces its like. It pertains, therefore, to the nature of the will to communicate as far as possible to others the good possessed; and especially does this pertain to the divine will, from which all perfection is derived in some kind of likeness. Hence, if natural things, in so far as they are perfect, communicate their good to others, much more does it appertain to the divine will to communicate by likeness its own good to others as much as possible. Thus, then, He wills both Himself to be, and other things to be; but Himself as the end, and other things as ordained to that end, inasmuch as it befits the divine goodness that other things should be partakers therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 19 | art. 2, Whether God wills things apart from Himself?, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-d8fb1313fc" data-kw="">
<blockquote><p>And O how He ‘travails in the greatness of his strength, mighty to save! able to save to the uttermost them that come unto God by Him.’ O His infinite willingness to save us! how deeply marked in words, in oaths, in cries, in tears, in sighs, in groans, in blood, in death of an expiring God! He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix, “An Address to the Rising Generation” in Two Short Catechisms Mutually Connected</cite>, (Edinburgh: 1769), as in Addresses to Children Concerning Salvation (Torwood Press, 2013), pp. 9-15</span></figcaption>

</figure><figure class="quote" id="q-f1313ded91" data-kw="">
<blockquote><p>They have not known Me; which is indeed the only true wisdom; they have not studied my disposition or mildness toward them; they are so sottish, that they have neither regarded my counsels nor threats, but utterly stupid; they know not what is for their own good, have no understanding.</p></blockquote>

</figure><figure class="quote" id="q-016b0f6c72" data-kw="">
<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations upon our Savior’s Parable of the Prodigal Son</cite>, … (London: Roycroft, 1678), ch. 27, pp. 253-54</span></figcaption>

<blockquote><p>There cannot, it is said, be two supreme and independent Governments in the same society. True, we answer, if the two Governments are exercised for the same ends, and upon the same matters. The whole weight of the objection consists in the supposition that this is the case. It is obvious that, otherwise, it cannot for a moment be maintained.

For if the Civil and the Ecclesiastical Government have each an ascertainable province, each within that province may act supremely and without control. No conflict can arise; but, on the contrary, each may indirectly help on the objects of the other. The Civil may aid the Ecclesiastical by a temporal provision for the maintenance of ministers; and the Ecclesiastical the Civil, by producing a population abounding in the fruits of faith, and leading peaceable and quiet lives, in all godliness and honesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>46. For the better understanding whereof it is to be observed, that so far as the ministers and members of the church are citizens, subjects, or members of the commonwealth, it is in the power of the magistrate to judge, determine, and give sentence, concerning the disposing of their bodies or goods; as also concerning the maintenance of the poor, the sick, the banished, and of others in the church who are afflicted; to regulate (so far as concerneth the civil order) marriages, burials, and other circumstances which are common both to holy, and also to honest civil societies; to afford places fit for holy assemblies, and other external helps by which the sacred matters of the Lord may be more safely, commodiously, and more easily in the church performed; to remove the external impediments of divine worship or of ecclesiastical peace, and to repress those who exalt themselves against the true church and her ministers, and do raise up trouble against them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One hundred and eleven propositions concerning the ministry and government of the church</cite>, (1647; Edinburgh, 1844), p. 13.</span></figcaption>

</figure><figure class="quote" id="q-f2bd2c70c7" data-kw="">
<blockquote><p>In what continual danger are we everywhere of running into extremes! While some, blinded and hardened by sin, never bestow one serious thought about their souls, — insensible of the malady within, they despise the physician and disregard the means of recovery, — there are others who think or at least talk of nothing else but of their disorder, saying how bad they are.

Fruitless complaints, complaints of themselves and of their condition, is the sum and substance of their religion. If they can conjure up doubts respecting themselves, and form desponding complaints of their uncomfortable condition, they fancy that they have done their duty. I have myself known several who have spent a good part of their time in such spiritual gossiping, — I know not what else to call it, in going up and down from one to another with their melancholy complaints and objections. But such conduct is utterly contrary to the life of faith.

Had they spent half this time in pouring out their complaints before the Lord, or employed it in doing good to others, they would have been long ago fat and well liking, thriving daily in holiness, and comfort, life and joy. I say not but that it is good, in our soul’s concerns and spiritual difficulties, to apply to them who are furnished with the tongue of the learned, and who know how to speak a word in season to the weary: but what I say is, that for persons to fill their minds with their own complaints and objections, without endeavouring to mix with faith and practice what is spoken for their relief, and to go on still in their own slothful and obstinate way, that this is of no sort of use or advantage, but I fear of much real hurt to the soul.

And yet some, I am apt to think, may even please themselves in such a course, as if it had somewhat in it of eminency in religion. But can they think to mend their condition by wishing it were better, or by complaining that it is so bad? If they do, they will most assuredly be disappointed. None of us will think so absurdly about worldly things. In such things we readily take an industrious course. The husbandman well knows, that if he be idle and slothful in seed-time, it will be in vain to form any expectations as to the time of harvest. “The sluggard will not sow by reason of cold;” and what return hath he in harvest? He must “beg in harvest and have nothing.” Prov. xx. 4.

So it is in spiritual things. The hand of the diligent alone maketh rich. Tell me how a man employs his time, whether he is slothful or industrious, and I will tell you what progress he makes in grace; for you may as soon gather grapes of thorns or figs of thistles, as enjoy those fruits of the Spirit, — love, joy, and peace, whilst you live after the flesh, in self-indulgence, ease, and sloth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The means to be used for obtaining peace (1782) in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-c1a1f211d5" data-kw="">
<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But:

1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth.

2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men…

3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 550-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

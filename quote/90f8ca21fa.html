>
</figure><figure class="quote" id="q-3e726a8c53" data-kw="">

%20in%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b011b04a0" data-kw="">
<blockquote><p>I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the temple destroyed? Is the temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the temple or the synagogue the model on which the Church of the New Testament is formed? Does the Old Testament itself point to anything but ‘the fruit of the lips’ [Heb. 13:15] as the peace-offering or thank-offering of gospel times? Is there a trace in the New Testament of any other mode of praise? For my part I am persuaded that if the organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fullness — against the substitution again, in our whole religion, of the formal for the spiritual, the symbolic for the real.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in James Gibson’s, The Public Worship of God</cite>, (1869), p. 107 Candlish was a leading minister in the Free Church of Scotland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

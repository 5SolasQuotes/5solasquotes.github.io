<blockquote><p>In the question concerning the right of God, a distinction is adduced through τὸ ‘as Lord’, and ‘as judge’. See [Hugo] Grotius, On Satisfaction, pp. 42-43, 8 vo edition, and Joh. Junius in the refutation of the lectures of [Faustus] Socinus, ch. 16, pp. 563-64. Thus Suarez On Laws, bk. 2, ch. 6, through the distinction of God as legislator and as Lord, explains the right of dispensing in the natural law.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4ffb2adec" data-kw="">
<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology.

7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Method of Christian Theology</cite>, (London: White &amp; Snowden, 1681), pt. 1, ch. 1, pp. 31-32 tr. AI Stiven Peter Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-ed5bc88946" data-kw="">
<blockquote><p>For, since the principle of all the knowledge which the reason acquires about a thing is the understanding of that thing’s essence—because, according to the Philosopher’s teaching (2 Posterior Analytics 3, 9) the principle of a demonstration is what a thing is—it follows that our knowledge about a thing will be in proportion to our understanding of its essence. Therefore, if the human intellect comprehends the essence of a particular thing, such as a stone or a triangle, no truth about that thing will surpass the capability of human reason. But this does not happen to us in relation to God, because the human intellect is incapable by its natural power of attaining to the comprehension of his essence. For our intellect’s knowledge, according to the mode of the present life, originates from the senses: and thus things which are not objects of sense cannot be comprehended by the human intellect except insofar as knowledge of them is gathered from sensibles. Now sensibles cannot lead our intellect to see in them what God is, because they are effects unequal to the power of their cause. And yet our intellect is led by sensibles to the divine knowledge so as to know about God that he is, and other such truths which need to be ascribed to the first principle. Accordingly, some divine truths are attainable by human reason, while others altogether surpass the power of human reason. … Furthermore, the same is made abundantly clear by the deficiency which we experience every day in our knowledge of things. For we are ignorant of many of the properties of sensible things, and in many cases we are unable to discover the nature of those properties which we perceive by our senses. Much less, therefore, is human reason capable of investigating all the truths about that most sublime [divine] essence. This agrees with the saying of the Philosopher, where he says that our intellect is like the eye of a bat in relation to the sun in relation to those primary things which are most evident in nature (1a Metaphysics 1, 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 3</span></figcaption>

</figure><figure class="quote" id="q-0edcc5e7a1" data-kw="">
<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds</cite>, … (London: Bishop, 1584), p. 44</span></figcaption>

<blockquote><p>7. [Question:] Whether form is [1] something accidental, and [2] whether the whole essence of a thing, and consequently the only essential part of a composite? We deny both, with all the sounder philosophers. See Suárez, the Coimbrans, Ruvio;</p></blockquote>

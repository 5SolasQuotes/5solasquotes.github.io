<main class="wrap"><figure class="quote" id="q-4519123cd8" data-kw="">
<blockquote><p>4. ‘By this the justified man lives and abides’ (as Towne says) ‘forever, by faith, in the sight of God.’ But what haste? The Resurrection is not past yet, except Antinomians with Familists follow Hymeneus and Phyletus: [1.] Nor are the justified yet glorified; they abide not ever under God’s eye sinless and as clean as Christ (as Eaton blasphemes to his everlasting shame), for the Jebusite (says Towne) remains in the land, the law of the members and sinful corruption of the flesh dwells in them. 2. They must say daily, ‘Forgive us our sins,’ if God be their Father, else they need not pray daily, ‘hallowed be thy name, thy kingdom come,’ etc. 3. The flesh of sin dwells with the Spirit, Rom. 7, while they live. 4. Death is not an imaginary lie and fancy, so as faith must believe the contradicent [contrary], that is, that believers’ breath goes not out, they return not to their dust, [rather] they are to believe, sure, believers see corruption, Acts 13:36; 2:27-29; 1 Cor. 15:42-44. Then Antinomians cannot say true[ly] that there is no more sin in believers, nor anything having the nature and being of sin, than is in Christ. 5. They are not yet enjoying God in a vision of glory, as Christ did, even in the days of his flesh, for He was both ‘viator’ [wayfarer] and ‘comprehensor’ [attainer], a traveller to the crown and an enjoyer of the crown, and therefore though justified, they must walk here below, and cannot choose but sin, though they be ‘not forced’ to sin (as Towne says).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist... (London, 1648) | pt. 2 | ch. 58, ‘Antinomians teach, believers must not walk in their conversation as in the sight of God, but must live by faith with God’</cite>, p. 103</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-861d4e5588" data-kw="">
<blockquote><p>Wherefore there remaineth two rules for to judge of spirits. One is, if the opinions, as touching faith be retained perfect and pure. And this meant John when he said: ‘If any man confess the Lord Jesus,’ etc. And this confession of opinions must be examined by the holy Scriptures: the which seeing they had not in the Church at the beginning, as concerning the New Testament, they were examined by the words and doctrine of the apostles. Therefore John a little after says: ‘He that is of God heareth us, and he that heareth not us is not of God.’ Then he adds, that thus we do prove the spirit. Another rule is of manners and life: This did Christ express when he said: ‘By their fruits ye shall know them.‘ And as opinions are known by examining of them with the Scriptures, so life and manners should be tried by the discipline of the Church… In the primative Church a gift was extant whereby it might easily be known with what spirit they which did speak were led. By these means Satan was resisted when he transformed himself into an angel of light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Discerning of Spirits’ in The Common Places… (London: Henrie Denham et al., 1583), pt. 4, ch. 4, ‘Of Ecclesiastical Laws’, pp. 45-46</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-f130a1ffdf" data-kw="">
<blockquote><p>One hopes that reviews like this will become a thing of the past, as neo-Calvinist anxieties about the Protestant retrieval of 17th century Reformed thought subside. Retrieval has increasingly revealed that, despite the diversity in the doctrinal development of the 17th century, the distinctives of neo-Calvinism have no place in that diversity, nor could they arise logically from that diversity. Reformed theology, from Calvin to the 19th century, was thoroughly “dualistic” – affirming distinctions between natural/supernatural, nature/grace, reason/faith, temporal/eternal, earth/heaven, and secular/sacred. Reformed theology did not reject these medieval categories as popish errors, let alone as paganistic. They incorporated them in their theological systems, modifying them as they saw fit, and these became essential to their system’s coherence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-wolfe.html">Stephen Wolfe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Correcting Theologians: A Response to Brian Mattson’ (2023)</cite></span></figcaption>

<blockquote><p>But in the letter to the Romans [12:7-8] and in the first letter to the Corinthians [12:28], he lists others [other offices besides those of the Word], as powers [miracles], the gift of healing, interpretation, government, and caring for the poor. Two of these I omit as being temporary, for it is not worthwhile to tarry over them. But two of them are permanent: government [ruling elders] and caring for the poor [deacons].</p></blockquote>

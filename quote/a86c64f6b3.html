<main class="wrap"><figure class="quote" id="q-a86c64f6b3" data-kw="">
<blockquote><p>When preaching on John 20:28, the elder Thomas McCrie digressed to explain how the resurrection of Christ bestowed peculiar honour upon the first day of the week:

The text in its connexion leads me to observe, that our Lord Jesus put peculiar honour on the first day of the week. On that day he rose from the dead; and by that very act it was distinguished from all the other days. As God rested from all his works in creation on the seventh, so did Christ rest from his works in redemption, and declare them complete, by rising from the grave on the first day.

On this day he appeared to the women, to Peter, to the two disciples travelling to Emmaus, and to the ten apostles. The evangelist is very particular in naming the day; for though it had been mentioned before, he does not satisfy himself with saying, “Now the same day in the evening,” but adds, “being the first day of the week.” On the ensuing first day he renewed his visit. And it was on the same day of the week, that the Spirit descended on the apostles.

These acts were sufficient to dedicate that portion of time to a sacred use; for divine authority having already set apart one day in seven, there was no necessity for such an express appointment in transferring the Sabbath from one day of the week to another. The analogy between the works of creation and redemption, as recognised in Scripture, — the reason of the thing, — the example of Christ and his apostles, — and the name given to that day by the Spirit of God, constitute an ample warrant for our faith in keeping it holy to the Lord, as the Christian Sabbath, and for our expecting his spiritual presence on it.

There is no superstition in looking for a special blessing on the first day of the week. There is a hallowing influence in the thought, “This is the LORD’S DAY;” — “This is the day which the Lord hath made; we will rejoice and be glad in it. Save now, I beseech thee, O Lord! I beseech thee, send now prosperity.” The highest attainment on this side heaven, is to be “in the Spirit on the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Confession of Thomas in Sermons</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-898facf2ea" data-kw="">
<blockquote><p>It is most agreeable to reason, that after six work days, one day should be consecrated to divine worship. The least division of days is into a week, the next greater division is into a month, the next into a year. Now by the light of nature it seems far more reasonable, that one day in seven should be imployed [sic] in God’s service, than one day in a month. And if a seventh part of our time be consecrated unto God, better a seventh day, than a seventh part of every day, because the worldly occupations of each of those days, must needs cause miserable distraction. Thus reason may discourse in probable manner, when God hath gone before us to open a way unto us. Certainly, when God hath once determined the proportion of time, it is so far from being accounted moral, as perpetual, and still to hold, until God himself shall alter it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the morality of the fourth commandment, as still in force to bind Christians. Delivered by way of answer to the translator of Doctor Prideaux his lecture, concerning the doctrine of the Sabbath</cite>, (London, 1641), the preface.</span></figcaption>

<blockquote><p>But that this may be the clearer, I conceive that there is a twofold, immediate honoring of God in the worship of God:

1. An honoring of God less immediate, as hearing of the Word, is an immediate honoring of God, because honor flows immediately from God, both ex conditione operis, and ex conditione operantis; ‘from the nature of the work’, and ‘[from the] intention of the worker’: yet it is a less immediate honoring of God, in regard that I may also hear the Word even from the condition of the work, and so from the intrinsic end of the worker that I may learn to know God and believe; for thus far I am led to honor God immediately in hearing the Word, that action of its own nature conveying honor to God; there intervenes also a medium amidst between me and honoring of God, to wit, the preacher or the Bible (to which no external adoration is due): [2.] There is another more immediate worship, to wit, praising of God, from which, by an immediate result, God is honored, and in worship especially, strictly, immediate, God is immediately honored both in the intention of the work and the intrinsic end of it, and the intention of the worker; though no other thing be done, and others be not edified either in knowledge, increase of faith or any other ways: And in this, duties of the Second Table, of mercy and justice, differ from worship in that such acts of love and mercy, as to give alms to save the life of my brother or of his beast, are not acts of worshipping God; their intrinsic end, and the nature of the work being to do good to the creature, principally, ex natura et conditione operis, though God also thereby be honored, yet in a more secondary consideration: For I praying to God, do immediately, from the nature of the action, honor God, though no good should either redound to myself or to the creature; thereby it is true, God, by acts of love and mercy to our neighbor, is honored two ways:

1. In that men seeing our good works do thence take occasion to glorify our heavenly Father, whose truth teaches us by the grace of God to do these works, but the intrinsic and proper use of these is to do good to ourselves, as in works of sobriety, and to our neighbor, as in works of righteous dealing, but not immediately, and in the first and primary consideration to honor God, as in works of piety, holiness and worship, the honoring of God by secondary resultance, does issue also from these duties of righteousness, but not as from the acts of praying, praising, sacramental eating, drinking.

2. The doer of these acts of mercy may, and is to intend, the honoring of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Intro, section 6, pp. 87-88</span></figcaption>

%3A+For+I+praying+to+God%2C+do+immediately%2C+from+the+nature+of+the+action%2C+honor+God%2C+though+no+good+should+either+redound+to+myself+or+to+the+creature%3B+thereby+it+is+true%2C+God%2C+by+acts+of+love+and+mercy+to+our+neighbor%2C+is+honored+two+ways%3A+1.+In+that+men+seeing+our+good+works+do+thence+take+occasion+to+glorify+our+heavenly+Father%2C+whose+truth+teaches+us+by+the+grace+of+God+to+do+these+works%2C+but+the+intrinsic+and+proper+use+of+these+is+to+do+good+to+ourselves%2C+as+in+works+of+sobriety%2C+and+to+our+neighbor%2C+as+in+works+of+righteous+dealing%2C+but+not+immediately%2C+and+in+the+first+and+primary+consideration+to+honor+God%2C+as+in+works+of+piety%2C+holiness+and+worship%2C+the+honoring+of+God+by+secondary+resultance%2C+does+issue+also+from+these+duties+of+righteousness%2C+but+not+as+from+the+acts+of+praying%2C+praising%2C+sacramental+eating%2C+drinking.+2.+The+doer+of+these+acts+of+mercy+may%2C+and+is+to+intend%2C+the+honoring+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%28London%2C+1646%29%2C+Intro%2C+section+6%2C+pp.+87-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3bbb2e9cba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3bbb2e9cba.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=But%20that%20this%20may%20be%20the,to%20intend%2C%20the%20honoring%20of%20God&amp;text=But%20that%20this%20may%20be%20the%20clearer%2C%20I&amp;text=and%20is%20to%20intend%2C%20the%20honoring%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a033a868f3" data-kw="">
<blockquote><p>Now, such were the innovations of the late hierarchists. In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, 8:28.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now, such were the innovations of the late hierarchists. In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.”

— John Owen, The Works of John Owen, 8:28.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow%2C+such+were+the+innovations+of+the+late+hierarchists.+In+worship%2C+their+paintings%2C+crossings%2C+crucifixes%2C+bowings%2C+cringings%2C+altars%2C+tapers%2C+wafers%2C+organs%2C+anthems%2C+litany%2C+rails%2C+images%2C+copes%2C+vestments%2C%E2%80%94what+were+they+but+Roman+varnish%2C+an+Italian+dress+for+our+devotion%2C+to+draw+on+conformity+with+that+enemy+of+the+Lord+Jesus%3F+In+doctrine%2C+the+divinity+of+Episcopacy%2C+auricular+confession%2C+free-will%2C+predestination+on+faith%2C+yea%2C+works+foreseen%2C+%E2%80%9Climbus+patrum%2C%E2%80%9D+justification+by+works%2C+falling+from+grace%2C+authority+of+a+church%2C+which+none+knew+what+it+was%2C+canonical+obedience%2C+holiness+of+churches%2C+and+the+like+innumerable%2C%E2%80%94what+were+they+but+helps+to+Sancta+Clara%2C+to+make+all+our+articles+of+religion+speak+good+Roman+Catholic%3F+How+did+their+old+father+of+Rome+refresh+his+spirit%2C+to+see+such+chariots+as+those+provided+to+bring+England+again+unto+him%21+This+closing+with+Popery+was+the+sting+in+the+errors+of+those+days%2C+which+cause+pining%2C+if+not+death%2C+in+the+episcopal+pot.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+8%3A28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa033a868f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a033a868f3.html">Permalink</a><a class="src" href="https://heidelblog.net/2019/10/owen-contra-romanist-corruptions-of-reformed-worship-and-theology/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-bf17dd8e89" data-kw="">
<blockquote><p>It is a contradiction that an action-individual should be indifferent, and so neither good nor evil, and yet done in faith and referred to God’s glory: For the ground of doing, which is faith, and the end, which is God’s glory, are individual properties necessarily concurring to the individuation of the action-moral.

2. An action-individual that is merely indifferent, and so without sin, may be performed without sin or omitted without sin, cannot be an action of faith referred to God’s glory: For what may be done without sin and may not be done without sin, is a will-action, and wants all necessity of reason, and so is an idle and sinful action; but a sinful action may be done in fancy, but in faith it cannot be done; it may in the vain intention of the doer be referred to God’s glory, in intentione erronea operantis, but ex conditione operis, according to the nature of the work, it serves not for God’s glory. This way to cast stones in the water [for example], should be of faith, and referred to God’s glory: But shall I believe I am doing in faith and glorifying God when I am casting stones in the water, and I have as good reason not to cast at all? If one will-action that may be done, and may not be done, may be of faith and referred to God’s glory, then may they all be of faith and referred to God’s glory: This is a laughter, rather than divinity.

3. I cannot believe that an action that has as good reason to be omitted as to be done, can be acceptable to God, because I have no ground for my faith; for my faith here leans neither on Scripture nor on Reason; but there is no reason why the action should rather be, nor not be, because it is indifferent; yea, crossing and kneeling [as worship] of themselves shall be of faith, because I believe them to be of faith: But it is a vain thing to say that faith makes its object.

4. There are no actions in the world but they have all their moral necessity from their intrinsic goodness: For from whence is it necessary to love God, but from the intrinsic goodness that the love of God has from God’s command? For there is no necessity an action to be at all; yea, it is idle and superfluous if there be no goodness in it at all. If then crossing and kneeling (laying aside the respect of humane laws commanding them) have no necessity-moral from any commandment of God why they should be at all, their necessity must be all from man’s will: this is tyranny in rulers for their sole pleasure to command under the heaviest pain things that have no necessity at all but their will.

5. Neither is it any yoke to men’s conscience, to square all their moral-action by God’s Word and so to see (‘according as it is written’) before they venture upon any action-moral. It is liberty to keep God’s way accurately.</p></blockquote>

<blockquote><p>Having set the understanding of the main Text [Romans 13] right, I come now to those examples that are alleged to prove, That it is lawful to resist in some cases.

1. The example of the peoples resisting Saul’s illegal and tyrannical attempt to have put Jonathan to death without cause.

If this were lawful in them in a particular man’s case (against whom also there was some seeming cause) How much more to resist one that is bent to subvert Religion, Laws and Liberties, and so to take away the life of many at his own pleasure.

To this is answered, not, that it was unlawful in the people to make this resistance (which yet if he deny not, he plainly yields his cause in his first Proposition, and Rom. 13.2. forbids not all Resistance) but only that the people drew not into Arms themselves, but being there at Saul’s command did by a loving violence and importunity hinder the execution of a particular and passionate unlawful command.

To this I reply.

1. If it were lawful now; what hinders but they might have come together to prevent such a mischief as Jonathan’s unjust Death? Sure Saul called them not together to resist himself in any thing. Neither did his calling them together to fight against the Philistines authorize them to fight against him, if it were not lawful of it self.

Our King called the Parliament together, yet he allows not them to resist upon that pretence, though they are undeniably, not the great Council only, but the great Court of Judicature in the Kingdom.

This peace then of his Answer is nothing but words and pretence.

2. As for his loving violence and importunity wherewith he would blanch their Resistance.

Grant they shewed a love to Saul, because Jonathan was Saul’s son. But had Saul counted him his Enemy, (as he did David afterward) It would have sounded harsh violence, and outrageous enough, and it was plainly a great deal beyond a loving violence. For Saul swore his death, and they swore his life, that not a hair of him should, &amp;c.

This was Resistance then with an Oath, as it were, to make Saul forsworn.

After this Example then our people may swear an Association, that not one of the Parliament shall be put to death (unless proved guilty according to Law) notwithstanding any Proclamation of them to be Traitors, or condemning them to death illegally.

3. And thirdly, as it cannot be thought, but if Saul had further attempted by himself, or any of his followers to assault Jonathan, the people would have actively resisted him and them even with arms in Jonathan’s defence.

The second Example is David’s resisting of Saul, sc. by gathering a band of 600. men, and offering to have kept Keilah against Saul, but that God told him the Kilties would have betrayed him.

That he sinned not in it appears.

1. By his own pleading his innocence even to God in his Prayers and Psalms, as far as concerned the business between him and Saul.

2. Himself after this pleads it to Saul, 1 Sam. 24 &amp; 26. and calls God to witness that he had not transgressed at all against him.

3. God himself discharged David from all notorious sin, excepting the matter of Uriah, 1 Kin. 1.5.

Now had not his Resistance been lawful, it had been most notorious Rebellion and Treason.

4. Fourthly, even our Doctor condemns it not, and therefore, all resistance is not unlawful, much less damnable, as he often thunders.

But this Example sticks with him, and therefore he makes a four-fold answer.

1. David’s guard that he had about him was only to secure his person against the cut-throats of Saul, if sent to take away his life.

Reply. But this could not have been done without killing divers of them, if they had assaulted him, which had then been no murder, but a just defence and execution of Justice. So far himself grants lawful.

2. But he says it was a mere defence without any violence offered to Saul. Therefore he still gave place as Saul pursued, and did no act of hostility to him, or any of his Army, when they were in his power, 1 Sam. 26.

Reply. He was not strong enough to encounter Saul in the field, who had divers thousands (3000 mentioned 1 Sam. 13.) against his 600. Wisdom bids him fly as long as he could, rather then fight.

2. Conscience forbids him to kill Saul: so I grant it doth any Subject, though having the King at any such advantage. But that he hurt none of his followers, 1 Sam. 26. was again an act of wisdom, and we need not go to conscience for a reason of it. He had only one man with him, Abishai, and had he offered to kill any of the Army, how soon might this in all likelihood have wakened the rest, and so he had endangered his own life to little purpose. For he could not in probability have killed many, and what had that done to his cause and defence afterward.

Yet also, I hold not that in cold blood, one or many that are upon the defensive, may lawfully kill sleeping enemies, or such waking farther then appears, at least in some sort necessary, or much advantageous to the defence, and prejudicial to the opposites. But if killing, as many as David could have killed that night, himself and Abishai would have given hopes of ending Saul’s pursuit of him, and have made peace; I doubt not, but he would and might have done it, as well as keep Keilah against him.</p></blockquote>

<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.”

— Francis Rous, The Lawfulness of Obeying the Present Government, … (London, 1649), pp. 16-19 Rouse was a Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+it+is+cleared+in+this+discourse+that+those+who+have+gotten+to+be+powers+%28though+by+force%29+yet+ought+to+give+justice+to+those+whose+government+they+have+undertaken.+And+again%2C+that+the+people+may+lawfully+demand+it.+But+is+it+possible+that+one+or+a+few+persons+in+supreme+power+can+distribute+justice+to+a+whole+nation+without+subordinate+agents%3F+So+that+to+say%2C+%E2%80%98None+may+lawfully+act+under+the+supreme+power+in+distributing+of+justice%2C+and+government%2C%E2%80%99+were+to+say+upon+the+matter+that+he+should+give+no+justice%2C+and+that+the+people+should+have+no+justice+at+all.+And+then+how+absurd+is+it+to+teach+that+the+people+may+lawfully+seek+justice+of+him+which+they+cannot+receive%3F+and+that+he+is+bound+to+give+justice%2C+but+none+are+allowed+by+whom+he+may+give+it%3F+Fourthly%2C+this+doctrine+of+not+acting+is+the+very+doctrine+of+levelling.+For+when+no+man+may+act+to+give+justice%2C+may+not+every+man+take+freely+from+his+neighbor+what+he+list%2C+and+so+level+the+rich+with+the+poor%3F+unless+this+make+it+unlikely%2C+because+worse+than+levelling%2C+that+those+who+have+most+force+will+have+most%3B+yea+some+all%2C+and+others+nothing%3B+and+so+to+avoid+acting+under+a+supposed+tyrannical+government+unto+justice+and+order%3B+there+shall+be+tyrants+in+every+place+or+parish%2C+who+shall+act+to+disorder+and+oppression%2C+and+no+property%2C+justice%2C+nor+government+at+all+left+amongst+us.+And+surely+I+think+David+out+of+his+love+to+Israel+would+not+have+wished+such+an+estate+to+Israel+under+Absalom%2C+had+he+the+whole+in+possession+and+himself+no+force+on+foot+to+recover+it%3B+nor+would+he+have+desired+such+an+unsettlement+to+procure+his+settlement.+And+hence+arises+that+which+they+call+an+interpretative+consent+of+the+people%3B+because+it+is+understood+and+supposed+that+every+rational+man+does+consent%2C+that+there+should+be+order%2C+property+and+right+given+to+every+member+of+a+commonwealth+under+a+tyrant%2C+rather+than+all+to+be+under+confusion+oppression%2C+robberies+and+murders.+Fifthly%2C+how+could+Ezra+and+Nehemiah+justify+their+acting+under+the+Persian+monarch%2C+who+had+no+right+to+the+crown+of+Judah+either+by+blood+or+just+conquest+%28Ezra+7%3A25%29%3F+Yet+Ezra+was+authorized+by+him+to+set+magistrates%2C+fine+and+imprison+and+put+to+death+%28Ezra+10%3A7-8%29%3B+And+he+exercises+authority%2C+in+making+the+people+of+Israel+to+swear+and+to+enter+into+a+covenant%2C+and+in+sending+forth+a+proclamation+to+all+the+children+of+the+captivity%2C+that+they+should+gather+themselves+together+to+Jerusalem%3B+And+that+whosoever+would+not+come+within+three+days%2C+all+his+substance+should+be+forfeited.+Nehemiah+also+acts+as+governor%2C+and+rebukes+the+nobles+and+rulers+and+sets+a+great+assembly+against+them+because+of+their+usury.+He+also+called+the+priests+and+took+an+oath+to+perform+the+promise+of+leaving+that+usury+%28Neh.+5.+%E2%80%A2.+etc.%29.+He+acknowledges+also+that+he+was+governor+there+about+twelve+years%2C+and+he+gave+his+brother+Hanani+and+Hanaiah+ruler+of+the+palace+charge+over+Jerusalem+%28Neh.+7%3A2%29.+So+he+did+both+act+himself+and+others+acted+under+him.+We+find+also+that+at+that+time+there+were+rulers+of+the+people+that+dwelt+at+Jerusalem%2C+and+Nehemiah+contended+with+the+rulers+and+nobles%2C+made+treasurers%2C+commanded+the+gates+to+be+shut+before+the+Sabbath%2C+threatened+to+lay+hands+on+the+merchants+that+lay+at+the+gates%2C+smote+certain+of+the+Jews+and+plucked+off+their+hair+because+having+married+wives+of+Ashdod%2C+their+children+spake+half+in+the+language+of+Ashdod+%28Neh.+13%29.+Sixthly%2C+let+us+hear+what+before+these+times+and+before+our+case+was+in+being+hath+been+taught+in+point+of+acting%3B+and+upon+what+grounds+it+has+been+approved.+An+author+eminently+learned+and+skillful+in+the+doctrine+of+lawgiving+says+thus%3A+%E2%80%98No+man+may+punish+or+condemn+another+even+with+a+just+punishment%2C+except+he+have+public+power%2C+which+a+tyrant+cannot+give.+But+in+this+there+must+be+a+consideration+or+subdistinction.+For+in+rigor+this+is+true+as+to+the+tyrant%E2%80%99s+part%3B+yet+it+so+happens+that+the+commonwealth+because+it+cannot+resist+him%2C+does+tolerate+him%2C+and+suffers+itself+to+be+governed+by+him%3B+and+does+tacitly+consent%2C+and+will+that+justice+be+administered+by+him%2C+for+the+reason+already+touched%2C+because+it+is+a+less+evil+to+be+governed+by+him%2C+than+altogether+to+want+just+coaction+and+direction%3B+and+then+it+shall+not+be+a+sin+to+obey+even+in+the+things+aforesaid%2C+because+the+consent+of+the+commonwealth+does+supply+the+defect+of+the+tyrant%E2%80%99s+power.%E2%80%99+%28Suarez%2C+De+Leg.%2C+bk.+3%2C+ch.+10%29+Another+thus%3A+%E2%80%98That+his+sentences+are+valid%2C+is+proved.+Because+his+sentences%2C+and+just+commands+although+they+have+not+force+from+a+tyrannical+power%2C+yet+they+have+it+from+elsewhere.+First%2C+and+inchoatively+from+the+law+of+nature%2C+which+such+a+state+of+things+being+supposed%2C+does+dictate+that+obedience+must+be+given+for+the+common+good%2C+otherwise+all+will+be+full+of+thefts+and+robberies.+Secondly%2C+and+completely+from+the+commonwealth%3B+and+that+either+because+while+that+state+endures%2C+it+gives+authority+to+him+by+a+tacit+consent%2C+while+it+will%E2%80%99s+that+he+administer+justice%2C+and+use+his+usurped+office+in+a+due+manner%2C+or+rather+because+it+does+tacitly+approve+his+commands%2C+and+acts+being+agreeable+to+the+laws+and+common+good%2C+and+will%E2%80%99s+that+his+just+sentences%2C+whereby+the+suites+of+the+people+are+decided%2C+and+the+guilty+are+punished%2C+shall+be+valid+and+bind+the+subjects%3B+for+except+they+were+valid+and+did+bind%2C+no+man+would+obey%2C+but+only+in+show+but+every+man+would+secretly+do+the+contrary+with+a+great+inconvenience+to+the+commonwealth.+Now+the+commonwealth+may+give+this+force+to+the+sentences%2C+and+acts+of+a+tyrant%2C+because+it+is+superior+to+all+single+persons%2C+though+it+be+oppressed+with+tyranny%2C+and+may+account+the+just+sentence+of+a+tyrant+as+its+own.%E2%80%99+%28Lessius%2C+De+Justitia+%26+Jure%2C+bk.+2%2C+ch.+25%2C+Dubitat.+9%29+Thou+wilt+ask+whether+a+tyrant+do+sin+the+sin+of+murder%2C+and+be+bound+to+restitution%2C+if+he+put+to+death+guilty+persons%2C+or+deprive+them+of+their+goods+according+to+law%3F+I+answer+negatively%3B+because+the+commonwealth+does+tacitly+give+him+authority+hereunto%2C+while+it+does+consent+and+desire+that+this+should+be+done+by+him.+Thus+is+the+authority+of+acting+in+this+case+grounded+upon+a+tacit+or+implied+consent%2C+which+consent+is+the+very+dictate+of+nature+or+common+reason%2C+because+it+is+better+to+have+some+justice+than+none+at+all%2C+some+coercive+power+and+government+than+that+all+be+left+to+disorder%2C+violence+and+confusion.%E2%80%9D%0A%0A%E2%80%94+Francis+Rous%2C+The+Lawfulness+of+Obeying+the+Present+Government%2C+%E2%80%A6+%28London%2C+1649%29%2C+pp.+16-19+Rouse+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a06baff06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a06baff06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=Thirdly%2C%20it%20is%20cleared%20in%20this,left%20to%20disorder%2C%20violence%20and%20confusion&amp;text=Thirdly%2C%20it%20is%20cleared%20in%20this%20discourse%20that&amp;text=all%20be%20left%20to%20disorder%2C%20violence%20and%20confusion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assertion 2 – This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him, as Dr. Ferne [a royalist] confesses, (sec. vii, p. 30)… …2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, Question 12, ‘Whether or not a Kingdom may Lawfully be Purchased by the Sole Title of Conquest?’, p. 47</span></figcaption>

</figure><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>

<blockquote><p>Neither is Cæsar to make War as heed of Christendom, Protector of the Church, Defender of the Faith; these Titles being false and Windy, and most Kings being the greatest Enemies to Religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lib. contra Rusticos apud Sleidan</cite>, bk. 5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-68e957828a" data-kw="">
<blockquote><p>[B]ut for the work of Christ, there could be no means of satisfying Divine justice—no escape from a state of condemnation and death—no admission into the kingdom of grace—no access to everlasting glory. His incarnation, sufferings, and death, were all directed to the one great end of opening a way by which we might be reconciled to God and obtain mercy, in consistency with the honour of the Divine law and the perfection of the Divine government.

It was not because God was unwilling to extend mercy, that the interposition of Christ became necessary; infinitely the reverse; for it was the very purpose of God which Christ came to establish, and it is the glory of his work that it is a work which the Father gave him to do. But a method had to be provided by which grace might reign through righteousness, and not invade or impair the immutable claims of Divine justice.

And here lay the burden of what Christ undertook to do. He had, as it were, to open up a new way by which mercy might reach our guilty race—a way through the foundations of eternal righteousness; and yet, instead of Weakening or in any way defacing them, to manifest, by so doing, their impregnable strength, and to confirm their stability. What had never been conceived to be possible before by any created being, to reconcile things in heaven and things on earth—the attributes and perfections of God as the judge of all, and the pardon and salvation of sinners—was Christ’s transcendent and glorious achievement.

A new thing had to be done, involving a moral miracle of surpassing mystery and difficulty. There lay on the one side a world of perishing outcasts, while on the other there was a fountain of infinite love; but Divine justice erected its impenetrable barriers between; and the question came to be. How convey the streams of healing grace to relieve the miseries and to supply the wants of a ruined race?

The stroke of Moses’ rod brought water from the bosom of the flinty rock to satiate and refresh the parched and dying Israelites in the wilderness. But here there was an infinitely deeper emergency to be met, and that connected with difficulties infinitely more insuperable. What is the intractability of adamant compared with the inviolability of the Divine perfections? How, then, bring mercy from the bosom of justice, and by what means unite in a covenant of peace a holy God and sinful creatures?

Can any thing more than another deepen your conviction of the necessity of reconciliation with God, it is to look upon Christ’s work in all its arduousness and in all its magnitude, in its relation to the Divine attributes. With men it is often imagined that the mercy of God is such as to encourage them to conceive, that there is nothing which they cannot expect from it. But will God magnify one perfection at the expense of another, or can he divest himself of his truth and righteousness to show himself gracious?

Instead of an unconditional forgiveness, involving the necessary evils of moral anarchy, and an utter subversion of the authority of law, which God can never grant, however the impenitent may desire it, the work of Christ provides for the extension of mercy in a manner equally glorifying to God, and sanctifying in its efficacy upon those who receive it. It brings you within the walls of salvation by a way which, while it allows an abundant entrance into the kingdom of grace, impresses you with the highest conceptions of the infinite righteousness of God. For with what an expense of labour, suffering, and blood did the Redeemer provide this way and lay it open for you? And as you meditate upon his work, how should every vain thought perish of the possibility of finding salvation in any other way!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moses a type of Christ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-849de91a5e" data-kw="">
<blockquote><p>But for whose sins is Christ the propitiation? “He is,” says the Apostle, “the propitiation for our sins, and not for ours only, but also for the sins of the whole world.” When he says, “for our sins,” he may mean, either for the sins of us — Jewish believers, or for the sins of us — believers whether Jews or Gentiles. If he means the former, then the meaning of the second clause is, and not for ours only, but also for the sins of believers of all nations.

He is the propitiation for the sins of us Jewish believers, and not for ours only, but also for the sins of believers throughout the whole world. In this view, the language would agree with that of Caiaphas, which he spoke not of himself, but, being High Priest that year, by Divine inspiration, when he prophesied that Jesus should die for that nation, and not for that nation only, but that he should gather together in one the children of God who are scattered abroad.

But it may be said, that there is no evidence that the Apostle John in his Epistle addressed Jewish believers merely. It may be said, that he addressed believers generally, and this may be true; and so his meaning here will be, — He is the propitiation for our sins, who have already taken him as such; and not for ours only, but also for the sins of any and all, who will take him, throughout the whole world. This Is the view which we would be disposed to adopt; and in this view the words correspond with those of our Lord in his intercessory prayer, — “Neither pray I for these alone, but for them also which shall believe on me through their word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-ross-taylor.html">Walter Ross Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Propitiation for the Sins of the Whole World in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-eaed42d1dd" data-kw="">
<blockquote><p>What then is our foundation in Christ? Is it that he begins salvation and leaves us to complete it? Is it that he only opened up the way, and left us to follow it in our own strength? By no means, but as Paul had a little before declared, it is to acknowledge that he has been given us for righteousness. … in short, all things of his are ours, we have all things in him, he nothing in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.5</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 3.15.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%2C%20so%20soon%20as%20you%20are%20ingrafted%20into%20Christ%20by%20faith%2C%20you%20are%20made%20a%20son%20of%20God%2C%20an%20heir%20of%20heaven%2C%20a%20partaker%20of%20righteousness%2C%20a%20possessor%20of%20life%2C%20and%20%28the%20better%20to%20manifest%20the%20false%20tenets%20of%20these%20men%29%20you%20have%20not%20obtained%20an%20opportunity%20of%20meriting%2C%20but%20all%20the%20merits%20of%20Christ%2C%20since%20they%20are%20communicated%20to%20you.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.15.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89407a0c72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89407a0c72.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-776aec0c23" data-kw="">
<blockquote><p>I am not, therefore, my dear Sir, surprised or too much grieved to bear the complaints you make of darkness within and without. I never, since I knew the ways of God, admired an easy religion—a religion attended with no conflicts, strivings, wrestlings, swoonings, and strong outcries of felt darkness, unbelief, depravity, and bondage.

There is, indeed, ease, pleasure, and rest to be found in Christ; but it is in the way of much fighting and struggling against our hellish adversaries, who are sure to be at our right hand to resist us, whenever we make an earnest attempt to come to the blessed Saviour, whose power and grace they dread and hate; and when we have got within the glorious city of refuge, and begin to drink of strong consolation, Satan envies every drop of comfort, and will do his utmost to dash the cup of consolation out of our hands.

But by faith we stand, even that faith which against hope believeth in hope; and the strength of our faith lies in the intercession of our High Priest and Advocate within the vail. Behold him holding up your case, in all its circumstances, before the glorious eyes of the Father sitting upon the throne of glory, and saying, “Jehovah rebuke thee, Satan: is not this a brand plucked out of the fire?” It is your part to come in at the back of this great Intercessor, hiding yourself, as it were, amidst the dazzling brightness of his glory, consenting from the heart to his suit, and waiting for the breaking forth of an answer, in your darkened, feeble, and sorrowful soul.

And you must give him time and full liberty to carry on his work, by emptying you from vessel to vessel, sifting you as wheat, burning and melting you in the refining furnace, until seven times pass over you. At length you shall see. him inclining to you, bowing the heavens and coming down, to draw you out of many waters, and to de liver you from the hand of strange children, whose mouth speaketh vanity, and their right hand is a right hand of falsehood.</p></blockquote>

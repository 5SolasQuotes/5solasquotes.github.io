<main class="wrap"><figure class="quote" id="q-1ba29d2092" data-kw="">
<blockquote><p>It signifies not merely that there is an external sanctity arising from their not being conceived and born like heathen children (regarding whom there is a strong presumption that they will drink in impiety with their mother’s milk) but also that there is good reason to hope that they may really be sanctified from their tender years so that when they reach the years of understanding, they will through God’s blessing upon the instructions of their parents discern and love the truth, and that, on the other hand, if they should die in infancy, then, as holy persons and members of Christ, they shall be saved. All this we believe on the ground of the promise given to Abraham, and through him to all believers, that Jehovah would be the God—that is, the sanctifier and the justifier—not of him only but also of his seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio catecheseos Heidelbergensis</cite>, in Opera, vol. 7. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-ac29eba9a3" data-kw="">
<blockquote><p>The folly and falsehood of baptismal regeneration have been already pointed out in the former lecture. All the arguments there aimed against the opus operatum apply here. The error most probably grew as superstition increased in the primitive Church, out of the unguarded use of the sacramental language by the early fathers, whose doctrine on this point was sounder. We know that baptism, in supposed imitation of Titus 3:5, was currently called regeneration as early as Justin Martyr and Irenaeus. It is easy to see how, as men’s ideas of sacred subjects became more gross, this figurative use of the word introduced the real error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Meaning of Baptism</span></figcaption>

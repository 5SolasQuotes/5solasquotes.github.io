<blockquote><p>The Mohammedan imposture is, in some respects, the most remarkable of all false religions. The specious simplicity of its essential doctrines, and its perfect freedom from idolatry, distinguish it forever from the gross mythology of classical and oriental paganism. But besides these characteristics, it displays a third, more interesting still. We mean the peculiar relation which it bears to Christianity. Whether it happened from a happy accident or a sagacious policy, we think it clear that Islam owes a vast proportion of its vast success, to the fact that Mohammed built upon another man’s foundation. Assuming the correctness of the common doctrine that the impostor was a brilliant genius, though a worthless libertine, and that his book is the offspring, not of insane stupidity, but of consummate artifice, there certainly is ground for admiration in the apparent union of simplicity and efficacy in the whole design.

The single idea of admitting freely the divine legation of the Hebrew seers, and exhibiting himself as the topstone of the edifice, the Last Great Prophet, and the Paraclete of Christ, has certainly the aspect of a master stroke of policy. Besides conciliating multitudes of Jews and soi-disant Christians, at the very first, this circumstance has aided the imposture not a little ever since. It relieves the Moslem doctors from the dire necessity of waging war against both law and gospel. Whatever can be cited from the Greek and Hebrew Scriptures, without disparaging Mohammed, they admit as readily as any Jew or Christian. Whatever, on the contrary, is hostile to his doctrines or pretensions, or at all at variance with the statements of the Koran, is disposed of, not by an absolute rejection of the Bible, but by a resort to the convenient supposition of corruption in the text. It is not the policy of Islam to array itself against the Jewish and the Christian dispensations, as an original and independent system; but to assume the same position in relation to the Gospel, which the Gospel seems to hold in relation to the Law—or, in other words, to make itself the grand denouement of that grand scheme, of which the Old and New Testaments were only the preparatory stages.

Indeed, if we were fully satisfied that the Rasool Allah [the apostle of God] had any plan at all, we should be disposed to account for it in this way. He was acquainted with three forms of religion, Judaism, Christianity, and Paganism. Disgusted with the latter, he was led, we may suppose, to make some inquiries into the points of difference, between the Jews and Christians. This he could not do, without discovering their singular relation to each other the Christians acknowledging the Scriptures of the Jews, but adding others to them, and regarding Jesus Christ as the Messiah—the Jews on the other hand rejecting the New Testament, and bitterly denying the Messiahship of Christ. This fact might very readily suggest the project of a new dispensation—a third one to the Christian, and a second to the Jew. The impostor would thus be furnished with an argument ad hominem to stop the mouths of both.

To the Jews he could say, Did not Moses tell your fathers that a prophet should rise up in the latter days, greater than all before him? I am he. Do you doubt it? Here is a revelation just received from Gabriel. Do not all your sacred books predict the coming of a great deliverer, a conqueror, a king? I am he. In a few months you shall see me at the head of a thousand tribes going forth to the conquest of the world. If this was the ground really taken at first, how striking must have been the seeming confirmation of these bold pretensions, when Mohammed and his successors had in fact subjected, not Arabia only, but Greece, Persia, Syria, and Egypt.

To the objection of the Christians, that the line of prophets was long since completed, he could answer, Did not Jesus come to abrogate or modify the law, when its provisions were no longer suited to the state of things? Even so come I, to supersede the Gospel—not to discredit, but to render it unnecessary, by a more extensive and authoritative doctrine. So far from being antichrist (as some no doubt objected) I am the very Comforter whom Jesus promised.

That such sophistry might easily have undermined the faith of renegadoes [sic] and half-pagan Christians, is certainly conceivable. Whether this was in fact the course adopted in the infancy of Islam, will admit a doubt. Be that as it may, it is certain, that the impostor considered it expedient to incorporate the leading facts of sacred history into his revelation, so far as they were known to him. That his knowledge of the subject was imperfect, need not excite our wonder. The sources which probably supplied his information, could scarcely be expected to emit a purer stream than that which irrigates the pages of the Perspicuous Book.</p></blockquote>

<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here (section 14) object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [a pseudonym for the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use[d] to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself [a papal apologist] distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgesse [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgesse himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the Sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more then non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached.</p></blockquote>

— George Gillespie, English Popish Ceremonies, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, pp. 62-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+who+speak+out+more+plainly+than+bishop+%5BDavid%5D+Lindsay+%5Bd.+1641%5D%2C+do+here+%28section+14%29+object+to+us+that+reverence+is+due+to+the+sacrament%2C+and+that+we+ourselves+do+reverence+it+when+we+sit+uncovered+at+the+receiving+of+it.+But+Didoclavius+%5Ba+pseudonym+for+the+Scottish+presbyterian%2C+David+Calderwood%5D+does+well+distinguish+betwixt+veneration+and+adoration+%28Altare+Damascenum%2C+1623%2C+p.+809%29%2C+because+in+civility+we+use%5Bd%5D+to+be+uncovered%2C+even+to+inferiors+and+equals+for+the+regard+which+we+bear+to+them%2C+yet+do+we+not+worship+them%2C+as+we+worship+the+king+on+our+knees.+As%2C+then%2C+in+civility+there+is+a+respect+and+reverence+different+from+adoration%2C+so+it+is+in+religion+also.+Yea+%5BCardinal+Robert%5D+Bellarmine+himself+%5Ba+papal+apologist%5D+distinguishes+the+reverence+which+is+due+to+holy+things+from+adoration.+Paybody+and+Dr.+Burgesse+%5BFormalists%5D+will+by+no+means+admit+this+distinction+betwixt+veneration+and+adoration.+But+since+neither+of+them+has+alleged+any+reason+against+it%2C+I+hope+they+will+be+weighed+down+by+the+authority+of+the+%5BRomanist%5D+Archbishop+of+Spalato+%5Bd.+1624%5D%2C+and+the+bishop+of+Edinburgh+%5BDavid+Lindsay%5D%2C+both+of+which+agree+to+this+distinction.+So%2C+then%2C+we+give+no+adoration+at+all+to+the+sacrament%2C+because+neither+by+any+outward+nor+inward+action+do+we+perform+any+worship+for+the+honor+of+the+same.+Burgesse+himself+has+noted+to+us+that+the+first+Nicene+Council+exhorts+that+men+should+not+be+humiliter+intenti+%5Bbasely+stretched+out%5D+to+the+things+before+them.+We+neither+submit+our+minds+nor+humble+our+bodies+to+the+sacrament%2C+yet+do+we+render+to+it+veneration%2C+for+as+much+as+we+esteem+highly+of+it+as+a+most+holy+thing%2C+and+meddle+reverently+with+it%2C+without+all+contempt+or+unworthy+usage.+Res+profecto+inanimatae+%5BSurely+inanimate+things%5D%2C+says+the+Archbishop+of+Spalato%2C+sint+sacrae+quantum+placet%2C+alium+honorem+a+nobis+non+merentur%2C+nisi+in+sensu+negativo+%5Bmay+be+sacred+so+far+as+it+may+be+fitting%2C+not+being+deserving+of+another+honor+from+us+except+in+a+negative+sense%5D%2C+as+that+they+be+not+contemned%2C+nor+unworthily+handled.+If+it+be+said+that+we+ought+not+to+contemn+the+Word%2C+yet+has+it+not+that+respect+given+to+it+which+the+Sacrament+has%2C+at+which+we+are+uncovered%2C+so+that+this+veneration+given+to+the+sacrament+must+be+somewhat+more+then+non+prophanatio+%5Ba+non-profanation%5D%3B+I+answer%3A+as+honor+in+the+positive+sense%2C+so+also+in+the+negative%2C+has+various+degrees%3A+and+according+to+the+more+or+less+immediate+manifestation+of+divine+ordinances+to+us%2C+so+ought+the+degrees+of+our+veneration+to+be+intended+or+remitted%3B+which+is+not+so+to+be+understood+as+if+one+part+of+God%E2%80%99s+sacred+worship+were+to+be+less+contemned+then+another+%28for+none+of+God%E2%80%99s+most+holy+ordinances+may+be+in+any+sort+contemned%29%2C+but+that+for+the+greater+regard+of+those+things+which+are+more+immediately+divine%2C+we+are+not+in+the+usage+of+them+to+take+to+ourselves+so+much+scope+and+liberty+as+otherwise+we+may+lawfully+allow+to+ourselves+in+meddling+with+such+things+as+are+not+merely%2C+but+mixedly+divine%2C+and+which+are+not+from+God+so+immediately+as+the+other%2C+but+more+by+the+intervention+of+means.+And+thus+a+higher+degree+of+veneration+is+due+to+the+sacrament+than+to+the+Word+preached%2C+not+by+taking+ought+from+the+Word%2C+but+by+adding+more+respect+to+the+sacrament+than+the+Word+has.+The+reason+hereof+is+given+to+be+this%2C+because+when+we+come+to+the+sacrament%2C+nihil+hic+humanum%2C+sed+Divina+omnia+%5Bnothing+of+this+is+of+man%2C+but+is+all+divine%5D%2C+for+Christ%E2%80%99s+own+Words+are%2C+or+at+least+should+be%2C+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are+by+Christ%E2%80%99s+own+institution+holy+symbols+of+his+blessed+body+and+blood.+Whereas+the+Word+preached+to+us+is+but+mixedly+and+mediately+divine%2C+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+God%2C+we+are+bidden+try+the+spirits+%5B1+Jn.+4%3A1%5D+and+are+required+after+the+example+of+the+Bereans+to+search+the+Scriptures+daily+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+like+sort+to+try+the+elements+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us+that+the+sacrament+given+according+to+Christ%E2%80%99s+institution+is+more+merely+and+immediately+divine+than+is+the+Word+preached.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+4%2C+%E2%80%98That+the+Ceremonies+are+Idols+among+Formalists+themselves%3B+%26+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+Idolatry%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53bee3b9e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53bee3b9e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=Those%20who%20speak%20out%20more%20plainly,divine%20than%20is%20the%20Word%20preached&amp;text=Those%20who%20speak%20out%20more%20plainly%20than%20bishop&amp;text=and%20immediately%20divine%20than%20is%20the%20Word%20preached" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></di <blockquote><p>Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship [WCF 1.6]; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections; the rending of the garments signified the rending of the heart by sorrow; standing with a religious suspect [respect] to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For ‘which of you’, says our Master, ‘having a servant ploughing, or feeding cattle, will say unto him by and by, when he is come from the field, Go and sit down to meat?’ (Lk. 17:7) All these signs have their significations from nature.</p></blockquote>

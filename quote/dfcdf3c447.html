<main class="wrap"><figure class="quote" id="q-dfcdf3c447" data-kw="">
<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Magistracy in an Exposition of the 82nd Psalm</cite>, pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-355b1f3f17" data-kw="">
<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>

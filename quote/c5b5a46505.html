<blockquote><p>The natural and kindly children of God, will have more sorrow at their heart for the sins of the land, than for the desolations thereof. What ever poverty, disgrace, pain, can befall their person, the very wrath of God, suppose the torments of hell, will not be so heavy so bitter so troublesome to them, as their sins, the cause of all these evils.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a9d17945f" data-kw="">
<blockquote><p>There was also a paper, entitled An information against Mr Renwick’s party, given in to ministers… the papers had been left by Alexander Gordon… There was nothing on the face of the ‘information’ paper to suggest that it had not been compiled by the Carrick men themselves, but the style and substance of it pointed directly to Robert Langlands… The Societies, it charged… had imposed restrictions on ministers and cast off the whole suffering ministry… they had made ‘canons’ laying down the qualifications of those fitted to be members of their meetings, forbidding association with those they regarded as unfaithful, even to the extent of servants joining in family worship with their masters, or children with their parents;¹ and, not least, they had ‘cast off most part of the societies in the shires of Ayr and Galloway, chiefly upon these two heads, that they would not disown and condemn the [civil] declaration published by Argyle, and because they were clear to call and hear faithful suffering ministers’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-36242d952b" data-kw="">
<blockquote><p>Union may also be consistent with many particular failings and defects in the exercise of government; and possibly the sparing of so corrupt officers and members, yea, the censuring of some unjustly, or the admission of some that are unfit for the ministry, and such like. These indeed are faults, but they are not such as make a Church to be no Church. And though these have sometimes been pretended to be the causes of schisms and divisions in the Church in practice, yet were they never defended to be just grounds of schisms and divisions, but were ever condemned by all councils and fathers, and cannot be in reason sustained. Sure there were such corrupt acts of all kinds among the Jews’ Church officers: Yet is it clear that Nicodemus and Joseph of Arimathea did continue to govern jointly notwithstanding thereof, who yet cannot be counted accessory to any of their deeds, because (which is a third reason) men in such cases have access, even when they are present, to discountenance such corrupt acts by not consenting thereto, and testifying against the same; yea, they may by so doing stand in the way of many wicked acts, which by dividing they cannot do, which is sufficient for their exoneration both before God and men: As we may see in the instances of Joseph and Nicodemus mentioned, who continued united in the government, kept the meetings even when sentences pass against those who will acknowledge Christ, and orders for persecuting Him and them. And yet they are declared free, because they dissented from, and testified against the same: Yea, their freedom and exoneration, by virtue of their dissent, being present, is more solemnly recorded to their honor in the Gospel, than if they had divided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

asquotes.github.io%2Fquote%2F36242d952b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36242d952b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=Union%20may%20also%20be%20consistent%20with,Gospel%2C%20than%20if%20they%20had%20divided&amp;text=Union%20may%20also%20be%20consistent%20with%20many%20particular&amp;text=in%20the%20Gospel%2C%20than%20if%20they%20had%20divided" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aab513d016" data-kw="">
<blockquote><p>But if we look to the Word of God, it will lead us further, that we be subject not only to the government of these princes which execute their office towards us well, and with such faithfulness as they ought, but also of all them who, by what mean soever it be, have the dominion in possession, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-6e938bb4fd" data-kw="">
<blockquote><p>To the older ministers, however, these events were a cause for dismay… Particular indignation was directed against Hamilton, who was widely regarded as an interloper and troublemaker. Typical was an outburst by Williamson, who inveighed against ‘laymen, ignorant, idle men’, who had ‘taken upon them to meddle in the matter of church government without a call’. The clerk to the Dunscore meeting happened to meet Hamilton in the street and told him that he ‘had been a black sight to that country’ and that he ‘had set all on a fire’. Hamilton, true to character, rejoined that he was ‘satisfied to hear of any such effect, for they stood much in need of fire to thaw their frozen spirits’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 126-27</span></figcaption>

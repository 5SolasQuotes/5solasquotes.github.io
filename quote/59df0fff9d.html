<main class="wrap"><figure class="quote" id="q-59df0fff9d" data-kw="">
<blockquote><p>Precisely because we are justified in Him – that is, in His justification – our justification is also final and irreversible. Indeed we can be so bold as to say that we are as fully justified before God as our Lord Jesus is. We are as finally justified as our Lord Jesus is. We are as irreversibly justified as our Lord Jesus is. The only justification we have – our only righteousness – is that of the Lord Jesus. We are justified with His justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sinclair-ferguson.html">Sinclair Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assured by God</cite>, p. 91</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a126a0d57e" data-kw="">
<blockquote><p>Christ was not ashamed of us at His incarnation. To be sure He had many reasons to be. For He, Himself, was the only begotten of the Father, of one essence and glory with God the Father and the Holy Spirit, yea, the brightness of the Father’s glory and the express image of His person — who thought it not robbery to be equal with God. And we were laden with guilt, unclean from the crown of our heads to the soles of our feet, and subject to corruption. But still He was not ashamed to call us brothers. He was ashamed of us neither before God nor before the Holy Angels. He accepted our flesh and blood, went in unto our nature became like unto us in everything, sin only excepted. And even God was not ashamed to be called our God in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sacrifice of Praise: Meditations before and after receiving access to the Table of the Lord</cite>, trans. John Dolfin (2nd edn, Grand Rapids MI: Louis Kregel, 1922), p. 113.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome.html">Rome</a></span></div>

</figure><figure class="quote" id="q-6cbda9b0bf" data-kw="">
<blockquote><p>We are confronted by two great public evils: one is the idolatry which is cherished and developed by the church of Rome in pursuance of its principle: brutalize the people and so rule them. The other is the atheism which grows strong on the hatred of the Roman church and clergy. Both are alike perilous, alike fatal. We must fight them both. Our duty, unless we are to perish, is to strive against them to the utmost of our energy.

There is no liberty in Romanism, for its principle is domination and subjection. There is none in atheism, for it denies God and the life to come; it leaves us with no faith except in ourselves, limited to earthly wants, with no motives but our passions and appetites, whose slaves we thus become. A short and easy step it is, from that point, to become the slaves of a Caesar.

Protestantism is our only escape from Romanism; it will be found to be our only escape from atheism. Deliver us from both, for they are our two worst enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-woolsey-bacon.html">Leonard Woolsey Bacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, God’s Wonderful Work in France: An Introduction of the Deputation from the Protestants of France to the American Churches</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

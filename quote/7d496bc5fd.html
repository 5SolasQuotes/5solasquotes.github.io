<blockquote><p>[T]here are here commended unto us widows, orphans, wards, poor men, strangers, sick and miserable people. And for that cause did the devout and good men of old bestow their goods liberally to the refreshing of old men, widows, fatherless children, and poor silly [weak] creatures. Those goods at this day are called church goods, or ecclesiastical contributions: which, undoubtedly, are very well bestowed, if they be laid out on them for whom they were given. In the emperor’s constitutions we may see that there were common houses and substance builded and appointed for all sorts of needy people: for there is mention made of houses for fatherless children, of hospitals for old men, of spittles for beggars, of places for sick men, and nurseries for children. Among us, at these days, there are hospitals and monasteries, very many whereof have several places appointed for orphans, old men, poor people, impotent creatures, sick persons, and infants. They therefore do commit an unappeasable offence, whosoever bestow to other uses the substance and places ordained for old and poor people, and lash out (they care not how prodigally) in riot and lustiness the alms bestowed upon poor silly [weak] souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 286.</span></figcaption>

<blockquote><p>Q. 29. But is it not more spiritual to make every day a sabbath?

A. It is most christian-like to obey Christ our King. Thus the same men pretend to make every meal a sacrament, that they may break the law of Christ, who instituted the sacrament. Satan’s way of drawing men from Christ’s laws, is sometimes by pretending to do more and better.

But to keep every day a sabbath, is to keep none. It is not lawful to cast off our outward labour all the six days: nor can mind or body bear it to do nothing but religious worship. These men mean no more but to follow their earthly business with a spiritual mind, and at some seasons of the day to worship God solemnly: and this is but what every good christian should do every day. But who knoweth not that the mind may, with far more advantage, attend God’s instructions, and be raised to him in holy worship, when all worldly diverting businesses are laid by, and the whole man employed towards God alone?

If men will regard, 1. The experience of their own souls; 2. And of all others in the world; they might soon be resolved how mischievous a thing the neglect of the Lord’s day is, and how necessary its holy observation. 1. That man never knew what it is to attend God’s worship seriously, and therein to receive his special blessing, who hath not found the great advantage of our separation from all common business, to attend holy work only on the Lord’s day. He that feeleth no miss or loss of it, sure never knew what communion with God is.

2. And servants would be left remediless under such masters, as would both oppress them with labour, and restrain them from God’s service. It is therefore the great mercy of the universal King to secure the liberties of the servants, and to bind all men to the means of their own felicity.

3. And common reason will tell us, that a law, obliging all men to spend one day of seven in learning God’s word, and offering him holy worship, must needs tend abundantly more to the increase of knowledge and holiness, than if all men were left to their own or to their rulers’ wills herein.

4. And common experience puts the matter of fact out of doubt, that where the Lord’s day is most conscionably spent in holy exercises, there knowledge, piety, charity, and all virtue, do most notably prosper; and where the sanctifying of the Lord’s day is neglected, ignorance, sensuality, and worldliness abound. Oh how many millions of souls hath grace converted, and comforted, and edified on the Lord’s days When men are obliged to hear, read, pray, and praise God, and to catechise their children and servants, as that which God requireth, is it not liker to be done, than if they be left to their own erroneous, backward, sluggish minds, or to the will of rulers perhaps worse than they?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 130 (emphasis added).</span></figcaption>

<blockquote><p>This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), pp. 77-78</span></figcaption>

<blockquote><p>Some promoters of singing hymns may differ with the [OPC] majority and minority reports, alleging that perhaps the phrase “singing of psalms” in the Westminster Confession of Faith may not mean that only psalms are to be employed in public worship. Some Presbyterians have argued that the term ‘psalms,’ being a lower case ‘p’ might refer to psalms and hymns. In the original 1648 edition of the Westminster Directory for the Publick Worship of God, the upper case ‘P’ in the term ‘Psalms’ was consistently used;¹ but regardless of which edition is used with consistent upper or lower case, it will make no difference to the true intent of the writers and signers of the Westminster Standards. The following Westminster documents consistently speak of singing psalms, with no mention of hymns: Westminster Confession of Faith (ch. XXI, sec. V), Westminster Form of Presbyterial Church Government (Of the Ordinances in a particular Congregation), and the Westminster Directory for the Publick Worship of God (Of the Sanctification of the Lord’s Day, Of Singing of Psalms). Acknowledging historic Presbyterian familiarity with the Synod of Dordrecht Church Order (1618-19) and the distinction made between psalms and hymns, in all fairness to legislative intent interpretation, the ‘psalms’ or ‘Psalms’ in the Westminster Standards must be biblical psalms of praise. ¹ The Westminster Standards, An Original Facsimile (Audubon, New Jersey: Old Paths Publications, 1997) In the later editions of the Westminster Standards, biblical psalms of praise, were commonly referred to as ‘psalms.’ In the reading of the Scriptures, in The Westminster Directory for the Publick Worship of God, it references exposition of the portion of Scripture read: “let it not be done until the whole chapter of psalm be ended” (Of Public Reading of the Holy Scriptures). Regarding public preaching, it speaks of some ‘text of scripture’; it further orders the use of “some chapter, a psalm, or book of the holy scripture” (Of the Preaching of the Word). In the Directory for the Publick Worship of God, there are parallel and coordinate directives to read or sing a ‘psalm,’ but no directive to sing a hymn. We find this same employment of the term ‘psalm’ or ‘psalms’ in the Authorised King James Version to refer to the Book of Psalms (see Luke 24:44). The London or Baptist Confession of Faith (1689) deliberately altered section V, of the chapter, Of Religious Worship and the Sabbath Day, to read “psalms, hymns, and spiritual songs.” The Baptists understood the legislative intent meaning of the Westminster Confession of Faith to be psalms only, as Ephesians 5:19 and Colossians 3:16 are used as proof-texts for the “singing of psalms with grace in the heart” (West. Con. ch. XXI, sec. V). The Baptists, therefore, decidedly rejected the historic Westminster Presbyterian interpretation of Ephesians 5:19 and Colossians 3:16. The 17th century Westminster Presbyterians interpreted, “psalms, hymns, and spiritual songs” (Eph. 5:19; Col. 3:16) to the Book of Psalms.</p></blockquote>

<blockquote><p>And concerning particulars, their [the Jews] Sabbath the Church hath changed into our Lord’s day, that is, as the one did continually bring to mind the former World finished by Creation; so the other might keep us in perpetual remembrance of a far better World, begun by him which came to restore all things, to make both Heaven and Earth new. For which cause they honored the last day, we the first, in every seven, throughout the year, …

The Moral Law requiring therefore a seventh part throughout the age of the whole World, to be that way employed, although with us the day be changed, in regard of a new Revolution begun by our Saviour Christ; yet the same proportion of time continueth which was before, because in reference to the benefit of Creation, and now much more of Renovation thereunto added by him which was Prince of the World to come; we are bound to accompt [account] the Sanctification of one day in seven, a duty which God’s Immutable Law doth exact for ever.</p></blockquote>

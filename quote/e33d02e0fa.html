<main class="wrap"><figure class="quote" id="q-e33d02e0fa" data-kw="">
<blockquote><p>For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 398-99</span></figcaption>

.%2013%3A9&amp;text=For%20God%20properly%20intends%20no%20end%20of%20his&amp;text=your%20destruction%20is%20out%20of%20yourself%2C%20Hos.%2013%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-403f6adf5c" data-kw="">
<blockquote><p>Q. 145. Has God such a will in Him, as He calls a conditional will? as for example, to will all men’s salvation if they repent? Answer: Properly there cannot be a conditional will in God: First, because such a will supposes a superior that may hinder, Acts 18:21. Secondly, it supposes ignorance how things may fall out, as Abraham willed his servant to fetch a wife for Isaac out of the land of his kindred, Gen. 24:4, if she were willing, verse 8. Nevertheless, improperly it may be given to God, not as though his will can have a condition, for that’s the property of a created will, to have a condition of it, Jam. 4:15, but because the thing willed of God may have a condition, Isa. 7:9. Now, that the Lord may be said to have a conditional will in some sense is plain: First, because He is said to will the connection of things when He does not will the things asunder; and therefore He wills them only upon the condition of a connection: God would have all men to repent and come to the knowledge of the truth, 1 Tim. 2:4. Secondly, because He is said to will the salvation of all believers and true penitent persons, and therefore if a reprobate do believe, He wills his salvation, 1 Kn. 11:38. This is true of God towards a reprobate: “If thou wilt obey Me, I will bless thee,” Dt. 7:12-13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Man’s Directory</cite>, … (London: T.F., 1648), Of Catechizing, Of Thoughts, pp. 108-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-8d315da5fe" data-kw="">
<blockquote><p>Wherefore he teaches that God in these threatnings and promises does not always reveal his hidden and unchangeable will, whereby He has most firmly decreed what He will do: but only his will, which they call the antecedent will, or the will of the sign, that is of admonition: for that their present estate requires that. But Paul in this place and the prophet in the beginning of the chapter entreat of that will and power of God whereby He by most good right both makes, and makes n•w all things as pleases Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans... (London: Daye, 1568), ch. 9, p. 273</span></figcaption>

<blockquote><p>The former will [of command] is called by the [Medieval] Scholastics, on the authority, it is thought, of Hugh of St. Victor, voluntas signi, whether because it is signified by some sign, like a word, precept, interdict, etc.; or because it signifies God’s will as the effect and adjunct of it…</p></blockquote>

</figure><figure class="quote" id="q-840df9d4d5" data-kw="">
<blockquote><p>It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God’s Serious &amp; Unfeigned Ardency of Desire that we do what is our Duty’ from Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London 1647), pp. 443-45 (irregular pagination: colophon lll2-lll3) &amp;, pp. 440-42 (colophon: Kkk4-Lll1)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.”

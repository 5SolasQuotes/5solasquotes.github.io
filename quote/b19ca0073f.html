<main class="wrap"><figure class="quote" id="q-b19ca0073f" data-kw="">
<blockquote><p>Christ was incarnate in the Womb of the Virgin, and thereby was personally united to our flesh; which is the highest advancement of the human nature, that can be conceived, Heb. 2.16. For verily he took not upon him the nature of Angels, but the seed of Abraham; Christ assumed man’s nature, being God from all Eternity; he took on him the one, to the other; and so made of those two natures, one person: by this we have a kind of Union with Jesus Christ, ver. 11. He which Sanctifieth, and they which are Sanctified, are both of one, i.e. of one God, say some; the Son of God, and Saints are all of one God the Father: others understand it of Adam; Christ as concerning the flesh, and all the sanctified, are of one common root and Father, though, by a different generation.

But [of one] here is to be referred principally to the nature, whereof both the sanctifier and sanctified are partakers, i.e. they are of the same blood and kindred, of the same mould &amp; constitution, of the same human nature. This is a near and an honourable Conjunction; for by this means Jesus Christ is become our Immanuel, God with us, bone of our bone, and flesh of our flesh: but yet this Conjunction is common to all, sanctified and unsanctified, prophane and holy; and verily it will be found an high aggravation of sin in the great day, that sinners should dare to profane and prostitute that nature to sinful purposes, which the Son of God hath sanctified by so wonderful an assumption of it into one and the same personality with the divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mount Pisgah, or, A prospect of heaven being an exposition on the fourth chapter of the first epistle of St. Paul to the Thessalonians, from the 13th verse, to the end of the chapter, divided into three parts</cite>, (London: Dorman Newman, 1670), pp 26-27.</span></figcaption>

</figure><figure class="quote" id="q-36a5af1684" data-kw="">
<blockquote><p>And here we must consider, that the Divine Nature did not assume an human Person, but the divine Person did assume an human Nature: and that of the three Divine Persons, it was neither the first nor the third that did assume this Nature; but it was the middle Person, who was to be the middle one, that must undertake this mediation betwixt God and us. which was otherwise also most requisite, as well for the better preservation of the integrity of the blessed Trinity in the Godhead, as for the higher advancement of Man-kind by means of that relation which the second Person the Mediator did bear unto his Father.

For if the fullness of the Godhead should have thus dwelt in any human person, there should then a fourth Person necessarily have been added unto the Godhead. And if any of the three Persons, beside the second, had been borne of a Woman; there should have been two Sons in the Trinity: whereas now the Son of God and the Son of the blessed Virgin, being but one Person, is consequently but one Son; and so no alteration at all made in the relations of the Persons of the Trinity.</p></blockquote>

<blockquote><p>It is written (Ps. 16:10): “Nor wilt Thou suffer Thy holy one to see corruption”: and [John the] Damascene (De Fide Orth. iii) expounds this of the corruption which comes of dissolving into elements…. …It was not fitting for Christ’s body to putrefy, or in any way be reduced to dust… Christ’s death ought not to come from weakness of nature, lest it might not be believed to be voluntary: and therefore He willed to die, not from sickness, but from suffering inflicted on Him, to which He gave Himself up willingly.</p></blockquote>

</figure><figure class="quote" id="q-82d60b4913" data-kw="">
<blockquote><p>That God did spiritually and mystically represent unto Moses the incarnation and mediation of Christ, with the church of the elect which was to be gathered thereby, and its spiritual worship. And moreover, he let him know how the tabernacle and all that belonged thereunto, did represent him and them. For the tabernacle that Moses made was a sign and figure of the body of Christ. This we have proved in the exposition of the second verse of this chapter; and it is positively affirmed by the apostle, Col. 2:17. For therein would God dwell really and substantially: Col. 2:9, “In him dwelleth all the fulness of the Godhead bodily.” And the tabernacle was but to represent this inhabitation of God in Christ. Therefore did he dwell therein typically by sundry pledges of his presence, that he might represent the real substantial inhabitation of the Godhead in the body or human nature of Christ. This, therefore, was the ἀρχέτυπος, whereunto the tabernacle was to be framed; and this was that which was showed unto Moses on the top of the mount. These were the “heavenly things,” which they served unto the resemblance and shadow of. It is therefore most probable, and most agreeable unto the mystery of the wisdom of God in these things, that, before the building of the tabernacle below, God did show unto Moses what was to be signified and represented thereby, and what he would introduce when that was to be taken away. He first showed “the true tabernacle,” then appointed a figure of it, which was to abide and serve the worship of the church, until that true one was to be introduced, when this was to be taken down and removed out of the way: which is the substance of what the apostle designeth to prove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 46–47.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“That God did spiritually and mystically represent unto Moses the incarnation and mediation of Christ, with the church of the elect which was to be gathered thereby, and its spiritual worship. And moreover, he let him know how the tabernacle and all that belonged thereunto, did represent him and them. For the tabernacle that Moses made was a sign and figure of the body of Christ. This we have proved in the exposition of the second verse of this chapter; and it is positively affirmed by the apostle, Col. 2:17. For therein would God dwell really and substantially: Col. 2:9, “In him dwelleth all the fulness of the Godhead bodily.” And the tabernacle was but to represent this inhabitation of God in Christ. Therefore did he dwell therein typically by sundry pledges of his presence, that he might represent the real substantial inhabitation of the Godhead in the body or human nature of Christ. This, therefore, was the ἀρχέτυπος, whereunto the tabernacle was to be framed; and this was that which was showed unto Moses on the top of the mount. These were the “heavenly things,” which they served unto the resemblance and shadow of. It is therefore most probable, and most agreeable unto the mystery of the wisdom of God in these things, that, before the building of the tabernacle below, God did show unto Moses what was to be signified and represented thereby, and what he would introduce when that was to be taken away. He first showed “the true tabernacle,” then appointed a figure of it, which was to abide and serve the worship of the church, until that true one was to be introduced, when this was to be taken down and removed out of the way: which is the substance of what the apostle designeth to prove.”

— John Owen, An Exposition of the Epistle to the Hebrews, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 46–47.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+God+did+spiritually+and+mystically+represent+unto+Moses+the+incarnation+and+mediation+of+Christ%2C+with+the+church+of+the+elect+which+was+to+be+gathered+thereby%2C+and+its+spiritual+worship.+And+moreover%2C+he+let+him+know+how+the+tabernacle+and+all+that+belonged+thereunto%2C+did+represent+him+and+them.+For+the+tabernacle+that+Moses+made+was+a+sign+and+figure+of+the+body+of+Christ.+This+we+have+proved+in+the+exposition+of+the+second+verse+of+this+chapter%3B+and+it+is+positively+affirmed+by+the+apostle%2C+Col.+2%3A17.+For+therein+would+God+dwell+really+and+substantially%3A+Col.+2%3A9%2C+%E2%80%9CIn+him+dwelleth+all+the+fulness+of+the+Godhead+bodily.%E2%80%9D+And+the+tabernacle+was+but+to+represent+this+inhabitation+of+God+in+Christ.+Therefore+did+he+dwell+therein+typically+by+sundry+pledges+of+his+presence%2C+that+he+might+represent+the+real+substantial+inhabitation+of+the+Godhead+in+the+body+or+human+nature+of+Christ.+This%2C+therefore%2C+was+the+%E1%BC%80%CF%81%CF%87%CE%AD%CF%84%CF%85%CF%80%CE%BF%CF%82%2C+whereunto+the+tabernacle+was+to+be+framed%3B+and+this+was+that+which+was+showed+unto+Moses+on+the+top+of+the+mount.+These+were+the+%E2%80%9Cheavenly+things%2C%E2%80%9D+which+they+served+unto+the+resemblance+and+shadow+of.+It+is+therefore+most+probable%2C+and+most+agreeable+unto+the+mystery+of+the+wisdom+of+God+in+these+things%2C+that%2C+before+the+building+of+the+tabernacle+below%2C+God+did+show+unto+Moses+what+was+to+be+signified+and+represented+thereby%2C+and+what+he+would+introduce+when+that+was+to+be+taken+away.+He+first+showed+%E2%80%9Cthe+true+tabernacle%2C%E2%80%9D+then+appointed+a+figure+of+it%2C+which+was+to+abide+and+serve+the+worship+of+the+church%2C+until+that+true+one+was+to+be+introduced%2C+when+this+was+to+be+taken+down+and+removed+out+of+the+way%3A+which+is+the+substance+of+what+the+apostle+designeth+to+prove.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+ed.+W.+H.+Goold%2C+vol.+23%2C+Works+of+John+Owen+%28Edinburgh%3A+Johnstone+and+Hunter%2C+1854%29%2C+46%E2%80%9347.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F82d60b4913.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/82d60b4913.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/owen-god-revealed-to-moses-the-incarnation-and-mediation-of-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

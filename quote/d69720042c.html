<blockquote><p>For when I saw that the Covenant of works did in justice reward according to works, as well with life upon condition of obedience, as with death in case of disobedience; I began to conceive, that as the purpose of election was suitable to the Covenant of grace; so suitable unto a Covenant of works, must be a purpose of retribution. For how shall God covenant to retribute or recompense with life or death according to works, if he have no purpose at all of such retribution?

How shall the Covenant of works promise life upon condition of obedience, if the purpose of reprobation have absolutely determined death upon all them within that Covenant, without all respect of good or evil, obedience or disobedience in any of them?

[T]he grace of redemption offering the death of Christ, and reaching forth some fruits thereof unto all, as the promising and offering sufficient help to bring them to the knowledge of God and means of grace: yea, and sometime bestowing on them the participation of some excellent and common graces, doth not make a third covenant, partly of grace, partly of works, but bindeth such so much the more to keep the Covenants of works, by how much the more helps and means God vouchsafeth them to keep it. It is not the helps of grace offered or given, that includeth men with in any part of the Covenant of grace, but the condition whereupon it is offered or given.

Secondly, if God offer grace and give, though never so small, even as a grain of Mustard-seed, and promise to uphold it freely for Christ his sake, and not according to our works, it is a Covenant of Grace. But if he offer and give never so many gracious helps, and means, and gifts, and uphold them according to the works of the creature; it is still a Covenant of works, as it was to the Angels that fell, and to Adam, though he gave to both of them the whole Image of God, and besides, heaven it self to the one, a Paradise to the other, it is but the same covenant of works which God made with the world of mankind after the fall, and with Adam before the fall: though Adam received greater means and helps to keep it, then his posterity had after the fall.</p></blockquote>

<blockquote><p>God’s covenant, is his contract with man, concerning the obtaining of life eternal, upon a certain condition. This covenant consists of two parts: God’s promise to man, Man’s promise to God. God’s promise to man, is that, whereby he binds himself to man to be his God, if he perform the condition. Man’s promise to God, is that, whereby he vows his allegiance unto his Lord, and to perform the condition between them. Again, there are two kinds of this covenant. The covenant of works, and the covenant of grace. Jer. 31:31, 32, 33. “Behold the days come, says the Lord, that I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant, I made with their fathers, when I took them by the hand to bring them out of the land of Egypt; the which my covenant they brake, although I was an husband to them, saith the Lord. But this shall be the covenant, that I will make with the house of Israel: after those days, says the Lord, I will put my law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people.” The covenant of works, is Gods covenant, made with condition of perfect obedience, and is expressed in the moral law. The Moral Law, is that part of God’s word, which commands perfect obedience unto man, as well in his nature, as in his actions, and forbids the contrary. Romans 10. 5. “Moses thus describes the righteousness which is of the law, that the man which doth these things, shall live thereby.” 1. Timothy 1. 5. “The end of the commandment, is love out of a pure heart, and of a good conscience, and faith unfeigned.” Luke 16. 27. “You shalt love the Lord your God, with all your heart, with all your soul, and with all your strength.” Rom. 7. 14. “We know that the law is spiritual.” The Law has two parts. The Edict, commanding obedience, and the condition binding to obedience. The condition is eternal life to such as fulfill the law, but to transgressors, everlasting death. The Decalogue, or ten commandments, is an abridgement of the whole law, and the covenant of works. Exod. 34:27. And the Lord said unto Moses, Write these words, for after the tenor of these words, I have made a covenant with thee, and with Israel. And be was there with the Lord forty days and forty nights, and did neither eat bread, nor drink water, and he wrote in the tables the words of the covenant, even the ten commandments. 1. King. 8. 9. Nothing was in the Ark, save the two tables of stone, which Moses had put there at Horeb, where the Lord made a covenant with the children of Israel, when he brought them out of the land of Egypt. Mat. 22:40. “On these two commandments hangs the whole law and the prophets.</p></blockquote>

<blockquote><p>The Father, according to his eternal covenant with the Son as last Adam, sent him, in order that he might bear their griefs, and carry their sorrows; and so might, at the infinite expense of his unparalleled anguish, agony, and death, purchase for them, the comfort which they, in the first Adam, had forfeited.

He sent his only, his dear Son, to endure the pains of eternal death for them, that they might enjoy, in union with Him, the comfort of eternal life; … The Father hath also exalted him, in the human nature, to universal dominion; on purpose that, he might dispense the comfort of salvation, to all who should believe in him.</p></blockquote>

<blockquote><p>1. He from all eternity decreed the creation of man after his own image, and the making of the covenant of works with him, in time. All things brought forth in time, lay from eternity in the womb of God’s decree; in virtue whereof they have their being in time: for which cause the decree is said to bring forth, as a woman doth a child, Zeph. ii. 2. And the creation of angels and men, with the providence about them, made many lines in the volume of the sealed book of the decrees.

God self-sufficient needed neither man nor angel: but, for the manifestation of his own glory, he purposed from eternity to create them; and moreover, to enter into such a covenant with man, as one should therein represent the whole family; sovereign pleasure meanwhile taking another method with the angelic tribe: but withal purposing to give both the one and the other a sufficient ability to stand in their integrity, if they would. Thus, from eternity, the covenant of works, in all the parts and appurtenances thereof, was before the eternal mind; though being made with a mere man, it could not actually be entered into, till once man was created. But, “Known unto God are all his works from the beginning of the world,” Acts xv. 18.

2. He decreed also from eternity, to permit the first man, the representative of the whole family, to fall, and so to break the covenant, and involve himself, and all his posterity in ruins. It is evident from the spotless holiness of God, and the nature of the thing, that the divine permission was not the cause of man’s fall; and from the necessary dependence of the creature upon the Creator, that without it, he could not have fallen. But the sovereign Lord of the creatures, permitted the fall of man for his own holy ends, purposing to bring about good from it.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. He from all eternity decreed the creation of man after his own image, and the making of the covenant of works with him, in time. All things brought forth in time, lay from eternity in the womb of God’s decree; in virtue whereof they have their being in time: for which cause the decree is said to bring forth, as a woman doth a child, Zeph. ii. 2. And the creation of angels and men, with the providence about them, made many lines in the volume of the sealed book of the decrees.

God self-sufficient needed neither man nor angel: but, for the manifestation of his own glory, he purposed from eternity to create them; and moreover, to enter into such a covenant with man, as one should therein represent the whole family; sovereign pleasure meanwhile taking another method with the angelic tribe: but withal purposing to give both the one and the other a sufficient ability to stand in their integrity, if they would. Thus, from eternity, the covenant of works, in all the parts and appurtenances thereof, was before the eternal mind; though being made with a mere man, it could not actually be entered into, till once man was created. But, “Known unto God are all his works from the beginning of the world,” Acts xv. 18.

2. He decreed also from eternity, to permit the first man, the representative of the whole family, to fall, and so to break the covenant, and involve himself, and all his posterity in ruins. It is evident from the spotless holiness of God, and the nature of the thing, that the divine permission was not the cause of man’s fall; and from the necessary dependence of the creature upon the Creator, that without it, he could not have fallen. But the sovereign Lord of the creatures, permitted the fall of man for his own holy ends, purposing to bring about good from it.”

— Thomas Boston, A View of the Covenant of Grace, from the Sacred Records, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 386-87.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+He+from+all+eternity+decreed+the+creation+of+man+after+his+own+image%2C+and+the+making+of+the+covenant+of+works+with+him%2C+in+time.+All+things+brought+forth+in+time%2C+lay+from+eternity+in+the+womb+of+God%E2%80%99s+decree%3B+in+virtue+whereof+they+have+their+being+in+time%3A+for+which+cause+the+decree+is+said+to+bring+forth%2C+as+a+woman+doth+a+child%2C+Zeph.+ii.+2.+And+the+creation+of+angels+and+men%2C+with+the+providence+about+them%2C+made+many+lines+in+the+volume+of+the+sealed+book+of+the+decrees.%0A%0AGod+self-sufficient+needed+neither+man+nor+angel%3A+but%2C+for+the+manifestation+of+his+own+glory%2C+he+purposed+from+eternity+to+create+them%3B+and+moreover%2C+to+enter+into+such+a+covenant+with+man%2C+as+one+should+therein+represent+the+whole+family%3B+sovereign+pleasure+meanwhile+taking+another+method+with+the+angelic+tribe%3A+but+withal+purposing+to+give+both+the+one+and+the+other+a+sufficient+ability+to+stand+in+their+integrity%2C+if+they+would.+Thus%2C+from+eternity%2C+the+covenant+of+works%2C+in+all+the+parts+and+appurtenances+thereof%2C+was+before+the+eternal+mind%3B+though+being+made+with+a+mere+man%2C+it+could+not+actually+be+entered+into%2C+till+once+man+was+created.+But%2C+%E2%80%9CKnown+unto+God+are+all+his+works+from+the+beginning+of+the+world%2C%E2%80%9D+Acts+xv.+18.%0A%0A2.+He+decreed+also+from+eternity%2C+to+permit+the+first+man%2C+the+representative+of+the+whole+family%2C+to+fall%2C+and+so+to+break+the+covenant%2C+and+involve+himself%2C+and+all+his+posterity+in+ruins.+It+is+evident+from+the+spotless+holiness+of+God%2C+and+the+nature+of+the+thing%2C+that+the+divine+permission+was+not+the+cause+of+man%E2%80%99s+fall%3B+and+from+the+necessary+dependence+of+the+creature+upon+the+Creator%2C+that+without+it%2C+he+could+not+have+fallen.+But+the+sovereign+Lord+of+the+creatures%2C+permitted+the+fall+of+man+for+his+own+holy+ends%2C+purposing+to+bring+about+good+from+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+A+View+of+the+Covenant+of+Grace%2C+from+the+Sacred+Records%2C+%281734%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+viii%2C+386-87.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faeaf25ae84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/aeaf25ae84.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/24/thomas-boston-on-the-covenant-of-works-and-the-divine-decree/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The condition of the covenant, the terms of that life, agreed to by the representative, is implied in that he was the last Adam, namely, to go through with what the first Adam had stuck in. Adam, in the covenant of works, stumbled in the course of his obedience, and fell; and by his fall was quite disabled to begin it anew: he thereby came under the penalty of that covenant also, but was utterly unable to discharge it.

So the last Adam comes in the room of the first, not as the first Adam stood in his integrity; for in that case there was no place for a second Adam; but as he lay a broken man under the first bargain. Arid coming in his room in this case, his business was to satisfy the demands of the first covenant, in behalf of his seed. These demands were now run up high, quite beyond what they were to innocent Adam: the penalty was become payable, as well as the principal sum. Wherefore the first covenant being ingrossed in the second, is declared broken; and the principal and penalty being summed up together, the clearing of the whole is laid upon the last or second Adam, as the condition of the second covenant.</p></blockquote>

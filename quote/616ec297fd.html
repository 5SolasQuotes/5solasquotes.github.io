<main class="wrap"><figure class="quote" id="q-616ec297fd" data-kw="">
<blockquote><p>Although the service which secular authorities owe to the community does not consist in preaching the divine Word and Law, yet civil officials must govern according to the Word of God and, in the measure of their power, help the success of the divine Word. For as there is no power? which is not from God, and everywhere the present powers are established by Him (Romans 13:1), it certainly follows that this power must be exercised according to the order and will of God.

Only so will this power at last procure the real welfare of its subjects and thus stimulate them to recognize, praise, and glorify God as the Lord of all lords and the King of all kings. But the citizens are not governed for their good and for the true glory of the supreme King when the secular authorities do not rule according to the divine Law and are not set to observe it themselves. For where God is not recognized and obedience to Him is not required before all things, there peace is not peace, justice is not justice, and that which should be profitable brings injury instead.

God therefore forbade the people of Israel to get from foreign people a king who would not be a brother, and commanded the people to accept as king him whom the Lord would elect from their brethren. The king was to write God’s Law and to read it all the days of his life so that he might learn to fear God his Lord, to keep His word and the injunctions of the Law, neither to raise his heart in pride above his brethren nor to deviate either to the right or to the left (Deuteronomy 17:15-20).

If a man, therefore, is to govern beneficially and not to be a tyrant, it is necessary that he be elected by God and from among the people of God. That is to say, he must be a true believer who has not himself stepped forward for the office but has been called to it. The Christian official, recognizing himself as undershepherd of sheep which are not his own but God’s, thinks to govern them not as it seems good to him but according to the Law of God to whom the sheep belong. Consequently a civil officer should day by day govern and treat the people of God according to the divine Law. In great humility and constant awe, he stands before God in order to avoid the least mistake in executing such a great commission.

This Solomon observed. He asked God to give him a teachable heart before all things, so that he might judge his people and know the difference between good and evil (I Kings 3:9). In this prayer he professes that he had been placed above God’s people and not above a people belonging to Solomon himself (I Kings 3:8), to judge it, to lead it to good, and to keep it from evil. He also confesses that human reason has not the power of distinguishing between evil and the true good, of judging rightly, but needs to learn such things from God. Thus enlightened, we can well recognize the heavy divine plague with which God has plagued us and which comes from the fact that we call ourselves Christians and consider ourselves the people of God, and yet our officials who have the power have fallen into the error of believing that the divine Law does not concern them, that they must judge and make regulations more according to the pagan imperial law and other human sentences than according to the sentence of God.

In this they show themselves bailiffs of men and not of God, since they govern their subjects according to the sentences of men and not according to the divine pronouncement. Now, anywhere a man whose law is observed is recognized as lord. No one on earth would consider as belonging to the German emperor a city which would direct all its affairs and regime according to the commands and prohibitions of the French king, and completely ignore the imperial law. Consequently, we cannot pride ourselves on being communities of God and the people of God, if we respect, accept, and keep all sorts of laws, ordinances, and regulations other than God’s. Only His Law can make us live.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03cd2ecd5d" data-kw="">
<blockquote><p>But the question hath been, and is yet at this day, in controversy, whether it be lawful for a magistrate to punish any man in his jurisdiction for the contempt of religion or blaspheming of the same? The Manichees and Donatists were of opinion that no man ought to be compelled, much less to be killed, for any religion; but that every man ought to be left to his own mind and judgment. And yet the scripture doth expressly command the magistrate not to spare false prophets; yea, rebels against God are commanded by holy laws and judges to be killed without mercy.

The places are extant to be seen in the holy scriptures; the one in the thirteenth of Deuteronomy, the other in the seventeenth of the same book. In Exodus this same is set down for a rule: “Whosoever sacrificeth to any God, but to the Lord alone, let him be rooted out. [Exodus 22:20]” In Leviticus, the blasphemer is slain and overwhelmed with stones [Leviticus 24:10-16]. In the book of Numbers, the man is slain that did unhallow the sabbath-day [Numbers 15:32-6].

And how many, I pray you, did God’s revenging sword destroy of that calvish people that did erect and worship the calf in the wilderness [Exodus 32]? Helias at mount Carmel killed whole hundreds of false prophets in a solemn set and appointed sacrifice [1 Kings 18]. Eliseus, at the Lord’s commandment, anointed Jehu king, to the end that he might root out the house of Achab, and kill at once all Baal’s priests [2 Kings 9]. Joiada the priest slew Athalia [2 Kings 11], and good king Josias destroyed together the wicked and stubborn priests of all high places [2 Kings 23:20]. St Augustine, Tractatu in Joan. 11, disputing against the Donatists, doth prove by the example of Nabuchodonozor, that Christian princes do justly punish the Donatists for despising Christ and his evangelical doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly and Learned Sermons Divided into the Five Decades Containing the Chief and Principal Points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 357-58.</span></figcaption>

<blockquote><p>The question which you have put seems to me to do honour to chastity, and to demand a kind reply. Chastity, in respect of which I see that the majority of men are ill-disposed, and that their laws are unequal and irregular. For what was the reason why they restrained the woman, but indulged the man, and that a woman who practises evil against her husband’s bed is an adulteress, and the penalties of the law for this are very severe; but if the husband commits fornication against his wife, he has no account to give? I do not accept this legislation; I do not approve this custom.

They who made the Law were men, and therefore their legislation is hard on women, since they have placed children also under the authority of their fathers, while leaving the weaker sex uncared for. God doth not so; but saith Honour thy father and thy mother, which is the first commandment with promise; that it may be well with thee; and, He that curseth father or mother, let him die the death. Similarly He gave honour to good and punishment to evil. And, The blessing of a father strengtheneth the houses of children, but the curse of a mother uprooteth the foundations.

See the equality of the legislation. There is one Maker of man and woman; one debt is owed by children to both their parents. … How then dost thou demand Chastity, while thou dost not thyself observe it? How dost thou demand that which thou dost not give? How, though thou art equally a body, dost thou legislate unequally?</p></blockquote>

<blockquote><p>50. Unto the external things of the Church belongs not only the correction of heretics and other troublers of the Church, but also that civil order and way of convocating and calling together synods, which is proper to the Magistrate; for the Magistrate ought by his authority and power both to establish the rights and liberties of synods assembling together at times appointed by the known and received law, and to indict and gather together synods occasionally as often as the necessity of the Church shall require the same; Not that all or any power to consult or determine of ecclesiastic or spiritual matters does flow or spring from the Magistrate as Head of the Church under Christ; but because in those things pertaining to the outward man, the Church needs the Magistrate’s aid and support.

51. So that the Magistrate calls together synods [as teaches WCF 31.2], not as touching those things which are proper to [ecclesiastical] synods; but in respect of the things which are common to synods with other meetings and civil public assemblies, that is, not as they are assemblies in the name of Christ, to treat of matters spiritual, but as they are public assemblies within his territories; for to the end that public conventions may be kept in any territory, the licence of the lord of that place ought to be desired. In synods therefore a respect of order, as well civil as ecclesiastical is to be had; And because of this civil order, outward defense, better accommodation, together with safe access and recess, the consent and commandment of him who is appointed to take care of, and defend human order, does intervene. … He [the magistrate] takes care also for maintaining the ministers and schools, and supplies the temporal necessities of God’s servants, by his command assembles synods, when there is need of them; and summons, calls out, and draws to trial the unwilling, which without the Magistrates strength and authority cannot be done, as has been already said; he makes synods also safe and secure, and in a civil way presides or moderates in them (if it so seem good to him), either by himself or by a substitute commissioner. In all which the power of the magistrate though occupied about spiritual things, is not for all that spiritual but civil.</p></blockquote>

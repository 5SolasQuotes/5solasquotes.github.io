<main class="wrap"><figure class="quote" id="q-4caaa5bee8" data-kw="" data-pol="">
<blockquote><p>So far then as the Council proveth the determination and commandment that it giveth by the plain word of God, so soon do we reverence and embrace the same. But if men, under the name of a Council, pretend to forge unto us new articles of our faith, or to make constitutions repugnant to the word of God, then utterly we must refuse the same, as the doctrine of devils, which draweth our souls from the voice of our only God, to follow the doctrine and constitutions of men.</p></blockquote>
<figcaption>— <a href="../authors/scottish-reformers.html">Scottish Reformers</a>, <cite>The Scots Confession</cite>, 1560, Art. 20</figcaption>
<div class="meta"><a class="tag" href="../topics/scripture/authority.html">Authority</a><a class="tag" href="../topics/scripture/scripture-vs-tradition.html">Scripture vs. Tradition</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a></div>

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="" data-pol="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Answer before the Diet of Worms</cite>, 18 April 1521</figcaption>

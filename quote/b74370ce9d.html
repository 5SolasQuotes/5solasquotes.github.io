<blockquote><p>For six is no number of rest; witness the six days of creation, the six days of our weekly labor, and the six ages of the world. But seven is for rest; witness the sabbatical days, the sabbatical years, and that eternal sabbath in the heaven of heavens when the six ages of the world shall be ended.</p></blockquote>

<blockquote><p>‘The first day’ Here the error of those is manifestly refuted who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God Himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis (1554 / 1563), on ch. 1, verse 5 Latin</cite></span></figcaption>

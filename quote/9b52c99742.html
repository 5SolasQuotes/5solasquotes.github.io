<main class="wrap"><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Samuel Rutherford on the Divine Origin of Possibility’ being ch. 8 in</cite>, ed. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology 1560-1775, pp. 142-3, 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-92ef00dce0" data-kw="">
<blockquote><p>…we must deal with four preliminary issues: first, whether there is contingency in things; second, given that there is, we need to determine the first cause of contingency; third, we must show how the primary basis of contingency can be found in God; and fourth, we need to clarify certain propositions that arise in this discussion.</p></blockquote>

<blockquote><p>5. In what sense is this inability absolute, and in what sense natural, and in what sense moral? … 4th. It is not natural in another sense, because it does not result in the least from any constitutional deficiency in human nature as it now exists as to its rational and moral faculties of soul. 5th. This inability is purely moral, because while every responsible man possess all moral as well as intellectual faculties requisite for right action, the moral state of his faculties is such that right action is impossible. Its essence is in the inability of the soul to know, love, or choose spiritual good, and its ground exists in that moral corruption of soul whereby it is blind, insensible, and totally averse to all that is spiritually good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, 1860, expanded 1879, reprinted 1979, Zondervan, pp. 340-41.</span></figcaption>

</figure><figure class="quote" id="q-918d957cbd" data-kw="">
<blockquote><p>2. Consider upon what terms you may have this God for your God… You give more for your bread, your clothes, your house, for the needful comforts that are for the support of your frail body, than you need give for the great, glorious, incomprehensible, incomparable God. You pay money for them, but you may have Him without money and without price. One would think that the equity of the condition should both amaze you and allure you. Consider, I say, God does not require of you things impossible to you; He does not say, If you will remove mountains, dry up oceans, stop the course of nature, create worlds, I will then be yours, as great as I am; He does not say, If you will satisfy my justice, answer the demands of my law, merit my love and favor, then I will be your God. No; He Himself has done all this for you by the death of his Son; all He desires is, that you would accept Him in his Son for your God. Nay, He does not require of you anything that is barbarous or cruel, as the heathen deities did, by the devil, of their worshippers. He does not say, If you will lance and mangle your bodies, as Baal’s priests did; if you will go barefoot in sackcloth long and tedious pilgrimages, as the papists do; if you will offer your children in the fire, and give the fruit of your bodies for the sins of your souls, as some did, then I will be your God. Again, He does not require of you things that are chargeable, to offer the best and chief of your flock daily in the sacrifice to Him; nor, as He once did of the young man, to sell all that you have, and give it to the poor; nor, as idolators, to lay down such a part of your estate for your portion; but He only requires that you would take the Lord for your God; and will you not do it? Can you deny Him and your poor soul so reasonable, so equitable a request? As the servant said to Nama, ‘If the prophet had commanded you some great thing, would not you have done it? how much more then when He only says, Wash, and be clean?’ So say I to you; if God had commanded the greatest things imaginable, would you not to your power have done them, that you might enjoy the blessed God for your eternal portion? how much more then when He only says, ‘Thou shalt have no other God before me’? O reader, do but observe that first command, which contains the sum both of your duty and felicity, and you are made, you are a blessed man for ever. Take the true God in Jesus Christ for your God, prize Him as your God, love Him as your God, honor Him as your God, and obey Him as your God, and He will be your God forever. Do but as much for the true God as the covetous man does for his wealth, which is his god, as the intemperate man for his belly, which is his god; they give their highest esteem, their choicest affections, and their greatest service to that which they take for their god. And surely the true God is more worthy hereof, and will requite you best for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Incomparableness of God, in his Works</cite>, (Banner of Truth), 4:493-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

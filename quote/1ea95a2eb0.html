<main class="wrap"><figure class="quote" id="q-1ea95a2eb0" data-kw="">
<blockquote><p>If some are more discreet and judicious in managing these [i.e., husbandry] or any other affairs than others are, God must be acknowledged in it… As to the other instance of the husbandman’s conduct in threshing his corn, it is said, ‘This also comes forth from the Lord of hosts,’ Isa. 28:29. Even the plainest dictate of sense and reason must be acknowledged to come forth from the Lord of hosts. And, if it is from Him that men do things wisely and discreetly, we must needs acknowledge Him to be ‘wise in counsel and excellent in working.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 28:26-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27a9e0c727" data-kw="">
<blockquote><p>As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.”

</figure><figure class="quote" id="q-8eab3242bd" data-kw="">
<blockquote><p>Therefore, let this remain as a most sure maxim, that no doctrine is worthy to be believed but that which we find to be grounded in the Scriptures. The Pope will have all that received without any more ado, whatsoever he doth blunder out at his pleasure; but shall he be preferred before Paul, concerning whose preaching it was lawful for the disciples to make inquisition?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 17:11</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Therefore, let this remain as a most sure maxim, that no doctrine is worthy to be believed but that which we find to be grounded in the Scriptures. The Pope will have all that received without any more ado, whatsoever he doth blunder out at his pleasure; but shall he be preferred before Paul, concerning whose preaching it was lawful for the disciples to make inquisition?”

</figure><figure class="quote" id="q-bcfdac0940" data-kw="">
<blockquote><p>I adore the plenitude of the scriptures, in which I find the whole that I seek. … In these words there are two things to be considered: the first is, that the scripture is full and perfect, which appears from the words, &quot;I adore the plenitude of the scriptures.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question VI, on the perfection of Scripture (citing Tertullian, Against Hermogenes)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/the-fathers.html">The fathers</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-157f170654" data-kw="">
<blockquote><p>1st Distinction. The Word of God being given to man as a moral agent, is a rule of all his moral actions, but not of actions of art, sciences, disciplines, yea, or of mere nature. … 6. What is warranted by natural reason, is warranted by Scripture, for the Law of nature is but a part of Scripture. 7. Actions are either purely moral, or purely not-moral, or mixed of both: The first has warrant in Scripture, the second none at all, the third requires not a warrant of Scripture every way concludent, but only in so far as they be moral. 8. Matters of mere fact, known by sense and human testimony, are to be considered according to their physical existence, if they be done or not done; if Titus did such a thing or not, such are not in that notion to be proved by Scripture: 2. They may be considered according to their essence and moral quality of good and lawful, bad or unlawful, and so they are to be warranted by Scripture. … * * * 5. Matters of fact are not, and need not be proved by Scripture: 1. Because sense makes them known to us. 2. Their morality is sufficiently known from God’s Word. 3. In matters of fact there may be invincible ignorance: Christ’s resurrection is not a matter of fact, as Hugo Grotius says, but also a matter of Law, as all the miracles and histories in the Word, and to be believed, because God has so spoken in the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 1, question 2, pp. 101-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

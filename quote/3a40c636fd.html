<main class="wrap"><figure class="quote" id="q-3a40c636fd" data-kw="">
<blockquote><p>This comforting joy of the Lord’s Supper must not be considered as something external or physical, but rather, as something internal and spiritual (Ps. 4:8; Luke 1:47; Ps. 22:27).

This joy essentially consists of these three components:

1. It consists of a clearer and more distinct apprehension of the magnitude and preciousness of the suffering of Jesus Christ. This is set before us in the Lord’s Supper not merely as is done and taught through the Word, nor is this embraced as being true by faith only. Rather, it is set before us as something that is seen, tasted, and felt through the administration of tangible and visible signs, and thus by taking, breaking, giving, pouring, eating, and drinking, etc., of the bread and wine.

2. It consists in a greater and more certain peace of heart proceeding from and by way of an assured fellowship with the all-sufficient merits of Jesus Christ. In the Lord’s Supper, by way of various ceremonial actions, all of this is displayed much more visibly and clearly, and it is bound upon the soul in a very personal way.

3. It consists of a fuller peace and inner satisfaction and of a determination to obey in return this perfectly obedient Christ, and if necessary to die, be broken, etc., for Him who died such a death, was broken, and whom one has eaten by faith (2 Cor. 5:15).

All of these matters are to be found in a spiritual Christian prior to his partaking of the Lord’s Supper. However, in the Lord’s Supper he experiences this in a more lively and experiential manner. It is the latter that constitutes his spiritual joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), pp 19-20.</span></figcaption>

<blockquote><p>In this sacramental blessing, however, a twofold relation (schesis) must be attended to: the first to God, the second to the symbols themselves. To God, that thanks may be given to him for the wonderful blessing of the whole work of redemption because he sent Christ into the world and delivered him to death and because he gives him to us for vivifying food. To the symbols, that a blessing may be obtained upon the creatures spread before us (and soon to be extended to believers) in virtue of which they (otherwise of themselves incapable of it) may be rendered efficacious to the spiritual use and benefit of the recipients. Thus in this blessing is contained both the giving of thanks for blessings already received and a supplication for the consecration of the symbols. This is rightly referred to the symbols, not immediately, but because faith excited towards God (the author of sanctification) brings back from him the power of use to the celebration of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.23</span></figcaption>

<blockquote><p>Q. Doth this consecration change the bread and wine into the body and blood of Christ?

A. No: but they still continue in nature and substance bread and wine still, and are but only types and seals of Christ’s body and blood.

Q. But doth not our Saviour say of the bread, This is my body; and of the wine, This is my blood?

A. Though he do; yet it thence no more followeth, that the bread is his very real body, and the wine his blood, then that he is a material door, or vine, because he saith, I am the door, I am the vine.

Q. How is our Saviour then to be understood?

A. To speak by an usual figure, where the name of the thing signified, is given to the sign. After the same manner that in the old Testament, Circumcision is called the Covenant, and the Lamb, the Passover, because they were signs of those things.

Q. What special reasons have you against the change of these elements into the very body and blood of Christ, commonly called Transubstantiation?

A. First, then at the first institution, there must needs be two Christs, one that giveth, another that is given.

Secondly, If the bread be the very body of Christ, &amp;c. then there is no true and proportionable sign to represent the thing signified, and consequently no Sacrament.

Thirdly, the same individual body must then of necessity be in more places then one at once, which is not only against the nature of a true human body, but of a body in general also.

Fourthly, the Apostles, and Evangelists call it bread and wine after the consecration. 1. Cor. 10. 16. 26. 27. 28. Matth. 26. 29.

Fifthly, if there were any such change, it were the greatest miracle in the world, but all other miracles are such, as have been apparent to sense.

Sixthly, then the wicked as well as the godly, should receive Christ Jesus and his quickening spirit, which is never separated from him. Yea (which is horrible to consider) mice and rats may eat the true body of Christ, and drink his blood.

Q. But it is not likely, that at this time, and in this place, our Saviour would use a figurative speech, and speak obscurely, whereas he might have spoken plainly?

A. First, it is plain, that at the same time he used as figurative a speech as this. Secondly, in this institution also we must of necessity acknowledge, that he useth a figure when he saith, that the cup is the new Testament. Thirdly, there is often more light and plainness in a figure, then in a proper speech.

Q. But what may be noted out of this form of speech?

A. The near and sure conjunction of the sign, with the thing signified, which it hath in them that shall receive it worthily; in so much as they which partake of the one, receive the other also.

Q. Then it seems, that though upon the consecration, the bread and wine be not changed into the real body and blood of Christ, that yet they are present, in, with, or under the bread and wine?

A. Not corporally, substantially, or locally; for then, first, the body of Christ should be every where; which doth as much destroy the nature of a human body, as to be in many places at once. Secondly, then as in transubstantiation, the body and blood of Christ should not be a spiritual food of the soul, but bodily, such as the wicked eat of as well as the godly. Thirdly, then also (as in transubstantiation) Christ should be eaten as the Capernaites fancied, really, &amp; with the body, which our Saviour denieth. Fourthly, it should not then be true, which is said, Act. 3. 21. That the heavens shall contain him, till the time that all things be restored. Fifthly, it is the nature of that faith by which we lay hold on, and receive Christ, to seek him, and behold him, in heaven, and to feed upon him there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 227-29.</span></figcaption>

the+time+that+all+things+be+restored.+Fifthly%2C+it+is+the+nature+of+that+faith+by+which+we+lay+hold+on%2C+and+receive+Christ%2C+to+seek+him%2C+and+behold+him%2C+in+heaven%2C+and+to+feed+upon+him+there.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+treatise+of+Christian+religion.+Or%2C+the+whole+body+and+substance+of+divinity%2C+%282nd+edn%2C+London%3A+Thomas+Man%2C+1616%29%2C+pp+227-29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F61173222ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/61173222ae.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/11/thomas-cartwright-on-transubstantiation-and-consubstantiation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Mrs Dougal, Sarah Jane Kelly, and Jospeh Hall being present as candidates for membership are examined.

The examinations was sustained as regards Mrs Dougal &amp; Joseph Hall but Sarah Jane Kelly being found somewhat deficient in scriptural knowledge and not having read our Testimony nor the covenants her admission was deferred for the present that she may read these standards &amp; otherwise. […]

John Wark being present as a candidate for admission to membership is examined at considerable length and being found rather deficient in knowledge in some respects his admission is deferred and he is recommended to read the Testimony and the covenants, neither of which he has read, and to persevere in his search after further information in religious subjects. And it is hoped that before our next communion the session will see the way clear to admit him. […]</p></blockquote>

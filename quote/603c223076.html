<main class="wrap"><figure class="quote" id="q-603c223076" data-kw="">
<blockquote><p>And so, you have in that one verse 18 of chapter 1 these three things: First, man is not justified by works; second, man is condemned by works, which is the reason of the former; third, all the works of all men are wicked and unrighteous, which again is the reason of the nearest former statement. For the sense of that verse is, as if to say, indeed, in regard to justification by works, it is so far absent from the case that man is justified by them, so that on the contrary he is condemned by them, for they are all wicked and unrighteous</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians, trans. Casey Carmichael, Classic Reformed Theology Series vol. 5 (Reformation Heritage Books, 2021), 8.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“And so, you have in that one verse 18 of chapter 1 these three things: First, man is not justified by works; second, man is condemned by works, which is the reason of the former; third, all the works of all men are wicked and unrighteous, which again is the reason of the nearest former statement. For the sense of that verse is, as if to say, indeed, in regard to justification by works, it is so far absent from the case that man is justified by them, so that on the contrary he is condemned by them, for they are all wicked and unrighteous”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4031d11fec" data-kw="">
<blockquote><p>3. But the word [‘to justify’] is used with that specialized meaning when it concerns the judgment of God as He absolves the sinner who stands before his judgment seat (Ps. 143:2; Rom. 5:16 and 8:33-34). And so this entire act of justification is depicted as a forensic process. Yet we still grant that justification sometimes appears also to include sanctification as its consequence because of the very strong, close connection between the two (Rom. 8:30; Titus 3:7, etc.).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0e7142fc0f" data-kw="">
<blockquote><p>The very condescending of the second person, who natively and essentially is so great, to assume man’s nature, although in this form of God described, invested with all that manifestative glory spoken of, and this from and upon the first moment of his assuming it; if this act of assuming had been done and undertaken principally in order and with intention to satisfy God, by bringing in a new glory to him, greater than that which he lost by him, and this without the least humbling of himself; I ask, why might not this in just reason have been accounted satisfaction?

For (1.) he had thereby lessened himself to give glory to God. For in that assumption, and in that communication of himself to a creature, he takes on him such relations as do in some respects abate of the height of his native personal glory, as he is considered merely as second person; and in respect to this assumption, he is made less than what before he was. For now it may be said of him, as it was by himself, that ‘his Father is greater than he,’ John xiv. 28, whereas he might have kept himself in a foil equality to him in all respects for ever, and to have had no such diminishing respect affixed to him.

And (2.) by this voluntary act alone he had brought in unto God a new and further revelation of the Godhead than ever was obscured by sin; and it is certain that he had never assumed man’s nature, and thus lessened himself, but that so he might manifest the glory of the Godhead in such a manner as otherwise it never should have been. Therefore for him thus to lessen himself, to the end to manifest and exalt the glory of the Godhead the utmost way it could be, or more than otherwise it should have been, might not this make amends for the glory that sin would take from God?

And the reason of this is, that satisfaction being a return of as much glory as was lost, and that by this means (if no other were added) more manifestative glory would come in unto God than either was or ever could have been debased or impaired by sin, why therefore might it not have been accounted satisfactory, if it had been ordered simply unto this end? And further also, even this would have served to fill up many of those disproportions found in the evil of sin.

For as the evil of Adam’s sin (which was the first sin) lay in this, that he who was a creature affected and aspired to be as God — He is become as one of us, said God, Gen. iii. 22 — so Christ’s obedience, in assuming our nature, would herein have answered it, that he that is God becomes a creature, and on the other side is become as one of us men; so to bring in a new honour unto God. So that, look how high our nature would have ascended, so low doth he descend; and as sin is a turning from God to the creature, so in this act the Creator descends from the height of his glory to become a creature, and join himself in a nearer union with us than wherein we in sinning affected to join ourselves to the Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christ the Mediator</cite>, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 109.</span></figcaption>

<blockquote><p>64. Is universal doubt necessary in order to knowledge and sound conviction of natural theology, as some have taught? Ans. No; it is useless, impossible, sinful, and dangerous.

65. Wherein useless? Ans. Doubt gives no light, removes no bias of mind or affections, and does not dispose the mind to a thorough investigation.

66. Why or wherein impossible? Ans. We cannot at plea sure remove all convictions.

67. How is it sinful? Ans. It rejects the love, fear, reverence, obedience, and worship, due to God, for the time, and trifles with light and evidences already received.

68. How is it dangerous? Ans. It trifles with light and conviction, refuses duty for the time, and God may judicially harden and blind us; Isa. vi. 9, 10; xliv. 18, 19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), p. 23.</span></figcaption>

<blockquote><p>As the authority of the Law and the priesthood is the same, Christ became not only a priest, but also a Lawgiver; so that the right of Aaron, as well as of Moses, was transferred to him. The sum of the whole is, that the ministry of Moses was no less temporary than that of Aaron; and hence both were annulled by the coming of Christ, for the one could not stand without the other. By the word Law, we understand what peculiarly belonged to Moses; for the Law contains the rule of life, and the gratuitous covenant of life; and in it we find everywhere many remarkable sentences by which we are instructed as to faith, and as to the fear of God. None of these were abolished by Christ, but only that part which regarded the ancient priesthood.

For Christ is here compared with Moses; whatever then they had in common, is not to be taken to the account, but only the things in which they differ. They in common offer God’s mercy to us, prescribe the rule of a holy and godly life, teach us the true worship of God, and exhort us to exercise faith and patience, and all the duties of godliness. But Moses was different from Christ in this respect, that while the love of the Gospel was not as yet made known, he kept the people under veils, set forth the knowledge of Christ by types and shadows, and, in short, accommodated himself to the capacity of ignorant people, and did not rise higher than to puerile elements. We must then remember, that the Law is that part of the ministration which Moses had as peculiarly his own, and different from that of Christ. That law, as it was subordinate to the ancient priesthood, was abolished when the priesthood was abolished. And Christ, being made a priest, was invested also with the authority of a legislator, that he might be the teacher and interpreter of the new covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p. 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, p. 167.</span></figcaption>

<blockquote><p>These afternoon services must not be neglected or left out for the reason (which might be offered as an excuse in some villages) that the attendance is low – even if the pastors should be forced at first to preach before a very small audience, to the point indeed of preaching to no one but their own families. If the pastors give an example with their own families, and consistently encourage others to do likewise, in particular those committed to the Reformed faith, there can be no doubt but that, in the course of time, many will end up coming to these sermons regularly.

However, to prevent the people from being drawn away from these afternoon sermons by their involvement in other labours or worldly activities on Sunday afternoons, the government authorities are to be asked to enact strict legislation against all menial and everyday kinds of activity, and in particular against games, drinking parties and other violations of the holiness of the Sabbath, which are the regular Sunday afternoon pastimes especially in the villages. By such measures, too, the people may be more effectively induced to come to these afternoon sermons, and in this way to keep the Sabbath day holy in its entirety.

However, since the combinations of churches or shared pastorates (common in the rural areas in the provinces), do not allow a single pastor to have two sermons in one village every Sunday, efforts must be made in every classis to do away with such combinations if at all possible, so that each church may have its own pastor. But if this proves impossible, then those pastors who serve two churches simultaneously must do their utmost to have afternoon catechism sermons at least every other Sunday.</p></blockquote>

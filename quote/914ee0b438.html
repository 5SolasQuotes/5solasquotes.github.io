<blockquote><p>It should be remembered that Rutherford’s ‘The Due Right of Prebyteries’ (1644) itself was his critical review of both Mather’s ‘Church Government and Church Covenant Discussed’ (1643) and Cotton’s ‘The Way Of The Churches Of Christ In New-England’, whose manuscript was widely circulated in England even a few years before its publication in 1645.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>** The Way of the Churches of Christ in New England in Brotherly Equality and Independency, or Coordination without Subjection of One Church to Another</cite>, (London, 1645) 125 pp. | Sang Ahn, Covenant in Conflict, p. 61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94c6016077" data-kw="">
<blockquote><p>In England it [civilly] belongs: 1. to the patron to present; 2. to the bishop to ordain and institute, and therefore to approve and invest; 3. to the people jure divino to be free consenters; 4. and to the magistrate to protect and to judge who shall be protected or tolerated under him. If now these four parties be for four ministers or for three, or two several men, and cannot agree in one, the culpable dissenters will be the causes of the schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>…in such cases, where two parts of a Church are divided, having independent authorities as to one another, and there being contrary determinations in the same question, it seems convenient and necessary for peace, that either both should waive their decisions, or that both should permit the decisions of each other to stand and be in force, to such only as should acquiesce therein, and willingly acknowledge the same.</p></blockquote>

</figure><figure class="quote" id="q-327ff82937" data-kw="">
<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that… 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word going before or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>

<blockquote><p>Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-mather.html">Richard Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechisme, or the Grounds &amp; Principles of Christian Religion</cite>, … (1650), ch. 32, ‘Of the life that beievers ought to live in the world, and of the Law of God’, pp. 114-16 Mather was a congregationalist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

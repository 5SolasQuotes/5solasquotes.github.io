<main class="wrap"><figure class="quote" id="q-ec975dbf30" data-kw="Councils Authority of councils Sola Scriptura">
<blockquote><p>What, then, you will say, is there no authority in the definitions of councils? Yes, indeed; for I do not contend that all councils are to be condemned, and all their acts rescinded, or, as it is said, made one complete erasure. But you are bringing them all (it will be said) under subordination, and so leaving every one at liberty to receive or reject the decrees of councils as he pleases. By no means; but whenever the decree of a council is produced, the first thing I would wish to be done is, to examine at what time it was held, on what occasion, with what intention, and who were present at it; next I would bring the subject discussed to the standard of Scripture. … In this way, councils would be duly respected, and yet the highest place would be given to Scripture, everything being brought to it as a test.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>

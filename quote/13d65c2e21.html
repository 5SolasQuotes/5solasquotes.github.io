<main class="wrap"><figure class="quote" id="q-13d65c2e21" data-kw="">
<blockquote><p>1. Because we are justified by the object of faith alone, that is by the merits of Christ only, without which we can have no righteousness whatever: for we are justified for Christ’s sake. Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit. All works are excluded from, our justification, yea even faith itself in as far as it is a virtue, or work. 2. Because the act which belongs properly to faith is to apprehend, and apply to itself the righteousness of Christ; indeed, faith is nothing else than the acceptance itself, or the apprehension of the merits of Christ. 3. Because faith alone is the instrument which apprehends the satisfaction of Christ. Hence it is plain, why the exclusive particle only should be added, as it is in the Catechism, and be maintained against the Papist. It is done, 3.1. For the purpose of expressing what Paul affirms when he says: “We are justified freely by his grace, without the deeds of the laws:” And what Christ says; “only believe.” (Rom. 4:24, 28. Mark. 5:36.) 3.2. That all our own works, and merits, as well as those of others, may be excluded as being the cause of our justification, that faith may be understood correlatively. We are justified by faith only, that is, by the merits of Christ alone. 3.3. That not only all our merits, but that even faith itself may be excluded from that which is received by faith; so that when we say, we are justified by faith only, the sense is, that it is not by meriting, but only by receiving; as when it is said, This beggar is enriched only by receiving alms, all works and merits are excluded there from, yea, even the very acceptance of alms, in as far as it is viewed as a merit. It is for this reason, that Paul always says, that we are justified by faith, and through faith, as by an instrument; and never on account of faith, as the Papists will have it, who indeed admit both forms of expression, as if faith might be the application of Christ’s righteousness, and be also at the same time a certain work, or merit, by which we are counted worthy of being declared righteous, which is directly opposed to the very nature of faith. For if we were justified on account of our faith, then faith would no longer be the acceptance of the righteousness of another, but it would be the merit, and cause of our own righteousness; neither would it receive the satisfaction of another, for it would no longer stand in need of it. 3.4. That we may understand the necessity of faith for our justification, and may know that we are justified, not by the merit of faith, but yet just as little without faith, to receive the righteousness of Christ; because it is the province of faith to appropriate this to itself. 3.5. The orthodox Fathers often use the same form of speech, by faith only. Origen writes: “The Apostles say, that the justification OF FAITH ONLY is sufficient, so that if any one ONLY BELIEVES, he may be justified, even though he does not perform any works.” Ambrose says: “They are justified freely, who, with out working or rendering any thing in turn, are justified BY FAITH ONLY as the gift of God.” Again; “How can the Jews suppose that they are justified by the works of the law, seeing they have the justification of Abraham set before them, who was justified, not by the works of the law, but BY FAITH ONLY. The law, therefore, is not necessary, when the sinner is justified before God by FAITH ONLY.” And again. “God has decreed that he who believes in Christ, should be saved without works, receiving the remission of sins freely BY FAITH ONLY.” We are therefore justified by faith only, which means that it is by the merits of Christ alone, apprehended by faith. This we must firmly maintain, and believe: 3.5.1. For the glory of God, that so the sacrifice of Christ may not be impaired. 3.5.2. For our consolation, that we may be assured that our righteousness does not depend upon our works, (for if this were the case we should lose it thousands of times,) but upon the sacrifice and merit of Christ alone.</p></blockquote>

<blockquote><p>A fifth argument is that which so much sounds in all books: If good works be the effect and fruit of our justification, then they cannot be conditions, or causa sine qua non [a cause without which: nothing] of our justification. The consequence is clear, because such a supposed condition, or causa sine qua non, must be antecedent, and going before. Now the Orthodox bring Augustine’s known position, which also may be made good out of Scripture, Bona opera non praecedunt justificandum, sed sequuntur justificatum [‘Good works do not precede being justified, but follow having been justified’]; and another to that sense is quoted out of Gregory: Non per opera venitur ad fidem, sed per fidem ad opera [‘not through works is one come to faith, but through faith to works’], faith must go before works. Till we are justified, we are not able to do anything that is good… Seeing therefore that justification is antecedent to a holy life, good works cannot be any condition of it; and by this we may see that more things are required to our salvation than to our justification; to the possession of heaven and [versus] the entitling us thereunto. For justification does entitle and interest us in that eternal inheritance which is performed by faith; but to be made actual partakers of everlasting happiness, good works are the way to that Kingdom, not the cause of it. Therefore none contend more then the Orthodox writers for the necessity of good works, and that in respect of salvation; yet in respect of our justification, then the Scripture calls them a menstruous rag and such as are utterly unworthy. It’s true that justification cannot be continued in a man unless he continue in good works, yet for all that they are not conditions of his justification: they are qualifications and determinations of the subject who is justified, but no conditions of his justification. As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God. Its a thousand times affirmed by our divines, many things are required to the constitution of some subject, which yet are not either causes or conditions of such and such an effect: Light is necessarily required and dryness as qualities in fire, yet it burns as it’s hot, not as light or dry. To the integral being of a man are required his head and shoulders, so that the eye could not see if not seated there; yet a man’s shoulders are not the causa sine qua non of his seeing. Many things are necessarily conjoined together, and yet one is not the condition of the others’ effect. So that this doctrine does not exclude, but [does] command holy works, only it gives faith and works their proper place.</p></blockquote>

<blockquote><p>What is it that they betake themselves unto, what is it that they plead with God for the continuance of the pardon of their sins, and the acceptance of their persons before him? Is it any thing but sovereign grace and mercy, through the blood of Christ?</p></blockquote>

</figure><figure class="quote" id="q-5a609e0188" data-kw="">
<blockquote><p>I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024)</cite>, pp. 219-20 ff.</span></figcaption>

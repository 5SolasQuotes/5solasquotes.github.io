<main class="wrap"><figure class="quote" id="q-b17f48408f" data-kw="">
<blockquote><p>For if there were no God, no republic, no society in the world would be safe. Without virtue, without religion, nothing can be safe. If there were no God, there would be neither virtue nor religion. What would the world be but a mere den of robbers in which license would be each one’s law, no such thing as right or wrong, no right of government, no necessity of obedience – the most abandoned, the superior and the most powerful, the master? No check would be placed upon the oppression of rulers and the rebellion of subjects. Each one would follow the bent of his own inclination. Again, if there were no God, no mortals would even for a moment be safe or secure from violence, fraud, perjury, slaughter of blood. Every hour everything would have to be feared. Take away the barriers of divinity and what would become of the confidence and innocence? What licence or violence would not be witnessed? As to human edicts (besides the fact that they cannot change the mind for the better, but on the contrary make it artful and intent upon all the arts of deception), what place would there be for human laws, if (the sense of deity being removed) the conscience would shake off all relations of justice and injustice?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 176.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>2. The first [way in which a man may be guilty of scandal] is, when a man does something before another man, which is in itself evil, unlawful and sinful, in which case, neither the intention of him that does it, nor the event, as to him that sees it done, is of any consideration; For it matters not whether the doer had an intention to draw the other into sin thereby, or not: neither does it matter whether the other were thereby induced to commit sin or not: the matter or substance of the action being evil, and done before others, is sufficient to render the doer guilty of having given scandal, though he had neither any intention himself so to do, nor were any person actually scandalized thereby; because whatsoever is in itself, and in its own nature evil, is also of itself and in its own nature scandalous and of evil example. Thus did Hophni and Phineas, the sons of Eli, give scandal by their wretched profaneness and greediness about the sacrifices of the Lord, and their vile and shameless abusing the women, 1 Sam. 2:17,22. And so did David also give great scandal in the matter of Uriah, 2 Sam. 12:14. Here the rule is, Do nothing that is evil, for fear of giving scandal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Case 4, ‘of Scandal’ in Nine Cases of Conscience Occasionally Determined</cite>, pp. 76-77 of Case 4, ‘of Scandal’ in Nine Cases of Conscience Occasionally Determined (London, 1678)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>9th Assertion…. 1. As the object of that high [civil] office is merely and purely civil and positive, relating only to a civil end, of peace: as in importing or exporting of goods, of wool, wax, moneys for the good of the commonwealth, the crying up or crying down of the value of coined gold or silver, the making of laws merely civil; as not to carry armor in the night [which is threatening] in such a city: so in war, commanders, captains and colonels are magistrates to order the battle, lay stratagems… the parliaments’ power in disposing of fowling, fishing, hunting, eating of flesh, or not eating at such a time: all these, as the Word of God does not particularly warrant the one side more than the other, are merely civil and positive. It is sure the magistrate has a supremacy, and an independency above the Church or ministers of the Gospel in all these; and as these prescind [are detached] from all morality of the First and Second Table [in that they are not inherently moral or immoral of themselves]… In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the [civil] rulers have a supremacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), pp. 558-59</span></figcaption>

<blockquote><p>3. Magistrates as magistrates hold forth in their Law abstinence from these sins [of adultery, incest, murder, etc.], not as the ambassadors of Christ, craving subjection of conscience and divine faith to those charges, but only external obedience: For though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience, nor is he in Christ’s stead to lay divine bands on the conscience to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order and as the Creator, and Founder, and another of human societies and of peace, to exact external obedience and to lay bands on your hands, not to shed innocent blood, and on your body not to defile it with adultery or incest, nor to violate the chastity of your brother; Hence it is evident that the adversaries are far out who would have ministers who do hold forth commands that lay hold on the conscience and crave faith and soul-submission under the pain of eternal wrath, to do and act as the deputies and vicars of those who have nothing to do with the conscience [such as prelates who simultaneously held civil offices], and have neither office nor authority to crave soul submission or to threaten or inflict any punishment but such as is circumscribed within the limits of time and which the body of clay is capable of; yea, when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>

<blockquote><p>Mr. [Thomas] Hooker [an Independent]: ‘They [Christian persons] may, as Christians, maintain private communion one with another; and as they be Churches, use that Christian privilege to further their own good, and promote the work by counsel: for what I do qua ethicus, qua oeconomicus, qua Christianus [as an ethical person, as a domestic person, as a Christian] in private, appertains not to the Magistrate, except it entrench upon his policy.’ [Rutherford’s] Answer: 1. Mr. Hooker makes all that Christians do as Christians and as Churches, that is, gathering of Churches, hearing, partaking of seals and censures, to be private actings not belonging to the Magistrate. Strange it is that the convening of the ten thousand subjects in the same place (as our [congregationalist] Brethren say) belongs nothing to the Magistrate; [yet] sure it sides with peace or war. And yet Mr. Hooker saith, ‘The Magistrate may compel men to attend the mind of Christ, and solemnly to humble themselves by fasting and prayer.’ See how these two consist. … Mr. Hooker: ‘Commission and just permission are all one: A Ruler permits a Finder to set up a school, he needs no commission.’ Answer: If fencing be useful, the Ruler must give him positive protection, as others that do well; else if one kill him when he teaches his scholars, the Ruler ought not to revenge that murder, though most treacherously committed, and say he promised to the Fencer only permission; and yet it’s worse to say [that] the Christian Ruler owes to assemblies, pastors, schools only permission. Paul saith, he owes praise, Rom. 13:3, which, with good ground, famous interpreters expound to be countenancing, favor, protection, reward, stipends. And if the Christian magistrate do but permit assemblies to convene, as a very episcopal man, D. Bilson said, permissio est à magistratu, commissio à Christo [‘Permission is from the magistrate, a commission from Christ’]: What more influence (if permission and commission be all one) hath the godly magistrate in the public worship of God, and assemblies of the Church, than heathen magistrates, Ahasuerus, the Kings of Chaldea, who permitted the people of God to worship the true God, Esth. 4:16-17; Dan. 6:7-8, or the Church of Rome have, who by public order establish stews [whore-houses] and permit fornication? See Emmanuel Sa, who says, bishops and priests are by law permitted to have whores.</p></blockquote>

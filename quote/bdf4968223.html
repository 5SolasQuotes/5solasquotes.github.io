<main class="wrap"><figure class="quote" id="q-bdf4968223" data-kw="">
<blockquote><p>And to speak briefely, this worshipping of God, which is to serve in spirit, is reduced unto four principal points: which are adoration, trust, invocation, and giving of thanks. Adoration is an humble and religious submission, whereby we utterly submit ourselves unto God, and that in all things. Trust is whereby we rest in Him, considering the power, wisdom and high goodness wherewith He is adorned: For which things we cleave unto Him; neither do we think that He will forsake or frustrate us. Invocation is: whereby we fly unto God, in all perils, and adversities: as which know that He is everywhere at hand, and that, according to his promises, He both can and will succor us with his defence. Giving of thanks is, whereby we refer all good things unto Him, as unto the first author… But spiritual worshipping consists altogether of faith and charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries… upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 1, verse 9, pp. 7 &amp; 9</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c59836fcd" data-kw="">
<blockquote><p>Men, under the pretense of curing the defects and shortcomings, the nakedness and bareness, attaching to ecclesiastical arrangements as set before us in the New Testament, have been constantly proposing innovations and improvements in government and worship. The question is, How ought these proposals to have been received? Our answer is, There is a great general scriptural principle which shuts them all out. We refuse even to enter into the consideration of what is alleged in support of them. It is enough for us that they have no positive sanction from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation (Edinburgh, Scotland: Banner of Truth, 1989 reprint)</cite>, p. 36</span></figcaption>

</figure><figure class="quote" id="q-c832054943" data-kw="">
<blockquote><p>For the receiving of the sacrament being a mediate worship of God, wherein the elements come between God and us, in such sort that they belong to the substance of the worship (for without the elements, the sacrament is not a sacrament)… for as much as in the act of receiving, both our minds, and our external senses are and should be fastened upon them… For in every mediate worship, wherein some creature is purposely set between God and us to have state in the same, it is idolatry to kneel before such a creature, whiles both our minds and senses are fastened upon it.</p></blockquote>

</figure><figure class="quote" id="q-bb50f85b0d" data-kw="">
<blockquote><p>Doctrine 9. Godliness is the chief and most necessary of all virtues. By godliness we mean true religion towards God, and a mind wholly given to the true worship of God. Reason 1. Because it has the noblest object, that is, God Himself. 2. Because it does most of all perfect all other virtues, while it refers them and all their acts to a divine beginning and a divine end. For godliness subjects the mind to God in all things, so that it acknowledges God to be the author of all good, from whom every good and perfect gift comes, and makes Him the chiefest good and the last end to whom all our actions are to be directed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Analytical Exposition of both the Epistles of the Apostle Peter… (London: Rothwell), on 2 Pet. 1:5-7</cite>, p. 151</span></figcaption>

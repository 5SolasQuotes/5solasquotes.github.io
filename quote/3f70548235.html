<main class="wrap"><figure class="quote" id="q-3f70548235" data-kw="">
<blockquote><p>if faith depends upon the word of God alone, if it regards and reclines on it alone, what place is left for any word of man? … God deprives man of the power of producing any new doctrine, in order that he alone may be our master in spiritual teaching, as he alone is true, and can neither lie nor deceive.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.8.9</figcaption>

<main class="wrap"><figure class="quote" id="q-ad754e980a" data-kw="">
<blockquote><p>Have ye had a care to keep a Christian state to Christ’s honor? Have ye loved public assemblies to that end and use? Have ye not forsaken the assemblies of Christ’s people for no just cause? Is not that a true church which professes the name of Christ according to his Word, whereto it submits as the rule of the religion it has? Is not that a true Church which enters covenant with Me, as all the Christians in the world by entering into my school by baptism?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639) Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., sect. 17, pp. 245-46</span></figcaption>

<blockquote><p>But there is one thing which is even worse than controversy, and that is false doctrine tolerated, allowed, and permitted without protest or molestation. It was controversy that won the battle of Protestant Reformation. If the views that some men hold were correct, it is plain we never ought to have had any Reformation at all! For the sake of peace we ought to have gone on worshiping the Virgin and bowing down to images and relics to this very day! Away with such trifling!</p></blockquote>

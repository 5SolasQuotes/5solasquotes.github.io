<main class="wrap"><figure class="quote" id="q-67937c6a69" data-kw="">
<blockquote><p>In regard of the justness and necessity of some things which may be the subject or matter of the usurpers’ command and the arbitrariness of others, and the lawfulness of either, not depending upon the command or warrant of a superior, but resulting out of the nature of the action itself; so that a private man might do it, were there no magistrate to command it, or no command from the magistrate for it. We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend:

1. Taking up arms for the preservation of ourselves and the country against a common enemy, upon the usurpers’ summons; the which we might do of ourselves, were there no authority; or if a just authority were in being, yet if it could not, or did not, maturely enough call us forth to it.

2. Payment of taxes and bearing other impositions for the usurping power, where, and while we are under his compulsive power, because such contributions may, and will be taken whether I will pay them or not; and I yield them under his enforcement, as a ransom for my life, or liberty, or somewhat else that is better to me than the payment; and consequently I am to choose the parting with it as the less evil, rather than with that which is better, which to loose is to incur a greater evil for the avoidance of a less…

3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me… But, in granting liberty of concurrence with some commands of an usurped authority, we neither yield any obedience at all to be due, or performable to it; nor can we allow a correspondence with it in diverse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.</p></blockquote>

<blockquote><p>Conquest, seeing it is an act of violence and God’s revenging justice for the sins of a people, cannot give in God’s court such a just title to the throne as the people are to submit their consciences unto, except God reveal his regulating will by some immediate voice from heaven, as he commanded Judah to submit to Nebuchadnezzar as to their king by the mouth of Jeremiah. Now this is not a rule to us; for then, if the Spanish king should invade this land, and, as Nebuchadnezzar did, deface the temple and instruments and means of God’s worship, and abolish the true worship of God, it should be unlawful to resist him, after he had once conquered the land: neither God’s Word, nor the law of nature could permit this. I suppose, even by grant of adversaries, now no act of violence done to a people, though in God’s court they have deserved it, can be a testimony to us of God’s regulating will; except it have some warrant from the law and testimony [Scripture], it is no rule to our conscience to acknowledge him a lawful magistrate whose sole law to the throne is an act of the bloody instrument of divine wrath, I mean the sword. That, therefore, Judah was to submit, according to God’s Word, to Nebuchadnezzar, whose conscience and best warranted calling to the kingdom of Judah was his bloody sword, even if we suppose Jeremiah had not commanded them to submit to the king of Babylon, I think cannot be said.</p></blockquote>

<blockquote><p>In a disputation by writing, those of the other part [Richard Baxter and others] formed an argument, whose major proposition was to this sense… ‘Whatsoever book [of law] enjoins nothing but what is of itself lawful, and by lawful authority, enjoins nothing that is sinful’. We denied this proposition, and at last gave diverse reasons of our denial; amongst which one was that ‘It may be unlawful by accident, and therefore sinful’… And I must confess I am still guilty of so much weakness as to be confident that ‘Some things, not evil of themselves, may have accidents so evil as may make it a sin to him that shall command them.’ Is this opinion inconsistent with all government? Yea I must confess myself guilty of so much greater weakness as that I thought I should never have found a man on earth that had the ordinary reason of a man, that had made question of it; yea I shall say more than that which has offended, viz, ‘That whensoever the commanding or forbidding of a thing indifferent is like to occasion more hurt than good, and this may be foreseen, the commanding or forbidding it is a sin.’ … I think Paul spake not anything inconsistent with the government of God or man when he bid both the rulers and the people of the Church not to destroy him with their meat for whom Christ died: and when he says, he hath not his power to destruction, but to edification; yea there are evil accidents of a thing, not evil of itself, that are caused by the commander: and it is my opinion that they may prove his command unlawful.</p></blockquote>

<blockquote><p>The demand was of the same man, who formerly did lawfully preach in a public assembly, if he should [now] obtain a license from the Lord bishop of the diocese, without any unlawful condition for to continue in that his course [of public preaching], whether that leave or license given does pollute the actions, seeing a man may ask leave of the great Turk to preach the gospel within his dominions? His [John Robinson’s] answer is that the very obtaining and receiving of such a license is unlawful, because it is a real acknowledgement that such a bishop has a lawful power to grant it. Which [in my judgment] is neither so nor so, for:

1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his license a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a license from that usurper (though he were no better than a strong thief) no reasonable man will say that in so doing he did acknowledge such [an] usurped power [to be] lawful. The rulers of Jewish synagogues had no lawful power over the apostles of Christ in any part of their ministry, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop?

2. There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>

1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his license a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a license from that usurper (though he were no better than a strong thief) no reasonable man will say that in so doing he did acknowledge such [an] usurped power [to be] lawful. The rulers of Jewish synagogues had no lawful power over the apostles of Christ in any part of their ministry, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop?

2. There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.”

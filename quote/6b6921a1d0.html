<main class="wrap"><figure class="quote" id="q-6b6921a1d0" data-kw="">
<blockquote><p>It is simple, short, and scriptural, in strict accordance with the Confessions of the other Reformed Churches, of which it was a faithful echo — a circumstance sufficiently accounting for the readiness and apparent haste with which it was compiled and accepted; for the points which it embraces had already been discussed in many a well-contested field, and had been inscribed on the banners of all the Churches of the Reformation:

The election of grace, all-sufficient sacrifice of the cross, the free salvation of the gospel, justification through faith in Christ without the works of the law, sanctification by the Spirit of Christ, and the necessity of good works as the fruits of that faith — such are the leading topics. In regard to Baptism and the Supper, while Popish errors are distinctly condemned, it is striking to mark the care with which it steers its way between the Lutheran and Zwinglian theories of the sacraments. The distinction is also well drawn between the Church visible and invisible. …

On the whole, the old Scots Confession is an ably-drawn document of the kind; and being remarkably free from metaphysical distinctions and theological minutiae, it runs in an easy style, and, in fact, reads like a good sermon in old Scotch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Parliament of 1560 in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

</figure><figure class="quote" id="q-fde2a653f4" data-kw="">
<blockquote><p>When I speak of this divine ordinance of church government, my meaning is not to allow, much less to animate any in the too severe and over-strict exercise of ecclesiastical discipline and censures. It was observed by Jerome (Ad Marcellum), as one of the errors of the Montanists: Illi ad omne pene delictum ecclesiae obserant fores, They shut the church door (that is, they excommunicate and shut out of the church) almost at every offence. I confess the greater part are more apt to fail in the defect than in the excess, and are like to come too short rather than to go too far. Yet a failing there may be, and has been, both ways… My purpose and endeavor shall be… to own the thing, to disown the abuses of the thing, to point out the path of Christ’s ordinance without allowing either rigour against such as ought to be tenderly dealt with, or too much lenity towards such as must be saved with fear, and pulled out of the fire, or at all any aberration to the right or left hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, p. xix</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b04f647079" data-kw="">
<blockquote><p>They thus assume it as confessed, that the two tribes had built the altar [of Ed] with a view of offering sacrifices upon it. In this they are mistaken, as it was destined for a different use and purpose. Moreover, had the idea which they had conceived been correct, all the expostulation which they employ would have been just…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Josh. 22 | v. 16</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

— John Calvin, Commentary, on Josh. 22 | v. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+thus+assume+it+as+confessed%2C+that+the+two+tribes+had+built+the+altar+%5Bof+Ed%5D+with+a+view+of+offering+sacrifices+upon+it.+In+this+they+are+mistaken%2C+as+it+was+destined+for+a+different+use+and+purpose.+Moreover%2C+had+the+idea+which+they+had+conceived+been+correct%2C+all+the+expostulation+which+they+employ+would+have+been+just%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary%2C+on+Josh.+22+%7C+v.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb04f647079.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b04f647079.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=They%20thus%20assume%20it%20as%20confessed,they%20employ%20would%20have%20been%20just&amp;text=They%20thus%20assume%20it%20as%20confessed%2C%20that%20the&amp;text=expostulation%20which%20they%20employ%20would%20have%20been%20just" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fde2d15b26" data-kw="">
<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/explication.html">Explication</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mention is made in the Scriptures of sundry things practiced by the Lord Christ and his Apostles, which being then in common use amongst men, were occasionally made by them symbolical instructions in moral duties. Such were washing of feet by one another, the holy kiss, and the like; but there being no more in them, but a sanctified use directed unto the present civil customs and usages, the commands given concerning them, respect not the outward action, nor appointed any continuance of them, being peculiarly suited unto the state of things and persons in those countries; as John 13:12-15</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-a78acd081f" data-kw="">
<blockquote><p>‘Whether water is to be used for baptizing? It is affirmed. Whether by urgent necessity, in the place of water some other liquor may be allowed, yet such as by which the body is washed, so whether by wine, rose water, milk, etc.? An absurd question. … Whether, if an infant is languishing and water is not present, it may be allowed to baptize with body lotion [etc.]… not differing much from water? An absurd question. For the rest, see in the Ecclesiastical Politics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations… (Utrecht, 1643), 2nd Section, ‘Of Redemption’, Tract 5, ‘Of Signs’, VII. ‘Of the Sacraments’, 4. ‘Of Baptism’, ‘On the Elements, Rites &amp; Circumstances of Baptism’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<main class="wrap"><figure class="quote" id="q-e096e87921" data-kw="">
<blockquote><p>…failure to wear the veil not because of vanity, but because of some contrary custom, ‘propter contrariam consuetudinem,’ will excuse the woman from sin. But such a custom is, in St. Thomas’s beautifully understated style, ‘non sit laudabilis,’ not praiseworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-p-goodman-iii.html">Donald P. Goodman III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“St. Thomas Aquinas and His Teaching”</cite>, (2005) 13 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f1d9a78bd" data-kw="">
<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mary-fellman.html">Mary Fellman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Social Context Of Tertullian’s ‘On The Veiling Of Virgins” MA thesis</cite>, (Cornell Univ., 2009) 55, pp. no pictures</span></figcaption>

</figure><figure class="quote" id="q-bc3d332290" data-kw="">
<blockquote><p>2. To behave ourselves as those that do expect this help, not tempting God, not grieving the angels; We should take heed how we carry ourselves in regard of this honorable attendance; our sins and vanity offends them, as it does God… Angels are pure and holy creatures that still abode in the truth; pride, lust, and vanity is very offensive to them, especially impurities and undecencies in God’s worship, about which they have a special attendance; therefore the apostle bids the women to cover their heads because of the angels, 1 Cor. 11:10, their fashion being to come into the congregation with loose dishevelled locks, he minds them of the presence of the angels: We may use a like argument to women to cover their naked breasts, now their immodesty is grown so impudent as to out-face the ordinances of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Notes on the Epistle of Jude</cite>, … (London, 1658), verse 9, Question &amp; Answer 4, pp. 371-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-1de89f7c5a" data-kw="">
<blockquote><p>The trifling objection of the abuse of this psalm [psalm 121], by the woman’s usual coming in a vail is easily answered, by affirming that the Church, as she does not forbid, so neither does she command any such habit, but leaves it as an indifferent thing; and if the woman, who has an arbitrary power in this concernment, think fit to come forth vailed, that is, better armed against the cold, her act cannot constitute a ceremony of the Church, and so the Church not chargeable with the abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hamon-l-estrange.html">Hamon L’Estrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Alliance of Divine Offices, exhibiting all the Liturgies of the Church of England since the Reformation as also the late Scotch Service-Book</cite>, [1637], with all their Respective Variations: and upon them all Annotations, Vindicating the Book of Common-Prayer from the Main Objections of its Adversaries… (London, 1659), Annotations upon ch. 11, p. 317</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

lank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a729494b27" data-kw="">
<blockquote><p>This thesis will examine the literary evidence of the cultural significance of head-coverings, particularly with reference to the Corinthian congregation addressed by Paul in 1 Cor. 11:2-16. There are two main objectives of the thesis: to produce a coherent interpretation of 1 Cor. 11:2-16 and to establish Paul’s view of gender in the text. …The first part investigates the significance of ‘the veil’ for the ancient Greeks and Romans respectively and compares certain aspects of gender in Greco-Roman culture and the letters of Paul… Paul’s view of gender in the text shows a degree of consistency with the culture…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rongxi-wu.html">Rongxi Wu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Veil in Classical Antiquity: A Sociocultural &amp; Exegetical Study of 1 Corinthians 11:2-16 PhD thesis</cite>, (University of Sheffield, 2020) 280 pp.</span></figcaption>

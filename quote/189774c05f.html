<blockquote><p>3d. Plea. I am come of Religious Parents, that improved, pleaded the Covenant for me, trained me up in the Fear of God.

Answ. John Baptist anticipates this Plea, Mat. 3.9. Think not to say in your Hearts, We have Abraham to our Father, Matth. 8.12. The Children of the Kingdom may be cast into utter Darkness. Alas Parental Privileges without Parents Principles, signify nothing: Let our Lord Christ, who will be Judge, answer this vain Plea, John 8.33-44. This may aggravate your Sin, never save your Souls, without Personal Piety.

4th. Plea. I have made a credible Profession of my Faith, am Baptized, am admitted to the Lord’s Supper, join with God’s People.

Answ. So did Simon Magus believe, professed his Faith, was Baptized, Acts 8.13.20-23, deceived the purest Church on Earth, for he proved a rotten Hypocrite; so did Judas, so did he that wanted the Wedding Garment, Matth. 22.12. And how easy it is to cast a Mist before the Eyes of fallible men, daily experience testifies: See an Instance of some that partake of extraordinary Privileges, Ordinances, yet rejected, 1 Cor. 10.5.</p></blockquote>

<blockquote><p>XXIII. But with regard to the place of regeneration there is greater difficulty. On this part of the subject, I find four distinct opinions among theologians. Some think that regeneration takes place at different periods of time—it may be before, it may be at, or it may be after baptism. Others place it uniformly before baptism. Others teach that infants are baptized unto future regeneration, being incapable of it at the time. Indeed, many contend that God usually confers regeneration upon infants in the very act and moment of baptism. Let us look at the arguments of each class, and subject them to an impartial examination. XXIV. That in the dispensation of his saving grace God is restricted to no particular period of time will be admitted by every person who entertains a becoming reverence for his supreme and almighty dominion. The sole question is: What he may have prescribed to himself in the exercise of his unlimited freedom, or may have revealed in his Word, or made manifest by experience?</p></blockquote>

<blockquote><p>The connection between this mention of the promise and the command to repent and be baptized in the preceding verses: “For the promise,” etc. Baptism is here treated as having the same relation to the promise as circumcision hitherto had; and this implies that no fundamental or organic change was about to take place in the church as it was passing from its Jewish to its Christian form, much less that the old church had ceased to exist and a new one was about to begin.

The apostle proceeds on the supposition that the Abrahamic covenant continues in full force, that as it had not been repealed or superseded by the Sinaitic covenant, so it was not repealed or superseded by the Christian dispensation. He takes the same fact for granted in his discourse in the next chapter (verses 22-26), and Paul argues the same point in Gal. iii. and Rom. xi.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Briefs and Sermons on the Acts of the Apostles</cite>, (1875) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia, ed. T. C. Johnson (3 vols, Richmond VA: The Presbyterian Committee of Publication, 1895-97), 3: 220-21.</span></figcaption>

<blockquote><p>SIMO[N].

Thou hast not yet told why the ancient fathers did baptise them again, that had been baptized by heretics.

JOIADA.

They were not baptized again, but they were baptized as they that had not been baptized. For heretics did deny the trinity, the god head of Christ, and the holy ghost. Besides that, they were not of the church: Ergo, they had no baptism, nor did baptise in the name of Jesus, whom they did deny.

Moreover, the custom of rebaptising, or baptizing again, was not commonly used in the church. For they that had been baptized in the name of the father, of the son, and of the holy ghost, were not baptized again, but were received by the imposition of hands, and also were admonished to persist and abide in the sincerity of faith. This therefore helpeth you nothing, but rather doth make against you. Among the true Christians, ye have no example at all of your rebaptization, but among these ancient heretics, that have been already condemned of the church. For ye do renew the heresies of Aupentius, Novatius &amp; Pelagius.</p></blockquote>

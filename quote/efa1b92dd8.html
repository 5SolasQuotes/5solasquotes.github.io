<main class="wrap"><figure class="quote" id="q-efa1b92dd8" data-kw="">
<blockquote><p>…he makes a flourish with Col. 2:23; Mt. 15:9, and hence makes a proof thus, that will-worship and vain-worship is forbidden there; and it is a transgression of the Second Commandment, and therefore idolatry, and so the church wherein it is offered is an idol. So then he thus reasons: in what Church vain worship is, that Church is an idol. Not all his deceivableness of unrighteousness, nor all Satan’s sophistry can ever prove this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical, Directed Against Mr. [Henry] Ainsworth the Separatist, &amp; Mr. Smith the Se-baptist... ([London, 1610]), ‘Reply to Mr. Smith’s Answer to this Second Error’</cite>, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…he makes a flourish with Col. 2:23; Mt. 15:9, and hence makes a proof thus, that will-worship and vain-worship is forbidden there; and it is a transgression of the Second Commandment, and therefore idolatry, and so the church wherein it is offered is an idol. So then he thus reasons: in what Church vain worship is, that Church is an idol. Not all his deceivableness of unrighteousness, nor all Satan’s sophistry can ever prove this.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-293341cf5f" data-kw="">
<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction”, “Remaining Objections” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 182</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

s Online</a></div>
</figure><figure class="quote" id="q-c003f2e045" data-kw="">
<blockquote><p>Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863)</cite>, p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!”

</figure><figure class="quote" id="q-05130951c7" data-kw="">
<blockquote><p>And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8b51e3ec46" data-kw="">
<blockquote><p>The officers which Christ hath appointed for the edification of his church, and the perfecting of the saints, are, some extraordinary… Others ordinary and perpetual, as pastors, teachers, and other church-governors, and deacons. … Deacons. The scripture doth hold out deacons as distinct officers in the church.[c] Whose office is perpetual.[d] To whose office it belongs not to preach the word, or administer the sacraments, but to take special care in distributing to the necessities of the poor.[e] [c] Phil. 1:1. 1 Tim. 3:8. [d] 1 Tim. 3:8-15. Acts 6:1-4. [e] Acts 6:1-4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Form of Presbyterial Church-Government</cite></span></figcaption>

</figure><figure class="quote" id="q-642ac3d8fe" data-kw="">
<blockquote><p>4. The Church is not made ministerial by us, without the body exclusively wholly (for Christ’s government is voluntary), nor ought any new thing to be concluded in our assemblies while the people hear of it: for if the Romans used rogare et suadere legem [to ask and persuade the law], and obtain the consent of the people thereunto, far more are they not to be acknowledged as Church-laws that are to be obtruded upon the godly against their will and knowledge; and much more if they be against the Word of God, and former godly acts with consent agreed unto by the Church; that is, whether the people consent or not, but yet without the body, whether they exercise acts of jurisdiction or not, for no act of jurisdiction is due to them; and to exclude the consent of women, no less interessed [interested] in practice of conscience than men, is to be Lord’s of their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658)</cite>, p. 258</span></figcaption>

</figure><figure class="quote" id="q-682902fc1f" data-kw="">
<blockquote><p>We find, that in the ministry of the New Testament there is a comely, beautiful and divine order: one kind of ministers, both ordinary and extraordinary, being placed in degree and dignity before another, as the apostles before all other ministers, the pastor before the elder, and deacon: But we do not find in ministers of the same kind that one has majority of power over others, or priority of degree and dignity before others, except upon the moral respect of age, zeal, gifts, etc. No apostle is in degree above other apostles, no evangelist above other evangelists, nor elder above other elders, no deacon above other deacons: Upon what ground then from Scripture can we believe or conceive that one pastor is in degree superior to other pastors, or that, in all other sorts of ministers, ordinary and extraordinary, there’s all [to] be a parity in their own kind and only in the office of pastors an inequality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered (1641)</cite>, p. 4</span></figcaption>

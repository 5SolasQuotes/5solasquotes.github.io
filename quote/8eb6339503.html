<blockquote><p>3. Such [persons] as openly proclaim their want [lack] of reverence, by their outward irreverend, unbeseeming gestures, which are stately coming into the assembly of God’s people, even when they are serving of God, with their hats on their heads, sitting at prayer, casting their eyes this way and that way…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary on the Whole Epistle to the Hebrews… (London, 1655), ch. 12, §135, ‘Of serving God reverendly’, p. 388 Gouge (1575–1653) was a Cambridge scholar, lecturer and Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fcc025fa63" data-kw="">
<blockquote><p>He lets them know that both these kinds of disorders are repugnant to the institution of God and the dictates of reason. But especially the latter of these practices is confuted here by an appeal to nature, which is a comprehensive topic, and you may understand by it the general dictate of natural reason, and the particular law of nature concerning distinction of sexes, as also usage and custom, which is a second nature… In a word, a man must not be like a woman either as to her veil and covering or as to her long and dressed hair, because he is taught otherwise by the law of reason, and by that of the sex, and even by the practice and custom of the soberest part of the world, which are all comprised in the large extent of the word ‘nature’ in this place of the apostle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Four Remarkable Texts of the New Testament which Contain Some Difficulty in Them… (Cambridge, 1692), The 2nd Text Inquired into, 1 Cor. 11:14</cite>, pp. 135-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-d5b17f75ff" data-kw="">
<blockquote><p>Bruce Winter has developed a case that elite Roman ‘new women’ brought into the church at Corinth a style of dress that was offensive and disruptive to church unity, as well as an affront to Rome itself. As a response to this avantgarde feminine independence, Winter situates the άγγέλοι of 1 Cor. 11.10 and the ίδιώται of 1 Cor. 14.23-24 as agents of the State who are sent to investigate the behavior of such Christian women at worship. This study considers Winter’s novel claim and concludes that the evidence does not justify such an interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Meaning of κατακαλυπτω [covered] and κατα κεϕαλης εχων [hanging down from the head] in 1 Corinthians 11.2–16’ Ref New Testament Studies, vol. 53, issue 4 (Oct. 2007)</cite>, pp. 502-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Bruce Winter has developed a case that elite Roman ‘new women’ brought into the church at Corinth a style of dress that was offensive and disruptive to church unity, as well as an affront to Rome itself. As a response to this avantgarde feminine independence, Winter situates the άγγέλοι of 1 Cor. 11.10 and the ίδιώται of 1 Cor. 14.23-24 as agents of the State who are sent to investigate the behavior of such Christian women at worship. This study considers Winter’s novel claim and concludes that the evidence does not justify such an interpretation.”

— Preston T. Massey, ‘The Meaning of κατακαλυπτω [covered] and κατα κεϕαλης εχων [hanging down from the head] in 1 Corinthians 11.2–16’ Ref New Testament Studies, vol. 53, issue 4 (Oct. 2007), pp. 502-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBruce+Winter+has+developed+a+case+that+elite+Roman+%E2%80%98new+women%E2%80%99+brought+into+the+church+at+Corinth+a+style+of+dress+that+was+offensive+and+disruptive+to+church+unity%2C+as+well+as+an+affront+to+Rome+itself.+As+a+response+to+this+avantgarde+feminine+independence%2C+Winter+situates+the+%CE%AC%CE%B3%CE%B3%CE%AD%CE%BB%CE%BF%CE%B9+of+1+Cor.+11.10+and+the+%CE%AF%CE%B4%CE%B9%CF%8E%CF%84%CE%B1%CE%B9+of+1+Cor.+14.23-24+as+agents+of+the+State+who+are+sent+to+investigate+the+behavior+of+such+Christian+women+at+worship.+This+study+considers+Winter%E2%80%99s+novel+claim+and+concludes+that+the+evidence+does+not+justify+such+an+interpretation.%E2%80%9D%0A%0A%E2%80%94+Preston+T.+Massey%2C+%E2%80%98The+Meaning+of+%CE%BA%CE%B1%CF%84%CE%B1%CE%BA%CE%B1%CE%BB%CF%85%CF%80%CF%84%CF%89+%5Bcovered%5D+and+%CE%BA%CE%B1%CF%84%CE%B1+%CE%BA%CE%B5%CF%95%CE%B1%CE%BB%CE%B7%CF%82+%CE%B5%CF%87%CF%89%CE%BD+%5Bhanging+down+from+the+head%5D+in+1+Corinthians+11.2%E2%80%9316%E2%80%99+Ref+New+Testament+Studies%2C+vol.+53%2C+issue+4+%28Oct.+2007%29%2C+pp.+502-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd5b17f75ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d5b17f75ff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=Bruce%20Winter%20has%20developed%20a%20case,does%20not%20justify%20such%20an%20interpretation&amp;text=Bruce%20Winter%20has%20developed%20a%20case%20that%20elite&amp;text=the%20evidence%20does%20not%20justify%20such%20an%20interpretation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

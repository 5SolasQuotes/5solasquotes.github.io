<blockquote><p>But his intercession is inseparably connected with his work of atonement — that work being the very ground of it, and the most essential ingredient in it. For the intercession of Christ is not a persuasive pleading upon his atonement, but the presenting of the atonement itself before God; — on which account these two, Christ’s work of intercession and his work of atonement, must be co-extensive; — for, if he intercede for some only of those for whom he died, he must have some additional plea to urge on their behalf, beyond the merit of his death. “I pray for them: for they are thine.”

That, and that alone, is the reason why I take so deep an interest in them — that is the reason why I lay down my life for them, and intercede for them. They are dear to me, because they are thine; “and all mine are thine, and thine are mine.” Ay, though many of them, “not knowing what they do,” will be found among the number of my persecutors and murderers, yet, even when they are nailing me on the cross, I will pray for them, — for whom, as well as by whom, my blood is poured out, “Father, forgive them.”

Thus Christ unequivocally restricts and limits his own work of obedience, atonement, and intercession, to those whom the Father hath given him; and it is upon his work, as thus limited and restricted, that he establishes their perfect security in him, which he would have them to realize (ver. 11): “Holy Father, keep through thine own name,” which I have manifested to them, “those whom thou hast given me; that they may be one, as we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), xl-xli.</span></figcaption>

<blockquote><p>[Socinians and Photinians object:] (2) God is able to pardon sins without satisfaction. Therefore, it is probable, that He exacts no satisfaction. The antecedent is proven: Because He is able to remit of His own right as much as He pleases: since He is the absolute judge: but to each one one may remit as much as He pleases of his own right. Responses:

1. I deny the consequence; it is not valid to argue from the possible to the actual.

2. I also deny the antecedent. The proof is inconsequent: God is indeed able to remit of His own right as much as He pleases; but by His truth and righteousness He is not willing to remit so much, that without satisfaction He might forgive sins: because by His just judgment He once dictated to man the punishment of death: in the day that thou eatest therefore thou shalt surely die. Whence Scripture comments the righteousness of God in exacting satisfaction, Rom. 3:25. (3.) God wills to forgive us our sins without satisfaction. Therefore, He exacts no satisfaction. The antecedent is proven: because God does not exact anything from us except faith and repentance. Response: I deny the antecedent. The proof is inconsequent. For, even if from us He does not require and exact satisfaction: nevertheless, He exacts it from His Son, our Mediator, and imputes and grants the same to us freely. Faith itself implies this satisfaction: which is born toward Christ as the one redeeming and making satisfaction.</p></blockquote>

<blockquote><p>The idea from which the reference to “the many” arises, however, is a very different one: Christ did not die for a few but for many, for a large multitude. He gives his life as a ransom for many; he sheds his blood for many; he will make many righteous. It is not a handful but many who by one man’s obedience will be made righteous [Rom. 5:19]. Scripture is not afraid that too many people will be saved. Therefore, based on that same consideration, it says that God has no pleasure in the death of the wicked and that he wants all humans to repent and be saved, that Christ is the expiation of and has given his life for the world, and that the gospel must be preached to all creatures. But when universalists deduce from this that the atonement is completely universal, they run afoul of both Scripture and reality, for the two seem to vie with each other in teaching that not all but only many learn of the gospel and attain genuine repentance. In all these passages, therefore, we are encountering not “the will of God’s good pleasure,” which is unknown to us and neither can nor may be the rule for our conduct, nor an “antecedent will,” which is anterior to the decision of our will and oriented to it, but the “revealed will,” which tells us by what standard we are to conduct ourselves in the new covenant. It gives us the right and lays on us the duty to bring the gospel to all people without exception. For the universal offer of grace we need no other ground than this clearly revealed will of God. We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed—in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice—also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election. In the second place, Scripture implies that the sacrifice and intercession of Christ, hence also the acquisition and application of salvation, are inseparably connected. The sacrifice is the basis for Christ’s intercession; the scope of the latter, accordingly, is as extensive as that of the former. Limborch therefore recognizes that “the intercession is not an act distinct from the sacrifice in and of itself insofar as it [the intercession] is accomplished in heaven.” If then the intercession is particular, as it is (John 17:9, 24; Rom. 8:34; Heb. 7:25; 1 John 2:1–2), so is the sacrifice. Limborch, opposing this position, indeed cites Luke 23:34, but Jesus prays here not for the salvation of his enemies but only for the nonimputation of the appalling crime that they, in their ignorance, were committing when they crucified the Messiah. There is similarly an inseparable connection between the acquisition and the application of salvation. All the benefits of the covenant of grace are linked (Rom. 8:28–34) and find their ground in the death of Christ (Rom. 5:8–11). Atonement in Christ carries with it salvation and blessedness. For Christ is the head and believers are his body, a body that receives its growth from him (Eph. 4:16; Col. 2:19). He is the cornerstone, and we are the building (Eph. 2:20–21). He is the firstborn, and we are his brothers (Rom. 8:29). Believers, accordingly, have objectively died, been crucified, buried, raised, and seated in the heavens with and in him. That is, the church is not an accidental and arbitrary aggregate of individuals that can just as easily be smaller or larger, but forms with him an organic whole that is included in him as the second Adam, just as the whole of humankind arises from the first Adam. The application of salvation must therefore extend just as far as its acquisition. The application is comprehended in it and is its necessary development. This, for that matter, is true in the nature of the case. If Jesus is truly the Savior, he must also really save his people, not potentially but really and in fact, completely and eternally. And this, actually, constitutes the core of the difference between the proponents and the opponents of particular satisfaction (atonement).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, Vol. 3: Sin and Salvation in Christ, trans. John Bolt and John Vriend (Baker Academic, 2006), 466.</span></figcaption>

he+calling+indeed+rests+on+a+particular+basis%2C+for+it+belongs+to+and+proceeds+from+the+covenant%2C+but+it+is+addressed%E2%80%94in+keeping+with+God%E2%80%99s+revealed+will+and+with+the+inherently+all-sufficient+value+of+Christ%E2%80%99s+sacrifice%E2%80%94also+to+those+who+are+outside+the+covenant+in+order+that+they+too+may+be+incorporated+into+that+covenant+and+in+faith+itself+receive+the+evidence+of+their+election.+In+the+second+place%2C+Scripture+implies+that+the+sacrifice+and+intercession+of+Christ%2C+hence+also+the+acquisition+and+application+of+salvation%2C+are+inseparably+connected.+The+sacrifice+is+the+basis+for+Christ%E2%80%99s+intercession%3B+the+scope+of+the+latter%2C+accordingly%2C+is+as+extensive+as+that+of+the+former.+Limborch+therefore+recognizes+that+%E2%80%9Cthe+intercession+is+not+an+act+distinct+from+the+sacrifice+in+and+of+itself+insofar+as+it+%5Bthe+intercession%5D+is+accomplished+in+heaven.%E2%80%9D+If+then+the+intercession+is+particular%2C+as+it+is+%28John+17%3A9%2C+24%3B+Rom.+8%3A34%3B+Heb.+7%3A25%3B+1+John+2%3A1%E2%80%932%29%2C+so+is+the+sacrifice.+Limborch%2C+opposing+this+position%2C+indeed+cites+Luke+23%3A34%2C+but+Jesus+prays+here+not+for+the+salvation+of+his+enemies+but+only+for+the+nonimputation+of+the+appalling+crime+that+they%2C+in+their+ignorance%2C+were+committing+when+they+crucified+the+Messiah.+There+is+similarly+an+inseparable+connection+between+the+acquisition+and+the+application+of+salvation.+All+the+benefits+of+the+covenant+of+grace+are+linked+%28Rom.+8%3A28%E2%80%9334%29+and+find+their+ground+in+the+death+of+Christ+%28Rom.+5%3A8%E2%80%9311%29.+Atonement+in+Christ+carries+with+it+salvation+and+blessedness.+For+Christ+is+the+head+and+believers+are+his+body%2C+a+body+that+receives+its+growth+from+him+%28Eph.+4%3A16%3B+Col.+2%3A19%29.+He+is+the+cornerstone%2C+and+we+are+the+building+%28Eph.+2%3A20%E2%80%9321%29.+He+is+the+firstborn%2C+and+we+are+his+brothers+%28Rom.+8%3A29%29.+Believers%2C+accordingly%2C+have+objectively+died%2C+been+crucified%2C+buried%2C+raised%2C+and+seated+in+the+heavens+with+and+in+him.+That+is%2C+the+church+is+not+an+accidental+and+arbitrary+aggregate+of+individuals+that+can+just+as+easily+be+smaller+or+larger%2C+but+forms+with+him+an+organic+whole+that+is+included+in+him+as+the+second+Adam%2C+just+as+the+whole+of+humankind+arises+from+the+first+Adam.+The+application+of+salvation+must+therefore+extend+just+as+far+as+its+acquisition.+The+application+is+comprehended+in+it+and+is+its+necessary+development.+This%2C+for+that+matter%2C+is+true+in+the+nature+of+the+case.+If+Jesus+is+truly+the+Savior%2C+he+must+also+really+save+his+people%2C+not+potentially+but+really+and+in+fact%2C+completely+and+eternally.+And+this%2C+actually%2C+constitutes+the+core+of+the+difference+between+the+proponents+and+the+opponents+of+particular+satisfaction+%28atonement%29.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+Vol.+3%3A+Sin+and+Salvation+in+Christ%2C+trans.+John+Bolt+and+John+Vriend+%28Baker+Academic%2C+2006%29%2C+466.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17b927d42a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17b927d42a.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/12/bavinck-christs-intercession-acquisition-and-application-are-inseparably-linked/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>

<blockquote><p>2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.</p></blockquote>

<blockquote><p>When the Heretick willeth me to prove from Scripture that Christ is very man; it is a vain thing he should demand of me beside to prove by Scripture, that Christ is such a one also as can laugh, weep, admire, sing, sigh, &amp;c. for these are presupposed to follow man’s nature; and if Scripture prove Christ to be a true man, it presupposeth by nature’s light, that he can laugh, he can weep, and that in some time, some place, in some habit, in some gesture, so he be a man; for that is presupposed by the light of nature, and known by the most Barbarous who never heard of Scripture …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government and Excommunication: or a Peaceable Dispute for the Perfection of the Holy Scripture in Point of Ceremonies and Church Government</cite>, (London: John Field, 1646), 1.3, p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-a2fcaf6134" data-kw="">
<blockquote><p>It would be tedious, dearly beloved, were I to recount every episode from the history of the Psalms, especially since it is necessary now to offer something from the New Testament and confirmation of the Old, lest one think the ministry of psalmody to be forbidden inasmuch as many of the usages of the Old Law have been abolished. For those things that are carnal have been rejected, circumcision for example, and the observance of the [Jewish] Sabbath, sacrifices, discrimination among foods, as well as trumpets, citharas, cymbals, and timpana (all of which are now understood to reside in the bodily members of man, and there better to sound).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niceta-of-remesiana.html">Niceta of Remesiana</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On The Benefit of Psalmody in Oliver Strunk and Leo Treitler, ed. Source Readings in Music History (New York: W. W. Norton &amp; Company, 1950, repr. 1998), 130.</span></figcaption>

</figure><figure class="quote" id="q-67eabd7baa" data-kw="">
<blockquote><p>In the next place, let me charge you to hold fast the old doctrine of the Church of England about the sanctity and right observance of the Sabbath Day. I name this point because our old English Sunday appears to me to be in great danger. We live in perilous times. Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting every one do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his campaign against the Lord’s Day than he has done since the Reformation.

You may see what I mean in the persistent attempts frequently made to throw open places of amusement, aquariums, libraries, theatres, museums, picture galleries, and the like, under the plausible pretence of ‘affording recreation to the working-classes’! All such attempts, I maintain, ought to be firmly and vigilantly resisted. They are the first steps towards a Continental Sunday, and a general flood of Sabbath desecration, Sunday shop-opening, and Sunday delivery of letters in London. I would not have you give way to such attempts. ‘No surrender!’ should be our cry. Let us fight to the last plank for the old English Sunday. Give up the outworks, and the citadel will soon fall.

That laymen of high position and education, noblemen, philosophers, and scientific lecturers, should assist the attempt to break down the standard of Sunday observance, is matter for deep regret. I can only suppose that they do it in ignorance. If they would only study hearts and consciences and death-bed feelings half as much as they study political economy, or stones and plants and beasts and geology and astronomy and light and chemistry and the secrets of earth and air and sea, I believe they would not act as they do. I pity and pray for them. ‘They know not what they do.’

But how any clergyman holding office in the Church of England, and reading the Fourth Commandment every Sunday to his congregation, can lend his aid to movements which must infallibly prevent the Sabbath being kept holy, if they succeed, is one of those mysteries of the nineteenth century which pass my understanding. I am amazed, pained, troubled, grieved, and astonished. The good that the best clergyman does at his very best in a fallen world is small. But he that expects to do good by introducing a Continental Sunday into his parish, exhibits, in my judgment, however excellent his intentions, great ignorance of human nature. He is cutting off his right hand, and destroying his own usefulness.

Whatever may be the bad habits of the working-classes in large parishes, they will never be cured by organizing modes of breaking the Fourth Commandment. We should call that statesman a poor lawgiver who sanctioned petty larceny in order to prevent burglary; and I call that clergyman an unwise man, who, in order to stop drunkenness and its concomitants, is prepared to throw overboard the Sabbath Day. Surely to sacrifice one commandment in order to prevent the breach of another, is neither Christianity nor common-sense. It is, in my opinion, ‘doing evil that good may come.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hold Fast. The Fourth Triennial Charge to the Diocese of Liverpool, November 4, 1890 in Charges and Addresses</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

+only+suppose+that+they+do+it+in+ignorance.+If+they+would+only+study+hearts+and+consciences+and+death-bed+feelings+half+as+much+as+they+study+political+economy%2C+or+stones+and+plants+and+beasts+and+geology+and+astronomy+and+light+and+chemistry+and+the+secrets+of+earth+and+air+and+sea%2C+I+believe+they+would+not+act+as+they+do.+I+pity+and+pray+for+them.+%E2%80%98They+know+not+what+they+do.%E2%80%99%0A%0ABut+how+any+clergyman+holding+office+in+the+Church+of+England%2C+and+reading+the+Fourth+Commandment+every+Sunday+to+his+congregation%2C+can+lend+his+aid+to+movements+which+must+infallibly+prevent+the+Sabbath+being+kept+holy%2C+if+they+succeed%2C+is+one+of+those+mysteries+of+the+nineteenth+century+which+pass+my+understanding.+I+am+amazed%2C+pained%2C+troubled%2C+grieved%2C+and+astonished.+The+good+that+the+best+clergyman+does+at+his+very+best+in+a+fallen+world+is+small.+But+he+that+expects+to+do+good+by+introducing+a+Continental+Sunday+into+his+parish%2C+exhibits%2C+in+my+judgment%2C+however+excellent+his+intentions%2C+great+ignorance+of+human+nature.+He+is+cutting+off+his+right+hand%2C+and+destroying+his+own+usefulness.%0A%0AWhatever+may+be+the+bad+habits+of+the+working-classes+in+large+parishes%2C+they+will+never+be+cured+by+organizing+modes+of+breaking+the+Fourth+Commandment.+We+should+call+that+statesman+a+poor+lawgiver+who+sanctioned+petty+larceny+in+order+to+prevent+burglary%3B+and+I+call+that+clergyman+an+unwise+man%2C+who%2C+in+order+to+stop+drunkenness+and+its+concomitants%2C+is+prepared+to+throw+overboard+the+Sabbath+Day.+Surely+to+sacrifice+one+commandment+in+order+to+prevent+the+breach+of+another%2C+is+neither+Christianity+nor+common-sense.+It+is%2C+in+my+opinion%2C+%E2%80%98doing+evil+that+good+may+come.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Hold+Fast.+The+Fourth+Triennial+Charge+to+the+Diocese+of+Liverpool%2C+November+4%2C+1890+in+Charges+and+Addresses&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67eabd7baa.html&amp;via=5Solas" target=

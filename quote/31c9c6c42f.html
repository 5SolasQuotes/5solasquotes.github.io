<main class="wrap"><figure class="quote" id="q-31c9c6c42f" data-kw="">
<blockquote><p>But it may be asked again, are synodical decrees to be received as infallible? Certainly not. A synod being constituted of men, however wise and grave, yet of like passions with others, may greatly err, and therefore all their decrees are to be examined by the Law and Testimony. But when as in the Synod at Jerusalem, they examine a question by the light of Scripture, and in the decree which they enact, hear and obey the voice of Christ, speaking in his word, then should that decree be felt binding on the consciences of those over whom the court rules, inasmuch as Christ has said, whatever they thus bind on earth, He will bind in heaven.

That power which church courts exercise, be it remembered, is not self-assumed — not self-created. It is derived immediately from Christ. He only has a right to make laws and appoint officers in His church; and the authority which they exert is therefore only ministerial. That is, as His servants they declare and carry into execution those laws, and those only which are agreeable to the expressed will of their Master. Like judges on the bench, they have no power either to make new laws, or change the laws already laid down. The Bible is their great code, and whenever they depart from that, they have no claim on your obedience.

The force which they employ is not carnal, but moral and spiritual; a force which exerts itself, not in controlling the persons of men, not in inflicting bodily penalties, not in taking possession of their properties, not in giving them over to the civil power, that by its mighty arm they may be crushed; but in warning them of their danger, in rebuking them for their folly, in censuring them for sin, and when they belie their profession, in excluding them from the fellowship of the church. Nor can they exercise even this power over any but those who have voluntarily joined the church, and have in doing so, pledged themselves to submit to its laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-denham.html">James Denham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse III in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

</figure><figure class="quote" id="q-de1ec3df9d" data-kw="">
<blockquote><p>IN WHAT DOES THE POWER OF THE KEYS OF THE KINGDOM OF HEAVEN DIFFER FROM CIVIL POWER? The points of difference are many, and such as are apparent.

1. Ecclesiastical discipline is exercised by the church; civil power by the judge or magistrate.

2. In the state, judgment is passed according to civil and positive laws; in the church, according to the divine law or word of God.

3. The power of the keys committed to the church depends upon the word of God, and the church exercises her power by the word, denouncing the wrath of God upon the impenitent; punishes the obstinate with the word of God alone, yet in such a way that this punishment takes hold even upon the conscience: civil power employs the sword, and compels the refractory to submit to its authority by temporal punishment alone.

4. The church has different steps of admonition, and if the offender is brought to acknowledge his sin and repents of it, it does not proceed to execute punishment in his case; the magistrate punishes the offender even though he repent.

5. The church in the exercise of discipline, looks to the reformation and salvation of the offender; the magistrate to the execution of justice and the public peace.

6. As the church exercises discipline in the case of none except the obstinate and disobedient, so it is bound to reverse its decision, and to remove the punishment, whenever there is sufficient evidence of repentance on the part of the offender. The magistrate when he has once inflicted punishment neither reverses the decision, nor removes the punishment. The thief that repents upon the cross, or in the hour of death, is received by Christ into Paradise; the magistrate proceeds to the execution of the punishment to which he is sentenced, and sends him into exile. So Christian discipline often takes cognizance of things which the state does not notice, as when the church casts out of her communion those who do not repent, and refuses to recognize them as her members, whilst the magistrate, nevertheless, tolerates them; and so, on the contrary, the state may banish those whom the church receives. The magistrate may, for instance, inflict capital punishment upon adulterers, robbers, thieves, &amp;c., and yet the church may receive them, if they give proper evidence of true repentance. The difference, therefore, between ecclesiastical and civil power, is clear and apparent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, 3rd American Edition. Trans. G. W. Williard (Cincinnati: T. P. Bucher, 1851), 450.</span></figcaption>

</figure><figure class="quote" id="q-3b47021f5c" data-kw="">
<blockquote><p>As to the political law of the Jews, that has been abolished in two respects; first, as it served to distinguish the Jewish commonwealth from all others, and as it was a type of the Redeemer’s kingdom. Now there is no longer any difference between Jews and Gentiles in Christ, (Gal. iii. 28,) and the Messiah having appeared, there is no need for his kingdom to be typified.

Secondly, it is abrogated in those things which are of particular obligation, and which were only applicable to the Jews; as the law concerning the marriage of a brother’s wife, the law of divorce, the jubilee, the first-born, the sowing of fields with different seeds, &amp;c. &amp;c.

But it is not abrogated in those things which are of universal obligation, being founded on the law of nature; which serve for the explanation of the Decalogue, and are found in the New Testament. The Jewish nation may be considered in two characters, as a people, and as the Jewish people; whatever applies to them simply as a nation, can be applicable to others; but whatever applies to them as the Jewish nation, is of no more obligation upon us, than the laws of the ancient Assyrians, Persians, Greeks, and Romans, or the municipal laws of any foreign nation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.18, p. 333.</span></figcaption>

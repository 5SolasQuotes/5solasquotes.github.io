<blockquote><p>2.1 As far as concerns the case of infants, you expressed your view that they ought not to be baptised within the second or third day of their birth; rather, the ancient law on circumcision ought to be respected and you therefore concluded that the newly-born should not be baptised and sanctified before the eighth day. Our Council adopted an entirely different conclusion. No one agreed with your opinion on the matter; instead, without exception we all formed the judgment that it is not right to deny the mercy and grace of God to any man that is born. 2.2 But seeing that the Lord says in His own Gospel: The Son of man has come not to destroy the souls of men but to save them, we must do everything we possibly can to prevent the destruction of any soul. We need to ask, what can be lacking to one who has been already formed by the hands of God in his mother’s womb? To our way of thinking, indeed, and to our eyes infants after their birth appear to grow and increase as the earthly days go by; but as far as God their Maker is concerned, whatever has been made by Him is perfect and complete thanks to His handiwork and almighty power. 6.1 And so, dearest brother, our verdict at the Council was this: we ought not to be the cause for debarring anyone from access to baptism and the grace of God, for He is merciful, kind, and loving towards all men. 6.2 And whilst this is a rule which ought to be observed and maintained concerning the whole of mankind, it is our view that it should be observed most particularly in the very case of newborn infants; they have all the more claim upon our assistance and God’s mercy for the reason that, right from the very first moment they are born, in their crying and wailing they are doing nothing else but imploring for our help</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Letters of St. Cyprian of Carthage, Letters 55–66</cite>, ed. Johannes Quasten, Walter J. Burghardt, and Thomas Comerford Lawler, trans. G. W. Clarke, vol. III, Ancient Christian Writers (New York; Mahwah, NJ: Newman Press, 1986), 110, 112.</span></figcaption>

<blockquote><p>5. When we teach the perseverance of the saints in a state of justification once obtained, we do not deny that the quality, or exercise of the faithful or righteous man is mutable or may be lost, by reason of the subject matter; but we affirm that the special love of God does not permit, that he who by believing in Christ shall have been justified and adopted as a son of God, by losing that faith and holiness should cease to be a child of God and perish for ever.</p></blockquote>

</figure><figure class="quote" id="q-9d306f79c2" data-kw="">
<blockquote><p>What Mr. [Thomas] Bedford [d. 1653] has produced for the efficacy of baptism has been answered by Mr. [Richard] Baxter in his Appendix to his Plain Scripture, etc. [1651-1656]… Dr. [Cornelius] Burges, his Treatise of Baptismal Regeneration [1629], has been freely censured by many… And therefore I deny baptism to be the remedy of original sin, or the cause of regeneration, or that Christ intended to assign the use to baptism to heal original sin, or to testify the freedom from it without actual [sin]. These things have been delivered by Augustine and taught by the Romanists and Lutherans, but by many other Protestants disclaimed and refuted; and therefore Mr. Stephens, Mr. [James?] Cranford [d. 1657], Mr. Bedford, etc. in using this argument do but symbolize with the Papists, and revive what many Protestants of best note have exploded. ([Errata, p. 341:] What Dr. [Samuel] Ward and Dr. [John] Davenant have said for regeneration and justification of infants by baptism has been accurately examined and enervated by Mr. Gataker in Latin.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-Pædobaptism, or, The Second Part of the Full Review of the Dispute Concerning Infant-Baptism</cite>, ... (London, 1654), pp. 220-21. Tombes was an English baptist.</span></figcaption>

<blockquote><p>Conclusion I: None have a right to baptism before the Lord, but those who have actually a saving interest in the Lord Jesus Christ… Conclusion II: Visible believers, and such as have a profession of religion, probably signifying their having a saving interest in Christ, have a right to baptism before the church, so that they may be admitted thereto, though indeed they have no saving grace, yea or never shall have it… Conclusion III: None but visible believers, or such as appear to have a saving interest in Christ, have right to baptism before the Church… Conclusion IV: All infants descended of parents whereof one only is a visible believer, has right to baptism before the church… Such are in covenant with God visibly; we are to look on them as probably within the covenant, as to the saving benefits thereof, so that none can forbid water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macpherson.html">John MacPherson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 82-90 of ‘The Idea of the Church and Membership in it’, Lecture 2 in The Doctrine of the Church in Scottish Theology 1903 | Thomas Boston, ‘Who Have Right to Baptism, and are to be Baptized’ in Works 6.126-39:</span></figcaption>

%20none%20can%20forbid%20water" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cfefc8c245" data-kw="">
<blockquote><p>This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.”

— Ursinus, Sudhoff, Olevianus und Ursinus, pp. 633 ff. as quoted in Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’, p. 264-5 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+is+sure+and+certain%2C+that+God+instituted+his+sacraments+and+covenant+seals+only+for+those+who+recognize+and+maintain+the+church+as+already+made+up+of+parties+of+the+covenant%2C+and+that+it+is+not+His+intention+to+make+them+Christians+by+the+sacraments+first%2C+but+rather+to+make+those+who+are+already+Christians+to+be+Christians+more+and+more+and+to+confirm+the+work+begun+in+them%E2%80%A6+Hence%2C+if+anyone+considers+the+children+of+Christians+to+be+pagans+and+non-Christians%2C+and+damns+all+those+infants+who+cannot+come+to+be+baptized%2C+let+him+take+care+on+what+ground+he+does+so%2C+because+Paul+calls+them+holy+%281+Cor.+7%29%2C+and+God+says+to+all+believers+in+the+person+of+Abraham+that+He+will+be+their+God+and+the+God+of+their+seed%E2%80%A6+Next+let+him+consider+how+he+will+permit+them+to+be+baptized+with+a+good+conscience%2C+for+knowingly+to+baptize+a+pagan+and+unbeliever+%5Bwhich+is+entailed+if+the+children+are+not+already+in+the+Covenant%5D+is+an+open+abuse+and+desecration+of+baptism.%E2%80%9D%0A%0A%E2%80%94+Ursinus%2C+Sudhoff%2C+Olevianus+und+Ursinus%2C+pp.+633+ff.+as+quoted+in+Geerhardus+Vos%2C+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99%2C+p.+264-5+in+Redemptive+History+and+Biblical+Interpretation%3A+The+Shorter+Writings+of+Geerhardus+Vos+ed.+Gaffin+%28P%26R%2C+1980%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcfefc8c245.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cfefc8c245.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-ar

<main class="wrap"><figure class="quote" id="q-28fca54e35" data-kw="">
<blockquote><p>The Sabbath certainly operates most beneficially in presenting a suitable occasion to parents, for training up their children in the nurture and admonition of the Lord. During the days of business, they are not so much at leisure to assemble their families around them; nor are children generally so much disposed to attend to pious instruction on any other day. Their minds are then preoccupied with their plays and objects of pleasure.

But on the holy day which they have been taught to remember, on which they see all work suspended, and the Bible and religious books placed on the table, they are prepared to hear and to feel. And as parents value their children’s souls, and their country’s prosperity, let them not neglect on the Sabbath day, to gather their family about them, and in the use of some familiar and approved catechism, or from the fountain itself, infuse into their tender minds, the great facts and principles of the gospel of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), p. 127.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff57609447" data-kw="">
<blockquote><p>Though the “Book of Praises” was gathered during the OT era and used in the Temple’s worship, its full intent as a canon of praise could not be fully grasped until Christ came. Its intent was to reveal and praise the Savior-King who would fulfill all the promises of God’s covenant with Israel. Jesus Christ must therefore be understood as the Sovereign of the Psalter, but also as the source of and the purpose for the development of the canon of the Psalter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rpcna-synodical-study-committee-on-worship.html">RPCNA Synodical Study Committee on Worship</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms in the Worship of the Church</cite>, “The Psalms in the Worship of the Church.” Submitted to the Synod of the RPCNA, June 2004</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse. For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it. For there must be also heresies among you, that they which are approved may be made manifest among you. When ye come together therefore into one place, this is not to eat the Lord’s supper. For in eating every one taketh before other his own supper: and one is hungry, and another is drunken. What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not.</p></blockquote>

</figure><figure class="quote" id="q-16fbe9387d" data-kw="">
<blockquote><p>And for singing of David’s Psalms in meter, establisheth a concord in the harmony; and the matter being the same, it is nothing to the lawfulness or unlawfulness of the thing… and for singing psalms (Mt. 26:30; Acts 16:26; Col. 3:16), we have the practice of our Savior Himself, Paul, Silas, and the recommendation of James, and of Paul also; and ’tis reported of Theodorus, that under the cruel persecution of Julius the Apostate, suffered much in martyrdom, and being on the rack, to the amazement of all the beholders, sung psalms most harmoniously; and if there can be any song spiritual, and yet unlawful, why then did Paul admonish us to exhort one another in psalms, and hymns, and spiritual songs? and there can be no song, but there must be meter, for so the word signifies, and therefore take them as songs, our practice is justified. And if you look for more, I refer you to them who have writ largely on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-deacon.html">John Deacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Nayler’s Blasphemies Discovered</cite>, (1657), ‘Answer to the 13th Query’, pp. 50-51. Deacon appears to have been a presbyterian (p. 10 &amp; 54) writing against a Quaker, who did not publicly sing praise at all.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

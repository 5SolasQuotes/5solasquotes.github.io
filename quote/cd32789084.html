<main class="wrap"><figure class="quote" id="q-cd32789084" data-kw="">
<blockquote><p>[Attributes of God are classified] Into Absolute and Relative, which imply a Relation to the creatures with Himself, and are founded in Absolutes. Thus an Absolute Attribute of God is Goodness, but a Relative Attribute is Mercy, which pertains to the Goodness of God, but additionally involves a regard to a miserable creature. Immensity is an Absolute Attribute, but Omnipresence is Relative, because it indicates a relation to created things, in all which it asserts the presence of God. Vindictive Justice is a Relative Attribute, indicating a relation to a creature, sinful and worthy of punishment; but it is founded in an Absolute Attribute, divine Holiness. And so, although that relation did not obtain before the things were created, nevertheless the Relative Attributes are able truly to be said to be Essential to God, because they are always applicable to God with respect to their foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/berhardinus-de-moor.html">Berhardinus De Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuous Commentary on Johannes a Marck</cite>, (1761-1772), IV:19, ‘Classification of God’s Attributes: Absolute &amp; Relative’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dee57a070d" data-kw="">
<blockquote><p>Some [attributes] are said absolutely concerning God, as all the preceding attributes. Others relatively, which relation is two-fold: either with respect to the persons among themselves, as the Father, the Son, and the Holy Spirit, or with respect of the creatures to God, as Creator, Savior, Lord, King, etc. Here it is asked, whether all these things were in God from eternity past. Response: All those things that are attributed to God absolutely are eternal, even those that are spoken relative to the very persons, as shall be proven afterwards against the heretics – Arians, Samosatensians, etc. The difficulty, therefore, remains only in those which are spoken concerning God with respect to the creatures, concerning which we respond, if we consider the foundation of the relation, such as the power to create, to conserve, to reign, etc, this also is eternal, because it is referred to the absolute: but if we consider the formal relation, that is added in time: for God was not an actual creator until he had created things. Objection: But then it is stated that something was added to God; and therefore, some change was also done in Him. Response: That relation, with respect to God, is not real; but it is only so with respect to the creature. For to the creature, something real is added, and not to God; but only some notional concept. Augustine compares it to a coin: when it becomes a pledge, nothing is really added to the coin; but to the man who accepts it, something is really added. Thomas compares it to a column, which is to my right: when I turn to that side, still nothing is really added to the column; but only to the man, who turns himself toward it in this or that way, does any change take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Johannes Hornbeek, Institutes</cite>, 3.9 trans. Charles Johnson</span></figcaption>

<blockquote><p>18. Wrath signifies in God the just will to avenge an injury done or thought to Himself or his Church, Jn. 3:36; Rom. 1:18; 2:5. 19. It is attributed to Him not except as an anthropopathism to Himself; it denotes merely an effect, not an affection. … 24. Hatred also is in no way in God as a passion [or as something suffered], but rather this signifies three things: 1. a negation, or subtraction of the grace and benevolence of Himself by which He is compassionate on others and loves them unto eternal life; 2. the detestation of the hateful thing; 3. the decree to punish, and its execution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tilenus.html">Daniel Tilenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Ordered Arrangement of Theological Disputations held in the Academy of Sedan</cite>, vol. 1 (1607), p. 119-20</span></figcaption>

<blockquote><p>The last of God’s attributes which I shall now mention is his Dreadfulness or Terribleness, to those that are the objects of his wrath. This is the result of his other attributes, especially of his Holiness, and Governing Justice, and Truth in his comminations [threats].</p></blockquote>

</figure><figure class="quote" id="q-6f12ebe81a" data-kw="">
<blockquote><p>First, in general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that He is God. He that is not perfect in Himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and has no farther desire for supply. He who is blessed in Himself is all-sufficient for Himself. If God want or desire any thing for Himself, He is neither perfect nor blessed. To ascribe, then, affections to God properly [as his Socinian opponent does]… is to deprive Him of his perfection and blessedness. 1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose.^ The proper actings of affections lie between these two ; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. ‘He worketh all things after the counsel of his own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, p. 109</span></figcaption>

<blockquote><p>1. What is schism from the Church of England? Sure it is not a denying its doctrine, or holding anything contrary thereunto; he that holds perversum Dogma [a perverse dogma] only, is an heretic, no schismatic, as St. Jerome teaches (on Titus 3). Mr. [Matthew] Newcomen, a learned presbyterian, as I observed in my last, lets the Separatists know that their agreeing with us and the Reformed Churches in doctrines that are fundamental, their holding one Head and one Faith, does not excuse them from being guilty of breach of unity, so long as they hold not one Body, one baptism. For he cites Beza, another learned presbyterian (Annotations on 1 Cor. 1:10). So that you may be willing to subscribe to the 39 Articles, and yet be schismatics from the Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-fullwood.html">Francis Fullwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Schism Fully Opened &amp; Applied to Gathered Churches</cite>, ... (London: 1672), ch. 8, pp. 44-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>XXVII. Although we believe that the presbyterian order and parity (isotimian) or equality of pastors received among us approaches nearer to the institution of Christ and the apostles and the practice of the apostolic church, still we are unwilling to disturb anyone on this subject or to condemn the usage of the evangelical and Reformed churches, who retain the episcopal government so far, as more suitable to the genius and morals and political form of government of their people and more useful for good order (eutaxian) and the exercise of discipline. Provided there be always absent Babylonian pride and papal tyranny and this order be acknowledged as of ecclesiastical, not of divine right. But in turn we expect that equity and moderation from our brethren who differ from us here, so that they do not presume to condemn by a decretory sentence as schismatics and destitute of a lawful calling other churches differing from them and (in accordance with the liberty granted to them by Christ) using the presbyterian form of government as better adapted to their state and to the wishes and customs of their people; but should not cease to embrace them with brotherly affection that the bond of unity and fraternity may always remain unbroken and so with heart and strength joined together the work of God may be carried on to the increase of the kingdom of Christ and the destruction of Antichrist.</p></blockquote>

<blockquote><p>4. They, who truly fear the name of God [and refuse the ceremonies], are indeed scandalized by the prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified. But fiftly saith Mr. [John] Sprint, it offends the magistrate, by provoking him (persuaded and resolved as he is [as to the lawfulness of the ceremonies]) to disgrace these otherwise well deserving ministers, and to strike them with the sword of authority. Answer: Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will provoked Pharaoh the more to oppress them, or than Christ’s preaching of the truth and his abstaining from the superstitious ceremonies of the Pharisees provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed, and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>

<blockquote><p>1. We never intended these Propositions for the taking any sober man (of any of the parties whose union we endeavor) from his former principles; nor for the laying down of any middle way, in which the differing parties may accommodate, by any abatement on each or any side, of their former opinions. For we know that can be no way of general accord, without a long and full debate of all differences, with all persons or with all the leaders that can sway the rest. For if we should satisfy all that we confer with, and jointly agree upon some abatement of our opinions; we cannot expect that others should be ever the more altered or united that hear not our reasons: Or if all should hear them, yet men’s judgments will be variously wrought on, according to the degrees of their strength or weakness; or according to their former prejudice and apprehensions; and much according to the inclination of their wills, to reformation, holiness, unity and peace. We do therefore suppose in these Propositions that those whom we unite with, do still retain their differing judgments; And our business is but this: To improve those points wherein we are all agreed, for unanimous practice. Till we have opportunity to seek after an accomodation of opinions, or a conviction of each other, we resolve, by God’s help, to close in an amicable practice of so much as we do consent in… We are not such strangers to ourselves and mankind as not to know that we must unavoidably be of various opinions while we live here in imperfection, and differ in part while we know but in part. We suppose the apostle never expected that all the Corinthians should in all things have the same opinions, when he so importunately persuades them by the name of our Lord Jesus Christ, to speak the same thing, and that there be no divisions among them, but that they be perfectly joined together in the same mind, and in the same judgement, 1 Cor. 1:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 1-2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. We never intended these Propositions for the taking any sober man (of any of the parties whose union we endeavor) from his former principles; nor for the laying down of any middle way, in which the differing parties may accommodate, by any abatement on each or any side, of their former opinions. For we know that can be no way of general accord, without a long and full debate of all differences, with all persons or with all the leaders that can sway the rest. For if we should satisfy all that we confer with, and jointly agree upon some abatement of our opinions; we cannot expect that others should be ever the more altered or united that hear not our reasons: Or if all should hear them, yet men’s judgments will be variously wrought on, according to the degrees of their strength or weakness; or according to their former prejudice and apprehensions; and much according to the inclination of their wills, to reformation, holiness, unity and peace. We do therefore suppose in these Propositions that those whom we unite with, do still retain their differing judgments; And our business is but this: To improve those points wherein we are all agreed, for unanimous practice. Till we have opportunity to seek after an accomodation of opinions, or a conviction of each other, we resolve, by God’s help, to close in an amicable practice of so much as we do consent in… We are not such strangers to ourselves and mankind as not to know that we must unavoidably be of various opinions while we live here in imperfection, and differ in part while we know but in part. We suppose the apostle never expected that all the Corinthians should in all things have the same opinions, when he so importunately persuades them by the name of our Lord Jesus Christ, to speak the same thing, and that there be no divisions among them, but that they be perfectly joined together in the same mind, and in the same judgement, 1 Cor. 1:10.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 1-2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+We+never+intended+these+Propositions+for+the+taking+any+sober+man+%28of+any+of+the+parties+whose+union+we+endeavor%29+from+his+former+principles%3B+nor+for+the+laying+down+of+any+middle+way%2C+in+which+the+differing+parties+may+accommodate%2C+by+any+abatement+on+each+or+any+side%2C+of+their+former+opinions.+For+we+know+that+can+be+no+way+of+general+accord%2C+without+a+long+and+full+debate+of+all+differences%2C+with+all+persons+or+with+all+the+leaders+that+can+sway+the+rest.+For+if+we+should+satisfy+all+that+we+confer+with%2C+and+jointly+agree+upon+some+abatement+of+our+opinions%3B+we+cannot+expect+that+others+should+be+ever+the+more+altered+or+united+that+hear+not+our+reasons%3A+Or+if+all+should+hear+them%2C+yet+men%E2%80%99s+judgments+will+be+variously+wrought+on%2C+according+to+the+degrees+of+their+strength+or+weakness%3B+or+according+to+their+former+prejudice+and+apprehensions%3B+and+much+according+to+the+inclination+of+their+wills%2C+to+reformation%2C+holiness%2C+unity+and+peace.+We+do+therefore+suppose+in+these+Propositions+that+those+whom+we+unite+with%2C+do+still+retain+their+differing+judgments%3B+And+our+business+is+but+this%3A+To+improve+those+points+wherein+we+are+all+agreed%2C+for+unanimous+practice.+Till+we+have+opportunity+to+seek+after+an+accomodation+of+opinions%2C+or+a+conviction+of+each+other%2C+we+resolve%2C+by+God%E2%80%99s+help%2C+to+close+in+an+amicable+practice+of+so+much+as+we+do+consent+in%E2%80%A6+We+are+not+such+strangers+to+ourselves+and+mankind+as+not+to+know+that+we+must+unavoidably+be+of+various+opinions+while+we+live+here+in+imperfection%2C+and+differ+in+part+while+we+know+but+in+part.+We+suppose+the+apostle+never+expected+that+all+the+Corinthians+should+in+all+things+have+the+same+opinions%2C+when+he+so+importunately+persuades+them+by+the+name+of+our+Lord+Jesus+Christ%2C+to+speak+the+same+thing%2C+and+that+there+be+no+divisions+among+them%2C+but+that+they+be+perfectly+joined+together+in+the+same+mind%2C+and+in+the+same+judgement%2C+1+Cor.+1%3A10.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98An+Explication+of+some+Passages+in+the+foregoing+Propositions%E2%80%99%2C+pp.+1-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd559e12113.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d559e12113.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-implicit-faith-obedience/#:~:text=1.%20We%20never%20intended%20these%20Propositions,the%20same%20judgement%2C%201%20Cor.%201%3A10&amp;text=1.%20We%20never%20intended%20these%20Propositions%20for%20the&amp;text=and%20in%20the%20same%20judgement%2C%201%20Cor.%201%3A10" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

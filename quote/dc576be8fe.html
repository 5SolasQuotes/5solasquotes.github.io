<main class="wrap"><figure class="quote" id="q-dc576be8fe" data-kw="">
<blockquote><p>Truly, the act involves the greatest inhumanity, that the one in need of necessities seeks a loan for the relief of his life, and the other, not satisfied with the capital, contrives revenues for himself from the misfortunes of the poor man and gathers wealth. The Lord has laid a dear command on us, saying: ‘And from him who would borrow of thee, do not turn away.’ But, the avaricious person, seeing a man by necessity bent down before his knees as a suppliant, practising all humility, and uttering every manner of petition, does not pity one who is suffering misfortune beyond his desert; he takes no account of his nature; he does not yield to his supplications; but, rigid and harsh he stands, yielding to no entreaties, touched by no tears, persevering in his refusal.

Calling down curses on himself and swearing that he is entirely without money, and is himself looking around to see if he can find someone who lends money out at interest, he is believed in his lie because of his oaths, and incurs the guilt of perjury as the evil gains of his inhumanity. But, when he who is seeking the loan makes mention of interest and names his securities, then, pulling down his eyebrows, he smiles and remembers somewhere or other a family friendship, and calling him associate and friend, he says, ‘We shall see if we have any money at all reserved. There Is a deposit of a dear friend who entrusted it to us for matters of business. He has assigned a heavy interest for it, but we shall certainly remit some and give it at a lower rate of interest.’

Making such pretenses, and fawning upon and enticing the wretched man with such words, he binds him with contracts; then, after having imposed on the man the loss of his liberty in addition to his oppressing poverty, he departs. As the borrower has made himself responsible for the interest, of whose full payment he has no idea, he accepts a voluntary servitude for life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 12 on Psalm 14</cite>, 2 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 182-83.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

<blockquote><p>But it is a question of more moment: How God promises a reward to these sons of Jonadab [who are Rechabites] for obeying the command of their [fore-]father [to dwell in tents and not drink wine], and whether they had sinned if they had not obeyed this command of Jonadab; which brings in another question: Whether parents have a power to oblige their children in matters which God has left at liberty? To which I answer:

1. God might reward these Rechabites for their reverence and obedience to Jonadab their father, though these were not strictly, by the Divine law, obliged thus far to have obeyed him; as He rewarded David for his thoughts in his heart to build him a house, though it was not God’s will that He should do it; so as God’s promise of the reward does not prove their obedience in this particular to have been their duty. Admit that it remained still a matter of liberty, yet the general honour and reverence they testified might be rewarded by God.

2. Unquestionably parents have not a power to determine children in all things as to which God has left them a liberty, for then they have a power to make their children slaves, and to take away all their natural liberty. To marry or not, and to this or that person, is [a] matter of liberty. Parents cannot in this case determine their children; Bethuel, Gen. 24:58, asks Rebekah if she would go with Abraham’s servant before he would send her.

3. In matters of civil concernment they have a far greater power than in matters of religion. All souls are God’s, and conscience can be under no other dominion than that of God.

4. In civil things parents have a great power, during the nonage of children, and after also in matters which concern their parents’ good, as to command them to assist them, to help to supply their necessities, etc.

5. Parents being set over children, and instead of God to them, as it is their duty to advise their children to the best of their ability for their good; so it is the duty of children to receive their advice, and not to depart from it, unless they see circumstances so mistaken by parents, or so altered by the providence of God, as they may reasonably judge their parents, had these known or foreseen it, would not have so advised. But that parents have an absolute power to determine children in all things as to which God has not forbidden them, and that children by the law of God are obliged to an obedience to all such commands, however they may see their parents mistaken, or God by his providence may have altered circumstances, I see no reason to conclude. Jonadab had prudently advised his sons as before mentioned; they were things they might do, and which by experience they found not hurtful to them, but of great profit and advantage, and that with reference to all the ends of man’s life: herein they yield obedience, and pay a reverence to their parent; this pleases God, He promises to reward them with the continuance of their family, according to what He had said, Ex. 20:12, in the Fifth Commandment, which the apostle calls the first commandment with promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, v. 19</span></figcaption>

+to+help+to+supply+their+necessities%2C+etc.+5.+Parents+being+set+over+children%2C+and+instead+of+God+to+them%2C+as+it+is+their+duty+to+advise+their+children+to+the+best+of+their+ability+for+their+good%3B+so+it+is+the+duty+of+children+to+receive+their+advice%2C+and+not+to+depart+from+it%2C+unless+they+see+circumstances+so+mistaken+by+parents%2C+or+so+altered+by+the+providence+of+God%2C+as+they+may+reasonably+judge+their+parents%2C+had+these+known+or+foreseen+it%2C+would+not+have+so+advised.+But+that+parents+have+an+absolute+power+to+determine+children+in+all+things+as+to+which+God+has+not+forbidden+them%2C+and+that+children+by+the+law+of+God+are+obliged+to+an+obedience+to+all+such+commands%2C+however+they+may+see+their+parents+mistaken%2C+or+God+by+his+providence+may+have+altered+circumstances%2C+I+see+no+reason+to+conclude.+Jonadab+had+prudently+advised+his+sons+as+before+mentioned%3B+they+were+things+they+might+do%2C+and+which+by+experience+they+found+not+hurtful+to+them%2C+but+of+great+profit+and+advantage%2C+and+that+with+reference+to+all+the+ends+of+man%E2%80%99s+life%3A+herein+they+yield+obedience%2C+and+pay+a+reverence+to+their+parent%3B+this+pleases+God%2C+He+promises+to+reward+them+with+the+continuance+of+their+family%2C+according+to+what+He+had+said%2C+Ex.+20%3A12%2C+in+the+Fifth+Commandment%2C+which+the+apostle+calls+the+first+commandment+with+promise.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Commentary+on+Jeremiah%2C+35%2C+v.+19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70a973b5f5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/70a973b5f5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/alcohol#:~:text=But%20it%20is%20a%20question%20of,calls%20the%20first%20commandment%20with%20promise&amp;text=But%20it%20is%20a%20question%20of%20more%20moment&amp;text=the%20apostle%20calls%20the%20first%20commandment%20with%20promise" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature:

1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin.

2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually.

3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.)

4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>

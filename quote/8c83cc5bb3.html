<blockquote><p>II. It is not queried whether passive power (which is the principle of suffering from another) may be granted in God. Since this cannot be supposed without imperfection and change, it is evident that it should be removed far from him. Nor if the generation of the Son or the spiration of the Spirit is expressed in passive terms, does it immediately follow that there is in God passive power (since this denotes a mere relation [schesin] to the persons generating and spirating). But we treat only of the active power, the principle of acting on another.</p></blockquote>

<blockquote><p>The more principal Relative Attributes are in number seven: 1. Creation. 2. Providence. 3. Lordship. 4. Benignity. 5. Mercy. 6. Redemption. 7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 10-11</span></figcaption>

</figure><figure class="quote" id="q-81566d7454" data-kw="">
<blockquote><p>Still, a critic might object that anything that actualizes another thing must be undergoing change itself in the course of doing so, and thus must have potentialities which need to be actualized. Thus (so the objection might go) the very notion of a purely actual actualizer is incoherent. [1.] But one problem with this objection is that it simply begs the question. The Aristotelian argument for God’s existence claims to prove that no potential could be actualized at all unless there is a first actualizer, which is purely actual and thus devoid of potentiality. So, given that the premises of this argument are true and that the conclusion follows logically from them, it follows that the conclusion is true and therefore coherent. Accordingly, it won’t do simply to insist that the conclusion must be false; one has to show specifically either that one of the premises is false or that the conclusion does not follow. Otherwise, one ought to admit that the argument shows precisely that a purely actual actualizer really is possible (since actual) after all. [2.] Another problem is that the objection seems to be grounded in what logicians call a fallacy of accident. In our experience, when a thing changes another thing, it undergoes change itself; for instance, when your arm moves a stick, that is because your arm is itself moving in the process. Things in our experience thus actualize other things precisely by going from potential to actual themselves. But it doesn’t follow that absolutely anything that actualizes another thing must itself go from potential to actual. That is like reasoning from the premise that every president of the United States has in fact been under seven feet tall to the conclusion that absolutely anyone who could ever become president must be under seven feet tall. That does not follow, because there is no essential connection between being president and being under seven feet tall, but only an accidental or contingent connection. And the connection would remain contingent even if the facts of biology make it extremely unlikely that there will ever be a president taller than seven feet. Similarly, even if the actualizers of our experience are themselves mixtures of actual and potential, it simply doesn’t follow (for all the critic has shown) that there is an essential, as opposed to merely contingent, connection between being an actualizer and being a mixture of actual and potential. [3.] Besides, it is hardly as if the notion of a purely actual actualizer were somehow paradoxical, as (say) the notion of an “immortal mortal” would be. An “immortal mortal” would be something that both dies and does not die, which is self-contradictory. But a purely actual actualizer is something that actualizes other things without itself being actualized, and there is no self-contradiction in that idea. Furthermore, the reason the actualizers of our experience are themselves being actualized even as they actualize other things is precisely because they are limited in the various ways entailed by being mixtures of actual and potential. For example, because an arm which moves a stick is actually at one point in space and only potentially at another, its potential to be at the other point in space has to be actualized by something else if it is to get the stick to that other point in space. But something which is pure actuality, devoid of all potentiality, would have no such limitations, and thus not need to be actualized itself as it is actualizing other things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (San Francisco: Ignatius Press, 2017), end of ch. 1</span></figcaption>

ould+ever+become+president+must+be+under+seven+feet+tall.+That+does+not+follow%2C+because+there+is+no+essential+connection+between+being+president+and+being+under+seven+feet+tall%2C+but+only+an+accidental+or+contingent+connection.+And+the+connection+would+remain+contingent+even+if+the+facts+of+biology+make+it+extremely+unlikely+that+there+will+ever+be+a+president+taller+than+seven+feet.+Similarly%2C+even+if+the+actualizers+of+our+experience+are+themselves+mixtures+of+actual+and+potential%2C+it+simply+doesn%E2%80%99t+follow+%28for+all+the+critic+has+shown%29+that+there+is+an+essential%2C+as+opposed+to+merely+contingent%2C+connection+between+being+an+actualizer+and+being+a+mixture+of+actual+and+potential.+%5B3.%5D+Besides%2C+it+is+hardly+as+if+the+notion+of+a+purely+actual+actualizer+were+somehow+paradoxical%2C+as+%28say%29+the+notion+of+an+%E2%80%9Cimmortal+mortal%E2%80%9D+would+be.+An+%E2%80%9Cimmortal+mortal%E2%80%9D+would+be+something+that+both+dies+and+does+not+die%2C+which+is+self-contradictory.+But+a+purely+actual+actualizer+is+something+that+actualizes+other+things+without+itself+being+actualized%2C+and+there+is+no+self-contradiction+in+that+idea.+Furthermore%2C+the+reason+the+actualizers+of+our+experience+are+themselves+being+actualized+even+as+they+actualize+other+things+is+precisely+because+they+are+limited+in+the+various+ways+entailed+by+being+mixtures+of+actual+and+potential.+For+example%2C+because+an+arm+which+moves+a+stick+is+actually+at+one+point+in+space+and+only+potentially+at+another%2C+its+potential+to+be+at+the+other+point+in+space+has+to+be+actualized+by+something+else+if+it+is+to+get+the+stick+to+that+other+point+in+space.+But+something+which+is+pure+actuality%2C+devoid+of+all+potentiality%2C+would+have+no+such+limitations%2C+and+thus+not+need+to+be+actualized+itself+as+it+is+actualizing+other+things.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God+%28San+Francisco%3A+Ignatius+Press%2C+2017%29%2C+end+of+ch.+1&amp;url= <blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>

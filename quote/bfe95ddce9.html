<blockquote><p>Second, it is asked whether their rites are as it were idolatry. That it seems so:

1. From the fact that it is said in Gal. 5:1, on the words, “Do not again be entangled with the yoke of bondage,” the Gloss says: “This bondage is not lighter than that of idolatry,” because the servitude of the legal observances is likened to idolatry in burden.

2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology</cite>, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 2, ‘Whether the Rite of the Jews is as it were Idolatry’</span></figcaption>

</figure><figure class="quote" id="q-491e8e6040" data-kw="">
<blockquote><p>It is reported, as some write, that up to a hundred thousand men and women of both sexes migrated to the Turks in those times. Moreover, it is handed down to memory that the Turkish Emperor was accustomed to say that he marveled at the stupidity of Christian kings, in that they preferred to expel such a great multitude—whom, if they did not wish to kill, they could nevertheless have retained in the place of slaves to perform useful and suitable services—rather than retain them for their own profit, according to the Horatian precept: When you can sell a captive, do not kill him; he will serve usefully.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/balthasar-meisner.html">Balthasar Meisner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober Philosophy, that is, a Pious Consideration of Philosophical Questions occasionally arising in theological controversies, which the Calvinists have raised against the Orthodox</cite>, (1623), pt. 3, sect. 2, Political Questions, ch. 2, On the Magistrate &amp; his Office, Question 4, Should Jews be tolerated in a Christian Republic, and how? tr. AI by The Faith Received | “Whether and how Jews are to be tolerated in a Christian republic? When a deliberation is instituted concerning the Jews, two extremes in particular must be studiously avoided: The one is rash expulsion; the other is licentious toleration. For they are neither to be expelled indiscriminately, nor are they to be tolerated without limit; both of which must be declared further in a few words: | 1. That they are not to be universally and indiscriminately proscribed and driven out from the Christian world, some suppose can be persuaded by the following arguments: | 6. On account of the inconvenience; because if the Jews find no hospitality among us, they will flock in crowds to the Turks, and will assist our enemies partly with money, and partly with their counsels and artifices. Philippus Camerarius treats this question in Century 1, Medit. Histor., ch. 89, where, among other things, he writes thus:</span></figcaption>

<blockquote><p>I piously and gladly believe the perpetual virginity of Mary unto death (hear, impostor); yet this pertains nothing to our mystery of salvation. It suffices for us to believe what is, and is narrated by the evangelists, that our Savior was conceived by the Holy Spirit and born of the Virgin Mary.” ‘Preface’ to the New Testament to the most illustrious Prince of Condé, etc. If one who speaks thus dared to thrust his most unclean snout into Mary’s virginity, what shall I say of the great Basil, who in the homily on the Nativity of the Lord says, whether after the mystery of the incarnation the Virgin bore children or not, παρὰ ταῦτα δὲ οὐδὲν δοξάζομεν πᾶσι, it in no wise injures the business of piety. For so long as it was necessary to serve the dispensation, virginity was necessary. “But what afterwards followed,” he says, “σιωπῇ παραδοτέον τοῖς λόγῳ οὐ μυστήρια καταλείψομεν [we shall leave in silence to those who speak the mysteries which cannot be expressed in words], nor is it necessary to inquire anxiously into what pertains to the nature of this mystery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Works</cite>, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | The Jews did not so highly esteem virginity that we should therefore exterminate it; and therein you lie, as you are wont. We praise chaste virginity, but compel no one thereto who would rather marry than fall into the peril of incontinence. You accuse Beza that he dared to thrust his most unclean snout into the very virginity of Mary the mother of God, and to call into doubt whether, after childbirth, the Virgin persevered [in virginity]. You keep to the old way, that is, you calumniate. The words of Beza which you cite in the margin of the preface are these:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I piously and gladly believe the perpetual virginity of Mary unto death (hear, impostor); yet this pertains nothing to our mystery of salvation. It suffices for us to believe what is, and is narrated by the evangelists, that our Savior was conceived by the Holy Spirit and born of the Virgin Mary.” ‘Preface’ to the New Testament to the most illustrious Prince of Condé, etc. If one who speaks thus dared to thrust his most unclean snout into Mary’s virginity, what shall I say of the great Basil, who in the homily on the Nativity of the Lord says, whether after the mystery of the incarnation the Virgin bore children or not, παρὰ ταῦτα δὲ οὐδὲν δοξάζομεν πᾶσι, it in no wise injures the business of piety. For so long as it was necessary to serve the dispensation, virginity was necessary. “But what afterwards followed,” he says, “σιωπῇ παραδοτέον τοῖς λόγῳ οὐ μυστήρια καταλείψομεν [we shall leave in silence to those who speak the mysteries which cannot be expressed in words], nor is it necessary to inquire anxiously into what pertains to the nature of this mystery.”

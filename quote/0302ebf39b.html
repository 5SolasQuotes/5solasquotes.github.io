<main class="wrap"><figure class="quote" id="q-0302ebf39b" data-kw="">
<blockquote><p>When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. When we say by faith only, this opposes all other graces of the same order, but not the merits of Christ or the efficacy of God’s grace; the apostle, Rom. 4, makes it all one to prove a man justified by grace, Christ and by faith. It is to be considered as alone in the act of justification, but not in the subject justified; therefore that is a reproach cast on Protestants to call them Solifidians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’, pp. 528-29</span></figcaption>

<blockquote><p>Mr. Anthony Wotton, a man, by Mr. Walker’s own confession, of special note for his piety, life and learning, while he lived, which both the University of Cambridge and the City of London are able also to give ample testimony unto;” – Mr. Anthony Wotton’s Defence, Preface, p. 3 Wiki: “In 1611 George Walker (1581?-1651) accused him of Socinianism; this led to a ‘conference’ of learned divines, which ended in Wotton’s vindication. The controversy went on till 1615, and in 1641, long after Wotton’s death, Walker repeated his accusations. This provoked Mr. Anthony Wotton’s Defence (Cambridge, 1641, published under the name of Thomas Gataker, who, however, only wrote the postscript, the Defence being by Wotton’s son, Samuel… Walker replied in A True Relation of the Chief Passages between Mr. Anthony Wotton and Mr. George Walker in … 1611, and in the Years next following … till 1615 (London, 1642, 4to).</p></blockquote>

</figure><figure class="quote" id="q-941ab42d00" data-kw="">
<blockquote><p>Mr. Wotton in his papers which he dispersed in this city, and which he acknowledged to be his own when I [Walker] brought them to his face before Mr. Gataker and eight other grave ministers, does deny the imputation of the whole obedience of Christ, to the Law of God; both active and passive, both jointly and severally. He affirms that there is no end or use whatsoever of the imputation of Christ his righteousness for justification. He renounces the law in whole and part, performed by ourselves, or any other in our stead for our justification… he sets up faith, even the act of believing for righteousness, affirms that it is said to be imputed in a proper sense without a trope, and serves for all purposes in our justification under the Gospel, as perfect righteousness of works performed to the whole law did for man’s justification in the first covenant. He denies the punishment of our sins in Christ, and the satisfaction which in Him our head &amp; surety was made to God’s justice for purchase of our pardon… These and such like speeches I condemned for Socinian heresy and blasphemy, as Beza, Paraeus and Lubertus had done before me, and for this Mr. Gataker did deride me, when I gave in my charge against Mr. Wotton 27 years ago, and now [Gataker] blames it in me as falsehood and dishonesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton</cite>, A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton (1642) 36 pp., pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

<main class="wrap"><figure class="quote" id="q-ad804f504d" data-kw="">
<blockquote><p>John 6:44 says: “No one can come to Me unless the Father … draws him.” These testimonies show very clearly that unregenerate nature has in itself and of itself no strength, power, or faculty whatever which it may contribute of itself in order that it may cooperate with grace to some extent through its own powers, to begin and to effect spiritual actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on Free Will, Sec. III</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/free-will.html">Free will</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-376e0c9c24" data-kw="">
<blockquote><p>These, whatsoever the Papists say to the contrary, as soon as ever they do but begin to heave and stir in our breasts, are truly sins; and do, in their measure, pollute and defile the soul: for the soul of man is like a clear mirror, upon which if you only breathe, you sully it, and leave a dimness upon it; so, truly, the very first breathings of an evil thought and desire in our souls, do sully their beauty, and dim their lustre, and render the image of God less conspicuous in them than it was before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, The Tenth Commandment</span></figcaption>

</figure><figure class="quote" id="q-6c7ba3e091" data-kw="">

</figure><figure class="quote" id="q-27a39a0ec1" data-kw="">
<blockquote><p>Protestants also believe that lust or concupiscence in the regenerate, as including a remaining tendency towards what is sinful, and the first or earliest motions of this tendency in the heart, though not deliberately consented to and followed out, is itself truly and properly sinful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, ch. 19 (The Doctrine of the Fall)</span></figcaption>

</figure><figure class="quote" id="q-72b7111168" data-kw="">
<blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Advertisement to all Favorers of the Roman Religion</cite></span></figcaption>

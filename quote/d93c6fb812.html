<main class="wrap"><figure class="quote" id="q-d93c6fb812" data-kw="">
<blockquote><p>Seest thou what advantage is come of fear? If fear were not a good thing, fathers would not have set tutors over their children; nor lawgivers magistrates for cities. What can be more grievous than hell? Yet nothing is more profitable than the fear of it; for the fear of hell will bring us the crown of the kingdom. Where fear is, there is no envy; where fear is, the love of money does not disturb; where fear is, wrath is quenched, evil concupiscence is repressed, and every unreasonable passion is exterminated.

And even as in a house, where there is always a soldier under arms, no robber, nor house-breaker, nor any such evil doer will dare to make his appearance; so also while fear holds possession of our minds, none of the base passions will readily attack us, but all fly off and are banished, being driven away in every direction by the despotic power of fear.

And not only this advantage do we gain from fear, but also another which is far greater. For not only, indeed, does it expel our evil passions, but it also introduces every kind of virtue with great facility. Where fear exists, there is zeal in alms-giving, and intensity of prayer, and tears warm and frequent, and groans fraught with compunction. For nothing so swallows up sin, and makes virtue to increase and flourish, as a perpetual state of dread. Therefore it is impossible for him who does not live in fear to act aright; as, on the other hand, it is impossible that the man who lives in fear can go wrong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies Addressed to the People of Antioch, Concerning the Statutes</cite>, (387), 15.2 in Nicene and Post-Nicene Fathers 2, 9: 439.</span></figcaption>

</figure><figure class="quote" id="q-f023310025" data-kw="">
<blockquote><p>This whole law is generally distributed into three parts; — first, the moral; secondly, the ceremonial; thirdly, the judicial part of it. And, indeed, there is no precept but may conveniently be referred unto one or other of these heads, as they are usually explained.

That which is commonly called the moral law, the Scripture terms הַדְּבָרִֽים׃ עֲשֶׂ֖רֶת הַבְּרִ֔ית דִּבְרֵ֣י, Exodus 34:28, “The words of the covenant, the ten words,” from whence is the Greek δεκαλογος, or the law of ten words or precepts; all which in their substance are moral, and universally obligatory to all the sons of men.

That part of the law which the Scripture calls הַמִּשְׁפָּטִ֔ים, “judgments,” Exodus 21:1, determining of rights between man and man, and of punishments upon transgressors, with especial reference unto the interest of the people in the land of Canaan, is by us usually termed the judicial law;and the institutions of ceremonial worship are most commonly expressed by the name of חקים, the whole system whereof is termed the law ceremonial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations on the Epistle to the Hebrews</cite>, (1668), Ex. 20, § 2 in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (1667; 7 vols, Edinburgh: Johnston and Hunter, 1854), 1: 480-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-4140a7c356" data-kw="">
<blockquote><p>That thou keep holy.] God sanctified it by instituting it, and man sanctifies it by observing it according to that institution.

This sanctifying is, [1.] In cessation from earthly labour. [2.] In their stead, to be wholly possessed and taken up with spiritual exercise, both in private and in public. The former is necessary for the being of the latter; that cessation, for this work; and the latter is necessary for the due being of the former: we cannot be vacant and entire for spiritual service, unless we cease from bodily labour; and this cessation or resting from bodily labour, cannot be a sanctifying of this day unto God, unless it be accompanied with spiritual exercise.

In the following words, that part only is expressed, the rest or abstinency from work; but the other is supposed as the end of this, — that they shall not do their own works, that they may attend upon God’s, His solemn worship. And this is implied in that word, It is the Sabbath of the Lord thy God; both of His own appointing, and for this end, this work, that He may be more solemnly worshipped. And likewise, the antithesis that seems to be in that word, In six days thou shalt do all thy work, imports, that on the seventh thou shalt do God’s.

Not so called, that any benefit arises to Him by our service; no, our goodness reaches Him not at all. Psal. xvi. 2. In that way, that worship, which is far above ours, that of the angels, can add nothing to Him, for He is infinite. Even this work. Sabbath-work, and all our prayers and praises offered to Him, and all performances of His worship, they are our works, in respect of the gain and advantage of them; it comes all back to us. But His worship is His work objectively. He is the object of it; and directively, by particular prescription from Himself; and, if you will add, effectively too, never done aright but by His own grace and assistance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 380-81.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ce12967c23" data-kw="">
<blockquote><p>But, on the contrary, whereas the malicious craft of Satan and the prevalent power and rage of mankind have combined and been set at work to the ruin and utter suppression of this book, proceeding sometimes so far as that there was no appearing way for its escape; yet, through the watchful care and providence of God, sometimes putting itself forth in miraculous instances, it hath been preserved unto this day, and shall be so to the consummation of all things.

The event of that which was spoken by our Saviour, Matt. v. 18, doth invincibly prove the divine approbation of this book, as that doth its divine original, “Till heaven and earth pass, one jot or one tittle shall in no wise pass from the law.” God’s perpetual care over the Scripture for so many ages, that not a letter of it should be utterly lost, nothing that hath the least tendency towards its end should perish, is evidence sufficient of his regard unto it.

Especially would it be so if we should consider with what remarkable judgments and severe reflections of vengeance on its opposers this care hath been managed, instances whereof might easily be multiplied. And if any will not ascribe this preservation of the books of the Bible, not only in their being, but in their purity and integrity, free from the least just suspicion of corruption, or the intermixture of any thing human or heterogeneous, unto the care of God, it is incumbent on him to assign some other cause proportionate to such an effect, whilst it was the interest of heaven and the endeavour of earth and hell to have it corrupted and destroyed.

For my part, I cannot but judge that he that seeth not an hand of divine Providence stretched out in the preservation of this book and all that is in it, its words and syllables, for thousands of years, through all the overthrows and deluges of calamities that have befallen the world, with the weakness of the means whereby it hath been preserved, and the interest, in some ages, of all those in whose power it was to have it corrupted, — as it was of the apostate churches of the Jews and Christians, — with the open opposition that hath been made unto it, doth not believe there is any such thing as divine providence at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reason of Faith; or, An Answer unto that Inquiry, “Wherefore we Believe the Scripture to be the Word of God;” with the Causes and Nature of that Faith wherewith we do so</cite>, (London, 1677) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), iv, 24.</span></figcaption>

<blockquote><p>…but [nonconformists] will keep all loving correspondence with them [parish churches], and seasonably sometimes communicate with them to show their principles by their practice. For the benefit of Christian love and concord, may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They prefer their own manner of worshipping God, as better than the Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

<blockquote><p>Images are fair and beautiful; the churches are decked and beset with them; but they are a cloak of shame; they are set in place of teachers; the priests are ignorant, and live in idleness, and send the people to learn at pictures; they call them laymen’s books. Yet what profiteth the image? saith Habakkuk, for the maker thereof hath made it an image, and a teacher of lies. And Jeremiah saith (chap; x.), “The stock is a doctrine of vanity.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-706d9201a5" data-kw="">
<blockquote><p>§24. Question 24: May we pray for the destruction of the enemies of Christ, or of the Gospel, or of the king? Answer: Not with respect to that which is called God’s antecedent will; for so we ought first to pray for their conversion (and restraint till then). But with respect to that called his consequent will, we may: that is, we must first pray that they may be restrained and converted, and secondly that, if not, they may be destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: White, 1673), pt. 2, Christian Economics, ch. 23, title 2, Some Questions about Prayer Answered, p. 595</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>(2)… Although God wills some things voluntas signi [will of sign, or the revealed will], like the repentance of the reprobate, the faith of Judas, the non-slaying of Christ, which He nevertheless anything but decreed by voluntas beneplaciti [will of good-pleasure, or decree] as things that would never happen; and He wills some things voluntas beneplaciti, which He can anything but will voluntate signi, like the selling of Joseph or the slaying of Christ. (3) But these wills are not contrary, because they are not concerned with the same things, nor is their connection and reference the same. The object of the beneplacitum [good-pleasure of decree] is an existent eventuating [causing to become an event] in the nature of things, which is to have or not to have an actual existence, be it a good or a bad existent [existence], consonant or not with the voluntas signi. But the object of the voluntas signi is approval of the morally good and honorable or disapproval of the unjust and wicked.</p></blockquote>

<blockquote><p>Hence is that, Aquinas, Valentia, Durandus and Suarez† want the will of God divided thus: it is the will improperly and the division is by a homonym in homonyms, so that the will of sign is the will improperly. Thus Durand, on folio 13, ‘A command,’ he says, ‘is not directly and always a sign that the one commanding wants the thing commanded to be, but only that He wants to oblige the subject.’ † Aquinas, in pt. 2, q. 9, art. 11; Valentia, tome 1, disp. 1, q. 19, punc. 2; Durandus, bk. 1, dist. 48, q. 3; Suarez, tome 1, Of the Attributes of God, bk. 3, ch. 8.</p></blockquote>

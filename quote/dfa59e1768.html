<main class="wrap"><figure class="quote" id="q-dfa59e1768" data-kw="">
<blockquote><p>That the truth of the gospel. There was no danger that Paul would be deprived of his liberty even by yielding to them; but the example would have done harm to others, and therefore he prudently inquired what was expedient. This shows us how far offenses must be avoided, and points us to edification as the object which ought to be kept in view in all matters of indifference. The amount, is this: “We are the servants of the brethren, but still keeping in view that we all serve the Lord, and that the liberty of our conscience shall remain unimpaired.” When false brethren wished to bring the saints in to bondage, it was their duty not to yield to them. The truth of the gospel denotes its genuine purity, or, which means the same thing, its pure and entire doctrine. For the false apostles did not altogether set aside the gospel, but mixed up with it their own notions, so as to give it a false and disguised aspect, which it always has when we make the smallest departure “from the simplicity that is in Christ.” (2 Cor 11:3.) With what effrontery then will the Papists boast that they possess the gospel, which is not only corrupted by many inventions, but more than adulterated by many wicked doctrines? Let us remember that it is not enough to retain the name of the gospel, and some kind of summary of its doctrines, if its solid purity do not remain untouched. Where are the men who, by pretended moderation, endeavor to bring about a reconciliation between us and the Papists? as if the doctrine of religion, like a matter affecting money or property, could be compromised. With what abhorrence would such a transaction have been regarded by Paul, who affirms that it is not the true gospel, if it is not pure!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cab4783fca" data-kw="">
<blockquote><p>Apostles and members-dissolved are not fixed members of a single congregation, and yet members they must be of the visible, Church-catholic: sure it is no paradox, that the Apostles are such members, for they had right to all the seals in all congregations; Therefore, they must by this reason be members and no members: the like may be said of godly professors-sojourners [travellers], of these baptized by John Baptist, Mt. 3, by Peter, Acts 10, by Paul, Acts 16. For if we say that professors are only members of a particular congregation, then we confine a brother to be gained only to one congregation: ‘let all the rest perish: they are not my brethren.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, ... (1658), bk. 1, ch. 25; p. 159</span></figcaption>

</figure><figure class="quote" id="q-0b1f617f85" data-kw="">
<blockquote><p>Up to this time [1573], the prevailing practice was that only ministers signed the Belgic Confession. In 1574, however, the provincial Synod of Dordrecht decided that ‘it would be useful that the elders and deacons also subscribe to the Netherlands Confession, and to the articles of the [Emden] Synod.’ For this purpose, it was considered advisable that a copy of the confession and of the articles of the Emden Synod be kept by all consistories [sessions] or at least by all classes [presbyteries]. For the first time, schoolteachers were also required to sign the confession and to submit to the ‘discipline’ or articles of the Emden Synod. The idea of elders’ and deacons’ subscribing was not immediately accepted in all the churches. For example, at Delft the elders and deacons refused to sign the confession, while at Middelburg they did. Gaspar van der Heyden, pastor at Middelburg and president of the recent Dordrecht Synod, on 16 November 1574 wrote to Delft pastor Arent Cornelisz: ‘Our elders and deacons have signed the Confession of Faith and the articles of the [Emden] synod; I certainly wish that yours had done the same. How would they who now refuse to sign the Confession with ink seal it with their own blood?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal</cite></span></figcaption>

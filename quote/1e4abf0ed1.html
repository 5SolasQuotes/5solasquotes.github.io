<main class="wrap"><figure class="quote" id="q-1e4abf0ed1" data-kw="">
<blockquote><p>Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17</cite>, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.”

<blockquote><p>Mr. Reynolds–The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se [valuable in itself], of sufficient value to all, nay, ten thousand worlds. There are two Adams, one a fountain of misery, and the other of mercy… To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>eds. Alexander Mitchell &amp; John Struthers, Minutes of the Sessions of the Westminster Assembly of Divines (London: Blackwood &amp; Sons, 1874)</cite>, pp. 153-54</span></figcaption>

</figure><figure class="quote" id="q-da5636a070" data-kw="">
<blockquote><p>That Christ Jesus by His death did bring forth salvation and reconciliation only for the elect (John 15:13; Rom. 8:32–34; 5:11; 3:25), which were those which God the Father gave Him (Job 17:2; 6; 37); and that the gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever-blessed God (Matt. 16:16; Luke 2:26; John 6:9; 7:3; 20:31; 1 John 5:11), filled with the perfection of all heavenly and spiritual excellencies, and that salvation is only and alone to be had through believing in His name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 21</span></figcaption>

</figure><figure class="quote" id="q-6337527b5a" data-kw="">
<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible (London, 1631)</cite>, vol. 1, pp. 495–98 on 1 Tim. 2:4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

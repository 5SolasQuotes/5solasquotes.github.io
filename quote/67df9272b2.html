<main class="wrap"><figure class="quote" id="q-67df9272b2" data-kw="">
<blockquote><p>With respect to the kingdom of Antichrist. This seem, to be the master piece of all the contrivances of the devil against the kingdom of Christ, and is evidently so spoken of in scripture, and therefore Antichrist is the man of sin, or that man of sin, 2 Thes. ii. 3. He is so called emphatically, as though he was so eminently. So he is called Antichrist, which signifies the opponent or adversary of Christ. Not that he is the only opponent of Christ; there were many others besides him.

The Apostle John observes, that in his days there were many Antichrists. But yet this is called the Antichrist, as though there were none but he, because he was so eminently, and above all others. So this contrivance of the devil, is called the mystery of iniquity, 2 Thes. ii. 7. We find no enemy of Christ one half so much spoken of in the prophecies of Revelation as this; and the destruction of no enemy is spoken of as so glorious and happy for the church. The craft and subtilty of the devil, above all appears in this work of his; as might be shown, were it not that is would consume too much time.

This is a contrivance of the devil to turn the ministry of the Christian church into a ministry of the devil, and to turn these angels of the churches into fallen angels, and so into devils. In the tyranny, and superstition, and idolatry, and persecution, which he sets up, he contrives to make an image of ancient Paganism, and more than to restore what was lost in the empire by the overthrow of Paganism in the time of Constantine: so that by these means the head of the beast, which was wounded unto death in Constantine, has his deadly wound healed in Antichrist, Rev. xiii 3. The dragon, that formerly reigned in the Heathen Roman empire, being cast out thence, after the beast with seven heads and ten horns rises up out of the sea, gives him his power, and seat, and great authority; and all the world wonders after the beast.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), p. 216.</span></figcaption>

<blockquote><p>Argument 2: If the common senses of sound men (or their sensible apprehensions) be infallible, then the Pope with his pretended General Council is fallible: But the common senses of sound men are infallible: Therefore, etc. I know not how we should come nearer hand with a Papist, nor to plainer dealing than to argue from common sense. And as to the antecedent, either sense is infallible, or it is not: If it be, I have that I seek. If not, then mark what follows: 1. Then no man can be sure that the Christian religion is true: For the proofs of it all vanish, if sense be not infallible.</p></blockquote>

<blockquote><p>Peter cannot be called the foundation of the church, since no other foundation can be laid besides Christ (1 Cor. 3:11), and he himself is a member of the church, who ought to be built on Christ with the others as he himself teaches (1 Pet. 2:5, 6). Nor if the church is said to be built upon the foundation of the apostles, is this to be understood with respect to their persons, but with respect to their doctrine.</p></blockquote>

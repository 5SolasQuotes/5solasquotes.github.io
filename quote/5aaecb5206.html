<main class="wrap"><figure class="quote" id="q-5aaecb5206" data-kw="">
<blockquote><p>That it is a moral ordinance of God the Supreme Governor of the Universe; that it originates in natural principles irrespective of the mediatorial system; that it is put under the supremacy of the Redeemer, who has “given to be the Head over all things to the Church,” and that all its departments should be regulated according to the principles of social morality, developed in the word of God, – are the general views which we have been constituted to adopt, avow, maintain, and propagate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-macindoe.html">Peter MacIndoe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of the Reformed Presbyterian Church, from attacks in “Statement of the Berwickshire Bible Society”</cite>, (Edinburgh, 1835), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56c9eecbf0" data-kw="">
<blockquote><p>They [Brownists] except against our ministers because they receive their ordination from bishops. To which I answer: We have our ordination from Christ by bishops and clergymen; and for this kind of ordination by bishops and presbyters we have the universal consent of the primitive Church; by St. Paul, Timothy, and Titus were ordained. And this has been the practice of all the Christian Churches of the universe until the time that Anabaptists crept into the world. But they will allege that we have been ordained by Antichristian bishops, and therefore they conclude every action done by our ministers to be Antichristian. To which I answer: Why is not the ordination that our forefathers had from Antichristian bishops as effectual as the baptism that was administered by them to our forefathers? Did ever any Reformed Church rebaptize them that were baptized by them? And why should our ministers be reordained more than rebaptized? Indeed our ministers being ordained by bishops and that by Protestant bishops, such as Cranmer, Latimer and Ridley, who were holy martyrs, who renounced all superstition; what exceptions can be taken against them? Neither can they find any shelter under that noted text, ‘neglect not the gift that is in thee by the imposition of the hands of the presbytery,’ which learned Mr. [John] Calvin expounds not of the men, but of the office, following herein Jerome, Anselm, Haimo, Lyra, referring it to the gift given him and to the bishops and presbyters, which has been the practice of the Church of England and all Christian Churches in the world until the Anabaptists. To conclude, let the Brownists confess our bishops to be but Christians, which they cannot deny, and the ordination of our ministers will be lawful by their own rules: for if the ordination of their ministers by plebeian artificers be lawful, how much more is the ordination of our ministers by bishops and learned ministers, qualified with learning and wisdom and set apart to do the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times</cite>, (London: Wilson, 1645), ‘Of the Brownists’, 15. ‘Except against our Ordination’, p. 60</span></figcaption>

<blockquote><p>Several of them [common Scottish people] were taught to believe, and urge a position, in itself of most dangerous consequences, that it is unlawful to hear a minister who was guilty of failures in his entry upon ministerial work, or mistakes in his management of it. I wish the remains of this dangerous position may be entirely out from among us;</p></blockquote>

<blockquote><p>We shall now be prepared to understand how the recognition, that the two worlds exist and have existed side by side from the beginning, enables the author of Hebrews to solve the chief problem of the history of redemption and revelation. For it is in Hebrews that the first age and the first world are identified with the first covenant. When, therefore, the question is raised, how the Old Covenant can be identical in substance with the New, what is the common essence, that notwithstanding the great progress from one to the other, makes them two coherent stages in the expression and conveyance of the same spiritual reality, the answer is immediately forthcoming: the same world of heavenly spiritual realities, which has now come to light in the Person and work of Christ, already existed during the course of the Old Covenant, and in a provisional typical way through revelation reflected itself in and through redemption projected itself into the religious experience of the ancient people of God, so that they in their own partial manner and measure had access to and communion with and enjoyment of the higher world, which has now been let down and thrown open to our full knowledge and possession. In other words, the bond that links the Old and the New Covenant together is not a purely evolutionary one, inasmuch as the one has grown out of the other; it is, if we may so call it, a transcendental bond: the New Covenant in its preexistent, heavenly state reaches back and stretches its eternal wings over the Old, and the Old Testament people of God were one with us in religious dignity and privilege; they were, to speak in a Pauline figure, sons of the Jerusalem above, which is the mother of all. This is a profounder solution than is offered in the well-known formula of Augustine: “The New Testament is latent in the Old, the Old Testament lies open in the New.” More profound because, together with the statement of the fact, it gives the reason for the fact. The latent existence of the verities and potencies of the Christian religion in the old dispensation are due to no other cause than that the Christian religion lived even at that time as redemptive truth and redemptive power in the heavenly world and from there created for itself an embryonic form of existence in the life of Israel. The writer of Hebrews would have subscribed to the belief that Christianity is as old as Abraham and as old as Moses, nay as old as Paradise, because it is heaven-born and not the child of earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos</cite>, ed. Richard B. Gaffin Jr. (Phillipsburg, NJ: P&amp;R Publishing, 2001), 199–200.</span></figcaption>

<blockquote><p>IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.4 (p. 575, modified according to the 1679 edition).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

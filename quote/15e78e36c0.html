<blockquote><p>Conclusion 2. That a real and approved holiness is a sure-note that the error which they hold is not a damning, destroying error. I say, though the holiness of those men that maintain an opinion, be not a sure note that the opinion they maintain is a truth, yet it is a certain evidence that it is not an undoing and destructive error. Christ says that the elect shall not be deceived, Mt. 24:24, that is, though they may be carried aside with some sinful, yet they shall not be drawn away with undoing errors. And we have all the harmony of Scripture for that: He tells us that they who do his will, shall know his doctrine, that we shall all be taught of God, that we shall hear his voice, and shall not follow the voice of strangers, and that we have received an anointing of the holy One, whereby we know all things. All which places are to be understood of necessary truths, not accessory; of truths that are essential and fundamental, not circumstantial: and it proves fully to us that God will never give up his holy ones to undoing errors. That’s the second answer; that holiness is a sure note, that the opinions which they hold (though an error) yet it is not a damning and destroying error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 166</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-372d8141f2" data-kw="">
<blockquote><p>But as for those doctrines which treat of the eternal decrees of God, which set out the particular objects of predestination, and explain how the two natures are united in the Person of Jesus Christ, which unfold the mystery of the Trinity, and describe how the Holy Spirit acts upon the hearts of the faithful, and other points of the like abstruse nature, I will maintain that though learned men may say a great many fine things upon these subjects, which may appear very agreeable to reason, yet are they not to be weighed in the same balance with those truths which are clearly revealed in the Word of God. And therefore we ought only so far to assent to them, as to be ready to give them up, and renounce them whenever it appears, and is plainly proved, that they are false; for otherwise we lay a foundation for division.</p></blockquote>

</figure><figure class="quote" id="q-d559e12113" data-kw="">
<blockquote><p>1. We never intended these Propositions for the taking any sober man (of any of the parties whose union we endeavor) from his former principles; nor for the laying down of any middle way, in which the differing parties may accommodate, by any abatement on each or any side, of their former opinions. For we know that can be no way of general accord, without a long and full debate of all differences, with all persons or with all the leaders that can sway the rest. For if we should satisfy all that we confer with, and jointly agree upon some abatement of our opinions; we cannot expect that others should be ever the more altered or united that hear not our reasons: Or if all should hear them, yet men’s judgments will be variously wrought on, according to the degrees of their strength or weakness; or according to their former prejudice and apprehensions; and much according to the inclination of their wills, to reformation, holiness, unity and peace. We do therefore suppose in these Propositions that those whom we unite with, do still retain their differing judgments; And our business is but this: To improve those points wherein we are all agreed, for unanimous practice. Till we have opportunity to seek after an accomodation of opinions, or a conviction of each other, we resolve, by God’s help, to close in an amicable practice of so much as we do consent in… We are not such strangers to ourselves and mankind as not to know that we must unavoidably be of various opinions while we live here in imperfection, and differ in part while we know but in part. We suppose the apostle never expected that all the Corinthians should in all things have the same opinions, when he so importunately persuades them by the name of our Lord Jesus Christ, to speak the same thing, and that there be no divisions among them, but that they be perfectly joined together in the same mind, and in the same judgement, 1 Cor. 1:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 1-2</span></figcaption>

</figure><figure class="quote" id="q-9408b2336d" data-kw="">
<blockquote><p>II. In dealing with adversaries, or others, about controverted truths, it were good for their conviction to make use of some known, uncontroverted principle, and thence deduce what they would have received; for where there is no agreement in any common notion or principle, there is no hope of getting truths received: therefore Paul, in debating this matter [Romans 7:1-3], doth wisely lay down, in the first place, what they received as truth, and did not doubt of saying, Know ye not; which is as much as if he had said, You know this, and cannot deny it, viz. That the law hath dominion over a man, as long as he liveth. III. It is not the most gaining way, in dealing with adversaries of truth, to contemn their parts and abilities, and to speak of them in an undervaluing manner; but rather on the contrary, to acknowledge their parts and knowledge, and make use of that for their conviction, as the apostle doth here; he does not lightly them, but says, they knew the law. IV. In all our attempts ot gain folks to the truth, we should still labour to gain their affection; and we should so carry ourselves, as they may be convinced of our love and tender respect towards them, and that we seek not to shame, or rub any affront on them, but intend, out of a friendly and brotherly manner, to gain them; for Paul doth insinuate himself thus upon these here, by stiling them brethren: thus he laboured to conciliate their favour.</p></blockquote>

rmalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=II.%20In%20dealing%20with%20adversaries%2C%20or,he%20laboured%20to%20conciliate%20their%20favour&amp;text=II.%20In%20dealing%20with%20adversaries%2C%20or%20others%2C%20about&amp;text=brethren%3A%20thus%20he%20laboured%20to%20conciliate%20their%20favour" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

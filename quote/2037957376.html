<blockquote><p>…focuses on the relationship of theology and philosophy as formulated in the thought of three key Dutch Reformed theologians… All three were at the forefront of the philosophical debates that swirled in the Dutch Republic in the seventeenth and eighteenth centuries, especially instigated by the arrival of Renee Descartes (1596–1650) in the Netherlands in 1628… By studying these three theologians, Goudriaan “seeks to understand better how Dutch Reformed theology integrated and responded to philosophical views in the period from 1625 through 1750. Voetius, professor of theology at the University of Utrecht, was initially the premier defender against the Cartesian encroachment upon the Dutch Reformed Church that sought to undermine both her theology and piety. This mantle would be taken up by his successor at the university, Petrus van Mastricht. As might be expected, Goudriaan demonstrates that Voetius and Mastricht were in essential agreement with one another in their theology and polemic against Cartesianism as they engaged it from distinctly Reformed premises and commitments. Goudriaan deals successively with specific loci where the relationship between theology and philosophy was acutely tried and tested, including: reason and revelation; creation and the physical world; the providential rule of God over the world; anthropological issues of the relationship between the soul and the body; and divine and natural law. He notes that both Voetius and Mastricht had aligned themselves with the older Aristotelian philosophy against the newer Enlightenment philosophy, yet the debate was not waged over whose philosophical system was correct. This in itself would have been a losing concession, for it was precisely their aim that Reformed theology not be corrupted by alien philosophical concepts or categories that ultimately undermined Scriptural authority and teaching. Philosophy was instead viewed by them as an instrument or servant of the most basic Reformed principle, namely, the authority of Scripture as their principium cognoscendi. For them Scripture was not subordinated to philosophy, but philosophy to Scripture. This starting point alone accounted for the full-orbed nature of creation with its rich diversity, including spirits and bodies, heaven and earth, which Cartesian dualism could not account for or bring into any real, dynamic relation. Because of this common commitment to the Reformed principle of Scripture’s authority, Goudriaan observes, “the theological development from Voetius to Driessen supports the broader claim that biblical Christianity outlives the philosophical and conceptual apparatus with whose help it is explained.” To put it another way, philosophy was not the indispensable lord of theology, but its disposable handmaiden—it would, therefore, continue even when philosophies changed or failed.” – Daniel Ragusa Ariew, Roger – Descartes Among the Scholastics in History of Science &amp; Medicine Library, vol. 20 Pre (Brill, 2011) Schlebusch, J.A. – Cartesianism &amp; Reformed Scholastic Theology: A Comparative Study of the Controversy a Master’s thesis (Univ. of the Free State, South Africa, 2013) 160 pp. Includes a translation of two chapters of Christopher Wittich’s Two Dissertations in ch. 3, and of two chapters of Peter van Mastricht’s Vindication of the Truth, which reply to Wittich, in ch. 4. . . Cartesianism in Scotland in the Post-Reformation Articles Raffe, Alasdair – ‘Intellectual Change Before the Enlightenment: Scotland, the Netherlands &amp; the Reception of Cartesian Thought, 1650-1700’ The Scottish Historical Review, vol. 94; no. 238, pt. 1 (April 2015), pp. 24-47 Gellera, Giovanni ‘Descartes in Scotland &amp; Pre-Enlightenment Scottish Philosophy’ ‘The Scottish Faculties of Arts &amp; Cartesianism (1650-1700)’ History of Universities XXIX (2), pp. 166-187 ‘English Philosophers &amp; Scottish Academic Philosophy (1660–1700)’ (2017) ‘Robertson’s Philosophical Theses (1596): between Late Renaissance &amp; Early Modern Scholasticism’ eds. Alexander Broadie &amp; J.S. Reid, Philosophical Discourse in Seventeenth-Century Scotland: Key Texts (Scottish History Society) ‘The Philosophy of Robert Forbes: A Scottish Scholastic Response to Cartesianism’ Journal of Scottish Philosophy 11(2) (Sept., 2013), pp. 191-211 Abstract: “In the second half of the seventeenth century, philosophy teaching in the Scottish universities gradually moved from scholasticism to Cartesianism. Robert Forbes, regent at Marischal College and King’s College, Aberdeen, was a strenuous opponent of Descartes. The analysis of the philosophy of Forbes and of his teacher Patrick Gordon sheds light on the relationship between Scottish Reformed scholasticism and the reception of Descartes in Scotland.</p></blockquote>

<blockquote><p>A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.</p></blockquote>

<blockquote><p>…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, ch. 11, ‘The Form of the Body’ in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pp. 493-523 See especially, ‘Hylemorphic Dualism’, pp. 505-10., p. 508</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.”

— Edward Feser, ch. 11, ‘The Form of the Body’ in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pp. 493-523 See especially, ‘Hylemorphic Dualism’, pp. 505-10., p. 508">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6hylemorphic+dualism%E2%80%A6+takes+a+human+being+to+be%2C+not+a+composite+of+two+distinct+substances%2C+but+one+substance+with+both+incorporeal+and+corporeal+operations.+And+the+incorporeal+incomplete+substance+that+is+the+soul+is+related+to+the+body+not+as+an+efficient+cause+but+as+its+formal+cause.+Their+relationship+is+as+intimate+as+that+between+the+form+and+matter+of+a+stone%2C+a+tree%2C+or+a+dog%2C+which+is+why+we+experience+the+body+as+part+of+us+rather+than+as+some+instrument+extrinsic+to+us.+Soul+and+body+do+not+%E2%80%98interact%E2%80%99+any+more+than+the+substantial+form+of+a+stone+and+the+matter+that+makes+up+the+stone+interact.+Hence+there+is+no+%E2%80%98problem%E2%80%99+of+explaining+how+they+interact.+An+%E2%80%98interaction+problem%E2%80%99+can+arise+only+if%2C+like+Descartes%2C+one+misconceives+them+as+two+distinct+substances+related+by+efficient+causation.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+ch.+11%2C+%E2%80%98The+Form+of+the+Body%E2%80%99+in+Immortal+Souls%3A+a+Treatise+on+Human+Nature+Ref+%28Editiones+Scholastica%2C+2024%29%2C+pp.+493-523+See+especially%2C+%E2%80%98Hylemorphic+Dualism%E2%80%99%2C+pp.+505-10.%2C+p.+508&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd272d7124.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd272d7124.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=takes%20a%20human%20being%20to%20be,distinct%20substances%20related%20by%20efficient%20causation&amp;text=takes%20a%20human%20being%20to%20be%2C%20not%20a&amp;text=as%20two%20distinct%20substances%20related%20by%20efficient%20causation" rel="noopener" target="_blank">Read it online

<main class="wrap"><figure class="quote" id="q-a1cfdc4f56" data-kw="">
<blockquote><p>Christ then broke the bread not merely for the purpose of distributing it, but also to signify thereby, 1. The greatness of his sufferings, and the separation of his soul from his body.

2. The communion of many with his own body, and the bond of their union, and mutual love. ‘The bread which we break is it not the communion of the body of Christ; for we being many are one bread, and one body; for we are all partakers of that one bread.’ (1 Cor. 10:16.) The breaking of the bread is, therefore, a necessary ceremony both on account of its signification, and for the confirmation of our faith, and is to be retained in the celebration of the Supper:

1. Because of the command of Christ, ‘Do this.’

2. Because of the authority and example of the church in the times of the Apostles, which in view of this circumstance, termed the whole transaction, the breaking of bread.

3. For our comfort, that we may know that the body of Christ was broken for us, as certainly as we see the bread broken.

4. That the doctrine of transubstantiation and consubstantiation may be rejected, and abandoned.</p></blockquote>

</figure><figure class="quote" id="q-517674f604" data-kw="">
<blockquote><p>Now indeed it would be most pleasing to us that the Supper be celebrated every month, provided that the more frequent use does not produce negligence. For while the greater part abstain from communion, the Church is in some measure scattered. Nevertheless, we would rather that the Church be invited monthly than only four times in the year, as is our custom. When I first came here [to Geneva], it was distributed only three times a year—and that so that between the Supper at Pentecost and that at the Nativity of Christ, seven whole months intervened. I preferred a monthly celebration; but since I could by no means persuade them, it seemed better to pardon the weakness of the people than to contend too stubbornly. Yet I took care that it should be entered in the public records that our custom was a faulty one, in order that a correction might be easier and freer for posterity.</p></blockquote>

</figure><figure class="quote" id="q-29617bef5e" data-kw="">
<blockquote><p>Sitting we think not so necessary as that there could not be a sacrament without it, but to the due ministration of the sacrament we think a table-gesture necessary. … When as we only ground upon Christ and his apostles sitting, and other rites, the necessity of a table-gesture, not to the essence of a sacrament, but to the due ministration of that action… Sitting we think ought not to be changed, no not into standing, without some weighty consideration of some urgent occasion, because it was the gesture of Christ, his apostles, and the apostolical kirks; it is the ordinary gesture of guests at feasts, and resembles best the familiar access of the soul to the spiritual table.</p></blockquote>

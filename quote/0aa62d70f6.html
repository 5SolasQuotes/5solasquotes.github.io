<main class="wrap"><figure class="quote" id="q-0aa62d70f6" data-kw="">
<blockquote><p>Doctrine 5. In that chain of our salvation, the beginning is from God the Father, the dispensation of it is through his Son Jesus Christ, the application of it is through the Holy Ghost. This is intimated in that solemn benediction which the Church received from the Apostle [in 1 Pet. 1:2].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, (1641), p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c67a959d7" data-kw="">
<blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, ([Hempstead] 1573), ‘To the next section contained in the 77th, 78th and a piece of the 79th page’, pp. 138-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-b9bcfdcde3" data-kw="">
<blockquote><p>242. Of the use of Amen being added to a Speech … 1. Three duties especially are required of him that utters the speech whereunto ‘Amen’ is added. … 2. To speak audibly, so as they which are to say Amen, may hear what is said. The Levites under the Law were expressly enjoined to speak to the people with a loud voice. Accordingly the Levites that were the mouth of the people to God, and prayed in their presence, cried with a loud voice unto the Lord their God. Be a prayer made as intelligibly as may be, if it be not heard of them that are present, they cannot with assent, desire, and say Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God: or, an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer</cite>, ... (1626; RHB, 2011) See the whole of the larger section, pp. 330-40.</span></figcaption>

</figure><figure class="quote" id="q-257a0d3a59" data-kw="">
<blockquote><p>Answer: This [argument of Rutherford’s Independent opponent] speaks against glebes [contracted lands] of ministers, but the New Testament speaks not of manses or houses, or of moneys for ministers; yet a wage we know is due, Matt 10:10; 1 Cor. 9:8-10; Gal. 6:6, and the Levites were not to be distracted from the most necessary work of the Tabernacle and service of God more than ministers, yet they had lands and towns assigned of God to them; though the less distractous the wages be, the better and the more convenient they are, 2 Tim. 2:3-5. As for the tithes, we think quotta decimarum, or a sufficient maintenance of tithes or what else may conduce for food and raiment, of divine right, Matt 10:16; 1 Cor. 9:8-9, tithes formally as tithes are not necessary, so [as long as] the ministers be provided and a stipend be allowed to them, not as an alms but as a debt, Luke 10:7. But the stinting [frugal restricting] of maintenance for ministers the author [Rutherford’s opponent] condemns, because when Constantine gave large rents to the Church, it proved the bane of the Church. But I answer, stinting makes not this, but excess, for mountains of rents may be stinted no less than mole-hills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), 2nd Part, pp. 465-66 Scottish commissioner to the Westminster Assembly</span></figcaption>

<main class="wrap"><figure class="quote" id="q-04c935da13" data-kw="">
<blockquote><p>THE good and gracious God, the Ruler and Governor of the world, and the disposer of all events, doth nothing rashly or in vain, and therefore hath made it the duty of the sons of men wisely to weigh and consider of his Providences, and to learn Instructions thence, as well as from the Revelations of his mind in his written Word, Micah 6. 9. We are bid to hear the Rod.

And though in the bounteous dispensations of his favours, we can assign no higher cause than his own mere grace and good Will, which is accomplished in the doing good to his Creatures; Yet in the inflicting of Judgment which is his strange work, we may be sure to find something out of himself moving him to it. It cannot be well conceived how man should ever be the subject of pain or sorrow, did not sin render him passible, and open a way for the Sword to enter his bowels, and give it that edge and force which causeth it to pierce the deeper, and to wound more sensibly.

Now as a distemper which ariseth from a Surfeit, is to be looked at only as an effect of Intemperance, and is not to be quarrelled at, but the cause of it to be blamed; and as the Surgeons searching into the festered place is not a wound, but a discovery of the depth of the sore, in order to its cure; so are the judgments which God sends on a People only to be regarded as the Symptoms of, and means to cure that disorder, and distemperedness within our selves, which doth as it were naturally produce such sufferings.

It is not the breaking forth of some inward distemper, which is our sickness it self, but ’tis rather the effect of it. The spots discernible upon the infected, are not the Plague, but the Tokens. Thus are we to account the most grievous things that light upon us, but as the manifestations and fruits of something worse within us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Solomon’s prescription for the removal of the pestilence, or, The discovery of the plague of our hearts, in order to the healing of that in our flesh</cite>, (London, 1665), pp 1-2.</span></figcaption>

</figure><figure class="quote" id="q-f0bd9502b8" data-kw="">
<blockquote><p>‘Behold, I stand at the door and knock, If any man will open…’ (Rev. 3:20). Alas, we cannot open the door, it is so locked and barred and bolted that it is impossible for us to open it. True, it is so, but yet there is a way to open, and that is to be opening when God would help us to open. When God offers to help you to open the door, then set upon opening the door, and whatever the bolts, bars and locks are, you shall be sure to have it open. Ah, but when does God offer to help us to open it? Then when His Spirit knocks, when in the motions of it He solicits us to open, then God offers His help to help us to open. Take that time and then set on the work and the door shall be opened. But if that time is neglected we may strive to open but cannot open, because then that power is gone that would have helped us to open. See Eccl. 9:12, ‘For man also knoweth not his time.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’</cite>, (d. 1620; 1640; RBO, 2018), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

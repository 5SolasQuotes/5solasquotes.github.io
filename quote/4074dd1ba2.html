</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

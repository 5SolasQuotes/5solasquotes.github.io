<blockquote><p>The grand case of the Christian world is, What is the true center and rule of concord? Could they find out this, it would hold men of various tempers to it. I. Christ first laid down the description and measure of Christianity: In the baptismal Covenant; and ordained that all should be accounted Christians in foro Ecclesiae who by baptism were solemnly devoted to Him, in a professed belief and Covenant, dedication and vow to God the Father, Son and Holy Ghost: These he would have called Christians or his disciples, and this is their Christening, and so ever called in the Church. 2. And next He made it his new (that is Last) and Great Command that all his disciples should love each other [Jn. 13:34], and live in eminent unity and peace [Acts 2:41-47]: which He accordingly wrought them to by the first pouring out of his Spirit, Acts 2-4. II. The apostles founding the Church in this baptismal vow or Covenant and mutual love, exhorted accordingly all the baptized to love each other, and to receive even the weak in faith, but not to doubtful disputations, Rom. 14-15, oft vehemently charging them to be of one mind [Phil. 2] and live in love and peace [2 Cor. 13:11; Gal. 5:22; Eph. 6:23; 1 Thess. 5:13; Jude 1:2], and to beware of them as not serving Christ but their own bellies [Phil. 3:19], who were for divisions, 1 Cor. 1:10-11; Rom. 16:17. And though they came with pretences of order, wisdom or piety, such good words and fair speeches were noted to be engines to deceive the hearts of the simple, Rom. 16:17[-18]. And whereas the objection seemed unanswerable: How can they so agree, who are of several judgements about good and evil? Paul often warns them to hold fast the form of sound words, and sums up (as 1 Cor. 15:1-4) the articles of their Faith, and charges them that so far as they had attained, they should walk by the same rule, and mind the same things, and if in any thing they were otherwise minded, stay till God revealed the matter to them, Phil. 3[:15-16]. He oft charges them to be of one mind and judgement (thus far) and to live in love and peace, and to do nothing by strife and vain glory, but in honor to prefer others to themselves [Rom. 12:10]; and not to strive about words that profit not [2 Tim. 2:14], nor about unnecessary questions, seeing such disputings and strivings gender to ungodliness [1 Tim. 1:4; 6:4; 2 Tim. 2:23], and fret like a canker, and pervert the hearers minds: Yea he directs the pastors to edify souls rather by a teaching than a disputing way [Rom. 14:1; Phil. 2:14; 1 Tim. 6:5], and to convince gainsayers, by meek instructing opposers, to see if thus God will give them repentance to the acknowledgement of the truth [2 Tim. 2:25]: for the minister or servant of the Lord must not strive [2 Tim. 2:24]; Love is their work to be effected in others, and love must be their principle, and love must be their mode and means, even loving others as themselves: Oft are they called by Christ and his apostles from masterly opinions, aspirings and endeavors, and to be as little children [Mt. 18:3-4]; and the servants of all, and as stewards of Gods mysteries and helpers, not lords of the Church’s faith, and not to domineer over the flock of Christ, but to oversee them not by constraint but voluntarily: And what cannot be done by light and love, is not to be done by them at all: The magistrate and not they, must use the sword; but not to make men believers (for he cannot). … And the certain truth is, that he knows neither the interest nor the ignorance and weakness of man, nor the nature of knowledge, who does not know that the frailty and employments of mankind are such as that there never will be an universal concord in very many, or uncertain, unnecessary things; And O that I could write it on all men’s hearts, or doors at least, that the Christian world will never have concord but in a few, certain, necessary things. Therefore Paul said to the Corinthians, 2 Cor. 11:2-3: ‘I am jealous of you with godly jealousy: For I have espoused you to one husband, etc. But I fear lest by any means, as the Serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in (or towards) Christ.’ O mark these words all ye contentious Church-tyrants, dogmatists and superstitious ones. Read and study them well. God laid down the terms of the Church’s concord in seven unities: 1. One Body or Church-catholic; [Eph. 4:4] 2. One Spirit or Holy Ghost, as the soul of that Church; [Eph. 4:4] 3. One hope, or heavenly felicity hoped for; [Eph. 4:4] 4. One Lord of the Church, our Head and Savior; [Eph. 4:5] 5. One Faith, or creed, or symbol of our belief, and belief thereof; [Eph. 4:5] 6. One baptismal Covenant; [Eph. 4:5] 7. And one God and Father of us all [Eph. 4:6], who is above all, through all and in us all. Eph. 4:3-6. And it is the unity of the Spirit in the bond of peace, that on these terms we are charged to keep, [Eph. 4] vv. 2-3, with all lowliness and meekness, with long-suffering, forbearing one another in love. [Eph. 4:2] But now [in 2 Cor. 11:3] comes the Serpent (note 1. the author) and by subtilty (2. note the means) even as he beguiled Eve (3. Note the precedent) which was by promising her more knowledge and exaltation to be as God; and he corrupts men’s minds, (4. mark the effect), though it is knowledge and advancement of mind that he promises and pretends: Even by drawing them (as to higher Power, Knowlege or Holiness) from the Christian simplicity (5. mark what the corruption of religion is). And what is this Christian Simplicity which they forsake, and how are they thus corrupted from it?…</p></blockquote>

<blockquote><p>§34. II. So much for what is necessary to the being of the sacred office: Now what is necessary to the well-being. And indeed, though the essential unity of the Church lie not upon this, yet the peace and concord of it does, and that so much as that no other means without this will attain it: And the want of what is necessary ad bene esse in the ministry and bishops [or ministers], is it that has caused the common calamities. §35. And I. Nothing is more wanting hereto than better qualifications in the persons: 1. That there be a strong wit, and good acquired gifts of knowledge, and a strong and lively faith from divine illumination, and good acquaintance with the oracles of God: A pastor or teacher should not only know the essentials of Christianity, which every Christian knows, but also the integrals [things that complete the whole of Christianity] and many accidents. And both essentials and integrals should be known by him by a more clear, distinct and orderly understanding, not only above the vulgus fidelium, (common Christians) but above the better sort of the flock. And some store of natural and common knowledge called learning is needful hereunto: But especially more illumination, faith and holy wisdom and skilfulness in matter, sense and method of the Word of God.</p></blockquote>

— Richard Baxter, The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 218-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A734.+II.+So+much+for+what+is+necessary+to+the+being+of+the+sacred+office%3A+Now+what+is+necessary+to+the+well-being.+And+indeed%2C+though+the+essential+unity+of+the+Church+lie+not+upon+this%2C+yet+the+peace+and+concord+of+it+does%2C+and+that+so+much+as+that+no+other+means+without+this+will+attain+it%3A+And+the+want+of+what+is+necessary+ad+bene+esse+in+the+ministry+and+bishops+%5Bor+ministers%5D%2C+is+it+that+has+caused+the+common+calamities.+%C2%A735.+And+I.+Nothing+is+more+wanting+hereto+than+better+qualifications+in+the+persons%3A+1.+That+there+be+a+strong+wit%2C+and+good+acquired+gifts+of+knowledge%2C+and+a+strong+and+lively+faith+from+divine+illumination%2C+and+good+acquaintance+with+the+oracles+of+God%3A+A+pastor+or+teacher+should+not+only+know+the+essentials+of+Christianity%2C+which+every+Christian+knows%2C+but+also+the+integrals+%5Bthings+that+complete+the+whole+of+Christianity%5D+and+many+accidents.+And+both+essentials+and+integrals+should+be+known+by+him+by+a+more+clear%2C+distinct+and+orderly+understanding%2C+not+only+above+the+vulgus+fidelium%2C+%28common+Christians%29+but+above+the+better+sort+of+the+flock.+And+some+store+of+natural+and+common+knowledge+called+learning+is+needful+hereunto%3A+But+especially+more+illumination%2C+faith+and+holy+wisdom+and+skilfulness+in+matter%2C+sense+and+method+of+the+Word+of+God.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+True+%26+only+Way+of+Concord+of+all+the+Christian+Churches%2C+the+Desirableness+of+it+%26+the+Detection+of+False+Dividing+Terms+%28London%3A+Hancock%2C+1680%29%2C+pt.+2%2C+ch.+5%2C+%E2%80%98What+are+the+terms+necessary+to+the+office+and+exercise+of+the+sacred+ministry%3F%E2%80%99%2C+pp.+218-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F59f4961e43.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/59f4961e43.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=34.%20II.%20So%20much%20for%20what,method%20of%20the%20Word%20of%20God&amp;text=34.%20II.%20So%20much%20for%20what%20is%20necessary&amp;text=sense%20and%20method%20of%20the%20Word%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ac8747e292" data-kw="">
<blockquote><p>Why truly, after all other means have been used, and costly experiments tried, I believe none will be found more successful, than to maintain the established [Anglican] Church in all its rights, privileges and revenues, keeping close to the constitution which has been so long settled and naturalized to us, supporting it on its ancient basis, without making any material alteration, and hereby sapping the foundation on which ’tis built; but taking care that those who differ from it really on principle, they shall be easy, by granting them such a limited toleration and liberty that they may rest secure [that] they shall not suffer merely for conscience sake, whilst they behave themselves peaceably under the government, and do not make use of any pretended difference in opinion to disturb the peace of the State or the established Church.</p></blockquote>

</figure><figure class="quote" id="q-0db6e1c5f3" data-kw="">
<blockquote><p>The knowledge of points fundamental is necessary: 1. To obtain salvation. 2. To keep communion with a true Church; for we are to separate from a Church subverting the foundation and laying another foundation… [John] Davenant says better, That such are fundamental, the knowledge whereof is simply necessary to salvation, if ignorance whereof does condemn. Doctor [Christopher] Potter calls them prime and capital doctrines of our religion, or of that faith which essentially constitutes a true Church and a true Christian; which is good…</p></blockquote>

</figure><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude... (London: Maxey, 1654), on verse 19, Observations</cite>, p. 593</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

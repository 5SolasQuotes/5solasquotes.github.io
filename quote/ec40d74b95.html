<main class="wrap"><figure class="quote" id="q-ec40d74b95" data-kw="">
<blockquote><p>It must also be borne in mind that elsewhere Hoeksema’s [who denies common grace] definition of the word ‘goodness’ is very different from the meaning commonly given to it by Reformed writers and, more particularly, its usage in the Westminster Standards. For example, in Answer 4 of the Shorter Catechism, we read, ‘God is a Spirit, infinite eternal and unchangeable in his being, wisdom, power, holiness, justice, goodness and truth’. The Shorter Catechism has been criticised by some at this point for not using the terms ‘grace, mercy, love’, but it must be recognised that in the minds of the Westminster Assembly the term goodness included all of these. This explains why the term ‘goodness’ is expanded in the Larger Catechism as equivalent to ‘most merciful and gracious, long-suffering, and abundant in goodness’ (Answer 7) and in the Westminster Confession as ‘most loving, gracious, merciful, longsuffering, abundant in goodness…forgiving iniquity, transgression and sin; the rewarder of them that diligently seek him…’ (Ch. 2.1). The terms ‘good’ and ‘goodness’ (Heb. tob) are consistently linked to God’s mercy or faithful love (Heb. chesed), for example in Psalms 23:6, 25:7-8, 86:5, 100:5, 145:9 etc., and when Psalm 34:8 is referred to in 1 Peter 2:3, the term is rendered ‘gracious’ (Gk. chreestos: A.V. ‘kind’). No doubt this explains why the term is rendered ‘gracious’ in the 1650 Metrical Psalter rendering Psalm 86:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-silversides.html">David Silversides</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Offer: Biblical &amp; Reformed (Marpet Press, 2005)</cite>, p. 16-17.</span></figcaption>

<blockquote><p>Use 4. If Christ be so rich, Oh! then, open to Christ when He knocks. Christ knocks by his word, and He knocks by his rod; He knocks by his Spirit, and He knocks by his messengers, and He knocks by conscience. Oh, open to Him! for He is very rich. Though you shut the door against a poor man, yet you will open it to one that is rich; and why not then to Christ, who would fain have entrance? Rev. 3:20, ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to Him, and will sup with Him, and He with me.’</p></blockquote>

</figure><figure class="quote" id="q-a7c2afaf46" data-kw="">
<blockquote><p>He manifests the more grace and goodwill to our salvation, and that He is more ready to pardon than to punish, in that He waits so long on the sinner’s choice: Rom. 9:22, ‘What if God, willing to show his wrath, and to make his power known, endured with much long‑suffering the vessels of wrath filled to destruction?’ He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace; and if He should do that, the world would never be put upon choice and trial, and obedience would be a matter of necessity and constraint, not of willing acceptation; and men may as well quarrel at this as that He has not made them all angels.</p></blockquote>

<blockquote><p>VI. The negative act includes two: both preterition, by which in the election of some to glory as well as to grace, he neglected and slighted others (which is evident from the event of election); and negative desertion, by which he left them in the corrupt mass and in their misery. However this is so to be understood: (that the are not excepted from the laws of common providence, but remain subject to them; nor are they immediately deprived of all God’s favor [Latin: gratia, or grace], but only of the saving and a vivifying (which is the fruit of election)</p></blockquote>

</figure><figure class="quote" id="q-76f5cff49e" data-kw="">
<blockquote><p>…our Lord also taught the universality of the love of God in the numerical sense of appropriating it to every individual man… …in the second place, that the work of redemption itself bears in our Lord’s representation a broad cosmical character… Especially the doctrine of the kingdom in its eschatological aspect clearly reveals that the divine love sets for its goal not the saving of isolated individuals out of the world, but the salvation of the world as an organic whole… There is, however, still a third sense, in which Jesus leads us to ascribe universality to the divine love. This is done not so much in explicit form as by the implications of His attitude toward sinful men in general.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 13-14 of “The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review, no. 13 (1902)</cite></span></figcaption>

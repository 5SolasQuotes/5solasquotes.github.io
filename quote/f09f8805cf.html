<blockquote><p>Eternity is God without beginning, without end and without all manner of succession; there is nothing past, nor to come. It was well said of him, who unto the question, ‘What was eternity?’ answered by that word of modesty, ‘I know not: It is the measure (without measure) of the duration of God, according to our apprehension.’ (Quid autem sit aeternitas, quaerat aliquis? Hîc si respondeam per verbum modestiae nescio recta ingenia per se intelligent, a byssum esse.) Three things are requisite thereunto, viz. to be without beginning, without end, and without all change: An unalterable and independing duration: It is all at once, where there is nothing past, nor to come; A remaining NOW. Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>

</figure><figure class="quote" id="q-3627cb522a" data-kw="">
<blockquote><p>Our own personal experience teaches us the reality of transient being; for experience the fact that many things that once did not exist now exist, as, for example, our present thoughts, sensations, and their objects. Further, we have experience of continuity from one moment of time to another, for our conscious life is not a mere succession of discrete instants but is something flowing and truly continuous, so that the last part of the past coincides with the first part of the future. However, this fact of continuity that we experience cannot be explained unless something from prior experience remains or endures in present experience. In other words our conscious life, although it is a whole that is continually changing and flowing, nevertheless contains within the whole certain elements or parts that are constant. But such constant things, even if their endurance is brief, have a true relative permanence… It also seems that the reality of the relatively permanent can be directly inferred from the essence itself of the transient. For if the transient were not also relatively permanent, it ought to begin and cease to be without any interval of duration. That which begins to be and that which ceases to be are simply opposed as to existence, so that a contradiction would be involved if they existed simultaneously. Therefore, in order to have something truly transient, there must be at least two instants of time one after the other. But these two instants are either separated by an interval or are so immediate to each other that there is no interval between them. But no instants of time are so united that one exists after the other without interval, and if there is some interval of time between the beginning to be of some being and its ceasing to be, then we have got something relatively permanent. Now whatever may be said about this argument, it certainly seems that a being which begins to be from nothing and then immediately afterwards altogether ceases to be, without any interval at all of duration, if it does not simply involve a contradiction, cannot exist in time at any rate and cannot naturally be known by us. Moreover, if such instants of immediate annihilation after production be multiplied even endlessly, they can never explain the experience of continuity that we in fact have. For just as a line is not the mere addition of points infinite in number, so neither is a continuous period of time the mere addition or sum of instants that lack, in themselves, all duration in time. This reasoning is confirmed by the fact that existence or being, namely the being we experience and which is the starting point for our metaphysical speculations cannot be conceived without duration. On the basis of this concession I argue as follows: although beginning to be or ceasing to be are said to happen in an instant or a moment, one may not argue that therefore we can have creation followed immediately afterwards without any duration by annihilation, just as neither may one argue: a point is the end of a line and as such lacks all dimension, so there can be two points so close together that no distance intervenes between them. Accordingly we can say that beginning to be cannot be had without duration, not precisely because a beginning directly includes duration (for it happens in an instant), but because beginning to be is impossible without existence and because existence involves duration. The like must be said of ceasing to be, or ceasing to be thus.</p></blockquote>

<blockquote><p>But God’s eternity… is not mere longevity, but strict timelessness… not merely that God has existed throughout all past time, and will continue to exist throughout all future time. Rather, He exists outside of time altogether. This follows from both his immutability and his simplicity. If God existed within time, He would constantly be adding new seconds, days, and years to his life; would be acting at one moment in a way that differs from the way He acts at another moment; and… would constantly be acquiring new pieces of knowledge, such as the knowledge that it is now time t1, the knowledge that it is now time t2, and so forth. But all of this would involve change, and God is immutable. Hence, He does not exist within time, but rather timelessly. Furthermore, if God were in time, then there would be different stages of his life, each of which would be distinct from the others. In that case, He would have distinct parts. But God is simple or noncomposite, and thus without parts. Hence, He is timeless. Now, I have argued in earlier chapters that the existence of anything at any moment is ultimately caused by God. It might seem that that claim is incompatible with the claim that God is timeless. For if the existence of something at time t1, is caused by God, and the existence of something at time t2, is caused by God, doesn’t that entail that God is acting at time t1, and also acting at the later time t2? And doesn’t that in turn entail that God is in time? However, this does not follow. In particular, from the proposition that God causes it to be the case that such-and-such exists at time t1, it does not follow that at time t2, God causes it to be the case that such-and-such exists. It is not that at time t1, God causes some object to exist, then at a later time t2, carries out a second action of causing that thing to remain in existence, then at some yet later time t3, carries out a third action of causing it to remain in existence for a while longer, and so forth. It is rather that God, from outside of time, in a single act causes to exist a temporal world in which the object exists at times t1, t2, t3, and so on. You might compare his action to that of an author who comes up with an entire story in a single flash of insight. He determines, all at the same moment, what the beginning, middle, and end of the story will be. From the point of view of the characters in the story, what happens in the middle of the story follows what happened at the beginning and precedes what happens at the end. But the author himself did not first come up with the beginning, and then later the middle, and then later still the ending. Rather, he did it all at once.</p></blockquote>

— Edward Feser, Five Proofs of the Existence of God (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Eternity’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+God%E2%80%99s+eternity%E2%80%A6+is+not+mere+longevity%2C+but+strict+timelessness%E2%80%A6+not+merely+that+God+has+existed+throughout+all+past+time%2C+and+will+continue+to+exist+throughout+all+future+time.+Rather%2C+He+exists+outside+of+time+altogether.+This+follows+from+both+his+immutability+and+his+simplicity.+If+God+existed+within+time%2C+He+would+constantly+be+adding+new+seconds%2C+days%2C+and+years+to+his+life%3B+would+be+acting+at+one+moment+in+a+way+that+differs+from+the+way+He+acts+at+another+moment%3B+and%E2%80%A6+would+constantly+be+acquiring+new+pieces+of+knowledge%2C+such+as+the+knowledge+that+it+is+now+time+t1%2C+the+knowledge+that+it+is+now+time+t2%2C+and+so+forth.+But+all+of+this+would+involve+change%2C+and+God+is+immutable.+Hence%2C+He+does+not+exist+within+time%2C+but+rather+timelessly.+Furthermore%2C+if+God+were+in+time%2C+then+there+would+be+different+stages+of+his+life%2C+each+of+which+would+be+distinct+from+the+others.+In+that+case%2C+He+would+have+distinct+parts.+But+God+is+simple+or+noncomposite%2C+and+thus+without+parts.+Hence%2C+He+is+timeless.+Now%2C+I+have+argued+in+earlier+chapters+that+the+existence+of+anything+at+any+moment+is+ultimately+caused+by+God.+It+might+seem+that+that+claim+is+incompatible+with+the+claim+that+God+is+timeless.+For+if+the+existence+of+something+at+time+t1%2C+is+caused+by+God%2C+and+the+existence+of+something+at+time+t2%2C+is+caused+by+God%2C+doesn%E2%80%99t+that+entail+that+God+is+acting+at+time+t1%2C+and+also+acting+at+the+later+time+t2%3F+And+doesn%E2%80%99t+that+in+turn+entail+that+God+is+in+time%3F+However%2C+this+does+not+follow.+In+particular%2C+from+the+proposition+that+God+causes+it+to+be+the+case+that+such-and-such+exists+at+time+t1%2C+it+does+not+follow+that+at+time+t2%2C+God+causes+it+to+be+the+case+that+such-and-such+exists.+It+is+not+that+at+time+t1%2C+God+causes+some+object+to+exist%2C+then+at+a+later+time+t2%2C+carries+out+a+second+action+of+causing+that+thing+to+remain+in+existence%2C+then+at+some+yet+later+time+t3%2C+carries+out+a+third+action+of+causing+it+to+remain+in+existence+for+a+while+longer%2C+and+so+forth.+It+is+rather+that+God%2C+from+outside+of+time%2C+in+a+single+act+causes+to+exist+a+temporal+world+in+which+the+object+exists+at+times+t1%2C+t2%2C+t3%2C+and+so+on.+You+might+compare+his+action+to+that+of+an+author+who+comes+up+with+an+entire+story+in+a+single+flash+of+insight.+He+determines%2C+all+at+the+same+moment%2C+what+the+beginning%2C+middle%2C+and+end+of+the+story+will+be.+From+the+point+of+view+of+the+characters+in+the+story%2C+what+happens+in+the+middle+of+the+story+follows+what+happened+at+the+beginning+and+precedes+what+happens+at+the+end.+But+the+author+himself+did+not+first+come+up+with+the+beginning%2C+and+then+later+the+middle%2C+and+then+later+still+the+ending.+Rather%2C+he+did+it+all+at+once.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God+%28Ignatius+Press%2C+2017%29%2C+%E2%80%98The+Divine+Attributes%E2%80%99%2C+%E2%80%98Eternity%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F778ea19804.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/778ea19804.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-time-eternity-gods-eternity/#:~:text=But%20God%E2%80%99s%20eternity%E2%80%A6%20is%20not%20mere,he%20did%20it%20all%20at%20once." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The infinity of God in reference to duration is called eternity to which these three things are ascribed: (1) that it is without beginning; (2) without end; (3) without succession. We maintain that God is free from every difference of time, and no less from succession than from beginning and end.</p></blockquote>

<blockquote><p>Christ died not effectually for all, though the death of Christ were sufficient for the redemption of all mankind, yet he died not effectually for all, for as much as all men are not saved, therefore to many, that is, to them which are not saved, the death of Christ is of no effect. … Our Saviour Christ saith: I pray for them whom thou hast given me out of this world, but I pray not for the world. But to them which are only called, and are not chosen, whose eyes are blinded that they should not believe, which are not Christ’s sheep, which are vessels of dishonour, from whom God hath hidden the mysteries of salvation, for whom everlasting fire is prepared, to those for whom Christ doth not pray, to them the death of Christ doth nothing avail, to those his death is of no effect.</p></blockquote>

<blockquote><p>§3. God’s actual continuance of forfeited life, liberty, health, and other comforts, and his actual collation of many great mercies by the course of Nature, to such as by sin have deserved present damnation, is a degree of signification of his pardoning will and mercy by these natural signs (which they were not before sin and forfeiture). §4. Man being after guilt of death, thus reprieved and enriched with manifold mercies, and his life and faculties continued with many instructing providential helps and means, the very Law of Nature now obliges him to love and thankfulness to God that shows him so great kindness. §5. And the same Law of Nature obliges him to take that God still for a God of love and mercy, and to believe, that what mercy He has already showed the world and us, is on terms which he knows to be very well consistent with his holiness, truth and justice: And it obliges us therefore to seek to Him for mercy, and to use all possible means for further hope and pardon and recovery, and not to sit down in despair. §6. The common sense of all mankind from Adam to this day, acquaints us by that experience, that these hopes and duties are found in the Law of lapsed Nature: For all the world that never heard the Gospel, do yet take God to be a merciful, forgiving God, and take themselves to be under some duty for the obtaining of further mercy, recovery and felicity. §7. Though want of the sense of sin, and its desert, and man’s misery may be thought by some to be the only cause of this, and so that it is but sinful presumption, and no part of Nature’s obligation; yet this upon trial will prove false (though what they allege be one part of the cause). For:

1. These men do acknowledge themselves sinners, and to deserve punishment from God.

2. They find some misery and fear more.

3. It is not presumption to judge God to be merciful, when they and all the world do find Him so.

4. It is not presumption to judge, that he can and will pardon sin, when full experience assures us, that He has already pardoned much. To remit the sin, is (as we now speak of it) to remit the deserved punishment. And He that gives man forfeited life, health, time, and all the abundant mercies which the world is full of, does thereby so far actually forgive sin: Says Christ, ‘Whether is it easier to say thy sins be forgiven thee, or to say arise, take up thy Bed and walk,’ that is, Executively to forgive them, which is the full forgiveness, by taking away the punishment.

5. It is no presumption to believe such duty to be incumbent on us, as the remaining Law of Nature does oblige us to.

6. Nor yet to take God’s own encouragements to seek our own recovery and felicity. §8. The Light and Law of lapsed Nature does convince men of the duty of repenting and returning to God, and oblige them to it. So that as perfect obedience was the duty of entire Nature, so repentance is the duty of lapsed Nature: And I think few will say that all men are not hereby obliged to repent, and that in hope of mercy. §9. Hence it is that it is found among the communes notitiae [common notions], and all the world as well as Christians acknowledge it and plead for it. §10. They that by God’s patience and mercy are invited to repentance, which is a return from sin to God, and are by Nature obliged to it, ought to believe that it is not made their duty in vain, nor shall they lose by it if they perform it; for that were to accuse God of making man’s duty in vain, or to his loss, which is not to be suspected. §11. Therefore they are bound not to despair of pardon and salvation; for an obligation to use means as tending to recovery, is inconsistent with an obligation to despair. Therefore hope of mercy and use of some means mankind is obliged to by the Law of lapsed Nature. §12. This is not the obligation of the Law or Covenant of Innocency; for that Law bound us only as innocent to keep our innocency and perfectly therein obey: But it gives no pardon, nor appoints man any duty in order to pardon and recovery: Whatever does this, is a Law of Grace. §13. The sum of that duty which the Law of Nature now obliges man to, is, to consider of all the mercies which God vouchsafes sinners, and thankfully to improve them; to repent of sin, and turn to this God, who shows Himself a merciful pardoning God; To resign themselves to Him as their Owner, to obey Him as their Ruler, and to love and seek Him as their ultimate end; and to believe that his mercy will not let us be losers in so doing, nor to do it in vain. §14. But the supernatural revelation tells us much more than all this, of the promised Seed, the means of our salvation, and of our duty in believing them, and of the certainty and nature of the pardon, deliverance, and blessedness which we shall attain.</p></blockquote>

on+trial+will+prove+false+%28though+what+they+allege+be+one+part+of+the+cause%29.+For%3A+1.+These+men+do+acknowledge+themselves+sinners%2C+and+to+deserve+punishment+from+God.+2.+They+find+some+misery+and+fear+more.+3.+It+is+not+presumption+to+judge+God+to+be+merciful%2C+when+they+and+all+the+world+do+find+Him+so.+4.+It+is+not+presumption+to+judge%2C+that+he+can+and+will+pardon+sin%2C+when+full+experience+assures+us%2C+that+He+has+already+pardoned+much.+To+remit+the+sin%2C+is+%28as+we+now+speak+of+it%29+to+remit+the+deserved+punishment.+And+He+that+gives+man+forfeited+life%2C+health%2C+time%2C+and+all+the+abundant+mercies+which+the+world+is+full+of%2C+does+thereby+so+far+actually+forgive+sin%3A+Says+Christ%2C+%E2%80%98Whether+is+it+easier+to+say+thy+sins+be+forgiven+thee%2C+or+to+say+arise%2C+take+up+thy+Bed+and+walk%2C%E2%80%99+that+is%2C+Executively+to+forgive+them%2C+which+is+the+full+forgiveness%2C+by+taking+away+the+punishment.+5.+It+is+no+presumption+to+believe+such+duty+to+be+incumbent+on+us%2C+as+the+remaining+Law+of+Nature+does+oblige+us+to.+6.+Nor+yet+to+take+God%E2%80%99s+own+encouragements+to+seek+our+own+recovery+and+felicity.+%C2%A78.+The+Light+and+Law+of+lapsed+Nature+does+convince+men+of+the+duty+of+repenting+and+returning+to+God%2C+and+oblige+them+to+it.+So+that+as+perfect+obedience+was+the+duty+of+entire+Nature%2C+so+repentance+is+the+duty+of+lapsed+Nature%3A+And+I+think+few+will+say+that+all+men+are+not+hereby+obliged+to+repent%2C+and+that+in+hope+of+mercy.+%C2%A79.+Hence+it+is+that+it+is+found+among+the+communes+notitiae+%5Bcommon+notions%5D%2C+and+all+the+world+as+well+as+Christians+acknowledge+it+and+plead+for+it.+%C2%A710.+They+that+by+God%E2%80%99s+patience+and+mercy+are+invited+to+repentance%2C+which+is+a+return+from+sin+to+God%2C+and+are+by+Nature+obliged+to+it%2C+ought+to+believe+that+it+is+not+made+their+duty+in+vain%2C+nor+shall+they+lose+by+it+if+they+perform+it%3B+for+that+were+to+accuse+God+of+making+man%E2%80%99s+duty+in+vain%2C+or+to <blockquote><p>It was fitting that free love, in the bowels of Christ, should contrive the way to heaven through free love: we should never in heaven, cast down our crowns at the feet of him that sits on the throne, with such sense and admiration, if we had come to the crown by law-doing, and not gospel confiding on a rich ransom-player. O that eternal banquet of the honey-comb of the love-debt of the Lamb, that redeemed us for nothing! All the shoulders in heaven are for eternity on an act of lifting up, and heightening Christ’s free love, who has redeemed them with so free a redemption; but they are not all able, tho’ angels help them, to lift it up high enough: it is so weighty a crown that is upon the head of the Prince-Redeemer, that in a manner it wearies them, and they cannot over-extol it.</p></blockquote>

</figure><figure class="quote" id="q-0abbf5b959" data-kw="Melchizedek true priesthood">

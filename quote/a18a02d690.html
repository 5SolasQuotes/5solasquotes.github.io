<main class="wrap"><figure class="quote" id="q-a18a02d690" data-kw="">
<blockquote><p>1. The question concerning the parts of the church. Do reprobates also belong to it? II. First it is inquired whether besides those called elect, reprobates and infidels also (whether secret or open) are to be considered as true members of the church. Bellarmine with others pretends this is so (“De Ecclesia Militante,” 3.2, 7, 9 Opera [1857], 2:74–75, 81–83, 85–89 and the following) when he teaches that in the definition of the church, pagans, heretics, the excommunicated and schismatics are excepted: “All others are included, even if they are reprobates, wicked and impious” because, as he immediately adds, “that a person may be said to be absolutely a part of the true church, of which the Scriptures speak, we do not think there is required any internal virtue, but only an external, especially a communion of faith and of the sacraments, which is perceived by the sense itself.” The design is that no other church may be acknowledged except that of which the Roman bishop is head. And because they clearly saw (if they restrict it to the elect and believers) the pope might possibly not belong to it, therefore they wished to extend it even to the reprobate, provided they were embraced under the one visible head. Hence in the Council of Constance, this proposition of John Hus was condemned as heretical: “The holy universal church is the universality of the predestinated” (Mansi 27:754). The importance of the controversy is such that on its decision depend all the others which are agitated concerning the church between us and the Romanists. Hence we must treat it the more accurately.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 18.3.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6291ea70cd" data-kw="">
<blockquote><p>And thus beauty, which is indeed God’s handiwork, but only a temporal, carnal, and lower kind of good, is not fitly loved in preference to God, the eternal, spiritual, and unchangeable good. When the miser prefers his gold to justice, it is through no fault of the gold, but of the man; and so with every created thing. For though it be good, it may be loved with an evil as well as with a good love: it is loved rightly when it is loved ordinately; evilly, when inordinately. It is this which some one has briefly said in these verses in praise of the Creator: “These are Thine, they are good, because Thou art good who didst create them. There is in them nothing of ours, unless the sin we commit when we forget the order of things, and instead of Thee love that which Thou hast made.” But if the Creator is truly loved, that is, if He Himself is loved and not another thing in His stead, He cannot be evilly loved; for love itself is to be ordinately loved, because we do well to love that which, when we love it, makes us live well and virtuously. So that it seems to me that it is a brief but true definition of virtue to say, it is the order of love; and on this account, in the Canticles, the bride of Christ, the city of God, sings, “Order love within me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop of Hippo. The City of God, XV.22</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-ef8c84ca9f" data-kw="">
<blockquote><p>There are then a great number of truths, both of faith and of morality, which seem contradictory, and which all hold good together in a wonderful system. The source of all heresies is the exclusion of some of these truths, and the source of all the objections which the heretics make against us is the ignorance of some of our truths. And it generally happens that, unable to conceive the connection of two opposite truths, and believing that the admission of one involves the exclusion of the other, they adhere to the one, exclude the other, and think of us as opposed to them. Now exclusion is the cause of their heresy; and ignorance that we hold the other truth causes their objections.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-aa89cdd1c3" data-kw="">
<blockquote><p>But here we meet with a question often discussed and much debated, both by learned men and Idiots: Whether Sorcerers or Witches, Fairies or Spirits, (call them by what name you will) can raise any tempests, or bring down such Hail as we oft see?

To which we answer with a distinction, that as they have some, so they have no absolute nor self sufficient power to hurt, for even Satan himself (whose power otherwise is great, whose bondslaves and vassals these wretched varlets are) cannot hurt either man or beast, either how or when him list, much less these accursed slaves of his, can have the air and winds at commandment, but GOD in his righteous judgment giving him leave, what may he not do? work wonders in the world, shake the heavens, trouble the air, frush [sic] the earth, and torn all things topside otherway, a passing nimble spirit he is doubtless, and a most speedy workman, so that out of hand, even in the twinkling of an eye, he will use his leave granted, to some mischief. The Hogs without leave (of God the Father) Matthew the 8. Chapter, he could not possess, but no sooner had he obtained leave, but presently he tumbleth them headlong into the sea.

The Egyptian Sorcerers wrought incredible wonders, imitating Moses and Aaron, before Pharaoh. Known and memorable is that story of Job to this purpose, to show that this Behemoth being curbed, he is disabled, but if the reins be given him, there is no ho [sic] with him, and yet hath he his bounds set him, which he cannot pass in any wise.

Whereupon Origen on that place breaketh out in this wise. How sweet is thy kindness O King of heaven, how mighty is thy power, how glorious thy majesty o eternal God? How greatly comfortest thou those which fly unto thee, that the Adversary of Mankind hath no power over any creature, but that which is granted him by permission? Neither is he permitted but where GOD doth know it may make for the evidence of faith, for the trial of constancy, and for a pledge of a glorious reward: which we knowing, let us with care and fear flee unto God, and with instance of prayer, and sincerity of heart, cry unto him, to deliver us from the cruel assaults, and from the subtle snares of the wicked, and suffer vs not to be tempted above our strength. Thus far Origen,

Now to our purpose, these Sorcerers having covenanted with the Devil, he useth their malice to his purpose: he deviseth for them, and prescribeth to them Medicines, Drugs, Poisons, Exorcisms, wherewith they may hurt men, children and beasts, infect pastures, deceive the senses, juggle cunningly, work incredibly, but not without his assistance. Who though they be thus conjured together, yet holding Saint Paul’s ground (If God be with us, who can be against us?) what need we fear? For this is sure, that though they have both ability, and will, yet have they no authority more then limited, especially against the faithful, which are ever under the shadow of the Almighty. But for the raising of storms, the congealing of hail, the whirling of winds, we utterly deny them any power that way, because holy writ attributeth the raising and ruling of these tempests to God alone.

Why but themselves willingly without any torture, and boldly without fear, avow that they can trouble the air, and disturb the elements at their pleasure. But I say as boldly, that this (as many other their assertions) is but a Devilish illusion. For Satan by natural reason, and by his quick conceit, not only knoweth the causes, places, and effects of tempests, but also executeth partly with, and partly against his will, the just judgment of God’s indignation: for he is (sayeth Origin) God’s Executioner. Now he knoweth these circumstances, having his commission with his leave granted, presently goes to his accomplices, puts them in mind of their bargain, promiseth now to wreak their malice, as they desire, teacheth them the means how to effect it, and sometimes forceth them by violence unto it. And thus those malicious Miscreants go to their business, bring their purpose to passe, and rejoice in the fatal issues of their accursed Art: And now hath this old Deceiver obtained that he would, not only in binding these Wretched Souls, as with a three-fold Cord, unto his own will, but also in persuading others to ascribe any Calamity, Dearth, or Penury, not to God’s Judgment, but to the power and malice of these Accursed Caitiffs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-lavater.html">Ludwig Lavater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Christian sermons, made by Lodovike Lavatere, minister of Zurich in Helvetia, of famine and dearth of victuals</cite>, trans. William Barlow (London: Thomas Creed, 1596), pp 22-27.</span></figcaption>

<blockquote><p>In MPD [or Dissociative Identity Disorder], we have a phenomenon that was traditionally categorized as demonic possession. Accordingly, people exhibiting the behavior now associated with MPD described it, not as a fragmentation of a single mind into multiple ones, but as the entrance from without of a distinct and alien mind… Many well-known cases of alleged MPD–such as that of ‘Sybil,’ made famous in the film of that title–have been shown to have been exaggerations or even hoaxes. ‘Sybil’ herself has admitted that her ‘disorder’ was more or less her own invention, that she was coxed into believing that she had multiple personalities by therapists eager to prove that MPD was real, and that under their encouragement and in an emotionally fragile state she had manufactured and acted out various ‘personalities’ to confirm their diagnosis. Many other MPD patients, emotionally disturbed people to start with, acknowledge that they see themselves less as literally ‘fragmenting’ into different personalities than as fantasizing and acting out different roles–again, often under the influence of overzealous therapists. The behavior of ‘split-brain’ patients is no less subject to interpretation, interpretation that can reflect the enthusiastic theorizing of the researcher as much as the objective facts. To begin with, the two hemispheres of the brains of such patients are not completely disconnected–there are other connections between the halves that remain undisturbed, and thus there are no grounds for insisting that the halves must be associated with different ‘minds’. Furthermore, under ordinary conditions, such patients behave more or less normally, or at least no in any way that suggests that more than a single mind occupies their bodies. It is only in contrived experimental contexts that they can be made to exhibit remarkable behavior, and even then that behavior is by no means obviously best interpreted as involving a ‘division’ of the mind. Many researchers hold instead that such behavior, when examined carefully, amounts to little more than a variation on the awkwardness, failure of co-ordination, or general cognitive malfunctioning that can result from any serious injury to brain…</p></blockquote>

<blockquote><p>This is a highly original study of demon possession and the ritual of exorcism, both of which were rife in early modern times, and which reached epidemic proportions in France… The rite of exorcism… generated as many problems as it resolved. Possessed women endured frequently violent exorcisms, exorcists were suspected of conjuring devils, and possession itself came to be seen as a form of holiness, elevating several women to the status of living saints.</p></blockquote>

</figure><figure class="quote" id="q-531ab0edd0" data-kw="">
<blockquote><p>To proceed yet further, we are here to consider the particular remedies which they of the popish church have prescribed against the hurts that have come by witchcraft. And they are principally five. The first is the name of Jesus. We must grant that any Christian may lawfully call upon the name of Jesus in prayer, for the help and deliverance of those who are possessed and bewitched, but yet with the caveat and condition before specified, if it is the will of God, and if their recovery may make for His glory, the benefit of the church, and the good of the diseased parties. But the papist, by the use of this name, intends a further matter, to wit, that the very name uttered in so many letters and syllables is powerful to cast out devils and to help those who are bewitched. For when it is uttered, then (they say) the authority of Christ is present, that the work may be done. [This is] a flat untruth and a practice full of danger. For let this be well considered, whatsoever any man does in this case, he must do it by virtue of his calling, and have also his warrant for the doing thereof out of the Word. If he lacks this, and yet undertakes such a work, he may justly fear the like event that befell the vagabond Jews who were exorcists (Acts 19:13). Now the church of Christ has no warrant in the Word to use this name of Christ for any such purpose. Neither has any ordinary Christian a special calling from God so to do. Therefore, he may not do it.</p></blockquote>

<blockquote><p>Agrippa’s study of occult philosophy, [has been] acknowledged as a significant contribution to the Renaissance philosophical discussion concerning the powers of ritual magic and its relationship with religion. The three books deal with Elemental, Celestial and Intellectual magic. The books outline the four elements, astrology, kabbalah, numbers, angels, God’s names, the virtues and relationships with each other as well as methods of utilizing these relationships and laws in medicine, scrying, alchemy, ceremonies, origins of what are from the Hebrew, Greek, and Chaldean context. These arguments were common amongst other hermetic philosophers at the time and before. In fact, Agrippa’s interpretation of magic is similar to the authors Marsilio Ficino, Pico della Mirandola and Johann Reuchlin’s synthesis of magic and religion and emphasize an exploration of nature. Unlike many grimoires of the time, before and past, these books are more scholarly and intellectual than mysterious and foreboding. These books are often read as authoritative by those interested in the occult even today.” – Internet Archive Wier, Jan On Witchcraft: An Abridged Translation of Johann Weyer’s De Praestigiis Daemonum [On the Sleights of Demons] Ref (Basil, 1568; Pegasus Press, 1998) 330 pp. Latin 755 pp. No ToC Wier (1515-1588) was a Dutch physician, occultist and demonologist, disciple and follower of Heinrich Cornelius Agrippa. See Wikipedia on ‘De praestigiis daemonum’. Wikipedia: “Weyer published his major works on demons, magic, and witchcraft, in which he applied a skeptical medical view to reported wonders and supposed examples of magic or witchcraft… Nevertheless, while he defended the idea that the Devil’s power was not as strong as claimed by the orthodox Christian churches in De Praestigiis Daemonum, he defended also the idea that demons did have power and could appear before people who called upon them, creating illusions; but he commonly referred to magicians and not to witches when speaking about people who could create illusions, saying they were heretics who were using the Devil’s power to do it, and when speaking on witches, he used the term mentally ill… Weyer’s appeal for clemency for those accused of the crime of witchcraft was opposed later in the sixteenth century by the Swiss physician Thomas Erastus, the French legal theorist Jean Bodin and King James VI of Scotland.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-97c5d66a90" data-kw="">
<blockquote><p>[Gen. 22] Verse 12: ‘Seeing for my sake thou hast not spared thine only son.’ God accepts the resolute purpose and will of Abraham for the done deed. An obedient will then is accepted before God as the work itself: as the Apostle says, ‘If first there be a willing mind, God accepts it according to that a man has, not according to that he has not, 2 Cor. 8:12. [So Wolfgang] Musculus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum… (d. 1621; London: 1633) | on Gen. 22, 4. Places of Doctrine, 3rd doctrine</cite>, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“[Gen. 22] Verse 12: ‘Seeing for my sake thou hast not spared thine only son.’ God accepts the resolute purpose and will of Abraham for the done deed. An obedient will then is accepted before God as the work itself: as the Apostle says, ‘If first there be a willing mind, God accepts it according to that a man has, not according to that he has not, 2 Cor. 8:12. [So Wolfgang] Musculus.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ab96518f8" data-kw="">
<blockquote><p>…and their fear toward me is taught by the precept of men: therefore, behold, I will proceed to do a marvellous work among the people, even a marvellous work and a wonder; for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hid” (Isa. 29:13-14). And in another place, “But in vain do they worship Me, teaching for doctrines the commandments of men” (Mt. 15:9)… pious princes are repeatedly praised (2 Kings 22:1, etc.) for acting according to all his precepts, and not declining either to the right hand or the left. I go further: although there be no open manifestation of impiety in fictitious worship, it is strictly condemned by the Spirit, inasmuch as it is a departure from the command of God… And the more clearly the will of God has been manifested to us, the less excusable is our petulance in attempting anything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, tr. Beveridge (1564; Edinburgh: Calvin Translation Society, 1845), bk. 4, ch. 10, section 23, pp. 216-17 | “Do we think it a small matter that the Lord is deprived of his kingdom which He so strictly claims for Himself? Now, He is deprived of it as often as He is worshipped with laws of human invention, since his will is to be sole legislator of his worship. And lest any one should consider this as of small moment, let us hear how the Lord Himself estimates it.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-951a1cfe7c" data-kw="">
<blockquote><p>Me thinks it is somewhat a strange kind of reasoning, because the rod of discipline is wanting [lacking], the children should be denied bread; yea, but you will say, dogs will eat the children’s bread: Why, will you therefore starve the children because dogs without your default may snatch the children’s portion? Shall the children be debarred (as I may say) their daily bread, because it will become accidentally poison unto dogs?… As it is better for God’s sheep to feed upon pasture where some weeds grow rather than starve for want [lack] of food: So it is better for God’s shepherds to suffer some weeds to grow in the sheeps’ pastures if they cannot prevent it, than to starve their flocks; yea, and as it is better for the sheep to feed among goats rather than starve, so it is better the shepherds should suffer the goats to feed upon the sheeps’ pasture though it should poison them, than for the sheep to be kept from it;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650) Jeanes (1611–1662) was a presbyterian minister in London.</cite>, pp. 32-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

/a></div>
</figure><figure class="quote" id="q-6ed8f21cd7" data-kw="">
<blockquote><p>Come to churches and say, ‘You have these defects among you, and these things to be reformed;’ but if you will come and say, ‘Your churches and your ministers are Antichristian and come from Babylon,’ there is nothing [that] provokes more…. …and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23</cite>, pp. 558-59</span></figcaption>

</figure><figure class="quote" id="q-3a1e1b611b" data-kw="">
<blockquote><p>I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Plain or Bad Bread is Better than None</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

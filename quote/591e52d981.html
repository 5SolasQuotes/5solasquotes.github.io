<main class="wrap"><figure class="quote" id="q-591e52d981" data-kw="">
<blockquote><p>In times past, when Saul was king over us, it was you who led out and brought in Israel. And the Lord said to you, ‘You shall be shepherd of my people Israel, and you shall be prince over Israel.’” (2 Samuel 5:2)

And moreover, under this word ‘pastor’, the office of a good king is expressed to us in this reign of David; namely, that he must care for his subjects as a shepherd for his flock. Now two things are required of a shepherd. The first is that he provide his animals with good pasture, and then that he keep them safe from all thieves and wolves and trouble. Now that (I say) is what princes must do. If they think that they will render an account to God for the charge that is committed to them, they must see to it that their subjects live in peace and that they are maintained; and then, in the second place, that they defend them against all troubles. How far from that are those who call themselves pastors but who ask for nothing but the wool – and are not even content with that. They must fleece their poor subjects; they cut their throats to suck up their blood.

One sees today that princes have neither regard nor consideration for their duty, which is to keep their subjects in good pasture. They are supposed to care for them but, on the contrary, they are like lions. Puffed up with pride, they think the world is created for them alone, and hence they have no scruples about swallowing up and eating the substance of poor people. And after they have thus consumed their poor subjects, ambition also pushes them to wage war. It does not matter to them that people burn and kill, and that the earth is full of orphans and widows. And why? Because they are princes, they say, and have power to do this. Indeed, but as the psalmist says, ‘God is seated in the midst of them and has ordained them with this charge for which they must give account’ (Psa. 47:8-9). And they will be judged like the very smallest. For ‘this world will pass’ with its ‘fashion’ (1 Cor. 7:31). But those who hold a slightly higher rank and dominion over the people must carefully note this – that they are pastors. That was known even by the pagans, for when they spoke of kings and princes, they by the pagans, for when they spoke of kings and princes, they called them pastors, as their writings demonstrate. And who taught them such language? God, who imprinted it in their hearts, so as to render inexcusable those who employ tyranny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Samuel: chapters 1-13</cite>, trans. D. F. Kelly (Edinburgh, 1992), pp 177-8.</span></figcaption>

<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>

<blockquote><p>Quest. II. If Peace-makers be blessed, how can any Nation with good conscience make war?

Answ. The Lord’s commandment to have peace with all men, doth not bind men simply, but with this condition, if it be possible, and as much as in us lieth: but when there is no hope of maintaining peace, then the Lord alloweth a lawful war, such as is for just defence, or claim of our needful due and right: for herein the case standeth with the body politick, as it doth with the natural body; while there is hope of health and safety, the Physician useth gentle means; but when the case is desperate, then he useth desperate means, and sometimes gives rank poison, to try if by any means life may be saved. And so may the safety of a State be sought by war, when Motions of peace will not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 35-36.</span></figcaption>

<blockquote><p>Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature.

<blockquote><p>[O]bserve the explanation, the origin, of persecution. It originates in the world’s hatred to Christ, and is directed against him. It must be so, seeing that Christ liveth in his people. Saul, Saul, wasting the Church, why persecutest thou me? And it is no extenuation of the world’s guilt in hating the saints, that they do not believe that Christ liveth in them—that they do not know or recognise Christ in them. Their rejection of those that are his stands exactly on the same footing with their rejection of him: “Henceforth the world knoweth us not, because it knew him not.”

Depravity blinded the world to the glory of Christ when he came in his own person, and blinds them to the measure of his glory in which he comes in the persons of his people. The bitter Ishmaelitish laugh and jest with which you, the worldling, scorn the Isaac of God, the promised seed; the hard words or hard deeds with which you, born after the flesh, persecute him that is born after the Spirit, will bear no excuse from your assertion that you did not know, you did not think, you did not see, that Christ was living in him—that it was really the promised Seed of the woman, Messiah himself, you were persecuting. For it is only your hatred and bitter prejudice that blind you. If you feared God and loved Christ, you would see him in his people: They that fear thee shall rejoice when they see me trusting in thy word; — “they shall glorify Christ in me.”

Ah ! consider, in your dislike of those that are Christ’s; in your suspicion of them; your hard thoughts and hard speeches concerning them; your discomfort in their presence when their godliness, their Christliness, comes out; your scornful joy over their infirmities and failures; —consider what a proof you have in all this of your deadly enmity to that Christ who liveth in them. You cannot but know that as yet Christ liveth in them only partially. If Christ is in them, the body is dead because of sin, though the Spirit is life because of righteousness. A body of sin and death is in them, as well as a living Christ. And that body of sin and death is a drawback on the completeness of the life and likeness of Christ in his people. They profess to give no more than a partial, though still a real, representation of Christ. They profess no more, though they long that it were far more, yea, long that it were unbroken and complete.

But were it so,—were their infirmities removed, their remaining corruption finally suppressed and extinguished; were there absolutely nothing seen or extant in them any more save Christ living in them in the unabated fulness and energy of his Holy grace and life; ah! you know that their society would be unspeakably more painful to you still; their Christliness would rebuke you more powerfully than now; your withdrawal from them, if withdrawal were possible, would be more complete: or if you could not escape their presence and their intercourse—if you found yourself in relations to them which you could not set aside—if you found them a people with whom, in their perfect righteousness, and holiness, and likeness to Christ, you could not but have to do,—ah! would not your dislike to them, your rejection of them, your resentment against them and their piety, break out in manifold strength and bitterness?

And what is this but just a proof that the more clearly Christ is revealed to you, the nearer Christ is brought to you, so much the more do you dislike him; and that were Christ, therefore, to come to you, not only in his own personal perfection in his people, but in himself, in his own perfect person, you would fully and finally reject Aim, and say, Depart from us, for we desire not thee, nor the knowledge of thy ways?” Ah! forget not that it is this, indeed, you do say, when now you reject his people. You reject, you persecute, him in them; for Christ liveth in them.

But let believers know what they are to expect at the world’s hands, and why. “Christ living in you” will not fare any better at the world’s hands than Christ sojourning in the world in the days of his flesh. The world is the same now as then. Christ in you is the same Christ as then. If they have kept his sayings, they will keep yours also; if they have persecuted him, they will persecute you. The servant is not greater than his Lord; it is enough if the servant be as his Lord. And it must be so, if his Lord liveth in him. Christ in his own person was the object of the world’s malice. Christ living in you will be so still.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[O]bserve the explanation, the origin, of persecution. It originates in the world’s hatred to Christ, and is directed against him. It must be so, seeing that Christ liveth in his people. Saul, Saul, wasting the Church, why persecutest thou me? And it is no extenuation of the world’s guilt in hating the saints, that they do not believe that Christ liveth in them—that they do not know or recognise Christ in them. Their rejection of those that are his stands exactly on the same footing with their rejection of him: “Henceforth the world knoweth us not, because it knew him not.”

Depravity blinded the world to the glory of Christ when he came in his own person, and blinds them to the measure of his glory in which he comes in the persons of his people. The bitter Ishmaelitish laugh and jest with which you, the worldling, scorn the Isaac of God, the promised seed; the hard words or hard deeds with which you, born after the flesh, persecute him that is born after the Spirit, will bear no excuse from your assertion that you did not know, you did not think, you did not see, that Christ was living in him—that it was really the promised Seed of the woman, Messiah himself, you were persecuting. For it is only your hatred and bitter prejudice that blind you. If you feared God and loved Christ, you would see him in his people: They that fear thee shall rejoice when they see me trusting in thy word; — “they shall glorify Christ in me.”

Ah ! consider, in your dislike of those that are Christ’s; in your suspicion of them; your hard thoughts and hard speeches concerning them; your discomfort in their presence when their godliness, their Christliness, comes out; your scornful joy over their infirmities and failures; —consider what a proof you have in all this of your deadly enmity to that Christ who liveth in them. You cannot but know that as yet Christ liveth in them only partially. If Christ is in them, the body is dead because of sin, though the Spirit is life because of righteousness. A body of sin and death is in them, as well as a living Christ. And that body of sin and death is a drawback on the completeness of the life and likeness of Christ in his people. They profess to give no more than a partial, though still a real, representation of Christ. They profess no more, though they long that it were far more, yea, long that it were unbroken and complete.

But were it so,—were their infirmities removed, their remaining corruption finally suppressed and extinguished; were there absolutely nothing seen or extant in them any more save Christ living in them in the unabated fulness and energy of his Holy grace and life; ah! you know that their society would be unspeakably more painful to you still; their Christliness would rebuke you more powerfully than now; your withdrawal from them, if withdrawal were possible, would be more complete: or if you could not escape their presence and their intercourse—if you found yourself in relations to them which you could not set aside—if you found them a people with whom, in their perfect righteousness, and holiness, and likeness to Christ, you could not but have to do,—ah! would not your dislike to them, your rejection of them, your resentment against them and their piety, break out in manifold strength and bitterness?

And what is this but just a proof that the more clearly Christ is revealed to you, the nearer Christ is brought to you, so much the more do you dislike him; and that were Christ, therefore, to come to you, not only in his own personal perfection in his people, but in himself, in his own perfect person, you would fully and finally reject Aim, and say, Depart from us, for we desire not thee, nor the knowledge of thy ways?” Ah! forget not that it is this, indeed, you do say, when now you reject his people. You reject, you persecute, him in them; for Christ liveth in them.

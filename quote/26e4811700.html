<blockquote><p>I refer to the power of God with the greatest reserve; yet there are many things which cannot be done because the nature of things does not permit: they are contraries, and as you said imply contradiction, which is not to be attributed to any infirmity in God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c1d9e3c658" data-kw="">
<blockquote><p>Again, it is asked about what is said, “And God is called angry; but there is no anger in Him.” For He seems to speak wrongly, because in God there is a rational and a concupiscible power: therefore by equal reason an irascible power must be posited in God: therefore just as the act of cognition and love is truly in Him, so properly is the act of fury. I answer: It must be said that the irascible [power] in some way sounds of imperfection by the definition of its name; and therefore some say that it is in no way received in God, not even transumptively. However, since the acts of this power in us are to glory and to dominate, and these are in God; why not similarly this power? And it must be said therefore that in God there is truly this power of glorying and dominating, which is the divine substance itself. However, because anger has a passion conjoined to it by the definition of its name, therefore neither the irascible [power] nor anger is received in God, except transumptively and in tropical speech. And it is to be noted that God has signs of anger, not which signify anger in Him, but which signify anger in us and truly, when they are in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1, dist. 45, Doubt 10 tr. AI by The Faith Received</span></figcaption>

</figure><figure class="quote" id="q-354cd715bd" data-kw="">
<blockquote><p>…He says by this will to Judas the traitor, ‘I command and will your final obedience,’ that is, I approve, and hold it morally pleasing and acceptable, whether that obedience actually exists, or not, as the law of an earthly prince is not made to this end, that men should simply cultivate society, but on the hypothesis of society being cultivated, that they should order their life civilly and according to the rule and norm of good laws; so the formal use of the Word of God revealing to us the will of sign is to illuminate, lead, direct what may be the pleasing good acceptable will of God, and how our acts, on the hypothesis that they are elicited and exist, can be instituted according to the Word of God, so that they may be pleasing and acceptable to God, and worthy of reward in Christ.</p></blockquote>

</figure><figure class="quote" id="q-221bfde8a3" data-kw="">
<blockquote><p>As for the divine commiseration of sinners, it shows that their death and damnation are not things primarily well-pleasing unto God: but it shows not that God must become an hypocrite and a dissembler if He have eternally decreed to permit them to incur death and damnation by their own default. For God’s mercy being actio sublevantis [an act of taking away] and not passio condolentis [a passion of suffering with], it ties Him not to do all He can for redeeming any man out of his misery; but his action is ordered and limited by his own free-will. It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, … (Cambridge, 1641), ‘Whether absolute reprobation oppugn the truth and sincerity of God’, pp. 357-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-46d54d6e63" data-kw="">
<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians</cite>, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.”

— Paul Baynes, A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDoctrine+3.+%E2%80%98Counsel+of+his+will%E2%80%99.+That+is+which+his+will+propounded+to+it%2C+%5Bit%5D+did+freely+accept.+Observe+hence+that+what+God+wills+once%2C+that+He+effectually+works%2C+see+Ps.+115%2C+%E2%80%98Our+God+is+in+heaven+and+does+whatsoever+He+wills%3A+Who+has+refused+his+will%3F%E2%80%99+so+Isa.+46%3A10.+We+see+in+beasts+that+they+have+an+appetite+to+that+%5Bwhich%5D+they+move+after%3B+in+men+that+which+they+will%2C+that+they+put+out+their+power+to+effect%3B+so+it+is+in+God%3A+if+He+will+anything%2C+He+does+work+it+effectually.+That+is+a+frivolous+distinction+of+an+effectual+and+an+ineffectual+will+in+God%2C+which+stands+neither+with+truth+of+Scripture%2C+as+in+this+place%2C+nor+with+the+blessedness+of+God%2C+nor+with+the+nature+of+things%3A+all+that+showed+Him%2C+which+his+will+accepts%2C+He+does+effectually+work+it.+%5BIt+is%5D+Against+%5Bthe%5D+blessedness+of+God%3A+for+might+God+will+a+thing+and+not+have+it%2C+He+were+not+fully+blessed%2C+when+to+have+every+good+will+is+more+blessed+than+to+want+%5Black%5D+it.+Against+%5Bthe%5D+nature+of+things%2C+for+everything+which+will+and+ability+works%2C+if+God+almighty+have+will+to+anything%2C+the+thing+must+needs+follow.+Where+there+is+full+power+to+work+anything%2C+applied+to+the+working+of+it%2C+the+thing+wrought+must+needs+follow.+Here+some+distinguish+and+say+that+in+things+which+God+will+do%2C+his+power+does+work+them+effectually%2C+but+the+things+which+God+would+have+on+condition+from+us%2C+those+his+power+does+not+work%3A+an+old+Pelagian+conceit.+Would+not+God+have+us+walk+in+his+commandments%2C+and+has+He+not+said+that+He+will+put+his+Spirit+in+us+and+make+us+walk+in+them%3F+St.+Augustine+learned+that+God+did+promise+to+work+mightily+those+things+He+requires+from+us.+If+to+have+the+conditional+will+be+more+happy+than+to+want+it%2C+then+God+who+has+power+to+work+the+condition+in+us+will+not+want+it%3A+Not+to+say+that+this+conditional+will+is+absurdly+imagined+in+God%3A+He+must+will+the+having+a+thing+on+condition+which+He+will+not+work%2C+and+then+it+is+impossible%2C+unless+the+creature+can+do+something+good+which+He+will+not+do+in+him%3B+or+on+condition+which+He+will+work%2C+and+then+He+works+all+He+wills%3B+or+on+such+a+condition+which+He+sees+the+creature+cannot+perform%2C+nor+Himself+will+not+make+Him+perform%3B+and+this+were+idle+and+frivolous.%E2%80%9D%0A%0A%E2%80%94+Paul+Baynes%2C+A+Commentary+upon+the+First+Chapter+of+the+Epistle+of+Saint+Paul%2C+written+to+the+Ephesians%2C+%E2%80%A6+some+Principal+Controversies+about+Predestination+are+handled%2C+and+diverse+arguments+of+Arminius+are+examined+%28London%2C+1618%29%2C+on+Eph.+1%3A11%2C+pp.+254-55+Note+Baynes%E2%80%99s+context+against+Arminius.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46d54d6e63.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46d54d6e63.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=Doctrine%203.%20%E2%80%98Counsel%20of%20his%20will,and%20this%20were%20idle%20and%20frivolous&amp;text=Doctrine%203.%20%E2%80%98Counsel%20of%20his%20will%E2%80%99.%20That%20is&amp;text=Him%20perform%3B%20and%20this%20were%20idle%20and%20frivolous" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

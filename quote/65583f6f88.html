<main class="wrap"><figure class="quote" id="q-65583f6f88" data-kw="">
<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>

<blockquote><p>§12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

</figure><figure class="quote" id="q-addf886a5b" data-kw="">
<blockquote><p>I will make your cause better than you have made it, but not by making other men’s worse, but by opening the reconciling truth. I. I shall tell you in what sense God’s will and decrees may and must be said to have an extrinsic cause, without change in God. (Predestinatio nihil ponit in praedestinato inquit [Predestination places nothing in the one who is predestined]; Aquinas, pt. 1, q. 23, art. 2) 1. Know therefore that God’s essence is his will, but not as essence. To say that God is God, and that God wills this or that, are not terms of the same signification. 2. God’s will is his essence denominated from some amiable good as the object; and so there is ever quid respectivum [in that respect] in the notion of will. 3. As God wills Himself, the act being perfectly immanent, his will is called Himself much more properly than his will of things extrinsic (which is ever either effectively, or at least objectively transient), because it is God that wills, and that is willed or loved (which made many ancients say that this was the Third Person in the Trinity). 4. But as God wills things ad extra [to things outside Himself], though it is his essence that so wills them, yet it is unfit to say simply that this will is God; e.g. that to will Peter’s salvation is God, because the name ‘will’ here includes the thing willed. 5. And therefore when we speak of God’s will in the universal notion, as abstracted from all particular objects and acts, it is less inconvenient to say simply that this will is God than when we speak of his will in act ad extra. By this time you may see that though God’s will, as his essence, has no cause, yet his will as denominated extrinsically from the object may have some kind of cause, that is objective, which is quasi materia actus [the matter of the act, as it were], and the terminus sine quo non [end-without-which-nothing] (Alvarez himself says that by a ’cause’ he means also any objective condition or reason of the act); that is, God’s will is not denominated a complacency in Christ existent or in Peter regenerate, or his understanding a seeing that the world was good before any of these things did exist. (This is all that Ruiz’s reasons prove, Of the Will of God, disp. 115, sect. 4, p. 102, who says that there is more than extrinsic denomination; et relatio rationis quam realis formalitas [and a relation of reason rather than a real formality]. But he does but show by his quodammodo [in some way], that he knows not what to say.) So that by extrinsic denomination, without any change in God, He may and should be said de novo [of new] to know things to be existent, to be past, to will things as existent with complacency or will them with displicency: But not to will the futurity of men’s damnation de novo; but yet his will of the futurity of men’s damnation has several degrees of the objective cause, from whence it is denominated: As in esse cognito [known being], the person who is the object is in order of nature first a man, a subject, and then a sinner, and a despiser of mercy, and then a damnable sinner. And so these are indeed conditions in the object, or causae sine quibus non [causes without which nothing], or objective material-constituent causes, not in themselves, but the foresight of them, not of God’s will as his essence, nor of his will as a will, but of his will as extrinsically denominated: a decree to damn Judas, e.g. because no otherwise is Judas an object capable of giving such an extrinsic denomination to God’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination</cite>, pp. 8-9</span></figcaption>

as+denominated+extrinsically+from+the+object+may+have+some+kind+of+cause%2C+that+is+objective%2C+which+is+quasi+materia+actus+%5Bthe+matter+of+the+act%2C+as+it+were%5D%2C+and+the+terminus+sine+quo+non+%5Bend-without-which-nothing%5D+%28Alvarez+himself+says+that+by+a+%E2%80%99cause%E2%80%99+he+means+also+any+objective+condition+or+reason+of+the+act%29%3B+that+is%2C+God%E2%80%99s+will+is+not+denominated+a+complacency+in+Christ+existent+or+in+Peter+regenerate%2C+or+his+understanding+a+seeing+that+the+world+was+good+before+any+of+these+things+did+exist.+%28This+is+all+that+Ruiz%E2%80%99s+reasons+prove%2C+Of+the+Will+of+God%2C+disp.+115%2C+sect.+4%2C+p.+102%2C+who+says+that+there+is+more+than+extrinsic+denomination%3B+et+relatio+rationis+quam+realis+formalitas+%5Band+a+relation+of+reason+rather+than+a+real+formality%5D.+But+he+does+but+show+by+his+quodammodo+%5Bin+some+way%5D%2C+that+he+knows+not+what+to+say.%29+So+that+by+extrinsic+denomination%2C+without+any+change+in+God%2C+He+may+and+should+be+said+de+novo+%5Bof+new%5D+to+know+things+to+be+existent%2C+to+be+past%2C+to+will+things+as+existent+with+complacency+or+will+them+with+displicency%3A+But+not+to+will+the+futurity+of+men%E2%80%99s+damnation+de+novo%3B+but+yet+his+will+of+the+futurity+of+men%E2%80%99s+damnation+has+several+degrees+of+the+objective+cause%2C+from+whence+it+is+denominated%3A+As+in+esse+cognito+%5Bknown+being%5D%2C+the+person+who+is+the+object+is+in+order+of+nature+first+a+man%2C+a+subject%2C+and+then+a+sinner%2C+and+a+despiser+of+mercy%2C+and+then+a+damnable+sinner.+And+so+these+are+indeed+conditions+in+the+object%2C+or+causae+sine+quibus+non+%5Bcauses+without+which+nothing%5D%2C+or+objective+material-constituent+causes%2C+not+in+themselves%2C+but+the+foresight+of+them%2C+not+of+God%E2%80%99s+will+as+his+essence%2C+nor+of+his+will+as+a+will%2C+but+of+his+will+as+extrinsically+denominated%3A+a+decree+to+damn+Judas%2C+e.g.+because+no+otherwise+is+Judas+an+object+capable+of+giving+such+an+extrinsic+denomination+to+God%E2%80%99s+will.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+%28London%3A+White%2C+1675%29%2C+pt.+2%2C+1st+Day%E2%80%99s+Conference%2C+about+Predestination%2C+pp.+8-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faddf886a5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/addf886a5b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-knowledge-omniscience/#:~:text=I%20will%20make%20your%20cause%20better,an%20extrinsic%20denomination%20to%20God%E2%80%99s%20will&amp;text=I%20will%20make%20your%20cause%20better%20than%20you&amp;text=giving%20such%20an%20extrinsic%20denomination%20to%20God%E2%80%99s%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Many more effectual reasons are produced by our divines for the denial of this natural affection in God [necessarily resulting in sending Christ for the human race, Jn. 3:16] in the resolution of the Arminian distinction (I call it so, as now by them abused) of God’s antecedent and consequent will, to whom the learned reader may repair for satisfaction: so that the love mentioned in this place is not that natural affection to all in general, which is not:</p></blockquote>

</figure><figure class="quote" id="q-4e40a5d205" data-kw="">
<blockquote><p>And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.</p></blockquote>

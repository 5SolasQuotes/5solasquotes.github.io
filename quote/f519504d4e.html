</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f522974a21" data-kw="">
<blockquote><p>Creatures considered through individual species are usually divided among physicists either according to the species of natural body, which is simple and mixed, etc. or according to the parts of the world, which are containers and contents, celestial and elemental, etc. We, presently omitting those things, will follow the division by the works of the six days’ creation frequented by all theologians and chronologers; and we will explain some things about the system of the world from Mosaic physics in the manner and method of theologians. For to want to call that into doubt, and to reduce it to absurdity belongs to those who, being unwise, refuse to submit their wisdom to the most Holy Spirit, and pave the way for themselves and others to Libertinism or atheism: while the system of the world described by Moses to them does not seem dissimilar to the fables and absurdities of Muhammad about the earth being founded on the horn of an ox (in the book Sunna), about the sun when it sets, immersing itself in a bubbling spring of water (Quran, chapter on the Cave). Objections and exceptions against the sacred Mosaic physics which are usually brought forward are not so subtle that they cannot be resolved. As among others Francis Junius shows against the 22 arguments of Simplicius, and of today’s antinomians, at the end of the explanation of the first three chapters of Genesis: with whom Scipio Claromontius, On the Universe, should be compared, and other philosophers to be cited below, who do not allow anti-Mosaic systems of the moderns to be foisted upon them…. …Heaven and the angels were created on the First Day. The reasons are: … 2. Because nowhere in the Hexaemeron is mention made of the creation of that heaven and the angels: but God completed in six days all things that were created, Gen. 2:1, and that heaven is among things created, Heb. 11:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2 Latin | On Creation, pt. 3</cite>, p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-fa789451f9" data-kw="">
<blockquote><p>As it is of the law of nature that, in general, a due proportion of time be set apart for the worship of God; so, in his Word, by a positive, moral, and perpetual commandment, binding all men in all ages, he hath particularly appointed one day in seven for a Sabbath, to be kept holy unto him:a which, from the beginning of the world to the resurrection of Christ, was the last day of the week; and, from the resurrection of Christ, was changed into the first day of the week,b which in Scripture is called the Lord’s day,c and is to be continued to the end of the world, as the Christian Sabbath.d a. Exod 20:8, 10-11; Isa 56:2, 4, 6-7. • b. Gen 2:2-3; Acts 20:7; 1 Cor 16:1-2. • c. Rev 1:10. • d. Exod 20:8, 10 with Mat 5:17-18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 21.7</span></figcaption>

<blockquote><p>Ordination is the act of a presbytery.[t] The power of ordering the whole work of ordination is in the whole presbytery, which, when it is over more congregations than one, whether these congregations be fixed or not fixed, in regard of officers or members, it is indifferent as to the point of ordination.[v] [t] 1 Tim. 4:14. [v] 1 Tim. 4:14. It is very requisite, that no single congregation, that can conveniently associate, do assume to itself all and sole power in ordination: 1. Because there is no example in scripture that any single congregation, which might conveniently associate, did assume to itself all and sole power in ordination; neither is there any rule which may warrant such a practice. 2. Because there is in scripture example of an ordination in a presbytery over diverse congregations; as in the church of Jerusalem, where were many congregations: these many congregations were under one presbytery, and this presbytery did ordain. The preaching presbyters orderly associated, either in cities or neighboring villages, are those to whom the imposition of hands doth appertain, for those congregations within their bounds respectively.</p></blockquote>

<blockquote><p>First, a succession in the Church is necessary ordinarily; extraordinarily, and in cases of necessity it may be wanting… Occam [a Medieval Romanist] says laymen and teachers extraordinarily raised up may succeed to heretical pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 185</span></figcaption>

</figure><figure class="quote" id="q-ab143f1f23" data-kw="">
<blockquote><p>You will reply: It is because they are ministers ordained by antichristian bishops; and therefore, before they have renounced their false ministry we cannot with a safe conscience hear them, nor expect a blessing from their ministry. This reply is, we confess, a great stumbling block to many godly people in this kingdom. For satisfaction to it we offer these particulars: 1. Many of you [congregationalists] that make this reply hold that the election of the people is by God’s Word sufficient to make a man a true minister without ordination. Now it is certain that many public [Anglican] ministers have been chosen by the free and full consent of their congregations; and most of them have had an after consent, which was sufficient to make Leah Jacob’s wife (Subsequens consensus Jacobi in Leam, fecit eos conjuges. [David] Pareus, etc.), and why not (to use your own words) to marry a man to a people; and therefore according to your own judgments all such are lawful ministers. For sinful superadditions do not nullify divine institutions. 2. Some of you that, besides election, require ordination for the making of a minister, yet say that this ordination must be by the people of the congregation; and thus are your ministers ordained. Now we find neither precept nor precedent for this in all the Scripture: We find ordination by the laying on of the hands of the presbytery (1 Tim. 4:14), but never of the laying on of the hands of the people. We find the apostles, Timothy and Titus ordaining (Acts 14:23; 1 Tim. 5:22; Tit. 1:5), but never the people ordaining; and for private persons to assume the power of ordination (that is, a power to send men to preach the Gospel and administer the sacraments) is a sin like unto the sin of Uzzah and of Korah and his company. Therefore we say to you as Christ does, Mt. 6, ‘First pluck the beam out of thine own eye, and then, etc.’ First justify the ordination of your own ministers by private persons and then you will see better to find fault with the ordination of our ministers. 3. We distinguish between a defective ministry and a false ministry, as we do between a man that is lame or blind and a man that is but the picture of a man. We do not deny but that the way of ministers entering into the ministry by the bishops had many defects in it, for which they ought to be humbled. But we add that, notwithstanding all the accidental corruptions, yet it is not substantially and essentially corrupted, as it is with baptism [not being substantially and essentially corrupted] in the Popish Church. All orthodox divines account it valid, though mingled with much dross, because the party baptized is baptized in the name of the Father, Son, and Holy Ghost. And therefore, when a Papist turns protestant, he is not baptized again, because the substance of baptism is preserved in Popery under many defects. The like and much more may be said for the ordination of our ministers by bishops: It is lawful and valid for the substance of it, though mingled with many circumstantial defects. And this appears: 1. Because when they were ordained, they were designed to no other office but to preach the Word and administer the sacraments according to the will of Christ. 2. Because since their ordination God has sealed the truth of their ministry (as has been said) by his blessing upon it. If they be antichristian ministers, how is your conversion Christian? 3. Because they were ordained by bishops, not as lord bishops or as a superior order by divine right above a presbyter, but as they were presbyters. For the understanding of which you must know: 1. That by Scripture a bishop and presbyter is all one, as appears by Acts 10:27-28; Tit. 1:5-8; Phil. 1:1; 1 Tim. 3:1-2, etc. 1 Pet. 5:1-2, and by what is said by the authors quoted in the margin. (Smectymnuus, The Answer of Mr. Marshal, Mr. Vines, Mr. Caryl, Mr. Seaman returned to the late King in the Treaty at the Isle of Wight) 2. That the lordly dignities of bishops were mere civil additaments annexed to their bishoprics by kingly favor. 3. That this opinion, that bishops are a superior order of ministry by divine right above a presbyter is a late upstart opinion contrary to antiquity, as appears by the authors quoted in the margin. (Ambrose in ch. 4 to the Ephesians and in 1 Tim. 3; Jerome in Tit. 1 and to Evagrius; Augustine, Epistle 19; Chrysostom in 1 Tim. 3) 4. That the laws of this realm do account nothing divine in a bishop but his being a presbyter; and therefore the parliament in their ordinance for ordination tells us that they did ordain [them] as presbyters, not as bishops, much less as lord bishops. As for their usurpation of the sole power of jurisdiction together with their lordly titles and dignities and dependances, we have renounced them in our Solemn League and Covenant [1643]. But we never did, nor never shall renounce them as presbyters, which by the consent of all sides are by divine right. 4. We shall add one thing more, that ministers do not receive their ministry from the people, or bishops, but immediately from Jesus Christ. For they are ministers and ambassadors of Christ, not of the people. Indeed they are ambassadors for the good of the people, but not ambassadors of the people. All that the people or bishop does is but to choose and ordain a man, but it is Christ that gives him his power and authority, as when a wife chooses a husband and a town a mayor: the town does not give the mayor, nor the wife the husband the power they have, but the laws of God the one, and of man the other. So it is here, it is Christ that gives the office and the call to the ministry; they are his servants and in his name execute their function. It is He that fits them with ability for their work; the people they consent, and the bishop as a presbyter with other presbyters ordain him; which though it had many corruptions mingled with it, when the bishop was in all his pomp and lordliness, yet for the substance of it, it was lawful and warrantable and therefore cannot without sin be renounced and abjured.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London</cite>, (Presbyterian) Provincial Assembly | A Vindication of the Presbyterial-Government &amp; the Ministry… (London, 1650), pt. 2, pp. 123-26</span></figcaption>

ding+of+which+you+must+know%3A+1.+That+by+Scripture+a+bishop+and+presbyter+is+all+one%2C+as+appears+by+Acts+10%3A27-28%3B+Tit.+1%3A5-8%3B+Phil.+1%3A1%3B+1+Tim.+3%3A1-2%2C+etc.+1+Pet.+5%3A1-2%2C+and+by+what+is+said+by+the+authors+quoted+in+the+margin.+%28Smectymnuus%2C+The+Answer+of+Mr.+Marshal%2C+Mr.+Vines%2C+Mr.+Caryl%2C+Mr.+Seaman+returned+to+the+late+King+in+the+Treaty+at+the+Isle+of+Wight%29+2.+That+the+lordly+dignities+of+bishops+were+mere+civil+additaments+annexed+to+their+bishoprics+by+kingly+favor.+3.+That+this+opinion%2C+that+bishops+are+a+superior+order+of+ministry+by+divine+right+above+a+presbyter+is+a+late+upstart+opinion+contrary+to+antiquity%2C+as+appears+by+the+authors+quoted+in+the+margin.+%28Ambrose+in+ch.+4+to+the+Ephesians+and+in+1+Tim.+3%3B+Jerome+in+Tit.+1+and+to+Evagrius%3B+Augustine%2C+Epistle+19%3B+Chrysostom+in+1+Tim.+3%29+4.+That+the+laws+of+this+realm+do+account+nothing+divine+in+a+bishop+but+his+being+a+presbyter%3B+and+therefore+the+parliament+in+their+ordinance+for+ordination+tells+us+that+they+did+ordain+%5Bthem%5D+as+presbyters%2C+not+as+bishops%2C+much+less+as+lord+bishops.+As+for+their+usurpation+of+the+sole+power+of+jurisdiction+together+with+their+lordly+titles+and+dignities+and+dependances%2C+we+have+renounced+them+in+our+Solemn+League+and+Covenant+%5B1643%5D.+But+we+never+did%2C+nor+never+shall+renounce+them+as+presbyters%2C+which+by+the+consent+of+all+sides+are+by+divine+right.+4.+We+shall+add+one+thing+more%2C+that+ministers+do+not+receive+their+ministry+from+the+people%2C+or+bishops%2C+but+immediately+from+Jesus+Christ.+For+they+are+ministers+and+ambassadors+of+Christ%2C+not+of+the+people.+Indeed+they+are+ambassadors+for+the+good+of+the+people%2C+but+not+ambassadors+of+the+people.+All+that+the+people+or+bishop+does+is+but+to+choose+and+ordain+a+man%2C+but+it+is+Christ+that+gives+him+his+power+and+authority%2C+as+when+a+wife+chooses+a+husband+and+a+town+a+mayor%3A+the+town+does+not+give+the+mayor%2C+nor+the+wife+the+husband+the+power+they+have%2C+but+the+laws+of+God+the+one%2C+and+of+man+the+other.+So+it+is+here%2C+it+is+Christ+that+gives+the+office+and+the+call+to+the+ministry%3B+they+are+his+servants+and+in+his+name+execute+their+function.+It+is+He+that+fits+them+with+ability+for+their+work%3B+the+people+they+consent%2C+and+the+bishop+as+a+presbyter+with+other+presbyters+ordain+him%3B+which+though+it+had+many+corruptions+mingled+with+it%2C+when+the+bishop+was+in+all+his+pomp+and+lordliness%2C+yet+for+the+substance+of+it%2C+it+was+lawful+and+warrantable+and+therefore+cannot+without+sin+be+renounced+and+abjured.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+London+%28Presbyterian%29+Provincial+Assembly+%7C+A+Vindication+of+the+Presbyterial-Government+%26+the+Ministry%E2%80%A6+%28London%2C+1650%29%2C+pt.+2%2C+pp.+123-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab143f1f23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab143f1f23.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ordination/#:~:text=You%20will%20reply%3A%20It%20is%20because,without%20sin%20be%20renounced%20and%20abjured&amp;text=You%20will%20reply%3A%20It%20is%20because%20they%20are&amp;text=therefore%20cannot%20without%20sin%20be%20renounced%20and%20abjured" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

ne%20could%20in%20fact%20defend%20the,that%20makes%20possible%20those%20universalistic%2Dsounding%20phrases&amp;text=One%20could%20in%20fact%20defend%20the%20paradox%20that&amp;text=of%20predestination%20that%20makes%20possible%20those%20universalistic%2Dsounding%20phrases" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. That private Christians in an extraordinary case, in a Church to be erected or that is decayed and ruined, may sometimes publicly preach the Word of God for the planting a Church when there are not such as by God’s ordinary call have received from God power to preach the Word. For the positive ritual law of God gives place to the moral law of God when necessity requires it. 3. We grant also that private Christians in some special cases, and upon a particular occasion, may sometimes speak the Word of God in public by a special calling from God: as martyrs are called to a public confession of the faith. But all this does not infer that there is an exercise of prophesy constantly and ordinarily to be observed in the Church, whereby the Word should by private Christians in the Name of Christ and with all authority be publicly preached for the edification of the Church. And therefore we maintain the negative of the question proposed, and deny that there is such an exercise to be perpetually retained in the Church of Christ.</p></blockquote>

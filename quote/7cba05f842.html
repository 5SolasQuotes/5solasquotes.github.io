<blockquote><p>As has been expressed, this article’s considerations have been put forth with the intention of describing reality and ethical living, which we do everyday, more accurately and fully, not to open up a pandora’s box or skepticism. Indeed, very precise and somewhat complex principles and argumentation (perhaps dizzying) has been used, but that has only been to confirm common sense (or upright practical reason) from subtle, but very significant and potent, practical error, for people’s health. Flee all sophistry¹ (Isa. 5:20-21; Mt. 22:18; Col. 2:8) and simplistic ignorance (Ps. 19:7; Prov. 1:22; 8:5), both which are unworthy of your intelligence and hinder the fruit of God’s truth. † See ‘Which Philosophy Should be Used?’ at ‘Philosophy’ (RBO). ¹ See ‘On Sophistry’ at ‘On the Use of Reason in Theology’ (RBO). Be assured in all this in what is presented here there is no slippery slope. The weight of nature, and that which is above nature, in conjunction with it, will and ought to bear determinative ethical weight in situations according to the natures, context and proportions of that which is involved. God’s Law requires this (Lev. 19:15; Job 34:10-12; Ps. 28:4; 99:4; Prov. 2:9; Jer. 32:19; Mic. 6:8; Zech. 7:9; Mt. 16:27; 23:23; 26:60-61; Mk. 14:61-64; 15:31; Lk. 23:39; Jn. 7:24; 19:12, 17-22).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, [Edward] Feser’ (RBO, 2025) | Summary Conclusions, Philosophy Descriptive of Reality†</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a312a8286" data-kw="">
<blockquote><p>Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1, verse 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

olasquotes.github.io%2Fquote%2F8a312a8286.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a312a8286.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=Some%20infer%20from%20this%20passage%20that,ingratitude%20might%20have%20the%20less%20excuse&amp;text=Some%20infer%20from%20this%20passage%20that%20men%20were&amp;text=that%20their%20ingratitude%20might%20have%20the%20less%20excuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d3efde158d" data-kw="">
<blockquote><p>Argument 8— He who, by office, is obliged to expend himself, and to give his life for the safety of the people, must be inferior to the people. So Christ says, the life is more than raiment or food, because both these give themselves to corruption for man’s life; so the beasts are inferior to man, because they die for our life, that they may sustain our life. And Caiaphas prophesied right, that it was better that one man die than the whole nation perish (John 11:50); and in nature, elements, against their particular inclination, defraud themselves of their private and particular ends, that the commonwealth of nature may stand; as heavy elements ascend, light descend, lest nature should perish by a vacuity. And the good Shepherd (John 10) gives his life for his sheep; so both Saul and David were made kings to fight the Lord’s battles, and to expose their lives to hazard for the safety of the church and people of God. But the king, by office, is obliged to expend his life for the safety of the people of God; he is obliged to fight the Lord’s battles for them; to go betwixt the flock and death, as Paul was willing to be spent for the church. It may be objected, Jesus Christ gave Himself a ransom for his church, and his life for the life of the world, and was a gift given to the world (John 3:16; 4:10) and He was a mean to save us; and so, what arguments we have before produced to prove that the king must be inferior to the people, because he is a ransom, a mean, a gift, are not conclusive, I answer: 1. Consider a mean reduplicatively, and formaliter, [formally] as a mean; and secondly, as a mean materially, that is, the thing which is a mean. 2. Consider that which is only a mean and ransom, and gift, and no more; and that which, beside that it is a mean, is of a higher nature also. So Christ formally as a mean, giving his temporal life for a time, according to the flesh, for the eternal life of all the catholic Church, to be glorified eternally—(not his blessed Godhead and glory, which, as God, He had with the Father from eternity)— in that respect Christ has the relation of a servant, ransom, gift, and some inferiority in comparison of the Church of God; and his Father’s glory, as a mean, is inferior to the end; but Christ materially, in concreto [in particular, materially]: Christ is not only a mean to save his Church, but, as God (in which consideration He was the immortal Lord of life) He was more than a mean— even the Author, Efficient and Creator of heaven and earth; and so there is no ground to say that He is inferior to the Church, but the absolute head, king— the chief of ten thousand— more in excellency and worth than ten thousand millions of possible worlds of men and angels. But such a consideration cannot befall any mortal king; because, consider the king materially as a mortal man, he must be inferior to the whole church, for he is but one, and so of less worth than the whole church; as the thumb, though the strongest of the fingers, yet it is inferior to the hand, and far more to the whole body, as any part is inferior to the whole. Consider the king reduplicative and formally as king, and by the official relation he has, he is no more than but a royal servant, an official mean tending, ex officio [from his office], to this end, to preserve the people, to ride and govern them; and a gift of God, given by virtue of his office, to rule the people of God, and so any way inferior to the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 79</span></figcaption>

om%2C+and+gift%2C+and+no+more%3B+and+that+which%2C+beside+that+it+is+a+mean%2C+is+of+a+higher+nature+also.+So+Christ+formally+as+a+mean%2C+giving+his+temporal+life+for+a+time%2C+according+to+the+flesh%2C+for+the+eternal+life+of+all+the+catholic+Church%2C+to+be+glorified+eternally%E2%80%94%28not+his+blessed+Godhead+and+glory%2C+which%2C+as+God%2C+He+had+with+the+Father+from+eternity%29%E2%80%94+in+that+respect+Christ+has+the+relation+of+a+servant%2C+ransom%2C+gift%2C+and+some+inferiority+in+comparison+of+the+Church+of+God%3B+and+his+Father%E2%80%99s+glory%2C+as+a+mean%2C+is+inferior+to+the+end%3B+but+Christ+materially%2C+in+concreto+%5Bin+particular%2C+materially%5D%3A+Christ+is+not+only+a+mean+to+save+his+Church%2C+but%2C+as+God+%28in+which+consideration+He+was+the+immortal+Lord+of+life%29+He+was+more+than+a+mean%E2%80%94+even+the+Author%2C+Efficient+and+Creator+of+heaven+and+earth%3B+and+so+there+is+no+ground+to+say+that+He+is+inferior+to+the+Church%2C+but+the+absolute+head%2C+king%E2%80%94+the+chief+of+ten+thousand%E2%80%94+more+in+excellency+and+worth+than+ten+thousand+millions+of+possible+worlds+of+men+and+angels.+But+such+a+consideration+cannot+befall+any+mortal+king%3B+because%2C+consider+the+king+materially+as+a+mortal+man%2C+he+must+be+inferior+to+the+whole+church%2C+for+he+is+but+one%2C+and+so+of+less+worth+than+the+whole+church%3B+as+the+thumb%2C+though+the+strongest+of+the+fingers%2C+yet+it+is+inferior+to+the+hand%2C+and+far+more+to+the+whole+body%2C+as+any+part+is+inferior+to+the+whole.+Consider+the+king+reduplicative+and+formally+as+king%2C+and+by+the+official+relation+he+has%2C+he+is+no+more+than+but+a+royal+servant%2C+an+official+mean+tending%2C+ex+officio+%5Bfrom+his+office%5D%2C+to+this+end%2C+to+preserve+the+people%2C+to+ride+and+govern+them%3B+and+a+gift+of+God%2C+given+by+virtue+of+his+office%2C+to+rule+the+people+of+God%2C+and+so+any+way+inferior+to+the+people.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle% <blockquote><p>201. There is in the very essence of the natural power or faculty, besides the vis vel virtus agendi, a certain natural inclination to some things, which is inseparable from it, from which the schoolmen say even of the will that it is quaedam natura, et pondus animae. So the soul is inclined or propense (and not only able) to activity as such, to intellection as such, to volition as such; and objectively to truth as such, and to natural good and felicity as such. And there is an inclination of the soul, which is not essential and inseparable, but is much under the power of the will, and may be got and lost. 202. This adventitious disposition is found in the soul in various degrees: 1. When it is in such a degree only, as that immediately and properly without any other power added, the will may be said to be able to act thus or thus, then it is called a moral power: [2.] But when it is in such a degree as that we are disposed to act promptly and easily, it is called a habit.</p></blockquote>

med Books Online</a></div>

<blockquote><p>If by ‘thinking’ we mean the capacity for what Bermudez calls direct belief modification, goal-desires, simple seeing, dispositions to form beliefs about things of a general type, and so forth, then non-linguistic animals are capable of thinking. But all of this falls within the range of capacities made possible by what Aristotelians traditionally call the ‘internal senses’. It doesn’t follow that non-linguistic animals are capable of what Bermudez calls second-order cognition, higher-order desires, the attribution to others of propositional attitudes, reflective belief modification, a grasp of compound, modal, tensed and general propositions, situation-desires and epistemic seeing, and so forth… If that is the sort of thing we mean by ‘thinking,’ then there is good reason to conclude that non-linguistic animals are not capable of thinking… Karl Popper drew a distinction between four main functions of language. The first is the expressive function, which involves the outward expression of an inward state… The second is the signaling function, which adds to the expressive function the generation of a reaction in others. Popper compares it to the dange signals an animal might send out in order to alert other animals… The third is the descriptive function, which involves the expression of a proposition, something that can be either true or false… The fourth is the argumentative function, which involves the expression of an inference from one or more propositions to another in a manner that can be said to be either valid or invalid… While the most primitive animals may be incapable of behavior that performs even the first two of these functions, there are also obviously animals that can perform them, and in that sense they can be said to have language. But… [this] does not entail being capable of the descriptive and argumentative functions… Whether animals lacking that particular sort of language, can be said to think in the sense of entertaining concepts, propositions, and logical inferences… the answer must be in the negative.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-34326e8cff" data-kw="">
<blockquote><p>God’s reconciliation to us must precede our reconciliation to him. This, as remarked above, is the great doctrine of the Bible. So long as we are under the wrath and curse of God, due to us for sin, we are aliens and enemies, cut off from his favor and fellowship, which are the life of the soul. Therefore until God’s wrath and curse are removed, there is no possibility of holiness and love. It is vain to attempt to secure the favor of God by being holy; we must enjoy his favor before we can be holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation.html">Sacrifice and Propitiation</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation/reconciliation.html">Reconciliation</a></span></div>

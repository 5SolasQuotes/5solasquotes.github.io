<main class="wrap"><figure class="quote" id="q-a22c2ea46e" data-kw="">
<blockquote><p>…the Protestant Reformation marked a sharp break in the pattern of ecclesiastical finance wherever it took root… Huldrych Zwingli and Martin Bucer… held that church property belonged to the religious community and that the secular ruler merely administered it. … Geneva itself followed the model of other Reformed cities in expelling all the regular [papist] clergy and divorcing itself from episcopal jurisdictions in 1536. The profits of dissolution were appropriated by the [civil] municipality, which henceforth paid the pastors of the new church… The Dutch Reformed Church was funded by the magistracy…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-034818ef77" data-kw="">
<blockquote><p>Certainly in Christ’s time both liturgies by forms and also prayers by habit were used [Lk. 18:11-13]. And yet Christ never interposed in the controversy, so as to condemn the one or the other. He condemns the Pharisees for making long prayers to cover their devouring widows’ houses, and for their praying to be seen of men: But whether their prayers were a liturgy and set form, or whether they were extemporary, He takes no notice, as telling us that He condemned neither! (And it’s likely the Pharisees’ long liturgy was in many things worse than ours, though the psalms were a great part of it: and yet Christ and his apostles oft joined with them, and never condemned them). Nay as far as I can find, the Pharisees and other Jews were not in this so blind and quarrelsome as we; nor never made a controversy of it, nor ever presumed to condemn either liturgies or prayers by habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 32</cite>, p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</cite></span></figcaption>

<blockquote><p>V. (3) From the salaries of the sacred ministers under the Old Testament (Num. 18:8-12), to whom were given ordinarily sacrifices, tithes, firstfruits, and other similar things, besides certain cities and suburban fields (Num. 35:1-8). Now although in the New Testament, we are not bound by those laws as to the special material from which and the manner in which the pay was given, still they remain as to kind and analogy, as is evident from the passage already quoted (1 Cor. 9:13).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ff4234ad2b" data-kw="">
<blockquote><p>The Disposition of Man to Grace l. Since the necessary conditions for salvation are impossible for the reprobates, God does not intend to give them salvation, conditionally if they believe and repent, unless one supposes that there is in God some vain, frustrated, and useless intention and will. 2. A good use of natural light, either subjective or objective, cannot lead man to salvation, nor obtain from God any other degree of light destined to salvation. Rejection of the error of those:

1. Who teach a universal and common call to all men to salvation and to the author of salvation, and that each and every man can believe and be saved if he wants.

2. Who teach that God, by his revealed will, wants the salvation of each and everyone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism</cite>, Donald D. Grohman, The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss, (Knox College in cooperation with Toronto School of Theology. 1971), pp. 231-35 For context see ‘Donald Grohman on Dort and the 1649 Genevan Articles’ at Calvin &amp; Calvinism and Grohman.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a82b885b5" data-kw="">
<blockquote><p>When God (Deut. 17) forbids them [Israel] to choose a stranger [as king], He presupposes they may choose a stranger; for God’s law now given to man in the state of sin, presupposes he has corruption of nature to do contrary to God’s law. Now if God did hold forth that their setting a king over them was but the people’s approving the man whom God shall both constitute and design to be king, then he [John Maxwell] should presuppose that God was to design a stranger to be the lawful king of Israel, and the people should be interdicted to approve and consent that the man should be king whom God should choose; for it was impossible that the people should make a stranger king (God is the only immediate king-creator), the people should only approve and consent that a stranger should be king; yet, upon supposition that God first constituted and designed the stranger king, it was not in the people’s power that the king should be a brother rather than a stranger, for if the people have no power to make a king, but do only approve him or consent to him, when he is both made and designed of God to be king, it is not in their power that he be either brother or stranger, and so God commands what is simply impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-fe31d700a8" data-kw="">
<blockquote><p>First therefore they say, If so be we are not able to do any thing towards our salvation, this is to turn men into stocks and stones, or beasts, and so [there is] no difference between them and us. But we say, Although those similitudes the Scripture holds forth do prove our inability for that which is good, yet they must not be made alike in all things. It’s true, to convert men, is to make children unto Abraham out of stones; yet we must not think that is therefore an universal likeness between men and stones: For first, consider this vast dissimilitude; In stones and beasts there is no passive capacity of grace, but in man there is. We say, there is a power for grace in a man’s nature; and the Papists say, there is a power: only they say it’s an active power, though remote; we say, only a passive. There is a power to be converted to God, which is not in stones or beasts: they say, there is a power to convert or turn to God; here is a great difference. Besides, we may consider these degrees in the creatures:

1. There is an inclination to such an act, as in the fire to burn.

2. A spontaneous inclination to some acts accompanied with sense, and sensible apprehensions, as in beasts.

3. A willing inclination accompanied with reason or judgment, and this is in man: Now, because man is thus affected, therefore God in converting, though He does it by a potent work, yet by arguments, which we never use to horses, or brute beasts: and although man has lost that rectitude in his will and mind, yet he has not lost the faculties themselves; therefore though he be theologically dead, yet he is ethically alive, being to be wrought upon by arguments. Hence is that saying, ‘To will is of nature, to will well of grace; to will ill of corrupt nature.’ Hence we may grant those objections, that if a man had not this free-will (if you do not extend it to good things) there could be no conversion or obedience; for grace does not destroy, but perfect nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Young, 1647), Lecture 10, pp. 94-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-ef795438c9" data-kw="">
<blockquote><p>69… Therefore, I hold a middle way, that both the will and the object concur for causing an act of willing, so that the act of willing is from the will and from the object known, as from effective cause… 70… Therefore I say that with the will, in idea of effective cause, the intellect, actually understanding the object, concurs for causing the act of willing, as briefly thus: ‘nature in act, understanding the object, and free,’ is cause of willing and refusing; and in this consists free choice, whether in us or in angels.</p></blockquote>

</figure><figure class="quote" id="q-a88ab6465b" data-kw="">
<blockquote><p>The words: ‘No man can come to Me, except the Father which has sent Me draw him,’ [John 6:44] present only the converse aspect of those [words spoken] to the disciples: ‘All that which the Father gives Me shall come to Me, and him that comes to Me I will in no wise cast out.’ For, far from being a judgment on, it would have been an excuse of, Jewish unbelief, and, indeed, entirely discordant with all Christ’s teaching, if the inability to come were regarded as other than personal and moral, springing from man’s ignorance and opposition to spiritual things. No man can come to the Christ—such is the condition of the human mind and heart, that coming to Christ as a disciple is, not an outward, but an inward, not a physical, but a moral impossibility—except the Father ‘draw him’. And this, again, not in the sense of any constraint, but in that of the personal, moral, loving influence and revelation, to which Christ afterwards refers when He says: ‘And I, if I be lifted up from the earth, will draw all men unto Myself’ (John 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alfred-edersheim.html">Alfred Edersheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life &amp; Times of Jesus the Messiah, Complete &amp; Unabridged in One Volume</cite>, (Hendrickson, 1993), Book 3, Chapter 32, p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“The words: ‘No man can come to Me, except the Father which has sent Me draw him,’ [John 6:44] present only the converse aspect of those [words spoken] to the disciples: ‘All that which the Father gives Me shall come to Me, and him that comes to Me I will in no wise cast out.’ For, far from being a judgment on, it would have been an excuse of, Jewish unbelief, and, indeed, entirely discordant with all Christ’s teaching, if the inability to come were regarded as other than personal and moral, springing from man’s ignorance and opposition to spiritual things. No man can come to the Christ—such is the condition of the human mind and heart, that coming to Christ as a disciple is, not an outward, but an inward, not a physical, but a moral impossibility—except the Father ‘draw him’. And this, again, not in the sense of any constraint, but in that of the personal, moral, loving influence and revelation, to which Christ afterwards refers when He says: ‘And I, if I be lifted up from the earth, will draw all men unto Myself’ (John 12:32).”

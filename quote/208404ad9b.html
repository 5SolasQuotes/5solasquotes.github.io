<blockquote><p>That, while a Church is not off from the foundation, but as to the main rests upon it, it must be reputed a true Church, Mt. 16:18; 1 Cor. 3:11. A Church is to be accounted a true Church, and not off from the only foundation, while her standards are pure, and particularly when an adherence to these standards is generally professed.</p></blockquote>

</figure><figure class="quote" id="q-7249d18b63" data-kw="">
<blockquote><p>After the defeat at Bothwell, he avoided the consequences of his attainder and condemnation by an escape into Holland. There, in Geneva and the Palatinate, he endeavoured to excite the sympathy of foreign protestants with the sufferings of their Scottish brethren; and along with his brother-in-law, Gordon of Earlston, he acted as commissioner in behalf of the united societies, whom he greatly assisted by his influence in obtaining for them the countenance and support of the continental churches. He continued to reside principally in Holland, although the English government, apprised of his intention of returning with arms and money to the assistance of his persecuted countrymen, repeatedly urged upon the States an application for his delivery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

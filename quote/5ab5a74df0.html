<main class="wrap"><figure class="quote" id="q-5ab5a74df0" data-kw="">
<blockquote><p>XI. At what time of the year the world began, whether in spring or in autumn, the learned disagree:

      1. Gerardus Mercator thinks the world was created in summer time.

      2. Many fathers and scholastics contend that it was founded in spring, with whom agree; from the Jews, R. Joshua, and from the Reformed, Alsted, Polanus, Keckermann, and Braun.

      3. But the rest of the Jews commonly, and very many of the Orthodox, for example Voet, Maresius, Cocceius, Burmann, Turretin, Rijssen, Mastricht, etc., state that the world was founded in autumn; whose opinion we approve:

      1. Because the civil year of the Israelites, which was also that of the patriarchs, was begun in the month of Tishri, Ex. 23:16, where the feast of the collection of all fruits from the fields is commanded to be celebrated at the end of the year.

      2. Because in Ex. 34:22, the Feast of Tabernacles is commanded to be celebrated in the seventh month, at the revolution of the year, i.e., in the month of Tishri.

      3. Because the sabbatical and jubilee year of the Jews was celebrated in the month of Tishri, which corresponds to our September or October, Lev. 25:9.

      4. Because the Jews to this day celebrate ראש השנה (Rosh Hashanah) in the month of Tishri, and with it they begin the year, and they explode the different opinion of R. Joshua as singular.

      5. Because in Gen. 7:11, the flood is said to have occurred in the second month; which, however, was most probably done at that time of year which is suitable for inundations, so that the second month should be computed from the autumnal equinox.

      6. Because in autumn the fruits of the trees are ripe and the plants are heavy with seeds, to sustain the first parents and the animals.

      7. The Egyptians, Persians, Greeks and all the Orientals begin the year from September, which it is not to be doubted they received from tradition.

      8. Because in the Gemara, Avodah Zarah, ch. 1, it is handed down that Adam, immediately after creation was made, noticed that the days were declining and becoming shorter; which could not have happened except in the month of September. See Menasseh ben Israel, Problems, 9, Of Creation, also The Conciliator, quest. 11 in Exodus, p. 118. For the rest, just as the Jews begin the civil year in the month of Tishri, so they begin the sacred year in the month of Nisan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, On Creation, pp. 22-23 trans. AI Latin</span></figcaption>

<blockquote><p>Philo Judaeus, Origen, Athanasius, Hilary, Augustine, Procopius of Gaza, Arnold of Chartres, R. Moses ben Maimonides in Moreh Nebuchim, bk. 2, ch. 30, 72, Cajetan, Bodin and Melchior Canus willed that the work of creation was accomplished in a moment, not in six days, and they thought that the six-day period of Moses should be understood allegorically. To whom we oppose:

1. The history of Creation in Gen. 1:5 ff., which relates in clear words what things were created on each day.

2. The sanctification of the Sabbath, for which this reason is given, because God created the heaven and the earth in six days and rested on the seventh day; which could not be said if the work of creation had been accomplished in a moment. Nor is the contrary opinion proved from Sirach 18:1, “He that lives for ever created all things at once (κοινῇ)”; for the little word κοινῇ refers not to “created,” but to “all things,” so that the sense is that God created all things without exception, and it is a collective of all created species, not, however, of time to a moment, and is to be taken not chronologically (χρονικῶς), but as a summary (συναγωγικῶς). Whence 3. Other fathers rightly defend the six-day creation with us, e.g., Chrysostom, Basil, Nazianzen, Ambrose, Gregory; to whom 4. Almost all the Scholastics subscribe. See Becanus, Theologia Scholastica, pt. 1, tract 4, ch. 1; Boyvin, Philosophia Scoti, pt. 1, Physics, pt. 2, disp. 1, ch. 3, sect. 1, quest. 6, p. 460-61. To the question, however: “Could not at least the works of individual days have been produced in a single moment?” we respond: The works of the first creation, or the first and immediate creation, were made in a single moment and a very brief space of time. In the mediate and second creation also [through the rest of the week], the command itself or the fiat of God was accomplished in a single moment, to which the works of the subsequent days, conformably to the nature of things, some were made without delay, at least a protracted one, some with some delay, in such a way, however, that the work of each day was completed on each day. What was disputed concerning this question between Maresius and Wittich, read in Wittich, Theologia Pacifica, ch. 7, §71-73, pp. 52-53; cf. also Burmann, Synopsis Theologiae, bk. 1, ch. 42, §6.</p></blockquote>

<blockquote><p>Even though Calvin, Ames, and the authors of the Westminster Standards, with few exceptions, if any, undoubtedly understood the days to be ordinary days, there is no ground for supposing that they intended to exclude any and all other views, in particular the view that the days may be longer. Such views are outside their purview; their concern, in fact, moves in the opposite direction, against the instantaneous view that denies any length. This point bears emphasizing within the context of the current debate about the days of Genesis. To establish that the Standards mandate the six 24 hour days view requires more than demonstrating that the Divines, perhaps even to a man, held that the days were ordinary days. To demonstrate that of itself establishes nothing. What needs also to be shown, which we believe cannot be shown, is that they intended to exclude the views that the days are longer in some respect or that they represent a literary framework.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-theological-seminary-east-faculty.html">Westminster Theological Seminary, East, Faculty</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Theological Seminary &amp; the Days of Creation</cite>, (1999), p. 3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Even though Calvin, Ames, and the authors of the Westminster Standards, with few exceptions, if any, undoubtedly understood the days to be ordinary days, there is no ground for supposing that they intended to exclude any and all other views, in particular the view that the days may be longer. Such views are outside their purview; their concern, in fact, moves in the opposite direction, against the instantaneous view that denies any length. This point bears emphasizing within the context of the current debate about the days of Genesis. To establish that the Standards mandate the six 24 hour days view requires more than demonstrating that the Divines, perhaps even to a man, held that the days were ordinary days. To demonstrate that of itself establishes nothing. What needs also to be shown, which we believe cannot be shown, is that they intended to exclude the views that the days are longer in some respect or that they represent a literary framework.”

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-643453b65e" data-kw="">
<blockquote><p>All creatures and created beings compared with God, the first being of Himself subsisting, and the infinite God may be denied, to be beings comparatively: And so our created self is nothing, to wit, nothing in dignity, or excellency beside God, or nothing in the kind of a being that essentially is of itself: as God is in genere entis per essentiam, yet man is a being in the kind of being by participation, in genere entis per participationem; man comared with God, is a poor, worthless, sorry, little-nothing, a weeping, melting, evanishing cipher… So the Scripture says, ‘Man at his best state is altogether vanity.’ Ps. 39:5, ‘Behold, thou hast made my days as a handbreadth, and mine age is nothing before thee: verily every man at his best state is altogether vanity.’ Isa. 40:17, ‘All nations before Him are nothing, and less than nothing, and vanity.’ Yet a heathen may say and think and demonstrate by reason that self and man, and all the world are less in incomparison of the infinite God than nothing to all things, a drop of water to the sea, the shadow to the body, a peny-torch to the light of ten thousand millions of suns in one;</p></blockquote>

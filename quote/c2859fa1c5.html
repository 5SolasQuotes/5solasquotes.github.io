<main class="wrap"><figure class="quote" id="q-c2859fa1c5" data-kw="">
<blockquote><p>But take Sanctification for holy walking in the strength of the grace of justification, and grace inherent in us; so we say, Justification and Sanctification ought not to be separated, but both concur to make us saints; the one as the cause, the other as the unseparable effect… for so Antinomians make Sanctification nothing but a poor shadow, like an ivy bush, that is no cause of wine, but a mere sign to declare and shew in this, there is wine [Lutherans have often historically preferred the same language].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism (London, 1648), pt. 2 | ch. 73, ‘Sanctification concurs as well as Justification to make Saints’</cite>, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-f5c0d454a2" data-kw="">
<blockquote><p>He shews for what purpose the faithful were to strive, that is, that they might have faith adorned with good morals, wisdom, patience, and love. Then he intimates that faith ought not to be naked or empty, but that these are its inseparable companions.</p></blockquote>

</figure><figure class="quote" id="q-4edd2b580c" data-kw="">
<blockquote><p>Yet he is not so careful about good works as to despise the root — that is, faith — while he is gathering the fruits. He takes account of both parts, and, as is highly proper, assigns the first rank to faith; for he enjoins those &quot;who believed in God&quot; to be zealous of &quot;good works;&quot; by which he means that faith must go before in such a manner that good works may follow.</p></blockquote>

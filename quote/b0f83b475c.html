<main class="wrap"><figure class="quote" id="q-b0f83b475c" data-kw="">
<blockquote><p>He who is the beginning of all things, must likewise of necessity be the end of them all; and then are our intentions rightest and purest, when we are most possessed with the desire of that highest end, the glory of God, and look straightest unto it.

And if this purpose ought to diffuse itself through all our actions, certainly, in prayer, it should be most lively and active, because prayer is so direct and express a turning of the face of the soul unto God, and setting of its eye upon Him.</p></blockquote>

<blockquote><p>There follows in the prayer, Thy kingdom come. We ask that the kingdom of God may be set forth to us, even as we also ask that His name may be sanctified in us. For when does God not reign, or when does that begin with Him which both always has been, and never ceases to be? We pray that our kingdom, which has been promised us by God, may come, which was acquired by the blood and passion of Christ; that we who first are His subjects in the world, may hereafter reign with Christ when He reigns, as He Himself promises and says, “Come, ye blessed of my Father, receive the kingdom which has been prepared for you from the beginning of the world.” Christ Himself, dearest brethren, however, may be the kingdom of God, whom we day by day desire to come, whose advent we crave to be quickly manifested to us.

For since He is Himself the Resurrection, since in Him we rise again, so also the kingdom of God may be understood to be Himself, since in Him we shall reign. But we do well in seeking the kingdom of God, that is, the heavenly kingdom, because there is also an earthly kingdom. But he who has already renounced the world, is moreover greater than its honours and its kingdom. And therefore he who dedicates himself to God and Christ, desires not earthly, but heavenly kingdoms.

But there is need of continual prayer and supplication, that we fall not away from the heavenly kingdom, as the Jews, to whom this promise had first been given, fell away; even as the Lord sets forth and proves: “Many,” says He, “shall come from the east and from the west, and shall recline with Abraham, and Isaac, and Jacob in the kingdom of heaven. But the children of the kingdom shall be cast out into outer darkness: there shall be weeping and gnashing of teeth.” He shows that the Jews were previously children of the kingdom, so long as they continued also to be children of God; but after the name of Father ceased to be recognised among them, the kingdom also ceased; and therefore we Christians, who in our prayer begin to call God our Father, pray also that God’s kingdom may come to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Lord’s Prayer</cite>, (c. 252), 13 in Ante-Nicene Fathers, 5: 450-51.</span></figcaption>

</figure><figure class="quote" id="q-57a4c48970" data-kw="">
<blockquote><p>Note that the Irish Reformed Presbyterian Synod considered the spread of Arminianism and the sectarian errors that resulted from the 1859 Revival in Ulster to be a cause for fasting:

THE Synod of the Reformed Presbyterian Church in Ireland, at its last Annual meeting, appointed Thursday, the 31st January, to be observed as a day of Public Fasting and Humiliation, by the congregations under their care. The following summary of Causes of Fasting were adopted by the Synod:-

The continued opposition of the kingdoms of this world to the high and righteous claims of the Divine Mediator – Slavery among the nations of the earth and more especially in the United States of North America – The continued existence of the power of Popery, and the efforts which are being put forth, in almost all Popish countries, to restore the Man of Sin to his former civil authority and power – The timid and sinful policy of British rulers, with respect to Popery, as is seen in the endowment of the Popish College of Maynooth, of Popish chaplains in the army and navy, jails, poorhouses, and penitentiaries; in printing Popish books for the Roman Catholic soldiers, and in filling up so many of the vacancies in the Irish Bar and Bench with Papists –

The general disregard manifested, by British Statesmen in their legislative acts to the Word of God, and the interests of true religion – A sinful expediency, hedges round from assault the degrading idolatry of India, retains on the statute-book the monstrous dogma of the Erastian and Popish teachers of soul-destroying heresies, and others who are induced to remain neutral and quiescent with respect to the honours of the Redeemer’s Crown – The continued divisions among the churches of the Reformation, and a general refusal on the part of these churches to return to ancient covenanted attainments – The prevalence of lax and erroneous views with respect to the doctrine, worship, discipline, and government of the church – The recent extensive spread of Arminian errors, and the tendency to sectarianism and extravagancy, on the part of many who profess to have experienced Divine illumination.

As regards our own church, we have to lament the want to unity among the several branches of the Reformed Presbyterian Church. Lukewarmness, illiberality, and a low state of spirituality, on the part of some, and spiritual pride on the part of others. A tendency, in some quarters, to recede from a faithful Scriptural testimony; and a scarcity of gospel labourers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian-synod-of-ireland.html">Reformed Presbyterian Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Causes of fasting’ Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-9a0d8367ed" data-kw="will be done">
<blockquote><p>The third petition is: that God&#x27;s will may be done on earth as in heaven [Matt. 6:10]. Even though it depends upon his Kingdom and cannot be separated from it, still it is with reason added separately on account of our ignorance, which does not easily or immediately comprehend what it means that “God reigns in the world.” It will therefore not be absurd to take it as an explanation that God will be King in the world when all submit to his will. … We are therefore bidden to desire that, just as in heaven nothing is done apart from God&#x27;s good pleasure, and the angels dwell together in all peace and uprightness, the earth be in like manner subject to such a rule, with all arrogance and wickedness brought to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.43</span></figcaption>

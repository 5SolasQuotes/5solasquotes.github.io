<main class="wrap"><figure class="quote" id="q-ec826480cb" data-kw="">
<blockquote><p>In Christ too, you see, there was a human soul, a complete soul; not just the non-rational element in this soul, but the rational one as well, which is named mind. For, there have been some heretics, and they have been expelled from the Church, who maintained that the body of Christ does not have a rational mind, but just a kind of brute soul; cut out the rational mind, after all, and you are left with life that is brutish. But since they have been expelled—expelled in truth—you must now take the whole Christ as Word, rational mind, and flesh. That is the whole Christ; let your soul then rise from wickedness through that which is God, let your body rise again from corruption through that which is man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Gospel of John 1-40</cite>, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 23.6, p. 411.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4fbc923ff" data-kw="">
<blockquote><p>All souls are rated and valued in God’s book, and account, at one and the same price; and therefore by nature are of equal worth and dignity. Under the law, the rich and the poor were to give the same ransom, Exod. 30: 15. “The rich shall not give more, and the poor shall not give less than half a shekel.” The redemption of souls, by the blood of Christ, costs one and the same price.

The poorest and the most despised soul that believes in Jesus, is as much indebted to him for the ransom of his soul, as the greatest and most illustrious person in the world. Moses, Abraham, Paul, &amp;c. did not cost Christ any thing more than poor Lazarus, or the meanest among all the saints did. “The righteousness of Christ is unto all, and upon all that believe, for there is no difference,” Rom. 3: 22.

But yet we must not understand this parity of human souls universally, or in all respects. Though being of one species or common nature, they are all equal, and those of them that are purchased by the blood of Christ are all purchased at one rate; yet there are divers other respects and considerations, wherein there are remarkable differences betwixt soul and soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pneumatologia. A Treatise of the Soul of Man</cite>, (1698) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 528.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-34e1ff4418" data-kw="">
<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

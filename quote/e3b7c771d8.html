<main class="wrap"><figure class="quote" id="q-e3b7c771d8" data-kw="">
<blockquote><p>For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 489</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan, or a Treatise Against Toleration &amp; Pretended Liberty of Conscience</cite>, … (London, 1647), 17th thesis, p. 76</span></figcaption>

</figure><figure class="quote" id="q-ab6f29151c" data-kw="">
<blockquote><p>But I hope the parliament will observe this great principle you were first acted by, and still are in all your Church-way, and will see how dangerous the tolerating of your way will be; for though you should for present hold nothing much different from the established rule, yet being allowed what may you not come to; according to this principle, how shall any State be sure of you long what you will hold: What if you should bring in community of goods, baptizing in rivers, the holy kiss into your assemblies at the beginning and ending of your ordinances, anointing sick persons with oil? It is but according to your principle: And we see you make so much of this principle and are so in love with it, that you wish it next to your first principle, enacted as the most sacred Law of all other[s], to live and walk by it in Christian States and Churches throughout the world;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), p. 86</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0e53297924" data-kw="">
<blockquote><p>All this is true. But it really does not apply to the situation in the Presbyterian Church in the U.S.A. The point is that Church is very largely dominated by unbelief. It does not merely harbor unbelief here and there. No, it has made unbelief, in the form of a deadly Modernist vagueness, the determinative force in its central official life. Such a body is hardly what the Bible means by a church at all. The Bible commands Christian people to be members of a true church, even though it be an imperfect one. It represents the nurture provided by such a true church as a necessity, not a luxury, in the Christian life. There must therefore be a separation between the Christian and the Modernist elements in the Presbyterian Church in the U.S.A. That is perfectly clear. The only question is how the separation shall be effected. Unquestionably the best way would be the way of reform. If Modernism should be removed from the Presbyterian Church in the U. S. A., and that church should be brought back to conformity with its constitution and with the Word of God, all would be well. The other way is the way of separation from the existing organization on the part of the loyal part of the church. Only, if the separation comes, it ought to come in such fashion as to make perfectly clear the fact that those who are separating from the present Modernist organization are not founding a “new church,” but are carrying on the true, spiritual succession of the Presbyterian Church in the U. S. A.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“What Should Be Done by Christian People Who are in a Modernist Church?” The Presbyterian Guardian</cite>, 1.2 (21 October 1935): 22.</span></figcaption>

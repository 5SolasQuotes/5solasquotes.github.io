<main class="wrap"><figure class="quote" id="q-754dab285e" data-kw="">
<blockquote><p>§XXII… Let us be permitted to observe: that, just as the opinion of Traducianism wins by the weight of its arguments, so the opinion of Creation wins by its ecclesiastical authority.</p></blockquote>

<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-13f863c28d" data-kw="">
<blockquote><p>V… In conclusion, the image of God in the first man was fittingly analogous to a son reflecting his father, especially in that which the father considers his most distinguishing feature—the face. Similarly, man was to reflect what God Himself deems most important: His holiness (Leviticus 19:2, Hebrews 11:10), which God is frequently said to swear by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>

</figure><figure class="quote" id="q-038fc680a3" data-kw="">
<blockquote><p>For the whole man, as Maldonatus not badly reasons, is said to be born of flesh and to be wholly flesh, although the soul, the other part of him, is neither born of flesh, nor is flesh because he is born of blood and of the will of the flesh, and of the will of man [Jn. 1:13], that is in a carnal and human manner, by which manner those who are born, are born sinners, that is, carnal. And the soul itself, although a spiritual substance, when stained with sin, is carnal. On the contrary, the flesh, when it is free from sin, and joined to God, is called ‘spirit’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’, p. 3 trans. AI</span></figcaption>

</figure><figure class="quote" id="q-9ae0f60d81" data-kw="">
<blockquote><p>V… This naturally raises the question: Did the first man have the potential to believe in Christ? The answer, affirming against Socinians and Remonstrants, is yes. His mind was adorned with clarity, and his will with sanctity, which could have produced faith in Christ if Christ had been revealed to him as an object, which was possible. Even Adam’s faith in God did not differ essentially from ours but only in its special object; this difference does not alter the nature of faith but confirms it, much like certain precepts of the law aligned with the Gospel in their broader sense. An objection arises: Could Adam have believed in Christ at some point, which seems absurd? The response distinguishes between potential as cause and potential as effect. In the former, considered in a divided sense regarding the simultaneity of potentials, he could have; but in the latter, in a composed sense regarding the simultaneity of action (κρινόμενον), he could not have immediately believed that Christ’s righteousness would be imputed to him because his state and its economy (οἰκονομία) did not allow it. This follows no more than arguing from God’s absolute potential to its actual exercise under His decree. Thus, from these considerations, we conclude that faith in Christ could justly be demanded from us under the first covenant [i.e. of Works], even though we are utterly powerless. Furthermore, in his will, a second kind of soul’s life shone without blemish, more admirable than any star. The will could righteously bear whatever the divinely illuminated practical intellect had judged and approved, and thus we consider that the free will of that state must be regarded in the moral sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

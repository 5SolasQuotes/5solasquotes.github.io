<blockquote><p>195. What other Scripture proof do you mention in support of the continued obligation of Covenants?

Such expressions as “the everlasting Covenant” (Isaiah xxiv. 5), “a perpetual Covenant” (Jer. l. 5), &amp;c., must lose much of their import, if only one generation is intended to be represented. Even as regards matters of a civil nature, the principle of federal representation is acknowledged in Scripture. Forty years’ wandering in the wilderness, the death of a whole generation, together with all the wars of Canaan, did not cause the children of Israel to disregard the oath of their fathers; for even two hundred years after the oath had been sworn to Joseph, they buried his bones in Shechem. (Exod. xiii. 19.)

196. What other Scripture passage do you appeal to?

The case of the Gibeonites is remarkable. The Israelites were punished with three years’ famine, because Saul, their king, had slain a number of the Gibeonites. And it is to be remarked that this punishment was inflicted, not, as some assert, because in their destruction the Israelites acted from bad motives, nor because the Gibeonites had become proselytes to the true religion, but because of the violation of the oath entered into by their fathers with the Gibeonites, as is clear from the words of the narrative, in which the cause of the famine is stated thus:- “And the children of Israel had sworn unto them.” (2 Sam. xxi. 1-9.) Again, more than two hundred years after the league between Solomon and Hiram had been entered into, the Lord threatens the inhabitants of Tyre with desolating judgments, “because they delivered up the whole captivity of Edom, and remembered not the brotherly Covenant.” (Amos i. 9.)</p></blockquote>

<blockquote><p>As to the Confession of Faith,

1. How does their refusing to pray for the queen, to pay her cess, and to own her authority, because she is not a covenanted Queen, agree with the Confession of Faith, chap. 23, § 4, “It is the duty of people to pray for magistrates, to pay them tribute and other dues, and to be subject to their authority for conscience sake: infidelity, or difference in religion, doth not make void the magistrate’s just and legal authority?”

I know they will say, that article is meant of lands not covenanted: there had been some shadow of force in this perhaps, if this Confession of Faith had been framed before the Covenant: but upon the contrary it was long after, and was the product of the Solemn League and Covenant, as appears from the first article of the Covenant, in these words, “And shall endeavour to bring the churches of God in the three kingdoms to the nearest conjunction and uniformity in religion, confession of faith,” etc. The Solemn League and Covenant was sworn in the year 1643, the Confession of Faith was sent hither and approven by the Assembly not till the year 1647, for which see the Act of assembly, printed before the Confession. And can we think, that those who, in pursuance of the covenant, framed this Confession of Faith, to declare to the world the faith of covenanters, would so juggle, as to put in articles of faith which would bind others, but not themselves?

2. How does their reckoning the taking the oath of allegiance to the Queen, one of the steps of the Church’s defection, consist with Confession, chap. 22, §2, “A lawful oath, being imposed by lawful authority, in such matters ought to be taken;” and §3, of the same chapter, “Yet it is a sin to refuse an oath, touching any thing that is good and just, being imposed by lawful authority?” It is true, they reckon her no lawful Queen; but one error will not atone for another.

The famous author of the Apologetical Relation [John Brown of Wamphray] was not of our dissenters’ mind (nay, he thought there had been no Christian of their mind, and for ought I know there were none in these days), for, speaking of the reasons why the oath of Supremacy, called then, tho’ falsely, the oath of allegiance, should be refused, and answering this objection, viz. such as refuse this oath of Allegiance, declare that they are not dutiful and loyal subjects, he saith, “It hath been shown what difference there is betwixt this oath and the oath of allegiance; and there is no minister or Christian should scruple at the taking the pure oath of allegiance,” Apol. Rel. p. 259. If it was this author’s mind, that no minister or Christian should have scrupled the oath of Allegiance to King Charles II. when he had taken the Covenant, broken it, and overturned the work of Reformation, sure, he would far less have thought it a sin to take the oath of allegiance to the present Queen.

3. How doth their separating from this Church, lest they be involved in the guilt of the corruptions amongst us, by keeping communion with us, agree with Conf. chap. 26, §2, “Saints, by profession, are bound to maintain an holy fellowship and communion in the worship of God; — which communion, as God offereth opportunity, is to be extended to all those who in every place call upon the name of the Lord Jesus?”

4. How doth that principle of theirs, sometime at least owned by them, though left out in their last paper, against the power of the magistrate to call assemblies, agree with Conf. chap. 31 §2, “As magistrates may lawfully call a synod of ministers, and other fit persons to consult and advise with about matters of religion?” and with Act of Assembly 1638, sess. 26, concerning yearly General Assemblies, where they say, “If, in the meantime, it shall please the king’s majesty to indite a General Assembly, ordaineth all presbyteries, universities, and burghs, to send their commissioners, for keeping the time and place which shall be appointed by his majesty’s proclamation?” They cry out on the encroachment of the magistrates in dissolving Assemblies; but as our Assemblies are constituted in the name of Christ, so are they dissolved in his name.

What dissolution the magistrate makes, is looked upon as the dismissing of the members. There have indeed been encroachments made by the magistrate in dissolving Assemblies before they had done their business, and there have been protestations made against this. And though, in the late paper, they charge the Church for not protesting against the encroachments, and recording the same; yet that protestations have not been made against them, is an untruth: but where the magistrate’s deed is not recorded, neither are the protestations recorded.

I was eye and ear-witness to the magistrate’s dissolving the Assembly in the midst of business; and protestations were made against it, and for the Church’s intrinsic power; and, from every corner of the house, members adhering thereto. And this protesting is recorded in the Acts of Assembly; so that, from my certain knowledge, I can say they speak an untruth in that charge in the declinature; yea, I have the Acts of the Assembly by me, where they, or any that question the truth of what I say, may read it with their own eyes.

5. How doth their rejecting and despising the testimony of the Commission of the General Assembly against the Union, and reproaching them for it, because it was given into the Parliament by way of humble address, and not by way of protestation, agree with Confession, chap. 31, §5, “Synods and councils are to handle and conclude nothing but that which is ecclesiastical, and are not to intermeddle with civil affairs, which concern the commonwealth, unless, by way of humble petition, in cases extraordinary, or by way of advice, for satisfaction of conscience, if they be thereunto required by the civil magistrate?”

Lastly, How does their crying out on the magistrate’s occasionally appointing fasts and thanksgivings, agree with the Confession of Faith, allowing the magistrate to call Assemblies? This I spoke to formerly in another sermon. And further, how agrees it with the last paragraph of the Directory concerning public solemn fasting, where we have these words, “Besides solemn and general fasts enjoined by authority, we judge,” etc. It may be observed how frequently the apostles enjoin obedience to magistrates, and honouring of them, as 1 Tim. ii. 1, 2, “I exhort therefore, that prayers be made for kings, and for all that are in authority.” Rom. xiii. 1, “Let, every soul be subject unto the higher powers,” etc. Tit. iii. 1, “Put them in mind to be subject to principalities and powers, to obey magistrates.” 1 Pet. ii. 13, and downwards.

All which may shew us, that we have no more right to take away the fifth command out of the decalogue, that requires obedience to magistrates, than the Papists have to take away the second, which condemns their idolatry. I think there is a strange inclination amongst some that profess religion, not only amongst dissenters, but others, to speak evil of dignities, and to embrace every thing that may make against the magistrate; so that the murdering of King Charles I, wherewith Presbyterians are slandered by Papists and malignants, is owned and adopted by some, as if it had been a laudable action.

Wo is me! that ignorance, and an inclination to vilify magistrates, should give such an handle to the enemy against us. If it was such a glorious action, the sectaries must have the glory of it; for it was they, and not Presbyterians, that did the deed, and it was protested against by the commissioners both from the Church and state of Scotland, for which they were hardly used at London; for which see Apol. Rel. p. 64.

Yea, the General Assembly of the Church of Scotland, 1649, gave their testimony against it in their seasonable warning, sess. 27, they say, “That prevailing party of societies in England, who have broken the covenant — and taken away the king’s life, look upon us with an evil eye.” And in their exhortation to their brethren in England, “We have obtained this mercy, to be steadfast to our old principles, in bearing free and faithful testimony against their proceedings, both in reference to the toleration and government, and the taking away the king’s life.” And in their letter to the king, “We do from our hearts abominate and detest that horrid fact of the sectaries, against the life of your royal father our sovereign.” Both which are to be found in the last session of that Assembly.</p></blockquote>

0%9CA+lawful+oath%2C+being+imposed+by+lawful+authority%2C+in+such+matters+ought+to+be+taken%3B%E2%80%9D+and+%C2%A73%2C+of+the+same+chapter%2C+%E2%80%9CYet+it+is+a+sin+to+refuse+an+oath%2C+touching+any+thing+that+is+good+and+just%2C+being+imposed+by+lawful+authority%3F%E2%80%9D+It+is+true%2C+they+reckon+her+no+lawful+Queen%3B+but+one+error+will+not+atone+for+another.%0A%0AThe+famous+author+of+the+Apologetical+Relation+%5BJohn+Brown+of+Wamphray%5D+was+not+of+our+dissenters%E2%80%99+mind+%28nay%2C+he+thought+there+had+been+no+Christian+of+their+mind%2C+and+for+ought+I+know+there+were+none+in+these+days%29%2C+for%2C+speaking+of+the+reasons+why+the+oath+of+Supremacy%2C+called+then%2C+tho%E2%80%99+falsely%2C+the+oath+of+allegiance%2C+should+be+refused%2C+and+answering+this+objection%2C+viz.+such+as+refuse+this+oath+of+Allegiance%2C+declare+that+they+are+not+dutiful+and+loyal+subjects%2C+he+saith%2C+%E2%80%9CIt+hath+been+shown+what+difference+there+is+betwixt+this+oath+and+the+oath+of+allegiance%3B+and+there+is+no+minister+or+Christian+should+scruple+at+the+taking+the+pure+oath+of+allegiance%2C%E2%80%9D+Apol.+Rel.+p.+259.+If+it+was+this+author%E2%80%99s+mind%2C+that+no+minister+or+Christian+should+have+scrupled+the+oath+of+Allegiance+to+King+Charles+II.+when+he+had+taken+the+Covenant%2C+broken+it%2C+and+overturned+the+work+of+Reformation%2C+sure%2C+he+would+far+less+have+thought+it+a+sin+to+take+the+oath+of+allegiance+to+the+present+Queen.%0A%0A3.+How+doth+their+separating+from+this+Church%2C+lest+they+be+involved+in+the+guilt+of+the+corruptions+amongst+us%2C+by+keeping+communion+with+us%2C+agree+with+Conf.+chap.+26%2C+%C2%A72%2C+%E2%80%9CSaints%2C+by+profession%2C+are+bound+to+maintain+an+holy+fellowship+and+communion+in+the+worship+of+God%3B+%E2%80%94+which+communion%2C+as+God+offereth+opportunity%2C+is+to+be+extended+to+all+those+who+in+every+place+call+upon+the+name+of+the+Lord+Jesus%3F%E2%80%9D%0A%0A4.+How+doth+that+principle+of+theirs%2C+sometime+at+least+owned+by+them%2C+though+left+out+in+their+last+paper%2C+against+the+power+of+the+magistrate+to+call+assemblies%2C+agree+with+Conf.+chap.+31+%C2%A72%2C+%E2%80%9CAs+magistrates+may+lawfully+call+a+synod+of+ministers%2C+and+other+fit+persons+to+consult+and+advise+with+about+matters+of+religion%3F%E2%80%9D+and+with+Act+of+Assembly+1638%2C+sess.+26%2C+concerning+yearly+General+Assemblies%2C+where+they+say%2C+%E2%80%9CIf%2C+in+the+meantime%2C+it+shall+please+the+king%E2%80%99s+majesty+to+indite+a+General+Assembly%2C+ordaineth+all+presbyteries%2C+universities%2C+and+burghs%2C+to+send+their+commissioners%2C+for+keeping+the+time+and+place+which+shall+be+appointed+by+his+majesty%E2%80%99s+proclamation%3F%E2%80%9D+They+cry+out+on+the+encroachment+of+the+magistrates+in+dissolving+Assemblies%3B+but+as+our+Assemblies+are+constituted+in+the+name+of+Christ%2C+so+are+they+dissolved+in+his+name.%0A%0AWhat+dissolution+the+magistrate+makes%2C+is+looked+upon+as+the+dismissing+of+the+members.+There+have+indeed+been+encroachments+made+by+the+magistrate+in+dissolving+Assemblies+before+they+had+done+their+business%2C+and+there+have+been+protestations+made+against+this.+And+though%2C+in+the+late+paper%2C+they+charge+the+Church+for+not+protesting+against+the+encroachments%2C+and+recording+the+same%3B+yet+that+protestations+have+not+been+made+against+them%2C+is+an+untruth%3A+but+where+the+magistrate%E2%80%99s+deed+is+not+recorded%2C+neither+are+the+protestations+recorded.%0A%0AI+was+eye+and+ear-witness+to+the+magistrate%E2%80%99s+dissolving+the+Assembly+in+the+midst+of+business%3B+and+protestations+were+made+against+it%2C+and+for+the+Church%E2%80%99s+intrinsic+power%3B+and%2C+from+every+corner+of+the+house%2C+members+adhering+thereto.+And+this+protesting+is+recorded+in+the+Acts+of+Assembly%3B+so+that%2C+from+my+certain+knowledge%2C+I+can+say+they+speak+an+untruth+in+that+charge+in+the+declinature%3B+yea%2C+I+have+the+Acts+of+the+Assembly+by+me%2C+where+they%2C+or+any+that+question+the+truth+of+what+I+say%2C+may+read+it+with+their+own+eyes.%0A%0A5.+How+doth+their+rejecting+and+despising+the+testimony+of+the+Commission+of+the+General+Assembly+against+the+Union%2C+and+reproaching+them+for+it%2C+because+it+was+given+into+the+Parliament+by+way+of+humble+address%2C+and+not+by+way+of+protestation%2C+agree+with+Confession%2C+chap.+31%2C+%C2%A75%2C+%E2%80%9CSynods+and+councils+are+to+handle+and+conclude+nothing+but+that+which+is+ecclesiastical%2C+and+are+not+to+intermeddle+with+civil+affairs%2C+which+concern+the+commonwealth%2C+unless%2C+by+way+of+humble+petition%2C+in+cases+extraordinary%2C+or+by+way+of+advice%2C+for+satisfaction+of+conscience%2C+if+they+be+thereunto+required+by+the+civil+magistrate%3F%E2%80%9D%0A%0ALastly%2C+How+does+their+crying+out+on+the+magistrate%E2%80%99s+occasionally+appointing+fasts+and+thanksgivings%2C+agree+with+the+Confession+of+Faith%2C+allowing+the+magistrate+to+call+Assemblies%3F+This+I+spoke+to+formerly+in+another+sermon.+And+further%2C+how+agrees+it+with+the+last+paragraph+of+the+Directory+concerning+public+solemn+fasting%2C+where+we+have+these+words%2C+%E2%80%9CBesides+solemn+and+general+fasts+enjoined+by+authority%2C+we+judge%2C%E2%80%9D+etc.+It+may+be+observed+how+frequently+the+apostles+enjoin+obedience+to+magistrates%2C+and+honouring+of+them%2C+as+1+Tim.+ii.+1%2C+2%2C+%E2%80%9CI+exhort+therefore%2C+that+prayers+be+made+for+kings%2C+and+for+all+that+are+in+authority.%E2%80%9D+Rom.+xiii.+1%2C+%E2%80%9CLet%2C+every+soul+be+subject+unto+the+higher+powers%2C%E2%80%9D+etc.+Tit.+iii.+1%2C+%E2%80%9CPut+them+in+mind+to+be+subject+to+principalities+and+powers%2C+to+obey+magistrates.%E2%80%9D+1+Pet.+ii.+13%2C+and+downwards.%0A%0AAll+which+may+shew+us%2C+that+we+have+no+more+right+to+take+away+the+fifth+command+out+of+the+decalogue%2C+that+requires+obedience+to+magistrates%2C+than+the+Papists+have+to+take+away+the+second%2C+which+condemns+their+idolatry.+I+think+there+is+a+strange+inclination+amongst+some+that+profess+religion%2C+not+only+amongst+dissenters%2C+but+others%2C+to+speak+evil+of+dignities%2C+and+to+embrace+every+thing+that+may+make+against+the+magistrate%3B+so+that+the+murdering+of+King+Charles+I%2C+wherewith+Presbyterians+are+slandered+by+Papists+and+malignants%2C+is+owned+and+adopted+by+some%2C+as+if+it+had+been+a+laudable+action.%0A%0AWo+is+me%21+that+ignorance%2C+and+an+inclination+to+vilify+magistrates%2C+should+give+such+an+handle+to+the+enemy+against+us.+If+it+was+such+a+glorious+action%2C+the+sectaries+must+have+the+glory+of+it%3B+for+it+was+they%2C+and+not+Presbyterians%2C+that+did+the+deed%2C+and+it+was+protested+against+by+the+commissioners+both+from+the+Church+and+state+of+Scotland%2C+for+which+they+were+hardly+used+at+London%3B+for+which+see+Apol.+Rel.+p.+64.%0A%0AYea%2C+the+General+Assembly+of+the+Church+of+Scotland%2C+1649%2C+gave+their+testimony+against+it+in+their+seasonable+warning%2C+sess.+27%2C+they+say%2C+%E2%80%9CThat+prevailing+party+of+societies+in+England%2C+who+have+broken+the+covenant+%E2%80%94+and+taken+away+the+king%E2%80%99s+life%2C+look+upon+us+with+an+evil+eye.%E2%80%9D+And+in+their+exhortation+to+their+brethren+in+England%2C+%E2%80%9CWe+have+obtained+this+mercy%2C+to+be+steadfast+to+our+old+principles%2C+in+bearing+free+and+faithful+testimony+against+their+proceedings%2C+both+in+reference+to+the+toleration+and+government%2C+and+the+taking+away+the+king%E2%80%99s+life.%E2%80%9D+And+in+their+letter+to+the+king%2C+%E2%80%9CWe+do+from+our+hearts+abominate+and+detest+that+horrid+fact+of+the+sectaries%2C+against+the+life+of+your+royal+father+our+sovereign.%E2%80%9D+Both+which+are+to+be+found+in+the+last+session+of+that+Assembly.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Evil+and+Danger+of+Schism.+A+Sermon%2C+by+the+late+Learned+and+Pious+Mr.+Thomas+Boston%2C+Minister+of+the+Gospel+at+Etterick%2C+%281708%3B+3rd+edn%2C+Oxnam%2C+1753%29%2C+pp+24-29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff115948af2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f115948af2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/24/thomas-boston-on-the-westminster-confession-and-the-hyper-covenanter-error-of-political-dissent/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>My Lords and Gentlemen, — You know that the wisest prince that ever sat upon a throne hath told us that ‘righteousness exalts a nation,’ Prov. xiv. 34. It is not valour in war, but righteousness; it is not policy in government, but righteousness; it is not wittiness of invention, but righteousness; it is not civility in behaviour, but righteousness; it is not antiquity of forms, but righteousness; it is not largeness of dominion, but righteousness; nor it is not greatness of command, but righteousness, that is the honour and the safety, that is the renown and the security of a nation. That nation that exalts righteousness, that nation shall be certainly exalted by righteousness, Amos v. 24.

It is not Ahithophel’s policy, it is not Jeroboam’s calves in Dan and Bethel, it is not Jehu’s pompous zeal, it is not Goliath’s sword, it is not rich mines of gold and silver, nor magazines, nor armies, nor councils, nor fleets, nor forts, but justice and righteousness that exalts a nation, and that will make a mean people to become a great, a glorious, and a famous people in the world. The world is a ring, and righteousness is the diamond in that ring: the world is a body, and righteousness and justice is the soul of that body.

Ah! England, England! so long as judgment runs down as waters in the midst of thee, and righteousness as a mighty stream, thou shalt not die, but live and bear up bravely against all gainsayers and opposers; but if injustice shall grow rampant, and thou shalt brandish the sword of justice in the behalf of the friends of Baal, Balaam, and Bacchus, and turn the wheel upon the righteous; if the sword of justice shall be a sword of protection to the desperate swearer, and to the cruel oppressor, and to the roaring drunkard, and to the cursing monster, and to the gospel despiser, and to the Christ contemner, &amp;c., and shall be a devouring sword to the upright and peaceable in the land, divine vengeance will dig thy grave, and divine justice will tumble thee into it, though all the nations of the earth should labour to prevent it.

It is a base and ignoble spirit, to pity Cataline more than to pity Rome; to pity any particular sort of men, more than to pity the whole. It is cruelty to the good, to justify the bad: it is wrong to the sheep, to animate the wolves: it is danger if not death to the lambs, not to restrain or chain up the lions. But from all these vanities the Lord deliver all your souls!

And oh that you would for ever remember this, that as the constitution of a man’s body is best known by his pulse: if it stir not at all, then we know he is dead; if it stir violently, then we know him to be in a fever; if it keep an equal stroke, then we know he is sound, well, and whole: so the estate and constitution of a kingdom or commonweal is best known by the manner of executing justice therein; for justice is the pulse of a kingdom.

If justice be violent, then the kingdom is in a fever, in a very bad estate; if it stir not at all, then the kingdom is dead; but if it have an equal stroke, if it be justly and duly administered, then the kingdom is in a good, a safe, and sound condition. When Vespasian asked Apollonius what was the cause of Nero’s ruin, he answered, that Nero could tune the harps well, but in government: he did always wind up the strings too high, or let them down too low.</p></blockquote>

of+justice+in+the+behalf+of+the+friends+of+Baal%2C+Balaam%2C+and+Bacchus%2C+and+turn+the+wheel+upon+the+righteous%3B+if+the+sword+of+justice+shall+be+a+sword+of+protection+to+the+desperate+swearer%2C+and+to+the+cruel+oppressor%2C+and+to+the+roaring+drunkard%2C+and+to+the+cursing+monster%2C+and+to+the+gospel+despiser%2C+and+to+the+Christ+contemner%2C+%26c.%2C+and+shall+be+a+devouring+sword+to+the+upright+and+peaceable+in+the+land%2C+divine+vengeance+will+dig+thy+grave%2C+and+divine+justice+will+tumble+thee+into+it%2C+though+all+the+nations+of+the+earth+should+labour+to+prevent+it.%0A%0AIt+is+a+base+and+ignoble+spirit%2C+to+pity+Cataline+more+than+to+pity+Rome%3B+to+pity+any+particular+sort+of+men%2C+more+than+to+pity+the+whole.+It+is+cruelty+to+the+good%2C+to+justify+the+bad%3A+it+is+wrong+to+the+sheep%2C+to+animate+the+wolves%3A+it+is+danger+if+not+death+to+the+lambs%2C+not+to+restrain+or+chain+up+the+lions.+But+from+all+these+vanities+the+Lord+deliver+all+your+souls%21%0A%0AAnd+oh+that+you+would+for+ever+remember+this%2C+that+as+the+constitution+of+a+man%E2%80%99s+body+is+best+known+by+his+pulse%3A+if+it+stir+not+at+all%2C+then+we+know+he+is+dead%3B+if+it+stir+violently%2C+then+we+know+him+to+be+in+a+fever%3B+if+it+keep+an+equal+stroke%2C+then+we+know+he+is+sound%2C+well%2C+and+whole%3A+so+the+estate+and+constitution+of+a+kingdom+or+commonweal+is+best+known+by+the+manner+of+executing+justice+therein%3B+for+justice+is+the+pulse+of+a+kingdom.%0A%0AIf+justice+be+violent%2C+then+the+kingdom+is+in+a+fever%2C+in+a+very+bad+estate%3B+if+it+stir+not+at+all%2C+then+the+kingdom+is+dead%3B+but+if+it+have+an+equal+stroke%2C+if+it+be+justly+and+duly+administered%2C+then+the+kingdom+is+in+a+good%2C+a+safe%2C+and+sound+condition.+When+Vespasian+asked+Apollonius+what+was+the+cause+of+Nero%E2%80%99s+ruin%2C+he+answered%2C+that+Nero+could+tune+the+harps+well%2C+but+in+government%3A+he+did+always+wind+up+the+strings+too+high%2C+or+let+them+down+too+low.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+The+Crown+and+Glory+of+Christianity%3B+or+Holiness%2C+the+only+way+to+Happiness.+Discovered+in+LVIII+Sermons+from+Heb.+12.+14%2C+%281662%29+in+The+Works+of+Thomas+Brooks%2C+ed.+Alexander+B.+Grossart+%286+vols%2C+Edinburgh%3A+James+Nichol%2C+1861-67%29%2C+4%3A+7-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F306e0b1b7b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/306e0b1b7b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/21/thomas-brooks-on-righteousness-exalting-a-nation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>33. That, as it is the duty of every man to worship God in such a manner as he thinks most acceptable to Him; all persons, professing the Christian religion, are equally entitled to protection in their religions liberty… the Legislature may, in their discretion, lay a general and equal tax, for the support of the Christian religion… And all acts of Assembly, lately passed, for collecting monies for building or repairing particular churches or chapels of ease, shall continue in force, and be executed… …and every encumbent of the church of England, who has remained in his parish, and performed his duty, shall be entitled to receive the provision and support established by the act, entitled ‘An act for the support of the clergy of the church of England, in this Province,’… …

35. That no other test or qualification ought to be required on admission to any office of trust or profit, than such oath of support and fidelity to this State, and such such oath of office, as shall be directed by this Convention, or the Legislature of this State, and a declaration of a belief in the Christian religion.

36. That the manner of administering an oath to any person, ought to be such, as those of the religious persuasion, profession, or denomination, of which such person is one, generally esteem the most effectual confirmation, by the attestation of the Divine Being…</p></blockquote>

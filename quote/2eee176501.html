<main class="wrap"><figure class="quote" id="q-2eee176501" data-kw="">
<blockquote><p>A. 3: And God’s prohibition, Deut. 12, of adding or diminishing, is not washed away so easily as your words would make men believe. You say, It reaches to the whole duty of man, and government of the Church, etc. Answer: There be some things in the duty of man and church-matters that God has left to man: To do those is no addition to God’s laws: But to do the like work that God by his Law has done, which He never left to man, seems to me the addition there forbidden: e.g. If men had made another Tabernacle, another ark of the Covenant, another holy vestment for Aaron, another sacrament like circumcision or the Passover, He that so reproved their worshiping in the high places would have reproved these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Baxter held, (per Joseph Bingham, Works, 10.124) that ministerial ‘ornaments’ are not unlawful in themselves, but rather that they should not be imposed by authority on ministers, with such dissenting ministers being deposed for this. Here are some excerpts from Baxter: | The Defence of the Nonconformists’ Plea for Peace (1680), Ch. 18, pp. 41-42</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29ffa4a185" data-kw="">
<blockquote><p>3. They hold that all outward means instituted and set apart to express and set forth the inward worship of God, are parts of Divine worship and that not only all moral actions, but all typical rites and figures, ordained to shadow forth in the solemn worship and service of God, any spiritual or religious act or habit in the mind of man, are special parts of the same, and therefore that every such act ought evidently to be prescribed by the Word of God, or else ought not to be done? it being a sin to perform any other worship to God, whether external or internal, moral or ceremonial, in whole or in part, then that which God Himself requires in his Word.</p></blockquote>

</figure><figure class="quote" id="q-c47959bd3f" data-kw="">
<blockquote><p>In Scotland it appears to have been the regular custom for ministers to wear a gown when conducting divine service. The cassock also was in frequent use, but this is not surprising since it was not a liturgical vestment, but the usual out-of-doors dress of the ministry. In England, however, the Puritans appear to have discarded the cassock, whilst there is little evidence to show that the early Puritans wore gowns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 46-48 in Ch. 4 of The Worship of the English Puritans (Soli Deo Gloria, 1997), p. 47</span></figcaption>

</figure><figure class="quote" id="q-4d2048fb35" data-kw="">
<blockquote><p>§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 9 in Remains (London: Parkhurst, 1684), pp. 219-20</span></figcaption>

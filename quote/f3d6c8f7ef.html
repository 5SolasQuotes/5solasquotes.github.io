<main class="wrap"><figure class="quote" id="q-f3d6c8f7ef" data-kw="">
<blockquote><p>XV. In Scripture, we find two covenants of God with man: the Covenant of Works, otherwise called, the Covenant of Nature, or the Legal and the Covenant of Grace. The apostle teacheth us this distinction, Rom. 3:27, where he mentions the law of works, and the law of faith by the law of works, understanding that doctrine which points out the way in which, by means of works, salvation is obtained; and by the law of faith, that doctrine which directs by faith to obtain salvation. The form of the covenant of works is, “The man that doth these things shall live by them,” Rom. 10:5. That of the covenant of grace is, “Whosoever believeth in him shall not be ashamed,” Rom. 10:11. These covenants of mercy agree, 1st. That, in both, the contracting parties are the same, God and man. 2dly. In both, the same promise of eternal life, consisting in the immediate fruition of God. 3dly. The condition of both is the same, viz., perfect obedience to the law. Nor would it have been worthy of God to admit man to a blessed communication with him, but in the way of unspotted holiness. 4thly. In both, the same end, the glory of the most unspotted goodness of God. But in these following particulars they differ: 1st. The character or relation of God and man, in the covenant of works, is different from what it is in the covenant of grace. In the former, God treats as the Supreme Lawgiver, and the Chief Good, rejoicing to make his innocent creature a partaker of his happiness. In the latter, as infinitely merciful, adjudging life to the elect sinner consistently with his wisdom and justice. 2dly. In the covenant of works there was no mediator. In that of grace, there is the mediator, Christ Jesus. 3dly. In the covenant of works, the condition of perfect obedience was required to be performed by man himself, who had consented to it. In that of grace, the same condition is proposed, as to be, or as already performed, by a mediator. And in this substitution of the person consists the principal and essential difference of the covenants. 4thly. In the covenant of works, man is considered as working, and the reward to be given as of debt; and therefore, man’s glorying is not excluded, but he may glory, as a faithful servant may do, upon the right discharge of his duty, and may claim the reward promised to his working. In the covenant of grace, man, in himself ungodly, is considered in the covenant as believing; and eternal life is considered as the merit of the mediator, and as given to man out of free grace, which excludes all boasting, besides the glorying of the believing sinner in God, as his merciful Saviour. 5thly. In the covenant of works, something is required of man, as a condition which, performed, entitles him to the reward. The covenant of grace, with respect to us, consists of the absolute promises of God, in which the mediator, the life to be obtained by him, the faith by which we may be made partakers of him, the benefits purchased by him, and the perseverance in that faith, in a word, the whole of salvation, and all the requisites to it, are absolutely promised. 6thly. The special end of the covenant of works was, the manifestation of the holiness, goodness, and justice of God, conspicuous in the most perfect law, most liberal promise, and in that recompense of reward, to be given to those who seek him with their whole heart. The special end of the covenant of grace is, “the praise of the glory of his grace,” Eph. 1:6, and the revelation of his unsearchable and manifold wisdom: which divine perfections shine forth with lustre in the gift of a mediator, by whom the sinner is admitted to complete salvation, without any dishonour to the holiness, justice, and truth of God. There is also a demonstration of the all-sufficiency of God, by which not only man, but even a sinner, which is more surprising, may be restored to union and communion with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), 26–27.</cite></span></figcaption>

<blockquote><p>When you feel doubts about being God’s child because you have not shown God that obedience that you owe to him, know that the devil is very near you. He will attempt to falsify the gospel by convincing you that you must be saved by your works. Or he will attempt to seduce you to blaspheme the Lord Jesus by causing you to think that you can be or deserve to be your own savior, at least in part. Respond to this temptation by saying that you are a poor sinner, that Jesus Christ has come to save sinners, and that there is salvation only in him.</p></blockquote>

<blockquote><p>Why is the redemption or reconciliation of humanity with God presented to us in the form of a covenant, indeed a covenant of grace? A: God compares the means of our salvation to a covenant, indeed an eternal covenant, so that we might be certain and assured that a lasting, eternal peace and friendship between God and us has been made through the sacrifice of His son. After a bitter quarrel, the disputants have peace of mind first and foremost when they commit and bind themselves to each other with a promise and sworn oath that on such-and-such a matter they want peace. God acts in the same way toward us: in order that we might have rest and peace in our consciences, God was willing out of His great goodness and grace, to bind himself to us, His enemies, with His promise and His oath. He promised that He would have his only begotten Son become human and die for us, and that through the sacrifice of his Son He would establish a lasting reconciliation and eternal peace….He would be our God and bless us, that is, forgive our sins and impart to us the Holy Spirit and eternal life—and all this without any merit on our part. All we would have to do is accept the Son—promised and sent—by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 5</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Why is the redemption or reconciliation of humanity with God presented to us in the form of a covenant, indeed a covenant of grace? A: God compares the means of our salvation to a covenant, indeed an eternal covenant, so that we might be certain and assured that a lasting, eternal peace and friendship between God and us has been made through the sacrifice of His son. After a bitter quarrel, the disputants have peace of mind first and foremost when they commit and bind themselves to each other with a promise and sworn oath that on such-and-such a matter they want peace. God acts in the same way toward us: in order that we might have rest and peace in our consciences, God was willing out of His great goodness and grace, to bind himself to us, His enemies, with His promise and His oath. He promised that He would have his only begotten Son become human and die for us, and that through the sacrifice of his Son He would establish a lasting reconciliation and eternal peace….He would be our God and bless us, that is, forgive our sins and impart to us the Holy Spirit and eternal life—and all this without any merit on our part. All we would have to do is accept the Son—promised and sent—by faith.”

— Caspar Olevianus, A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhy+is+the+redemption+or+reconciliation+of+humanity+with+God+presented+to+us+in+the+form+of+a+covenant%2C+indeed+a+covenant+of+grace%3F+A%3A+God+compares+the+means+of+our+salvation+to+a+covenant%2C+indeed+an+eternal+covenant%2C+so+that+we+might+be+certain+and+assured+that+a+lasting%2C+eternal+peace+and+friendship+between+God+and+us+has+been+made+through+the+sacrifice+of+His+son.+After+a+bitter+quarrel%2C+the+disputants+have+peace+of+mind+first+and+foremost+when+they+commit+and+bind+themselves+to+each+other+with+a+promise+and+sworn+oath+that+on+such-and-such+a+matter+they+want+peace.+God+acts+in+the+same+way+toward+us%3A+in+order+that+we+might+have+rest+and+peace+in+our+consciences%2C+God+was+willing+out+of+His+great+goodness+and+grace%2C+to+bind+himself+to+us%2C+His+enemies%2C+with+His+promise+and+His+oath.+He+promised+that+He+would+have+his+only+begotten+Son+become+human+and+die+for+us%2C+and+that+through+the+sacrifice+of+his+Son+He+would+establish+a+lasting+reconciliation+and+eternal+peace%E2%80%A6.He+would+be+our+God+and+bless+us%2C+that+is%2C+forgive+our+sins+and+impart+to+us+the+Holy+Spirit+and+eternal+life%E2%80%94and+all+this+without+any+merit+on+our+part.+All+we+would+have+to+do+is+accept+the+Son%E2%80%94promised+and+sent%E2%80%94by+faith.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+A+Firm+Foundation%3A+An+Aid+to+Interpreting+the+Heidelberg+Catechism%2C+trans.+Lyle+D.+Bierma%2C+Texts+and+Studies+in+Reformation+and+Post-Reformation+Thought+%28Carlisle%2C+United+Kingdom%3B+Grand+Rapids%2C+MI%3A+Paternoster+Press%3B+Baker+Books%2C+1995%29%2C+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fafdf9a87.html&amp;via=5Solas" ta

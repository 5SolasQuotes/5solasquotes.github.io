<main class="wrap"><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 300-301</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fed762504d" data-kw="">
<blockquote><p>Let us then here call to mind the distinction which has been showed betwixt religious ceremonies and moral circumstances: for as touching moral circumstances which serve for common order and decency in the worship of God, they being so many and so alterable that they could not be particularly determined in Scripture, for all the different and almost infinite cases which might occur, the Jewish Synagogue had the same power for determining things of this nature which the church of Christ now has. For the law did not define but left the[m to] be defined by the Synagogue, the set hours for all public divine service, when it should begin, how long it should last, the order [that] should be kept in the reading and expounding of the law, praying, singing, catechizing, excommunicating, censuring and absolving of delinquents, etc., the circumstances of the celebration of mariage, of the education of youth in schools and colleges, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637), pt. 3, ch. 7, p. 119</span></figcaption>

<blockquote><p>1st Conclusion. To communicate with the Church ordinarily and of set purpose is an act of external Church communion: 1. Because if the preacher in preaching edify the Church convened for that effect to receive edification, and if he convince the infidel by preaching and cause him fall down and worship God, and report that God is in that meeting, then to communicate with the Church in hearing and preaching is an act of external Church communion. Because an act of worship terminated and bounded upon the Church is a Church-act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 269</span></figcaption>

</figure><figure class="quote" id="q-7760eefc11" data-kw="">
<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 193</span></figcaption>

iged%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>242. Of the use of Amen being added to a Speech … 1. Three duties especially are required of him that utters the speech whereunto ‘Amen’ is added. … 2. To speak audibly, so as they which are to say Amen, may hear what is said. The Levites under the Law were expressly enjoined to speak to the people with a loud voice. Accordingly the Levites that were the mouth of the people to God, and prayed in their presence, cried with a loud voice unto the Lord their God. Be a prayer made as intelligibly as may be, if it be not heard of them that are present, they cannot with assent, desire, and say Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God: or, an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer</cite>, ... (1626; RHB, 2011) See the whole of the larger section, pp. 330-40.</span></figcaption>

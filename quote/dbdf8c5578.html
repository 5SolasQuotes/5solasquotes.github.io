<blockquote><p>But this is not all the usurpers that rose up in those days. Eugenius [the usurper] soon becomes more terrible than he (who once was but a schoolmaster). And how does this loyal St. Ambrose carry it? When he had got of Theodosius a pardon for all that took part with Maximus, even his army except two or three, yea and benefits too, yet did not this holy loyal man think it sinful to write thus to the tyrant Eugenius (Epistles, bk. 2, p. 103), Clementissimo Imperatori Eugenio, Ambrosius Episcopus, ‘Bishop Ambrose to the most clement emperor Eugenius.’ And thus concludes: In his vero in quibus vos rogari decet, etiam exhibere sedulitatem potestati debitam▪ sicut et scriptum est, cui honorem, honorem, cui tributum, tributum: Nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori? i.e. ‘But in these matters where it becomes us to petition you, we must also give the diligence due to power: as it is written, honor to whom honor, tribute to whom tribute: For when I honored you, when you were a private man from the inwards of my heart, how should I not honor you an emperor?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy… (London: Simmons, 1681) | pt. 2, ch. 22</cite>, p. 210</span></figcaption>

<blockquote><p>24. But as we have hitherto described the magistrate who truly is what he is called-viz. the father of his country, and (as the Poet speaks) the pastor of the people, the guardian of peace, the president of justice, the vindicator of innocence, he is justly to be deemed a madman who disapproves of such authority. And since in almost all ages we see that some princes, careless about all their duties on which they ought to have been intent, live, without solicitude, in luxurious sloth; others, bent on their own interest, venally prostitute all rights, privileges, judgments, and enactments; others pillage poor people of their money, and afterwards squander it in insane largesses; others act as mere robbers, pillaging houses, violating matrons, and slaying the innocent; many cannot be persuaded to recognize such persons for princes, whose command, as far as lawful, they are bound to obey. For while in this unworthy conduct, and among atrocities so alien, not only from the duty of the magistrate, but also of the man, they behold no appearance of the image of God, which ought to be conspicuous in the magistrate, while they see not a vestige of that minister of God, who was appointed to be a praise to the good and a terror to the bad, they cannot recognize the ruler whose dignity and authority Scripture recommends to us. And, undoubtedly, the natural feeling of the human mind has always been not less to assail tyrants with hatred and execration, than to look up to just kings with love and veneration. 25. But if we have respect to the Word of God, it will lead us farther, and make us subject not only to the authority of those princes who honestly and faithfully perform their duty toward us, but all princes, by whatever means they have so become, although there is nothing they less perform than the duty of princes. For though the Lord declares that a ruler to maintain our safety is the highest gift of his beneficence, and prescribes to rulers themselves their proper sphere, He at the same time declares, that of whatever description they may be, they derive their power from none but Him. Those, indeed, who rule for the public good, are true examples and specimens of his beneficence, while those who domineer unjustly and tyrannically are raised up by him to punish the people for their iniquity. Still all alike possess that sacred majesty with which he has invested lawful power. I will not proceed further without subjoining some distinct passages to this effect (Job 34:30; Hos. 13:11; Isa. 3:4; 10:5; Deut. 28:29). We need not labor to prove that an impious king is a mark of the Lord’s anger, since I presume no one will deny it, and that this is not less true of a king than of a robber who plunders your goods, an adulterer who defiles your bed, and an assassin who aims at your life, since all such calamities are classed by Scripture among the curses of God. But let us insist at greater length in proving what does not so easily fall in with the views of men, that even an individual of the worst character, one most unworthy of all honor, if invested with public authority, receives that illustrious divine power which the Lord by his Word devolved on the ministers of his justice and judgment, and that, accordingly, in so far as public obedience is concerned, he is to be held in the same honor and reverence as the best of kings. … 27. …If we constantly keep before our eyes and minds the fact, that even the most iniquitous kings are appointed by the same decree which establishes all regal authority, we will never entertain the seditious thought, that a king is to be treated according to this deserts, and that we are not bound to act the part of good subjects to him who does not in his turn act the part of a king to us. … 29. This feeling of reverence, and even of piety, we owe to the utmost to all our rulers, be their characters what they may. This I repeat the oftener, that we may learn not to consider the individuals themselves, but hold it to be enough that by the will of the Lord they sustain a character on which he has impressed and engraven inviolable majesty. But rulers, you will say, owe mutual duties to those under them. This I have already confessed. But if from this you conclude that obedience is to be returned to none but just governors, you reason absurdly.</p></blockquote>

<blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>

</figure><figure class="quote" id="q-900ae0fb00" data-kw="">
<blockquote><p>XVII. The consideration of this, that magistracy is an ordinance of the only wise God, and that such as are in authority are warranted of Him, and have commission from Him, should move Christians to carry themselves under them in the exercise of their power, as loyal, dutiful subjects, whatever their persons be, tho’ heathens and strangers to Christ, and enemies to his kingdom; for He would have the Christian Romans live in subjection unto their heathen magistrates, emperors, consul or senate, upon this motive, that there is no power but of God; and the powers that be, are ordained of God [Rom. 13].</p></blockquote>

<blockquote><p>…when there is a protestation against the constitution and very being of an Assembly, ‘tis true there is no submitting to it by the protesters. But yet there may be a protesting against some one or more particular deeds of an assembly when the constitution and being of it is acknowledged, and to such an assembly submission is not refused or denied by any principles of ours. So there may be a protesting or testifying against some particular abuses in a Church, and yet communion kept with that Church in lawful, true, necessary acts of divine worship.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-73d0ca9c3c" data-kw="">
<blockquote><p>Whereas ye complain of a dead ministry in your bounds, make Christ your minister, he can woo a soul at a dike-side in the field: He needs not us, howbeit the flock is obliged to seek Him in the shepherd’s tents. Hunger of Christ’s making may thrive, even under stewards who mind not the feeding of the flock, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3fd5c64a6f" data-kw="">
<blockquote><p>Largely as a result of the influence of Robert Hamilton, [in early 1679] there was less of a spirit of passive resistance and a greater determination to carry the battle to the authorities. The result was a series of confrontations of increasing violence. These started on 11 March, when Robert Johnstone, the Town Major of Edinburgh, who was noted for his persecution of those who attended unauthorized services, was lured to a house in the city under pretext of dispersing an illegal meeting, and was there set upon by a body of men, of whom Cameron’s brother Michael was one. On 30 March, when a field-meeting at Cummerhead, near Lesmahagow, was challenged by a party of soldiers, the response form those present was so robust that some of the soldiers were wounded and made prisoner, and the lieutenant in charge barely escaped with his life. Three weeks later a government trooper was shot dead, and another seriously wounded, in an attack by a body of armed men on their sleeping-quarters at Newmilns, in Ayshire. The blame for these and other incidents was, of course, attributed to Hamilton and his supporters, though there are good grounds to believe that some of them, particularly the last, were caused by rogue elements which had infiltrated his following and which he could not properly control.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>What a woeful, cursed spirit of bitterness is predmonin[at]ing in this land and in this age? Ephraim vexing Judah, and Judah Ephraim, Manasseh Ephraim, and Ephraim Manasseh; the growing doggedness of this temper, almost among us all, portends terrible things from the Lord against Scotland.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-6ecf0eb130" data-kw="">
<blockquote><p>Sundry of the better sort among us are prone to think that testimonies are of no value without that they be carried to great heights. Hence I pointed them to a notable instance we have have upon record concerning Joseph of Arimathea, to whom the Spirit of God has given a great character, Lk. 23:50-51. He was a good man and just, he consented not to the horrid deed of the murderers of our Lord. Some of note in our day would have said, That was not enough, he ought to have made a more resolute appearance; but we read not that the Lord said so. In several cases the current may be so very strong, that there’s access for no more than through grace to guard against the being carried down with it; ‘Thou shalt not follow a multitude to do evil,” Ex. 23:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

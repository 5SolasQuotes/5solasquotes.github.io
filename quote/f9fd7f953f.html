<blockquote><p>But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, — that is, the pardon of our sins and acceptance with God, — we say it is faith alone; for “The just shall live by faith,” Rom. i. 17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span></div>
<div class="actions"><button class="copy" data-copy="“But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, — that is, the pardon of our sins and acceptance with God, — we say it is faith alone; for “The just shall live by faith,” Rom. i. 17.”

</figure><figure class="quote" id="q-45d25bffc7" data-kw="">
<blockquote><p>What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | See especially Ch. 5, ‘Divine Revelation itself the only foundation and reason of faith’, p. 69 ff., pp. 69, 72, 81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-6ef0405c03" data-kw="">
<blockquote><p>From all these absurdities [of the sacrament of penance] the doctrine which we deliver is completely free. For absolution is conditional, allowing the sinner to trust that God is propitious to Him, provided he sincerely seek expiation in the sacrifice of Christ, and accept of the grace offered to him. Thus, he cannot err who, in the capacity of a herald, promulgates what has been dictated to him from the Word of God. The sinner, again, can receive a clear and sure absolution when, in regard to embracing the grace of Christ, the simple condition annexed is in terms of the general rule of our Master Himself—a rule impiously spurned by the Papacy—’According to your faith be it unto you,’ (Mt. 9:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174., vol. 2, bk. 3, ch. 4, sect. 22, p. 212</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-a8045f232c" data-kw="">
<blockquote><p>‘And whom He called, them also He justified.’ Having spoken of our calling, we come now to speak of our justification. This is a new benefit different from the former benefit of our calling, posterior to it in order of working but not in time: for in the same moment wherein the Lord by effectual calling gives us faith to believe, He does also justify us.</p></blockquote>

<blockquote><p>We concede that free will, in that which acts, is free from all necessity, so that it properly cannot act necessarily as to the exercise of its act, although with respect to the divine ordination it acts certainly and infallibly.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b943e00d91" data-kw="">
<blockquote><p>Thesis XX. Whence it appears not only that all and every heir of Adam is universally corrupt, but also totally corrupt, namely both with respect to the soul, and with respect to the body, and finally with respect to the whole composite being. For it should not be thought as if only the body were corrupt, or even only the soul, but the whole man, as great as he is, is corrupt. For just as the image of God was not in the soul alone, nor even in the body alone, but in man and therefore in the whole composite, so also this original sin should be attributed not only to the soul and body, but to the whole composite consisting of soul and body; which can be best gathered from the opposite, regeneration, which pertains not to one or the other part of man, but to the whole man. … Thesis XXII. That the soul is corrupt is, alas, sufficiently clear from the depravation both of the intellect, which, although it may discern something in matters contributing to the convenience of civil life, yet in spiritual matters pertaining to the true worship of God and the salvation of our soul, it is not so much dim-sighted as blind, unless the Lord gives a mind to understand, eyes to see, etc. For its wisdom is enmity against God, holding those things which are of the Spirit of God for foolishness. And although worldly men sometimes understand something, yet they have it not from flesh and blood, but from the revelation of God the heavenly Father. Then of the will, which is placed in the same plight as the intellect. For original sin has so depraved the will that it in no way wills the spiritual good, namely, neither with respect to substance, nor with respect to manner, that is, from faith and for the glory of God. Whence the heart of man is not undeservedly called fraudulent, hardened, whose imagination is evil from his youth. Thesis XXIII. The body is so corrupt that, first in general, our members present themselves as weapons of unrighteousness for sin; then in particular, the mouth is full of curses and bitterness; the tongue is deceitful and the lips are filled with the venom of asps; the throat is an open sepulcher; the eyes are either lustful and evil; the hands are ready for theft; the belly is a god; the knees are bent to idolatry; the feet are swift to shed innocent blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), pp. 9-10 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>

</figure><figure class="quote" id="q-47cd471641" data-kw="">
<blockquote><p>Suppose an apparently strong and healthy man should apply to you for relief, and, when asked why he did not labor for his subsistence, should reply, Because I can find no one to employ me. If you wished to know whether this or indolence were the true reason, you would offer him employment; and if he then refused to labor, you would feel satisfied that he was slothful and undeserving of your charity. So, when God puts into the hands of sinners a price to get wisdom, and they do not improve it, it becomes evident that they do not wish, that they are not willing, to become religious.</p></blockquote>

<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’</cite>, (2022) at Public Discourse</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.”

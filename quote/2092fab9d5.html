<blockquote><p>That the acceptance of presentations is not declared to be contrary to the principles of this Church; nor is there an effectual stop put to the intrusion of any into the office of the ministry contrary to the will of the congregation to which they are appointed.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d473f1181c" data-kw="">
<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (Religious Tract Society, 1863) Howe (1630-1705) was an English puritan and presbyterian theologian., pp. 275-76</span></figcaption>

</figure><figure class="quote" id="q-15ebf3428b" data-kw="">
<blockquote><p>When I find our blessed Savior enjoining his disciples both to hear and do what the Pharisees, who sat in Moses’s chair, said unto them, notwithstanding that, according to our Lord’s character of them, their works were diametrically opposite to their doctrine; I cannot help thinking it both new and odd divinity that upon my pastor’s differing from me in a disputable point, I’m no more obliged to receive the eucharist from his hands, or the law from his lips.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f51fbde79a" data-kw="">
<blockquote><p>13. If a pastor preach some unsound doctrines or faultily perform the public worship, or neglect just discipline and receive the unworthy to the communion of the church, or reject the worthy, the presence of the innocent members (who make not the fault their own by consent, or by neglecting their duties to reform it), makes none of this to be their sin, nor is to be taken for a sign of their consent: Nor will the presence of the unworthy deprive the godly of the blessing or comfort of God’s ordinance: Nor are they bound to separate from that church because of these corruptions, unless they are so great as to unchurch that church or make their worship and communion such as God Himself rejects and will not accept: or unless by imposing sin upon them, or some other way, the church expel them, or they have accidentally some other reason to remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing: I. a Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians</cite>, … (London: Parkhurst, 1691), pt. 2, Question 2, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

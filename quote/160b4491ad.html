<blockquote><p>4th Conclusion: There be three sorts that have communion rightly with our Church: 1. Infants baptized, for baptism is a seal of their fellowship with Christ, and therefore of communion with the Church. Because Separatists will have none members of the Church while [except] they can give proofs thereof by signs of regeneration, infants must be without the Church, as infidels and Turks, for none are the Church to them but the royal generation, partakers of the holy faith, taught of God, called and separated from the world: the rest are without. Hence baptism shall either seal no entering of infants in the Church, contrary to God’s Word, or the baptizing of infants is not lawful, as Anabaptists teach. 2. The hearers of the Word have a communion with the Church, as is clear seeing these that eat of one bread are one body, these that profess in the hearing of the Word, that same faith, are also that same body in profession; yet excommunicated persons are admitted as hearers of the Word. Hence only the extreme and great excommunication, 1 Cor. 16:22, cuts off men from being simply no members of the Church, that excommunication that makes the party as a heathen and publican supposes him still to be a brother and hearer of the Word, 2 Thess. 3:14-15. And all these are members of the Church and yet not necessarily converted. 3. The regenerate and believers that communicate of one bread and one cup at the Lord’s Table, are most nearly and properly members of one visible body, and none of these are to separate from Christ’s body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 10, p. 132</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory of a True Church</cite></span></figcaption>

</figure><figure class="quote" id="q-4c74426e65" data-kw="">
<blockquote><p>The [opposing] author expresses what his meaning is in the other part of this book: for he describes these [church] officers and these laws, what they are: Concerning all which this I say in general, that here is nothing but palpable ignorance to be found, for first these governing officers, pastors, doctors, elders, deacons and relievers, being five in number, are so necessarily required that the want [lack] of these or any of these in a congregation, causes it to be no Church apparant… Secondly, that the want of elders takes not away the esse or being of the church, considering that Christ and his disciples which joined with Him were the apparant Church, and yet during the time of his humiliation these officers were not erected. And when many revolted, as is to be seen, Jn. 6, Christ asking the twelve if they also would go away, Peter answered in the name of the rest, ‘Master to whom shall we go, Thou hast the words of eternal life?’ so that Peter accounts the Word a sufficient warrant for his continuing with Christ, howsoever these men though they confess that the Word of God is to be heard, yet deny the hearing of it at their mouths which have not ordained elders among them. But this may seem no sufficient proof which is taken from Christ and his disciples forasmuch as this discipline was not then commanded. I answer that if there were a time when the Church of Christ was without this government, and forasmuch as it received not the government of the Jews, it is not a perpetual rule that outward government should be the life of the Church. But I will not hold them in this straight: they ask where we can find a Church without this government after that Christ had sent his Spirit upon the disciples. I answer that as Timothy was left at Ephesus, so was Titus in Crete, I mean in the House of God, which is the Church of the living God. And yet at that time elders were not appointed in that Church before Titus had ordained them: not to speak of the Church of Jerusalem, which made choice of deacons, but not of elders. Also it is plain that the elders which were appointed in the churches by the apostles were for the most part such as dealt in the Word, and not in goverment only, as hereafter shall be made more manifest in his due place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alison.html">Richard Alison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Confutation of a Treatise of Brownism</cite>, (London: Scarlet,1590), A Plain Confutation, pp. 24-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

n+the+disciples.+I+answer+that+as+Timothy+was+left+at+Ephesus%2C+so+was+Titus+in+Crete%2C+I+mean+in+the+House+of+God%2C+which+is+the+Church+of+the+living+God.+And+yet+at+that+time+elders+were+not+appointed+in+that+Church+before+Titus+had+ordained+them%3A+not+to+speak+of+the+Church+of+Jerusalem%2C+which+made+choice+of+deacons%2C+but+not+of+elders.+Also+it+is+plain+that+the+elders+which+were+appointed+in+the+churches+by+the+apostles+were+for+the+most+part+such+as+dealt+in+the+Word%2C+and+not+in+goverment+only%2C+as+hereafter+shall+be+made+more+manifest+in+his+due+place.%E2%80%9D%0A%0A%E2%80%94+Richard+Alison%2C+A+Plain+Confutation+of+a+Treatise+of+Brownism+%28London%3A+Scarlet%2C1590%29%2C+A+Plain+Confutation%2C+pp.+24-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c74426e65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c74426e65.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-church#:~:text=The%20%5Bopposing%5D%20author%20expresses%20what%20his,more%20manifest%20in%20his%20due%20place&amp;text=The%20%5Bopposing%5D%20author%20expresses%20what%20his%20meaning%20is&amp;text=be%20made%20more%20manifest%20in%20his%20due%20place" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-62b6e1860c" data-kw="">
<blockquote><p>This Sabbath is then kept holy unto the Lord, when men, after a due preparing of their hearts, and ordering of their common affairs beforehand, do not only observe an holy rest all the day from their own works, words, and thoughts, about their worldly employments and recreations (Ex 20:8; 16:23, 25-26, 29-30; 31:15-17; Isa 58:13; Neh 13:15-22); but also are taken up the whole time in the public and private exercises of his worship, and in the duties of necessity and mercy. (Isa 58:13; Mat 12:1-13)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf78098637" data-kw="">
<blockquote><p>To conclude, three sorts of works may lawfully be done on the Sabbath day: 1. Works of piety, which either directly concern the service of God, though they be performed by bodily labor: as under the Law, the priests did labour in killing and dressing the sacrifices, and burning them on the altar. And Christians under the Gospel, when they travail far to the places of God’s Worship: it is but a Sabbath day’s journey, like to that of the Shunamite (2 Kings 4:22), who travailed from home to hear the prophet on the Sabbath day, because she had no teaching near her own dwelling. And the preacher, though he labors in the sweat of his brows, to the wearying of his body, yet he does but a Sabbath day’s work. For the holy end sanctifies the work, as the temple did the gold, or the altar the gift thereon. Or else such bodily labor whereby the people of God are assembled to his worship, as the sounding of trumpets under the Law, or the ringing of bells under the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety… (London: Hodgets, 1613), ‘Now of the third sort of duties after the holy Assembly,’</cite>, pp. 609-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

lank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb0567b629" data-kw="">
<blockquote><p>And yet so far only to exercise it [the body on the Lord’s Day] as not to tire and weary it, if urgent occasion do not require, lest wearisomeness require some such recreation thereof as is nor [not] meet. … Whence it follows that all bodily recreations that do not further us to divine worship, are unlawful on the Lord’s Day: Because they serve only to refresh the body after labor; which is restrained therefrom; otherwise I say, then they shall make us fitter to serve God, when we have any liberty to labor upon case of necessity, though we may use that liberty to wearisomeness, yet this is to be relieued specially with spiritual recreation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cooper.html">Thomas Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wilie Beguile Ye, or The Worldling’s Gain… (London, 1621), Conclusion to the Reader, pp. 53-54 Cooper (1569/70 – 1626 or later) was an English puritan; works.</cite></span></figcaption>

</figure><figure class="quote" id="q-712e5cf219" data-kw="">
<blockquote><p>I take it we are not denied to rejoice and solace ourselues upon this day. For to some men, at some times, recreation may be more necessary than meat, in case of weakness, for present preservation of health. And though not in that regard, yet being well used, it may be a furtherance to men, in the performance of the duties of godliness, as well as in the duties of their calling. But this rejoicing must be such as was the rejoicing of the Jews, Neh. 8:12, which was only spiritual, and in the Lord. For they reioyced only for this, that they understood the law of God that was taught them. But as for the recreations and pastimes aforenamed, as bowling and such like, they are not at this time to be used…</p></blockquote>

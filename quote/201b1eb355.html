<blockquote><p>I say indeed the guilt of Adam’s transgression is derived unto us, that is to our persons by imputation; but that very sin of Adam was the sin of our natures, as Augustine speaks: Non modo natura facta est peccatrix, sed et genuit peccatores. ‘Not only our human nature became a sinner, but also begat sinners.’ (De Nuptitis, ch. 34) And accordingly it is justly imputed unto our persons, otherwise how could it be just with God to condemn any man for original sin; which yet is expressly acknowledged by Mr. Hoord. And the apostle says expressly that ‘in Adam all have sinned.’ And Augustine gives the reason of it: De Adamo omnes peccatum originale trahunt, quia omnes unus fuerunt. ‘All draw original sin from Adam, because all were that one.’… And that the corruption consequent is derived to us only by propagation, I think it is without doubt amongst all who concur not with Pelagius in maintaining that it is derived unto us by imitation, and so [by this] only… they proceed from a false ground, supposing that the reason of this imputation of Adam’s sin, and propagation of his corruption unto all his posterity, is merely built upon this foundation, that we were in Adam’s loins when he sinned, which is untrue:

1. In his first reason he does miserably overlash; for we could not be guilty of all the sins which were committed by Adam from his fall to his life’s end, no not upon the ground whereon this authour builds; so long we were not in his Ioines, nor any longer than till he begat Seth; for from Seth sprang Noah, and we all from him. Neither is it credible that Adam continued to beget children till the last yeare, and month, and day of his life. Indeed we no where read that we are guilty of any other of his sins besides the first, the reason whereof shall be given in the next place.

2. Therefore I say, in answer unto them both that the ground of imputing Adam’s sin unto his posterity is not only because we were in Adam’s Ioins, but because the first sin of Adam was it that bereaved his nature of God’s image; and so brought corruption upon himself by an aversion from the Creator and unchangeable good, and conversion unto the creature, wherein the Lord left him, bereaving him of his Spirit; and this nature, by this sin alone so corrupt, is the fountain of all our natures: Like as if Adam had stood, of the same fountain of integrity we had all received incorrupt natures, so that the like cannot be said of any other sin of Adam afterwards committed by him, nor of the sin of any other our progenitors succeeding him. For as for the wicked, they have no such spirit of God to loose; and as for the godly, they have indeed the Spirit of God, but so as not to be taken from them by the sins committed by them, any more than it was from David upon the committing of so foul sins in the matter of Uriah; neither do any godly parents propagate their state of grace to their posterity. And Aquinas is so bold hereupon as to profess that (Summa, pt. 1 of 2, q. 81, art. 2, in the body): Impossibile est, quod aliqua peccata parentum proximorum, vel etiam primi parentis praeter primum, per originem traducantur. ‘It is impossible that the sins of our immediate parents, or of our first parents, besides the first, should be derived unto posterity by propagation.’ For, says he, a man generates the same with himself in kind [or nature] only, not in individual. And therefore those things, which pertain to him as a particular person, as acts personal, he does not propagate unto his children. Now to the nature of man, something may pertain naturally, something by the gift of grace. And this original righteousness as a gift of grace was bestowed on the whole nature of mankind in our first parents, which Adam lost by his first sin; so that like as original righteousness had been propagated to posterity together with the human nature, so also the opposite inordination. But as for other actual sins, either of our first parents, or of others, they do not corrupt the nature of man, as touching that which pertains to nature, but as touching that which pertains to his person; therefore other sins are not propagated unto posterity. And this reason which Aquinas gives, was long before given by Anselm, De Conceptu Virginali et Originali Peccato, ch. 23.</p></blockquote>

<blockquote><p>Although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote>

<blockquote><p>La Place’s innovation was as a matter of course condemned by the Reformed world, formally at the Synod of Charenton (1644-1645) and in the Helvetic Consensus (1675) and by argument at the hands of the leading theologians — Rivetus, Turretin, Maresius, Driessen, Leydecker, and Marck. But the tendencies of the time were in its favor and it made its way. It was adopted by theologians like Wyttenbach, Endemann, Stapfer, Roell, Vitringa, Venema; and after a while it found its way through Britain to America, where it has had an interesting history — forming one of the stages through which the New England Theology (q.v.) passed on its way to its ultimate denial of the quality of sin involving guilt to anything but the voluntary acts of a free agent; and finally becoming one of the characteristic tenets of the so-called “New School Theology” of the Presbyterian Churches. Thus it has come about that there has been much debate in America upon “imputation,” in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“La Place’s innovation was as a matter of course condemned by the Reformed world, formally at the Synod of Charenton (1644-1645) and in the Helvetic Consensus (1675) and by argument at the hands of the leading theologians — Rivetus, Turretin, Maresius, Driessen, Leydecker, and Marck. But the tendencies of the time were in its favor and it made its way. It was adopted by theologians like Wyttenbach, Endemann, Stapfer, Roell, Vitringa, Venema; and after a while it found its way through Britain to America, where it has had an interesting history — forming one of the stages through which the New England Theology (q.v.) passed on its way to its ultimate denial of the quality of sin involving guilt to anything but the voluntary acts of a free agent; and finally becoming one of the characteristic tenets of the so-called “New School Theology” of the Presbyterian Churches. Thus it has come about that there has been much debate in America upon “imputation,” in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.”

<blockquote><p>11. There are two parts of this [original] sin: the former is the defection from God in the loins of Adam; the latter is the pravitas (depravity) that followed that defection. Hence it happens that original sin is said to be both inherent and imputed.

12. Imputed sin is that disobedience or defection of Adam, which was imputed to all his posterity who were in his loins, because they were in Adam as in their stock and root. For it is most just before God, and indeed it is received among all nations, that what the head does is deservedly imputed to the whole body, and that children are despoiled of all paternal goods on account of the father’s rebellion. But the case is not the same for other sins of parents, which, because they are truly personal, are therefore not transfused into their children.

13. The sin of Adam in the very act of his sinning is indeed alien from us, because we were not yet in act, but only in potentiality (δυνάμει) and originally in his loins; but with respect to the nature common to us and to him, it is proper to each. Therefore, we are punished not on account of the sin of Adam, but on account of our own which is in reality inherent in us. Just as someone infected in a time of contagion infects others, and the infected die; he who dies, dies not on account of the plague of another, but on account of his own. …

23. As to the mode by which this sin is derived into posterity, we confess that this cannot be explained with sufficient precision. Augustine advises that nothing should be rashly asserted in such a question; and certainly, one should rather ask by what way we can escape from that evil, than how it has come down to us.

24. It must be known, however, that it is not transferred to us only by custom or by example and imitation of the sin of the first parents, as the Pelagians contended, for those who cannot imitate the sins of others also die and are judged (Rom. 5:14); but by propagation and natural traduction, we who are born such as Adam was after the sin.</p></blockquote>

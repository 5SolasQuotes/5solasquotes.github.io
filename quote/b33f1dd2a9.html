<main class="wrap"><figure class="quote" id="q-b33f1dd2a9" data-kw="">
<blockquote><p>[18. You shall bind.] The Jesuits would fain the this key of excommunication unto the Bishop’s girdle alone: which is against the mind of our Saviour Christ, and circumstance of the place: but if they will say so, and speak so strangely, they must warrant it with some other places of scriptures, where the Church is taken for one, which is as much to say, one man is many, one member is as body, one alone is a company. And beside this strangeness of speech, it destroyeth the sovereignty of the medicine which our Saviour Christ prepared for such a festered soar, as would neither be healed by private admonition, neither with admonition before one or two witnesses.

For as the fault growth, so our Saviour Christ would have the number of those before whom he should be checked and rebuked, likewise grow. Therefore from a private admonition, he riseth unto the admonition before two or three: and from them to the Church; which if we should say, it is but one: then unto a dangerouser wound, should be laid an easier plaster. And therefore our Saviour doth not rise from two to one (for that were not to rise but to fall, nor to proceed, but go backward) but to many. But Paul is the best interpreter, who in a case of excommunication, declareth that the same is to be done in the presence, and with consent of the assembly, whereof the party which is to be excommunicated, is a member.

To conclude: Theophilact upon this place interpreteth, Tell the Church, that is Many. And because that assembly in the time of the Law, were of two sorts: for some had the handling of the word, othersome watching against the offences of the Church, did by common counsel with the ministers of the word, take order against the same. Those governing Elders are divers times in the story of the Gospel made mention of, under the title of the Rulers of the Synagogue. And this manner of government, because it was to be translated into the Church of Christ under the Gospel, our Saviour by the order (at that present) used amongst the Jews, declareth what after should be done in his Church.

Agreeably hereunto the Apostle both declared the Lord’s ordinance in this behalf, and put the same in practice in ordaining to every several Church, beside the Ministry of the word, certain of the chiefest men which should assist the work of the Lord’s building. This was also faithfully practised of the Churches, after the Apostles’ times, as long as they remained in any good and allowable soundness of the doctrine. And being fallen from the Churches, especially from certain of them, the want thereof is sharply and bitterly cast in the teeth of the Church teachers, by whose ambition that came to pass.

I conclude therefore, that to tell the Church, is not to tell the Bishop or Minister of the word only; but a company which hath oversight of the Church; by whom, or by whose mouth, which is the minister of the word, the rest of the body of the Church is to be advertised: to the end that the sword of excommunication cut not without their privity and consent. Whereupon it is evident, that the places of these Fathers, which give power to the Bishops to bind, and to loose: do not restrain it unto them, shutting out the rest of the Church, which might be shewed by many testimonies out of them, if the same were needful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of the Rhemists Translation, Glosses and Annotations on the New Testament</cite>, (Leiden, 1618), p. 90.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51797c8bb1" data-kw="">
<blockquote><p>1. We bear the greater costs of sex and reproduction Females invest more biologically in reproduction, from egg production to pregnancy, birth, and lactation. This influences the design of our brain and body, even if we have no plans to have children. It shapes everything from our sexual psychology to the ways we compete.

2. Our hormones cycle Our sex hormones don’t stay static—they ebb and flow across the menstrual cycle, life stages (puberty, pregnancy, postpartum, perimenopause), and in response to environmental cues. These fluctuations impact our metabolism, immune system, brain, behavior, and emotions.

3. We Are Most Powerful When in a State of Balance The female body thrives on cycles of exertion and recovery. Whether it’s the menstrual cycle, exercise, cognition, or childbirth, we are wired to push and then restore. Chronic overdrive without repair leads to burnout and dysregulation.

4. Our Brains Are More Interconnected Compared to males, female brains show more crosstalk between hemispheres and between emotion-processing and executive areas. This contributes to greater emotional awareness, verbal fluency, and intuitive social reasoning.

5. We’re an Immunological Powerhouse…but More Inflammatory Estrogen ramps up immunological vigilance, giving us an edge in fighting infections. But this same immune sensitivity also makes us more prone to autoimmune and inflammatory conditions.

6. Our Physiology Prioritizes Safety and Energy Efficiency Above All Else Evolution has wired the female body to conserve resources and protect reproductive capacity. Under stress, scarcity, or social threat, it downshifts fertility, libido, and energy output. It also makes it easier for us to gain weight, harder to lose it, and makes us more likely to experience anxiety when we’re not in relationships.

7. We Are Built to Evolve Female brains undergo large-scale remodeling during puberty, pregnancy, postpartum, and menopause. These changes shift our priorities, cognition, and how we think, feel, and experience the world. Our brains adapt dramatically across life phases to meet new demands.

8. We’re Sensitive to the Social Our neurobiology makes us especially attuned to relationships, belonging, and emotional safety. This isn’t fragility; it’s adaptation. Our HPA axis (stress axis) is more sensitive than men’s. The female brain evolved in tight social ecosystems where connection was survival and failure to form groups would have led to their demise.

9. We’ve Been Seen Before We’ve Been Heard Because female fertility is transient and invisible, human cultures have long used appearance – youth, skin quality, body shape – as a proxy for a woman’s ability reproduce. This means that – as much as we might hate this to be true – women have evolved to monitor their appearance more vigilantly than men, and we’ve been taught to see our bodies through the eyes of others.

10. We Perceive More Research finds that women have greater sensitivity to touch, smell, and pain. This reflects different thresholds for detecting threat or opportunity – useful in parenting, mate choice, and social contexts. Our sensory systems are finely tuned – and can become sometimes overloaded.

11. Our Design Is Not a Disorder Being female isn’t a deviation from a male norm, it’s its own blueprint. When medicine ignores or pathologizes how we are built, it creates dysfunction and we think our body is the enemy. When we work with our biology instead of against it, we thrive. …</p></blockquote>

<blockquote><p>I have also proven before that human laws do not bind to obedience but only in this case, when the things which they prescribe do agree and serve to those things which God’s Law prescribes: so that as human laws they bind not, neither have they any force to bind, but only by participation with God’s Law.</p></blockquote>

<blockquote><p>Bavinck… says, the church ‘cannot do without women in this work.’ This includes things like Sunday school, care for the poor and the sick, care for the elderly, the support of pregnant women, and more. He doesn’t think these activities need to be directly under the oversight of the church as an institution, but the church does have the calling to promote this kind of work where women use their gifts.</p></blockquote>

</figure><figure class="quote" id="q-c8a69f0ca6" data-kw="">
<blockquote><p>The Apostle S Paul doth notably amplify the honour due to the true and faithful Ministers. The Elders that rule well (saith he) let them be had in double honour, specially they which labour in the word and doctrine, as if he should say, let those Elders which are appointed to watch and look to the manners and behaviour of the children of God, if they execute this charge faithfully, be had in double honour: but above all, let the faithful Ministers, such as labour in the word, be honoured: for why? the other are overseers of your outward behaviour, but these have an other manner of office, they watch over your souls, which tendeth to the salvation both of body and soul.</p></blockquote>

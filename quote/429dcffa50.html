<main class="wrap"><figure class="quote" id="q-429dcffa50" data-kw="">
<blockquote><p>1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way.

2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years.

3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-zepperus.html">Wilhelm Zepperus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacraments (Herborn, 1606), ch. 13, fol. 324-26, 328, as trans. by John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’, pp. 173-74 Zepper (1550-1607) was a German reformer.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8483e69a21" data-kw="">
<blockquote><p>First, the power claimed by the governors of the Christian Church is not an arbitrary or capricious authority, to be wielded at will by them, in disregard of the rights or consciences of the members. There are certain limitations of a most important nature affixed to that power, and certain principles of a definite kind laid down for the use and administration of it, which set bounds round about it, and bring it into harmony with the liberty of conscience, rightfully belonging to every private individual of the Christian society. … 3rd. Church power is limited by the rule prescribed for its exercise, or by the Word of God. This third limitation ties down the administration of Church power to certain fixed principles and a certain definite law, and excludes the possibility of its becoming a wayward and arbitrary authority, to be wielded at the will or caprice of man. It forbids the unauthorized addition or subtraction of anything in the constitution, doctrine, worship, or discipline of the Church, such as Christ has not sanctioned in His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1 (Edinburgh, 1868), pp. 241-2, 248</span></figcaption>

</figure><figure class="quote" id="q-364bdb303f" data-kw="">
<blockquote><p>Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74</span></figcaption>

<blockquote><p>Those very feasts [in the Early Church] made a composition or mixture of human institutions with divine, and therfore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day.</p></blockquote>

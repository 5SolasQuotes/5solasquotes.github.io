<main class="wrap"><figure class="quote" id="q-d2cd7d1062" data-kw="">
<blockquote><p>From the doctrine of justification by faith only, a carnal Christian gathers, that good works are not necessary. He commends others that do good works, but he persuades himself that he shall be saved by his faith, without doing any such matter. But he should know, that though good works are not necessary to justification, yet they are necessary to salvation: “For we are God’s workmanship, created in Christ Jesus unto good works, which God hath predestinated that we should walk in them.” (Eph. ii. 10.)

Whosoever, therefore, in years of discretion, brings not forth good works after he is called, he cannot be saved; neither was he ever predestinated to life eternal (Fulk. Rhem. Test. Annot. in Eph. ii. 2.) Therefore the Scripture saith, that Christ will reward every man according to his works (Rom. ii. 6; 2 Cor. ix. 6; Rev. xxii. 12.) Christ respects in the angels of the seven churches nothing but their works (Rev. ii. 2;) and at the last day he will give the heavenly inheritance only to them who have done good works—in feeding the hungry, clothing the naked, &amp;c. At that day righteousness shall wear the crown (Matt. xxv.; 2 Tim. iv. 8.) No righteousness, no crown—no good works, according to a man’s talent, no reward from God, unless it be vengeance (Rom. ii. 8.)

To be rich in good works, is the surest foundation of our assurance to obtain eternal life (1 Tim. vi. 19;) for good works are the true fruits of a true faith, which apprehendeth Christ, and his obedience unto salvation. And no other faith availeth in Christ, but that which worketh by love (Gal. v. 6;) and (but in the act of justification) that faith which only justifieth, is never alone, but ever accompanied with good works: as the tree with his fruits, the sun with his light, the fire with his heat, and water with his moisture. And the faith which does not justify herself by good works before men, is but dead faith, which will never justify a man’s soul before God (James ii. 26.) But a justifying faith purifieth the heart and sanctifieth the whole man throughout (Acts xv. 9; xvi. 18; 1 Thess. v. 23.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 79-80.</span></figcaption>

<blockquote><p>Believe me, the crown and glory of the Gospel is justification by faith, without the deeds of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on Justification</span></figcaption>

— J. C. Ryle, Old Paths, ch. on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBelieve+me%2C+the+crown+and+glory+of+the+Gospel+is+justification+by+faith%2C+without+the+deeds+of+the+law.%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Old+Paths%2C+ch.+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fea94fcd418.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ea94fcd418.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-e7fac7e276" data-kw="">
<blockquote><p>Take note, therefore, of a new righteousness and a new definition of righteousness. For one usually says: “Righteousness is the virtue that renders to everyone his due.” Here it is stated that righteousness is faith in Jesus Christ or the virtue by which one believes in Jesus Christ, as in Rom. 10:10: “With the heart man believes unto righteousness”; that is, if anyone wants to be righteous, it is necessary for him to believe in Christ with his heart. And in the third chapter St. Jerome says: “Well put is that true statement of a wise man that the believer does not live as the result of righteousness but is righteous by faith.” A beautiful statement indeed! It follows now that the man who is righteous through faith does not through himself give to anyone what is his; he does this through Another, namely, Jesus Christ, who alone is so righteous as to render to all what should be rendered them. As a matter of fact, they owe everything to Him. But he who believes in Christ and by the spirit of faith has become one with Him not only renders satisfaction now to all but also brings it about that they owe everything to him, since he has all things in common with Christ. His sins are no longer his; they are Christ’s. But in Christ sins are unable to overcome righteousness. In fact, they themselves are overcome. Hence they are destroyed in him. Again, Christ’s righteousness now belongs not only to Christ; it belongs to His Christian. Therefore the Christian cannot owe anything to anyone or be oppressed by his sins, since he is supported by such great righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 27: Lectures on Galatians, 1535, Chapters 5-6; 1519, Chapters 1-6, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 27 (Saint Louis: Concordia Publishing House, 1999), 240–41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-ca9e52e604" data-kw="">
<blockquote><p>Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in</cite>, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 3, (3), proposition 2, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

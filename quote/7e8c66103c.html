<blockquote><p>3. These false teachers, or foxes, are said to spoil the vines, for foxes hurt not a vineyard, or flock of lambs, more than false teachers do the Church. 1. Corrupting the purity of doctrine. 2. Obscuring the simplicity of worship. 3. Overturning the beauty of order and bringing in confusion.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-443e8d7f31" data-kw="">
<blockquote><p>Calvin and Beza employed various measures in order to send the preachers they trained into France in a way that would ensure their safety and minimize the likelihood of detection and capture. They sent them into France under assumed names, carrying false identities, forged papers, clandestine meetings. They took obscure mountain passages in order to avoid the authorities along the border.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“Calvin and Beza employed various measures in order to send the preachers they trained into France in a way that would ensure their safety and minimize the likelihood of detection and capture. They sent them into France under assumed names, carrying false identities, forged papers, clandestine meetings. They took obscure mountain passages in order to avoid the authorities along the border.”

</figure><figure class="quote" id="q-2e809cbdf1" data-kw="">
<blockquote><p>But because there is no hope that most should be judicious, there is no other remedy for such but this of Christ’s prescript which I have here set down: First, happy is he that chooses a judicious faithful guide and learns of him till his own understanding be better illuminated; and that escapes the conduct of ignorant, erroneous, self-seeking, proud, dividing teachers. Secondly, continue in the communion of the generality of agreeing Christians: The generality of the godly are more unlikely to be forsaken of Christ than a few odd self-conceited singular professors. This is the way of peace to yourselves and to the Church of Christ.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<main class="wrap"><figure class="quote" id="q-ea39884cbf" data-kw="">
<blockquote><p>2. Express and actual reference and intention to every commandment of God, or to God’s glory in every particular action, I do not urge; a habitual reference and intention I conceive is holden forth to us in Scripture: 1 Cor. 10:31… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in faith, and with a warrant from scripture to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (London, 1646)</cite>, pp. 73-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62732e5795" data-kw="">
<blockquote><p>2. I deny that condemnation comes upon any man by virtue of the Law given to Adam, till himself be born a child of Adam. Therefore, from the acknowledged pnrity of reason it must follow that no man is justified by the Covenant made with Christ, till himself be borne of Christ, that is, by faith, Gal. 3:26; Jn. 1:12-13 and 3:5…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-woodbridge.html">Benjamin Woodbridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Justification of Sinners… (London: T.R., 1656), ch. 6, sect. 1</cite>, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-05656507d3" data-kw="">
<blockquote><p>We, indeed, acknowledge with Paul, that the only faith which justifies is that which works by love (Gal. 3:6); but love does not give it its justifying power. Nay, its only means of justifying consists in its bringing us into communication with the righteousness of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.20</span></figcaption>

</figure><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, p. 24</span></figcaption>

<blockquote><p>For which cause principally, I thought good to speak of it [love] briefly in this treatise, after faith and hope, for that faith, wherein we say consists the second part of our effectual calling, has these for inseparable companions, faith, hope, and repentance; after which follows our justification by order, not of time, but of nature.</p></blockquote>

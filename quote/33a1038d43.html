<main class="wrap"><figure class="quote" id="q-33a1038d43" data-kw="">
<blockquote><p>…as to the preaching of the Word, we grant that the people are not obliged to give blind and implicit obedience to what is delivered by the ministers, as if they ought to receive as the Word of God whatsoever is delivered by them, but that they have power and ought by the judgment of discretion to search the Scriptures whether the things delivered by the ministers be so, to try the spirits whether they be of God or not, to prove all things and hold fast that which is good, Acts 17:11; 1 Jn. 4:1; 1 Thess. 5:18; and the like judgment of discretion we grant to them in relation to other parts of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-wood.html">James Wood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Stone Pretended to be out of the Mountain, Tried &amp; found to be a Counterfeit</cite>, … (Edinburgh: Andro Andrews, 1654), pt. 2, sect. 1, p. 202</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a63c0c2f96" data-kw="">
<blockquote><p>Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47. Q. 155. How is the word made effectual to salvation? A. The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of enlightening,[m] convincing, and humbling sinners;[n] of driving them out of themselves, and drawing them unto Christ;[o] of conforming them to his image,[p] and subduing them to his will;[q] of strengthening them against temptations and corruptions;[r] of building them up in grace,[s] and establishing their hearts in holiness and comfort through faith unto salvation.[t] [m] Neh. 8:8. Acts 26:18. Ps. 19:8. [n] 1 Cor. 14:24,25. 2 Chron. 34:18,19,26-28. [o] Acts 2:37,41. Acts 8:27-39. [p] 2 Cor. 3:18. [q] 2 Cor. 10:4-6. Rom. 6:17. [r] Matt. 4:4,7,10. Eph. 6:16,17. Ps. 19:11. 1 Cor. 10:11. [s] Acts 20:32. 2 Tim. 3:15-17. [t] Rom. 16:25. 1 Thess. 3:2,10,11,13. Rom. 15:4. Rom. 10:13-17. Rom. 1:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-81a0827718" data-kw="">
<blockquote><p>In the beginning of the blessed Reformation, our wise and pious ancestors took care to set forth an order for redress of many things, which they then, by the Word, discovered to be vain erroneous, superstitious, and idolatrous, in the public worship of God. This occasioned many godly and learned men to rejoice much in the Book of Common Prayer, at that time set forth… Howbeit, long and sad experience hath made it manifest, that the Liturgy used in the Church of England, (notwithstanding all the pains and religious intentions of the compilers of it) hath proved an offence, not only to many of the godly at home, but also to the reformed Churches abroad. For, not to speak of urging the reading of all the prayers, which very greatly increased the burden of it, the many unprofitable and burdensome ceremonies contained in it have occasioned much mischief, as well by disquieting the consciences of many godly ministers and people, who could not yield unto them… …the [Anglican] Liturgy hath been a great means, as on the one hand to make and increase an idle and unedifying ministry… so, on the other side, it hath been (and ever would be, if continued) a matter of endless strife and contention in the Church… especially in these latter times, wherein God vouchsafeth to his people more and better means for the discovery of error and superstition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, Preface</span></figcaption>

</figure><figure class="quote" id="q-103454afe4" data-kw="">
<blockquote><p>If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)</p></blockquote>

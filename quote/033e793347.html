</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ded594794" data-kw="">
<blockquote><p>In giving the name of bishops, presbyters, and pastors, indiscriminately to those who govern churches, I have done it on the authority of Scripture, which uses the words as synonymous. To all who discharge the ministry of the word it gives the name of bishops. Thus Paul, after enjoining Titus to ordain elders in every city, immediately adds, &quot;A bishop must be blameless,&quot; &amp;c., (Tit. 1: 5, 7.) So in another place he salutes several bishops in one church, (Phil. 1: 1.) And in the Acts, the elders of Ephesus, whom he is said to have called together, he, in the course of his address, designates as bishops, (Acts 20: 17.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.3.8</span></figcaption>

</figure><figure class="quote" id="q-58da2d3e5c" data-kw="">
<blockquote><p>Furthermore, our theologians believe that churches should be free to send and delegate to councils even private individuals, provided they are pious, learned, and knowledgeable in ecclesiastical matters, and these, in such a case, can give their vote on proposed matters in common with the pastors and elders. This is also taught and believed by Whitaker in Controversy 3, On Councils, question 3, the illustrious Moses Amyraut in his Theses on Councils, part 2, Wendelin in Christian Theology, book 1, chapter 28, thesis 31, Bucanus in place 43, number 23, and Tilenus in Disputations on Councils, 1, and many others. Hence, it is evident what the status of this controversy with the modern Pontiffs is, namely, whether only bishops have a decisive vote in councils, which the Pontiffs affirm, or whether the same right belongs to any delegates of the churches, whether they are pastors or from other governors of the Church, or even otherwise private individuals, which our theologians teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2. ‘Who are to be called to councils, and of what kind of persons they should consist’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 4. Controversies on Councils, pp. 1029-31 Latin</cite>, p. 1,031</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church#:~:text=Furthermore%2C%20our%20theologians%20believe%20that%20churches,private%20individuals%2C%20which%20our%20theologians%20teach&amp;text=Furthermore%2C%20our%20theologians%20believe%20that%20churches%20should%20be&amp;text=even%20otherwise%20private%20individuals%2C%20which%20our%20theologians%20teach" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0d46314e2f" data-kw="">
<blockquote><p>The Jewish subordinations, being no temple ordnances, nor typical or ceremonial, do in the moral equity of them concern us as well as them; at least we may with much more reason urge an argument, a pari ratione [from the reason of parity], from subordinations in the Jewish Church to prove a subordination still; then our brethren can argue from thence against it: For the grounds of that subordination being from moral equity; and the ends and necessity of it being the same, now as then (viz. revolving difficult cases, ordering matters of common concernment, reforming offences in inferior societies, receiving appeals, redressing of injuries and neglect in mal-administration, etc.) the same reason still remains, that for the same ends and purposes, there should be subordinations now in the Chrisitan Church that was then in the Jewish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons presented by the Dissenting Brethren against certain propositions concerning presbyterial government… Together with the answer of the Assembly of Divines to those reasons of Dissent (London, T.R., 1648)</cite>, p. 147</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

then%20in%20the%20Jewish" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-38aad02d50" data-kw="">
<blockquote><p>Neither, in this same point of elections, do we homologate [agree] with them [Independents, Anabaptists and Separatists] who give to the collective body of the church (women and children under age only excepted) the power of decisive vote and suffrage in elections, we give the vote only to the eldership or church representative, so that they carry along with them the consent of the major or better part of the congregation… out of Thomas [Aquinas] this difference betwixt consent and election, that though every choosing be a consenting, yet every consenting is not a choosing. [1] The liberty of consent is one thing; [2] counsel or deliberation another thing; [3] the power of a decisive voice in court or judicatory a third thing. I speak of a constituted church (for where there is not yet an eldership there can be no such distinction; yet, however, be there an eldership, or be there none, the church’s consent must be had). The first of these [consent] we ascribe to the whole church, without whose knowledge and consent ministers may not be intruded; the second [counsel &amp; deliberation] to the ablest and wisest men of the congregation, especially to magistrates, with whose special advice, privity and deliberation, the matter ought to be managed; the third [a decisive voice in court], which is the formal and consistorial determination of the case of election, consists in the votes of the eldership. Their way [Independents, etc.] is much different than this, who would have the matter prepared by the conference and deliberation of the eldership (as we used to do in committees),¹ but determined and decided by the votes of the whole congregation. [¹There was a change in the Church of Scotland’s practice on this, probably due to a response to the Independents. See Thomas M’Crie (the younger), p. 232 of The Story of the Scottish Church. See especially the 2nd paragraph of the footnote. The context, from p. 228, is the discussion of patronage.] … I conclude with a passage out of the Ecclesiastical Discipline of the Reformed Churches in France, ch. 1, ‘The silence of the people, none contradicting, shall be taken for an express consent…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Miscellany Questions, ch. 2</cite>, pp. 11,13</span></figcaption>

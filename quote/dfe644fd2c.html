<blockquote><p>In the effectual calling of God it happens that we are now present before God and clothed in the righteousness of Christ, yet we are not yet justified or said to be justified before the sentence of God the Judge about us has been carried from His tribunal. And this new benefit of God is from a certain new grace, that God pronounces us righteous in that righteousness of Christ, apprehended by faith. For from grace is that alien righteousness, even made ours in a certain sure manner, namely, by faith He accepts as our own and on account of it justifies us, that is, He pronounces us righteous. For the rule of divine righteousness would demand otherwise that we are not considered righteous except in our own inherent righteousness, as they say. And for that reason, the apostle unites grace to faith in Romans 4:16, ‘The inheritance is from faith, that it may be by grace’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians, trans. Casey Carmichael, Classic Reformed Theology Series vol. 5 (Reformation Heritage Books, 2021), 182.</cite></span></figcaption>

<blockquote><p>14. No man is saved or justified but by the proper merit of Christ’s perfect obedience; yea, and his habitual holiness and satisfactory sufferings, advanced in dignity by his divine perfection. 15. This merit, as related to us, supposes that Christ, as a sponsor, was the Second Adam, the Root of the justified, the reconciling Mediator, who obeyed perfectly with that intent that by his obedience we might be justified; and who suffered for our sins, in our room and stead; and so was in tantum [to that extent] our Vicarius poenae, as some phrase it, or substitute; and was made a curse for us, that we might be healed by his stripes; as He was obedient, that his righteousness might be the reason as a meritorious cause of our justification: which supposes the relation of an undertaking Redeemer, in our nature doing this, and in our stead so far forth, as that therefore perfect obedience should not be necessary to be performed by ourselves: And righteousness therefore is imputed to us, that is, we are truly reputed righteous, because we, as believing members of Christ, have right to impunity and life, as merited by his righteousness, and freely given to all penitent believers. And Christ’s own righteousness may be said so far to be imputed to us, as to be reckoned or reputed the meritorious cause of our right or justification, as aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</cite></span></figcaption>

</figure><figure class="quote" id="q-4ec5135b3b" data-kw="">
<blockquote><p>But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, that is, the pardon of our sins and acceptance with God, we say it is such [faith] alone. ‘For the just shall live by faith,’ Rom. 1.17. And as the apostle applies this divine testimony to prove our first or absolute justification to be by faith alone, so does he also apply it unto the continuation of our justification, as that which is by the same means only, Heb. 10:38-39, ‘Now the just shall live by faith: but if any man draw back, my soul shall have no pleasure in him. But we are not of them that draw back unto perdition: but of them that believe, unto the saving of the soul.’ The drawing back to perdition includes the loss of a justified estate really so or in profession. In opposition thereunto the apostle places believing unto the saving of the soul; that is, unto the continuation of justification unto the end. And herein it is, that the just live by faith, and the loss of this life can only be by unbelief. ‘So the life which we now live in the flesh, is by the faith of the Son of God, who loved us and gave Himself for us,’ Gal. 2:20. The life which we now lead in the flesh is the continuation of our justification, a life of righteousness and acceptation with God, in opposition unto a life by the works of the Law, as the next words declare, v. 21, ‘I do not frustrate the Grace of God; for if righteousness came by the Law, then is Christ dead in vain; and this life is by faith in Christ as He loved us, and gave Himself for us, that is, as he was a propitiation for our sins.’ This then is the only way, means and cause on our part of the preservation of this life, of the continuance of our justification; and herein are we kept by the power of God through faith unto salvation [1 Pet. 1:5]. … …the apostle gives us another account hereof; Rom. 5:1-3. For he distinguishes three things: our access into the grace of God, (2) our standing in that grace, (3) our glorying in that station against all opposition. By the first he expresses our absolute justification. By the second our continuation in the state whereinto we are admitted thereby; and by the third, the assurance of that continuation, notwithstanding all the oppositions we meet withal. And all these he ascribes equally unto faith, without the intermixture of any other cause or condition. And other places express to the same purpose might be pleaded. 3. The examples of them that did believe and were justified which are recorded in the Scripture, do all bear witness unto the same truth. The continuation of the justification of Abraham before God is declared to have been by faith only, Rom. 4:3. For the instance of his justification given by the apostle from Gen. 15:6 was long after he was justified absolutely. And if our first justification and the continuation of it, did not depend absolutely on the same cause, the instance of the one could not be produced for a proof, of the way and means of the other, as here they are. And David when a justified believer, not only places the blessedness of man in the free remission of sins, in opposition unto his own works in general, Rom. 4:6-7, but in his own particular case, ascribes the continuation of his justification and acceptation before God, unto grace, mercy, and forgiveness alone, which are no otherwise received but by faith, Ps. 130:3-5; 143:2. All other works and duties of obedience do accompany faith in the continuation of our justified estate as necessary effects and fruits of it, but not as causes, means, or conditions whereon that effect is suspended. It is patient waiting by faith, that brings in the full accomplishment of the promises, Heb. 6:12, 16… And the continuation of our justification depends solely on the same causes with our justification itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith… (London: Boulter, 1677), ch. 5</cite>, p. 208-10</span></figcaption>

<blockquote><p>XXXVIII… Nor is he [Christopher Wittich] alone in considering sincere love of God and Christ among the essential acts of faith. [Marcus F.] Wendelin shares this sentiment. Although he reduces the parts of faith to three –knowledge, assent, and confidence – he nevertheless teaches that love also pertains to the acts of faith. For he proves that not only the intellect but also the will is the subject of faith, “Because faith is also love, and love is an act of the will,” which he supports with the testimony of Augustine saying, “To believe in Christ is to love Christ.” In Christian Theology, bk. 2, ch. 24, in the explanation of the eighth thesis. XXXIX. Similar views can be found in [Daniel] Chamier, who also uses the same argument to prove that faith is in the will, not just in the intellect. He says, ‘All love is an act of the will; but faith is love; therefore, it is an act of the will.’ He proves that faith is love because true faith is that which believes in God: But to believe in God is to love God, according to Augustine, ‘What is it to believe in God? To believe is to love.’ (Pancratia, vol. 3, bk. 12, ch. 4, no. 16). XL. And Wittich himself in the previously cited place brings forward the words of Cocceius, a professor at Leiden University while he was alive. ‘That faith,’ he says: ‘is a kind of love of God, by which I love God as the one who atones for sins and heals from the disease and penalty of sin, that I may be to His glory.’ (On the Last Words of Moses, p. 336). And in another place: ‘Therefore, faith is inherently connected with charity; since faith itself is nothing but the outpouring of Christ’s charity in our hearts, its sensation, and reciprocal recognition. One loves because they believe; and if they do not love, they do not believe.’ (in Examen Apologiae, p. 209). But many among the Reformed theologians think differently, like Samuel Maresius, Robert Baronius, Bucanus, and ultimately all who place faith solely in the intellect, like Peter du Moulin and the Professors of Saumur. For all of them indeed teach that the love of God arises from true faith and is an effect inseparable from it, yet they do not want it to be an act elicited by faith, as that would confuse faith with charity. … XCVI. Similarly, there is doubt about whether love is a formal and essential act of faith. Esteemed scholars such as Chamier, Wendelin, Wittich, and Cocceius assert it, while others deny it. For my part, I think some distinction is necessary here. Faith can be taken in two ways: First, precisely, according to what it has distinct from hope, charity, and other Christian virtues. In this sense, love is not a formal act of faith but pertains to another virtue, namely, charity. Secondly, faith is taken for a composite of several acts or habits, which are included under the term “faith working through love.” This is how many Reformed authors understand faith in this question, not as a single act or simple habit but as a complex of several acts or habits. From this, it follows that sincere love of God and Christ, without which faith cannot be conceived as living and working through love, undoubtedly belongs to faith as an essential act. . . In Lutheranism Article 1600’s Calov, Abraham – Thoughts on Objective Justification tr. Souksamay K. Phetsanghane 47 pp. in Biblia Illustrata (1672-1676; 2014), on 2 Cor. 5:18‐19; Rom. 3:23‐24; 4:25; 5:18‐19 with a bibliography Presented for the Southwestern Conference of the Western Wisconsin District of the Wisconsin Evangelical Lutheran Synod, Winter Conference, Feb. 25, 2014, St. John Lutheran, Baraboo, WI Calov (1612–1686) was a professor of theology at Konigsberg and Wittenberg and one of the champions of Lutheran orthodoxy in the 17th century. ‘Objective Justification’ refers to the erroneous notion of an objective, universal and conditional justification of all people through the work of Christ. While this doctrine is largely absent from the historic creeds of Lutheranism and Lutheran orthodoxy (which emphasized an actual, personal justification by faith), yet Phetsanghane seeks to show that this doctrine was taught to some minor extent, and incidentally, in some of the orthodox Lutheran theologians (principally Abraham Calov, 1612-1686) and it may be contained in some implicit form in some early historic Lutheran confessions. . Historical On the Post-Reformation Article Fesko, J.V. – ‘Reformed Orthodoxy on Imputation. Active &amp; Passive Justification’ in Perichoresis, vol. 14, issue 3 (2016), pp. 61-80 Abstract: “The doctrine of imputation is common to Early Modern Lutheran and Reformed theology, but Reformed orthodox theologians employed the distinction between the active and passive justification of the believer. Active justification is the objective imputation of Christ’s righteousness and passive justification is the subjective reception of the same. This distinction is a unique contribution in Reformed orthodox dogmatics and was used in polemics against Roman Catholic, Arminian, and Socinian theologians. This essay also compares Reformed orthodox formulations with Lutheran orthodox understandings of how they preserved the extra nos [outside of us] of Christ’s righteousness in justification. The Reformed orthodox employed the active-passive justification distinction in conjunction with the decree and the doctrine of the covenant of redemption, whereas the Lutheran orthodox logically placed justification first in the order of salvation. Both groups maintain the extra nos of Christ’s imputed righteousness but do so in different ways.</p></blockquote>

<blockquote><p>To the question, “If the Law does not justify, what is its purpose?” Paul, therefore, replies: “Although the Law does not justify, it is nevertheless extremely useful and necessary. In the first place, it acts as a civic restraint upon those who are unspiritual and uncivilized. In the second place, it produces in a man the knowledge of himself as a sinner, who is therefore subject to death and worthy of eternal wrath.” But what is the value of this effect, this humiliation, this wounding and crushing by the hammer? It has this value, that grace can have access to us. Therefore the Law is a minister and a preparation for grace. For God is the God of the humble, the miserable, the afflicted, the oppressed, the desperate, and of those who have been brought down to nothing at all. And it is the nature of God to exalt the humble, to feed the hungry, to enlighten the blind, to comfort the miserable and afflicted, to justify sinners, to give life to the dead, and to save those who are desperate and damned. For He is the almighty Creator, who makes everything out of nothing. In the performance of this, His natural and proper work, He does not allow Himself to be interfered with by that dangerous pest, the presumption of righteousness, which refuses to be sinful, impure, miserable, and damned but wants to be righteous and holy. Therefore God has to make use of that hammer of His, namely, the Law, to break, bruise, crush, and annihilate this beast with its false confidence, wisdom, righteousness, and power, so that it learns that it has been destroyed and damned by its evil. Then, when the conscience has been terrified this way by the Law, there is a place for the doctrine of the Gospel and of grace, which raises it up again and comforts it; it says that Christ did not come into the world to break the bruised reed or to quench the dimly burning wick (Is. 42:3) but to announce the Gospel to the poor, to bind up the brokenhearted, and to proclaim liberty to the captives (Is. 61:1).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“To the question, “If the Law does not justify, what is its purpose?” Paul, therefore, replies: “Although the Law does not justify, it is nevertheless extremely useful and necessary. In the first place, it acts as a civic restraint upon those who are unspiritual and uncivilized. In the second place, it produces in a man the knowledge of himself as a sinner, who is therefore subject to death and worthy of eternal wrath.” But what is the value of this effect, this humiliation, this wounding and crushing by the hammer? It has this value, that grace can have access to us. Therefore the Law is a minister and a preparation for grace. For God is the God of the humble, the miserable, the afflicted, the oppressed, the desperate, and of those who have been brought down to nothing at all. And it is the nature of God to exalt the humble, to feed the hungry, to enlighten the blind, to comfort the miserable and afflicted, to justify sinners, to give life to the dead, and to save those who are desperate and damned. For He is the almighty Creator, who makes everything out of nothing. In the performance of this, His natural and proper work, He does not allow Himself to be interfered with by that dangerous pest, the presumption of righteousness, which refuses to be sinful, impure, miserable, and damned but wants to be righteous and holy. Therefore God has to make use of that hammer of His, namely, the Law, to break, bruise, crush, and annihilate this beast with its false confidence, wisdom, righteousness, and power, so that it learns that it has been destroyed and damned by its evil. Then, when the conscience has been terrified this way by the Law, there is a place for the doctrine of the Gospel and of grace, which raises it up again and comforts it; it says that Christ did not come into the world to break the bruised reed or to quench the dimly burning wick (Is. 42:3) but to announce the Gospel to the poor, to bind up the brokenhearted, and to proclaim liberty to the captives (Is. 61:1).”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 314–315.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+the+question%2C+%E2%80%9CIf+the+Law+does+not+justify%2C+what+is+its+purpose%3F%E2%80%9D+Paul%2C+therefore%2C+replies%3A+%E2%80%9CAlthough+the+Law+does+not+justify%2C+it+is+nevertheless+extremely+useful+and+necessary.+In+the+first+place%2C+it+acts+as+a+civic+restraint+upon+those+who+are+unspiritual+and+uncivilized.+In+the+second+place%2C+it+produces+in+a+man+the+knowledge+of+himself+as+a+sinner%2C+who+is+therefore+subject+to+death+and+worthy+of+eternal+wrath.%E2%80%9D+But+what+is+the+value+of+this+effect%2C+this+humiliation%2C+this+wounding+and+crushing+by+the+hammer%3F+It+has+this+value%2C+that+grace+can+have+access+to+us.+Therefore+the+Law+is+a+minister+and+a+preparation+for+grace.+For+God+is+the+God+of+the+humble%2C+the+miserable%2C+the+afflicted%2C+the+oppressed%2C+the+desperate%2C+and+of+those+who+have+been+brought+down+to+nothing+at+all.+And+it+is+the+nature+of+God+to+exalt+the+humble%2C+to+feed+the+hungry%2C+to+enlighten+the+blind%2C+to+comfort+the+miserable+and+afflicted%2C+to+justify+sinners%2C+to+give+life+to+the+dead%2C+and+to+save+those+who+are+desperate+and+damned.+For+He+is+the+almighty+Creator%2C+who+makes+everything+out+of+nothing.+In+the+performance+of+this%2C+His+natural+and+proper+work%2C+He+does+not+allow+Himself+to+be+interfered+with+by+that+dangerous+pest%2C+the+presumption+of+righteousness%2C+which+refuses+to+be+sinful%2C+impure%2C+miserable%2C+and+damned+but+wants+to+be+righteous+and+holy.+Therefore+God+has+to+make+use+of+that+hammer+of+His%2C+namely%2C+the+Law%2C+to+break%2C+bruise%2C+crush%2C+and+annihilate+this+beast+with+its+false+confidence%2C+wisdom%2C+righteousness%2C+and+power%2C+so+that+it+learns+that+it+has+been+destroyed+and+damned+by+its+evil.+Then%2C+when+the+conscience+has+been+terrified+this+way+by+the+Law%2C+there+is+a+place+for+the+doctrine+of+the+Gospel+and+of+grace%2C+which+raises+it+up+again+and+comforts+it%3B+it+says+that+Christ+did+not+come+into+the+world+to+break+the+bruised+reed+or+to+quench+the+dimly+burning+wick+%28Is.+42%3A3%29+but+to+announce+the+Gospel+to+the+poor%2C+to+bind+up+the+brokenhearted%2C+and+to+proclaim+liberty+to+the+captives+%28Is.+61%3A1%29.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1-4%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+314%E2%80%93315.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F880961395d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/880961395d.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/01/luther-on-the-value-of-learning-the-greatness-of-our-sin-and-misery/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

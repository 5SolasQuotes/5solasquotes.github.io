<main class="wrap"><figure class="quote" id="q-ebe2978cc4" data-kw="">
<blockquote><p>Howbeit, as the first Adam, standing as head and representative of all his natural seed, entered into the first covenant with God, accepting the promise thereof, upon the terms and condition therein proposed, which he engaged to fulfil; so our Lord Jesus standing as second Adam, head and representative of the particular persons of lost mankind, by name elected to life, and given to him as his spiritual seed, entered into the second covenant with his Father; accepting the promises thereof, upon the terms and condition therein proposed; consenting and engaging to fulfil the same, for them. And thus the covenant of grace was made, and concluded, betwixt the Father and Christ the second Adam, from all eternity; being the second covenant, in respect of order and manifestation to the world, though it was first in being: 1 Cor. xv. 47, “The second man is the Lord from heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 412.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f34c7d8df8" data-kw="">
<blockquote><p>And as the enjoyment of God, and so everlasting happiness, was promised in the Old, as well as in the New Testament, so was it promised then too, as well as now, only in Jesus Christ; there being no other Mediator to reconcile God to us, and us to God, because none but he ever was or ever will be both God and man. And whosoever is God only and not man, or man only and not God, can never mediate betwixt God and man. For he that is God only cannot suffer for man; and he that is man only cannot make satisfaction to God: and therefore to make a person capable of suffering for man, and able to satisfy God, and so to mediate betwixt God and man, by suffering for the sins of the one, and satisfying the justice of the other; it is necessary that himself participate of both natures, which being joined together in one Person might so be reconciled to one another.

Now seeing there never was nor ever will be any such person in the world besides Christ, and seeing Christ was exactly such a person, perfect God and perfect man, it necessarily follows, that it was he, and he alone, that could be the Mediator betwixt God and man in the Old as well as in the New Testament: and so that whatsoever promises or overtures were made to the old Fathers were made only in him, without whom they could have enjoyed no mercy, nor have partaked any happiness, either in this world or that which is to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 226-27.</span></figcaption>

<blockquote><p>His sorrows and mourning upon the account of the obstinacy and unbelief of sinners, speaks the vehemency of his desire after union with them… The Redeemer’s tears wept over obstinate Jerusalem, spake the zeal and fervency of his affection to their salvation; how loth Christ is to give up sinners. What a mournful voice is that in John 5:40, “And you will not come unto me, that you might have life.” How fain [desirous] would I give you life? but you would rather die than come unto Me for it. What can Christ do more to express his willingness? All the sorrows that ever touched the heart of Christ from men, were upon this account, that they would not yield to his calls and invitations.</p></blockquote>

rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dcf053489c" data-kw="">
<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.7, pp 7-8.</span></figcaption>

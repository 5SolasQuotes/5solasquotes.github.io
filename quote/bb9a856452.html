<main class="wrap"><figure class="quote" id="q-bb9a856452" data-kw="">
<blockquote><p>There is the Christian Sabbath, where, according to the apostles’ arrangement, the first day of the week was set aside for the public assemblies of the church. … That the apostles observed the first day of the week to conduct assemblies can be concluded from Acts 20:7 and 1 Cor. 16:2, where μία σαββάτων is “the first day of the week.” This day seems more fitting than all others for sacred assemblies because for the second time Christ solemnly committed the apostolic ministry to the disciples when they had gathered together on the eighth day after His resurrection—that is, on the first day of the week (John 20). …

The primary and most important reason [for the change of the Sabbath] is because Christ rose from the dead on that day, as is seen from the Gospel accounts of Matt. 28:1 and Mark 16:1. Thus the first day of the week is called ἡμέρα κυριακή (“the Lord’s Day”) (Rev. 1:10). (1) Just as the Sabbath was instituted in the Old Testment in remembrance of the benefit of God’s six-day work of creation and His rest from it on the seventh day, so also in the New Testament the first day of the week is celebrated in remembrance of the benefit of Christ’s victorious return from the dead in glory on the first day of the week after He had accomplished the mystery of our redemption through His suffering and death.

(2) Just as in the Old Testament the Sabbath was instituted as a memorial of the liberation from Egypt (Deut. 5:15), so also in the New Testament the Lord’s Day is a memorial of our spiritual liberation from the kingdom and captivity of Satan, which was given to us through Christ’s resurrection. The Israelites’ deliverance from Egypt was a type of this.

(3) Through Christ’s death and resurrection the Levitical ceremonies and shadows of the Law have been abrogated. The Sabbath was counted among these (Col. 2:17). Therefore exchanging the Sabbath for the Lord’s Day is a public testimony that Christians have been freed from the shadows of the Law and from the distinction of days which God had sanctioned formerly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Commonplaces: On the Law of God, on the Ceremonial and Forensic Laws</cite>, trans. Richard J. Dinda, ed. Benjamin T. G. Mayes and Joshua J. Hayes (1613; St Louis MO: Concordia Publishing House, 2015), XV.4.9.3. §§ 139, 141.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8aa6b2f93f" data-kw="">
<blockquote><p>That He [Christ] did not abide in death, that the wounds which His body had received from the iron of the nails and spear offered no impediment to His rising again, that after His resurrection He showed Himself as He pleased to his disciples, that when He wished to be present with them He was in their midst without being seen, as needing no entrance through open doors, and that He strengthened the disciples by the inspiration of the Holy Ghost, and that He promised to be amongst them, and that no partition wall should intervene between them and Him, and that to the sight He ascended to Heaven while to the mind He was everywhere; all these, and whatever like facts the history of Him comprises, need no assistance from arguments to show that they are signs of deity and of a sublime and supereminent power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Catechism</cite>, (c. 385), 32 in Nicene and Post-Nicene Fathers 2, 5: 500.</span></figcaption>

</figure><figure class="quote" id="q-88a9fdc640" data-kw="">
<blockquote><p>Another thing philoophy can tell us is that if a resurrection were to occur, only God could bring it about. That, in any event, was Aquinas’s view (Cf. Summa Theologiae, Supplement, 75.3). Natural material causes can no more reunite soul and body than they could generate a soul in the first place. Nor could even an angelic intellect reunite a soul and its body, since angels can only manipulate natural causes, even if they can do so more powerfully than we can (Cf. Summa Theologiae I.65.3-4 and I.105.1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), pt. 4, ch. 11, p. 520</span></figcaption>

<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>

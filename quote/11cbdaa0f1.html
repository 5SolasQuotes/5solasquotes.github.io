<main class="wrap"><figure class="quote" id="q-11cbdaa0f1" data-kw="">
<blockquote><p>Because of his faithfulness in the covenant of grace. The clearest and surest view of our salvation, is to be had in this covenant. Therein we see, 1. The elect are given by the Father to the Son, to be redeemed by him, and that he may give them eternal life; as John xvii. 2. thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him. This charge the Son accepted from eternity, and, in the fulness of time, came into the world to fulfil, John vi. 38, 39. They were given to him, on condition of his coming, and redeeming of them by his blood; which condition he fulfilled.

2. They are promised to him as his purchase by the Father, When the Son hath bought them as he promised: Isaiah liii. 10, 11. When thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand. He shall see of the travail of his soul, and shall be satisfied,&amp;c.

3. The bringing, them safe to glory, is charged the Son, and promised by him again to the Father: John vi. 38, 39. For I came down from heaven, not to do mine own will, but the will of him that sent me. And this is the Father’s will which hath sent me, that of all which he hath given me, I should lose nothing, but should raise it up again at the last day. John xii. 50. And I know that his commandment is life everlasting. Christ stands engaged by this covenant, to give a good account of all his charge; and he will do it fully one day, when he presents his people to his Father; and will say of all, as Heb. ii. 13. Behold, I and the children which God hath given me; and as he said of a few of them in this chapter, ver. 12. While I was with them in the world, I kept them in thy name; those that thou gavest me, I have kept, and none of them is lost.And surely Christ is as good at keeping of his people when he is in heaven, as when he was on earth: for he is with them always, even unto the end of the world, Amen, Matth. xxviii. 20.

4. Christ yet further promiseth eternal life to his people: 1 John ii. 25. And this is the promise that he hath promised us, even eternal life: as it is the grand comprehensive promise. Yea, Christ himself is called eternal life, 1 John i. 2. and ver. 20. When Christ came into the world, eternal life came into it: when Christ is shown and revealed, eternal life is made known; when Christ is embraced by faith, eternal life is got: 1 John v. 11, 12. And this is the record, that God hath given to us eternal life: and this life is in his Son. He that hath the Son, hath life.O that all men did but know, how closely, how inseparably, and how eternally, Christ and eternal life are linked together No eternal life without Christ; no Christ without eternal life.

He also promiseth it, as well as contains it: John x. 27, 28. My sheep hear my voice, and I knew them, and they follow me. And I give unto them eternal life, and they shall never perish, neither shall any man pluck them out of my hand. It is this, and such like promises of eternal life, made by Jesus Christ, that every true believer builds his hope of heaven upon. And thus Christ’s faithfulness and truth is concerned in bringing all his people to glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sixteen Sermons on the Lord’s Prayer, in John xvii. 24</cite>, (1705) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 2: 87-89.</span></figcaption>

<blockquote><p>There is mercy enough in God for the pardoning of your sins be they never so great: God’s nature is of infinite and unlimited perfection; there is an infinite ocean of Grace in the heart of God: it is not possible for man to commit such sins that God should not be able to pardon them: God is of such mercy, that he can do any thing that is an act of mercy: as there is nothing too hard for the power of God, so there is nothing too hard for the mercy of God: and certainly sinners have little reason to object that God can’t find in his heart to pardon them, when he has found in his heart to provide a sufficient sacrifice for them, when he has found in his heart to offer them pardon, when he has found in his heart to pardon others as great sinners as they.</p></blockquote>

<blockquote><p>Secondly, another excellent disposition in Christ is his love, not only his philanthropy, or good will He bears to all men, and the desire He has of their salvation, Eze. 33:11, but his αγαπη, his special love, from αγαν valde et παυομας acquiesco, such an ardent affection has the heart of Christ for a person adhering to Him, that it greatly acquiesces in, and is fully contented with him, Eph. 2:4. Such is the sweetness of Christ’s nature, that it is full of love; ‘God is love,’ 1 Jn. 4:16. And as the Father has loved Me, so have I loved you, Jn. 15:9. Now this love of Christ to his people, is: First, a supreme love, the chiefest love. He has a love of benevolence to all, Mk. 10:21, ‘He beheld the young man and loved him;’ but the love He bears his own, is transcedent and exceeds the love of men and angels, Jn. 15:13.</p></blockquote>

<blockquote><p>The promise of eternal life according to the legal covenant [pactum legale], or the covenant of works [foedus operum], is so truly conditional that it depends upon the perfect and rigid observance of the Law; and our Saviour Christ wisely sent the one who supposed that he could merit eternal life by his good deeds back to that covenant.

But the promise of eternal life ac­cording to the evangelical covenant [pactum evangelicum] and covenant of grace [foedus gratiae] depends upon the condition of faith; and all those who, feeling their infirmity and sickness, acknowledge themselves unequal to the keeping of the divine law or meriting their salvation are directed to this covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praelectiones de Duobus in Theologia Controversis Capitibus: de Judice Controversiarum, Primo; de Justitia Habituali et actuali, Altero</cite>, (Cambridge: Printing Shop of the Most-Celebrated Academy, 1631), p. 407. Quoted in Michael J. Lynch, John Davenant’s Hypothetical Universalism: A Defense of Catholic and Reformed Orthodoxy (New York: Oxford University Press, 2021), p. 134.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The promise of eternal life according to the legal covenant [pactum legale], or the covenant of works [foedus operum], is so truly conditional that it depends upon the perfect and rigid observance of the Law; and our Saviour Christ wisely sent the one who supposed that he could merit eternal life by his good deeds back to that covenant.

But the promise of eternal life ac­cording to the evangelical covenant [pactum evangelicum] and covenant of grace [foedus gratiae] depends upon the condition of faith; and all those who, feeling their infirmity and sickness, acknowledge themselves unequal to the keeping of the divine law or meriting their salvation are directed to this covenant.”

— John Davenant, Praelectiones de Duobus in Theologia Controversis Capitibus: de Judice Controversiarum, Primo; de Justitia Habituali et actuali, Altero, (Cambridge: Printing Shop of the Most-Celebrated Academy, 1631), p. 407. Quoted in Michael J. Lynch, John Davenant’s Hypothetical Universalism: A Defense of Catholic and Reformed Orthodoxy (New York: Oxford University Press, 2021), p. 134.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+promise+of+eternal+life+according+to+the+legal+covenant+%5Bpactum+legale%5D%2C+or+the+covenant+of+works+%5Bfoedus+operum%5D%2C+is+so+truly+conditional+that+it+depends+upon+the+perfect+and+rigid+observance+of+the+Law%3B+and+our+Saviour+Christ+wisely+sent+the+one+who+supposed+that+he+could+merit+eternal+life+by+his+good+deeds+back+to+that+covenant.%0A%0ABut+the+promise+of+eternal+life+ac%C2%ADcording+to+the+evangelical+covenant+%5Bpactum+evangelicum%5D+and+covenant+of+grace+%5Bfoedus+gratiae%5D+depends+upon+the+condition+of+faith%3B+and+all+those+who%2C+feeling+their+infirmity+and+sickness%2C+acknowledge+themselves+unequal+to+the+keeping+of+the+divine+law+or+meriting+their+salvation+are+directed+to+this+covenant.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Praelectiones+de+Duobus+in+Theologia+Controversis+Capitibus%3A+de+Judice+Controversiarum%2C+Primo%3B+de+Justitia+Habituali+et+actuali%2C+Altero%2C+%28Cambridge%3A+Printing+Shop+of+the+Most-Celebrated+Academy%2C+1631%29%2C+p.+407.+Quoted+in+Michael+J.+Lynch%2C+John+Davenant%E2%80%99s+Hypothetical+Universalism%3A+A+Defense+of+Catholic+and+Reformed+Orthodoxy+%28New+York%3A+Oxford+University+Press%2C+2021%29%2C+p.+134.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69d18d838f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69d18d838f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/06/02/john-davenant-on-the-promise-of-eternal-life-in-the-two-covenants/" rel="noop

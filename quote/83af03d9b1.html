<blockquote><p>V. That what God forbids, is at no time to be done; what He commands, is always our duty, and yet every particular duty is not to be done at all times. Thus sin is, under no pretense, to be committed. Accordingly, Moses, when he was in a prosperous condition in Pharaoh’s court, though he might have pretended that his greatness and the advantages which Israel might have expected from it, would be an excuse for his continuing to enjoy the pleasures of sin there; yet he was sensible that these considerations would not exempt him from guilt. Hence, ‘he forsook Egypt, and chose rather to suffer affliction with the people of God, than to enjoy the pleasures of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, … (New York: Robert Carter, 1855), vol. 2, p. 313</span></figcaption>

<blockquote><p>…yet in formal terms, they [the congregationalists] do deny the most gracious of their brethren to live beside them in New-England in the presbyterial way of the old non-conformists: yea, in print they avow that whoever refuses their tenet of Independency, were they otherwise never so orthodox and pious, they ought not to be admitted to the sacraments, nor enjoy any church privileges: as people who cannot be wholly, but at most are in part only converted: Yea, as such who must be taken for antichristian spirits, for enemies to Christ and his kingdom: Neither have I heard that any of them now for many years have either celebrated to others or received themselves the sacraments in any English church.</p></blockquote>

</figure><figure class="quote" id="q-9ba6d64e02" data-kw="">
<blockquote><p>3. That God required not moral preparation in them for eating the Passover as he does in us before we eat the Lord’s Supper [as the congregationalists claimed], I conceive to be an untruth. 1. Because not to profane the holy things of God, and not to take God’s Law in their mouth and to hate to be reformed, Ps. 50:16, not to sacrifice with bloody hands, Isa. 1:11-12, etc. Ps. 50:8-10; Isa. 66:1, was moral, and did bind and oblige the Jews as they do us, and 2 Chron. 30:6, the posts are sent to gather the people to the Passover, charging them to turn to the Lord God of their fathers, not to be like their fathers; and it is clear by Hezekiah’s prayer, verses 18-19, ‘Good Lord pardon him that prepares his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary,’ verse 20, ‘And the Lord hearkened, and healed the people.’ Therefore, there was required a preparation of the heart for the right eating of the Passover, besides the typical and ceremonial preparation. Yea God counted the ceremonial preparation void of the moral preparation but abomination, as Isa. 66:1; Isa. 58:3-6 and Josiah’s Passover is commended from this, 2 Kings 23:22 (as Junius well observes) that none did with such care and zeal, as Josiah did prepare the priests, the people and himself for the passover, in removing all idolatry and abomination, and in renewing their covenant and resolution, verse 3, ‘to walk after the Lord and to keep his commandments with all their heart and with all their soul.’ 4. The unclean and uncircumcised in heart were no more members of the true and invisible Church of the Jews, and of Christ’s mystical body, his spouse, his royal generation, than Sodom and Gomorrah, Isa. 1:10, than the Ethiopians, Amos 9:7, than Ammon and Moah, Jer. 9:25-26, as in the New Testament, and the true invisible Church amongst them, as amongst us were kings and priests unto God, Ex. 19:5,9; Ps. 149:1, as we are, 1 Pet. 2:9-10; Rev. 1:5. 5. Amongst them no man could invade the priest’s office, or run unsent, no more than under the New Testament, Heb. 5:4; 1 Tim. 4:22, though they were to rebuke one another, Lev. 19, and they had sacrifices for sins of ignorance, Lev. 4:27… And a third step was excommunication and casting out of the synagogue after the captivity, which are the very degrees of our Church censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 2, pp. 190-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>Sitting we think not so necessary as that there could not be a sacrament without it, but to the due ministration of the sacrament we think a table-gesture necessary. … When as we only ground upon Christ and his apostles sitting, and other rites, the necessity of a table-gesture, not to the essence of a sacrament, but to the due ministration of that action… Sitting we think ought not to be changed, no not into standing, without some weighty consideration of some urgent occasion, because it was the gesture of Christ, his apostles, and the apostolical kirks; it is the ordinary gesture of guests at feasts, and resembles best the familiar access of the soul to the spiritual table.</p></blockquote>

— David Calderwood, A Defence of our Arguments Against Kneeling in the Act of Receiving the Sacramental Elements of Bread &amp; Wine Impugned by Mr. Michelsone (Amsterdam, 1620), ‘Answer to his Ten Arguments for Kneeling’, pp. 72 &amp; 74-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSitting+we+think+not+so+necessary+as+that+there+could+not+be+a+sacrament+without+it%2C+but+to+the+due+ministration+of+the+sacrament+we+think+a+table-gesture+necessary.+%E2%80%A6+When+as+we+only+ground+upon+Christ+and+his+apostles+sitting%2C+and+other+rites%2C+the+necessity+of+a+table-gesture%2C+not+to+the+essence+of+a+sacrament%2C+but+to+the+due+ministration+of+that+action%E2%80%A6+Sitting+we+think+ought+not+to+be+changed%2C+no+not+into+standing%2C+without+some+weighty+consideration+of+some+urgent+occasion%2C+because+it+was+the+gesture+of+Christ%2C+his+apostles%2C+and+the+apostolical+kirks%3B+it+is+the+ordinary+gesture+of+guests+at+feasts%2C+and+resembles+best+the+familiar+access+of+the+soul+to+the+spiritual+table.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Defence+of+our+Arguments+Against+Kneeling+in+the+Act+of+Receiving+the+Sacramental+Elements+of+Bread+%26+Wine+Impugned+by+Mr.+Michelsone+%28Amsterdam%2C+1620%29%2C+%E2%80%98Answer+to+his+Ten+Arguments+for+Kneeling%E2%80%99%2C+pp.+72+%26+74-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29617bef5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29617bef5e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/sitting-at-the-table#:~:text=Sitting%20we%20think%20not%20so%20necessary,the%20soul%20to%20the%20spiritual%20table&amp;text=Sitting%20we%20think%20not%20so%20necessary%20as%20that&amp;text=access%20of%20the%20soul%20to%20the%20spiritual%20table" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

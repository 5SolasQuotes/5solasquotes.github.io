<main class="wrap"><figure class="quote" id="q-bca1995867" data-kw="">
<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 80</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, pp. 70–71</span></figcaption>

<blockquote><p>It is not great faith, but true faith, that saves; and the salvation lies not in the faith, but in the Christ in whom faith trusts. Faith as a grain of mustard seed will bring salvation. It is not the measure of faith, but the sincerity of faith, which is the point to be considered.</p></blockquote>

</figure><figure class="quote" id="q-506762ccac" data-kw="">
<blockquote><p>As the godly consideration of predestination and our election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly members, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God: so, for curious and carnal persons, lacking the Spirit of Christ, to have continually before their eyes the sentence of God’s predestination is a most dangerous downfall, whereby the devil doth thrust them either into desperation, or into wretchlessness [recklessness] of most unclean living, no less perilous than desperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 17</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9195acda16" data-kw="">
<blockquote><p>The power of Baptism has place in the elect alone. They only are baptized, not with water merely but with the Spirit also. Though all these things (enumerated previously) are affirmed of Baptism, and are truly attributed to it as the organ of the Holy Spirit, and all who are baptized are truly said to become and be such sacramentally; yet we believe that these things are fulfilled in fact, only in the elect. All are baptized with water, but the elect only, with the Spirit; all receive the sign, but the elect only are made partakers of the thing signified and offered through Baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 8, Of the Christian Religion, Ch. 15, ‘Of Baptism’, col. 516, section II as translated in Krauth, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-726425ec64" data-kw="">
<blockquote><p>The promise, accepted by the parents in faith, also includes their children to a thousand generations… If it is objected that not all of them who are born of believing parents are elect, seeing that God did not choose all the children of Abraham and Issac, we do not lack an answer. Though we do not deny that this is the case, still we say that this hidden judgment must be left to God and that normally, by virtue of the promise, all who have been born of believing parents, or if one of the parents believe, are sanctified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Faith</cite>, 4.48 as quoted in ‘The Doctrine of the Covenant in Reformed Theology’, p. 263 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980) Kraut, p. 26-27 has another translation of this passage, though gives the reference as De Spirit. Sac., IV, 29, which we are not able to find.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“The promise, accepted by the parents in faith, also includes their children to a thousand generations… If it is objected that not all of them who are born of believing parents are elect, seeing that God did not choose all the children of Abraham and Issac, we do not lack an answer. Though we do not deny that this is the case, still we say that this hidden judgment must be left to God and that normally, by virtue of the promise, all who have been born of believing parents, or if one of the parents believe, are sanctified.”

0are%20sanctified" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0881f92ab7" data-kw="">
<blockquote><p>Are all that are baptized, undoubtedly regenerated? No. Acts 8:13,23. … By what reasons are they [Romanists &amp; Lutherans] confuted? … (3) Because, infants that are predestinated unto life, though they die in their mother’s belly, yet they cannot perish (Mt. 18:14). (4) Because, some children before their Baptism, have been beloved of God, whose love is unchangeable (Rom. 9:11,13). Others have been regenerated by the Holy Ghost (Lk. 1:15): and some have also been comprehended within the Covenant of Grace (Acts 2:39). (5) Because, that Baptism, without faith, and the inward operation of the holy Spirit, hath no efficacy to Salvation (Mk. 16:16; 1 Pet. 3:21). … (7) Because, very many that are baptized within the visible Church, are damned (Mt. 7:13-14). … (9) Because, not all that are baptized are elected (Mt. 20:16)… (10) Because, the Holy Ghost, is a most Free Agent, and Worker: and therefore his operation (whence the efficacy of Baptism depends) whereby we are regenerated, is not tied to any one moment of time (Jn. 3:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error</cite>, Question 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

 · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c603154c54" data-kw="">
<blockquote><p>Are all these benefits received by baptism, equally by all those which receive the same? No, for they are not alike: for the ingrafting into Christ, and the benefits which follow it, are not bestowed upon the reprobate, although they be offered them when they are baptised. For God calleth and justifieth, regenerateth, and glorifieth effectually them whom He hath elected and predestinated to these things, Rom. 8:3, but the elect, as well infants, as they of years are equally incorporated into Christ, either in, or before baptism, and are endowed with the imputation of his righteousness, forgiveness of sins, and the right of eternal life, for they are all alike the sons of God, but regeneration is not wrought alike in all, nor are the gifts of the spirit, faith, hope, and charity, given alike unto all, or received alike of all, but according to the pleasure of God, as the parable of the talents teaches, and Eph. 4:7. To everyone is given grace according to the measure of the gifts of Christ: and we do see that the effects of regeneration are more and greater in some, and in other some fewer and lesser.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion</cite>, trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’, p. 735</span></figcaption>

</figure><figure class="quote" id="q-43e9e219f9" data-kw="">
<blockquote><p>As for the cause of death and damnation willed by God, we maintain that God wills not the death of any man, or the condemnation of any man, but for sin. But I pray what think you of infants perishing in original sin?… Or had you rather shake hands with Arminius in this also, and profess that no man is damned for original sin only; but that all the children of Turks and Sarazens, and Jews and canibals that die in their infancy are saved and enjoy the joys of Heaven, as well as the children of the faithful?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity</cite>, … (London: Thorp, 1631), sect. 2, ch. 15, pp. 549-50</span></figcaption>

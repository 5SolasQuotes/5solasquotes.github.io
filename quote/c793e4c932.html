<main class="wrap"><figure class="quote" id="q-c793e4c932" data-kw="">
<blockquote><p>§V. This Son was made man. The divine person assumed a human nature, lacking its own personality (persona), not a divine nature assuming a human nature or person, nor a person assuming a person. Therefore, Christ remains only one person, a divine one (1 Tim. 3:16). … §VII. This union is not a conjunction of parts, like soul and body, but an assumption of the human nature into unity with the person without change, confusion, division, or separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<blockquote><p>The person of Christ, is one, because Christ is one… There are two natures in the person of Christ, the divine, and the humane nature. Therefore Jesus Christ is true God, and true man in one person. Rom. 1:3-4; and 9:5; 1 John 4:2; 1 Tim. 3:16; Col. 2:9; Heb. 2:14,16; John 1:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, … (London, 1595), ‘…Now Concerning the Gospel’, p. 64</span></figcaption>

</figure><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems</cite>, … (Utrecht, 1643) n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-0985b8d1c9" data-kw="">
<blockquote><p>As God raised Christ from the dead and set him at his own right hand in heavenly places; so you, that were dead in sins, hath he quickened and raised you up together in him. This analogy is the very thing he would have them understand. They had undergone a great change; they had been brought to life; they had been raised from the dead by the same almighty power which wrought in Christ. There was as great a difference between their present and their former condition, as between Christ in the tomb and Christ at the right hand of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, on 1:19–20</span></figcaption>

</figure><figure class="quote" id="q-d4c4f08593" data-kw="">
<blockquote><p>Durand [d. 1296] distinguisheth of a twofold composition: Hujus ex his [of this out of that], &amp; hujus ad hoc [of this to that] (bk. 3, Distinction 7, question 3 [this distinction is from Aristotle]). … ‘There is’ (says he) ‘a second kind of composition, and that is hujus ad hoc, and it is not so properly a composition of a third thing out of the things united, as an adjoining of one of the things united unto the other. And thus the person of the Word after the incarnation may be said to be compounded. For hereby, the human nature is added unto the person of the Word and unto the divine nature in the unity of the same person.’ But now, he also subdivides this composition, which he terms hujus ad hoc. ‘For it is either by inherence of one thing in another, and such is the composition of an accident with its subject: or else by way of a supposital dependance of one thing upon, and relation unto another: so that the one should substantially inexist in the other, and the other should terminate the respect and dependance of the former, which inexists, and after this latter manner the person of the Word is after the incarnation compounded. Because, whereas before, it subsisted only in the divine nature, after the incarnation, it by it’s subsistence terminated the dependance of the human nature.’ Thus he. … A second objection is taken from the completeness of the Word. That which comes unto a thing already complete and perfect, comes thereunto only accidentally, and makes therewith only an aggregation, and not a substantial union. But now the person of the Word, from all eternity, was most perfect, and complete. And therefore the adding or coming of the manhood unto it, is not substantial, but accidental. For answer: The major is true only, when one thing is so added, and comes unto another, as that it pertains not to the same subsistence. And thus a man’s garment is added unto him, and therefore united with him only accidentally; so that homo vestitus is ens unum tantum per accidens. But now the manhood is so added, and comes unto the Word, that it is drawn, or assumed into a communion of subsistence with the word, and it’s divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates</cite>, … (Oxford, 1656), ‘There dwelleth in Christ all fullness’, pp. 146 &amp; 149-50 Jeanes was an English presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

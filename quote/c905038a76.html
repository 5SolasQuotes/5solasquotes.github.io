<blockquote><p>72. Fifthly, they [the Church and magistrate] are distinguished by the effect. The effect of civil power is either proper or by way of redundance; The proper effect is the safety-temporal of the commonwealth, external tranquility, the fruition of civil liberty, and of all things which are necessary to the civil society of men: The effect by way of redundance is the good of the Church, to wit, insofar as by execution of justice and good laws, some impediments that usually hinder and disturb the course of the Gospel, are avoided or taken away.

73. For by how much the more faithfully the Magistrate executes his office in punishing the wicked, and cherishing and encouraging good men, taking away those things which withstand the Gospel, and punishing or driving away the troublers and subverters of the Church; so much the more the orthodox faith and godliness are reverenced and had in estimation, sins are hated and feared: Finally, all the subjects contained (as much as concerns the outward man) within the lists of God’s Law; whence also by consequence it happens by God’s blessing, that the Church is defiled with fewer scandals and does obtain the more freedom and peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (1647), #72-73</span></figcaption>

<blockquote><p>About the middle of August [1665] I set myself to write a short exhortation to those who were shut up because of the plague, and just when I had finished it, heard the melancholy news of my father’s death, on the 16th; upon which I wrote a letter to comfort my mother, wherewith I much comforted myself; and on the 24th sent abroad my little exhortation to those who were shut up, beseeching God that it might do good to all. And on the 30th I thought of writing a little treatise of comfort in this sad time, which I finished and sent to my bookseller September the first, praying the blessing of Heaven might attend upon these my little labors for the good of souls.” – Autobiography Grosvenor, Benjamin – Preparation for Death, the Best Preservative Against the Plague, being the substance of 2 Sermons (London, 1721) Grosvenor (1676–1758) was originally an English, primitive baptist, but was excommunicated when he became a presbyterian. He then served as a dissenting presbyterian minister and was a ‘moderate Calvinist’. From 1720-22 there were plagues in France (the Great Plague of Marseille) and in New England. England prepared for it, but apparently never got it. Barnard, John – ‘2nd Sermon, The Fatal Consequence of a People’s Persisting in Sin: Preached… on a Public Fast in the Time of the Measles, Jan, 14, 1713/14’ in Two Sermons: The Christian’s Behavior under Severe and Repeated Bereavements, and The Fatal Consequence of a Peoples Persisting in Sin (Boston, 1714) Clarke, Samuel – Sermons 7-9 in XVII sermons on several occasions… (London, 1724) on Isa. 26:9; Lk. 13:2-3 &amp; Mt. 24:7 Clarke (1675-1729) was a latitudinarian, Anglican clergyman and English philosopher. He is considered the major British figure in philosophy between John Locke and George Berkeley. Emerson, Joseph – ‘A Word to those that are Afflicted very much; Mr. Emerson’s sermon on the mortal sickness at Malden; Essay to preserve the memory, and improve the affliction, of the late mortal sickness at Malden; a sermon preached at the lecture in Malden, October 20th 1738, on occasion of the repeated and multiplied deaths of children in many families in said town, by the throat distemper’ (Boston, 1738) . American Presbyterians Davies, Samuel – ‘This Very Year You Are Going to Die!’ (1761) A sermon on Jer. 28:16, “This year thou shalt die.</p></blockquote>

<blockquote><p>Then the true state of the question is not [1.] whether the sword be a means of conversion of men to the true faith [which its not], nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [they’re not], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers [its not], nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty [it can’t]. But whether or not ought the godly and Christian prince [to] restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>

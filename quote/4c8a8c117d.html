<blockquote><p>XXII… Fourth, it is asked whether good works are prerequisite for justification. … (5) Indeed, there are not lacking among recent theologians those who teach a justification of the justified that happens with works going before it, whereby the one justified justifies himself from hypocrisy, which depends upon an inherent holiness, albeit imperfect, yet sincere. … (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed…</p></blockquote>

<blockquote><p>to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.</p></blockquote>

<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works. 3. The power of nature without illumination and grace. 4. The power of the Law. 5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

C+%E2%80%98but+he+who+has+not+been+baptized+shall+be+condemned%2C%E2%80%99+but+only%2C+%E2%80%98he+who+has+not+believed%2C%E2%80%99+clearly+indicating+that+faith+alone+sometimes+suffices+for+salvation%2C+and+that+without+it+nothing+suffices.%5D+Sometimes+by+these+phrases+of+speech+they+exclude%3A+%5B1%5D+All+that+may+be+without+supernatural+knowledge%2C+all+that+may+be+without+a+true+profession.+%5B2%5D+Sometimes+the+necessity+of+good+works+in+act+or+external+good+works.+3.+The+power+of+nature+without+illumination+and+grace.+4.+The+power+of+the+Law.+5.+The+sufficiency+of+anything+found+in+us+to+make+us+stand+in+judgment%2C+to+abide+the+trial%2C+and+not+to+fear+condemnation.+And+in+this+sense+faith+only+is+said+to+justify%2C+that+is%2C+the+only+mercy+of+God+and+merit+of+Christ+apprehended+by+faith%3A+and+then+the+meaning+of+their+speech+is+that+only+the+persuasion+and+assured+trust+that+they+have%2C+to+be+accepted+of+God+for+Christ%E2%80%99s+sake%2C+is+that+that+makes+them+stand+in+judgment%2C+without+fear+of+condemnation.+And+in+this+sense+all+the+divines+formerly+alleged+for+proof+of+the+insufficiency+of+all+our+inherent+righteousness%2C+and+the+trust+which+we+should+have+in+the+only+mercy+of+God%2C+and+merit+of+Christ%2C+do+teach+as+we+do%2C+that+faith+only+justifies.+For+neither+they+nor+we+exclude+from+the+work+of+justification%2C+%5B1%5D+the+action+of+God+as+the+supreme+and+highest+cause+of+our+justification%3A+for+it+is+He+that+remits+sin%2C+and+receives+us+to+grace%3A+%5B2%5D+nor+the+merit+of+Christ%2C+as+that+for+which+God+inclines+to+show+mercy+to+us%2C+and+to+respect+us%3A+%5B3%5D+nor+the+remission+of+sins%2C+gracious+acceptation%2C+and+grant+of+the+gift+of+righteousness%2C+as+that+by+which+we+are+formally+justified%3A+%5B4%5D+nor+those+works+of+preventing+grace%2C+whereby+out+of+the+general+apprehension+of+faith%2C+God+works+in+us+dislike+of+our+former+condition%2C+desire+to+be+reconciled+to+God%2C+to+have+remission+of+that+%5Bwhich%5D+is+past%2C+and+grace+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Works are considered: 1. In their own dignity and merit: 2. In the acceptation of God’s goodness, or as they are done by a Christian, pleasing to God, pardoned and beloved in Christ. And in this wise God accepts them as righteous, and imputes them to man for righteousness, etc.</p></blockquote>

<blockquote><p>…a man may be said to be justified either intentionally, or virtually, or actually; either in God, or in Christ, or in himself. 1. Intentionally in God in God’s purpose and decree: This is from all eternity, but this decree and intention does not put anything into a state of actual being, but in the fulness of time. 2. Virtually in Christ: And this is from the day of Christ’s passion, and in the virtue of his satisfaction; yet this intends no more but that satisfaction is made and remission purchased by the blood of Christ. 3. Actually in himself: When a man has the possession of justification, immediately after his union with the Lord Jesus Christ. Now this justification considered as it is a state of favor, a covenant state with God, which a man at his first believing is put into, is not reiterated, no more than a wife, after that first entrance into the relation, is frequently made a wife; yet the particular acts of pardon, and imputation of Christ’s righteousness, are continually by God communicated unto the believer. In this respect this actual justification (or particular acts of pardon) has its degrees of progression: The beginning thereof is laid in our first union and incorporation into Christ; the consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission: Between both these, there is a progressive work of justification, by the constant actings of the Spirit, applying the blood of Christ by the hand of faith, to the quiet and comfort of the soul: The first we may term initial justification, the second progressive, the last perfective; the second is the fruit of the first, and the preludial assurance of the last: The first is wrought and sealed in the first sacrament, the second is wrought and sealed in the second sacrament; and both these branches of sacramental justification, are to us the pre-assurance of that complemental and perfective justification, the sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession. It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>

e+second+progressive%2C+the+last+perfective%3B+the+second+is+the+fruit+of+the+first%2C+and+the+preludial+assurance+of+the+last%3A+The+first+is+wrought+and+sealed+in+the+first+sacrament%2C+the+second+is+wrought+and+sealed+in+the+second+sacrament%3B+and+both+these+branches+of+sacramental+justification%2C+are+to+us+the+pre-assurance+of+that+complemental+and+perfective+justification%2C+the+sentence+whereof+puts+an+end+to+all+fears%2C+changing+our+faith+and+hope+into+fruition+and+full+possession.+It+has+been+commonly+said+by+some+of+our+best+divines+that+justification+is+transacted+in+our+first+union+and+incorporation+into+Christ%3B+at+which+time+it+is+conceived+that+the+pardon+of+all+sin+is+sealed+to+the+believer+at+once.+But+I+fear+the+misunderstanding+of+this+point+%28not+untrue+in+itself%2C+if+not+mistaken+and+misapprehended%29+has+laid+the+ground+upon+which+some+build+that+unhappy+structure+which+turns+the+grace+of+God+into+wantonness%3A+who+knows+not+that+justification+in+the+proper+acceptation+of+the+word%2C+according+to+the+Scripture+phrase%2C+is+the+act+of+a+judge+pronouncing+a+judicial+sentence%2C+wherein+he+absolves+the+person+of+the+sinner+from+all+sin+and+punishment+due+to+him+for+sin%2C+and+that+for+the+alone+righteousness+of+the+surety+Christ+freely+imputed%2C+and+by+faith+received+of+him.+And+according+to+this%2C+I+suppose+we+shall+not+err+from+the+truth%2C+if+we+say%3A+1.+That+the+main+work+of+justification%2C+is+even+as+yet+to+us+future%2C+viz.+at+the+great+and+last+day+of+Judgment%2C+when+we+shall+receive+a+final+quietus+est%2C+and+discharge%2C+and+when+God+shall+wipe+away+all+tears+from+our+eyes%3A+And+yet+2.+That+in+our+first+union+with+Christ+there+is+a+work+of+justification%2C+viz.+actual+imputation+of+Christ%E2%80%99s+righteousness%2C+and+actual+remission+of+what+sin+for+the+present+the+soul+stands+guilty+of%2C+at+that+time+when+it+is+first+united+to+Christ.+I+dare+not+say+that+justification%2C+quatenus+%5Bso+far+as%5D+it+comprehends+imputation+and+remission+of+sin%2C+is+one+individual+act%3B+or+that+all+sins%2C+past%2C+present+and+to+come+are+remitted+to+the+believer+at+once%3B+but+this+I+say%2C+that+in+our+first+union%2C+all+our+sins+past+and+present+are+actually+pardoned%3B+and+this+favor+received+is+a+pledge+of+assurance+that+in+future+also%2C+by+applying+ourselves+to+Christ%2C+we+may+and+shall+receive+the+forgiveness+of+our+daily+sins%2C+and+that+at+the+Last+Day+we+shall+at+once+be+absolved+from+all+accusations+and+charges+laid+in+against+us%3B+and+that+justification+%28besides+those+particular+acts+of+pardon%2C+and+imputation+of+Christ%E2%80%99s+righteousness%29+does+connote+a+state+that+the+subject+at+his+first+believing+is+put+into%2C+viz.+a+state+of+grace%2C+and+favor%2C+and+reconciliation+with+God+for+the+imputed+righteousness+of+Christ%2C+without+apostasy+from+it%2C+either+total+or+final.%E2%80%9D%0A%0A%E2%80%94+Isaac+Ambrose%2C+Media%3A+the+Middle+Things%E2%80%A6+%28London%3A+Field%2C+1649%29%2C+ch.+1%2C+2.+%E2%80%98First+Privilege%3A+Justification%E2%80%99%2C+pp.+2-3+Bedford+and+Ambrose+were+sharing+some+notes+one+way+or+the+other.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ccdcde87d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ccdcde87d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=a%20man%20may%20be%20said%20to,from%20it%2C%20either%20total%20or%20final&amp;text=a%20man%20may%20be%20said%20to%20be%20justified&amp;text=without%20apostasy%20from%20it%2C%20either%20total%20or%20final" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

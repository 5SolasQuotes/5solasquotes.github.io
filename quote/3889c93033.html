</figure><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</span></figcaption>

<blockquote><p>…the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.</p></blockquote>

</figure><figure class="quote" id="q-813dbd0f21" data-kw="">
<blockquote><p>But why is faith the means of justification? Simply because it is the action of union with Jesus Christ. Faith is our coming to Him, our trusting Him, our resting in Him. The moment we are united to Him, we are immediately endowed with all that He has secured for us. We are immediately justified before we have done a single good deed, because we are His and He is God’s. Just as a very poor woman is a very poor woman until the very moment that she marries a wealthy man. But at the moment that she becomes his wife, she becomes a wealthy woman. It is by means of her acceptance that she becomes a wealthy woman, but her acceptance does not make her a wealthy woman; it is her husband’s wealth that makes her so. So faith does not justify; Christ justifies. But faith is the act of union with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

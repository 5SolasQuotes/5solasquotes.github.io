<main class="wrap"><figure class="quote" id="q-dd56fd57a0" data-kw="">
<blockquote><p>No matter what works God does through His saints in this life, He has not promised that He will also do the same things through their bodies and bones after death.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“No matter what works God does through His saints in this life, He has not promised that He will also do the same things through their bodies and bones after death.”

— Martin Chemnitz, Examination of the Council of Trent, Part IV, First Topic (Relics of the Saints), Sec. II">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNo%20matter%20what%20works%20God%20does%20through%20His%20saints%20in%20this%20life%2C%20He%20has%20not%20promised%20that%20He%20will%20also%20do%20the%20same%20things%20through%20their%20bodies%20and%20bones%20after%20death.%E2%80%9D%0A%0A%E2%80%94%20Martin%20Chemnitz%2C%20Examination%20of%20the%20Council%20of%20Trent%2C%20Part%20IV%2C%20First%20Topic%20%28Relics%20of%20the%20Saints%29%2C%20Sec.%20II&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd56fd57a0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd56fd57a0.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-063a9a14a7" data-kw="">
<blockquote><p>The old father Epiphanius saith:--&quot;It is a horrible wickedness, and a sin not to be suffered, for any man to set up any picture in the Church of the Christians, yea, though it were the picture of Christ Himself.&quot; Yet, these men store all their temples, and each corner of them, with painted and carved images, as though without them religion were nothing worth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/images.html">Images</a></span></div>

— John Jewel, An Apology of the Church of England, Part 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20old%20father%20Epiphanius%20saith%3A--%22It%20is%20a%20horrible%20wickedness%2C%20and%20a%20sin%20not%20to%20be%20suffered%2C%20for%20any%20man%20to%20set%20up%20any%20picture%20in%20the%20Church%20of%20the%20Christians%2C%20yea%2C%20though%20it%20were%20the%20picture%20of%20Christ%20Himself.%22%20Yet%2C%20these%20men%20store%20all%20their%20temples%2C%20and%20each%20corner%20of%20them%2C%20with%20painted%20and%20carved%20images%2C%20as%20though%20without%20them%20religion%20were%20nothing%20worth.%E2%80%9D%0A%0A%E2%80%94%20John%20Jewel%2C%20An%20Apology%20of%20the%20Church%20of%20England%2C%20Part%205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F063a9a14a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/063a9a14a7.html">Permalink</a><a class="src" href="https://anglicanhistory.org/jewel/apology/" rel="noopener" target="_blank">Read it online · Project Canterbury</a></div>
</figure><figure class="quote" id="q-9568da3cfe" data-kw="Queen of Heaven Idolatry Paganism">
<blockquote><p>If &quot;the Queen of the heavens&quot; be adopted, then I am inclined to think that the moon is intended: and we know how much superstition has ever prevailed among most people as to the worship of the moon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on Jeremiah</cite>, Jer. 7:18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-is-not-the-queen-of-heaven.html">Mary is not the queen of heaven</a></span></div>
<div class="actions"><button class="copy" data-copy="“If &quot;the Queen of the heavens&quot; be adopted, then I am inclined to think that the moon is intended: and we know how much superstition has ever prevailed among most people as to the worship of the moon.”

— John Calvin, Commentaries on Jeremiah, Jer. 7:18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+%22the+Queen+of+the+heavens%22+be+adopted%2C+then+I+am+inclined+to+think+that+the+moon+is+intended%3A+and+we+know+how+much+superstition+has+ever+prevailed+among+most+people+as+to+the+worship+of+the+moon.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentaries+on+Jeremiah%2C+Jer.+7%3A18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9568da3cfe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9568da3cfe.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom17" rel="noopener" target="_blank">Read it online · CCEL, vol. 1</a></div>
</figure><figure class="quote" id="q-af2a076485" data-kw="Mary Queen of Heaven Idolatry">
<blockquote><p>This is especially evident with respect to the blessed virgin, to whom they not only frequently ascribe divine names and articles (when they call her &quot;Goddess, Mistress, Queen of Heaven, Mother of Mercy, Redemptress, Our Omnipotent Mistress, the Refuge of sinners&quot;), but also worship internal as well as external.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.7.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/worship-of-saints-mary-and-angels-latria-dulia-hyperdulia.html">Worship of saints, Mary and angels (latria, dulia, hyperdulia)</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-is-not-the-queen-of-heaven.html">Mary is not the queen of heaven</a></span></div>
<div class="actions"><button class="copy" data-copy="“This is especially evident with respect to the blessed virgin, to whom they not only frequently ascribe divine names and articles (when they call her &quot;Goddess, Mistress, Queen of Heaven, Mother of Mercy, Redemptress, Our Omnipotent Mistress, the Refuge of sinners&quot;), but also worship internal as well as external.”

— Francis Turretin, Institutes of Elenctic Theology, 11.7.7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+is+especially+evident+with+respect+to+the+blessed+virgin%2C+to+whom+they+not+only+frequently+ascribe+divine+names+and+articles+%28when+they+call+her+%22Goddess%2C+Mistress%2C+Queen+of+Heaven%2C+Mother+of+Mercy%2C+Redemptress%2C+Our+Omnipotent+Mistress%2C+the+Refuge+of+sinners%22%29%2C+but+also+worship+internal+as+well+as+external.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+11.7.7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf2a076485.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af2a076485.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-31e2552aa2" data-kw="">
<blockquote><p>We by no means think or teach that the relics of the saints should be held in contempt, or treated in an irreverent and irreligious manner, but that they should be given that place, and be held in that regard, which the testimonies of Scripture we have quoted show. It does not follow from this, however, that we should gather from the cogitations of human reason, or learn from the examples of the heathen or of any people, or that everyone ought to figure out for himself, with what veneration the relics of the saints are to be honored; but the same Scripture which teaches that the relics of the saints are to be considered precious also shows the mode and manner of their true veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, First Topic (Relics of the Saints), Sec. II</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We by no means think or teach that the relics of the saints should be held in contempt, or treated in an irreverent and irreligious manner, but that they should be given that place, and be held in that regard, which the testimonies of Scripture we have quoted show. It does not follow from this, however, that we should gather from the cogitations of human reason, or learn from the examples of the heathen or of any people, or that everyone ought to figure out for himself, with what veneration the relics of the saints are to be honored; but the same Scripture which teaches that the relics of the saints are to be considered precious also shows the mode and manner of their true veneration.”

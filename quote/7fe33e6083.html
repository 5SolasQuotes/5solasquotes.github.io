<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>

</figure><figure class="quote" id="q-9ace4a6900" data-kw="">
<blockquote><p>Further, this power of the keys… The key of the ministry of the Word is set down and established by Christ, Mt. 16:19, ‘I will give unto thee the keys of the kingdom of heaven,’ etc. This ministry of the Word is a key, because it opens and shuts heaven; this it does… Secondly: by applying the promises of the Gospel and the threatening of the Law: For when in the ministry of the Word the promises of remission of sins and life everlasting, are applied to believers that repent, then the kingdom of heaven is opened; and when as in the same ministry of the Word, the curses of the law are denounced against impenitent sinners, then is the kingdom of heaven shut. Yet touching the ministry of the Word, this distinction must be remembered; that otherwhiles the church is certain of the faith and repentance of some men, or some congregation; and then they may pronounce remission of sins absolutely. But otherwhiles they are uncertain of their faith and repentance, or of their impenitency; and then they must accordingly remit or retain men’s sins, that is, conditionally; pronouncing the remission of sins to all that repent: and denouncing damnation to all that repent not. And thus is the word to be publicly handled in God’s Church at this day, because our congregations are mixed companies, consisting of some that repent and believe, and of others that do not truly repent nor believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation… (London: Islip, 1606), 3rd Chapter</cite>, p. 180</span></figcaption>

</figure><figure class="quote" id="q-749ffbefe0" data-kw="">
<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer’ in Practical Religion (Evangelical Press)</cite>, pp. 97-98</span></figcaption>

<blockquote><p>Reader,

THERE are two rotten pillars on which the fabric of late Arminianism (an egg of the old Pelagianism, which we had well hoped had been long since chilled, but is sit upon and brooded by the wanton wits of our degenerate and apostate spirits) doth principally stand.

The one is, That God loveth all alike, Cain as well as Abel, Judas as the rest of the apostles.

The other is, That God giveth (nay is bound, “ex debito,” so to do) both Christ, the great gift of his eternal love, for all alike to work out their redemption, and “vires credendi,” power to believe in Christ to all alike to whom he gives the gospel; whereby that redemption may effectually be applied for their salvation, if they please to make right use of that which is so put into their power.

The former destroys the free and special grace of God, by making it universal; the latter gives cause to man of glorying in himself rather than in God, — God concurring no farther to the salvation of a believer than a reprobate. Christ died for both alike; — God giving power of accepting Christ to both alike, men themselves determining the whole matter by their free-will; Christ making both savable, themselves make them to be saved.

This cursed doctrine of theirs crosseth the main drift of the holy Scripture; which is to abase and pull down the pride of man, to make him even to despair of himself, and to advance and set up the glory of God’s free grace from the beginning to the end of man’s salvation. His hand hath laid the foundation of his spiritual house; his hand shall also finish it.

The reverend and learned author of this book hath received strength from God (like another Samson) to pull down this rotten house upon the head of those Philistines who would uphold it. Read it diligently, and I doubt not but you will say with me, there is such variety of choice matter running through every vein of each discourse here handled, and carried along with such strength of sound and deep judgment, and with such life and power of a heavenly spirit, and all expressed in such pithy and pregnant words of wisdom, that you will both delight in the reading and praise God for the writer. That both he and it may be more and more profitable shall be my hearty prayers. — The unworthiest of the ministers of the gospel,

Stanley Gower.</p></blockquote>

<blockquote><p>The hopes of the Arminians in England were but small so long as K[ing]. James did live, for that good Prince both in word and writing did threaten to burn these Hereticks if any of them should appear in his Dominions; see his Declaration against Vorstius: yea, so long as [George] Abbot was in grace at Court, the Arminians kept a low sail, but after that his Successor even in his own time had come in favour, that unhappy Sect under the patronage of Mountagu and White’s learning began to spread far and near, yea, at last silence in a public Edict was enjoined to their opposers, and all favours conferred on those who had skill and will to promote that Cause, &amp; many evident disgraces poured on well-deserving men for no other reason but their Anti-Arminian spirit.

All this time our Church [the Church of Scotland] was free of these evils; but so soon as the advancers of Arminianism at the English Court, began to intermeddle with the affairs of our Kingdom, at once these men were eyed, who inclined that way, prime places were put into their hands for no other virtue the World could discern in them, but their boldness to let out their inclination towards the Arminian Error.</p></blockquote>

<blockquote><p>Saving grace is not in vain, but effectual, 1 Corinth. 15.10. 1 Tim. 1.14. And we are saved by the Grace of our Lord Jesus Christ, Acts 15.11. and no greater mercy can be wished to any, then the grace of our Lord Jesus, Rom. 16.20. 2 Cor. 13.14. Rev. 22.21. by which we are called, justified and glorified. If it be said that this grace is not that effectual saving grace, bestowed upon the Elect, but a general remote gracious power, by which we may acquire the saving grace proper to the Elect.

But so 1. that grace saving proper to the Elect by this means is in the power of all Pagans, and all must be gifted with a power to purchase that grace proper to the Elect: That must be strange conquishing, we must all be made our own efficacious Redeemers, and Christ is a Saviour by merit, not by efficacy; For if this saving grace be infused, it is either infused, we doing nothing to which they cannot stand: Or then it is acquired, and so we make the general grace saving and proper to the Elect, which everteth the nature of saving grace, and makes it the purchase of works. And they must say that Christ hath merited a general ineffectual power to some, and that he died to merit a special saving grace to others.

Let us have a warrant for this, that Christ both died equally to save all, and yet with two contrary intentions, to purchase a power of believing which should be effectual to some to save them, and ineffectual to others. If it be said that Christ died to merit the same general power to all, but some make it ineffectual, some not; This saith thus. 1. That Christ’s death might have its fruit and effect, though all perish. 2. That Christ dyed to merit a far off, lubrick and possible venture of heaven, such as was the case of the first Adam. 3. Christ dyed not to purchase a new heart more to one then to another, whereas 1 Pet. 1.18, 19. the blood the Lord shed is to Redeem us from our vain conversation, in a natural state as well as to save us from the wrath to come; Then must Christ have died to buy Pagans from Paganism and Idolatry: and that either absolutely, and then why should multitudes so die in their sins?

If conditionally, what can be the condition going before conversion, to wit, that we should be delivered from our vain conversation, so we be willing, before our conversion, to be delivered from our vain conversation. And shall not the Question recur concerning that condition? In a word they will have Christ’s death to buy Heaven, but not to buy faith, without which Heaven is impossible. Yea he no more bought to men a grace sweetly and strongly inclining the will to believe, then he bought such a grace to the damned devils. He purposed to give to all Pagans a power by which they should be made fit to perform all that the Gospel requires, and be fit to be made partakers of the inheritance of the Saints, Col. 1. And yet Paul gives thanks to God for that bestowed on the Colossians, and God must by this call all men to Christ, either mediately or immediately.

And say that God is prepared ever to give more and more as we use the former well, and that all by sufficient grace (saith Corvinus) are disposed to conversion, but that sufficiency is not habitual grace, but actual assistance conveying the Preached Word, which is to bring all to free-wills power, rejecting all infused power, and to make an influence of grace, which is in the power of free will to use or not to use, and to stand in two. 1. In a measure of heavenly Doctrine. 2. In the stirring upon the heart; Whence 1. Grace habitual so is denied; then the will needeth no healing. 2. Grace universal is limited to the Word Preached, then it is not universal; For Pagans hear not the Word Preached. 3. There is no other help given to free-will in every act, but 1. Information by the Word, that was the grace of Pelagius. 2. Some influence of God in every act: But that adds not new strength to the will. Shortly they say, Any man may know, understand and believe the Gospel, if the object be sufficiently proposed and revealed. And so the natural man can no more know and receive the things of the Gospel, then he can understand the Metaphysics, the Acromaticks of Aristotle: for these he cannot receive, but judgeth them folly; And so we are the same way blind, dead, stony-hearted to believe the Gospel, as we are to know and believe the mysteries of Aristotle’s Philosophy.

Lastly, this power of believing and coming to Christ cannot be in all men, since the Scripture saith of all men (even these within the Visible Church not excepted) that until the light of the Gospel savingly enlighten them, they sit in darkness and in the shadow of death, Isa. 9.1. Math. 4.15, 16. And No man can come to Christ without the Father’s drawing, and God teaching the heart, Joh. 6.44, 45. The natural man cannot understand the things of God, but judges them foolishness. 1 Cor. 2.14. His wisdom cannot be subject to the Law of God. Rom. 8.7. He cannot call the Lord, Jesus, except by the Spirit of Jesus, 1 Cor. 12.3. He is a withered branch being out of Christ, and can do nothing, Joh. 15.3.4.

It shall be clear to any, that the Holy Ghost denyeth any such power, as they af∣firm. It reckons not much to tell that Jesuits, as Martmez de Ripul. Suarez, Alphonsus Curiel, Duvallius, Lod. Molma, Did. Ruiz, Vasquez, Bellarmine, Phili. Samachaeus, Sorbonicus, Gulie. Estius, Dominica, Toletus Cardinalis, Pirerius, Salmeron, teach that, without saving grace, men may, and can first know moral truths, shining virtues, as heathens, be free of sin, as touching these virtues in their due circumstances. 2. Keep the Commandments and Law of Nature. 3. Dispose themselves for, and obtain the grace of Conversion by their own industry. 4. Be victorious over this or that weighty temptation singly taken. 5. That there is no intrinsical hurt of free-will, that it is wounded a little, because of the darkness of the mind, and languor of nature, but not dead to actions supernatural. 6. That we may love God as the Author of nature, and Creator sincerely; And Arminians teach that we may without the Spirit of God know all truth, quantum sufficit ad salutem, sufficiently to salvation, and so may will, love, and believe without the infused supernatural habit or grace, so their Apology.

And the Socinian Catechism, c. 6. pag. 212. and Socinus himself, Praelect. Theol. Cap. 4. Fol. 15, 16. Et de officio hominis Christi: Cap. 5. Smalcius on Joh. 1. Hom. 3. Give to us man whole, sound, sinless, as he came from the first Adam. 2. That man can do all that Cod commands him with little help of God. 3. It’s an error (saith Smalcius) that a man hath no strength in spiritual things, there is no need of the inward gift of the Spirit of God to believe (saith the Racovian Catechism) for we read not that such a gift in Scripture is bestowed upon any but upon believers: such as are born of Adam (saith Socinus) are all born in the same condition, and nothing is taken from such a man, which he naturally hath or was to have. Ostorodius Justi. Relig. Christ. cap. 21. Praedicatio sola Euangelij potest hominem abs{que} interná Spiritus illuminatione, &amp; operatione à peccatis convertere. The only Preaching of the Gospel without the inward illumination by the Holy Spirit, and his working is able to convert a man from sin. All which is Printed and taught, and many other abominable errors to us.

To this Objection against universal grace (as I judge unanswerable) Corvinus Answers, that all the places of Scripture brought to prove man’s inability to believe in Christ, and to worship him, conclude well that a man hath not strength of himself without Christ and his grace; but this is but to cloud the truth, and to mock the reader, for if all and every man (even the Infants of Pagans) be in Covenant through Christ, and be made able by a gifted grace common to all, within, and without the Church, by which they are able by degrees to do all that the Gospel requires, what avails it to discourage them, and to tell, they are not masters of a good thought, without grace; for they are no less masters of good thoughts and good words, and of good actions then Adam was; for they are not hearers of the Gospel by nature, but as gifted with universal grace, they are hearers, and before their conversion, and before they receive the Spirit of Regeneration, can please God, and prepare themselves for Regeneration:

Yea there is no animal and natural Pagan de facto existing in the world (by their way) who cannot receive the things of God, and cannot come to Christ, except he be drawn, for all Pagans and others are drawn, and by this it might have been said, Adam as wanting supernatural grace, and as a natural man (for the Image of God was supernatural grace to Adam, as Arminius and Corvinus teach) so, was not able to think a good thought, as 2 Cor. 3.5. nor able to receive the things of God, as the natural man, 1 Cor. 2.14. and Adam so was also dead in trespasses and sins, and must come to Christ the same way, to wit, drawn by the grace super-added to nature, as we fallen sinners do.</p></blockquote>

And say that God is prepared ever to give more and more as we use the former well, and that all by sufficient grace (saith Corvinus) are disposed to conversion, but that sufficiency is not habitual grace, but actual assistance conveying the Preached Word, which is to bring all to free-wills power, rejecting all infused power, and to make an influence of grace, which is in the power of free will to use or not to use, and to stand in two. 1. In a measure of heavenly Doctrine. 2. In the stirring upon the heart; Whence 1. Grace habitual so is denied; then the will needeth no healing. 2. Grace universal is limited to the Word Preached, then it is not universal; For Pagans hear not the Word Preached. 3. There is no other help given to free-will in every act, but 1. Information by the Word, that was the grace of Pelagius. 2. Some influence of God in every act: But that adds not new strength to the will. Shortly they say, Any man may know, understand and believe the Gospel, if the object be sufficiently proposed and revealed. And so the natural man can no more know and receive the things of the Gospel, then he can understand the Metaphysics, the Acromaticks of Aristotle: for these he cannot receive, but judgeth them folly; And so we are the same way blind, dead, stony-hearted to believe the Gospel, as we are to know and believe the mysteries of Aristotle’s Philosophy.

Lastly, this power of believing and coming to Christ cannot be in all men, since the Scripture saith of all men (even these within the Visible Church not excepted) that until the light of the Gospel savingly enlighten them, they sit in darkness and in the shadow of death, Isa. 9.1. Math. 4.15, 16. And No man can come to Christ without the Father’s drawing, and God teaching the heart, Joh. 6.44, 45. The natural man cannot understand the things of God, but judges them foolishness. 1 Cor. 2.14. His wisdom cannot be subject to the Law of God. Rom. 8.7. He cannot call the Lord, Jesus, except by the Spirit of Jesus, 1 Cor. 12.3. He is a withered branch being out of Christ, and can do nothing, Joh. 15.3.4.

It shall be clear to any, that the Holy Ghost denyeth any such power, as they af∣firm. It reckons not much to tell that Jesuits, as Martmez de Ripul. Suarez, Alphonsus Curiel, Duvallius, Lod. Molma, Did. Ruiz, Vasquez, Bellarmine, Phili. Samachaeus, Sorbonicus, Gulie. Estius, Dominica, Toletus Cardinalis, Pirerius, Salmeron, teach that, without saving grace, men may, and can first know moral truths, shining virtues, as heathens, be free of sin, as touching these virtues in their due circumstances. 2. Keep the Commandments and Law of Nature. 3. Dispose themselves for, and obtain the grace of Conversion by their own industry. 4. Be victorious over this or that weighty temptation singly taken. 5. That there is no intrinsical hurt of free-will, that it is wounded a little, because of the darkness of the mind, and languor of nature, but not dead to actions supernatural. 6. That we may love God as the Author of nature, and Creator sincerely; And Arminians teach that we may without the Spirit of God know all truth, quantum sufficit ad salutem, sufficiently to salvation, and so may will, love, and believe without the infused supernatural habit or grace, so their Apology.

And the Socinian Catechism, c. 6. pag. 212. and Socinus himself, Praelect. Theol. Cap. 4. Fol. 15, 16. Et de officio hominis Christi: Cap. 5. Smalcius on Joh. 1. Hom. 3. Give to us man whole, sound, sinless, as he came from the first Adam. 2. That man can do all that Cod commands him with little help of God. 3. It’s an error (saith Smalcius) that a man hath no strength in spiritual things, there is no need of the inward gift of the Spirit of God to believe (saith the Racovian Catechism) for we read not that such a gift in Scripture is bestowed upon any but upon believers: such as are born of Adam (saith Socinus) are all born in the same condition, and nothing is taken from such a man, which he naturally hath or was to have. Ostorodius Justi. Relig. Christ. cap. 21. Praedicatio sola Euangelij potest hominem abs{que} interná Spiritus illuminatione, &amp; operatione à peccatis convertere. The only Preaching of the Gospel without the inward illumination by the Holy Spirit, and his working is able to convert a man from sin. All which is Printed and taught, and many other abominable errors to us.

To this Objection against universal grace (as I judge unanswerable) Corvinus Answers, that all the places of Scripture brought to prove man’s inability to believe in Christ, and to worship him, conclude well that a man hath not strength of himself without Christ and his grace; but this is but to cloud the truth, and to mock the reader, for if all and every man (even the Infants of Pagans) be in Covenant through Christ, and be made able by a gifted grace common to all, within, and without the Church, by which they are able by degrees to do all that the Gospel requires, what avails it to discourage them, and to tell, they are not masters of a good thought, without grace; for they are no less masters of good thoughts and good words, and of good actions then Adam was; for they are not hearers of the Gospel by nature, but as gifted with universal grace, they are hearers, and before their conversion, and before they receive the Spirit of Regeneration, can please God, and prepare themselves for Regeneration:

Yea there is no animal and natural Pagan de facto existing in the world (by their way) who cannot receive the things of God, and cannot come to Christ, except he be drawn, for all Pagans and others are drawn, and by this it might have been said, Adam as wanting supernatural grace, and as a natural man (for the Image of God was supernatural grace to Adam, as Arminius and Corvinus teach) so, was not able to think a good thought, as 2 Cor. 3.5. nor able to receive the things of God, as the natural man, 1 Cor. 2.14. and Adam so was also dead in trespasses and sins, and must come to Christ the same way, to wit, drawn by the grace super-added to nature, as we fallen sinners do.”

+venture+of+heaven%2C+such+as+was+the+case+of+the+first+Adam.+3.+Christ+dyed+not+to+purchase+a+new+heart+more+to+one+then+to+another%2C+whereas+1+Pet.+1.18%2C+19.+the+blood+the+Lord+shed+is+to+Redeem+us+from+our+vain+conversation%2C+in+a+natural+state+as+well+as+to+save+us+from+the+wrath+to+come%3B+Then+must+Christ+have+died+to+buy+Pagans+from+Paganism+and+Idolatry%3A+and+that+either+absolutely%2C+and+then+why+should+multitudes+so+die+in+their+sins%3F%0A%0AIf+conditionally%2C+what+can+be+the+condition+going+before+conversion%2C+to+wit%2C+that+we+should+be+delivered+from+our+vain+conversation%2C+so+we+be+willing%2C+before+our+conversion%2C+to+be+delivered+from+our+vain+conversation.+And+shall+not+the+Question+recur+concerning+that+condition%3F+In+a+word+they+will+have+Christ%E2%80%99s+death+to+buy+Heaven%2C+but+not+to+buy+faith%2C+without+which+Heaven+is+impossible.+Yea+he+no+more+bought+to+men+a+grace+sweetly+and+strongly+inclining+the+will+to+believe%2C+then+he+bought+such+a+grace+to+the+damned+devils.+He+purposed+to+give+to+all+Pagans+a+power+by+which+they+should+be+made+fit+to+perform+all+that+the+Gospel+requires%2C+and+be+fit+to+be+made+partakers+of+the+inheritance+of+the+Saints%2C+Col.+1.+And+yet+Paul+gives+thanks+to+God+for+that+bestowed+on+the+Colossians%2C+and+God+must+by+this+call+all+men+to+Christ%2C+either+mediately+or+immediately.%0A%0AAnd+say+that+God+is+prepared+ever+to+give+more+and+more+as+we+use+the+former+well%2C+and+that+all+by+sufficient+grace+%28saith+Corvinus%29+are+disposed+to+conversion%2C+but+that+sufficiency+is+not+habitual+grace%2C+but+actual+assistance+conveying+the+Preached+Word%2C+which+is+to+bring+all+to+free-wills+power%2C+rejecting+all+infused+power%2C+and+to+make+an+influence+of+grace%2C+which+is+in+the+power+of+free+will+to+use+or+not+to+use%2C+and+to+stand+in+two.+1.+In+a+measure+of+heavenly+Doctrine.+2.+In+the+stirring+upon+the+heart%3B+Whence+1.+Grace+habitual+so+is+denied%3B+then+the+will+needeth+no+healing.+2.+Grace+universal+ n+first+know+moral+truths%2C+shining+virtues%2C+as+heathens%2C+be+free+of+sin%2C+as+touching+these+virtues+in+their+due+circumstances.+2.+Keep+the+Commandments+and+Law+of+Nature.+3.+Dispose+themselves+for%2C+and+obtain+the+grace+of+Conversion+by+their+own+industry.+4.+Be+victorious+over+this+or+that+weighty+temptation+singly+taken.+5.+That+there+is+no+intrinsical+hurt+of+free-will%2C+that+it+is+wounded+a+little%2C+because+of+the+darkness+of+the+mind%2C+and+languor+of+nature%2C+but+not+dead+to+actions+supernatural.+6.+That+we+may+love+God+as+the+Author+of+nature%2C+and+Creator+sincerely%3B+And+Arminians+teach+that+we+may+without+the+Spirit+of+God+know+all+truth%2C+quantum+sufficit+ad+salutem%2C+sufficiently+to+salvation%2C+and+so+may+will%2C+love%2C+and+believe+without+the+infused+supernatural+habit+or+grace%2C+so+their+Apology.%0A%0AAnd+the+Socinian+Catechism%2C+c.+6.+pag.+212.+and+Socinus+himself%2C+Praelect.+Theol.+Cap.+4.+Fol.+15%2C+16.+Et+de+officio+hominis+Christi%3A+Cap.+5.+Smalcius+on+Joh.+1.+Hom.+3.+Give+to+us+man+whole%2C+sound%2C+sinless%2C+as+he+came+from+the+first+Adam.+2.+That+man+can+do+all+that+Cod+commands+him+with+little+help+of+God.+3.+It%E2%80%99s+an+error+%28saith+Smalcius%29+that+a+man+hath+no+strength+in+spiritual+things%2C+there+is+no+need+of+the+inward+gift+of+the+Spirit+of+God+to+believe+%28saith+the+Racovian+Catechism%29+for+we+read+not+that+such+a+gift+in+Scripture+is+bestowed+upon+any+but+upon+believers%3A+such+as+are+born+of+Adam+%28saith+Socinus%29+are+all+born+in+the+same+condition%2C+and+nothing+is+taken+from+such+a+man%2C+which+he+naturally+hath+or+was+to+have.+Ostorodius+Justi.+Relig.+Christ.+cap.+21.+Praedicatio+sola+Euangelij+potest+hominem+abs%7Bque%7D+intern%C3%A1+Spiritus+illuminatione%2C+%26+operatione+%C3%A0+peccatis+convertere.+The+only+Preaching+of+the+Gospel+without+the+inward+illumination+by+the+Holy+Spirit%2C+and+his+working+is+able+to+convert+a+man+from+sin.+All+which+is+Printed+and+taught%2C+and+many+other+abominable+errors+to+us.%0A%0ATo+this+Objection+against+universal+grace+%28as+I+judge+unanswerable%29+Corvinus+Answers%2C+that+all+the+places+of+Scripture+brought+to+prove+man%E2%80%99s+inability+to+believe+in+Christ%2C+and+to+worship+him%2C+conclude+well+that+a+man+hath+not+strength+of+himself+without+Christ+and+his+grace%3B+but+this+is+but+to+cloud+the+truth%2C+and+to+mock+the+reader%2C+for+if+all+and+every+man+%28even+the+Infants+of+Pagans%29+be+in+Covenant+through+Christ%2C+and+be+made+able+by+a+gifted+grace+common+to+all%2C+within%2C+and+without+the+Church%2C+by+which+they+are+able+by+degrees+to+do+all+that+the+Gospel+requires%2C+what+avails+it+to+discourage+them%2C+and+to+tell%2C+they+are+not+masters+of+a+good+thought%2C+without+grace%3B+for+they+are+no+less+masters+of+good+thoughts+and+good+words%2C+and+of+good+actions+then+Adam+was%3B+for+they+are+not+hearers+of+the+Gospel+by+nature%2C+but+as+gifted+with+universal+grace%2C+they+are+hearers%2C+and+before+their+conversion%2C+and+before+they+receive+the+Spirit+of+Regeneration%2C+can+please+God%2C+and+prepare+themselves+for+Regeneration%3A%0A%0AYea+there+is+no+animal+and+natural+Pagan+de+facto+existing+in+the+world+%28by+their+way%29+who+cannot+receive+the+things+of+God%2C+and+cannot+come+to+Christ%2C+except+he+be+drawn%2C+for+all+Pagans+and+others+are+drawn%2C+and+by+this+it+might+have+been+said%2C+Adam+as+wanting+supernatural+grace%2C+and+as+a+natural+man+%28for+the+Image+of+God+was+supernatural+grace+to+Adam%2C+as+Arminius+and+Corvinus+teach%29+so%2C+was+not+able+to+think+a+good+thought%2C+as+2+Cor.+3.5.+nor+able+to+receive+the+things+of+God%2C+as+the+natural+man%2C+1+Cor.+2.14.+and+Adam+so+was+also+dead+in+trespasses+and+sins%2C+and+must+come+to+Christ+the+same+way%2C+to+wit%2C+drawn+by+the+grace+super-added+to+nature%2C+as+we+fallen+sinners+do.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+covenant+of+life+opened%2C+or%2C+A+treatise+of+the+covenant+of+grace%2C+%28Edinburgh%3A+Robert+Brown%2C+1655%29%2C+1.15%2C+pp+124-28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc397cbcf34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c397cbcf34.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/07/02/samuel-rutherford-on-arminian-jesuit-and-socinian-notions-of-universal-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>One of the English delegates to the Synod of Dort, George Carleton, exhorted the Dutch to preserve the confession of the Reformed churches and to resist the innovations of the Arminians (he does not mention them by name in this extract, but these are the innovators to whom he was referring):

The reformed Churches throughout Europe, having recovered their liberty, and shaken off the heavy yoke of Rome, to shew themselves more thankful to Christ their Redeemer, have severally set forth confessions of their Faith, which though they were many, yet they so well agree in one consent and harmony of minds, that we may plainly discover, it was the voice of one only Spirit, which in so many Nations, so many Languages delivered it self.

In this general concord of other Nations, your consent did bear a part; your praises were in the Gospel, your authority in the Church much set by. But now the neighbour Churches round about enquire, question, and wonder, what it might be which in these confessions your Church alone quarrels with: Against which, none of the rest, since the reformation, have taken exception.

Give me leave to ask of you in the Apostle’s words, Proceeded the Word of God from you alone? or hath it come only unto you? Other Nations and Provinces preserve the doctrine of the Gospel which they have received, whole and sound, without any alteration and change, and resolve by God’s help, hereafter so to continue.

This is that which his Majesty [James I of England] commends unto you, even the unity and consent of Confession, the spring and original of reformation; he commends unto you the consent of the Churches, he requires you, that what form of Church you have received from your Fathers, you will deliver over to your posterity; that what Doctrine now these twenty or thirty years hath been publicly taught amongst you, you preserve in its former purity; that you shut up all gap and inlet, which may every day give way to innovation, that such treasures of Christ as are committed to your trust, you preserve safe, without suffering them to be embased by admixtion of false and counterfeit stuff.

Unto you are committed the Oracles of God; keep your Faith unspotted, and undefiled unto God and Christ the Church’s King: You are seriously to take heed, that your Doctors, leaving the simplicity of holy Scriptures, divert not upon abstruse and intricate quirks; that they set not before you smoke, in stead of solid meat.</p></blockquote>

Unto you are committed the Oracles of God; keep your Faith unspotted, and undefiled unto God and Christ the Church’s King: You are seriously to take heed, that your Doctors, leaving the simplicity of holy Scriptures, divert not upon abstruse and intricate quirks; that they set not before you smoke, in stead of solid meat.”

— George Carleton, An oration made at the Hague, before the Prince of Orange and the assembly of the high and mighty lords, the States General of the United Provinces: by the reverend father in God, the Lord Bishop of Llandaff, one of the commissioners sent by the Kings most excellent Majesty to the Synod of Dort, (London: Ralph Rounthwait, 1619), pp 6-8.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COne+of+the+English+delegates+to+the+Synod+of+Dort%2C+George+Carleton%2C+exhorted+the+Dutch+to+preserve+the+confession+of+the+Reformed+churches+and+to+resist+the+innovations+of+the+Arminians+%28he+does+not+mention+them+by+name+in+this+extract%2C+but+these+are+the+innovators+to+whom+he+was+referring%29%3A%0A%0AThe+reformed+Churches+throughout+Europe%2C+having+recovered+their+liberty%2C+and+shaken+off+the+heavy+yoke+of+Rome%2C+to+shew+themselves+more+thankful+to+Christ+their+Redeemer%2C+have+severally+set+forth+confessions+of+their+Faith%2C+which+though+they+were+many%2C+yet+they+so+well+agree+in+one+consent+and+harmony+of+minds%2C+that+we+may+plainly+discover%2C+it+was+the+voice+of+one+only+Spirit%2C+which+in+so+many+Nations%2C+so+many+Languages+delivered+it+self.%0A%0AIn+this+general+concord+of+other+Nations%2C+your+consent+did+bear+a+part%3B+your+praises+were+in+the+Gospel%2C+your+authority+in+the+Church+much+set+by.+But+now+the+neighbour+Churches+round+about+enquire%2C+question%2C+and+wonder%2C+what+it+might+be+which+in+these+confessions+your+Church+alone+quarrels+with%3A+Against+which%2C+none+of+the+rest%2C+since+the+reformation%2C+have+taken+exception.%0A%0AGive+me+leave+to+ask+of+you+in+the+Apostle%E2%80%99s+words%2C+Proceeded+the+Word+of+God+from+you+alone%3F+or+hath+it+come+only+unto+you%3F+Other+Nations+and+Provinces+preserve+the+doctrine+of+the+Gospel+which+they+have+received%2C+whole+and+sound%2C+without+any+alteration+and+change%2C+and+resolve+by+God%E2%80%99s+help%2C+hereafter+so+to+continue.%0A%0AThis+is+that+which+his+Majesty+ <blockquote><p>But what is required hereunto?

1. There is required a clear apprehension in ourselves of those doctrines and truths which we are so to defend. Truth may be lost by weakness as well as by wickedness: if we have not a full apprehension of the truth, and that upon its own proper grounds and principles, we shall never be able to defend it. This is to be attained by all ways and means,—by the use, especially, of diligent prayer and study,—so that we may be able to stop the mouth of gainsayers.

2. There is required love of the truth. We shall never contend earnestly for the truth, we shall never ” buy it and not sell it,” whatever we know of it, unless our love and value of it arise from a sense and experience of it in our own souls. I fear there is much loss of truth, not for want of light, knowledge, and ability, but for want of love.

I have the advantage of most here present in this, that I know the contest we had for the truths of the gospel before our troubles began, and was an early person engaged in them; and knew those godly ministers that did contend for them as for their lives and souls, and that all the opposition that was made against them was never able to discourage them. What were these doctrines? — the doctrines of eternal predestination, effectual conversion to God, and the obduration of wicked reprobates by the providence of God. These truths are not lost for want of skill, but for want of love. We scarce hear one word of them; we are almost ashamed to mention them in the church; and he that doth it will be sure to expose himself to public obloquy and scorn: but we must not be ashamed of truth.

Formerly we could not meet with a godly minister, but the error of Arminianism was looked upon by him as the ruin and poison of the souls of men: such did tremble at it, — wrote and disputed against it. But now it is not so; the doctrine of the gospel is owned still, though little taken notice of by some among ourselves, the love of it being greatly decayed, — the sense and the power of it almost lost. But we have got no ground by it; we are not more holy, more fruitful, than we were in the preaching those doctrines, and attending diligently unto them.</p></blockquote>

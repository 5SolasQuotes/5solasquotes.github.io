<blockquote><p>The Socinians, and the Erastian crutch-maker before-mentioned, so plead against the necessity of ordination, that they hold it lawful and free to gifted persons not ordained, not only to preach, but to administer the sacraments.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Socinians, and the Erastian crutch-maker before-mentioned, so plead against the necessity of ordination, that they hold it lawful and free to gifted persons not ordained, not only to preach, but to administer the sacraments.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-188acf59c2" data-kw="">
<blockquote><p>Whereas it has pleased the Lord to move the Heart of our dread Sovereign Charles [I] by the Grace of God King etc. to grant license and liberty to sundry of his subjects to plant themselves in the Western parts of America. We… considering with ourselves the holy Will of God and our own Necessity that we should not live without wholesome Laws and Civil Government among us… do in the name of Christ and in the sight of God combine ourselves together to erect and set up among us such Government as shall be to our best discerning agreeable to the Will of God… and binding of ourselves solemnly by the Grace and Help of Christ and in His Name and fear to submit ourselves to such Godly and Christian Laws as are established in the realm of England… which shall… be made and enacted among us according to God that we may live quietly and peaceably together in all godliness and honest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-hampshire.html">State of New Hampshire</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Agreement of the Settlers at Exeter in New Hampshire</cite>, 1639 (Thorpe, 4.2445)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Please enjoy Aaron’s Rod</cite>, (reprint, Sprinkle) p. 2. Gillespie is arguing against an Erastian:</span></figcaption>

<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God.

4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts</cite>, ... (1684), Unnecessary Separating Disowned, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-96895846a9" data-kw="">
<blockquote><p>VI. (2) The question does not concern the privileges which, from the kindness and liberality of Christian rulers and princes, can be granted to the clergy, many of which it is evident have been granted by emperors. Rather the question concerns the immunity which belongs to them by divine right. (3) It is not inquired concerning the personal burdens which we acknowledge ought not to be imposed, lest they should be a hindrance to the exercise of their ecclesiastical duties and detract in some way from either the dignity or the authority of the sacred office… Leave out the case of extreme necessity, if the country is exposed to extreme danger. But concerning real burdens, as to the property which they possess, not so much with respect to sacred and ecclesiastical property, which, consecrated to the church, is before free and safe from all pressure of tributes (although in a case of necessity, it may be subjected to an extraordinary tribute, as with respect to secular property acquired by them by purchase, inheritance, the rights of marriages and other means, from which ought to be paid to the magistrate what is owed). For the property passes over with the burden upon it, ‘while burdens follow the property and its possessors whomsoever they are’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 27, ‘Are Ecclesiastical Persons Exempt from the Jurisdiction of &amp; Subjection to the Civil Magistrate? We Deny Against the Romanists’ in Institutes of Elenctic Theology (P&amp;R), vol. 3, 18th Topic, ‘The Church’, pp. 258-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

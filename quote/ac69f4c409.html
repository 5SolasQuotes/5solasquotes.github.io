<main class="wrap"><figure class="quote" id="q-ac69f4c409" data-kw="">
<blockquote><p>David, like every one who seriously grapples with sin, did not stand at the mere outward appearance of sin, but pressed into its secret workshop, to its troubled fountain. Whenever the knowledge of sin extends so far, the prayer for forgiveness and sanctification must necessarily be more comprehensive. … Therefore was David led, from knowledge of one sin, to the knowledge of his whole sinful nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/e-w-hengstenberg.html">E. W. Hengstenberg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Psalms</cite>, trans. Patrick Fairbairn and John Thomson (3 vols, Edinburgh: T. &amp; T. Clark, 1846), 2: 185.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cedf944e34" data-kw="privation">
<blockquote><p>Hence it follows that the formal reason of sin consists in anomia and privation, denoting the want of the rectitude or goodness which ought to be in the rational creature according to the prescription of the law (whether it belongs to the nature or qualities or actions themselves, for it deprives all these of conformity with the law and so constitutes them guilty of sin). But this privation is not pure or simple, but corrupting; not idle, but energetic; not of pure negation, but of depraved disposition, by which not only is the due rectitude taken away, but also an undue unrectitude and a depraved quality laid down, infecting all the faculties. Just as a physical disease is not only a removal of the temper of the humors, but also a corrupt disposition and disorder (dyskrasia) of them, so sin (which holds the relation of a moral disease of the soul) is not only the negation of a good, but the position of a corrupt disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.1</span></figcaption>

</figure><figure class="quote" id="q-a44c97fea9" data-kw="">
<blockquote><p>Q. What are the degrees of Concupiscence forbidden here?

A. The first is, wandering and evil thoughts, though we never like of them: for even the very rising of such thoughts in our minds, argueth our corruption of nature: for were it not for that inborn corruption, such thoughts could not once enter into our souls, further then they were offered unto us by some outward tentation of the devil, or of the world, as it was unto our Saviour Christ.

And although in the incorrupt state of man, he might dutifully have thought of the transgression of the Commandment, with a perfect hatred of it; yet the same should not have been (as now it is) suddenly rising in the mind, without thinking or meditation of the naughtiness and hatefulness thereof; where now these thoughts rise suddenly, and the hatred and detestation cometh after, and is not in such perfection as then it should have been. Whereas the Lord our God hath the eyes of his glory so pure, that he will not allow of the least corruption in the temple of our hearts, where he seateth himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 160-61.</span></figcaption>

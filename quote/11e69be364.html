<main class="wrap"><figure class="quote" id="q-11e69be364" data-kw="">
<blockquote><p>But if once the government of Christ were set up among us, we know not what would impede it by the sword of God alone [i.e. the Word of God], without any secular violence, to banish out of the land those spirits of error, in all meekness, humility and love, by the force of truth convincing and satisfying the minds of the seduced. Episcopal courts were never fitted for the reclaiming of minds. Their prisons, their fines, their pillories, their nose-slitting, ear-croppings and cheek-burnings did but hold down the flame to break out in season with the greater rage. But the reformed presbytery does proceed in a spiritual method eminently fitted for the gaining of hearts; they go on with the offending party with all respect: they deal with him in all gentleness from weeks to months, from months sometimes to years, before they come near to any censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-305b649448" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, Question 4, ‘There is No Temporal Power Over Kings in Order to their Spiritual Benefit’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2, p. 240</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 4, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843) | question 17, p. 72 lt col top</span></figcaption>

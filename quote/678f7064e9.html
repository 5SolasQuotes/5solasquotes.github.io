<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>

<blockquote><p>One of the best known and most esteemed of John Owen’s works. It is unnecessary to say that he is the prince of divines. to master his works is to be a profound theologian. Owen is said to be prolix, but it would be truer to say that he is condensed. His style is heavy because he gives notes of what he might have said, and passes on without fully developing the great thoughts of his capacious mind. He requires hard study, and none of us ought to grudge it.” – Spurgeon Allen, James – Serious Advice to delivered ones from sickness or any other dangers threatening death, how they ought to carry it that their mercies may be continued, and other misery prevented, or, The healed ones prophulacticon, or healthful diet, delivered in several sermons on John 5:14 (Boston, 1679) Allen (1632-1710) appears to have been a faithful, New England minister. Here are about 15 or so other works of his. Sibbes, Richard – ‘A Rescue from Death, with a Return of Praise’ Works, 6.133-57 on Ps. 107:17 ff. Mather, Cotton – ‘Mens Sana in Corpore Sano. A Discourse upon Recovery from Sickness. Directing how Natural Health, may be Improved into Spiritual: especially by them that have Lately Recovered it’ (Boston, 1698) . 1700’s Wadsworth, Benjamin – ‘Christian Advice to the Sick and Well. In Answer to these Questions: I. What should Christians do, when under bodily sickness? II. How should Christians in health, improve the sickness of others; and how should they carry it towards the sick? III. How should Christians behave themselves, when recovered from sickness? And, None but the Righteous Saved: a Sermon on 1 Cor. 6:9’ Ref (Boston, 1714) Newton, John – Letter 36, ‘To a Gay [Merry] Friend, on his Recovery from Illness’ Works (London, 1808), vol. 1 (of 6), pp. 353-7 . . On Visiting the Sick, especially Church Officers Articles 1500’s Calvin, John – ‘Visitation of the Sick’ in Calvin’s Tracts: containing Treatises on the Sacraments… vol. 2, trans. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.</p></blockquote>

<blockquote><p>In times of public calamity, as a general rule we should stand in our lot, and do and suffer the Lord’s will there. We may indeed flee from pestilence, if we neglect no duty in so doing. This may sometimes be done, especially where a whole community may retire to a healthy spot. Where this cannot be done, let physicians, ministers of the Gospel, public officers and those who may be useful as nurses stand their ground, and commit their case to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Psalms, on Ps. 91</cite></span></figcaption>

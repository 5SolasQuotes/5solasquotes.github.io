<blockquote><p>The Covenant of Grace Identical in both Old and New Testaments Question #1: When was this covenant of grace initiated? Answer: Due to a misunderstanding concerning the nature of the covenant of grace, the Socinians and Arminians, who are in this respect like-minded, claim that it did not exist in the Old Testament. Although they admit that it was announced that a Savior would come at a given time, and that a covenant of grace would be established at a given time, they claim that there was no such covenant during the Old Testament dispensation. They claim that those living in that dispensation were not partakers of this covenant, did not receive any promises concerning eternal salvation, and did not receive eternal life by faith and hope in a future Savior. Instead, they received it by grace, that is, on the basis of their virtuousness. To this we respond that, although the administration of the covenant was very different in both testaments, this covenant, as far as essence is concerned, existed as well in the Old Testament—being initiated with Adam—as presently in the New Testament. Proof #1: This is first of all confirmed by the fact that immediately after the fall this covenant was established in Paradise by way of the promise in Genesis 3:15, “It (the seed of the woman) shall bruise thy head (the serpent).” This Seed of the woman is the Lord Jesus, who without the involvement of a man was born of the Virgin Mary. Such never has been nor ever shall be true for any man. Christ alone, and no one else, has bruised the head of the serpent, that is, the devil. “That through death He might destroy him that had the power of death, that is, the devil” (Heb. 2:14); “For this purpose the Son of God was manifested, that He might destroy the works of the devil” (1 John 3:8). Christ, the Seed of the woman, who would bruise the head of the devil, is promised here, which can be deduced from the threat made to the serpent. This promise was not addressed to Adam and Eve, but only within their hearing. From this it follows that the covenant of grace was not established with Adam and Eve, and in them with all their descendants as was true for the covenant of works. Rather, Adam and Eve, hearing this promise, had to receive the promised Savior for themselves in order to be comforted, as every believer has done subsequent to the giving of this promise, which shall become evident in what follows. Proof #2: The gospel, which is the offer of this covenant, is proclaimed in the Old Testament as well as in the New Testament. “And the Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). He said “in thee,” that is, in thy Seed, which is Christ. “He saith not, And to seeds, as of many; but as of one, And to thy Seed, which is Christ” (Gal. 3:16). Abraham believed this good news, not for the heathen who still would come and believe, but for himself. It was to his personal benefit, it being unto justification, which is an acquittal from guilt and punishment, and a granting of the right unto eternal life. This is confirmed in Genesis 15:6, “And he believed (note: not “the LORD,” but) in the LORD; and he counted it to him for righteousness”; “And the Scripture was fulfilled which saith, Abraham believed God, and it was imputed unto him for righteousness: and he was called the friend of God” (James 2:23). That the gospel was proclaimed to him was not an extraordinary privilege afforded to Abraham alone. The church of the Old Testament had the identical privilege, which is evident from Hebrews 4:2a, “For unto us was the gospel preached, as well as unto them.” It is proclaimed to us in order that we would receive it to our benefit, and thus likewise also to their benefit. The reason why many did not profit from this was not to be attributed to the fact that it was not offered unto them, but due to their not receiving it by faith. “But the Word preached did not profit them, not being mixed with faith in them that heard it” (Heb. 4:2b). Thus, in the Old Testament dispensation Christ was proclaimed and offered in the gospel, and everyone was obligated by means of this gospel to believe in Christ unto justification as Abraham did. The covenant of grace therefore existed in the Old Testament. Observe this also in reference to Moses. “By faith Moses, when he was come to years, refused to be called the son of Pharaoh’s daughter, esteeming the reproach of Christ greater riches than the treasures in Egypt: for he had respect unto the recompense of the reward” (Heb. 11:24, 26). Moses knew Christ, believed in Christ, esteemed Christ as being precious, and had the promises in view through Christ. This chapter enumerates an entire register of Old Testament believers, and the benefits of which they became partakers by faith in Christ. Proof #3: The Surety of the covenant was equally efficacious in the Old Testament as in the New, and thus this covenant existed then as well as now. “Jesus Christ the same yesterday, and to-day, and for ever” (Heb. 13:8). “Today” refers to the present time, “for ever” refers to the future, and “yesterday” refers to the past. The apostle does not merely state that Christ was, is and shall be, but he says that Christ has always been the same; that is, unto reconciliation, comfort, and help. Therefore one ought not to faint under oppression. By “yesterday” we cannot understand the time immediately prior to Paul, that is, the period of Christ’s sojourn upon earth. It is very evident that the apostle exhorts the believers to be steadfast, since Christ at all times—that is, as soon as the church came into existence and as long as the church shall exist—is the same faithful Savior. “Yesterday” therefore refers to the time prior to Christ’s incarnation, which also is confirmed by the statement that Christ has been slain before the foundation of the world. “Whose names are not written in the book of life of the Lamb slain from the foundation of the world” (Rev. 13:8). The words “from the foundation of the world” may not be made to relate to the words “whose names are not written in the book of life.” There is no need to go back to that earlier phrase, and Christ never is said to be slain without any modifying statement. Even if one were to interpret these words as such, namely, “whose names are not written in the book of life of the Lamb before the foundation of the world,” it remains an established fact that there was a book from before the foundation of the world in which the names of believers were written. This is the book of the Lamb, that is, of Christ, and thus Christ’s death is noted as being efficacious at that time, since no one can be written in that book except it be for the efficacy of His death by being slain. It is very simple and clear, however, that one should join the words as the apostle does: “the Lamb, slain from the foundation of the world.” Question: But in what manner has Christ been slain since that time? The apostle appears to contradict this in Hebrews 9:26, where we read, “For then must He often have suffered since the foundation of the world.” Answer: The apostle shows that the death of Christ had to occur but once, and that this one sacrifice was efficacious from the foundation of the world. He thus forcefully confirms that this one death of Christ already was efficacious then, this being such as if He both at that time and since that time had actually suffered. He thus confirms that Christ is the same yesterday and today. Christ was not slain actuality from the foundation of the world, but rather as far as the efficacy of His sacrifice was concerned. From that moment believers believed in Him through the sacrifices, wherein they beheld the death of the Savior to come, and received Him by faith unto justification. This was true of Abel and Enoch, for we read, “By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, for before his translation he had this testimony that he pleased God” (Heb. 11:4–5). Abel sacrificed in faith, Abel pleased God, and Abel was righteous. This expresses irrefutably that Abel saw Christ represented in his sacrifice. Proof #4: Believers in the Old Testament had all the spiritual benefits of the covenant of grace, and thus they, as is true for us in the New Testament, had the covenant itself. (1) God was their God and their Father. “I am the LORD thy God” (Exo. 20:2); “I am thy God” (Isa. 41:10); “But now, O LORD, thou art our Father” (Isa. 64:8); “Wilt thou not from this time cry unto Me, My Father?” (Jer. 3:4). (2) They had the forgiveness of sins. “As for our transgressions, Thou shalt purge them away” (Psa. 65:3); “Thou forgavest the iniquity of my sin. Selah” (Psa. 32:5). (3) They had the spirit of adoption unto children, “to whom pertaineth the adoption” (Rom. 9:4); “We having the same Spirit of faith” (2 Cor. 4:13); “Thy Spirit is good; lead me into the land of uprightness” (Psa. 143:10). (4) They had peace of conscience with God. “Thou hast put gladness in my heart” (Psa. 4:7); “Truly my soul waiteth upon God” (Psa. 62:1). (5) They had childlike communion with God. “When I awake, I am still with Thee” (Psa. 139:18); “But it is good for me to draw near to God” (Psa. 73:28). (6) They were partakers of sanctification. “O how love I Thy law! it is my meditation all the day” (Psa. 119:97). (7) After death they entered eternal bliss, for which they longed. “For he looked for a city which hath foundations. But now they desire a better country, that is, an heavenly” (Heb. 11:10, 16). They were the recipients of this salvation. “But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they” (Acts 15:11). The apostle neither refers here to the heathen, nor does he elevate the salvation of the heathen above the salvation of the Jews, but his reference was to the fathers who could not bear the yoke and nevertheless were saved by faith. From this he affirms that their expectation of salvation was also by faith and not by the works of the ceremonial law. From this he concludes that one must not impose the requirement of circumcision and the keeping of the ceremonial law upon the Gentiles. From all this it is evident that believers under the Old Testament enjoyed the benefits of the covenant of grace, had the covenant itself and were partakers of the same covenant with us, having all eaten the same spiritual meat and having drunk the same spiritual drink (1 Cor. 10:3–4). Therefore the apostle Peter called the Jewish nation, “The children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Objection #1: In the Old Testament believers did not receive the promises, “not having received the promises” (Heb. 11:13). Answer: The promises to which the apostle here refers have reference to the incarnation of Christ, which they saw from afar, believed, and embraced. Objection #2: “For the law made nothing perfect” (Heb. 7:19). Answer: The ceremonial laws to which the apostle refers here lacked efficacy of satisfaction, but did point to Christ. They were a stimulus for a better hope. By faith in a Messiah to come they were perfect in Him (Col. 2:13). Objection #3: In Hebrews 9:8 we read “that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing.” Answer: Christ is the way (John 14:6). Christ consecrated the way to God and to glory through the veil, that is to say, His flesh (cf. Heb. 10:19–20). The text states that as long as the ceremonies were still in effect, Christ had not yet actually paid the ransom, nor merited salvation for His own. When this occurred, however, these ceremonies no longer served a purpose. The apostle does not say that no one entered heaven during that time period, which is something most opposing parties would not dare to deny. Enoch, Elijah, Moses, Abraham, Isaac, and Jacob would rebuke them. Neither does the apostle state that the way to heaven was not known as yet, for whoever possesses faith, hope, and love, also knows the way. He stated rather that Christ Himself—who would accomplish that which the entire tabernacle service could not bring to pass, that is, the salvation of sinners—had not yet come in the flesh. Objection #4: The apostle stated that Christ “hath abolished death, and hath brought life and immortality to light through the gospel” (2 Tim. 1:10). Thus light and life were not present prior to Christ’s incarnation. Answer: The text indeed states that Christ is He who has brought life and immortality to light. It does not mention, however, that Christ did this only subsequent to His incarnation, and not prior to His coming. We have shown above that Christ, who is the same yesterday and today, was thus engaged in the Old Testament, the gospel having been proclaimed also during that time. This text, however, refers to the measure of revelation, and to the revelation of the gospel unto the Gentiles, which, prior to this, had only occurred in Israel. This is confirmed in verse 11, where we read, “Whereunto I am appointed a preacher, and an apostle, and a teacher of the Gentiles.” The apostle states this expressly when he says, “Which in other ages was not made known unto the sons of men, as it is now revealed … that the Gentiles should be fellow heirs.… Unto me, who am less than the least of all saints, is this grace given, that I should preach among the Gentiles the unsearchable riches of Christ” (Eph. 3:5–6, 8). In like manner Acts 16:25–26 is to be understood, where we read, “… according to the revelation of the mystery, which was kept secret since the world began, but now is made manifest, and by the scriptures of the prophets, according to the commandment of the everlasting God, made known to all nations for the obedience of faith.” From this it is evident that there is not a distinction between the Old and the New Testament as far as the way of salvation is concerned, but the distinction is between the Jewish nation, which at that time was the only recipient of revelations, and the Gentiles who now have the very same revelation. Objection #5: Consider the following texts. “And these all, having obtained a good report through faith, received not the promise, God having provided some better thing for us, that they without us should not be made perfect” (Heb. 11:39–40); “Unto whom it was revealed, that not unto themselves, but unto us they did minister the things” (1 Pet. 1:12). It is evident from these texts that they who lived during the Old Testament period did not partake of these benefits. Answer: These texts expressly refer to the incarnation of Christ, it being evident that these promises were not received while these saints lived. They proclaimed that Christ at one time would come, but that they did not expect Him during their time. In this respect they did not minister unto themselves but unto us who live subsequent to the coming of Christ, and may behold and enjoy the fulfillment of that promise. And thus we enjoy better things than they; that is, they are better since the fulfillment of the promise is better than the promise itself. It thus follows that these texts do not refer to the enjoyment of the benefits of the covenant, for they were partakers of this as much as we are (which has already been shown); the apostle pointed to this in the text itself when he stated, “that they without us should not be made perfect.” They thus were made perfect, not by the works of the law, but through Christ, whose coming they had in the promises of which we have the fulfillment. They were therefore not saved on any different basis than we, for we and they are saved by the very same Surety. The New Testament is superior to the Old Testament only as far as administration is concerned.</p></blockquote>

ndment of the everlasting God, made known to all nations for the obedience of faith.” From this it is evident that there is not a distinction between the Old and the New Testament as far as the way of salvation is concerned, but the distinction is between the Jewish nation, which at that time was the only recipient of revelations, and the Gentiles who now have the very same revelation. Objection #5: Consider the following texts. “And these all, having obtained a good report through faith, received not the promise, God having provided some better thing for us, that they without us should not be made perfect” (Heb. 11:39–40); “Unto whom it was revealed, that not unto themselves, but unto us they did minister the things” (1 Pet. 1:12). It is evident from these texts that they who lived during the Old Testament period did not partake of these benefits. Answer: These texts expressly refer to the incarnation of Christ, it being evident that these promises were not received while these saints lived. They proclaimed that Christ at one time would come, but that they did not expect Him during their time. In this respect they did not minister unto themselves but unto us who live subsequent to the coming of Christ, and may behold and enjoy the fulfillment of that promise. And thus we enjoy better things than they; that is, they are better since the fulfillment of the promise is better than the promise itself. It thus follows that these texts do not refer to the enjoyment of the benefits of the covenant, for they were partakers of this as much as we are (which has already been shown); the apostle pointed to this in the text itself when he stated, “that they without us should not be made perfect.” They thus were made perfect, not by the works of the law, but through Christ, whose coming they had in the promises of which we have the fulfillment. They were therefore not saved on any different basis than we, for we and they are saved by the very same Surety. The New Testament is superior to the Old Testament only as far as administration is concerned.”

— Wilhelmus à Brakel, The Christian’s Reasonable Service, ed. Joel R. Beeke, trans. Bartel Elshout, vol. 1 (Grand Rapids, MI: Reformation Heritage Books, 1992), 451–57.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Covenant+of+Grace+Identical+in+both+Old+and+New+Testaments+Question+%231%3A+When+was+this+covenant+of+grace+initiated%3F+Answer%3A+Due+to+a+misunderstanding+concerning+the+nature+of+the+covenant+of+grace%2C+the+Socinians+and+Arminians%2C+who+are+in+this+respect+like-minded%2C+claim+that+it+did+not+exist+in+the+Old+Testament.+Although+they+admit+that+it+was+announced+that+a+Savior+would+come+at+a+given+time%2C+and+that+a+covenant+of+grace+would+be+established+at+a+given+time%2C+they+claim+that+there+was+no+such+covenant+during+the+Old+Testament+dispensation.+They+claim+that+those+living+in+that+dispensation+were+not+partakers+of+this+covenant%2C+did+not+receive+any+promises+concerning+eternal+salvation%2C+and+did+not+receive+eternal+life+by+faith+and+hope+in+a+future+Savior.+Instead%2C+they+received+it+by+grace%2C+that+is%2C+on+the+basis+of+their+virtuousness.+To+this+we+respond+that%2C+although+the+administration+of+the+covenant+was+very+different+in+both+testaments%2C+this+covenant%2C+as+far+as+essence+is+concerned%2C+existed+as+well+in+the+Old+Testament%E2%80%94being+initiated+with+Adam%E2%80%94as+presently+in+the+New+Testament.+Proof+%231%3A+This+is+first+of+all+confirmed+by+the+fact+that+immediately+after+the+fall+this+covenant+was+established+in+Paradise+by+way+of+the+promise+in+Genesis+3%3A15%2C+%E2%80%9CIt+%28the+seed+of+the+woman%29+shall+bruise+thy+head+%28the+serpent%29.%E2%80%9D+This+Seed+of+the+woman+is+the+Lord+Jesus%2C+who+without+the+involvement+of+a+man+was+born+of+the+Virgin+Mary.+Such+never+has+been+nor+ever+shall+be+true+for+any+man.+Christ+alone%2C+and+no+one+else%2C+has+bruised+the+head+of+the+serpent%2C+that+is%2C+the+devil.+%E2%80%9CThat+through+death+He+might+destroy+him+that+had+the+power+of+death%2C+that+is%2C+the+devil%E2%80%9D+%28Heb.+2%3A14%29%3B+%E2%80%9CFor+this+purpose+the+Son+of+God+was+manifested%2C+that+He+might+destroy+the+works+of+the+devil%E2%80%9D+%281+John+3%3A8%29.+Christ%2C+the+Seed+of+the+woman%2C+who+would+bruise+the+head+of+the+devil%2C+is+promised+here%2C+which+can+be+deduced+from+the+threat+made+to+the+serpent.+This+promise+was+not+addressed+to+Adam+and+Eve%2C+but+only+within+their+hearing.+From+this+it+follows+that+the+covenant+of+grace+was+not+established+with+Adam+and+Eve%2C+and+in+them+with+all+their+descendants+as+was+true+for+the+covenant+of+works.+Rather%2C+Adam+and+Eve%2C+hearing+this+promise%2C+had+to+receive+the+promised+Savior+for+themselves+in+order+to+be+comforted%2C+as+every+believer+has+done+subsequent+to+the+giving+of+this+promise%2C+which+shall+become+evident+in+what+follows.+Proof+%232%3A+The+gospel%2C+which+is+the+offer+of+this+covenant%2C+is+proclaimed+in+the+Old+Testament+as+well+as+in+the+New+Testament.+%E2%80%9CAnd+the+Scripture%2C+foreseeing+that+God+would+justify+the+heathen+through+faith%2C+preached+before+the+gospel+unto+Abraham%2C+saying%2C+In+thee+shall+all+nations+be+blessed%E2%80%9D+%28Gal.+3%3A8%29.+He+said+%E2%80%9Cin+thee%2C%E2%80%9D+that+is%2C+in+thy+Seed%2C+which+is+Christ.+%E2%80%9CHe+saith+not%2C+And+to+seeds%2C+as+of+many%3B+but+as+of+one%2C+And+to+thy+Seed%2C+which+is+Christ%E2%80%9D+%28Gal.+3%3A16%29.+Abraham+believed+this+good+news%2C+not+for+the+heathen+who+still+would+come+and+believe%2C+but+for+himself.+It+was+to+his+personal+benefit%2C+it+being+unto+justification%2C+which+is+an+acquittal+from+guilt+and+punishment%2C+and+a+granting+of+the+right+unto+eternal+life.+This+is+confirmed+in+Genesis+15%3A6%2C+%E2%80%9CAnd+he+believed+%28note%3A+not+%E2%80%9Cthe+LORD%2C%E2%80%9D+but%29+in+the+LORD%3B+and+he+counted+it+to+him+for+righteousness%E2%80%9D%3B+%E2%80%9CAnd+the+Scripture+was+fulfilled+which+saith%2C+Abraham+believed+God%2C+and+it+was+imputed+unto+him+for+righteousness%3A+and+he+was+called+the+friend+of+God%E2%80%9D+%28James+2%3A23%29.+That+the+gospel+was+proclaimed+to+him+was+not+an+extraordinary+privilege+afforded+to+Abraham+alone.+The+church+of+the+Old+Testament+had+the+identical+privilege%2C+which+is+evident+from+Hebrews+4%3A2a%2C+%E2%80%9CFor+unto+us+was+the+gospel+preached%2C+as+well+as+unto+them.%E2%80%9D+It+is+proclaimed+to+us+in+order+that+we+would+receive+it+to+our+benefit%2C+and+thus+likewise+also+to+their+benefit.+The+reason+why+many+did+not+profit+from+this+was+not+to+be+attributed+to+the+fact+that+it+was+not+offered+unto+them%2C+but+due+to+their+not+receiving+it+by+faith.+%E2%80%9CBut+the+Word+preached+did+not+profit+them%2C+not+being+mixed+with+faith+in+them+that+heard+it%E2%80%9D+%28Heb.+4%3A2b%29.+Thus%2C+in+the+Old+Testament+dispensation+Christ+was+proclaimed+and+offered+in+the+gospel%2C+and+everyone+was+obligated+by+means+of+this+gospel+to+believe+in+Christ+unto+justification+as+Abraham+did.+The+covenant+of+grace+therefore+existed+in+the+Old+Testament.+Observe+this+also+in+reference+to+Moses.+%E2%80%9CBy+faith+Moses%2C+when+he+was+come+to+years%2C+refused+to+be+called+the+son+of+Pharaoh%E2%80%99s+daughter%2C+esteeming+the+reproach+of+Christ+greater+riches+than+the+treasures+in+Egypt%3A+for+he+had+respect+unto+the+recompense+of+the+reward%E2%80%9D+%28Heb.+11%3A24%2C+26%29.+Moses+knew+Christ%2C+believed+in+Christ%2C+esteemed+Christ+as+being+precious%2C+and+had+the+promises+in+view+through+Christ.+This+chapter+enumerates+an+entire+register+of+Old+Testament+believers%2C+and+the+benefits+of+which+they+became+partakers+by+faith+in+Christ.+Proof+%233%3A+The+Surety+of+the+covenant+was+equally+efficacious+in+the+Old+Testament+as+in+the+New%2C+and+thus+this+covenant+existed+then+as+well+as+now.+%E2%80%9CJesus+Christ+the+same+yesterday%2C+and+to-day%2C+and+for+ever%E2%80%9D+%28Heb.+13%3A8%29.+%E2%80%9CToday%E2%80%9D+refers+to+the+present+time%2C+%E2%80%9Cfor+ever%E2%80%9D+refers+to+the+future%2C+and+%E2%80%9Cyesterday%E2%80%9D+refers+to+the+past.+The+apostle+does+not+merely+state+that+Christ+was%2C+is+and+shall+be%2C+but+he+says+that+Christ+has+always+been+the+same%3B+that+is%2C+unto+reconciliation%2C+comfort%2C+and+help.+Therefore+one+ought+not+to+faint+under+oppression.+By+%E2%80%9Cyesterday%E2%80%9D+we+cannot+understand+the+time+immediately+prior+to+Paul%2C+that+is%2C+the+period+of+Christ%E2%80%99s+sojourn+upon+earth.+It+is+very+evident+that+the+apostle+exhorts+the+believers+to+be+steadfast%2C+since+Christ+at+all+times%E2%80%94that+is%2C+as+soon+as+the+church+came+into+existence+and+as+long+as+the+church+shall+exist%E2%80%94is+the+same+faithful+Savior.+%E2%80%9CYesterday%E2%80%9D+therefore+refers+to+the+time+prior+to+Christ%E2%80%99s+incarnation%2C+which+also+is+confirmed+by+the+statement+that+Christ+has+been+slain+before+the+foundation+of+the+world.+%E2%80%9CWhose+names+are+not+written+in+the+book+of+life+of+the+Lamb+slain+from+the+foundation+of+the+world%E2%80%9D+%28Rev.+13%3A8%29.+The+words+%E2%80%9Cfrom+the+foundation+of+the+world%E2%80%9D+may+not+be+made+to+relate+to+the+words+%E2%80%9Cwhose+names+are+not+written+in+the+book+of+life.%E2%80%9D+There+is+no+need+to+go+back+to+that+earlier+phrase%2C+and+Christ+never+is+said+to+be+slain+without+any+modifying+statement.+Even+if+one+were+to+interpret+these+words+as+such%2C+namely%2C+%E2%80%9Cwhose+names+are+not+written+in+the+book+of+life+of+the+Lamb+before+the+foundation+of+the+world%2C%E2%80%9D+it+remains+an+established+fact+that+there+was+a+book+from+before+the+foundation+of+the+world+in+which+the+names+of+believers+were+written.+This+is+the+book+of+the+Lamb%2C+that+is%2C+of+Christ%2C+and+thus+Christ%E2%80%99s+death+is+noted+as+being+efficacious+at+that+time%2C+since+no+one+can+be+written+in+that+book+except+it+be+for+the+efficacy+of+His+death+by+being+slain.+It+is+very+simple+and+clear%2C+however%2C+that+one+should+join+the+words+as+the+apostle+does%3A+%E2%80%9Cthe+Lamb%2C+slain+from+the+foundation+of+the+world.%E2%80%9D+Question%3A+But+in+what+manner+has+Christ+been+slain+since+that+time%3F+The+apostle+appears+to+contradict+this+in+Hebrews+9%3A26%2C+where+we+read%2C+%E2%80%9CFor+then+must+He+often+have+suffered+since+the+foundation+of+the+world.%E2%80%9D+Answer%3A+The+apostle+shows+that+the+death+of+Christ+had+to+occur+but+once%2C+and+that+this+one+sacrifice+was+efficacious+from+the+foundation+of+the+world.+He+thus+forcefully+confirms+that+this+one+death+of+Christ+already+was+efficacious+then%2C+this+being+such+as+if+He+both+at+that+time+and+since+that+time+had+actually+suffered.+He+thus+confirms+that+Christ+is+the+same+yesterday+and+today.+Christ+was+not+slain+actuality+from+the+foundation+of+the+world%2C+but+rather+as+far+as+the+efficacy+of+His+sacrifice+was+concerned.+From+that+moment+believers+believed+in+Him+through+the+sacrifices%2C+wherein+they+beheld+the+death+of+the+Savior+to+come%2C+and+received+Him+by+faith+unto+justification.+This+was+true+of+Abel+and+Enoch%2C+for+we+read%2C+%E2%80%9CBy+faith+Abel+offered+unto+God+a+more+excellent+sacrifice+than+Cain%2C+by+which+he+obtained+witness+that+he+was+righteous%2C+for+before+his+translation+he+had+this+testimony+that+he+pleased+God%E2%80%9D+%28Heb.+11%3A4%E2%80%935%29.+Abel+sacrificed+in+faith%2C+Abel+pleased+God%2C+and+Abel+was+righteous.+This+expresses+irrefutably+that+Abel+saw+Christ+represented+in+his+sacrifice.+Proof+%234%3A+Believers+in+the+Old+Testament+had+all+the+spiritual+benefits+of+the+covenant+of+grace%2C+and+thus+they%2C+as+is+true+for+us+in+the+New+Testament%2C+had+the+covenant+itself.+%281%29+God+was+their+God+and+their+Father.+%E2%80%9CI+am+the+LORD+thy+God%E2%80%9D+%28Exo.+20%3A2%29%3B+%E2%80%9CI+am+thy+God%E2%80%9D+%28Isa.+41%3A10%29%3B+%E2%80%9CBut+now%2C+O+LORD%2C+thou+art+our+Father%E2%80%9D+%28Isa.+64%3A8%29%3B+%E2%80%9CWilt+thou+not+from+this+time+cry+unto+Me%2C+My+Father%3F%E2%80%9D+%28Jer.+3%3A4%29.+%282%29+They+had+the+forgiveness+of+sins.+%E2%80%9CAs+for+our+transgressions%2C+Thou+shalt+purge+them+away%E2%80%9D+%28Psa.+65%3A3%29%3B+%E2%80%9CThou+forgavest+the+iniquity+of+my+sin.+Selah%E2%80%9D+%28Psa.+32%3A5%29.+%283%29+They+had+the+spirit+of+adoption+unto+children%2C+%E2%80%9Cto+whom+pertaineth+the+adoption%E2%80%9D+%28Rom.+9%3A4%29%3B+%E2%80%9CWe+having+the+same+Spirit+of+faith%E2%80%9D+%282+Cor.+4%3A13%29%3B+%E2%80%9CThy+Spirit+is+good%3B+lead+me+into+the+land+of+uprightness%E2%80%9D+%28Psa.+143%3A10%29.+%284%29+They+had+peace+of+conscience+with+God.+%E2%80%9CThou+hast+put+gladness+in+my+heart%E2%80%9D+%28Psa.+4%3A7%29%3B+%E2%80%9CTruly+my+soul+waiteth+upon+God%E2%80%9D+%28Psa.+62%3A1%29.+%285%29+They+had+childlike+communion+with+God.+%E2%80%9CWhen+I+awake%2C+I+am+still+with+Thee%E2%80%9D+%28Psa.+139%3A18%29%3B+%E2%80%9CBut+it+is+good+for+me+to+draw+near+to+God%E2%80%9D+%28Psa.+73%3A28%29.+%286%29+They+were+partakers+of+sanctification.+%E2%80%9CO+how+love+I+Thy+law%21+it+is+my+meditation+all+the+day%E2%80%9D+%28Psa.+119%3A97%29.+%287%29+After+death+they+entered+eternal+bliss%2C+for+which+they+longed.+%E2%80%9CFor+he+looked+for+a+city+which+hath+foundations.+But+now+they+desire+a+better+country%2C+that+is%2C+an+heavenly%E2%80%9D+%28Heb.+11%3A10%2C+16%29.+They+were+the+recipients+of+this+salvation.+%E2%80%9CBut+we+believe+that+through+the+grace+of+the+Lord+Jesus+Christ+we+shall+be+saved%2C+even+as+they%E2%80%9D+%28Acts+15%3A11%29.+The+apostle+neither+refers+here+to+the+heathen%2C+nor+does+he+elevate+the+salvation+of+the+heathen+above+the+salvation+of+the+Jews%2C+but+his+reference+was+to+the+fathers+who+could+not+bear+the+yoke+and+nevertheless+were+saved+by+faith.+From+this+he+affirms+that+their+expectation+of+salvation+was+also+by+faith+and+not+by+the+works+of+the+ceremonial+law.+From+this+he+concludes+that+one+must+not+impose+the+requirement+of+circumcision+and+the+keeping+of+the+ceremonial+law+upon+the+Gentiles.+From+all+this+it+is+evident+that+believers+under+the+Old+Testament+enjoyed+the+benefits+of+the+covenant+of+grace%2C+had+the+covenant+itself+and+were+partakers+of+the+same+covenant+with+us%2C+having+all+eaten+the+same+spiritual+meat+and+having+drunk+the+same+spiritual+drink+%281+Cor.+10%3A3%E2%80%934%29.+Therefore+the+apostle+Peter+called+the+Jewish+nation%2C+%E2%80%9CThe+children+of+the+prophets%2C+and+of+the+covenant+which+God+made+with+our+fathers%2C+saying+unto+Abraham%2C+And+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed%E2%80%9D+%28Acts+3%3A25%29.+Objection+%231%3A+In+the+Old+Testament+believers+did+not+receive+the+promises%2C+%E2%80%9Cnot+having+received+the+promises%E2%80%9D+%28Heb.+11%3A13%29.+Answer%3A+The+promises+to+which+the+apostle+here+refers+have+reference+to+the+incarnation+of+Christ%2C+which+they+saw+from+afar%2C+believed%2C+and+embraced.+Objection+%232%3A+%E2%80%9CFor+the+law+made+nothing+perfect%E2%80%9D+%28Heb.+7%3A19%29.+Answer%3A+The+ceremonial+laws+to+which+the+apostle+refers+here+lacked+efficacy+of+satisfaction%2C+but+did+point+to+Christ.+They+were+a+stimulus+for+a+better+hope.+By+faith+in+a+Messiah+to+come+they+were+perfect+in+Him+%28Col.+2%3A13%29.+Objection+%233%3A+In+Hebrews+9%3A8+we+read+%E2%80%9Cthat+the+way+into+the+holiest+of+all+was+not+yet+made+manifest%2C+while+as+the+first+tabernacle+was+yet+standing.%E2%80%9D+Answer%3A+Christ+is+the+way+%28John+14%3A6%29.+Christ+consecrated+the+way+to+God+and+to+glory+through+the+veil%2C+that+is+to+say%2C+His+flesh+%28cf.+Heb.+10%3A19%E2%80%9320%29.+The+text+states+that+as+long+as+the+ceremonies+were+still+in+effect%2C+Christ+had+not+yet+actually+paid+the+ransom%2C+nor+merited+salvation+for+His+own.+When+this+occurred%2C+however%2C+these+ceremonies+no+longer+served+a+purpose.+The+apostle+does+not+say+that+no+one+entered+heaven+during+that+time+period%2C+which+is+something+most+opposing+parties+would+not+dare+to+deny.+Enoch%2C+Elijah%2C+Moses%2C+Abraham%2C+Isaac%2C+and+Jacob+would+rebuke+them.+Neither+does+the+apostle+state+that+the+way+to+heaven+was+not+known+as+yet%2C+for+whoever+possesses+faith%2C+hope%2C+and+love%2C+also+knows+the+way.+He+stated+rather+that+Christ+Himself%E2%80%94who+would+accomplish+that+which+the+entire+tabernacle+service+could+not+bring+to+pass%2C+that+is%2C+the+salvation+of+sinners%E2%80%94had+not+yet+come+in+the+flesh.+Objection+%234%3A+The+apostle+stated+that+Christ+%E2%80%9Chath+abolished+death%2C+and+hath+brought+life+and+immortality+to+light+through+the+gospel%E2%80%9D+%282+Tim.+1%3A10%29.+Thus+light+and+life+were+not+present+prior+to+Christ%E2%80%99s+incarnation.+Answer%3A+The+text+indeed+states+that+Christ+is+He+who+has+brought+life+and+immortality+to+light.+It+does+not+mention%2C+however%2C+that+Christ+did+this+only+subsequent+to+His+incarnation%2C+and+not+prior+to+His+coming.+We+have+shown+above+that+Christ%2C+who+is+the+same+yesterday+and+today%2C+was+thus+engaged+in+the+Old+Testament%2C+the+gospel+having+been+proclaimed+also+during+that+time.+This+text%2C+however%2C+refers+to+the+measure+of+revelation%2C+and+to+the+revelation+of+the+gospel+unto+the+Gentiles%2C+which%2C+prior+to+this%2C+had+only+occurred+in+Israel.+This+is+confirmed+in+verse+11%2C+where+we+read%2C+%E2%80%9CWhereunto+I+am+appointed+a+preacher%2C+and+an+apostle%2C+and+a+teacher+of+the+Gentiles.%E2%80%9D+The+apostle+states+this+expressly+when+he+says%2C+%E2%80%9CWhich+in+other+ages+was+not+made+known+unto+the+sons+of+men%2C+as+it+is+now+revealed+%E2%80%A6+that+the+Gentiles+should+be+fellow+heirs.%E2%80%A6+Unto+me%2C+who+am+less+than+the+least+of+all+saints%2C+is+this+grace+given%2C+that+I+should+preach+among+the+Gentiles+the+unsearchable+riches+of+Christ%E2%80%9D+%28Eph.+3%3A5%E2%80%936%2C+8%29.+In+like+manner+Acts+16%3A25%E2%80%9326+is+to+be+understood%2C+where+we+read%2C+%E2%80%9C%E2%80%A6+according+to+the+revelation+of+the+mystery%2C+which+was+kept+secret+since+the+world+began%2C+but+now+is+made+manifest%2C+and+by+the+scriptures+of+the+prophets%2C+according+to+the+commandment+of+the+everlasting+God%2C+made+known+to+all+nations+for+the+obedience+of+faith.%E2%80%9D+From+this+it+is+evident+that+there+is+not+a+distinction+between+the+Old+and+the+New+Testament+as+far+as+the+way+of+salvation+is+concerned%2C+but+the+distinction+is+between+the+Jewish+nation%2C+which+at+that+time+was+the+only+recipient+of+revelations%2C+and+the+Gentiles+who+now+have+the+very+same+revelation.+Objection+%235%3A+Consider+the+following+texts.+%E2%80%9CAnd+these+all%2C+having+obtained+a+good+report+through+faith%2C+received+not+the+promise%2C+God+having+provided+some+better+thing+for+us%2C+that+they+without+us+should+not+be+made+perfect%E2%80%9D+%28Heb.+11%3A39%E2%80%9340%29%3B+%E2%80%9CUnto+whom+it+was+revealed%2C+that+not+unto+themselves%2C+but+unto+us+they+did+minister+the+things%E2%80%9D+%281+Pet.+1%3A12%29.+It+is+evident+from+these+texts+that+they+who+lived+during+the+Old+Testament+period+did+not+partake+of+these+benefits.+Answer%3A+These+texts+expressly+refer+to+the+incarnation+of+Christ%2C+it+being+evident+that+these+promises+were+not+received+while+these+saints+lived.+They+proclaimed+that+Christ+at+one+time+would+come%2C+but+that+they+did+not+expect+Him+during+their+time.+In+this+respect+they+did+not+minister+unto+themselves+but+unto+us+who+live+subsequent+to+the+coming+of+Christ%2C+and+may+behold+and+enjoy+the+fulfillment+of+that+promise.+And+thus+we+enjoy+better+things+than+they%3B+that+is%2C+they+are+better+since+the+fulfillment+of+the+promise+is+better+than+the+promise+itself.+It+thus+follows+that+these+texts+do+not+refer+to+the+enjoyment+of+the+benefits+of+the+covenant%2C+for+they+were+partakers+of+this+as+much+as+we+are+%28which+has+already+been+shown%29%3B+the+apostle+pointed+to+this+in+the+text+itself+when+he+stated%2C+%E2%80%9Cthat+they+without+us+should+not+be+made+perfect.%E2%80%9D+They+thus+were+made+perfect%2C+not+by+the+works+of+the+law%2C+but+through+Christ%2C+whose+coming+they+had+in+the+promises+of+which+we+have+the+fulfillment.+They+were+therefore+not+saved+on+any+different+basis+than+we%2C+for+we+and+they+are+saved+by+the+very+same+Surety.+The+New+Testament+is+superior+to+the+Old+Testament+only+as+far+as+administration+is+concerned.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%E2%80%99s+Reasonable+Service%2C+ed.+Joel+R.+Beeke%2C+trans.+Bartel+Elshout%2C+vol.+1+%28Grand+Rapids%2C+MI%3A+Reformation+Heritage+Books%2C+1992%29%2C+451%E2%80%9357.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ab33e4200.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ab33e4200.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/brakel-the-substance-of-the-covenant-of-grace-is-identical-in-the-old-and-new-testaments/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-016b0f6c72" data-kw="">
<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>

<blockquote><p>2. God’s common providence towards mankind teaches us that God is inclined to mercy and is willing to be reconciled, that he is not implacable… By these things, it plainly appears that God hasn’t utterly forsaken the world of mankind as to any favor or merciful regards. This was the witness which God gave all mankind, and even the heathen, that had direct revelation of his disposition to a reconciliation. Acts 14:16–17, ‘Who in times past suffered all nations to walk in their own ways. Nevertheless He left not Himself without witness, in that He did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.&#x27;</p></blockquote>

<blockquote><p>Christ sets before us a picture of this kind in the character of the publican, who beats on his breast and begs for pardon with a dejected countenance. (Lk. 18:13). Thus also the sons of God throw down their prayers in that spirit of humility which springs from penitence. Then they raise their prayers by faith for when God invites them to Himself, and gives them the witness to his propitious disposition, they raise themselves up and overtop the clouds, yea, even heaven itself.</p></blockquote>

</figure><figure class="quote" id="q-cfae9ab62b" data-kw="">
<blockquote><p>And this is clear by all covenants in the Word of God: even the covenant between God and man is in like manner mutual — “I will be your God, and ye shall be my people.” The covenant is so mutual, that if the people break the covenant, God is loosed from his part of the covenant, Zech. 11:10. The covenant gives to the believer ‘a sort of action of law,’ and jus quoddam, to plead with God in respect of his fidelity to stand to that covenant that binds him by reason of his fidelity, Isa. 43:26; 63:16; Dan. 9:4-5;</p></blockquote>

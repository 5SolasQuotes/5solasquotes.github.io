<main class="wrap"><figure class="quote" id="q-de53499081" data-kw="">
<blockquote><p>In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works. What precedes in the order of administration is called the cause of what follows. For this reason, he sometimes makes eternal life a consequent of works; not because it is to be ascribed to them, but because those whom he has elected he justifies, that he may at length glorify (Rom. 8:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

</figure><figure class="quote" id="q-70e502e80f" data-kw="">
<blockquote><p>Therefore, let them twist the words of James as they may, they will never extract out of them more than the two propositions: That an empty phantom of faith does not justify, and that the believer, not contented with such an imagination, manifests his justification by good works.</p></blockquote>

</figure><figure class="quote" id="q-dfeea49934" data-kw="">

<main class="wrap"><figure class="quote" id="q-41ec8d71fb" data-kw="">
<blockquote><p>Quest. 1. You profess yourselves, to be the genuine successors of our worthy Covenanters; but can you mention any one of these who, in the persecuting period, refused to obey the king as supreme, in things lawful, till he became an absolute tyrant?

Q.2. Doth God require Christians to profess principles, which they must of absolute necessity contradict in practice?

Q.3. Is it not evident, even yourselves being judges, that you cannot reduce to practice a single jot of your political principles, except your refusing to pray for government?

Q.4. Were the precepts delivered by Paul, Rom. xiii. 1-7. of any use to Christians, before Christianity became the established religion in the Roman empire?

Q.5. Do you believe, that Paul, in the passage above quoted, commanded the Christians at Rome to render tribute, custom, fear, honour, to magistracy in the abstract …?

Q.6. Do you believe, that Christ gave the Jews an allowance to kill Caesar, as your Testimony very plainly insinuates, p. 150. line tenth, and downwards?

Q.7. Do you think, that the accusers of Christ spake the truth, as your Testimony insinuates, p. 150. “It is violence done to the text to say, that it contains a command to pay tribute to Caesar; and it would appear from Luke xxiii. 2. that the Jews themselves did not understand it so.” The words in Luke xxiii. 2. are, We found this fellow perverting the nation, and forbidding to give tribute to Caesar. Do you really believe, that Christ forbade to give tribute to Caesar, as his false accusers said he did?

Q.8. Hath not the approven example of saints in Scripture, the force of a Scripture-precept, for directing the practice of Christians? But you have rejected said example, as appears from Mr. [John] Thorburn’s Vindiciæ, p. 104. … That is our duty to civil rulers must not be regulated, by the approven examples of saints in Scripture, but by Scripture precepts. If this be sound doctrine, we must no more go forth by the footsteps of the flock of Christ, nor be followers of Paul, even as he was of Christ. When the Reformed [Presbyterian] Brethren rejected the example of saints in Scripture, I think, they should have excepted the example of the King of saints, who was a servant of rulers.

Q.9. Do you believe, that our blessed Lord, in the days of his humiliation, was subject to the powers, which then were, or to Heathen magistrate? Is not this the name whereby he was called, A servant of rulers, Isa. xlix. 7.

Q.10. Is magistracy an ordinance of God, as the God of nature, and common to all men; or is it an ordinance of Christ as Mediator, and peculiar only to Christians? If magistracy is as much a gospel ordinance, as the preaching of the word, Baptism and the Lord’s Supper, &amp;c. Christians should observe it, however few in number, and wherever they are, tho’ it should be at the peril of their lives. “Teaching them, said Christ to his apostles, to observe all things, whatsoever I have commanded you.”

Q.11. Did not the most part of the kings of Israel, and of Judah, want the good qualifications, which you make absolutely necessary to the office of the magistrate? Did God ever command the people to disown their authority, because they wanted such and such good qualifications?

Q.12. Why do you endeavour to support your political principles, so much by Acts of Parliament, and so little by the word of God? “To the law and to the testimony: if they speak not according to this word, it is because there is no light in them.” Isa. viii. 20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fletcher.html">William Fletcher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture-Loyalist: Containing a Vindication of Obedience to the Present Civil Government, in things Lawful</cite>, (Carlisle: John McCarrell, 1806), pp 78-80.</span></figcaption>

<blockquote><p>For this also was perceived by that wonderful man (St. Paul) when he said to the Corinthians—“Not for that we have dominion over your faith, but are helpers of your joy.” For Christians above all men are not permitted forcibly to correct the failings of those who sin.

Secular judges indeed, when they have captured malefactors under the law, show their authority to be great, and prevent them even against their will from following their own devices: but in our case the wrong-doer must be made better, not by force, but by persuasion.

For neither has authority of this kind for the restraint of sinners been given us by law, nor, if it had been given, should we have any field for the exercise of our power, inasmuch as God rewards those who abstain from evil by their own choice, not of necessity. Consequently much skill is required that our patients may be induced to submit willingly to the treatment prescribed by the physicians, and not only this, but that they may be grateful also for the cure.

For if any one when he is bound becomes restive (which it is in his power to be), he makes the mischief worse; and if he should pay no heed to the words which cut like steel, he inflicts another wound by means of this contempt, and the intention to heal only becomes the occasion of a worse disorder. For it is not possible for any one to cure a man by compulsion against his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Priesthood</cite>, (c. 381-85), 2.3 in Nicene and Post Nicene Fathers 1, 9: 41.</span></figcaption>

<blockquote><p>And thus, that which the master of a christian family may do, that the father of the Common-wealth the King, in his place may do. But the master of a family may and ought to deny, an act of humanity, or hospitality to strangers that are false teachers, who bring another Gospel, 2 John 10. whom he must neither lodge, nor bid God speed: because he brings another Gospel; which he otherwise owes by the law of nature to a Pagan, and a man not known to him, Heb. 13.1, 2. Job 31.32. Gen. 18.1, 2, 3, 4. chap, 19, 1, 2, 3. The proposition is clear upon the ground that David as an head of an house, will cut off all liars, and wicked persons out of his house, as a godly King he will also cut off early from the Church (called the city of God) all wicked doers, Psal. 101. For if every Christian family of New England must refuse lodging to a false teacher, must not the Governor and Judges, who have power to command and regulate acts of hospitality, join their civil authority to forbid any master of an house, to lodge such a pestilent heretic? And what is this but the highest degree of banishment? And if the Christian magistrate who may in law dispose of Inns and lodging of strangers, for the public good, should command any to receive such a man in his house, should he not offer violence to the conscience of the master of the house? And yet if the man were sound in the faith, and should only seem a false teacher to the master of the house, the adversaries would say, the godly ruler may command an act of the law of nature, to lodge a saint, who only upon mistake, and an erroneous conscience is suspected to be an heretic, for they say the Ruler may use his power in duties of the second Table.

3 It appears that the laws of both Kingdoms ordained English or Scottish seminary priests, or Jesuits that come to either Kingdom to seduce men to Romish faith, to be hanged, to have better ground in the word of God, 2 Jo. 10. and which forbids any under pain of death to lodge such the twelfth proposal for peace, that licenceth Jesuits and Priests and so commandeth Protestants to lodge such, if they disturb not the peace of the Kingdom, though they lead millions of souls to hell. For upon this proposal, suppose all England were truly godly, the King might command the just contrary to what the Apostle John exhorts, if he follow the consciences of the new Army.</p></blockquote>

<blockquote><p>There is an art or skill of bearing troubles, if we could learn it, without overmuch troubling of ourselves, as in bearing of a burden there is a way so to poise it that it weigheth not over heavy: if it hangs all on one side, it poises the body down. The greater part of our troubles we pull upon ourselves, by not parting our care so, as to take upon us only the care of duty, and leave the rest to God; and by mingling our passions with our crosses, and like a foolish patient, chewing the pills which we should swallow down.

We dwell too much upon the grief, when we should remove the soul higher. We are nearest neighbours unto ourselves. When we suffer grief, like a canker, to eat into the soul, and like a fire in the bones, to consume the marrow and drink up the spirits, we are accessory to the wrong done both to our bodies and souls: we waste our own candle, and put out our light.</p></blockquote>

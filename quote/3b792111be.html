<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Leviticus</cite>, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>For even if images can be retained [in churches] without offense to God, in which are represented sacred matters and histories, and which are extant throughout holy Scripture, and call to mind for the illiterate the stories of the deeds… Luther in fact, of pious memory, cleansed Churches in those locations by means of the Word of the Lord alone from the beginning, and through this one instrument of the Holy Spirit dragged away all idols from the hearts of his hearers… before he ever removed even the smallest ones from their eyes. For an idol in the world is nothing, as the apostle testifies, 1 Corinthians 8[:4], but instead they reside in the hearts of people… Thus Luther for many years [after the Reformation] wore the monastic hood or habit [clothing]… We experienced the same thing in the Dukedom of Wurttemberg, where in the first year after the light of the Gospel was introduced and lit, and Papal idolatry abrogated, images were removed throughout all the temples before the imagination of their worship was pulled away from the minds of men. This is why it has come about that very many people were so offended by this unseasonable reformation undertaken with a two-edged sword… that neither listened to evangelical assemblies nor approached their sacraments any longer, but rather clung to their Papist idolatry till their final breath, despising the teaching of the Gospel and the true use of the sacraments. This was the fruit of the unseasonable reformation in which everything was destroyed with no regard given to the weak in faith… But there is less danger when pure and genuine doctrine is heard, by which all people are called away from idolatry to the true worship of God in daily meetings, should they be retained, than if they should be abolished rashly and unthoughtfully. Because of this, we think that the magistrate of each place sins less, and takes counsel to the advantage of the salvation of souls far better, if they have endured them longer than if they have unseasonably abrogated them… If in fact they are matters of indifference [adiaphora], as is the consensus between us… Beza: This whole business can best be described as resting on two points, namely, the prudence of pastors and the consideration of circumstances… The custom was observed in certain places that images of this kind were retained for four years after reformation. But I do not want to fight with anyone about these things or reprove the deeds of other people; let us just be on guard against all opportunities for idolatry, as much as possible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’ Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza. | Andreae:, pp. 472-75</span></figcaption>

<blockquote><p>§4. So if a pastor call the assembly at an inconvenient hour, or to an inconvenient place, though it be his sin to do so, yet is it their duty to obey. If in the manner of prayer he (tolerably) miscarry, they may not therefore refuse to join with him. If of two translations of Scripture, or two versions of the Psalms, he use the worser (so it be tolerable), they must obey. §5. Yet if the miscarriage be so great in the ordering even of these circumstances, or in the manner of duties, as shall overthrow the duty itself, and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey the pastors (in those cases) can do; then (as I have before showed) we are not bound to follow him in such a case: But otherwise we are. §6… If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied… §7. And the things in which the pastor is now supposed to err, are not of themselves unlawful, but only by such an accident, as being overweighed by another accident, shall cease to make them unlawful. For instance: If the pastor appoint a more imperfect version of the Psalms to be sung in the Church (as is commonly done in England), the obeying of him in the use of this will not bring so much hurt to the Church as the disobeying on that account would do: For besides the sin of disobedience itself, the Church would be in a confusion if they forsake his conduct that preserves the union; and some will be for this and some for that, and so the worship itself will be overthrown. But if the pastor would command a version so corrupt as would overthrow the duty itself, or be as bad as non-performance, the Church is then to seek redress and not obey him. So if he command a time inconvenient, but tolerable (as to meet at sun rising or sun setting) it were better [to] obey than dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.</p></blockquote>

an dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.”

— Richard Baxter, Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’, pp. 461-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A74.+So+if+a+pastor+call+the+assembly+at+an+inconvenient+hour%2C+or+to+an+inconvenient+place%2C+though+it+be+his+sin+to+do+so%2C+yet+is+it+their+duty+to+obey.+If+in+the+manner+of+prayer+he+%28tolerably%29+miscarry%2C+they+may+not+therefore+refuse+to+join+with+him.+If+of+two+translations+of+Scripture%2C+or+two+versions+of+the+Psalms%2C+he+use+the+worser+%28so+it+be+tolerable%29%2C+they+must+obey.+%C2%A75.+Yet+if+the+miscarriage+be+so+great+in+the+ordering+even+of+these+circumstances%2C+or+in+the+manner+of+duties%2C+as+shall+overthrow+the+duty+itself%2C+and+be+inconsistent+with+the+ends%2C+or+bring+greater+evils+upon+the+Church+than+our+refusing+to+obey+the+pastors+%28in+those+cases%29+can+do%3B+then+%28as+I+have+before+showed%29+we+are+not+bound+to+follow+him+in+such+a+case%3A+But+otherwise+we+are.+%C2%A76%E2%80%A6+If+none+shall+obey+a+magistrate+or+pastor+in+the+works+of+their+own+office%2C+as+long+as+they+think+he+did+them+not+the+best+way%2C+all+government+then+would+be+presently+overthrown%2C+and+obedience+denied%E2%80%A6+%C2%A77.+And+the+things+in+which+the+pastor+is+now+supposed+to+err%2C+are+not+of+themselves+unlawful%2C+but+only+by+such+an+accident%2C+as+being+overweighed+by+another+accident%2C+shall+cease+to+make+them+unlawful.+For+instance%3A+If+the+pastor+appoint+a+more+imperfect+version+of+the+Psalms+to+be+sung+in+the+Church+%28as+is+commonly+done+in+England%29%2C+the+obeying+of+him+in+the+use+of+this+will+not+bring+so+much+hurt+to+the+Church+as+the+disobeying+on+that+account+would+do%3A+For+besides+the+sin+of+disobedience+itself%2C+the+Church+would+be+in+a+confusion+if+they+forsake+his+conduct+that+preserves+the+union%3B+and+some+will+be+for+this+and+some+for+that%2C+and+so+the+worship+itself+will+be+overthrown.+But+if+the+pastor+would+command+a+version+so+corrupt+as+would+overthrow+the+duty+itself%2C+or+be+as+bad+as+non-performance%2C+the+Church+is+then+to+seek+redress+and+not+obey+him.+So+if+he+command+a+time+inconvenient%2C+but+tolerable+%28as+to+meet+at+sun+rising+or+sun+setting%29+it+were+better+%5Bto%5D+obey+than+dissolve+the+Church+%28if+we+cannot+be+otherwise+relieved%29.+But+if+he+appoint+a+time+that%E2%80%99s+intolerably+unfit+%28as+at+midnight%29%2C+I+would+not+obey+%28except+in+such+necessity+as+leaves+%5Bpublic+worship%5D+to+that+time+or+none%29%E2%80%A6+%C2%A79.+If+I+be+bound+to+obey+a+governor+if+he+set+me+to+pick+straws%2C+or+to+hunt+a+feather%2C+it+follows+not+that+he+may+lawfully+command+it.+I+have+heard+many+pleading+for+ceremonies+say+that+if+the+magistrate+commanded+them%2C+and+would+not+otherwise+permit+them+to+preach+the+Gospel%2C+they+would+preach+in+a+fool%E2%80%99s+coat+and+a+fool%E2%80%99s+cap+with+a+feather+rather+than+forbear.+But+I+do+not+think+that+any+of+them+would+justify+that+ruler+that+would+make+such+a+law+that+no+man+should+preach+or+celebrate+the+sacraments+but+in+a+fool%E2%80%99s+coat+and+cap%3A+such+might+expect+to+be+judged+by+Christ%2C+as+the+scorners+of+Him+and+his+ordinances.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+on+Church+Government+%26+Worship+%28London%2C+1659%29+%7C+ch.+12%2C+%E2%80%98It+may+be+very+sinful+to+command+some+ceremonies%2C+when+yet+it+may+be+the+subjects%E2%80%99+duty+to+use+them+when+they+are+commanded%E2%80%99%2C+pp.+461-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb967e823a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b967e823a2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=4.%20So%20if%20a%20pastor%20call,scorners%20of%20Him%20and%20his%20ordinances&amp;text=4.%20So%20if%20a%20pastor%20call%20the%20assembly&amp;text=as%20the%20scorners%20of%20Him%20and%20his%20ordinances" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>

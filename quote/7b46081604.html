<main class="wrap"><figure class="quote" id="q-7b46081604" data-kw="">
<blockquote><p>Yet my soul is so united unto you upon that account, and because of your real concernedness and soul sympathy with all of us in Scotland, who desire to be helped of the Lord, to espouse his quarrel to be only ours, and his concernments to be only ours; I say, so united (though little or nothing I can say as I ought) that I cannot keep silent. … Most reverend Sir, my soul desires, while I live, to praise the Lord, for what great things He hath helped you to do, in so nobly, faithfully, and freely witnessing for his noble cause, and sweet Scotland’s cause.

My soul desires to honour you, because He hath so honoured you; and to love you, because He loves you, and hath caused you to love and own his cause, and receive his truths in love; and also to be afflicted in all the afflictions of his people, and to be such a sympathizer, and a burden-bearer with his poor remnant in this land, as that we may say of you, as Paul of the Hebrews, “Ye have had compassion on us in our bonds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Brackel, 5 Oct. 1682 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh, 1876), iv, 61-62.</cite></span></figcaption>

venanter.wordpress.com/2018/12/15/james-renwick-on-the-sympathy-of-wilhelmus-a-brakel-for-the-suffering-church-of-scotland/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f10d1f2232" data-kw="">
<blockquote><p>Moreover this Assembly entreats and exhortsall for God’s sake, and the glory of his great name, and their own salvation,and for the peace and welfare of the nation; yea, it adjures by all that is desirable or commendable, the whole body of our communion in general, and every faitful soul in particular, to divest themselves of all animosities whatsoever, and to lop off immediately all dissolutions and dissensions, lest they should be the causes of the dissipation of the Churches of God in this kingdom. And all pastors and elders of Churches are enjoined diligently to procure the reunion of the respective members of their flocks, and to lend one another their helping hand to effect so good a work, and mightily to insist upon it in their public sermons, and private exhortations and remonstrances; And in case they should meet with contempt, scorn and reproach in the discharge of this their duty, and that any one, through an obdurate perverseness, should show himself implacable and irreconcilable, this Assembly, according to that authority which the great God gives unto the ministers of his holy Word, denounces to them the dreadful judgments of God, and wishes they may be had in execration” (that is, detestation) “among and by all the faithful; yea, all the censures of the Churchshall be exerted against such refractory persons, and the utmost rigor of our discipline shall be inflicted and executed upon them, lest the good name of God should be blasphemed through our sins, and that we may not contract upon ourselves the guilt of the Church’s desolation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-c722f2b7b9" data-kw="">
<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 77-78</span></figcaption>

</figure><figure class="quote" id="q-432f4c9ea1" data-kw="">
<blockquote><p>There was impurity or corruption in worship in the Church of Corinth; for women taught in the Church: There was corrupt doctrine; many denied the resurrection. In manners she was most corrupt, there being so many fornications, sects, palpable love of the world, etc. Yet the apostle did not command those that were worthily prepared to abstain from the Supper, but, rectifying abuses, he did command everyone to try himself, and so eat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>The papers on the other side blame Mr. Hamilton and his party as discouraging the men, and doing nothing but clamouring against those who were sent to the duke, and such as were for an accommodation; they allege, Mr. Hamilton, and these who were warmest, were soonest out of the field… but [the covenanters] were never able to make their horses face the cannon; and, in the wheeling, or taking up their ground, they fell foul upon some of their own men formed near them, and put them in some disorder: and those nearest them, seeing this, took it to be a flight, and the whole army fell into confusion, and fled; and one who was present there writes to me, Mr Hamilton was among the foremost, “leaving the world to debate whether he acted most like a traitor, coward, or fool.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 107</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1f67a890f6" data-kw="">
<blockquote><p>If Christ be, by the gift of the Father, King of nations, then are nations, then are nations bound by the highest obligations to acknowledge him as their Lord. If nations have been given to Jesus Christ to be ruled by him, then are they bound to assent to the gift, and surrender themselves to him as voluntary subjects. To refuse, is to rebel against the express command, Ps. ii. 12, “kiss ye the Son.” It dishonours the Father; for it is a refusal to serve him in that way in which he has commanded service to be rendered. It dishonours the Son; for it is a rejecting of his just authority. Such conduct involves in it a stubborn refusal to repent and turn from sin (for there is no “repentance toward God” without “faith toward Jesus Christ;”) excludes a nation from any interest in the Covenant protection and favour of God; and subjects it to the infliction of the threatenings denounced against impenitent nations. The wrath of the Lord Jesus Christ will be kindled, and he will inevitably cause that nation to “perish from the way.” He will vindicate his own righteous claims.

Nor can the threatening be evaded by an acknowledgment, however sincere, of allegiance to an absolute God. “No man,” says Christ himself, “cometh to the Father but by me.” Any attempt to honour the Father, while the Son is neglected, is an abomination in his sight. However lightly men may esteem the royal prerogatives of the Messiah, they are not held of little value by him “by whom actions are weighed.” Nothing short of an open acknowledgment of Jesus Christ will meet his claims. This must be rendered under pain of God Almighty’s sore displeasure. “The kingdoms of this world must become” not only “kingdoms of our Lord,” but also “of his Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible magistracy: or Christ’s dominion over the nations: with an examination of the civil institutions of the</cite>, United States (Philadelphia, 1842), pp 46-7.</span></figcaption>

<blockquote><p>Where persons do cherish secret predominant lusts in their hearts and lives, God is not in their thoughts as he ought to be. He may be, he often is, much in the words of such persons, but in their thoughts he is not, he cannot be, in a due manner. And such persons no doubt there are. Ever and anon we hear of one and another whose secret lusts break forth into a discovery. They flatter themselves for a season, but God ofttimes so orders things in his holy providence that their iniquity shall be found out to be hateful. Some hateful lust discovers itself to be predominant in them: one is drunken, another unclean, a third an oppressor.</p></blockquote>

</figure><figure class="quote" id="q-996cdeb453" data-kw="">
<blockquote><p>He [the religious hypocrite] is one that is partial in his goodness; zealous in lesser things, and remiss in greater. As Luther complained of some in his time, and our Saviour in his time, which strain at a gnat, and swallow a Camel. He is one that sweats only in some part, but is cool in all the rest, which is a sign his zeal is distempered.

He is zealous against a Ceremony, a Relique or painted Glass, (not that I plead for these) but in the mean time lives in known sin; Lying, Cozening, Extortion, &amp;c. Just as the High Priests, It is not lawful, say they, to put the money into the Treasury, because it is the price of blood.

They speak like conscientious men. Oh do not defile the treasury! But let me ask the question, Why did they shed that blood it was innocent blood. They will not take the price of blood into the treasury, but they never scruple to take the guilt of blood into their souls. They were zealous for the Temple, but in the mean time murderers of the Son of God. And we have a parallel Scripture to this, Rom. 2. 22. Thou that abhorrest idols, dost thou commit sacrilege?

Who at the first blush would not have taken these for very holy, devout men; they were zealous against idolatry? But see a root of hypocrisy! They were partially good, they hated one sin, but not another; idolatry, but not sacrilege. Though it was an abominable sin, and there was an express Law of God against it, yet these seeming Zealots make no conscience of robbing God of his tithes.

And here as in a Scripture looking-glass, we may see our own faces; have we not many now adays seemingly zealous against Popery? if they see a Cross, though it be in a Coat of Arms, they are much offended, and are in a kind of convulsion: but in the mean time make no conscience of sacrilege, starving out the Ministry, they put out the fire on God’s Altar, shut the doors of his Temple; is not this visible hypocrisy?

There are some it may be will not be heard to swear, it will not stand with their Saintship, that were to call the devil father aloud, but they will defraud and defame, which is a sin they can never satisfy for; take away a man’s name, what amends can you make him? ’tis no better then murder; and if these be Saints, there are as good Saints in hell?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 39-41.</span></figcaption>

</figure><figure class="quote" id="q-ee1a3d3007" data-kw="">
<blockquote><p>A second rule is, that as the matter in which we are zealous, must be good in it self, so it must be known unto us to be of that quality. True zeal must begin where the word begins, and end where it ends: for otherwise it cannot be of faith, which is ever grounded on the word; and whatsoever is not of faith is sin. We must not therefore content our selves with an honest meaning, and hope that we have a good zeal towards God, when we have no warrant for our hope: but must so acquaint our selves with the Scriptures of God, that our zeal may be according to knowledge.

Which rule discovereth the corruptness of their zeal, whether close hypocrites, or weak Christians, who are led on merely by the examples of good men, whom they affect, much to like of, and earnestly to stand for such things, as they perceive them in their practise to observe, and to make conscience of: and if there be but a word spoken against any of the things that they have taken a liking of, they are marvellously stirred with indignation thereat, and grow passionate and vehement against the parties, though they have never so good a meaning in that which they speak:

Yet let them be urged to prove out of the word the necessity of those duties which they so earnestly press, they can say little or nothing to the purpose for them; and so grow many times either to dislike and forsake all if they be hypocrites, or at least to be discouraged, and to be at a stand, if they be weaklings in Christ Jesus. And whence proceed these inconveniences but from this, that they are zealous for things that in themselves, and unto others are good and holy, but not thoroughly discerned of them to be of that nature: the consideration whereof, should make us to sit sure in matters of godliness, not building upon the example of good men, but upon the truth of the good word of God, and then our foundation shall never fail us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 86-87.</span></figcaption>

— Robert Cleaver, A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 86-87.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+second+rule+is%2C+that+as+the+matter+in+which+we+are+zealous%2C+must+be+good+in+it+self%2C+so+it+must+be+known+unto+us+to+be+of+that+quality.+True+zeal+must+begin+where+the+word+begins%2C+and+end+where+it+ends%3A+for+otherwise+it+cannot+be+of+faith%2C+which+is+ever+grounded+on+the+word%3B+and+whatsoever+is+not+of+faith+is+sin.+We+must+not+therefore+content+our+selves+with+an+honest+meaning%2C+and+hope+that+we+have+a+good+zeal+towards+God%2C+when+we+have+no+warrant+for+our+hope%3A+but+must+so+acquaint+our+selves+with+the+Scriptures+of+God%2C+that+our+zeal+may+be+according+to+knowledge.%0A%0AWhich+rule+discovereth+the+corruptness+of+their+zeal%2C+whether+close+hypocrites%2C+or+weak+Christians%2C+who+are+led+on+merely+by+the+examples+of+good+men%2C+whom+they+affect%2C+much+to+like+of%2C+and+earnestly+to+stand+for+such+things%2C+as+they+perceive+them+in+their+practise+to+observe%2C+and+to+make+conscience+of%3A+and+if+there+be+but+a+word+spoken+against+any+of+the+things+that+they+have+taken+a+liking+of%2C+they+are+marvellously+stirred+with+indignation+thereat%2C+and+grow+passionate+and+vehement+against+the+parties%2C+though+they+have+never+so+good+a+meaning+in+that+which+they+speak%3A%0A%0AYet+let+them+be+urged+to+prove+out+of+the+word+the+necessity+of+those+duties+which+they+so+earnestly+press%2C+they+can+say+little+or+nothing+to+the+purpose+for+them%3B+and+so+grow+many+times+either+to+dislike+and+forsake+all+if+they+be+hypocrites%2C+or+at+least+to+be+discouraged%2C+and+to+be+at+a+stand%2C+if+they+be+weaklings+in+Christ+Jesus.+And+whence+proceed+these+inconveniences+but+from+this%2C+that+they+are+zealous+for+things+that+in+themselves%2C+and+unto+others+are+good+and+holy%2C+but+not+thoroughly+discerned+of+them+to+be+of+that+nature%3A+the+consideration+whereof%2C+should+make+us+to+sit+sure+in+matters+of+godliness%2C+not+building+upon+the+example+of+good+men%2C+but+upon+the+truth+of+the+good+word+of+God%2C+and+then+our+foundation+shall+never+fail+us.%E2%80%9D%0A%0A%E2%80%94+Robert+Cleaver%2C+A+Brief+Tract+Concerning+Zeal%2C+wherein+the+properties+of+true+Zeal+are+described%2C+and+the+contrary+discovered%2C+in+John+Dod%2C+Four+godly+and+fruitful+sermons+two+preached+at+Drayton+in+Oxford-shire%2C+at+a+fast%2C+enjoined+by+authority%2C+by+occasion+of+the+pestilence+then+dangerously+dispersed.+Likewise+two+other+sermons+on+the+twelfth+Psalm.+Whereunto+is+annexed+a+brief+tract+of+zeal+%28London%3A+William+Welbie%2C+1611%29%2C+pp+86-87.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee1a3d3007.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee1a3d3007.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/09/29/robert-cleaver-on-zeal-according-to-knowledge/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-7054c58739" data-kw="">
<blockquote><p>…there is, in fact, a wide range of attitudes toward icons that have defied every attempt at schematic classification. Thus, the mere presence of icons is, by itself, never a proof of icon worship: the place of the icon, its character as a relic, the (holy) persons it represents, or even the name it was given, are always points to consider.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/juan-s-codoner.html">Juan S. Codoñer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Melkites &amp; Icon Worship during the Iconoclastic Period’ in Dumbarton Oaks Papers, vol. 67 (2013), pp. 135-87</cite>, pp. 136-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08d8e4b231" data-kw="">
<blockquote><p>Objection: Be it true that crosses were purposely appointed to be adored, yet not so now. The Jews would not admit of the image of Caesar in the Church, yet they abolished it not, but admitted it in their coin… [Rutherford’s] Answer: 1. Though the cross were first framed for no adoration… … 5. We remove not crosses from coinage, no more than the Jews did the image of Caesar. But we agree with them [the Jews], [Richard] Hooker [an Anglican] being judge, in banishing them from the worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty, pp. 89-92 in The Divine Right of Church Government (London, 1646)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-f8be272b62" data-kw="">
<blockquote><p>‘Put off thy shoes from thy feet,’ (said the Lord to Moses) ‘for the place whereon thou standest is holy ground.’ Now what made it holy ground? Was it not the Lord’s presence shadowed in the burning bush?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seven Vials or a Brief &amp; Plain Exposition upon the 15th &amp; 16th Chapters of the Revelation… (London: Jones, 1628), Second Vial</cite>, p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

— Henry Burton, The Seven Vials or a Brief &amp; Plain Exposition upon the 15th &amp; 16th Chapters of the Revelation… (London: Jones, 1628), Second Vial, p. 38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Put+off+thy+shoes+from+thy+feet%2C%E2%80%99+%28said+the+Lord+to+Moses%29+%E2%80%98for+the+place+whereon+thou+standest+is+holy+ground.%E2%80%99+Now+what+made+it+holy+ground%3F+Was+it+not+the+Lord%E2%80%99s+presence+shadowed+in+the+burning+bush%3F%E2%80%9D%0A%0A%E2%80%94+Henry+Burton%2C+The+Seven+Vials+or+a+Brief+%26+Plain+Exposition+upon+the+15th+%26+16th+Chapters+of+the+Revelation%E2%80%A6+%28London%3A+Jones%2C+1628%29%2C+Second+Vial%2C+p.+38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff8be272b62.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f8be272b62.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=Put%20off%20thy%20shoes%20from%20thy,presence%20shadowed%20in%20the%20burning%20bush&amp;text=Put%20off%20thy%20shoes%20from%20thy%20feet%2C%E2%80%99%20%28said&amp;text=the%20Lord%E2%80%99s%20presence%20shadowed%20in%20the%20burning%20bush" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-99dfff926c" data-kw="">
<blockquote><p>Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

</figure><figure class="quote" id="q-1e6551a841" data-kw="">
<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhart-b-ladner.html">Gerhart B. Ladner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Concept of the Image in the Greek Fathers &amp; the Byzantine Iconoclastic Controversy’ in Dumbarton Oaks Papers, vol. 7 (1953), pp. 3-34</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

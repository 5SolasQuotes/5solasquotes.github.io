<main class="wrap"><figure class="quote" id="q-ea782e4a7d" data-kw="">
<blockquote><p>Get good assurance (by a lively faith) that Christ is thine, and then shalt thou be able to die in peace, and in a certain hope to go to heaven when thou art dead. When old Simeon had seen Christ, (whom he had waited for by faith, and longed to see) and was thereby confirmed much in that faith he had in him before; He blessed God and said, (Luke 2. 28, 29, 30.) Lord now lettest thou thy servant depart in peace, for mine eyes have seen thy salvation.

They that have once seen and embraced Christ as he did, spiritually by faith, (I mean) and not corporally only, shall die in peace; and none but they can do so. For, 1. It is Christ only that hath overcome death for us, and taken away the sting of it. When the Apostle had said 1 Cor. 15. 56. that sin is the sting of death. But thanks be to God (saith he, Verse 57.) which giveth us victory through our Lord Jesus Christ.

Death is overcome, so that it cannot hurt the true believer at all; but him that is nor in Christ, it will sting unto death, even unto the second death. 2. We can have no hope to come to heaven but only through him Christ is in you (saith the Apostle, Col. 1. 27.) the hope of glory. There is no hope to come to glory, but only by Christ. Nay, there is no hope to come to glory through him, unless he be in us, unless he dwell in us by a lively faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached in Ashby-Chappell, Oct. 4. 1629</cite>, (London: George Miller, 1633), p. 18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86e5c042d6" data-kw="">
<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith: and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that, having their fruit unto holiness, they may have the end, eternal life.</p></blockquote>

</figure><figure class="quote" id="q-83caa8cda8" data-kw="">
<blockquote><p>He is a holy God, and can love nothing that is altogether unlike Himself. There must always be some similitude and conformity of nature to ground kindness and friendship upon, and to maintain it. … What gross self-flattery is it, to think that God’s loving kindness can be towards you, while you are in love with sin, which he so perfectly hates!

How can the profane swearer, or voluptuous person, or the oppressor and covetous, or the close hypocrite, (worse than any of them,) rest upon the loving kindness of the Lord in the day of troubles? No, surely. But the tenor of His wrath shall be added to all their other calamities; and they shall find it heavier than all the rest. God will not pour this precious oil of gladness, this persuasion of His love, into filthy vessels.

Labour, then, you who as yet never tasted of this love, to know what it means. Forsake and hate that which hitherto has made you strangers to it; for if you obtain this, it shall comfort you when those things cannot, but would rather prove your greatest torment. And you who have received any testimonies of it, entertain it carefully, for it is your best comfort both in your best days and in your worst days too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

020/08/02/robert-leighton-those-in-love-with-sin-can-have-no-assurance-of-gods-love/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope; but an infallible assurance of faith founded upon the divine truth of the promises of salvation, the inward evidence of those graces unto which these promises are made, the testimony of the Spirit of adoption witnessing with our spirits that we are the children of God, which Spirit is the earnest of our inheritance, whereby we are sealed to the day of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.2</span></figcaption>

</figure><figure class="quote" id="q-11ff0d4a49" data-kw="">
<blockquote><p>This infallible assurance does not so belong to the essence of faith, but that a true believer may wait long, and struggle with many difficulties before he be partaker of it; yet being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of means, attain thereunto: and therefore it is the duty of every one to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Spirit, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.3</span></figcaption>

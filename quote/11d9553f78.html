<main class="wrap"><figure class="quote" id="q-11d9553f78" data-kw="">
<blockquote><p>Christ clearly asserts that He did not come ’to abolish the Law’ (Matt. 5:17). Therefore He approves the laws of Moses.” We respond. Christ is speaking about the moral Law, which was not given temporarily but is the eternal wisdom and norm of righteousness in God. Christ did not abolish this but fulfilled it perfectly, and even renews believers for its obedience by giving them His righteousness and Holy Spirit. Furthermore, the circumstances of the text show clearly that Christ is talking here about the moral Law. As far as the forensic laws of Moses are concerned, the apostle asserts (Eph. 2:15) that “Christ voided (καταργήσας) the law of commandments and ordinances,” not to mention the fact that in the same passage (v. 31) Christ disapproves of the certificate of divorce even though the law of Moses allowed it (Matt. 19:8).

Note here that some forensic laws had reference to a part of the ceremonial law and depended on it. For example, whoever had committed an accidental homicide was compelled to keep himself within a city of refuge until the death of the high priest. But because the Levitical priesthood was abrogated through the coming of the Messiah, who is the one and only high priest of the New Testament, it turns out that that forensic law was also abrogated. As a result, the words of Christ cannot refer to the forensic law of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Commonplaces: On the Law of God, on the Ceremonial and Forensic Laws</cite>, trans. Richard J. Dinda, ed. Benjamin T. G. Mayes and Joshua J. Hayes (1613; St Louis MO: Concordia Publishing House, 2015), XVI.3.4. § 41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-9b6f2c952e" data-kw="">
<blockquote><p>With respect to the particular laws by which the Jews were governed, the common sentiment of sound divines, and the best writers on the laws of nations, is, that although the judicial law is not binding as such upon Christian nations, so that they should be bound to regulate all their laws according unto it, yet it demands distinguished attention, and is to be regarded, as a pattern, in those laws which proceeded upon moral grounds. In it there was nothing inconsistent with the principles of equity and religion. God give unto Israel ‘right judgments and true laws, good statutes and commandments.’ All just laws among men are deductions from the moral law, applied to human affairs. But in the judicial law, the conclusions were deduced and applied, not by the fallible and corrupt reason of man (as in ordinary laws) but by unerring wisdom. These respected either the first or second table of the moral law, duties which immediately related to God or man. It is a radical mistake, on this subject, to suppose that the peculiarity of the judicial law did lie solely and properly in its reference to matters of religion, or the first table. It is to be observed also in those laws which related to things civil, or the duties of the second table. There is no more propriety in representing all the judicial laws respecting the first table as peculiar, than there is in representing all those which related to the second table as peculiar. Peculiarities there were in both; but after allowances are made for these, there remain moral grounds for both; and whatever proceeded upon moral grounds in the judicial law, whether it respected things immediately connected with religion, or with justice and civil order, is exemplary, and must be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Difference</cite>, (Edinburgh: George Caw, 1807), pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>The law of God may be divided into ceremonial, judicial, and moral categories. This three-fold division of the law is sometimes called the Lex Triplex. In his commentary on the Westminster Shorter Catechism, Thomas Boston explains how the categories may be distinguished:

There are three sorts of laws we find in the word.

1. The ceremonial law, which was given by Moses. This bound only the Jews, and that to the coming of Christ, by whom it was abrogated, being a shadow of good things that were then to come: a hedge and partition-wall betwixt them and the Gentiles, which is now taken down.

2. The judicial law, which was the civil law of the Jews, given also first by Moses, which their civil concerns were to be regulated, in respect of which the Jewish government was a Theocracy. What a happy people were they under such a government! Yet does it not bind other nations farther than it is of moral equity, being peculiarly adapted to the circumstances of that nation.

3. The moral law, which is the declaration of the will of God to mankind, binding all men to perfect obedience thereto in all the duties of holiness and righteousness. The ceremonial law was given to them as a church in their particular circumstances; the judicial law as a state; but the moral law was given them in common with all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion, with respect to Faith and Practice, upon the plan of the Assembly’s Shorter Catechism; Comprehending a Complete Body of Divinity</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 2: 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

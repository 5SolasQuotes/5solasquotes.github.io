<blockquote><p>Upon all the glory of believers, there is that covering, the defence of the everlasting covenant, that is ordered in all things and sure. There are two covenants, that of grace, made with believers in Christ, and that of redemption, made with Christ himself, which is the foundation of the other; and these two make a strong covering and defence for that beauty and glory, which believers have from Christ: we have a summary of the covenant of redemption, in as far as we are concerned in it, Psa. 89:28, and onwards, there God engages thus, ‘his seed will make to endure forever, and if his children forsake my law, break my statutes, and keep not my commandments, then I will visit their transgressions with the rod, and their iniquity with stripes. Nevertheless, my loving kindness will I not utterly take from him, my covenant will I not break; but his seed shall endure for ever.’

The like account we have of the covenant of grace, Jer. 32:38, and downwards ‘they shall be my people, and I will be their God: And I will give them one heart, and one way, that they may fear me for ever, for the good of them, and of their children after them: And I will make an everlasting covenant with them, that I will not turn away from them, to do them good; but I will put my fear in their hearts, that they shall not depart from me.’ To which add what is in the parallel chapter, Jer. 31: 34, ‘I will forgive their iniquity, and remember their sins no more.’

Here indeed is a glorious covering stretched out over all the glory. Who will rob believers of that which is so well secured to them by that everlasting covenant of grace founded upon that eternal, and no less sure covenant of redemption? Now, that ye may know how sure it is made by this covenant, that they who were upon God’s heart from eternity, shall have Christ, how sure they, who have him once, are made, that they shall not lose him, him who is their glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion Sermons (1770) in Faith and Justification</cite></span></figcaption>

<blockquote><p>The grounds and sources of holy consolation, are especially the following: God in Christ, with all his glorious perfections, as a God of love, grace, and mercy, and as the God and portion of the saints; Christ, in his glorious Person, righteousness, fullness, offices, and relations, or Christ living in them, and living for them; the Holy Spirit, as inhabiting, quickening, sanctifying, and sealing them, and as the earnest of their eternal inheritance; the covenant of grace, as well ordered in all things and sure, according to which, Jehovah, Father, Son, and. Holy Ghost, is their God, and they are his people, his peculiar people; the infinite atonement, the continual intercession, the supreme dominion, the inviolable faithfulness, and the gracious presence, of the Lord Jesus, who is given for a covenant of the people; and the ordinances, doctrines, promises, and offers, of his gospel, with the peremptory commandment, given to sinners in common, to believe on him: these are the leading, and the immediate grounds, upon which, the saints do by faith, build their comfort; and they are, at the same time, the sources, from which, by the exercise of faith, they derive their consolation.

Besides these, their faith and sense of the pardon of their sins, of the acceptance of their persons as righteous, of their adoption, of their sanctification, and of the witnessing of the blessed Spirit, are matter of consolation to them; and so is the lively exercise of all the graces of the Holy Spirit, especially of faith, hope, and love. The comfort of justification, because it is founded upon a righteousness which is perfect, and always the same, is more stable and permanent, than that of sanctification. The great things, which believers have in possession, and the greater, which they have in hope, are the sustenance of their consolation.

The suitableness of those inestimable blessings to their hearts, together with their sense of personal interest in them, affords them unspeakable joy. As to their experiences and evidences of grace, these are, strictly speaking, not grounds, upon which they build their comfort; but they are proofs, of their saving interest in those grounds of consolation, above mentioned, as well as, encouragements to build their comfort upon them; and so, they are matter of consolation to their souls. The most comfortable of the saints; are they who, trusting at all times in the second Adam. as given for a covenant to them, can think of all dispensations, of all conditions, and of all duties, with comfort. They who have the love of Christ displayed in the covenant of grace, most constantly in their view, and most frequently warm on their heart; are of all believers, the most free from perplexing doubts and fears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 19-20.</span></figcaption>

<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>

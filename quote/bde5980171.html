<blockquote><p>XVIII. The cause of infant baptism is not the actual faith of infants, of which they are no more capable than of that instruction by which the disciples of Christ are taught (Mt. 28:19). But it is both the universal command to baptize all the members of the church and the promise of the covenant made to parents and to their children equally (Acts 2:38, 39; Gen. 17*:7). The same thing must be said of the faith of covenanted infants as of their reason. Each is in them in the first act, not in the second; in the sowing, not in the harvest; in the root, not in the fruit; in the internal power of the Spirit, not in the external demonstration of work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.18 (p.419).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-c7037dede4" data-kw="">
<blockquote><p>We have a proof of this in Cornelius the centurion, who, after he had been previously endued with the graces of the Holy Spirit, was baptised for the remission of sins, not seeking a fuller forgiveness from baptism, but a surer exercise of faith; nay, an argument for assurance from a pledge. It will, perhaps, be objected, Why did Ananias say to Paul that he washed away his sins by baptism (Acts 22:16), if sins are not washed away by the power of baptism? I answer, we are said to receive, procure, and obtain, whatever according to the perception of our faith is exhibited to us by the Lord, whether he then attests it for the first time, or gives additional confirmation to what he had previously attested. All then that Ananias meant to say was, Be baptised, Paul, that you may be assured that your sins are forgiven you. In baptism, the Lord promises forgiveness of sins: receive it, and be secure. I have no intention, however, to detract from the power of baptism. I would only add to the sign the substance and reality, inasmuch as God works by external means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.15</span></figcaption>

<blockquote><p>In the next session, S259 TU 16.7.44, the divines debated the proposed words “they are Christians &amp; holy” in relation to infants presented for baptism. A lengthy dispute pertained to what Paul had in mind. Are those baptized holy in reality or are they to be considered holy merely in federal terms, by being in a covenantal relationship with God, which may or may not involve the regenerating presence of the Holy Spirit? Thomas Goodwin claimed that the holiness in view is such that if they die they will be saved. He was uncertain whether they have the holiness of election or regeneration, but he thought they have the Holy Ghost. In short, Goodwin thought that those baptized are to be regarded as really holy, rather than simply federally holy. Lazarus Seaman countered by pointing out that this is to make a different ground for baptism. Goodwin replied by denying that infants are actually saved, but affirming that we are to judge them so. This was too much for Stephen Marshall, who said that Goodwin was wrong: our judgment of charity must not determine whom we admit to the sacrament. We have no warrant to judge that they are saved. It is sufficient that the infants of believing parents are federally holy. Rutherford agreed, pointing out that real and federal holiness are different. The Lord has election and reprobation among infants; if they are in a state of salvation, how can any be lost? To this barrage of opposition, Goodwin insisted that the question is not about the reality (whether or not the infant is regenerate) but “how I am to judge of them. I cannot judge that all are holy &amp; saved, I judge so of this child &amp; that child.” Marshall pointed to a clear mistake in Goodwin’s interpretation and application: the minister is to judge and believe that they are holy with the holiness Paul speaks of, not with any real holiness. While for Goodwin, the holiness in 1 Corinthians 7:14 is the holiness of salvation, Marshall’s rebuttal was that saving holiness infallibly saves. His underlying assumption was that since not all who are baptized will be saved, Paul cannot be referring to saving holiness. Goodwin did not give up. He agreed that an infallible judgment about an infant’s salvation was impossible, but what Paul had in view was a judgment compatible with the promise—an indefinite faith grounded on an indefinite promise. Vines countered Goodwin by denying that the text had anything to do with the judgment of the minister about the child. It applied to each and every child in relation to the parents from whom they proceed. The holiness must be present in each one who comes into the category described in the text. If the infants were really holy, there would be a passing down of such holiness from the parents, and so they would be born regenerate and really holy. Moreover, whatever the kind of holiness intended in the text, it is altogether different from the judgment of the minister. Walker then underlined the distinction between federal and real holiness—many are called holy who are yet wicked and profane. Seaman pointed out that “federall holnesse is the true ground of administration of sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly: Reading Its Theology in Historical Context’ in</cite>, ed. Carl R. Trueman, The Westminster Assembly and the Reformed Faith (Phillipsburg, NJ: P&amp;R Publishing, 2009), pp. 329–331</span></figcaption>

<blockquote><p>Unless they are to be esteemed as members of the Church, they ought not to be baptized. For Baptism is, in its own nature, the seal of an ingrafting already made into Christ, and, consequently, into His Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ad Genes. Exercitationes</cite>, section 88, p. 429 as quoted in Krauth, p. 29</span></figcaption>

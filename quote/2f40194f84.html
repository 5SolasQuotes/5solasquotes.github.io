<main class="wrap"><figure class="quote" id="q-2f40194f84" data-kw="">
<blockquote><p>(3) It [the issue] does not concern children freed and in their majority, who have already gone from under parental power (whom no one doubts to be independent), but especially concerns minors, who are still in every way constituted under parental authority.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen.</cite>, 9:4</span></figcaption>

<blockquote><p>But when we refuse Christ’s comforts, we refuse Himself; she who refuses to accept of a bracelet, or of a gold-ring from him who suits her in marriage, she refuses both his love, and himself, in that she refuses his love-token.</p></blockquote>

</figure><figure class="quote" id="q-83e40f8274" data-kw="">
<blockquote><p>…who denies that the magistrate may command the husband and wife to do a duty to each other, the father not to provoke the son, the son not to disobey the father… the master and servant, the captaine and soldier to do a duty each, one to another? And there is a proper right and liberty, and power [in these relations] immediately given by God, without the king or magistrate’s interposing of their authority: to all these, the king’s authority makes not the man a father, nor the son subject to the father, nor the servant to the master, nor the soldier to the commander. God immediately made those powers, and God in the Law of Nature has given a power to the father over the son without the magistrate; yea, though there had never been a magistrate in the world… …now it no more follows that all fathers are equal to the magistrate, all masters, all captains to the king… for fathers, masters, captains, husbands have immediately from God in the Law of Nature a supreme, a high and independent authority… without any intervention of the will or authority of king or any earthly magistrate, and without any subordination as they are such to the prince. … 3. If the magistrate should usurp over husbands, and masters and fathers, their jus maritale, herile, paterum [right of marriage, being an heir, or a father], and spoil them of husband-power, and masterly and fatherly power, as our adversaries counsel the magistrate to take the spiritual right and power of the keys of the Kingdome of God from the Church and pastors, the former should complain, as do the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government... (London, 1646), ch. 25</cite>, pp. 568-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-3e90e17e47" data-kw="">
<blockquote><p>Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 692</span></figcaption>

<blockquote><p>It is my deliberate conviction, after carefully weighing the whole affair, that Hooper was most likely in the right, and Cranmer and Ridley were most likely in the wrong… I believe, if Cranmer and Ridley had calmly listened to his objections, and seized the opportunity of settling the whole question of” vestments” in a thoroughly Protestant way, it would have been a blessing to the Church of England!</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-230adffc50" data-kw="">
<blockquote><p>Seeing that Christ Jesus is He whom God the Father hath commanded only to be heard and followed of his sheep, we judge it necessary that… all doctrine repugnant to the same, be utterly repressed, as damnable to man’s salvation. …By the contrary doctrine we understand whatsoever men by laws, counsels, or constitutions, have imposed upon the consciences of men, without the expressed commandment of God’s Word, such as be the vows to chastity, forswearing of marriage, binding of men and women to several and disguised apparels…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Head of Doctrine &amp; The Explication of the First Head</cite></span></figcaption>

</figure><figure class="quote" id="q-c47959bd3f" data-kw="">
<blockquote><p>In Scotland it appears to have been the regular custom for ministers to wear a gown when conducting divine service. The cassock also was in frequent use, but this is not surprising since it was not a liturgical vestment, but the usual out-of-doors dress of the ministry. In England, however, the Puritans appear to have discarded the cassock, whilst there is little evidence to show that the early Puritans wore gowns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 46-48 in Ch. 4 of The Worship of the English Puritans (Soli Deo Gloria, 1997), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

— Horton Davies, pp. 46-48 in Ch. 4 of The Worship of the English Puritans (Soli Deo Gloria, 1997), p. 47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Scotland+it+appears+to+have+been+the+regular+custom+for+ministers+to+wear+a+gown+when+conducting+divine+service.+The+cassock+also+was+in+frequent+use%2C+but+this+is+not+surprising+since+it+was+not+a+liturgical+vestment%2C+but+the+usual+out-of-doors+dress+of+the+ministry.+In+England%2C+however%2C+the+Puritans+appear+to+have+discarded+the+cassock%2C+whilst+there+is+little+evidence+to+show+that+the+early+Puritans+wore+gowns.%E2%80%9D%0A%0A%E2%80%94+Horton+Davies%2C+pp.+46-48+in+Ch.+4+of+The+Worship+of+the+English+Puritans+%28Soli+Deo+Gloria%2C+1997%29%2C+p.+47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc47959bd3f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c47959bd3f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=In%20Scotland%20it%20appears%20to%20have,that%20the%20early%20Puritans%20wore%20gowns&amp;text=In%20Scotland%20it%20appears%20to%20have%20been%20the&amp;text=to%20show%20that%20the%20early%20Puritans%20wore%20gowns" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4d2048fb35" data-kw="">
<blockquote><p>§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 9 in Remains (London: Parkhurst, 1684), pp. 219-20</span></figcaption>

</figure><figure class="quote" id="q-8e451e317f" data-kw="">
<blockquote><p>…We are to be distinguished from the common people and others by doctrine, not by garment–by conversation, not by habit [in clothing, etc.]–by the purity of mind, not by attire; for if we study to innovation, we tread under foot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not to lead the minds of the faithful into such things, for they are rather to be instructed than played withal; neither are we to blind and beguile their eyes, but to infuse instructions into their minds.</p></blockquote>

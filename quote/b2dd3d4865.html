<blockquote><p>Therefore, having been persuaded that the Pope is the Antichrist, and since truly it is clear from the words of Scripture that this be so, we must conclude that our secession from his communion is consummately necessary and that it is quite impossible that there be a reconciliation between us, if things so remain as they are.</p></blockquote>

<blockquote><p>If God be Jehovah, the supreme Lord, then it condemns the blasphemous papists, who speak after this manner, &#x27;Our Lord God the Pope.&#x27; Is it a wonder the pope lifts his triple crown above the head of kings and emperors, when he usurps God&#x27;s title, &quot;shewing himself that he is God?&quot; 2 Thess. 2:4.</p></blockquote>

</figure><figure class="quote" id="q-1494d5bc06" data-kw="">
<blockquote><p>Let the weathercocks spin round as much as they please, but we must have fixed points of faith. Unless we have infallibility somewhere, faith is impossible. The true faith teaches us facts which cannot be questioned. Where is faith to build if there be no rock, and nothing left us but shifting sand? As for us, we find infallibility in the Scriptures of the Old and New Testament, and our one desire is to have them opened up to our minds by the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An All Around Ministry</cite>, ch. 10, The Evils of the Present Time, pp. 310–311</span></figcaption>

</figure><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Pope Leo X</cite>, p. 2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4866f1e488" data-kw="">
<blockquote><p>Know therefore (beloved) that David is to be considered two ways, he stands in a two-fold relation, even in this his Coronation: The first is Typical; the second is Political; Typical, and so David is Christ: Political, and so David is intended by God to be the pattern of a good King, the pattern and the Copy that all true Kings should write after; and both these are so plain, I dare say I might give you twenty several places of Scripture for proof of both the branches: First, David was a type of Christ; Christ is ordinarily called David; you will not find any one person (who was a type of Christ) by whose name Christ is expressly called in his kingly office, but only David. I will give them David their King; upon the throne of David he shall sit: so David in the typical relation is Christ.

Then in the political relation, the Lord intended him the pattern of a good king, and therefore you shall find that all the Kings that for four or five hundred years did succeed in Israel and Judah, when the Lord came to give any one their testimony, who they were, how near they came to the Standard, that is the rule by which he judged them; Such an one walked in the way of David; such an one did that which was right in God’s sight as David; such an one did well, but not with such a heart as David; such an one walked not in the ways of David; such an one’s heart was not like unto David’s: so that David was in all intended by God to be the pattern of a good King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sacred Panegyrick, or A Sermon of Thanksgiving, Preaching to the Two Houses of Parliament</cite>, (London: Stephen Bowtell, 1644), pp 8-9.</span></figcaption>

</figure><figure class="quote" id="q-1926b08cf8" data-kw="">
<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 55-56</span></figcaption>

Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-30a54e18ae" data-kw="">
<blockquote><p>Thirdly, add further what the Apostle doth, v. 4. [For he is the Minister of GOD to thee for good,] Is this true of persecuting Nero, in the case of his persecuting? Whereby the Apostle proves he will praise thee, doing that which is good? Surely in an over-ruling Work of GOD’S Grace, the very Devil is GOD’S instrument for GOOD, as to Job, (and we may say Minister too.) And Nero not a whit more in the Act of persecuting. But this far from St. Paul’s meaning: For he means a civil good, praising, and rewarding, and protecting. Nero did (St. Paul knew) quite contrary to this: He cannot then mean him as a Persecutor; and so never intends here to forbid resisting his Persecution.

Fourthly, go on one step further with the Apostle, which will yet make it more plain if more can be; [But if you do that which is evil then fear, for he bears not the Sword in vain, for he is the Minister of GOD, a Revenger to execute wrath on them that do evil) Evil contrary to Christianity is Idolatry, (for one thing,) and to make Christians Idolaters, did Nero and others persecute them, if they would cast in a grain of Incense into the Fire, by way of sacrifice to their Idols, they were freed.

Now is it St. Paul’s meaning, If you turn Idolater then fear, for Nero bears not the Sword in vain, for he is GOD’S Minister, a Revenger to execute Wrath upon them that commit Idolatry? Or is Christianity the evil they were to fear, as that which he used the Sword against, and that with great wrath and revenge? There is then nothing like the Dr’s Interpretation, In all these Arguments of the Apostle: but the clean contrary, besides what follows, v. 5, 6, 7.</p></blockquote>

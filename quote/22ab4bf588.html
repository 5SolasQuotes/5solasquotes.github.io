</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d013782eff" data-kw="">
<blockquote><p>We have examples not to be contemned of the baptism of whole households, and whether infants were there or no, as it is not certain (though probable) so it is not material: The precedent is a houshold; he that follows the precedent must baptize households. It appears not that any wife was there, yet he that follows the precedent in baptizing of households, must baptize wives, and so (I may say) servants, if they be of the household.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Birth-Privilege, or, Covenant-Holiness of Believers &amp; their Issue in the Time of the Gospel, Together with the Right of Infants to Baptism (London, 1644)</cite>, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“We have examples not to be contemned of the baptism of whole households, and whether infants were there or no, as it is not certain (though probable) so it is not material: The precedent is a houshold; he that follows the precedent must baptize households. It appears not that any wife was there, yet he that follows the precedent in baptizing of households, must baptize wives, and so (I may say) servants, if they be of the household.”

</figure><figure class="quote" id="q-85a0b5f475" data-kw="">
<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church</cite>, p. 435 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 435 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLXIV.+On+the+other+hand%2C+if+someone+asks+about+adults+who+foster+and+profess+faith+but+are+not+yet+baptized%2C+who+are+called+catechumens%2C+and+also+about+those+who+have+been+excommunicated+from+the+Church+but+still+retain+faith+and+charity+in+their+hearts%2C+whether+they+are+part+of+the+Church+and+should+be+considered+true+members+of+it%2C+the+Romanist+doctors+simply+deny+it%2C+while+our+%5BReformed%5D+theologians+affirm+it.+However%2C+there+seems+to+be+agreement+in+reality%3B+for+such+individuals%2C+according+to+the+Romanists%2C+pertain%2C+as+they+say%2C+to+the+soul+of+the+Church+and+the+mystical+body+of+Christ+to+be+granted+salvation+by+Him.+Our+theologians+concede+that+such+individuals+are+not%2C+at+least+absolutely+and+perfectly%2C+part+of+the+visible+Church%2C+that+is%2C+they+do+not+pertain+to+the+external+society+of+the+Church%2C+nor+are+they+aggregated+to+any+particular+Church%2C+which+does+not+prejudice+their+salvation+according+to+both+sides.+See+Whitaker%2C+On+the+Church+against+Bellarmine.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+Nature+%26+Definition+of+the+Church%2C+p.+435+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F85a0b5f475.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/85a0b5f475.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/the-baptism-of-the-children-of-adherents/#:~:text=LXIV.%20On%20the%20other%20hand%2C%20if,Whitaker%2C%20On%20the%20Church%20against%20Bellarmine&amp;text=LXIV.%20On%20the%20other%20hand%2C%20if%20someone%20asks&amp;text=sides.%20See%20Whitaker%2C%20On%20the%20Church%20against%20Bellarmine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-509addbbd2" data-kw="">
<blockquote><p>We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them.</p></blockquote>

</figure><figure class="quote" id="q-7516cb2aa2" data-kw="">
<blockquote><p>Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland… (Edinburgh, 1770), bk. 2, Title 4, ‘Of the Lord’s Supper’, section 2</cite>, p. 97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.”

— Walter Steuart of Pardovan, Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland… (Edinburgh, 1770), bk. 2, Title 4, ‘Of the Lord’s Supper’, section 2, p. 97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+who+are+to+be+admitted+to+this+sacrament+must+be+found+to+have+a+competent+knowledge+of+the+fundamentals+of+the+Christian+religion%2C+and+to+be+of+such+an+inoffensive+walk+and+conversation%2C+both+towards+God+and+their+neighbors%2C+that+they+are+not+known+to+be+guilty+of+any+scandal+that+merits+church-censure.+By+the+12th+chapter+of+the+French+Church+Discipline%2C+article+2%2C+persons+shall+not+be+admitted+to+the+Lord%E2%80%99s+Supper+till+they+be+above+twelve+years+of+age.+But+I+am+sure%2C+if+children+at+nine+years+of+age+can+express+themselves+piously+and+knowingly%2C+showing+that+they+have+the+grace+signified+and+promised%2C+the+seal+of+the+promise+cannot+warrantably+be+denied+unto+them.%E2%80%9D%0A%0A%E2%80%94+Walter+Steuart+of+Pardovan%2C+Collections+%26+Observations+Concerning+the+Worship%2C+Discipline+%26+Government+of+the+Church+of+Scotland%E2%80%A6+%28Edinburgh%2C+1770%29%2C+bk.+2%2C+Title+4%2C+%E2%80%98Of+the+Lord%E2%80%99s+Supper%E2%80%99%2C+section+2%2C+p.+97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7516cb2aa2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7516cb2aa2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/paedocommunion/#:~:text=Those%20who%20are%20to%20be%20admitted,cannot%20warrantably%20be%20denied%20unto%20them&amp;text=Those%20who%20are%20to%20be%20admitted%20to%20this&amp;text=the%20promise%20cannot%20warrantably%20be%20denied%20unto%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

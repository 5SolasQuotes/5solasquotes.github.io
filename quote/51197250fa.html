<main class="wrap"><figure class="quote" id="q-51197250fa" data-kw="">
<blockquote><p>Their [the Independents’] second objection is this, say they, the Holy Ghost says expressly that they did meet all ‘at one place’ [Acts 2:1]… and that the whole mutlitude did come ‘together’, as for instance, Acts 2:1, it is said, ‘They were all with one accord in one place’, and in the same chapter, verse 46, ‘They continuing daily with one accord in the Temple, etc.’ And it is also said, Acts 6:2, ‘then the twelve called the multitude of disciples unto them, etc.’ And verse 5, ‘And the saying pleased the whole multitude.’ Now to take off this exception which seems to be the most plausible of their objections: First consider what we spoke from the Scripture of their number, and what thousands were in this Church: and let any reasonable man conceive how it could be possible that all those should meet in one place; and therefore that meeting in one place must be taken in another sense: It’s observed by the learned that the word here turned, ‘meeting together in one place’, epi to auto [Acts 2:1] does not always signify a meeting together in one room, but the agreeing of the affection and judgment in one thing: And for the clearing of this they cite Acts 4:25-26, ‘Why did the heathen rage, and the people imagine vain things? The kings of the earth stood up, and the rulers were gathered together against the Lord, etc.’ Now it is the same word that is there turned, ‘in one place,’ which is here turned, ‘gathered together’, and certainly no place of Scripture will prove that Herod, Pontius Pilate, Jew and Gentile did meet in one place to consult about the death of Christ, but only they agreed in one judgment and hearty affection about it… …[Acts 2] verse 46, ‘They continuing daily with one accord in the Temple.’… it is only mentioned [that] they came to the Temple to hear the Word, but not that they were all of one congregation, partaking of all ordinances in one place; for it is said afterwards, ‘They break bread from house to house’, meaning the sacrament of the Lord’s Supper, which they did partake of from house to house in their particular congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors of Toleration, Erastianism, Independency &amp; Separtation, Delivered in Sermons on 1 Jn. 4:1</cite>, (1652), section 4, pp. 156-58</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db1a5c7268" data-kw="">

<blockquote><p>11. We thought it meet to subjoin the full proof of every word [of our agreed upon articles] from the Scripture, that it might be past controversy with all believers. Concerning the texts cited, I must desire you to observe that every text does not express the very words that we have put down, but all express the sense and sum of the words; so that I think scarce two syllables can be found that are not expressly in the words of Scripture, which contain any matter that is liable to controversy. If you find ten texts cited for one thing, if the words be not in nine of them, it is sufficient if they be in the tenth; and therefore I must intreat you, if you doubt, to peruse them all. And let not the number offend you: If you need them not, they are no trouble to you: Few of them, I think, or none, are impertinent: A consent of many texts may convince more than one single text: at least it will be useful to have so many texts at hand for the convincing any others of any article of the Faith, though you doubt not yourselves. Only the particular application of some parts of the last branch, viz. ‘our consent that such a man shall be our pastor,’ and that ‘we will be members of this or that particular church:’ cannot be proved in terms from Scripture, but by consequence: For who can expect that Scripture should name the persons of our pastors or the places of our habitation?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 21</span></figcaption>

<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wallace-d-kornahrens.html">Wallace D. Kornahrens</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eucharistic Doctrine in Scottish Episcopacy</cite>, 1620-1875 Download (2008) PhD thesis 300 pp. | Abstract:</span></figcaption>

<blockquote><p>There is now no national membership in the Church of Christ, limited to one hereditary family or favored race; but in the fellowship of one faith and one spirit, all, of whatever tribe or tongue or nation, are one with Christ, and one with each other… Earthly and outward causes of separation are overborne and controlled by this higher principle of unity. Separation in race or tongue is no separation to be accounted of among the followers of Christ, who are joined together in that one Spirit. Distance on the earth is no distance to be regarded between those who are partakers together of the same Holy Ghost. Local churches or societies, divided in place and outward worship, become merged in the oneness of a higher fellowship. Separated in the outward act of worship, they are joined in the communion of the same Spirit. The assemblies of Christians in every quarter of the globe, who worship God in sincerity and truth, are one in such a sense as their distance from one another admits of; and they must all be regarded as branches of the universal Church of Christ throughout the world, the great community of believers, separated by distance and kindred and tongue, who cannot meet together in the body, but who really meet together in the Spirit. The invisible Church of Christ on earth is local, but it is also catholic.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-53678b97e2" data-kw="">
<blockquote><p>Now concerning Mr. Cotton, it may be his reputation will seem to be touched in this; but let the indifferent Reader consider what I say in my observation. Both Austin [Augustine] and other great Divines have written freely and largely of Election, but very sparingly of Reprobation; the reason whereof I conceive to be this, There appears more seeming offensive harshness in the doctrine of Reprobation, then in the doctrine of Election. Secondly, I am persuaded, they manifestly perceived, that by stating the doctrine aright in the point of Election, the truth, by just analogy and proportion, did there-hence necessarily follow in the point of Reprobation, to all judicious Divines.

Now Mr. Cotton, as I have heard, is very sound and orthodox in the point of Election; and comes to this work with a gracious intent, to clear the doctrine of Predestination (and that in the special of Reprobation) from such harsh consequences as seem to be derived there-hence; which do very frequently break forth, as I have observed, when the order of God’s decrees is not stated aright: And by experience I have found the manifold odious imputations of strange harshness laid upon God’s proceedings, and represented by the Remonstrants in their Antisynodalia Dordracena, in number 10. as I remember; but they all vanish and come to nothing upon the right ordering of God’s decrees: wherein, if any Divine fail, it may be his failing is only in a point of Logic, provided that he be orthodox in the point of grace; but if he be corrupt in that, then the more corrupt his Logic is, the better it may serve his turn for the countenancing of his erroneous ways in matter of divinity.

Lastly, I have been given to understand by Mr. [Sidrach] Simson, one of the reverend Divines of the Assembly, that Mr. Cotton upon the receiving and perusing this treatise of mine, seemed to be moved therewith not a little; and that in such a way, as not to be provoked thereby, but rather to incline to the receiving of satisfaction! Mr. Cotton is a Divine whom I never saw; but so much I have heard of his piety and parts of learning, that his name shall ever be of reverend remembrance with me. Nevertheless, because this discourse of his, whereunto I address my answer, is in the hands of many, and some of them may be strengthened in their erroneous ways, by this writing of his; and I have heard, that certain Arminians have taken advantage, to justify them in their ways, from some passages in this very discourse of Mr. Cotton’s:

Others, though orthodox, may hereby be misled into error, in such sort, as to corrupt both themselves and their brethren into such opinions (too pleasing unto flesh and blood) as may shake the orthodox doctrine of God’s free grace, in the precious points of Election, Predestination, &amp; Regeneration. This danger I desire to prevent; and upon my knowledge, my labour and pains herein have been taken in very good part, by those who are the very good friends of Mr. Cotton; and some not his good friends only, but great and right well approved of by Mr. Cotton himself; they have deserved no less at his hands. The God of all grace, bring all his into an unity of faith, in the acknowledgement of his grace, which is the only sure way unto glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), epistle unto the reader.</span></figcaption>

</figure><figure class="quote" id="q-7b60dbb716" data-kw="">
<blockquote><p>Those whom God has adopted as sons, he is said to have elected, not in themselves, but in Christ Jesus (Eph. 1:4); because he could love them only in him, and only as being previously made partakers with him, honor them with the inheritance of his kingdom. But if we are elected in him, we cannot find the certainty of our election in ourselves; and not even in God the Father, if we look at him apart from the Son. Christ, then, is the mirror in which we ought, and in which, without deception, we may contemplate our election. For since it is into his body that the Father has decreed to ingraft those whom from eternity he wished to be his, that he may regard as sons all whom he acknowledges to be his members, if we are in communion with Christ, we have proof sufficiently clear and strong that we are written in the Book of Life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.24.5</span></figcaption>
